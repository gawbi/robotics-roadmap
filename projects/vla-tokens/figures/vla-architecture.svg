  <rect x="352" y="196" width="25" height="26" rx="3" fill="#f59e0b"/>
  <text x="364.5" y="213.0" fill="#0b1220" font-size="12" text-anchor="middle">a1</text>
  <rect x="380" y="196" width="25" height="26" rx="3" fill="#f59e0b"/>
  <text x="392.5" y="213.0" fill="#0b1220" font-size="12" text-anchor="middle">a2</text>
  <rect x="408" y="196" width="25" height="26" rx="3" fill="#f59e0b"/>
  <text x="420.5" y="213.0" fill="#0b1220" font-size="12" text-anchor="middle">a3</text>
