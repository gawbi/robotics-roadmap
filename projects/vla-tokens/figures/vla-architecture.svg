  <text x="230.5" y="213.0" fill="#e2e8f0" font-size="13" text-anchor="middle">txt</text>
  <rect x="246" y="196" width="25" height="26" rx="3" fill="#334155"/>
  <text x="258.5" y="213.0" fill="#e2e8f0" font-size="13" text-anchor="middle">txt</text>
  <rect x="274" y="196" width="25" height="26" rx="3" fill="#334155"/>
  <text x="286.5" y="213.0" fill="#e2e8f0" font-size="13" text-anchor="middle">txt</text>
