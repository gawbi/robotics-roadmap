  <text x="96" y="240" fill="#38bdf8" font-size="13" text-anchor="middle">image token</text>
  <text x="257" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">지시문 token</text>
  <text x="445" y="240" fill="#f59e0b" font-size="13" text-anchor="middle">action token 7 개</text>
  <line x1="90" y1="170" x2="90" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="170" x2="257" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="15" y="256" width="530" height="40" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="280" y="281" fill="#e2e8f0" font-size="13" text-anchor="middle">SmolLM2-135M decoder: 앞쪽 token 을 모두 보고 다음 token 하나를 낸다</text>
  <line x1="560" y1="276" x2="560" y2="226" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <polyline points="546,276 560,276" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="568" y="254" fill="#f59e0b" font-size="13">생성</text>
  <text x="300" y="326" fill="#e2e8f0" font-size="13" text-anchor="middle">a₁ … a₇ → ActionTokenizer.decode → (7,) action: 변위 6 + gripper 1 → env.step</text>
</svg>
