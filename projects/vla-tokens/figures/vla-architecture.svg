  <text x="90" y="76" fill="#94a3b8" font-size="13" text-anchor="middle">(3, 256, 256)</text>
  <rect x="15" y="110" width="150" height="58" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="134" fill="#38bdf8" font-size="14" text-anchor="middle">SigLIP</text>
  <text x="90" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">vision encoder 93M</text>
  <line x1="90" y1="90" x2="90" y2="106" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="190" y="30" width="150" height="58" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="265" y="54" fill="#e2e8f0" font-size="14" text-anchor="middle">지시문</text>
  <text x="265" y="76" fill="#94a3b8" font-size="13" text-anchor="middle">"pick up the …"</text>
  <rect x="190" y="110" width="150" height="58" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="265" y="134" fill="#e2e8f0" font-size="14" text-anchor="middle">tokenizer</text>
  <text x="265" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">token id 11 개</text>
  <line x1="265" y1="90" x2="265" y2="106" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="362" y="52" fill="#e2e8f0" font-size="14">RT-2·OpenVLA 방식</text>
  <text x="362" y="76" fill="#94a3b8" font-size="13">action 을 text 처럼</text>
  <text x="362" y="96" fill="#94a3b8" font-size="13">VLM vocab 의 token 으로 낸다</text>
  <text x="362" y="130" fill="#94a3b8" font-size="13">action token 하나 = 한 차원의</text>
  <text x="362" y="150" fill="#94a3b8" font-size="13">bin 하나 (256 개 중 하나)</text>
