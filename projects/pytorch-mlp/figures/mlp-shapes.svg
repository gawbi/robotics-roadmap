<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>784 → 256 → 10 MLP 의 forward. batch B 장의 이미지가 Linear·ReLU·Linear 를 거쳐 logits 가 되고, 정답 y 와 비교해 scalar loss 하나가 된다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="10" y="62" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="75" y="85" fill="#e2e8f0" font-size="15" text-anchor="middle">이미지</text>
  <text x="75" y="106" fill="#38bdf8" font-size="14" text-anchor="middle">(B, 1, 28, 28)</text>
  <line x1="142" y1="90" x2="231" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="187" y="80" fill="#e2e8f0" font-size="14" text-anchor="middle">flatten</text>
  <rect x="235" y="62" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="85" fill="#e2e8f0" font-size="15" text-anchor="middle">x</text>
  <text x="300" y="106" fill="#38bdf8" font-size="14" text-anchor="middle">(B, 784)</text>
  <line x1="367" y1="90" x2="456" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="412" y="80" fill="#e2e8f0" font-size="14" text-anchor="middle">Linear</text>
  <text x="412" y="112" fill="#94a3b8" font-size="13" text-anchor="middle">W (256, 784)</text>
  <text x="412" y="130" fill="#94a3b8" font-size="13" text-anchor="middle">b (256,)</text>
  <rect x="460" y="62" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="525" y="85" fill="#e2e8f0" font-size="15" text-anchor="middle">h</text>
  <text x="525" y="106" fill="#38bdf8" font-size="14" text-anchor="middle">(B, 256)</text>
  <line x1="525" y1="120" x2="525" y2="180" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="538" y="155" fill="#e2e8f0" font-size="14" text-anchor="start">ReLU</text>
  <rect x="460" y="184" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="525" y="207" fill="#e2e8f0" font-size="15" text-anchor="middle">a = relu(h)</text>
  <text x="525" y="228" fill="#38bdf8" font-size="14" text-anchor="middle">(B, 256)</text>
  <line x1="458" y1="212" x2="369" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="412" y="202" fill="#e2e8f0" font-size="14" text-anchor="middle">Linear</text>
  <text x="412" y="234" fill="#94a3b8" font-size="13" text-anchor="middle">W (10, 256)</text>
  <text x="412" y="252" fill="#94a3b8" font-size="13" text-anchor="middle">b (10,)</text>
  <rect x="235" y="184" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="207" fill="#e2e8f0" font-size="15" text-anchor="middle">logits</text>
  <text x="300" y="228" fill="#38bdf8" font-size="14" text-anchor="middle">(B, 10)</text>
  <line x1="233" y1="212" x2="144" y2="212" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="188" y="202" fill="#e2e8f0" font-size="13" text-anchor="middle">cross_entropy</text>
  <rect x="10" y="184" width="130" height="56" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="207" fill="#e2e8f0" font-size="15" text-anchor="middle">L</text>
  <text x="75" y="228" fill="#f59e0b" font-size="14" text-anchor="middle">scalar</text>
  <rect x="133" y="264" width="110" height="52" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="188" y="285" fill="#e2e8f0" font-size="15" text-anchor="middle">정답 y</text>
  <text x="188" y="306" fill="#34d399" font-size="14" text-anchor="middle">(B,) int64</text>
  <line x1="188" y1="263" x2="188" y2="218" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="300" fill="#94a3b8" font-size="13" text-anchor="start">B 는 batch 크기. 이미지 B 장을 한 번에 계산한다</text>
</svg>
