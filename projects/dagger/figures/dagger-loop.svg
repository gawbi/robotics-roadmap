<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>DAgger 의 한 iteration: mixed policy 로 운전하고, 방문한 상태에 expert 라벨을 붙여 dataset 에 합친 뒤 다시 학습한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-acc2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-acc3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30.0" y="30.0" width="250.0" height="92.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="155.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">① mixed policy 로 운전</text>
  <text x="155.0" y="81.0" fill="#94a3b8" font-size="13" text-anchor="middle">확률 β 로 expert 조향,</text>
  <text x="155.0" y="100.0" fill="#94a3b8" font-size="13" text-anchor="middle">나머지는 policy 조향을 실행</text>
  <rect x="320.0" y="30.0" width="250.0" height="92.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">② 방문한 상태 기록</text>
  <text x="445.0" y="81.0" fill="#94a3b8" font-size="13" text-anchor="middle">policy 가 데려간 상태의</text>
  <text x="445.0" y="100.0" fill="#94a3b8" font-size="13" text-anchor="middle">센서 값 o 와 lateral offset</text>
  <rect x="320.0" y="208.0" width="250.0" height="92.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="445.0" y="240.0" fill="#e2e8f0" font-size="14" text-anchor="middle">③ expert 라벨 붙이기</text>
  <text x="445.0" y="259.0" fill="#94a3b8" font-size="13" text-anchor="middle">a = π*(o)</text>
  <text x="445.0" y="278.0" fill="#94a3b8" font-size="13" text-anchor="middle">그 상태에서 expert 가 냈을 조향</text>
  <rect x="30.0" y="208.0" width="250.0" height="92.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="155.0" y="240.0" fill="#e2e8f0" font-size="14" text-anchor="middle">④ 합치고 다시 학습</text>
  <text x="155.0" y="259.0" fill="#94a3b8" font-size="13" text-anchor="middle">D ← D ∪ {(o, a)}</text>
  <text x="155.0" y="278.0" fill="#94a3b8" font-size="13" text-anchor="middle">D 전체로 π̂ᵢ₊₁ 학습</text>
  <line x1="282.0" y1="76.0" x2="316.0" y2="76.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445.0" y1="124.0" x2="445.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="318.0" y1="254.0" x2="284.0" y2="254.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155.0" y1="206.0" x2="155.0" y2="126.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300.0" y="160.0" fill="#94a3b8" font-size="13" text-anchor="middle">iteration i → i + 1</text>
  <text x="300.0" y="178.0" fill="#94a3b8" font-size="13" text-anchor="middle">βᵢ 는 iteration 마다 줄인다</text>
  <text x="30.0" y="338.0" fill="#94a3b8" font-size="13" text-anchor="start">β₁ = 1 이면 첫 iteration 은 expert 만 운전하므로 behavior cloning 과 같다</text>
</svg>
