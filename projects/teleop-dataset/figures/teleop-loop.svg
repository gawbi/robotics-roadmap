<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>teleop 기록 loop: 지금 관측 oₜ 를 읽고, 입력 장치의 명령을 목표 joint position aₜ 로 바꿔 (oₜ, aₜ) 를 한 frame 으로 쌓은 뒤 sim 을 1/fps 초 진행한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-acc2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-acc3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="226.0" y="26.0" width="160.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="306.0" y="47.5" fill="#e2e8f0" font-size="14" text-anchor="middle">입력 장치</text>
  <text x="306.0" y="66.5" fill="#94a3b8" font-size="13" text-anchor="middle">키보드 · gamepad · leader 팔</text>
  <line x1="306.0" y1="80.0" x2="306.0" y2="112.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30.0" y="116.0" width="170.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="115.0" y="134.0" fill="#e2e8f0" font-size="14" text-anchor="middle">SimSO101.observe</text>
  <text x="115.0" y="153.0" fill="#94a3b8" font-size="13" text-anchor="middle">oₜ: state (6,)</text>
  <text x="115.0" y="172.0" fill="#94a3b8" font-size="13" text-anchor="middle">· 카메라 영상 2 개</text>
  <line x1="202.0" y1="148.0" x2="222.0" y2="148.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="226.0" y="116.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="306.0" y="134.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Teleop.get_action</text>
  <text x="306.0" y="153.0" fill="#94a3b8" font-size="13" text-anchor="middle">이동량 → IK 또는</text>
  <text x="306.0" y="172.0" fill="#94a3b8" font-size="13" text-anchor="middle">leader 각도 변환</text>
  <line x1="388.0" y1="148.0" x2="418.0" y2="148.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="422.0" y="116.0" width="148.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="496.0" y="134.0" fill="#e2e8f0" font-size="14" text-anchor="middle">action aₜ</text>
  <text x="496.0" y="153.0" fill="#94a3b8" font-size="13" text-anchor="middle">목표 joint position</text>
  <text x="496.0" y="172.0" fill="#94a3b8" font-size="13" text-anchor="middle">(6,)</text>
  <line x1="496.0" y1="182.0" x2="496.0" y2="214.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="392.0" y="218.0" width="178.0" height="64.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="481.0" y="236.0" fill="#e2e8f0" font-size="14" text-anchor="middle">dataset.add_frame</text>
  <text x="481.0" y="255.0" fill="#94a3b8" font-size="13" text-anchor="middle">(oₜ, aₜ, task) 를</text>
  <text x="481.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="middle">frame 하나로</text>
  <line x1="390.0" y1="250.0" x2="362.0" y2="250.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="160.0" y="218.0" width="198.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="259.0" y="236.0" fill="#e2e8f0" font-size="14" text-anchor="middle">SimSO101.step(aₜ)</text>
  <text x="259.0" y="255.0" fill="#94a3b8" font-size="13" text-anchor="middle">physics 를 정확히</text>
  <text x="259.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="middle">1 / fps 초 진행</text>
  <path d="M158,250 L115,250 L115,184" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="30.0" y="250.0" fill="#94a3b8" font-size="13" text-anchor="start">t ← t + 1</text>
  <text x="30.0" y="316.0" fill="#34d399" font-size="13" text-anchor="start">episode 가 끝나면 save_episode(), 기록을 모두 마치면 finalize() 를 부른다</text>
  <text x="30.0" y="342.0" fill="#94a3b8" font-size="13" text-anchor="start">fps = 30 이면 frame k 의 시각은 tₖ = k / 30 초이고, 10 초짜리 episode 는 300 frame 이다</text>
  <text x="30.0" y="364.0" fill="#94a3b8" font-size="13" text-anchor="start">한 frame 의 observation 은 그 frame 의 action 을 넣기 전의 상태다</text>
</svg>
