<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>LeRobotDataset v3.0 의 폴더 구조: meta 에 schema·통계·task·episode 정보, data 의 Parquet 에 frame 마다 한 행, videos 의 MP4 에 카메라 영상이 들어간다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-acc2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-acc3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="40" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">my_dataset/</text>
  <text x="52" y="62" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">meta/</text>
  <text x="74" y="84" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">info.json</text>
  <text x="330.0" y="84.0" fill="#94a3b8" font-size="13" text-anchor="start">feature 이름·shape·fps·codebase_version</text>
  <text x="74" y="106" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">stats.json</text>
  <text x="330.0" y="106.0" fill="#94a3b8" font-size="13" text-anchor="start">feature 별 평균·표준편차·min·max</text>
  <text x="74" y="128" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tasks.parquet</text>
  <text x="330.0" y="128.0" fill="#94a3b8" font-size="13" text-anchor="start">task 문장 ↔ task_index</text>
  <text x="74" y="150" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">episodes/</text>
  <text x="330.0" y="150.0" fill="#94a3b8" font-size="13" text-anchor="start">episode 별 길이와 data·video 위치</text>
  <text x="52" y="172" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">data/chunk-000/</text>
  <text x="74" y="194" fill="#f59e0b" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">file-000.parquet</text>
  <text x="330.0" y="194.0" fill="#94a3b8" font-size="13" text-anchor="start">frame 마다 한 행 (아래 표)</text>
  <text x="52" y="216" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">videos/</text>
  <text x="74" y="238" fill="#34d399" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">observation.images.front/…/file-000.mp4</text>
  <text x="74" y="260" fill="#34d399" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">observation.images.wrist/…/file-000.mp4</text>
  <text x="30.0" y="288.0" fill="#f59e0b" font-size="13" text-anchor="start">data 의 한 행 = frame 하나 (index·task_index 열은 생략)</text>
  <rect x="30" y="296" width="112" height="26" fill="#111a2e" stroke="#334155"/>
  <text x="86.0" y="314" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">episode_index</text>
  <rect x="142" y="296" width="96" height="26" fill="#111a2e" stroke="#334155"/>
  <text x="190.0" y="314" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">frame_index</text>
  <rect x="238" y="296" width="84" height="26" fill="#111a2e" stroke="#334155"/>
  <text x="280.0" y="314" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">timestamp</text>
  <rect x="322" y="296" width="146" height="26" fill="#111a2e" stroke="#334155"/>
  <text x="395.0" y="314" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">observation.state</text>
  <rect x="468" y="296" width="62" height="26" fill="#111a2e" stroke="#334155"/>
  <text x="499.0" y="314" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">action</text>
  <rect x="30" y="322" width="112" height="26" fill="#0e1628" stroke="#334155"/>
  <text x="86.0" y="340.0" fill="#94a3b8" font-size="13" text-anchor="middle">3</text>
  <rect x="142" y="322" width="96" height="26" fill="#0e1628" stroke="#334155"/>
  <text x="190.0" y="340.0" fill="#94a3b8" font-size="13" text-anchor="middle">57</text>
  <rect x="238" y="322" width="84" height="26" fill="#0e1628" stroke="#334155"/>
  <text x="280.0" y="340.0" fill="#94a3b8" font-size="13" text-anchor="middle">1.900</text>
  <rect x="322" y="322" width="146" height="26" fill="#0e1628" stroke="#334155"/>
  <text x="395.0" y="340.0" fill="#94a3b8" font-size="13" text-anchor="middle">(6,) degree</text>
  <rect x="468" y="322" width="62" height="26" fill="#0e1628" stroke="#334155"/>
  <text x="499.0" y="340.0" fill="#94a3b8" font-size="13" text-anchor="middle">(6,)</text>
  <text x="30.0" y="372.0" fill="#94a3b8" font-size="13" text-anchor="start">timestamp = frame_index / fps (57 / 30 = 1.9 초). 영상은 같은 timestamp 의 MP4 frame 으로 찾는다</text>
</svg>
