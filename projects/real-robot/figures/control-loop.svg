<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>고정 주기 제어 루프. 로봇 observation dict 를 adapter 가 모델 입력으로 바꾸고, ACT 가 낸 action chunk 를 한 tick 에 하나씩 꺼내 send_action 으로 보낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="30" width="170" height="200" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="100" y="56" fill="#38bdf8" font-size="14" text-anchor="middle">get_observation()</text>
  <text x="30" y="82" fill="#e2e8f0" font-size="13">shoulder_pan.pos</text>
  <text x="30" y="99" fill="#e2e8f0" font-size="13">shoulder_lift.pos</text>
  <text x="30" y="116" fill="#e2e8f0" font-size="13">elbow_flex.pos</text>
  <text x="30" y="133" fill="#e2e8f0" font-size="13">wrist_flex.pos</text>
  <text x="30" y="150" fill="#e2e8f0" font-size="13">wrist_roll.pos</text>
  <text x="30" y="167" fill="#e2e8f0" font-size="13">gripper.pos</text>
  <text x="30" y="192" fill="#94a3b8" font-size="13">front (480, 640, 3)</text>
  <text x="30" y="212" fill="#94a3b8" font-size="13">wrist (480, 640, 3)</text>
  <rect x="215" y="30" width="200" height="200" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="315" y="56" fill="#f59e0b" font-size="14" text-anchor="middle">select_action()</text>
  <text x="230" y="82" fill="#94a3b8" font-size="13">queue 가 비었으면</text>
  <text x="230" y="100" fill="#e2e8f0" font-size="13">관절 → (6,) vector</text>
  <text x="230" y="118" fill="#e2e8f0" font-size="13">영상 → (3, H, W) float</text>
  <text x="230" y="136" fill="#e2e8f0" font-size="13">dataset 통계로 정규화</text>
  <text x="230" y="154" fill="#e2e8f0" font-size="13">ACT → chunk (k, 6)</text>
  <text x="230" y="172" fill="#e2e8f0" font-size="13">→ queue 에 넣는다</text>
  <text x="230" y="190" fill="#94a3b8" font-size="13">queue 에서 하나 꺼내</text>
  <text x="230" y="208" fill="#e2e8f0" font-size="13">정규화를 되돌린다</text>
  <rect x="445" y="30" width="140" height="200" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="515" y="56" fill="#34d399" font-size="14" text-anchor="middle">send_action()</text>
  <text x="456" y="82" fill="#e2e8f0" font-size="13">shoulder_pan.pos</text>
  <text x="456" y="99" fill="#e2e8f0" font-size="13">shoulder_lift.pos</text>
  <text x="456" y="116" fill="#e2e8f0" font-size="13">elbow_flex.pos</text>
  <text x="456" y="133" fill="#e2e8f0" font-size="13">wrist_flex.pos</text>
  <text x="456" y="150" fill="#e2e8f0" font-size="13">wrist_roll.pos</text>
  <text x="456" y="167" fill="#e2e8f0" font-size="13">gripper.pos</text>
  <text x="456" y="192" fill="#94a3b8" font-size="13">관절 목표값 6 개</text>
  <line x1="187" y1="130" x2="211" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="417" y1="130" x2="441" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="515,232 515,262 100,262 100,236" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="284" fill="#e2e8f0" font-size="14" text-anchor="middle">1 / fps 마다 반복: 30 fps 면 한 tick 이 33.3 ms</text>
  <text x="300" y="308" fill="#94a3b8" font-size="13" text-anchor="middle">추론이 tick 을 넘기면 그 tick 의 action 이 늦어지고, 늦어지는 자리는 chunk 경계다</text>
  <text x="300" y="330" fill="#94a3b8" font-size="13" text-anchor="middle">dict 의 key 이름과 순서는 dataset 의 feature 이름과 같아야 한다</text>
</svg>
