<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>실물 과제의 흐름. teleop 으로 시연을 기록하고, 같은 dataset 으로 두 ACT 를 학습한 뒤, 고정 주기 제어 루프로 배포해 20 개 배치에서 번갈아 평가한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="30" width="178" height="112" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="104.0" y="56" fill="#38bdf8" font-size="15" text-anchor="middle">1. teleop</text>
  <text x="104.0" y="82" fill="#94a3b8" font-size="13" text-anchor="middle">leader 를 손으로 움직이면</text>
  <text x="104.0" y="104" fill="#e2e8f0" font-size="13" text-anchor="middle">follower 가 같은 관절 값으로</text>
  <text x="104.0" y="126" fill="#e2e8f0" font-size="13" text-anchor="middle">따라간다</text>
  <line x1="195" y1="86.0" x2="207" y2="86.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="211" y="30" width="178" height="112" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="300.0" y="56" fill="#38bdf8" font-size="15" text-anchor="middle">2. record</text>
  <text x="300.0" y="82" fill="#94a3b8" font-size="13" text-anchor="middle">lerobot-record</text>
  <text x="300.0" y="104" fill="#e2e8f0" font-size="13" text-anchor="middle">영상 + 관절 값 + action</text>
  <text x="300.0" y="126" fill="#e2e8f0" font-size="13" text-anchor="middle">→ LeRobotDataset 50 episode</text>
  <line x1="391" y1="86.0" x2="403" y2="86.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="407" y="30" width="178" height="112" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="496.0" y="56" fill="#f59e0b" font-size="15" text-anchor="middle">3. train</text>
  <text x="496.0" y="82" fill="#94a3b8" font-size="13" text-anchor="middle">같은 데이터·같은 step</text>
  <text x="496.0" y="104" fill="#e2e8f0" font-size="13" text-anchor="middle">내 ACT</text>
  <text x="496.0" y="126" fill="#e2e8f0" font-size="13" text-anchor="middle">LeRobot ACT</text>
  <rect x="113" y="180" width="178" height="112" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="202.0" y="206" fill="#34d399" font-size="15" text-anchor="middle">4. deploy</text>
  <text x="202.0" y="232" fill="#e2e8f0" font-size="13" text-anchor="middle">get_observation → adapter</text>
  <text x="202.0" y="254" fill="#e2e8f0" font-size="13" text-anchor="middle">→ ACT → send_action</text>
  <text x="202.0" y="276" fill="#e2e8f0" font-size="13" text-anchor="middle">1 / fps 마다 반복</text>
  <rect x="309" y="180" width="178" height="112" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="398.0" y="206" fill="#34d399" font-size="15" text-anchor="middle">5. evaluate</text>
  <text x="398.0" y="232" fill="#e2e8f0" font-size="13" text-anchor="middle">20 개 배치에서 번갈아 시도</text>
  <text x="398.0" y="254" fill="#e2e8f0" font-size="13" text-anchor="middle">성공률 + Wilson 구간</text>
  <text x="398.0" y="276" fill="#e2e8f0" font-size="13" text-anchor="middle">실패 원인별 영상</text>
  <line x1="293" y1="236.0" x2="305" y2="236.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="496,144 496,162 202,162 202,176" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
