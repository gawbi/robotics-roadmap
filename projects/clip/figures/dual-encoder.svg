<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CLIP 의 두 encoder. 이미지는 ViT 를 거쳐 [CLS] 출력을, 문장은 transformer 를 거쳐 EOT 위치 출력을 512 차원으로 옮기고, 둘 다 길이 1 로 정규화해 내적한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="468" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="160" y="34" fill="#38bdf8" font-size="15" text-anchor="middle">이미지</text>
  <text x="440" y="34" fill="#f59e0b" font-size="15" text-anchor="middle">문장</text>
  <rect x="60.0" y="51.0" width="200" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="71" fill="#e2e8f0" font-size="15" text-anchor="middle">이미지</text>
  <text x="160" y="92" fill="#38bdf8" font-size="14" text-anchor="middle">(3, 224, 224)</text>
  <line x1="160" y1="101" x2="160" y2="128" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="50.0" y="132.0" width="220" height="56" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160" y="155" fill="#e2e8f0" font-size="15" text-anchor="middle">image encoder</text>
  <text x="160" y="176" fill="#38bdf8" font-size="14" text-anchor="middle">ViT-B/32 · 12층 · 폭 768</text>
  <line x1="160" y1="188" x2="160" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="50.0" y="215.0" width="220" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="235" fill="#e2e8f0" font-size="15" text-anchor="middle">[CLS] 출력 → ln_post</text>
  <text x="160" y="256" fill="#38bdf8" font-size="14" text-anchor="middle">(768,)</text>
  <line x1="160" y1="265" x2="160" y2="292" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="172" y="284" fill="#94a3b8" font-size="13" text-anchor="start">× proj (768, 512)</text>
  <rect x="50.0" y="296.0" width="220" height="44" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="160" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">u (512,) → u / ‖u‖</text>
  <rect x="330.0" y="51.0" width="220" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="71" fill="#e2e8f0" font-size="15" text-anchor="middle">"a photo of a cat."</text>
  <text x="440" y="92" fill="#38bdf8" font-size="14" text-anchor="middle">tokenize → (77,) int64</text>
  <line x1="440" y1="101" x2="440" y2="128" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="330.0" y="132.0" width="220" height="56" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="155" fill="#e2e8f0" font-size="15" text-anchor="middle">text encoder</text>
  <text x="440" y="176" fill="#f59e0b" font-size="14" text-anchor="middle">transformer · 12층 · 폭 512</text>
  <line x1="440" y1="188" x2="440" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="330.0" y="215.0" width="220" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="440" y="235" fill="#e2e8f0" font-size="15" text-anchor="middle">EOT 위치 출력 → ln_final</text>
  <text x="440" y="256" fill="#38bdf8" font-size="14" text-anchor="middle">(512,)</text>
  <line x1="440" y1="265" x2="440" y2="292" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="452" y="284" fill="#94a3b8" font-size="13" text-anchor="start">× text_projection</text>
  <rect x="330.0" y="296.0" width="220" height="44" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">v (512,) → v / ‖v‖</text>
  <line x1="160" y1="340" x2="262" y2="392" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="440" y1="340" x2="338" y2="392" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="160.0" y="388.0" width="280" height="52" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="409" fill="#e2e8f0" font-size="15" text-anchor="middle">logit = s · ⟨u, v⟩</text>
  <text x="300" y="430" fill="#34d399" font-size="14" text-anchor="middle">cosine similarity × 학습되는 scale s</text>
</svg>
