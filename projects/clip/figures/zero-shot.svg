<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>zero-shot classifier. class 이름을 template 문장에 넣어 text embedding 을 만들고 평균·정규화해 class 마다 열 하나를 만든다. 이미지 embedding 과 내적한 점수가 가장 큰 class 를 고른다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="35.0" width="200" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="55" fill="#e2e8f0" font-size="15" text-anchor="middle">class 10 개</text>
  <text x="120" y="76" fill="#38bdf8" font-size="14" text-anchor="middle">airplane, …, truck</text>
  <rect x="20.0" y="103.0" width="200" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="123" fill="#e2e8f0" font-size="15" text-anchor="middle">template 18 개</text>
  <text x="120" y="144" fill="#38bdf8" font-size="14" text-anchor="middle">"a photo of a {}." …</text>
  <line x1="220" y1="94" x2="268" y2="94" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="275.0" y="66.0" width="170" height="56" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="89" fill="#e2e8f0" font-size="15" text-anchor="middle">문장 10 × 18 개</text>
  <text x="360" y="110" fill="#f59e0b" font-size="14" text-anchor="middle">→ text encoder → 정규화</text>
  <line x1="445" y1="94" x2="478" y2="94" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="480.0" y="66.0" width="100" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="530" y="89" fill="#e2e8f0" font-size="14" text-anchor="middle">class 별 평균</text>
  <text x="530" y="110" fill="#38bdf8" font-size="13" text-anchor="middle">→ 다시 정규화</text>
  <line x1="530" y1="122" x2="530" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="480.0" y="179.0" width="100" height="50" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="530" y="199" fill="#e2e8f0" font-size="15" text-anchor="middle">W</text>
  <text x="530" y="220" fill="#f59e0b" font-size="14" text-anchor="middle">(512, 10)</text>
  <rect x="20.0" y="211.0" width="200" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="231" fill="#e2e8f0" font-size="15" text-anchor="middle">이미지</text>
  <text x="120" y="252" fill="#38bdf8" font-size="14" text-anchor="middle">→ image encoder</text>
  <line x1="220" y1="236" x2="268" y2="236" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="275.0" y="211.0" width="130" height="50" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="340" y="231" fill="#e2e8f0" font-size="15" text-anchor="middle">u / ‖u‖</text>
  <text x="340" y="252" fill="#38bdf8" font-size="14" text-anchor="middle">(512,)</text>
  <line x1="405" y1="236" x2="476" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="300" y="300" fill="#34d399" font-size="15" text-anchor="middle">점수 = uᵀ W  →  (10,)  →  argmax 가 예측 class</text>
  <text x="300" y="328" fill="#94a3b8" font-size="13" text-anchor="middle">W 의 열 하나가 class 하나의 weight 인 linear classifier 다</text>
</svg>
