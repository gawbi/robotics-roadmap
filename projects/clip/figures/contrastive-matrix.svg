  <text x="300" y="384" fill="#94a3b8" font-size="13" text-anchor="middle">I = 이미지, T = 문장. 칸 (i, j) 는 이미지 i 와 문장 j 의 logit 이고, 초록 칸은 짝이 맞는 쌍이다</text>
