<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>rotation 과 pose 의 표현 방법과, 그 사이를 오가는 이 과제의 함수</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="24" y="34" fill="#94a3b8" font-size="14">SO(3) — so3.py · quat.py</text>

  <!-- row of rotation representations -->
  <rect x="20" y="62" width="140" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="84" fill="#e2e8f0" font-size="15" text-anchor="middle">axis-angle</text>
  <text x="90" y="103" fill="#94a3b8" font-size="13" text-anchor="middle">ω̂θ · 숫자 3개</text>

  <rect x="225" y="62" width="150" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="84" fill="#e2e8f0" font-size="15" text-anchor="middle">rotation matrix</text>
  <text x="300" y="103" fill="#94a3b8" font-size="13" text-anchor="middle">R · 3×3 · 숫자 9개</text>

  <rect x="440" y="62" width="140" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510" y="84" fill="#e2e8f0" font-size="15" text-anchor="middle">unit quaternion</text>
  <text x="510" y="103" fill="#94a3b8" font-size="13" text-anchor="middle">(w, x, y, z) · 숫자 4개</text>

  <line x1="162" y1="80" x2="222" y2="80" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="223" y1="96" x2="164" y2="96" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="192" y="54" fill="#38bdf8" font-size="13" text-anchor="middle">exp_so3</text>
  <text x="192" y="132" fill="#38bdf8" font-size="13" text-anchor="middle">log_so3</text>

  <line x1="377" y1="80" x2="437" y2="80" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="438" y1="96" x2="379" y2="96" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="407" y="54" fill="#f59e0b" font-size="13" text-anchor="middle">quat_from_matrix</text>
  <text x="407" y="132" fill="#f59e0b" font-size="13" text-anchor="middle">matrix_from_quat</text>

  <text x="510" y="160" fill="#f59e0b" font-size="13" text-anchor="middle">quat_mul · slerp</text>
  <text x="510" y="180" fill="#94a3b8" font-size="13" text-anchor="middle">quaternion 의 합성과 보간</text>

  <!-- roll-pitch-yaw -->
  <rect x="20" y="160" width="140" height="50" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="90" y="182" fill="#e2e8f0" font-size="15" text-anchor="middle">roll-pitch-yaw</text>
  <text x="90" y="201" fill="#94a3b8" font-size="13" text-anchor="middle">URDF rpy · 숫자 3개</text>
  <path d="M162,185 L300,185 L300,116" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="231" y="177" fill="#34d399" font-size="13" text-anchor="middle">rpy_to_matrix</text>

  <line x1="20" y1="235" x2="580" y2="235" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24" y="262" fill="#94a3b8" font-size="14">SE(3) — se3.py</text>

  <rect x="20" y="280" width="180" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="110" y="302" fill="#e2e8f0" font-size="15" text-anchor="middle">twist ξ = (ω, v)</text>
  <text x="110" y="321" fill="#94a3b8" font-size="13" text-anchor="middle">숫자 6개</text>

  <rect x="330" y="280" width="250" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="455" y="302" fill="#e2e8f0" font-size="15" text-anchor="middle">homogeneous transform T</text>
  <text x="455" y="321" fill="#94a3b8" font-size="13" text-anchor="middle">4×4 = [R p; 0 1]</text>

  <line x1="202" y1="297" x2="327" y2="297" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="328" y1="313" x2="204" y2="313" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="265" y="290" fill="#38bdf8" font-size="13" text-anchor="middle">exp_se3</text>
  <text x="265" y="332" fill="#38bdf8" font-size="13" text-anchor="middle">log_se3</text>
  <text x="455" y="354" fill="#94a3b8" font-size="13" text-anchor="middle">make_T(R, p) · inv_T(T)</text>
</svg>
