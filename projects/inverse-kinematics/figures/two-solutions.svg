<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>평면 2-link 팔이 같은 목표점에 elbow up 과 elbow down 두 자세로 닿는다</title>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- ground and base -->
  <line x1="60" y1="214" x2="260" y2="214" stroke="#334155" stroke-width="2"/>
  <rect x="134" y="200" width="32" height="14" rx="3" fill="#1e293b" stroke="#475569"/>

  <!-- elbow up: base (150,200) -> (216.8,100.3) -> (330,140) -->
  <line x1="150" y1="200" x2="216.8" y2="100.3" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="216.8" y1="100.3" x2="330" y2="140" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="216.8" cy="100.3" r="7" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- elbow down: base (150,200) -> (263.2,239.7) -> (330,140) -->
  <line x1="150" y1="200" x2="263.2" y2="239.7" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
  <line x1="263.2" y1="239.7" x2="330" y2="140" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
  <circle cx="263.2" cy="239.7" r="7" fill="#0b1220" stroke="#34d399" stroke-width="2.5"/>

  <circle cx="150" cy="200" r="7" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- target -->
  <circle cx="330" cy="140" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <line x1="316" y1="140" x2="344" y2="140" stroke="#f59e0b" stroke-width="2"/>
  <line x1="330" y1="126" x2="330" y2="154" stroke="#f59e0b" stroke-width="2"/>
  <text x="348" y="134" fill="#f59e0b" font-size="14">목표 x_d</text>

  <text x="196" y="84" fill="#38bdf8" font-size="14">elbow up</text>
  <text x="276" y="262" fill="#34d399" font-size="14">elbow down</text>

  <!-- notes -->
  <text x="410" y="70" fill="#e2e8f0" font-size="14">같은 목표, 다른 joint angle</text>
  <text x="410" y="100" fill="#94a3b8" font-size="13">link 두 개짜리 평면 팔에서도</text>
  <text x="410" y="120" fill="#94a3b8" font-size="13">닿을 수 있는 목표에는 보통</text>
  <text x="410" y="140" fill="#94a3b8" font-size="13">해가 두 개 있다</text>
  <text x="410" y="176" fill="#94a3b8" font-size="13">팔이 닿지 않는 거리의</text>
  <text x="410" y="196" fill="#94a3b8" font-size="13">목표에는 해가 없다</text>
</svg>
