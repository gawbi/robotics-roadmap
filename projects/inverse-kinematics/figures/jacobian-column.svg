<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>joint i 하나만 돌 때 end-effector 가 움직이는 속도. 축과 끝점까지의 벡터의 cross product 다</title>
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- circular path of the end-effector around joint i -->
  <path d="M383.6,213 A247.4,247.4 0 0,0 349.8,38.9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="400" y="186" fill="#64748b" font-size="13">joint i 만 돌 때 끝점이 그리는 원</text>

  <!-- link from joint to end-effector -->
  <line x1="140" y1="170" x2="380" y2="110" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="170" x2="372" y2="112" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="236" y="168" fill="#94a3b8" font-size="14">p_e − p_i</text>

  <!-- joint i axis out of the page -->
  <circle cx="140" cy="170" r="11" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="140" cy="170" r="3" fill="#38bdf8"/>
  <text x="98" y="204" fill="#38bdf8" font-size="14">joint i 의 축 ω̂_i</text>
  <text x="98" y="224" fill="#94a3b8" font-size="13">(화면 밖, 위치 p_i)</text>

  <!-- end-effector and its velocity -->
  <circle cx="380" cy="110" r="8" fill="#f59e0b"/>
  <text x="350" y="98" fill="#e2e8f0" font-size="14" text-anchor="end">end-effector p_e</text>
  <line x1="380" y1="110" x2="361" y2="34" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#av)"/>
  <text x="372" y="40" fill="#f59e0b" font-size="14">v = ω̂_i × (p_e − p_i)</text>

  <!-- formula -->
  <line x1="20" y1="244" x2="580" y2="244" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24" y="272" fill="#e2e8f0" font-size="15">Jacobian 의 i 번째 열 = ( ω̂_i × (p_e − p_i) ,  ω̂_i )</text>
  <text x="440" y="272" fill="#94a3b8" font-size="13">선속도 · 각속도</text>
</svg>
