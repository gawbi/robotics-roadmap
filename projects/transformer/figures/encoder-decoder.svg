<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>encoder-decoder Transformer 의 구조와 shape. encoder 출력 memory 를 decoder 의 cross-attention 이 K, V 로 쓴다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="458" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40" y="400" width="220" height="40" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150.0" y="417.0" fill="#38bdf8" font-size="14" text-anchor="middle">src</text>
  <text x="150.0" y="434.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, S) 숫자 + pad</text>
  <rect x="330" y="400" width="230" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445.0" y="417.0" fill="#f59e0b" font-size="14" text-anchor="middle">tgt_in</text>
  <text x="445.0" y="434.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, T) bos + 정답 앞부분</text>
  <line x1="150" y1="400" x2="150" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="400" x2="445" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="336" width="220" height="40" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="150.0" y="353.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Embedding + PE</text>
  <text x="150.0" y="370.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, S, d_model)</text>
  <rect x="330" y="336" width="230" height="40" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="445.0" y="353.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Embedding + PE</text>
  <text x="445.0" y="370.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, T, d_model)</text>
  <line x1="150" y1="336" x2="150" y2="274" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="445" y1="336" x2="445" y2="274" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="28" y="152" width="244" height="136" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="28" y="144" fill="#38bdf8" font-size="13">EncoderLayer × N</text>
  <rect x="40" y="226" width="220" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="150.0" y="246.0" fill="#e2e8f0" font-size="14" text-anchor="middle">self-attention</text>
  <text x="150.0" y="263.0" fill="#94a3b8" font-size="13" text-anchor="middle">padding mask</text>
  <line x1="150" y1="226" x2="150" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="166" width="220" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="150.0" y="186.0" fill="#e2e8f0" font-size="14" text-anchor="middle">FFN</text>
  <text x="150.0" y="203.0" fill="#94a3b8" font-size="13" text-anchor="middle">64 → 256 → 64, token 마다</text>
  <rect x="318" y="92" width="254" height="196" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="318" y="84" fill="#f59e0b" font-size="13">DecoderLayer × N</text>
  <rect x="330" y="226" width="230" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="445.0" y="246.0" fill="#e2e8f0" font-size="14" text-anchor="middle">masked self-attention</text>
  <text x="445.0" y="263.0" fill="#94a3b8" font-size="13" text-anchor="middle">causal + padding mask</text>
  <line x1="445" y1="226" x2="445" y2="212" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="166" width="230" height="46" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="445.0" y="186.0" fill="#e2e8f0" font-size="14" text-anchor="middle">cross-attention</text>
  <text x="445.0" y="203.0" fill="#94a3b8" font-size="13" text-anchor="middle">Q: decoder · K, V: memory</text>
  <line x1="445" y1="166" x2="445" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="106" width="230" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="445.0" y="126.0" fill="#e2e8f0" font-size="14" text-anchor="middle">FFN</text>
  <text x="445.0" y="143.0" fill="#94a3b8" font-size="13" text-anchor="middle">64 → 256 → 64, token 마다</text>
  <path d="M150,166 L150,130 L300,130 L300,189 L328,189" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="122" fill="#34d399" font-size="13">memory (B, S, d_model)</text>
  <line x1="445" y1="90" x2="445" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="26" width="230" height="46" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445.0" y="46.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Linear</text>
  <text x="445.0" y="63.0" fill="#94a3b8" font-size="13" text-anchor="middle">logits (B, T, vocab = 13)</text>
  <text x="40" y="50" fill="#94a3b8" font-size="13">각 sub-layer 는</text>
  <text x="40" y="68" fill="#94a3b8" font-size="13">residual 과 LayerNorm 으로 감싼다</text>
</svg>
