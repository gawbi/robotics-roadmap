<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>nominal 학습은 모든 episode 를 같은 dynamics 에서 돌리고, domain randomization 학습은 reset 마다 질량·마찰·gear·latency 를 새로 뽑는다</title>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="30" y="40" fill="#e2e8f0" font-size="15">nominal</text>
  <g fill="#111a2e" stroke="#94a3b8" stroke-width="1.5">
    <rect x="130" y="22" width="140" height="30" rx="6"/><rect x="290" y="22" width="140" height="30" rx="6"/><rect x="450" y="22" width="125" height="30" rx="6"/>
  </g>
  <g fill="#94a3b8" font-size="13" text-anchor="middle">
    <text x="200" y="42">ep 1 · 모두 ×1.0</text><text x="360" y="42">ep 2 · 모두 ×1.0</text><text x="512" y="42">ep 3 · 모두 ×1.0</text>
  </g>

  <text x="30" y="92" fill="#38bdf8" font-size="15">randomized</text>
  <text x="30" y="112" fill="#94a3b8" font-size="13">reset 마다 ξ 를</text>
  <text x="30" y="130" fill="#94a3b8" font-size="13">새로 뽑는다</text>
  <g fill="#111a2e" stroke="#38bdf8" stroke-width="1.5">
    <rect x="130" y="76" width="140" height="120" rx="8"/><rect x="290" y="76" width="140" height="120" rx="8"/><rect x="450" y="76" width="125" height="120" rx="8"/>
  </g>
  <g fill="#e2e8f0" font-size="13">
    <text x="144" y="98">ep 1</text>
    <text x="144" y="122">질량 ×1.13</text><text x="144" y="142">마찰 ×0.70</text><text x="144" y="162">gear ×0.95</text><text x="144" y="182">latency 1</text>
    <text x="304" y="98">ep 2</text>
    <text x="304" y="122">질량 ×0.86</text><text x="304" y="142">마찰 ×1.18</text><text x="304" y="162">gear ×1.04</text><text x="304" y="182">latency 0</text>
    <text x="464" y="98">ep 3</text>
    <text x="464" y="122">질량 ×1.02</text><text x="464" y="142">마찰 ×0.55</text><text x="464" y="162">gear ×0.91</text><text x="464" y="182">latency 2</text>
  </g>

  <text x="30" y="232" fill="#e2e8f0" font-size="13">DRRange 기본값: 질량 0.8–1.2, 마찰 0.5–1.25, gear 0.9–1.1 배</text>
  <text x="30" y="254" fill="#94a3b8" font-size="13">배율은 늘 저장해 둔 nominal 값에 곱한다. 예: torso 질량 0.327 × 1.13 = 0.370</text>
  <text x="30" y="276" fill="#94a3b8" font-size="13">latency 1 step = 0.05 s (Ant-v5 의 control 주기)</text>
</svg>
