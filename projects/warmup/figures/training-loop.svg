<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>학습 loop: 예측 → loss → gradient → update 를 loss 가 충분히 작아질 때까지 되풀이한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- 1. predict -->
  <rect x="40" y="36" width="220" height="76" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="64" fill="#38bdf8" font-size="15" text-anchor="middle">1. 예측</text>
  <text x="150" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">ŷ = w x + b</text>

  <!-- 2. loss -->
  <rect x="340" y="36" width="220" height="76" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="64" fill="#f59e0b" font-size="15" text-anchor="middle">2. loss</text>
  <text x="450" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">L = mean((ŷ − y)²)</text>

  <!-- 3. gradient -->
  <rect x="340" y="176" width="220" height="76" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="450" y="204" fill="#f87171" font-size="15" text-anchor="middle">3. gradient</text>
  <text x="450" y="232" fill="#e2e8f0" font-size="15" text-anchor="middle">∂L/∂w, ∂L/∂b</text>

  <!-- 4. update -->
  <rect x="40" y="176" width="220" height="76" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="150" y="204" fill="#34d399" font-size="15" text-anchor="middle">4. update</text>
  <text x="150" y="232" fill="#e2e8f0" font-size="15" text-anchor="middle">w ← w − η ∂L/∂w</text>

  <!-- arrows -->
  <line x1="262" y1="74" x2="336" y2="74" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="114" x2="450" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="338" y1="214" x2="264" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="174" x2="150" y2="116" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="300" y="140" fill="#94a3b8" font-size="14" text-anchor="middle">한 바퀴가 step 하나</text>
  <text x="300" y="282" fill="#94a3b8" font-size="13" text-anchor="middle">b 도 같은 방식으로 b ← b − η ∂L/∂b 로 고친다</text>
</svg>
