# /evaluate 구두 평가의 객관식 문항. topic 하나가 한 문항이고, 재평가는 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: divergence
  title: learning rate 와 발산 조건
  variants:
    - question: |
        loss 가 $L(w) = 2w^2$ 하나뿐일 때 gradient descent 의 update 는 $w \leftarrow (1 - 4\eta)\,w$ 다.
        $w$ 가 발산하기 시작하는 learning rate $\eta$ 는?
      choices:
        - $\eta > 0.25$
        - $\eta > 0.5$
        - $\eta > 1$
        - $\eta > 2$
      answer: 1
      explanation: |
        step 마다 $w$ 에 $(1 - 4\eta)$ 가 곱해지므로 $|1 - 4\eta| > 1$ 이면 $|w|$ 가 매번 커진다. $\eta > 0$ 이니 $1 - 4\eta < -1$,
        곧 $\eta > 0.5$ 다. $\eta = 0.25$ 에서는 한 step 에 $w = 0$ 이 되고, $0.25 < \eta < 0.5$ 에서는 부호가 바뀌며 진동하지만
        크기가 줄어 수렴한다. 일반적으로 $L = a w^2$ 이면 $\eta > 1/a$ 에서 발산한다.
    - question: |
        loss 가 $L(w) = a w^2$ ($a > 0$) 이고 learning rate 를 $\eta = 0.75 / a$ 로 잡았다. update 는
        $w \leftarrow (1 - 2\eta a)\,w$ 다. $w$ 는 어떻게 움직이는가?
      choices:
        - 부호를 유지한 채 0 으로 줄어든다
        - 부호가 번갈아 바뀌며 0 으로 줄어든다
        - 부호가 번갈아 바뀌며 점점 커진다
        - 한 step 만에 정확히 0 이 된다
      answer: 1
      explanation: |
        $1 - 2\eta a = 1 - 1.5 = -0.5$ 라서 step 마다 $w$ 에 $-0.5$ 가 곱해진다. 음수라 부호가 번갈아 바뀌고, 절댓값이 1 보다
        작아 크기는 절반씩 줄어든다. 최솟값을 지나쳐 반대편으로 가지만 갈 때마다 덜 지나치는 상태로, $\eta$ 가 $1/a$ 를 넘으면
        이 곱이 $-1$ 보다 작아져 지나칠 때마다 더 멀어진다.
    - question: |
        loss $L(w) = a w^2$ 에서 update 는 $w \leftarrow (1 - 2\eta a)\,w$ 다. learning rate 가 너무 커서 loss 가 step 마다
        커질 때, 곱해지는 값 $1 - 2\eta a$ 의 범위는?
      choices:
        - 0 과 1 사이
        - $-1$ 과 0 사이
        - $-1$ 보다 작다
        - 1 보다 크다
      answer: 2
      explanation: |
        $|1 - 2\eta a| > 1$ 이어야 $|w|$ 가 커진다. $\eta > 0$, $a > 0$ 이면 $1 - 2\eta a$ 는 1 보다 클 수 없으니 남는 경우는
        $-1$ 보다 작은 것뿐이다. 그래서 발산은 늘 부호가 바뀌며 최솟값 양쪽으로 점점 크게 튀는 모양으로 나타난다.

- topic: normal-equation
  title: normal equation 대신 gradient descent 를 쓰는 이유
  variants:
    - question: |
        parameter 가 1억 개인 neural network 를 학습할 때 normal equation 처럼 최솟값을 한 번에 주는 식을 쓰지 않는 가장
        큰 이유는?
      choices:
        - gradient descent 는 미분 없이 학습할 수 있어서
        - neural network 의 loss 는 parameter 에 대해 비선형이라 최솟값을 한 번에 주는 식이 없어서
        - normal equation 은 데이터에 noise 가 있으면 틀린 답을 줘서
        - gradient descent 는 항상 global minimum 을 찾아서
      answer: 1
      explanation: |
        normal equation 은 loss 가 parameter 에 대한 2차식인 linear regression 에서만 나오는 식이다. neural network 는 그런
        식이 없어서 gradient 를 따라 조금씩 고치는 수밖에 없다. gradient descent 도 매 step gradient 를 계산하므로 미분이
        필요하고, global minimum 을 보장하지도 않는다. noise 가 있어도 normal equation 은 least squares 의 정확한 해를 준다.
    - question: |
        linear regression 이라도 feature 가 $d$ 개면 normal equation 은 $d \times d$ 행렬 $A^\top A$ 로 연립방정식을 풀어야
        한다. $d$ 가 수십만이 되면 무엇이 문제인가?
      choices:
        - 계산량이 대략 $d^3$ 으로 늘고 $d^2$ 크기의 행렬을 메모리에 올려야 한다
        - 답이 gradient descent 결과보다 부정확해진다
        - $x$ 를 standardize 하지 않으면 식을 쓸 수 없다
        - loss 가 MSE 가 아니게 된다
      answer: 0
      explanation: |
        $d \times d$ 연립방정식을 푸는 비용은 대략 $d^3$ 이고 행렬 자체가 $d^2$ 개의 숫자다. $d = 10^5$ 이면 행렬만 $10^{10}$
        개라 float64 로 80 GB 다. gradient descent 는 step 마다 $d$ 개짜리 gradient 만 있으면 된다. normal equation 의 답은
        부정확하지 않고, standardize 와도 상관없다.
    - question: |
        데이터가 너무 많아 한 번에 메모리에 올릴 수 없을 때, gradient descent 계열 방법이 쓰는 방식은?
      choices:
        - 데이터 일부(mini-batch)로 gradient 를 근사해 update 를 되풀이한다
        - learning rate 를 데이터 수에 비례해 키운다
        - normal equation 으로 먼저 풀고 gradient descent 로 다듬는다
        - '`numerical_grad` 로 gradient 를 계산한다'
      answer: 0
      explanation: |
        gradient 는 점마다 계산한 값의 평균이라, 일부 점만 골라 평균해도 방향이 비슷하다. 그래서 데이터를 조금씩 읽어
        update 할 수 있고, 이것이 뒤 과제에서 쓰는 mini-batch SGD 다. normal equation 은 전체 데이터로 $A^\top A$ 를 만들어야
        한다. `numerical_grad` 는 검산용이고 데이터 양 문제를 풀지 못한다.

- topic: feature-scale
  title: feature scale 과 방향별 수렴 속도
  variants:
    - question: |
        `make_data()` 의 $x$ 는 0~10 이라 $\partial L / \partial w$ 에는 $x_i$ 가 곱해지고 $\partial L / \partial b$ 에는 곱해지지
        않는다. lr 0.01 로 학습하면 어떤 순서로 맞춰지는가?
      choices:
        - $w$ 가 먼저 거의 맞고, $b$ 는 오래 걸려 천천히 맞는다
        - $b$ 가 먼저 거의 맞고, $w$ 는 오래 걸려 천천히 맞는다
        - $w$ 와 $b$ 가 같은 속도로 맞는다
        - $b$ 는 거의 움직이지 않고 $w$ 가 $b$ 몫까지 보정한다
      answer: 0
      explanation: |
        $w$ 방향의 곡률은 $2\,\overline{x^2} \approx 78$, $b$ 방향은 2 라서 $w$ 쪽이 약 40배 가파르다. lr 은 가파른 $w$ 방향에서
        발산하지 않을 만큼 작아야 하고, 그 lr 로는 완만한 $b$ 방향이 step 마다 조금씩만 움직인다. 실제로 step 5 에
        $w = 3.20$ 일 때 $b = 0.49$ 이고, step 500 에야 $b = 1.84$ 다.
    - question: |
        정답 직선은 그대로 두고 $x$ 를 0~1000 범위에서 뽑도록 바꾼 뒤 lr 0.01 로 `fit` 을 돌리면?
      choices:
        - 점이 넓게 퍼져 더 빨리 수렴한다
        - 0~10 일 때와 똑같이 수렴한다
        - 발산한다
        - $w$ 는 그대로 두고 $b$ 만 움직인다
      answer: 2
      explanation: |
        $w$ 방향 곡률은 $2\,\overline{x^2}$ 이라 $x$ 가 100배면 1만 배가 된다. 발산하지 않으려면 lr 이 대략
        $1 / \overline{x^2} \approx 3 \times 10^{-6}$ 보다 작아야 하는데 0.01 은 훨씬 크다. 같은 문제라도 feature 의 scale 이
        lr 의 상한을 정한다.
    - question: |
        $x$ 를 평균 0, 표준편차 1 로 standardize 하면 lr 을 0.1 로 키워도 발산하지 않고 빨리 수렴한다. 그 이유는?
      choices:
        - $w$ 방향과 $b$ 방향의 곡률이 같아져(둘 다 약 2) 한 lr 이 양쪽에 다 맞기 때문에
        - noise 의 영향이 사라지기 때문에
        - gradient 가 항상 0 이 되기 때문에
        - 데이터 수가 늘어난 것과 같은 효과라서
      answer: 0
      explanation: |
        standardize 하면 $\overline{x^2} = 1$, $\bar x = 0$ 이라 $w$ 와 $b$ 방향 곡률이 모두 2 가 되고 서로 섞이지도 않는다.
        그러면 lr 1 미만까지 안전하고, lr 0.1 이면 step 마다 오차가 0.8 배로 줄어 두 방향이 같은 속도로 맞는다. noise 와
        데이터 수는 그대로다. 찾은 $w, b$ 는 원래 scale 로 되돌려야 `lstsq` 해와 비교할 수 있다.

- topic: mean-vs-sum
  title: gradient 의 mean 과 sum
  variants:
    - question: |
        `grad` 의 `np.mean` 을 `np.sum` 으로 바꾸고, `make_data()` 의 100개 점에서 원래와 같은 학습 궤적을 얻으려면 lr 을
        어떻게 바꿔야 하는가?
      choices:
        - 100배 키운다
        - 100 으로 나눈다
        - 그대로 둔다
        - 2 로 나눈다
      answer: 1
      explanation: |
        sum 은 mean 의 $N$ 배라 gradient 가 100배가 된다. update 는 `lr * gradient` 이므로 lr 을 100 으로 나눠야 같은 크기만큼
        움직인다. 바꾸지 않으면 실질 lr 이 1.0 이 되어 발산한다.
    - question: |
        `grad` 는 `np.mean` 그대로 두고 `make_data(n=10000)` 처럼 점 수만 100배로 늘려 lr 0.01 로 학습하면?
      choices:
        - gradient 크기가 거의 그대로라 비슷하게 수렴한다
        - gradient 가 100배가 되어 발산한다
        - step 당 움직임이 100배 작아져 매우 느려진다
        - '`numerical_grad` 와 결과가 달라진다'
      answer: 0
      explanation: |
        mean 은 점 수로 나누므로 gradient 크기가 $N$ 에 거의 상관없다. 그래서 데이터 양을 바꿔도 같은 lr 을 쓸 수 있고,
        이것이 loss 와 gradient 를 평균으로 정의하는 이유다. sum 으로 짰다면 gradient 가 100배가 되어 lr 을 다시 골라야 한다.
    - question: |
        `grad` 를 `np.sum` 으로 바꾸고 `make_data()` 의 100개 점에 lr 0.01 을 쓰면, `np.mean` 버전의 lr 몇을 쓴 것과 같은가?
      choices:
        - '0.0001'
        - '0.01'
        - '0.1'
        - '1.0'
      answer: 3
      explanation: |
        sum 의 gradient 는 mean 의 100배라 `0.01 * 100 = 1.0` 이다. 이 데이터에서 mean 버전은 lr 이 약 0.025 를 넘으면
        발산하므로 1.0 은 바로 발산하고, 실제로 162 step 에 `inf`·`nan` 이 된다.

- topic: finite-difference
  title: finite difference 의 h 와 반올림 오차
  variants:
    - question: |
        `numerical_grad` 의 `h` 를 `1e-5` 에서 `1e-15` 로 줄이면 결과가 오히려 망가진다. 그 이유는?
      choices:
        - float64 유효숫자가 약 16자리라 $L(w+h)$ 와 $L(w-h)$ 의 차이가 반올림 오차에 묻히기 때문에
        - '`h` 가 작으면 loop 가 길어져 계산이 끝나지 않기 때문에'
        - derivative 의 정의상 `h` 는 1 보다 커야 하기 때문에
        - '`mse` 가 음수가 되기 때문에'
      answer: 0
      explanation: |
        loss 가 420 근처면 float64 로 구분할 수 있는 간격은 약 $10^{-13}$ 이다. `h = 1e-15` 로 바꾼 loss 변화는 그보다 작아
        반올림에 묻히고, 그 차이를 아주 작은 $2h$ 로 나누니 오차가 크게 부풀려진다. 실제로 $(0, 0)$ 에서 dw 가 $-284.2$
        (정답 $-256.3$) 로 나온다.
    - question: |
        `make_data()` 데이터의 $(w, b) = (0, 0)$ 에서 `h = 1e-15` 로 `numerical_grad` 를 돌렸더니 db 가 정확히 `0.0` 이었다.
        이 결과가 뜻하는 것은?
      choices:
        - 그 점에서 $\partial L / \partial b$ 가 실제로 0 이다
        - '`mse(w, b + h)` 와 `mse(w, b - h)` 가 float64 에서 같은 수로 반올림됐다'
        - '`grad` 의 db 공식이 틀렸다'
        - $b = 0$ 이 이미 최적값이다
      answer: 1
      explanation: |
        실제 db 는 약 $-36.7$ 이다. `h` 만큼 바뀐 loss 차이가 float64 의 간격보다 작아서 두 loss 가 완전히 같은 수가 됐고,
        차이가 0 이니 결과도 0 이다. numerical gradient 가 0 이라고 gradient 가 0 인 것은 아니다.
    - question: |
        README 가 central difference 의 `h` 로 `1e-5` 근처를 권하는 이유는?
      choices:
        - 너무 크면 derivative 의 정의(극한)에서 멀어지고, 너무 작으면 반올림 오차가 커지므로 그 사이 값을 쓴다
        - '`h` 가 learning rate 와 같아야 해서'
        - float32 로 계산하기 때문에
        - test 허용 오차 `1e-6` 보다 커야 해서
      answer: 0
      explanation: |
        finite difference 의 오차는 두 가지다. `h` 가 크면 곡선을 직선으로 근사한 오차가 커지고, `h` 가 작으면 두 loss 의
        차이에서 유효숫자가 사라지는 반올림 오차가 커진다. float64 에서는 central difference 의 두 오차가 `1e-5` 근처에서
        함께 작아진다. lr 이나 test 허용 오차와는 관계없다.
