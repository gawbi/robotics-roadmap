# Branches of the holygraph.
# layout: hub = centre of the graph (exactly one), sector = its own wedge (clockwise in this order),
#         float = placed between the sectors its prerequisites come from.
- id: core
  title: Foundations
  summary: 신경망이 무엇을 계산하고 어떻게 학습하는지를 numpy·순수 Python 에서부터 직접 짜 보는 출발점
  color: "#cbd5e1"
  layout: hub

- id: language
  title: Language
  summary: tokenizer 와 Transformer, GPT 까지 이어지는 sequence 모델링. VLA 의 backbone 이 여기서 나온다
  color: "#a78bfa"
  layout: sector

- id: vision
  title: Vision
  summary: CNN 에서 ViT·CLIP 까지, 로봇 policy 가 카메라 영상을 읽는 image encoder
  color: "#60a5fa"
  layout: sector

- id: imitation
  title: Imitation Learning
  summary: 사람의 시연을 따라 하는 policy. behavior cloning 에서 Diffusion Policy·ACT, 실물 배포까지
  color: "#fb923c"
  layout: sector

- id: generative
  title: Generative Models
  summary: VAE·diffusion·flow matching. 한 입력에 정답이 여럿인 action 분포를 생성하는 수학
  color: "#e879f9"
  layout: sector

- id: rl
  title: Reinforcement Learning
  summary: 시연 없이 보상만으로 배우는 길. tabular RL 에서 PPO·SAC, sim-to-real 보행까지
  color: "#a3e635"
  layout: sector

- id: robotics
  title: Robotics
  summary: 좌표 변환·kinematics·제어·simulation·카메라. 학습한 policy 가 실제로 몸을 움직이는 바탕
  color: "#2dd4bf"
  layout: sector

- id: vla
  title: VLA
  summary: 이미지와 언어 지시를 받아 action 을 내는 Vision-Language-Action 모델
  color: "#facc15"
  layout: float

- id: frontier
  title: Frontier
  summary: 정답 구현이 아직 굳지 않은 최전선. 과제라기보다 논문 재현 프로젝트
  color: "#f87171"
  layout: float
