<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>PPO 의 한 iteration: env N 개에서 T step 씩 rollout 을 모으고, GAE 를 계산한 뒤, 같은 데이터를 minibatch 로 나눠 여러 epoch 학습하고 버린다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- rollout grid -->
  <text x="110" y="34" fill="#e2e8f0" font-size="14" text-anchor="middle">① rollout</text>
  <g fill="#1e293b" stroke="#38bdf8" stroke-width="1">
    <rect x="40" y="50" width="140" height="18"/><rect x="40" y="70" width="140" height="18"/>
    <rect x="40" y="90" width="140" height="18"/><rect x="40" y="110" width="140" height="18"/>
  </g>
  <g fill="#94a3b8" font-size="13">
    <text x="188" y="64">env 0</text><text x="188" y="84">env 1</text><text x="188" y="104">env 2</text><text x="188" y="124">env 3</text>
  </g>
  <text x="115" y="148" fill="#94a3b8" font-size="13" text-anchor="middle">(T, N) = (128, 4) 칸마다</text>
  <text x="115" y="166" fill="#94a3b8" font-size="13" text-anchor="middle">obs·action·log-prob</text>
  <text x="115" y="184" fill="#94a3b8" font-size="13" text-anchor="middle">reward·done·value</text>

  <!-- GAE -->
  <line x1="236" y1="90" x2="268" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="272" y="62" width="110" height="56" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="327" y="86" fill="#e2e8f0" font-size="14" text-anchor="middle">② GAE</text>
  <text x="327" y="106" fill="#94a3b8" font-size="13" text-anchor="middle">advantage, return</text>

  <!-- minibatches -->
  <line x1="382" y1="90" x2="414" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="497" y="34" fill="#e2e8f0" font-size="14" text-anchor="middle">③ 섞어서 minibatch</text>
  <g fill="#1e293b" stroke="#f59e0b" stroke-width="1.5">
    <rect x="420" y="50" width="155" height="18"/><rect x="420" y="70" width="155" height="18"/>
    <rect x="420" y="90" width="155" height="18"/><rect x="420" y="110" width="155" height="18"/>
  </g>
  <text x="497" y="148" fill="#94a3b8" font-size="13" text-anchor="middle">512 개를 128 개씩 4 묶음</text>

  <!-- epochs loop -->
  <path d="M560 160 C 560 190, 435 190, 435 164" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="210" fill="#f59e0b" font-size="13" text-anchor="end">④ epoch 4 번 반복, gradient step 16 번</text>

  <!-- back to rollout -->
  <path d="M497 220 V250 H115 V196" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="300" y="242" fill="#94a3b8" font-size="13" text-anchor="middle">데이터를 버리고, 고친 policy 로 다음 rollout</text>
  <text x="300" y="280" fill="#94a3b8" font-size="13" text-anchor="middle">숫자는 ppo_config.py 의 CartPole 기본값</text>
</svg>
