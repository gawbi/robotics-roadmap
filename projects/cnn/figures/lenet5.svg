<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>LeNet-5 의 tensor 모양. (1, 28, 28) 이미지가 conv·pool 을 두 번 거쳐 (16, 5, 5) 가 되고, 400 차원으로 펴서 Linear 세 개를 지나 logits 10 개가 된다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="300" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle">LeNet-5 — 이미지 한 장의 tensor 모양 (batch 축 생략)</text>
  <rect x="18.0" y="52.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="75" fill="#e2e8f0" font-size="15" text-anchor="middle">입력</text>
  <text x="80" y="96" fill="#38bdf8" font-size="14" text-anchor="middle">(1, 28, 28)</text>
  <line x1="144" y1="80" x2="236" y2="80" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="190" y="70" fill="#e2e8f0" font-size="13" text-anchor="middle">conv 6@5×5</text>
  <text x="190" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">pad 2, ReLU</text>
  <rect x="238.0" y="52.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="75" fill="#e2e8f0" font-size="15" text-anchor="middle">C1</text>
  <text x="300" y="96" fill="#38bdf8" font-size="14" text-anchor="middle">(6, 28, 28)</text>
  <line x1="364" y1="80" x2="456" y2="80" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410" y="70" fill="#e2e8f0" font-size="13" text-anchor="middle">max pool</text>
  <text x="410" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">2×2</text>
  <rect x="458.0" y="52.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="75" fill="#e2e8f0" font-size="15" text-anchor="middle">S2</text>
  <text x="520" y="96" fill="#38bdf8" font-size="14" text-anchor="middle">(6, 14, 14)</text>
  <line x1="520" y1="110" x2="520" y2="174" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="508" y="138" fill="#e2e8f0" font-size="13" text-anchor="end">conv 16@5×5</text>
  <text x="508" y="156" fill="#94a3b8" font-size="13" text-anchor="end">ReLU</text>
  <rect x="458.0" y="176.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="520" y="199" fill="#e2e8f0" font-size="15" text-anchor="middle">C3</text>
  <text x="520" y="220" fill="#38bdf8" font-size="14" text-anchor="middle">(16, 10, 10)</text>
  <line x1="456" y1="204" x2="364" y2="204" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410" y="194" fill="#e2e8f0" font-size="13" text-anchor="middle">max pool</text>
  <text x="410" y="224" fill="#94a3b8" font-size="13" text-anchor="middle">2×2</text>
  <rect x="238.0" y="176.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="199" fill="#e2e8f0" font-size="15" text-anchor="middle">S4</text>
  <text x="300" y="220" fill="#38bdf8" font-size="14" text-anchor="middle">(16, 5, 5)</text>
  <line x1="236" y1="204" x2="144" y2="204" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="190" y="194" fill="#e2e8f0" font-size="13" text-anchor="middle">flatten</text>
  <rect x="18.0" y="176.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="199" fill="#e2e8f0" font-size="15" text-anchor="middle">벡터</text>
  <text x="80" y="220" fill="#38bdf8" font-size="14" text-anchor="middle">(400,)</text>
  <line x1="80" y1="234" x2="80" y2="298" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="92" y="262" fill="#e2e8f0" font-size="13" text-anchor="start">Linear</text>
  <text x="92" y="280" fill="#94a3b8" font-size="13" text-anchor="start">ReLU</text>
  <rect x="18.0" y="300.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">F5</text>
  <text x="80" y="344" fill="#38bdf8" font-size="14" text-anchor="middle">(120,)</text>
  <line x1="144" y1="328" x2="236" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="190" y="318" fill="#e2e8f0" font-size="13" text-anchor="middle">Linear</text>
  <text x="190" y="348" fill="#94a3b8" font-size="13" text-anchor="middle">ReLU</text>
  <rect x="238.0" y="300.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">F6</text>
  <text x="300" y="344" fill="#38bdf8" font-size="14" text-anchor="middle">(84,)</text>
  <line x1="364" y1="328" x2="456" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="410" y="318" fill="#e2e8f0" font-size="13" text-anchor="middle">Linear</text>
  <rect x="458.0" y="300.0" width="124" height="56" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">logits</text>
  <text x="520" y="344" fill="#f59e0b" font-size="14" text-anchor="middle">(10,)</text>
</svg>
