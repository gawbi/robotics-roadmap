<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>trajectory 추종 loop. PID 가 오차를 줄이는 torque 에 feedforward torque 를 더하고, 한계로 자른 torque 로 pendulum 을 Δt 만큼 적분한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- trajectory -->
  <rect x="20" y="110" width="110" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="75" y="132" fill="#e2e8f0" font-size="15" text-anchor="middle">min_jerk(t)</text>
  <text x="75" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">min_jerk.py</text>

  <!-- feedforward -->
  <rect x="200" y="30" width="140" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270" y="52" fill="#e2e8f0" font-size="15" text-anchor="middle">feedforward</text>
  <text x="270" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">τ_ff · controller.py</text>
  <path d="M75,108 L75,55 L197,55" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="84" y="46" fill="#94a3b8" font-size="13">q_d, qd_d, qdd_d</text>

  <!-- error junction -->
  <line x1="132" y1="135" x2="174" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="190" cy="135" r="14" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="190" y="140" fill="#e2e8f0" font-size="15" text-anchor="middle">Σ</text>
  <text x="166" y="128" fill="#94a3b8" font-size="13">+</text>
  <text x="196" y="168" fill="#94a3b8" font-size="13">−</text>

  <!-- PID -->
  <line x1="206" y1="135" x2="232" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="206" y="104" fill="#94a3b8" font-size="13">e, e_dot</text>
  <rect x="236" y="110" width="104" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="288" y="132" fill="#e2e8f0" font-size="15" text-anchor="middle">PID</text>
  <text x="288" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">controller.py</text>

  <!-- torque sum -->
  <line x1="342" y1="135" x2="364" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="380" cy="135" r="14" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="140" fill="#e2e8f0" font-size="15" text-anchor="middle">Σ</text>
  <path d="M342,55 L380,55 L380,119" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- clip -->
  <line x1="396" y1="135" x2="422" y2="135" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="426" y="110" width="150" height="50" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="501" y="132" fill="#e2e8f0" font-size="15" text-anchor="middle">clip ±τ_max</text>
  <text x="501" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">motor 의 한계</text>

  <!-- plant -->
  <line x1="501" y1="162" x2="501" y2="194" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="510" y="184" fill="#94a3b8" font-size="13">τ</text>
  <rect x="380" y="198" width="196" height="54" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="478" y="220" fill="#e2e8f0" font-size="15" text-anchor="middle">pendulum + integrator</text>
  <text x="478" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">dynamics · rk4_step(Δt)</text>

  <!-- feedback -->
  <path d="M378,225 L190,225 L190,153" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="250" y="216" fill="#94a3b8" font-size="13">x = (theta, theta_dot)</text>
</svg>
