<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>1-DOF pendulum. θ 는 아래로 늘어진 자세에서 잰 각도이고, pivot 의 torque τ 가 gravity 와 friction 을 이겨 팔을 돌린다</title>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- ceiling and pivot -->
  <line x1="100" y1="40" x2="200" y2="40" stroke="#475569" stroke-width="3"/>
  <line x1="150" y1="50" x2="150" y2="240" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="138" y="258" fill="#64748b" font-size="13" text-anchor="middle">θ = 0</text>

  <!-- rod and bob at theta = 35 deg -->
  <line x1="150" y1="50" x2="247.5" y2="189.3" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="247.5" cy="189.3" r="14" fill="#f59e0b"/>
  <circle cx="150" cy="50" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="214" y="116" fill="#94a3b8" font-size="15">l</text>
  <text x="270" y="186" fill="#f59e0b" font-size="15">m</text>

  <!-- theta arc -->
  <path d="M150,110 A60,60 0 0,0 184.4,99.1" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="132" fill="#e2e8f0" font-size="15">θ</text>

  <!-- gravity -->
  <line x1="247.5" y1="205" x2="247.5" y2="258" stroke="#f87171" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="258" y="250" fill="#f87171" font-size="14">mg</text>

  <!-- torque at the pivot -->
  <path d="M126,62 A27,27 0 0,0 174,62" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#at)"/>
  <text x="104" y="92" fill="#38bdf8" font-size="15">τ</text>

  <!-- equation -->
  <text x="316" y="70" fill="#e2e8f0" font-size="16">I d²θ/dt² + b dθ/dt + m g l sin θ = τ</text>
  <text x="316" y="106" fill="#94a3b8" font-size="13">I d²θ/dt² : 각가속도를 내는 데 드는 torque</text>
  <text x="316" y="130" fill="#94a3b8" font-size="13">b dθ/dt : 각속도에 비례하는 friction</text>
  <text x="316" y="154" fill="#94a3b8" font-size="13">m g l sin θ : 팔을 아래로 당기는 gravity</text>
  <text x="316" y="178" fill="#94a3b8" font-size="13">τ : pivot 의 motor 가 내는 torque</text>
  <text x="316" y="218" fill="#e2e8f0" font-size="13">m = 1 kg, l = 0.5 m 이면</text>
  <text x="316" y="240" fill="#e2e8f0" font-size="13">I = m l² = 0.25 kg·m², m g l = 4.905 N·m</text>
</svg>
