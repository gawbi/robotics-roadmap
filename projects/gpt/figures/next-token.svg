  <text x="24" y="300" fill="#94a3b8" font-size="13">y 는 x 를 왼쪽으로 한 칸 민 것이다. 세 번째 위치는 F i r 만 보고 s 를 맞힌다.</text>
  <text x="24" y="320" fill="#94a3b8" font-size="13">forward 한 번에 위치 8개의 예측과 loss 가 함께 계산된다.</text>
