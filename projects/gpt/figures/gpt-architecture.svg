<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>decoder-only GPT 의 구조. token·position embedding 을 더하고, pre-LN Block 을 n_layer 번 거친 뒤, wte 와 같은 행렬인 lm_head 로 logits 를 낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="608" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="170" y="552" width="200" height="40" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270.0" y="569.0" fill="#38bdf8" font-size="14" text-anchor="middle">idx</text>
  <text x="270.0" y="586.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, T) token id</text>
  <path d="M270,552 L270,540 L185,540 L185,526" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M270,540 L355,540 L355,526" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="110" y="482" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="185.0" y="501.0" fill="#e2e8f0" font-size="14" text-anchor="middle">wpe</text>
  <text x="185.0" y="518.0" fill="#94a3b8" font-size="13" text-anchor="middle">(block_size, n_embd)</text>
  <rect x="280" y="482" width="150" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="355.0" y="501.0" fill="#f59e0b" font-size="14" text-anchor="middle">wte</text>
  <text x="355.0" y="518.0" fill="#94a3b8" font-size="13" text-anchor="middle">(vocab, n_embd)</text>
  <path d="M185,482 L185,470 L270,470 L270,446" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="482" x2="355" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <line x1="355" y1="470" x2="270" y2="470" stroke="#94a3b8" stroke-width="2"/>
  <text x="256" y="466" fill="#e2e8f0" font-size="15" text-anchor="end">+</text>
  <text x="280" y="458" fill="#94a3b8" font-size="13">x (B, T, n_embd)</text>
  <rect x="140" y="154" width="262" height="274" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="394" y="172" fill="#38bdf8" font-size="13" text-anchor="end">Block × n_layer</text>
  <line x1="270" y1="446" x2="270" y2="418" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="388" width="200" height="30" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270.0" y="407.9" fill="#e2e8f0" font-size="14" text-anchor="middle">ln_1 (LayerNorm)</text>
  <line x1="270" y1="388" x2="270" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="334" width="200" height="36" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="270.0" y="356.9" fill="#e2e8f0" font-size="14" text-anchor="middle">causal self-attention</text>
  <line x1="270" y1="334" x2="270" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="270" cy="308" r="11" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="313" fill="#e2e8f0" font-size="15" text-anchor="middle">+</text>
  <path d="M270,432 L158,432 L158,308 L257,308" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="297" x2="270" y2="282" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="252" width="200" height="30" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270.0" y="271.9" fill="#e2e8f0" font-size="14" text-anchor="middle">ln_2 (LayerNorm)</text>
  <line x1="270" y1="252" x2="270" y2="234" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="198" width="200" height="36" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="270.0" y="213.0" fill="#e2e8f0" font-size="14" text-anchor="middle">MLP</text>
  <text x="270.0" y="230.0" fill="#94a3b8" font-size="13" text-anchor="middle">n_embd → 4·n_embd → n_embd</text>
  <line x1="270" y1="198" x2="270" y2="184" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="270" cy="172" r="11" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="177" fill="#e2e8f0" font-size="15" text-anchor="middle">+</text>
  <path d="M270,291 L158,291 L158,172 L257,172" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="161" x2="270" y2="136" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="106" width="200" height="30" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270.0" y="125.9" fill="#e2e8f0" font-size="14" text-anchor="middle">ln_f (LayerNorm)</text>
  <line x1="270" y1="106" x2="270" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="54" width="200" height="36" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="270.0" y="69.0" fill="#f59e0b" font-size="14" text-anchor="middle">lm_head</text>
  <text x="270.0" y="86.0" fill="#94a3b8" font-size="13" text-anchor="middle">n_embd → vocab</text>
  <line x1="270" y1="54" x2="270" y2="38" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="30" fill="#e2e8f0" font-size="14" text-anchor="middle">logits (B, T, vocab)</text>
  <path d="M370,72 L462,72 L462,504 L434,504" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="478" y="290" fill="#f59e0b" font-size="13" text-anchor="middle" transform="rotate(90 478 290)">같은 행렬 (weight tying)</text>
  <text x="20" y="240" fill="#94a3b8" font-size="13">+ : residual</text>
  <text x="20" y="258" fill="#94a3b8" font-size="13">덧셈</text>
  <text x="20" y="380" fill="#94a3b8" font-size="13">pre-LN:</text>
  <text x="20" y="398" fill="#94a3b8" font-size="13">LayerNorm 을</text>
  <text x="20" y="416" fill="#94a3b8" font-size="13">sub-layer 앞에</text>
</svg>
