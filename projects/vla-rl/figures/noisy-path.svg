<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>결정적 적분과 noise 를 넣은 적분. step 마다 Gaussian 에서 다음 점을 뽑으면 경로 전체의 log-likelihood 를 Gaussian log-density 의 합으로 쓸 수 있다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="350" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="44" width="280" height="200" rx="8" fill="#0e1628" stroke="#1e293b"/>
  <text x="155" y="34" fill="#e2e8f0" font-size="14" text-anchor="middle">결정적 Euler 적분</text>
  <line x1="45" y1="214" x2="83" y2="188.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="89" y1="184.0" x2="127" y2="152.9511740911526" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="133" y1="148.9511740911526" x2="171" y2="117.49538953019852" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="177" y1="113.49538953019852" x2="215" y2="86.64866948183932" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="221" y1="82.64866948183932" x2="259" y2="61.18948445368689" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <circle cx="45.0" cy="214.0" r="5" fill="#38bdf8"/>
  <circle cx="89.0" cy="184.0" r="5" fill="#38bdf8"/>
  <circle cx="133.0" cy="149.0" r="5" fill="#38bdf8"/>
