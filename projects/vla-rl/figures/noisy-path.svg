  <circle cx="418.2" cy="141.8" r="2.5" fill="#94a3b8"/>
  <line x1="374.2488656152738" y1="176.85698861615288" x2="416.3779139822661" y2="135.59766358174886" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="416.4" cy="135.6" r="5" fill="#f59e0b"/>
