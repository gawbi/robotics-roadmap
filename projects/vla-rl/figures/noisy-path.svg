  <circle cx="221.0" cy="82.6" r="5" fill="#38bdf8"/>
  <circle cx="265.0" cy="57.2" r="5" fill="#38bdf8"/>
  <text x="41" y="236" fill="#94a3b8" font-size="13">a⁰ noise</text>
  <text x="287" y="112" fill="#94a3b8" font-size="13" text-anchor="end">aᴷ action</text>
  <rect x="305" y="44" width="280" height="200" rx="8" fill="#0e1628" stroke="#1e293b"/>
  <text x="445" y="34" fill="#e2e8f0" font-size="14" text-anchor="middle">step 마다 noise 를 넣은 적분</text>
  <circle cx="335.0" cy="214.0" r="5" fill="#f59e0b"/>
  <circle cx="379.0" cy="184.0" r="15" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="379.0" cy="184.0" r="2.5" fill="#94a3b8"/>
  <line x1="335" y1="214" x2="374.2488656152738" y2="176.85698861615288" stroke="#f59e0b" stroke-width="1.8"/>
