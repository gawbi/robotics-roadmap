  <line x1="416.3779139822661" y1="135.59766358174886" x2="452.5751857044987" y2="98.37051728152612" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="452.6" cy="98.4" r="5" fill="#f59e0b"/>
