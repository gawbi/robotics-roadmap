  <circle cx="496.6" cy="67.5" r="2.5" fill="#94a3b8"/>
  <line x1="452.5751857044987" y1="98.37051728152612" x2="504.09837648007766" y2="72.93193956009146" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="504.1" cy="72.9" r="5" fill="#f59e0b"/>
  <circle cx="548.1" cy="47.5" r="15" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="548.1" cy="47.5" r="2.5" fill="#94a3b8"/>
  <line x1="504.09837648007766" y1="72.93193956009146" x2="552.8713033251755" y2="42.46746169436475" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="552.9" cy="42.5" r="5" fill="#f59e0b"/>
  <text x="331" y="236" fill="#94a3b8" font-size="13">a⁰ noise</text>
  <text x="577" y="112" fill="#94a3b8" font-size="13" text-anchor="end">aᴷ action</text>
  <text x="155" y="268" fill="#94a3b8" font-size="13" text-anchor="middle">a⁰ 이 정해지면 경로가 하나로 정해진다</text>
  <text x="445" y="268" fill="#f59e0b" font-size="13" text-anchor="middle">aᵏ⁺¹ ~ N(aᵏ + v Δτ, σₖ² I)</text>
  <text x="445" y="290" fill="#94a3b8" font-size="13" text-anchor="middle">점선 원 = 평균 주변의 σₖ 범위</text>
  <text x="300" y="318" fill="#e2e8f0" font-size="13" text-anchor="middle">noise 를 넣은 쪽은 step 마다의 확률 밀도를 곱해(log 로는 더해)</text>
  <text x="300" y="338" fill="#e2e8f0" font-size="13" text-anchor="middle">경로 전체의 likelihood 를 얻는다</text>
</svg>
