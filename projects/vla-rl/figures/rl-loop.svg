<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>RL fine-tuning 루프. 고정한 VLA 와 noise policy 로 LIBERO 에서 rollout 을 모으고, filtered BC 나 PPO 로 policy 를 고친다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="40" width="160" height="96" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="95" y="66" fill="#34d399" font-size="14" text-anchor="middle">LIBERO env</text>
  <text x="95" y="92" fill="#e2e8f0" font-size="13" text-anchor="middle">성공하면 reward 1</text>
  <text x="95" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">그 밖의 step 은 0</text>
  <rect x="220" y="40" width="160" height="96" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="300" y="66" fill="#f59e0b" font-size="14" text-anchor="middle">policy</text>
  <text x="300" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">VLA (고정)</text>
  <text x="300" y="114" fill="#e2e8f0" font-size="13" text-anchor="middle">+ noise policy (학습)</text>
  <line x1="177" y1="72" x2="216" y2="72" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="218" y1="104" x2="179" y2="104" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="197" y="62" fill="#94a3b8" font-size="13" text-anchor="middle">관측</text>
  <text x="198" y="126" fill="#94a3b8" font-size="13" text-anchor="middle">chunk</text>
  <rect x="425" y="40" width="160" height="96" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="505" y="66" fill="#38bdf8" font-size="14" text-anchor="middle">Episode 모음</text>
  <text x="505" y="92" fill="#e2e8f0" font-size="13" text-anchor="middle">feats · noises</text>
  <text x="505" y="114" fill="#e2e8f0" font-size="13" text-anchor="middle">chunks · success</text>
  <line x1="382" y1="88" x2="421" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402" y="80" fill="#94a3b8" font-size="13" text-anchor="middle">rollout</text>
  <rect x="200" y="190" width="185" height="86" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="292" y="216" fill="#e2e8f0" font-size="14" text-anchor="middle">filtered BC</text>
  <text x="292" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">성공한 episode 만 모아</text>
  <text x="292" y="260" fill="#94a3b8" font-size="13" text-anchor="middle">VLA 를 다시 SFT</text>
  <rect x="400" y="190" width="185" height="86" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="492" y="216" fill="#f59e0b" font-size="14" text-anchor="middle">PPO (DSRL 식)</text>
  <text x="492" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">noise policy 만 update</text>
  <text x="492" y="260" fill="#94a3b8" font-size="13" text-anchor="middle">VLA 는 그대로</text>
  <polyline points="505,138 505,160 292,160 292,186" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="160" x2="505" y2="186" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="200,233 150,233 150,160 270,160 270,140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="308" fill="#94a3b8" font-size="13" text-anchor="middle">두 방법은 같은 rollout 을 쓰고, 환경 step 수를 같은 축에 두고 성공률을 비교한다</text>
</svg>
