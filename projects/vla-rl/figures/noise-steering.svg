<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>DSRL 식 noise policy. 고정한 VLA 의 flow sampler 에 N(0, I) 대신 noise policy 가 고른 초기 noise w 를 넣어 action chunk 를 조종한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="40" width="92" height="96" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="61" y="66" fill="#38bdf8" font-size="13" text-anchor="middle">관측 o</text>
  <text x="61" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">이미지·지시문</text>
  <text x="61" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">state</text>
  <rect x="135" y="40" width="92" height="96" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="2"/>
  <text x="181" y="66" fill="#e2e8f0" font-size="13" text-anchor="middle">prefix feat</text>
  <text x="181" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">VLM 고정</text>
  <text x="181" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">(feat_dim,)</text>
  <rect x="255" y="40" width="92" height="96" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="301" y="66" fill="#f59e0b" font-size="13" text-anchor="middle">NoisePolicy</text>
  <text x="301" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">π^w(w | o)</text>
  <text x="301" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">Gaussian</text>
  <rect x="375" y="40" width="92" height="96" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="421" y="66" fill="#f59e0b" font-size="13" text-anchor="middle">초기 noise w</text>
  <text x="421" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">(50, 7)</text>
  <rect x="495" y="40" width="92" height="96" rx="10" fill="#111a2e" stroke="#64748b" stroke-width="2"/>
  <text x="541" y="66" fill="#e2e8f0" font-size="13" text-anchor="middle">action expert</text>
  <text x="541" y="92" fill="#94a3b8" font-size="13" text-anchor="middle">Euler 10 step</text>
  <text x="541" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">고정</text>
  <line x1="109" y1="88" x2="131" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="229" y1="88" x2="251" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="349" y1="88" x2="371" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="469" y1="88" x2="491" y2="88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="541" y1="138" x2="541" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="541" y="186" fill="#e2e8f0" font-size="13" text-anchor="middle">action chunk (50, 7)</text>
  <text x="541" y="206" fill="#94a3b8" font-size="13" text-anchor="middle">→ env</text>
  <line x1="20" y1="232" x2="440" y2="232" stroke="#1e293b" stroke-width="1.5"/>
  <text x="20" y="258" fill="#e2e8f0" font-size="14">기본 VLA</text>
  <text x="150" y="258" fill="#94a3b8" font-size="13">w ~ N(0, I) 에서 무작위로 뽑는다</text>
  <text x="20" y="284" fill="#f59e0b" font-size="14">DSRL</text>
  <text x="150" y="284" fill="#e2e8f0" font-size="13">w ~ π^w(· | o): 관측을 보고 좋은 noise 를 고른다</text>
  <text x="20" y="314" fill="#94a3b8" font-size="13">PPO 의 ratio 는 Gaussian 인 π^w 의 log-prob 으로 바로 계산되고, VLA weight 는 바뀌지 않는다</text>
</svg>
