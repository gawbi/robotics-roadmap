<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 estimator 가 step t 의 weight 로 쓰는 값: REINFORCE 는 episode 끝까지의 reward, baseline 판은 거기서 V(s_t) 를 빼고, actor-critic 은 reward 하나와 critic 의 추정을 쓴다</title>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- timeline -->
  <line x1="60" y1="60" x2="400" y2="60" stroke="#475569" stroke-width="1.5"/>
  <g fill="#111a2e" stroke="#e2e8f0" stroke-width="2">
    <circle cx="70" cy="60" r="16"/><circle cx="160" cy="60" r="16"/><circle cx="250" cy="60" r="16"/><circle cx="390" cy="60" r="16"/>
  </g>
  <g fill="#e2e8f0" font-size="13" text-anchor="middle">
    <text x="70" y="65">sₜ</text><text x="160" y="65">sₜ₊₁</text><text x="250" y="65">sₜ₊₂</text><text x="390" y="65">끝</text>
  </g>
  <text x="320" y="65" fill="#94a3b8" font-size="15" text-anchor="middle">⋯</text>
  <g fill="#34d399" font-size="13" text-anchor="middle">
    <text x="115" y="94">rₜ</text><text x="205" y="94">rₜ₊₁</text><text x="290" y="94">rₜ₊₂ ⋯</text>
  </g>

  <!-- REINFORCE -->
  <path d="M70 128 V120 H390 V128" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="230" y="146" fill="#e2e8f0" font-size="13" text-anchor="middle">Gₜ = rₜ + γrₜ₊₁ + γ²rₜ₊₂ + ⋯</text>
  <text x="420" y="126" fill="#f59e0b" font-size="14">REINFORCE</text>
  <text x="420" y="146" fill="#94a3b8" font-size="13">bias 없음 · variance 큼</text>

  <!-- baseline -->
  <path d="M70 188 V180 H390 V188" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="206" fill="#e2e8f0" font-size="13" text-anchor="middle">Gₜ − V<tspan baseline-shift="sub" font-size="12">φ</tspan>(sₜ)</text>
  <text x="420" y="186" fill="#38bdf8" font-size="14">value baseline</text>
  <text x="420" y="206" fill="#94a3b8" font-size="13">bias 없음 · variance 작아짐</text>

  <!-- actor-critic -->
  <path d="M70 248 V240 H160 V248" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M160 244 H390" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="275" y="236" fill="#94a3b8" font-size="13" text-anchor="middle">나머지는 V<tspan baseline-shift="sub" font-size="12">φ</tspan>(sₜ₊₁) 로 추정</text>
  <text x="70" y="268" fill="#e2e8f0" font-size="13" text-anchor="start">rₜ + γV<tspan baseline-shift="sub" font-size="12">φ</tspan>(sₜ₊₁) − V<tspan baseline-shift="sub" font-size="12">φ</tspan>(sₜ)</text>
  <text x="420" y="246" fill="#34d399" font-size="14">actor-critic</text>
  <text x="420" y="266" fill="#94a3b8" font-size="13">V<tspan baseline-shift="sub" font-size="12">φ</tspan> 가 틀린 만큼 bias</text>
</svg>
