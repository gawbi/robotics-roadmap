<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>policy gradient 한 step: 고른 action 의 확률이 weight 가 양수면 오르고 음수면 내린다</title>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- column titles -->
  <text x="110" y="38" fill="#e2e8f0" font-size="14" text-anchor="middle">update 전 π(· | s)</text>
  <text x="300" y="38" fill="#e2e8f0" font-size="14" text-anchor="middle">오른쪽을 골랐고 weight &gt; 0</text>
  <text x="490" y="38" fill="#e2e8f0" font-size="14" text-anchor="middle">오른쪽을 골랐고 weight &lt; 0</text>

  <!-- baselines -->
  <line x1="50" y1="200" x2="170" y2="200" stroke="#475569"/>
  <line x1="240" y1="200" x2="360" y2="200" stroke="#475569"/>
  <line x1="430" y1="200" x2="550" y2="200" stroke="#475569"/>

  <!-- before: 0.5 / 0.5 -->
  <rect x="62" y="140" width="40" height="60" fill="#38bdf8" fill-opacity="0.7"/>
  <rect x="118" y="140" width="40" height="60" fill="#f59e0b" fill-opacity="0.7"/>
  <text x="82" y="132" fill="#94a3b8" font-size="13" text-anchor="middle">0.5</text>
  <text x="138" y="132" fill="#94a3b8" font-size="13" text-anchor="middle">0.5</text>

  <!-- weight > 0: right goes up -->
  <rect x="252" y="152" width="40" height="48" fill="#38bdf8" fill-opacity="0.7"/>
  <rect x="308" y="128" width="40" height="72" fill="#f59e0b" fill-opacity="0.7"/>
  <rect x="308" y="140" width="40" height="60" fill="none" stroke="#e2e8f0" stroke-dasharray="4 3"/>
  <line x1="328" y1="120" x2="328" y2="92" stroke="#34d399" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- weight < 0: right goes down -->
  <rect x="442" y="128" width="40" height="72" fill="#38bdf8" fill-opacity="0.7"/>
  <rect x="498" y="152" width="40" height="48" fill="#f59e0b" fill-opacity="0.7"/>
  <rect x="498" y="140" width="40" height="60" fill="none" stroke="#e2e8f0" stroke-dasharray="4 3"/>
  <line x1="518" y1="96" x2="518" y2="124" stroke="#f87171" stroke-width="2.5" marker-end="url(#down)"/>

  <!-- action labels -->
  <g fill="#94a3b8" font-size="13" text-anchor="middle">
    <text x="82" y="220">왼쪽</text><text x="138" y="220">오른쪽</text>
    <text x="272" y="220">왼쪽</text><text x="328" y="220">오른쪽</text>
    <text x="462" y="220">왼쪽</text><text x="518" y="220">오른쪽</text>
  </g>

  <text x="300" y="254" fill="#94a3b8" font-size="13" text-anchor="middle">loss = −log π(a | s) × weight 로 gradient step 을 하면 weight 의 부호대로 확률이 오르내린다</text>
</svg>
