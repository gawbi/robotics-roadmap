<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SO-101 URDF 의 link·joint tree. base_link 가 root 이고 gripper_link 에서 두 갈래로 나뉜다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="448" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- main chain: link boxes at x 40..230 -->
  <rect x="40" y="24" width="190" height="32" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="135" y="45" fill="#e2e8f0" font-size="14" text-anchor="middle">base_link (root)</text>
  <rect x="40" y="80" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="101" fill="#e2e8f0" font-size="14" text-anchor="middle">shoulder_link</text>
  <rect x="40" y="136" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="157" fill="#e2e8f0" font-size="14" text-anchor="middle">upper_arm_link</text>
  <rect x="40" y="192" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="213" fill="#e2e8f0" font-size="14" text-anchor="middle">lower_arm_link</text>
  <rect x="40" y="248" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="269" fill="#e2e8f0" font-size="14" text-anchor="middle">wrist_link</text>
  <rect x="40" y="304" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="325" fill="#e2e8f0" font-size="14" text-anchor="middle">gripper_link</text>
  <rect x="40" y="392" width="190" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="135" y="413" fill="#e2e8f0" font-size="14" text-anchor="middle">gripper_frame_link</text>
  <rect x="300" y="392" width="270" height="32" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="435" y="413" fill="#e2e8f0" font-size="14" text-anchor="middle">moving_jaw_so101_v1_link</text>

  <!-- joints -->
  <line x1="135" y1="56" x2="135" y2="78" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="72" fill="#38bdf8" font-size="13">shoulder_pan · revolute</text>
  <line x1="135" y1="112" x2="135" y2="134" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="128" fill="#38bdf8" font-size="13">shoulder_lift · revolute</text>
  <line x1="135" y1="168" x2="135" y2="190" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="184" fill="#38bdf8" font-size="13">elbow_flex · revolute</text>
  <line x1="135" y1="224" x2="135" y2="246" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="240" fill="#38bdf8" font-size="13">wrist_flex · revolute</text>
  <line x1="135" y1="280" x2="135" y2="302" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="296" fill="#38bdf8" font-size="13">wrist_roll · revolute</text>
  <line x1="135" y1="336" x2="135" y2="390" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="148" y="368" fill="#94a3b8" font-size="13">gripper_frame_joint · fixed</text>
  <path d="M230,320 L435,320 L435,390" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="446" y="360" fill="#38bdf8" font-size="13">gripper · revolute</text>

  <!-- file order note -->
  <text x="330" y="44" fill="#e2e8f0" font-size="14">URDF 파일에 적힌 joint 순서</text>
  <text x="330" y="70" fill="#94a3b8" font-size="13">1  gripper_frame_joint</text>
  <text x="330" y="92" fill="#94a3b8" font-size="13">2  gripper</text>
  <text x="330" y="114" fill="#94a3b8" font-size="13">3  wrist_roll</text>
  <text x="330" y="136" fill="#94a3b8" font-size="13">4  wrist_flex</text>
  <text x="330" y="158" fill="#94a3b8" font-size="13">5  elbow_flex</text>
  <text x="330" y="180" fill="#94a3b8" font-size="13">6  shoulder_lift</text>
  <text x="330" y="202" fill="#94a3b8" font-size="13">7  shoulder_pan</text>
  <text x="330" y="236" fill="#f59e0b" font-size="13">gripper 쪽부터 거꾸로 적혀 있어서,</text>
  <text x="330" y="256" fill="#f59e0b" font-size="13">pose 는 root 에서 tree 를 따라</text>
  <text x="330" y="276" fill="#f59e0b" font-size="13">내려가며 계산한다</text>
</svg>
