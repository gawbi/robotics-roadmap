<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Euler sampler 의 반복. noise 에서 출발해 v_θ 를 n 번 불러 t = 0 에서 1 까지 x 를 옮긴다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="40" width="150" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x ~ N(0, I)</text>
  <text x="95.0" y="79.0" fill="#94a3b8" font-size="13" text-anchor="middle">t = 0 에서 시작</text>
  <line x1="170" y1="65" x2="210" y2="65" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="212" y="40" width="170" height="50" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="297.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">v = v_θ(x, t)</text>
  <text x="297.0" y="79.0" fill="#94a3b8" font-size="13" text-anchor="middle">network 호출 1번</text>
  <line x1="382" y1="65" x2="420" y2="65" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="422" y="40" width="158" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="501.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x ← x + Δt · v</text>
  <text x="501.0" y="79.0" fill="#94a3b8" font-size="13" text-anchor="middle">t ← t + Δt</text>
  <path d="M500,90 L500,116 L297,116 L297,92" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="398" y="136" fill="#94a3b8" font-size="13" text-anchor="middle">Δt = 1 / n, n 번 반복</text>
  <line x1="580" y1="65" x2="590" y2="65" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="60" y1="196" x2="540" y2="196" stroke="#94a3b8" stroke-width="2"/>
  <line x1="60.0" y1="189" x2="60.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">0.0</text>
  <line x1="156.0" y1="189" x2="156.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="156.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">0.2</text>
  <line x1="252.0" y1="189" x2="252.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="252.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">0.4</text>
  <line x1="348.0" y1="189" x2="348.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="348.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">0.6</text>
  <line x1="444.0" y1="189" x2="444.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="444.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">0.8</text>
  <line x1="540.0" y1="189" x2="540.0" y2="203" stroke="#e2e8f0" stroke-width="2"/>
  <text x="540.0" y="222" fill="#94a3b8" font-size="13" text-anchor="middle">1.0</text>
  <text x="60" y="180" fill="#94a3b8" font-size="13">t = 0 · noise</text>
  <text x="540" y="180" fill="#38bdf8" font-size="13" text-anchor="end">t = 1 · 데이터</text>
  <text x="300" y="246" fill="#e2e8f0" font-size="13" text-anchor="middle">n = 5 의 예: v_θ 를 t = 0, 0.2, 0.4, 0.6, 0.8 에서 한 번씩 부른다</text>
  <text x="30" y="280" fill="#94a3b8" font-size="13">sampler</text>
  <text x="240" y="280" fill="#94a3b8" font-size="13">network 호출</text>
  <text x="350" y="280" fill="#94a3b8" font-size="13">특징</text>
  <text x="30" y="306" fill="#e2e8f0" font-size="14">DDPM (Ho 등)</text>
  <text x="240" y="306" fill="#f59e0b" font-size="14">1000 번</text>
  <text x="350" y="306" fill="#94a3b8" font-size="13">단계마다 새 noise 를 더한다</text>
  <text x="30" y="330" fill="#e2e8f0" font-size="14">flow matching · Euler</text>
  <text x="240" y="330" fill="#f59e0b" font-size="14">n 번</text>
  <text x="350" y="330" fill="#94a3b8" font-size="13">noise 없이 ODE 를 따라간다</text>
  <text x="30" y="354" fill="#e2e8f0" font-size="14">flow matching · Heun</text>
  <text x="240" y="354" fill="#f59e0b" font-size="14">2n 번</text>
  <text x="350" y="354" fill="#94a3b8" font-size="13">한 step 에 두 번 불러 평균한다</text>
</svg>
