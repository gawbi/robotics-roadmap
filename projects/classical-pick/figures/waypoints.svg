  <circle cx="170" cy="150" r="11" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="170" y="155" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text>
  <circle cx="170" cy="255" r="11" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="170" y="260" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <circle cx="170" cy="90" r="11" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
