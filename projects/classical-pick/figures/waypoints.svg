  <circle cx="430" cy="255" r="11" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="430" y="260" fill="#e2e8f0" font-size="13" text-anchor="middle">5</text>
  <circle cx="430" cy="150" r="11" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
