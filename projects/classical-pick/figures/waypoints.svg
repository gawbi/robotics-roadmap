  <line x1="161.0" y1="164.0" x2="161.0" y2="241.0" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="170.0" y1="241.0" x2="170.0" y2="104.0" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="184.0" y1="90.0" x2="416.0" y2="90.0" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="430.0" y1="104.0" x2="430.0" y2="241.0" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
