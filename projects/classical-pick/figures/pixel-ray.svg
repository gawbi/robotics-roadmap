<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>카메라 중심에서 pixel 을 지나는 ray 를 cube 윗면 높이의 평면과 교차시키면 depth 영상 없이 cube 의 위치가 나온다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="20" width="350" height="300" rx="8" fill="#0e1628" stroke="#1e293b"/>
  <line x1="30" y1="280" x2="360" y2="280" stroke="#475569" stroke-width="2"/>
  <text x="40" y="300" fill="#64748b" font-size="13">작업대</text>
  <rect x="300" y="232" width="46" height="48" fill="#1f2a44" stroke="#f59e0b" stroke-width="2"/>
  <line x1="30" y1="232" x2="360" y2="232" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="36" y="226" fill="#f59e0b" font-size="13">평면 z = h (cube 윗면)</text>
  <polygon points="160,40 200,40 192,62 168,62" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="180" cy="62" r="3.5" fill="#e2e8f0"/>
  <text x="210" y="52" fill="#e2e8f0" font-size="13">카메라 중심 c</text>
  <line x1="180" y1="66" x2="180" y2="276" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="186" y="150" fill="#64748b" font-size="13">광축</text>
  <line x1="140" y1="92" x2="220" y2="92" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="205" cy="92" r="4" fill="#38bdf8"/>
  <text x="214" y="88" fill="#38bdf8" font-size="13">pixel (u, v)</text>
  <line x1="180" y1="62" x2="322" y2="229" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <circle cx="323" cy="232" r="5" fill="#34d399"/>
  <text x="258" y="192" fill="#38bdf8" font-size="13">ray</text>
  <line x1="112" y1="62" x2="112" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="106" y1="62" x2="118" y2="62" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="106" y1="232" x2="118" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="102" y="152" fill="#e2e8f0" font-size="15" text-anchor="end">Z</text>
  <line x1="180" y1="308" x2="323" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="180" y1="302" x2="180" y2="314" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="323" y1="302" x2="323" y2="314" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="323" y1="236" x2="323" y2="300" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="252" y="300" fill="#e2e8f0" font-size="15" text-anchor="middle">X</text>
  <text x="388" y="50" fill="#e2e8f0" font-size="14">광축이 수직 아래를 볼 때</text>
  <text x="388" y="76" fill="#94a3b8" font-size="13">닮은 삼각형으로</text>
  <text x="388" y="102" fill="#38bdf8" font-size="15">X = Z · (u − cₓ) / fₓ</text>
  <text x="388" y="144" fill="#94a3b8" font-size="13">예: Z = 0.57 m</text>
  <text x="388" y="166" fill="#94a3b8" font-size="13">u − cₓ = 100 px</text>
  <text x="388" y="188" fill="#94a3b8" font-size="13">fₓ ≈ 579 px</text>
  <text x="388" y="214" fill="#e2e8f0" font-size="14">→ X ≈ 9.8 cm</text>
  <circle cx="394" cy="252" r="5" fill="#34d399"/>
  <text x="406" y="257" fill="#e2e8f0" font-size="13">ray 와 평면의 교점</text>
  <text x="406" y="277" fill="#94a3b8" font-size="13">= cube 윗면 중심</text>
</svg>
