<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MNIST 용 작은 U-Net 의 한 가지 구성과 shape. 해상도를 두 번 줄였다 되살리고, 같은 해상도끼리 skip connection 으로 잇는다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="40" width="150" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95.0" y="59.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x_t</text>
  <text x="95.0" y="76.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 1, 32, 32)</text>
  <line x1="95" y1="84" x2="95" y2="104" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="106" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="95.0" y="125.0" fill="#e2e8f0" font-size="14" text-anchor="middle">conv + res block</text>
  <text x="95.0" y="142.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 64, 32, 32)</text>
  <line x1="95" y1="150" x2="95" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105" y="165" fill="#94a3b8" font-size="13">down</text>
  <rect x="50" y="172" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="125.0" y="191.0" fill="#e2e8f0" font-size="14" text-anchor="middle">res block</text>
  <text x="125.0" y="208.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 128, 16, 16)</text>
  <line x1="125" y1="216" x2="125" y2="236" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="135" y="231" fill="#94a3b8" font-size="13">down</text>
  <rect x="80" y="238" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="155.0" y="257.0" fill="#e2e8f0" font-size="14" text-anchor="middle">res block</text>
  <text x="155.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 256, 8, 8)</text>
  <line x1="230" y1="260" x2="362" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="252" fill="#94a3b8" font-size="13" text-anchor="middle">middle</text>
  <rect x="370" y="238" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="445.0" y="257.0" fill="#e2e8f0" font-size="14" text-anchor="middle">res block</text>
  <text x="445.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 256, 8, 8)</text>
  <line x1="445" y1="238" x2="445" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="455" y="233" fill="#94a3b8" font-size="13">up</text>
  <rect x="400" y="172" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="475.0" y="191.0" fill="#e2e8f0" font-size="14" text-anchor="middle">res block</text>
  <text x="475.0" y="208.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 128, 16, 16)</text>
  <line x1="475" y1="172" x2="475" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="167" fill="#94a3b8" font-size="13">up</text>
  <rect x="430" y="106" width="150" height="44" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="505.0" y="125.0" fill="#e2e8f0" font-size="14" text-anchor="middle">res block</text>
  <text x="505.0" y="142.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 64, 32, 32)</text>
  <line x1="505" y1="106" x2="505" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="40" width="150" height="44" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="505.0" y="59.0" fill="#e2e8f0" font-size="14" text-anchor="middle">예측 noise</text>
  <text x="505.0" y="76.0" fill="#94a3b8" font-size="13" text-anchor="middle">(B, 1, 32, 32)</text>
  <path d="M200,194 L398,194" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M170,128 L428,128" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="300" y="186" fill="#f59e0b" font-size="13" text-anchor="middle">skip connection</text>
  <text x="300" y="120" fill="#f59e0b" font-size="13" text-anchor="middle">skip connection</text>
  <rect x="200" y="316" width="200" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="300.0" y="335.0" fill="#e2e8f0" font-size="14" text-anchor="middle">time embedding</text>
  <text x="300.0" y="352.0" fill="#94a3b8" font-size="13" text-anchor="middle">t → sin·cos → MLP</text>
  <text x="20" y="340" fill="#94a3b8" font-size="13">모든 res block 의 feature map 에</text>
  <text x="20" y="358" fill="#94a3b8" font-size="13">channel 별로 더한다</text>
  <text x="410" y="340" fill="#94a3b8" font-size="13">skip 은 같은 해상도의</text>
  <text x="410" y="358" fill="#94a3b8" font-size="13">feature 를 이어 붙인다</text>
</svg>
