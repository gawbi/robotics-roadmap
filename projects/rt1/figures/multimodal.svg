<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 장면에서 시연이 장애물 왼쪽과 오른쪽으로 갈라지면, MSE 로 학습한 policy 는 두 정답의 평균인 가운데로 가서 장애물에 부딪힌다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-acc2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-acc3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="145" y="120" width="90" height="56" rx="6" fill="#334155" stroke="#475569"/>
  <text x="190.0" y="153.0" fill="#e2e8f0" font-size="14" text-anchor="middle">장애물</text>
  <circle cx="190" cy="290" r="8" fill="#e2e8f0"/>
  <text x="204.0" y="295.0" fill="#94a3b8" font-size="13" text-anchor="start">시작</text>
  <circle cx="190" cy="40" r="8" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <text x="204.0" y="45.0" fill="#34d399" font-size="13" text-anchor="start">목표</text>
  <path d="M190,282 C180,240 90,220 100,148 C105,90 170,70 190,48" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <path d="M190,282 C200,240 290,220 280,148 C275,90 210,70 190,48" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="190" y1="282" x2="190" y2="182" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-err)"/>
  <text x="86.0" y="225.0" fill="#f59e0b" font-size="13" text-anchor="end">시연 A</text>
  <text x="294.0" y="225.0" fill="#f59e0b" font-size="13" text-anchor="start">시연 B</text>
  <text x="340.0" y="92.0" fill="#f59e0b" font-size="14" text-anchor="start">시연 A: 첫 action −1 (왼쪽으로)</text>
  <text x="340.0" y="122.0" fill="#f59e0b" font-size="14" text-anchor="start">시연 B: 첫 action +1 (오른쪽으로)</text>
  <text x="340.0" y="152.0" fill="#f87171" font-size="14" text-anchor="start">MSE 의 최적 출력: 평균 0 (직진)</text>
  <text x="340.0" y="196.0" fill="#94a3b8" font-size="13" text-anchor="start">두 시연이 반반이면 같은 관측의</text>
  <text x="340.0" y="216.0" fill="#94a3b8" font-size="13" text-anchor="start">정답 평균은 (−1 + 1) / 2 = 0 이고,</text>
  <text x="340.0" y="236.0" fill="#94a3b8" font-size="13" text-anchor="start">이 행동은 어느 시연에도 없다</text>
</svg>
