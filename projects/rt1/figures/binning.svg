<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>action binning: PushT 의 x 범위 0~512 px 를 256 칸으로 나누면 한 칸은 2 px 이고, 100.7 은 50 번 칸이 되며 되돌리면 칸의 중심 101.0 이다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-acc2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-acc3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="40" y1="74" x2="560" y2="74" stroke="#94a3b8" stroke-width="2"/>
  <line x1="40.0" y1="68" x2="40.0" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40.0" y="98.0" fill="#94a3b8" font-size="13" text-anchor="middle">0</text>
  <line x1="170.0" y1="68" x2="170.0" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170.0" y="98.0" fill="#94a3b8" font-size="13" text-anchor="middle">128</text>
  <line x1="300.0" y1="68" x2="300.0" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300.0" y="98.0" fill="#94a3b8" font-size="13" text-anchor="middle">256</text>
  <line x1="430.0" y1="68" x2="430.0" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430.0" y="98.0" fill="#94a3b8" font-size="13" text-anchor="middle">384</text>
  <line x1="560.0" y1="68" x2="560.0" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560.0" y="98.0" fill="#94a3b8" font-size="13" text-anchor="middle">512</text>
  <text x="40.0" y="40.0" fill="#e2e8f0" font-size="14" text-anchor="start">x 차원의 범위 0 ~ 512 px  →  256 칸, 한 칸의 폭 2 px</text>
  <rect x="136.3" y="62" width="12" height="24" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M136.3,86 L70,122 M148.3,86 L530,122" stroke="#334155" stroke-width="1.5"/>
  <rect x="70.0" y="126" width="92.0" height="48" fill="#38bdf8" fill-opacity="0.06" stroke="#475569"/>
  <text x="116.0" y="194.0" fill="#94a3b8" font-size="13" text-anchor="middle">bin 48</text>
  <text x="70.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">96</text>
  <rect x="162.0" y="126" width="92.0" height="48" fill="#38bdf8" fill-opacity="0.06" stroke="#475569"/>
  <text x="208.0" y="194.0" fill="#94a3b8" font-size="13" text-anchor="middle">bin 49</text>
  <text x="162.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">98</text>
  <rect x="254.0" y="126" width="92.0" height="48" fill="#38bdf8" fill-opacity="0.28" stroke="#475569"/>
  <text x="300.0" y="194.0" fill="#38bdf8" font-size="13" text-anchor="middle">bin 50</text>
  <text x="254.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">100</text>
  <rect x="346.0" y="126" width="92.0" height="48" fill="#38bdf8" fill-opacity="0.06" stroke="#475569"/>
  <text x="392.0" y="194.0" fill="#94a3b8" font-size="13" text-anchor="middle">bin 51</text>
  <text x="346.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">102</text>
  <rect x="438.0" y="126" width="92.0" height="48" fill="#38bdf8" fill-opacity="0.06" stroke="#475569"/>
  <text x="484.0" y="194.0" fill="#94a3b8" font-size="13" text-anchor="middle">bin 52</text>
  <text x="438.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">104</text>
  <text x="530.0" y="118.0" fill="#94a3b8" font-size="13" text-anchor="middle">106</text>
  <line x1="286.2" y1="126" x2="286.2" y2="174" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="300.0" cy="150" r="6" fill="#34d399"/>
  <text x="30.0" y="238.0" fill="#f59e0b" font-size="14" text-anchor="start">encode: a = 100.7 → ⌊256 × 100.7 / 512⌋ = 50 번 bin</text>
  <text x="30.0" y="262.0" fill="#34d399" font-size="14" text-anchor="start">decode: bin 50 → 칸의 중심 0 + (50 + 0.5) × 2 = 101.0</text>
  <text x="30.0" y="284.0" fill="#94a3b8" font-size="13" text-anchor="start">되돌린 값의 오차는 0.3 px 로, 칸 폭의 절반인 1 px 를 넘지 않는다</text>
</svg>
