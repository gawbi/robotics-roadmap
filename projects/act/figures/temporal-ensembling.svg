  <text x="30.0" y="268.0" fill="#94a3b8" font-size="13" text-anchor="start">지금 실행할 action = Σ wᵢ · (시각 t 에 대한 i 번째 예측) / Σ wᵢ,  wᵢ = exp(−m i), m = 0.01</text>
  <text x="30.0" y="288.0" fill="#94a3b8" font-size="13" text-anchor="start">chunk 하나의 길이는 k 지만 그림에는 앞부분만 그렸다</text>
