<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>cross-entropy method: 분포에서 후보를 뽑아 점수를 매기고, 점수 상위 후보로 평균과 표준편차를 다시 맞추기를 되풀이하면 분포가 좋은 action 쪽으로 좁아진다</title>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- shared axis labels -->
  <text x="300" y="286" fill="#94a3b8" font-size="13" text-anchor="middle">가로축은 action 값, 주황 점은 점수 상위 후보(elite), 곡선은 다음 반복의 sampling 분포</text>

  <!-- iteration 1 -->
  <text x="24" y="52" fill="#e2e8f0" font-size="14">반복 1</text>
  <line x1="100" y1="80" x2="560" y2="80" stroke="#475569"/>
  <path d="M100 79 C 200 40, 280 30, 330 30 S 460 40, 560 79" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <g fill="#94a3b8">
    <circle cx="130" cy="80" r="4"/><circle cx="175" cy="80" r="4"/><circle cx="220" cy="80" r="4"/><circle cx="262" cy="80" r="4"/>
    <circle cx="300" cy="80" r="4"/><circle cx="340" cy="80" r="4"/><circle cx="505" cy="80" r="4"/><circle cx="535" cy="80" r="4"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="380" cy="80" r="5"/><circle cx="415" cy="80" r="5"/><circle cx="440" cy="80" r="5"/><circle cx="470" cy="80" r="5"/>
  </g>

  <!-- iteration 2 -->
  <text x="24" y="132" fill="#e2e8f0" font-size="14">반복 2</text>
  <line x1="100" y1="160" x2="560" y2="160" stroke="#475569"/>
  <path d="M330 159 C 380 130, 405 108, 426 108 S 472 130, 522 159" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <g fill="#94a3b8">
    <circle cx="352" cy="160" r="4"/><circle cx="372" cy="160" r="4"/><circle cx="392" cy="160" r="4"/><circle cx="495" cy="160" r="4"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="420" cy="160" r="5"/><circle cx="436" cy="160" r="5"/><circle cx="452" cy="160" r="5"/><circle cx="470" cy="160" r="5"/>
  </g>

  <!-- iteration 3 -->
  <text x="24" y="212" fill="#e2e8f0" font-size="14">반복 3</text>
  <line x1="100" y1="240" x2="560" y2="240" stroke="#475569"/>
  <path d="M410 239 C 430 210, 438 190, 446 190 S 462 210, 482 239" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <g fill="#f59e0b">
    <circle cx="436" cy="240" r="5"/><circle cx="446" cy="240" r="5"/><circle cx="456" cy="240" r="5"/>
  </g>
  <line x1="446" y1="180" x2="446" y2="246" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="454" y="182" fill="#34d399" font-size="13">최종 평균</text>

  <text x="24" y="96" fill="#94a3b8" font-size="13">넓게 뽑기</text>
  <text x="24" y="176" fill="#94a3b8" font-size="13">elite 로 다시 맞춤</text>
  <text x="24" y="256" fill="#94a3b8" font-size="13">좁아진 분포</text>
</svg>
