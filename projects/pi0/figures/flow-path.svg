<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>flow matching 의 직선 경로. τ = 0 의 noise ε 와 τ = 1 의 action A 를 잇는 직선 위의 점 A^τ 에서 network 는 기울기 A − ε 를 맞힌다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70" y="40" width="310" height="250" fill="#0e1628" stroke="#1e293b"/>
  <line x1="70" y1="218.57142857142856" x2="380" y2="218.57142857142856" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="62" y="223.57142857142856" fill="#64748b" font-size="13" text-anchor="end">0</text>
  <text x="62" y="80.71428571428572" fill="#64748b" font-size="13" text-anchor="end">2</text>
  <text x="62" y="259.2857142857143" fill="#64748b" font-size="13" text-anchor="end">−0.5</text>
  <text x="70" y="310" fill="#94a3b8" font-size="13" text-anchor="middle">τ = 0</text>
  <text x="380" y="310" fill="#94a3b8" font-size="13" text-anchor="middle">τ = 1</text>
  <text x="163.0" y="310" fill="#94a3b8" font-size="13" text-anchor="middle">0.3</text>
  <line x1="70" y1="254.28571428571428" x2="380" y2="75.71428571428572" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="70.0" cy="254.3" r="3" fill="#38bdf8"/>
  <circle cx="101.0" cy="236.4" r="3" fill="#38bdf8"/>
  <circle cx="132.0" cy="218.6" r="3" fill="#38bdf8"/>
  <circle cx="163.0" cy="200.7" r="3" fill="#38bdf8"/>
  <circle cx="194.0" cy="182.9" r="3" fill="#38bdf8"/>
  <circle cx="225.0" cy="165.0" r="3" fill="#38bdf8"/>
  <circle cx="256.0" cy="147.1" r="3" fill="#38bdf8"/>
  <circle cx="287.0" cy="129.3" r="3" fill="#38bdf8"/>
  <circle cx="318.0" cy="111.4" r="3" fill="#38bdf8"/>
  <circle cx="349.0" cy="93.6" r="3" fill="#38bdf8"/>
  <circle cx="380.0" cy="75.7" r="3" fill="#38bdf8"/>
  <circle cx="70.0" cy="254.3" r="7" fill="#f87171"/>
  <circle cx="380.0" cy="75.7" r="7" fill="#34d399"/>
  <circle cx="163.0" cy="200.7" r="7" fill="#f59e0b"/>
  <line x1="163.0" y1="200.71428571428572" x2="233.0" y2="160.39170506912444" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="82" y="276.2857142857143" fill="#f87171" font-size="13">noise ε = −0.5</text>
  <text x="372" y="61.71428571428572" fill="#34d399" font-size="13" text-anchor="end">action A = 2.0</text>
  <text x="177.0" y="224.71428571428572" fill="#f59e0b" font-size="13">A^τ = 0.25</text>
  <text x="400" y="62" fill="#e2e8f0" font-size="14">action 한 차원의 예</text>
  <text x="400" y="92" fill="#38bdf8" font-size="14">A^τ = τ A + (1 − τ) ε</text>
  <text x="400" y="114" fill="#94a3b8" font-size="13">= 0.3·2.0 + 0.7·(−0.5)</text>
  <text x="400" y="134" fill="#94a3b8" font-size="13">= 0.25</text>
  <text x="400" y="170" fill="#e2e8f0" font-size="14">정답 velocity</text>
  <text x="400" y="194" fill="#f59e0b" font-size="14">A − ε = 2.5</text>
  <text x="400" y="216" fill="#94a3b8" font-size="13">= 직선의 기울기</text>
  <text x="400" y="252" fill="#e2e8f0" font-size="13">Euler δ = 0.1 로 10 번:</text>
  <text x="400" y="274" fill="#94a3b8" font-size="13">−0.5 + 10 × 0.1 × 2.5 = 2.0</text>
</svg>
