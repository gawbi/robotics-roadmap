<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>이 과제의 π0 구조. freeze 한 SmolVLM 이 이미지·지시문에서 prefix 를 한 번 뽑고, action expert 가 state·noisy action token 과 τ 를 받아 prefix 를 cross-attention 으로 보며 velocity 를 낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15" y="30" width="260" height="150" rx="10" fill="#0e1628" stroke="#94a3b8" stroke-width="2"/>
  <text x="145" y="54" fill="#e2e8f0" font-size="14" text-anchor="middle">SmolVLM (freeze, bf16)</text>
  <text x="145" y="74" fill="#64748b" font-size="13" text-anchor="middle">requires_grad = False</text>
  <rect x="30" y="92" width="110" height="30" rx="3" fill="#38bdf8"/>
  <text x="85.0" y="112.0" fill="#0b1220" font-size="13" text-anchor="middle">이미지 2 장</text>
  <rect x="150" y="92" width="110" height="30" rx="3" fill="#334155"/>
  <text x="205.0" y="112.0" fill="#e2e8f0" font-size="13" text-anchor="middle">지시문</text>
  <text x="145" y="146" fill="#94a3b8" font-size="13" text-anchor="middle">hidden_states[layer]</text>
  <text x="145" y="166" fill="#e2e8f0" font-size="13" text-anchor="middle">→ prefix (B, L, 576)</text>
  <rect x="15" y="200" width="260" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="145" y="226" fill="#38bdf8" font-size="14" text-anchor="middle">prefix 캐시</text>
  <text x="145" y="248" fill="#94a3b8" font-size="13" text-anchor="middle">관측 하나에 한 번만 계산</text>
  <line x1="145" y1="182" x2="145" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="30" width="285" height="234" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="442" y="54" fill="#f59e0b" font-size="14" text-anchor="middle">ActionExpert (학습)</text>
  <rect x="316" y="70" width="40" height="28" rx="3" fill="#34d399"/>
  <text x="336.0" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">s</text>
  <rect x="362" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="376.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">a</text>
  <rect x="395" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="409.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">a</text>
  <rect x="428" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="442.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">a</text>
  <rect x="461" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="475.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">a</text>
  <rect x="494" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="508.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">a</text>
  <rect x="527" y="70" width="29" height="28" rx="3" fill="#f59e0b"/>
  <text x="541.5" y="89.0" fill="#0b1220" font-size="13" text-anchor="middle">…</text>
  <text x="330" y="116" fill="#34d399" font-size="13" text-anchor="middle">state</text>
  <text x="460" y="116" fill="#f59e0b" font-size="13" text-anchor="middle">noisy action H = 50 개</text>
  <text x="442" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">+ τ embedding</text>
  <rect x="316" y="152" width="252" height="60" rx="10" fill="#0e1628" stroke="#94a3b8" stroke-width="2"/>
  <text x="442" y="174" fill="#e2e8f0" font-size="13" text-anchor="middle">ExpertLayer × 8</text>
  <text x="442" y="196" fill="#94a3b8" font-size="13" text-anchor="middle">self-attn → cross-attn → MLP</text>
  <text x="442" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">→ velocity (B, 50, 7)</text>
  <line x1="277" y1="232" x2="312" y2="190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="294" y="290" fill="#94a3b8" font-size="13" text-anchor="middle">cross-attention: action token 이 query, prefix 가 key·value</text>
  <text x="300" y="322" fill="#e2e8f0" font-size="13" text-anchor="middle">VLM 은 바뀌지 않고, 학습하는 parameter 는 action expert 에만 있다</text>
  <text x="300" y="344" fill="#64748b" font-size="13" text-anchor="middle">576 = SmolVLM-256M 의 hidden 크기, 7 = LIBERO action 차원</text>
</svg>
