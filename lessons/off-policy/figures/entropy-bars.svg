<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>action 두 개의 확률이 0.5 와 0.5 이면 entropy 0.693, 0.9 와 0.1 이면 0.325, 1 과 0 이면 0 이다. 고르게 섞을수록 entropy 가 크다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="30.0" y1="200.0" x2="210.0" y2="200.0" stroke="#475569" stroke-width="1"/>
  <rect x="60.0" y="135.0" width="50.0" height="65.0" rx="3" fill="#38bdf8" fill-opacity="0.9" stroke="none" stroke-width="1.5"/>
  <text x="85.0" y="127.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.5</text>
  <text x="85.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">왼쪽</text>
  <rect x="130.0" y="135.0" width="50.0" height="65.0" rx="3" fill="#f59e0b" fill-opacity="0.9" stroke="none" stroke-width="1.5"/>
  <text x="155.0" y="127.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.5</text>
  <text x="155.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">오른쪽</text>
  <text x="120.0" y="246.0" fill="#34d399" font-size="14" text-anchor="middle">entropy = 0.693</text>
  <line x1="240.0" y1="200.0" x2="420.0" y2="200.0" stroke="#475569" stroke-width="1"/>
  <rect x="270.0" y="83.0" width="50.0" height="117.0" rx="3" fill="#38bdf8" fill-opacity="0.9" stroke="none" stroke-width="1.5"/>
  <text x="295.0" y="75.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.9</text>
  <text x="295.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">왼쪽</text>
  <rect x="340.0" y="187.0" width="50.0" height="13.0" rx="3" fill="#f59e0b" fill-opacity="0.9" stroke="none" stroke-width="1.5"/>
  <text x="365.0" y="179.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.1</text>
  <text x="365.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">오른쪽</text>
  <text x="330.0" y="246.0" fill="#34d399" font-size="14" text-anchor="middle">entropy = 0.325</text>
  <line x1="450.0" y1="200.0" x2="630.0" y2="200.0" stroke="#475569" stroke-width="1"/>
  <rect x="480.0" y="70.0" width="50.0" height="130.0" rx="3" fill="#38bdf8" fill-opacity="0.9" stroke="none" stroke-width="1.5"/>
  <text x="505.0" y="62.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1</text>
  <text x="505.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">왼쪽</text>
  <text x="575.0" y="192.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <text x="575.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">오른쪽</text>
  <text x="540.0" y="246.0" fill="#34d399" font-size="14" text-anchor="middle">entropy = 0</text>
  <text x="330.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">고르게 섞을수록 entropy 가 크다</text>
</svg>
