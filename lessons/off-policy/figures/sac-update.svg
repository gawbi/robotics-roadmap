<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SAC update 한 번의 순서: critic, actor, temperature, soft target 을 차례로 고친다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="32" fill="#e2e8f0" font-size="15">replay buffer 에서 뽑은 batch (s, a, r, s′, d) 하나로</text>

  <rect x="30" y="48" width="540" height="58" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="48" y="72" fill="#7cb4d8" font-size="15">① critic</text>
  <text x="150" y="72" fill="#e2e8f0" font-size="13">a′ ~ π<tspan baseline-shift="sub" font-size="12">φ</tspan>(·|s′),  y = r + γ(1 − d)(min<tspan baseline-shift="sub" font-size="12">i</tspan> Q<tspan baseline-shift="sub" font-size="12">θ̄i</tspan>(s′, a′) − α log π<tspan baseline-shift="sub" font-size="12">φ</tspan>(a′|s′))</text>
  <text x="150" y="94" fill="#94a3b8" font-size="13">Q<tspan baseline-shift="sub" font-size="12">θ1</tspan>(s, a), Q<tspan baseline-shift="sub" font-size="12">θ2</tspan>(s, a) 를 각각 y 쪽으로 regression</text>

  <line x1="300" y1="106" x2="300" y2="118" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="122" width="540" height="58" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="48" y="146" fill="#d6aa62" font-size="15">② actor</text>
  <text x="150" y="146" fill="#e2e8f0" font-size="13">ã ~ π<tspan baseline-shift="sub" font-size="12">φ</tspan>(·|s) 를 reparameterization 으로 뽑아</text>
  <text x="150" y="168" fill="#94a3b8" font-size="13">α log π<tspan baseline-shift="sub" font-size="12">φ</tspan>(ã|s) − min<tspan baseline-shift="sub" font-size="12">i</tspan> Q<tspan baseline-shift="sub" font-size="12">θi</tspan>(s, ã) 를 줄인다</text>

  <line x1="300" y1="180" x2="300" y2="192" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="196" width="540" height="58" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="48" y="220" fill="#7fc4a2" font-size="15">③ temperature</text>
  <text x="170" y="220" fill="#e2e8f0" font-size="13">policy entropy 가 target −dim 𝒜 보다 낮으면 α 를 키우고,</text>
  <text x="170" y="242" fill="#94a3b8" font-size="13">높으면 줄인다</text>

  <line x1="300" y1="254" x2="300" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="270" width="540" height="46" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="48" y="299" fill="#e2e8f0" font-size="15">④ soft target</text>
  <text x="170" y="299" fill="#e2e8f0" font-size="13">θ̄<tspan baseline-shift="sub" font-size="12">i</tspan> ← τ θ<tspan baseline-shift="sub" font-size="12">i</tspan> + (1 − τ) θ̄<tspan baseline-shift="sub" font-size="12">i</tspan>   (예: τ = 0.005)</text>
</svg>
