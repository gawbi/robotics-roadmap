  <rect x="226.0" y="267.0" width="54.0" height="24.0" rx="4" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
  <text x="253.0" y="284.0" fill="#e2e8f0" font-size="10" text-anchor="middle">데이터 1</text>
  <rect x="286.0" y="267.0" width="54.0" height="24.0" rx="4" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
  <text x="313.0" y="284.0" fill="#e2e8f0" font-size="10" text-anchor="middle">데이터 2</text>
  <rect x="346.0" y="267.0" width="54.0" height="24.0" rx="4" fill="#111a2e" stroke="#64748b" stroke-width="1.2"/>
  <text x="373.0" y="284.0" fill="#e2e8f0" font-size="10" text-anchor="middle">데이터 3</text>
  <rect x="406.0" y="267.0" width="54.0" height="24.0" rx="4" fill="#111a2e" stroke="#a99ad6" stroke-width="1.2"/>
  <text x="433.0" y="284.0" fill="#e2e8f0" font-size="10" text-anchor="middle">사람 시연</text>
  <line x1="468.0" y1="268.0" x2="528.0" y2="268.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-muted)"/>
  <text x="498.0" y="260.0" fill="#94a3b8" font-size="11" text-anchor="middle">무작위 batch</text>
  <rect x="532.0" y="245.0" width="118.0" height="46.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="591.0" y="273.0" fill="#e2e8f0" font-size="12" text-anchor="middle">update</text>
  <path d="M591,293 C591,340 85,340 85,295" fill="none" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#ar-green)"/>
  <text x="338.0" y="361.0" fill="#7fc4a2" font-size="11" text-anchor="middle">고친 policy 로 계속 모으며, 예전 데이터도 그대로 둔다</text>
