  <rect x="470.0" y="56.0" width="92.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="516.0" y="81.0" fill="#e2e8f0" font-size="12" text-anchor="middle">policy 3</text>
  <line x1="516.0" y1="98.0" x2="516.0" y2="122.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="470.0" y="126.0" width="92.0" height="36.0" rx="6" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="516.0" y="149.0" fill="#e2e8f0" font-size="12" text-anchor="middle">데이터 3</text>
  <text x="600.0" y="149.0" fill="#94a3b8" font-size="16" text-anchor="middle">⋯</text>
  <text x="76.0" y="180.0" fill="#d88b8b" font-size="11" text-anchor="middle">policy 가 바뀌면 버림</text>
  <text x="296.0" y="180.0" fill="#d88b8b" font-size="11" text-anchor="middle">policy 가 바뀌면 버림</text>
  <line x1="20.0" y1="196.0" x2="660.0" y2="196.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="20.0" y="222.0" fill="#7fc4a2" font-size="14" text-anchor="start">off-policy: 어느 policy 로 모은 데이터든 쌓아 두고 다시 쓴다</text>
  <rect x="30.0" y="245.0" width="110.0" height="46.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
