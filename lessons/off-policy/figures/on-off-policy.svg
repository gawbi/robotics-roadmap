<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 on-policy 로, policy 1 로 모은 데이터로 policy 2 를 만들면 그 데이터를 버리고 policy 2 로 새로 모은다. 아래는 off-policy 로, 어느 policy 로 모은 데이터든 사람 시연이든 replay buffer 에 계속 쌓아 두고 무작위로 뽑아 다시 쓴다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="678" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="32.0" fill="#d6aa62" font-size="14" text-anchor="start">on-policy: 지금 policy 로 모은 데이터만 쓴다</text>
  <rect x="30.0" y="56.0" width="92.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="76.0" y="81.0" fill="#e2e8f0" font-size="12" text-anchor="middle">policy 1</text>
  <line x1="76.0" y1="98.0" x2="76.0" y2="122.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
