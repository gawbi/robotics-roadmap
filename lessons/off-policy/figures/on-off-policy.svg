  <rect x="250.0" y="126.0" width="92.0" height="36.0" rx="6" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="296.0" y="149.0" fill="#64748b" font-size="12" text-anchor="middle">데이터 2</text>
  <line x1="258.0" y1="132.0" x2="334.0" y2="156.0" stroke="#d88b8b" stroke-width="2"/>
