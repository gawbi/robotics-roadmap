<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>진짜 Q 가 모두 1 인데 추정값 두 개에 ±0.3 의 잡음이 섞이는 네 경우. 두 값 가운데 큰 값을 고르면 평균 1.15 로 진짜보다 크고, 작은 값을 고르면 평균 0.85 로 진짜보다 조금 작다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70.0" y1="250.0" x2="445.0" y2="250.0" stroke="#475569" stroke-width="1"/>
  <text x="64.0" y="254.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <line x1="70.0" y1="180.0" x2="445.0" y2="180.0" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="184.0" fill="#64748b" font-size="12" text-anchor="end">0.5</text>
  <line x1="70.0" y1="110.0" x2="445.0" y2="110.0" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="114.0" fill="#64748b" font-size="12" text-anchor="end">1</text>
  <line x1="70.0" y1="40.0" x2="445.0" y2="40.0" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="44.0" fill="#64748b" font-size="12" text-anchor="end">1.5</text>
  <line x1="70.0" y1="250.0" x2="445.0" y2="250.0" stroke="#475569" stroke-width="1"/>
  <text x="64.0" y="28.0" fill="#94a3b8" font-size="12" text-anchor="start">추정값</text>
  <line x1="70.0" y1="110.0" x2="445.0" y2="110.0" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="451.0" y="114.0" fill="#e2e8f0" font-size="11" text-anchor="start">진짜 1</text>
  <rect x="88.9" y="68.0" width="26.0" height="182.0" rx="2" fill="#38bdf8" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="101.9" y="62.0" fill="#e2e8f0" font-size="11" text-anchor="middle">1.3</text>
  <rect x="118.9" y="68.0" width="26.0" height="182.0" rx="2" fill="#a78bfa" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="131.9" y="62.0" fill="#e2e8f0" font-size="11" text-anchor="middle">1.3</text>
  <text x="116.9" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">경우 1</text>
  <text x="116.9" y="286.0" fill="#64748b" font-size="10" text-anchor="middle">큰 값 1.3 / 작은 값 1.3</text>
  <rect x="182.6" y="68.0" width="26.0" height="182.0" rx="2" fill="#38bdf8" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="195.6" y="62.0" fill="#e2e8f0" font-size="11" text-anchor="middle">1.3</text>
  <rect x="212.6" y="152.0" width="26.0" height="98.0" rx="2" fill="#a78bfa" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="225.6" y="146.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.7</text>
  <text x="210.6" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">경우 2</text>
  <text x="210.6" y="286.0" fill="#64748b" font-size="10" text-anchor="middle">큰 값 1.3 / 작은 값 0.7</text>
  <rect x="276.4" y="152.0" width="26.0" height="98.0" rx="2" fill="#38bdf8" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="289.4" y="146.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.7</text>
  <rect x="306.4" y="68.0" width="26.0" height="182.0" rx="2" fill="#a78bfa" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="319.4" y="62.0" fill="#e2e8f0" font-size="11" text-anchor="middle">1.3</text>
  <text x="304.4" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">경우 3</text>
  <text x="304.4" y="286.0" fill="#64748b" font-size="10" text-anchor="middle">큰 값 1.3 / 작은 값 0.7</text>
  <rect x="370.1" y="152.0" width="26.0" height="98.0" rx="2" fill="#38bdf8" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="383.1" y="146.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.7</text>
  <rect x="400.1" y="152.0" width="26.0" height="98.0" rx="2" fill="#a78bfa" fill-opacity="0.85" stroke="none" stroke-width="1.5"/>
  <text x="413.1" y="146.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.7</text>
  <text x="398.1" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">경우 4</text>
  <text x="398.1" y="286.0" fill="#64748b" font-size="10" text-anchor="middle">큰 값 0.7 / 작은 값 0.7</text>
  <rect x="490.0" y="50.0" width="155.0" height="210.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="502.0" y="66.0" width="14.0" height="14.0" rx="2" fill="#38bdf8" stroke="none" stroke-width="1.5"/>
  <text x="524.0" y="78.0" fill="#e2e8f0" font-size="12" text-anchor="start">추정값 1</text>
  <rect x="502.0" y="90.0" width="14.0" height="14.0" rx="2" fill="#a78bfa" stroke="none" stroke-width="1.5"/>
  <text x="524.0" y="102.0" fill="#e2e8f0" font-size="12" text-anchor="start">추정값 2</text>
  <text x="502.0" y="140.0" fill="#f87171" font-size="12" text-anchor="start">큰 값의 평균</text>
  <text x="502.0" y="160.0" fill="#94a3b8" font-size="11" text-anchor="start">(1.3+1.3+1.3+0.7) ÷ 4</text>
  <text x="502.0" y="178.0" fill="#f87171" font-size="13" text-anchor="start">= 1.15</text>
  <text x="502.0" y="210.0" fill="#34d399" font-size="12" text-anchor="start">작은 값의 평균</text>
  <text x="502.0" y="230.0" fill="#94a3b8" font-size="11" text-anchor="start">(1.3+0.7+0.7+0.7) ÷ 4</text>
  <text x="502.0" y="248.0" fill="#34d399" font-size="13" text-anchor="start">= 0.85</text>
</svg>
