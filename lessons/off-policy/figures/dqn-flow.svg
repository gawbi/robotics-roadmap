<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>DQN 의 데이터 흐름: environment 에서 모은 transition 을 replay buffer 에 쌓고, 무작위 batch 로 target network 의 target 과 online network 의 Q 값을 비교해 학습한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- action loop on top -->
  <path d="M500 76 V40 H100 V76" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="300" y="32" fill="#f59e0b" font-size="14" text-anchor="middle">ε-greedy 로 고른 action</text>

  <!-- environment -->
  <rect x="30" y="80" width="140" height="64" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="100" y="108" fill="#e2e8f0" font-size="16" text-anchor="middle">environment</text>
  <text x="100" y="129" fill="#94a3b8" font-size="13" text-anchor="middle">CartPole-v1</text>

  <!-- buffer -->
  <line x1="170" y1="112" x2="226" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="80" width="150" height="64" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="305" y="104" fill="#e2e8f0" font-size="15" text-anchor="middle">replay buffer</text>
  <g fill="#1e293b" stroke="#475569">
    <rect x="246" y="116" width="18" height="16"/><rect x="266" y="116" width="18" height="16"/>
    <rect x="286" y="116" width="18" height="16"/><rect x="306" y="116" width="18" height="16"/>
    <rect x="326" y="116" width="18" height="16"/><rect x="346" y="116" width="18" height="16"/>
  </g>
  <rect x="306" y="116" width="18" height="16" fill="#38bdf8" fill-opacity="0.5" stroke="#38bdf8"/>
  <text x="200" y="164" fill="#94a3b8" font-size="13" text-anchor="middle">(s, a, r, s′, d)</text>

  <!-- online network -->
  <rect x="430" y="80" width="140" height="64" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="500" y="108" fill="#e2e8f0" font-size="16" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="12">θ</tspan></text>
  <text x="500" y="129" fill="#94a3b8" font-size="13" text-anchor="middle">online network</text>

  <!-- sample batch -->
  <line x1="305" y1="144" x2="305" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="178" fill="#94a3b8" font-size="13">무작위 batch</text>

  <!-- target network -->
  <rect x="190" y="204" width="230" height="76" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="305" y="230" fill="#e2e8f0" font-size="15" text-anchor="middle">target network Q<tspan baseline-shift="sub" font-size="12">θ̄</tspan></text>
  <text x="305" y="256" fill="#e2e8f0" font-size="13" text-anchor="middle">y = r + γ(1 − d) max<tspan baseline-shift="sub" font-size="12">a′</tspan> Q<tspan baseline-shift="sub" font-size="12">θ̄</tspan>(s′, a′)</text>

  <!-- periodic copy -->
  <path d="M470 144 L400 202" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="458" y="180" fill="#94a3b8" font-size="13">주기적으로 θ 를 복사</text>

  <!-- loss -->
  <line x1="420" y1="242" x2="446" y2="242" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="450" y="210" width="125" height="64" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="512" y="236" fill="#e2e8f0" font-size="14" text-anchor="middle">loss</text>
  <text x="512" y="258" fill="#e2e8f0" font-size="13" text-anchor="middle">(y − Q<tspan baseline-shift="sub" font-size="12">θ</tspan>(s, a))²</text>
  <path d="M575 242 H588 V112 H574" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="300" y="312" fill="#94a3b8" font-size="13" text-anchor="middle">gradient 는 Q<tspan baseline-shift="sub" font-size="12">θ</tspan> 로만 흐르고, target network 는 복사될 때만 바뀐다</text>
</svg>
