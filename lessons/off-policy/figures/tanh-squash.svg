<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>tanh-squashed Gaussian actor 가 action 하나를 뽑는 과정: noise ε 로 u 를 만들고 tanh 로 (−1, 1) 안에 묶은 뒤 env 범위로 늘린다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <rect x="20" y="50" width="120" height="84" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="80" y="76" fill="#e2e8f0" font-size="14" text-anchor="middle">actor network</text>
  <text x="80" y="100" fill="#7cb4d8" font-size="14" text-anchor="middle">μ = 0.2</text>
  <text x="80" y="121" fill="#7cb4d8" font-size="14" text-anchor="middle">σ = 0.5</text>

  <line x1="140" y1="92" x2="174" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="178" y="50" width="120" height="84" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="238" y="76" fill="#e2e8f0" font-size="14" text-anchor="middle">u = μ + σ·ε</text>
  <text x="238" y="100" fill="#d6aa62" font-size="13" text-anchor="middle">ε = 0.6 ~ N(0, 1)</text>
  <text x="238" y="121" fill="#e2e8f0" font-size="14" text-anchor="middle">u = 0.5</text>

  <line x1="298" y1="92" x2="332" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="336" y="50" width="110" height="84" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="391" y="76" fill="#e2e8f0" font-size="14" text-anchor="middle">a = tanh(u)</text>
  <text x="391" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">항상 (−1, 1)</text>
  <text x="391" y="121" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 0.462</text>

  <line x1="446" y1="92" x2="480" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="484" y="50" width="100" height="84" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="534" y="76" fill="#e2e8f0" font-size="14" text-anchor="middle">env 범위</text>
  <text x="534" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">[−2, 2] 이면 ×2</text>
  <text x="534" y="121" fill="#7fc4a2" font-size="14" text-anchor="middle">0.924</text>

  <text x="238" y="166" fill="#94a3b8" font-size="13" text-anchor="middle">ε 만 무작위라서</text>
  <text x="238" y="185" fill="#94a3b8" font-size="13" text-anchor="middle">gradient 가 μ, σ 로 흐른다</text>
  <text x="391" y="166" fill="#94a3b8" font-size="13" text-anchor="middle">log-prob 에</text>
  <text x="391" y="185" fill="#94a3b8" font-size="13" text-anchor="middle">tanh 보정 항이 붙는다</text>
  <text x="300" y="228" fill="#94a3b8" font-size="13" text-anchor="middle">숫자는 Pendulum-v1 (action 범위 [−2, 2]) 에서 action 하나를 뽑는 예</text>
</svg>
