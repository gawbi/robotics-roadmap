<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Q(x) = w·x 에서 x = 2 의 target 0.9 로 w 를 0.2 에서 0.4 로 고치면, 학습에 쓰지 않은 x = 1 과 x = 3 의 Q 도 0.2 → 0.4, 0.6 → 1.2 로 함께 바뀐다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70.0" y1="260.0" x2="420.0" y2="260.0" stroke="#475569" stroke-width="1"/>
  <text x="64.0" y="264.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <line x1="70.0" y1="228.6" x2="420.0" y2="228.6" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="232.6" fill="#64748b" font-size="12" text-anchor="end">0.2</text>
  <line x1="70.0" y1="197.1" x2="420.0" y2="197.1" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="201.1" fill="#64748b" font-size="12" text-anchor="end">0.4</text>
  <line x1="70.0" y1="165.7" x2="420.0" y2="165.7" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="169.7" fill="#64748b" font-size="12" text-anchor="end">0.6</text>
  <line x1="70.0" y1="134.3" x2="420.0" y2="134.3" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="138.3" fill="#64748b" font-size="12" text-anchor="end">0.8</text>
  <line x1="70.0" y1="102.9" x2="420.0" y2="102.9" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="106.9" fill="#64748b" font-size="12" text-anchor="end">1</text>
  <line x1="70.0" y1="71.4" x2="420.0" y2="71.4" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="75.4" fill="#64748b" font-size="12" text-anchor="end">1.2</text>
  <line x1="70.0" y1="40.0" x2="420.0" y2="40.0" stroke="#1e293b" stroke-width="1"/>
  <text x="64.0" y="44.0" fill="#64748b" font-size="12" text-anchor="end">1.4</text>
  <text x="70.0" y="278.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="176.1" y="278.0" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="282.1" y="278.0" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="388.2" y="278.0" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
  <line x1="70.0" y1="260.0" x2="420.0" y2="260.0" stroke="#475569" stroke-width="1"/>
  <text x="245.0" y="298.0" fill="#94a3b8" font-size="12" text-anchor="middle">x (위치)</text>
  <text x="64.0" y="28.0" fill="#94a3b8" font-size="12" text-anchor="start">Q</text>
  <polyline points="70.0,260.0 420.0,156.3" fill="none" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="6 4"/>
  <polyline points="70.0,260.0 420.0,52.6" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <circle cx="176.1" cy="228.6" r="5" fill="#94a3b8" stroke="none" stroke-width="2"/>
  <circle cx="176.1" cy="197.1" r="5" fill="#38bdf8" stroke="none" stroke-width="2"/>
  <line x1="176.1" y1="221.6" x2="176.1" y2="205.1" stroke="#f87171" stroke-width="2" marker-end="url(#ar-red)"/>
  <circle cx="282.1" cy="197.1" r="5" fill="#94a3b8" stroke="none" stroke-width="2"/>
  <circle cx="282.1" cy="134.3" r="5" fill="#38bdf8" stroke="none" stroke-width="2"/>
  <circle cx="388.2" cy="165.7" r="5" fill="#94a3b8" stroke="none" stroke-width="2"/>
  <circle cx="388.2" cy="71.4" r="5" fill="#38bdf8" stroke="none" stroke-width="2"/>
  <line x1="388.2" y1="158.7" x2="388.2" y2="79.4" stroke="#f87171" stroke-width="2" marker-end="url(#ar-red)"/>
  <line x1="282.1" y1="190.1" x2="282.1" y2="142.3" stroke="#34d399" stroke-width="2" marker-end="url(#ar-green)"/>
  <circle cx="282.1" cy="118.6" r="6" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
  <text x="270.1" y="112.6" fill="#f59e0b" font-size="12" text-anchor="end">target 0.9</text>
  <rect x="440.0" y="50.0" width="145.0" height="200.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="452.0" y1="72.0" x2="472.0" y2="72.0" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="480.0" y="76.0" fill="#e2e8f0" font-size="12" text-anchor="start">고치기 전 w = 0.2</text>
  <line x1="452.0" y1="96.0" x2="472.0" y2="96.0" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="480.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="start">고친 뒤 w = 0.4</text>
  <text x="452.0" y="130.0" fill="#34d399" font-size="12" text-anchor="start">x = 2: 0.4 → 0.8</text>
  <text x="452.0" y="150.0" fill="#34d399" font-size="11" text-anchor="start">(학습한 자리)</text>
  <text x="452.0" y="178.0" fill="#f87171" font-size="12" text-anchor="start">x = 1: 0.2 → 0.4</text>
  <text x="452.0" y="198.0" fill="#f87171" font-size="12" text-anchor="start">x = 3: 0.6 → 1.2</text>
  <text x="452.0" y="218.0" fill="#f87171" font-size="11" text-anchor="start">(따라서 바뀐 자리)</text>
</svg>
