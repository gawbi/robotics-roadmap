<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SERL 의 실물 학습 구조. actor process 가 policy 로 1초에 10 번 손끝 목표를 내고 impedance controller 가 1초에 1000 번 따라간다. transition 은 learner 의 RL buffer 로 가고, 시연 20 개는 demo buffer 에 있다. learner 는 두 buffer 에서 반씩 뽑은 batch 로 update 를 여러 번 하고 새 weight 를 actor 에 보낸다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="262" y="16" width="400" height="286" rx="10" fill="none" stroke="#a99ad6" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="278" y="292" fill="#a99ad6" font-size="13" text-anchor="start">learner process (GPU)</text>
  <rect x="20" y="40" width="170" height="64" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="105.0" y="68.0" fill="#e2e8f0" font-size="15" text-anchor="middle">Franka 팔</text>
  <text x="105.0" y="87.0" fill="#94a3b8" font-size="13" text-anchor="middle">impedance 1000 Hz</text>
  <rect x="20" y="200" width="170" height="64" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="105.0" y="228.0" fill="#e2e8f0" font-size="15" text-anchor="middle">actor process</text>
  <text x="105.0" y="247.0" fill="#94a3b8" font-size="13" text-anchor="middle">policy 10 Hz</text>
  <path d="M60,198 L60,108" fill="none" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#arrow-sky)"/>
  <text x="68" y="146" fill="#7cb4d8" font-size="12" text-anchor="start">손끝 목표</text>
  <text x="68" y="162" fill="#7cb4d8" font-size="12" text-anchor="start">1초에 10 번</text>
  <path d="M160,106 L160,196" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="168" y="146" fill="#94a3b8" font-size="12" text-anchor="start">관측</text>
  <rect x="292" y="200" width="160" height="64" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="372.0" y="228.0" fill="#e2e8f0" font-size="15" text-anchor="middle">RL buffer</text>
  <text x="372.0" y="247.0" fill="#94a3b8" font-size="13" text-anchor="middle">로봇이 모은 transition</text>
  <rect x="478" y="200" width="164" height="64" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="560.0" y="228.0" fill="#e2e8f0" font-size="15" text-anchor="middle">demo buffer</text>
  <text x="560.0" y="247.0" fill="#94a3b8" font-size="13" text-anchor="middle">시연 20 개</text>
  <path d="M192,248 L288,248" fill="none" stroke="#7fc4a2" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="226" y="240" fill="#7fc4a2" font-size="12" text-anchor="middle">transition</text>
  <rect x="330" y="112" width="274" height="56" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="467.0" y="136.0" fill="#e2e8f0" font-size="15" text-anchor="middle">batch</text>
  <text x="467.0" y="155.0" fill="#94a3b8" font-size="13" text-anchor="middle">RL buffer 절반 + 시연 절반</text>
  <rect x="330" y="32" width="274" height="56" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="467.0" y="56.0" fill="#e2e8f0" font-size="15" text-anchor="middle">SAC 계열 update (RLPD)</text>
  <text x="467.0" y="75.0" fill="#94a3b8" font-size="13" text-anchor="middle">environment step 마다 여러 번</text>
  <path d="M372,198 L400,172" fill="none" stroke="#7fc4a2" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M560,198 L534,172" fill="none" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M467,110 L467,92" fill="none" stroke="#a99ad6" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M328,60 L228,60 L228,216 L194,216" fill="none" stroke="#a99ad6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="222" y="190" fill="#a99ad6" font-size="12" text-anchor="end">새 weight</text>
  <text x="340" y="330" fill="#94a3b8" font-size="13" text-anchor="middle">actor 와 learner 를 따로 계산해서, update 를 여러 번 하는 동안에도 로봇은 1초에 10 번 계속 움직인다</text>
</svg>
