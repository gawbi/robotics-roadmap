<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>목표 각도에서 torque 까지. 실제 ANYmal 은 motor 안의 PD controller, 전류 PID, FOC, 기어, spring 을 차례로 거쳐 torque 가 나온다. legged_gym 의 ANYmal C simulation 은 이 과정을 각도 오차와 각속도를 받는 LSTM actuator network 로 흉내 낸다. Hwangbo 등의 actuator network 는 torque 예측 오차가 0.740 N·m 로, 이상적인 PD 식의 3.55 N·m 보다 작았다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#7cb4d8" font-size="14" text-anchor="start">실제 ANYmal 의 관절 하나 (series elastic actuator)</text>
  <rect x="20" y="44" width="118" height="56" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="79" y="67" fill="#e2e8f0" font-size="13" text-anchor="middle">목표 각도</text>
  <text x="79" y="87" fill="#94a3b8" font-size="11" text-anchor="middle">policy 출력</text>
  <line x1="138" y1="72" x2="160" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="160" y="44" width="118" height="56" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="219" y="67" fill="#e2e8f0" font-size="13" text-anchor="middle">PD</text>
  <text x="219" y="87" fill="#94a3b8" font-size="11" text-anchor="middle">→ 목표 torque</text>
  <line x1="278" y1="72" x2="300" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="300" y="44" width="118" height="56" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="359" y="67" fill="#e2e8f0" font-size="13" text-anchor="middle">전류 PID</text>
  <text x="359" y="87" fill="#94a3b8" font-size="11" text-anchor="middle">→ 목표 전류</text>
  <line x1="418" y1="72" x2="440" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="440" y="44" width="118" height="56" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="499" y="67" fill="#e2e8f0" font-size="13" text-anchor="middle">FOC</text>
  <text x="499" y="87" fill="#94a3b8" font-size="11" text-anchor="middle">→ motor 전압</text>
  <line x1="558" y1="72" x2="580" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="580" y="44" width="118" height="56" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="639" y="67" fill="#e2e8f0" font-size="13" text-anchor="middle">기어 + spring</text>
  <text x="639" y="87" fill="#94a3b8" font-size="11" text-anchor="middle">→ 관절 torque</text>
  <text x="20" y="124" fill="#94a3b8" font-size="12" text-anchor="start">단계마다 지연과 내부 상태가 있어서 같은 목표 각도라도 앞서 일어난 일에 따라 torque 가 달라진다</text>
  <text x="20" y="160" fill="#d6aa62" font-size="14" text-anchor="start">legged_gym 의 ANYmal C simulation</text>
  <rect x="20" y="174" width="180" height="70" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="110" y="198" fill="#e2e8f0" font-size="13" text-anchor="middle">입력 2 개 (관절마다)</text>
  <text x="110" y="218" fill="#94a3b8" font-size="12" text-anchor="middle">목표 − 지금 각도</text>
  <text x="110" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">지금 각속도</text>
  <line x1="200" y1="209" x2="236" y2="209" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="240" y="174" width="190" height="70" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="335" y="198" fill="#e2e8f0" font-size="13" text-anchor="middle">LSTM actuator network</text>
  <text x="335" y="218" fill="#94a3b8" font-size="12" text-anchor="middle">2 층, 층마다 hidden 8 개</text>
  <text x="335" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">이전 step 의 기억을 들고 감</text>
  <line x1="430" y1="209" x2="466" y2="209" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="470" y="174" width="100" height="70" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="520" y="204" fill="#e2e8f0" font-size="13" text-anchor="middle">torque</text>
  <text x="520" y="224" fill="#94a3b8" font-size="12" text-anchor="middle">관절 12 개</text>
  <line x1="570" y1="209" x2="600" y2="209" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="604" y="174" width="96" height="70" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="652" y="204" fill="#e2e8f0" font-size="13" text-anchor="middle">physics</text>
  <text x="652" y="224" fill="#94a3b8" font-size="12" text-anchor="middle">0.005 초</text>
  <text x="20" y="282" fill="#a99ad6" font-size="14" text-anchor="start">torque 예측 오차 (Hwangbo 등 2019, ANYmal 실측 데이터)</text>
  <text x="20" y="308" fill="#94a3b8" font-size="12" text-anchor="start"></text>
  <text x="300" y="308" fill="#94a3b8" font-size="12" text-anchor="start">검증 데이터</text>
  <text x="480" y="308" fill="#94a3b8" font-size="12" text-anchor="start">보행 policy 실험</text>
  <text x="20" y="336" fill="#e2e8f0" font-size="13" text-anchor="start">이상적인 PD 식</text>
  <text x="300" y="336" fill="#d88b8b" font-size="13" text-anchor="start">3.55 N·m</text>
  <text x="480" y="336" fill="#d88b8b" font-size="13" text-anchor="start">5.74 N·m</text>
  <text x="20" y="362" fill="#e2e8f0" font-size="13" text-anchor="start">actuator network (MLP)</text>
  <text x="300" y="362" fill="#7fc4a2" font-size="13" text-anchor="start">0.740 N·m</text>
  <text x="480" y="362" fill="#7fc4a2" font-size="13" text-anchor="start">0.966 N·m</text>
  <text x="20" y="388" fill="#64748b" font-size="12" text-anchor="start">torque 측정 자체의 분해능은 0.2 N·m 다</text>
</svg>
