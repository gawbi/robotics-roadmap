<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 296" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>episode 마다 다시 뽑는 물리값. nominal 학습은 모든 episode 를 μ 1.0, 질량 6 kg 에서 돌리고, domain randomization 학습은 episode 1 은 μ 0.70·질량 6.6 kg·지연 1 step, episode 2 는 μ 1.15·5.1 kg·지연 0, episode 3 은 μ 0.60·6.12 kg·지연 2 처럼 매번 새로 뽑는다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="658" height="294" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="44" fill="#e2e8f0" font-size="15" text-anchor="start">nominal</text>
  <rect x="150" y="24" width="150" height="32" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="45" fill="#94a3b8" font-size="13" text-anchor="middle">ep 1 · 늘 같은 값</text>
  <rect x="315" y="24" width="150" height="32" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="390" y="45" fill="#94a3b8" font-size="13" text-anchor="middle">ep 2 · 늘 같은 값</text>
  <rect x="480" y="24" width="150" height="32" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="555" y="45" fill="#94a3b8" font-size="13" text-anchor="middle">ep 3 · 늘 같은 값</text>
  <text x="24" y="76" fill="#94a3b8" font-size="12" text-anchor="start">μ 1.0 · 6 kg · 모터 ×1.0 · 지연 0</text>
  <text x="24" y="112" fill="#38bdf8" font-size="15" text-anchor="start">randomized</text>
  <text x="24" y="134" fill="#94a3b8" font-size="13" text-anchor="start">reset 마다</text>
  <text x="24" y="152" fill="#94a3b8" font-size="13" text-anchor="start">새로 뽑는다</text>
  <rect x="150" y="94" width="150" height="128" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="162" y="116" fill="#e2e8f0" font-size="13" text-anchor="start">ep 1</text>
  <text x="162" y="140" fill="#e2e8f0" font-size="12" text-anchor="start">μ 0.70</text>
  <text x="162" y="161" fill="#e2e8f0" font-size="12" text-anchor="start">질량 ×1.10 = 6.6 kg</text>
  <text x="162" y="182" fill="#e2e8f0" font-size="12" text-anchor="start">모터 ×0.95</text>
  <text x="162" y="203" fill="#e2e8f0" font-size="12" text-anchor="start">지연 1 step</text>
  <rect x="315" y="94" width="150" height="128" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="327" y="116" fill="#e2e8f0" font-size="13" text-anchor="start">ep 2</text>
  <text x="327" y="140" fill="#e2e8f0" font-size="12" text-anchor="start">μ 1.15</text>
  <text x="327" y="161" fill="#e2e8f0" font-size="12" text-anchor="start">질량 ×0.85 = 5.1 kg</text>
  <text x="327" y="182" fill="#e2e8f0" font-size="12" text-anchor="start">모터 ×1.05</text>
  <text x="327" y="203" fill="#e2e8f0" font-size="12" text-anchor="start">지연 0</text>
  <rect x="480" y="94" width="150" height="128" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="492" y="116" fill="#e2e8f0" font-size="13" text-anchor="start">ep 3</text>
  <text x="492" y="140" fill="#e2e8f0" font-size="12" text-anchor="start">μ 0.60</text>
  <text x="492" y="161" fill="#e2e8f0" font-size="12" text-anchor="start">질량 ×1.02 = 6.12 kg</text>
  <text x="492" y="182" fill="#e2e8f0" font-size="12" text-anchor="start">모터 ×0.92</text>
  <text x="492" y="203" fill="#e2e8f0" font-size="12" text-anchor="start">지연 2 step</text>
  <text x="24" y="256" fill="#e2e8f0" font-size="13" text-anchor="start">범위: μ 0.6–1.2, 몸통 질량 0.8–1.2 배, 모터 세기 0.9–1.1 배, 지연 0–2 step</text>
  <text x="24" y="278" fill="#94a3b8" font-size="13" text-anchor="start">배율은 늘 nominal 값(몸통 6 kg)에 곱한다. 지연 1 step = 0.02 초</text>
</svg>
