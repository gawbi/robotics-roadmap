<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>sim-to-real gap 의 다섯 가지 원인. 예로 든 값으로 마찰은 μ 1.0 대 0.7 이라 미는 힘 45 N 이 한계 42 N 을 넘고, 무릎 torque 가 20% 늘면 무릎이 0.06 rad 처지며, 명령은 0.02 초 늦게 닿고, 센서 값은 ±0.05 rad 흔들린다. actuator 는 이상적인 PD 식으로 예측한 torque 가 실제와 평균 3.55 N·m 어긋났다(Hwangbo 등 2019)</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="20" width="220" height="138" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="36" y="50" fill="#7cb4d8" font-size="15" text-anchor="start">마찰</text>
  <text x="36" y="80" fill="#e2e8f0" font-size="13" text-anchor="start">simulator μ 1.0 → 한계 60 N</text>
  <text x="36" y="106" fill="#e2e8f0" font-size="13" text-anchor="start">실제 μ 0.7 → 한계 42 N</text>
  <text x="36" y="132" fill="#94a3b8" font-size="13" text-anchor="start">미는 힘 45 N &gt; 42 N → 미끄러짐</text>
  <rect x="250" y="20" width="220" height="138" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="266" y="50" fill="#d6aa62" font-size="15" text-anchor="start">질량</text>
  <text x="266" y="80" fill="#e2e8f0" font-size="13" text-anchor="start">무릎 torque 20% 증가</text>
  <text x="266" y="106" fill="#e2e8f0" font-size="13" text-anchor="start">6 N·m → 7.2 N·m</text>
  <text x="266" y="132" fill="#94a3b8" font-size="13" text-anchor="start">1.2 ÷ K_p 20 = 0.06 rad 처짐</text>
  <rect x="480" y="20" width="220" height="138" rx="10" fill="#111a2e" stroke="#d88b8b" stroke-width="2"/>
  <text x="496" y="50" fill="#d88b8b" font-size="15" text-anchor="start">지연</text>
  <text x="496" y="80" fill="#e2e8f0" font-size="13" text-anchor="start">명령이 0.02 초(1 step) 늦게 닿음</text>
  <text x="496" y="106" fill="#e2e8f0" font-size="13" text-anchor="start">3 rad/s 로 돌면 0.06 rad 더 감</text>
  <text x="496" y="132" fill="#94a3b8" font-size="13" text-anchor="start">바로잡기가 흔들림으로 바뀜</text>
  <rect x="20" y="172" width="330" height="138" rx="10" fill="#111a2e" stroke="#a99ad6" stroke-width="2"/>
  <text x="36" y="202" fill="#a99ad6" font-size="15" text-anchor="start">센서 noise</text>
  <text x="36" y="232" fill="#e2e8f0" font-size="13" text-anchor="start">기울기가 ±0.05 rad 흔들림</text>
  <text x="36" y="258" fill="#e2e8f0" font-size="13" text-anchor="start">10 배로 반응하면 action ±0.5</text>
  <text x="36" y="284" fill="#94a3b8" font-size="13" text-anchor="start">서 있기만 해도 다리가 떨림</text>
  <rect x="370" y="172" width="330" height="138" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="386" y="202" fill="#7fc4a2" font-size="15" text-anchor="start">actuator 의 반응</text>
  <text x="386" y="232" fill="#e2e8f0" font-size="13" text-anchor="start">목표 각도 → torque 가 PD 식과 다름</text>
  <text x="386" y="258" fill="#e2e8f0" font-size="13" text-anchor="start">PD 식의 torque 예측 오차 평균 3.55 N·m</text>
  <text x="386" y="284" fill="#94a3b8" font-size="13" text-anchor="start">ANYmal 실측 (Hwangbo 등 2019)</text>
</svg>
