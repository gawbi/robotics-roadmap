  <text x="20" y="232" fill="#94a3b8" font-size="12" text-anchor="start">칸마다 episode 를 여러 번 돌려 평균 return 과 넘어짐 비율을 적는다. 실제 평가는 질량·μ·지연을 함께 바꾼다</text>
