<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>범위와 실제 값. 좁은 범위 0.95–1.05 는 실제 μ 0.7 을 담지 못하고, 0.6–1.2 는 담으며, 0.2–1.4 는 담지만 너무 넓어 걸음이 느려진다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="778" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70" y1="210" x2="470.0" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="70" y1="205" x2="70" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <line x1="120.0" y1="205" x2="120.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="120.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">0.2</text>
  <line x1="170.0" y1="205" x2="170.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="170.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">0.4</text>
  <line x1="220.0" y1="205" x2="220.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="220.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">0.6</text>
  <line x1="270.0" y1="205" x2="270.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="270.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">0.8</text>
  <line x1="320.0" y1="205" x2="320.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="320.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <line x1="370.0" y1="205" x2="370.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="370.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">1.2</text>
  <line x1="420.0" y1="205" x2="420.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="420.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">1.4</text>
  <line x1="470.0" y1="205" x2="470.0" y2="215" stroke="#94a3b8" stroke-width="1"/>
  <text x="470.0" y="232" fill="#94a3b8" font-size="12" text-anchor="middle">1.6</text>
  <text x="270.0" y="254" fill="#94a3b8" font-size="13" text-anchor="middle">바닥의 μ</text>
  <text x="16" y="75" fill="#e2e8f0" font-size="13" text-anchor="start">좁게</text>
  <rect x="307.5" y="61" width="25.0" height="18" rx="4" fill="#d88b8b" fill-opacity="0.35" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="486.0" y="75" fill="#d88b8b" font-size="13" text-anchor="start">A 를 배움 · 실제 바닥에서 미끄러짐</text>
  <text x="16" y="120" fill="#e2e8f0" font-size="13" text-anchor="start">알맞게</text>
  <rect x="220.0" y="106" width="150.0" height="18" rx="4" fill="#7fc4a2" fill-opacity="0.35" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="486.0" y="120" fill="#7fc4a2" font-size="13" text-anchor="start">C 를 배움 · 실제 바닥에서 0.35 m/s</text>
  <text x="16" y="165" fill="#e2e8f0" font-size="13" text-anchor="start">넓게</text>
  <rect x="120.0" y="151" width="300.0" height="18" rx="4" fill="#d6aa62" fill-opacity="0.35" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="486.0" y="165" fill="#d6aa62" font-size="13" text-anchor="start">D 를 배움 · 버티지만 0.10 m/s</text>
  <line x1="245.0" y1="40" x2="245.0" y2="210" stroke="#7cb4d8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="245.0" y="34" fill="#7cb4d8" font-size="13" text-anchor="middle">실제 μ 0.7</text>
  <line x1="320.0" y1="52" x2="320.0" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="324.0" y="48" fill="#94a3b8" font-size="12" text-anchor="start">nominal 1.0</text>
