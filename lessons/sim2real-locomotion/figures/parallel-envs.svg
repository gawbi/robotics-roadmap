  <text x="371" y="106" fill="#e2e8f0" font-size="14" text-anchor="middle">rollout</text>
  <text x="371" y="128" fill="#94a3b8" font-size="13" text-anchor="middle">4096 × 24</text>
  <text x="371" y="148" fill="#e2e8f0" font-size="13" text-anchor="middle">= 98,304 sample</text>
  <line x1="456" y1="120" x2="488" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-muted)"/>
  <rect x="492" y="80" width="168" height="80" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
