<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>legged_gym 의 지형 curriculum. 계단 지형은 단계 0 의 높이 5 cm 에서 단계 9 의 21.2 cm 까지 단계마다 1.8 cm 씩 높아진다. episode 가 끝날 때 출발점에서 4 m 넘게 갔으면 한 단계 위로, 명령 속도 × 20 초 × 0.5 보다 짧게 갔으면 한 단계 아래로 옮기고, 맨 위 단계를 넘으면 무작위 단계로 보낸다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#38bdf8" font-size="14" text-anchor="start">계단 지형의 단계 (8 m × 8 m 지형 한 칸)</text>
  <rect x="40" y="275.0" width="30" height="55.0" rx="3" fill="#0e1628" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="55.0" y="267.0" fill="#f59e0b" font-size="12" text-anchor="middle">5 cm</text>
  <rect x="78" y="255.2" width="30" height="74.8" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="93.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <rect x="116" y="235.4" width="30" height="94.6" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="131.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <rect x="154" y="215.6" width="30" height="114.4" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="169.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
  <rect x="192" y="195.8" width="30" height="134.2" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="207.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">4</text>
  <rect x="230" y="176.0" width="30" height="154.0" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="245.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">5</text>
  <text x="245.0" y="168.0" fill="#38bdf8" font-size="12" text-anchor="middle">14 cm</text>
  <rect x="268" y="156.2" width="30" height="173.8" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="283.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">6</text>
  <rect x="306" y="136.4" width="30" height="193.6" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="321.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">7</text>
  <rect x="344" y="116.6" width="30" height="213.4" rx="3" fill="#0e1628" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="359.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">8</text>
  <rect x="382" y="96.8" width="30" height="233.2" rx="3" fill="#0e1628" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="397.0" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">9</text>
  <text x="397.0" y="88.80000000000001" fill="#f59e0b" font-size="12" text-anchor="middle">21.2 cm</text>
  <text x="226" y="370" fill="#94a3b8" font-size="12" text-anchor="middle">단계 (계단 한 칸 높이 = 5 cm + 1.8 cm × 단계)</text>
  <rect x="440" y="50" width="260" height="82" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.8"/>
  <text x="454" y="76" fill="#34d399" font-size="14" text-anchor="start">한 단계 위로</text>
  <text x="454" y="100" fill="#e2e8f0" font-size="13" text-anchor="start">출발점에서 4 m 넘게 갔다</text>
  <text x="454" y="120" fill="#94a3b8" font-size="12" text-anchor="start">(지형 한 칸 8 m 의 절반)</text>
  <rect x="440" y="146" width="260" height="100" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.8"/>
  <text x="454" y="172" fill="#f87171" font-size="14" text-anchor="start">한 단계 아래로</text>
  <text x="454" y="196" fill="#e2e8f0" font-size="13" text-anchor="start">간 거리 &lt; 명령 속도 × 20 초 × 0.5</text>
  <text x="454" y="216" fill="#94a3b8" font-size="12" text-anchor="start">명령의 절반도 못 갔다</text>
  <text x="454" y="236" fill="#94a3b8" font-size="12" text-anchor="start">예: 0.3 m/s 면 3 m 보다 짧게</text>
  <rect x="440" y="260" width="260" height="70" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="454" y="286" fill="#a78bfa" font-size="14" text-anchor="start">맨 위 단계를 넘으면</text>
  <text x="454" y="310" fill="#e2e8f0" font-size="13" text-anchor="start">무작위 단계로 보낸다</text>
</svg>
