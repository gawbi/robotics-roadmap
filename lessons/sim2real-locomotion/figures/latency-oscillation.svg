<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>몸통 기울기의 변화. 지연이 없으면 4° 에서 한 step 만에 0° 로 돌아온다. 한 step 지연에 기울기 전체를 바로잡으면 4, 0, −4, −4, 0, 4 로 끝없이 흔들리고, 절반만 바로잡으면 4, 2, 0, −1, −1 로 흔들림이 줄어든다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="320" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="80" y1="150" x2="560" y2="150" stroke="#94a3b8" stroke-width="1"/>
  <text x="70" y="234" fill="#94a3b8" font-size="12" text-anchor="end">-4°</text>
  <line x1="80" y1="230" x2="560" y2="230" stroke="#334155" stroke-width="1"/>
  <text x="70" y="194" fill="#94a3b8" font-size="12" text-anchor="end">-2°</text>
  <line x1="80" y1="190" x2="560" y2="190" stroke="#334155" stroke-width="1"/>
  <text x="70" y="154" fill="#94a3b8" font-size="12" text-anchor="end">0°</text>
  <line x1="80" y1="150" x2="560" y2="150" stroke="#334155" stroke-width="1"/>
  <text x="70" y="114" fill="#94a3b8" font-size="12" text-anchor="end">2°</text>
  <line x1="80" y1="110" x2="560" y2="110" stroke="#334155" stroke-width="1"/>
  <text x="70" y="74" fill="#94a3b8" font-size="12" text-anchor="end">4°</text>
  <line x1="80" y1="70" x2="560" y2="70" stroke="#334155" stroke-width="1"/>
  <text x="80" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="140" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="200" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="260" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
  <text x="320" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">4</text>
  <text x="380" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">5</text>
  <text x="440" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">6</text>
  <text x="500" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">7</text>
  <text x="560" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">8</text>
  <polyline points="80,70 140,150 200,150 260,150 320,150 380,150 440,150 500,150 560,150" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="80" cy="70" r="3.5" fill="#94a3b8"/>
  <circle cx="140" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="200" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="260" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="320" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="380" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="440" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="500" cy="150" r="3.5" fill="#94a3b8"/>
  <circle cx="560" cy="150" r="3.5" fill="#94a3b8"/>
  <polyline points="80,70 140,150 200,230 260,230 320,150 380,70 440,70 500,150 560,230" fill="none" stroke="#f87171" stroke-width="2.5"/>
  <circle cx="80" cy="70" r="3.5" fill="#f87171"/>
  <circle cx="140" cy="150" r="3.5" fill="#f87171"/>
  <circle cx="200" cy="230" r="3.5" fill="#f87171"/>
  <circle cx="260" cy="230" r="3.5" fill="#f87171"/>
  <circle cx="320" cy="150" r="3.5" fill="#f87171"/>
  <circle cx="380" cy="70" r="3.5" fill="#f87171"/>
  <circle cx="440" cy="70" r="3.5" fill="#f87171"/>
  <circle cx="500" cy="150" r="3.5" fill="#f87171"/>
  <circle cx="560" cy="230" r="3.5" fill="#f87171"/>
  <polyline points="80,70 140,110 200,150 260,170 320,170 380,160.0 440,150 500,145.0 560,145.0" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <circle cx="80" cy="70" r="3.5" fill="#34d399"/>
  <circle cx="140" cy="110" r="3.5" fill="#34d399"/>
  <circle cx="200" cy="150" r="3.5" fill="#34d399"/>
  <circle cx="260" cy="170" r="3.5" fill="#34d399"/>
  <circle cx="320" cy="170" r="3.5" fill="#34d399"/>
  <circle cx="380" cy="160.0" r="3.5" fill="#34d399"/>
  <circle cx="440" cy="150" r="3.5" fill="#34d399"/>
  <circle cx="500" cy="145.0" r="3.5" fill="#34d399"/>
  <circle cx="560" cy="145.0" r="3.5" fill="#34d399"/>
  <line x1="40" y1="300" x2="64" y2="300" stroke="#94a3b8" stroke-width="3"/>
  <text x="70" y="304" fill="#e2e8f0" font-size="12" text-anchor="start">지연 없음, 전부 바로잡기</text>
  <line x1="245" y1="300" x2="269" y2="300" stroke="#f87171" stroke-width="3"/>
  <text x="275" y="304" fill="#e2e8f0" font-size="12" text-anchor="start">1 step 지연, 전부 바로잡기</text>
  <line x1="450" y1="300" x2="474" y2="300" stroke="#34d399" stroke-width="3"/>
  <text x="480" y="304" fill="#e2e8f0" font-size="12" text-anchor="start">1 step 지연, 절반만 바로잡기</text>
  <text x="320" y="272" fill="#94a3b8" font-size="13" text-anchor="middle">step</text>
  <text x="24" y="30" fill="#94a3b8" font-size="13" text-anchor="start">몸통 기울기 (°)</text>
</svg>
