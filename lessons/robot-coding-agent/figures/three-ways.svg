<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇을 다루는 세 방식. 학습한 policy 는 시연으로 학습한 network 가 사진에서 action 을 바로 내고 weight 가 남는다. 고정 harness 의 VLM agent 는 benchmark 저자들이 만든 harness 에 gripper 목표를 내고 episode 사이에 남는 것이 없다. HexaShell 은 agent 가 robo 명령과 직접 쓴 tool 로 로봇을 다루고 tool 코드와 unit test 가 남는다. RoboDojo 성공률은 VPP2 32.3%, GPT-6-Astra 고정 harness 22.5%, HexaShell 46.9% 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">로봇을 다루는 세 방식 (성공률은 RoboDojo 42 개 작업, 논문이 보고한 값)</text>
  <rect x="20.0" y="46.0" width="220.0" height="280.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="130.0" y="70.0" fill="#d6aa62" font-size="13.5" text-anchor="middle" font-weight="600">학습한 policy</text>
  <rect x="34.0" y="84.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130.0" y="104.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진 + 지시문</text>
  <line x1="130.0" y1="114.0" x2="130.0" y2="130.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="34.0" y="132.0" width="192.0" height="52.0" rx="6" fill="#0b1220" stroke="#d6aa62" stroke-width="1.6"/>
  <text x="130.0" y="153.0" fill="#e2e8f0" font-size="12" text-anchor="middle">시연 dataset 으로 학습</text>
  <text x="130.0" y="171.0" fill="#e2e8f0" font-size="12" text-anchor="middle">network 가 action 을 바로 냄</text>
  <line x1="130.0" y1="184.0" x2="130.0" y2="200.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="34.0" y="202.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="130.0" y="222.0" fill="#e2e8f0" font-size="12" text-anchor="middle">network 의 action</text>
  <text x="36.0" y="256.0" fill="#94a3b8" font-size="11.5" text-anchor="start">episode 사이에 남는 것</text>
  <text x="36.0" y="276.0" fill="#d6aa62" font-size="12.5" text-anchor="start" font-weight="600">학습한 weight</text>
  <text x="36.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">RoboDojo 성공률</text>
  <text x="36.0" y="318.0" fill="#d6aa62" font-size="12.5" text-anchor="start" font-weight="600">VPP2 32.3%</text>
  <rect x="250.0" y="46.0" width="220.0" height="280.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360.0" y="70.0" fill="#94a3b8" font-size="13.5" text-anchor="middle" font-weight="600">고정 harness 의 VLM agent</text>
  <rect x="264.0" y="84.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="360.0" y="104.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진 + 지시문</text>
  <line x1="360.0" y1="114.0" x2="360.0" y2="130.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="264.0" y="132.0" width="192.0" height="52.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="360.0" y="153.0" fill="#e2e8f0" font-size="12" text-anchor="middle">VLM 이 사진을 보고 결정</text>
  <text x="360.0" y="171.0" fill="#e2e8f0" font-size="12" text-anchor="middle">benchmark 저자들의 harness</text>
  <line x1="360.0" y1="184.0" x2="360.0" y2="200.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="264.0" y="202.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="360.0" y="222.0" fill="#e2e8f0" font-size="12" text-anchor="middle">gripper 목표</text>
  <text x="266.0" y="256.0" fill="#94a3b8" font-size="11.5" text-anchor="start">episode 사이에 남는 것</text>
  <text x="266.0" y="276.0" fill="#94a3b8" font-size="12.5" text-anchor="start" font-weight="600">없음</text>
  <text x="266.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">RoboDojo 성공률</text>
  <text x="266.0" y="318.0" fill="#94a3b8" font-size="12.5" text-anchor="start" font-weight="600">GPT-6-Astra 22.5%</text>
  <rect x="480.0" y="46.0" width="220.0" height="280.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="590.0" y="70.0" fill="#7cb4d8" font-size="13.5" text-anchor="middle" font-weight="600">HexaShell</text>
  <rect x="494.0" y="84.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590.0" y="104.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진 + 지시문</text>
  <line x1="590.0" y1="114.0" x2="590.0" y2="130.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="494.0" y="132.0" width="192.0" height="52.0" rx="6" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.6"/>
  <text x="590.0" y="153.0" fill="#e2e8f0" font-size="12" text-anchor="middle">coding agent 가 명령을 씀</text>
  <text x="590.0" y="171.0" fill="#e2e8f0" font-size="12" text-anchor="middle">실패하면 tool 을 고침</text>
  <line x1="590.0" y1="184.0" x2="590.0" y2="200.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="494.0" y="202.0" width="192.0" height="30.0" rx="6" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590.0" y="222.0" fill="#e2e8f0" font-size="12" text-anchor="middle">robo 명령 + tool</text>
  <text x="496.0" y="256.0" fill="#94a3b8" font-size="11.5" text-anchor="start">episode 사이에 남는 것</text>
  <text x="496.0" y="276.0" fill="#7cb4d8" font-size="12.5" text-anchor="start" font-weight="600">tool 코드와 unit test</text>
  <text x="496.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">RoboDojo 성공률</text>
  <text x="496.0" y="318.0" fill="#7cb4d8" font-size="12.5" text-anchor="start" font-weight="600">GPT-6-Astra 46.9%</text>
</svg>
