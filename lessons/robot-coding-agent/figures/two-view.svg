<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 번째 view. 왼쪽은 play Xylophone 에서 손에 든 말렛 머리를 머리 카메라 하나로 잴 때 실제 중심에서 22.9 mm 떨어진 추정이 나왔고, 오른쪽 손목 카메라의 ray 를 더해 triangulation 하자 2.7 mm 로 줄었으며 두 ray 사이 거리는 0.7 mm 였다. 오른쪽 막대는 Depth Anything V2 의 depth 오차 중앙값이 머리 카메라 41 mm, 손목 카메라 약 100 mm 이고, grasp 에 필요한 정확도가 약 10 mm 라는 것을 보인다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">손에 든 물체는 평면 위에 없다: 두 번째 view 로 잰다 (값은 논문의 play Xylophone 사례와 4.4 절)</text>
  <rect x="20.0" y="44.0" width="380.0" height="290.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <path d="M 56 84 L 80 84 L 80 102 L 56 102 z" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="68.0" y="76.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">머리 카메라</text>
  <path d="M 348 108 L 372 108 L 372 126 L 348 126 z" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="356.0" y="100.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">오른쪽 손목 카메라</text>
  <line x1="220.0" y1="252.0" x2="220.0" y2="296.0" stroke="#94a3b8" stroke-width="4"/>
  <text x="210.0" y="292.0" fill="#94a3b8" font-size="11" text-anchor="end">말렛 자루</text>
  <circle cx="220.0" cy="236.0" r="15" fill="#0b1220" stroke="#7fc4a2" stroke-width="1.8"/>
  <line x1="70.0" y1="96.0" x2="272.5" y2="285.0" stroke="#7cb4d8" stroke-width="1.6"/>
  <line x1="360.0" y1="120.0" x2="178.0" y2="270.8" stroke="#a99ad6" stroke-width="1.6"/>
  <circle cx="253.0" cy="266.8" r="15" fill="none" stroke="#d88b8b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="271.0" y="270.8" fill="#d88b8b" font-size="11.5" text-anchor="start">카메라 하나:</text>
  <text x="271.0" y="286.8" fill="#d88b8b" font-size="11.5" text-anchor="start">22.9 mm 어긋남</text>
  <text x="198.0" y="212.0" fill="#7fc4a2" font-size="12" text-anchor="end" font-weight="600">두 view: 2.7 mm</text>
  <text x="198.0" y="228.0" fill="#7fc4a2" font-size="11" text-anchor="end">두 ray 사이 0.7 mm</text>
  <text x="36.0" y="318.0" fill="#94a3b8" font-size="11" text-anchor="start">건반은 말렛 머리가 건반 위 1.0 ~ 3.6 cm 에 들어와야 친 것으로 센다</text>
  <rect x="412.0" y="44.0" width="288.0" height="290.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="428.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="start">Depth Anything V2 의 depth 오차</text>
  <text x="428.0" y="88.0" fill="#94a3b8" font-size="12" text-anchor="start">(중앙값, 탁자로 scale 을 맞춘 뒤)</text>
  <text x="498.0" y="136.5" fill="#e2e8f0" font-size="12" text-anchor="end">머리 카메라</text>
  <rect x="506.0" y="124.0" width="71.3" height="16.0" rx="3" fill="#64748b" stroke="#64748b" stroke-width="0"/>
  <text x="583.3" y="136.5" fill="#e2e8f0" font-size="11.5" text-anchor="start" font-weight="600">41 mm</text>
  <text x="498.0" y="198.5" fill="#e2e8f0" font-size="12" text-anchor="end">손목 카메라</text>
  <rect x="506.0" y="186.0" width="174.0" height="16.0" rx="3" fill="#64748b" stroke="#64748b" stroke-width="0"/>
  <text x="674.0" y="198.5" fill="#e2e8f0" font-size="11.5" text-anchor="end" font-weight="600">약 100 mm</text>
  <line x1="523.4" y1="100.0" x2="523.4" y2="248.0" stroke="#d6aa62" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="529.4" y="274.0" fill="#d6aa62" font-size="11.5" text-anchor="start">grasp·놓기에</text>
  <text x="529.4" y="292.0" fill="#d6aa62" font-size="11.5" text-anchor="start">필요한 정확도 약 10 mm</text>
  <line x1="506.0" y1="252.0" x2="680.0" y2="252.0" stroke="#1e293b" stroke-width="1"/>
  <text x="506.0" y="312.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">0 mm</text>
  <text x="593.0" y="312.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">50 mm</text>
  <text x="680.0" y="312.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">100 mm</text>
</svg>
