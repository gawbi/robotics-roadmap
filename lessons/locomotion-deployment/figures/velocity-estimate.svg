<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>몸통 속도를 다루는 세 방법. Kalman filter 는 IMU 로 예측하고 땅에 닿은 발의 kinematics 로 보정하며, 학습한 estimator 는 이력에서 속도·발 높이·접촉 확률을 내 actor 에 주고, G1 은 속도를 critic 에만 준다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">직접 잴 수 없는 몸통 속도를 다루는 세 방법</text>
  <rect x="20.0" y="46.0" width="220.0" height="300.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="130.0" y="70.0" fill="#7cb4d8" font-size="13.5" text-anchor="middle" font-weight="600">Kalman filter</text>
  <text x="130.0" y="88.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">Bloesch 2012</text>
  <rect x="34.0" y="104.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.4"/>
  <text x="130.0" y="125.0" fill="#e2e8f0" font-size="12" text-anchor="middle">IMU 가속도·회전 속도</text>
  <text x="130.0" y="143.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">예측</text>
  <line x1="130.0" y1="154.0" x2="130.0" y2="170.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="34.0" y="172.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1.4"/>
  <text x="130.0" y="193.0" fill="#e2e8f0" font-size="12" text-anchor="middle">관절 각도 → 발까지 vector</text>
  <text x="130.0" y="211.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">보정 (닿은 발은 고정)</text>
  <text x="130.0" y="258.0" fill="#7cb4d8" font-size="12" text-anchor="middle" font-weight="600">몸통 속도·자세·발 위치</text>
  <text x="36.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">약점</text>
  <text x="36.0" y="320.0" fill="#e2e8f0" font-size="12" text-anchor="start">미끄러짐, 접촉 판정 오류</text>
  <rect x="250.0" y="46.0" width="220.0" height="300.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360.0" y="70.0" fill="#7fc4a2" font-size="13.5" text-anchor="middle" font-weight="600">학습한 estimator</text>
  <text x="360.0" y="88.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">Ji 2022</text>
  <rect x="264.0" y="104.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="360.0" y="125.0" fill="#e2e8f0" font-size="12" text-anchor="middle">관절·IMU 이력</text>
  <text x="360.0" y="143.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">MLP estimator</text>
  <line x1="360.0" y1="154.0" x2="360.0" y2="170.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="264.0" y="172.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1.4"/>
  <text x="360.0" y="193.0" fill="#e2e8f0" font-size="12" text-anchor="middle">속도·발 높이·접촉 확률</text>
  <text x="360.0" y="211.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">actor 에 함께 입력</text>
  <text x="360.0" y="258.0" fill="#7fc4a2" font-size="12" text-anchor="middle" font-weight="600">PPO 와 동시에 학습</text>
  <text x="266.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">약점</text>
  <text x="266.0" y="320.0" fill="#e2e8f0" font-size="12" text-anchor="start">simulator 정답에 의존</text>
  <rect x="480.0" y="46.0" width="220.0" height="300.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="590.0" y="70.0" fill="#d6aa62" font-size="13.5" text-anchor="middle" font-weight="600">actor 에서 빼기</text>
  <text x="590.0" y="88.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">G1</text>
  <rect x="494.0" y="104.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#d6aa62" stroke-width="1.4"/>
  <text x="590.0" y="125.0" fill="#e2e8f0" font-size="12" text-anchor="middle">actor 47 칸</text>
  <text x="590.0" y="143.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">속도 없음, LSTM 이 짐작</text>
  <line x1="590.0" y1="154.0" x2="590.0" y2="170.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="494.0" y="172.0" width="192.0" height="50.0" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1.4"/>
  <text x="590.0" y="193.0" fill="#e2e8f0" font-size="12" text-anchor="middle">critic 50 칸</text>
  <text x="590.0" y="211.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">속도 포함, 학습 때만</text>
  <text x="590.0" y="258.0" fill="#d6aa62" font-size="12" text-anchor="middle" font-weight="600">배포 때 추정기 없음</text>
  <text x="496.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">약점</text>
  <text x="496.0" y="320.0" fill="#e2e8f0" font-size="12" text-anchor="start">이력에서 짐작해야 함</text>
</svg>
