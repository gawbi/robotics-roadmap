<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>몸통에서 본 중력 방향. 똑바로 서면 (0, 0, −1), 앞으로 10° 숙이면 (0.174, 0, −0.985) 로 앞쪽 성분이 생긴다. quaternion 칸 순서를 잘못 읽으면 같은 자세가 (−0.174, 0, −0.985) 로 읽혀 뒤로 젖힌 것처럼 보이지만, 똑바로 선 자세는 두 경우 모두 (0, 0, −1) 이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">옆에서 본 몸통과 중력 방향 (몸통 좌표: x 앞, z 위)</text>
  <rect x="20.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="130.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">똑바로 섬</text>
  <g transform="rotate(0 130 150)"><rect x="80" y="126" width="100" height="48" rx="8" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.6"/><line x1="130" y1="150" x2="174" y2="150" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><line x1="130" y1="150" x2="130" y2="110" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><text x="180" y="154" fill="#7cb4d8" font-size="11.5">x</text><text x="126" y="106" fill="#7cb4d8" font-size="11.5">z</text></g>
  <line x1="60.0" y1="140.0" x2="60.0" y2="200.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="54.0" y="216.0" fill="#d6aa62" font-size="11.5" text-anchor="middle">중력</text>
  <text x="130.0" y="236.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">몸통에서 본 중력</text>
  <text x="130.0" y="258.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">(0, 0, −1)</text>
  <rect x="250.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">앞으로 10° 숙임</text>
  <g transform="rotate(10 360 150)"><rect x="310" y="126" width="100" height="48" rx="8" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.6"/><line x1="360" y1="150" x2="404" y2="150" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><line x1="360" y1="150" x2="360" y2="110" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><text x="410" y="154" fill="#7cb4d8" font-size="11.5">x</text><text x="356" y="106" fill="#7cb4d8" font-size="11.5">z</text></g>
  <line x1="290.0" y1="140.0" x2="290.0" y2="200.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="284.0" y="216.0" fill="#d6aa62" font-size="11.5" text-anchor="middle">중력</text>
  <text x="360.0" y="236.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">몸통에서 본 중력</text>
  <text x="360.0" y="258.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">(0.174, 0, −0.985)</text>
  <rect x="480.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="590.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">칸 순서를 잘못 읽음</text>
  <g transform="rotate(-10 590 150)"><rect x="540" y="126" width="100" height="48" rx="8" fill="none" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="590.0" y="84.0" fill="#d88b8b" font-size="11" text-anchor="middle">policy 가 읽은 자세 (뒤로 젖힘)</text>
  <g transform="rotate(10 590 150)"><rect x="540" y="126" width="100" height="48" rx="8" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.6"/><line x1="590" y1="150" x2="634" y2="150" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><line x1="590" y1="150" x2="590" y2="110" stroke="#7cb4d8" stroke-width="1.6" marker-end="url(#ar-sky)"/><text x="640" y="154" fill="#7cb4d8" font-size="11.5">x</text><text x="586" y="106" fill="#7cb4d8" font-size="11.5">z</text></g>
  <line x1="520.0" y1="140.0" x2="520.0" y2="200.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="514.0" y="216.0" fill="#d6aa62" font-size="11.5" text-anchor="middle">중력</text>
  <text x="590.0" y="236.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">몸통에서 본 중력</text>
  <text x="590.0" y="258.0" fill="#d88b8b" font-size="13" text-anchor="middle" font-weight="600">(−0.174, 0, −0.985)</text>
  <text x="20.0" y="300.0" fill="#94a3b8" font-size="11.5" text-anchor="start">앞으로 숙이면 중력이 몸통의 앞(+x)쪽으로 기운다. 잘못 읽으면 x 성분의 부호가 바뀌어 뒤로 젖혔다고 읽는다</text>
  <text x="20.0" y="322.0" fill="#94a3b8" font-size="11.5" text-anchor="start">똑바로 선 자세 (0, 0, 0, 1) 은 잘못 읽어도 (0, 0, −1) 이라, 서 있는 동안에는 오류가 보이지 않는다</text>
</svg>
