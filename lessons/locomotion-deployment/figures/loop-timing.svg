  <rect x="175.0" y="150.0" width="22.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.9" stroke="#d6aa62" stroke-width="1"/>
  <rect x="197.5" y="150.0" width="127.5" height="26.0" rx="3" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="325.0" y="150.0" width="22.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.9" stroke="#d6aa62" stroke-width="1"/>
  <rect x="347.5" y="150.0" width="127.5" height="26.0" rx="3" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
