  <line x1="347.5" y1="92.0" x2="347.5" y2="100.0" stroke="#d88b8b" stroke-width="1.4"/>
  <line x1="520.0" y1="92.0" x2="520.0" y2="100.0" stroke="#d88b8b" stroke-width="1.4"/>
  <line x1="692.5" y1="92.0" x2="692.5" y2="100.0" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="261.2" y="116.0" fill="#d88b8b" font-size="11.5" text-anchor="middle">23 ms</text>
  <text x="433.8" y="116.0" fill="#d88b8b" font-size="11.5" text-anchor="middle">23 ms</text>
  <text x="20.0" y="168.0" fill="#7fc4a2" font-size="12.5" text-anchor="start" font-weight="600">시작 시각까지 기다림</text>
