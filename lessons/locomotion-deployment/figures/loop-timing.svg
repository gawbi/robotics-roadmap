  <line x1="325.0" y1="182.0" x2="325.0" y2="190.0" stroke="#7fc4a2" stroke-width="1.4"/>
  <line x1="475.0" y1="182.0" x2="475.0" y2="190.0" stroke="#7fc4a2" stroke-width="1.4"/>
  <line x1="625.0" y1="182.0" x2="625.0" y2="190.0" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="250.0" y="206.0" fill="#7fc4a2" font-size="11.5" text-anchor="middle">20 ms</text>
  <text x="400.0" y="206.0" fill="#7fc4a2" font-size="11.5" text-anchor="middle">20 ms</text>
  <rect x="175.0" y="228.0" width="14.0" height="12.0" rx="2" fill="#d6aa62" stroke="#d6aa62" stroke-width="0"/>
  <text x="195.0" y="238.0" fill="#94a3b8" font-size="11" text-anchor="start">계산·통신</text>
  <rect x="275.0" y="228.0" width="14.0" height="12.0" rx="2" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <text x="295.0" y="238.0" fill="#94a3b8" font-size="11" text-anchor="start">기다림</text>
  <text x="20.0" y="274.0" fill="#d88b8b" font-size="12.5" text-anchor="start">걸음 clock 40 step:  23 ms × 40 = 0.92 초 (학습 때 0.8 초)</text>
  <text x="20.0" y="298.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">걸음 clock 40 step:  20 ms × 40 = 0.80 초</text>
  <text x="20.0" y="320.0" fill="#94a3b8" font-size="11.5" text-anchor="start">action 하나가 motor 에 머무는 시간도 20 ms 와 23 ms 로 다르다</text>
</svg>
