<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>command interface 와 state interface 의 claim. 관절마다 position command interface 하나와 position, velocity state interface 가 있다. joint_trajectory_controller 가 두 관절의 position command 를 claim 하면 같은 interface 를 쓰려는 forward_command_controller 는 활성화되지 못한다. state interface 는 여러 controller 가 함께 읽는다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="858" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="230.0" y="34.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="600">command interface (쓰기)</text>
  <text x="645.0" y="34.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">state interface (읽기)</text>
  <rect x="40.0" y="60.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint1/position</text>
  <rect x="250.0" y="60.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="335.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint2/position</text>
  <rect x="455.0" y="48.0" width="380.0" height="128.0" rx="10" fill="#0b1a26" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="470.0" y="60.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="555.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint1/position</text>
  <rect x="650.0" y="60.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="735.0" y="85.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint1/velocity</text>
  <rect x="470.0" y="118.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="555.0" y="143.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint2/position</text>
  <rect x="650.0" y="118.0" width="170.0" height="40.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="735.0" y="143.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">joint2/velocity</text>
  <rect x="40.0" y="250.0" width="230.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="155.0" y="274.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle" font-weight="600">joint_trajectory_controller</text>
  <text x="155.0" y="294.0" fill="#34d399" font-size="11.5" text-anchor="middle">active</text>
  <rect x="300.0" y="250.0" width="200.0" height="56.0" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400.0" y="274.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">forward_command_controller</text>
  <text x="400.0" y="294.0" fill="#f87171" font-size="11.5" text-anchor="middle">활성화 거부 (claim 충돌)</text>
  <rect x="560.0" y="250.0" width="220.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="670.0" y="274.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle" font-weight="600">joint_state_broadcaster</text>
  <text x="670.0" y="294.0" fill="#38bdf8" font-size="11.5" text-anchor="middle">모든 state 를 읽음</text>
  <line x1="110.0" y1="248.0" x2="120.0" y2="104.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#aa)"/>
  <line x1="200.0" y1="248.0" x2="320.0" y2="104.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#aa)"/>
  <line x1="380.0" y1="248.0" x2="360.0" y2="106.0" stroke="#f87171" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="384.0" y="190.0" fill="#f87171" font-size="11.5" text-anchor="start">이미 claim 됨</text>
  <line x1="670.0" y1="248.0" x2="670.0" y2="180.0" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#as)"/>
  <text x="430.0" y="340.0" fill="#94a3b8" font-size="12" text-anchor="middle">command interface 하나는 한 controller 만 claim 하고, state interface 는 여러 controller 가 함께 읽는다</text>
</svg>
