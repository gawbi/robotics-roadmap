<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>p 값 0.01, 0.02, 0.04 에 대한 Holm 과 Bonferroni. Holm 은 기준을 0.0167, 0.025, 0.05 로 차례로 풀어 셋을 모두 기각하고, Bonferroni 는 모두 0.0167 과 비교해 첫째만 기각한다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">비교 3 개의 p 값 0.01, 0.02, 0.04 (예로 든 값)</text>
  <text x="20.0" y="74.0" fill="#7fc4a2" font-size="13" text-anchor="start" font-weight="600">Holm</text>
  <line x1="120.0" y1="86.0" x2="500.0" y2="86.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="225.6" y1="78.0" x2="225.6" y2="94.0" stroke="#7fc4a2" stroke-width="2"/>
  <circle cx="183.3" cy="86.0" r="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="30.0" y="90.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.01</text>
  <text x="508.0" y="90.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">기각 (기준 0.0167)</text>
  <line x1="120.0" y1="112.0" x2="500.0" y2="112.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="278.3" y1="104.0" x2="278.3" y2="120.0" stroke="#7fc4a2" stroke-width="2"/>
  <circle cx="246.7" cy="112.0" r="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="30.0" y="116.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.02</text>
  <text x="508.0" y="116.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">기각 (기준 0.025)</text>
  <line x1="120.0" y1="138.0" x2="500.0" y2="138.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="436.7" y1="130.0" x2="436.7" y2="146.0" stroke="#7fc4a2" stroke-width="2"/>
  <circle cx="373.3" cy="138.0" r="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="30.0" y="142.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.04</text>
  <text x="508.0" y="142.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">기각 (기준 0.05)</text>
  <text x="20.0" y="184.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">Bonferroni</text>
  <line x1="120.0" y1="196.0" x2="500.0" y2="196.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="225.6" y1="188.0" x2="225.6" y2="204.0" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="183.3" cy="196.0" r="5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="30.0" y="200.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.01</text>
  <text x="508.0" y="200.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">기각 (기준 0.0167)</text>
  <line x1="120.0" y1="222.0" x2="500.0" y2="222.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="225.6" y1="214.0" x2="225.6" y2="230.0" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="246.7" cy="222.0" r="5" fill="none" stroke="#d88b8b" stroke-width="1.6"/>
  <text x="30.0" y="226.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.02</text>
  <text x="508.0" y="226.0" fill="#d88b8b" font-size="11.5" text-anchor="start">기각 못 함 (기준 0.0167)</text>
  <line x1="120.0" y1="248.0" x2="500.0" y2="248.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="225.6" y1="240.0" x2="225.6" y2="256.0" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="373.3" cy="248.0" r="5" fill="none" stroke="#d88b8b" stroke-width="1.6"/>
  <text x="30.0" y="252.0" fill="#94a3b8" font-size="11.5" text-anchor="start">p = 0.04</text>
  <text x="508.0" y="252.0" fill="#d88b8b" font-size="11.5" text-anchor="start">기각 못 함 (기준 0.0167)</text>
  <text x="20.0" y="292.0" fill="#94a3b8" font-size="11.5" text-anchor="start">선분의 세로 막대가 기준이고, 점이 그 왼쪽(작음)이면 기각한다. Holm 은 기준을 차례로 풀어 준다</text>
</svg>
