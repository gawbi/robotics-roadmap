<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>부동소수점 덧셈의 순서. (0.1 + 0.2) + 0.3 은 0.6000000000000001, 0.1 + (0.2 + 0.3) 은 0.6 이다. GPU 는 덧셈을 나눠 병렬로 계산해 순서가 실행마다 달라질 수 있다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">같은 세 수를 다른 순서로 더한 결과 (Python 의 float)</text>
  <rect x="20.0" y="60.0" width="330.0" height="50.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="40.0" y="91.0" fill="#e2e8f0" font-size="14" text-anchor="start">(0.1 + 0.2) + 0.3</text>
  <line x1="352.0" y1="85.0" x2="392.0" y2="85.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="404.0" y="91.0" fill="#d88b8b" font-size="15" text-anchor="start" font-weight="600">0.6000000000000001</text>
  <rect x="20.0" y="130.0" width="330.0" height="50.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="40.0" y="161.0" fill="#e2e8f0" font-size="14" text-anchor="start">0.1 + (0.2 + 0.3)</text>
  <line x1="352.0" y1="155.0" x2="392.0" y2="155.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="404.0" y="161.0" fill="#7fc4a2" font-size="15" text-anchor="start" font-weight="600">0.6</text>
  <rect x="20.0" y="200.0" width="680.0" height="46.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="36.0" y="228.0" fill="#94a3b8" font-size="12" text-anchor="start">GPU 는 많은 값의 합을 여러 thread 로 나눠 더한다. 나누는 방식과 끝나는 순서가 바뀌면 마지막 자리가 달라진다</text>
</svg>
