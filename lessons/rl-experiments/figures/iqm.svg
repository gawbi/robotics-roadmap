  <text x="355.2" y="148.0" fill="#94a3b8" font-size="10.5" text-anchor="middle">100</text>
  <line x1="502.9" y1="127.0" x2="502.9" y2="133.0" stroke="#94a3b8" stroke-width="1"/>
