<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Colas 등의 DDPG 두 탐색 방식 비교. seed 5 개에서는 p = 0.1 로 차이를 찾지 못했고 놓칠 확률 β 는 0.51 이었다. seed 10 개에서는 p = 0.0037 로 찾았고 β 는 0.19 였다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">HalfCheetah 에서 DDPG 의 두 탐색 방식 비교 (Colas 등 2018 의 값)</text>
  <rect x="20.0" y="70.0" width="680.0" height="70.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="40.0" y="98.0" fill="#d88b8b" font-size="14" text-anchor="start" font-weight="600">seed 5 개</text>
  <text x="40.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="start">Welch t 검정 p = 0.1 · 차이를 찾지 못함</text>
  <text x="400.0" y="98.0" fill="#94a3b8" font-size="11.5" text-anchor="start">차이를 놓칠 확률 β</text>
  <rect x="400.0" y="108.0" width="260.0" height="16.0" rx="3" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="400.0" y="108.0" width="132.6" height="16.0" rx="3" fill="#d88b8b" fill-opacity="0.85" stroke="#d88b8b" stroke-width="0"/>
  <text x="540.6" y="121.0" fill="#e2e8f0" font-size="12" text-anchor="start" font-weight="600">0.51</text>
  <rect x="20.0" y="160.0" width="680.0" height="70.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="40.0" y="188.0" fill="#7fc4a2" font-size="14" text-anchor="start" font-weight="600">seed 10 개</text>
  <text x="40.0" y="212.0" fill="#e2e8f0" font-size="12" text-anchor="start">Welch t 검정 p = 0.0037 · 차이를 찾음</text>
  <text x="400.0" y="188.0" fill="#94a3b8" font-size="11.5" text-anchor="start">차이를 놓칠 확률 β</text>
  <rect x="400.0" y="198.0" width="260.0" height="16.0" rx="3" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="400.0" y="198.0" width="49.4" height="16.0" rx="3" fill="#7fc4a2" fill-opacity="0.85" stroke="#7fc4a2" stroke-width="0"/>
  <text x="457.4" y="211.0" fill="#e2e8f0" font-size="12" text-anchor="start" font-weight="600">0.19</text>
  <text x="20.0" y="270.0" fill="#94a3b8" font-size="11.5" text-anchor="start">seed 5 개의 평균 return 3523 과 4905, 표준편차 1341 과 990 으로 계산한 β 다</text>
  <text x="20.0" y="290.0" fill="#94a3b8" font-size="11.5" text-anchor="start">유의하지 않다는 결과는 '같다' 가 아니라 '이 seed 수로는 찾지 못했다' 는 뜻이다</text>
</svg>
