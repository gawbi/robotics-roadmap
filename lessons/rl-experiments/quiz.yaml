# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: seed-variance
  title: seed 가 만드는 분산
  section: seed-와-분산
  variants:
    - question: |
        같은 알고리즘과 같은 hyperparameter 로 seed 10 개를 학습해 5 개씩 두 묶음으로 나눴더니, 두 묶음의 평균 곡선이 통계적으로 다르다는 검정 결과가 나왔다. 이 결과가 보여 주는 것은 무엇인가?
      choices:
        - '한 묶음의 seed 에 구현 bug 가 있어 결과가 달라졌다'
        - '두 묶음의 hyperparameter 가 실수로 다르게 설정됐다'
        - 'seed 5 개의 평균 차이는 seed 의 분산만으로도 생길 수 있다'
        - 'seed 가 학습 결과에 미치는 영향은 무시할 만큼 작다'
      answer: 2
      explanation: |
        Henderson 등의 실험에서는 seed 만 달랐는데도 두 묶음이 다른 알고리즘처럼 보였다. 초기 weight, 탐색 noise, 환경 무작위성이 모두 seed
        에서 나와 결과가 크게 갈리기 때문이다. 두 묶음은 같은 코드로 학습했으므로 한 묶음에만 bug 가 있을 수 없다. 두 묶음은 같은
        hyperparameter 로 학습했으므로 설정 차이도 원인이 아니다. seed 만 달라도 두 묶음이 다르게 판정될 만큼 seed 의 영향은 크다.
    - question: |
        RL 에서 seed 하나가 정하는 것이 아닌 것은 무엇인가?
      choices:
        - '알고리즘의 hyperparameter 값'
        - 'network 의 초기 weight'
        - '탐색 noise 와 replay buffer 에서 뽑는 순서'
        - '환경의 시작 상태와 무작위성'
      answer: 0
      explanation: |
        hyperparameter 는 사람이 정해 두는 값이고 seed 가 정하지 않는다. network 의 초기 weight 는 seed 에서 나오는 무작위 수로 정한다. 탐색
        noise 와 replay buffer 에서 뽑는 순서도 seed 에서 나오는 무작위 수로 정한다. 환경의 시작 상태와 무작위성도 seed 에서 나온다.
    - question: |
        Colas 등이 OpenAI Baselines 의 같은 DDPG 를 seed 5 개씩 두 번 학습해 Welch t 검정을 한 결과는 무엇을 보여 주는가?
      choices:
        - 'p 가 1 에 가까워 같은 알고리즘은 늘 같다고 판정된다'
        - 'Welch t 검정은 seed 가 5 개면 계산할 수 없다'
        - '두 번 돌린 DDPG 는 seed 와 상관없이 같은 곡선을 그린다'
        - 'p 가 0.031 로 나와 같은 알고리즘인데도 다르다고 판정될 수 있다'
      answer: 3
      explanation: |
        같은 알고리즘인데도 p 가 0.031 로 나와, p 가 0.05 보다 작으면 다르다고 판정하는 5% 기준으로는 차이가 있다고 판정된다. 실제로는 차이가
        없는데 있다고 판정하는 type I 오류의 예다. 같은 알고리즘이어도 seed 의 분산 때문에 p 가 늘 1 에 가깝게 나오지는 않는다. Welch t 검정은
        seed 5 개로도 계산된다. seed 가 다르면 초기 weight 와 탐색이 달라서 곡선도 다르다.

- topic: fair-conditions
  title: 비교 조건 맞추기
  section: 비교-조건-맞추기
  variants:
    - question: |
        두 설정의 성능을 비교할 때, 학습 중 모은 episode 의 return 대신 탐색 noise 를 끈 결정론적 평가를 따로 하는 이유는 무엇인가?
      choices:
        - '결정론적 평가를 하면 seed 가 만드는 차이와 학습 중의 흔들림을 완전히 없앨 수 있어서'
        - '학습 중 return 에는 탐색 noise 가 섞여 policy 자체의 성능보다 낮게 나와서'
        - '학습 중 return 은 replay buffer 에 저장되지 않아 다시 볼 수 없어서'
        - '결정론적 평가를 하면 학습 step 예산을 맞출 필요가 없어서'
      answer: 1
      explanation: |
        학습할 때는 탐색을 위해 noise 를 섞어 action 을 고르므로, 그 return 은 noise 없이 policy 가 정하는 action 만 쓸 때의 성능보다 낮다.
        결정론적 평가도 seed 가 만드는 차이를 없애지는 못한다. replay buffer 에 저장되는지는 평가 방식을 고르는 이유가 아니다. 결정론적 평가를
        해도 더 오래 학습한 쪽이 이기지 않도록 step 예산은 여전히 맞춰야 한다.
    - question: |
        실제 성능이 50 이고 평가마다 −5 ~ 5 의 noise 가 고르게 섞일 때, 평가 10 번 가운데 가장 높은 점수를 보고하면 어떻게 되는가?
      choices:
        - 'noise 가 평균 0 이라서 가장 높은 점수의 기댓값도 50 이다'
        - '가장 높은 점수는 늘 정확히 55 가 된다'
        - '평가 횟수를 늘릴수록 가장 높은 점수는 실제 성능인 50 에 점점 가까워진다'
        - '평균적으로 약 54 가 되어, 학습이 나아지지 않아도 점수가 올라간다'
      answer: 3
      explanation: |
        −5 ~ 5 에 고르게 퍼진 noise 10 개 가운데 최댓값의 기댓값은 $-5 + 10 \times 10/11 \approx 4.1$ 이라서, 가장 높은 점수는 평균적으로
        약 54 다. 그래서 학습 중간에 저장한 network(checkpoint) 가운데 가장 좋은 것을 고르면 학습 차이 없이도 점수가 오른다. noise 의 평균이
        0 이어도 noise 10 개의 최댓값은 평균이 0 이 아니다. 최댓값은 평가마다 흔들리므로 늘 55 가 되지는 않는다. 평가가 많을수록 최댓값은 50
        이 아니라 55 쪽으로 커진다.
    - question: |
        Agarwal 등이 Atari 알고리즘 DER 을 다른 알고리즘 CURL 의 평가 방식으로 다시 쟀더니 CURL 이 보고한 점수보다 높게 나왔다. 이 결과에서 얻을 교훈은 무엇인가?
      choices:
        - 'DER 이 모든 환경에서 CURL 보다 늘 우수하다'
        - '평가 방식은 점수에 영향을 주지 않는다'
        - '비교하는 설정들은 같은 평가 방식으로 재야 한다'
        - '평가 episode 수는 적을수록 정확하다'
      answer: 2
      explanation: |
        같은 알고리즘도 평가 방식에 따라 점수가 크게 달라져서, 방식이 다른 점수끼리 비교하면 알고리즘의 차이와 평가 방식의 차이가 섞인다.
        이 결과는 평가 방식을 맞춘 한 비교일 뿐이라 DER 이 모든 환경에서 늘 우수하다는 결론은 나오지 않는다. 같은 DER 의 점수가 평가 방식에
        따라 달라졌으므로 평가 방식은 점수를 바꾼다. 평가 episode 가 적으면 점수가 더 흔들리므로 정확해지지 않는다.

- topic: paired
  title: seed 를 짝지은 비교
  section: seed-를-짝지은-비교
  variants:
    - question: |
        설정 A 와 B 에 같은 seed 0 ~ 4 를 쓰고 seed 마다 차이를 계산해 비교하는 이유는 무엇인가?
      choices:
        - '같은 seed 가 주는 공통의 운이 차이에서 지워져 분산이 줄어서'
        - '같은 seed 를 쓰면 두 설정의 결과가 똑같아져 비교가 쉬워서'
        - '짝지으면 seed 수가 두 배로 늘어난 효과를 내서'
        - '짝지은 비교는 정규분포 가정이 전혀 필요 없어서'
      answer: 0
      explanation: |
        같은 seed 는 같은 초기 weight 와 환경 무작위성을 주므로, 운 좋은 seed 는 두 설정 모두에 도움이 된다. 차이를 계산하면 이 공통 부분이 지워져
        분산이 줄어든다. 두 설정은 학습 방식이 달라서 같은 seed 를 써도 결과가 똑같아지지 않는다. 짝지어도 seed 는 5 개 그대로라서 seed 수가
        두 배로 늘지 않는다. 짝지은 t 구간도 차이가 정규분포를 따른다고 가정한다.
    - question: |
        A: 50, 62, 45, 70, 58 과 B: 47, 61, 41, 69, 53 을 짝짓지 않고 비교한 95% 구간은 −12.5 ~ 18.1 이고, 짝지은 구간은 0.58 ~ 5.02 다. 두 구간이 크게 다른 이유는 무엇인가?
      choices:
        - '짝지은 쪽은 평균 차이가 더 크게 계산되어 구간이 0 에서 멀리 떨어져서'
        - '짝짓지 않으면 41 ~ 70 의 seed 사이 분산이 구간에 그대로 들어가서'
        - '짝지은 쪽이 seed 를 더 많이 써서 구간이 좁아져서'
        - '짝짓지 않은 쪽은 계산 실수로 구간이 넓게 나와서'
      answer: 1
      explanation: |
        짝짓지 않으면 seed 마다 41 에서 70 까지 퍼진 분산이 구간에 들어가 구간이 넓어지고, 짝지으면 1 ~ 5 의 비슷한 차이만 남아 구간이 좁아진다.
        두 비교의 평균 차이는 모두 2.8 로 같으므로 짝지은 쪽의 평균 차이가 더 큰 것이 아니다. 두 비교는 같은 seed 5 개를 쓰므로 seed 수도 같다.
        두 구간이 다른 것은 계산 실수가 아니라 구간에 들어가는 분산이 달라서다.
    - question: |
        짝지은 비교가 효과를 덜 내는 경우로 옳은 것은 무엇인가?
      choices:
        - '두 설정에 같은 seed 를 쓰고 같은 step 예산과 같은 평가 방식을 함께 줄 때'
        - 'seed 사이의 분산이 차이의 분산보다 훨씬 클 때'
        - '바꾼 설정이 학습 경로를 처음부터 크게 바꿔 같은 seed 의 공통 부분이 적을 때'
        - '평가를 결정론적으로 하고 평가 episode 수를 맞출 때'
      answer: 2
      explanation: |
        짝짓기는 같은 seed 가 두 설정에 비슷한 운을 줄 때 효과가 있다. 바꾼 것이 학습 경로를 크게 바꾸면 공통 부분이 적어 차이의 분산이 줄지
        않는다. 같은 seed 에 같은 step 예산과 평가 방식을 주는 것은 짝짓기가 효과를 내는 조건이다. seed 사이 분산이 차이의 분산보다 클수록
        지울 공통 부분이 많아 짝짓기의 효과는 오히려 크다. 평가를 결정론적으로 하고 episode 수를 맞추는 것은 비교 조건을 맞추는 일이라 짝짓기의
        효과를 줄이지 않는다.

- topic: sign-flip
  title: 정확 sign-flip 검정
  section: 정확-sign-flip-검정
  variants:
    - question: |
        seed 5 개로 A 와 B 를 짝지어 비교했더니 다섯 번 모두 A 가 이겼다. 정확 sign-flip 검정의 양측 p 는 얼마인가?
      choices:
        - '0.031 로, 5% 기준으로 유의하다'
        - '0 으로, 모두 이겼으니 우연일 수 없다'
        - '0.2 로, seed 하나가 전체의 20% 라서다'
        - '0.0625 로, 5% 기준을 넘지 못한다'
      answer: 3
      explanation: |
        차이의 부호를 정하는 경우는 $2^5 = 32$ 가지이고, 가장 극단적인 것은 모두 + 와 모두 − 의 2 가지라서 양측 p 는 $2/32 = 0.0625$ 다.
        0.031 은 미리 방향을 정하고 한쪽 극단만 세는 단측 p 다. 두 설정이 같아도 32 가지 가운데 모두 + 인 경우가 있으므로 우연히 모두 이길 확률은
        0 이 아니다. seed 하나가 전체에서 차지하는 비율 1/5 은 부호 경우를 세는 이 검정의 p 와 상관없다.
    - question: |
        sign-flip 검정이 짝지은 t 검정과 달리 가정하지 않는 것은 무엇인가?
      choices:
        - '귀무가설에서 각 차이의 부호가 반반이라는 것'
        - '차이가 정규분포를 따른다는 것'
        - '각 seed 의 차이가 서로 독립이라는 것'
        - '두 설정에 같은 seed 를 썼다는 것'
      answer: 1
      explanation: |
        sign-flip 검정은 부호를 뒤집는 모든 경우를 세어 p 를 구하므로 차이가 정규분포를 따른다고 가정하지 않는다. 두 설정이 같다는
        귀무가설에서 각 차이의 부호가 반반이라는 것은 이 검정의 출발점이다. 각 seed 의 차이가 서로 독립이라는 가정은 두 검정 모두에 필요하다.
        두 설정에 같은 seed 를 쓰는 짝짓기도 두 검정 모두의 전제다.
    - question: |
        정확 sign-flip 검정으로 양측 5% 기준을 쓰려면 seed 가 최소 몇 개 있어야 하는가?
      choices:
        - '6 개로, 가장 작은 양측 p 가 2/64 ≈ 0.031 이 된다'
        - '5 개로, 가장 작은 양측 p 가 2/32 = 0.0625 다'
        - '3 개로, 모두 이기면 p 가 0 이 된다'
        - '20 개로, 그보다 적으면 검정을 계산할 수 없다'
      answer: 0
      explanation: |
        seed $n$ 개의 가장 작은 양측 p 는 $2 / 2^n$ 이라서, 6 개면 $2/64 \approx 0.031$ 로 0.05 아래로 내려갈 수 있다. 5 개면 가장 작은 p 가
        $2/32 = 0.0625$ 라서 0.05 아래로 내려갈 수 없다. 모두 이겨도 모두 − 인 경우와 함께 세므로 p 가 0 이 되는 경우는 없다. seed 가 20 개보다
        적어도 부호 경우를 모두 세어 계산할 수 있다.

- topic: power
  title: seed 수와 검정력
  section: seed-수-정하기
  variants:
    - question: |
        seed 5 개로 비교했더니 p 가 0.1 이라 5% 기준으로 유의하지 않았다. 이 결과를 올바르게 읽은 것은 무엇인가?
      choices:
        - '두 설정의 성능이 같다는 것이 통계적으로 확인됐다'
        - 'p 가 0.1 이므로 B 의 성능이 A 보다 10% 더 좋다고 볼 수 있다'
        - '실험이 잘못됐으므로 결과를 버려야 한다'
        - '이 seed 수로는 차이를 찾지 못했다는 뜻이지 같다는 뜻이 아니다'
      answer: 3
      explanation: |
        유의하지 않다는 것은 차이를 찾지 못했다는 뜻이다. Colas 등의 예에서 seed 5 개일 때 실제 차이를 놓칠 확률 β 는 0.51 이라 절반의 확률로
        차이를 놓쳤고, seed 10 개에서는 p = 0.0037 로 차이를 찾았다. 차이를 찾지 못한 것만으로 두 설정이 같다는 것이 확인되지는 않는다. p 는
        성능 차이의 비율이 아니라 차이가 없을 때 이만큼 큰 차이가 우연히 나올 확률이다. 유의하지 않다는 것만으로 실험이 잘못됐다는 근거는 없다.
    - question: |
        type II 오류와 검정력의 관계로 옳은 것은 무엇인가?
      choices:
        - 'type II 오류는 없는 차이를 있다고 하는 것이고, 검정력은 그 확률이다'
        - 'type II 오류의 확률은 늘 5% 로 고정되고, 검정력은 95% 다'
        - 'type II 오류는 실제 차이를 놓치는 것이고, 검정력은 1 에서 그 확률을 뺀 값이다'
        - 'type II 오류는 seed 수와 상관없이 정해지고, 검정력은 오직 차이의 크기와만 관계있다'
      answer: 2
      explanation: |
        실제 차이를 놓치는 것이 type II 오류이고 그 확률이 $\beta$ 다. 검정력 $1 - \beta$ 는 실제 차이를 찾아낼 확률이다. 없는 차이를 있다고
        하는 것은 type II 오류가 아니라 type I 오류다. 5% 로 정하는 것은 type II 오류가 아니라 type I 오류의 확률이다. $\beta$ 는 seed 수와
        차이의 크기와 분산에 함께 달려 있어서 seed 수와 상관없이 정해지지 않는다.
    - question: |
        seed 사이의 표준편차를 seed 몇 개로 어림해 필요한 seed 수를 정할 때 조심할 점은 무엇인가?
      choices:
        - '표준편차를 작게 어림하면 필요한 seed 수를 너무 많이 정하게 된다'
        - '표준편차를 작게 어림하면 필요한 seed 수를 너무 적게 정하게 된다'
        - '표준편차는 seed 수와 상관없이 늘 정확히 어림된다'
        - '표준편차는 필요한 seed 수를 정하는 데 쓰이지 않는다'
      answer: 1
      explanation: |
        분산이 작다고 믿으면 적은 seed 로도 찾을 수 있다고 계산한다. Colas 등의 계산에서 표준편차를 40% 작게 어림하면 17 개가 필요한 비교에
        7 개를 정했다. 그래서 저자들은 본 실험 전에 seed 20 개 이상으로 분산을 어림하라고 권했다. 표준편차를 작게 어림하면 seed 수가 많아지는
        것이 아니라 적어지므로 첫 보기는 방향이 반대다. 표준편차는 몇 개의 seed 로 어림한 값이라 seed 가 적으면 흔들린다. 표준편차는 필요한 seed
        수를 계산할 때 쓰는 핵심 값이다.

- topic: holm
  title: 여러 비교와 Holm 보정
  section: 여러-비교와-holm-보정
  variants:
    - question: |
        새 설정 3 개를 기준과 각각 5% 기준으로 비교한다. 사실 아무 차이가 없을 때 적어도 하나가 우연히 유의로 나올 확률은 대략 얼마인가(검정이 독립이라고 둔다)?
      choices:
        - '약 14% 로, $1 - 0.95^3$ 이다'
        - '5% 로, 검정마다 기준이 5% 라서다'
        - '15% 로, 5% 를 세 번 더해서다'
        - '0.0125% 로, 5% 를 세 번 곱해서다'
      answer: 0
      explanation: |
        세 검정 모두 유의로 나오지 않을 확률이 $0.95^3$ 이므로 적어도 하나가 나올 확률은 $1 - 0.95^3 \approx 0.143$ 이다. 검정마다 5% 여도
        검정이 여럿이면 적어도 하나가 나올 확률은 5% 보다 커진다. 단순히 더한 15% 는 근삿값이지만 정확하지 않다. 5% 를 세 번 곱한 값은 셋이
        모두 유의로 나올 확률이다.
    - question: |
        p 값 0.01, 0.02, 0.04 에 Holm 보정(5%)을 쓰면 몇 개가 기각되는가(차이가 없다는 가정을 버리고 차이가 있다고 판정되는가)?
      choices:
        - '1 개로, 모두 0.0167 과 비교한다'
        - '0 개로, 비교가 셋이면 기준이 0.05 의 세제곱으로 아주 작아진다'
        - '3 개 모두로, 기준이 0.0167, 0.025, 0.05 로 풀린다'
        - '2 개로, 가장 큰 p 는 늘 기각하지 않는다'
      answer: 2
      explanation: |
        Holm 보정은 작은 p 부터 기준을 0.05/3, 0.05/2, 0.05/1 로 차례로 풀어 비교하는데, 0.01 ≤ 0.0167 이고 0.02 ≤ 0.025 이고 0.04 ≤ 0.05
        라서 셋 모두 기각한다. 모두 0.0167 과 비교하는 것은 Bonferroni 보정이고, 그때는 1 개만 기각한다. Holm 보정은 0.05 를 검정 수로 나눌 뿐
        세제곱하지 않는다. 가장 큰 p 도 마지막 기준 0.05 이하이면 기각한다.
    - question: |
        seed 6 개로 정확 sign-flip 검정을 하면서 설정 3 개를 Holm 보정으로 비교하려 한다. 무엇이 문제인가?
      choices:
        - 'Holm 보정은 sign-flip 검정의 p 에는 쓸 수 없다'
        - 'seed 6 개면 p 가 늘 0 이라 모든 비교가 기각된다'
        - '설정이 3 개면 Holm 의 기준이 0.05 보다 커져서 오히려 너무 쉽게 기각된다'
        - 'seed 6 개의 최소 p 0.031 이 첫 기준 0.0167 보다 커서 기각할 수 없다'
      answer: 3
      explanation: |
        seed 6 개의 가장 작은 양측 p 는 $2/64 \approx 0.031$ 인데, 비교가 셋이면 Holm 의 첫 기준이 $0.05/3 \approx 0.0167$ 이라 넘을 수 없다. 비교 수를
        줄이거나 seed 를 늘려야 한다. Holm 보정은 p 값만 쓰므로 어떤 검정의 p 에도 쓸 수 있다. sign-flip 검정의 p 는 가장 극단인 2 가지를 늘
        세므로 0 이 되지 않는다. Holm 의 기준은 0.05 를 나눈 값이라 0.05 보다 커지지 않는다.

- topic: iqm
  title: IQM 과 구간 추정
  section: iqm-과-구간-추정
  variants:
    - question: |
        seed 8 개의 return 이 0, 10, 52, 55, 58, 60, 63, 200 이다. IQM(interquartile mean)은 어떻게 계산하는가?
      choices:
        - '위아래 2 개씩 버린 52, 55, 58, 60 의 평균을 낸다'
        - '8 개 모두의 평균을 낸다'
        - '가운데에 있는 두 값 55 와 58 만 골라 평균을 낸다'
        - '가장 큰 값 200 하나만 버리고 남은 나머지 7 개의 평균을 낸다'
      answer: 0
      explanation: |
        IQM 은 아래 25% 와 위 25% 를 버린 가운데 50% 의 평균이라 52, 55, 58, 60 의 평균 56.25 다. 8 개 모두의 평균은 62.25 로 200 하나에
        끌리고, IQM 이 아니라 평균이다. 가운데 두 값 55 와 58 의 평균은 IQM 이 아니라 중앙값이다. 위쪽 200 하나만 버리면 아래쪽 극단값 0 과 10
        이 남으므로 IQM 이 아니다.
    - question: |
        Agarwal 등이 seed 가 적을 때 중앙값보다 IQM 을 권한 이유는 무엇인가?
      choices:
        - 'IQM 은 극단값을 그대로 반영해 평균보다 정확해서'
        - 'IQM 은 극단값에 강하면서 가운데 여러 값을 써서 중앙값보다 덜 흔들려서'
        - 'IQM 은 늘 중앙값보다 큰 값을 내서 성능을 더 높게 보여 주기 때문이다'
        - 'IQM 은 bootstrap 없이도 정확한 구간을 내서'
      answer: 1
      explanation: |
        IQM 은 위아래 25% 를 버려 극단값에 강하고, 가운데 50% 를 모두 써서 한두 값만 쓰는 중앙값보다 통계적으로 효율적이다(같은 seed 수에서
        덜 흔들린다). 극단값을 그대로 반영하는 것은 IQM 이 아니라 평균이다. IQM 은 값의 분포에 따라 중앙값보다 작을 수도 있어서 늘 더 크지는
        않다. IQM 의 구간도 여전히 bootstrap 으로 구한다.
    - question: |
        Agarwal 등의 실험에서, 가진 seed 결과를 다시 뽑아 구하는 bootstrap 구간을 seed 3 개로 구했을 때의 문제는 무엇인가?
      choices:
        - '실제 95% 구간보다 넓게 나와 차이를 늘 놓친다'
        - 'seed 3 개로는 bootstrap 을 계산할 수 없다'
        - 'bootstrap 구간은 seed 수와 상관없이 늘 정확하다'
        - '실제 95% 구간보다 좁게 나와 불확실성을 작게 보인다'
      answer: 3
      explanation: |
        seed 3 개에서는 뽑을 수 있는 묶음의 종류가 적어 bootstrap 구간이 실제 95% 구간보다 좁게 나왔다. 저자들의 실험에서 이 구간은 seed 10
        개부터 괜찮은 추정이 됐다. 구간은 넓게 나온 것이 아니라 좁게 나왔다. seed 3 개로도 복원 추출을 되풀이할 수 있으므로 계산은 가능하다.
        seed 3 개와 10 개의 결과가 달랐으므로 bootstrap 구간의 정확도는 seed 수에 따라 달라진다.

- topic: nondeterminism
  title: 같은 seed 가 갈리는 이유
  section: 같은-seed-가-갈리는-이유
  variants:
    - question: |
        같은 코드와 같은 seed 로 GPU 에서 두 번 학습했는데 곡선이 조금 다르다. 가장 근본적인 원인은 무엇인가?
      choices:
        - 'seed 를 고정하면 무작위 수가 매번 새로 바뀌어서'
        - '부동소수점 덧셈은 순서에 따라 달라지고, GPU 가 그 순서를 바꿔서'
        - 'GPU 는 정수만 계산해 소수점 아래를 버려서'
        - '같은 seed 는 늘 같은 결과를 보장하므로 코드 어딘가에 bug 가 있어서'
      answer: 1
      explanation: |
        $(0.1 + 0.2) + 0.3$ 과 $0.1 + (0.2 + 0.3)$ 이 다르듯 부동소수점 덧셈은 순서에 따라 결과가 다르고, GPU 는 덧셈을 나눠 병렬로 해서 순서가
        바뀔 수 있다. seed 를 고정하면 무작위 수는 매번 같다. GPU 는 정수만이 아니라 부동소수점도 계산한다. PyTorch 문서도 같은 seed 의 재현을
        보장하지 않으므로, 곡선이 조금 다르다고 bug 가 있다고 볼 수 없다.
    - question: |
        RL 에서 마지막 자리의 작은 계산 차이가 큰 결과 차이로 커지는 이유는 무엇인가?
      choices:
        - '강화학습은 계산 정밀도를 일부러 낮춰 학습하기 때문에'
        - 'reward 가 늘 정수라서 소수점 차이가 반올림으로 커져서'
        - '작은 차이가 고르는 action 을 바꾸면 그 뒤 경험이 달라져서'
        - '작은 차이는 replay buffer 에 저장되지 않고 버려져서'
      answer: 2
      explanation: |
        RL 은 policy 가 모은 경험으로 다시 학습하므로, 작은 차이가 한 번 다른 action 을 고르게 하면 그 뒤의 경험과 학습 전체가 달라진다. RL 이
        계산 정밀도를 일부러 낮추는 것은 아니다. reward 가 정수일 필요는 없고, 차이를 키우는 것은 반올림이 아니라 바뀐 action 이다. 작은 차이는
        버려지지 않고 그 뒤의 action 과 경험에 남으므로 replay buffer 저장 여부와는 관계없다.
    - question: |
        결과를 다른 기계에서 다시 확인할 때 적절한 방법은 무엇인가?
      choices:
        - 'seed 묶음의 구간을 비교하고 GPU·CUDA·PyTorch 버전을 기록한다'
        - '한 seed 의 학습 곡선이 비트 단위로 같은지 확인한다'
        - 'seed 를 바꾸지 않으면 다른 기계에서도 늘 같아지므로 따로 확인할 필요가 없다'
        - 'cuDNN 의 benchmark 를 켜서 가장 빠른 연산으로 맞춘다'
      answer: 0
      explanation: |
        다른 GPU 구조 사이에서는 비트 단위로 같은 결과가 보장되지 않으므로, seed 를 결과 분포의 한 번호로 보고 묶음의 구간을 비교한다. 기계와
        버전도 기록한다. 다른 기계에서는 한 seed 의 곡선이 비트 단위로 같다는 보장이 없어서 그렇게 확인할 수 없다. seed 를 바꾸지 않아도 덧셈
        순서가 달라지면 결과가 달라지므로 따로 확인해야 한다. cuDNN 의 benchmark 를 켜면 실행마다 다른 연산이 골라질 수 있어서 결과가 오히려 더
        갈린다.
