<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>global planning 과 local planning. global planner 는 지도 전체의 global costmap 에서 목표까지 경로를 1초마다 다시 계산하고, controller 는 로봇 둘레 3 m × 3 m 의 local costmap 을 보며 1초에 20 번 속도 명령을 내 그 경로를 따라가면서 지도에 없던 장애물을 피한다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30" y="50" width="430" height="240" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="150" y="50" width="12" height="140" fill="#cbd5e1"/>
  <rect x="300" y="175" width="12" height="115" fill="#cbd5e1"/>
  <rect x="360" y="90" width="100" height="12" fill="#cbd5e1"/>
  <path d="M80,240 C 130,250 200,240 230,200 S 260,130 330,135 S 400,155 420,145" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="420" cy="145" r="7" fill="#34d399"/>
  <text x="420.0" y="169.0" fill="#34d399" font-size="11" text-anchor="middle">목표</text>
  <rect x="35.0" y="195.0" width="90" height="90" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.6"/>
  <rect x="102" y="234" width="12" height="16" fill="#f87171"/>
  <path d="M80,240 Q 98,214 124,210" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
  <circle cx="80" cy="240" r="7" fill="#f59e0b"/>
  <text x="60.0" y="274.0" fill="#f59e0b" font-size="11" text-anchor="middle">로봇</text>
  <text x="245.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">지도 전체 (global costmap, map frame)</text>
  <text x="245.0" y="312.0" fill="#94a3b8" font-size="11" text-anchor="middle">초록 점선: global path · 파란 칸: local costmap · 빨간 상자: 지도에 없던 장애물</text>
  <rect x="485" y="55" width="205" height="105" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="587.0" y="78.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">global planning</text>
  <text x="587.0" y="100.0" fill="#e2e8f0" font-size="11" text-anchor="middle">지도 전체 · 목표까지의 경로</text>
  <text x="587.0" y="118.0" fill="#94a3b8" font-size="11" text-anchor="middle">costmap 1 Hz 갱신 · 1초마다 재계획</text>
  <text x="587.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="middle">planner server (NavFn, Smac)</text>
  <rect x="485" y="180" width="205" height="105" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="587.0" y="203.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">local planning</text>
  <text x="587.0" y="225.0" fill="#e2e8f0" font-size="11" text-anchor="middle">로봇 둘레 3 m × 3 m · odom frame</text>
  <text x="587.0" y="243.0" fill="#94a3b8" font-size="11" text-anchor="middle">costmap 5 Hz 갱신 · 명령 20 Hz</text>
  <text x="587.0" y="261.0" fill="#94a3b8" font-size="11" text-anchor="middle">controller server</text>
  <line x1="587.0" y1="162.0" x2="587.0" y2="178.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="595.0" y="174.0" fill="#94a3b8" font-size="10" text-anchor="start"></text>
</svg>
