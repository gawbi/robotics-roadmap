# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: costmap-layers
  title: costmap 과 layer
  section: costmap-과-layer
  variants:
    - question: |
        Nav2 의 global costmap 에서 static layer 와 obstacle layer 는 각각 어떤 정보를 적는가?
      choices:
        - 'static layer 는 LiDAR 가 지금 보는 장애물을 적고, obstacle layer 는 SLAM 으로 만든 지도를 적는다'
        - 'static layer 는 미리 만든 지도의 벽을 적고, obstacle layer 는 센서가 새로 본 장애물을 적는다'
        - '두 layer 모두 같은 LiDAR 데이터를 적고, 하나가 멈추면 다른 하나가 대신 쓰이는 백업용이다'
        - 'static layer 는 로봇 둘레에 cost 를 퍼뜨리고, obstacle layer 는 경로를 계산한다'
      answer: 1
      explanation: |
        static layer 는 map server 가 읽어 준 SLAM 지도를 옮겨 적어 지도를 만들 때 있던 벽과 기둥을 장애물로 둔다. obstacle layer 는 LiDAR 같은
        센서로 지도에 없던 장애물(사람, 상자)을 적고, 빔이 지나간 칸은 비운다. 둘의 역할을 뒤바꾼 보기는 틀렸고, 둘은 서로 다른 출처의 정보라서
        백업 관계가 아니다. 장애물 둘레에 cost 를 퍼뜨리는 것은 inflation layer 이고, 경로 계산은 costmap 이 아니라 planner 가 한다.
    - question: |
        obstacle layer 의 marking 과 clearing 은 무엇이고, clearing 이 왜 필요한가?
      choices:
        - 'marking 은 지도를 파일로 저장하는 것이고, clearing 은 오래된 지도 파일을 지워 공간을 비우는 것이다'
        - 'marking 은 장애물 칸의 cost 를 키우는 것이고, clearing 은 계산을 빠르게 하려고 costmap 전체를 주기적으로 0 으로 만드는 것이다'
        - 'marking 은 static layer 의 벽을 표시하는 것이고, clearing 은 로봇 둘레 칸만 비워 움직일 자리를 만드는 것이다'
        - 'marking 은 빔이 끝난 칸을 장애물로 적고, clearing 은 빔이 지나간 칸을 비워 사라진 장애물을 지운다'
      answer: 3
      explanation: |
        LiDAR 빔이 끝난 곳에는 무언가 있으니 장애물로 적고(marking), 빔이 지나간 칸에는 아무것도 없으니 비운다(clearing). clearing 이 없으면 한 번
        지나간 사람이 지도에 계속 장애물로 남아 길을 막는다. 지도 파일 저장과는 관계가 없고, costmap 전체를 0 으로 만들면 지금 있는 장애물까지
        사라진다. static layer 의 벽은 static layer 가 적으며 obstacle layer 의 marking 대상이 아니다.
    - question: |
        SLAM 지도를 만든 뒤 복도의 책장을 치웠다. obstacle layer 가 master costmap 에 자기 값과 기존 값 중 큰 값을 남기는 설정일 때, LiDAR 가 그 자리를 비어 있다고 보면 경로는 그쪽으로 날까?
      choices:
        - '나지 않는다. 큰 값을 남기는 방식이라 static layer 의 장애물 값이 그대로 남는다'
        - '난다. obstacle layer 는 언제나 static layer 를 덮어써서 LiDAR 가 본 대로 바뀐다'
        - '난다. inflation layer 가 오래된 장애물을 자동으로 지워, 비어 있는 칸으로 바뀐다'
        - '나지 않는다. LiDAR 는 지도에 장애물로 적힌 칸을 볼 수 없어 비어 있다고 판단하지 못한다'
      answer: 0
      explanation: |
        master costmap 은 static layer 가 지도의 장애물 값을 적은 위에 obstacle layer 가 더 큰 값만 덮어쓴다. LiDAR 가 그 칸을 비어 있다고 봐도
        obstacle layer 의 값(0)이 static layer 의 장애물 값보다 작아서 장애물로 남는다. 그래서 가구 배치가 바뀌면 지도를 다시 만든다. 큰 값을
        남기는 방식에서는 덮어쓰기가 일어나지 않고, inflation layer 는 장애물 둘레에 cost 를 더할 뿐 지우지 않는다. LiDAR 는 지도에 장애물로 적힌 칸도 볼 수 있다.

- topic: inflation
  title: inflation 과 robot radius
  section: inflation-과-robot-radius
  variants:
    - question: |
        planner 는 로봇을 점 하나로 보고 경로를 계산하는데, 그래도 크기가 있는 로봇이 벽에 부딪히지 않는 이유는 무엇인가?
      choices:
        - 'controller 가 따라가면서 벽과의 거리를 재서 피하기 때문에 planner 는 크기를 신경 쓸 필요가 없다'
        - '경로를 계산한 뒤 경로 전체를 로봇 반지름만큼 벽 반대쪽으로 평행 이동하기 때문이다'
        - 'costmap 에서 장애물을 로봇 반지름만큼 부풀려, 몸이 닿을 자리에 중심이 못 들어가게 했기 때문이다'
        - '지도의 해상도를 로봇 크기만큼 거칠게 해서 칸 하나가 로봇 하나 크기가 되기 때문이다'
      answer: 2
      explanation: |
        inflation layer 는 장애물에서 로봇 반지름 안의 칸을 지나갈 수 없는 칸(253)으로 둔다. 로봇의 몸 대신 로봇 중심이 놓일 수 있는 자리로 문제를
        바꾼 것(configuration space)이라서, 점으로 계획한 경로도 실제 로봇에게 안전하다. controller 도 충돌을 검사하지만 planner 가 벽을 뚫는 경로를
        내면 따라갈 수 없다. 경로를 평행 이동하거나 해상도를 로봇 크기로 거칠게 만드는 방식은 쓰지 않는다.
    - question: |
        inflation_radius 를 robot radius 와 똑같이 두면 어떤 문제가 생기는가?
      choices:
        - '반지름을 조금만 넘은 칸도 cost 가 0 이라, 벽을 스치는 경로가 나와 작은 오차에도 벽에 닿는다'
        - '로봇 반지름만큼 부푼 장애물이 통로를 모두 막아 경로를 하나도 찾지 못한다'
        - '부풀리는 칸이 많아져 costmap 계산량이 크게 늘고, planner 가 제때 경로를 내지 못한다'
        - '아무 문제 없다. 충돌만 막으면 되므로 반경을 딱 맞추는 것이 권장 설정이다'
      answer: 0
      explanation: |
        robot radius 안은 여전히 253 으로 막히지만 그 바깥은 바로 cost 0 이라서, 벽에서 반지름보다 1 cm 떨어진 길과 통로 한가운데가 같은 비용이 된다.
        planner 는 짧은 쪽인 벽을 스치는 길을 고르고, 위치 추정이나 경로 추종이 몇 cm 만 어긋나도 로봇이 막힌 칸에 들어간다. 통로가 막히는 것은
        반경을 지나치게 크게 잡았을 때의 일이고, 반경이 작으면 계산은 오히려 줄어든다. Nav2 tuning guide 는 통로 전체에 cost 가 완만하게 깔리도록
        반경을 넓게 두라고 권한다.
    - question: |
        robot radius 가 0.2 m, inflation_radius 가 1.0 m, cost 가 252 × exp(−k × (거리 − robot radius)) 로 줄어드는 inflation layer 에서 cost_scaling_factor k 를 3 에서 10 으로 올리면 경로는 어떻게 바뀌는가?
      choices:
        - '로봇 반지름 안쪽 칸도 지나갈 수 있게 되어 더 좁은 틈으로 경로가 난다'
        - '장애물 둘레의 cost 가 더 넓게 퍼지므로, 경로가 통로 한가운데로 더 강하게 끌린다'
        - 'k 는 costmap 을 다시 계산하는 주기만 바꾸므로 경로 모양은 그대로다'
        - 'cost 가 장애물에서 멀어질수록 빨리 0 에 가까워져, 경로가 벽 쪽으로 더 붙는다'
      answer: 3
      explanation: |
        k 는 지수의 기울기라서 클수록 cost 가 거리에 따라 빨리 줄어든다. 예를 들어 장애물에서 0.4 m 인 칸은 k = 3 이면 252 × exp(−0.6) ≈ 138 이지만
        k = 10 이면 252 × exp(−2) ≈ 34 라서, 벽 가까운 칸과 빈 칸의 비용 차이가 작아지고 경로가 벽 쪽으로 붙는다. robot radius 안쪽은 k 와 상관없이
        253 이라 여전히 지나갈 수 없다. cost 가 넓게 퍼지는 것은 k 를 줄였을 때이고, k 는 갱신 주기와 관계가 없다.

- topic: dijkstra
  title: Dijkstra 의 확장 순서
  section: dijkstra
  variants:
    - question: |
        Dijkstra 알고리즘은 다음에 확장할 node 를 어떻게 고르는가?
      choices:
        - '목표까지의 직선 거리가 가장 짧아 목표에 가까운 node'
        - '가장 최근에 open list 에 들어와 아직 살피지 않은 node'
        - '이웃이 가장 많아 한 번에 많이 넓힐 수 있는 node'
        - '시작점부터의 누적 비용 g 가 가장 작은 node'
      answer: 3
      explanation: |
        Dijkstra 는 open list 에서 시작점부터의 누적 비용 g 가 가장 작은 node 를 꺼낸다. 그래서 시작점에서 가까운 node 부터 넓혀 간다. 목표까지의
        거리를 보는 것은 greedy best-first 나 A* 의 h 이고, 가장 최근 node 를 꺼내는 것은 depth-first search 다. 이웃 수는 확장 순서와 관계가 없다.
    - question: |
        Dijkstra 가 목표 node 를 open list 에서 꺼내는 순간 그 경로가 최단이라고 말할 수 있는 이유는 무엇인가? 모든 edge 비용은 0 이상이다.
      choices:
        - '목표 node 는 다른 node 를 모두 꺼낸 뒤 항상 마지막에 꺼내지기 때문이다'
        - '누적 비용이 작은 node 부터 꺼내고 비용이 음수가 아니라서, 다른 길로 와도 줄 수 없기 때문이다'
        - '모든 node 를 한 번씩 다 확장해 가능한 경로를 전부 비교한 다음에야 목표를 꺼내기 때문이다'
        - '목표에 처음 닿은 경로를 그대로 쓰므로 최단이라는 보장은 없고, 운이 좋을 때만 최단이다'
      answer: 1
      explanation: |
        open list 에서 g 가 가장 작은 node 를 꺼내고 비용은 0 이상이므로, 아직 꺼내지 않은 node 를 거쳐 오는 길은 지금 g 보다 작아질 수 없다. 그래서
        꺼내는 순간 g 가 확정되고, 목표도 마찬가지다. 목표는 꺼내는 즉시 멈추므로 항상 마지막도 아니고 모든 node 를 확장하지도 않는다. 음수 비용이
        없다는 조건에서는 최단이 보장된다.
    - question: |
        100만 칸짜리 grid 지도에서 목표가 출발점 바로 옆 방에 있을 때, Dijkstra 의 약점은 무엇인가?
      choices:
        - '목표 근처에서는 최단 경로를 찾지 못하고, 확장 순서 때문에 먼 길로 돌아간다'
        - '칸이 100만 개면 open list 가 메모리를 넘쳐 항상 탐색에 실패한다'
        - '목표 방향을 쓰지 않아 반대 방향 칸까지 똑같이 확장하며 시간을 쓴다'
        - '경로가 칸 중심을 지나지 않아 로봇이 따라갈 수 없는 꺾은선이 된다'
      answer: 2
      explanation: |
        Dijkstra 는 g 만 보고 넓히므로 목표 방향과 반대 방향을 구분하지 않는다. 그래서 같은 거리 안의 칸을 사방으로 모두 확장한 뒤에야 목표에 닿는다.
        경로 자체는 언제나 최단이고, 메모리 때문에 항상 실패하지도 않는다. 칸 중심을 잇는 경로가 나오는 것은 grid search 공통의 성질로 Dijkstra 만의
        약점이 아니다.

- topic: astar-heuristic
  title: A* 와 admissible heuristic
  section: a-와-heuristic
  variants:
    - question: |
        A* 와 Dijkstra 의 차이는 무엇인가?
      choices:
        - 'A* 는 g 에 목표까지의 추정 비용 h 를 더한 f 로 순서를 정해, 확장하는 node 가 적다'
        - 'A* 는 목표 방향을 먼저 보므로 Dijkstra 보다 항상 더 짧은 경로를 찾는다'
        - 'A* 는 h 로 비용을 보정해 음수 비용을 다룰 수 있고, Dijkstra 는 다루지 못한다'
        - 'A* 는 node 를 무작위로 뽑아 이어 가므로, 확장하는 node 수가 Dijkstra 보다 적다'
      answer: 0
      explanation: |
        A* 는 f = g + h 가 가장 작은 node 를 꺼낸다. h 가 목표 쪽 node 의 f 를 작게 만들어 목표 방향을 먼저 살피므로 확장하는 node 가 줄어든다. h 가
        admissible 하면 두 방법이 찾는 경로의 비용은 같아서 A* 가 더 짧은 경로를 찾는 것은 아니다. 음수 비용은 둘 다 전제하지 않으며, 무작위로 node 를
        뽑는 것은 RRT 같은 sampling-based planner 다.
    - question: |
        A* 의 heuristic 이 admissible 하다는 것은 무슨 뜻이고, 왜 중요한가?
      choices:
        - 'heuristic 이 항상 0 이라는 뜻이고, 그래야 계산할 node 수가 줄어서 중요하다'
        - 'heuristic 이 실제 남은 비용보다 항상 크다는 뜻이고, 목표로 더 빨리 가기 위해 중요하다'
        - 'heuristic 이 실제 남은 비용을 넘지 않는다는 뜻이고, 그래야 최단 경로가 보장된다'
        - 'heuristic 이 정수라는 뜻이고, priority queue 에서 순서를 비교하려면 중요하다'
      answer: 2
      explanation: |
        admissible heuristic 은 어떤 node 에서도 목표까지의 실제 최소 비용을 넘지 않는다. Hart·Nilsson·Raphael 은 이 조건에서 A* 가 반드시 최단 경로를
        찾는다는 것을 증명했다. h = 0 도 admissible 하지만 그러면 Dijkstra 와 같아질 뿐 조건 자체가 0 을 뜻하지는 않는다. 실제보다 큰 h 는 확장을
        더 줄일 수 있지만 최단 경로를 놓칠 수 있다. 정수 여부와는 관계가 없다.
    - question: |
        대각선 이동을 허용하는 8-connected grid 에서, 대각선 한 칸의 비용을 √2 로 두고 heuristic 으로 Manhattan 거리(가로 칸 수 + 세로 칸 수)를 쓰면 어떤 문제가 있는가?
      choices:
        - '문제없다. Manhattan 거리는 칸 수를 세므로 어떤 grid 에서도 admissible 하다'
        - '대각선 한 칸을 2 로 세서 실제 비용보다 커질 수 있으므로, 최단이 아닌 경로가 나올 수 있다'
        - 'Manhattan 거리가 실제 비용보다 너무 작아서 A* 가 Dijkstra 와 똑같이 동작한다'
        - '대각선 이동이 있으면 h 가 방향마다 달라져 heuristic 을 쓸 수 없다'
      answer: 1
      explanation: |
        대각선으로 한 칸 가면 실제 비용은 √2 ≈ 1.41 인데 Manhattan 거리는 가로 1 + 세로 1 = 2 로 센다. 실제 남은 비용보다 커질 수 있으니 admissible
        하지 않고, 최단 경로 보장이 깨진다. 직선 거리(Euclidean distance)처럼 실제 비용을 넘지 않는 heuristic 을 써야 한다. Manhattan 거리는
        상하좌우로만 움직이는 grid 에서만 admissible 하고, 대각선 이동에도 heuristic 은 얼마든지 쓸 수 있다.

- topic: hybrid-astar
  title: 자동차형 로봇과 Hybrid-A*
  section: 자동차형-로봇과-hybrid-a
  variants:
    - question: |
        grid A* 가 낸 경로를 자동차형(Ackermann) 로봇이 따라가지 못하는 이유는 무엇인가?
      choices:
        - 'grid A* 경로는 칸을 건너뛰어 항상 최단이 아니라서, 로봇이 따라가다 경로를 벗어나기 때문이다'
        - '경로가 꺾은선이라 제자리 회전이 필요한데, 자동차형 로봇은 최소 회전 반경보다 작게 돌 수 없어서'
        - '자동차형 로봇은 바퀴 배치 때문에 원형 로봇용 costmap 을 쓸 수 없기 때문이다'
        - 'grid A* 는 방향을 고려하지 않아 후진만 하는 경로를 내기 때문이다'
      answer: 1
      explanation: |
        grid A* 는 위치만 보고 칸을 이어서 모서리에서 방향이 갑자기 꺾인다. 제자리 회전이 되는 differential drive 로봇은 멈춰서 돌면 되지만, 앞바퀴를
        꺾어 도는 자동차형 로봇은 회전 반경 때문에 그 모서리를 돌 수 없다. 경로가 최단인지는 이 문제와 관계가 없고, 자동차형 로봇도 costmap 을 쓴다.
        grid A* 는 방향을 모르므로 후진 경로를 따로 내지도 않는다.
    - question: |
        Hybrid-A* 는 일반 grid A* 와 무엇이 다른가?
      choices:
        - 'grid 를 쓰지 않고 무작위로 점을 뽑아, 최소 회전 반경 안에 드는 점끼리만 잇는다'
        - 'heuristic 없이 모든 상태를 넓혀서, 방향까지 고려한 최단 경로를 보장한다'
        - '경로를 먼저 찾은 뒤 꺾인 곳만 곡선으로 다듬는 smoothing 후처리 방법이다'
        - '상태를 (x, y, θ) 로 두고, 최소 회전 반경을 지키는 호로 다음 상태를 만든다'
      answer: 3
      explanation: |
        Hybrid-A* 는 방향 θ 까지 상태에 넣고 왼쪽 호, 직진, 오른쪽 호 같은 motion primitive 로 확장한다. 연속 좌표를 기억하고 grid 는 이미 와 본
        상태인지를 가리는 데만 써서, 탐색 단계부터 회전 반경을 지키는 경로가 나온다. 무작위로 점을 뽑는 것은 sampling-based planner 이고, 상태 공간이
        커서 heuristic 이 오히려 더 중요하다. 꺾인 경로를 나중에 다듬는 smoothing 만으로는 회전 반경을 지킨다는 보장이 없다.
    - question: |
        제자리 회전이 되는 원형 differential drive 로봇과, 원형이 아닌 자동차형 배송 로봇에 각각 Nav2 의 어떤 planner 가 맞는가?
      choices:
        - '원형 로봇에는 NavFn 이나 Smac 2D 가 맞고, 자동차형 로봇에는 Smac Hybrid-A* 가 맞다'
        - '둘 다 NavFn 이면 충분하다. 회전 반경은 controller 가 경로를 따라가며 맞춰 준다'
        - '원형 로봇에는 Smac Hybrid-A* 가 맞고, 자동차형 로봇에는 NavFn 이 맞다'
        - '둘 다 Smac 2D 를 쓰고, 자동차형 로봇은 costmap 해상도만 거칠게 바꾼다'
      answer: 0
      explanation: |
        원형 differential drive 로봇은 방향을 신경 쓰지 않아도 제자리에서 돌 수 있으니 위치만 탐색하는 NavFn·Smac 2D 로 충분하다. 자동차형 로봇은
        회전 반경을 지키는 경로가 필요해 (x, y, θ) 를 탐색하는 Smac Hybrid-A* 를 쓴다(Nav2 tuning guide). controller 는 따라갈 수 없는 경로를
        고쳐 주지 못하고, 해상도를 바꿔도 90° 로 꺾이는 경로의 문제는 남는다.

- topic: global-local
  title: global planning 과 local planning
  section: global-planning-과-local-planning
  variants:
    - question: |
        navigation 을 global planning 과 local planning 으로 나누는 이유는 무엇인가?
      choices:
        - 'global planner 는 GPS 를 쓰고 local planner 는 LiDAR 를 써서 센서가 다르기 때문이다'
        - '두 planner 가 같은 일을 해서, 하나가 고장 나면 다른 하나가 대신하기 위해서다'
        - '지도 전체를 탐색하면 오래 걸려 자주 못 하는데, 새 장애물은 자주 계산해야 피할 수 있기 때문이다'
        - 'global planner 는 실내에서 쓰고 local planner 는 실외에서 써서 장소가 다르기 때문이다'
      answer: 2
      explanation: |
        global planner 는 수십만 ~ 수백만 칸을 탐색하느라 1초에 한 번 정도만 경로를 낼 수 있다. 그사이 나타난 사람 같은 장애물은 로봇 둘레의 작은
        local costmap 을 보며 1초에 수십 번 속도 명령을 계산하는 controller 가 피한다. 두 층은 주기와 범위가 달라 나눈 것이지 센서나 장소로 나눈 것이
        아니고, 서로 다른 일을 하므로 백업 관계도 아니다.
    - question: |
        Nav2 의 local costmap 은 왜 map frame 이 아니라 odom frame 기준으로 두는가?
      choices:
        - 'map frame 의 위치는 localization 이 고칠 때마다 튀지만, odom frame 은 매끄럽게 이어지기 때문이다'
        - 'odom frame 은 바퀴 회전을 직접 세므로 map frame 보다 장기적으로 더 정확하기 때문이다'
        - 'map frame 은 지도가 있을 때만 존재하고 local costmap 은 지도를 쓰면 안 되기 때문이다'
        - 'odom frame 은 로봇 둘레만 다루므로 costmap 의 칸 수가 줄어 계산이 빨라지기 때문이다'
      answer: 0
      explanation: |
        AMCL 같은 localization 은 scan 을 지도에 맞출 때마다 map frame 에서 본 로봇 위치를 고쳐서 위치가 몇 cm 씩 바뀐다. 1초에 수십 번 명령을 내는
        controller 가 이 frame 에서 장애물을 보면 장애물이 갑자기 옮겨 간 것처럼 보인다. odom frame 은 오차가 쌓여 장기적으로는 덜 정확하지만 짧은
        시간에는 매끄러워서 local planning 에 맞다. frame 선택은 칸 수와 관계가 없다.
    - question: |
        로봇이 0.5 m/s 로 달리고, global planner 는 1초에 한 번, controller 는 1초에 20 번 명령을 낸다. 다음 global 경로와 다음 controller 명령 사이에 로봇은 각각 얼마나 움직이는가?
      choices:
        - '각각 0.05 m 와 0.5 m'
        - '각각 0.5 m 와 0.5 m'
        - '각각 1 m 와 0.05 m'
        - '각각 0.5 m 와 0.025 m'
      answer: 3
      explanation: |
        global 경로는 1 초마다 오므로 0.5 × 1 = 0.5 m, controller 명령은 1 ÷ 20 = 0.05 초마다 오므로 0.5 × 0.05 = 0.025 m 를 간다. 그래서 global 경로가
        다시 오기 전에 나타난 장애물은 2.5 cm 마다 명령을 고치는 controller 가 먼저 피한다. 두 값을 바꿔 쓰거나 주기와 시간을 혼동한 보기는 틀렸다.

- topic: nav2-bt
  title: Nav2 의 behavior tree 와 재계획
  section: nav2-의-planner-server-와-behavior-tree
  variants:
    - question: |
        Nav2 의 기본 behavior tree 는 navigation 중에 global 경로를 어떻게 다루는가?
      choices:
        - '목표를 받을 때 한 번만 경로를 계산하고, 장애물은 controller 에 맡긴 채 끝까지 따라간다'
        - 'RateController 로 1초에 한 번 경로를 다시 계산하고, 그사이에는 최근 경로를 따라간다'
        - 'controller 주기와 같은 20 Hz 로 매번 경로를 다시 계산해 최신 장애물을 반영한다'
        - '장애물이 보일 때마다 로봇을 멈추고, 멈춘 자리에서 경로를 처음부터 다시 계산한다'
      answer: 1
      explanation: |
        기본 tree(navigate_to_pose_w_replanning_and_recovery)는 RateController 가 1초에 한 번 ComputePathToPose 를 통과시켜 planner server 가 경로를
        새로 계산하고, FollowPath 는 그동안 가장 최근 경로를 controller 에 넘긴다. 한 번만 계산하면 닫힌 문 같은 새 장애물을 돌아가지 못하고, 20 Hz
        로 계산하기에는 global 탐색이 너무 오래 걸린다. 장애물 회피는 멈추지 않고 controller 가 local costmap 으로 한다.
    - question: |
        Nav2 의 behavior tree 에서 경로 계산이나 경로 추종이 계속 실패하면 어떤 일이 일어나는가?
      choices:
        - 'navigation 이 즉시 실패를 반환하고, 로봇은 그 자리에 멈춰 다음 목표를 기다린다'
        - '로봇이 시작 위치로 돌아가 위치를 다시 맞춘 뒤 같은 목표로 다시 출발한다'
        - 'costmap 지우기, 제자리 회전, 대기, 후진 같은 recovery 를 차례로 해 보며 다시 시도한다'
        - 'planner 를 자동으로 다른 알고리즘으로 바꿔 가며 성공할 때까지 계속 시도한다'
      answer: 2
      explanation: |
        기본 tree 는 먼저 실패한 쪽의 costmap 을 지우고 한 번 더 시도한다. 그래도 실패하면 두 costmap 지우기, 제자리 회전, 대기, 후진을 차례로
        하나씩 해 보고, 하나를 할 때마다 navigation 을 처음부터 다시 시도하며 이를 최대 6 번 되풀이한 뒤에야 실패를 반환한다. 시작 위치로 돌아가거나
        planner 를 자동으로 바꾸는 동작은 기본 tree 에 없다.
    - question: |
        planner 가 경로 하나를 계산하는 데 0.3 초 걸린다. 재계획 주기를 1 Hz 에서 5 Hz 로 올리면 어떻게 되는가?
      choices:
        - '1.5 초 분량의 계산이 필요해 불가능하고, 1초에 약 3.3 번이 상한이다'
        - '경로를 1초에 5 번 받으므로, 새 장애물에 5 배 빨리 반응한다'
        - 'planner 가 주기에 맞춰 계산 시간을 0.2 초로 줄여 자동으로 맞춘다'
        - 'expected_planner_frequency 가 재계획 주기를 정하므로 BT 설정은 효과가 없다'
      answer: 0
      explanation: |
        5 번 계산하는 데 5 × 0.3 = 1.5 초가 걸리므로 1초 안에 끝낼 수 없다. 계산이 끝나는 대로 요청해도 1 ÷ 0.3 ≈ 3.3 번이 상한이다. planner 는
        주기에 맞춰 스스로 빨라지지 않는다. expected_planner_frequency 는 실제 계산이 그 주기보다 느릴 때 경고를 띄우는 기준일 뿐 재계획 주기는
        behavior tree 의 RateController 가 정한다.
