# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: vla-definition
  title: VLA 의 정의와 구성
  variants:
    - question: |
        다음 가운데 VLA(Vision-Language-Action model)를 가장 정확하게 설명한 것은?
      choices:
        - 'image encoder 없이 글만 받아, 로봇에게 내릴 명령을 문장으로 쓰는 LLM'
        - '인터넷 데이터 없이 로봇 시연만으로 처음부터 학습해, 사진과 지시문을 받아 action 을 내는 모델'
        - '인터넷 데이터로 미리 학습한 VLM 을 몸통으로 삼고, 사진과 지시문을 받아 action 을 내도록 로봇 시연으로 더 학습한 모델'
        - '사진에서 물체 위치를 찾는 인식기와, 그 위치를 받아 움직이는 작은 policy 를 따로 학습해 이어 붙인 구성'
      answer: 2
      explanation: |
        VLA 는 image encoder + LLM 으로 된 VLM 을 몸통으로 가져와, 로봇 시연을 정답 삼아 사진·지시문에서 action 까지 한 덩어리로 학습한
        모델이다. 글만 다루는 LLM 은 사진을 읽지 못하고 action 도 내지 않는다. 로봇 시연만으로 처음부터 학습한 모델(RT-1 같은)은 인터넷
        지식을 담은 몸통이 없어서 이 정의에 맞지 않는다. 인식기와 policy 를 따로 학습해 붙인 것은 모듈식 구성이다.
    - question: |
        물체 이름을 받아 사진 속 위치를 내는 인식기 뒤에, 그 위치와 관절 각도만 받는 policy 를 붙인 모듈식 구성이 있다. 이 구성과
        VLA 에 똑같이 "파란 큐브를 뒤집어 놓아" 라고 말했을 때의 차이로 옳은 것은?
      choices:
        - '모듈식 구성에서는 "뒤집어" 라는 말이 인식기에서 멈추고 policy 에는 위치 숫자만 가지만, VLA 에서는 지시문 전체가 action 을 계산하는 network 안까지 들어간다'
        - '인식기도 인터넷 데이터로 학습했으므로, 두 구성 모두 "뒤집어" 가 action 계산에 똑같이 쓰인다'
        - '모듈식 구성은 지시문을 아예 받을 수 없어서 "파란 큐브" 도 찾지 못한다'
        - 'VLA 는 사진만 보고 지시문은 읽지 않으므로 두 구성에 차이가 없다'
      answer: 0
      explanation: |
        모듈식 구성에서 글은 인식기가 "파란 큐브" 의 위치를 찾는 데만 쓰이고, policy 는 위치 숫자와 관절 각도만 받으므로 "뒤집어" 는
        움직임을 정하는 계산에 닿지 않는다. VLA 에서는 지시문 token 이 사진 token 과 함께 network 를 끝까지 지나므로 "뒤집어" 도 계산에
        들어간다. 인식기가 인터넷 데이터로 학습했어도 글이 인식기에서 멈추는 것은 그대로다. 모듈식 구성도 물체 이름은 받으므로 큐브는
        찾을 수 있다.
    - question: |
        "VLA 는 multimodal 입력을 받는다" 와 "같은 장면의 시연 action 분포가 multimodal 이다" 에서 multimodal 의 뜻을 바르게 짝지은 것은?
      choices:
        - '둘 다 같은 장면에 정답 action 이 여럿이라는 뜻이다'
        - '앞은 여러 종류의 로봇 데이터를 섞었다는 뜻, 뒤는 입력의 종류가 여럿이라는 뜻이다'
        - '둘 다 사진과 지시문을 함께 받는다는 뜻이다'
        - '앞은 사진·지시문처럼 종류가 다른 입력을 함께 받는다는 뜻, 뒤는 같은 장면에 정답 action 이 여럿이라 분포의 봉우리가 여럿이라는 뜻이다'
      answer: 3
      explanation: |
        multimodal 입력의 modal 은 시각·언어 같은 정보의 종류(modality)에서 왔다. multimodal 분포의 modal 은 통계의 mode(가장 자주 나온 값)에서
        와서, 같은 장면에 정답 action 이 여럿이라 봉우리가 여럿이라는 뜻이다. 같은 단어라도 문맥에 따라 뜻이 다르므로 두 문장을 같은 뜻으로
        읽으면 틀린다. 여러 로봇의 데이터를 섞는 것은 multimodal 과 상관없는 이야기다.

- topic: action-binning
  title: 연속 action 의 binning 과 분위수 범위
  variants:
    - question: |
        RT-2 와 OpenVLA 가 관절 각도 같은 연속된 action 값을 칸(bin) 번호로 바꾸는 이유로 옳은 것은?
      choices:
        - '각도를 정수로 바꾸면 로봇이 원래 값보다 더 정확하게 움직이기 때문이다'
        - 'LLM 은 vocabulary 의 token 가운데 하나를 고르는 모델이라서, 소수점 아래까지 아무 값이나 되는 연속 값을 그대로 낼 수 없기 때문이다'
        - '칸 번호로 바꾸면 action 차원의 개수가 줄어들기 때문이다'
        - '시연에 기록된 각도의 noise 를 지우는 것이 binning 의 목적이기 때문이다'
      answer: 1
      explanation: |
        LLM 의 출력은 vocabulary 위의 확률표이고, 거기서 token 하나를 고른다. 그래서 연속 값을 정해진 개수의 칸 번호로 바꿔야 token 으로
        낼 수 있다. 칸으로 자르면 오히려 정밀도를 조금 잃으므로 더 정확해지지 않는다. 차원 개수는 binning 전후로 그대로이고, noise 를
        지우는 것은 binning 의 목적이 아니다.
    - question: |
        어떤 관절의 시연 값이 거의 모두 −10° ~ +10° 사이에 있는데, 센서 오류로 +200° 가 한 번 섞여 있다. 이 관절을 칸 256 개로 나눌
        때 범위를 "가장 작은 값 ~ 가장 큰 값" 으로 잡으면 생기는 문제와 OpenVLA 의 대처로 옳은 것은?
      choices:
        - '+200° 가 칸에 들어가지 못해 학습이 멈추므로, 튀는 값이 든 시연을 지운다'
        - '칸 개수가 자동으로 늘어 vocabulary 가 모자라므로, 칸을 128 개로 줄인다'
        - '범위가 넓어져도 칸 폭은 바뀌지 않으므로 아무 문제가 없다'
        - '범위가 넓어져 칸 폭이 커지고 값이 모인 구간에는 칸이 몇 개만 남으므로, 1% ~ 99% 분위수 사이를 칸으로 나누고 범위 밖 값은 가장자리 칸으로 clip 한다'
      answer: 3
      explanation: |
        칸 개수는 256 으로 정해져 있으므로 범위가 넓어지면 칸 하나의 폭이 커지고, 대부분의 칸이 값이 거의 없는 +10° ~ +200° 에 낭비된다.
        OpenVLA 는 차원마다 1% 분위수 ~ 99% 분위수 사이를 256 칸으로 나눠 튀는 값의 영향을 없앴다. 범위 밖으로 나간 값은 지우지 않고
        가장 가까운 가장자리 칸에 넣는다. 칸 개수가 저절로 늘거나 줄지는 않는다.
    - question: |
        action 한 차원을 나누는 칸 개수를 256 보다 훨씬 크게 늘리면 생기는 일로 옳은 것은?
      choices:
        - '칸 폭이 좁아져 되돌린 값의 오차는 줄지만, 덮어쓸 token 이 늘고 칸마다 정답으로 나온 시연이 줄어 각 칸의 확률을 배우기 어려워진다'
        - '칸 폭이 넓어져 되돌린 값의 오차가 커진다'
        - '오차가 정확히 0 이 되어 연속 값을 그대로 내는 것과 완전히 같아진다'
        - 'token 수는 그대로이고 추론 속도만 느려진다'
      answer: 0
      explanation: |
        같은 범위를 더 많은 칸으로 나누면 칸 폭이 좁아져 칸 가운데 값으로 되돌릴 때의 오차가 줄어든다. 그러나 칸 하나가 vocabulary 의 token
        하나라서 덮어쓸 token 이 그만큼 늘고, 같은 시연을 더 많은 칸에 나눠 담으니 칸마다 나온 정답 수가 줄어 학습이 어려워진다. 칸이 아무리
        많아도 폭이 0 이 되지는 않으므로 오차가 완전히 사라지지 않는다. 칸 수가 늘면 token 수도 함께 는다.

- topic: token-id
  title: 드문 token 의 덮어쓰기와 자리별 해석
  variants:
    - question: |
        OpenVLA 는 칸 번호 256 개를 Llama 2 vocabulary 에서 가장 드물게 쓰이는 token 256 개 자리에 덮어썼다. 드문 token 을 고른 이유로
        옳은 것은?
      choices:
        - '드문 token 은 원래 뜻을 잃어도 지시문을 읽고 이해하는 능력이 거의 다치지 않기 때문이다'
        - '드문 token 은 확률이 낮게 나오므로 action 을 더 정밀하게 표현하기 때문이다'
        - '드문 token 일수록 계산이 빨라 추론 속도가 올라가기 때문이다'
        - 'action 은 드물게 일어나는 일이라 드문 token 에 맞춰야 확률이 맞기 때문이다'
      answer: 0
      explanation: |
        덮어쓴 token 은 원래 뜻을 잃는다. "the", "cup" 처럼 자주 쓰는 token 을 action 으로 바꾸면 VLM 이 지시문을 읽는 능력이 망가지지만,
        거의 나오지 않는 token 은 뜻을 잃어도 손해가 적다. 정밀도는 칸 폭이 정하는 것이지 어느 token 을 쓰는지와 상관없고, 계산 속도도
        token 마다 다르지 않다. 학습이 끝나면 action 자리에서는 action token 이 높은 확률을 받으므로 "드물어야 확률이 맞는다" 는 말도 틀린다.
    - question: |
        action 7 개 차원은 같은 action token 256 개를 함께 쓴다. 모델이 낸 action token 하나가 관절 1 의 칸인지 집게의 칸인지는 무엇으로
        정해지나?
      choices:
        - 'token id 의 크기로 정해진다. id 가 작으면 관절, 크면 집게다'
        - '차원마다 서로 다른 token 256 개를 따로 쓰므로 token 자체가 차원을 알려 준다'
        - '그 token 이 몇 번째 자리에 나왔는지로 정해지고, 값은 그 자리 차원의 범위로 되돌린다'
        - '모델이 action token 앞에 차원 이름을 글로 함께 써 준다'
      answer: 2
      explanation: |
        같은 token 이라도 첫째 자리에 나오면 관절 1 의 칸이고, 일곱째 자리에 나오면 집게의 칸이다. 그래서 되돌릴 때도 자리마다 그 차원의
        범위와 칸 폭을 써서, 같은 token 이 관절에서는 몇십 도, 집게에서는 다른 각도가 될 수 있다. token id 의 크기는 칸 번호를 알려 줄 뿐
        차원을 알려 주지 않는다. 256 개를 함께 쓰므로 차원별 token 이 따로 있지 않고, 차원 이름을 글로 쓰지도 않는다.
    - question: |
        모델이 낸 action token 을 칸 번호로 바꾸고, 다시 로봇에게 보낼 각도로 되돌렸다. 이 값과 시연의 원래 값 사이의 관계로 옳은 것은?
      choices:
        - '칸 번호를 정확히 되돌리므로 시연의 원래 값이 그대로 나온다'
        - '칸의 가운데 값으로 되돌리므로, 원래 값과 최대 칸 폭의 절반까지 어긋날 수 있다'
        - '칸의 왼쪽 끝 값으로 되돌리므로 늘 원래 값보다 작다'
        - '어긋나는 크기는 칸 폭과 상관없이 늘 1° 다'
      answer: 1
      explanation: |
        한 칸 안에는 여러 값이 들어가므로 칸 번호만으로는 원래 값을 알 수 없고, 그 칸의 가운데 값을 대표로 쓴다. 원래 값이 칸의 끝에 붙어
        있었다면 가운데까지 거리는 칸 폭의 절반이라서, 오차는 최대 칸 폭의 절반이다. 왼쪽 끝이 아니라 가운데를 쓰므로 늘 작게 나오지도 않고,
        오차의 크기는 칸 폭에 따라 달라진다.

- topic: action-generation
  title: action token 의 생성과 학습
  variants:
    - question: |
        VLA 가 action 자리에서 token 을 고를 때, action token 256 개를 뺀 나머지 vocabulary 의 점수(logits)를 $-\infty$ 로 바꾼다. 그 이유로
        옳은 것은?
      choices:
        - '학습 중에 그 token 들로 gradient 가 흐르지 않게 막아 학습을 빠르게 하려는 것이다'
        - 'action token 의 확률을 모두 1 로 만들려는 것이다'
        - '이미 고른 action token 을 다음 자리에서 다시 고르지 못하게 하려는 것이다'
        - '"cup" 같은 일반 단어가 action 자리에 뽑히는 일을 확실히 막아, 나온 token 을 언제나 칸 번호로 되돌릴 수 있게 하려는 것이다'
      answer: 3
      explanation: |
        $-\infty$ 는 어떤 점수보다 작아서, 그 token 들은 절대 뽑히지 않는다. 학습이 잘 되면 action 자리에서 일반 단어의 점수가 낮아지지만,
        혹시라도 일반 단어가 나오면 각도로 바꿀 수 없으니 아예 막는다. 이 막기는 고르는 단계의 일이라 학습 속도와는 상관없다. 남은 256 개의
        확률을 더하면 1 이 될 뿐 각각이 1 이 되지는 않고, 같은 action token 은 다음 자리에서 얼마든지 다시 나올 수 있다.
    - question: |
        RT-2·OpenVLA 는 action token 7 개를 한 번에 내지 않고, 앞에서 고른 token 을 입력 끝에 붙여 다음 token 을 고르기를 되풀이한다.
        이렇게 하나씩 내는 방식의 장점은?
      choices:
        - 'GPU 를 쓰지 않아도 되어 추론이 빨라진다'
        - '앞에서 고른 차원을 보고 다음 차원을 고르므로, 차원마다 따로 고를 때 생기는 시연에 없던 조합이 줄어든다'
        - '칸 폭의 절반만큼 생기던 오차가 사라진다'
        - '로봇 상태를 입력으로 받지 않아도 된다'
      answer: 1
      explanation: |
        차원마다 따로 고르면 관절 1 은 이 시연, 관절 2 는 저 시연을 따른 엉뚱한 조합이 나올 수 있다. 하나씩 내면 관절 1 의 선택을 보고
        관절 2 를 고르므로 그 문제가 줄어든다. 대가는 속도라서, 하나씩 내는 방식은 오히려 느리다. 칸으로 자르는 오차는 생성 순서와
        상관없이 남고, 로봇 상태를 받는지는 모델 설계의 다른 문제다.
    - question: |
        VLA 를 다음 token 맞히기로 학습할 때 cross-entropy 를 action token 자리에서만 계산하고, image token·지시문 token 자리에서는 계산하지
        않는다. 그 이유로 옳은 것은?
      choices:
        - 'image token 자리에서는 확률을 계산할 수 없기 때문이다'
        - '지시문 자리까지 포함하면 loss 가 음수가 되기 때문이다'
        - '그 자리의 다음 token 을 맞히는 것은 이미 주어진 사진과 지시문을 따라 쓰는 일이라, 로봇이 배울 필요가 없기 때문이다'
        - 'VLM 이 지시문을 이미 완벽하게 맞히므로 그 자리의 loss 가 늘 0 이기 때문이다'
      answer: 2
      explanation: |
        로봇이 배워야 할 것은 사진과 지시문을 보고 시연의 action 을 내는 일이다. 사진과 지시문은 입력으로 주어지는 것이라, 그 다음 token
        을 맞히는 연습은 action 을 고르는 데 도움이 되지 않는다. cross-entropy 는 $-\log p$ 라 어느 자리에서든 0 이상이고, 지시문 자리의
        loss 가 늘 0 인 것도 아니다. 계산을 할 수 없어서가 아니라 할 필요가 없어서 빼는 것이다.

- topic: token-weakness
  title: 칸 정밀도와 생성 속도의 한계
  variants:
    - question: |
        OpenVLA 는 action 하나에 token 7 개를 하나씩 차례로 낸다. GPU 를 훨씬 빠른 것으로 바꿔도 7 개를 한 번의 계산으로 낼 수 없는
        이유로 옳은 것은?
      choices:
        - 'GPU 의 memory 에는 한 번에 token 하나만 담을 수 있기 때문이다'
        - 'vocabulary 가 너무 커서 한 번에 계산할 수 없기 때문이다'
        - '다음 token 을 고르려면 앞 token 이 먼저 정해져야 하고, GPU 는 한 번의 계산 안의 곱셈만 동시에 할 뿐 이 순서를 바꾸지 못하기 때문이다'
        - '7 개를 한 번에 내면 칸 폭이 넓어지기 때문이다'
      answer: 2
      explanation: |
        관절 2 의 token 은 관절 1 의 token 을 입력으로 보고 고르므로, 관절 1 이 정해지기 전에는 계산을 시작할 수 없다. GPU 는 token 하나를
        고르는 계산 안의 수많은 곱셈을 동시에 해 줄 뿐이라, LLM 을 7 번 차례로 돌려야 하는 것은 그대로다. memory 나 vocabulary 크기가
        원인이 아니며, 칸 폭은 범위와 칸 개수가 정하므로 생성 방식과 상관없다.
    - question: |
        관절 각도 오차가 같을 때, 관절에서 손끝까지의 거리가 두 배인 팔에서는 손끝 위치 오차가 어떻게 되나? 또 action token 방식의 칸 오차가
        특히 문제 되는 작업은?
      choices:
        - '손끝 오차도 두 배가 되고, 핀 꽂기·커넥터 끼우기처럼 1 mm 안쪽으로 맞춰야 하는 작업에서 문제가 된다'
        - '손끝 오차는 팔 길이와 상관없이 같고, 컵을 집는 작업에서 특히 문제가 된다'
        - '손끝 오차는 절반으로 줄고, 물체 이름을 알아봐야 하는 작업에서 문제가 된다'
        - '손끝 오차는 네 배가 되고, 지시문이 긴 작업에서 문제가 된다'
      answer: 0
      explanation: |
        관절이 조금 더 돌면 손끝은 관절을 중심으로 한 원 위를 움직이고, 같은 각도에서 원 위를 움직이는 길이는 반지름에 비례한다. 그래서
        거리가 두 배면 손끝 오차도 두 배다. 칸 256 개의 오차는 수 mm 수준이라 컵을 집는 데는 충분하지만, 1 mm 안쪽으로 맞춰야 하는 정밀
        작업에는 부족하다. 물체 이름 알아보기나 지시문의 길이는 정밀도와 다른 문제다.
    - question: |
        VLM 은 사진과 지시문을 읽는 데만 쓰고, 그 옆에 붙인 별도 action head(action expert)가 action 을 내게 하는 방식이 있다. 이 방식이
        action token 방식의 약점을 다루는 방법으로 옳은 것은?
      choices:
        - '칸 개수를 크게 늘려 정밀도를 높이고, token 을 더 빨리 생성한다'
        - 'VLM 을 빼고 action head 혼자 사진과 지시문을 읽는다'
        - 'action token 을 하나씩 내되, 7 개를 GPU 여러 장에 나눠 동시에 고른다'
        - '연속된 숫자를 그대로 내서 칸 때문에 생기는 오차를 없애고, 한 번의 추론으로 앞으로 여러 step 의 action 묶음(action chunk)을 낸다'
      answer: 3
      explanation: |
        두 약점은 action 을 vocabulary 의 token 으로 낸다는 데서 나온다. 칸으로 자르니 정밀도를 잃고, token 이니 하나씩 낸다. action head
        는 각도를 숫자 그대로 내므로 칸 오차가 없고, 여러 step 의 action 을 한꺼번에 내서 빠른 제어 주기를 맞출 수 있다. 칸을 늘리는 것은
        여전히 token 방식이고, VLM 은 그대로 몸통으로 남는다. 앞 token 을 봐야 하는 순서는 GPU 를 여러 장 써도 나눌 수 없다.

- topic: text-generalization
  title: 텍스트로 일반화되는 범위
  variants:
    - question: |
        어떤 VLA 의 로봇 시연에는 사과 집기만 있고 바나나는 한 번도 나오지 않았다. 그런데도 "바나나를 집어" 를 해낼 수 있다면 그 이유로
        옳은 것은?
      choices:
        - 'VLA 가 시연 없이도 글에서 새 손동작을 만들어 내기 때문이다'
        - 'VLM 몸통이 인터넷 사진·글에서 바나나가 무엇이고 사진 어디 있는지 알아보는 법을 배웠고, 집는 동작은 시연에 있기 때문이다'
        - '바나나와 사과의 action token 이 같은 id 이기 때문이다'
        - '학습 때 바나나 사진이 image token 으로 따로 저장되어 있다가 꺼내 쓰기 때문이다'
      answer: 1
      explanation: |
        시연에서 배운 것은 "지시가 가리키는 물체 쪽으로 손을 뻗어 집는 동작" 이고, 인터넷에서 배운 것은 "바나나라는 말이 사진의 어느 물체를
        가리키는지" 다. 둘이 한 network 안에서 이어져서 처음 보는 물체 이름도 다룰 수 있다. 집기라는 동작은 이미 시연에 있으므로 새 손동작을
        만든 것이 아니다. action token 은 물체가 아니라 각도의 칸을 나타내고, 모델이 사진을 저장해 두었다가 꺼내 쓰지도 않는다.
    - question: |
        로봇 시연에 집기·옮기기·서랍 열기만 있는 VLA 가 있다. 다음 지시 가운데 해낼 가능성이 가장 낮은 것은?
      choices:
        - '"처음 보는 망고를 집어"'
        - '"컵 좀 서랍 앞으로 옮겨 줄래?"'
        - '"컵을 집어서 서랍 앞으로 옮겨"'
        - '"병뚜껑을 돌려 열어"'
      answer: 3
      explanation: |
        병뚜껑을 돌리는 손목 동작은 시연에 없는 새 손동작이라, 지시를 이해해도 그 관절 각도의 순서를 낼 근거가 없다. 망고 집기는 처음 보는
        물체 이름이지만 집는 동작은 시연에 있다. "옮겨 줄래?" 는 같은 지시의 다른 표현이고, "집어서 옮겨" 는 배운 동작의 조합이라 VLM 의
        지식과 시연이 함께 메울 수 있다.
    - question: |
        VLA 에 대한 다음 설명 가운데 잘못된 생각은?
      choices:
        - 'VLM 이 셔츠 개는 법을 글로 설명할 수 있으니, 시연에 셔츠 개기가 없어도 VLA 가 셔츠를 갤 수 있다'
        - '처음 보는 자리의 컵을 집는 것은 새 손동작이 아니라, 배운 집기 동작의 각도를 장면에 맞게 새로 계산한 것이다'
        - '"slam dunk" 같은 처음 듣는 작업 이름도 집기·옮기기·위에서 놓기의 조합으로 풀 수 있으면 해낼 수 있다'
        - '관절을 어떻게 움직일지에 대한 행동 지식은 로봇 시연 데이터에서만 온다'
      answer: 0
      explanation: |
        글로 설명하는 능력은 VLM 이 인터넷 글에서 배운 것이고, 관절을 어느 순서로 몇 도씩 움직일지는 로봇 시연에서만 배운다. 두 능력이 한
        network 에 있어도 시연에 없던 관절 각도의 순서가 글에서 저절로 생기지 않으므로 첫 보기가 오해다. 나머지 셋은 옳다. 궤적은 장면마다
        새로 계산되지만 동작의 종류는 시연이 정하고, 새 작업 이름이 배운 동작의 조합이면 VLM 의 지식으로 풀어낼 수 있다.

- topic: language-grounding
  title: 지시를 무시하는 실패와 co-fine-tuning
  variants:
    - question: |
        빨간 컵과 파란 컵이 놓인 장면의 시연 대부분이 "빨간 컵을 집어" 이고 "파란 컵을 집어" 는 아주 적다. 이 데이터로 학습한 VLA 가
        "파란 컵을 집어" 에도 빨간 컵을 집기 쉬운 이유로 옳은 것은?
      choices:
        - '지시를 읽지 않고 사진만 보고 그 장면에서 흔한 작업을 해도 loss 가 크게 줄어, 학습이 그 쉬운 길로 먼저 가기 때문이다'
        - 'VLM 이 빨간색과 파란색을 구별하지 못하기 때문이다'
        - '"파란" 이라는 단어의 token 이 action token 으로 덮어써졌기 때문이다'
        - '모델이 클수록 지시를 무시하는 경향이 강하기 때문이다'
      answer: 0
      explanation: |
        시연 대부분이 빨간 컵 집기라면, 지시를 무시하고 늘 빨간 컵을 집어도 대부분을 맞혀 loss 가 크게 내려간다. 지시를 읽게 만드는 신호는
        드문 파란 컵 시연에서만 오므로, 학습은 사진만 보고 흔한 작업을 고르는 모델이 되기 쉽다. VLM 은 색을 잘 구별하고, 덮어쓰는 것은 거의
        안 쓰는 드문 token 이다. 큰 몸통은 오히려 처음 보는 상황에 더 강한 편이지만, 크기만으로 이 실패가 사라지지는 않는다.
    - question: |
        어떤 VLA 가 language grounding(지시의 말을 장면의 물체와 행동에 연결하는 능력)을 갖췄는지 확인하는 시험으로 가장 알맞은 것은?
      choices:
        - '같은 지시를 여러 번 주고 매번 같은 물체를 집는지 본다'
        - '지시문을 비워도 성공률이 그대로 유지되는지 본다'
        - '같은 장면에서 지시만 다른 물체로 바꿨을 때 바뀐 물체를 집는지 본다'
        - '처음 보는 로봇에 올려도 같은 action token 을 내는지 본다'
      answer: 2
      explanation: |
        language grounding 이 됐다면 지시가 바뀔 때 action 도 그에 맞게 바뀌어야 한다. 같은 장면에서 지시만 바꿔 보면 모델이 지시를 읽는지
        장면만 외워 쓰는지 드러난다. 같은 지시에 같은 물체를 집는 것은 지시를 무시하는 모델도 할 수 있다. 지시문을 비워도 성공률이 그대로라면
        오히려 지시를 읽지 않는다는 증거다. 다른 로봇에서의 동작은 grounding 과 다른 문제다.
    - question: |
        RT-2 는 VLM 을 로봇 데이터만으로 fine-tuning 하지 않고, 원래 VLM 이 배운 인터넷 데이터(사진에 대한 질문·답, 사진 설명)를 섞어
        함께 학습했다. 이 co-fine-tuning 의 목적으로 옳은 것은?
      choices:
        - '로봇 시연이 없어도 action 을 배울 수 있게 하려는 것이다'
        - '단조로운 로봇 지시문과 비슷한 장면만 보는 동안 인터넷에서 배운 지식이 지워지는 것을 줄이려는 것이다'
        - '인터넷 데이터에 담긴 관절 각도로 새 손동작을 배우려는 것이다'
        - 'action token 의 칸 폭을 줄여 정밀도를 높이려는 것이다'
      answer: 1
      explanation: |
        로봇 데이터의 지시문은 "pick ~" 처럼 단조롭고 장면도 비슷해서, 그것만 오래 학습하면 weight 가 그 꼴에 맞춰 바뀌며 다양한 표현과
        물체를 알아보던 능력이 지워질 수 있다. 인터넷 데이터를 섞으면 그 능력을 계속 쓰게 되어 덜 지워지고, 처음 보는 상황에서 더 잘 일반화된다.
        action 은 여전히 로봇 시연에서만 배우고, 인터넷 데이터에는 관절 각도가 없다. 칸 폭은 binning 의 범위와 칸 수가 정한다.

- topic: new-robot
  title: 처음 보는 로봇과 fine-tuning
  variants:
    - question: |
        여러 종류 로봇의 시연을 모은 데이터(Open X-Embodiment)로 학습한 VLA 라도, 처음 보는 로봇에 그대로 올리면 잘 움직이지 않는 경우가
        많다. 그 이유로 옳은 것은?
      choices:
        - '처음 보는 로봇은 지시문을 다른 언어로 받기 때문이다'
        - '여러 로봇의 데이터를 섞으면 VLM 의 인터넷 지식이 모두 지워지기 때문이다'
        - '새 로봇의 카메라 사진은 image encoder 가 아예 읽지 못하기 때문이다'
        - 'action 숫자의 뜻·범위·관절 구성·카메라 위치·제어 주기가 로봇마다 달라서, 같은 action 도 다른 움직임이 되기 때문이다'
      answer: 3
      explanation: |
        한 로봇은 손끝 이동 거리를, 다른 로봇은 관절 각도를 낼 수 있고, 같은 칸도 범위가 다르면 다른 값으로 되돌아간다. 관절 수, 카메라 자리,
        1 초에 움직이는 횟수까지 다르면 모델이 낸 action 이 새 로봇에서 엉뚱한 움직임이 된다. 언어가 바뀌는 것은 아니고, 여러 로봇 데이터를
        섞는다고 인터넷 지식이 모두 지워지지도 않는다. image encoder 는 새 카메라 사진도 읽을 수는 있지만 사진 속 물체의 자리가 달라질 뿐이다.
    - question: |
        관절 범위를 −128° ~ +128° 로 잡고 학습한 모델이 낸 action token 을, 관절 범위가 −64° ~ +64° 인 다른 로봇에서 같은 칸 번호 그대로
        각도로 되돌렸다. 어떤 일이 생기나?
      choices:
        - '칸 번호가 같으므로 두 로봇의 각도도 같다'
        - '칸 폭과 범위가 달라 같은 token 이 다른 각도로 바뀌므로, 모델은 학습한 대로 token 을 냈어도 로봇은 다르게 움직인다'
        - 'token 이 새 로봇의 범위를 벗어나 로봇이 멈춘다'
        - '칸 폭이 좁아져 정밀도만 좋아지고 움직임은 원래 로봇과 같다'
      answer: 1
      explanation: |
        각도는 범위의 왼쪽 끝에 칸 폭 × (칸 번호 + 0.5) 를 더해 되돌리므로, 범위와 칸 폭이 다르면 같은 칸 번호도 다른 각도가 된다. 모델은
        원래 로봇 기준으로 맞는 token 을 냈지만 새 로봇에서는 전혀 다른 자리로 움직인다. 칸 번호는 0 ~ 255 라 범위를 벗어나지 않고, 칸 폭이
        좁아진다고 움직임이 같아지지 않는다. 그래서 처음 보는 로봇에는 그 로봇의 시연으로 fine-tuning 한다.
    - question: |
        새 로봇의 시연 수십 개로 VLA 를 fine-tuning 할 때 LoRA 를 쓰는 방법과 그 장점으로 옳은 것은?
      choices:
        - '원래 weight 를 모두 지우고 작은 모델을 새로 학습해 데이터가 적게 든다'
        - 'parameter 전체를 고치되 learning rate 만 낮춰 계산을 줄인다'
