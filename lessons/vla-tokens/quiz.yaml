# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: vla-definition
  title: VLA 의 정의와 바탕 VLM
  variants:
    - question: |
        VLA(Vision-Language-Action model)를 한 문장으로 정의하면 무엇인가?
      choices:
        - '사진 없이 지시문만 받아, 로봇이 할 일을 단계별 문장으로 풀어 써 주는 LLM'
        - '인터넷 데이터 없이 로봇 시연만으로 처음부터 학습해, 사진과 지시문을 받아 action 을 내는 policy'
        - '인터넷 사진·글로 학습한 VLM 에서 출발해, action 까지 내도록 로봇 시연으로 더 학습한 모델'
        - '사진에서 물체 위치를 찾는 인식기와, 그 위치를 받아 움직이는 작은 policy 를 따로 학습해 이어 붙인 구성'
      answer: 2
      explanation: |
        VLA 는 image encoder 와 language model 로 된 VLM 을 출발점으로 삼아, 로봇 시연을 정답으로 사진·지시문에서 action 까지 한 network
        로 학습한 모델이다. 지시문만 받아 문장을 쓰는 LLM 은 사진을 읽지 못하고 action 도 내지 않는다. 로봇 시연만으로 처음부터 학습한
        policy 는 RT-1 같은 모델로, 인터넷 지식을 담은 VLM 이 없어서 이 정의에 맞지 않는다. 인식기와 policy 를 따로 학습해 이은 구성은
        지시문이 인식기에서 멈추는 모듈식 구성이다.
    - question: |
        RT-2 는 VLM 에 action 을 내는 새 출력 층을 붙이지 않았다. 그러면 action 은 어떻게 내는가?
      choices:
        - 'action 값을 칸 번호로 바꾸고 칸마다 기존 token 을 짝지어, 글을 쓰듯 그 token 을 생성한다'
        - 'VLM 이 "컵을 집어라" 같은 문장을 쓰면, 따로 만든 규칙 기반 planner 가 그 문장을 관절 각도로 바꾼다'
        - 'VLM 의 마지막 hidden state 에 담긴 숫자 7 개를 그대로 관절 각도 7 개로 읽는다'
        - '사진마다 로봇 시연에서 가장 비슷한 장면을 찾아, 그 장면에서 사람이 한 action 을 그대로 꺼낸다'
      answer: 0
      explanation: |
        RT-2 는 action 의 각 차원을 256 칸으로 나누고 칸 번호를 vocabulary 의 token 으로 나타내서, 새 parameter 없이 VLM 의 다음 token
        생성으로 action 을 낸다. 문장을 쓰고 규칙 planner 가 바꾸는 방식은 VLM 을 상위 계획에만 쓰는 구성이고, RT-2 는 저수준 action
        자체를 token 으로 낸다. hidden state 를 그대로 각도로 읽으려면 그 일을 하는 출력 층을 따로 학습해야 하므로 새 층이 없다는 조건과
        맞지 않는다. 비슷한 장면의 action 을 꺼내는 것은 검색 방식이라 VLM 이 action 을 생성하는 것이 아니다.
    - question: |
        물체 이름을 받아 위치를 내는 인식기 뒤에 위치와 관절 각도만 받는 policy 를 붙인 구성과 VLA 에, 똑같이 '파란 큐브를
        뒤집어 놓아' 라고 하면 무엇이 다른가?
      choices:
        - '인식기도 인터넷 데이터로 학습했으므로, 두 구성 모두 "뒤집어" 가 action 계산에 똑같이 쓰인다'
        - 'VLA 는 사진만 보고 지시문은 읽지 않으므로, 두 구성 모두 "뒤집어" 를 쓰지 않아 차이가 없다'
        - '모듈식 구성은 글을 읽는 부분이 없어서, 지시문을 받지 못해 파란 큐브의 위치도 찾지 못한다'
        - '모듈식에서는 "뒤집어" 가 인식기에서 멈추고, VLA 에서는 action 을 계산하는 network 까지 들어간다'
      answer: 3
      explanation: |
        모듈식 구성에서 글은 인식기가 "파란 큐브" 의 위치를 찾는 데만 쓰이고, policy 에는 위치 숫자와 관절 각도만 가서 "뒤집어" 가
        움직임을 정하는 계산에 닿지 않는다. VLA 에서는 지시문 token 이 사진 token 과 함께 network 를 끝까지 지난다. 인식기가 인터넷
        데이터로 학습했어도 글이 인식기에서 멈추는 구조는 그대로라서 첫째 보기는 틀리다. VLA 는 지시문을 입력으로 받으므로 둘째 보기도
        틀리다. 모듈식 구성도 물체 이름은 받으므로 큐브의 위치는 찾을 수 있어서 셋째 보기도 틀리다.

- topic: action-token
  title: 연속 action 의 256 칸 token
  variants:
    - question: |
        RT-2 와 OpenVLA 가 연속된 action 값을 칸(bin) 번호로 바꿔야 했던 이유는 무엇인가?
      choices:
        - '값을 정수 칸으로 바꾸면 소수점 아래의 흔들림이 사라져 로봇이 원래 값보다 더 정확하게 움직이기 때문이다'
        - 'language model 은 vocabulary 의 token 하나를 고를 뿐이라 10.3 같은 실수를 낼 수 없기 때문이다'
        - '칸 번호로 바꾸면 여러 차원이 한 번호로 묶여 action 의 차원 수가 줄어들기 때문이다'
        - '시연에 기록된 값에는 noise 가 섞여 있어서, 그 noise 를 칸 안에 묶어 지우는 것이 binning 의 목적이기 때문이다'
      answer: 1
      explanation: |
        language model 의 출력은 vocabulary 위의 확률표이고, 그 가운데 token 하나를 고른다. 그래서 연속 값을 정해진 개수의 칸 번호로
        바꾸고 칸마다 token 을 짝지어야 action 을 낼 수 있다. 칸의 가운데 값으로 되돌리면 오히려 칸 폭의 절반까지 오차가 생기므로 더
        정확해지지 않는다. 차원 수는 binning 전후로 그대로라서 셋째 보기도 틀리다. noise 를 지우는 것은 binning 의 목적이 아니고, 칸 폭보다
        작은 차이가 같은 칸에 묶일 뿐이다.
    - question: |
        OpenVLA 는 Llama tokenizer 에 action token 256 개를 어떻게 마련했는가?
      choices:
        - 'Llama tokenizer 에 새 token 256 개를 더하고 embedding 을 처음부터 학습했다'
        - '숫자를 적는 글자 token "0" 부터 "255" 까지를 그대로 칸 번호로 써서 새 token 이 필요 없었다'
        - '"the", "cup" 처럼 가장 자주 쓰이는 token 256 개를 골라 action 용으로 바꿨다'
        - '새로 더할 자리가 100 개뿐이라, 가장 덜 쓰이는 token 256 개를 action token 으로 덮어썼다'
      answer: 3
      explanation: |
        OpenVLA 논문에 따르면 Llama tokenizer 에는 fine-tuning 때 새로 더할 special token 자리가 100 개뿐이라 256 개에 모자랐다. 그래서
        OpenVLA 는 RT-2 처럼 가장 덜 쓰이는 256 개를 덮어썼다. 새 token 256 개를 더하는 방법은 그 자리가 모자라서 쓰지 않았다. 정수 글자 token 을
        그대로 쓰는 방식은 1000 까지의 정수마다 token 이 따로 있는 PaLI-X 판 RT-2 의 방식이다. 자주 쓰는 token 을 덮어쓰면 지시문을 읽는
        능력이 망가지므로 드문 token 을 고른다.
    - question: |
        OpenVLA 는 칸을 나눌 범위를 action 의 최솟값 ~ 최댓값 대신 1% ~ 99% 분위수로 잡았다. 이유는 무엇인가?
      choices:
        - '드물게 튄 값 하나가 범위를 크게 넓혀 실제 값이 모인 구간에 칸이 적게 남는 것을 막으려고'
        - '범위를 최솟값 ~ 최댓값보다 넓혀서, 처음 보는 로봇의 큰 action 도 칸 안에 들어오게 하려고'
        - '1% ~ 99% 만 쓰므로 칸의 개수를 256 개에서 98 개로 줄여 계산을 아끼려고'
        - '1% 아래와 99% 위의 값은 잘못 기록된 것이라 학습에 쓰지 않고 데이터에서 지우려고'
      answer: 0
      explanation: |
        최솟값 ~ 최댓값으로 잡으면 센서 오류 같은 튄 값 하나가 범위를 크게 넓히고, 256 칸 대부분이 값이 거의 없는 구간에 쓰여 실제 값이
        모인 구간의 칸이 성글어진다. 분위수 범위는 오히려 범위를 좁히므로 큰 action 을 담으려는 목적과 반대다. 칸의 개수는 그대로
        256 개라서 셋째 보기는 틀리다. 범위 밖의 값은 지우지 않고 가장 가까운 끝 칸으로 잘라 넣는다.

- topic: generation-training
  title: action token 의 생성과 학습
  variants:
    - question: |
        RT-2 는 로봇 action 을 물을 때 출력할 수 있는 token 을 action token 으로 제한했다. 이 제한이 필요한 이유는 무엇인가?
      choices:
        - '"cup" 같은 일반 단어가 나오면 각도로 되돌릴 수 없어서, 늘 실행할 수 있는 action 이 나오게 하려고'
        - '후보를 줄이면 앞 token 을 기다릴 필요가 없어져, token 7 개를 한 번의 계산으로 함께 낼 수 있기 때문이다'
        - '제한하지 않으면 vocabulary 전체에 확률이 퍼져서 학습 loss 를 계산할 수 없기 때문이다'
        - '후보를 action token 으로 좁히면 칸 폭도 함께 좁아져서 정밀도가 올라가기 때문이다'
      answer: 0
      explanation: |
        VLM 은 원래 vocabulary 전체에서 token 을 고르므로, 학습이 잘 돼도 action 자리에 일반 단어가 나올 가능성이 남는다. 그런 token 은
        칸 번호가 아니라서 각도로 되돌릴 수 없으니 action token 밖의 점수를 $-\infty$ 로 막는다. 후보를 줄여도 다음 token 이 앞 token 을
        보고 정해지는 순서는 그대로라서 7 번 차례로 계산해야 한다. loss 는 정답 token 의 확률로 계산하므로 출력 제한 없이도 계산된다. 칸
        폭은 범위와 칸 개수로 정해지므로 출력 제한과 관계없다.
    - question: |
        OpenVLA 는 학습할 때 cross-entropy 를 어느 자리에서 계산하는가?
      choices:
        - '사진 token, 지시문 token, action token 의 모든 자리에서 계산한다'
        - '지시문 token 자리에서만 계산해 지시를 더 잘 이해하게 한다'
        - 'action token 자리에서만 계산한다'
        - 'loss 는 마지막 action token 한 자리에서만 계산한다'
      answer: 2
      explanation: |
        OpenVLA 논문에 따르면 다음 token 맞히기로 학습하되 cross-entropy 는 예측한 action token 자리에서만 계산한다. 사진과 지시문
        자리의 다음 token 을 맞히는 일은 입력을 따라 쓰는 일이라 로봇이 배울 필요가 없으므로 모든 자리에서 계산하지 않는다. 지시문
        자리에서만 계산하면 action 을 배우지 못하므로 둘째 보기는 틀리다. action 7 자리 모두 정답이 있으므로 마지막 한 자리만 쓰면 나머지
        여섯 차원을 배우지 못한다.
    - question: |
        OpenVLA 에서 같은 action token 이 첫째 자리와 일곱째 자리에 나오면 같은 값으로 되돌리는가?
      choices:
        - '같은 token 은 같은 칸 번호이고 칸 번호마다 값이 하나로 정해져 있으므로 언제나 같은 값으로 되돌린다'
        - '칸 번호는 같아도 자리마다 차원이 다르므로, 그 차원의 범위로 되돌려 값이 달라질 수 있다'
        - '두 자리에 같은 token 이 나오는 것은 학습 오류라서 실행하지 않는다'
        - '일곱째 자리는 episode 를 끝낼지 정하는 신호라서, 값으로 되돌리지 않고 멈춤 여부로만 읽는다'
      answer: 1
      explanation: |
        action token 256 개는 7 개 차원이 함께 쓰고, 칸의 범위는 차원마다 따로 정한다. 그래서 같은 칸 번호라도 위치 변화 자리의 token 은
        그 차원의 범위로 되돌리고 집게 자리의 token 은 집게의 범위로 되돌려서 값이 다르다. 범위가 차원마다 다르므로 언제나 같은 값이라는 첫째 보기는
        틀리다. 서로 다른 차원이 같은 칸에 떨어지는 일은 자연스럽게 생기므로 학습 오류가 아니다. OpenVLA 의 일곱째 값은 집게이고, 끝내기
        신호는 RT-2 의 여덟째 값이다.

- topic: co-fine-tuning
  title: 인터넷 데이터를 섞는 co-fine-tuning
  variants:
    - question: |
        RT-2 의 co-fine-tuning 은 무엇이고, 왜 했는가?
      choices:
        - '로봇 데이터로 먼저 fine-tuning 한 뒤, 마지막에 인터넷 데이터로 한 번 더 fine-tuning 하는 순서다'
        - '여러 로봇 회사가 함께 모은 데이터로 fine-tuning 해서, 한 회사 로봇에 치우치지 않게 하는 것이다'
        - 'VLM 두 개를 함께 fine-tuning 하고 출력을 평균해서, 한 모델의 실수를 다른 모델이 메우게 한다'
        - '로봇 데이터와 인터넷 데이터를 한 batch 에 섞어 학습해, 인터넷에서 배운 개념을 잊지 않게 한다'
      answer: 3
      explanation: |
        RT-2 는 사진 질문 답하기·사진 설명 같은 원래의 인터넷 데이터를 로봇 데이터와 섞어 batch 마다 함께 학습했고, 저자들은 그 덕분에
        VLM 이 배운 개념을 잊지 않아 일반화가 좋아졌다고 보았다. 두 데이터를 차례로 학습하면 마지막에 본 데이터 쪽으로 다시 치우치므로
        섞어서 학습하는 co-fine-tuning 과 다르다. 여러 로봇의 데이터를 모으는 것은 Open X-Embodiment 같은 dataset 의 이야기다. 두 모델의
        출력을 평균하는 것은 ensemble 이다.
    - question: |
        RT-2 가 같은 로봇 데이터로 모델 크기와 학습 방법을 바꿔 처음 보는 상황의 성공률을 잰 결과로 옳은 것은?
      choices:
        - '처음부터 학습한 큰 모델이 가장 좋았다. parameter 수가 성능을 정하기 때문이다'
        - '처음부터 학습하면 매우 낮았고, co-fine-tuning 과 큰 모델이 각각 성공률을 올렸다'
        - '크기와 학습 방법은 성공률에 거의 영향이 없었고, 로봇 데이터의 양이 결과를 정했다'
        - '로봇 데이터만 쓴 fine-tuning 이 co-fine-tuning 보다 좋았다. 인터넷 데이터는 로봇 학습을 방해하기 때문이다'
      answer: 1
      explanation: |
        RT-2 논문 Table 8 에서 5B 를 VLM 의 weight 없이 처음부터 학습하면 9% 였고, co-fine-tuning 은 5B 에서 44%, 55B 에서 63% 로 같은 크기의
        fine-tuning(42%, 52%)보다 높았다. 처음부터 학습한 모델은 parameter 가 많아도 인터넷 지식이 없어서 가장 낮았다. 크기와 학습 방법에
        따라 9% 에서 63% 까지 달라졌으므로 영향이 없다는 보기는 틀리다. co-fine-tuning 이 두 크기 모두에서 fine-tuning 보다 좋았으므로
        넷째 보기도 틀리다.
    - question: |
        OpenVLA 는 여러 평가에서 55B 의 RT-2-X 보다 좋았지만, 처음 보는 물체 이름이나 인터넷 개념이 필요한 과제에서는 뒤졌다.
        가장 그럴듯한 이유는?
      choices:
        - 'OpenVLA 는 action 을 token 7 개로 내서, 8 개로 내는 RT-2 계열보다 정보가 적기 때문이다'
        - 'OpenVLA 는 사진 한 장만 받아서, 물체를 여러 각도에서 보고 이름을 알아낼 수 없기 때문이다'
        - 'OpenVLA 는 로봇 데이터로만 학습했고, RT-2-X 는 인터넷 지식을 co-fine-tuning 으로 지켰기 때문이다'
        - 'OpenVLA 는 RT-2-X 보다 로봇 시연을 적게 봐서, 처음 보는 물체를 다룬 경험이 부족했기 때문이다'
      answer: 2
      explanation: |
        OpenVLA 저자들은 RT-2-X 가 semantic generalization 에서 앞선 이유를 더 큰 인터넷 데이터와, 로봇 데이터와 인터넷 데이터를 함께 학습해
        그 지식을 지킨 co-fine-tuning 에서 찾았다. action token 의 개수는 action 을 몇 차원으로 나타내는지의 차이라서 물체 이름을 알아보는 능력과 관계없다. 사진 한 장만
        받는 것은 다른 범주의 과제에도 같은 조건이므로 이 범주에서만 뒤진 이유가 되지 않는다. 시연 수는 오히려 OpenVLA 가 97 만 개로
        RT-2-X 의 35 만 개보다 많았다.

- topic: generalization-scope
  title: 인터넷 지식으로 일반화되는 범위
  variants:
    - question: |
        시연에 '사과를 집어' 와 '상자 위에서 놓아' 는 있고 '망고' 는 한 번도 없다. VLA 가 해낼 가능성이 가장 높은 지시는?
      choices:
        - '"망고 껍질을 벗겨"'
        - '"망고를 손가락 끝으로 돌려"'
        - '"망고를 집어서 상자에 넣어"'
        - '"망고를 칼로 잘라"'
      answer: 2
      explanation: |
        "망고를 집어서 상자에 넣어" 는 처음 보는 물체 이름과 배운 동작의 조합이다. 망고가 사진 어디에 있는지는 VLM 이 인터넷에서 배운
        지식으로 찾고, 집기와 위에서 놓기는 시연에 있다. 껍질 벗기기는 시연에 없던 손동작이라 뜻을 알아도 그 action 을 낼 근거가 없다.
        손가락 끝으로 돌리기도 집기와 놓기의 조합으로 나눌 수 없는 새 동작이다. 칼로 자르기는 도구 사용인데, RT-2 논문도 도구 사용을 잘
        하지 못한 동작으로 꼽았다.
    - question: |
        VLM 은 셔츠를 개는 방법을 글로 설명할 수 있다. 그런데 그 VLM 으로 만든 VLA 가 셔츠를 개지 못하는 이유는?
      choices:
        - '관절을 어떻게 움직일지는 시연에서만 배우는데, 셔츠를 개는 action 이 시연에 없기 때문이다'
        - 'VLA 로 바꾸면서 language model 이 action token 만 내게 되어 지시문을 읽지 못하기 때문이다'
        - '글로 설명할 줄은 알아도 VLM 이 셔츠 사진을 본 적이 없어 장면에서 셔츠를 찾지 못하기 때문이다'
        - '셔츠는 모양이 계속 바뀌어서 256 칸으로 나눌 수 없는 물체이기 때문이다'
      answer: 0
      explanation: |
        VLM 이 인터넷에서 본 것은 사진과 글이고, 관절 각도의 순서를 담은 action 이 아니다. action token 의 확률은 시연에서 각 칸이 정답으로
        나온 비율을 배운 것이라서, 시연에 없던 손동작에 높은 점수를 줄 근거가 없다. VLA 는 지시문을 입력으로 받으므로 둘째 보기는 틀리다.
        셔츠 사진은 인터넷에 흔해서 VLM 은 셔츠를 알아본다. 칸으로 나누는 것은 물체가 아니라 action 값이므로 넷째 보기는 binning 을
        잘못 이해한 것이다.
    - question: |
        LIBERO 로 fine-tuning 한 VLA 가 지시문을 비워도 성공률이 거의 그대로였고, 목표 물체를 같은 장면의 다른 물체로 바꾸면
        원래 물체를 집었다. 이 결과는 무엇을 뜻하는가?
      choices:
        - '모델이 지시문을 완벽히 이해해서, 지시가 비어도 장면을 보고 할 일을 알아서 채운 것이다'
        - '지시문이 비면 모델이 무작위로 움직이는데, 장면이 쉬워서 우연히 성공이 많이 나온 것이다'
        - 'image encoder 가 고장 나서 사진을 읽지 못하고, 늘 같은 기본 동작만 반복한 것이다'
        - '모델이 장면과 action 의 짝을 외워 써서, 사실상 지시를 읽지 않는 policy 가 된 것이다'
      answer: 3
      explanation: |
        같은 장면에서 늘 같은 작업의 시연만 보면 지시를 읽지 않고 사진만 봐도 loss 가 크게 줄어서, 모델이 장면과 action 의 짝을 외운다.
        LIBERO-Plus 저자들도 이렇게 해석했다. 지시를 이해했다면 목표 물체를 바꿨을 때 새 물체를 집었어야 하므로 첫째 보기는 틀리다.
        무작위로 움직였다면 성공률이 거의 그대로일 수 없으므로 둘째 보기도 틀리다. 사진을 읽지 못했다면 원래 작업도 해내지 못했을
        것이므로 셋째 보기도 틀리다.

- topic: openvla-architecture
  title: OpenVLA 의 구조와 학습 데이터
  variants:
    - question: |
        OpenVLA 의 구조로 옳은 것은?
      choices:
        - 'ResNet 으로 사진을 줄이고 FiLM 으로 지시문을 섞은 뒤, Transformer 가 차원마다 칸을 한 번에 고른다'
        - 'SigLIP·DINOv2 출력을 Llama 2 7B 의 token 으로 바꾸고, Llama 2 가 action token 을 하나씩 생성한다'
        - 'PaliGemma 옆에 action expert 를 두고 flow matching 으로 action 묶음을 만든다'
        - 'CLIP 의 text encoder 로 지시문을 embedding 하고, 사진과의 유사도가 가장 큰 action 을 고른다'
      answer: 1
      explanation: |
        OpenVLA 는 Prismatic-7B VLM 에서 출발하며, 약 6 억 parameter 의 SigLIP + DINOv2 image encoder, 2 층 MLP projector, Llama 2 7B 로
        되어 있다. ResNet 과 FiLM 을 쓰고 차원마다 칸을 한 번에 고르는 것은 RT-1 의 구조다. action expert 와 flow matching 은 π0 의 구조다.
        CLIP 유사도로 고르는 방식은 action 을 생성하지 않으므로 OpenVLA 와 다르다.
    - question: |
        OpenVLA 논문이 스스로 꼽은 입력 쪽의 한계는 무엇인가?
      choices:
        - 'language model 이 짧은 지시에만 맞춰져 있어서, 지시문을 영어 한 문장보다 길게 받을 수 없다'
        - 'image encoder 가 6 억 parameter 로 커서, 로봇 데이터로 학습하는 동안 고칠 수 없다'
        - '사진이 224×224 보다 작으면 patch 수가 모자라 실행되지 않는다'
        - '사진 한 장만 받고, 여러 카메라의 사진이나 관절 각도 같은 로봇 상태, 지난 관측을 받지 않는다'
      answer: 3
      explanation: |
        OpenVLA 논문의 한계 절은 한 장의 사진만 받는 점을 첫째로 꼽고, 여러 사진과 로봇 상태, 관측 기록을 받게 넓히는 것을 앞으로의
        과제로 적었다. 지시문 길이는 language model 이 받는 token 수 안에서 자유롭게 정할 수 있어서 논문이 꼽은 한계가 아니다. OpenVLA 는
        오히려 image encoder 를 함께 고쳐야 성능이 났다고 보고했다. 사진은 224×224 로 바꿔 넣으므로 원본 크기가 실행을 막지 않는다.
    - question: |
        OpenVLA 는 Open X-Embodiment 에서 로봇 밖 카메라가 있고 팔 하나의 손끝을 움직이는 데이터만 골라 학습했다. 이 데이터를 고른 이유는 무엇인가?
      choices:
        - '여러 dataset 의 입력과 출력의 모양을 맞춰, 같은 형식의 사진과 action 으로 학습하려고'
        - '두 팔 로봇과 네 발 로봇의 데이터는 시연 품질이 낮고 실패가 많다고 알려져 있어서'
        - '고른 데이터가 Open X-Embodiment 안에서 가장 커서, 학습 시간을 늘려 더 오래 배우게 하려고'
        - '손끝 제어 데이터는 값이 이미 정수로 기록되어 있어서 칸으로 나눌 필요가 없어서'
      answer: 0
      explanation: |
        OpenVLA 논문에 따르면 데이터를 고른 첫째 목표는 모든 학습 dataset 의 입력과 출력 공간을 맞추는 것이다. action 7 개의 뜻이
        같아야 한 vocabulary 의 token 으로 함께 배울 수 있기 때문이다. 다른 로봇의 데이터를 품질 때문에 뺀 것이 아니라 action 의 모양이
        달라서 뺐다. 데이터를 고르면 학습 데이터가 줄어들므로 학습 시간을 늘리려는 목적과 맞지 않는다. 손끝 제어 값도 연속 값이라 칸으로
        나눠야 token 이 된다.

- topic: finetune-lora
  title: 새 로봇 fine-tuning 과 LoRA
  variants:
    - question: |
        여러 로봇의 데이터로 학습한 OpenVLA 를 처음 보는 로봇에 그대로 올리면 잘 움직이지 않는 이유는 무엇인가?
      choices:
        - 'action 의 뜻과 범위, 카메라 위치, 명령 주기가 로봇마다 달라 같은 token 이 다른 움직임이 되기 때문이다'
        - '처음 보는 로봇에서는 action token 의 vocabulary 가 바뀌어 모델이 모르는 token 이 나오기 때문이다'
        - '처음 보는 로봇에서는 image encoder 가 사진을 읽지 못해서, 장면 속 물체를 하나도 찾지 못하기 때문이다'
        - '지시문에 로봇 이름을 넣어야 그 로봇에 맞는 action 을 내는데, 처음 보는 로봇은 이름을 모르기 때문이다'
      answer: 0
      explanation: |
        칸 번호는 학습 데이터의 범위로 되돌리므로 범위가 다른 로봇에서는 같은 token 이 다른 각도나 이동량이 되고, 카메라 위치와 명령 주기도
        달라 사진과 action 의 관계가 바뀐다. 그래서 그 로봇의 시연으로 fine-tuning 한다. vocabulary 는 모델에 고정돼 있어서 로봇이 바뀐다고
        달라지지 않는다. image encoder 는 새 사진도 읽지만, 읽은 장면을 그 로봇의 action 으로 바꾸는 관계를 모를 뿐이다. 로봇 이름은
        OpenVLA 의 입력이 아니므로 넷째 보기는 원인이 아니다.
    - question: |
        LoRA 로 OpenVLA 를 fine-tuning 하면 무엇을 학습하는가?
      choices:
        - '나머지 층은 고정하고 Llama 2 의 마지막 층 하나만 새 로봇에 맞게 학습한다'
        - '모든 weight 를 학습하되, 메모리를 아끼려고 숫자를 4 bit 로 줄여 저장한다'
        - '원래 weight 는 고정하고, 더해 줄 변화량을 작은 행렬 두 개의 곱으로 두어 그 둘만 학습한다'
        - '새 로봇의 장면에 맞추려고 image encoder 만 학습하고 language model 은 고정한다'
      answer: 2
      explanation: |
        LoRA 는 weight 행렬 $W$ 를 고정하고 $W + BA$ 를 쓰며, 얇은 행렬 $B$ 와 $A$ 만 학습한다. OpenVLA 논문에서 LoRA 는 parameter 의 약 1.4%
        만 학습하고 전체 fine-tuning 과 비슷한 성공률을 냈다. 마지막 층만 학습하는 방법은 같은 논문에서 30.3% 로 크게 낮았던 다른
        방법이다. 4 bit 로 저장하는 것은 실행 메모리를 줄이는 quantization 이다. image encoder 만 학습하는 것은 LoRA 의 정의와 관계없다.
    - question: |
        OpenVLA 논문에서 마지막 층만 고치거나 image encoder 를 고정하고 fine-tuning 하면 성공률이 크게 떨어졌다. 이 결과는 무엇을 뜻하는가?
      choices:
        - 'fine-tuning 은 학습할 parameter 가 많을수록 언제나 좋다'
        - '새 장면에 맞게 사진을 읽는 부분까지 고쳐야 새 로봇의 action 을 잘 배운다'
        - 'Llama 2 는 새 로봇 데이터를 배울 수 없다'
        - 'image encoder 는 인터넷 사진으로 학습해서 로봇 사진을 아예 처리하지 못한다'
      answer: 1
      explanation: |
        저자들은 두 방법의 낮은 성능을 보고 새 장면에 맞게 시각 feature 를 더 고치는 것이 중요하다고 해석했다. 학습할 parameter 가 전체의
        약 1.4% 인 LoRA 가 전체 fine-tuning 과 비슷했으므로 parameter 수가 많을수록 좋다는 보기는 틀리다. image encoder 를 고정한 방법도
        Llama 2 는 고쳤으므로 Llama 2 가 배우지 못한다는 결론은 나오지 않는다. 고정한 encoder 도 로봇 사진을 처리해 47.0% 를 냈으므로
        아예 처리하지 못한다는 보기도 틀리다.

- topic: token-weakness
  title: 정밀도·속도·한 step 출력의 한계
  variants:
    - question: |
        OpenVLA 를 더 빠른 GPU 에 올려도 action token 7 개를 한 번에 낼 수 없는 이유는?
      choices:
        - '7 개 token 을 한 번에 내면 weight 를 7 벌 올려야 해서 GPU 메모리가 7 배 들기 때문이다'
        - 'action token 은 vocabulary 끝에 있어서 한 번에 하나만 꺼낼 수 있기 때문이다'
        - 'token 은 정수 번호인데, GPU 는 정수 token 여러 개를 동시에 계산하지 못하기 때문이다'
        - '다음 token 이 앞에서 고른 token 을 입력으로 받아 정해지므로, 7 번을 차례로 계산해야 하기 때문이다'
      answer: 3
      explanation: |
        autoregressive 생성에서는 관절 2 의 token 을 고를 때 관절 1 의 token 이 입력에 있어야 한다. GPU 는 한 번의 계산 안에 있는 곱셈을
        동시에 할 뿐 이 순서를 바꾸지 못하므로, OpenVLA 는 RTX 4090 에서도 1 초에 약 6 번 action 을 내는 데 그친다. 메모리는 7 번의 계산이 같은 weight 를 다시
        쓰므로 7 배가 되지 않는다. token 이 vocabulary 의 어디에 있는지는 생성 순서와 관계없다. GPU 는 token 번호가 아니라 embedding 의 실수
        곱셈을 하므로 셋째 보기도 틀리다.
    - question: |
        관절 범위를 256 칸으로 나눠 칸 폭이 1° 인 VLA 가 있다. 관절에서 손끝까지의 거리가 두 배인 팔에 쓰면 칸 때문에 생기는 손끝
        어긋남은 어떻게 되는가?
      choices:
        - '칸 폭이 1° 로 같아 각도 오차가 최대 0.5° 로 같으므로, 손끝 어긋남도 같다'
        - '각도 오차는 같지만 손끝이 그리는 원의 반지름이 두 배라서 손끝 어긋남도 두 배가 된다'
        - '팔이 길면 같은 범위를 더 잘게 나누므로 칸 폭이 자동으로 절반이 되어 손끝 어긋남이 같다'
        - '팔이 길면 무게 때문에 관절이 더 처져서 각도 오차가 1° 로 두 배가 된다'
      answer: 1
      explanation: |
        칸의 가운데 값으로 되돌리면 각도 오차는 최대 칸 폭의 절반인 0.5° 이고, 손끝이 움직이는 길이는 반지름 × 각도라서 거리가 두 배면
        어긋남도 두 배다. 30 cm 팔에서 약 2.6 mm 이면 60 cm 팔에서는 약 5.2 mm 다. 각도 오차가 같아도 반지름이 다르면 손끝 길이는 달라지므로
        첫째 보기는 틀리다. 칸 폭은 범위와 칸 개수로 정해지고 팔 길이와 관계없다. 각도 오차도 칸 폭으로 정해지므로 팔 길이로 커지지 않는다.
    - question: |
        OpenVLA-OFT 는 OpenVLA 의 느린 속도와 한 번에 한 step 만 내는 문제를 어떻게 줄였는가?
      choices:
        - '칸의 개수를 256 에서 16 으로 줄여서, 확률표가 작아진 만큼 token 을 고르는 계산을 줄였다'
        - 'Llama 2 7B 를 더 큰 language model 로 바꿔서, 계산 한 번에 더 많은 token 을 낼 수 있게 했다'
        - 'parallel decoding 으로 action 자리를 한 번에 내고, action chunking 으로 여러 step 을 묶어 냈다'
        - 'GPU 를 여러 장 써서 token 7 개를 서로 다른 GPU 에서 동시에 계산하게 나눴다'
      answer: 2
      explanation: |
        OpenVLA-OFT 는 token 을 하나씩 고르지 않고 action 자리 전체를 한 번의 계산으로 내며, 8 step 의 action 을 한 묶음으로 내게 바꿔
        A100 에서 1 초에 내는 action 수를 4.2 개에서 108.8 개로 늘렸다. 칸의 개수를 줄이면 정밀도만 떨어지고 token 을 차례로 고르는 순서는
        그대로다. 더 큰 language model 은 계산 한 번이 더 오래 걸려 오히려 느려진다. GPU 를 여러 장 써도 다음 token 이 앞 token 을 기다리는
        순서는 남아서 동시에 계산할 수 없다.
