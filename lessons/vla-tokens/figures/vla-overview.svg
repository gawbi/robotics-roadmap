  <rect x="578" y="90" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="110" fill="#34d399" font-size="12" text-anchor="middle">31,917</text>
  <line x1="648" y1="105" x2="664" y2="105" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="103" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 2</text>
  <text x="668" y="117" fill="#e2e8f0" font-size="12" text-anchor="start">45.5°</text>
  <rect x="578" y="132" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="152" fill="#34d399" font-size="12" text-anchor="middle">31,841</text>
  <line x1="648" y1="147" x2="664" y2="147" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="145" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 3</text>
  <text x="668" y="159" fill="#e2e8f0" font-size="12" text-anchor="start">−30.5°</text>
  <rect x="578" y="174" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="194" fill="#34d399" font-size="12" text-anchor="middle">31,932</text>
  <line x1="648" y1="189" x2="664" y2="189" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="187" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 4</text>
  <text x="668" y="201" fill="#e2e8f0" font-size="12" text-anchor="start">60.5°</text>
  <rect x="578" y="216" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="236" fill="#34d399" font-size="12" text-anchor="middle">31,872</text>
  <line x1="648" y1="231" x2="664" y2="231" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="229" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 5</text>
  <text x="668" y="243" fill="#e2e8f0" font-size="12" text-anchor="start">0.5°</text>
  <rect x="578" y="258" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="278" fill="#34d399" font-size="12" text-anchor="middle">31,859</text>
  <line x1="648" y1="273" x2="664" y2="273" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="271" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 6</text>
  <text x="668" y="285" fill="#e2e8f0" font-size="12" text-anchor="start">−12.5°</text>
  <rect x="578" y="300" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="320" fill="#34d399" font-size="12" text-anchor="middle">31,865</text>
  <line x1="648" y1="315" x2="664" y2="315" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="313" fill="#94a3b8" font-size="10.5" text-anchor="start">집게</text>
  <text x="668" y="327" fill="#e2e8f0" font-size="12" text-anchor="start">30.375°</text>
  <text x="20" y="340" fill="#94a3b8" font-size="12.5" text-anchor="start">사진·지시문이 한 줄의 token 이 되어 Llama 2 에 들어가고, 그 뒤에 action token 이 하나씩 붙는다</text>
</svg>
