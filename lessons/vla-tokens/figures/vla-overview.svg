<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>OpenVLA 의 계산 흐름: 사진은 SigLIP·DINOv2 로 image token, 지시문은 text token 이 되어 Llama 2 7B 에 들어가고, action token 7 개가 하나씩 나와 관절 각도 7 개로 되돌아간다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="40" width="130" height="90" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85" y="72" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 사진</text>
  <text x="85" y="94" fill="#94a3b8" font-size="12" text-anchor="middle">224×224 한 장</text>
  <rect x="20" y="210" width="130" height="90" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="85" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">지시문</text>
  <text x="85" y="262" fill="#f59e0b" font-size="11.5" text-anchor="middle">"put the red cup</text>
  <text x="85" y="280" fill="#f59e0b" font-size="11.5" text-anchor="middle">in the box"</text>
  <line x1="150" y1="85" x2="186" y2="85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="150" y1="255" x2="186" y2="255" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="190" y="45" width="130" height="80" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="255" y="76" fill="#38bdf8" font-size="13" text-anchor="middle">image encoder</text>
  <text x="255" y="98" fill="#94a3b8" font-size="12" text-anchor="middle">SigLIP + DINOv2</text>
  <rect x="190" y="215" width="130" height="80" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="255" y="248" fill="#f59e0b" font-size="13" text-anchor="middle">tokenizer</text>
  <text x="255" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">글 → text token</text>
  <line x1="320" y1="85" x2="350" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="320" y1="255" x2="350" y2="200" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="352" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="378" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="404" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="430" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="458" y="180" fill="#38bdf8" font-size="13" text-anchor="start">…</text>
  <rect x="472" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="498" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="524" y="160" width="22" height="30" rx="3" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="402" y="152" fill="#38bdf8" font-size="11" text-anchor="middle">image token</text>
  <text x="510" y="152" fill="#f59e0b" font-size="11" text-anchor="middle">text token</text>
  <rect x="350" y="215" width="200" height="60" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="242" fill="#a78bfa" font-size="15" text-anchor="middle">Llama 2 7B</text>
  <text x="450" y="262" fill="#94a3b8" font-size="11.5" text-anchor="middle">다음 token 을 하나씩 고른다</text>
  <line x1="450" y1="192" x2="450" y2="212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="550" y1="245" x2="572" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="655" y="34" fill="#34d399" font-size="13" text-anchor="middle">action token 7 개 → 값</text>
  <rect x="578" y="48" width="70" height="30" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="613" y="68" fill="#34d399" font-size="12" text-anchor="middle">31,882</text>
  <line x1="648" y1="63" x2="664" y2="63" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)"/>
  <text x="668" y="61" fill="#94a3b8" font-size="10.5" text-anchor="start">관절 1</text>
