<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>관절 1 의 왕복 계산: 10.3° → 138 번 칸 → token id 31,882 → 모델이 생성 → 31,882 → 138 번 칸 → 10.5°, 오차 0.2°</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190" y="32" fill="#f59e0b" font-size="13" text-anchor="middle">학습: 시연의 action → 정답 token</text>
  <text x="570" y="32" fill="#34d399" font-size="13" text-anchor="middle">실행: 모델이 낸 token → 각도</text>
  <rect x="20" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="72" y="92" fill="#38bdf8" font-size="16" text-anchor="middle">10.3°</text>
  <text x="72" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">시연의 값</text>
  <line x1="124" y1="96" x2="142" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="144" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="196" y="92" fill="#f59e0b" font-size="16" text-anchor="middle">138 번 칸</text>
  <text x="196" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">⌊(10.3 + 128) ÷ 1⌋</text>
  <line x1="248" y1="96" x2="266" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="268" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="92" fill="#f59e0b" font-size="16" text-anchor="middle">31,882</text>
  <text x="320" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">31,744 + 138</text>
  <line x1="372" y1="96" x2="390" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="392" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="444" y="92" fill="#a78bfa" font-size="16" text-anchor="middle">Llama 2</text>
  <text x="444" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">31,882 생성</text>
  <line x1="496" y1="96" x2="514" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="516" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="568" y="92" fill="#34d399" font-size="16" text-anchor="middle">138 번 칸</text>
  <text x="568" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">31,882 − 31,744</text>
  <line x1="620" y1="96" x2="638" y2="96" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="640" y="60" width="104" height="72" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="692" y="92" fill="#34d399" font-size="16" text-anchor="middle">10.5°</text>
  <text x="692" y="116" fill="#94a3b8" font-size="10.5" text-anchor="middle">−128 + 138.5 × 1</text>
  <text x="24" y="180" fill="#f59e0b" font-size="13" text-anchor="start">encode: 10.3 − (−128) = 138.3 → 내림 138 → token id 31,744 + 138 = 31,882</text>
  <text x="24" y="206" fill="#34d399" font-size="13" text-anchor="start">decode: 31,882 − 31,744 = 138 → 가운데 값 −128 + (138 + 0.5) × 1 = 10.5°</text>
  <text x="24" y="232" fill="#94a3b8" font-size="13" text-anchor="start">오차: 10.5 − 10.3 = 0.2° (칸 폭 1° 의 절반 0.5° 를 넘지 않는다)</text>
</svg>
