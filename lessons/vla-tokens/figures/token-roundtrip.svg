<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 Llama tokenizer 의 vocabulary 막대로, 끝쪽의 가장 덜 쓰이는 256 개를 action token 으로 덮어쓴다. 아래는 예로 든 관절 1 의 왕복으로, 10.3° 가 138 번 칸이 되고 138 번 칸의 token 으로 바뀌며, 모델이 그 token 을 생성하면 138 번 칸의 가운데 값 10.5° 로 돌아온다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start">Llama tokenizer 의 vocabulary</text>
  <rect x="40" y="48" width="560" height="34" rx="3" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
  <rect x="600" y="48" width="120" height="34" rx="3" fill="#0d2b22" stroke="#7fc4a2" stroke-width="2"/>
  <text x="320" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">글에 쓰는 일반 token</text>
  <text x="660" y="70" fill="#7fc4a2" font-size="13" text-anchor="middle">action token</text>
  <text x="660" y="102" fill="#7fc4a2" font-size="12" text-anchor="middle">가장 덜 쓰이는 256 개</text>
  <text x="660" y="119" fill="#7fc4a2" font-size="11.5" text-anchor="middle">(vocabulary 의 마지막 256 개)</text>
  <text x="40" y="102" fill="#94a3b8" font-size="11.5" text-anchor="start">앞쪽</text>
  <text x="590" y="102" fill="#94a3b8" font-size="11.5" text-anchor="end">끝쪽</text>
  <line x1="24" y1="140" x2="736" y2="140" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24" y="166" fill="#e2e8f0" font-size="13.5" text-anchor="start">예로 든 관절 1 (범위 −128° ~ +128°, 칸 폭 1°) 의 왕복</text>
  <rect x="24" y="188" width="112" height="64" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="80.0" y="214" fill="#94a3b8" font-size="11.5" text-anchor="middle">시연의 각도</text>
  <text x="80.0" y="236" fill="#7cb4d8" font-size="14" text-anchor="middle">10.3°</text>
  <rect x="160" y="188" width="112" height="64" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="216.0" y="214" fill="#94a3b8" font-size="11.5" text-anchor="middle">칸 번호</text>
  <text x="216.0" y="236" fill="#d6aa62" font-size="14" text-anchor="middle">138 번 칸</text>
  <rect x="296" y="188" width="144" height="64" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="368.0" y="214" fill="#94a3b8" font-size="11.5" text-anchor="middle">action token</text>
  <text x="368.0" y="236" fill="#7fc4a2" font-size="14" text-anchor="middle">138 번 칸의 token</text>
  <rect x="464" y="188" width="112" height="64" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="520.0" y="214" fill="#94a3b8" font-size="11.5" text-anchor="middle">칸 번호</text>
  <text x="520.0" y="236" fill="#d6aa62" font-size="14" text-anchor="middle">138 번 칸</text>
  <rect x="600" y="188" width="136" height="64" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="668.0" y="214" fill="#94a3b8" font-size="11.5" text-anchor="middle">가운데 값</text>
  <text x="668.0" y="236" fill="#7cb4d8" font-size="14" text-anchor="middle">10.5°</text>
  <line x1="136" y1="220" x2="156" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="272" y1="220" x2="292" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="440" y1="220" x2="460" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="576" y1="220" x2="596" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="148" y="276" fill="#94a3b8" font-size="11.5" text-anchor="middle">(10.3 + 128) ÷ 1 = 138.3 → 138</text>
  <text x="368" y="276" fill="#94a3b8" font-size="11.5" text-anchor="middle">모델이 이 token 을 생성</text>
  <text x="600" y="276" fill="#94a3b8" font-size="11.5" text-anchor="middle">−128 + 138.5 × 1 = 10.5</text>
  <text x="24" y="312" fill="#94a3b8" font-size="12" text-anchor="start">학습할 때는 왼쪽 절반(정답 token 만들기), 실행할 때는 오른쪽 절반(token → 각도)을 쓴다. 어긋남은 0.2°</text>
</svg>
