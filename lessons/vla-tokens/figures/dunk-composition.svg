<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>덩크를 동작으로 나누기: 지시 slam dunk 를 VLM 이 공을 골대 위에서 넣기로 해석하고, 그 해석이 시연에 있는 집기, 위로 옮기기, 위에서 놓기로 이어진다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24" y="40" width="170" height="60" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="109" y="66" fill="#94a3b8" font-size="12" text-anchor="middle">지시</text>
  <text x="109" y="88" fill="#f59e0b" font-size="14" text-anchor="middle">"slam dunk"</text>
  <line x1="194" y1="70" x2="236" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="240" y="32" width="456" height="76" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="468" y="60" fill="#a78bfa" font-size="13" text-anchor="middle">VLM 의 지식 (인터넷 사진·글)</text>
  <text x="468" y="86" fill="#e2e8f0" font-size="12.5" text-anchor="middle">주황 공 = 농구공, 링 = 골대, 덩크 = 공을 골대 위에서 아래로 넣기</text>
  <text x="24" y="250" fill="#e2e8f0" font-size="13" text-anchor="start">아래 줄: 시연에서 배운 동작 (모두 흔하다)</text>
  <rect x="60" y="166" width="160" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="199" fill="#38bdf8" font-size="13.5" text-anchor="middle">① 공 집기</text>
  <line x1="468" y1="108" x2="140" y2="162" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow-violet)" stroke-dasharray="4 3"/>
  <line x1="220" y1="193" x2="286" y2="193" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="290" y="166" width="160" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="370" y="199" fill="#38bdf8" font-size="13.5" text-anchor="middle">② 골대 위로 옮기기</text>
  <line x1="468" y1="108" x2="370" y2="162" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow-violet)" stroke-dasharray="4 3"/>
  <line x1="450" y1="193" x2="516" y2="193" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="520" y="166" width="160" height="54" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="199" fill="#38bdf8" font-size="13.5" text-anchor="middle">③ 위에서 놓기</text>
  <line x1="468" y1="108" x2="600" y2="162" stroke="#a78bfa" stroke-width="1.3" marker-end="url(#arrow-violet)" stroke-dasharray="4 3"/>
  <text x="360" y="278" fill="#34d399" font-size="13" text-anchor="middle">이름은 처음이지만 이어지는 손동작은 처음이 아니다</text>
  <text x="360" y="302" fill="#64748b" font-size="11.5" text-anchor="middle">(데모를 낸 쪽의 설명이 아니라 원리를 대어 본 해석)</text>
</svg>
