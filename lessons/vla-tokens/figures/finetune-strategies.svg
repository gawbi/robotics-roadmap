<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>OpenVLA 논문 Table 1 의 fine-tuning 방법 비교. 성공률은 전체 fine-tuning 69.7%, 마지막 층만 30.3%, image encoder 고정 47.0%, sandwich 62.1%, LoRA rank 32 68.2% 이고, 학습하는 parameter 는 각각 약 7,188, 465, 6,760, 914, 98 백만 개다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start">OpenVLA 논문 Table 1: Franka-Tabletop 작업의 fine-tuning 방법 비교</text>
  <text x="180" y="62" fill="#94a3b8" font-size="12" text-anchor="start">성공률</text>
  <text x="560" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">학습하는 parameter</text>
  <text x="690" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">GPU 메모리</text>
  <line x1="180.0" y1="74" x2="180.0" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="180.0" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">0%</text>
  <line x1="255.0" y1="74" x2="255.0" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="255.0" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">20%</text>
  <line x1="330.0" y1="74" x2="330.0" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="330.0" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">40%</text>
  <line x1="405.0" y1="74" x2="405.0" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="405.0" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">60%</text>
  <line x1="480.0" y1="74" x2="480.0" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="480.0" y="318" fill="#94a3b8" font-size="11" text-anchor="middle">80%</text>
  <text x="170" y="104" fill="#e2e8f0" font-size="12.5" text-anchor="end">전체 fine-tuning</text>
  <rect x="180" y="88" width="261.375" height="24" rx="4" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="449.375" y="105" fill="#94a3b8" font-size="12.5" text-anchor="start">69.7%</text>
  <text x="560" y="105" fill="#e2e8f0" font-size="12.5" text-anchor="middle">7,188 백만 개</text>
  <text x="690" y="105" fill="#e2e8f0" font-size="12.5" text-anchor="middle">163.3 GB*</text>
  <text x="170" y="148" fill="#e2e8f0" font-size="12.5" text-anchor="end">마지막 층만</text>
  <rect x="180" y="132" width="113.625" height="24" rx="4" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="301.625" y="149" fill="#f87171" font-size="12.5" text-anchor="start">30.3%</text>
  <text x="560" y="149" fill="#e2e8f0" font-size="12.5" text-anchor="middle">465 백만 개</text>
  <text x="690" y="149" fill="#e2e8f0" font-size="12.5" text-anchor="middle">51.4 GB</text>
  <text x="170" y="192" fill="#e2e8f0" font-size="12.5" text-anchor="end">image encoder 고정</text>
  <rect x="180" y="176" width="176.25" height="24" rx="4" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="364.25" y="193" fill="#f87171" font-size="12.5" text-anchor="start">47.0%</text>
  <text x="560" y="193" fill="#e2e8f0" font-size="12.5" text-anchor="middle">6,760 백만 개</text>
  <text x="690" y="193" fill="#e2e8f0" font-size="12.5" text-anchor="middle">156.2 GB*</text>
  <text x="170" y="236" fill="#e2e8f0" font-size="12.5" text-anchor="end">sandwich</text>
  <rect x="180" y="220" width="232.875" height="24" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420.875" y="237" fill="#f59e0b" font-size="12.5" text-anchor="start">62.1%</text>
  <text x="560" y="237" fill="#e2e8f0" font-size="12.5" text-anchor="middle">914 백만 개</text>
  <text x="690" y="237" fill="#e2e8f0" font-size="12.5" text-anchor="middle">64.0 GB</text>
  <text x="170" y="280" fill="#e2e8f0" font-size="12.5" text-anchor="end">LoRA (rank 32)</text>
  <rect x="180" y="264" width="255.75" height="24" rx="4" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="443.75" y="281" fill="#34d399" font-size="12.5" text-anchor="start">68.2%</text>
  <text x="560" y="281" fill="#e2e8f0" font-size="12.5" text-anchor="middle">98 백만 개</text>
  <text x="690" y="281" fill="#e2e8f0" font-size="12.5" text-anchor="middle">59.7 GB</text>
  <text x="24" y="344" fill="#94a3b8" font-size="11.5" text-anchor="start">* GPU 2 장에 나눠 올린 값. LoRA 는 전체의 약 1.4% 만 학습하고 전체 fine-tuning 과 비슷한 성공률을 냈다</text>
</svg>
