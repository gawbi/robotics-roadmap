<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 구성에서 글이 닿는 곳: (b) 모듈식 구성은 글이 인식기에서 멈추고, VLA 는 글이 action 을 계산하는 network 끝까지 들어간다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start">(b) 모듈식 구성: 글은 인식기까지만 간다</text>
  <rect x="24" y="50" width="150" height="56" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="99" y="74" fill="#f59e0b" font-size="11.5" text-anchor="middle">"put the blue cube</text>
  <text x="99" y="92" fill="#f59e0b" font-size="11.5" text-anchor="middle">in the box"</text>
  <rect x="24" y="114" width="150" height="30" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="99" y="134" fill="#e2e8f0" font-size="12" text-anchor="middle">카메라 사진</text>
  <rect x="230" y="64" width="140" height="66" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="92" fill="#e2e8f0" font-size="14" text-anchor="middle">인식기</text>
  <text x="300" y="114" fill="#94a3b8" font-size="12" text-anchor="middle">이름 → 위치</text>
  <line x1="174" y1="78" x2="226" y2="88" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="174" y1="129" x2="226" y2="112" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="300" y="150" fill="#f59e0b" font-size="11.5" text-anchor="middle">글은 여기서 멈춘다</text>
  <rect x="440" y="64" width="140" height="66" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
  <text x="510" y="92" fill="#e2e8f0" font-size="14" text-anchor="middle">작은 policy</text>
  <text x="510" y="114" fill="#94a3b8" font-size="11.5" text-anchor="middle">위치·관절 각도만 받음</text>
  <line x1="370" y1="97" x2="436" y2="97" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="403" y="88" fill="#94a3b8" font-size="11" text-anchor="middle">(220, 240)</text>
  <line x1="580" y1="97" x2="620" y2="97" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="624" y="74" width="110" height="46" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="679" y="102" fill="#34d399" font-size="13" text-anchor="middle">action</text>
  <line x1="20" y1="168" x2="740" y2="168" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="196" fill="#e2e8f0" font-size="14" text-anchor="start">VLA: 글이 network 안까지 들어간다</text>
  <rect x="24" y="214" width="150" height="56" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="99" y="238" fill="#f59e0b" font-size="11.5" text-anchor="middle">"put the blue cube</text>
  <text x="99" y="256" fill="#f59e0b" font-size="11.5" text-anchor="middle">in the box"</text>
  <rect x="24" y="278" width="150" height="30" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="99" y="298" fill="#e2e8f0" font-size="12" text-anchor="middle">카메라 사진</text>
  <rect x="230" y="222" width="350" height="80" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="405" y="254" fill="#a78bfa" font-size="14" text-anchor="middle">VLM 몸통 + action 출력 (한 덩어리 모델)</text>
  <text x="405" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">사진·글을 함께 읽고 같은 network 가 action 을 계산</text>
  <line x1="174" y1="242" x2="226" y2="252" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="174" y1="293" x2="226" y2="278" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="580" y1="262" x2="620" y2="262" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="624" y="239" width="110" height="46" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="679" y="267" fill="#34d399" font-size="13" text-anchor="middle">action</text>
</svg>
