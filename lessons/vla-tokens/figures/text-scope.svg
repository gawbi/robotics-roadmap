<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>텍스트로 일반화되는 것과 안 되는 것: 처음 보는 물체 이름, 다른 표현, 배운 동작의 조합은 시연의 손동작과 이어지고, 셔츠 개기와 뚜껑 돌려 열기는 이어질 손동작이 없다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="758" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start">지시문 (VLM 이 뜻을 안다)</text>
  <rect x="24" y="48" width="136" height="64" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="92" y="74" fill="#7fc4a2" font-size="12.5" text-anchor="middle">처음 보는 물체 이름</text>
  <text x="92" y="96" fill="#e2e8f0" font-size="11.5" text-anchor="middle">"바나나를 집어"</text>
  <rect x="172" y="48" width="136" height="64" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="240" y="74" fill="#7fc4a2" font-size="12.5" text-anchor="middle">다른 표현</text>
  <text x="240" y="96" fill="#e2e8f0" font-size="11.5" text-anchor="middle">"사과 좀 들어 줄래?"</text>
  <rect x="320" y="48" width="136" height="64" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="388" y="74" fill="#7fc4a2" font-size="12.5" text-anchor="middle">배운 동작의 조합</text>
  <text x="388" y="96" fill="#e2e8f0" font-size="11.5" text-anchor="middle">"집어서 상자에 넣어"</text>
  <rect x="468" y="48" width="136" height="64" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="536" y="74" fill="#d88b8b" font-size="12.5" text-anchor="middle">새 손동작</text>
  <text x="536" y="96" fill="#e2e8f0" font-size="11.5" text-anchor="middle">"셔츠를 개어"</text>
  <rect x="616" y="48" width="136" height="64" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="684" y="74" fill="#d88b8b" font-size="12.5" text-anchor="middle">새 손동작</text>
  <text x="684" y="96" fill="#e2e8f0" font-size="11.5" text-anchor="middle">"뚜껑을 돌려 열어"</text>
  <rect x="110" y="200" width="120" height="46" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="170" y="228" fill="#7cb4d8" font-size="13" text-anchor="middle">집기</text>
  <rect x="330" y="200" width="120" height="46" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="390" y="228" fill="#7cb4d8" font-size="13" text-anchor="middle">위에서 놓기</text>
  <line x1="92" y1="112" x2="160" y2="196" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <line x1="240" y1="112" x2="180" y2="196" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <line x1="388" y1="112" x2="200" y2="196" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <line x1="388" y1="112" x2="390" y2="196" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="486" y="200" width="100" height="46" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="536" y="228" fill="#d88b8b" font-size="12.5" text-anchor="middle">시연에 없음</text>
  <line x1="536" y1="112" x2="536" y2="196" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="634" y="200" width="100" height="46" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="684" y="228" fill="#d88b8b" font-size="12.5" text-anchor="middle">시연에 없음</text>
  <line x1="684" y1="112" x2="684" y2="196" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="24" y="272" fill="#e2e8f0" font-size="13" text-anchor="start">아래 줄: 시연에 있는 손동작 (행동 지식은 여기서만 온다)</text>
  <text x="24" y="302" fill="#94a3b8" font-size="12.5" text-anchor="start">왼쪽 세 지시는 이미 있는 손동작으로 이어지고, 오른쪽 두 지시는 뜻을 알아도 이어질 손동작이 없다</text>
  <text x="24" y="326" fill="#64748b" font-size="12" text-anchor="start">배운 동작의 조합은 집기와 위에서 놓기, 두 칸에 함께 이어진다</text>
</svg>
