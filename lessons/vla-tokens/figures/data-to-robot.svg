<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>OpenVLA 의 학습 데이터와 새 로봇: Open X-Embodiment 의 22 가지 로봇, 100 만 개 이상의 궤적 가운데 바깥 카메라·팔 하나 손끝 제어 데이터 97 만 개로 학습하고, 처음 보는 로봇은 그 로봇의 시연 10 ~ 150 개로 fine-tuning 한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="40" width="210" height="220" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="125" y="66" fill="#7cb4d8" font-size="14" text-anchor="middle">Open X-Embodiment</text>
  <text x="125" y="92" fill="#e2e8f0" font-size="12.5" text-anchor="middle">21 개 기관</text>
  <text x="125" y="114" fill="#e2e8f0" font-size="12.5" text-anchor="middle">로봇 22 가지</text>
  <text x="125" y="136" fill="#e2e8f0" font-size="12.5" text-anchor="middle">시연 100 만 개 이상</text>
  <text x="125" y="158" fill="#e2e8f0" font-size="12.5" text-anchor="middle">skill 527 가지</text>
  <rect x="36" y="186" width="58" height="28" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="65" y="205" fill="#94a3b8" font-size="10.5" text-anchor="middle">팔 하나</text>
  <rect x="100" y="186" width="58" height="28" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="129" y="205" fill="#94a3b8" font-size="10.5" text-anchor="middle">두 팔</text>
  <rect x="164" y="186" width="58" height="28" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="193" y="205" fill="#94a3b8" font-size="10.5" text-anchor="middle">네 발 로봇</text>
  <text x="125" y="240" fill="#64748b" font-size="11" text-anchor="middle">데이터 60 개를 한 형식으로</text>
  <path d="M234,60 L330,110 L330,190 L234,240" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <text x="282" y="154" fill="#94a3b8" font-size="11.5" text-anchor="middle">고르기</text>
  <rect x="334" y="90" width="180" height="120" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="2"/>
  <text x="424" y="118" fill="#a99ad6" font-size="14" text-anchor="middle">OpenVLA 학습</text>
  <text x="424" y="144" fill="#e2e8f0" font-size="11.5" text-anchor="middle">바깥 카메라 + 팔 하나</text>
  <text x="424" y="164" fill="#e2e8f0" font-size="11.5" text-anchor="middle">손끝 제어 데이터만</text>
  <text x="424" y="190" fill="#a99ad6" font-size="13" text-anchor="middle">시연 97 만 개</text>
  <line x1="514" y1="150" x2="556" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="560" y="70" width="180" height="160" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="650" y="98" fill="#7fc4a2" font-size="14" text-anchor="middle">처음 보는 로봇</text>
  <text x="650" y="124" fill="#e2e8f0" font-size="12" text-anchor="middle">그 로봇의 시연</text>
  <text x="650" y="144" fill="#e2e8f0" font-size="12" text-anchor="middle">10 ~ 150 개로</text>
  <text x="650" y="164" fill="#e2e8f0" font-size="12" text-anchor="middle">fine-tuning</text>
  <text x="650" y="196" fill="#94a3b8" font-size="11.5" text-anchor="middle">전체 또는 LoRA</text>
</svg>
