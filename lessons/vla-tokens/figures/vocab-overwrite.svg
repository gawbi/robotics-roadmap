<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Llama 2 의 vocabulary 32,000 칸에서 맨 끝 31,744 ~ 31,999 의 256 개를 action token 으로 덮어쓰고, 칸 번호 b 를 token id 31,744 + b 로 짝짓는다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#e2e8f0" font-size="14" text-anchor="start">Llama 2 의 vocabulary: token id 0 ~ 31,999</text>
  <rect x="40" y="52" width="560" height="34" rx="3" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
  <rect x="600" y="52" width="80" height="34" rx="3" fill="#0d2b22" stroke="#34d399" stroke-width="2"/>
  <text x="320" y="74" fill="#94a3b8" font-size="13" text-anchor="middle">일반 token 31,744 개 (글에 쓰는 단어 조각)</text>
  <text x="640" y="74" fill="#34d399" font-size="12.5" text-anchor="middle">256 개</text>
  <text x="40" y="104" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <text x="600" y="104" fill="#34d399" font-size="11" text-anchor="middle">31,744</text>
  <text x="680" y="104" fill="#34d399" font-size="11" text-anchor="middle">31,999</text>
  <text x="640" y="128" fill="#34d399" font-size="11.5" text-anchor="middle">가장 드물게 쓰는 자리</text>
  <text x="24" y="162" fill="#e2e8f0" font-size="14" text-anchor="start">칸 번호 b → token id = 31,744 + b</text>
  <rect x="60" y="180" width="90" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="105" y="205" fill="#f59e0b" font-size="13" text-anchor="middle">0 번 칸</text>
  <line x1="105" y1="220" x2="105" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="60" y="244" width="90" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="105" y="269" fill="#34d399" font-size="13" text-anchor="middle">31,744</text>
  <rect x="220" y="180" width="90" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="265" y="205" fill="#f59e0b" font-size="13" text-anchor="middle">97 번 칸</text>
  <line x1="265" y1="220" x2="265" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="220" y="244" width="90" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="265" y="269" fill="#34d399" font-size="13" text-anchor="middle">31,841</text>
  <rect x="380" y="180" width="90" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="425" y="205" fill="#f59e0b" font-size="13" text-anchor="middle">138 번 칸</text>
  <line x1="425" y1="220" x2="425" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="380" y="244" width="90" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="425" y="269" fill="#34d399" font-size="13" text-anchor="middle">31,882</text>
  <rect x="540" y="180" width="90" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585" y="205" fill="#f59e0b" font-size="13" text-anchor="middle">255 번 칸</text>
  <line x1="585" y1="220" x2="585" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="540" y="244" width="90" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="585" y="269" fill="#34d399" font-size="13" text-anchor="middle">31,999</text>
</svg>
