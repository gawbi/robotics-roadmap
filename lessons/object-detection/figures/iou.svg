<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>2D IoU. box A (100, 100)–(200, 200) 과 box B (150, 120)–(250, 220) 이 50 × 80 = 4,000 만큼 겹치고, 합친 넓이는 16,000 이라 IoU 는 0.25 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">2D IoU 의 계산 (pixel 좌표)</text>
  <rect x="130.0" y="88.0" width="70.0" height="112.0" rx="2" fill="#d6aa62" fill-opacity="0.35" stroke="#d6aa62" stroke-width="0"/>
  <rect x="60.0" y="60.0" width="140.0" height="140.0" rx="2" fill="none" stroke="#7cb4d8" stroke-width="2"/>
  <rect x="130.0" y="88.0" width="140.0" height="140.0" rx="2" fill="none" stroke="#7fc4a2" stroke-width="2"/>
  <text x="64.0" y="54.0" fill="#7cb4d8" font-size="11.5" text-anchor="start">A (100, 100)–(200, 200)</text>
  <text x="270.0" y="244.0" fill="#7fc4a2" font-size="11.5" text-anchor="end">B (150, 120)–(250, 220)</text>
  <text x="165.0" y="151.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">50 × 80</text>
  <rect x="400.0" y="70.0" width="300.0" height="200.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="416.0" y="100.0" fill="#94a3b8" font-size="12.5" text-anchor="start">겹친 넓이</text>
  <text x="416.0" y="122.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">50 × 80 = 4,000</text>
  <text x="416.0" y="144.0" fill="#94a3b8" font-size="12.5" text-anchor="start">합친 넓이</text>
  <text x="416.0" y="166.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">10,000 + 10,000 − 4,000 = 16,000</text>
  <text x="416.0" y="188.0" fill="#94a3b8" font-size="12.5" text-anchor="start">IoU</text>
  <text x="416.0" y="214.0" fill="#d6aa62" font-size="15" text-anchor="start" font-weight="600">4,000 ÷ 16,000 = 0.25</text>
  <text x="416.0" y="250.0" fill="#94a3b8" font-size="11.5" text-anchor="start">완전히 같으면 1, 안 겹치면 0</text>
</svg>
