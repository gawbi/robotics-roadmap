<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>two-stage 와 one-stage. Faster R-CNN 은 영역 후보를 먼저 고르고 영역마다 분류한다. YOLO 는 사진을 7 × 7 칸으로 나누고 칸마다 box 2 개와 class 20 개를 한 번에 내 7 × 7 × 30 의 출력을 만든다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">two-stage (Faster R-CNN) 와 one-stage (YOLO)</text>
  <rect x="20.0" y="46.0" width="330.0" height="280.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185.0" y="70.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">two-stage: Faster R-CNN</text>
  <rect x="40.0" y="90.0" width="290.0" height="50.0" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1.4"/>
  <text x="185.0" y="111.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진 → backbone</text>
  <text x="185.0" y="129.0" fill="#94a3b8" font-size="11" text-anchor="middle">feature map</text>
  <line x1="185.0" y1="140.0" x2="185.0" y2="158.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="40.0" y="160.0" width="290.0" height="50.0" rx="6" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.4"/>
  <text x="185.0" y="181.0" fill="#e2e8f0" font-size="12" text-anchor="middle">region proposal network</text>
  <text x="185.0" y="199.0" fill="#94a3b8" font-size="11" text-anchor="middle">위치마다 anchor 9 개 → 후보 영역</text>
  <line x1="185.0" y1="210.0" x2="185.0" y2="228.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="40.0" y="230.0" width="290.0" height="50.0" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1.4"/>
  <text x="185.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">후보 영역마다</text>
  <text x="185.0" y="269.0" fill="#94a3b8" font-size="11" text-anchor="middle">class 와 box 다듬기</text>
  <text x="185.0" y="312.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">VOC 2007 mAP 73.2% · 1초에 5 장 (K40)</text>
  <rect x="370.0" y="46.0" width="330.0" height="280.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="535.0" y="70.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">one-stage: YOLO</text>
  <line x1="400.0" y1="90.0" x2="554.0" y2="90.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="90.0" x2="400.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="112.0" x2="554.0" y2="112.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="422.0" y1="90.0" x2="422.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="134.0" x2="554.0" y2="134.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="444.0" y1="90.0" x2="444.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="156.0" x2="554.0" y2="156.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="466.0" y1="90.0" x2="466.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="178.0" x2="554.0" y2="178.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="488.0" y1="90.0" x2="488.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="200.0" x2="554.0" y2="200.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="510.0" y1="90.0" x2="510.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="222.0" x2="554.0" y2="222.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="532.0" y1="90.0" x2="532.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="400.0" y1="244.0" x2="554.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="554.0" y1="90.0" x2="554.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <rect x="466.0" y="134.0" width="22.0" height="22.0" rx="0" fill="#d6aa62" fill-opacity="0.5" stroke="#d6aa62" stroke-width="0"/>
  <rect x="448.4" y="118.6" width="57.2" height="48.4" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <text x="477.0" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">7 × 7 grid</text>
  <text x="570.0" y="110.0" fill="#94a3b8" font-size="11.5" text-anchor="start">물체 가운데가 든 칸이 맡음</text>
  <text x="570.0" y="132.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">칸마다 box 2 개</text>
  <text x="570.0" y="154.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">box 마다 x, y, w, h, conf</text>
  <text x="570.0" y="176.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">칸마다 class 20 개</text>
  <text x="570.0" y="198.0" fill="#d6aa62" font-size="11.5" text-anchor="start">2 × 5 + 20 = 30</text>
  <text x="535.0" y="290.0" fill="#d6aa62" font-size="12" text-anchor="middle" font-weight="600">출력 7 × 7 × 30 을 한 번에</text>
  <text x="535.0" y="312.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">VOC 2007 mAP 63.4% · 1초에 45 장 (Titan X)</text>
</svg>
