<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>box 가운데에서 3D 좌표로. 가운데 (380, 240) 의 depth 0.5 m 로 X = 0.05 m 를 얻는다. 고리 모양 물체는 가운데 pixel 이 뒤의 벽 0.8 m 를 재서 X = 0.08 m, Z = 0.8 m 로 틀린다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">box 가운데 pixel 과 depth 로 3D 좌표 계산 (f = 600, principal point (320, 240), 예로 든 값)</text>
  <rect x="20.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185.0" y="70.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">가운데가 물체 위</text>
  <rect x="145.0" y="120.0" width="80.0" height="80.0" rx="10" fill="#0b1220" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="133.0" y="108.0" width="104.0" height="104.0" rx="2" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="185.0" cy="160.0" r="4" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="185.0" y="226.0" fill="#7fc4a2" font-size="11.5" text-anchor="middle">(380, 240)</text>
  <text x="185.0" y="244.0" fill="#e2e8f0" font-size="12" text-anchor="middle">이 pixel 의 depth 0.5 m</text>
  <text x="185.0" y="264.0" fill="#7fc4a2" font-size="11.5" text-anchor="middle">X = 60 × 0.5 ÷ 600 = 0.05 m · Z = 0.5 m</text>
  <text x="185.0" y="288.0" fill="#94a3b8" font-size="11" text-anchor="middle">물체 위의 depth 라 맞다</text>
  <rect x="370.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="535.0" y="70.0" fill="#d88b8b" font-size="13" text-anchor="middle" font-weight="600">가운데가 빈 고리</text>
  <circle cx="535.0" cy="160.0" r="40" fill="none" stroke="#94a3b8" stroke-width="12"/>
  <rect x="483.0" y="108.0" width="104.0" height="104.0" rx="2" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="535.0" cy="160.0" r="4" fill="#d88b8b" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="535.0" y="226.0" fill="#d88b8b" font-size="11.5" text-anchor="middle">(380, 240)</text>
  <text x="535.0" y="244.0" fill="#e2e8f0" font-size="12" text-anchor="middle">이 pixel 의 depth 0.8 m</text>
  <text x="535.0" y="264.0" fill="#d88b8b" font-size="11.5" text-anchor="middle">X = 60 × 0.8 ÷ 600 = 0.08 m · Z = 0.8 m (벽)</text>
  <text x="535.0" y="288.0" fill="#94a3b8" font-size="11" text-anchor="middle">box 안 depth 의 중앙값이나 mask 를 쓴다</text>
</svg>
