<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>NMS 의 과정. 점수 0.9, 0.8, 0.6 인 box 셋에서 0.9 를 남기고, 0.9 와 IoU 0.75 인 0.8 은 기준 0.7 을 넘어 지우고, IoU 0.3 인 0.6 은 남긴다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">NMS (IoU 기준 0.7, 예로 든 box 셋)</text>
  <rect x="20.0" y="46.0" width="330.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">NMS 전</text>
  <rect x="140.0" y="125.0" width="70.0" height="90.0" rx="10" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="130.0" y="110.0" width="90.0" height="110.0" rx="2" fill="none" stroke="#7cb4d8" stroke-width="2"/>
  <text x="134.0" y="104.0" fill="#7cb4d8" font-size="12" text-anchor="start" font-weight="600">0.9</text>
  <rect x="138.0" y="116.0" width="92.0" height="112.0" rx="2" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <text x="234.0" y="130.0" fill="#d6aa62" font-size="12" text-anchor="start" font-weight="600">0.8</text>
  <rect x="190.0" y="140.0" width="120.0" height="100.0" rx="2" fill="none" stroke="#7fc4a2" stroke-width="2"/>
  <text x="280.0" y="256.0" fill="#7fc4a2" font-size="12" text-anchor="start" font-weight="600">0.6</text>
  <rect x="370.0" y="46.0" width="330.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="535.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">NMS 뒤</text>
  <rect x="490.0" y="125.0" width="70.0" height="90.0" rx="10" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="480.0" y="110.0" width="90.0" height="110.0" rx="2" fill="none" stroke="#7cb4d8" stroke-width="2"/>
  <text x="484.0" y="104.0" fill="#7cb4d8" font-size="12" text-anchor="start" font-weight="600">0.9</text>
  <rect x="488.0" y="116.0" width="92.0" height="112.0" rx="2" fill="none" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="584.0" y="130.0" fill="#d88b8b" font-size="11.5" text-anchor="start">0.8 지움</text>
  <rect x="540.0" y="140.0" width="120.0" height="100.0" rx="2" fill="none" stroke="#7fc4a2" stroke-width="2"/>
  <text x="630.0" y="256.0" fill="#7fc4a2" font-size="12" text-anchor="start" font-weight="600">0.6</text>
  <text x="20.0" y="292.0" fill="#94a3b8" font-size="11" text-anchor="start">0.9 와의 IoU: 0.8 box 는 0.75 (&gt; 0.7, 지움), 0.6 box 는 0.3 (&lt; 0.7, 남김). 남은 0.6 box 가 옆의 다른 물체인지 중복인지는 NMS 가 모른다</text>
</svg>
