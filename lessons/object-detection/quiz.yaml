# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: detection-output
  title: detector 의 출력과 IoU
  section: 분류에서-탐지로
  variants:
    - question: |
        image classifier 와 비교할 때, object detector 가 로봇에게 더 주는 정보는 무엇인가?
      choices:
        - '사진 한 장에 대한 class 하나와 그 확률만'
        - '물체마다 box 와 class, 점수'
        - '물체까지의 거리와 물체의 3D 자세를 함께'
        - '물체를 집을 gripper 의 자세와 힘'
      answer: 1
      explanation: |
        detector 는 물체마다 bounding box, class, 점수를 내므로 사진 속 여러 물체의 위치를 각각 알 수 있다. 사진 한 장에 class 하나와 그 확률만
        내는 것은 image classifier 다. box 는 사진 속 위치일 뿐이라, 거리나 3D 자세를 얻으려면 depth 와 별도 계산이 필요하다. gripper 의 자세와 힘은
        grasp planning 에서 정한다.
    - question: |
        box A (0, 0)–(100, 100) 과 box B (50, 0)–(150, 100) 의 IoU 는 얼마인가?
      choices:
        - '0.5 로, 가로로 정확히 절반이 겹쳤기 때문이다'
        - '0.25 로, 겹친 넓이를 두 넓이의 곱으로 나눈 값이다'
        - '1 로, 두 box 의 크기가 서로 같기 때문이다'
        - '약 0.33 으로, 5,000 ÷ 15,000 이다'
      answer: 3
      explanation: |
        IoU 는 겹친 넓이를 두 box 중 하나라도 덮은 넓이(합친 넓이)로 나눈 값이다. 겹친 넓이는 50 × 100 = 5,000 이고, 합친 넓이는
        10,000 + 10,000 − 5,000 = 15,000 이라 IoU 는 약 0.33 이다. 가로로 절반이 겹쳐도 분모가 box 하나의 넓이가 아니라 합친 넓이라서 0.5 가 아니다.
        IoU 의 분모는 두 넓이의 곱이 아니라 합친 넓이다. 두 box 의 크기가 같아도 위치가 달라 겹치지 않는 부분이 있으면 IoU 는 1 이 아니다.
    - question: |
        detector 를 만들 때 출력의 개수가 문제가 되는 이유는 무엇인가?
      choices:
        - 'box 의 좌표는 정수라서 network 가 실수를 낼 수 없어서'
        - 'class 의 수가 늘면 box 의 수도 반드시 같이 늘어나야 해서'
        - '물체 수는 매번 다른데 출력 크기는 정해져 있어서'
        - '물체가 하나뿐인 사진은 detector 로 처리할 수 없어서'
      answer: 2
      explanation: |
        사진에 물체가 하나일 수도 있고 열 개일 수도 있지만, network 의 출력 크기는 고정되어 있다. two-stage detector 는 후보 영역을 먼저 고르고,
        YOLO 는 정해진 수의 box 를 낸 뒤 점수가 낮은 box 를 버리는 방식으로 이 문제를 푼다. network 는 box 좌표를 실수로 낸다. class 수와 box 수는 따로
        정해진다. detector 는 물체가 하나뿐인 사진도 처리할 수 있다.

- topic: stages
  title: two-stage 와 one-stage
  section: two-stage-와-one-stage
  variants:
    - question: |
        Faster R-CNN 과 YOLO 의 방식 차이로 옳은 것은 무엇인가?
      choices:
        - 'Faster R-CNN 은 후보를 고른 뒤 분류하고, YOLO 는 한 번에 box 를 모두 낸다'
        - 'Faster R-CNN 은 box 를 한 번에 내고, YOLO 는 후보 영역을 먼저 고른다'
        - '두 방식 모두 사진을 7 × 7 grid 로 나눠 칸마다 box 를 두 개씩 낸다'
        - 'YOLO 는 class 를 내지 않고 box 만 내서 Faster R-CNN 보다 빠르다'
      answer: 0
      explanation: |
        Faster R-CNN 은 후보 영역을 내는 region proposal network 와 그 영역을 분류하는 둘째 module 로 된 two-stage detector 이고, YOLO 는 grid
        의 모든 box 를 한 번에 내는 one-stage detector 다. Faster R-CNN 이 box 를 한 번에 내고 YOLO 가 후보를 먼저 고른다는 보기는 두 방식을 거꾸로
        말했다. 사진을 7 × 7 grid 로 나눠 칸마다 box 를 두 개씩 내는 것은 YOLO 만의 방식이다. YOLO 도 칸마다 class 확률을 낸다.
    - question: |
        YOLO 를 PASCAL VOC 에 맞춰 grid 크기 $S = 7$, 칸마다 box 수 $B = 2$, class 수 $C = 20$ 으로 쓰면 출력의 크기는 얼마인가?
      choices:
        - '$7 \times 7 \times 20$ 으로, 칸마다 class 수만큼이다'
        - '$7 \times 7 \times 40$ 으로, 칸마다 $2 \times 20$ 개다'
        - '$7 \times 7 \times 30$, 칸마다 $2 \times 5 + 20$ 개'
        - '$7 \times 7 \times 10$ 으로, 칸마다 box 수의 5 배다'
      answer: 2
      explanation: |
        칸마다 box 2 개가 각각 위치 4 개(가운데 x, y 와 폭 w, 높이 h)와 confidence 1 개를 내서 10 개이고, 여기에 class 확률 20 개를 더해 30 이다.
        $7 \times 7 \times 20$ 은 class 확률만 세서 box 의 값을 빠뜨렸다. $7 \times 7 \times 40$ 은 class 확률을 box 마다 따로 낸다고 본 것인데, YOLO 는
        class 확률을 칸마다 한 번만 낸다. $7 \times 7 \times 10$ 은 box 의 값만 세서 class 확률을 빠뜨렸다.
    - question: |
        YOLO 논문의 저자들이 꼽은 한계로 옳은 것은 무엇인가?
      choices:
        - '후보 영역을 고르는 단계가 느려서 실시간으로 쓸 수 없다'
        - '작은 물체가 모여 있으면 잘 찾지 못한다'
        - 'anchor 의 크기를 dataset 마다 사람이 정해야 한다'
        - 'class 가 20 개를 넘는 dataset 에는 쓸 수 없다'
      answer: 1
      explanation: |
        한 칸이 box 둘과 class 하나만 내므로, 저자들은 새 떼처럼 작은 물체가 모여 있으면 잘 찾지 못한다고 적었다. YOLO 에는 후보 영역을 고르는
        단계가 없고, YOLO 는 1초에 45 장을 처리했다. YOLO 원판은 anchor 를 쓰지 않았다. class 수 $C$ 는 dataset 에 맞춰 바꿀 수 있다.

- topic: anchor
  title: anchor 와 anchor-free
  section: anchor-와-anchor-free
  variants:
    - question: |
        anchor 방식의 detector 에서 network 가 내는 것은 무엇인가?
      choices:
        - '사진 전체에서 가장 큰 물체 하나의 box'
        - '물체의 3D 자세와 카메라에서의 depth'
        - 'box 없이 사진의 pixel 마다 class 만'
        - '미리 정한 box 모양에서의 이동과 크기 변화'
      answer: 3
      explanation: |
        anchor 는 위치마다 미리 정한 box 모양이고, network 는 가장 비슷한 anchor 에서 box 를 얼마나 옮기고 늘릴지를 낸다. Faster R-CNN 은
        위치마다 anchor 9 개를 쓴다. network 는 가장 큰 물체 하나가 아니라 물체마다 box 를 낸다. 3D 자세와 depth 는 detector 의 출력이 아니다. pixel
        마다 class 를 내는 것은 segmentation 이다.
    - question: |
        anchor-free detector 를 쓸 때 사라지는 일은 무엇인가?
      choices:
        - 'NMS 로 같은 물체에 겹친 box 를 지우는 일'
        - 'anchor 의 크기와 비율을 고르는 일'
        - '점수 기준으로 점수가 낮은 box 를 버리는 일'
        - '정답 box 를 붙인 학습 데이터를 모으는 일'
      answer: 1
      explanation: |
        anchor-free 방식은 정해 둔 box 모양 없이 위치마다 box 를 내므로 anchor 의 크기와 비율을 고를 필요가 없다. NMS 는 anchor 와 상관없이
        겹친 box 를 지우는 데 여전히 쓴다. 점수 기준으로 점수가 낮은 box 를 버리는 일도 그대로 남는다. 학습에는 정답 box 를 붙인 데이터가 여전히
        필요하다.
    - question: |
        anchor-free detector 에 대한 설명으로 옳은 것은 무엇인가?
      choices:
        - '작은 물체를 찾기 어려운 문제는 그대로 남는다'
        - '정해 둔 box 모양이 없으니 어떤 크기의 물체든 똑같이 잘 찾는다'
        - 'anchor 가 없어서 box 의 위치를 낼 수 없고 class 만 낸다'
        - 'anchor-free 방식은 NMS 를 쓰면 정확도가 오히려 떨어진다'
      answer: 0
      explanation: |
        anchor-free 방식에서는 anchor 를 고를 필요만 없어지고 작은 물체를 찾기 어려운 문제는 그대로 남아서, COCO 는 넓이 32² pixel 미만 물체의
        AP(detection 정확도 점수)를 따로 낸다. 그래서 anchor-free detector 도 크기와 상관없이 똑같이 잘 찾지는 않는다. anchor-free detector 도 box 의
        위치를 낸다. anchor-free detector 에 NMS 를 쓰면 정확도가 떨어진다는 근거는 없다.

- topic: nms
  title: NMS
  section: nms
  variants:
    - question: |
        점수 0.9, 0.8, 0.6 인 box 셋이 있고, 0.9 box 와의 IoU 는 0.8 box 가 0.75 이고 0.6 box 가 0.3 이다. NMS 기준이 0.7 이면 어떤 box 가 남는가?
      choices:
        - '0.9 만 남고, 나머지는 점수가 낮아 지운다'
        - '셋 모두 남는다. 기준 0.7 보다 점수가 높은 것은 0.9 뿐이다'
        - '0.9 와 0.6 이 남고, IoU 0.75 인 0.8 은 지운다'
        - '0.8 과 0.6 이 남고, 0.9 는 다른 box 와 겹쳐 지운다'
      answer: 2
      explanation: |
        점수가 가장 높은 0.9 box 를 남기고, 그 box 와의 IoU 가 0.75 로 0.7 을 넘는 0.8 box 는 지우며, IoU 가 0.3 인 0.6 box 는 남긴다. NMS 는
        점수가 아니라 IoU 를 기준과 비교하므로 점수가 낮다는 이유로 지우지 않는다. 0.7 은 IoU 와 비교하는 NMS 기준이지 점수와 비교하는 점수 기준이
        아니다. NMS 는 점수가 가장 높은 box 를 지우지 않는다.
    - question: |
        나란히 붙은 두 컵의 box 가 IoU 0.5 로 겹친다. NMS 기준을 0.7 에서 0.45 로 낮추면 어떻게 되는가?
      choices:
        - '두 컵 모두 지워져 아무것도 남지 않는다'
        - '기준을 낮추면 중복만 줄 뿐 두 컵은 늘 남는다'
        - '두 컵의 box 가 하나로 합쳐져 더 큰 box 가 된다'
        - '두 컵 가운데 하나를 같은 물체로 보고 지운다'
      answer: 3
      explanation: |
        IoU 0.5 는 기준 0.45 를 넘으므로 NMS 는 점수가 낮은 컵의 box 를 지운다. 기준 0.7 에서는 0.5 가 기준보다 작아 둘 다 남는다. NMS 는 점수가
        가장 높은 box 를 늘 남기므로 두 box 를 모두 지우지는 않는다. 기준을 낮추면 중복뿐 아니라 붙은 다른 물체도 지울 수 있다. NMS 는 box 를 합치지
        않고 지운다.
    - question: |
        NMS 가 남은 box 에 대해 판단할 수 없는 것은 무엇인가?
      choices:
        - '남은 box 들 가운데 어느 box 의 점수가 가장 높은지'
        - '덜 겹쳐 남은 box 가 다른 물체인지 중복인지'
        - '두 box 의 IoU 가 정해 둔 기준보다 큰지 작은지'
        - '이미 지운 box 를 다시 비교할 필요가 있는지'
      answer: 1
      explanation: |
        NMS 는 점수와 IoU 만 보므로, 덜 겹쳐 남은 box 가 다른 물체인지 같은 물체를 어긋나게 잡은 box 인지 구별하지 못한다. 점수가 가장 높은 box
        를 고르는 일은 NMS 의 첫 단계다. 두 box 의 IoU 를 기준과 비교하는 일도 NMS 가 하는 일이다. 이미 지운 box 는 다시 비교하지 않는다고 NMS 의
        규칙에 정해져 있다.

- topic: map
  title: 점수 기준과 mAP
  section: 점수-기준과-map
  variants:
    - question: |
        COCO 의 mAP 와 PASCAL VOC 2007 의 AP 가 맞은 box 로 치는 기준의 차이는 무엇인가?
      choices:
        - 'VOC 는 IoU 0.5 하나, COCO 는 0.50 ~ 0.95 의 평균'
        - 'VOC 는 IoU 0.95 를 쓰고, COCO 는 IoU 0.5 하나를 쓴다'
        - '두 benchmark 모두 IoU 0.5 하나를 쓰고 class 수만 다르다'
        - 'COCO 는 IoU 대신 box 가운데의 pixel 거리로 맞음을 판정한다'
      answer: 0
      explanation: |
        VOC 는 IoU 0.5 초과를 맞음으로 치고, COCO 는 IoU 0.50, 0.55, …, 0.95 의 10 단계에서 각각 AP 를 내서 평균한다. 그래서 COCO mAP 는 box 를
        정확히 맞혀야 높다. VOC 가 IoU 0.95 를 쓰고 COCO 가 0.5 하나를 쓴다는 보기는 두 benchmark 를 거꾸로 말했다. COCO 는 IoU 0.5 하나가 아니라 10
        단계를 쓴다. box 가운데 사이의 거리로 맞음을 판정하는 것은 자율주행 3D benchmark 인 nuScenes 의 방식이다.
    - question: |
        40 × 40 pixel 인 컵의 box 가 가로로 8 pixel 어긋나 IoU 가 0.67 이다. IoU 0.5 를 맞음 기준으로 쓰는 AP50 과 0.75 를 쓰는 AP75 에서 이 box 의
        판정으로 옳은 것은 무엇인가?
      choices:
        - 'AP50 과 AP75 모두에서 맞은 것으로 센다'
        - 'AP50 과 AP75 모두에서 틀린 것으로 센다'
        - 'AP50 기준으로는 틀리고 AP75 기준으로는 맞는다'
        - 'AP50 기준으로는 맞고 AP75 기준으로는 틀린다'
      answer: 3
      explanation: |
        IoU 0.67 은 0.5 보다 커서 AP50 에서는 맞고, 0.75 보다 작아서 AP75 에서는 틀린다. 그래서 gripper 를 물체 가운데로 보내는 작업에는 AP75 나
        COCO mAP 가 더 가까운 지표다. 0.67 은 0.75 보다 작으므로 AP75 에서는 맞은 것으로 세지 않는다. 0.67 은 0.5 보다 크므로 AP50 에서는 틀린 것으로
        세지 않는다. 기준이 높은 AP75 가 더 엄격하므로 AP50 에서 틀리고 AP75 에서 맞는 판정은 나올 수 없다.
    - question: |
        Ultralytics 가 예측할 때는 점수 기준 0.25 를 쓰면서 평가할 때는 0.001 로 낮추는 이유는 무엇인가?
      choices:
        - '평가 데이터의 물체가 더 작아서 점수가 낮게 나오기 때문에'
        - '0.001 로 낮추면 detector 의 mAP 가 실제보다 높게 나와서'
        - 'precision·recall 곡선 전체를 그려야 해서'
        - '평가에서는 NMS 를 끄기 때문에 점수 기준이 의미가 없어서'
      answer: 2
      explanation: |
        AP 는 점수 기준을 높은 데서 낮은 데로 옮기며 precision(낸 box 가운데 맞은 비율)과 recall(정답 가운데 찾은 비율)이 바뀌는 곡선 아래
        넓이라서, 낮은 점수의 box 까지 모아야 곡선 전체를 그릴 수 있다. 평가 데이터의 물체 크기는 기준을 낮추는 이유가 아니다. 기준을 낮춘다고 mAP 가
        실제보다 부풀지는 않는다. 평가에서도 NMS 를 쓴다.

- topic: labels
  title: 내 물체로 학습하기
  section: 내-물체로-학습하기
  variants:
    - question: |
        Ultralytics detection label 은 한 줄에 `class x_center y_center width height` 를 적고, 좌표는 사진의 가로·세로 길이로 나눠 0 ~ 1 로 적는다.
        640 × 480 사진에서 box (200, 220)–(240, 260) 인 class 0 물체를 이 형식으로 쓰면 무엇인가?
      choices:
        - '`0 200 220 240 260`'
        - '`0 0.34375 0.5 0.0625 0.0833`'
        - '`0 220 240 40 40`'
        - '`0 0.3125 0.4583 0.375 0.5417`'
      answer: 1
      explanation: |
        box 가운데 (220, 240) 을 사진의 가로 640 과 세로 480 으로 나눈 0.34375, 0.5 와, 폭 40 과 높이 40 을 각각 640, 480 으로 나눈 0.0625,
        0.0833 을 적는다. `0 200 220 240 260` 은 꼭짓점을 pixel 로 적어 가운데·폭 형식도 아니고 0 ~ 1 로 나누지도 않았다. `0 220 240 40 40` 은 가운데와
        폭을 pixel 단위로 적어 0 ~ 1 로 나누지 않았다. `0 0.3125 0.4583 0.375 0.5417` 은 꼭짓점 두 개를 0 ~ 1 로 나눈 것이라 가운데·폭 형식이 아니다.
    - question: |
        COCO 로 학습한 detector 에서 출발해 내 물체의 사진으로 fine-tuning 하는 이유는 무엇인가?
      choices:
        - 'COCO 의 80 개 class 에 내 물체가 늘 들어 있어서'
        - 'fine-tuning 을 하면 정답 box 를 붙일 필요가 없어서'
        - '앞 층의 일반적인 특징을 써서 적은 사진으로 학습되어서'
        - 'COCO 로 학습한 model 은 내 사진 없이도 내 물체를 찾아서'
      answer: 2
      explanation: |
        COCO 로 학습한 model 의 앞쪽 층은 모서리와 질감 같은 일반적인 특징을 이미 배워 두었으므로, 처음부터 학습할 때보다 적은 사진으로도 학습할
        수 있다. 로봇이 다루는 부품은 COCO 의 class 80 개에 없는 경우가 많다. fine-tuning 에도 정답 box 를 붙인 사진이 필요하다. COCO 로 학습한 model 은
        class 목록 밖의 물체를 내 사진으로 학습하지 않으면 찾지 못한다.
    - question: |
        Ultralytics detection label 에 가운데·폭 대신 꼭짓점 좌표 $(x_1, y_1, x_2, y_2)$ 를 0 ~ 1 로 나눠 적었다. 이때 생기는 일로 옳은 것은 무엇인가?
      choices:
        - '학습은 오류 없이 진행되지만 box 가 엉뚱한 자리를 배운다'
        - '학습이 시작되자마자 형식 오류로 멈춘다'
        - 'detector 가 자동으로 pixel 단위를 알아채 고쳐 준다'
        - 'class 번호가 하나씩 밀려 다른 물체로 학습된다'
      answer: 0
      explanation: |
        한 줄이 숫자 다섯 개이고 값이 모두 0 ~ 1 이라 label 검사를 통과해 학습은 진행되지만, 좌표의 뜻이 틀려 model 은 엉뚱한 자리의 box 를 배운다. 그래서
        학습 전에 label 을 사진 위에 다시 그려 확인한다. 형식과 범위가 맞으므로 학습이 오류로 멈추지 않는다. detector 는 좌표의 단위를 자동으로 고치지 않는다. class 번호는
        줄의 첫 숫자라서 좌표의 단위와 상관없다.

- topic: box-to-3d
  title: box 에서 3D 좌표로
  section: box-에서-3d-좌표로
  variants:
    - question: |
        카메라의 가로 방향 초점 거리 $f_x$ 는 600 pixel 이고, principal point 의 가로 pixel 좌표 $u$ 는 320 이다. box 가운데의 $u$ 는 380 이고, 그
        자리의 depth 는 0.5 m 다. 물체는 카메라에서 옆으로 얼마나 떨어져 있는가?
      choices:
        - '오른쪽으로 0.5 m'
        - '왼쪽으로 0.05 m'
        - '오른쪽으로 60 m 쯤'
        - '오른쪽으로 0.05 m'
      answer: 3
      explanation: |
        옆 거리 $X$ 는 pixel 차이에 depth 를 곱하고 $f_x$ 로 나눈 값이라 $X = (380 - 320) \times 0.5 \div 600 = 0.05$ m 이고, 양수라 오른쪽이다.
        0.5 m 는 옆 거리가 아니라 앞쪽 depth 다. box 가운데의 $u$ 가 principal point 보다 크면 물체는 왼쪽이 아니라 오른쪽에 있다. pixel 차이 60 은 m
        단위가 아니므로 depth 를 곱하고 $f_x$ 로 나눠야 한다.
    - question: |
        고리 모양 테이프를 찾은 box 의 가운데 pixel 로 depth 를 읽었더니 물체보다 30 cm 먼 값이 나왔다. 원인과 대책으로 옳은 것은 무엇인가?
      choices:
        - 'depth camera 의 고장이므로, 카메라를 바꿔야 한다'
        - '뒤의 벽을 쟀으므로, depth 중앙값이나 mask 를 쓴다'
        - 'detector 의 class 가 틀렸으므로, 다시 학습해야 한다'
        - 'NMS 기준이 너무 높아서이므로, 기준을 0.45 로 낮춘다'
      answer: 1
      explanation: |
        box 는 물체를 둘러싼 직사각형이라, 물체의 가운데가 비어 있으면 가운데 pixel 에서 뒤쪽 벽의 depth 가 나온다. 대책으로 box 안 depth 를
        여러 개 모아 중앙값을 쓰거나 물체 pixel 만 고르는 mask 를 쓴다. depth camera 는 고장 난 것이 아니라 뒤쪽 벽까지의 거리를 맞게 잰 것이다. class 가
        맞아도 가운데 pixel 이 벽 위에 있으면 같은 일이 생긴다. NMS 기준은 겹친 box 를 지우는 데 쓰며 depth 와 상관없다.
    - question: |
        box 가운데에서 계산한 camera frame 의 3D 점을 로봇 팔이 갈 좌표로 쓰려면 무엇이 더 필요한가?
      choices:
        - '사진의 class 확률을 모두 더한 값'
        - 'NMS 에서 지운 나머지 box 들의 좌표'
        - 'COCO 에서 잰 그 detector 의 mAP'
        - '카메라와 robot base 사이의 변환'
      answer: 3
      explanation: |
        camera frame 의 점에 카메라에서 robot base(로봇 팔이 고정된 바닥 부분)로 가는 변환을 곱해야 팔이 갈 좌표가 된다. 손목 카메라라면 그
        변환은 hand-eye calibration 으로 구한다. class 확률을 모두 더한 값은 좌표 계산에 쓰지 않는다. NMS 에서 지운 box 는 중복이라 위치 정보를 더해
        주지 않는다. mAP 는 detector 의 평균 성능을 잰 점수일 뿐 이 점의 좌표와 상관없다.

- topic: track-and-name
  title: 추적과 이름으로 찾는 detector
  section: 2d-추적
  variants:
    - question: |
        사람이 컵 앞을 지나가 컵의 점수가 0.2 로 떨어졌다. 점수 기준 0.25 만 쓰는 추적과 비교해 ByteTrack 이 하는 일은 무엇인가?
      choices:
        - '점수 기준을 0 으로 낮춰 모든 box 를 새 물체로 추가한다'
        - '가려진 동안은 추적을 멈추고, 다시 보이면 새 번호를 붙인다'
        - '남은 컵을 낮은 점수 box 와 다시 짝지어 번호를 지킨다'
        - '사람의 box 를 컵으로 바꿔 컵의 번호를 이어 붙인다'
      answer: 2
      explanation: |
        ByteTrack 은 두 번 짝짓는다. 첫 단계에서 짝을 못 찾은 기존 물체를 둘째 단계에서 낮은 점수의 box 와 이어 가려진 물체를 되살린다. ByteTrack
        은 모든 box 를 새 물체로 추가하지 않고, 기존 물체와 이어지지 않는 낮은 점수의 box 는 배경으로 버린다. 다시 보일 때 새 번호를 붙이는 것은 점수
        기준만 쓰는 추적에서 생기는 문제다. ByteTrack 은 사람의 box 를 컵의 box 로 바꾸지 않는다.
    - question: |
        Ultralytics 의 추적 기본 tracker 에 대한 설명으로 옳은 것은 무엇인가?
      choices:
        - '판마다 바뀌어 와서 쓰는 판의 기본값을 확인한다'
        - '처음부터 지금까지 늘 ByteTrack 하나만 지원한다'
        - 'tracker 는 detector 의 점수 기준을 정하는 설정일 뿐이다'
        - '기본 tracker 는 사용하는 GPU 의 종류에 따라 자동으로 정해진다'
      answer: 0
      explanation: |
        2024 년 판의 기본 tracker 는 BoT-SORT 였고 2026 년 6 월에 TrackTrack 으로 바뀌었으므로, 쓰는 판의 기본값을 확인해야 한다. Ultralytics 는
        ByteTrack 하나가 아니라 여러 tracker 를 지원한다. tracker 는 점수 기준을 정하는 설정이 아니라 프레임 사이에서 box 를 잇는 일을 한다. 기본 tracker
        는 GPU 의 종류에 따라 정해지지 않는다.
    - question: |
        "창가에 있는 빨간 상자" 처럼 말로 준 대상을 찾을 때 COCO 로 학습한 일반 detector 대신 Grounding DINO 같은 open-vocabulary detector 를 쓰는 이유는 무엇인가?
      choices:
        - 'COCO detector 보다 늘 빠르고 가벼워서 로봇에 올리기 쉬워서'
        - 'class 목록에 없어도 글로 준 이름에 맞는 물체를 찾아서'
        - '정답 box 없이도 학습한 COCO detector 와 정확도가 늘 같아서'
        - '말로 준 대상의 3D 자세까지 함께 내기 때문에'
      answer: 1
      section: 이름으로-찾는-detector
      explanation: |
        open-vocabulary detector 는 글로 준 이름이나 설명을 받아 그에 맞는 물체를 찾으므로 class 목록 밖의 대상도 다룬다. open-vocabulary detector
        는 YOLO 보다 계산이 무거운 경우가 많아서 처음 찾을 때만 쓰기도 한다. 정확도는 model 크기와 pretraining 데이터에 따라 달라서 COCO detector 와 늘
        같지 않다. open-vocabulary detector 도 사진 속 box 를 낼 뿐 3D 자세는 내지 않는다.
