  <text x="360.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">평면에서 0.1 m 안에 드는 점(초록 띠)을 inlier 로 센다. 실제로는 3D 점 3개로 평면을 정하고, 그림은 그 평면을 옆에서 본 선이다</text>
  <text x="360.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="middle">채택한 평면의 inlier 는 땅으로 지우고, 나머지 점(차)만 다음 단계로 넘긴다</text>
