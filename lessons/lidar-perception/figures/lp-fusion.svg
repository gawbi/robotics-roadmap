<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>camera-LiDAR fusion 의 투영. LiDAR frame 의 점 (10, 1, 0.5) m 를 extrinsic 으로 camera frame (−1, −0.5, 10) m 로 옮기고 intrinsic(f = 700 px, 중심 640, 360)으로 pixel (570, 325) 에 투영한 뒤, 그 pixel 의 segmentation 점수를 점에 붙인다. extrinsic 이 1° 틀리면 약 12 px, 시각이 50 ms 어긋나면 20 m/s 인 차는 1 m 어긋난다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="798" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="400.0" y="28.0" fill="#e2e8f0" font-size="13" text-anchor="middle">LiDAR 점 하나를 사진 위에 투영해 class 점수를 붙이는 과정 (PointPainting)</text>
  <rect x="20.0" y="70.0" width="160.0" height="84.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="100.0" y="96.0" fill="#7cb4d8" font-size="12" text-anchor="middle" font-weight="600">LiDAR frame</text>
  <text x="100.0" y="118.0" fill="#e2e8f0" font-size="11" text-anchor="middle">x 앞 10, y 왼쪽 1, z 위 0.5</text>
  <text x="100.0" y="138.0" fill="#e2e8f0" font-size="11" text-anchor="middle">(10, 1, 0.5) m</text>
  <rect x="200.0" y="70.0" width="160.0" height="84.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="280.0" y="96.0" fill="#a99ad6" font-size="12" text-anchor="middle" font-weight="600">camera frame</text>
  <text x="280.0" y="118.0" fill="#e2e8f0" font-size="11" text-anchor="middle">X 오른쪽, Y 아래, Z 앞</text>
  <text x="280.0" y="138.0" fill="#e2e8f0" font-size="11" text-anchor="middle">(−1, −0.5, 10) m</text>
  <rect x="380.0" y="70.0" width="200.0" height="84.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="480.0" y="96.0" fill="#d6aa62" font-size="12" text-anchor="middle" font-weight="600">pixel</text>
  <text x="480.0" y="118.0" fill="#e2e8f0" font-size="11" text-anchor="middle">u = 700 × (−1 ÷ 10) + 640 = 570</text>
  <text x="480.0" y="138.0" fill="#e2e8f0" font-size="11" text-anchor="middle">v = 700 × (−0.5 ÷ 10) + 360 = 325</text>
  <rect x="600.0" y="70.0" width="180.0" height="84.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="690.0" y="96.0" fill="#7fc4a2" font-size="12" text-anchor="middle" font-weight="600">칠한 점</text>
  <text x="690.0" y="118.0" fill="#e2e8f0" font-size="11" text-anchor="middle">(10, 1, 0.5, 반사 세기,</text>
  <text x="690.0" y="138.0" fill="#e2e8f0" font-size="11" text-anchor="middle">사람 0.9, 차 0.05, …)</text>
  <line x1="182.0" y1="112.0" x2="198.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="362.0" y1="112.0" x2="378.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="582.0" y1="112.0" x2="598.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="190.0" y="176.0" fill="#94a3b8" font-size="11" text-anchor="middle">extrinsic</text>
  <text x="370.0" y="176.0" fill="#94a3b8" font-size="11" text-anchor="middle">intrinsic</text>
  <text x="590.0" y="176.0" fill="#94a3b8" font-size="11" text-anchor="middle">segmentation</text>
  <text x="400.0" y="214.0" fill="#94a3b8" font-size="11" text-anchor="middle">이 예의 숫자는 설명을 위해 정한 값이다: 두 센서의 원점이 같고, f = 700 px, 사진 중심 (640, 360)</text>
  <rect x="60.0" y="236.0" width="320.0" height="64.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="220.0" y="260.0" fill="#d88b8b" font-size="12" text-anchor="middle" font-weight="600">extrinsic 이 1° 틀리면</text>
  <text x="220.0" y="282.0" fill="#e2e8f0" font-size="11" text-anchor="middle">700 × tan 1° ≈ 12 px 어긋남 (30 m 사람 폭 ≈ 12 px)</text>
  <rect x="420.0" y="236.0" width="320.0" height="64.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="580.0" y="260.0" fill="#d88b8b" font-size="12" text-anchor="middle" font-weight="600">사진과 scan 이 50 ms 어긋나면</text>
  <text x="580.0" y="282.0" fill="#e2e8f0" font-size="11" text-anchor="middle">20 m/s 로 달리는 차는 그사이 1 m 를 움직인다</text>
</svg>
