  <text x="474.0" y="218.0" fill="#a78bfa" font-size="12" text-anchor="middle" font-weight="600">③ pseudo-image</text>
  <text x="474.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="middle">64 channel × 500 × 440</text>
  <text x="474.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">pillar 를 제자리 칸에 다시 놓음</text>
