  <text x="625.0" y="133.0" fill="#34d399" font-size="12" text-anchor="middle" font-weight="600">④ 2D CNN</text>
  <text x="625.0" y="153.0" fill="#94a3b8" font-size="11" text-anchor="middle">backbone</text>
  <line x1="682.0" y1="140.0" x2="708.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="710.0" y="95.0" width="115.0" height="90.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="767.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">⑤ detection head</text>
  <text x="767.0" y="142.0" fill="#94a3b8" font-size="11" text-anchor="middle">x, y, z, w, l, h, θ</text>
  <text x="767.0" y="160.0" fill="#94a3b8" font-size="11" text-anchor="middle">+ class 점수</text>
  <text x="420.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">논문의 측정(GTX 1080 Ti): 전체 16.2 ms(62 Hz), 그중 pillar encoder 1.3 ms. 같은 일을 하는 VoxelNet encoder 는 190 ms</text>
  <text x="420.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="middle">높이 방향을 칸으로 나누지 않아 3D convolution 없이 사진용 2D convolution 만 쓴다</text>
</svg>
