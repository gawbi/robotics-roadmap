  <title>PointPillars 의 구조. 땅을 0.16 m 칸으로 나눈 기둥(pillar)마다 점 최대 100 개의 숫자 9 개를 선형층과 최댓값으로 숫자 64 개로 줄이고, 이를 제자리에 놓은 64 channel pseudo-image 를 2D CNN 과 detection head 에 넣어 3D box 와 class 를 낸다</title>
