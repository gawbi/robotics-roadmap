  <text x="100.0" y="232.0" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="600">① 땅을 0.16 m 칸으로 나눔</text>
  <text x="100.0" y="250.0" fill="#94a3b8" font-size="11" text-anchor="middle">칸 하나 = 높이 전체 기둥 (pillar)</text>
  <text x="100.0" y="268.0" fill="#94a3b8" font-size="11" text-anchor="middle">440 × 500 칸 중 점이 있는 칸 6 ~ 9 천</text>
  <line x1="180.0" y1="140.0" x2="208.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="210.0" y="95.0" width="150.0" height="90.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="285.0" y="120.0" fill="#f59e0b" font-size="12" text-anchor="middle" font-weight="600">② pillar 마다</text>
  <text x="285.0" y="140.0" fill="#e2e8f0" font-size="11" text-anchor="middle">점 ≤ 100 개 × 숫자 9 개</text>
  <text x="285.0" y="158.0" fill="#e2e8f0" font-size="11" text-anchor="middle">→ 선형층 → 64 개</text>
  <text x="285.0" y="176.0" fill="#e2e8f0" font-size="11" text-anchor="middle">→ 점들 중 최댓값</text>
  <text x="285.0" y="210.0" fill="#94a3b8" font-size="11" text-anchor="middle">pillar 하나가 숫자 64 개</text>
  <line x1="362.0" y1="140.0" x2="398.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="400" y="82" width="100" height="90" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="408" y="90" width="100" height="90" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="416" y="98" width="100" height="90" rx="4" fill="#111a2e" stroke="#a78bfa" stroke-width="1.2"/>
