# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: point-density
  title: 거리와 point cloud 밀도
  section: point-cloud
  variants:
    - question: |
        회전형 LiDAR 의 point cloud 에서 먼 물체일수록 점이 적게 찍히는 이유는 무엇인가?
      choices:
        - 'beam 사이 각도와 가로 각도 간격이 정해져 있어, 점 사이 간격이 거리에 비례해 벌어지기 때문이다'
        - '먼 곳에서 돌아온 레이저는 약해져서, 센서가 noise 를 줄이려고 점의 절반을 무작위로 버리기 때문이다'
        - '센서가 1초에 낼 점 수를 가까운 물체부터 할당하고, 남는 점만 먼 곳에 쓰기 때문이다'
        - '먼 물체는 상대 움직임이 커서 motion distortion 보정 중에 점이 지워지기 때문이다'
      answer: 0
      explanation: |
        beam 은 위아래로 일정한 각도(예: 2°)마다 놓이고 가로로도 일정한 각도마다 점을 찍으므로, 같은 각도가 만드는 간격은 거리에 비례해 커진다. 2° 간격이면
        10 m 에서 약 0.35 m, 30 m 에서 약 1.05 m 라서 같은 사람에게 닿는 ring 수가 줄어든다. 반사가 약하면 점이 안 찍힐 수는 있지만 무작위로 절반을 버리는
        규칙은 없고, 점을 가까운 곳부터 할당하거나 distortion 보정이 점을 지우는 일도 없다.
    - question: |
        1초에 30만 점을 내는 16-beam LiDAR 를 10 Hz 로 쓴다. scan 하나에 점이 대략 몇 개 들어 있는가?
      choices:
        - '300 개'
        - '3,000 개'
        - '30,000 개'
        - '300,000 개'
      answer: 2
      explanation: |
        10 Hz 는 1초에 scan 10 개를 만든다는 뜻이라 scan 하나의 점 수는 $300{,}000 \div 10 = 30{,}000$ 개다. 300,000 개는 1초 동안의 전체 점 수이고, 3,000 이나
        300 은 회전 주기나 beam 수로 한 번 더 나눈 잘못된 계산이다.
    - question: |
        10 Hz 회전형 LiDAR 를 단 차가 15 m/s 로 달릴 때, 한 scan 의 점을 그대로 쓰면 어떤 문제가 생기는가?
      choices:
        - '차의 속도만큼 점의 좌표 단위가 바뀌어서, 거리가 15 배로 크게 계산된다'
        - '0.1 초 동안 차가 1.5 m 움직여서, 처음과 마지막 점의 기준 위치가 달라 물체가 휘어 보인다'
        - '차가 움직이면 반사된 레이저가 센서로 돌아오지 못해서, scan 의 절반 가까이가 비어 있다'
        - 'scan 이 0.1 초마다 오므로, 속도에 따라 점 수가 1초에 15 개로 줄어든다'
      answer: 1
      explanation: |
        회전형 LiDAR 는 한 scan 을 한 순간에 찍지 않고 한 바퀴 도는 동안 나눠 찍는다. 10 Hz 면 첫 점과 마지막 점 사이가 0.1 초이고 그동안 15 m/s 인 차는
        $15 \times 0.1 = 1.5$ m 를 가므로, 점마다 찍힌 시각의 차량 위치로 옮기는 distortion 보정이 필요하다. 단위가 바뀌거나 레이저가 돌아오지 않거나 점 수가
        속도에 따라 줄어드는 일은 없다.

- topic: voxel-downsampling
  title: voxel downsampling
  section: voxel-downsampling
  variants:
    - question: |
        voxel downsampling 은 point cloud 를 어떻게 줄이는가?
      choices:
        - '전체 점에서 일정한 비율을 무작위로 골라 남겨서, 점 수를 정한 만큼 줄인다'
        - '반사 세기가 약한 점부터 차례로 지워서, noise 일 가능성이 큰 점을 먼저 없앤다'
        - '센서에서 일정 거리보다 먼 점을 모두 지워서, 점 간격이 넓은 곳을 버린다'
        - '공간을 같은 크기의 정육면체 칸으로 나누고, 칸마다 평균 위치 하나만 남긴다'
      answer: 3
      explanation: |
        voxel 은 공간을 같은 크기로 자른 칸이고, voxel downsampling 은 칸마다 점을 하나(평균 위치)로 바꾼다. 그래서 점이 몰린 곳은 많이 줄고 듬성한 곳은
        거의 그대로라 밀도가 고르게 된다. 무작위 선택은 촘촘한 곳과 듬성한 곳을 같은 비율로 줄여 밀도 차이가 남고, 반사 세기나 거리로 지우는 것은 다른
        filter 다.
    - question: |
        voxel downsampling 을 하면 센서 가까운 곳과 먼 곳의 점은 각각 어떻게 줄어드는가?
      choices:
        - '칸마다 점을 같은 비율로 남기므로, 가까운 곳과 먼 곳이 같은 비율로 줄어든다'
        - '가까운 곳은 한 칸에 점이 많아 크게 줄고, 먼 곳은 점이 적어 조금만 준다'
        - '가까운 곳은 점이 정확해서 그대로 남고, 먼 곳의 점만 골라 지워진다'
        - '먼 곳은 칸이 거리에 맞춰 커지므로, 가까운 곳보다 더 많이 줄어든다'
      answer: 1
      explanation: |
        칸의 크기는 어디서나 같고 칸마다 점 하나만 남는다. 가까운 곳은 점 간격이 좁아 한 칸에 점이 많이(예: 12 개) 들어가니 크게 줄고, 먼 곳은 한 칸에
        한두 개뿐이라 거의 줄지 않는다. 그래서 같은 비율로 줄지 않고, 칸 크기가 거리에 따라 바뀌지도 않는다.
    - question: |
        leaf size(voxel 한 변)를 너무 크게 잡으면 뒤의 물체 검출에 어떤 문제가 생길 수 있는가?
      choices:
        - '먼 작은 물체의 점이 한두 개로 합쳐져, 최소 점 수를 못 채우고 사라질 수 있다'
        - '한 칸에 담기는 점이 많아져 점이 오히려 늘어나고, 그만큼 계산이 무거워진다'
        - '땅의 점이 큰 칸의 평균 위치로 위로 들려서, RANSAC 이 땅 평면을 찾지 못한다'
        - '칸이 커지면 좌표가 정수로 바뀌어 저장 형식이 달라지므로, detector 가 읽지 못한다'
      answer: 0
      explanation: |
        칸이 커지면 한 칸에 들어가는 점이 많아지고 그 점들이 하나로 합쳐진다. 원래 점이 몇 개뿐인 먼 사람은 점이 한두 개로 줄어 최소 점 수 조건에 걸릴 수
        있다. leaf size 를 키우면 점은 줄어들지 늘지 않고, 땅 점을 들어 올리거나 좌표를 정수로 바꾸지도 않는다.

- topic: ransac-ground
  title: RANSAC ground removal
  section: ransac-ground-removal
  variants:
    - question: |
        땅 평면을 찾을 때 least squares 대신 RANSAC 을 쓰는 이유는 무엇인가?
      choices:
        - 'RANSAC 은 반복 없이 한 번에 답을 구하므로, 모든 점을 쓰는 least squares 보다 계산이 빠르다'
        - 'least squares 는 직선만 구할 수 있어서, 3차원의 평면에는 쓸 수 없다'
        - 'least squares 는 땅이 아닌 점까지 맞추려다 기울지만, RANSAC 은 후보 평면의 inlier 수만 센다'
        - 'RANSAC 은 경사진 길까지 평면 하나로 정확히 맞춰서, 기울기가 바뀌는 도로에도 강하다'
      answer: 2
      explanation: |
        least squares 는 모든 점의 오차 제곱합을 줄이므로 땅이 아닌 점이 섞이면 평면이 그쪽으로 끌려간다. RANSAC 은 점 3 개로 만든 후보 평면마다 정한 거리 안의
        점 수만 세서, 땅 점만 뽑힌 후보가 가장 많은 inlier 를 얻는다. RANSAC 은 여러 번 반복하는 방법이고, least squares 도 평면을 구할 수 있으며, RANSAC
        평면도 평면 하나라는 가정 때문에 경사진 길에는 약하다.
    - question: |
        땅 점의 비율이 낮아지면 RANSAC 에 필요한 반복 횟수는 어떻게 되는가? (평면은 점 3 개로 정하고, 땅 점만 뽑는 경우가 적어도 한 번 나올 확률을 99% 로 맞춘다)
      choices:
        - '반복 횟수는 99% 라는 확률로만 정해져서, 땅 점 비율과 관계없이 일정하다'
        - '땅 점이 적으면 셀 inlier 도 적어 한 번의 확인이 빨라지므로, 반복 횟수가 오히려 줄어든다'
        - '땅 점 비율에 정확히 반비례해서, 비율이 절반이 되면 반복도 두 배가 된다'
        - '3 개가 모두 땅일 확률이 비율의 세제곱으로 떨어져, 반복 횟수가 빠르게 늘어난다'
      answer: 3
      explanation: |
        한 번에 뽑은 3 개가 모두 땅일 확률은 $w^3$ 이고, 필요한 반복은 $\log(1 - 0.99) \div \log(1 - w^3)$ 이다. $w = 0.8$ 이면 7 번이지만 0.4 면 70 번,
        0.2 면 574 번으로 빠르게 늘어난다. 그래서 RANSAC 에 넣기 전에 땅이 있을 만한 영역만 잘라 땅 점 비율을 올려 둔다.
    - question: |
        RANSAC 으로 찾은 평면 하나를 땅으로 쓰는 방식이 오르막길 앞에서 실패하는 이유는 무엇인가?
      choices:
        - '오르막의 점은 레이저가 비스듬히 닿아 반사 세기가 약해서, inlier 로 세지 않는다'
        - '땅이 평면 하나라고 가정해서, 평면보다 높아진 먼 오르막의 땅 점을 물체로 분류한다'
        - 'RANSAC 은 차가 멈춰 있을 때만 동작해서, 오르막을 오르는 동안에는 땅을 못 찾는다'
        - '오르막에서는 점이 3 개보다 적게 찍혀서, 평면 하나를 정할 수 없다'
      answer: 1
      explanation: |
        평면 하나로는 기울기가 바뀌는 땅을 나타낼 수 없다. 10 m 앞에서 10% 오르막이 시작되면 30 m 지점의 땅은 평면보다 2 m 높아 벽 같은 물체로 남는다.
        그래서 beam 을 따라 이웃 점 사이의 기울기로 땅을 판단하는 방법(Autoware 의 scan_ground_filter)을 쓴다. 반사 세기나 차의 정지 여부, 점 수 부족은
        이 실패의 원인이 아니다.

- topic: euclidean-clustering
  title: Euclidean clustering 과 상자
  section: euclidean-clustering
  variants:
    - question: |
        Euclidean clustering 의 tolerance 를 줄이면 결과가 어떻게 바뀌는가?
      choices:
        - '붙은 두 물체는 잘 나뉘지만, 점 간격이 넓은 먼 물체는 여러 무리로 쪼개지기 쉽다'
        - '묶는 기준이 엄격해질 뿐이라, 모든 물체가 더 정확히 나뉘고 단점은 없다'
        - '이웃으로 보는 거리가 달라져 더 먼 점까지 한 무리로 묶이므로, 무리 수가 줄고 상자가 커진다'
        - '지웠던 땅 점이 다시 이웃으로 잡혀서, 모든 물체가 한 무리가 된다'
      answer: 0
      explanation: |
        tolerance 는 같은 무리로 묶을 이웃의 최대 거리다. 줄이면 0.5 m 떨어진 두 사람처럼 붙은 물체가 나뉘지만, 한 물체 안에서도 점 간격이 tolerance 를
        넘는 곳(먼 거리, 가려진 부분)이 생기면 그 물체가 쪼개진다. 무리 수는 오히려 늘어나고, tolerance 가 땅 점을 되살리지도 않는다.
    - question: |
        LiDAR clustering 에서 땅 점을 먼저 지우지 않으면 어떤 일이 생기는가?
      choices:
        - '땅 점만큼 이웃을 찾는 계산이 늘어 느려질 뿐이고, 나오는 무리와 상자는 같다'
        - '땅 점은 반사 세기가 커서, 넓은 땅 전체가 큰 물체 하나로 따로 분류된다'
        - '땅 점은 scan 의 일부일 뿐이라 너무 적어서, 결과에 아무 영향이 없다'
        - '땅 점이 물체 사이를 끊김 없이 채워서, 차·사람·가로등이 땅을 타고 한 무리로 묶인다'
      answer: 3
      explanation: |
        Euclidean clustering 은 거리 안의 이웃을 따라 무리를 넓혀 가므로, 물체 사이를 촘촘히 채운 땅 점이 있으면 서로 다른 물체가 땅을 통해 이어진다. 그래서
        결과가 크게 달라지고, 땅 점은 scan 의 상당 부분이라 적지도 않다. 반사 세기는 clustering 의 기준이 아니다.
    - question: |
        비스듬히 서 있는 차의 점 무리에 x·y 최솟값·최댓값으로 상자를 씌우면 어떤 문제가 있고, 어떻게 고치는가?
      choices:
        - '상자가 실제보다 작아져 차의 일부가 밖으로 삐져나오므로, 더 촘촘한 LiDAR 로 점을 늘려 고친다'
        - '문제없다. x·y 최솟값·최댓값으로 만든 상자가 방향과 관계없이 늘 점을 감싸는 가장 작은 상자가 된다'
        - '돌아간 만큼 상자가 부풀어 옆 차로를 막은 것처럼 보이므로, L-shape fitting 으로 고친다'
        - '점이 L 자로 찍혀서 상자 높이가 0 이 되므로, 높이를 따로 재서 고친다'
      answer: 2
      explanation: |
        축에 맞춘 상자는 물체가 돌아가 있으면 대각선 방향으로 늘어난 만큼 커진다. 30° 돌아간 4.5 × 1.8 m 차는 약 4.8 × 3.8 m 상자가 되어 넓이가 두 배를
        넘는다. LiDAR 는 센서 쪽 두 면만 보아 점이 L 자로 찍히므로, 여러 방향을 시험해 L 에 맞는 직사각형을 찾으면 실제 크기와 방향의 상자를 얻는다. 상자가
        작아지거나 높이가 0 이 되는 문제는 아니다.

- topic: pointpillars
  title: PointPillars
  section: pointpillars
  variants:
    - question: |
        PointPillars 가 VoxelNet 보다 훨씬 빠른 이유는 무엇인가?
      choices:
        - '점을 처음부터 1% 만 남기고 나머지는 버려서, network 에 들어가는 점 수가 아주 적기 때문이다'
        - 'pillar 를 2D pseudo-image 로 펴서 2D convolution 만 쓰기 때문이다'
        - 'CNN 을 쓰지 않고, 거리로 점을 묶는 규칙 기반 clustering 만 쓰기 때문이다'
        - 'GPU 대신 CPU 에서 계산해서, GPU 로 데이터를 옮기는 시간이 없기 때문이다'
      answer: 1
      explanation: |
        VoxelNet 은 공간을 3D voxel 로 나눠 3D convolution 을 쓰느라 scan 하나에 225 ms 가 걸렸다. PointPillars 는 x·y 격자의 기둥(pillar)마다 숫자 64 개를
        만들어 2D 배열에 놓으므로, GPU 가 빨리 하는 2D convolution 만 남아 전체가 16.2 ms 였다. 점을 대량으로 버리지 않고, CNN 을 쓰며, GPU 에서 계산한다.
    - question: |
        PointPillars 의 pillar encoder 는 pillar 안 점들의 feature 를 왜 최댓값(max)으로 합치는가?
      choices:
        - '점에는 순서가 없어서, 어떤 순서로 넣어도 같은 결과가 나오는 연산이 필요하기 때문이다'
        - '최댓값이 평균보다 계산이 정확해서, 나눗셈의 소수점 오차가 생기지 않기 때문이다'
        - 'pillar 안에서 가장 높은 점 하나만 골라야, 그 자리 물체의 높이를 정할 수 있기 때문이다'
        - '최댓값을 쓰면 gradient 가 흘러서, pillar 크기까지 학습할 수 있기 때문이다'
      answer: 0
      explanation: |
        한 pillar 의 점 목록은 순서가 정해져 있지 않다. 점마다 같은 선형층을 거친 뒤 64 개 자리마다 최댓값을 고르면 순서를 바꿔도 결과가 같다. 최댓값은 64 개 숫자
        각각에 따로 적용되므로 가장 높은 점 하나를 고르는 것이 아니고, pillar 크기는 사람이 정하는 값이며, 정확도 문제와도 관계없다.
    - question: |
        PointPillars 에서 pillar 크기를 0.16 m 에서 0.32 m 로 키우면 무엇이 달라지는가?
      choices:
        - '칸 수가 4 배로 늘어 계산이 무거워지는 대신, 작은 물체가 더 정확해진다'
        - '한 pillar 가 높이 방향으로 두 칸으로 나뉘어, 3D convolution 이 필요해진다'
        - '아무 변화가 없다. pillar 크기는 학습 중에 데이터에 맞춰 다시 정해진다'
        - '칸 수가 4 분의 1 로 줄어 가벼워지는 대신, 작은 물체의 위치가 덜 정확해진다'
      answer: 3
      explanation: |
        한 변이 두 배면 같은 범위를 덮는 칸 수는 $2 \times 2 = 4$ 분의 1 이 되어 pseudo-image 가 작아지고 계산이 가벼워진다. 대신 한 칸이 넓어져 사람 같은
        작은 물체의 위치를 덜 세밀하게 잡는다. pillar 는 여전히 높이를 나누지 않고, 크기는 학습이 아니라 설정으로 정한다.

- topic: detection-metrics
  title: detection 지표 (IoU, AP, NDS)
  section: detection-benchmark
  variants:
    - question: |
        KITTI 는 IoU 로, nuScenes 는 중심 거리로 예측과 정답을 짝짓는다. nuScenes 가 중심 거리를 쓰는 이유는 무엇인가?
      choices:
        - '중심 거리가 IoU 보다 계산이 정확해서, 소수점 오차 없이 맞힘을 정할 수 있기 때문이다'
        - '중심 거리를 쓰면 상자의 방향 오차를 따로 잴 필요가 없어서, 지표가 단순해지기 때문이다'
        - '작은 물체는 조금만 어긋나도 IoU 가 크게 떨어져서, 위치 오차와 크기·방향 오차를 떼어 보려고'
        - 'nuScenes 상자에는 높이 정보가 없어서, 3차원 IoU 를 계산할 수 없기 때문이다'
      answer: 2
      explanation: |
        IoU 는 위치·크기·방향이 한꺼번에 섞인 값이라 작은 물체는 작은 위치 오차에도 0 에 가까워진다. nuScenes 는 중심 거리 0.5·1·2·4 m 로 맞힘을 정하고,
        크기·방향·속도 오차는 NDS 의 TP 오차로 따로 잰다. 방향 오차를 재지 않는 것이 아니고, nuScenes 상자에도 높이가 있으며, 계산 정확도의 문제도 아니다.
    - question: |
        어떤 detector 의 AP 가 75% 다. 이것은 무슨 뜻인가?
      choices:
        - '정답 물체 가운데 75% 를 찾았다는 뜻으로, 나머지 25% 는 detector 가 놓친 물체다'
        - 'precision-recall 곡선 아래 넓이가 0.75 라는 뜻으로, 잘못 찾은 상자의 비율까지 담는다'
        - '예측한 상자 가운데 75% 가 정답 상자와 IoU 0.75 이상으로 겹친다는 뜻이다'
        - 'scan 하나를 처리하는 데 75 ms 가 걸린다는 뜻으로, 1초에 scan 13 개쯤을 처리할 수 있다'
      answer: 1
      explanation: |
        AP 는 점수 높은 상자부터 받아들이며 계산한 precision 과 recall 로 그린 곡선의 아래 넓이다. 정답의 몇 % 를 찾았는지는 recall 하나이고, recall 이 75%
        여도 AP 는 그보다 낮을 수 있다. IoU 기준값(차 0.7 등)은 맞힘을 정하는 문턱이지 AP 값이 아니며, 처리 시간과도 관계없다.
    - question: |
        nuScenes 에서 LiDAR detector 와 카메라 detector 의 mAP 는 거의 같은데 NDS 는 LiDAR 쪽이 훨씬 높았다. 그 이유로 가장 알맞은 것은?
      choices:
        - 'NDS 는 mAP 를 다른 이름으로 부른 같은 값이라, 두 값의 차이는 측정 오차일 뿐이다'
        - 'NDS 는 처리 속도가 빠른 detector 에 점수를 더 주는데, LiDAR 쪽이 더 빨랐기 때문이다'
        - 'NDS 는 LiDAR 처럼 거리를 직접 재는 센서를 쓴 방법에만 가산점을 주기 때문이다'
        - 'NDS 는 위치·크기·방향·속도 오차도 함께 보는데, 카메라 쪽의 위치·속도 오차가 컸기 때문이다'
      answer: 3
      explanation: |
        NDS 는 $\frac{1}{10}[5\,\text{mAP} + \sum(1 - \min(1, \text{오차}))]$ 라서 절반이 물체를 찾았는지로 정해지고, 나머지 절반이 찾은 상자가 얼마나 정확한지로 정해진다. nuScenes 논문에서
        PointPillars 와 MonoDIS 는 mAP 30.5% 와 30.4% 로 같았지만, MonoDIS 는 속도 오차가 1.55 m/s(PointPillars 0.32 m/s) 등으로 커서 NDS 가 PointPillars
        45.3% 보다 낮은 38.4% 였다. 속도·센서 종류에 주는 가산점은 없다.

- topic: mot-association
  title: multi-object tracking 과 data association
  section: multi-object-tracking
  variants:
    - question: |
        detector 가 매 scan 상자를 내는데 왜 tracking 이 따로 필요한가?
      choices:
        - 'detector 의 상자는 좌표가 틀려서, tracking 을 거쳐야만 올바른 좌표를 얻기 때문이다'
        - 'tracking 이 point cloud 에서 땅 점을 지워 줘야 detector 가 상자를 낼 수 있기 때문이다'
        - 'tracking 을 하면 물체를 따라가며 배우므로, detector 를 따로 학습하지 않아도 되기 때문이다'
        - 'scan 마다 상자가 따로 나와 같은 물체를 잇는 번호와 속도가 없고, 놓치면 사라지기 때문이다'
      answer: 3
      explanation: |
        detector 는 scan 하나만 보고 상자를 내므로 지난 scan 의 어느 상자와 같은 물체인지 모른다. tracking 은 물체마다 Kalman filter 를 두어 상자를 이어
        번호(ID)를 붙이고, 위치 변화로 속도를 추정하며, 몇 scan 놓쳐도 예측으로 이어 간다. 좌표를 새로 만들거나 땅을 지우거나 학습을 대신하지는 않는다.
    - question: |
        track A, B 와 detection d1, d2 의 거리가 A–d1 1.2 m, A–d2 3.5 m, B–d1 0.8 m, B–d2 1.5 m 이고 gate 는 2 m 다. 가장 가까운 쌍부터 고르는 방식과 Hungarian algorithm 의 결과는 어떻게 다른가?
      choices:
        - '가까운 쌍부터 고르면 A 를 놓치고, Hungarian algorithm 은 A–d1, B–d2 를 골라 둘 다 잇는다'
        - '두 방식 모두 가장 가까운 B–d1 을 먼저 고정해서, 둘 다 A–d2, B–d1 을 고른다'
        - 'Hungarian algorithm 은 짝 전체의 거리 합이 가장 큰 쪽을 고르는 방법이라서, A–d2, B–d1 이 된다'
        - '가장 가까운 쌍부터 고르는 방식은 항상 Hungarian algorithm 과 같은 답을 낸다'
      answer: 0
      explanation: |
        가장 가까운 쌍 B–d1(0.8 m)을 먼저 고르면 A 에 남은 d2 는 3.5 m 라 gate 에 걸리므로, A 는 사라진 물체가 되고 d2 는 새 물체가 된다. Hungarian algorithm 은
        짝 전체의 거리 합을 최소로 하므로 A–d1 + B–d2 = 2.7 m 를 A–d2 + B–d1 = 4.3 m 보다 낫다고 보고 고른다. 두 방식은 이처럼 다른 답을 낼 수 있다.
    - question: |
        tracker 에서 짝을 잃은 track 을 지우기 전까지 유지하는 frame 수를 늘리면 어떻게 되는가?
      choices:
        - '아무 변화가 없다. 유지 frame 수는 새 track 을 만들 때만 쓰이는 값이다'
        - '짝을 잃은 track 이 자주 새로 만들어져 번호가 바뀌는 일이 늘고, 사라진 물체는 더 빨리 지워진다'
        - '가려졌던 물체가 같은 번호로 이어지기 쉬워지지만, 사라진 물체의 track 도 오래 남는다'
        - '예측으로 이어 가는 동안 Kalman filter 의 속도 추정이 정확해져서, 단점이 없다'
      answer: 2
      explanation: |
        유지 frame 동안 track 은 detection 없이 예측만으로 이어진다. 늘리면 주차된 차 뒤를 지나는 보행자처럼 잠깐 가려진 물체가 같은 번호로 돌아오지만,
        실제로 떠난 물체나 한 번 튄 잘못된 track 도 오래 남아, 없는 물체가 계획 단계로 넘어간다. 번호가 바뀌는 일은 줄어들고, 예측만 하는 동안 속도 추정은
        나아지지 않는다.

- topic: camera-lidar-fusion
  title: camera-LiDAR fusion
  section: camera-lidar-fusion
  variants:
    - question: |
        PointPainting 은 카메라와 LiDAR 를 어떻게 합치는가?
      choices:
        - '사진에서 찾은 2D 상자의 크기에 맞춰, LiDAR detector 가 낸 상자의 크기를 고친다'
        - '각 점을 사진에 투영해 그 pixel 의 class 점수를 붙인 뒤, LiDAR detector 에 넣는다'
        - 'LiDAR 점을 모두 버리고, 사진 한 장으로 추정한 깊이를 point cloud 대신 detector 에 넣는다'
        - '두 센서가 따로 낸 상자를 비교해서, 점수가 높은 쪽 상자만 남긴다'
      answer: 1
      explanation: |
        PointPainting 은 extrinsic 과 intrinsic 으로 점을 pixel 에 투영하고, segmentation network 가 낸 그 pixel 의 class 점수를 점에 붙인다(칠한다). 칠한
        point cloud 는 숫자가 몇 개 늘었을 뿐이라 PointPillars 같은 detector 에 그대로 넣는다. 2D 상자로 크기를 바꾸거나 상자 중 하나를 고르는 것은 다른
        방식이고, LiDAR 점을 버리지 않는다.
    - question: |
        camera-LiDAR extrinsic 의 회전이 1° 틀렸다. focal length 가 700 px 인 카메라에서 이 오차는 얼마나 큰가?
      choices:
        - '1° 는 아주 작은 각도라서, 사진에 투영한 결과가 어느 거리에서든 1 px 도 달라지지 않는다'
        - '어긋남이 가까울수록 커지므로, 센서 바로 앞에 있는 가까운 물체에서만 문제가 된다'
        - '투영이 약 12 px 밀려서, 30 m 앞 사람의 점이 배경 pixel 에 찍힐 수 있다'
        - '회전 오차는 두 센서의 시각 동기를 맞추면 함께 보정되므로, 따로 문제가 없다'
      answer: 2
      explanation: |
        회전 오차가 만드는 pixel 어긋남은 $700 \times \tan 1° \approx 12$ px 로 거리와 거의 상관없다. 그런데 먼 물체는 사진 속에서 작아서, 30 m 앞 사람은
        $700 \times 0.5 \div 30 \approx 12$ px 폭이라 점이 사람 대신 배경의 점수를 받는다. 시각 동기는 시간 차이를 다루는 별개의 문제라 회전 오차를 고치지
        못한다.
    - question: |
        LiDAR scan 과 카메라 사진이 50 ms 어긋난 채로 점을 투영하면 어떤 문제가 생기는가?
      choices:
        - '그사이 움직인 물체의 점이 다른 pixel 에 찍혀서, 20 m/s 인 차면 1 m 어긋난다'
        - '50 ms 는 아주 짧은 시간이라서, 빠르게 움직이는 차에도 투영 결과가 거의 같다'
        - '정지한 건물만 어긋나고, 움직이는 차는 두 센서가 같이 따라가 정확히 찍힌다'
        - 'extrinsic 이 두 센서의 시간 차이까지 담고 있어서, 투영할 때 어긋남이 저절로 사라진다'
      answer: 0
      explanation: |
        두 센서가 다른 순간을 찍으면 그사이 움직인 물체의 위치가 다르다. 상대 속도 20 m/s 면 $20 \times 0.05 = 1$ m 라서 차의 점이 차 옆 배경의 점수를 받을
        수 있다. 움직임이 없는 물체가 오히려 덜 어긋나고, extrinsic 은 시간 차이를 고치지 못한다. 그래서 두 시각의 차량 위치로 점을 옮기거나 시각이 가까운
        메시지끼리 짝짓는다.
