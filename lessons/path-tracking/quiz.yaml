# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: kinematics
  title: differential drive 와 bicycle model
  variants:
    - question: |
        바퀴 간격이 0.2 m 인 differential drive 로봇의 오른쪽 바퀴가 0.5 m/s, 왼쪽 바퀴가 0.3 m/s 로 돈다. 로봇 중심의 직진 속도와 회전 속도는?
      choices:
        - '직진 0.4 m/s, 회전 1.0 rad/s 로 왼쪽으로 돈다'
        - '직진 0.8 m/s, 회전 0.2 rad/s 로 왼쪽으로 돈다'
        - '직진 0.4 m/s, 회전 0.2 rad/s 로 오른쪽으로 돈다'
        - '직진 0.2 m/s, 회전 4.0 rad/s 로 오른쪽으로 돈다'
      answer: 0
      explanation: |
        직진 속도는 두 바퀴의 평균 $(0.5 + 0.3) \div 2 = 0.4$ m/s 이고, 회전 속도는 바퀴 속도의 차이를 바퀴 간격으로 나눈
        $(0.5 - 0.3) \div 0.2 = 1.0$ rad/s 다. 오른쪽 바퀴가 빠르므로 왼쪽으로 돈다. 두 속도를 더하기만 하면 0.8 이 나오고, 차이 0.2 를 간격으로
        나누지 않으면 회전 속도를 0.2 로 잘못 읽는다.
    - question: |
        differential drive 로봇이 경로 바로 옆 30 cm 에 경로와 나란히 서 있다. 왜 옆으로 바로 붙지 못하는가?
      choices:
        - '바퀴 간격이 30 cm 보다 좁아서, 한 번에 옆으로 옮길 수 있는 거리가 그보다 짧기 때문이다'
        - 'controller 주기가 짧아서, 한 주기 안에 옆으로 30 cm 를 움직일 시간이 없다'
        - '옆으로 미끄러지지 않는 한 속도는 늘 로봇이 향한 방향이라 몸을 돌려 다가가야 한다'
        - '제자리 회전을 할 수 없어서, 차처럼 큰 원을 그리며 돌아 들어가야 한다'
      answer: 2
      explanation: |
        differential drive 는 제자리 회전은 할 수 있지만, 바퀴가 옆으로 미끄러지지 않는 한 속도의 방향이 로봇이 향한 방향으로 묶여 있다(nonholonomic).
        그래서 옆의 경로로 가려면 방향을 틀어 비스듬히 다가가야 한다. 바퀴 간격이나 주기 때문이 아니고, 제자리 회전을 못 하는 것은 차(bicycle
        model)의 제약이다.
    - question: |
        축간거리 3 m 인 차의 앞바퀴가 최대 45° 까지 꺾인다. bicycle model 로 볼 때 이 차가 그릴 수 있는 가장 작은 원의 반지름은?
      choices:
        - '0 m. 앞바퀴를 끝까지 꺾으면 제자리에서 돌 수 있다'
        - '1.5 m. 반지름은 조향각과 상관없이 축간거리의 절반이다'
        - '4.2 m. 45° 로 꺾으면 축간거리에 √2 를 곱한다'
        - '3 m. $\tan 45° = 1$ 이라 축간거리와 같다'
      answer: 3
      explanation: |
        bicycle model 에서는 $\tan\delta = W / R$ 이라서 $R = W \div \tan\delta = 3 \div 1 = 3$ m 다. 차는 앞바퀴를 꺾은 만큼 휘어진 원을 그릴 뿐 제자리에서
        돌 수 없고, 반지름은 축간거리의 절반이나 √2 배와 관계없이 조향각의 tan 으로 정해진다.

- topic: pid-cross-track
  title: cross-track error 에 건 PID 의 한계
  variants:
    - question: |
        회전 속도를 cross-track error 에 비례하게만 주었더니 로봇이 경로를 사이에 두고 계속 좌우로 흔들린다. 왜 그런가?
      choices:
        - 'gain 이 작아서 경로까지 힘이 모자라기 때문이다. gain 을 키우면 흔들림이 사라진다'
        - '경로 위에서 명령이 0 이 되어도 로봇이 이미 비스듬히 향하고 있어 반대편으로 넘어가기 때문이다'
        - 'cross-track error 는 측정이 불가능해서 controller 가 추측한 값을 쓰기 때문이다'
        - '로봇이 nonholonomic 이라 어떤 controller 로도 흔들림을 없앨 수 없기 때문이다'
      answer: 1
      explanation: |
        회전 속도는 방향을 바꾸고, 방향이 옆으로 움직이는 속도를 정하고, 그 속도가 쌓여 cross-track error 가 바뀐다. 오차만 보면 경로 위에서
        명령이 0 이 되어도 이미 기울어진 방향 때문에 넘어간다. 질량이 있는 카트에 P 제어만 건 것과 같아서 gain 을 키우면 더 빨리 흔들릴 뿐이다.
        흔들림은 heading error 를 함께 써야 없앨 수 있다.
    - question: |
        cross-track error 에 heading error 항을 더하면 흔들림이 줄어드는 이유는 무엇인가?
      choices:
        - 'heading error 가 cross-track error 의 단위를 m 에서 rad 으로 바꿔 주기 때문이다'
        - 'heading error 를 더하면 계산할 항이 늘어 controller 주기가 짧아지기 때문이다'
        - 'heading error 는 경로의 곡률을 미리 알려 주는 feedforward 이기 때문이다'
        - 'heading error 가 오차의 변화율을 알려 주므로, D 항처럼 damping 을 주기 때문이다'
      answer: 3
      explanation: |
        cross-track error 가 변하는 속도는 $v \sin\theta_e$ 다. heading error 에 비례하는 항은 오차가 변하는 속도에 맞서는 D 항 역할을 해서,
        경로에 다가오는 동안 미리 방향을 펴게 만든다. 단위 변환이나 주기와는 관계없고, 곡률 feedforward 는 곡선의 남는 오차를 없애는 별개의 항이다.
    - question: |
        cross-track error 와 heading error 에 비례하는 controller 로 일정한 반지름의 원 경로를 돌았더니, 경로 바깥쪽에 일정한 거리를 두고
        따라간다. 어떻게 고치는가?
      choices:
        - '원을 도는 데 필요한 회전 속도 $v\kappa$ 를 feedforward 로 미리 더한다'
        - 'heading error 의 gain 을 0 으로 만들어 방향 항이 오차를 붙잡지 않게 한다'
        - '속도를 높여 원을 더 빨리 돌면서 바깥으로 밀린 거리를 빨리 되찾는다'
        - 'controller 주기를 낮춰 명령을 덜 자주 보내, 명령이 서로 부딪히지 않게 한다'
      answer: 0
      explanation: |
        원을 돌려면 늘 $\omega = v\kappa$ 의 회전 속도가 필요한데, 오차에 비례하는 항만으로 이 값을 내려면 오차가 남아 있어야 한다. 기울어진 레일에서
        gravity 때문에 생기는 steady-state error 와 같은 구조라서, 필요한 회전 속도를 미리 더하면 남는 오차가 0 이 된다. heading 항을 없애면 흔들림이
        돌아오고, 속도를 높이면 필요한 회전 속도가 커져 남는 오차도 커진다.

- topic: pure-pursuit
  title: pure pursuit 의 곡률 계산
  variants:
    - question: |
        pure pursuit 에서 lookahead 거리 $L = 2$ m 앞의 경로 점이 로봇 기준으로 옆으로 0.5 m 에 있다. 로봇이 따라갈 원호의 곡률과 반지름은?
      choices:
        - '곡률 0.25 /m, 반지름 4 m'
        - '곡률 0.5 /m, 반지름 2 m'
        - '곡률 0.125 /m, 반지름 8 m'
        - '곡률 1 /m, 반지름 1 m'
      answer: 0
      explanation: |
        pure pursuit 의 곡률은 $\kappa = 2y / L^2 = 2 \times 0.5 \div 2^2 = 0.25$ /m 이고, 반지름은 $1 \div 0.25 = 4$ m 다. $L^2$ 대신 $L$ 로 나누면
        0.5, 2 를 곱하지 않으면 0.125 가 나온다.
    - question: |
        pure pursuit 를 P controller 로 볼 수 있다고 하는데, 무엇이 오차이고 무엇이 gain 인가?
      choices:
        - '오차는 로봇 바로 옆의 cross-track error 이고, gain 은 직진 속도다'
        - '오차는 로봇과 목표 지점 사이의 거리이고, gain 은 $1/L$ 이다'
        - '오차는 heading error 이고, gain 은 lookahead 거리 $L$ 이다'
        - '오차는 lookahead point 가 옆으로 떨어진 거리 $y$ 이고, gain 은 $2/L^2$ 다'
      answer: 3
      explanation: |
        곡률 $\kappa = (2/L^2) \times y$ 라서 pure pursuit 는 $L$ 앞 경로 점의 옆 거리에 gain $2/L^2$ 을 곱하는 P 제어다. 오차를 로봇 옆이 아니라 앞쪽에서
        재기 때문에 heading 과 다가오는 곡률이 함께 반영된다. 목표까지의 거리나 heading error 만을 쓰는 것이 아니다.
    - question: |
        pure pursuit 가 lookahead point 로 원호를 하나 정할 때, 그 원호가 만족하는 조건은 무엇인가?
      choices:
        - '경로의 모든 점을 지나도록 맞춘 원호다'
        - '로봇의 지금 위치에서 지금 향한 방향에 접하며 출발해 lookahead point 를 지나는 원호다'
        - '반지름이 항상 lookahead 거리 $L$ 과 같은 원호다'
        - '로봇이 제자리에서 돌아 lookahead point 를 정면으로 본 뒤 직선으로 가는 경로다'
      answer: 1
      explanation: |
        로봇은 지금 향한 방향으로만 출발할 수 있으므로 원호는 그 방향에 접해야 하고, 끝점이 lookahead point 다. 이 두 조건과 두 점 사이 거리 $L$
        로 원이 하나로 정해지며 곡률은 $2y/L^2$ 다. 경로 전체를 지나는 원은 일반적으로 없고, 반지름은 $L$ 과 같지 않으며, 제자리 회전 후 직진은
        pure pursuit 의 동작이 아니다.

- topic: lookahead
  title: lookahead 거리의 선택
  variants:
    - question: |
        pure pursuit 의 lookahead 거리를 아주 짧게 줄이면 실제 로봇에서 어떤 일이 생기는가?
      choices:
        - '경로를 더 느리게 따라가지만, 가까운 점만 보므로 흔들림은 항상 줄어든다'
        - '가까운 점을 향해 일찍 돌아서 모퉁이에서 안쪽을 더 크게 가로지른다'
        - 'lookahead 거리는 곡률 계산에 쓰이지 않아 경로를 따라가는 모습이 그대로다'
        - 'gain 이 커져 경로에 바짝 붙지만, 지연이나 측위 noise 가 있으면 진동한다'
      answer: 3
      explanation: |
        $L$ 을 줄이면 gain $2/L^2$ 이 빠르게 커져 작은 오차에도 크게 돈다. 지연이 없고 측위가 완벽하면 정확해지지만, 실제 로봇은 명령이 늦게 반영되고
        측위 값이 튀어서 경로를 지나치며 진동한다. 모퉁이를 크게 가로지르는 것은 $L$ 이 길 때의 현상이다.
    - question: |
        lookahead 거리를 길게 잡은 pure pursuit 로 90° 모퉁이를 돌면 어떻게 움직이는가?
      choices:
        - '모퉁이 꼭짓점을 정확히 지나 그 자리에서 직각으로 꺾는다'
        - '모퉁이 전부터 저 앞의 점을 향해 돌아 안쪽을 가로지른다'
        - '꺾인 뒤의 점을 늦게 봐서 모퉁이 바깥으로 크게 넘쳐 나간다'
        - '모퉁이에 닿으면 멈추고, 제자리에서 돈 뒤 다시 출발한다'
      answer: 1
      explanation: |
        $L$ 이 길면 모퉁이에 닿기 전부터 lookahead point 가 꺾인 뒤의 경로 위에 있어서, 로봇이 그 점을 향해 일찍 돌며 안쪽을 가로지른다(corner cutting).
        바깥으로 넘치는 것은 앞을 보지 않는 Stanley 계열에서 더 나타나는 현상이고, pure pursuit 는 꼭짓점에서 멈추거나 제자리 회전을 하지 않는다.
    - question: |
        adaptive pure pursuit 는 lookahead 거리를 어떻게 정하고, 왜 그렇게 하는가?
      choices:
        - '경로의 길이에 비례하게 정한다. 경로가 길수록 멀리 봐야 끝까지 안정하기 때문이다'
        - '장애물까지의 거리로 정한다. 장애물에 가까울수록 멀리 봐야 미리 피할 수 있기 때문이다'
        - '속도에 비례하게 정하고 위아래를 자른다. 빠를 때 짧게 보면 진동하기 쉽기 때문이다'
        - '처음 한 번 정한 값을 끝까지 쓴다. 바꾸면 곡률 식 $2y/L^2$ 이 틀어지기 때문이다'
      answer: 2
      explanation: |
        adaptive pure pursuit 는 lookahead 거리를 속도 × 시간(lookahead time)으로 두고 최솟값과 최댓값으로 자른다. 빠를수록 짧은 lookahead 는 진동하기
        쉬워서 속도에 맞춰 늘린다. Nav2 Regulated Pure Pursuit 의 velocity scaled lookahead 가 이 방식이다. 경로 길이나 장애물 거리로 정하지 않고,
        lookahead 를 바꿔도 곡률 식은 그대로 성립한다.

- topic: stanley
  title: Stanley 방법
  variants:
    - question: |
        Stanley 의 조향 식 $\delta = \theta_e + \arctan(k e / v)$ 에서 두 항은 각각 무슨 일을 하는가?
      choices:
        - '첫째 항은 앞바퀴를 경로와 나란히 맞추고, 둘째 항은 벗어난 만큼 경로 쪽으로 더 꺾는다'
        - '첫째 항은 속도를 정하고, 둘째 항은 그 속도에 맞는 조향각을 정한다'
        - '첫째 항은 경로 곡률의 feedforward 이고, 둘째 항은 lookahead point 를 향하게 한다'
        - '두 항 모두 cross-track error 를 줄이는 같은 역할을 하며 하나는 생략해도 된다'
      answer: 0
      explanation: |
        $\theta_e$ 는 경로 방향과 차의 방향 차이라서 이것만큼 꺾으면 앞바퀴가 경로와 나란해진다. 둘째 항은 앞바퀴 축 중심에서 잰 cross-track error $e$ 에
        따라 경로 쪽으로 더 꺾는다. 속도를 정하는 항은 없고, lookahead point 는 pure pursuit 의 개념이다. heading 항을 빼면 cross-track error
        에만 P 제어를 건 것처럼 흔들린다.
    - question: |
        Stanley 조향 식의 둘째 항 $\arctan(k e / v)$ 에서 분모에 속도가 들어가는 이유는 무엇인가?
      choices:
        - '속도가 빠를수록 경로를 더 세게 따라가야 해서, 같은 오차에 조향을 키우기 위해서다'
        - '빠를수록 같은 조향으로도 옆으로 빨리 움직이므로, 같은 오차에 덜 꺾게 하려고'
        - 'arctan 의 입력 단위를 맞추기 위한 상수일 뿐, 차의 동작에는 영향이 없다'
        - '속도가 0 일 때 조향을 0 으로 만들어, 멈춘 차의 바퀴가 돌지 않게 하기 위해서다'
      answer: 1
      explanation: |
        $v$ 가 커지면 $ke/v$ 가 작아져 같은 오차에도 덜 꺾는다. 빠른 차는 조금만 꺾어도 옆으로 빨리 움직이기 때문이고, 그 결과 작은 오차는 속도와
        관계없이 $e(0)\exp(-kt)$ 로 줄어든다. 빠를수록 더 꺾는 것이 아니며, 속도가 0 에 가까우면 오히려 $ke/v$ 가 커져 조향이 90° 쪽으로 커진다.
    - question: |
        pure pursuit 와 Stanley 를 비교하면 어떤 차이가 있는가?
      choices:
        - 'pure pursuit 는 차에만 쓸 수 있고, Stanley 는 differential drive 에만 쓸 수 있다'
        - '둘 다 미래 궤적을 예측해 비용을 최소화하는 MPC 의 한 종류라서 큰 차이가 없다'
        - 'pure pursuit 는 앞쪽 점을 봐서 모퉁이를 가로지르고, Stanley 는 앞바퀴 오차를 봐서 바깥으로 넘친다'
        - 'Stanley 는 lookahead 거리를 쓰고, pure pursuit 는 앞바퀴의 오차를 쓴다'
      answer: 2
      explanation: |
        pure pursuit 는 lookahead point 로 원호를 정해 모퉁이 안쪽을 가로지르기 쉽고, 크게 벗어나도 잘 돌아온다. Stanley 는 앞을 보지 않고 앞바퀴의
        cross-track error 와 heading error 로 조향을 정해서, 잘 맞추면 정확하지만 모퉁이에서 바깥으로 넘친다. 크게 벗어나거나 경로가 매끄럽지 않을
        때도 pure pursuit 보다 약하다. 둘 다 예측 기반 MPC 가 아니고, 넷째 보기는 두 방법이 오차를 재는 곳을 서로 바꿔 적었다.

- topic: mpc
  title: MPC 의 horizon·제약·비용
  variants:
    - question: |
        MPC 가 매 주기 하는 일은 무엇인가?
      choices:
        - '지금의 cross-track error 에 gain 을 곱해 회전 속도를 정한다'
        - 'horizon 동안의 움직임을 예측해 가장 좋은 명령 순서를 찾고 첫 명령만 보낸다'
        - '처음 한 번 전체 경로에 대한 명령 순서를 계산하고, 그 순서를 끝까지 그대로 실행한다'
        - '경로 위 lookahead point 를 골라 그 점을 지나는 원호의 곡률을 보낸다'
      answer: 1
      explanation: |
        MPC 는 horizon 동안의 움직임을 모델로 예측하고 비용을 최소화하는 명령 순서를 구하지만, 첫 명령만 보내고 다음 주기에 새 위치에서 다시 푼다
        (receding horizon). 그래서 모델 오차나 미끄러짐이 쌓이지 않는다. 지금 오차에 gain 을 곱하는 것은 P 제어이고 원호의 곡률을 보내는 것은 pure pursuit 다.
        한 번 계산한 순서를 끝까지 쓰면 feedback 이 없다.
    - question: |
        MPC 의 horizon 을 늘리면 무엇이 좋아지고 무엇이 나빠지는가?
      choices:
        - '모든 것이 좋아진다. horizon 은 길수록 더 많이 보므로 손해가 없다'
        - '모든 것이 나빠진다. 먼 예측은 틀어지기만 하므로 horizon 은 한 step 일 때가 최적이다'
        - '먼 앞의 곡선과 장애물을 미리 반영하지만, 계산량이 늘고 먼 예측일수록 틀어진다'
        - '계산량은 그대로이고, 더 멀리 보는 만큼 로봇의 최고 속도만 올라간다'
      answer: 2
      explanation: |
        horizon 이 길면 다가오는 곡선이나 장애물을 미리 보고 일찍 대응할 수 있다. 대신 최적화 변수와 예측 step 이 늘어 계산이 많아지고, 먼 미래는 모델
        오차가 쌓여 예측이 부정확해진다. Nav2 MPPI 처럼 horizon 동안 볼 거리가 costmap 크기를 넘으면 그 밖을 볼 수도 없다. horizon 은 최고 속도를
        직접 바꾸지 않는다.
    - question: |
        MPPI 는 일반 MPC 와 비교해 최적의 명령을 어떻게 구하는가?
      choices:
        - 'noise 를 더한 명령 순서를 많이 뽑아 시뮬레이션하고, 비용이 작은 후보 쪽으로 가중 평균한다'
        - '비용 함수를 미분해 gradient descent 로 풀어, 장애물 비용까지 한 번에 정확한 해를 구한다'
        - '후보 중 비용이 가장 큰 것을 골라, 그 후보와 반대 방향으로 명령을 보낸다'
        - '비용은 계산하지 않고 lookahead point 의 곡률만 써서 명령을 정한다'
      answer: 0
      explanation: |
        MPPI 는 sampling 기반 MPC 다. 후보 궤적 수천 개를 시뮬레이션해 비용을 매기고 $\exp(-J/\lambda)$ 꼴의 weight 로 가중 평균하므로, 장애물 비용처럼
        미분하기 어려운 항이 있어도 쓸 수 있다. temperature $\lambda$ 가 작으면 가장 좋은 후보에 가까워지고 크면 평균에 가까워진다. gradient 로 푸는 것은
        다른 MPC solver 의 방식이고, 곡률만 쓰는 것은 pure pursuit 다.

- topic: nav2-controller
  title: Nav2 controller 와 제어 주기
  variants:
    - question: |
        Nav2 의 DWB 가 다음 명령의 후보로 삼는 속도는 어떻게 정해지는가?
      choices:
        - '로봇의 최고 속도 범위 전체를 고르게 나눈, 낼 수 있는 모든 직진·회전 속도 조합이다'
        - '경로의 곡률로 계산한 속도 하나뿐이고, 그 속도의 궤적만 검사한다'
        - '지금 속도에서 가속도 한계로 짧은 시간 안에 닿을 수 있는 범위 안의 속도 조합이다'
        - '직전 주기의 명령에 Gaussian noise 를 더한 수천 개의 명령 순서다'
      answer: 2
      explanation: |
        dynamic window approach 는 가속도 한계 때문에 다음 주기 안에 실제로 낼 수 있는 속도만 후보로 삼는다. DWB 는 그 안에서 직진·회전 속도 조합을
        뽑아 일정 속도 궤적을 만들고 critic 점수로 고른다. 최고 속도 범위 전체는 닿을 수 없는 속도를 포함하고, noise 를 더한 명령 순서는 MPPI 의 방식이다.
    - question: |
        Regulated Pure Pursuit 는 일반 pure pursuit 에 무엇을 더했는가?
      choices:
        - 'lookahead point 대신 앞바퀴의 cross-track error 로 조향을 정하도록 바꿨다'
        - '곡률이 크거나 장애물에 가까우면 속도를 줄이고, 갈 원호의 충돌을 검사한다'
        - '수천 개의 궤적을 sampling 해 비용이 작은 쪽으로 가중 평균한다'
        - '장애물을 만나면 경로를 벗어나 그 장애물을 피해 가는 궤적을 새로 만든다'
      answer: 1
      explanation: |
        일반 pure pursuit 는 곡률만 정하고 속도는 고정해 두는 경우가 많아 급한 곡선에서 넘친다. RPP 는 회전 반지름이 `regulated_linear_scaling_min_radius`
        보다 작으면 반지름 비율만큼 속도를 줄이고, 장애물 가까이에서도 줄이며, 지금 명령으로 갈 원호에서 충돌을 검사한다. 장애물을 돌아가는 궤적은
        만들지 않는다. 앞바퀴 오차를 쓰는 것은 Stanley 이고, sampling 은 MPPI 의 방식이다.
    - question: |
        controller 주기를 20 Hz 에서 5 Hz 로 낮추면 path tracking 에 어떤 영향이 있는가?
      choices:
        - '계산이 4 분의 1 로 줄어들 뿐, 명령은 같으므로 경로를 따라가는 성능은 그대로다'
        - '명령을 덜 자주 보내므로 명령이 덜 바뀌어 흔들림이 항상 줄어든다'
        - 'controller 주기에 맞춰 lookahead 거리가 자동으로 4 배가 되어 더 먼 곳을 본다'
        - '명령 하나로 가는 거리가 4 배로 늘어, 같은 gain 으로도 경로를 지나치기 쉽다'
      answer: 3
      explanation: |
        0.5 m/s 로 달리면 20 Hz 에서는 한 주기에 2.5 cm, 5 Hz 에서는 10 cm 를 같은 명령으로 간다. 명령이 늦게 바뀌는 것은 지연과 같아서 같은 gain 도
        경로를 지나쳐 흔들리기 쉽다. 주기는 lookahead 를 바꾸지 않고, MPPI 처럼 예측하는 controller 는 `model_dt` 도 제어 주기에 맞춰야 한다.
