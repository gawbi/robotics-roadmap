<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 가지 kinematics. 바퀴 간격 0.16 m 인 differential drive 는 오른쪽 바퀴 0.19 m/s, 왼쪽 바퀴 0.11 m/s 로 반지름 0.3 m 의 원을 돌고, 축간거리 2.7 m 인 차는 앞바퀴를 최대 35° 꺾어도 반지름 3.86 m 보다 작게 돌 수 없다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="698" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="175.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">differential drive (TurtleBot3 Burger)</text>
  <rect x="200" y="162.0" width="60" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="216" y="157.0" width="28" height="8" rx="2" fill="#38bdf8"/>
  <rect x="216" y="215.0" width="28" height="8" rx="2" fill="#f59e0b"/>
  <line x1="248.0" y1="161.0" x2="327.8" y2="161.0" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#as)"/>
  <text x="333.8" y="165.0" fill="#38bdf8" font-size="12" text-anchor="start">v_R = 0.19 m/s</text>
  <line x1="248.0" y1="219.0" x2="294.2" y2="219.0" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#aa)"/>
  <text x="300.2" y="223.0" fill="#f59e0b" font-size="12" text-anchor="start">v_L = 0.11 m/s</text>
  <circle cx="230" cy="100.0" r="4" fill="#a78bfa"/>
  <text x="220.0" y="104.0" fill="#a78bfa" font-size="12" text-anchor="end">회전 중심</text>
  <line x1="230.0" y1="104.0" x2="230.0" y2="186.0" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text x="222.0" y="149.0" fill="#a78bfa" font-size="12" text-anchor="end">R = 0.3 m</text>
  <polyline points="230.0,190.0 233.9,189.9 237.8,189.7 241.7,189.2 245.6,188.6 249.5,187.9 253.3,186.9 257.1,185.8 260.8,184.6 264.4,183.1 268.0,181.6 271.6,179.8 275.0,177.9 278.4,175.9 281.6,173.7 284.8,171.4 287.9,168.9 290.8,166.4 293.6,163.6 296.4,160.8 298.9,157.9 301.4,154.8 303.7,151.6 305.9,148.4 307.9,145.0 309.8,141.6 311.6,138.0 313.1,134.4 314.6,130.8 315.8,127.1 316.9,123.3 317.9,119.5 318.6,115.6 319.2,111.7 319.7,107.8 319.9,103.9 320.0,100.0 319.9,96.1 319.7,92.2 319.2,88.3 318.6,84.4" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <text x="330.0" y="92.0" fill="#34d399" font-size="12" text-anchor="start">지나갈 원호</text>
  <text x="172.0" y="194.0" fill="#94a3b8" font-size="12" text-anchor="end">b = 0.16 m</text>
  <line x1="182.0" y1="166.0" x2="182.0" y2="214.0" stroke="#94a3b8" stroke-width="1.8"/>
