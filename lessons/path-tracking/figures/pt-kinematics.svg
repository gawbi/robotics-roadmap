  <text x="540.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">bicycle model (승용차)</text>
  <line x1="470.0" y1="250.0" x2="578.0" y2="250.0" stroke="#e2e8f0" stroke-width="2.5"/>
  <rect x="456" y="245" width="28" height="10" rx="3" fill="#f59e0b"/>
  <g transform="translate(578.0,250) rotate(-35)"><rect x="-14" y="-5" width="28" height="10" rx="3" fill="#38bdf8"/></g>
  <line x1="470.0" y1="250.0" x2="470.0" y2="95.6" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="578.0" y1="250.0" x2="470.0" y2="95.6" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="470" cy="95.6" r="4" fill="#a78bfa"/>
  <text x="462.0" y="99.6" fill="#a78bfa" font-size="12" text-anchor="end">회전 중심</text>
  <text x="462.0" y="180.0" fill="#a78bfa" font-size="12" text-anchor="end">R = 3.86 m</text>
  <line x1="578.0" y1="250.0" x2="628.0" y2="250.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M616.0,250 A38,38 0 0,0 609.1,228.2" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="622.0" y="236.0" fill="#38bdf8" font-size="12" text-anchor="start">δ = 35°</text>
  <text x="524.0" y="276.0" fill="#94a3b8" font-size="12" text-anchor="middle">축간거리 W = 2.7 m</text>
  <text x="540.0" y="290.0" fill="#94a3b8" font-size="12" text-anchor="middle">tan δ = W ÷ R → 제자리 회전은 불가능</text>
  <line x1="350.0" y1="60.0" x2="350.0" y2="300.0" stroke="#1e293b" stroke-width="1.5"/>
</svg>
