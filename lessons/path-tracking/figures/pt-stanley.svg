<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Stanley 방법의 기하. 앞바퀴 축 중심에서 경로까지의 거리 e 와 경로에 대한 차의 방향 차이 θe 로 앞바퀴 각도를 정한다. k = 1, e = 0.5 m 이면 1 m/s 에서는 26.6°, 10 m/s 에서는 2.9° 를 더 꺾는다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="658" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="30.0" y1="250.0" x2="630.0" y2="250.0" stroke="#7fc4a2" stroke-width="3"/>
  <text x="620.0" y="272.0" fill="#7fc4a2" font-size="12" text-anchor="end">경로</text>
  <line x1="159.0" y1="231.3" x2="300.0" y2="180.0" stroke="#e2e8f0" stroke-width="3"/>
  <g transform="translate(159.0,231.3) rotate(-20)"><rect x="-14" y="-5" width="28" height="10" rx="3" fill="#d6aa62"/></g>
  <g transform="translate(300.0,180.0) rotate(26.6)"><rect x="-14" y="-5" width="28" height="10" rx="3" fill="#7cb4d8"/></g>
  <line x1="300" y1="180.0" x2="300" y2="250" stroke="#d6aa62" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="308.0" y="242.0" fill="#d6aa62" font-size="12" text-anchor="start">e = 0.5 m (앞바퀴 축 중심에서 잼)</text>
  <line x1="300.0" y1="180.0" x2="412.8" y2="139.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="300.0" y1="180.0" x2="430.0" y2="180.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M390,180.0 A90,90 0 0,0 384.6,149.2" fill="none" stroke="#a99ad6" stroke-width="2"/>
  <text x="436.0" y="164.0" fill="#a99ad6" font-size="13" text-anchor="start">θe = 20°</text>
  <line x1="300.0" y1="180.0" x2="371.5" y2="215.8" stroke="#7cb4d8" stroke-width="2.2" marker-end="url(#as)"/>
  <text x="379.5" y="219.8" fill="#7cb4d8" font-size="12" text-anchor="start">앞바퀴 방향 (경로보다 26.6° 아래)</text>
  <text x="137.0" y="235.3" fill="#94a3b8" font-size="12" text-anchor="end">뒷바퀴</text>
  <text x="40.0" y="44.0" fill="#e2e8f0" font-size="16" text-anchor="start" font-weight="600">δ = θe + arctan(k·e ÷ v)</text>
  <text x="40.0" y="72.0" fill="#94a3b8" font-size="12" text-anchor="start">첫째 항: 앞바퀴를 경로와 나란히 맞춘다</text>
  <text x="40.0" y="92.0" fill="#94a3b8" font-size="12" text-anchor="start">둘째 항: 벗어난 만큼 경로 쪽으로 더 꺾는다</text>
  <text x="40.0" y="120.0" fill="#d6aa62" font-size="12" text-anchor="start">k = 1, e = 0.5 m:  v = 1 m/s → 26.6°,  v = 10 m/s → 2.9°</text>
</svg>
