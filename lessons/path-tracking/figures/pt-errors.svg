<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>경로 추종의 두 오차. 로봇이 경로에서 옆으로 벗어난 거리가 cross-track error(그림은 0.25 m)이고, 로봇이 향한 방향과 경로 방향의 각도 차이가 heading error 다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="658" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="40.0" y1="200.0" x2="620.0" y2="200.0" stroke="#7fc4a2" stroke-width="3"/>
  <text x="610.0" y="222.0" fill="#7fc4a2" font-size="12" text-anchor="end">planner 가 준 경로</text>
  <line x1="260" y1="125" x2="260" y2="200" stroke="#d6aa62" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="250.0" y="166.5" fill="#d6aa62" font-size="12" text-anchor="end">cross-track error e = 0.25 m</text>
  <g transform="translate(260.0,125.0) rotate(-15.0) scale(1.2)"><rect x="-18" y="-14" width="36" height="28" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/><rect x="-9" y="-19" width="18" height="5" rx="2" fill="#e2e8f0"/><rect x="-9" y="14" width="18" height="5" rx="2" fill="#e2e8f0"/><path d="M6,-6 L16,0 L6,6 z" fill="#e2e8f0"/></g>
  <line x1="260.0" y1="125.0" x2="404.9" y2="86.2" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#as)"/>
  <line x1="260.0" y1="125.0" x2="410.0" y2="125.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <path d="M355,125 A95,95 0 0,0 351.8,100.4" fill="none" stroke="#a99ad6" stroke-width="2"/>
  <text x="368.0" y="115.0" fill="#a99ad6" font-size="12" text-anchor="start">heading error θe</text>
  <text x="410.9" y="80.2" fill="#7cb4d8" font-size="12" text-anchor="start">로봇이 향한 방향</text>
  <text x="420.0" y="143.0" fill="#94a3b8" font-size="11" text-anchor="start">경로 방향</text>
  <text x="330.0" y="40.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">controller 가 1초에 20 번 재는 두 오차</text>
  <text x="330.0" y="270.0" fill="#94a3b8" font-size="12" text-anchor="middle">두 오차를 보고 직진 속도 v 와 회전 속도 ω 를 정해 cmd_vel 로 보낸다</text>
</svg>
