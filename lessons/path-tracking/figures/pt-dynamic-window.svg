  <text x="445.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">0.25 초 안에 바꿀 수 있는 속도만</text>
  <text x="445.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="start">v: ± 50 cm/s² × 0.25 s = ± 12.5 cm/s</text>
  <text x="445.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="start">ω: ± 60 °/s² × 0.25 s = ± 15 °/s</text>
  <text x="445.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="start">창 안의 (v, ω) 조합마다</text>
  <text x="445.0" y="180.0" fill="#e2e8f0" font-size="12" text-anchor="start">앞으로 굴려 본 궤적에 점수를 매기고</text>
  <text x="445.0" y="200.0" fill="#e2e8f0" font-size="12" text-anchor="start">가장 좋은 조합을 보낸다</text>
  <text x="445.0" y="240.0" fill="#7cb4d8" font-size="12" text-anchor="start">DWB 기본값: v 20 개 × ω 20 개</text>
  <text x="445.0" y="260.0" fill="#7cb4d8" font-size="12" text-anchor="start">= 400 개 궤적, 각 1.7 초</text>
