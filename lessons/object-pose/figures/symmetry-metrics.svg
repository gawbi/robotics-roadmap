<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>대칭 상자의 오차. 180° 돌린 무늬 없는 상자의 ADD 는 20.9 cm 로 문턱 2.13 cm 를 넘지만 ADD-S 는 0 이다. 아래는 MSSD 3 cm 인 추정이 문턱 10 개 가운데 3.19 cm 부터 8 개를 통과해 0.8 을 받는 계산이다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="678" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="30.0" fill="#e2e8f0" font-size="14" text-anchor="start">① 20 × 6 × 4 cm 상자를 수직축으로 180° 돌린 추정 (위에서 본 그림)</text>
  <rect x="60.0" y="62.0" width="260.0" height="78.0" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <circle cx="320.0" cy="62.0" r="4.5" fill="#e2e8f0"/>
  <text x="330.0" y="56.0" fill="#7cb4d8" font-size="13" text-anchor="start" font-weight="600">1</text>
  <text x="342.0" y="56.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">3′</text>
  <circle cx="60.0" cy="140.0" r="4.5" fill="#e2e8f0"/>
  <text x="24.0" y="158.0" fill="#7cb4d8" font-size="13" text-anchor="start" font-weight="600">3</text>
  <text x="36.0" y="158.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">1′</text>
  <circle cx="60.0" cy="62.0" r="4.5" fill="#e2e8f0"/>
  <text x="24.0" y="56.0" fill="#7cb4d8" font-size="13" text-anchor="start" font-weight="600">2</text>
  <text x="36.0" y="56.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">4′</text>
  <circle cx="320.0" cy="140.0" r="4.5" fill="#e2e8f0"/>
  <text x="330.0" y="158.0" fill="#7cb4d8" font-size="13" text-anchor="start" font-weight="600">4</text>
  <text x="342.0" y="158.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">2′</text>
  <line x1="316.0" y1="65.0" x2="66.0" y2="137.0" stroke="#d88b8b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="74.0" y="88.0" fill="#d88b8b" font-size="12" text-anchor="start">1 ↔ 1′ : 20.9 cm</text>
  <text x="24.0" y="182.0" fill="#94a3b8" font-size="11" text-anchor="start">파란 숫자: 정답 pose 의 꼭짓점 · 주황 숫자: 추정 pose 의 꼭짓점</text>
  <rect x="360.0" y="56.0" width="296.0" height="110.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="374.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">문턱 = diameter 21.3 cm × 10% = 2.13 cm</text>
  <text x="374.0" y="106.0" fill="#e2e8f0" font-size="13" text-anchor="start">ADD (같은 꼭짓점끼리)</text>
  <text x="642.0" y="106.0" fill="#d88b8b" font-size="13" text-anchor="end" font-weight="600">20.9 cm → 틀림</text>
  <text x="374.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="start">ADD-S (가장 가까운 꼭짓점)</text>
  <text x="642.0" y="132.0" fill="#7fc4a2" font-size="13" text-anchor="end" font-weight="600">0 cm → 맞음</text>
  <text x="374.0" y="156.0" fill="#e2e8f0" font-size="13" text-anchor="start">MSSD (대칭 변환 목록 사용)</text>
  <text x="642.0" y="156.0" fill="#7fc4a2" font-size="13" text-anchor="end" font-weight="600">0 cm → 맞음</text>
  <text x="24.0" y="222.0" fill="#e2e8f0" font-size="14" text-anchor="start">② MSSD 3 cm 인 추정 하나가 AR 에 보태는 값 (문턱 = diameter 의 5% ~ 50%)</text>
