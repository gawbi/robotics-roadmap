  <line x1="210.0" y1="240.0" x2="210.0" y2="296.0" stroke="#d6aa62" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="216.0" y="240.0" fill="#d6aa62" font-size="12" text-anchor="start">오차 3 cm</text>
  <text x="165.0" y="328.0" fill="#d88b8b" font-size="11" text-anchor="middle">1.06, 2.13 cm: 오차보다 작아 통과 못 함</text>
  <text x="410.0" y="328.0" fill="#7fc4a2" font-size="12" text-anchor="middle">3.19 ~ 10.63 cm 8 개 통과 → 8 ÷ 10 = 0.8</text>
