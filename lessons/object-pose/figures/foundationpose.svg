<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>FoundationPose 의 두 mode. pose estimation 은 hypothesis 252 개(논문은 504 개)를 고치고 함께 점수 매겨 약 1.3 초가 걸린다. tracking 은 앞 frame 의 pose 를 한 번 고쳐 약 32 Hz 다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="698" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="30.0" fill="#e2e8f0" font-size="14" text-anchor="start">pose estimation (첫 frame)</text>
  <rect x="20.0" y="48.0" width="118.0" height="96.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="79.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="middle">입력</text>
  <text x="79.0" y="101.0" fill="#94a3b8" font-size="12" text-anchor="middle">RGB-D, mask</text>
  <text x="79.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="middle">CAD model</text>
  <rect x="156.0" y="48.0" width="128.0" height="96.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="220.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="middle">hypothesis</text>
  <text x="220.0" y="101.0" fill="#94a3b8" font-size="12" text-anchor="middle">시점 42 × 회전 6</text>
  <text x="220.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="middle">= 252 (논문 504)</text>
  <rect x="302.0" y="48.0" width="128.0" height="96.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="366.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="middle">refine</text>
  <text x="366.0" y="101.0" fill="#94a3b8" font-size="12" text-anchor="middle">160×160 crop</text>
  <text x="366.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="middle">논문 5 번 (ROS 기본 3)</text>
  <rect x="448.0" y="48.0" width="128.0" height="96.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="512.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="middle">score</text>
  <text x="512.0" y="101.0" fill="#94a3b8" font-size="12" text-anchor="middle">숫자 512 개로 요약</text>
  <text x="512.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="middle">함께 self-attention</text>
  <rect x="594.0" y="48.0" width="86.0" height="96.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="637.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="middle">출력 pose</text>
  <text x="637.0" y="101.0" fill="#94a3b8" font-size="12" text-anchor="middle">점수가</text>
  <text x="637.0" y="118.0" fill="#94a3b8" font-size="12" text-anchor="middle">가장 높은 것</text>
  <line x1="140.0" y1="96.0" x2="153.0" y2="96.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="286.0" y1="96.0" x2="299.0" y2="96.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="432.0" y1="96.0" x2="445.0" y2="96.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="578.0" y1="96.0" x2="591.0" y2="96.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="220.0" y="164.0" fill="#94a3b8" font-size="12" text-anchor="middle">4 ms</text>
  <text x="366.0" y="164.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.88 초</text>
  <text x="512.0" y="164.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.42 초</text>
  <text x="350.0" y="186.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 약 1.3 초 (RTX 3090, 물체 하나)</text>
  <text x="24.0" y="232.0" fill="#e2e8f0" font-size="14" text-anchor="start">tracking (그 뒤 frame)</text>
  <rect x="20.0" y="250.0" width="170.0" height="62.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="105.0" y="277.5" fill="#e2e8f0" font-size="14" text-anchor="middle">앞 frame 의 pose</text>
  <text x="105.0" y="294.5" fill="#94a3b8" font-size="12" text-anchor="middle">hypothesis 1 개</text>
  <rect x="250.0" y="250.0" width="150.0" height="62.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="325.0" y="277.5" fill="#e2e8f0" font-size="14" text-anchor="middle">refine 1 번</text>
  <text x="325.0" y="294.5" fill="#94a3b8" font-size="12" text-anchor="middle">새 사진과 비교</text>
  <rect x="460.0" y="250.0" width="150.0" height="62.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="535.0" y="286.0" fill="#e2e8f0" font-size="14" text-anchor="middle">이번 frame 의 pose</text>
  <line x1="192.0" y1="281.0" x2="246.0" y2="281.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="402.0" y1="281.0" x2="456.0" y2="281.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <path d="M535,314 L535,330 L105,330 L105,316" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="640.0" y="272.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">약 32 Hz</text>
  <text x="640.0" y="292.0" fill="#94a3b8" font-size="11" text-anchor="middle">(RTX 3090)</text>
</svg>
