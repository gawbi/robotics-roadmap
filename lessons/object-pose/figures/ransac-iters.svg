<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>RANSAC 에 필요한 뽑기 횟수. 대응 5 개씩 뽑아 99% 확률로 inlier 만 뽑으려면 inlier 비율 0.7, 0.5, 0.3 에서 25 번, 145 번, 1,893 번이 필요하고, OpenCV 기본 상한 100 번의 성공 확률은 99% 이상, 95.8%, 21.6% 다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="30.0" fill="#e2e8f0" font-size="14" text-anchor="start">대응 5 개씩 뽑아 99% 확률로 inlier 만 뽑는 데 필요한 횟수 (log 눈금)</text>
  <line x1="150.0" y1="56.0" x2="150.0" y2="210.0" stroke="#1e293b" stroke-width="1"/>
  <text x="150.0" y="228.0" fill="#64748b" font-size="11" text-anchor="middle">10</text>
  <line x1="273.3" y1="56.0" x2="273.3" y2="210.0" stroke="#1e293b" stroke-width="1"/>
  <text x="273.3" y="228.0" fill="#64748b" font-size="11" text-anchor="middle">100</text>
  <line x1="396.7" y1="56.0" x2="396.7" y2="210.0" stroke="#1e293b" stroke-width="1"/>
  <text x="396.7" y="228.0" fill="#64748b" font-size="11" text-anchor="middle">1,000</text>
  <line x1="520.0" y1="56.0" x2="520.0" y2="210.0" stroke="#1e293b" stroke-width="1"/>
  <text x="520.0" y="228.0" fill="#64748b" font-size="11" text-anchor="middle">10,000</text>
  <line x1="273.3" y1="50.0" x2="273.3" y2="210.0" stroke="#d6aa62" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="277.3" y="46.0" fill="#d6aa62" font-size="12" text-anchor="start">OpenCV 기본 상한 100</text>
  <text x="600.0" y="44.0" fill="#94a3b8" font-size="12" text-anchor="middle">100 번일 때</text>
  <text x="600.0" y="60.0" fill="#94a3b8" font-size="12" text-anchor="middle">성공 확률</text>
  <text x="36.0" y="91.0" fill="#e2e8f0" font-size="13" text-anchor="start">inlier 0.7</text>
  <rect x="150.0" y="75.0" width="49.1" height="22.0" rx="3" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="1"/>
  <text x="207.1" y="91.0" fill="#7fc4a2" font-size="13" text-anchor="start" font-weight="600">25 번</text>
  <text x="600.0" y="91.0" fill="#7fc4a2" font-size="13" text-anchor="middle">99% 이상</text>
  <text x="36.0" y="137.0" fill="#e2e8f0" font-size="13" text-anchor="start">inlier 0.5</text>
  <rect x="150.0" y="121.0" width="143.2" height="22.0" rx="3" fill="#d6aa62" stroke="#d6aa62" stroke-width="1"/>
  <text x="301.2" y="137.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">145 번</text>
  <text x="600.0" y="137.0" fill="#d6aa62" font-size="13" text-anchor="middle">95.8%</text>
  <text x="36.0" y="183.0" fill="#e2e8f0" font-size="13" text-anchor="start">inlier 0.3</text>
  <rect x="150.0" y="167.0" width="280.8" height="22.0" rx="3" fill="#d88b8b" stroke="#d88b8b" stroke-width="1"/>
  <text x="438.8" y="183.0" fill="#d88b8b" font-size="13" text-anchor="start" font-weight="600">1,893 번</text>
  <text x="600.0" y="183.0" fill="#d88b8b" font-size="13" text-anchor="middle">21.6%</text>
  <text x="330.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">횟수 = log(1 − 0.99) ÷ log(1 − w⁵)</text>
</svg>
