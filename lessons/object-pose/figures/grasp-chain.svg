<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pose 에서 grasp 까지의 사슬. T_bc, T_co, 손잡이 grasp T_og 를 이으면 base 에서 손잡이는 (0.27, 0, 0.05) 다. pose 의 rotation 이 5° 틀리면 원점에서 7 cm 떨어진 손잡이가 약 6.1 mm 옮겨진다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="678" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="30.0" fill="#e2e8f0" font-size="14" text-anchor="start">① T_bg = T_bc · T_co · T_og</text>
  <rect x="20.0" y="48.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="68.0" y="85.0" fill="#e2e8f0" font-size="14" text-anchor="middle">base</text>
  <rect x="186.0" y="48.0" width="104.0" height="64.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="238.0" y="85.0" fill="#e2e8f0" font-size="14" text-anchor="middle">camera</text>
  <rect x="358.0" y="48.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="406.0" y="76.5" fill="#e2e8f0" font-size="14" text-anchor="middle">컵</text>
  <text x="406.0" y="93.5" fill="#94a3b8" font-size="12" text-anchor="middle">object frame</text>
  <rect x="524.0" y="48.0" width="136.0" height="64.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="592.0" y="85.0" fill="#e2e8f0" font-size="14" text-anchor="middle">손잡이 grasp</text>
  <line x1="118.0" y1="80.0" x2="183.0" y2="80.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="151.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">T_bc</text>
  <text x="151.0" y="132.0" fill="#e2e8f0" font-size="11" text-anchor="middle">(0.3, 0, 0.55), 아래를 봄</text>
  <text x="151.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">hand-eye calibration</text>
  <line x1="292.0" y1="80.0" x2="355.0" y2="80.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="324.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">T_co</text>
  <text x="324.0" y="132.0" fill="#e2e8f0" font-size="11" text-anchor="middle">t = (−0.1, 0, 0.5)</text>
  <text x="324.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">pose 추정기</text>
  <line x1="456.0" y1="80.0" x2="521.0" y2="80.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="489.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">T_og</text>
  <text x="489.0" y="132.0" fill="#e2e8f0" font-size="11" text-anchor="middle">(0.07, 0, 0)</text>
  <text x="489.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">CAD 위에서 미리 정함</text>
  <text x="592.0" y="132.0" fill="#e2e8f0" font-size="12" text-anchor="middle">base 에서</text>
  <text x="592.0" y="150.0" fill="#d88b8b" font-size="13" text-anchor="middle" font-weight="600">(0.27, 0, 0.05)</text>
  <text x="24.0" y="192.0" fill="#e2e8f0" font-size="14" text-anchor="start">② pose 의 rotation 오차 5° 가 손잡이를 옮기는 양 (위에서 본 컵)</text>
  <circle cx="160.0" cy="272.0" r="30" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <circle cx="160.0" cy="272.0" r="3.5" fill="#e2e8f0"/>
  <line x1="160.0" y1="272.0" x2="300.0" y2="272.0" stroke="#7cb4d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="160.0" y1="272.0" x2="295.2" y2="235.8" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="300.0" cy="272.0" r="6" fill="#d88b8b"/>
  <circle cx="295.2" cy="235.8" r="6" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <path d="M220,272 A60,60 0 0,0 218.0,256.5" fill="none" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="228.0" y="266.0" fill="#d6aa62" font-size="12" text-anchor="start">5°</text>
  <text x="230.0" y="292.0" fill="#7cb4d8" font-size="12" text-anchor="middle">7 cm</text>
  <text x="312.0" y="277.0" fill="#d88b8b" font-size="11" text-anchor="start">정답 pose 의 손잡이</text>
  <text x="307.2" y="233.8" fill="#d6aa62" font-size="11" text-anchor="start">5° 틀린 pose 의 손잡이</text>
  <text x="160.0" y="322.0" fill="#64748b" font-size="11" text-anchor="middle">(각도는 보기 쉽게 키워 그림)</text>
  <rect x="440.0" y="214.0" width="216.0" height="112.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="454.0" y="240.0" fill="#e2e8f0" font-size="13" text-anchor="start">0.07 × tan 5° ≈ 0.0061 m</text>
  <text x="454.0" y="262.0" fill="#d6aa62" font-size="12" text-anchor="start">→ 손잡이가 약 6.1 mm 옮겨짐</text>
  <text x="454.0" y="288.0" fill="#e2e8f0" font-size="12" text-anchor="start">10° 면 약 12 mm</text>
  <text x="454.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="start">(한쪽 여유 1 cm 를 넘는다)</text>
</svg>
