<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>render-and-compare 의 반복. 지금 pose 로 렌더한 그림과 사진에서 자른 물체 영역을 refiner 에 넣어 Δt, ΔR 로 pose 를 고치고 다시 렌더한다. DeepIM 은 LINEMOD 의 ADD 정답률을 62.7% 에서 88.6% 로 올렸다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="a-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="678" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="46.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="99.0" y="70.5" fill="#e2e8f0" font-size="14" text-anchor="middle">지금 pose</text>
  <text x="99.0" y="87.5" fill="#94a3b8" font-size="12" text-anchor="middle">R, t</text>
  <rect x="24.0" y="150.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="99.0" y="174.5" fill="#e2e8f0" font-size="14" text-anchor="middle">render</text>
  <text x="99.0" y="191.5" fill="#94a3b8" font-size="12" text-anchor="middle">CAD model 을 그림</text>
  <rect x="24.0" y="240.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="99.0" y="264.5" fill="#e2e8f0" font-size="14" text-anchor="middle">사진에서 자른</text>
  <text x="99.0" y="281.5" fill="#94a3b8" font-size="12" text-anchor="middle">물체 영역</text>
  <line x1="99.0" y1="104.0" x2="99.0" y2="146.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <rect x="250.0" y="150.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="325.0" y="174.5" fill="#e2e8f0" font-size="14" text-anchor="middle">refiner</text>
  <text x="325.0" y="191.5" fill="#94a3b8" font-size="12" text-anchor="middle">두 그림을 비교</text>
  <line x1="176.0" y1="178.0" x2="246.0" y2="178.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <path d="M176,268 L212,268 L212,192 L246,192" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <rect x="250.0" y="46.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="325.0" y="70.5" fill="#e2e8f0" font-size="14" text-anchor="middle">pose 고치기</text>
  <text x="325.0" y="87.5" fill="#94a3b8" font-size="12" text-anchor="middle">t + Δt,  ΔR ⊗ R</text>
  <line x1="325.0" y1="148.0" x2="325.0" y2="106.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="333.0" y="132.0" fill="#d6aa62" font-size="12" text-anchor="start">Δt, ΔR</text>
  <line x1="248.0" y1="74.0" x2="178.0" y2="74.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="213.0" y="64.0" fill="#94a3b8" font-size="12" text-anchor="middle">되풀이</text>
  <rect x="430.0" y="46.0" width="226.0" height="118.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="444.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start">DeepIM, LINEMOD</text>
  <text x="444.0" y="90.0" fill="#94a3b8" font-size="11" text-anchor="start">ADD 정답률 (문턱 diameter 10%)</text>
  <text x="444.0" y="116.0" fill="#e2e8f0" font-size="12" text-anchor="start">PoseCNN 의 pose</text>
  <text x="642.0" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="end">62.7%</text>
  <text x="444.0" y="138.0" fill="#e2e8f0" font-size="12" text-anchor="start">+ DeepIM 4 번</text>
  <text x="642.0" y="138.0" fill="#7fc4a2" font-size="13" text-anchor="end" font-weight="600">88.6%</text>
  <text x="642.0" y="156.0" fill="#7fc4a2" font-size="11" text-anchor="end">+25.9%p</text>
  <rect x="430.0" y="178.0" width="226.0" height="118.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1"/>
  <text x="444.0" y="202.0" fill="#e2e8f0" font-size="13" text-anchor="start">MegaPose (처음 보는 물체)</text>
  <text x="444.0" y="226.0" fill="#e2e8f0" font-size="12" text-anchor="start">coarse: 후보 pose 520 개</text>
  <text x="444.0" y="244.0" fill="#94a3b8" font-size="12" text-anchor="start">→ refiner 의 basin 안인지 점수</text>
  <text x="444.0" y="266.0" fill="#e2e8f0" font-size="12" text-anchor="start">refiner: 가장 높은 하나를 5 번</text>
  <text x="444.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="start">한 번 약 50 ms (RTX 2080)</text>
</svg>
