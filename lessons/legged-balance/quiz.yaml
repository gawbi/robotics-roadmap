# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: zmp
  title: ZMP 와 support polygon
  section: zmp-와-support-polygon
  variants:
    - question: |
        다리 로봇이 원하는 움직임에서 거꾸로 계산한 ZMP(바닥 반력이 몸을 돌리는 moment 를 남기지 않으려면 걸려야 하는 점)가 support
        polygon(발이 닿은 점들을 감싼 영역) 밖에 놓였다. 이 움직임을 내려 하면 어떻게 되는가?
      choices:
        - '무게중심이 support polygon 안에만 있으면, ZMP 가 밖에 있어도 그 움직임을 그대로 낼 수 있다'
        - '바닥 반력이 그 점에 걸릴 수 없어서, 발이 support polygon 의 가장자리를 축으로 들리며 돈다'
        - '바닥 반력이 커지며 ZMP 를 안으로 당기므로, 잠깐 흔들린 뒤 원래 움직임을 그대로 낸다'
        - '발이 옆으로 미끄러지기 시작하므로, 마찰 계수가 큰 바닥이면 같은 움직임을 낼 수 있다'
      answer: 1
      explanation: |
        바닥은 발을 밀기만 하므로 바닥 반력의 작용점(CoP)은 support polygon 밖에 있을 수 없다. 계산한 ZMP 가 밖이면 그 움직임에 필요한 바닥 반력을
        만들 수 없고, 발이 가장자리를 축으로 돌기 시작한다(Vukobratović 와 Borovac 은 이 점을 fictitious ZMP 라고 불렀다). 무게중심의 위치만으로는
        그 움직임을 낼 수 있는지 판단할 수 없다. 바닥 반력이 ZMP 를 안으로 당기는 일은 일어나지 않는다. 미끄러짐은 수평 힘과 마찰의 문제라서 ZMP 가
        밖에 있는 것과는 다른 실패다.
    - question: |
        무게중심이 발목 바로 위에 있는 두 발 로봇이 높이를 유지하며 앞으로 가속한다. cart-table 모델(탁자 위를 달리는 수레)로 보면 ZMP 는
        발목에서 어느 쪽으로 옮겨 가는가?
      choices:
        - '발목 앞쪽이다. 가속하는 방향으로 무게가 쏠리므로 발바닥의 압력 중심도 앞으로 옮겨 간다'
        - '발목에 그대로 있다. ZMP 는 무게중심의 위치로만 정해지고 가속도와는 관계가 없다'
        - '발목 뒤쪽이다. 앞으로 미는 바닥 힘이 몸을 뒤로 젖히므로 수직 힘이 뒤에서 걸려야 한다'
        - '발목 바깥쪽 옆이다. 앞으로 가속하면 몸이 좌우로 흔들려 ZMP 가 옆으로 비켜난다'
      answer: 2
      explanation: |
        ZMP 는 $p = x - (z/g)\ddot x$ 라서 앞으로 가속하면($\ddot x > 0$) 무게중심보다 뒤로 간다. 바닥이 몸을 앞으로 미는 힘은 무게중심보다 낮은
        곳에서 걸려 몸을 뒤로 젖히므로, 이를 상쇄하려면 수직 힘이 무게중심보다 뒤에서 걸려야 한다. 앞으로 쏠린다는 직관은 수레가 탁자를 반대로
        미는 반작용을 놓친 답이다. ZMP 는 가속도에 따라 바뀌므로 발목에 그대로 있지 않다. 앞뒤 가속은 ZMP 를 옆으로 옮기지 않는다.
    - question: |
        걷는 로봇의 ZMP 가 지금 support polygon 안에 있다. 이 사실로 알 수 있는 것은 무엇인가?
      choices:
        - '지금 순간 발바닥이 들리지 않고 그 가속도를 낼 수 있다는 것까지이고, 넘어지지 않는다는 보장은 없다'
        - '앞으로 어느 방향의 밀림을 받더라도 발을 내딛지 않고 그 자리에서 버틸 수 있는 자세라는 것이다'
        - '무게중심도 support polygon 위에 있다는 뜻이라서, 지금 정적으로 서 있는 자세라는 것이다'
        - '바닥 반력이 friction cone 안에 있으므로, 발이 바닥에서 미끄러지지 않는다는 것이다'
      answer: 0
      explanation: |
        ZMP 조건은 지금 이 순간의 가속도를 발바닥이 들리지 않은 채 낼 수 있는지만 따진다. 무게중심이 발끝보다 앞에 나가 있으면 ZMP 를 발끝에 두어도
        무게중심은 계속 앞으로 가속해 결국 발을 내디뎌야 한다. 밀림에 버티는 여유는 ZMP 와 따로 따져야 한다. 걷는 동안에는 ZMP 가 안에 있어도
        무게중심이 support polygon 밖에 있는 순간이 있다. 미끄러짐은 수평 힘과 마찰의 조건이라 ZMP 로는 알 수 없다.

- topic: preview
  title: preview control 보행 패턴
  section: preview-control
  variants:
    - question: |
        발자국으로 정한 ZMP 목표를 따르도록 무게중심 경로를 만드는 보행 패턴 생성에서, preview control 이 미래의 ZMP 목표까지 보는 이유는
        무엇인가?
      choices:
        - '미래의 ZMP 목표로 발이 미끄러질지 미리 알아내, 바닥의 마찰 계수를 추정해야 하기 때문이다'
        - '지금의 ZMP 오차를 계산할 때 다음 발자국의 위치가 기준점으로 꼭 필요하기 때문이다'
        - '계산 시간이 길어서, 지금의 입력을 미래의 목표에 맞춰 늦게 보내야 하기 때문이다'
        - 'ZMP 를 다음 발로 옮기려면 그보다 먼저 무게중심이 그쪽으로 움직이고 있어야 하기 때문이다'
      answer: 3
      explanation: |
        발을 바꾸는 순간 ZMP 목표는 다음 발로 건너가지만, 그 ZMP 를 만들려면 무게중심이 미리 그쪽으로 움직이고 있어야 한다. 그래서 지금의 입력을
        정할 때 미래의 목표가 필요하다. 마찰 계수 추정은 preview control 이 하는 일이 아니다. 지금의 ZMP 오차는 지금의 목표만으로 계산한다. 계산
        시간 때문에 입력을 늦추는 것도 preview 의 목적이 아니다.
    - question: |
        Kajita 등의 preview control 로 보행 패턴을 만들 때, 미래를 내다보는 길이를 1.6 초에서 0.8 초로 줄이면 어떻게 되는가?
      choices:
        - '내다볼 미래가 줄어든 만큼 계산이 단순해져, 무게중심이 더 일찍 출발하고 ZMP 오차도 줄어든다'
        - '무게중심이 늦게 출발해서 ZMP 가 목표를 지나치는 등 목표를 따라가는 오차가 커진다'
        - 'preview gain 이 모두 0 이 되어 controller 가 발산하고, 로봇은 첫 걸음에서 넘어진다'
        - '아무것도 바뀌지 않는다. preview gain 은 0.8 초보다 먼 미래에서 이미 0 이기 때문이다'
      answer: 1
      explanation: |
        미래를 짧게 보면 다음 발로 옮길 준비를 늦게 시작해, ZMP 가 목표를 덜 따라가거나 지나친다. Kajita 등도 0.8 초로는 추종이 나빴다고 보고했다.
        짧게 내다본다고 무게중심이 더 일찍 출발하지는 않는다. 상태 feedback 항이 남아 있어서 controller 가 발산하지는 않는다. preview gain 이 아주
        작아지는 것은 약 2 초보다 먼 미래라서, 0.8 초 뒤의 gain 은 아직 0 이 아니다.
    - question: |
        두 발 사이 가운데에 멈춰 있는 무게중심을 왼쪽으로 가속하기 시작하려 한다. ZMP 가 $p = y - (z/g)\ddot y$ ($y$ 는 무게중심의 좌우 위치,
        $z$ 는 높이)로 정해진다면 ZMP 를 어디에 두어야 하는가?
      choices:
        - '무게중심보다 왼쪽이다. 무게중심은 ZMP 쪽으로 끌려가며 그 방향으로 가속하기 때문이다'
        - '무게중심 바로 아래다. ZMP 가 무게중심 아래에 있어야 옆으로 힘을 낼 수 있기 때문이다'
        - '무게중심보다 오른쪽이다. 왼쪽 가속도가 양수이면 식에서 ZMP 가 무게중심보다 작아진다'
        - '어디에 두어도 같다. 옆 방향의 가속도는 다리 관절의 torque 만으로 정해지기 때문이다'
      answer: 2
      explanation: |
        $\ddot y > 0$ 이면 $p = y - (z/g)\ddot y$ 가 $y$ 보다 작아지므로 ZMP 는 무게중심의 오른쪽에 있어야 한다. 무게중심은 ZMP 에서 멀어지는 쪽으로
        가속하기 때문이다. ZMP 쪽으로 끌려간다는 생각은 방향이 반대다. ZMP 가 무게중심 바로 아래면 옆 가속도는 0 이다. 관절 torque 가 무엇이든 바닥
        반력이 걸리는 점은 ZMP 로 정해지므로, ZMP 의 위치가 가속도를 바꾼다.

- topic: lip
  title: linear inverted pendulum
  section: linear-inverted-pendulum
  variants:
    - question: |
        무게중심 높이가 $z$ 로 일정한 linear inverted pendulum 모델에서, 무게중심의 수평 가속도는 ZMP 와 어떤 관계인가?
      choices:
        - 'ZMP 에서 떨어진 거리에 비례해 ZMP 쪽으로 되돌아오는 방향으로, 매달린 용수철처럼 가속한다'
        - 'ZMP 에서 떨어진 거리에 $g/z$ 를 곱한 크기로, ZMP 에서 멀어지는 방향으로 가속한다'
        - '거리와 상관없이 중력 가속도 $g$ 의 크기로, ZMP 에서 멀어지는 방향으로 가속한다'
        - '높이가 일정하므로 수평 가속도는 늘 0 이고, ZMP 위치로는 속도만 정해진다'
      answer: 1
      explanation: |
        $\ddot x = (g/z)(x - p)$ 라서 무게중심은 ZMP 에서 떨어진 거리에 비례해, 멀어지는 쪽으로 가속한다. 손끝에 세운 막대가 기운 쪽으로 더 빨리
        넘어지는 것과 같다. 용수철처럼 되돌아오는 것은 매달린 진자이고, 거꾸로 선 진자는 반대다. 가속도는 거리에 비례하므로 늘 $g$ 인 것도 아니다.
        높이가 일정해도 무게중심이 ZMP 에서 떨어져 있으면 수평 가속도는 0 이 아니다.
    - question: |
        무게중심 높이만 다른 두 로봇이 ZMP 에서 같은 거리만큼 앞에 무게중심을 두고 멈춰 있다. linear inverted pendulum 으로 보면 어느 쪽이 더
        빨리 넘어지는가?
      choices:
        - '무게중심이 높은 쪽이다. 무게중심이 높을수록 넘어뜨리는 지렛대가 길어지기 때문이다'
        - '둘이 같다. 넘어지는 빠르기는 ZMP 에서 떨어진 거리로만 정해지고 높이와는 상관없다'
        - '무게중심이 낮은 쪽은 넘어지지 않는다. 무게중심이 낮으면 inverted pendulum 이 저절로 안정하다'
        - '무게중심이 낮은 쪽이다. $\omega = \sqrt{g/z}$ 가 커서 거리가 더 빨리 불어나기 때문이다'
      answer: 3
      explanation: |
        가속도는 $(g/z) \times$ 거리이므로 $z$ 가 작을수록 같은 거리에서 더 크게 가속하고, 넘어지는 빠르기를 정하는 $\omega = \sqrt{g/z}$ 도 크다. 높이
        0.8 m 에서는 $\omega = 3.50$ /s 이고 0.29 m 에서는 5.82 /s 다. 무게중심이 높을수록 작은 힘에 넘어간다는 것은 버티는 힘을 따진 정적인
        계산이고, 일단 기운 뒤에는 낮은 쪽이 더 빨리 넘어진다. 높이가 결과를 바꾸므로 둘이 같지 않다. 낮은 로봇도 거꾸로 선 진자라서 저절로 안정하지
        않다.
    - question: |
        무게중심이 발끝보다 앞에 나간 채 멈춰 있는 두 발 로봇이 있다. 발을 떼지 않는다면 이 로봇이 할 수 있는 일은 무엇인가?
      choices:
        - '발목 torque 로 ZMP 를 무게중심보다 앞에 두어, 무게중심을 뒤로 되돌릴 수 있다'
        - 'ZMP 를 발끝에 두어 넘어지는 가속을 줄일 뿐이고, 서려면 결국 발을 내디뎌야 한다'
        - '무게중심을 낮춰 $\omega$ 를 줄이면 앞으로의 가속이 멈춰서, 그 자리에 설 수 있다'
        - '무게중심이 멈춰 있으므로, 아무것도 하지 않아도 그 자리에 계속 서 있을 수 있다'
      answer: 1
      explanation: |
        ZMP 는 발 안에만 둘 수 있어서 가장 앞이 발끝이다. 무게중심이 그보다 앞이면 ZMP 를 발끝에 두어도 무게중심은 ZMP 에서 멀어지는 쪽으로
        가속한다. 발목으로는 가속을 줄일 수 있을 뿐이고, 서려면 발을 내디뎌 support polygon 을 옮겨야 한다. ZMP 는 발끝보다 앞에 둘 수 없으므로
        무게중심보다 앞에 둘 수도 없다. 무게중심을 낮추면 $\omega$ 는 오히려 커진다. 멈춰 있어도 거꾸로 선 진자의 평형은 불안정하다.

- topic: capture-point
  title: capture point
  section: capture-point
  variants:
    - question: |
        무게중심 높이 $z$ 가 일정한 linear inverted pendulum 로봇이 밀려서 앞으로 속도 $v$ 를 가졌다. $\omega = \sqrt{g/z}$ 일 때 capture point
        (디디고 ZMP 를 두면 멈춰 설 수 있는 점)는 어디인가?
      choices:
        - '무게중심 바로 아래다. 발을 무게중심 아래에 두면 속도와 상관없이 언제나 멈춰 선다'
        - '무게중심에서 $v \times \omega$ 만큼 뒤다. 움직이는 반대쪽에 디뎌야 속도가 빨리 줄어든다'
        - '무게중심에서 $v^2 \div (2g)$ 만큼 앞이다. 운동 에너지가 0 이 되는 거리가 답이다'
        - '무게중심에서 $v \div \omega$ 만큼 움직이는 쪽 앞이다. 그 점 위에서 무게중심이 멈춘다'
      answer: 3
      explanation: |
        capture point 는 $x + v/\omega$ 다. 예를 들어 높이 0.8 m($\omega = 3.50$ /s)에서 0.7 m/s 로 밀리면 $0.7 \div 3.50 = 0.20$ m 앞이다. 그 점을
        디디고 ZMP 를 두면 무게중심은 다가가며 느려져 그 위에서 멈춘다. 무게중심 바로 아래를 디디면 무게중심이 발을 넘어간다. 뒤에 디디면 무게중심이
        ZMP 에서 더 멀어지며 가속한다. $v^2 \div (2g)$ 는 공을 던져 올릴 때의 높이 계산이라 거꾸로 선 진자와는 관계없다.
    - question: |
        밀린 두 발 로봇의 capture point 가 발 밖에 있다. 로봇이 발을 내딛지 않고 ZMP 를 발끝에 둔 채 버티면 capture point 는 어떻게 되는가?
      choices:
        - '발 쪽으로 점점 다가와서, 조금만 기다리면 발을 내딛지 않고도 설 수 있게 된다'
        - '밀린 순간에 정해진 점이라서, 언제 디디든 같은 거리에 디디면 멈춰 설 수 있다'
        - 'ZMP 에서 점점 빠르게 멀어져서, 늦게 디딜수록 더 먼 곳에 디뎌야 멈춰 선다'
        - '무게중심의 속도가 저절로 줄어들면서, 무게중심 바로 아래로 되돌아온다'
      answer: 2
      explanation: |
        capture point $\xi$ 는 $\dot\xi = \omega(\xi - p)$ 를 따라, ZMP 에서 떨어진 거리에 비례하는 속도로 ZMP 에서 멀어진다. 높이 0.8 m 에서
        0.7 m/s 로 밀린 예에서는 0.20 m 이던 점이 0.2 초 뒤에는 0.30 m 가 되고 0.4 초 뒤에는 0.51 m 가 된다. capture point 가 발 쪽으로 다가오는 일은
        없다. 밀린 순간의 점에 그대로 있지도 않아서, 늦게 디딜수록 더 먼 걸음이 필요하다. 거꾸로 선 진자의 속도는 저절로 줄지 않으므로 capture point
        가 무게중심 아래로 되돌아오지 않는다.
    - question: |
        밀린 로봇의 capture point 가 한 걸음으로 닿을 수 있는 거리보다 멀다. Pratt 등의 capture point 규칙으로 보면 어떻게 되는가?
      choices:
        - '한 걸음으로는 멈춰 설 수 없고, 두 걸음 이상이 필요하며 끝내 설 수 없을 수도 있다'
        - '한 걸음을 최대로 디디면, 남은 거리는 발목 torque 로 언제나 보충해 멈춰 설 수 있다'
        - '이 상태에서는 capture point 를 정의할 수 없으므로, ZMP 보행 패턴으로 바꿔야 한다'
        - '발을 디디지 않고 기다리면 capture point 가 다가와 한 걸음 범위 안으로 들어온다'
      answer: 0
      explanation: |
        Pratt 등은 capture point 가 한 걸음이 닿는 범위 밖이면 한 걸음으로는 설 수 없고 적어도 두 걸음이 필요하다고 정리했다. Pratt 와 Koolen 은 이
        생각을 n 걸음으로 넓혀 capturability 라고 불렀다. 발목 torque 는 ZMP 를 발 안에서만 옮기므로 남은 거리를 메우지 못한다. capture point 는 한 걸음
        범위 밖이어도 정의된다. 기다리면 capture point 는 다가오지 않고 더 멀어진다.

- topic: srb
  title: 점 발과 single rigid body 모델
  section: 점-발과-single-rigid-body-모델
  variants:
    - question: |
        작은 공 모양의 점 발로 trot(대각선 두 발씩 번갈아 딛는 걸음새)를 하는 4족 로봇에 ZMP 기반 보행 계획을 그대로 쓰기 어려운 이유는 무엇인가?
      choices:
        - '대각선 두 발의 support polygon 이 넓이 없는 선분이고, 네 발이 모두 뜨는 순간도 있어서다'
        - '4족 로봇은 무게중심이 낮아서 ZMP equation 의 높이가 0 에 가까워져 계산이 깨지기 때문이다'
        - '점 발은 바닥 반력을 내지 못해서 ZMP 를 계산할 바닥 힘 자체가 생기지 않기 때문이다'
        - '다리가 넷이면 ZMP 가 발마다 하나씩 네 개 생겨서, 하나의 ZMP 목표로는 계획할 수 없기 때문이다'
      answer: 0
      explanation: |
        ZMP 를 옮기려면 support polygon 에 넓이가 있어야 한다. trot 의 두 점 발은 선분만 만들고, 공중에 뜬 순간에는 support polygon 자체가 없다. 그래서
        MIT 의 Cheetah 연구에서는 무게중심 경로 대신 바닥 반력을 직접 계획했다. 4족 로봇도 무게중심 높이가 0 은 아니어서 ZMP equation 이 깨지지 않는다.
        점 발도 바닥 반력을 받으므로 ZMP 를 계산할 바닥 힘이 있다. ZMP 는 바닥 반력 전체에 대해 하나로 정의되므로 발마다 따로 생기지 않는다.
    - question: |
        convex MPC 가 쓰는 single rigid body 모델은 다리 로봇을 어떻게 나타내는가?
      choices:
        - '다리마다 질량을 따로 두고, 관절 12 개의 각도로 몸 전체의 움직임을 계산한다'
        - '로봇을 높이가 일정한 점 하나로 보아, 몸통의 회전은 계산에 넣지 않는다'
        - '다리의 영향을 무시하고, 로봇 전체를 질량과 회전 관성을 가진 상자 하나로 본다'
        - '몸통을 무시하고, 네 발을 용수철로 이은 질량 네 개가 움직이는 것으로 본다'
      answer: 2
      explanation: |
        single rigid body 모델은 다리의 영향을 무시하고 로봇 전체를 상자 하나로 본다. 발 힘의 합으로 몸통의 가속을 계산하고, 발 힘의 moment 합으로
        몸통의 회전을 계산한다. 관절마다 질량을 두는 것은 WBIC 가 쓰는 전체 dynamics 다. 높이가 일정한 점 하나는 linear inverted pendulum 이라 몸통 회전을 다루지 못한다. 네 질량을
        용수철로 잇는 모델은 이 방법과 관계없다.
    - question: |
        네 발로 서 있는 4족 로봇의 무게중심이 앞발과 뒷발 사이 가운데보다 앞에 있다. 몸통이 앞뒤로 기울지 않으려면 발의 수직 힘을 어떻게 나눠야
        하는가?
      choices:
        - '뒷발이 더 많이 받는다. 무게중심에서 먼 쪽 발이 더 큰 힘을 내야 앞뒤의 지렛대가 맞는다'
        - '앞발이 더 많이 받는다. 무게중심에 가까운 쪽 발이 더 큰 힘을 받아야 moment 가 같다'
        - '네 발이 똑같이 받는다. 수직 힘의 합만 무게와 같으면 몸통은 기울지 않는다'
        - '앞발만 받는다. 무게중심이 가운데보다 앞이면 뒷발은 바닥에서 들어 올려야 한다'
      answer: 1
      explanation: |
        앞발 힘 × 앞발까지 거리와 뒷발 힘 × 뒷발까지 거리가 같아야 하므로, 가까운 앞발이 더 큰 힘을 받는다. 예를 들어 무게중심이 2 cm 앞이고 엉덩이가
        ±0.19 m 에 있으면 앞발 둘이 48.8 N 을 받고 뒷발 둘이 39.5 N 을 받는다. 먼 쪽이 더 받으면 moment 가 더 어긋난다. 똑같이 받으면 합은 맞아도
        뒷발 쪽 moment 가 커서 몸통이 앞으로 숙여진다. 무게중심이 발 사이에 있는 한 뒷발을 들 필요는 없다.

- topic: convex-mpc
  title: convex MPC
  section: convex-mpc
  variants:
    - question: |
        MIT Cheetah 의 convex MPC 가 매 주기 최적화 문제로 정하는 값(결정 변수)은 무엇인가?
      choices:
        - '앞으로 내다보는 step 마다 열두 관절이 가야 할 목표 각도와 각속도'
        - '다음 걸음에 발을 디딜 착지점과, 걸음 한 주기에 걸리는 시간'
        - '앞으로 내다보는 step 마다 땅에 닿은 발이 받을 바닥 반력'
        - '몸통이 따라갈 목표 속도와 목표 자세, 그리고 몸통의 높이'
      answer: 2
      explanation: |
        convex MPC 는 horizon 동안 step 마다 땅에 닿은 발의 바닥 반력을 변수로 두고, single rigid body 모델로 몸통 상태를 예측한다. 관절 각도와 torque 는
        그 힘을 $J^\top$ 나 WBIC 로 바꿔 얻는다. 착지점과 걸음 주기는 gait scheduler 와 Raibert heuristic 이 미리 정한다. 목표 속도와 자세는 명령으로
        주어지는 값이다.
    - question: |
        Cheetah 의 MPC 를 QP(이차식 비용, 일차 부등식 제약)로 빠르게 풀 수 있게 만든 핵심은 무엇인가?
      choices:
        - '발이 닿는 순서와 착지점, 몸통 자세 일부를 미리 정해 상태가 힘에 대해 직선 관계가 되게 했다'
        - '다리의 질량까지 넣은 전체 dynamics 를 써서, 모델과 실제 로봇 사이의 오차를 모두 없앴다'
        - 'horizon 을 한 step 으로 줄여서 최적화할 변수를 네 발의 힘 열두 개로 줄였다'
        - 'friction cone 같은 부등식 제약을 빼서 비용 함수의 최소만 찾으면 되게 했다'
      answer: 0
      explanation: |
        회전의 $\mathbf{r}_i \times \mathbf{f}_i$ 와 몸통 자세 때문에 원래 모델은 힘에 대해 직선이 아니다. roll·pitch 는 작다고 보고, yaw 와 발 위치에는
        계획한 값을 넣고, 어느 발이 언제 닿을지는 미리 정한다. 그러면 상태가 힘에 대해 직선 관계가 되어, 문제는 비용이 그릇 모양 이차식이고 제약이
        일차식인 QP 가 된다. 전체 dynamics 를 넣으면 오히려 직선 관계가 아니게 된다. horizon 은 한 step 이 아니라 10 step 을 쓴다. friction cone 제약은
        빼지 않고 문제 안에 남겨 둔다.
    - question: |
        원하는 가속에 필요한 발 힘을 먼저 계산한 뒤 발마다 마찰 한계로 잘라 내는 방식과 비교할 때, 제약을 넣은 QP 로 힘을 정하는 이점은 무엇인가?
      choices:
        - '잘라 내면 힘이 마찰 한계를 넘게 되어 발이 미끄러지지만, QP 는 한계 안의 힘만 고른다'
        - '자른 힘들은 몸통을 돌리는 moment 의 균형을 깨뜨릴 수 있지만, QP 는 회전까지 맞춘다'
        - '결과는 언제나 같지만, QP 가 잘라 내는 방식보다 계산이 훨씬 빠르다는 점이다'
        - '잘라 내면 힘의 합이 무게보다 커져 로봇이 뛰어오르지만, QP 는 힘의 합을 무게에 맞춘다'
      answer: 1
      explanation: |
        발마다 따로 자르면 한계는 지키지만 네 발 힘의 조합이 바뀌어 몸통을 돌리는 moment 가 어긋날 수 있다. QP 는 마찰 제약을 지키는 힘들 가운데에서
        몸통의 위치와 회전 오차를 함께 줄이는 조합을 고르고, 못 낸 가속은 뒤의 step 에서 이어 간다. 자른 힘은 한계를 넘지 않는다. moment 균형 때문에
        두 방식의 결과는 다를 수 있다. 자르면 힘의 합은 오히려 줄어든다.

- topic: foot-force-torque
  title: 발 힘과 joint torque
  section: 발-힘과-joint-torque
  variants:
    - question: |
        MPC 가 정한 바닥 반력 $\mathbf{f}$(바닥이 발을 미는 힘)를 다리의 joint torque 로 바꾸는 식은 무엇인가? $J$ 는 관절 속도를 발 속도로
        바꾸는 Jacobian 이다.
      choices:
        - '$\tau = J^\top \mathbf{f}$ 다. 바닥 반력과 다리가 바닥을 미는 힘은 같은 방향이다'
        - '$\tau = J^{-1} \mathbf{f}$ 다. 발의 힘을 관절로 옮기려면 Jacobian 의 역행렬을 곱한다'
        - '$\tau = J \mathbf{f}$ 다. 관절 torque 는 Jacobian 을 바닥 반력에 곱해서 얻는다'
        - '$\tau = J^\top(-\mathbf{f})$ 다. 다리는 바닥 반력의 반대 힘으로 바닥을 밀어야 한다'
      answer: 3
      explanation: |
        다리가 바닥을 미는 힘은 바닥 반력의 반작용인 $-\mathbf{f}$ 이고, 발 끝의 힘을 joint torque 로 바꾸는 것은 $\tau = J^\top F$ 다. 그래서
        $\tau = J^\top(-\mathbf{f})$ 이고, Cheetah-Software 도 MPC 의 힘에 −1 을 곱해 넘긴다. 부호를 빼면 다리가 바닥을 당기는 torque 가 된다.
        $J^{-1}$ 은 발 속도를 관절 속도로 바꿀 때 쓰는 것이다. $J\mathbf{f}$ 는 관절 속도를 발 속도로 바꾸는 방향의 계산이라 힘을 torque 로 바꾸지 못한다.
    - question: |
        발이 엉덩이 관절 바로 아래에 있고 바닥 반력이 수직 위로만 걸린다. 이때 엉덩이 관절의 torque 는 어떤가?
      choices:
        - '0 이다. 힘의 작용선이 엉덩이를 지나서 엉덩이를 돌리는 moment 가 생기지 않는다'
        - '가장 크다. 엉덩이는 다리 맨 위에 있어서 몸 전체의 무게를 혼자 받쳐야 한다'
        - '무릎 torque 와 같다. 한 다리의 관절들은 같은 torque 를 나눠서 내기 때문이다'
        - '무게 × 다리 길이다. 엉덩이에서 발까지의 거리가 그대로 지렛대가 되기 때문이다'
      answer: 0
      explanation: |
        torque 는 힘 × 관절에서 힘의 작용선까지의 수직 거리라서, 수직 힘의 작용선이 엉덩이를 지나면 엉덩이 torque 는 0 이다. 무릎은 작용선에서 수평으로
        떨어져 있어 torque 를 낸다(예를 들어 0.141 m 떨어진 무릎에 44.1 N 이 걸리면 6.24 N·m 다). 엉덩이가 무게를 받는 것은 구조가 버티는 일이다.
        관절 torque 는 관절마다 달라서 무릎과 같지 않다. 발까지의 거리는 수직 방향이라 수직 힘의 지렛대가 아니다.
    - question: |
        Mini Cheetah 의 MPC 는 1초에 30 ~ 40 번만 계산한다. Kim 등(2019)의 WBIC(whole-body impulse control)는 그 사이를 어떻게 채우는가?
      choices:
        - 'MPC 가 낸 힘을 그대로 두고, 다음 MPC 계산 때까지 같은 joint torque 를 계속 보낸다'
        - '다리 질량을 무시한 같은 모델로 MPC 문제를 1초에 500 번 다시 풀어 힘을 바꾼다'
        - '1초에 500 번 전체 dynamics 로 MPC 의 힘을 고쳐 가며 torque 와 목표 각도를 낸다'
        - '학습한 policy 가 MPC 의 출력을 대신해서, 관절의 목표 각도만 1초에 500 번 낸다'
      answer: 2
      explanation: |
        WBIC 는 1초에 500 번 다리까지 넣은 전체 dynamics 로 계산해, MPC 의 바닥 반력을 목표로 삼되 몸통 자세와 공중 발의 움직임을 맞추도록 힘을 조금씩
        고친다. 그리고 joint torque 와 목표 관절 각도·속도를 낸다. 같은 torque 를 계속 보내면 MPC 사이의 변화에 대응하지 못한다. WBIC 는 다리 질량을
        무시한 모델로 MPC 를 더 자주 푸는 것과는 다른 계산이다. WBIC 는 model 기반 계산이라 학습한 policy 와 관계없다.

- topic: model-vs-learned
  title: model 기반 제어와 학습한 policy
  section: model-기반-제어와-학습한-policy
  variants:
    - question: |
        model 기반 보행 controller(ZMP 계획, MPC)가 reinforcement learning 으로 학습한 policy 보다 약한 상황으로 가장 알맞은 것은?
      choices:
        - '디딜 곳이 드문 징검다리에서 계획한 발 위치를 정확히 디뎌야 하는 상황'
        - '미끄럽거나 무른 바닥처럼 모델의 가정이 실제와 어긋나는 상황'
        - '사람이 비용의 weight 를 바꿔 로봇의 동작을 고쳐야 하는 상황'
        - '같은 controller 로 여러 걸음새를 바꿔 가며 걸어야 하는 상황'
      answer: 1
      explanation: |
        model 기반 controller 는 미끄러지지 않음, 정확한 상태 추정 같은 가정 위에서 계산하므로 가정이 깨지는 미끄럽거나 무른 바닥에서 약하다. Jenelten
        등과 Boston Dynamics 가 모두 이 약점을 지적했다. 디딜 곳이 드문 지형에서는 오히려 reward 가 드물어 policy 를 학습하기 어렵다. weight 로 동작을
        고치기 쉬운 것은 MPC 의 장점이다. gait scheduler 의 순서만 바꿔 여러 걸음새로 걷는 것도 MPC 의 장점이다.
    - question: |
        DTC(Deep Tracking Control)는 model 기반 계획과 학습한 policy 를 어떻게 합쳤는가?
      choices:
        - 'model 기반 최적화가 착지점과 몸통 경로를 계획하고, policy 는 그 계획을 따라가도록 학습한다'
        - 'policy 가 착지점을 정하고, MPC 가 그 착지점으로 가는 바닥 반력을 매 주기 계산해 낸다'
        - '학습이 끝난 policy 를 MPC 의 비용 함수로 바꾸어, 매 주기 그 비용을 최소로 하는 힘을 찾는다'
        - '평소에는 MPC 로 걷다가, 넘어지려는 순간에만 학습한 policy 로 controller 를 바꿔 쓴다'
      answer: 0
      explanation: |
        DTC 에서는 model 기반 trajectory optimization 이 착지점과 몸통 경로를 계획하고, policy 는 simulation 에서 그 계획을 따라가도록 학습해 관절 목표
        각도를 낸다. 계획은 모델이 맡고 모델이 틀리는 순간의 대응은 policy 가 맡아서, DTC 는 비교 대상 RL policy 가 못 건넌 틈을 건넜다. 착지점을
        policy 가 정하는 것은 역할이 반대다. policy 를 MPC 의 비용 함수로 바꾸는 구성은 이 논문의 방법이 아니다. DTC 의 policy 는 늘 계획을 따라가므로
        넘어지려는 순간에만 바꿔 쓰는 controller 가 아니다.
    - question: |
        reinforcement learning 보행이 나온 뒤 model 기반 MPC 가 실제 로봇에서 쓰이는 모습으로 맞는 것은 무엇인가?
      choices:
        - '상용 다리 로봇은 모두 MPC 를 버리고, 센서에서 관절 명령까지 학습한 policy 로 바꿨다'
        - 'MPC 는 계산이 느려 simulation 에서만 쓰이고, 실제 로봇에는 올린 적이 없다'
        - 'MPC 는 4족 로봇에만 쓰였고, humanoid 의 균형 제어에는 쓰인 적이 없다'
        - 'Spot 은 MPC 기반 controller 를 두고, 프로그램하기 어려운 부분만 학습해 더했다'
      answer: 3
      explanation: |
        Boston Dynamics 는 자기 회사의 다리 로봇이 MPC 를 써 왔다고 설명한다. Spot 에서는 기존 model 기반 controller 가 잘하는 부분을 그대로 맡기고,
        프로그램하기 어려운 부분만 reinforcement learning 으로 학습해 더했다. 그러니 상용 다리 로봇이 모두 MPC 를 버린 것은 아니다. Mini Cheetah 는
        실제 로봇에서 MPC 를 1초에 30 ~ 40 번 계산했다. humanoid 인 Atlas 의 parkour 에도 MPC 가 쓰였다.
