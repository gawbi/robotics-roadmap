<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>cart-table 모델의 ZMP. 예로 무게중심 높이 0.8 m, 발목 앞뒤로 0.1 m 인 발에서 무게중심이 발목 위에 있을 때, 앞쪽 가속도가 0, 1, 1.23, 2 m/s² 이면 ZMP 는 발목에서 0, 8.2, 10.0, 16.3 cm 뒤에 있다. 16.3 cm 는 발 밖이라 그 가속도는 낼 수 없다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">cart-table 모델 (Kajita 등, 2003): 수레 = 무게중심, 탁자 받침 = 발. 높이와 발 크기는 예로 정한 값</text>
  <rect x="20.0" y="44.0" width="280.0" height="306.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="36.0" y1="300.0" x2="284.0" y2="300.0" stroke="#475569" stroke-width="2"/>
  <rect x="120.0" y="288.0" width="80.0" height="12.0" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="155.0" y="118.0" width="10.0" height="170.0" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <rect x="70.0" y="110.0" width="180.0" height="8.0" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <rect x="132.0" y="80.0" width="56.0" height="26.0" rx="5" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <circle cx="144.0" cy="107.0" r="4" fill="#334155" stroke="#7cb4d8" stroke-width="1.5"/>
  <circle cx="176.0" cy="107.0" r="4" fill="#334155" stroke="#7cb4d8" stroke-width="1.5"/>
  <circle cx="160.0" cy="93.0" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <line x1="196.0" y1="93.0" x2="244.0" y2="93.0" stroke="#d6aa62" stroke-width="2.2" marker-end="url(#ar-amber)"/>
  <text x="220.0" y="84.0" fill="#d6aa62" font-size="12" text-anchor="middle">가속</text>
  <line x1="50.0" y1="300.0" x2="50.0" y2="93.0" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar-muted)" marker-start="url(#ar-muted)"/>
  <text x="58.0" y="205.0" fill="#94a3b8" font-size="12" text-anchor="start">z = 0.8 m</text>
  <line x1="127.4" y1="326.0" x2="127.4" y2="302.0" stroke="#7fc4a2" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="127.4" y="340.0" fill="#7fc4a2" font-size="12" text-anchor="middle">ZMP 가 뒤로</text>
  <text x="204.0" y="284.0" fill="#94a3b8" font-size="11" text-anchor="start">발끝</text>
  <text x="116.0" y="284.0" fill="#94a3b8" font-size="11" text-anchor="end">뒤꿈치</text>
  <rect x="320.0" y="44.0" width="380.0" height="306.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="336.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start">무게중심이 발목 위(0)에 있을 때 ZMP 의 위치</text>
  <text x="336.0" y="92.0" fill="#7cb4d8" font-size="12.5" text-anchor="start">ZMP = 0 − 0.8 ÷ 9.81 × 가속도</text>
  <rect x="530.0" y="116.0" width="140.0" height="22.0" rx="4" fill="#7fc4a2" fill-opacity="0.18" stroke="#7fc4a2" stroke-width="1.5"/>
  <line x1="600.0" y1="110.0" x2="600.0" y2="144.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="600.0" y="158.0" fill="#94a3b8" font-size="11" text-anchor="middle">발목 0</text>
  <text x="670.0" y="158.0" fill="#94a3b8" font-size="11" text-anchor="middle">발끝 +0.1</text>
  <text x="530.0" y="158.0" fill="#94a3b8" font-size="11" text-anchor="middle">뒤꿈치 −0.1</text>
  <text x="336.0" y="192.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">가속도 0 m/s²</text>
  <line x1="481.0" y1="188.0" x2="677.0" y2="188.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="530.0" y1="180.0" x2="530.0" y2="196.0" stroke="#475569" stroke-width="1"/>
  <line x1="670.0" y1="180.0" x2="670.0" y2="196.0" stroke="#475569" stroke-width="1"/>
  <circle cx="600.0" cy="188.0" r="6" fill="#7fc4a2" stroke="none" stroke-width="1.5"/>
  <text x="610.0" y="177.0" fill="#7fc4a2" font-size="12" text-anchor="start">0</text>
  <text x="336.0" y="230.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">가속도 1 m/s²</text>
  <line x1="481.0" y1="226.0" x2="677.0" y2="226.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="530.0" y1="218.0" x2="530.0" y2="234.0" stroke="#475569" stroke-width="1"/>
  <line x1="670.0" y1="218.0" x2="670.0" y2="234.0" stroke="#475569" stroke-width="1"/>
  <circle cx="543.0" cy="226.0" r="6" fill="#7fc4a2" stroke="none" stroke-width="1.5"/>
  <text x="553.0" y="215.0" fill="#7fc4a2" font-size="12" text-anchor="start">−8.2 cm</text>
  <text x="336.0" y="268.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">가속도 1.23 m/s²</text>
  <line x1="481.0" y1="264.0" x2="677.0" y2="264.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="530.0" y1="256.0" x2="530.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="670.0" y1="256.0" x2="670.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <circle cx="529.8" cy="264.0" r="6" fill="#d6aa62" stroke="none" stroke-width="1.5"/>
  <text x="539.8" y="253.0" fill="#d6aa62" font-size="12" text-anchor="start">−10.0 cm, 뒤꿈치 끝</text>
  <text x="336.0" y="306.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">가속도 2 m/s²</text>
  <line x1="481.0" y1="302.0" x2="677.0" y2="302.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="530.0" y1="294.0" x2="530.0" y2="310.0" stroke="#475569" stroke-width="1"/>
  <line x1="670.0" y1="294.0" x2="670.0" y2="310.0" stroke="#475569" stroke-width="1"/>
  <line x1="479.8" y1="296.0" x2="491.8" y2="308.0" stroke="#d88b8b" stroke-width="2.2"/>
  <line x1="479.8" y1="308.0" x2="491.8" y2="296.0" stroke="#d88b8b" stroke-width="2.2"/>
  <text x="485.8" y="291.0" fill="#d88b8b" font-size="12" text-anchor="middle">−16.3 cm, 발 밖</text>
  <text x="336.0" y="330.0" fill="#d88b8b" font-size="12" text-anchor="start">2 m/s² 는 낼 수 없다: 발이 뒤꿈치를 축으로 들린다</text>
</svg>
