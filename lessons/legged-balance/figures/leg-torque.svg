<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>발 힘과 joint torque. 예로 허벅지와 정강이가 0.2 m 인 다리를 엉덩이 45°, 무릎 −90° 로 굽혀 발이 엉덩이 바로 아래 0.283 m 에 있을 때, 바닥 반력이 위로 44.1 N 이면 엉덩이 torque 는 0, 무릎 torque 는 6.24 N·m 다. 앞으로 13.5 N 이 더해지면 엉덩이 −3.82 N·m, 무릎 4.33 N·m 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="418" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">허벅지·정강이 0.2 m(예), 엉덩이 45°, 무릎 −90°. 다리는 바닥 반력 f 의 반대인 −f 로 바닥을 민다: τ = Jᵀ(−f)</text>
  <rect x="20.0" y="44.0" width="330.0" height="362.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="36.0" y="68.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">높이 유지: 위로 44.1 N</text>
  <text x="36.0" y="94.0" fill="#a99ad6" font-size="12.5" text-anchor="start">엉덩이 τ₁ = 0.283 × 0 + 0 × (−44.1) = 0</text>
  <text x="36.0" y="114.0" fill="#d6aa62" font-size="12.5" text-anchor="start">무릎 τ₂ = (−0.141) × (−44.1) = 6.24 N·m</text>
  <line x1="150.0" y1="150.0" x2="223.5" y2="223.5" stroke="#94a3b8" stroke-width="5"/>
  <line x1="223.5" y1="223.5" x2="150.0" y2="297.1" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="150.0" cy="150.0" r="7" fill="#334155" stroke="#a99ad6" stroke-width="2"/>
  <circle cx="223.5" cy="223.5" r="7" fill="#334155" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="150.0" cy="297.1" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="40.0" y1="303.1" x2="330.0" y2="303.1" stroke="#475569" stroke-width="2"/>
  <text x="138.0" y="154.0" fill="#a99ad6" font-size="12" text-anchor="end">엉덩이</text>
  <text x="235.5" y="227.5" fill="#d6aa62" font-size="12" text-anchor="start">무릎</text>
  <line x1="150.0" y1="160.0" x2="150.0" y2="289.1" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="142.0" y="253.5" fill="#94a3b8" font-size="11.5" text-anchor="end">0.283 m</text>
  <line x1="150.0" y1="384.4" x2="150.0" y2="305.1" stroke="#7fc4a2" stroke-width="2.6" marker-end="url(#ar-green)"/>
  <text x="160.0" y="380.4" fill="#7fc4a2" font-size="12" text-anchor="start">바닥 반력 f = (0, 44.1) N</text>
  <line x1="150.0" y1="223.5" x2="223.5" y2="223.5" stroke="#d6aa62" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="186.8" y="217.5" fill="#d6aa62" font-size="11.5" text-anchor="middle">0.141 m</text>
  <rect x="370.0" y="44.0" width="330.0" height="362.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="386.0" y="68.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">3 m/s² 로 가속: 앞 13.5 N, 위 44.1 N</text>
  <text x="386.0" y="94.0" fill="#a99ad6" font-size="12.5" text-anchor="start">엉덩이 τ₁ = 0.283 × (−13.5) = −3.82 N·m</text>
  <text x="386.0" y="114.0" fill="#d6aa62" font-size="12.5" text-anchor="start">무릎 τ₂ = 0.141 × (−13.5) + 6.24 = 4.33 N·m</text>
  <line x1="500.0" y1="150.0" x2="573.5" y2="223.5" stroke="#94a3b8" stroke-width="5"/>
  <line x1="573.5" y1="223.5" x2="500.0" y2="297.1" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="500.0" cy="150.0" r="7" fill="#334155" stroke="#a99ad6" stroke-width="2"/>
  <circle cx="573.5" cy="223.5" r="7" fill="#334155" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="500.0" cy="297.1" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="390.0" y1="303.1" x2="680.0" y2="303.1" stroke="#475569" stroke-width="2"/>
  <text x="488.0" y="154.0" fill="#a99ad6" font-size="12" text-anchor="end">엉덩이</text>
  <text x="585.5" y="227.5" fill="#d6aa62" font-size="12" text-anchor="start">무릎</text>
  <line x1="500.0" y1="160.0" x2="500.0" y2="289.1" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="492.0" y="253.5" fill="#94a3b8" font-size="11.5" text-anchor="end">0.283 m</text>
  <line x1="475.7" y1="384.4" x2="500.0" y2="305.1" stroke="#7fc4a2" stroke-width="2.6" marker-end="url(#ar-green)"/>
  <text x="485.7" y="380.4" fill="#7fc4a2" font-size="12" text-anchor="start">바닥 반력 f = (13.5, 44.1) N</text>
  <line x1="500.0" y1="223.5" x2="573.5" y2="223.5" stroke="#d6aa62" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="536.8" y="217.5" fill="#d6aa62" font-size="11.5" text-anchor="middle">0.141 m</text>
</svg>
