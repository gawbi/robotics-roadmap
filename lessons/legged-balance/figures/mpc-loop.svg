<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>convex MPC 의 구조. gait scheduler 가 어느 발이 언제 땅에 닿을지와 착지점을 정하고, convex MPC 가 0.026 초 간격 10 step 동안의 바닥 반력을 QP 로 풀어 1초에 30 ~ 40 번 낸다. WBIC 가 1초에 500 번 joint torque 와 목표 각도를 내고, joint PD 는 1초에 40,000 번 계산한다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">Mini Cheetah 의 제어 구조 (Kim 등, 2019). step 간격과 horizon 은 Cheetah-Software 의 Mini Cheetah 설정</text>
  <rect x="20.0" y="52.0" width="150.0" height="96.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="95.0" y="76.0" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="600">명령</text>
  <text x="95.0" y="98.0" fill="#e2e8f0" font-size="12" text-anchor="middle">앞뒤·옆 속도, 회전</text>
  <text x="95.0" y="117.0" fill="#94a3b8" font-size="12" text-anchor="middle">걸음새 (trot 등)</text>
  <rect x="200.0" y="52.0" width="220.0" height="96.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.6"/>
  <text x="310.0" y="76.0" fill="#a99ad6" font-size="14" text-anchor="middle" font-weight="600">gait scheduler</text>
  <text x="310.0" y="98.0" fill="#e2e8f0" font-size="12" text-anchor="middle">어느 발이 언제 디딜지</text>
  <text x="310.0" y="117.0" fill="#94a3b8" font-size="12" text-anchor="middle">착지점: Raibert heuristic</text>
  <rect x="450.0" y="52.0" width="250.0" height="96.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.6"/>
  <text x="575.0" y="76.0" fill="#7cb4d8" font-size="14" text-anchor="middle" font-weight="600">convex MPC</text>
  <text x="575.0" y="98.0" fill="#e2e8f0" font-size="12" text-anchor="middle">single rigid body, QP</text>
  <text x="575.0" y="117.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.026 초 × 10 step = 0.26 초</text>
  <text x="575.0" y="136.0" fill="#94a3b8" font-size="12" text-anchor="middle">1초에 30 ~ 40 번</text>
  <rect x="450.0" y="200.0" width="250.0" height="96.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.6"/>
  <text x="575.0" y="224.0" fill="#7fc4a2" font-size="14" text-anchor="middle" font-weight="600">WBIC</text>
  <text x="575.0" y="246.0" fill="#e2e8f0" font-size="12" text-anchor="middle">다리까지 넣은 전체 dynamics</text>
  <text x="575.0" y="265.0" fill="#94a3b8" font-size="12" text-anchor="middle">MPC 의 힘을 고쳐 τ·목표 각도</text>
  <text x="575.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="middle">1초에 500 번</text>
  <rect x="200.0" y="200.0" width="220.0" height="96.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.6"/>
  <text x="310.0" y="224.0" fill="#d6aa62" font-size="14" text-anchor="middle" font-weight="600">joint PD</text>
  <text x="310.0" y="246.0" fill="#e2e8f0" font-size="12" text-anchor="middle">1초에 40,000 번</text>
  <text x="310.0" y="265.0" fill="#94a3b8" font-size="12" text-anchor="middle">Kp = 3 N·m/rad</text>
  <text x="310.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="middle">Kd = 0.3 N·m·s/rad</text>
  <rect x="20.0" y="200.0" width="150.0" height="96.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <text x="95.0" y="224.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">Mini Cheetah</text>
  <text x="95.0" y="246.0" fill="#e2e8f0" font-size="12" text-anchor="middle">관절 12 개</text>
  <text x="95.0" y="265.0" fill="#94a3b8" font-size="12" text-anchor="middle">motor</text>
  <line x1="172.0" y1="100.0" x2="197.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-muted)"/>
  <line x1="422.0" y1="100.0" x2="447.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-muted)"/>
  <line x1="575.0" y1="150.0" x2="575.0" y2="197.0" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#ar-sky)"/>
  <text x="583.0" y="178.0" fill="#7cb4d8" font-size="12" text-anchor="start">발마다 바닥 반력 f</text>
  <line x1="448.0" y1="248.0" x2="423.0" y2="248.0" stroke="#7fc4a2" stroke-width="1.8" marker-end="url(#ar-green)"/>
  <line x1="198.0" y1="248.0" x2="173.0" y2="248.0" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#ar-amber)"/>
  <rect x="200.0" y="322.0" width="500.0" height="52.0" rx="8" fill="#111a2e" stroke="#cf96b8" stroke-width="1.4"/>
  <text x="450.0" y="344.0" fill="#cf96b8" font-size="13" text-anchor="middle">state estimator (Kalman filter): 몸통 자세·위치·속도</text>
  <text x="450.0" y="363.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">MPC 와 WBIC 가 이 추정을 받아 매번 다시 계산한다</text>
  <path d="M95,298 L95,348 L197,348" fill="none" stroke="#cf96b8" stroke-width="1.6" marker-end="url(#ar-pink)"/>
  <text x="30.0" y="388.0" fill="#94a3b8" font-size="11.5" text-anchor="start">Cheetah-Software 에서 WBIC 를 끄면 MPC 의 힘을 τ = Jᵀ(−f) 로 바로 joint torque 로 바꾼다</text>
</svg>
