<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>발 하나의 바닥 반력과 마찰. 예로 든 trot 에서 수직 힘이 44.1 N 이고 μ = 0.4 면 수평 힘은 17.7 N 까지 낼 수 있어서, 바닥 반력은 수직선에서 21.8° 안쪽을 향해야 한다. 이 범위가 friction cone 이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="698" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한 발의 바닥 반력 (Mini Cheetah 9 kg 가 trot 로 두 발을 디딜 때, μ = 0.4)</text>
  <rect x="20.0" y="44.0" width="330.0" height="266.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="40.0" y1="262.0" x2="330.0" y2="262.0" stroke="#475569" stroke-width="2"/>
  <line x1="48.0" y1="262.0" x2="38.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="77.0" y1="262.0" x2="67.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="106.0" y1="262.0" x2="96.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="135.0" y1="262.0" x2="125.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="164.0" y1="262.0" x2="154.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="193.0" y1="262.0" x2="183.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="222.0" y1="262.0" x2="212.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="251.0" y1="262.0" x2="241.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="280.0" y1="262.0" x2="270.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="309.0" y1="262.0" x2="299.0" y2="272.0" stroke="#475569" stroke-width="1"/>
  <line x1="185.0" y1="262.0" x2="110.7" y2="76.3" stroke="#7fc4a2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="185.0" y1="262.0" x2="259.3" y2="76.3" stroke="#7fc4a2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="185.0,262.0 110.7,76.3 259.3,76.3" fill="#7fc4a2" fill-opacity="0.1" stroke="none" stroke-width="0"/>
  <circle cx="185.0" cy="255.0" r="7" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="185.0" y1="248.0" x2="151.0" y2="202.0" stroke="#94a3b8" stroke-width="4"/>
  <line x1="185.0" y1="248.0" x2="185.0" y2="88.0" stroke="#7fc4a2" stroke-width="2.4" marker-end="url(#ar-green)"/>
  <line x1="185.0" y1="88.0" x2="249.0" y2="88.0" stroke="#d6aa62" stroke-width="2.2" marker-end="url(#ar-amber)"/>
  <line x1="185.0" y1="248.0" x2="249.0" y2="88.0" stroke="#7cb4d8" stroke-width="2.4" marker-end="url(#ar-sky)"/>
  <text x="113.0" y="112.0" fill="#7fc4a2" font-size="12.5" text-anchor="end">수직 44.1 N</text>
  <text x="257.0" y="80.0" fill="#d6aa62" font-size="12.5" text-anchor="start">수평 최대 17.7 N</text>
  <text x="249.0" y="198.0" fill="#7cb4d8" font-size="12.5" text-anchor="start">바닥 반력</text>
  <path d="M185,188 A60,60 0 0 1 207.3,192.3" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="197.0" y="182.0" fill="#e2e8f0" font-size="12" text-anchor="start">21.8°</text>
  <text x="185.0" y="292.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">화살표는 초록 원뿔(friction cone) 안에 있어야 한다</text>
  <rect x="370.0" y="44.0" width="310.0" height="266.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="386.0" y="72.0" fill="#e2e8f0" font-size="13.5" text-anchor="start" font-weight="600">한 발</text>
  <text x="386.0" y="96.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">수직 힘: 88.3 N ÷ 2 = 44.1 N</text>
  <text x="386.0" y="118.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">수평 힘 ≤ μ × 수직 = 0.4 × 44.1 = 17.7 N</text>
  <text x="386.0" y="140.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">수평 ÷ 수직 = 0.4 가 되는 각도 = 21.8°</text>
  <text x="386.0" y="176.0" fill="#e2e8f0" font-size="13.5" text-anchor="start" font-weight="600">몸 전체 (높이 유지)</text>
  <text x="386.0" y="200.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">수평 힘의 합 ≤ 0.4 × 88.3 = 35.3 N</text>
  <text x="386.0" y="222.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">앞쪽 가속도 ≤ 35.3 ÷ 9 = 3.92 m/s²</text>
  <text x="386.0" y="244.0" fill="#94a3b8" font-size="12" text-anchor="start">= μ × g = 0.4 × 9.81, 무게와 상관없다</text>
  <text x="386.0" y="276.0" fill="#d88b8b" font-size="12.5" text-anchor="start">예로 μ = 0.1 인 젖은 바닥: 0.98 m/s²</text>
  <text x="386.0" y="298.0" fill="#94a3b8" font-size="12" text-anchor="start">바닥은 당기지 못한다: 수직 힘 ≥ 0</text>
</svg>
