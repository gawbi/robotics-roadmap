  <circle cx="340.0" cy="222.3" r="4" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <text x="348.0" y="242.3" fill="#e2e8f0" font-size="12" text-anchor="start">5.0 cm, 0</text>
  <circle cx="450.0" cy="211.7" r="4" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <text x="442.0" y="199.7" fill="#e2e8f0" font-size="12" text-anchor="end">6.3 cm, 0.13 m/s</text>
  <circle cx="560.0" cy="174.3" r="4" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <text x="552.0" y="162.3" fill="#e2e8f0" font-size="12" text-anchor="end">10.8 cm, 0.33 m/s</text>
  <circle cx="670.0" cy="91.1" r="4" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <text x="662.0" y="95.1" fill="#e2e8f0" font-size="12" text-anchor="end">20.7 cm, 0.70 m/s</text>
  <text x="340.0" y="320.0" fill="#94a3b8" font-size="12" text-anchor="start">시간이 갈수록 0.2 초마다 두 배에 가깝게 늘어난다</text>
</svg>
