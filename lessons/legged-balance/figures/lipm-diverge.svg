  <text x="333.0" y="268.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <line x1="340.0" y1="222.3" x2="670.0" y2="222.3" stroke="#1e293b" stroke-width="1"/>
  <text x="333.0" y="226.3" fill="#64748b" font-size="12" text-anchor="end">5</text>
  <line x1="340.0" y1="180.7" x2="670.0" y2="180.7" stroke="#1e293b" stroke-width="1"/>
  <text x="333.0" y="184.7" fill="#64748b" font-size="12" text-anchor="end">10</text>
  <line x1="340.0" y1="139.0" x2="670.0" y2="139.0" stroke="#1e293b" stroke-width="1"/>
  <text x="333.0" y="143.0" fill="#64748b" font-size="12" text-anchor="end">15</text>
  <line x1="340.0" y1="97.3" x2="670.0" y2="97.3" stroke="#1e293b" stroke-width="1"/>
  <text x="333.0" y="101.3" fill="#64748b" font-size="12" text-anchor="end">20</text>
  <text x="340.0" y="281.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="450.0" y="281.0" fill="#64748b" font-size="12" text-anchor="middle">0.2</text>
  <text x="560.0" y="281.0" fill="#64748b" font-size="12" text-anchor="middle">0.4</text>
  <text x="670.0" y="281.0" fill="#64748b" font-size="12" text-anchor="middle">0.6</text>
  <text x="670.0" y="298.0" fill="#94a3b8" font-size="13" text-anchor="end">t (초)</text>
  <text x="340.0" y="52.0" fill="#94a3b8" font-size="13" text-anchor="start">발끝에서 무게중심까지 (cm)</text>
