  <text x="146.0" y="280.0" fill="#7fc4a2" font-size="12" text-anchor="middle">ZMP = 발끝</text>
  <line x1="150.0" y1="68.0" x2="195.0" y2="68.0" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar-muted)" marker-start="url(#ar-muted)"/>
  <line x1="150.0" y1="62.0" x2="150.0" y2="248.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="144.0" y="72.0" fill="#94a3b8" font-size="12" text-anchor="end">5 cm</text>
  <line x1="48.0" y1="262.0" x2="48.0" y2="94.0" stroke="#94a3b8" stroke-width="1" marker-end="url(#ar-muted)" marker-start="url(#ar-muted)"/>
  <text x="54.0" y="178.0" fill="#94a3b8" font-size="12" text-anchor="start">0.8 m</text>
