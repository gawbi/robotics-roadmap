  <rect x="480.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="498.0" y="270.0" fill="#e2e8f0" font-size="11" text-anchor="middle">5</text>
  <rect x="520.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="538.0" y="270.0" fill="#e2e8f0" font-size="11" text-anchor="middle">6</text>
  <rect x="560.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="578.0" y="270.0" fill="#e2e8f0" font-size="11" text-anchor="middle">집게</text>
  <text x="178.0" y="240.0" fill="#94a3b8" font-size="13" text-anchor="middle">왼팔 7 개</text>
  <text x="458.0" y="240.0" fill="#94a3b8" font-size="13" text-anchor="middle">오른팔 7 개</text>
  <text x="318.0" y="308.0" fill="#e2e8f0" font-size="13" text-anchor="middle">7 + 7 = 14 칸짜리 vector</text>
