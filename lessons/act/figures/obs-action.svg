<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ALOHA 의 관측과 action. 관측은 480×640 카메라 사진과 양팔의 지금 관절 각도 14 개, action 은 다음 step 의 목표 관절 각도 14 개다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="34.0" fill="#7cb4d8" font-size="15" text-anchor="start">관측 o_t</text>
  <rect x="30.0" y="50.0" width="170.0" height="70.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="115.0" y="81.0" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 사진</text>
  <text x="115.0" y="99.0" fill="#94a3b8" font-size="13" text-anchor="middle">480 × 640 pixel</text>
  <rect x="30.0" y="136.0" width="170.0" height="70.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="115.0" y="167.0" fill="#e2e8f0" font-size="13" text-anchor="middle">지금 관절 각도</text>
  <text x="115.0" y="185.0" fill="#94a3b8" font-size="13" text-anchor="middle">follower 양팔 14 개</text>
  <rect x="250.0" y="92.0" width="120.0" height="70.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="310.0" y="123.0" fill="#e2e8f0" font-size="13" text-anchor="middle">policy</text>
  <text x="310.0" y="141.0" fill="#94a3b8" font-size="13" text-anchor="middle">π_θ</text>
  <line x1="202.0" y1="85.0" x2="246.0" y2="115.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="202.0" y1="171.0" x2="246.0" y2="141.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="372.0" y1="127.0" x2="410.0" y2="127.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420.0" y="34.0" fill="#d6aa62" font-size="15" text-anchor="start">action a_t</text>
  <rect x="414.0" y="92.0" width="200.0" height="70.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="514.0" y="123.0" fill="#e2e8f0" font-size="13" text-anchor="middle">다음 step 목표 각도</text>
  <text x="514.0" y="141.0" fill="#94a3b8" font-size="13" text-anchor="middle">14 개 (leader 의 각도)</text>
