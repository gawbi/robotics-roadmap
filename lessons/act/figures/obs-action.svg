  <rect x="240.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="258.0" y="270.0" fill="#e2e8f0" font-size="11" text-anchor="middle">6</text>
  <rect x="280.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="298.0" y="270.0" fill="#e2e8f0" font-size="11" text-anchor="middle">집게</text>
  <rect x="320.0" y="250.0" width="36.0" height="30.0" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="1.2"/>
