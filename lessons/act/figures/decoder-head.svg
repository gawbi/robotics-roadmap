<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>고정 query 100 개가 cross-attention 으로 encoder 출력 302 개를 읽고, 같은 linear layer(512 → 14)가 (100, 14) chunk 를 만든다. 아래는 1 번째 query 의 계산이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="418" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="50.0" width="130.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="85.0" y="74.0" fill="#e2e8f0" font-size="13" text-anchor="middle">encoder 출력</text>
  <text x="85.0" y="92.0" fill="#94a3b8" font-size="13" text-anchor="middle">302 × 512</text>
  <rect x="20.0" y="120.0" width="130.0" height="56.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="85.0" y="144.0" fill="#e2e8f0" font-size="13" text-anchor="middle">고정 query</text>
  <text x="85.0" y="162.0" fill="#94a3b8" font-size="13" text-anchor="middle">100 × 512</text>
  <line x1="152.0" y1="78.0" x2="190.0" y2="100.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="152.0" y1="148.0" x2="190.0" y2="126.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="194.0" y="84.0" width="170.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="279.0" y="108.0" fill="#e2e8f0" font-size="13" text-anchor="middle">Transformer decoder</text>
  <text x="279.0" y="126.0" fill="#94a3b8" font-size="13" text-anchor="middle">cross-attention</text>
  <line x1="366.0" y1="112.0" x2="392.0" y2="112.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396.0" y="84.0" width="110.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="451.0" y="117.0" fill="#e2e8f0" font-size="13" text-anchor="middle">100 × 512</text>
  <line x1="508.0" y1="112.0" x2="534.0" y2="112.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="538.0" y="84.0" width="122.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="599.0" y="108.0" fill="#e2e8f0" font-size="13" text-anchor="middle">linear 512 → 14</text>
  <text x="599.0" y="126.0" fill="#94a3b8" font-size="13" text-anchor="middle">(100, 14) chunk</text>
  <rect x="194.0" y="40.0" width="466.0" height="112.0" rx="10" fill="none" stroke="#d6aa62" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="427.0" y="32.0" fill="#d6aa62" font-size="13" text-anchor="middle">action head</text>
  <text x="24.0" y="214.0" fill="#e2e8f0" font-size="14" text-anchor="start">1 번째 query 의 계산</text>
  <text x="24.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="start">token</text>
  <text x="200.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="start">점수</text>
  <text x="290.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="start">weight</text>
  <text x="400.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="start">value</text>
  <text x="24.0" y="266.0" fill="#e2e8f0" font-size="13" text-anchor="start">큐브가 찍힌 칸</text>
  <text x="200.0" y="266.0" fill="#e2e8f0" font-size="13" text-anchor="start">2</text>
  <text x="290.0" y="266.0" fill="#7fc4a2" font-size="13" text-anchor="start">0.665</text>
  <text x="400.0" y="266.0" fill="#7cb4d8" font-size="13" text-anchor="start">(4, 2)</text>
  <text x="24.0" y="292.0" fill="#e2e8f0" font-size="13" text-anchor="start">빈 테이블 칸</text>
  <text x="200.0" y="292.0" fill="#e2e8f0" font-size="13" text-anchor="start">0</text>
  <text x="290.0" y="292.0" fill="#7fc4a2" font-size="13" text-anchor="start">0.090</text>
  <text x="400.0" y="292.0" fill="#7cb4d8" font-size="13" text-anchor="start">(0, 0)</text>
  <text x="24.0" y="318.0" fill="#e2e8f0" font-size="13" text-anchor="start">관절 token</text>
  <text x="200.0" y="318.0" fill="#e2e8f0" font-size="13" text-anchor="start">1</text>
  <text x="290.0" y="318.0" fill="#7fc4a2" font-size="13" text-anchor="start">0.245</text>
  <text x="400.0" y="318.0" fill="#7cb4d8" font-size="13" text-anchor="start">(2, 6)</text>
  <rect x="470.0" y="222.0" width="190.0" height="120.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="565.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="middle">가중 평균</text>
  <text x="565.0" y="272.0" fill="#7fc4a2" font-size="14" text-anchor="middle">(3.15, 2.80)</text>
  <text x="565.0" y="300.0" fill="#e2e8f0" font-size="12" text-anchor="middle">linear: 2 × 3.15 − 2.80 + 0.5</text>
  <text x="565.0" y="326.0" fill="#d6aa62" font-size="14" text-anchor="middle">= 4.0 (관절 목표값)</text>
  <text x="24.0" y="376.0" fill="#94a3b8" font-size="12" text-anchor="start">실제로는 query 100 개가 동시에 계산되고, 각 출력에 같은 linear layer 를 써서 한 번에 100 step 을 낸다</text>
</svg>
