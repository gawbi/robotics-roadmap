<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>k = 3 일 때 시각 t − 2, t − 1, t 에 낸 chunk 가 모두 시각 t 를 덮는다. 세 예측 30°, 32°, 35° 에 weight 1, 0.5, 0.25 를 곱해 가중 평균하면 31.29° 다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="188.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">t − 2</text>
  <text x="244.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">t − 1</text>
  <text x="300.0" y="40.0" fill="#f59e0b" font-size="13" text-anchor="middle">t</text>
  <text x="356.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">t + 1</text>
  <text x="412.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">t + 2</text>
  <text x="24.0" y="84.0" fill="#e2e8f0" font-size="13" text-anchor="start">t − 2 에 낸 chunk</text>
  <rect x="163.0" y="58.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="219.0" y="58.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="275.0" y="58.0" width="50.0" height="36.0" rx="4" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="300.0" y="81.0" fill="#e2e8f0" font-size="14" text-anchor="middle">30°</text>
  <text x="470.0" y="81.0" fill="#f59e0b" font-size="13" text-anchor="start">i = 0,  w = 1</text>
  <text x="24.0" y="134.0" fill="#e2e8f0" font-size="13" text-anchor="start">t − 1 에 낸 chunk</text>
  <rect x="219.0" y="108.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="275.0" y="108.0" width="50.0" height="36.0" rx="4" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="300.0" y="131.0" fill="#e2e8f0" font-size="14" text-anchor="middle">32°</text>
  <rect x="331.0" y="108.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="470.0" y="131.0" fill="#f59e0b" font-size="13" text-anchor="start">i = 1,  w = 0.5</text>
  <text x="24.0" y="184.0" fill="#e2e8f0" font-size="13" text-anchor="start">t 에 낸 chunk</text>
  <rect x="275.0" y="158.0" width="50.0" height="36.0" rx="4" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="300.0" y="181.0" fill="#e2e8f0" font-size="14" text-anchor="middle">35°</text>
  <rect x="331.0" y="158.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="387.0" y="158.0" width="50.0" height="36.0" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="470.0" y="181.0" fill="#f59e0b" font-size="13" text-anchor="start">i = 2,  w = 0.25</text>
  <text x="470.0" y="46.0" fill="#94a3b8" font-size="12" text-anchor="start">weight (m = 0.69)</text>
  <rect x="40.0" y="222.0" width="560.0" height="78.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="320.0" y="250.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a_t = (1 × 30 + 0.5 × 32 + 0.25 × 35) ÷ (1 + 0.5 + 0.25)</text>
  <text x="320.0" y="280.0" fill="#34d399" font-size="15" text-anchor="middle">= 54.75 ÷ 1.75 ≈ 31.29°</text>
</svg>
