<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>큐브가 step 30 에 10 cm 에서 14 cm 로 밀려난다. k = 20 은 step 40 에 방향을 바꿔 step 70 에, k = 100 은 step 100 에 방향을 바꿔 step 120 에 닿는다</title>
