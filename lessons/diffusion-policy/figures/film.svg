<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>FiLM 계산. channel 1 의 값 1, 2, 0, −1 에 γ = 2 를 곱하고 β = 1 을 더해 3, 5, 1, −1 이 되고, channel 2 의 3, 0, 1, 2 에 γ = 0.5 를 곱하고 β = 0 을 더해 1.5, 0, 0.5, 1 이 된다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="110.0" y="50.0" fill="#38bdf8" font-size="13" text-anchor="middle">중간 feature h</text>
  <text x="110.0" y="68.0" fill="#94a3b8" font-size="11" text-anchor="middle">(channel 2 개 × 시간 4 칸)</text>
  <rect x="30.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="50.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text>
  <rect x="70.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="90.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <rect x="110.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="130.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="150.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="170.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="30.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="50.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="middle">3</text>
  <rect x="70.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="90.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="110.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="130.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text>
  <rect x="150.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="170.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <text x="22.0" y="102.0" fill="#94a3b8" font-size="11" text-anchor="end">ch1</text>
  <text x="22.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="end">ch2</text>
  <line x1="200.0" y1="113.0" x2="240.0" y2="113.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="244.0" y="72.0" width="120.0" height="84.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="304.0" y="96.0" fill="#f59e0b" font-size="14" text-anchor="middle">γ ⊙ h + β</text>
  <text x="304.0" y="118.0" fill="#e2e8f0" font-size="11" text-anchor="middle">ch1: γ = 2, β = 1</text>
  <text x="304.0" y="138.0" fill="#e2e8f0" font-size="11" text-anchor="middle">ch2: γ = 0.5, β = 0</text>
  <line x1="364.0" y1="113.0" x2="404.0" y2="113.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490.0" y="50.0" fill="#34d399" font-size="13" text-anchor="middle">바뀐 feature</text>
  <text x="490.0" y="68.0" fill="#94a3b8" font-size="11" text-anchor="middle">(모양 그대로)</text>
  <rect x="410.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="430.0" y="102.0" fill="#34d399" font-size="13" text-anchor="middle">3</text>
  <rect x="450.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="470.0" y="102.0" fill="#34d399" font-size="13" text-anchor="middle">5</text>
  <rect x="490.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="510.0" y="102.0" fill="#34d399" font-size="13" text-anchor="middle">1</text>
  <rect x="530.0" y="80.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="550.0" y="102.0" fill="#34d399" font-size="13" text-anchor="middle">−1</text>
  <rect x="410.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="430.0" y="136.0" fill="#34d399" font-size="13" text-anchor="middle">1.5</text>
  <rect x="450.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="470.0" y="136.0" fill="#34d399" font-size="13" text-anchor="middle">0</text>
  <rect x="490.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="510.0" y="136.0" fill="#34d399" font-size="13" text-anchor="middle">0.5</text>
  <rect x="530.0" y="114.0" width="40.0" height="34.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="550.0" y="136.0" fill="#34d399" font-size="13" text-anchor="middle">1</text>
  <rect x="244.0" y="186.0" width="120.0" height="40.0" rx="8" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
  <text x="304.0" y="211.0" fill="#e2e8f0" font-size="12" text-anchor="middle">조건 cond</text>
  <line x1="304.0" y1="186.0" x2="304.0" y2="160.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="316.0" y="178.0" fill="#94a3b8" font-size="11" text-anchor="start">linear</text>
  <text x="30.0" y="214.0" fill="#94a3b8" font-size="11" text-anchor="start">γ 와 β 는 관측과 k 를 담은</text>
  <text x="30.0" y="232.0" fill="#94a3b8" font-size="11" text-anchor="start">cond 에서 linear 하나로 만든다</text>
  <text x="400.0" y="214.0" fill="#94a3b8" font-size="11" text-anchor="start">같은 channel 의 시간 4 칸에</text>
  <text x="400.0" y="232.0" fill="#94a3b8" font-size="11" text-anchor="start">같은 γ, β 가 쓰인다</text>
</svg>
