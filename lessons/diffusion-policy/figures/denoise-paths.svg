  <title>K = 5 sampling 세 번. 상자 장면에서 0.60 에서 출발하면 +1(+20°), −0.40 에서 출발하면 −1(−20°)에 닿고, 곧은 길 장면에서는 같은 0.60 에서 출발해도 0(0°)에 닿는다</title>
