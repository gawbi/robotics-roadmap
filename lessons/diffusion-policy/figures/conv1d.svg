  <rect x="210.0" y="170.0" width="60.0" height="36.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="240.0" y="194.0" fill="#34d399" font-size="14" text-anchor="middle">1</text>
  <rect x="270.0" y="170.0" width="60.0" height="36.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="300.0" y="194.0" fill="#34d399" font-size="14" text-anchor="middle">2</text>
