  <text x="480.0" y="194.0" fill="#34d399" font-size="14" text-anchor="middle">0</text>
  <text x="180.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t0</text>
  <text x="240.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t1</text>
  <text x="300.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t2</text>
  <text x="360.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t3</text>
  <text x="420.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t4</text>
  <text x="480.0" y="42.0" fill="#94a3b8" font-size="10" text-anchor="middle">t5</text>
  <rect x="150.0" y="46.0" width="180.0" height="44.0" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="240.0" y="118.0" fill="#f59e0b" font-size="13" text-anchor="middle">× 0.25   × 0.5   × 0.25</text>
  <line x1="240.0" y1="124.0" x2="240.0" y2="166.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-a)"/>
  <text x="470.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">t1 = 0.25×0 + 0.5×0 + 0.25×4 = 1</text>
  <text x="470.0" y="150.0" fill="#e2e8f0" font-size="12" text-anchor="middle">t2 = 0.25×0 + 0.5×4 + 0.25×0 = 2</text>
  <text x="300.0" y="236.0" fill="#94a3b8" font-size="11" text-anchor="middle">양 끝 칸은 바깥을 0 으로 채워 계산한다</text>
