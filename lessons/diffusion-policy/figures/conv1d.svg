  <text x="300.0" y="74.0" fill="#38bdf8" font-size="14" text-anchor="middle">4</text>
  <rect x="330.0" y="50.0" width="60.0" height="36.0" rx="0" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="360.0" y="74.0" fill="#38bdf8" font-size="14" text-anchor="middle">0</text>
