<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>몸통이 관측을 요약 숫자로 바꾸고, 세 종류의 action head 가 그 숫자를 받아 행동을 낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75.0" y="68.0" fill="#e2e8f0" font-size="13" text-anchor="middle">관측</text>
  <text x="75.0" y="88.0" fill="#94a3b8" font-size="12" text-anchor="middle">사진 + 핸들 각도</text>
  <line x1="130.0" y1="75.0" x2="158.0" y2="75.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="162.0" y="40.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="217.0" y="68.0" fill="#e2e8f0" font-size="13" text-anchor="middle">몸통</text>
  <text x="217.0" y="88.0" fill="#94a3b8" font-size="12" text-anchor="middle">encoder</text>
  <line x1="272.0" y1="75.0" x2="300.0" y2="75.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="304.0" y="40.0" width="110.0" height="70.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="359.0" y="68.0" fill="#e2e8f0" font-size="13" text-anchor="middle">요약 숫자</text>
  <text x="359.0" y="88.0" fill="#94a3b8" font-size="12" text-anchor="middle">feature</text>
  <text x="510.0" y="28.0" fill="#94a3b8" font-size="12" text-anchor="middle">action head 세 종류</text>
  <polyline points="359.0,110.0 359.0,130.0 392.0,130.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="396.0" y="102.0" width="186.0" height="56.0" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="489.0" y="122.0" fill="#f87171" font-size="14" text-anchor="middle">MSE head</text>
  <text x="489.0" y="142.0" fill="#94a3b8" font-size="12" text-anchor="middle">숫자 1 개를 바로 낸다</text>
  <polyline points="359.0,110.0 359.0,205.0 392.0,205.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="396.0" y="177.0" width="186.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="489.0" y="197.0" fill="#f59e0b" font-size="14" text-anchor="middle">RT-1 head</text>
  <text x="489.0" y="217.0" fill="#94a3b8" font-size="12" text-anchor="middle">256 칸마다 확률을 낸다</text>
  <polyline points="359.0,110.0 359.0,280.0 392.0,280.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="396.0" y="252.0" width="186.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="489.0" y="272.0" fill="#34d399" font-size="14" text-anchor="middle">diffusion head</text>
  <text x="489.0" y="292.0" fill="#94a3b8" font-size="12" text-anchor="middle">noise 를 K 번 걷어 낸다</text>
  <text x="160.0" y="170.0" fill="#94a3b8" font-size="12" text-anchor="middle">몸통과 head 를 이어 붙여</text>
  <text x="160.0" y="190.0" fill="#94a3b8" font-size="12" text-anchor="middle">한 policy 로 함께 학습한다</text>
  <text x="160.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="middle">head 마다 같은 요약 숫자를 받지만</text>
  <text x="160.0" y="260.0" fill="#94a3b8" font-size="12" text-anchor="middle">행동을 내는 방식이 다르다</text>
  <path d="M 582 268 C 596 268 596 292 582 292" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-g)"/>
</svg>
