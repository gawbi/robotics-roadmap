<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Diffusion Policy 의 데이터 흐름: 이미지와 agent_pos 로 만든 관측 조건과 diffusion step embedding 을 이어 붙인 cond 가 FiLM 으로 1D U-Net 의 모든 block 에 들어가고, U-Net 은 noisy action sequence 에서 noise 를 예측한다</title>
