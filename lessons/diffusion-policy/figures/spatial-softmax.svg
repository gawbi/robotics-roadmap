  <text x="30.0" y="228.0" fill="#94a3b8" font-size="13" text-anchor="start">칸의 x, y 좌표를 왼쪽 위 (−1, −1) 부터 오른쪽 아래 (1, 1) 까지 두면</text>
  <text x="30.0" y="248.0" fill="#94a3b8" font-size="13" text-anchor="start">x = Σ 확률 × 칸의 x,  y = Σ 확률 × 칸의 y. 빈 원은 값이 가장 큰 칸 (1, −1) 이다</text>
