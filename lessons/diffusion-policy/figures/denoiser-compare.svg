<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 denoiser 의 비교. 1D convolution U-Net 은 시간 16 칸을 8 칸, 4 칸으로 줄였다 키우며 이웃한 시간을 섞어 부드러운 action 에 유리하지만 급하게 바뀌는 속도 명령에는 약하고, 조건은 FiLM 으로 모든 block 에 넣는다. transformer denoiser 는 단계 번호 token 하나와 action token 16 개를 causal attention 으로 처리하고 관측은 cross-attention 으로 받아 급하게 바뀌는 action 에 유리하지만 설정값에 민감하다</title>
