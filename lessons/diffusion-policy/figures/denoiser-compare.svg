  <text x="476" y="44" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">transformer denoiser</text>
  <text x="476" y="64" fill="#94a3b8" font-size="12" text-anchor="middle">time-series diffusion transformer</text>
