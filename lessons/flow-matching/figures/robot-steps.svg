<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>action chunk 하나를 만들 때 network 를 쓰는 횟수. Diffusion Policy 는 학습한 100 단계를 다 밟으면 100 번이지만 DDIM 으로 10 번으로 줄여 RTX 3080 에서 0.1 초가 걸린다. flow matching 을 쓰는 π0 는 10 번(action 50 개, RTX 4090 에서 전체 73 ms), GR00T N1 은 4 번(action 16 개, L40 에서 63.9 ms)이다</title>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#e2e8f0" font-size="15" text-anchor="start">action chunk 하나에 network 를 쓰는 횟수</text>
  <text x="490.0" y="34.0" fill="#94a3b8" font-size="13" text-anchor="start">action 수 · 걸린 시간</text>
  <rect x="230" y="56" width="240" height="212" fill="#0e1628" stroke="#1e293b"/>
  <line x1="230.0" y1="56" x2="230.0" y2="268" stroke="#1e293b" stroke-width="1"/>
  <text x="230.0" y="290.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <line x1="290.0" y1="56" x2="290.0" y2="268" stroke="#1e293b" stroke-width="1"/>
  <text x="290.0" y="290.0" fill="#64748b" font-size="12" text-anchor="middle">25</text>
  <line x1="350.0" y1="56" x2="350.0" y2="268" stroke="#1e293b" stroke-width="1"/>
  <text x="350.0" y="290.0" fill="#64748b" font-size="12" text-anchor="middle">50</text>
  <line x1="410.0" y1="56" x2="410.0" y2="268" stroke="#1e293b" stroke-width="1"/>
  <text x="410.0" y="290.0" fill="#64748b" font-size="12" text-anchor="middle">75</text>
  <line x1="470.0" y1="56" x2="470.0" y2="268" stroke="#1e293b" stroke-width="1"/>
  <text x="470.0" y="290.0" fill="#64748b" font-size="12" text-anchor="middle">100</text>
  <text x="24.0" y="76.0" fill="#e2e8f0" font-size="14" text-anchor="start">Diffusion Policy</text>
  <text x="24.0" y="94.0" fill="#94a3b8" font-size="12" text-anchor="start">DDPM 100 단계 그대로</text>
  <rect x="230" y="64" width="240.0" height="24" rx="3" fill="#d6aa62" fill-opacity="0.35"/>
  <text x="462.0" y="81.0" fill="#e2e8f0" font-size="13" text-anchor="end">100 번</text>
  <text x="490.0" y="76.0" fill="#d6aa62" font-size="14" text-anchor="start">—</text>
  <text x="490.0" y="94.0" fill="#64748b" font-size="12" text-anchor="start">학습한 단계 수</text>
  <text x="24.0" y="128.0" fill="#e2e8f0" font-size="14" text-anchor="start">Diffusion Policy</text>
  <text x="24.0" y="146.0" fill="#94a3b8" font-size="12" text-anchor="start">DDIM 으로 건너뜀</text>
  <rect x="230" y="116" width="24.0" height="24" rx="3" fill="#d6aa62"/>
  <text x="262.0" y="133.0" fill="#e2e8f0" font-size="13" text-anchor="start">10 번</text>
  <text x="490.0" y="128.0" fill="#d6aa62" font-size="14" text-anchor="start">0.1 초</text>
  <text x="490.0" y="146.0" fill="#64748b" font-size="12" text-anchor="start">RTX 3080</text>
  <text x="24.0" y="180.0" fill="#e2e8f0" font-size="14" text-anchor="start">π0</text>
  <text x="24.0" y="198.0" fill="#94a3b8" font-size="12" text-anchor="start">flow matching, Euler</text>
  <rect x="230" y="168" width="24.0" height="24" rx="3" fill="#7cb4d8"/>
  <text x="262.0" y="185.0" fill="#e2e8f0" font-size="13" text-anchor="start">10 번</text>
  <text x="490.0" y="180.0" fill="#7cb4d8" font-size="14" text-anchor="start">50 개 · 73 ms</text>
  <text x="490.0" y="198.0" fill="#64748b" font-size="12" text-anchor="start">RTX 4090, 그중 10 번에 27 ms</text>
  <text x="24.0" y="232.0" fill="#e2e8f0" font-size="14" text-anchor="start">GR00T N1</text>
  <text x="24.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="start">flow matching, Euler</text>
  <rect x="230" y="220" width="9.6" height="24" rx="3" fill="#7fc4a2"/>
  <text x="247.6" y="237.0" fill="#e2e8f0" font-size="13" text-anchor="start">4 번</text>
  <text x="490.0" y="232.0" fill="#7fc4a2" font-size="14" text-anchor="start">16 개 · 63.9 ms</text>
  <text x="490.0" y="250.0" fill="#64748b" font-size="12" text-anchor="start">L40</text>
  <text x="470.0" y="310.0" fill="#94a3b8" font-size="12" text-anchor="end">network 를 쓰는 횟수</text>
  <text x="24.0" y="342.0" fill="#94a3b8" font-size="12" text-anchor="start">시간은 각 논문이 잰 값이라 GPU 와 입력이 서로 다르다. 횟수가 적을수록 같은 GPU 에서 덜 걸린다</text>
</svg>
