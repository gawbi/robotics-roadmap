<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>경로가 엇갈리는 자리. 왼쪽은 데이터 +2, −2 와 무작위로 뽑은 noise 를 짝지어 그은 직선 18 개로, 서로 여러 번 엇갈린다. 오른쪽은 그중 ε = −2 에서 +2 로 가는 직선(속도 +4)과 ε = 2 에서 −2 로 가는 직선(속도 −4)으로, 두 직선이 t = 0.5, x = 0 에서 만난다. 이 자리에서 MSE 를 가장 작게 하는 출력은 두 정답의 평균 0 이다</title>
