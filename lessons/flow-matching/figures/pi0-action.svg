<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>π0 가 action 을 만드는 과정. 카메라 이미지, 지시문, 로봇 상태를 VLM 이 읽고, action expert 가 그 결과와 noise 가 섞인 action chunk, 시각 τ 를 받아 속도를 낸다. 속도에 0.1 을 곱해 chunk 에 더하고 τ 를 0.1 늘리는 일을 10 번 되풀이하면 앞으로 50 step 동안의 action 이 나온다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="30.0" width="150.0" height="46.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95.0" y="58.0" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 이미지</text>
  <rect x="20.0" y="86.0" width="150.0" height="46.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95.0" y="114.0" fill="#e2e8f0" font-size="13" text-anchor="middle">지시문 (글)</text>
  <rect x="20.0" y="142.0" width="150.0" height="46.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95.0" y="170.0" fill="#e2e8f0" font-size="13" text-anchor="middle">로봇 상태</text>
  <rect x="220.0" y="50.0" width="150.0" height="70.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="295.0" y="72.0" fill="#a99ad6" font-size="14" text-anchor="middle">VLM</text>
  <text x="295.0" y="90.0" fill="#94a3b8" font-size="11" text-anchor="middle">이미지·글을 읽는</text>
  <text x="295.0" y="108.0" fill="#94a3b8" font-size="11" text-anchor="middle">network (3B)</text>
  <line x1="170.0" y1="53.0" x2="218.0" y2="75.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170.0" y1="109.0" x2="218.0" y2="95.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430.0" y="100.0" width="180.0" height="86.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="520.0" y="130.0" fill="#7fc4a2" font-size="14" text-anchor="middle">action expert</text>
  <text x="520.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">약 300M weight</text>
  <text x="520.0" y="166.0" fill="#e2e8f0" font-size="12" text-anchor="middle">출력: 속도 v (50 개)</text>
  <line x1="370.0" y1="85.0" x2="428.0" y2="125.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170.0" y1="165.0" x2="428.0" y2="150.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220.0" y="230.0" width="170.0" height="66.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="305.0" y="250.0" fill="#d6aa62" font-size="13" text-anchor="middle">noise 가 섞인 chunk</text>
  <text x="305.0" y="268.0" fill="#e2e8f0" font-size="12" text-anchor="middle">A (50 개 action)</text>
  <text x="305.0" y="286.0" fill="#94a3b8" font-size="11" text-anchor="middle">τ = 0 에서 N(0, 1)</text>
  <line x1="390.0" y1="250.0" x2="456.0" y2="188.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="450.0" y="252.0" width="250.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="575.0" y="276.0" fill="#e2e8f0" font-size="13" text-anchor="middle">A ← A + 0.1 × v</text>
  <text x="575.0" y="294.0" fill="#e2e8f0" font-size="13" text-anchor="middle">τ ← τ + 0.1</text>
  <line x1="575.0" y1="186.0" x2="575.0" y2="250.0" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M575,308 L575,326 L305,326 L305,300" fill="none" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="440.0" y="346.0" fill="#7cb4d8" font-size="12" text-anchor="middle">10 번 되풀이 (τ: 0 → 1)</text>
  <text x="440.0" y="372.0" fill="#e2e8f0" font-size="12" text-anchor="middle">끝난 A = 앞으로 50 step 동안의 action</text>
  <text x="110.0" y="360.0" fill="#94a3b8" font-size="12" text-anchor="middle">VLM 은 관측마다 한 번만 계산하고</text>
  <text x="110.0" y="380.0" fill="#94a3b8" font-size="12" text-anchor="middle">10 번의 step 에서 다시 쓴다</text>
</svg>
