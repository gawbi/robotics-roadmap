<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>reflow 전후의 짝. 왼쪽은 noise 와 데이터를 무작위로 짝지은 직선으로 서로 엇갈린다. 오른쪽은 학습한 모델이 noise 에서 실제로 만든 값과 다시 짝지은 직선으로, 양수 noise 는 +2, 음수 noise 는 −2 와 짝이 되어 엇갈리지 않는다. 예를 들어 ε = 0.5 는 +2 와 짝이 되어 속도 1.5 의 직선이 되고 1 step 으로 0.5 + 1 × 1.5 = 2 에 닿는다</title>
