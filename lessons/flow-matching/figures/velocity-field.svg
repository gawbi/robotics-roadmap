  <title>규칙 v(x, t) = (2 − x) ÷ (1 − t) 이 정하는 속도를 화살표로 그린 velocity field. 가로축은 시각 t, 세로축은 위치 x 다. 화살표는 모두 t = 1 에서 x = 2 를 향하고, 그 방향을 따라 움직인 점은 어디서 출발하든 직선을 그리며 t = 1 에 2 에 닿는다</title>
