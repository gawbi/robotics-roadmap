<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>속도가 시각에 따라 v = 2t 로 커질 때의 Euler 법. 실제 위치는 초록 점선 x = t² 를 따라 t = 1 에 1 에 닿는다. Euler 법은 step 시작의 속도로 직진해서 step 1 번이면 0, 2 번이면 0.5, 4 번이면 0.75, 10 번이면 0.9 에 닿고, step 이 많을수록 실제 곡선에 가까워진다</title>
