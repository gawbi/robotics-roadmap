<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>DDPM 의 reverse 경로와 직선 경로. 왼쪽은 DDPM 강의의 T = 5 실행 A 로, network 를 한 번 쓸 때마다 0.60, 0.89, 1.08, 1.65, 1.97, 2.00 으로 움직여 이동량이 0.29, 0.19, 0.57, 0.32, 0.03 으로 들쭉날쭉하다. 오른쪽은 noise −1 과 데이터 2 를 잇는 직선으로, 시각 t 가 0.25 늘 때마다 0.75 씩 일정하게 움직인다</title>
