# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: straight-path
  title: noise 와 데이터를 잇는 직선 경로
  variants:
    - question: |
        flow matching 은 noise $\epsilon$ 과 데이터 $x_1$ 을 $x_t = (1 - t)\,\epsilon + t\,x_1$ 로 섞는다. $t$ 가 0 에서 1 로 갈 때 $x_t$ 에
        대한 설명으로 옳은 것은?
      choices:
        - '$t = 0$ 이면 데이터, $t = 1$ 이면 noise 이고 그 사이에서는 곡선을 그린다'
        - '$t = 0$ 이면 순수한 noise, $t = 1$ 이면 데이터이고, 그 사이의 점들은 둘을 잇는 한 직선 위에 놓인다'
        - '$t$ 와 상관없이 $x_t$ 의 분산이 언제나 1 로 유지된다'
        - '$t$ 가 커질수록 noise 가 더 많이 섞인다'
      answer: 1
      explanation: |
        두 계수 $1 - t$ 와 $t$ 의 합이 늘 1 이라 $x_t$ 는 noise 와 데이터를 $1 - t : t$ 비율로 섞은 점이고, $t$ 를 바꿔 가며 찍으면 두 값을
        잇는 직선 위에 놓인다. $t = 0$ 이 noise, $t = 1$ 이 데이터라서 $t$ 가 커질수록 데이터에 가까워진다. 분산을 1 로 지키는 것은 계수의
        제곱의 합을 1 로 둔 DDPM 의 설계이고, 이 식은 계수의 합을 1 로 둔다.
    - question: |
        DDPM 의 sampling 이 로봇 제어에 쓰기에 느린 이유와, flow matching 이 이 문제를 줄이는 방식으로 옳은 것은?
      choices:
        - 'DDPM 은 network 가 커서 느리고, flow matching 은 network 를 작게 만들어 해결한다'
        - 'DDPM 은 학습이 느리고, flow matching 은 학습 step 을 줄여 해결한다'
        - 'DDPM 은 새 noise 를 더하지 않아 느리고, flow matching 은 step 마다 noise 를 더해 해결한다'
        - 'DDPM 은 작은 step 을 많이 밟아 network 를 수백에서 천 번 쓰고, flow matching 은 곧은 경로를 따라가 적은 step 으로 데이터에 닿는다'
      answer: 3
      explanation: |
        sampling 시간은 network 를 쓰는 횟수에 비례하는데, DDPM 은 한 step 의 변화가 작아야 맞는 계산이라 step 을 많이 밟는다. flow
        matching 은 noise 와 데이터를 직선으로 이어 경로가 곧으므로 크게 건너뛰어도 된다. network 크기나 학습 속도가 핵심이 아니고, 새
        noise 를 더하는 쪽은 DDPM 이며 flow matching 은 sampling 중에 noise 를 더하지 않는다.
    - question: |
        flow matching 의 시각 $t$ 와 DDPM 의 step 번호 $t$ 를 비교한 설명으로 옳은 것은?
      choices:
        - '이 글의 관례에서 flow matching 은 $t = 0$ 이 noise, $t = 1$ 이 데이터이고, DDPM 은 아래첨자가 클수록 noise 가 많아 방향이 반대다'
        - '두 방법 모두 $t$ 가 클수록 noise 가 많다'
        - 'flow matching 의 $t$ 는 정수, DDPM 의 $t$ 는 0 과 1 사이의 실수다'
        - '두 방법의 $t$ 는 같은 값이라 서로 바꿔 넣어도 된다'
      answer: 0
      explanation: |
        DDPM 에서 $x_0$ 는 원래 데이터이고 아래첨자가 클수록 noise 가 많다. 이 글이 따르는 flow matching 관례는 $t = 0$ 이 noise,
        $t = 1$ 이 데이터라서 방향이 반대이므로, 자료를 읽을 때 어느 쪽이 noise 인지부터 확인해야 한다. DDPM 의 $t$ 는 1 부터 $T$ 까지의
        정수이고 flow matching 의 $t$ 는 0 과 1 사이 실수라서 정수·실수를 뒤집은 보기도 틀렸고, 뜻이 다르니 바꿔 넣을 수 없다.

- topic: target-velocity
  title: 직선 위의 속도, target velocity
  variants:
    - question: |
        noise $\epsilon$ 과 데이터 $x_1$ 을 잇는 직선 $x_t = (1 - t)\,\epsilon + t\,x_1$ 위에서 점이 움직이는 속도에 대한 설명으로 옳은
        것은?
      choices:
        - '$t = 0$ 에서 가장 빠르고 데이터에 가까워질수록 느려진다'
        - '$t$ 에 비례해 점점 빨라진다'
        - '직선 위 어디서나 $x_1 - \epsilon$ 으로 같다'
        - '$x_1 + \epsilon$ 으로, 두 값의 합이다'
      answer: 2
      explanation: |
        식을 $x_t = \epsilon + t\,(x_1 - \epsilon)$ 로 고쳐 쓰면 "처음 위치 + 속도 × 시간" 모양이라, 속도는 $t$ 가 들어 있지 않은
        $x_1 - \epsilon$ 이다. 그래서 직선 위에서는 빨라지거나 느려지지 않는다. 속도는 도착점에서 출발점을 뺀 값이므로 두 값의 합이 아니다.
    - question: |
        target velocity $x_1 - \epsilon$ 은 "데이터까지 남은 거리 ÷ 남은 시간" 인 $(x_1 - x_t) / (1 - t)$ 로도 쓸 수 있다. 같은 위치에
        있는 점이라도 시각 $t$ 가 1 에 가까울수록 target velocity 는 어떻게 될까?
      choices:
        - '남은 시간이 짧아져, 같은 거리를 가려면 속도가 더 커야 한다'
        - '남은 시간이 짧아져 속도가 작아진다'
        - '위치가 같으면 시각과 상관없이 속도도 같다'
        - '$t$ 가 1 에 가까우면 속도는 언제나 0 이다'
      answer: 0
      explanation: |
        분자 "남은 거리" 가 같을 때 분모 "남은 시간" 이 줄면 몫이 커진다. 그래서 같은 자리라도 늦은 시각일수록 서둘러야 한다. 이 차이
        때문에 network 에 위치뿐 아니라 시각도 함께 넣는다. 속도가 0 이 되는 것은 이미 데이터 위에 있어 남은 거리가 0 일 때뿐이다.
    - question: |
        생성할 때는 noise $\epsilon$ 만 있고 그 noise 가 어느 데이터와 짝인지 모른다. 그래서 network $v_\theta(x_t, t)$ 를 쓰는데, 이
        network 가 하는 일로 옳은 것은?
      choices:
        - '$\epsilon$ 을 받아 짝이 될 데이터 $x_1$ 을 한 번에 출력한다'
        - '$x_t$ 에 섞인 noise $\epsilon$ 을 맞힌다'
        - '데이터 $x_1$ 을 받아 그에 맞는 noise 를 만들어 낸다'
        - '지금 위치 $x_t$ 와 시각 $t$ 를 받아 그 자리에서 움직일 속도를 낸다'
      answer: 3
      explanation: |
        target velocity $x_1 - \epsilon$ 은 짝을 알아야 계산되므로, 생성할 때는 network 가 그 자리의 속도를 대신 알려 준다. network 의
        출력은 데이터나 noise 가 아니라 속도이고, 섞인 noise 를 맞히는 것은 DDPM 의 network 다. 데이터를 noise 로 바꾸는 방향은 생성에
        필요 없다.

- topic: euler-step
  title: Euler 법과 경로의 곧음
  variants:
    - question: |
        Euler 법은 지금 자리의 속도로 $\Delta t$ 동안 직진하기 $x \leftarrow x + \Delta t \times v(x, t)$ 를 되풀이한다. Euler 법의 오차가
        생기는 원인은?
      choices:
        - '$\Delta t$ 를 곱하는 계산에서 반올림 오차가 쌓이기 때문이다'
        - 'network 를 너무 많이 쓰기 때문이다'
        - '출발점이 무작위로 뽑힌 noise 이기 때문이다'
        - 'step 하나 동안 실제 속도가 바뀌는데, step 시작의 속도로만 직진하기 때문이다'
      answer: 3
      explanation: |
        step 도중에 속도가 바뀌면 시작 속도로 직진한 위치와 실제 위치가 어긋난다. 그래서 step 을 잘게 나누면 한 step 안에서 속도가 덜
        바뀌어 오차가 줄어든다. 반올림이나 network 사용 횟수는 원인이 아니고, 출발점이 무작위인 것은 sample 이 다양한 이유일 뿐 오차와는
        관계가 없다.
    - question: |
        속도가 처음부터 끝까지 바뀌지 않는 직선 경로를 Euler 법으로 따라간다. step 을 1 번 쓸 때와 100 번 쓸 때를 비교하면?
      choices:
        - '100 번이 훨씬 정확하다'
        - '두 결과가 같다. 속도가 바뀌지 않으니 시작 속도로 직진해도 경로를 그대로 따라가고, 나머지 99 번은 시간만 쓴다'
        - '1 번이 더 정확하다. step 이 많으면 오차가 쌓인다'
        - '직선 경로에는 Euler 법을 쓸 수 없다'
      answer: 1
      explanation: |
        Euler 법의 오차는 step 도중의 속도 변화에서 생기므로, 속도가 일정한 직선에서는 step 1 번으로도 정확하다. step 을 늘려도 결과는
        같고 network 를 쓰는 시간만 늘어난다. step 이 많다고 오차가 쌓이는 것도 아니고, 직선이야말로 Euler 법이 가장 잘 맞는 경로다.
    - question: |
        Heun 법은 step 하나에서 출발 자리의 속도와 어림한 도착 자리의 속도를 평균해 직진한다. Euler 법과 비교한 설명으로 옳은 것은?
      choices:
        - 'Heun 법은 step 하나에 network 를 한 번만 쓰므로 언제나 Euler 법보다 빠르다'
        - 'Heun 법은 직선 경로에서 Euler 법보다 정확하다'
        - 'Heun 법은 속도가 바뀌는 경로에서 더 정확하지만 step 하나에 network 를 두 번 써서, 비교할 때는 network 사용 횟수를 맞춰야 한다'
        - 'Heun 법은 새 noise 를 더해 sample 을 다양하게 만든다'
      answer: 2
      explanation: |
        Heun 법은 속도를 두 번 구해 step 도중의 속도 변화를 반영하므로 휜 경로에서 오차가 작다. 대신 network 를 두 번 써서, 같은 시간
        예산이면 Euler 법은 step 을 두 배로 쓸 수 있다. 속도가 바뀌지 않는 직선에서는 두 속도가 같아 얻는 것 없이 계산만 늘고, 두 방법
        모두 noise 를 더하지 않는다.

- topic: cfm-loss
  title: conditional flow matching loss
  variants:
    - question: |
        conditional flow matching 의 학습 한 step 을 바르게 설명한 것은?
      choices:
        - '데이터 $x_1$ 을 꺼내고 noise $\epsilon$ 과 시각 $t$ 를 뽑아 $x_t$ 를 바로 만든 뒤, network 의 속도와 $x_1 - \epsilon$ 의 차이를 제곱해 loss 로 쓴다'
        - 'noise 에서 출발해 Euler 법으로 끝까지 걸어 만든 sample 과 데이터의 차이를 줄인다'
        - '$t = 0$ 부터 차례로 걸으며 매 시각의 속도 오차를 더한다'
        - 'network 가 $x_t$ 에 섞인 noise 를 맞히게 하고 그 차이를 제곱한다'
      answer: 0
      explanation: |
        학습은 섞는 식으로 한 시각의 $x_t$ 를 바로 만들고 그 자리의 정답 속도만 맞힌다. 오래 학습하면 $t$ 가 고르게 뽑혀 모든 시각을
        연습한다. sampling 을 끝까지 돌리거나 시각을 차례로 걸을 필요가 없고, noise 를 맞히는 것은 DDPM 의 loss 다.
    - question: |
        flow matching 학습에서 정답 속도 $x_1 - \epsilon$ 을 얻는 방법으로 옳은 것은?
      choices:
        - '사람이 데이터마다 정답 속도를 달아 준다'
        - '미리 학습한 DDPM 모델이 알려 준다'
        - '꺼낸 데이터와 직접 뽑은 noise 로 바로 계산되므로, 데이터만 있으면 학습 예를 끝없이 만들 수 있다'
        - '학습 초기에 network 가 낸 속도를 정답으로 고정해 쓴다'
      answer: 2
      explanation: |
        학습 예를 만들 때 데이터 $x_1$ 과 noise $\epsilon$ 을 직접 골랐으니 그 차이가 곧 정답이다. 사람의 표시나 다른 모델이 필요 없다.
        network 자신의 출력을 정답으로 쓰면 아무것도 배우지 못한다. 데이터만 있으면 정답이 공짜로 정확하게 생기는 점은 DDPM 과 같다.
    - question: |
        이 loss 의 이름에 conditional 이 붙은 이유로 옳은 것은?
      choices:
        - '로봇의 관측을 조건으로 받기 때문이다'
        - '정답 속도가 noise 와 데이터의 쌍 하나를 정해 둔 상태에서 계산되는 그 쌍의 직선 속도이기 때문이다'
        - 'loss 가 특정 조건에서만 0 이 되기 때문이다'
        - '학습률을 조건에 따라 바꾸기 때문이다'
      answer: 1
      explanation: |
        $x_1 - \epsilon$ 은 쌍 $(\epsilon, x_1)$ 이 정해져야 계산되는 값이라, 쌍을 조건으로 둔 직선의 속도를 맞힌다는 뜻에서 conditional
        이라 부른다. 관측을 조건으로 받는 policy 의 조건과는 다른 이야기이고, loss 가 0 이 되는 조건이나 학습률과도 무관하다.

- topic: crossing
  title: 엇갈리는 직선과 평균 속도
  variants:
    - question: |
        데이터가 $+2$ 와 $-2$ 두 봉우리이고 noise 와 데이터를 무작위로 짝지으면, $+2$ 로 가는 직선과 $-2$ 로 가는 직선이 같은 자리를
        지나는 일이 생긴다. 그 자리에서 network 가 배우는 속도는?
      choices:
        - '두 정답 중 먼저 본 쪽의 속도'
        - '두 정답 속도를 가능성으로 무게를 둔 평균'
        - '두 정답 중 크기가 더 큰 속도'
        - '정답이 둘이라 학습이 멈추고 0 을 낸다'
      answer: 1
      explanation: |
        network 는 같은 입력 $(x_t, t)$ 에 하나의 값만 낼 수 있고, 차이의 제곱을 가장 작게 하는 값은 정답들의 평균이다. 두 쌍이 같은
        가능성이면 단순 평균, 한쪽이 더 흔하면 그쪽으로 기운다. 먼저 본 쪽이나 큰 쪽을 고르지 않으며, 정답이 둘이어도 학습은 멈추지 않고
        loss 가 0 까지 내려가지 않을 뿐이다.
    - question: |
        학습할 때의 정답 경로는 모두 직선인데, 데이터가 여럿이면 학습된 network 를 따라간 생성 경로는 휜다. 그 이유는?
      choices:
        - 'Euler 법의 오차 때문에 직선이 휘어 보이는 것이다'
        - 'network 가 충분히 학습되지 않아서다'
        - '데이터가 여럿이면 target velocity 가 곡선 식으로 바뀌기 때문이다'
        - '직선들이 엇갈리는 자리에서 network 가 평균 속도를 내므로, 경로가 처음에는 평균 쪽으로 모였다가 갈 곳이 드러나면 방향을 튼다'
      answer: 3
      explanation: |
        엇갈린 자리의 평균 속도는 어느 한 직선의 속도와도 다르다. 그래서 경로는 초반에 평균 쪽으로 모였다가 어느 데이터로 갈지 드러나면
        그쪽으로 꺾인다. 아주 잘게 걸어도 휘므로 Euler 오차 때문이 아니고, 완벽히 학습해도 마찬가지다. 쌍 하나의 target velocity 는
        여전히 직선의 속도다.
    - question: |
        학습된 생성 경로끼리는 서로 엇갈리지 않는다. 그 이유로 옳은 것은?
      choices:
        - '한 자리 $(x, t)$ 에서 network 가 내는 속도는 하나뿐이라, 두 경로가 같은 자리에 오면 그 뒤로 같은 길을 가기 때문이다'
        - '학습 데이터의 직선들이 처음부터 엇갈리지 않기 때문이다'
        - 'sampling 할 때 새 noise 를 더해 경로를 떼어 놓기 때문이다'
        - 'step 수를 충분히 크게 잡았기 때문이다'
      answer: 0
      explanation: |
        두 경로가 엇갈리려면 같은 자리에서 서로 다른 방향으로 가야 하는데, velocity field 는 자리마다 속도를 하나만 준다. 그래서 학습된
        경로는 엇갈리는 대신 휘어서 비켜 간다. 무작위로 짝지은 학습용 직선은 오히려 엇갈리고, flow matching 의 sampling 은 noise 를
        더하지 않으며, step 수와는 상관이 없다.

- topic: few-steps
  title: 적은 step 으로 되는 이유와 한계
  variants:
    - question: |
        데이터가 봉우리 둘인 분포에서 flow matching 을 Euler 법 1 step 으로 sampling 하면 어떤 일이 생길까?
      choices:
        - '경로가 직선이라 언제나 정확한 데이터가 나온다'
        - '출발 noise 의 부호에 따라 두 봉우리에 정확히 나뉜다'
        - '$t = 0$ 에서는 어느 데이터로 갈지 몰라 network 의 속도가 평균을 향하므로, 모든 sample 이 봉우리 사이의 평균 근처로 모인다'
        - 'network 를 한 번도 쓰지 않아 noise 가 그대로 나온다'
      answer: 2
      explanation: |
        1 step 은 $t = 0$ 의 속도 하나로 끝까지 직진하는데, 그 시각에는 noise 만 보고 어느 봉우리로 갈지 알 수 없어 network 가 데이터의
        평균 쪽을 가리킨다. 그래서 데이터에 없는 평균값이 나온다. 경로가 직선인 것은 데이터가 하나일 때뿐이고, 갈 곳이 갈리는 휜 구간을
        따라가려면 step 이 몇 번은 필요하다. 1 step 이라도 network 는 한 번 쓴다.
    - question: |
        같은 데이터에서 flow matching 이 DDPM 보다 적은 step 으로 봉우리에 닿는 이유로 옳은 것은?
      choices:
        - '경로가 어느 데이터로 갈지 정하는 짧은 구간에서만 휘고 나머지는 곧으며, 새 noise 로 흔들리지도 않아 큰 step 으로 따라갈 수 있기 때문이다'
        - 'flow matching 의 network 가 DDPM 의 network 보다 더 크고 정확하기 때문이다'
        - 'flow matching 은 sampling 할 때 데이터를 직접 참고하기 때문이다'
        - 'DDPM 은 학습을 덜 해서 그렇다'
      answer: 0
      explanation: |
        Euler 오차는 속도가 바뀌는 곳에서만 생기므로, 대부분 곧은 경로는 크게 건너뛰어도 된다. DDPM 은 reverse step 식이 작은 변화를
        가정하고 step 마다 새 noise 로 흔들려 크게 건너뛰기 어렵다. 두 방법 모두 정확한 답을 쓰게 해도 차이가 나므로 network 의 크기나
        학습량 때문이 아니고, sampling 중에 데이터를 참고하지도 않는다.
    - question: |
        reflow(rectified flow)는 학습을 마친 모델이 noise 에서 만든 sample 과 그 noise 를 짝지어 같은 loss 로 다시 학습한다. 이렇게 하면
        좋아지는 점은?
      choices:
        - '데이터가 늘어나 network 가 더 다양한 sample 을 만든다'
        - 'sampling 에 새 noise 를 더할 수 있게 된다'
        - 'network 의 크기를 줄일 수 있다'
        - '무작위 짝 대신 실제로 이어지는 짝을 써서 직선들의 엇갈림이 줄고, 경로가 더 곧아져 더 적은 step 으로 sampling 할 수 있다'
      answer: 3
      explanation: |
        무작위 짝은 직선이 엇갈려 network 가 평균을 내고 경로가 휜다. 모델이 실제로 보낸 짝으로 다시 그으면 엇갈림이 줄어 각 자리의
        정답이 하나에 가까워지고, 경로가 곧아져 큰 step 이 통한다. 목적은 다양성이나 noise 추가, network 축소가 아니라 경로를 곧게 펴는
        것이다.

- topic: pi0
  title: π0 의 action expert 와 action chunk
  variants:
    - question: |
        π0 는 이미지와 지시문을 읽는 큰 VLM 과 action 을 만드는 작은 action expert 로 이루어져 있고, action expert 가 flow matching 으로
        action chunk 를 만든다. 이 구조가 빠른 제어에 유리한 이유는?
      choices:
        - 'VLM 이 Euler step 마다 다시 계산해 정확도를 높이기 때문이다'
        - 'action expert 가 action 을 한 번에 하나씩만 만들기 때문이다'
        - 'flow matching 을 쓰면 network 를 한 번도 쓰지 않아도 되기 때문이다'
        - 'VLM 은 관측 하나에 한 번만 계산하고, 몇 번의 Euler step 에서는 작은 action expert 만 다시 돌리기 때문이다'
      answer: 3
      explanation: |
        무거운 VLM 계산은 관측마다 한 번이면 되고, 반복되는 Euler step 은 작은 network 만 쓰므로 action chunk 하나를 빨리 만든다. VLM 을
        step 마다 다시 돌리면 오히려 느려진다. action expert 는 여러 step 의 action 을 한 덩어리로 만들고, Euler step 마다 network 를 쓴다.
    - question: |
        같은 장면에서 시연자가 상자를 왼쪽으로 비켜 가기도 하고 오른쪽으로 비켜 가기도 했다. flow matching 으로 충분한 step 을 밟아
        action chunk 를 만드는 policy 의 행동으로 옳은 것은?
      choices:
        - '두 시연의 평균인 가운데 길을 내 상자에 부딪힌다'
        - '언제나 왼쪽 길만 낸다'
        - 'sampling 할 때마다 시연에 있던 왼쪽 길이나 오른쪽 길 하나를 낸다'
        - '두 길을 섞은 지그재그 경로를 낸다'
      answer: 2
      explanation: |
        flow matching 은 출발 noise 에 따라 경로가 어느 한 봉우리로 갈라져, 시연에 있던 방식 하나를 sample 로 낸다. 평균인 가운데 길은
        step 이 너무 적을 때나 MSE 로 한 값을 맞히는 policy 에서 생기는 문제다. noise 를 새로 뽑으면 두 방식이 고루 나오므로 한쪽만 내지
        않고, 한 chunk 는 한 봉우리를 따라가 섞인 경로가 되지 않는다.
    - question: |
        "π0 는 multimodal 모델이다" 와 "이 시연 데이터는 multimodal 이다" 에서 multimodal 의 뜻을 바르게 짝지은 것은?
      choices:
        - '둘 다 정답 분포에 봉우리가 여럿이라는 뜻이다'
        - '앞은 이미지·글·로봇 상태처럼 여러 종류의 입력을 받는다는 뜻이고, 뒤는 같은 장면의 정답 행동이 여러 봉우리로 갈라져 있다는 뜻이다'
        - '둘 다 여러 종류의 입력을 받는다는 뜻이다'
        - '앞은 정답 분포에 봉우리가 여럿이라는 뜻이고, 뒤는 데이터가 여러 센서에서 왔다는 뜻이다'
      answer: 1
      explanation: |
        모델을 multimodal 이라 할 때는 입력의 종류가 여럿이라는 뜻이고, 데이터나 분포를 multimodal 이라 할 때는 값이 몰린 봉우리가
        여럿이라는 뜻이다. 같은 단어가 서로 다른 뜻으로 쓰이므로 문맥으로 구분한다. 나머지 보기는 두 뜻을 하나로 합치거나 뒤바꿨다.
