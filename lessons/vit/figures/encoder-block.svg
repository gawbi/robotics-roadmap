<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pre-norm encoder block. LayerNorm 뒤 multi-head self-attention 결과를 입력에 더하고, 다시 LayerNorm 뒤 MLP 결과를 더한다. 이 block 을 L 번 쌓은 뒤 [CLS] 위치의 출력으로 분류한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="518" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="130.0" y="26.0" width="180" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220" y="45" fill="#e2e8f0" font-size="15" text-anchor="middle">z_ℓ₋₁</text>
  <text x="220" y="66" fill="#38bdf8" font-size="14" text-anchor="middle">197 × 768</text>
  <line x1="220" y1="74" x2="220" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="130.0" y="101.0" width="180" height="34" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220" y="123" fill="#e2e8f0" font-size="15" text-anchor="middle">LayerNorm</text>
  <line x1="220" y1="135" x2="220" y2="154" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="115.0" y="154.0" width="210" height="48" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="220" y="173" fill="#e2e8f0" font-size="15" text-anchor="middle">multi-head self-attention</text>
  <text x="220" y="194" fill="#38bdf8" font-size="14" text-anchor="middle">head 12 개</text>
  <line x1="220" y1="202" x2="220" y2="223" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="220" cy="240" r="16" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="220" y="247" fill="#e2e8f0" font-size="20" text-anchor="middle">+</text>
  <line x1="220" y1="256" x2="220" y2="279" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="130.0" y="279.0" width="180" height="34" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220" y="301" fill="#e2e8f0" font-size="15" text-anchor="middle">LayerNorm</text>
  <line x1="220" y1="313" x2="220" y2="332" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="115.0" y="332.0" width="210" height="48" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="351" fill="#e2e8f0" font-size="15" text-anchor="middle">MLP</text>
  <text x="220" y="372" fill="#f59e0b" font-size="14" text-anchor="middle">768 → 3072 → 768, GELU</text>
  <line x1="220" y1="380" x2="220" y2="401" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="220" cy="418" r="16" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="220" y="425" fill="#e2e8f0" font-size="20" text-anchor="middle">+</text>
  <line x1="220" y1="434" x2="220" y2="456" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="130.0" y="456.0" width="180" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220" y="475" fill="#e2e8f0" font-size="15" text-anchor="middle">z_ℓ</text>
  <text x="220" y="496" fill="#38bdf8" font-size="14" text-anchor="middle">197 × 768</text>
  <path d="M130,50 L84,50 L84,240 L202,240" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M220,266 L84,266 L84,418 L202,418" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="56" y="146" fill="#94a3b8" font-size="13" text-anchor="middle">residual</text>
  <text x="56" y="342" fill="#94a3b8" font-size="13" text-anchor="middle">residual</text>
  <path d="M346,40 L356,40 L356,490 L346,490" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="366" y="430" fill="#e2e8f0" font-size="14" text-anchor="start">× L 번</text>
  <text x="366" y="450" fill="#94a3b8" font-size="13" text-anchor="start">(ViT-B/16 은 12)</text>
  <text x="500" y="60" fill="#e2e8f0" font-size="14" text-anchor="middle">분류</text>
  <rect x="415.0" y="86.0" width="170" height="48" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="105" fill="#e2e8f0" font-size="15" text-anchor="middle">z_L 의 0번 token</text>
  <text x="500" y="126" fill="#f59e0b" font-size="14" text-anchor="middle">[CLS] 자리, 숫자 768 개</text>
  <line x1="500" y1="134" x2="500" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="415.0" y="161.0" width="170" height="34" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="183" fill="#e2e8f0" font-size="15" text-anchor="middle">LayerNorm</text>
  <line x1="500" y1="195" x2="500" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="415.0" y="220.0" width="170" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="239" fill="#e2e8f0" font-size="15" text-anchor="middle">head (Linear)</text>
  <text x="500" y="260" fill="#38bdf8" font-size="14" text-anchor="middle">768 → 1000</text>
  <line x1="500" y1="268" x2="500" y2="294" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="415.0" y="294.0" width="170" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="313" fill="#e2e8f0" font-size="15" text-anchor="middle">class 점수</text>
  <text x="500" y="334" fill="#38bdf8" font-size="14" text-anchor="middle">1000 개</text>
</svg>
