  <text x="358" y="270" fill="#d6aa62" font-size="15" text-anchor="middle" font-weight="bold">3</text>
  <rect x="372" y="244" width="24" height="24" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="384.0" y="260.32" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="396" y="244" width="24" height="24" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="408.0" y="260.32" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
