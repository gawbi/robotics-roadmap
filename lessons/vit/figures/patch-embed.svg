<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>patch 1 을 펼친 [0, 1, 0, 1] 에 행렬 E 를 곱하면 첫째 행과의 dot product 2, 둘째 행과의 dot product −2 가 나와 [2, −2] 가 된다. 네 patch 에 같은 E 를 곱하면 [2, −2], [2, 2], [0, 0], [4, 0] 이다</title>
