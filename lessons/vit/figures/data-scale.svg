<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ViT 논문 표 5 의 ImageNet 정확도. ImageNet(약 130만 장)으로만 미리 학습하면 큰 ViT-L/16 이 76.53% 로 ViT-B/16 의 77.91% 보다 낮지만, ImageNet-21k(약 1,400만 장)에서는 85.15% 대 83.97%, JFT-300M(약 3억 장)에서는 87.12% 대 84.15% 로 뒤집힌다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="90" y1="260.0" x2="650" y2="260.0" stroke="#1e293b" stroke-width="1"/>
  <text x="82" y="264.0" fill="#94a3b8" font-size="12" text-anchor="end">70%</text>
  <line x1="90" y1="207.5" x2="650" y2="207.5" stroke="#1e293b" stroke-width="1"/>
  <text x="82" y="211.5" fill="#94a3b8" font-size="12" text-anchor="end">75%</text>
  <line x1="90" y1="155.0" x2="650" y2="155.0" stroke="#1e293b" stroke-width="1"/>
  <text x="82" y="159.0" fill="#94a3b8" font-size="12" text-anchor="end">80%</text>
  <line x1="90" y1="102.5" x2="650" y2="102.5" stroke="#1e293b" stroke-width="1"/>
  <text x="82" y="106.5" fill="#94a3b8" font-size="12" text-anchor="end">85%</text>
  <line x1="90" y1="50.0" x2="650" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="82" y="54.0" fill="#94a3b8" font-size="12" text-anchor="end">90%</text>
  <text x="82" y="34" fill="#94a3b8" font-size="12" text-anchor="start">ImageNet 정확도 (세로축은 70% 부터)</text>
  <rect x="150" y="176.94500000000005" width="46" height="83.05499999999995" rx="3" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="173" y="170.94500000000005" fill="#e2e8f0" font-size="12" text-anchor="middle">77.91</text>
  <rect x="206" y="191.435" width="46" height="68.565" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
  <text x="229" y="185.435" fill="#e2e8f0" font-size="12" text-anchor="middle">76.53</text>
  <text x="201" y="280" fill="#e2e8f0" font-size="13" text-anchor="middle">ImageNet</text>
  <text x="201" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">약 130만 장</text>
  <rect x="330" y="113.31500000000003" width="46" height="146.68499999999997" rx="3" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="353" y="107.31500000000003" fill="#e2e8f0" font-size="12" text-anchor="middle">83.97</text>
  <rect x="386" y="100.92499999999995" width="46" height="159.07500000000005" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
  <text x="409" y="94.92499999999995" fill="#e2e8f0" font-size="12" text-anchor="middle">85.15</text>
  <text x="381" y="280" fill="#e2e8f0" font-size="13" text-anchor="middle">ImageNet-21k</text>
  <text x="381" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">약 1,400만 장</text>
  <rect x="510" y="111.42499999999995" width="46" height="148.57500000000005" rx="3" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="533" y="105.42499999999995" fill="#e2e8f0" font-size="12" text-anchor="middle">84.15</text>
  <rect x="566" y="80.23999999999995" width="46" height="179.76000000000005" rx="3" fill="#f59e0b" fill-opacity="0.85"/>
  <text x="589" y="74.23999999999995" fill="#e2e8f0" font-size="12" text-anchor="middle">87.12</text>
  <text x="561" y="280" fill="#e2e8f0" font-size="13" text-anchor="middle">JFT-300M</text>
  <text x="561" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">약 3억 장</text>
  <rect x="400" y="22" width="14" height="14" rx="2" fill="#38bdf8"/>
  <text x="420" y="34" fill="#e2e8f0" font-size="12" text-anchor="start">ViT-B/16 (8,660만)</text>
  <rect x="530" y="22" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="550" y="34" fill="#e2e8f0" font-size="12" text-anchor="start">ViT-L/16 (3억 700만)</text>
  <text x="370" y="326" fill="#94a3b8" font-size="12" text-anchor="middle">가로축: 미리 학습한 데이터. 그 뒤 ImageNet 으로 fine-tuning 해 잰 정확도</text>
</svg>
