<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 VLA 의 사진 입력 처리. OpenVLA 는 224×224 사진을 SigLIP 과 DINOv2 에 따로 넣어 patch 256 개의 출력을 이어 붙이고, π0 는 카메라 3 대의 사진을 SigLIP 에 넣어 256 × 3 = 768 개를 넘기며, GR00T N1 은 SigLIP-2 출력을 pixel shuffle 로 사진 한 장당 64 개로 줄인다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
  <rect x="1" y="1" width="758" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="105" fill="#f59e0b" font-size="16" text-anchor="start" font-weight="600">OpenVLA</text>
  <text x="24" y="220" fill="#38bdf8" font-size="16" text-anchor="start" font-weight="600">π0</text>
  <text x="24" y="335" fill="#34d399" font-size="16" text-anchor="start" font-weight="600">GR00T N1</text>
  <rect x="120" y="80" width="110" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175.0" y="101.0" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 1 장</text>
  <text x="175.0" y="119.0" fill="#94a3b8" font-size="13" text-anchor="middle">224×224</text>
  <rect x="275" y="55" width="150" height="42" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350.0" y="81.0" fill="#e2e8f0" font-size="13" text-anchor="middle">SigLIP So400m/14</text>
  <rect x="275" y="113" width="150" height="42" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350.0" y="139.0" fill="#e2e8f0" font-size="13" text-anchor="middle">DINOv2 ViT-L/14</text>
  <line x1="232" y1="100" x2="272" y2="78" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="232" y1="110" x2="272" y2="132" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="470" y="80" width="130" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535.0" y="101.0" fill="#e2e8f0" font-size="14" text-anchor="middle">patch 마다 이어 붙임</text>
  <text x="535.0" y="119.0" fill="#f59e0b" font-size="13" text-anchor="middle">256 개</text>
  <line x1="427" y1="78" x2="467" y2="98" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="427" y1="132" x2="467" y2="114" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="640" y="80" width="100" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690.0" y="101.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Llama 2</text>
  <text x="690.0" y="119.0" fill="#94a3b8" font-size="13" text-anchor="middle">7B</text>
  <line x1="602" y1="105" x2="637" y2="105" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="120" y="195" width="110" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175.0" y="216.0" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 3 장</text>
  <text x="175.0" y="234.0" fill="#94a3b8" font-size="13" text-anchor="middle">카메라 3 대</text>
  <rect x="275" y="195" width="150" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">SigLIP So400m/14</text>
  <text x="350.0" y="234.0" fill="#38bdf8" font-size="12" text-anchor="middle">PaliGemma</text>
  <line x1="232" y1="220" x2="272" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="470" y="195" width="130" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="535.0" y="216.0" fill="#e2e8f0" font-size="14" text-anchor="middle">256 × 3</text>
  <text x="535.0" y="234.0" fill="#38bdf8" font-size="13" text-anchor="middle">= 768 개</text>
  <line x1="427" y1="220" x2="467" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="640" y="195" width="100" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690.0" y="216.0" fill="#e2e8f0" font-size="14" text-anchor="middle">Gemma</text>
  <text x="690.0" y="234.0" fill="#94a3b8" font-size="13" text-anchor="middle">2B</text>
  <line x1="602" y1="220" x2="637" y2="220" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="120" y="310" width="110" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175.0" y="331.0" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 1 장</text>
  <text x="175.0" y="349.0" fill="#94a3b8" font-size="13" text-anchor="middle">224×224</text>
  <rect x="275" y="310" width="150" height="50" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="350.0" y="331.0" fill="#e2e8f0" font-size="13" text-anchor="middle">SigLIP-2</text>
  <text x="350.0" y="349.0" fill="#34d399" font-size="12" text-anchor="middle">Eagle-2</text>
  <line x1="232" y1="335" x2="272" y2="335" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="470" y="310" width="130" height="50" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="535.0" y="331.0" fill="#e2e8f0" font-size="14" text-anchor="middle">pixel shuffle</text>
  <text x="535.0" y="349.0" fill="#34d399" font-size="13" text-anchor="middle">64 개</text>
  <line x1="427" y1="335" x2="467" y2="335" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="640" y="310" width="100" height="50" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="690.0" y="331.0" fill="#e2e8f0" font-size="14" text-anchor="middle">SmolLM2</text>
  <text x="690.0" y="349.0" fill="#94a3b8" font-size="13" text-anchor="middle">Eagle-2</text>
  <line x1="602" y1="335" x2="637" y2="335" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="175" y="34" fill="#94a3b8" font-size="13" text-anchor="middle">입력</text>
  <text x="350" y="34" fill="#94a3b8" font-size="13" text-anchor="middle">image encoder (ViT)</text>
  <text x="535" y="34" fill="#94a3b8" font-size="13" text-anchor="middle">사진 한 장의 token</text>
  <text x="690" y="34" fill="#94a3b8" font-size="13" text-anchor="middle">언어 모델</text>
  <text x="380.0" y="386" fill="#94a3b8" font-size="12" text-anchor="middle">세로 줄은 같은 단계다. 셋 다 사진을 224×224 로 넣는다</text>
</svg>
