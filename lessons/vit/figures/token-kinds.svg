<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>text token 은 token id 로 embedding 표에서 행 하나를 꺼내 vector 를 얻고, image patch token 은 patch 의 pixel 숫자를 펼쳐 행렬 E 를 곱해 vector 를 얻는다. 둘 다 Transformer 에는 같은 길이의 vector 로 들어간다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="36" fill="#38bdf8" font-size="15" text-anchor="start" font-weight="bold">text token</text>
  <rect x="30" y="58" width="70" height="40" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="65" y="84" fill="#e2e8f0" font-size="17" text-anchor="middle">배</text>
  <line x1="104" y1="78" x2="140" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="144" y="58" width="90" height="40" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="189" y="84" fill="#e2e8f0" font-size="14" text-anchor="middle">token id 0</text>
  <line x1="238" y1="78" x2="272" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="46" width="190" height="20" rx="3" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="296" y="61" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="350" y="61" fill="#e2e8f0" font-size="12" text-anchor="middle">배</text>
  <text x="430" y="61" fill="#e2e8f0" font-size="12" text-anchor="middle">[1, 1]</text>
  <rect x="280" y="68" width="190" height="20" rx="3" fill="#111a2e" stroke="#64748b" stroke-width="1"/>
  <text x="296" y="83" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="350" y="83" fill="#e2e8f0" font-size="12" text-anchor="middle">를</text>
  <text x="430" y="83" fill="#e2e8f0" font-size="12" text-anchor="middle">[0, 0]</text>
  <rect x="280" y="90" width="190" height="20" rx="3" fill="#111a2e" stroke="#64748b" stroke-width="1"/>
  <text x="296" y="105" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="350" y="105" fill="#e2e8f0" font-size="12" text-anchor="middle">먹었다</text>
  <text x="430" y="105" fill="#e2e8f0" font-size="12" text-anchor="middle">[2, 0]</text>
  <rect x="280" y="112" width="190" height="20" rx="3" fill="#111a2e" stroke="#64748b" stroke-width="1"/>
  <text x="296" y="127" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
  <text x="350" y="127" fill="#e2e8f0" font-size="12" text-anchor="middle">탔다</text>
  <text x="430" y="127" fill="#e2e8f0" font-size="12" text-anchor="middle">[0, 2]</text>
  <text x="375" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">embedding 표의 0 번 행</text>
  <line x1="476" y1="57" x2="530" y2="78" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="536" y="58" width="110" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="591" y="84" fill="#e2e8f0" font-size="16" text-anchor="middle">[1, 1]</text>
  <line x1="20" y1="172" x2="660" y2="172" stroke="#1e293b" stroke-width="1"/>
  <text x="20" y="204" fill="#f59e0b" font-size="15" text-anchor="start" font-weight="bold">image patch token</text>
  <rect x="40" y="226" width="30" height="30" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="55.0" y="245.68" fill="#94a3b8" font-size="13" text-anchor="middle">0</text>
  <rect x="70" y="226" width="30" height="30" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="85.0" y="245.68" fill="#0b1220" font-size="13" text-anchor="middle">1</text>
  <rect x="40" y="256" width="30" height="30" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="55.0" y="275.68" fill="#94a3b8" font-size="13" text-anchor="middle">0</text>
  <rect x="70" y="256" width="30" height="30" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <text x="85.0" y="275.68" fill="#0b1220" font-size="13" text-anchor="middle">1</text>
  <line x1="104" y1="256" x2="140" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="144" y="236" width="110" height="40" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="199" y="262" fill="#e2e8f0" font-size="14" text-anchor="middle">[0, 1, 0, 1]</text>
  <text x="199" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">펼친 pixel 숫자</text>
  <line x1="258" y1="256" x2="300" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="306" y="236" width="150" height="40" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="381" y="262" fill="#e2e8f0" font-size="14" text-anchor="middle">× E (행렬 곱)</text>
  <text x="381" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">vocabulary 번호 없음</text>
  <line x1="460" y1="256" x2="530" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="536" y="236" width="110" height="40" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="591" y="262" fill="#e2e8f0" font-size="16" text-anchor="middle">[2, −2]</text>
  <text x="591" y="304" fill="#34d399" font-size="13" text-anchor="middle">둘 다 숫자 2 개짜리 vector</text>
</svg>
