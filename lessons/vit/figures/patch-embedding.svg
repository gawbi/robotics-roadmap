<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ViT 의 입력. 224×224 이미지를 16×16 patch 196 개로 잘라 펼치고, 같은 linear projection E 로 768 차원 token 을 만든 뒤 맨 앞에 [CLS] token 을 붙이고 position embedding 을 더한다</title>
