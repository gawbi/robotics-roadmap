  <rect x="24" y="130" width="30" height="30" fill="#38bdf8" fill-opacity="0.55" stroke="#0b1220" stroke-width="2"/>
  <rect x="54" y="130" width="30" height="30" fill="#38bdf8" fill-opacity="0.25" stroke="#0b1220" stroke-width="2"/>
  <rect x="84" y="130" width="30" height="30" fill="#38bdf8" fill-opacity="0.40" stroke="#0b1220" stroke-width="2"/>
  <rect x="114" y="130" width="30" height="30" fill="#38bdf8" fill-opacity="0.55" stroke="#0b1220" stroke-width="2"/>
