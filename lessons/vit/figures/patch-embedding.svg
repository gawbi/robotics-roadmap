  <text x="84" y="56" fill="#e2e8f0" font-size="13" text-anchor="middle">사진 3×224×224</text>
  <text x="84" y="212" fill="#94a3b8" font-size="13" text-anchor="middle">16×16 patch</text>
  <text x="84" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">14 × 14 = 196 개</text>
