  <rect x="496" y="126" width="80" height="14" rx="3" fill="#34d399" fill-opacity="0.7"/>
  <rect x="496" y="170" width="80" height="14" rx="3" fill="#34d399" fill-opacity="0.7"/>
  <rect x="496" y="192" width="80" height="14" rx="3" fill="#34d399" fill-opacity="0.7"/>
  <text x="536" y="160" fill="#94a3b8" font-size="16" text-anchor="middle">⋮</text>
  <text x="536" y="52" fill="#34d399" font-size="13" text-anchor="middle">E_pos</text>
  <text x="402" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">token 197 개</text>
  <text x="536" y="230" fill="#94a3b8" font-size="13" text-anchor="middle">position embedding</text>
  <text x="300" y="274" fill="#e2e8f0" font-size="14" text-anchor="middle">z₀ = [x_cls; Ex₁; …; Ex₁₉₆] + E_pos  →  197 × 768</text>
</svg>
