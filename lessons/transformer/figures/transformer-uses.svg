<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 Transformer 구조에 text token, 이미지 patch vector, 로봇의 카메라 vector 와 관절 값이 들어가 각각 다음 token, 이미지 분류, 행동 여러 step 을 내는 모습</title>
  <defs><marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="af87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="aa78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="333" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="50.0" width="180.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="110.0" y="73.5" fill="#38bdf8" font-size="13" text-anchor="middle">text token</text>
  <text x="110.0" y="91.5" fill="#94a3b8" font-size="13" text-anchor="middle">고양이 가 모자 를 …</text>
  <line x1="202.0" y1="78.0" x2="248.0" y2="78.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#a38bdf8)"/>
  <rect x="470.0" y="50.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="545.0" y="73.5" fill="#38bdf8" font-size="13" text-anchor="middle">다음 token</text>
  <text x="545.0" y="91.5" fill="#94a3b8" font-size="13" text-anchor="middle">GPT-2</text>
  <line x1="412.0" y1="78.0" x2="468.0" y2="78.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#a38bdf8)"/>
  <rect x="20.0" y="140.0" width="180.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110.0" y="163.6" fill="#f59e0b" font-size="13" text-anchor="middle">이미지 patch 196 개</text>
  <text x="110.0" y="181.6" fill="#94a3b8" font-size="13" text-anchor="middle">16×16 pixel 조각마다 vector</text>
  <line x1="202.0" y1="168.0" x2="248.0" y2="168.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#af59e0b)"/>
  <rect x="470.0" y="140.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="545.0" y="163.6" fill="#f59e0b" font-size="13" text-anchor="middle">이미지 분류</text>
  <text x="545.0" y="181.6" fill="#94a3b8" font-size="13" text-anchor="middle">ViT</text>
  <line x1="412.0" y1="168.0" x2="468.0" y2="168.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#af59e0b)"/>
  <rect x="20.0" y="230.0" width="180.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="110.0" y="253.6" fill="#34d399" font-size="13" text-anchor="middle">로봇 상태</text>
  <text x="110.0" y="271.6" fill="#94a3b8" font-size="13" text-anchor="middle">카메라 vector + 관절 값</text>
  <line x1="202.0" y1="258.0" x2="248.0" y2="258.0" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/>
  <rect x="470.0" y="230.0" width="150.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="545.0" y="253.6" fill="#34d399" font-size="13" text-anchor="middle">행동 여러 step</text>
  <text x="545.0" y="271.6" fill="#94a3b8" font-size="13" text-anchor="middle">ACT · π0</text>
  <line x1="412.0" y1="258.0" x2="468.0" y2="258.0" stroke="#34d399" stroke-width="2" marker-end="url(#a34d399)"/>
  <rect x="250.0" y="40.0" width="160.0" height="256.0" rx="12" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330.0" y="140.0" fill="#e2e8f0" font-size="16" text-anchor="middle">Transformer</text>
  <text x="330.0" y="166.0" fill="#94a3b8" font-size="12" text-anchor="middle">attention · FFN</text>
  <text x="330.0" y="184.0" fill="#94a3b8" font-size="12" text-anchor="middle">residual · LayerNorm</text>
  <text x="330.0" y="202.0" fill="#94a3b8" font-size="12" text-anchor="middle">× N 층</text>
  <text x="320.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">입력을 vector 목록으로 바꾸면 같은 구조에 넣을 수 있다</text>
</svg>
