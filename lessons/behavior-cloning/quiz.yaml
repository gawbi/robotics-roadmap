# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: bc-supervised
  title: supervised learning 으로서의 behavior cloning
  variants:
    - question: |
        behavior cloning 으로 policy 를 학습할 때 각 관측에 붙는 정답은 무엇인가?
      choices:
        - '학습 중인 policy 가 rollout 에서 그 관측에 낸 action'
        - '그 관측에서 expert 가 실제로 낸 action'
        - 'episode 가 끝났을 때 작업에 성공했는지를 나타내는 점수'
        - '그 관측 바로 다음 step 의 관측'
      answer: 1
      explanation: |
        behavior cloning 은 시연에서 모은 (관측, expert 의 action) 쌍을 (입력, 정답) 으로 삼는 supervised learning 이다. policy 자신의
        action 을 정답으로 쓰면 이미 내던 값을 다시 배울 뿐이라 배울 것이 없다. 성공 여부 점수는 관측마다 어떤 action 을 냈어야 했는지
        알려 주지 않는다. 다음 관측은 action 의 결과라서 정답 자리에 들어가지 않는다.
    - question: |
        behavior cloning 의 학습을 linear regression 과 비교한 설명으로 맞는 것은?
      choices:
        - 'behavior cloning 은 loss 없이 expert 의 행동을 그대로 저장해 두었다가 꺼내 쓴다'
        - 'behavior cloning 은 MSE 대신 rollout 에서 이탈한 횟수를 loss 로 쓴다'
        - 'behavior cloning 은 gradient 를 쓰지 않고 시연 쌍마다 parameter 를 정답 값으로 곧바로 바꿔 넣는다'
        - 'loss·gradient·update 는 같고, 정답이 "그 관측에서 expert 가 낸 action" 이라는 것만 다르다'
      answer: 3
      explanation: |
        behavior cloning 은 (관측, expert 의 action) 쌍으로 학습하는 supervised learning 이라서, MSE 같은 loss 와 그 gradient, gradient 의
        반대쪽으로 parameter 를 고치는 update 가 linear regression 과 같다. 시연을 저장해 꺼내 쓰기만 하면 시연에 없는 관측에서 action 을
        낼 수 없다. 이탈 횟수는 rollout 을 해 봐야 아는 값이라 학습의 loss 로 쓰지 않는다. parameter 를 정답 값으로 바꿔 넣는 방식은 없고,
        parameter 는 gradient 를 따라 조금씩 고친다.
    - question: |
        차선을 따라가는 policy 를 behavior cloning 으로 학습했는데, 비 오는 날 차선이 흐리면 자꾸 흔들린다. behavior cloning 의 틀 안에서
        자연스러운 해결 방법은 무엇인가?
      choices:
        - '비 오는 날 expert 가 운전한 기록을 더 모아 데이터에 넣고 다시 학습한다'
        - '"차선이 흐리면 핸들을 몇 도 꺾는다" 는 규칙을 사람이 코드로 새로 덧붙인다'
        - '기존 데이터는 그대로 두고 learning rate 만 키워 흐린 차선에 더 민감하게 다시 학습한다'
        - '비 오는 날 policy 가 낸 핸들 각도를 정답으로 저장해 다시 학습한다'
      answer: 0
      explanation: |
        behavior cloning 은 규칙을 말로 적지 않고 시연에서 관계를 배우므로, 부족한 상황(비 오는 날)의 시연을 더 모아 다시 학습하면 된다.
        규칙을 코드로 덧붙이는 것은 사람이 규칙을 직접 짜는 방법이다. learning rate 를 바꿔도 데이터에 비 오는 장면이 없으면 배울 것이
        생기지 않는다. policy 자신의 action 을 정답으로 저장하면 흔들리던 행동을 그대로 다시 배운다.

- topic: compounding-error
  title: 오차가 쌓이는 compounding error
  variants:
    - question: |
        behavior cloning 으로 학습한 차가 처음에는 차선을 잘 따라가다가 점점 벗어나 결국 이탈했다. 이 현상을 compounding error 로 바르게 설명한
        것은?
      choices:
        - 'learning rate 가 너무 커서 학습 중 loss 가 발산했고, 그 결과가 rollout 에 나타난 것이다'
        - 'expert 의 시연에 섞인 작은 실수를 policy 가 그대로 따라 해서 생기는 현상이다'
        - '작은 오차가 차를 시연에 없던 상태로 옮기고, 그 상태에서 오차가 더 커지며 쌓이는 현상이다'
        - '매 step 같은 크기의 오차가 일정하게 더해져, episode 가 길면 결국 이탈하는 현상이다'
      answer: 2
      explanation: |
        policy 의 작은 오차 때문에 차가 expert 와 다르게 움직여, 다음 관측은 expert 가 가지 않았을 상태에서 나온다. 그 낯선 상태에서는
        정답을 배운 적이 없어 더 크게 틀리고, 그 오차 때문에 차가 더 낯선 상태로 들어가면서 오차가 불어난다. loss 발산은 학습 단계의
        문제라서 rollout 에서 점점 벗어나는 현상과는 관계없다. 시연이 완벽해도 이 현상은 생긴다. 오차는 일정하게 더해지지 않고 step 이
        지날수록 커지며 쌓인다.
    - question: |
        behavior cloning policy 가 한 episode 에서 틀리는 step 수의 가장 나쁜 경우 상한은 $T^2\epsilon$ 이다($T$ 는 episode 길이,
        $\epsilon$ 은 시연과 같은 상황에서 step 마다 틀릴 확률). $\epsilon$ 은 그대로 두고 episode 를 두 배로 늘리면 이 상한은
        어떻게 되는가?
      choices:
        - '네 배가 된다'
        - '두 배가 된다'
        - '그대로다'
        - '절반이 된다'
      answer: 0
      explanation: |
        $T$ 가 제곱으로 들어가 있어서 $T$ 가 두 배면 $T^2$ 은 네 배다. 실수가 대략 $T\epsilon$ 번 나오고 실수 한 번이 남은 step 을
        많게는 $T$ 개까지 망치므로 둘을 곱해 $T^2\epsilon$ 이 된다. 두 배는 실수가 이어지지 않을 때의 $T\epsilon$ 에 해당한다. 그대로이려면
        $T$ 가 식에 없어야 한다. 절반이 되려면 $T$ 가 분모에 있어야 한다.
    - question: |
        다음 중 behavior cloning 의 compounding error 를 줄이는 방법으로 보기 어려운 것은 무엇인가?
      choices:
        - 'policy 를 직접 달리게 해서 policy 가 간 낯선 상태에 expert 의 정답을 받아 데이터에 더한다'
        - '중심에서 벗어난 장면에 가운데로 돌아오는 정답을 붙여 시연에 일부러 채워 넣는다'
        - 'action 을 여러 step 묶음으로 내서 policy 가 결정하는 횟수 자체를 줄인다'
        - '같은 expert 가 같은 방식으로 운전한 시연을 몇 배 더 모은다'
      answer: 3
      explanation: |
        같은 expert 의 시연은 아무리 늘려도 expert 가 가는 상태에서만 나오므로, policy 가 실수 뒤 들어가는 낯선 상태는 여전히 비어 있다.
        policy 가 간 상태에 정답을 받는 것은 DAgger 다. 돌아오는 장면을 채우는 것은 NVIDIA 의 주행 연구에서 옆 카메라로 쓴 방법이다.
        action 을 묶음으로 내는 것은 ACT 의 action chunking 으로, 오차가 쌓일 기회를 줄인다.

- topic: distribution-shift
  title: distribution shift 와 validation loss
  variants:
    - question: |
        imitation learning 에서 말하는 distribution shift 는 무엇인가?
      choices:
        - '학습 때 본 입력의 분포와 실행 때 만나는 입력의 분포가 달라지는 것'
        - '학습하는 동안 parameter 값이 update 되면서 parameter 의 분포가 바뀌는 것'
        - 'learning rate 가 학습 도중 줄어들어 뒤쪽 데이터를 덜 반영하게 되는 것'
        - '시연하는 사람이 바뀌어 같은 관측에 대한 action 의 평균이 달라지는 것'
      answer: 0
      explanation: |
        시연은 expert 가 지나간 상태에서만 나오는데, policy 를 실행하면 자기 실수로 다른 상태들을 지나간다. 이렇게 학습 입력과 실행
        입력의 분포가 어긋나는 것이 distribution shift 다. parameter 값의 분포가 바뀌는 것은 학습 과정에서 생기는 일이라 입력의 분포와는
        관계없다. learning rate 가 줄어드는 것도 학습 설정이 바뀌는 것일 뿐이다. 시연자가 바뀌는 것은 시연 데이터 안의 차이이지 학습
        때와 실행 때의 차이가 아니다.
    - question: |
        시연에서 떼어 둔 validation set 의 loss 가 아주 낮은 policy 가 실제 rollout 에서는 금방 실패했다. 왜 그럴까?
      choices:
        - 'validation loss 를 학습 데이터로 잘못 계산해서 실제보다 낮게 나왔기 때문이다'
        - 'validation set 도 expert 가 간 상태에서만 나와, policy 가 만든 낯선 상태의 오차를 재지 못하기 때문이다'
        - 'validation loss 가 낮으면 overfitting 이므로 rollout 이 실패하는 것이 당연하다'
        - 'rollout 은 학습 데이터와 같은 상태만 지나가므로, 실패는 로봇 하드웨어가 고장 난 탓이다'
      answer: 1
      explanation: |
        validation set 은 시연의 일부라서 expert 가 간 상태만 담고 있다. 그곳에서는 policy 의 오차가 작아도, rollout 에서 policy 가
        밀려나 들어간 상태는 validation set 에 없어 그 오차가 loss 에 드러나지 않는다. 계산 실수가 없어도 이런 일은 생긴다. validation
        loss 가 낮다는 것만으로 overfitting 이라 할 수 없다. rollout 은 학습 데이터에 없는 상태를 지나갈 수 있으므로 하드웨어 고장을 탓할 근거가 없다.
    - question: |
        distribution shift 와 compounding error 는 어떤 관계인가?
      choices:
        - '같은 현상을 부르는 두 이름이고, 교재에 따라 둘 중 하나를 쓴다'
        - 'compounding error 가 원인이고, 그렇게 쌓인 오차 때문에 학습 데이터의 분포가 바뀐다'
        - 'distribution shift 가 원인이고 compounding error 가 그 결과다'
        - '서로 관계없다. 하나는 학습 단계의 문제이고, 다른 하나는 데이터를 모으는 단계의 문제다'
      answer: 2
      explanation: |
        policy 가 실행 때 학습 분포 밖의 상태를 만나는 것(distribution shift)이 원인이고, 그 상태에서 더 크게 틀려 더 낯선 상태로 가면서
        오차가 불어나는 것(compounding error)이 결과다. 하나는 원인이고 하나는 결과라서 같은 현상의 두 이름이 아니다. 학습 데이터의
        분포는 rollout 때문에 바뀌지 않는다. 둘 다 policy 를 실행하는 단계에서 생기는 문제라서 서로 이어져 있다.

- topic: action-head
  title: 로봇 팔 policy 의 action head
  variants:
    - question: |
        사진 feature 와 지금의 관절 각도를 이어 붙여(concatenation) MLP head 에 넣는 policy 를 학습했다. 학습할 때는 앞쪽 칸에 사진 feature 를
        넣고 뒤쪽 칸에 관절 각도를 넣었는데, 실행할 때 실수로 순서를 바꿔 이어 붙였다면 어떻게 되는가?
      choices:
        - '이어 붙인 칸 수가 같으므로 network 가 받는 입력의 크기도 같아 출력도 같다'
        - '실행을 시작하면 head 가 바뀐 순서에 맞춰 스스로 weight 를 다시 학습한다'
        - 'concatenation 은 두 vector 를 칸마다 더하는 연산이라 순서와 상관없다'
        - '칸마다 학습된 weight 에 엉뚱한 값이 곱해져, 관절 각도를 사진 feature 로 잘못 읽는다'
      answer: 3
      explanation: |
        weight 는 칸마다 따로 학습되므로, 어느 칸에 무엇이 들어가는지는 학습 때 정한 그대로 지켜야 한다. 칸 수가 같아도 내용이 다르면
        출력이 달라진다. 실행 중에는 학습이 일어나지 않는다. concatenation 은 더하기가 아니라 앞뒤로 이어 붙이는 연산이다.
    - question: |
        관절 목표 각도를 내는 MLP head 에서 hidden layer 에는 ReLU 를 쓰면서 출력 layer 에는 쓰지 않는 이유는 무엇인가?
      choices:
        - '출력 layer 에서 ReLU 를 쓰면 gradient 가 너무 커져 학습이 불안정해지기 때문이다'
        - '출력 layer 에는 weight 가 없어서 ReLU 를 붙일 자리가 없기 때문이다'
        - '관절 목표 각도는 음수일 수 있는데 ReLU 는 음수를 0 으로 잘라 버리기 때문이다'
        - 'ReLU 는 hidden layer 에서만 정의되는 함수이기 때문이다'
      answer: 2
      explanation: |
        ReLU 는 음수를 0 으로 바꾸고 양수는 그대로 내보낸다. 출력 layer 에 쓰면 음수여야 하는 목표 각도를 낼 수 없다. gradient 가
        커지는 것은 ReLU 의 성질이 아니다. 출력 layer 에도 weight 와 bias 가 있다. ReLU 는 어느 layer 에든 붙일 수 있는 함수다.
    - question: |
        pretrained 이미지 encoder 를 freeze 하고 뒤에 MLP head 를 붙여 시연으로 학습하면, 학습하는 동안 무엇이 바뀌는가?
      choices:
        - 'encoder 와 head 의 weight 가 모두 바뀐다'
        - 'encoder 뒤에 붙인 head 의 weight 만 바뀐다'
        - 'encoder 의 weight 만 바뀌고 head 는 그대로다'
        - 'freeze 는 학습 전체를 멈추므로 아무것도 바뀌지 않는다'
      answer: 1
      explanation: |
        freeze 는 encoder 의 weight 를 고정한다는 뜻이라 시연으로 고치는 것은 그 뒤에 붙인 head 뿐이다. encoder 까지 바꾸려면 freeze 를
        풀어야 한다. encoder 만 바뀌는 것은 정반대다. freeze 는 일부 weight 만 고정할 뿐 학습 전체를 멈추지 않는다.

- topic: normalization
  title: 여러 차원 action 의 loss 와 normalization
  variants:
    - question: |
        관절 여러 개의 목표 각도를 한 MSE 로 학습한다. 어떤 시연 쌍에서 집게 칸의 오차가 다른 칸보다 훨씬 크다면, 출력 하나하나의 gradient 는
        어떻게 되는가?
      choices:
        - 'MSE 는 칸을 평균해 하나로 만드므로 모든 칸의 gradient 가 같다'
        - '오차가 큰 집게 칸의 gradient 가 가장 커서, 그 칸을 크게 고치라는 신호가 간다'
        - '오차가 너무 큰 칸은 이상한 값으로 보고 gradient 가 0 이 되어 학습에서 빠진다'
        - 'gradient 의 크기는 오차가 아니라 출력에서 칸이 놓인 순서로 정해진다'
      answer: 1
      explanation: |
        MSE 를 한 칸의 출력으로 미분하면 그 칸의 오차에 비례하는 값이 나와서, 크게 틀린 칸일수록 gradient 가 크고 그 신호가
        backpropagation 으로 앞 layer 까지 전해진다. 평균을 내도 칸마다 오차가 다르면 gradient 도 다르다. 오차가 클수록 gradient 가 0 이
        되는 일은 없다. 칸의 순서는 gradient 크기와 관계없다.
    - question: |
        action 의 한 차원은 standard deviation 이 45 이고 다른 차원은 9 다. 아무 처리 없이 두 차원을 한 MSE 로 학습하면 어떤 일이 생기는가?
      choices:
        - '흩어진 정도가 큰 차원의 오차가 훨씬 커서 loss 가 거의 그 차원으로 정해진다'
        - '값이 작은 차원은 오차가 작아 맞히기 쉬우므로 loss 를 독차지해 큰 차원을 배우지 못한다'
        - 'MSE 는 오차를 제곱하므로 값의 크기 차이가 사라져 아무 문제가 없다'
        - '두 차원의 크기 차이가 커서 MSE 가 음수가 되고 학습이 거꾸로 진행된다'
      answer: 0
      explanation: |
        값이 넓게 흩어진 차원일수록 오차도 크게 나서, 두 차원이 똑같이 standard deviation 한 개만큼 틀려도 오차의 제곱은 $45^2$ 과
        $9^2$ 으로 25 배 차이가 난다. 그래서 loss 를 줄이는 일이 거의 큰 차원 맞추기가 되고, 칸마다 평균을 빼고 standard deviation 으로 나누는
        standardization 이 필요하다. 작은 차원은 오히려 묻히는 쪽이다. 값의 크기는 MSE 에 그대로 들어간다. 제곱의 평균은 음수가 될 수
        없다.
    - question: |
        학습 코드가 dataset 의 평균과 standard deviation 으로 action 을 standardization 해서 policy 를 학습했다. 로봇에서 실행할 때 policy 의
        출력은 어떻게 다뤄야 하는가?
      choices:
        - 'standardization 한 값 그대로 servo 에 목표로 보낸다'
        - '실행하며 새로 잰 평균과 standard deviation 으로 다시 standardization 한다'
        - 'standardization 은 학습을 빠르게 하려는 처리라서 실행 때는 신경 쓰지 않아도 된다'
        - '학습 때 쓴 같은 평균과 standard deviation 으로 되돌려 원래 단위의 목표로 보낸다'
      answer: 3
      explanation: |
        policy 는 standardization 한 공간에서 action 을 배웠으므로, 출력도 그 공간의 값이다. 학습 때와 같은 통계로 standard deviation 을
        곱하고 평균을 더해 원래 단위로 되돌려야 servo 가 맞는 목표를 받는다. 그대로 보내면 0 근처의 작은 숫자가 목표가 된다. 실행 중에
        새로 잰 통계는 학습 때의 통계와 달라서 출력의 뜻이 바뀐다. 되돌리지 않으면 학습이 잘 됐어도 엉뚱한 자세로 간다.

- topic: end-to-end
  title: 사진에서 관절 각도로 바로 가는 end-to-end
  variants:
    - question: |
        카메라 한 대로는 pixel 하나가 얼마나 먼 곳인지 알 수 없다. 그런데 작업대 위에 고정한 카메라 사진으로 3D 좌표 없이 관절 각도를 바로
        배우는 end-to-end policy 가 통하는 이유는 무엇인가?
      choices:
        - 'network 가 내부에서 depth 를 정확한 cm 단위로 계산해 3D 좌표를 대신하기 때문이다'
        - '사진의 RGB 값에 pixel 마다 카메라까지의 거리 정보가 함께 들어 있기 때문이다'
        - '물체가 늘 책상 위에 있어, 고정 카메라의 pixel 하나가 책상 위 자리 하나와 짝지어지기 때문이다'
        - '관절 각도 입력이 팔 끝의 위치를 알려 주므로 물체까지의 거리도 알 수 있기 때문이다'
      answer: 2
      explanation: |
        pixel 하나에 찍히는 점은 카메라에서 뻗은 직선 위 어디든 될 수 있지만, 물체가 책상 높이에만 있으면 그 직선이 책상과 만나는 점은
        하나뿐이다. 그래서 "이 pixel 이면 이 관절 각도" 를 시연에서 배울 수 있다. network 가 depth 를 따로 계산하는 것은 아니다. RGB 에는
        거리가 들어 있지 않다. 관절 각도는 팔의 자세일 뿐 물체까지의 거리를 알려 주지 않는다.
    - question: |
        고정 카메라와 손목 카메라로 컵 집기 end-to-end policy 를 학습한 뒤, 누군가 고정 카메라를 살짝 건드려 방향이 바뀌었다. 컵은 시연 때와
        같은 자리에 있다면 어떤 일이 생기는가?
      choices:
        - '3D 좌표를 쓰지 않는 policy 라서 카메라 위치가 바뀌어도 결과에 영향이 없다'
        - 'policy 가 실행하면서 손목 카메라와 비교해 고정 카메라의 새 위치를 스스로 calibration 한다'
        - '손목 카메라가 컵을 보고 있으므로 고정 카메라는 처음부터 쓰이지 않는다'
        - '같은 자리의 컵이 다른 pixel 에 보여, policy 가 다른 자리에 맞는 관절 각도를 낸다'
      answer: 3
      explanation: |
        policy 가 배운 것은 "사진의 이 자리에 컵이 보이면 관절을 이만큼" 이라는 짝이라서, 카메라가 움직이면 같은 자리의 컵이 다른 pixel
        에 찍히고 policy 는 그 pixel 에 맞는 다른 자리의 각도를 낸다. 3D 좌표를 쓰지 않는 end-to-end policy 에서는 카메라를 고정하는 것이
        조건이다. 실행 중에 스스로 calibration 하는 기능은 없다. 고정 카메라는 컵이 책상 어디에 있는지를 맡으므로 쓰이지 않는 것이 아니다.
    - question: |
        시연할 때 컵을 늘 책상의 왼쪽 절반에만 놓았더니, 실행 때 오른쪽 끝에 놓인 컵을 집지 못했다. 가장 알맞은 설명은 무엇인가?
      choices:
        - 'network 는 시연 사이를 메우는 것은 잘하지만 시연 범위 바깥으로 늘려 가는 것은 보장하지 못한다'
        - 'end-to-end policy 는 컵 집는 법을 이해했을 것이므로, 아직 학습이 덜 된 것이다'
        - 'policy 는 시연 범위 밖에서도 규칙을 그대로 늘려 쓰므로, 카메라 고장이 원인이다'
        - '오른쪽 끝은 로봇 팔이 닿지 않는 곳이라 어떤 policy 로도 집을 수 없다'
      answer: 0
      explanation: |
        policy 가 배운 것은 시연 장면과 관절 각도 사이의 짝이라, 시연이 덮지 않은 자리에서는 무엇을 낼지 알 수 없다. 해결책은 시연을 더
        넓게 모으는 것이다. policy 가 컵 집는 법을 이해했다고 보는 것은 흔한 오해다. network 는 직선이 아니어서 시연 바깥에서 규칙을
        그대로 늘려 쓴다는 보장이 없으므로, 카메라 고장을 원인으로 볼 근거도 없다. 오른쪽 끝에 팔이 닿지 않는다는 조건은 문제에 없다.

- topic: multimodal
  title: 정답이 여럿인 시연과 평균
  variants:
    - question: |
        장애물 앞에서 expert 가 시연의 절반은 왼쪽으로, 절반은 오른쪽으로 크게 꺾어 피했고 관측은 모두 같다. 핸들 각도 하나를 내는 policy 를 MSE
        로 학습하면 이 장면에서 무엇을 내기 쉬운가?
      choices:
        - '시연에서 먼저 나온 쪽인 왼쪽으로 피하는 각도'
        - '마지막에 배운 쪽인 오른쪽으로 피하는 각도'
        - '실행할 때마다 왼쪽과 오른쪽 중 하나를 무작위로 골라 피하는 각도'
        - '두 정답의 평균인, 거의 꺾지 않고 장애물로 곧장 가는 각도'
      answer: 3
      explanation: |
        같은 관측에 정답이 여럿이면 MSE 를 가장 작게 만드는 값 하나는 정답들의 평균이다. 왼쪽과 오른쪽 각도의 평균은 거의 0 이라 장애물로 간다.
        MSE 는 시연의 순서와 상관없이 모든 시연의 오차를 더한다. 왼쪽으로 피하는 각도는 오른쪽 시연과의 오차가 커서 MSE 가 평균보다 오히려 크다.
        오른쪽으로 피하는 각도도 같은 이유로 왼쪽 시연과의 오차가 커서 MSE 가 크다. 숫자 하나를 내는 policy 에는 둘 중 하나를 무작위로 고르는
        장치가 없다.
    - question: |
        왼쪽·오른쪽으로 갈라지는 시연 때문에 policy 가 평균 action 을 낸다. 같은 비율로 시연을 열 배 더 모으면 해결될까?
      choices:
        - '해결된다. 데이터가 많으면 MSE 가 평균 대신 가장 흔한 값을 고른다'
        - '해결되지 않는다. 숫자 하나만 내는 policy 를 MSE 로 학습하는 한 평균이 나온다'
        - '해결된다. 데이터가 많으면 policy 가 두 action 을 함께 배워 두 값을 동시에 낸다'
        - '오히려 나빠진다. 데이터가 많을수록 평균이 0 에서 멀어져 더 크게 빗나간다'
      answer: 1
      explanation: |
        같은 비율로 늘리면 정답들의 평균은 변하지 않으므로 MSE 로 학습한 policy 의 출력도 그대로다. MSE 는 데이터 양과 관계없이 평균을
        향한다. 숫자 하나를 내는 policy 는 두 값을 동시에 낼 수 없다. 비율이 같으면 평균도 같아서 나빠질 이유도 없다.
    - question: |
        '이 모델은 카메라 영상과 음성 명령을 함께 받는 multimodal 모델이다' 와 '이 시연 데이터는 multimodal 이라 MSE 로 학습하면 안 된다' 에서
        multimodal 은 각각 무슨 뜻인가?
      choices:
        - '둘 다 카메라·음성처럼 입력의 종류가 여럿이라는 뜻이다'
        - '앞은 정답 action 이 여럿이라는 뜻이고, 뒤는 입력의 종류가 여럿이라는 뜻이다'
        - '앞은 입력의 종류가 여럿이라는 뜻이고, 뒤는 action 분포의 봉우리가 여럿이라는 뜻이다'
        - '둘 다 같은 관측에 정답 action 이 여럿이라 분포의 봉우리가 여럿이라는 뜻이다'
      answer: 2
      explanation: |
        "multimodal 모델" 의 modal 은 시각·언어 같은 정보의 종류(modality)에서 와서, 영상과 음성이라는 두 종류의 입력을 받는다는 뜻이다.
        "multimodal 시연" 의 modal 은 통계의 mode(가장 자주 나온 값)에서 와서, action 분포에 봉우리가 여럿이라는 뜻이다. 둘 다 입력의
        종류가 여럿이라는 보기가 틀린 것은 시연 데이터 쪽은 입력이 아니라 정답 action 의 봉우리를 말하기 때문이다. 앞을 정답 action 의
        뜻으로 읽고 뒤를 입력 종류의 뜻으로 읽은 보기는 두 뜻을 뒤바꿨다. 둘 다 정답 action 이 여럿이라는 보기가 틀린 것은 영상과 음성
        명령을 받는 모델 쪽은 입력의 종류를 말하기 때문이다.

- topic: mode-selection
  title: 평균을 피하는 방법
  variants:
    - question: |
        같은 장면에서 시연의 절반은 왼쪽, 절반은 오른쪽으로 장애물을 피했다. action 범위를 여러 구간으로 나눠 구간마다 확률을 내는 policy 를
        학습하고, 실행 때 확률이 가장 높은 구간을 고르면 어떻게 되는가?
      choices:
        - '왼쪽 구간이나 오른쪽 구간 중 하나를 골라 장애물을 피한다'
        - '두 구간의 가운데 구간을 골라 장애물로 간다'
        - '두 구간의 각도를 평균한 값을 action 으로 내서 곧장 간다'
        - '분류는 연속 action 을 다룰 수 없어 학습이 되지 않는다'
      answer: 0
      explanation: |
        구간마다 확률을 내는 policy 는 왼쪽 구간과 오른쪽 구간에 높은 확률을 함께 줄 수 있고, 가장 높은 구간을 고르면 둘 중 하나가 나온다.
        시연이 없던 가운데 구간은 확률이 낮아 고르지 않는다. 구간을 고르는 것이지 각도를 평균하는 것이 아니다. 연속 action 도 구간으로
        나누면 분류로 학습할 수 있고, RT-1 이 action 범위를 256 개 구간으로 나눠 이렇게 학습한다.
    - question: |
        ACT 는 학습할 때 시연마다 다른 움직임의 방식(style)을 CVAE 의 latent $z$ 로 받는다. 실행할 때 $z$ 를 어떻게 두고, 그 결과 정반대로 반반
        갈린 시연에서 무엇을 기대할 수 있는가?
      choices:
        - '실행할 때마다 $z$ 를 prior 에서 무작위로 뽑아, 두 방식 중 하나를 골라 움직인다'
        - '$z$ 를 시연 중 가장 흔한 style 값으로 고정해, 늘 시연이 많은 쪽을 고른다'
        - '$z$ 를 0 으로 고정해 같은 관측에 같은 action 을 내고, 그것이 봉우리 하나라는 보장은 없다'
        - '$z$ 는 학습에도 실행에도 영향이 없어서, CVAE 를 빼고 학습한 policy 와 결과가 늘 같다'
      answer: 2
      explanation: |
        ACT 논문은 실행할 때 $z$ 를 prior 의 평균인 0 으로 둔다. 그래서 같은 관측에 늘 같은 움직임 하나를 내고, 시연이 정반대로 반반
        갈리면 그 움직임이 둘 중 하나라는 보장이 없다. 실행할 때마다 $z$ 를 무작위로 뽑는 것은 ACT 의 실행 방식이 아니다. $z$ 를 가장
        흔한 style 값으로 고정하는 방식도 ACT 에는 없다. $z$ 는 학습 때 갈라지는 시연이 평균으로 뭉개지지 않게 해 주므로 영향이 없지
        않은데, 논문에서 CVAE 를 빼면 사람 시연의 성공률이 35.3% 에서 2% 로 떨어졌다.
    - question: |
        Diffusion Policy 가 정답이 여럿인 시연에서 평균 대신 봉우리 하나에 해당하는 action 을 내는 이유는 무엇인가?
      choices:
        - 'MSE 대신 L1 loss 를 써서, 평균 대신 시연 하나에 해당하는 중앙값을 내기 때문이다'
        - '무작위 숫자에서 출발해 조금씩 고쳐 가며, 출발점에 따라 봉우리 하나에 도착하기 때문이다'
        - '학습 전에 시연이 많은 쪽 봉우리만 남기도록 데이터를 걸러 정답을 하나로 만들기 때문이다'
        - '실행할 때 latent 를 0 으로 고정해, 같은 관측에서 늘 같은 봉우리를 고르기 때문이다'
      answer: 1
      explanation: |
        Diffusion Policy 는 무작위 숫자에서 출발해 여러 번 고쳐 가며 action 을 만들고, 출발점에 따라 서로 다른 봉우리에 도착한다. 논문의
        Push-T 실험에서 policy 는 왼쪽과 오른쪽 두 방식을 모두 배우고 rollout 한 번 안에서는 한쪽으로만 갔다. L1 loss 로 숫자 하나를 내는
        policy 도 반반 갈린 시연에서는 두 봉우리 사이 값을 낼 수 있다. Diffusion Policy 는 학습 전에 데이터를 거르지 않는다. latent 를
        0 으로 고정하는 것은 ACT 의 실행 방식이다.
