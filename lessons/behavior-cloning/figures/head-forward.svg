<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>입력 (0.5, 1.0, 2.0) 이 hidden 두 개와 출력 하나를 거쳐 2 가 되고, 정답 2.5 와의 오차는 −0.5 다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="94.0" y1="80.0" x2="240.0" y2="90.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="94.0" y1="80.0" x2="240.0" y2="230.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="94.0" y1="160.0" x2="240.0" y2="90.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="94.0" y1="160.0" x2="240.0" y2="230.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="94.0" y1="240.0" x2="240.0" y2="90.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="94.0" y1="240.0" x2="240.0" y2="230.0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="70.0" cy="80.0" r="24" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="70.0" y="86.0" fill="#e2e8f0" font-size="15" text-anchor="middle">0.5</text>
  <text x="70.0" y="122.0" fill="#94a3b8" font-size="12" text-anchor="middle">feature 1</text>
  <circle cx="70.0" cy="160.0" r="24" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="70.0" y="166.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1.0</text>
  <text x="70.0" y="202.0" fill="#94a3b8" font-size="12" text-anchor="middle">feature 2</text>
  <circle cx="70.0" cy="240.0" r="24" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="70.0" y="246.0" fill="#e2e8f0" font-size="15" text-anchor="middle">2.0</text>
  <text x="70.0" y="282.0" fill="#94a3b8" font-size="12" text-anchor="middle">관절</text>
  <circle cx="270.0" cy="90.0" r="30" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="270.0" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">hidden 1</text>
  <text x="270.0" y="48.0" fill="#94a3b8" font-size="12" text-anchor="middle">w = (1, −1, 0.5), b = 0</text>
  <text x="270.0" y="140.0" fill="#7fc4a2" font-size="12" text-anchor="middle">z = 0.5 → ReLU → 0.5</text>
  <line x1="300.0" y1="90.0" x2="432.0" y2="142.5" stroke="#475569" stroke-width="1.5"/>
  <circle cx="270.0" cy="230.0" r="30" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="270.0" y="235.0" fill="#e2e8f0" font-size="12" text-anchor="middle">hidden 2</text>
  <text x="270.0" y="188.0" fill="#94a3b8" font-size="12" text-anchor="middle">w = (2, −1, −0.5), b = 0</text>
  <text x="270.0" y="280.0" fill="#d88b8b" font-size="12" text-anchor="middle">z = −1 → ReLU → 0</text>
  <line x1="300.0" y1="230.0" x2="432.0" y2="177.5" stroke="#475569" stroke-width="1.5"/>
  <circle cx="460.0" cy="160.0" r="28" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="460.0" y="166.0" fill="#e2e8f0" font-size="16" text-anchor="middle">2</text>
  <text x="460.0" y="115.0" fill="#94a3b8" font-size="12" text-anchor="middle">w = (2, 3), b = 1</text>
  <text x="460.0" y="211.0" fill="#7cb4d8" font-size="12" text-anchor="middle">2×0.5 + 3×0 + 1 = 2</text>
  <text x="460.0" y="245.0" fill="#d6aa62" font-size="13" text-anchor="middle">정답 2.5</text>
  <text x="460.0" y="267.0" fill="#e2e8f0" font-size="13" text-anchor="middle">오차 2 − 2.5 = −0.5</text>
  <text x="460.0" y="287.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 0.25</text>
</svg>
