<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>behavior cloning 의 세 단계: 시연 기록, 학습, rollout</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="598" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="30.0" width="170.0" height="92.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="105.0" y="58.0" fill="#e2e8f0" font-size="16" text-anchor="middle">① 시연 기록</text>
  <text x="105.0" y="84.0" fill="#94a3b8" font-size="13" text-anchor="middle">expert 가 운전하며</text>
  <text x="105.0" y="104.0" fill="#94a3b8" font-size="13" text-anchor="middle">step 마다 (o, a) 저장</text>
  <rect x="215.0" y="30.0" width="170.0" height="92.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="300.0" y="58.0" fill="#e2e8f0" font-size="16" text-anchor="middle">② 학습</text>
  <text x="300.0" y="84.0" fill="#94a3b8" font-size="13" text-anchor="middle">쌍을 (입력, 정답) 으로</text>
  <text x="300.0" y="104.0" fill="#94a3b8" font-size="13" text-anchor="middle">MSE 를 줄인다</text>
  <rect x="410.0" y="30.0" width="170.0" height="92.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="495.0" y="58.0" fill="#e2e8f0" font-size="16" text-anchor="middle">③ rollout</text>
  <text x="495.0" y="84.0" fill="#94a3b8" font-size="13" text-anchor="middle">policy 가 센서 값만</text>
  <text x="495.0" y="104.0" fill="#94a3b8" font-size="13" text-anchor="middle">보고 운전한다</text>
  <line x1="192.0" y1="76.0" x2="212.0" y2="76.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="387.0" y1="76.0" x2="407.0" y2="76.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="105.0" y="150.0" fill="#f59e0b" font-size="12" text-anchor="middle">관측 (d_L, d_R) → action</text>
  <text x="80.0" y="174.0" fill="#e2e8f0" font-size="13" text-anchor="middle">(1.75, 1.75)</text>
  <text x="140.0" y="174.0" fill="#e2e8f0" font-size="13" text-anchor="start">→ 0°</text>
  <text x="80.0" y="196.0" fill="#e2e8f0" font-size="13" text-anchor="middle">(1.25, 2.25)</text>
  <text x="140.0" y="196.0" fill="#e2e8f0" font-size="13" text-anchor="start">→ +4°</text>
  <text x="80.0" y="218.0" fill="#e2e8f0" font-size="13" text-anchor="middle">(1.50, 2.00)</text>
  <text x="140.0" y="218.0" fill="#e2e8f0" font-size="13" text-anchor="start">→ +2°</text>
  <text x="300.0" y="158.0" fill="#38bdf8" font-size="13" text-anchor="middle">L = (1/N) Σ (π_θ(o_i) − a_i)²</text>
  <text x="300.0" y="184.0" fill="#94a3b8" font-size="12" text-anchor="middle">gradient 로 θ 를 고친다</text>
  <text x="495.0" y="158.0" fill="#34d399" font-size="14" text-anchor="middle">â = π_θ(o)</text>
  <text x="495.0" y="184.0" fill="#94a3b8" font-size="12" text-anchor="middle">정답 a 는 없다</text>
  <text x="300.0" y="232.0" fill="#94a3b8" font-size="12" text-anchor="middle">①·② 는 expert 의 기록만 쓰고, ③ 은 policy 가 스스로 만든 상황을 만난다</text>
</svg>
