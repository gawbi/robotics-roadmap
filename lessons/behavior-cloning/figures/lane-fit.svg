<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 시연 쌍 위의 policy 직선이 step 0, 1, 2 를 거쳐 1000 step 뒤 a = 4x 에 다가간다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="598" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="40.0" width="330.0" height="260.0" rx="0" fill="#0e1628"/>
  <line x1="70.0" y1="300.0" x2="400.0" y2="300.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="300.0" x2="70.0" y2="40.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="318.0" fill="#64748b" font-size="13" text-anchor="middle">0</text>
  <text x="202.0" y="318.0" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="334.0" y="318.0" fill="#64748b" font-size="13" text-anchor="middle">2</text>
  <text x="62.0" y="305.0" fill="#64748b" font-size="13" text-anchor="end">0</text>
  <text x="62.0" y="201.0" fill="#64748b" font-size="13" text-anchor="end">4</text>
  <text x="62.0" y="97.0" fill="#64748b" font-size="13" text-anchor="end">8</text>
  <text x="400.0" y="332.0" fill="#94a3b8" font-size="13" text-anchor="end">x = d_R − d_L</text>
  <text x="62.0" y="32.0" fill="#94a3b8" font-size="13" text-anchor="start">핸들 각도 (도)</text>
  <line x1="70.0" y1="300.0" x2="400.0" y2="300.0" stroke="#64748b" stroke-width="2.5"/>
  <line x1="70.0" y1="284.4" x2="400.0" y2="219.4" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="70.0" y1="274.3" x2="400.0" y2="166.4" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="70.0" y1="300.0" x2="400.0" y2="40.0" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="202.0" cy="196.0" r="7" fill="#f59e0b"/>
  <text x="214.0" y="214.0" fill="#f59e0b" font-size="13" text-anchor="start">(1, 4)</text>
  <circle cx="334.0" cy="92.0" r="7" fill="#f59e0b"/>
  <text x="346.0" y="110.0" fill="#f59e0b" font-size="13" text-anchor="start">(2, 8)</text>
  <circle cx="430.0" cy="65.0" r="6" fill="#f59e0b"/>
  <text x="444.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start">시연 쌍 (x, a)</text>
  <line x1="422.0" y1="93.0" x2="440.0" y2="93.0" stroke="#64748b" stroke-width="2.5"/>
  <text x="444.0" y="98.0" fill="#e2e8f0" font-size="13" text-anchor="start">step 0: a = 0</text>
  <line x1="422.0" y1="121.0" x2="440.0" y2="121.0" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="444.0" y="126.0" fill="#e2e8f0" font-size="13" text-anchor="start">step 1: a = 1x + 0.6</text>
  <line x1="422.0" y1="149.0" x2="440.0" y2="149.0" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="444.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="start">step 2: a = 1.66x + 0.99</text>
  <line x1="422.0" y1="177.0" x2="440.0" y2="177.0" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="444.0" y="182.0" fill="#e2e8f0" font-size="13" text-anchor="start">expert: a = 4x</text>
  <text x="430.0" y="216.0" fill="#94a3b8" font-size="12" text-anchor="start">1000 step 뒤 w = 3.9993,</text>
  <text x="430.0" y="234.0" fill="#94a3b8" font-size="12" text-anchor="start">b = 0.0012 로 초록 선과 겹친다</text>
</svg>
