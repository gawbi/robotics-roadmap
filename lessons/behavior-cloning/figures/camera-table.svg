<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>고정 카메라의 직선은 책상과 한 점씩에서 만나고, 손목 카메라에는 컵이 크게 보인다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="20.0" width="300.0" height="260.0" rx="8" fill="#0e1628"/>
  <text x="30.0" y="44.0" fill="#94a3b8" font-size="13" text-anchor="start">옆에서 본 고정 카메라</text>
  <rect x="44.0" y="68.0" width="32.0" height="24.0" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60.0" y="60.0" fill="#94a3b8" font-size="11" text-anchor="middle">카메라</text>
  <line x1="30.0" y1="220.0" x2="310.0" y2="220.0" stroke="#475569" stroke-width="3"/>
  <text x="36.0" y="212.0" fill="#94a3b8" font-size="12" text-anchor="start">책상</text>
  <line x1="70.0" y1="88.0" x2="130.0" y2="220.0" stroke="#38bdf8" stroke-width="1.8"/>
  <circle cx="130.0" cy="220.0" r="5" fill="#38bdf8"/>
  <text x="130.0" y="242.0" fill="#38bdf8" font-size="12" text-anchor="middle">u = 100</text>
  <line x1="70.0" y1="88.0" x2="200.0" y2="220.0" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="200.0" cy="220.0" r="5" fill="#34d399"/>
  <text x="200.0" y="242.0" fill="#34d399" font-size="12" text-anchor="middle">u = 200</text>
  <line x1="70.0" y1="88.0" x2="270.0" y2="220.0" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="270.0" cy="220.0" r="5" fill="#f59e0b"/>
  <text x="270.0" y="242.0" fill="#f59e0b" font-size="12" text-anchor="middle">u = 300</text>
  <text x="170.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">직선 하나가 책상과 만나는 점은 하나</text>
  <rect x="340.0" y="20.0" width="240.0" height="260.0" rx="8" fill="#0e1628"/>
  <text x="350.0" y="44.0" fill="#94a3b8" font-size="13" text-anchor="start">손목 카메라 사진</text>
  <rect x="370.0" y="60.0" width="180.0" height="150.0" rx="2" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <line x1="460.0" y1="60.0" x2="460.0" y2="210.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="370.0" y1="135.0" x2="550.0" y2="135.0" stroke="#64748b" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="442.0" cy="130.0" r="34" fill="#f87171"/>
  <circle cx="442" cy="130" r="34" fill="#f87171" fill-opacity="0.35" stroke="#f87171" stroke-width="2"/>
  <text x="442.0" y="136.0" fill="#e2e8f0" font-size="14" text-anchor="middle">컵</text>
  <rect x="392.0" y="188.0" width="16.0" height="22.0" rx="2" fill="#64748b"/>
  <rect x="512.0" y="188.0" width="16.0" height="22.0" rx="2" fill="#64748b"/>
  <line x1="460.0" y1="100.0" x2="444.0" y2="100.0" stroke="#e2e8f0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480.0" y="76.0" fill="#e2e8f0" font-size="11" text-anchor="start">가운데에서</text>
  <text x="480.0" y="90.0" fill="#e2e8f0" font-size="11" text-anchor="start">벗어난 정도</text>
  <text x="460.0" y="234.0" fill="#94a3b8" font-size="12" text-anchor="middle">컵이 크게 보여 마지막 몇 cm 를</text>
  <text x="460.0" y="252.0" fill="#94a3b8" font-size="12" text-anchor="middle">맞추는 데 쓴다</text>
</svg>
