<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽으로 0.5 m 치우친 차와 거리 센서 두 개. expert 는 정확한 위치로 정답을, policy 는 센서 값으로 예측을 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="598" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30.0" y="40.0" width="540.0" height="120.0" rx="0" fill="#0e1628"/>
  <line x1="30.0" y1="40.0" x2="570.0" y2="40.0" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="30.0" y1="160.0" x2="570.0" y2="160.0" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="30.0" y1="100.0" x2="570.0" y2="100.0" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <text x="565.0" y="33.0" fill="#94a3b8" font-size="12" text-anchor="end">왼쪽 차선 경계</text>
  <text x="565.0" y="178.0" fill="#94a3b8" font-size="12" text-anchor="end">오른쪽 차선 경계</text>
  <text x="565.0" y="95.0" fill="#64748b" font-size="12" text-anchor="end">차선 가운데</text>
  <rect x="150.0" y="69.9" width="60.0" height="26.0" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="212.0" y1="82.9" x2="236.0" y2="82.9" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180.0" y="87.9" fill="#e2e8f0" font-size="13" text-anchor="middle">차</text>
  <line x1="120.0" y1="80.9" x2="120.0" y2="42.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="120.0" y1="84.9" x2="120.0" y2="158.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="112.0" y="66.4" fill="#38bdf8" font-size="13" text-anchor="end">d_L = 1.25 m</text>
  <text x="112.0" y="126.4" fill="#38bdf8" font-size="13" text-anchor="end">d_R = 2.25 m</text>
  <line x1="260.0" y1="82.9" x2="260.0" y2="100.0" stroke="#f59e0b" stroke-width="2"/>
  <text x="268.0" y="96.4" fill="#f59e0b" font-size="12" text-anchor="start">가운데에서 왼쪽으로 0.5 m</text>
  <text x="30.0" y="210.0" fill="#f59e0b" font-size="13" text-anchor="start">expert — 정확한 위치를 안다</text>
  <rect x="30.0" y="220.0" width="200.0" height="46.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="130.0" y="239.5" fill="#e2e8f0" font-size="14" text-anchor="middle">정확한 위치</text>
  <text x="130.0" y="256.5" fill="#94a3b8" font-size="12" text-anchor="middle">왼쪽으로 0.5 m</text>
  <line x1="232.0" y1="243.0" x2="258.0" y2="243.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="262.0" y="220.0" width="140.0" height="46.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="332.0" y="239.5" fill="#e2e8f0" font-size="14" text-anchor="middle">expert 의 규칙</text>
  <text x="332.0" y="256.5" fill="#94a3b8" font-size="12" text-anchor="middle">0.5 m 마다 4°</text>
  <line x1="404.0" y1="243.0" x2="430.0" y2="243.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.0" y="220.0" width="136.0" height="46.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="502.0" y="248.0" fill="#e2e8f0" font-size="14" text-anchor="middle">정답 a = +4°</text>
  <text x="30.0" y="296.0" fill="#38bdf8" font-size="13" text-anchor="start">policy — 센서 값만 본다</text>
  <rect x="30.0" y="306.0" width="200.0" height="46.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="130.0" y="325.5" fill="#e2e8f0" font-size="14" text-anchor="middle">x = d_R − d_L</text>
  <text x="130.0" y="342.5" fill="#94a3b8" font-size="12" text-anchor="middle">2.25 − 1.25 = 1</text>
  <line x1="232.0" y1="329.0" x2="258.0" y2="329.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="262.0" y="306.0" width="140.0" height="46.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="332.0" y="325.5" fill="#e2e8f0" font-size="14" text-anchor="middle">policy</text>
  <text x="332.0" y="342.5" fill="#94a3b8" font-size="12" text-anchor="middle">â = wx + b</text>
  <line x1="404.0" y1="329.0" x2="430.0" y2="329.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434.0" y="306.0" width="136.0" height="46.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="502.0" y="334.0" fill="#e2e8f0" font-size="14" text-anchor="middle">예측 â</text>
  <line x1="502.0" y1="268.0" x2="502.0" y2="304.0" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="512.0" y="291.0" fill="#34d399" font-size="12" text-anchor="start">loss (â − a)²</text>
</svg>
