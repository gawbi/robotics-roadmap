<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사진을 pretrained encoder 로 512 개로 요약하고 관절 7 개와 이어 붙여 MLP head 가 목표 각도 7 개를 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="120.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80.0" y="65.0" fill="#e2e8f0" font-size="14" text-anchor="middle">사진</text>
  <text x="80.0" y="81.0" fill="#94a3b8" font-size="11" text-anchor="middle">224×224×3 = 150,528</text>
  <line x1="142.0" y1="68.0" x2="164.0" y2="68.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="168.0" y="40.0" width="120.0" height="56.0" rx="8" fill="#1a2234" stroke="#64748b" stroke-width="2"/>
  <text x="228.0" y="63.0" fill="#e2e8f0" font-size="13" text-anchor="middle">pretrained</text>
  <text x="228.0" y="82.0" fill="#94a3b8" font-size="12" text-anchor="middle">encoder (freeze)</text>
  <line x1="290.0" y1="68.0" x2="312.0" y2="68.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="316.0" y="44.0" width="76.0" height="48.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="354.0" y="64.5" fill="#e2e8f0" font-size="14" text-anchor="middle">feature</text>
  <text x="354.0" y="81.5" fill="#94a3b8" font-size="12" text-anchor="middle">512 개</text>
  <rect x="316.0" y="112.0" width="76.0" height="48.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="354.0" y="132.5" fill="#e2e8f0" font-size="14" text-anchor="middle">관절 각도</text>
  <text x="354.0" y="149.5" fill="#94a3b8" font-size="12" text-anchor="middle">7 개</text>
  <line x1="394.0" y1="68.0" x2="418.0" y2="100.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="394.0" y1="136.0" x2="418.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="422.0" y="86.0" width="68.0" height="48.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="456.0" y="106.5" fill="#e2e8f0" font-size="14" text-anchor="middle">이어 붙임</text>
  <text x="456.0" y="123.5" fill="#94a3b8" font-size="12" text-anchor="middle">519 개</text>
  <line x1="456.0" y1="136.0" x2="456.0" y2="176.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="386.0" y="180.0" width="140.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="456.0" y="204.0" fill="#e2e8f0" font-size="14" text-anchor="middle">MLP head</text>
  <text x="456.0" y="224.0" fill="#38bdf8" font-size="13" text-anchor="middle">519 → 256 → 7</text>
  <line x1="386.0" y1="210.0" x2="336.0" y2="210.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214.0" y="186.0" width="118.0" height="48.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="273.0" y="206.5" fill="#e2e8f0" font-size="14" text-anchor="middle">출력 â</text>
  <text x="273.0" y="223.5" fill="#94a3b8" font-size="12" text-anchor="middle">목표 각도 7 개</text>
  <rect x="30.0" y="186.0" width="118.0" height="48.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="89.0" y="206.5" fill="#e2e8f0" font-size="14" text-anchor="middle">시연의 a</text>
  <text x="89.0" y="223.5" fill="#94a3b8" font-size="12" text-anchor="middle">목표 각도 7 개</text>
  <line x1="150.0" y1="210.0" x2="212.0" y2="210.0" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="181.0" y="256.0" fill="#34d399" font-size="14" text-anchor="middle">MSE</text>
  <text x="181.0" y="274.0" fill="#34d399" font-size="12" text-anchor="middle">(1/7) Σ (â_j − a_j)²</text>
  <text x="300.0" y="314.0" fill="#94a3b8" font-size="12" text-anchor="middle">회색 상자는 학습 중 바뀌지 않고, 파란 head 의 parameter 134,919 개만 시연으로 고친다</text>
</svg>
