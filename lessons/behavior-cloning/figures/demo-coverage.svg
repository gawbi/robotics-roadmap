  <polygon points="200,70 400,70 400,190 200,190" fill="#d6aa62" fill-opacity="0.08" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="220.0" cy="90.0" r="8" fill="#d6aa62"/>
  <circle cx="380.0" cy="90.0" r="8" fill="#d6aa62"/>
  <circle cx="300.0" cy="130.0" r="8" fill="#d6aa62"/>
  <circle cx="220.0" cy="170.0" r="8" fill="#d6aa62"/>
