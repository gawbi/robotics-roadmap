<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>모듈 파이프라인은 pixel, 거리, 3D 좌표, inverse kinematics 를 거치고 end-to-end 는 network 하나로 관절 각도를 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="598" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="32.0" fill="#d6aa62" font-size="13" text-anchor="start">모듈 파이프라인 — 단계마다 사람이 계산을 짠다</text>
  <rect x="20.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="62.0" y="76.5" fill="#e2e8f0" font-size="13" text-anchor="middle">사진</text>
  <line x1="105.0" y1="72.0" x2="115.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="116.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="158.0" y="68.5" fill="#e2e8f0" font-size="13" text-anchor="middle">물체 찾기</text>
  <text x="158.0" y="84.5" fill="#94a3b8" font-size="11" text-anchor="middle">pixel (u, v)</text>
  <line x1="201.0" y1="72.0" x2="211.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="212.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="254.0" y="68.5" fill="#e2e8f0" font-size="13" text-anchor="middle">depth 카메라</text>
  <text x="254.0" y="84.5" fill="#94a3b8" font-size="11" text-anchor="middle">거리</text>
  <line x1="297.0" y1="72.0" x2="307.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="308.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="350.0" y="68.5" fill="#e2e8f0" font-size="13" text-anchor="middle">3D 좌표</text>
  <text x="350.0" y="84.5" fill="#94a3b8" font-size="11" text-anchor="middle">(X, Y, Z)</text>
  <line x1="393.0" y1="72.0" x2="403.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="404.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="446.0" y="68.5" fill="#e2e8f0" font-size="13" text-anchor="middle">inverse</text>
  <text x="446.0" y="84.5" fill="#94a3b8" font-size="11" text-anchor="middle">kinematics</text>
  <line x1="489.0" y1="72.0" x2="499.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500.0" y="44.0" width="84.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="542.0" y="76.5" fill="#e2e8f0" font-size="13" text-anchor="middle">관절 각도</text>
  <text x="20.0" y="140.0" fill="#7cb4d8" font-size="13" text-anchor="start">end-to-end — network 하나가 시연에서 배운다</text>
  <rect x="20.0" y="152.0" width="132.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="86.0" y="176.5" fill="#e2e8f0" font-size="14" text-anchor="middle">사진</text>
  <text x="86.0" y="193.5" fill="#94a3b8" font-size="12" text-anchor="middle">+ 관절 각도</text>
  <line x1="154.0" y1="180.0" x2="210.0" y2="180.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214.0" y="152.0" width="200.0" height="56.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="314.0" y="178.0" fill="#e2e8f0" font-size="14" text-anchor="middle">network 하나</text>
  <text x="314.0" y="198.0" fill="#94a3b8" font-size="12" text-anchor="middle">(encoder + action head)</text>
  <line x1="416.0" y1="180.0" x2="470.0" y2="180.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="474.0" y="152.0" width="106.0" height="56.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="527.0" y="185.0" fill="#e2e8f0" font-size="14" text-anchor="middle">관절 각도</text>
  <text x="300.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="middle">아랫줄에는 거리도 3D 좌표도 없다</text>
</svg>
