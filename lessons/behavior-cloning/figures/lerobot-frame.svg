<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 324" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>lerobot/svla_so101_pickplace 의 frame 하나. 카메라 up 과 side 의 사진(각각 480×640×3)과 관절 5 개와 집게의 위치 6 개가 관측이고, 같은 여섯 곳의 목표 위치 6 개가 action 이다. 30 fps 로 episode 50 개, frame 11,939 개라 (관측, action) 쌍도 11,939 개다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker></defs>
  <rect x="1" y="1" width="598" height="322" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="36" fill="#94a3b8" font-size="14" text-anchor="start">frame 하나 (lerobot/svla_so101_pickplace)</text>
  <rect x="20" y="50" width="330" height="200" rx="10" fill="none" stroke="#7cb4d8" stroke-dasharray="5 4"/>
  <text x="36" y="72" fill="#7cb4d8" font-size="15" text-anchor="start">관측 o</text>
  <rect x="36" y="86" width="140" height="64" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="106" y="112" fill="#e2e8f0" font-size="15" text-anchor="middle">카메라 up</text>
  <text x="106" y="134" fill="#94a3b8" font-size="13" text-anchor="middle">480×640×3</text>
  <rect x="194" y="86" width="140" height="64" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="264" y="112" fill="#e2e8f0" font-size="15" text-anchor="middle">카메라 side</text>
  <text x="264" y="134" fill="#94a3b8" font-size="13" text-anchor="middle">480×640×3</text>
  <rect x="36" y="166" width="298" height="66" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="185" y="192" fill="#e2e8f0" font-size="15" text-anchor="middle">observation.state  6 개</text>
  <text x="185" y="214" fill="#94a3b8" font-size="13" text-anchor="middle">지금 관절 5 개 + 집게의 위치</text>
  <line x1="356" y1="150" x2="404" y2="150" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="410" y="104" width="170" height="92" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="495" y="134" fill="#e2e8f0" font-size="15" text-anchor="middle">action a  6 개</text>
  <text x="495" y="158" fill="#94a3b8" font-size="13" text-anchor="middle">같은 여섯 곳의</text>
  <text x="495" y="178" fill="#94a3b8" font-size="13" text-anchor="middle">목표 위치 (정답)</text>
  <text x="300" y="282" fill="#e2e8f0" font-size="14" text-anchor="middle">30 fps · episode 50 개 · frame 11,939 개</text>
  <text x="300" y="304" fill="#94a3b8" font-size="13" text-anchor="middle">frame 마다 (관측, action) 쌍이 하나라서 학습 쌍도 11,939 개</text>
</svg>
