<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>OpenAI CLIP ViT-B/32 의 실제 크기. 224×224 사진은 32×32 patch 49 개와 [CLS] 를 합친 token 50 개로 12층 ViT(폭 768)를 지나고, [CLS] 출력 768 개를 행렬 곱으로 512 개로 바꾼다. 문장은 SOT 와 EOT 를 붙인 token 으로 12층 transformer(폭 512)를 지나고, EOT 자리 출력을 512 개로 바꾼다. 둘을 길이 1 로 맞춰 cosine similarity 에 100 을 곱한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="468" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="170" y="40" fill="#38bdf8" font-size="15" text-anchor="middle">사진</text>
  <text x="470" y="40" fill="#f59e0b" font-size="15" text-anchor="middle">문장</text>
  <rect x="50" y="60" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="82" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 224 × 224</text>
  <text x="170" y="102" fill="#38bdf8" font-size="12" text-anchor="middle">32 × 32 patch 49 개 + [CLS] = token 50 개</text>
  <line x1="170" y1="112" x2="170" y2="130" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="50" y="132" width="240" height="52" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170" y="154" fill="#e2e8f0" font-size="14" text-anchor="middle">image encoder (ViT-B/32)</text>
  <text x="170" y="174" fill="#38bdf8" font-size="12" text-anchor="middle">12층 · token 마다 숫자 768 개</text>
  <line x1="170" y1="184" x2="170" y2="202" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="50" y="204" width="240" height="52" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170" y="226" fill="#e2e8f0" font-size="14" text-anchor="middle">[CLS] 자리의 출력</text>
  <text x="170" y="246" fill="#38bdf8" font-size="12" text-anchor="middle">숫자 768 개</text>
  <line x1="170" y1="256" x2="170" y2="274" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="50" y="276" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="298" fill="#e2e8f0" font-size="14" text-anchor="middle">행렬 곱 (projection)</text>
  <text x="170" y="318" fill="#38bdf8" font-size="12" text-anchor="middle">768 개 → 512 개</text>
  <line x1="170" y1="328" x2="170" y2="346" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="50" y="348" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="370" fill="#e2e8f0" font-size="14" text-anchor="middle">길이 1 로 맞추기</text>
  <text x="170" y="390" fill="#38bdf8" font-size="12" text-anchor="middle">이미지 embedding</text>
  <rect x="350" y="60" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="82" fill="#e2e8f0" font-size="14" text-anchor="middle">"a photo of a cat."</text>
  <text x="470" y="102" fill="#f59e0b" font-size="12" text-anchor="middle">SOT + token 6 개 + EOT = 8 개 (최대 77)</text>
  <line x1="470" y1="112" x2="470" y2="130" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="350" y="132" width="240" height="52" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="154" fill="#e2e8f0" font-size="14" text-anchor="middle">text encoder (transformer)</text>
  <text x="470" y="174" fill="#f59e0b" font-size="12" text-anchor="middle">12층 · token 마다 숫자 512 개</text>
  <line x1="470" y1="184" x2="470" y2="202" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="350" y="204" width="240" height="52" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="226" fill="#e2e8f0" font-size="14" text-anchor="middle">EOT 자리의 출력</text>
  <text x="470" y="246" fill="#f59e0b" font-size="12" text-anchor="middle">숫자 512 개</text>
  <line x1="470" y1="256" x2="470" y2="274" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="350" y="276" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="298" fill="#e2e8f0" font-size="14" text-anchor="middle">행렬 곱 (projection)</text>
  <text x="470" y="318" fill="#f59e0b" font-size="12" text-anchor="middle">512 개 → 512 개</text>
  <line x1="470" y1="328" x2="470" y2="346" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="350" y="348" width="240" height="52" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="370" fill="#e2e8f0" font-size="14" text-anchor="middle">길이 1 로 맞추기</text>
  <text x="470" y="390" fill="#f59e0b" font-size="12" text-anchor="middle">텍스트 embedding</text>
  <line x1="250" y1="410" x2="300" y2="432" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="390" y1="410" x2="340" y2="432" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="200" y="430" width="240" height="32" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="320" y="451" fill="#34d399" font-size="14" text-anchor="middle">cosine similarity × 100</text>
</svg>
