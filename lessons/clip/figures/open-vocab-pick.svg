<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>이름으로 물체를 찾아 집는 과정. 질의 문장 "blue mug" 를 text encoder 로 embedding 으로 바꾸고, 방을 훑어 만든 물체 memory 의 CLIP embedding 과 cosine similarity 를 비교한다. 예로 든 점수 0.31, 0.26, 0.22, 0.12 가운데 가장 큰 파란 머그컵의 위치로 이동해 집는다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="658" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="40" width="150" height="60" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="91" y="65" fill="#e2e8f0" font-size="14" text-anchor="middle">질의 문장</text>
  <text x="91" y="86" fill="#d6aa62" font-size="13" text-anchor="middle">"blue mug"</text>
  <line x1="91" y1="100" x2="91" y2="130" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="16" y="134" width="150" height="50" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="91" y="164" fill="#e2e8f0" font-size="13" text-anchor="middle">text encoder</text>
  <line x1="91" y1="184" x2="91" y2="214" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="91" y="234" fill="#d6aa62" font-size="13" text-anchor="middle">질의 embedding q</text>
  <text x="91" y="254" fill="#94a3b8" font-size="12" text-anchor="middle">(숫자 512 개)</text>
  <line x1="168" y1="160" x2="214" y2="160" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="218" y="30" width="270" height="236" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="353" y="54" fill="#e2e8f0" font-size="14" text-anchor="middle">방을 훑어 만든 물체 memory</text>
  <text x="353" y="74" fill="#94a3b8" font-size="12" text-anchor="middle">물체마다 위치와 CLIP embedding</text>
  <text x="250" y="100" fill="#94a3b8" font-size="12" text-anchor="start">물체</text>
  <text x="470" y="100" fill="#94a3b8" font-size="12" text-anchor="end">q 와의 cosine</text>
  <line x1="236" y1="108" x2="470" y2="108" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="232" y="114" width="242" height="28" rx="6" fill="#0f2a22" stroke="#7fc4a2" stroke-width="1.2"/>
  <text x="250" y="134" fill="#7fc4a2" font-size="13" text-anchor="start">A  파란 머그컵</text>
  <text x="470" y="134" fill="#7fc4a2" font-size="13" text-anchor="end">0.31</text>
  <text x="250" y="166" fill="#e2e8f0" font-size="13" text-anchor="start">B  흰 머그컵</text>
  <text x="470" y="166" fill="#e2e8f0" font-size="13" text-anchor="end">0.26</text>
  <text x="250" y="198" fill="#e2e8f0" font-size="13" text-anchor="start">C  파란 책</text>
  <text x="470" y="198" fill="#e2e8f0" font-size="13" text-anchor="end">0.22</text>
  <text x="250" y="230" fill="#e2e8f0" font-size="13" text-anchor="start">D  운동화</text>
  <text x="470" y="230" fill="#e2e8f0" font-size="13" text-anchor="end">0.12</text>
  <line x1="490" y1="126" x2="536" y2="126" stroke="#7fc4a2" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="540" y="60" width="104" height="58" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="592" y="85" fill="#e2e8f0" font-size="13" text-anchor="middle">A 의 위치로</text>
  <text x="592" y="104" fill="#e2e8f0" font-size="13" text-anchor="middle">이동</text>
  <line x1="592" y1="118" x2="592" y2="150" stroke="#7fc4a2" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="540" y="154" width="104" height="58" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="592" y="179" fill="#e2e8f0" font-size="13" text-anchor="middle">grasp 계산</text>
  <text x="592" y="198" fill="#e2e8f0" font-size="13" text-anchor="middle">후 집기</text>
  <text x="330" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">가장 큰 cosine 의 물체를 고른다. 이름표 목록 없이 문장만 바꾸면 다른 물체를 찾는다</text>
  <text x="330" y="318" fill="#64748b" font-size="12" text-anchor="middle">점수는 설명용 예</text>
</svg>
