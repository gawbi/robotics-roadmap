<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CLIP 이 약한 세 가지. 고양이 두 마리 사진에 "두 마리" 와 "세 마리" 문장이 거의 같은 점수를 받고, "말이 풀을 먹는다" 와 "풀이 말을 먹는다" 처럼 단어가 같고 순서만 다른 문장, 그리고 참새와 박새처럼 겉모습이 비슷한 종류도 잘 가르지 못한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="16" width="194" height="268" rx="8" fill="#0e1628"/>
  <text x="113" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">개수 세기</text>
  <rect x="223" y="16" width="194" height="268" rx="8" fill="#0e1628"/>
  <text x="320" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">위치 관계 · 단어 순서</text>
  <rect x="430" y="16" width="194" height="268" rx="8" fill="#0e1628"/>
  <text x="527" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">세밀한 구분</text>
  <rect x="46" y="60" width="134" height="80" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="86" cy="106" r="16" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <path d="M72,96 l4,-14 l6,10 M100,96 l-4,-14 l-6,10" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="140" cy="106" r="16" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <path d="M126,96 l4,-14 l6,10 M154,96 l-4,-14 l-6,10" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="113" y="166" fill="#e2e8f0" font-size="12" text-anchor="middle">"고양이 두 마리" 0.30</text>
  <text x="113" y="190" fill="#e2e8f0" font-size="12" text-anchor="middle">"고양이 세 마리" 0.29</text>
  <text x="113" y="238" fill="#94a3b8" font-size="12" text-anchor="middle">설명 글에 개수가</text>
  <text x="113" y="256" fill="#94a3b8" font-size="12" text-anchor="middle">정확히 적힌 일이 드물다</text>
  <rect x="253" y="60" width="134" height="80" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="320" y="98" fill="#38bdf8" font-size="14" text-anchor="middle">말과 풀</text>
  <text x="320" y="120" fill="#94a3b8" font-size="11" text-anchor="middle">(말이 풀을 먹는 사진)</text>
  <text x="320" y="166" fill="#e2e8f0" font-size="12" text-anchor="middle">"말이 풀을 먹는다" 0.31</text>
  <text x="320" y="190" fill="#e2e8f0" font-size="12" text-anchor="middle">"풀이 말을 먹는다" 0.31</text>
  <text x="320" y="238" fill="#94a3b8" font-size="12" text-anchor="middle">어떤 단어가 있는지만</text>
  <text x="320" y="256" fill="#94a3b8" font-size="12" text-anchor="middle">봐도 짝을 고를 수 있었다</text>
  <rect x="460" y="60" width="134" height="80" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="527" y="98" fill="#38bdf8" font-size="14" text-anchor="middle">작은 새 사진</text>
  <text x="527" y="120" fill="#94a3b8" font-size="11" text-anchor="middle">(참새)</text>
  <text x="527" y="166" fill="#e2e8f0" font-size="12" text-anchor="middle">"참새 사진" 0.27</text>
  <text x="527" y="190" fill="#e2e8f0" font-size="12" text-anchor="middle">"박새 사진" 0.26</text>
  <text x="527" y="238" fill="#94a3b8" font-size="12" text-anchor="middle">설명 글은 대개</text>
  <text x="527" y="256" fill="#94a3b8" font-size="12" text-anchor="middle">"새" 라고만 쓴다</text>
</svg>
