  <text x="350" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">−1</text>
  <rect x="412" y="66" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="450" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">0.3679</text>
  <rect x="522" y="66" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="560" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">0.2676</text>
  <line x1="210" y1="86" x2="218" y2="86" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="300" y1="86" x2="308" y2="86" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="86" x2="408" y2="86" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="490" y1="86" x2="518" y2="86" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="70" y="147" fill="#d6aa62" font-size="13" text-anchor="middle">T₂ 개</text>
  <rect x="132" y="120" width="76" height="40" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="170" y="146" fill="#e2e8f0" font-size="15" text-anchor="middle">0.7</text>
  <rect x="222" y="120" width="76" height="40" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="260" y="146" fill="#e2e8f0" font-size="15" text-anchor="middle">7</text>
  <rect x="312" y="120" width="76" height="40" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="350" y="146" fill="#e2e8f0" font-size="15" text-anchor="middle">0</text>
  <rect x="412" y="120" width="76" height="40" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="450" y="146" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <rect x="522" y="120" width="76" height="40" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="560" y="146" fill="#7fc4a2" font-size="15" text-anchor="middle">0.7275</text>
  <line x1="210" y1="140" x2="218" y2="140" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="300" y1="140" x2="308" y2="140" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="140" x2="408" y2="140" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="490" y1="140" x2="518" y2="140" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="70" y="201" fill="#d6aa62" font-size="13" text-anchor="middle">T₃ 자동차</text>
  <rect x="132" y="174" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="170" y="200" fill="#e2e8f0" font-size="15" text-anchor="middle">0.2</text>
  <rect x="222" y="174" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
