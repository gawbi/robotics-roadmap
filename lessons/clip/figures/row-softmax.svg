  <rect x="312" y="174" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="350" y="200" fill="#e2e8f0" font-size="15" text-anchor="middle">−5</text>
  <rect x="412" y="174" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="450" y="200" fill="#e2e8f0" font-size="15" text-anchor="middle">0.0067</text>
  <rect x="522" y="174" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="560" y="200" fill="#e2e8f0" font-size="15" text-anchor="middle">0.0049</text>
  <line x1="210" y1="194" x2="218" y2="194" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="300" y1="194" x2="308" y2="194" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="194" x2="408" y2="194" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="490" y1="194" x2="518" y2="194" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="450" y="248" fill="#94a3b8" font-size="12" text-anchor="middle">합 0.3679 + 1 + 0.0067 = 1.3746</text>
  <rect x="170" y="252" width="300" height="36" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="320" y="276" fill="#7fc4a2" font-size="15" text-anchor="middle">loss = −log 0.7275 = 0.318</text>
</svg>
