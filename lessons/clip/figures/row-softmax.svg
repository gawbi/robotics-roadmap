<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사진 I₂(강아지) 행의 계산. cosine 0.6, 0.7, 0.2 를 τ = 0.1 로 나눠 6, 7, 2 를 만들고, 가장 큰 7 을 빼 e^s 로 바꾼 0.3679, 1, 0.0067 을 합 1.3746 으로 나누면 확률 0.2676, 0.7275, 0.0049 다. 정답 T₂ 의 확률로 계산한 loss 는 0.318 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="70" y="44" fill="#94a3b8" font-size="13" text-anchor="middle"></text>
  <text x="170" y="44" fill="#94a3b8" font-size="13" text-anchor="middle">cosine</text>
  <text x="260" y="44" fill="#94a3b8" font-size="13" text-anchor="middle">÷ τ (0.1)</text>
  <text x="350" y="44" fill="#94a3b8" font-size="13" text-anchor="middle">− 7</text>
  <text x="450" y="44" fill="#94a3b8" font-size="13" text-anchor="middle">e^s</text>
  <text x="560" y="44" fill="#94a3b8" font-size="13" text-anchor="middle">÷ 1.3746</text>
  <text x="70" y="93" fill="#d6aa62" font-size="13" text-anchor="middle">T₁ 고양이</text>
  <rect x="132" y="66" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="170" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">0.6</text>
  <rect x="222" y="66" width="76" height="40" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="260" y="92" fill="#e2e8f0" font-size="15" text-anchor="middle">6</text>
