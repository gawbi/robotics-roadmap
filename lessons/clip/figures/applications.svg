<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사진–글 짝 맞히기로 학습한 encoder 의 세 가지 쓰임. YOLO-World 는 CLIP 의 text encoder 로 물체 이름을 embedding 으로 바꿔 bounding box 를 찾고, CLIPort 는 CLIP 의 두 encoder 로 지시문의 물체를 알아보고 Transporter 로 위치를 정하며, π0·OpenVLA·SmolVLA 는 SigLIP 의 image encoder 를 사진 입력으로 쓴다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="658" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="190" y="18" width="280" height="44" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="330" y="45" fill="#e2e8f0" font-size="14" text-anchor="middle">사진–글 짝 맞히기로 학습한 encoder</text>
  <line x1="250" y1="62" x2="110" y2="96" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <line x1="330" y1="62" x2="330" y2="96" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="410" y1="62" x2="550" y2="96" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-sky)"/>
  <rect x="20" y="100" width="180" height="44" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="127" fill="#f59e0b" font-size="14" text-anchor="middle">CLIP text encoder</text>
  <line x1="110" y1="144" x2="110" y2="176" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="20" y="180" width="180" height="64" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="110" y="205" fill="#e2e8f0" font-size="14" text-anchor="middle">YOLO-World</text>
  <text x="110" y="226" fill="#94a3b8" font-size="12" text-anchor="middle">이름 → bounding box</text>
  <text x="110" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">open-vocabulary</text>
  <text x="110" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">detection</text>
  <rect x="240" y="100" width="180" height="44" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="330" y="127" fill="#34d399" font-size="14" text-anchor="middle">CLIP image·text encoder</text>
  <line x1="330" y1="144" x2="330" y2="176" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="240" y="180" width="180" height="64" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330" y="205" fill="#e2e8f0" font-size="14" text-anchor="middle">CLIPort</text>
  <text x="330" y="226" fill="#94a3b8" font-size="12" text-anchor="middle">무엇: CLIP · 어디: Transporter</text>
  <text x="330" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">language-conditioned</text>
  <text x="330" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">policy</text>
  <rect x="460" y="100" width="180" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="550" y="127" fill="#38bdf8" font-size="14" text-anchor="middle">SigLIP image encoder</text>
  <line x1="550" y1="144" x2="550" y2="160" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-sky)"/>
  <rect x="460" y="164" width="180" height="30" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="184" fill="#a78bfa" font-size="12" text-anchor="middle">PaliGemma → π0</text>
  <rect x="460" y="200" width="180" height="30" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="220" fill="#a78bfa" font-size="12" text-anchor="middle">+ DINOv2 → OpenVLA</text>
  <rect x="460" y="236" width="180" height="30" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="550" y="256" fill="#a78bfa" font-size="12" text-anchor="middle">SmolVLM-2 → SmolVLA</text>
  <text x="550" y="296" fill="#94a3b8" font-size="12" text-anchor="middle">VLA 의 사진 입력</text>
  <text x="330" y="336" fill="#64748b" font-size="12" text-anchor="middle">가져다 쓰는 encoder: text 쪽 · 양쪽 · image 쪽</text>
</svg>
