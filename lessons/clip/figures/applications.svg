<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CLIP 식 학습에서 나온 두 encoder 의 쓰임. text encoder 는 YOLO-World 같은 open-vocabulary detector 가 물체 이름을 embedding 으로 바꾸는 데 쓰고, image encoder 는 sigmoid loss 로 학습한 SigLIP 을 거쳐 PaliGemma, π0, OpenVLA 같은 VLA 의 사진 입구가 된다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="230" y="20" width="180" height="44" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="320" y="47" fill="#34d399" font-size="13" text-anchor="middle">사진–설명 짝 맞히기 학습</text>
  <line x1="280" y1="64" x2="160" y2="100" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <line x1="360" y1="64" x2="480" y2="100" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="104" width="240" height="44" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="131" fill="#f59e0b" font-size="14" text-anchor="middle">CLIP 의 text encoder</text>
  <line x1="160" y1="148" x2="160" y2="172" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="40" y="176" width="240" height="70" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160" y="200" fill="#e2e8f0" font-size="14" text-anchor="middle">YOLO-World</text>
  <text x="160" y="220" fill="#94a3b8" font-size="12" text-anchor="middle">이름 "cup" → 사진에서</text>
  <text x="160" y="237" fill="#94a3b8" font-size="12" text-anchor="middle">컵마다 bounding box</text>
  <text x="160" y="280" fill="#94a3b8" font-size="12" text-anchor="middle">open-vocabulary detector</text>
  <rect x="360" y="104" width="240" height="44" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="480" y="123" fill="#38bdf8" font-size="14" text-anchor="middle">image encoder</text>
  <text x="480" y="140" fill="#94a3b8" font-size="11" text-anchor="middle">SigLIP = CLIP + sigmoid loss</text>
  <line x1="480" y1="148" x2="480" y2="172" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="360" y="176" width="240" height="40" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="201" fill="#e2e8f0" font-size="14" text-anchor="middle">PaliGemma (VLM)</text>
  <line x1="440" y1="216" x2="420" y2="240" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="520" y1="216" x2="540" y2="240" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="360" y="244" width="110" height="40" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="415" y="269" fill="#a78bfa" font-size="14" text-anchor="middle">π0</text>
  <rect x="490" y="244" width="110" height="40" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="545" y="269" fill="#a78bfa" font-size="14" text-anchor="middle">OpenVLA</text>
  <text x="480" y="304" fill="#94a3b8" font-size="12" text-anchor="middle">VLA: 사진 + 지시문 → 로봇 action</text>
</svg>
