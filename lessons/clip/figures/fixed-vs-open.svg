<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽은 이름표 1000 개 가운데 하나를 고르는 분류기로, 목록에 없는 파란 머그컵은 고를 수 없다. 오른쪽은 CLIP 으로, 사진과 아무 문장이나 받아 둘이 얼마나 잘 맞는지 점수를 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="16" width="296" height="268" rx="8" fill="#0e1628"/>
  <text x="164" y="42" fill="#e2e8f0" font-size="15" text-anchor="middle">이름표가 정해진 분류기</text>
  <rect x="36" y="70" width="90" height="44" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="81" y="97" fill="#e2e8f0" font-size="14" text-anchor="middle">사진</text>
  <line x1="126" y1="92" x2="150" y2="92" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="154" y="70" width="70" height="44" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="189" y="97" fill="#7cb4d8" font-size="14" text-anchor="middle">ViT</text>
  <line x1="224" y1="92" x2="244" y2="92" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="246" y="60" width="56" height="24" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="274" y="77" fill="#94a3b8" font-size="11" text-anchor="middle">0 고양이</text>
  <rect x="246" y="88" width="56" height="24" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="274" y="105" fill="#94a3b8" font-size="11" text-anchor="middle">1 개</text>
  <rect x="246" y="116" width="56" height="24" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="274" y="133" fill="#94a3b8" font-size="11" text-anchor="middle">2 자동차</text>
  <rect x="246" y="144" width="56" height="24" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="274" y="161" fill="#94a3b8" font-size="11" text-anchor="middle">…</text>
  <rect x="246" y="172" width="56" height="24" rx="5" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="274" y="189" fill="#94a3b8" font-size="11" text-anchor="middle">999 트럭</text>
  <text x="164" y="228" fill="#d88b8b" font-size="14" text-anchor="middle">"파란 머그컵" 은 목록에 없다</text>
  <text x="164" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">→ 이름표를 단 사진을 다시 모아야 한다</text>
  <rect x="328" y="16" width="296" height="268" rx="8" fill="#0e1628"/>
  <text x="476" y="42" fill="#e2e8f0" font-size="15" text-anchor="middle">CLIP</text>
  <rect x="344" y="64" width="80" height="40" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="384" y="89" fill="#e2e8f0" font-size="14" text-anchor="middle">사진</text>
  <line x1="424" y1="84" x2="448" y2="84" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="452" y="64" width="150" height="40" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="527" y="89" fill="#7cb4d8" font-size="13" text-anchor="middle">image encoder</text>
  <rect x="344" y="124" width="80" height="40" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="384" y="143" fill="#d6aa62" font-size="12" text-anchor="middle">"파란 머그</text>
  <text x="384" y="158" fill="#d6aa62" font-size="12" text-anchor="middle">컵 사진"</text>
  <line x1="424" y1="144" x2="448" y2="144" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="452" y="124" width="150" height="40" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="527" y="149" fill="#d6aa62" font-size="13" text-anchor="middle">text encoder</text>
  <line x1="527" y1="104" x2="527" y2="188" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="560" y1="164" x2="545" y2="188" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="430" y="192" width="150" height="40" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="505" y="217" fill="#7fc4a2" font-size="13" text-anchor="middle">짝이 맞는 정도 점수</text>
  <text x="476" y="256" fill="#94a3b8" font-size="12" text-anchor="middle">문장만 바꾸면 어떤 물체든 물어볼 수 있다</text>
</svg>
