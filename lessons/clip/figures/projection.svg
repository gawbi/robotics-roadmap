<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>행렬 곱으로 길이를 맞추는 projection. 사진 쪽 숫자 3 개 [1, 2, 0] 에 2×3 행렬을 곱하면 행마다 dot product 를 해 숫자 2 개 [3, 2] 가 되고, 글 쪽 숫자 2 개 [1, 3] 에 2×2 행렬을 곱하면 [1, 4] 가 되어 둘 다 길이 2 가 된다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="160" y="34" fill="#38bdf8" font-size="14" text-anchor="middle">사진 쪽: 숫자 3 개 → 2 개</text>
  <text x="480" y="34" fill="#f59e0b" font-size="14" text-anchor="middle">글 쪽: 숫자 2 개 → 2 개</text>
  <path d="M26,60 h-6 v64 h6 M114,60 h6 v64 h-6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="40.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="70.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="100.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">0</text>
  <text x="40.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">0</text>
  <text x="70.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="100.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <text x="134" y="92" fill="#94a3b8" font-size="18" text-anchor="middle">×</text>
  <path d="M156,46 h-6 v92 h6 M184,46 h6 v92 h-6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170.0" y="68" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="170.0" y="96" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <text x="170.0" y="124" fill="#e2e8f0" font-size="15" text-anchor="middle">0</text>
  <text x="210" y="92" fill="#94a3b8" font-size="18" text-anchor="middle">=</text>
  <path d="M232,60 h-6 v64 h6 M260,60 h6 v64 h-6" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="246.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">3</text>
  <text x="246.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <text x="160" y="160" fill="#94a3b8" font-size="13" text-anchor="middle">첫째 행: 1×1 + 1×2 + 0×0 = 3</text>
  <text x="160" y="184" fill="#94a3b8" font-size="13" text-anchor="middle">둘째 행: 0×1 + 1×2 + 2×0 = 2</text>
  <path d="M366,60 h-6 v64 h6 M424,60 h6 v64 h-6" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="410.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">0</text>
  <text x="380.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="410.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="444" y="92" fill="#94a3b8" font-size="18" text-anchor="middle">×</text>
  <path d="M466,60 h-6 v64 h6 M494,60 h6 v64 h-6" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="480.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">3</text>
  <text x="520" y="92" fill="#94a3b8" font-size="18" text-anchor="middle">=</text>
  <path d="M542,60 h-6 v64 h6 M570,60 h6 v64 h-6" fill="none" stroke="#34d399" stroke-width="1.5"/>
  <text x="556.0" y="82" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="556.0" y="110" fill="#e2e8f0" font-size="15" text-anchor="middle">4</text>
  <text x="480" y="160" fill="#94a3b8" font-size="13" text-anchor="middle">첫째 행: 1×1 + 0×3 = 1</text>
  <text x="480" y="184" fill="#94a3b8" font-size="13" text-anchor="middle">둘째 행: 1×1 + 1×3 = 4</text>
  <text x="320" y="230" fill="#34d399" font-size="14" text-anchor="middle">둘 다 숫자 2 개가 되어 같은 공간에서 비교할 수 있다</text>
</svg>
