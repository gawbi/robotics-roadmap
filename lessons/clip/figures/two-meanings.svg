<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>multimodal 의 두 뜻. 왼쪽은 CLIP·VLA 의 뜻으로 사진·글·관절 각도처럼 입력의 종류(modality)가 여럿이다. 오른쪽은 behavior cloning 의 뜻으로 같은 장면에서 정답 action 이 −20° 와 +20° 두 봉우리로 갈린다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="16" width="296" height="268" rx="8" fill="#0e1628"/>
  <text x="164" y="42" fill="#e2e8f0" font-size="15" text-anchor="middle">입력의 종류가 여럿</text>
  <text x="164" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">CLIP · VLA 의 multimodal</text>
  <rect x="30" y="84" width="120" height="40" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="109" fill="#38bdf8" font-size="13" text-anchor="middle">사진</text>
  <text x="160" y="109" fill="#94a3b8" font-size="11" text-anchor="start">시각</text>
  <line x1="212" y1="104" x2="236" y2="140" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="30" y="140" width="120" height="40" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="165" fill="#f59e0b" font-size="13" text-anchor="middle">"빨간 컵 집어"</text>
  <text x="160" y="165" fill="#94a3b8" font-size="11" text-anchor="start">언어</text>
  <line x1="212" y1="160" x2="236" y2="152" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="30" y="196" width="120" height="40" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="90" y="221" fill="#a78bfa" font-size="13" text-anchor="middle">관절 각도</text>
  <text x="160" y="221" fill="#94a3b8" font-size="11" text-anchor="start">로봇 상태</text>
  <line x1="212" y1="216" x2="236" y2="164" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="238" y="128" width="62" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="269" y="157" fill="#e2e8f0" font-size="14" text-anchor="middle">모델</text>
  <text x="164" y="262" fill="#34d399" font-size="13" text-anchor="middle">modality = 정보의 종류</text>
  <rect x="328" y="16" width="296" height="268" rx="8" fill="#0e1628"/>
  <text x="476" y="42" fill="#e2e8f0" font-size="15" text-anchor="middle">정답 action 이 여럿</text>
  <text x="476" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">behavior cloning 의 multimodal</text>
  <rect x="362" y="184" width="8" height="36" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="372" y="130" width="8" height="90" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="382" y="166" width="8" height="54" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="562" y="166" width="8" height="54" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="572" y="130" width="8" height="90" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <rect x="582" y="184" width="8" height="36" rx="1" fill="#f59e0b" fill-opacity="0.85"/>
  <line x1="356" y1="220" x2="596" y2="220" stroke="#475569" stroke-width="1.5"/>
  <text x="376" y="238" fill="#64748b" font-size="11" text-anchor="middle">-20°</text>
  <text x="476" y="238" fill="#64748b" font-size="11" text-anchor="middle">0°</text>
  <text x="576" y="238" fill="#64748b" font-size="11" text-anchor="middle">+20°</text>
  <text x="376" y="120" fill="#f59e0b" font-size="12" text-anchor="middle">봉우리 1</text>
  <text x="576" y="120" fill="#f59e0b" font-size="12" text-anchor="middle">봉우리 2</text>
  <text x="476" y="262" fill="#34d399" font-size="13" text-anchor="middle">같은 장면에서 왼쪽·오른쪽 모두 정답</text>
</svg>
