<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CLIP 과 SigLIP 의 loss 비교. CLIP 은 행 하나 전체를 softmax 로 묶어 정답 칸의 비율을 보고, SigLIP 은 아홉 칸을 하나씩 따로 "짝인가" 로 판정한다. t = 10, b = −5 로 계산한 칸마다의 loss 를 적었다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="16" width="230" height="298" rx="8" fill="#0e1628"/>
  <text x="131" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">CLIP (softmax)</text>
  <rect x="56" y="70" width="50" height="50" rx="0" fill="#34d399" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <rect x="106" y="70" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="156" y="70" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="52" y="74" width="158" height="42" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="56" y="120" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="106" y="120" width="50" height="50" rx="0" fill="#34d399" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <rect x="156" y="120" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="52" y="124" width="158" height="42" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="56" y="170" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="106" y="170" width="50" height="50" rx="0" fill="#111a2e" fill-opacity="1" stroke="#475569" stroke-width="1"/>
  <rect x="156" y="170" width="50" height="50" rx="0" fill="#34d399" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <rect x="52" y="174" width="158" height="42" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="131" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">행 하나를 통째로 보고</text>
  <text x="131" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">정답 칸의 비율을 계산</text>
  <rect x="262" y="16" width="362" height="298" rx="8" fill="#0e1628"/>
  <text x="443" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">SigLIP (sigmoid)</text>
  <text x="348.0" y="60" fill="#f59e0b" font-size="12" text-anchor="middle">T₁</text>
  <text x="444.0" y="60" fill="#f59e0b" font-size="12" text-anchor="middle">T₂</text>
  <text x="540.0" y="60" fill="#f59e0b" font-size="12" text-anchor="middle">T₃</text>
  <text x="290" y="102" fill="#38bdf8" font-size="12" text-anchor="end">I₁</text>
  <rect x="303" y="69" width="90" height="56" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="348.0" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">logit 3 · 정답 +1</text>
  <text x="348.0" y="113" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.049</text>
  <rect x="399" y="69" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="444.0" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">logit 0 · 정답 −1</text>
  <text x="444.0" y="113" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.693</text>
  <rect x="495" y="69" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="540.0" y="92" fill="#94a3b8" font-size="11" text-anchor="middle">logit −4 · 정답 −1</text>
  <text x="540.0" y="113" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.018</text>
  <text x="290" y="164" fill="#38bdf8" font-size="12" text-anchor="end">I₂</text>
  <rect x="303" y="131" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="348.0" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">logit 1 · 정답 −1</text>
  <text x="348.0" y="175" fill="#f87171" font-size="13" text-anchor="middle">loss 1.313</text>
  <rect x="399" y="131" width="90" height="56" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="444.0" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">logit 2 · 정답 +1</text>
  <text x="444.0" y="175" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.127</text>
  <rect x="495" y="131" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="540.0" y="154" fill="#94a3b8" font-size="11" text-anchor="middle">logit −3 · 정답 −1</text>
  <text x="540.0" y="175" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.049</text>
  <text x="290" y="226" fill="#38bdf8" font-size="12" text-anchor="end">I₃</text>
  <rect x="303" y="193" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="348.0" y="216" fill="#94a3b8" font-size="11" text-anchor="middle">logit −5 · 정답 −1</text>
  <text x="348.0" y="237" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.007</text>
  <rect x="399" y="193" width="90" height="56" rx="6" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="444.0" y="216" fill="#94a3b8" font-size="11" text-anchor="middle">logit −4 · 정답 −1</text>
  <text x="444.0" y="237" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.018</text>
  <rect x="495" y="193" width="90" height="56" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="540.0" y="216" fill="#94a3b8" font-size="11" text-anchor="middle">logit 4 · 정답 +1</text>
  <text x="540.0" y="237" fill="#e2e8f0" font-size="13" text-anchor="middle">loss 0.018</text>
  <text x="443" y="276" fill="#94a3b8" font-size="12" text-anchor="middle">칸마다 따로: −log σ(정답 × logit)</text>
  <text x="443" y="298" fill="#34d399" font-size="13" text-anchor="middle">아홉 칸의 합 2.292 ÷ 3 = 0.764</text>
</svg>
