# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: multimodal
  title: multimodal 과 modality 의 뜻
  variants:
    - question: |
        CLIP 을 multimodal 모델이라고 부르는 이유는?
      choices:
        - '같은 사진에 정답 설명이 여러 개라 분포의 봉우리가 여럿이기 때문에'
        - 'encoder 를 여러 층 쌓았기 때문에'
        - '사진과 글이라는 서로 다른 종류의 정보(modality)를 함께 다루기 때문에'
        - 'class 를 1000 개 넘게 고를 수 있기 때문에'
      answer: 2
      explanation: |
        modality 는 시각·언어·청각처럼 정보의 종류이고, multimodal 모델은 여러 modality 를 함께 받는 모델이다. CLIP 은 사진과 글
        두 modality 를 다룬다. 정답이 여럿이라 봉우리가 여럿이라는 뜻은 behavior cloning 에서 쓴 다른 multimodal 이다. 층 수나
        class 수는 modality 와 관계가 없다.
    - question: |
        두 문장의 multimodal 은 각각 어느 뜻일까?
        (가) "VLA 는 카메라 사진, 지시문, 관절 각도를 함께 받는 multimodal 모델이다."
        (나) "같은 장면에서 사람이 장애물을 왼쪽으로도 오른쪽으로도 피해서 시연이 multimodal 이다."
      choices:
        - '(가) 입력의 종류가 여럿, (나) 정답 action 의 봉우리가 여럿'
        - '(가) 정답 action 의 봉우리가 여럿, (나) 입력의 종류가 여럿'
        - '둘 다 입력의 종류가 여럿이라는 뜻'
        - '둘 다 정답 action 의 봉우리가 여럿이라는 뜻'
      answer: 0
      explanation: |
        (가) 는 사진·글·관절 각도라는 여러 modality 를 받는다는 뜻이다. (나) 는 입력은 같은 장면 하나인데 정답 action 이 두 무리로
        갈린다는 뜻으로, 이때의 modal 은 통계의 mode(가장 자주 나온 값)에서 왔다. 두 뜻은 철자만 같고 가리키는 것이 다르며, 한
        VLA 가 multimodal 시연으로 학습하면 한 문장에 두 뜻이 같이 나올 수도 있다.
    - question: |
        다음 가운데 로봇이 받는 modality 로 보기 어려운 것은?
      choices:
        - '카메라 사진'
        - '"빨간 컵을 집어" 같은 지시문'
        - '로봇이 자기 관절에서 잰 관절 각도'
        - 'image encoder 의 층 수'
      answer: 3
      explanation: |
        modality 는 모델이 받아들이는 정보의 종류다. 사진은 시각, 지시문은 언어 modality 이고, 관절 각도나 손에 걸리는 힘처럼 로봇이
        자기 몸에 대해 재는 숫자도 하나의 modality 로 친다. image encoder 의 층 수는 모델의 구조를 정하는 설정이지 모델에 들어오는
        정보가 아니다.

- topic: cosine-similarity
  title: 같은 공간에서 방향으로 재는 cosine similarity
  variants:
    - question: |
        CLIP 은 사진 embedding 과 글 embedding 을 각각 길이 1 로 정규화한 뒤 비교한다. 이렇게 하는 이유로 옳은 것은?
      choices:
        - '정규화하면 vector 의 차원이 줄어 계산이 빨라지기 때문에'
        - '길이는 무시하고 방향만 비교해서, 예를 들어 밝은 사진이라 vector 가 길게 나왔다고 모든 설명과 더 가깝다고 판정하지 않게 하려고'
        - '정규화하지 않으면 dot product 를 계산할 수 없기 때문에'
        - '길이가 1 이어야 softmax 를 쓸 수 있기 때문에'
      answer: 1
      explanation: |
        정규화하면 vector 에 방향만 남는다. 같은 방향인데 길이만 다른 두 vector 는 정규화 뒤 똑같아지므로, 길이 때문에 점수가 커지는
        일이 없다. 정규화는 각 칸을 길이로 나눌 뿐 차원 수를 바꾸지 않는다. dot product 와 softmax 는 길이와 상관없이 계산할 수 있다.
    - question: |
        cosine similarity 에 대한 설명으로 옳은 것은?
      choices:
        - '한 vector 의 길이를 2 배로 늘리면 cosine similarity 도 2 배가 된다'
        - '언제나 0 과 1 사이의 확률이다'
        - '값이 클수록 두 vector 가 서로 먼 방향을 가리킨다'
        - '같은 방향이면 1, 직각이면 0, 반대 방향이면 −1 이고 언제나 −1 과 1 사이에 있다'
      answer: 3
      explanation: |
        cosine similarity 는 정규화한 두 vector 의 dot product 로, 두 화살표 사이 각도의 cosine 값과 같다. 각도가 0° 면 1, 90° 면 0,
        180° 면 −1 이다. 길이를 바꿔도 정규화하면 같은 vector 가 되므로 값이 그대로이고, 음수도 나오므로 확률이 아니다. 값이 클수록
        가까운 방향이다.
    - question: |
        CLIP 의 image encoder 출력과 text encoder 출력은 길이(숫자 개수)가 다를 수 있다. 각 출력에 행렬을 하나씩 곱해 같은 길이로
        맞추는 projection 이 필요한 이유는?
      choices:
        - '두 vector 를 칸끼리 곱해 비교하려면 길이가 같아야 하고, 그래야 사진과 글을 한 공간의 화살표로 함께 놓을 수 있기 때문에'
        - '사진 embedding 을 글로 바꿔 출력하려고'
        - '행렬을 곱하면 vector 의 방향이 언제나 그대로 유지되기 때문에'
        - 'projection 행렬은 학습하지 않는 고정된 값이라 계산이 가볍기 때문에'
      answer: 0
      explanation: |
        cosine similarity 는 같은 자리 칸끼리 곱해 더하는 dot product 라서 길이가 같아야 한다. projection 으로 길이를 맞추면 사진과
        글이 같은 공간에 놓이고, 학습은 짝끼리 같은 방향을 가리키게 만든다. projection 은 글을 만들어 내지 않고, 행렬 곱은 방향을
        바꿀 수 있으며, projection 행렬도 학습되는 parameter 다.

- topic: contrastive-loss
  title: 짝 점수는 올리고 negative 점수는 내리는 loss
  variants:
    - question: |
        사진 $B$ 장과 그 설명 $B$ 개로 사진 × 설명 점수표를 만들었다. 사진 $i$ 와 설명 $i$ 가 짝이다. CLIP 의 학습이 이 표에서 하는
        일로 옳은 것은?
      choices:
        - '모든 칸의 점수를 함께 올린다'
        - '모든 칸의 점수를 0 으로 만든다'
        - '대각선(짝) 칸의 점수는 올리고, 짝이 아닌 칸(negative)의 점수는 내린다'
        - '대각선 칸의 점수는 내리고, 짝이 아닌 칸의 점수는 올린다'
      answer: 2
      explanation: |
        짝인 것과 짝이 아닌 것을 대조(contrast)하며 배우는 것이 contrastive learning 이다. 행마다 softmax 를 하면 정답 칸의 확률을
        올리려면 정답 점수를 올리고 나머지를 내려야 한다. 모든 칸을 함께 올리면 짝을 구별하지 못하고, 반대로 하면 짝끼리 멀어진다.
    - question: |
        CLIP 은 사진을 보고 설명 글을 한 단어씩 만들어 내는 대신, 여러 설명 가운데 짝을 고르게 학습한다. 이 선택의 이유로 가장
        알맞은 것은?
      choices:
        - '설명을 만들어 내는 모델은 사진을 입력으로 받을 수 없기 때문에'
        - '같은 사진에도 맞는 설명이 끝없이 다를 수 있어 단어를 그대로 맞히기는 어렵고, 짝만 고르면 같은 계산량에서 훨씬 빨리 배우기 때문에'
        - '짝 고르기는 negative 가 없어도 학습되기 때문에'
        - '인터넷 사진에는 설명 글이 붙어 있지 않기 때문에'
      answer: 1
      explanation: |
        고양이 사진 하나에도 "소파 위의 고양이", "낮잠 자는 우리 집 나비" 처럼 설명이 끝없이 달라서, 단어를 맞히게 하면 사진에 없는
        단어까지 맞히려고 애쓴다. 짝 고르기는 맞는 설명을 다른 설명과 구별하기만 하면 되고, CLIP 논문에서 같은 계산량으로 훨씬
        빨리 배웠다. 짝 고르기는 오히려 negative 가 꼭 필요하고, CLIP 의 데이터 자체가 인터넷 사진에 붙은 설명 글이다.
    - question: |
        CLIP 의 loss 는 점수표를 가로(사진마다 맞는 설명 고르기)로 한 번, 세로(설명마다 맞는 사진 고르기)로 한 번 계산해 평균한다.
        세로 방향까지 쓰는 이유로 옳은 것은?
      choices:
        - '가로 방향만으로는 loss 가 음수가 되기 때문에'
        - '세로 방향은 짝이 아닌 칸을 계산에서 빼 주기 때문에'
        - '세로 방향을 쓰면 temperature 가 필요 없어지기 때문에'
        - '사진으로 글을 찾는 능력과 글로 사진을 찾는 능력을 함께 기르기 위해'
      answer: 3
      explanation: |
        가로로 읽으면 "이 사진의 설명은 어느 것인가", 세로로 읽으면 "이 설명의 사진은 어느 것인가" 라는 문제가 된다. 두 방향을 모두
        쓰면 양쪽 검색 능력을 함께 기른다. cross-entropy loss 는 어느 방향이든 0 이상이고, 세로 방향에서도 짝이 아닌 칸이 softmax
        분모에 들어간다. temperature 는 방향과 상관없이 쓴다.

- topic: contrastive-batch
  title: negative 와 batch 크기
  variants:
    - question: |
        강아지 사진의 행에서 negative 가 둘이다. 고양이 설명은 점수가 높아 강아지 설명과 헷갈리고, 자동차 설명은 이미 점수가 아주
        낮다. 한 번 학습할 때 점수가 더 세게 내려가는 쪽은?
      choices:
        - '고양이 설명. 확률을 많이 받은 헷갈리는 negative 일수록 gradient 가 커서 가장 세게 밀린다'
        - '자동차 설명. 점수가 낮을수록 더 세게 밀린다'
        - '두 negative 가 똑같이 밀린다'
        - '어느 negative 도 밀리지 않고 정답 점수만 올라간다'
      answer: 0
      explanation: |
        softmax 와 cross-entropy 를 함께 쓰면 짝이 아닌 칸의 gradient 는 그 칸의 확률과 같다. 헷갈리는 고양이 설명은 확률을 많이
        받고 있어 크게 밀리고, 이미 멀리 떨어진 자동차 설명은 확률이 거의 0 이라 조금만 밀린다. 그래서 contrastive learning 은 이미
        잘 구분된 짝보다 헷갈리는 짝을 가르는 데 힘을 쓴다.
    - question: |
        CLIP 은 짝이 아닌 설명(negative)을 어디서 얻을까?
      choices:
        - '사람이 사진마다 틀린 설명을 따로 써서 붙인다'
        - '설명 글의 단어 순서를 무작위로 섞어 만든다'
        - '같은 batch 에 함께 들어온 다른 사진–설명 쌍의 설명을 negative 로 쓴다'
        - 'text encoder 가 학습 중에 틀린 설명을 생성한다'
      answer: 2
      explanation: |
        CLIP 은 negative 를 따로 모으지 않고, 같은 batch 의 다른 쌍들을 그대로 negative 로 쓴다. 쌍이 $B$ 개면 사진 하나마다 자기
        짝을 뺀 $B - 1$ 개가 negative 다. 사람이 틀린 설명을 쓰거나 단어를 섞거나 설명을 생성하는 단계는 없다.
    - question: |
        CLIP 이 batch 에 사진–설명 쌍을 수만 개씩 넣는 이유로 가장 알맞은 것은?
      choices:
        - 'batch 가 클수록 loss 의 시작값이 작아지기 때문에'
        - 'batch 가 클수록 사진 하나가 비교할 negative 가 많아지고, 아주 비슷한 헷갈리는 negative 가 들어올 가능성이 커져 세밀한 차이까지 배우기 때문에'
        - 'batch 가 클수록 temperature 를 쓰지 않아도 되기 때문에'
        - 'batch 가 작으면 positive 칸이 하나도 없기 때문에'
      answer: 1
      explanation: |
        "소파 위의 고양이" 와 "소파 위의 강아지" 처럼 비슷한 negative 가 같은 batch 에 있어야 그 차이를 구별해야 loss 가 내려간다.
        batch 가 커지면 이런 negative 를 만날 가능성이 커진다. 처음 loss 는 모든 칸의 확률이 $1/B$ 이라 $\log B$ 에서 시작하므로
        batch 가 클수록 오히려 크다. batch 크기와 상관없이 temperature 는 필요하고, 짝(positive)은 batch 마다 $B$ 칸 있다.

- topic: temperature
  title: temperature 로 키우는 점수 차이
  variants:
    - question: |
        CLIP 이 cosine similarity 를 그대로 softmax 에 넣지 않고 temperature $\tau$ 로 나누는 가장 큰 이유는?
      choices:
        - 'cosine similarity 는 −1 과 1 사이라 그대로 쓰면 확률이 평평하고, 완벽한 embedding 에서도 정답 확률이 1 에 다가가지 못하기 때문에'
        - '$\tau$ 로 나누면 점수의 순서가 바뀌어 정답이 맨 앞에 오기 때문에'
        - 'softmax 는 음수를 받을 수 없기 때문에'
        - '$\tau$ 로 나누면 negative 칸이 계산에서 빠지기 때문에'
      answer: 0
      explanation: |
        cosine similarity 의 범위가 좁아서 점수끼리의 차이가 작고, softmax 는 그 차이로 확률을 나누므로 결과가 평평하다. 정답이
        1, 나머지가 −1 이어도 칸이 많으면 정답 확률이 낮게 묶여 학습 신호가 약하다. $\tau$ 로 나누면 차이가 $1/\tau$ 배가 되어 확률이
        정답에 몰린다. 순서는 그대로이고, softmax 는 음수도 받으며, negative 칸도 그대로 분모에 남는다.
    - question: |
        $\tau$ 를 더 작게 하면 한 행의 softmax 결과는 어떻게 바뀔까?
      choices:
        - '모든 칸의 확률이 같아진다'
        - '점수의 순서가 뒤집힌다'
        - '점수 차이가 더 커져 가장 큰 점수의 칸에 확률이 더 몰린다'
        - '변화가 없다'
      answer: 2
      explanation: |
        logit 은 $s / \tau$ 라서 $\tau$ 가 작을수록 점수끼리의 차이가 커지고, softmax 는 가장 큰 점수에 확률을 더 몰아 준다. 모든
        칸이 같아지는 것은 $\tau$ 가 아주 클 때의 방향이다. 양수로 나누므로 순서는 바뀌지 않는다.
    - question: |
        "$\tau$ 는 작을수록 좋다" 는 말이 틀린 이유로 가장 알맞은 것은?
      choices:
        - '$\tau$ 가 작으면 점수의 순서가 바뀌기 때문에'
        - '$\tau$ 가 작으면 정답 확률이 낮아지기 때문에'
        - '$\tau$ 가 작으면 cosine similarity 가 1 을 넘기 때문에'
        - '$\tau$ 가 너무 작으면 cosine 의 아주 작은 차이도 큰 logit 차이가 되어 loss 가 크게 튀고 학습이 불안정해지기 때문에'
      answer: 3
      explanation: |
        $\tau$ 가 아주 작으면 짝을 조금만 잘못 놓아도 loss 가 크게 변한다. 그래서 CLIP 은 $\tau$ 를 학습하되 곱하는 수 $1/\tau$ 가
        100 을 넘지 않게 잘라 두었고, 이 상한이 없으면 학습이 불안정했다. $\tau$ 는 순서를 바꾸지 않고, cosine similarity 자체는
        $\tau$ 와 상관없이 −1 과 1 사이다. 정답 점수가 가장 크면 $\tau$ 를 줄일수록 정답 확률은 오히려 오른다.

- topic: zero-shot
  title: 문장으로 하는 zero-shot 분류
  variants:
    - question: |
        CLIP 의 분류를 zero-shot 이라고 부를 때 "0 개" 인 것은 무엇인가?
      choices:
        - 'CLIP 이 학습 중에 본 사진의 수'
        - '그 분류 문제의 label 이 달린 학습 예시의 수'
        - 'text encoder 에 넣는 문장의 수'
        - '분류할 수 있는 class 의 수'
      answer: 1
      explanation: |
        zero-shot 은 그 분류 문제의 label 이 달린 학습 예시를 하나도 보지 않고 푼다는 뜻이다. CLIP 은 인터넷의 사진–설명 4억 쌍으로
        고양이 사진을 이미 아주 많이 봤으므로 "사진을 본 적이 없다" 는 뜻이 아니다. class 마다 문장을 하나씩 넣어 비교하므로 문장의
        수도 class 의 수도 0 이 아니다.
    - question: |
        CLIP 으로 "고양이·개·자동차" 셋 가운데 하나를 고르는 zero-shot 분류의 절차로 옳은 것은?
      choices:
        - '세 class 의 label 이 달린 사진으로 마지막 층을 새로 학습한다'
        - '사진을 text encoder 에 넣어 class 이름을 한 단어씩 생성한다'
        - 'class 이름을 "a photo of a {}." 같은 문장으로 만들어 text encoder 에 넣고, 사진 embedding 과 cosine similarity 가 가장 큰 class 를 고른다'
        - '사진의 pixel 평균이 가장 가까운 class 를 고른다'
      answer: 2
      explanation: |
        class 를 나타내는 것은 text encoder 가 그 이름으로 만든 embedding 이다. 이름을 학습 때 많이 본 형태인 설명 문장으로 만들어
        넣고, 사진 embedding 과 가장 같은 방향인 class 를 고른다. 마지막 층을 새로 학습하면 zero-shot 이 아니고, CLIP 은 글을
        생성하지 않으며, pixel 평균은 CLIP 이 쓰는 비교가 아니다.
    - question: |
        CLIP 의 zero-shot 분류에서 class 이름 "crane" 이 공사장 크레인인지 새(두루미)인지 헷갈린다. 정확도를 높이는 방법으로 가장
        알맞은 것은?
      choices:
        - '"a photo of a crane, a type of bird." 처럼 종류를 밝힌 prompt 를 쓰고, 여러 template 으로 만든 embedding 을 평균한다'
        - 'class 이름을 "crane" 한 단어로만 넣는다'
        - 'temperature 를 0 으로 둔다'
        - 'image encoder 를 두루미 사진만으로 다시 학습한다'
      answer: 0
      explanation: |
        prompt 의 문구가 text encoder 가 만드는 embedding 을 바꾸므로, 종류를 밝히면 두루미 뜻의 embedding 이 나온다. 여러 template
        의 embedding 을 평균하는 ensemble 은 문구 하나의 버릇에 덜 흔들리게 한다. 이름 한 단어만 넣으면 뜻이 더 모호해지고,
        $\tau = 0$ 으로는 나눌 수 없다. 다시 학습하는 것은 zero-shot 의 장점을 버리는 일이다.

- topic: limits
  title: 개수·위치 관계·세밀한 구분의 한계
  variants:
    - question: |
        "말이 풀을 먹는다" 와 "풀이 말을 먹는다" 처럼 단어 순서만 다른 설명 두 개 가운데 맞는 것을 고르는 시험에서, CLIP 은 위치
        관계 문제를 56% 맞혔다. 이 숫자를 어떻게 읽어야 할까?
      choices:
        - '절반 넘게 맞혔으니 위치 관계를 잘 이해한다'
        - '시험이 너무 어려워 어떤 모델도 풀 수 없다'
        - '학습 데이터에 말과 풀 사진이 없었다'
        - '둘 중 하나를 무작위로 골라도 약 50% 를 맞히므로, 위치 관계를 거의 이해하지 못한다'
      answer: 3
      explanation: |
        보기가 두 개라 무작위로 골라도 50% 를 맞히므로, 56% 는 그보다 조금 나을 뿐이다. 말과 풀처럼 흔한 물체가 데이터에 없었던 것이
        아니라, 어떤 단어가 들어 있는지만 봐도 batch 의 다른 설명과 구별되었기 때문에 순서를 배우지 않았다. 시험이 원래 풀 수 없는
        문제라는 근거도 없다.
    - question: |
        CLIP 이 단어 순서나 위치 관계를 잘 담지 못하게 된 주된 이유는?
      choices:
        - 'batch 의 다른 설명들은 대개 들어 있는 단어부터 달라서, 어떤 단어가 있는지만 봐도 짝을 고를 수 있었기 때문에'
        - 'text encoder 가 단어를 하나도 읽지 못해서'
        - 'image encoder 가 사진을 patch 로 자르지 않아서'
        - 'temperature 가 너무 커서'
      answer: 0
      explanation: |
        "말이 풀을 먹는다" 를 "소파 위의 고양이", "길가의 빨간 자동차" 와 구별하는 데는 "말" 과 "풀" 이 있는지만 보면 충분하다.
        순서를 몰라도 loss 가 내려가므로 encoder 는 순서를 담는 법을 배우지 않았고, 어떤 단어가 있는지만 보는 bag-of-words 처럼
        행동한다. text encoder 는 단어를 읽고, image encoder 도 patch 로 자른다. temperature 는 이 한계와 관계가 없다.
    - question: |
        아래 일 가운데 CLIP 의 zero-shot 이 가장 약한 것은?
      choices:
        - '고양이 사진과 자동차 사진 구분하기'
        - '사진 속 사과가 몇 개인지 세기'
        - '"개 사진" 과 "비행기 사진" 가운데 맞는 설명 고르기'
        - '처음 보는 강아지 사진을 개로 분류하기'
      answer: 1
      explanation: |
        인터넷 설명 글에는 정확한 개수가 드물고, batch 에 개수만 다른 설명이 거의 들어오지 않아 개수를 구별하라는 신호를 받지
        못했다. 나머지 세 가지는 서로 전혀 다른 물체를 가르는 일이라 CLIP 이 잘하는 문제다. 개수·위치 관계·세밀한 구분이 약한 것은
        모두 설명 글에 그 정보가 드물고 negative 와 구별하는 데 필요하지 않았기 때문이다.

- topic: siglip
  title: 칸마다 판정하는 SigLIP
  variants:
    - question: |
        SigLIP 의 loss 가 CLIP 의 loss 와 다른 점은?
      choices:
        - '사진과 설명을 같은 encoder 하나로 처리한다'
        - '짝이 아닌 칸은 loss 계산에서 뺀다'
        - '행마다 softmax 를 하지 않고 칸마다 sigmoid 로 "짝인가" 를 따로 판정해서, 행 전체의 합을 모을 필요가 없다'
        - 'cosine similarity 대신 사진과 설명의 길이를 비교한다'
      answer: 2
      explanation: |
        SigLIP 은 CLIP 과 같은 두 encoder 와 같은 cosine 점수표를 쓰고 loss 만 바꾼다. softmax 는 분모에 행의 모든 칸이 들어가지만,
        sigmoid 판정은 칸 하나만으로 계산되므로 GPU 마다 자기 칸만 계산하면 된다. 짝이 아닌 칸도 "짝이 아님" 을 맞히는 문제로 loss
        에 들어간다.
    - question: |
        SigLIP 이 bias $b$ 를 0 이 아닌 −10 에서 시작하는 이유는?
      choices:
        - '−10 이어야 sigmoid 가 0 과 1 사이 값을 내기 때문에'
        - '칸 $B^2$ 개 가운데 짝은 $B$ 개뿐이라, 처음부터 거의 모든 칸을 "짝이 아님" 으로 판정하는 것이 실제와 가깝기 때문에'
        - '짝인 칸의 loss 를 처음부터 0 으로 만들려고'
        - 'temperature 를 쓰지 않으려고'
      answer: 1
      explanation: |
        batch 가 크면 짝인 칸의 비율이 아주 작다. 학습 초반 cosine 은 0 근처라 logit 이 거의 $b$ 이고, $b = -10$ 이면 모든 칸에
        "짝일 확률이 거의 0" 이라고 답하며 시작해 크게 틀리지 않는다. $b = 0$ 이면 모든 칸에 0.5 를 주어 수많은 짝이 아닌 칸의
        loss 가 처음 학습을 휩쓴다. sigmoid 는 어떤 값을 넣어도 0 과 1 사이이고, SigLIP 도 곱하는 수 $t$ 를 쓴다.
    - question: |
        PaliGemma·π0·OpenVLA 같은 VLA 가 사진 입구로 SigLIP 의 image encoder 를 쓴다. 이름표 1000 개로 분류를 학습한 ViT 보다 SigLIP
        이 더 잘 맞는 이유로 가장 알맞은 것은?
      choices:
        - 'SigLIP 은 ViT 와 달리 convolution 으로 사진을 읽기 때문에'
        - 'SigLIP 은 사진을 embedding 하나로만 요약하기 때문에'
        - 'SigLIP 은 로봇 시연 데이터로만 학습했기 때문에'
        - '사진과 설명 글의 짝을 맞히며 학습해서 출력이 "빨간 컵" 같은 말과 같은 공간에 놓이도록 이미 맞춰져 있기 때문에'
      answer: 3
      explanation: |
        SigLIP 의 image encoder 는 ViT 구조이고, 사진–글 짝을 맞히며 학습해 그 출력이 말의 뜻과 연결되어 있다. 그래서 언어 모델이
        지시문 token 과 사진 token 을 함께 다루기 쉽다. 이름표로 학습한 ViT 는 1000 class 를 가르는 데 필요한 정보만 담는다. VLA
        는 embedding 하나가 아니라 patch token 전부를 넘기고, SigLIP 은 인터넷의 사진–글로 학습했다.
