<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 자리에서 문 감지가 되풀이될 때의 믿음. 측정 전 0.10 이던 문일 확률이 감지 1 번 뒤 0.67, 2 번 뒤 0.97, 3 번 뒤 0.998 로 커진다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="86.0" y1="230.0" x2="640.0" y2="230.0" stroke="#475569" stroke-width="1"/>
  <text x="80.0" y="234.0" fill="#64748b" font-size="11" text-anchor="end">0</text>
  <line x1="86.0" y1="140.0" x2="640.0" y2="140.0" stroke="#1e293b" stroke-width="1"/>
  <text x="80.0" y="144.0" fill="#64748b" font-size="11" text-anchor="end">0.5</text>
  <line x1="86.0" y1="50.0" x2="640.0" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="80.0" y="54.0" fill="#64748b" font-size="11" text-anchor="end">1</text>
  <rect x="120.0" y="212.0" width="80.0" height="18.0" rx="3" fill="#94a3b8" fill-opacity="0.75" stroke="none" stroke-width="0"/>
  <text x="160.0" y="204.0" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600">0.10</text>
  <text x="160.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="middle">측정 전</text>
  <rect x="255.0" y="110.0" width="80.0" height="120.0" rx="3" fill="#7fc4a2" fill-opacity="0.75" stroke="none" stroke-width="0"/>
  <text x="295.0" y="102.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">0.67</text>
  <text x="295.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="middle">감지 1 번</text>
  <line x1="201.4" y1="209.4" x2="253.6" y2="112.6" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#am)"/>
  <rect x="390.0" y="54.9" width="80.0" height="175.1" rx="3" fill="#7fc4a2" fill-opacity="0.75" stroke="none" stroke-width="0"/>
  <text x="430.0" y="46.9" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">0.97</text>
  <text x="430.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="middle">감지 2 번</text>
  <line x1="337.1" y1="107.9" x2="387.9" y2="57.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#am)"/>
  <rect x="525.0" y="50.3" width="80.0" height="179.7" rx="3" fill="#7fc4a2" fill-opacity="0.75" stroke="none" stroke-width="0"/>
  <text x="565.0" y="42.3" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">0.998</text>
  <text x="565.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="middle">감지 3 번</text>
  <line x1="473.0" y1="54.6" x2="522.0" y2="50.6" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#am)"/>
  <text x="30.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="start">"이 자리에 문이 있다" 의 확률</text>
  <text x="340.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="middle">앞의 결과를 다음 계산의 사전 확률로 쓰면 같은 감지가 쌓일수록 확신이 커진다</text>
</svg>
