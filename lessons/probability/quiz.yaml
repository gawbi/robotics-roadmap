# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: mean-std
  title: 평균·분산·표준편차
  variants:
    - question: |
        면접관: "센서 값의 흔들림을 표준편차로 나타낼 때, 편차를 그냥 평균하지 않고 제곱해서 평균한 뒤 제곱근을 씌우는 이유는 무엇인가요?"
      choices:
        - '편차를 그대로 평균하면 +와 −가 지워져 늘 0 이 되므로 제곱으로 부호를 없애고, 제곱으로 바뀐 단위를 제곱근으로 원래 단위에 되돌리려고'
        - '제곱하면 계산이 빨라지고, 제곱근은 값을 작게 만들어 보기 좋게 하려고'
        - '제곱근을 씌워야 값이 언제나 1 보다 작아져 확률로 읽을 수 있어서'
        - '편차가 큰 값을 무시하고 작은 값만 반영하려고'
      answer: 0
      explanation: |
        편차(측정값 − 평균)는 평균을 기준으로 +와 −가 섞여 있어서 그대로 평균하면 언제나 0 이다. 그래서 제곱해 부호를 없앤 뒤 평균한 것이
        분산이고, 분산은 단위가 cm² 처럼 제곱이라 제곱근을 씌워 cm 로 되돌린 것이 표준편차다. 제곱은 오히려 큰 편차를 더 크게 반영하며, 표준편차는
        1 보다 작아야 하는 값이 아니고 계산 속도와도 관계없다.
    - question: |
        거리 센서를 네 번 읽었더니 평균에서 떨어진 정도가 +2, −2, +2, −2 cm 였다. 분산(편차² 의 평균)과 표준편차는?
      choices:
        - '분산 0 cm², 표준편차 0 cm'
        - '분산 2 cm², 표준편차 1.41 cm'
        - '분산 4 cm², 표준편차 2 cm'
        - '분산 16 cm², 표준편차 4 cm'
      answer: 2
      explanation: |
        편차를 제곱하면 모두 4 라서 평균은 $(4 + 4 + 4 + 4) \div 4 = 4$ cm² 이고, 표준편차는 $\sqrt 4 = 2$ cm 다. 0 은 편차를 제곱하지 않고
        평균했을 때의 값이고, 16 은 제곱을 평균하지 않고 하나를 다시 제곱한 값이며, 2 cm² 는 편차의 절댓값 평균을 분산으로 착각한 값이다.
    - question: |
        면접관: "평균이 같은 두 센서가 있는데 하나는 표준편차가 1 cm, 다른 하나는 5 cm 입니다. 무엇이 다른가요?"
      choices:
        - '표준편차 5 cm 센서가 실제 거리에서 평균적으로 5 cm 더 멀리 읽는다'
        - '표준편차 5 cm 센서는 한 번 읽은 값이 평균에서 훨씬 넓게 흩어진다. 두 센서의 평균이 실제 거리와 맞는지는 표준편차로 알 수 없다'
        - '표준편차 1 cm 센서는 bias 가 없다는 뜻이다'
        - '두 센서를 여러 번 평균하면 같은 정확도가 되므로 차이가 없다'
      answer: 1
      explanation: |
        표준편차는 값이 평균 주변에 얼마나 흩어지는지를 나타낸다. 평균이 실제 값에서 어긋난 정도(bias)는 표준편차와 별개라서 표준편차가 작아도
        bias 가 있을 수 있다. 표준편차는 치우친 거리가 아니며, 같은 개수를 평균해도 표준편차가 큰 센서는 평균값도 더 흔들린다.

- topic: gaussian-rule
  title: Gaussian 과 68-95-99.7 규칙
  variants:
    - question: |
        면접관: "센서 noise 가 평균 0, 표준편차 σ 인 Gaussian 이라면, 한 번 읽은 값이 평균에서 ±3σ 밖으로 나갈 확률은 대략 얼마인가요?"
      choices:
        - '약 32%'
        - '약 5%'
        - '0%. ±3σ 밖의 값은 나오지 않는다'
        - '약 0.3%'
      answer: 3
      explanation: |
        Gaussian 은 ±1σ 안에 68.3%, ±2σ 안에 95.4%, ±3σ 안에 99.7% 가 들어가므로 ±3σ 밖은 약 0.27% 다. 32% 는 ±1σ 밖, 5% 는 ±2σ 밖의 확률이다.
        0.27% 는 작지만 0 이 아니라서, 점을 1 초에 수만 개 내는 LiDAR 에서는 ±3σ 밖의 점이 매초 나온다.
    - question: |
        면접관: "LiDAR 데이터시트에 accuracy ±40 mm, repeated accuracy σ = 30 mm 라고 적혀 있습니다. noise 의 99.7% 까지 덮는 안전 여유로 알맞은 것은?"
      choices:
        - '30 mm. σ 하나면 충분하다'
        - '130 mm. 어긋날 수 있는 폭 40 mm 에 3σ = 90 mm 를 더한다'
        - '40 mm. accuracy 가 이미 모든 오차를 포함한다'
        - '70 mm. 40 mm 와 30 mm 를 더한다'
      answer: 1
      explanation: |
        Gaussian noise 의 99.7% 는 ±3σ 안이라서 30 mm × 3 = 90 mm 를 잡고, 반복해도 줄지 않는 어긋남 40 mm 를 더하면 130 mm 다. σ 하나만 잡으면
        세 번에 한 번은 여유를 넘고, 40 + 30 은 1σ 만 더한 값이라 약 68% 수준이다. accuracy 는 흩어짐을 따로 적은 repeated accuracy 와 다른 항목이다.
    - question: |
        면접관: "Gaussian 분포를 N(μ, σ²) 로 적을 때, 이 분포를 완전히 정하는 데 필요한 것은 무엇인가요?"
      choices:
        - '평균 μ 와 표준편차 σ 두 숫자'
        - '가장 큰 값과 가장 작은 값'
        - '측정한 값 전부'
        - '평균 하나. 모양은 항상 같다'
      answer: 0
      explanation: |
        Gaussian 은 평균이 종의 가운데 위치를, 표준편차가 폭을 정해서 두 숫자로 모양 전체가 정해진다. Gaussian 은 양쪽으로 끝없이 이어지므로
        최댓값·최솟값이 없고, 측정값 전부가 필요하지도 않다. 평균만으로는 폭을 알 수 없다.

- topic: averaging-bias
  title: 평균 내기와 bias
  variants:
    - question: |
        면접관: "표준편차 2 cm 인 거리 센서의 독립인 측정 4 개를 평균하면, 평균값의 표준편차는 얼마가 되나요?"
      choices:
        - '0.5 cm. 개수만큼 나눠진다'
        - '2 cm. 평균해도 흔들림은 같다'
        - '1 cm. √4 = 2 로 나눠진다'
        - '8 cm. 네 개의 오차가 더해진다'
      answer: 2
      explanation: |
        독립인 측정 N 개의 평균은 표준편차가 σ ÷ √N 이라 2 ÷ √4 = 1 cm 다. +와 −의 오차가 서로 일부만 상쇄되기 때문에 N 이 아니라 √N 으로
        나뉜다. 0.5 cm 는 N 으로 나눈 값이고, 합의 오차를 생각해도 표준편차는 2 × √4 = 4 cm 이지 8 cm 가 아니다.
    - question: |
        면접관: "센서 값을 1000 번 평균했는데도 실제 거리와 3 cm 차이가 납니다. 가장 그럴듯한 원인과 해결책은?"
      choices:
        - '센서에 늘 같은 쪽으로 틀리는 bias 가 있어서 평균으로는 줄지 않는다. 알려진 거리에서 재서 빼는 calibration 이 필요하다'
        - '1000 번으로는 부족하니 10000 번 평균하면 0 에 가까워진다'
        - 'noise 가 Gaussian 이 아니라서 평균을 내면 안 된다'
        - '측정 주기가 너무 빨라서 생긴 문제이므로 주기를 늦추면 된다'
      answer: 0
      explanation: |
        평균으로 줄어드는 것은 측정마다 독립으로 바뀌는 noise 뿐이다. 매번 같은 쪽으로 같은 만큼 틀리는 bias 는 몇 번을 평균해도 그대로 남으므로,
        실제 값을 아는 기준(예: 정확히 2.00 m 에 둔 벽)에서 재서 빼는 calibration 으로 없앤다. 더 많이 평균하거나 주기를 바꿔도 bias 는 남는다.
    - question: |
        면접관: "평균값의 표준편차가 σ ÷ √N 으로 줄어든다는 규칙이 성립하지 않는 경우는 언제인가요?"
      choices:
        - '센서의 표준편차가 1 cm 보다 작을 때'
        - '측정 횟수 N 이 짝수일 때'
        - '센서 값이 m 가 아니라 cm 단위일 때'
        - '연속한 측정이 같은 반사면 때문에 같은 쪽으로 틀리는 것처럼, 측정의 오차가 서로 독립이 아닐 때'
      answer: 3
      explanation: |
        √N 규칙은 측정의 오차가 서로 독립이어서 +와 −가 섞여 일부 상쇄된다는 가정에서 나온다. 오차가 같은 쪽으로 함께 움직이면 상쇄되지 않아
        덜 줄고, 늘 같은 bias 는 전혀 줄지 않는다. 표준편차의 크기, N 의 홀짝, 단위는 규칙과 관계없다.

- topic: covariance
  title: 공분산과 상관계수
  variants:
    - question: |
        면접관: "GPS 위치의 x 오차와 y 오차 사이의 공분산이 양수라는 것은 무슨 뜻인가요?"
      choices:
        - 'x 오차와 y 오차가 둘 다 항상 양수라는 뜻이다'
        - 'x 가 +쪽으로 틀릴 때 y 도 +쪽으로, x 가 −쪽일 때 y 도 −쪽으로 틀리는 경향이 있다는 뜻이다'
        - 'x 와 y 의 오차가 서로 관계없다는 뜻이다'
        - 'x 의 분산이 y 의 분산보다 크다는 뜻이다'
      answer: 1
      explanation: |
        공분산은 두 편차를 곱한 값의 평균이다. 같은 쪽으로 틀리면 곱이 +, 반대쪽이면 − 라서 공분산이 양수면 둘이 함께 같은 방향으로 움직이는
        경향이 있다. 오차 자체의 부호나 두 분산의 크기 비교와는 다른 이야기이고, 관계가 없으면 공분산은 0 이다.
    - question: |
        x 의 분산이 4, y 의 분산이 1, 둘의 공분산이 1 이다. 상관계수(공분산 ÷ 두 표준편차의 곱)는?
      choices:
        - '0.25'
        - '1'
        - '4'
        - '0.5'
      answer: 3
      explanation: |
        표준편차는 분산의 제곱근이라 x 는 2, y 는 1 이다. 상관계수는 $1 \div (2 \times 1) = 0.5$ 다. 0.25 는 분산을 그대로 곱한 4 로 나눈 값이고,
        상관계수는 언제나 −1 과 1 사이라서 4 는 나올 수 없다. 1 은 두 값이 한 직선 위에 놓일 만큼 완전히 함께 움직일 때다.
    - question: |
        면접관: "공분산 대신 상관계수를 보는 이유는 무엇인가요?"
      choices:
        - '상관계수는 원인과 결과를 알려 주기 때문이다'
        - '상관계수는 분산을 계산하지 않아도 구할 수 있기 때문이다'
        - '공분산은 값의 크기와 단위에 따라 커지지만, 상관계수는 두 표준편차로 나눠 −1 과 1 사이로 맞춰서 함께 움직이는 정도를 바로 비교할 수 있기 때문이다'
        - '공분산은 음수가 될 수 없어서 반대로 움직이는 관계를 나타내지 못하기 때문이다'
      answer: 2
      explanation: |
        공분산은 m 를 cm 로 바꾸기만 해도 1만 배가 되는 것처럼 크기에 따라 달라져서 강도를 읽기 어렵다. 상관계수는 공분산을 두 표준편차의 곱으로
        나눈 값이라 단위가 없고 −1 과 1 사이에 있다. 상관계수를 구하려면 표준편차가 필요하고, 상관은 인과를 말해 주지 않으며, 공분산도 음수가 될 수 있다.

- topic: covariance-matrix
  title: 공분산 행렬과 오차 타원
  variants:
    - question: |
        면접관: "2차원 위치의 불확실성을 x·y 의 분산 두 개가 아니라 2 × 2 공분산 행렬로 나타내는 이유는 무엇인가요?"
      choices:
        - '대각선 밖의 공분산까지 담아 x·y 가 함께 틀리는 관계를 표현하고, 방향 vector u 를 곱한 uᵀΣu 로 어느 방향의 분산이든 구할 수 있기 때문이다'
        - '행렬로 적으면 메시지 크기가 작아지기 때문이다'
        - 'ROS 가 숫자 두 개짜리 배열을 지원하지 않기 때문이다'
        - '분산 두 개만으로도 같은 정보를 담지만 관습상 행렬로 쓸 뿐이다'
      answer: 0
      explanation: |
        분산 두 개는 x 축과 y 축 방향의 퍼짐만 알려 준다. 공분산까지 담은 행렬이 있어야 오차가 비스듬한 방향으로 길게 퍼진 경우를 표현할 수 있고,
        길이 1 인 방향 vector u 로 uᵀΣu 를 계산하면 그 방향의 분산이 나온다. 메시지 크기나 관습 때문이 아니며, 분산 두 개로는 기울어진 타원을 나타낼 수 없다.
    - question: |
        면접관: "공분산 행렬이 [[2, 1.6], [1.6, 2]] m² 인 위치 추정의 오차 타원은 어떤 모양인가요?"
      choices:
        - '반지름이 같은 원이다'
        - 'x 축 방향으로 길쭉한 타원이다'
        - '공분산이 양수라 x 와 y 가 함께 움직여서, x = y 방향(오른쪽 위)으로 길게 기운 타원이다'
        - 'x = −y 방향(오른쪽 아래)으로 길게 기운 타원이다'
      answer: 2
      explanation: |
        대각선의 분산이 같고 공분산이 양수라서 오차는 x 와 y 가 같은 쪽으로 틀리는 오른쪽 위 방향으로 길게 퍼진다. 그 방향의 분산은
        $(2 + 1.6 + 1.6 + 2) \div 2 = 3.6$, 직각 방향은 0.4 다. 원은 공분산이 0 일 때, 오른쪽 아래로 기운 타원은 공분산이 음수일 때다.
    - question: |
        면접관: "2차원 위치 추정의 1σ 오차 타원 안에는 실제 위치가 몇 % 확률로 들어오나요? Gaussian 이라고 가정합니다."
      choices:
        - '68%. 1차원과 같다'
        - '약 39%. 두 방향으로 동시에 들어와야 해서 1차원의 68% 보다 작다'
        - '99.7%'
        - '50%'
      answer: 1
      explanation: |
        2차원 Gaussian 의 1σ 타원 안에는 약 39%, 2σ 타원 안에는 약 86%, 3σ 타원 안에는 약 98.9% 가 들어간다. 1차원의 68-95-99.7 규칙을 그대로
        적용해 68% 라고 읽으면 위치를 실제보다 확실하게 아는 것으로 착각하게 된다. 99.7% 는 1차원 ±3σ 의 값이다.

- topic: bayes-rule
  title: 조건부 확률과 Bayes rule
  variants:
    - question: |
        면접관: "문이 있는 위치가 10% 인 복도에서, 문 앞에서는 90% 로 감지하고 벽 앞에서는 5% 로 오경보를 내는 감지기가 문이라고 했습니다. 실제로 문일 확률은 대략?"
      choices:
        - '90%'
        - '95%'
        - '10%'
        - '약 67%'
      answer: 3
      explanation: |
        위치 1000 곳으로 세면 문 100 곳 중 90 곳, 벽 900 곳 중 45 곳에서 감지가 뜬다. 감지가 뜬 135 곳 중 문은 90 곳이라 90 ÷ 135 ≈ 0.67 이다.
        90% 는 문일 때 감지가 뜰 확률 P(감지|문)이고, 95% 는 벽 앞에서 조용할 확률, 10% 는 측정 전의 prior 다.
    - question: |
        면접관: "Bayes rule 에서 prior, likelihood, posterior 는 각각 무엇인가요?"
      choices:
        - 'prior 는 측정값, likelihood 는 측정 전 믿음, posterior 는 센서 사양이다'
        - 'prior 는 측정 전의 믿음, likelihood 는 상태마다 그 측정이 나올 확률, posterior 는 측정을 반영한 뒤의 믿음이다'
        - '세 값은 모두 같은 확률을 다른 이름으로 부른 것이다'
        - 'prior 는 오경보율, likelihood 는 적중률, posterior 는 둘의 평균이다'
      answer: 1
      explanation: |
        prior P(문)은 측정 전에 문일 확률, likelihood P(감지|문)은 문이라는 상태에서 그 측정이 나올 확률, posterior P(문|감지)는 측정 뒤의 확률이다.
        posterior 는 likelihood × prior 를 그 측정이 나올 전체 확률로 나눠 구하며, 적중률과 오경보율의 평균이 아니다.
    - question: |
        면접관: "같은 감지기(적중률 90%, 오경보율 5%)를 문이 1% 뿐인 복도와 50% 인 복도에 각각 두면, 감지가 떴을 때 문일 확률은 어떻게 다른가요?"
      choices:
        - '문이 드문 복도에서는 감지 대부분이 오경보라 확률이 낮고(약 15%), 문이 흔한 복도에서는 높다(약 95%)'
        - '감지기가 같으므로 두 복도 모두 90% 다'
        - '문이 드문 복도에서 더 높다. 드문 것을 찾았으니 더 확실하다'
        - '두 복도 모두 50% 다'
      answer: 0
      explanation: |
        posterior 는 prior 에 크게 좌우된다. 문이 1% 이면 1000 곳 중 문에서 9 곳, 벽 990 곳에서 약 50 곳이 감지되어 문일 확률은 약 0.15 이고, 50% 이면
        450 곳과 25 곳이라 약 0.95 다. 적중률만으로 posterior 가 정해지지 않으며, 드문 것을 찾는 센서일수록 오경보의 비중이 커진다.

- topic: bayes-update
  title: 반복 측정과 Bayes filter
  variants:
    - question: |
        면접관: "같은 자리에서 문 감지가 두 번 연달아 떴습니다. 두 번째 측정을 Bayes rule 로 반영할 때 prior 로 무엇을 쓰나요?"
      choices:
        - '처음의 prior 를 그대로 쓴다'
        - '감지기의 적중률 90% 를 쓴다'
        - '첫 번째 측정 뒤의 posterior 를 새 prior 로 쓴다'
        - '0.5 로 초기화한다'
      answer: 2
      explanation: |
        Bayes 갱신은 되풀이할 수 있어서, 앞 측정의 posterior 가 다음 측정의 prior 가 된다. 문 예에서는 0.10 → 0.67 → 0.97 로 확신이 커진다.
        처음 prior 를 다시 쓰면 첫 측정의 정보를 버리게 되고, 적중률은 likelihood 이지 prior 가 아니다.
    - question: |
        면접관: "반복 측정으로 믿음이 빠르게 확실해지는 계산이 틀리는 경우는 언제인가요?"
      choices:
        - '측정 횟수가 세 번을 넘을 때'
        - '감지기의 적중률이 50% 보다 높을 때'
        - 'prior 가 0.1 보다 클 때'
        - '오경보가 문처럼 생긴 포스터 때문이라 같은 자리에서 매번 똑같이 뜨는 것처럼, 측정의 오류가 서로 독립이 아닐 때'
      answer: 3
      explanation: |
        반복 갱신은 측정마다 오류가 독립이라고 가정한다. 같은 원인으로 같은 오경보가 되풀이되면 측정 여러 번이 사실상 한 번의 정보인데, 독립으로
        계산하면 확신만 지나치게 커진다. 평균으로 bias 를 지울 수 없는 것과 같은 이유다. 횟수, 적중률, prior 의 크기는 이 가정과 관계없다.
    - question: |
        면접관: "Kalman filter 와 particle filter 는 Bayes filter 와 어떤 관계인가요?"
      choices:
        - '둘 다 Bayes filter 와 관계없는 별도의 방법이다'
        - '둘 다 예측과 Bayes rule 갱신을 되풀이하는 Bayes filter 이고, Kalman filter 는 믿음을 Gaussian 하나로, particle filter 는 sample 수백 ~ 수천 개로 나타낸다'
        - 'Kalman filter 는 sample 로, particle filter 는 Gaussian 으로 믿음을 나타낸다'
        - 'particle filter 는 측정 없이 예측만 한다'
      answer: 1
      explanation: |
        Bayes filter 는 움직임으로 믿음을 옮기고 넓히는 예측과, 측정으로 Bayes rule 을 적용하는 갱신을 되풀이한다. 믿음을 Gaussian 으로 두면
        평균과 공분산만 고치는 Kalman filter 가 되고, sample 로 두면 봉우리가 여럿인 믿음도 나타내는 particle filter(Nav2 의 AMCL)가 된다.
        particle filter 도 측정으로 sample 의 가중치를 고친다.

- topic: expected-value-sampling
  title: 기댓값과 sampling
  variants:
    - question: |
        면접관: "집기 방법 A 는 90% 로 성공해 보상 10, 10% 로 물건을 떨어뜨려 보상 −50 이고, B 는 70% 로 성공해 보상 10, 30% 는 보상 0 입니다. 기댓값으로 고르면?"
      choices:
        - 'B. A 는 0.9 × 10 + 0.1 × (−50) = 4, B 는 0.7 × 10 = 7 이다'
        - 'A. 성공률이 더 높다'
        - '둘이 같다. 성공 보상이 같기 때문이다'
        - 'A. 기댓값이 9 로 더 크다'
      answer: 0
      explanation: |
        기댓값은 결과마다 보상 × 확률을 더한 값이다. A 는 9 − 5 = 4, B 는 7 + 0 = 7 이라 B 가 크다. 성공률만 보면 실패의 크기(−50)를 놓치고,
        A 의 9 는 실패 보상을 빼먹은 값이다.
    - question: |
        면접관: "평균 μ, 표준편차 σ 인 Gaussian 에서 값을 하나 sampling 하려면, 표준 정규분포 N(0, 1) 에서 뽑은 ε 을 어떻게 바꾸나요?"
      choices:
        - 'ε × μ + σ'
        - 'ε 를 그대로 쓴다'
        - 'μ + σ × ε'
        - 'μ + σ² × ε'
      answer: 2
      explanation: |
        N(0, 1) 에서 뽑은 ε 에 σ 를 곱하면 폭이 σ 가 되고, μ 를 더하면 가운데가 μ 로 옮겨 간다. 평균 2.00 m, σ 0.02 m 이면 ε = 1.5 일 때 2.03 m 다.
        σ² 는 분산이라 곱하면 폭이 틀리고, μ 와 σ 의 자리를 바꾸면 다른 분포가 된다. VAE 의 reparameterization trick 도 같은 식이다.
    - question: |
        면접관: "기댓값이 같은 두 행동이 있습니다. 그래도 둘을 구별해야 하는 이유는 무엇인가요?"
      choices:
        - '기댓값이 같으면 결과도 매번 같아서 구별할 필요가 없다'
        - '기댓값은 한 번 해 본 결과라서 믿을 수 없기 때문이다'
        - '기댓값이 같으면 확률도 같기 때문이다'
        - '기댓값은 평균만 알려 줄 뿐이라, 한쪽이 가끔 큰 손해를 내는 것처럼 결과가 퍼진 정도(분산)가 다를 수 있기 때문이다'
      answer: 3
      explanation: |
        기댓값은 아주 여러 번 했을 때의 평균이다. 성공 10·실패 −20 (90%·10%)과 성공 10·실패 0 (70%·30%)은 기댓값이 둘 다 7 이지만 앞쪽만 가끔
        큰 손해를 낸다. 기댓값이 같아도 결과와 확률은 다를 수 있고, 기댓값은 한 번의 결과가 아니라 평균이다.
