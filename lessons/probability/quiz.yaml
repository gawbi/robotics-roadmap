# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: mean-std
  title: 평균·분산·표준편차
  variants:
    - question: |
        센서 값의 흔들림을 표준편차로 나타낼 때, 편차를 그냥 평균하지 않고 제곱해서 평균한 뒤 제곱근을 씌우는 이유는 무엇인가?
      choices:
        - '편차의 평균은 늘 0 이라 제곱으로 부호를 없애고, 제곱근으로 단위를 되돌리려고'
        - '제곱하면 절댓값보다 계산이 빨라지고, 제곱근은 커진 값을 줄여 측정값과 비교하기 쉽게 하려고'
        - '제곱근을 씌우면 값이 언제나 1 보다 작아져서, 표준편차를 확률처럼 읽을 수 있게 하려고'
        - '제곱하면 큰 편차의 비중이 줄어서, 가끔 튀는 값에 끌려가지 않는 흔들림 값을 얻으려고'
      answer: 0
      explanation: |
        편차(측정값 − 평균)는 평균을 기준으로 +와 −가 섞여 있어서 그대로 평균하면 언제나 0 이다. 그래서 제곱해 부호를 없앤 뒤 평균한 것이
        분산이고, 분산은 단위가 cm² 처럼 제곱이라 제곱근을 씌워 cm 로 되돌린 것이 표준편차다. 제곱은 오히려 큰 편차를 더 크게 반영하며, 표준편차는
        1 보다 작아야 하는 값이 아니고 계산 속도와도 관계없다.
    - question: |
        거리 센서를 네 번 읽었더니 평균에서 떨어진 정도가 +2, −2, +2, −2 cm 였다. 분산(편차² 의 평균)과 표준편차는?
      choices:
        - '분산 0 cm², 표준편차 0 cm'
        - '분산 2 cm², 표준편차 1.41 cm'
        - '분산 4 cm², 표준편차 2 cm'
        - '분산 16 cm², 표준편차 4 cm'
      answer: 2
      explanation: |
        편차를 제곱하면 모두 4 라서 평균은 $(4 + 4 + 4 + 4) \div 4 = 4$ cm² 이고, 표준편차는 $\sqrt 4 = 2$ cm 다. 0 은 편차를 제곱하지 않고
        평균했을 때의 값이고, 16 은 제곱을 평균하지 않고 하나를 다시 제곱한 값이며, 2 cm² 는 편차의 절댓값 평균을 분산으로 착각한 값이다.
    - question: |
        평균이 같은 두 센서가 있는데 하나는 표준편차가 1 cm 이고 다른 하나는 5 cm 이다. 무엇이 다른가?
      choices:
        - '5 cm 센서는 실제 거리보다 평균 5 cm 더 멀리 읽으므로, 읽은 값마다 5 cm 를 빼 주어야 맞는다'
        - '5 cm 센서의 값이 평균 주변에 더 넓게 흩어진다. 평균이 실제 거리와 맞는지는 표준편차로 알 수 없다'
        - '1 cm 센서는 흩어짐이 작으니 bias 도 없어서, 그 평균은 실제 거리와 맞는다'
        - '여러 번 평균하면 흩어짐이 사라지므로, 충분히 평균한 뒤에는 두 센서의 정확도가 같다'
      answer: 1
      explanation: |
        표준편차는 값이 평균 주변에 얼마나 흩어지는지를 나타낸다. 평균이 실제 값에서 어긋난 정도(bias)는 표준편차와 별개라서 표준편차가 작아도
        bias 가 있을 수 있다. 표준편차는 치우친 거리가 아니며, 같은 개수를 평균해도 표준편차가 큰 센서는 평균값도 더 흔들린다.

- topic: gaussian-rule
  title: Gaussian 과 68-95-99.7 규칙
  variants:
    - question: |
        센서 noise 가 평균 0, 표준편차 σ 인 Gaussian 이라면, 한 번 읽은 값이 평균에서 ±3σ 밖으로 나갈 확률은 대략 얼마인가?
      choices:
        - '약 32%'
        - '약 5%'
        - '0%. ±3σ 밖의 값은 나오지 않는다'
        - '약 0.3%'
      answer: 3
      explanation: |
        Gaussian 은 ±1σ 안에 68.3%, ±2σ 안에 95.4%, ±3σ 안에 99.7% 가 들어가므로 ±3σ 밖은 약 0.27% 다. 32% 는 ±1σ 밖, 5% 는 ±2σ 밖의 확률이다.
        0.27% 는 작지만 0 이 아니라서, 점을 1 초에 수만 개 내는 LiDAR 에서는 ±3σ 밖의 점이 매초 나온다.
    - question: |
        LiDAR 데이터시트에 accuracy ±40 mm, repeated accuracy σ = 30 mm 라고 적혀 있다. noise 의 99.7% 까지 덮는 안전 여유로 알맞은 것은?
      choices:
        - '30 mm. noise 가 σ 를 넘는 일은 드물어서 σ 하나면 충분하다'
        - '130 mm. 어긋날 수 있는 폭 40 mm 에 3σ = 90 mm 를 더한다'
        - '40 mm. accuracy ±40 mm 가 이미 흩어짐까지 포함한 전체 범위다'
        - '70 mm. 어긋날 수 있는 폭 40 mm 에 σ = 30 mm 를 더한다'
      answer: 1
      explanation: |
        Gaussian noise 의 99.7% 는 ±3σ 안이라서 30 mm × 3 = 90 mm 를 잡고, 반복해도 줄지 않는 어긋남 40 mm 를 더하면 130 mm 다. σ 하나만 잡으면
        세 번에 한 번은 여유를 넘고, 40 + 30 은 1σ 만 더한 값이라 약 68% 수준이다. accuracy 는 흩어짐을 따로 적은 repeated accuracy 와 다른 항목이다.
    - question: |
        Gaussian 분포를 N(μ, σ²) 로 적을 때, 이 분포를 완전히 정하는 데 필요한 것은 무엇인가?
      choices:
        - '평균 μ 와 표준편차 σ. 하나는 가운데를 정하고 하나는 폭을 정한다'
        - '가장 큰 값과 가장 작은 값. 종 모양은 그 두 값 사이에 걸쳐 놓인다'
        - '측정한 값 전부. 숫자 몇 개로는 종의 모양을 빠짐없이 정할 수 없다'
        - '평균 하나. 종의 폭은 어느 Gaussian 이나 같다'
      answer: 0
      explanation: |
        Gaussian 은 평균이 종의 가운데 위치를, 표준편차가 폭을 정해서 두 숫자로 모양 전체가 정해진다. Gaussian 은 양쪽으로 끝없이 이어지므로
        최댓값·최솟값이 없고, 측정값 전부가 필요하지도 않다. 평균만으로는 폭을 알 수 없다.

- topic: averaging-bias
  title: 평균 내기와 bias
  variants:
    - question: |
        표준편차 2 cm 인 거리 센서의 독립인 측정 4 개를 평균하면, 평균값의 표준편차는 얼마가 되는가?
      choices:
        - '0.5 cm. 개수만큼 나눠진다'
        - '2 cm. 평균해도 흔들림은 같다'
        - '1 cm. √4 = 2 로 나눠진다'
        - '8 cm. 네 개의 오차가 더해진다'
      answer: 2
      explanation: |
        독립인 측정 N 개의 평균은 표준편차가 σ ÷ √N 이라 2 ÷ √4 = 1 cm 다. +와 −의 오차가 서로 일부만 상쇄되기 때문에 N 이 아니라 √N 으로
        나뉜다. 0.5 cm 는 N 으로 나눈 값이고, 합의 오차를 생각해도 표준편차는 2 × √4 = 4 cm 이지 8 cm 가 아니다.
    - question: |
        센서 값을 1000 번 평균했는데도 실제 거리와 3 cm 차이가 난다. 가장 그럴듯한 원인과 해결책은?
      choices:
        - '평균해도 줄지 않는 bias 다. 알려진 거리에서 재서 빼는 calibration 이 필요하다'
        - 'noise 가 아직 덜 상쇄된 것이라서, 10000 번 평균하면 차이가 0 에 가까워진다'
        - 'noise 가 Gaussian 이 아니라서 평균이 한쪽으로 끌려간 것이므로, 평균 대신 중앙값을 써야 한다'
        - '측정 주기가 너무 짧아 앞 측정의 반사가 섞인 것이므로, 주기를 늦추면 차이가 사라진다'
      answer: 0
      explanation: |
        평균으로 줄어드는 것은 측정마다 독립으로 바뀌는 noise 뿐이다. 매번 같은 쪽으로 같은 만큼 틀리는 bias 는 몇 번을 평균해도 그대로 남으므로,
        실제 값을 아는 기준(예: 정확히 2.00 m 에 둔 벽)에서 재서 빼는 calibration 으로 없앤다. 더 많이 평균해도, 평균 대신 중앙값을 써도, 주기를
        바꿔도 모든 값이 같은 쪽으로 3 cm 치우쳐 있으니 bias 는 남는다.
    - question: |
        평균값의 표준편차가 σ ÷ √N 으로 줄어든다는 규칙이 성립하지 않는 경우는 언제인가?
      choices:
        - '센서의 표준편차가 1 cm 보다 작아서, 더 줄어들 흔들림이 거의 남지 않았을 때'
        - '측정 횟수 N 이 짝수라서, +와 −의 오차가 짝지어 정확히 0 으로 지워질 때'
        - '센서 값을 m 가 아니라 cm 로 적어서, σ 와 √N 의 단위가 서로 맞지 않을 때'
        - '같은 반사면 때문에 연속한 측정이 같은 쪽으로 틀려서, 오차가 독립이 아닐 때'
      answer: 3
      explanation: |
        √N 규칙은 측정의 오차가 서로 독립이어서 +와 −가 섞여 일부 상쇄된다는 가정에서 나온다. 오차가 같은 쪽으로 함께 움직이면 상쇄되지 않아
        덜 줄고, 늘 같은 bias 는 전혀 줄지 않는다. 표준편차의 크기, N 의 홀짝, 단위는 규칙과 관계없다.

- topic: covariance
  title: 공분산과 상관계수
  variants:
    - question: |
        GPS 위치의 x 오차와 y 오차 사이의 공분산이 양수라는 것은 무슨 뜻인가?
      choices:
        - 'x 오차와 y 오차가 둘 다 늘 양수라서, 위치가 언제나 오른쪽 위로 치우친다는 뜻이다'
        - 'x 와 y 가 같은 쪽(+는 +끼리, −는 −끼리)으로 함께 틀리는 경향이 있다는 뜻이다'
        - 'x 와 y 의 오차가 서로 관계없어서, 두 방향을 따로 계산해도 된다는 뜻이다'
        - 'x 의 분산이 y 의 분산보다 커서, x 방향으로 더 크게 흔들린다는 뜻이다'
      answer: 1
      explanation: |
        공분산은 두 편차를 곱한 값의 평균이다. 같은 쪽으로 틀리면 곱이 +, 반대쪽이면 − 라서 공분산이 양수면 둘이 함께 같은 방향으로 움직이는
        경향이 있다. 오차 자체의 부호나 두 분산의 크기 비교와는 다른 이야기이고, 관계가 없으면 공분산은 0 이다.
    - question: |
        x 의 분산이 4, y 의 분산이 1, 둘의 공분산이 1 이다. 상관계수(공분산 ÷ 두 표준편차의 곱)는?
      choices:
        - '0.25'
        - '1'
        - '4'
        - '0.5'
      answer: 3
      explanation: |
        표준편차는 분산의 제곱근이라 x 는 2, y 는 1 이다. 상관계수는 $1 \div (2 \times 1) = 0.5$ 다. 0.25 는 분산을 그대로 곱한 4 로 나눈 값이고,
        상관계수는 언제나 −1 과 1 사이라서 4 는 나올 수 없다. 1 은 두 값이 한 직선 위에 놓일 만큼 완전히 함께 움직일 때다.
    - question: |
        공분산 대신 상관계수를 보는 이유는 무엇인가?
      choices:
        - '상관계수가 1 에 가까우면 한쪽이 다른 쪽의 원인이라는 것까지 알 수 있기 때문이다'
        - '상관계수는 분산이나 표준편차 없이 두 편차의 부호만 세어 구할 수 있기 때문이다'
        - '공분산은 단위에 따라 크기가 바뀌지만, 상관계수는 −1 과 1 사이라 강도를 비교하기 쉬워서다'
        - '공분산은 음수가 될 수 없어서, 반대로 움직이는 관계는 상관계수로만 나타낼 수 있기 때문이다'
      answer: 2
      explanation: |
        공분산은 m 를 cm 로 바꾸기만 해도 1만 배가 되는 것처럼 크기에 따라 달라져서 강도를 읽기 어렵다. 상관계수는 공분산을 두 표준편차의 곱으로
        나눈 값이라 단위가 없고 −1 과 1 사이에 있다. 상관계수를 구하려면 표준편차가 필요하고, 상관은 인과를 말해 주지 않으며, 공분산도 음수가 될 수 있다.

- topic: covariance-matrix
  title: 공분산 행렬과 오차 타원
  variants:
    - question: |
        2차원 위치의 불확실성을 x·y 의 분산 두 개가 아니라 2 × 2 공분산 행렬로 나타내는 이유는 무엇인가?
      choices:
        - '대각선 밖의 공분산으로 x·y 가 함께 틀리는 관계를 담아, 비스듬한 방향의 퍼짐도 나타낼 수 있어서다'
        - '행렬로 묶어 보내면 숫자 두 개를 따로 보낼 때보다 메시지 크기가 작아지기 때문이다'
        - '대각선 밖 칸에 x 와 y 의 분산을 한 번 더 적어 두면, 받는 쪽에서 값을 검산할 수 있어서다'
        - '분산 두 개만으로도 어느 방향의 퍼짐이든 구할 수 있지만, 관습상 행렬로 쓸 뿐이다'
      answer: 0
      explanation: |
        분산 두 개는 x 축과 y 축 방향의 퍼짐만 알려 준다. 공분산까지 담은 행렬이 있어야 오차가 비스듬한 방향으로 길게 퍼진 경우를 표현할 수 있고,
        길이 1 인 방향 vector u 로 uᵀΣu 를 계산하면 그 방향의 분산이 나온다. 대각선 밖 칸은 분산을 다시 적은 것이 아니라 공분산이다. 메시지 크기나
        관습 때문도 아니며, 분산 두 개로는 기울어진 타원을 나타낼 수 없다.
    - question: |
        공분산 행렬이 [[2, 1.6], [1.6, 2]] m² 인 위치 추정의 오차 타원은 어떤 모양인가?
      choices:
        - '대각선의 두 분산이 2 로 같으므로, 어느 방향으로나 반지름이 같은 원이다'
        - '공분산 1.6 이 분산 2 보다 작아서, x 축 방향으로 조금 길쭉한 타원이다'
        - '공분산이 양수라서 x = y 방향(오른쪽 위)으로 길게 기운 타원이다'
        - '공분산이 양수라 x 가 늘 때 y 가 줄어서, x = −y 방향(오른쪽 아래)으로 기운 타원이다'
      answer: 2
      explanation: |
        대각선의 분산이 같고 공분산이 양수라서 오차는 x 와 y 가 같은 쪽으로 틀리는 오른쪽 위 방향으로 길게 퍼진다. 그 방향의 분산은
        $(2 + 1.6 + 1.6 + 2) \div 2 = 3.6$ 이고, 직각 방향은 0.4 다. 두 분산이 같아도 원이 되는 것은 공분산이 0 일 때뿐이고, 축에 나란한 타원도
        공분산이 0 일 때 나온다. 공분산이 양수면 x 가 늘 때 y 도 느는 쪽이므로, 오른쪽 아래로 기운 타원은 공분산이 음수일 때다.
    - question: |
        2차원 위치 추정의 1σ 오차 타원 안에는 실제 위치가 몇 % 확률로 들어오는가? Gaussian 이라고 가정한다.
      choices:
        - '68%. 1σ 안에 드는 확률은 차원과 관계없이 늘 같다'
        - '약 39%. 두 방향으로 동시에 들어와야 해서 68% 보다 작다'
        - '약 86%. x 와 y 두 방향의 확률이 보태져 1차원보다 커진다'
        - '50%. 1σ 타원은 넓이로 안과 밖을 반반 나누는 경계다'
      answer: 1
      explanation: |
        2차원 Gaussian 의 1σ 타원 안에는 약 39%, 2σ 타원 안에는 약 86%, 3σ 타원 안에는 약 98.9% 가 들어간다. 1차원의 68-95-99.7 규칙을 그대로
        적용해 68% 라고 읽으면 위치를 실제보다 확실하게 아는 것으로 착각하게 된다. 86% 는 2σ 타원 안의 확률이고, 1σ 타원은 확률을 반반 나누는
        경계가 아니라서 50% 도 아니다.

- topic: bayes-rule
  title: 조건부 확률과 Bayes rule
  variants:
    - question: |
        문이 있는 위치가 10% 인 복도에서, 문 앞에서는 90% 로 감지하고 벽 앞에서는 5% 로 오경보를 내는 감지기가 문이라고 했다. 실제로 문일 확률은 대략 얼마인가?
      choices:
        - '90%. 감지기의 적중률이 곧 문일 확률이다'
        - '95%. 오경보 5% 를 뺀 나머지가 문이다'
        - '10%. 측정해도 prior 는 바뀌지 않는다'
        - '약 67%. 오경보가 섞여 적중률보다 낮다'
      answer: 3
      explanation: |
        위치 1000 곳으로 세면 문 100 곳 중 90 곳, 벽 900 곳 중 45 곳에서 감지가 뜬다. 감지가 뜬 135 곳 중 문은 90 곳이라 90 ÷ 135 ≈ 0.67 이다.
        90% 는 문일 때 감지가 뜰 확률 P(감지|문)이고, 95% 는 벽 앞에서 조용할 확률이며, 10% 는 측정으로 고치기 전의 prior 다.
    - question: |
        Bayes rule 에서 prior, likelihood, posterior 는 각각 무엇인가?
      choices:
        - 'prior 는 방금 읽은 측정값이고, likelihood 는 측정 전의 믿음이고, posterior 는 센서 사양이다'
        - 'prior 는 측정 전의 믿음이고, likelihood 는 상태마다 그 측정이 나올 확률이고, posterior 는 측정 뒤의 믿음이다'
        - '세 값은 같은 확률을 Bayes rule 의 계산 단계에 따라 다른 이름으로 부른 것이다'
        - 'prior 는 오경보율이고, likelihood 는 적중률이고, posterior 는 두 확률의 평균이다'
      answer: 1
      explanation: |
        prior P(문)은 측정 전에 문일 확률, likelihood P(감지|문)은 문이라는 상태에서 그 측정이 나올 확률, posterior P(문|감지)는 측정 뒤의 확률이다.
        posterior 는 likelihood × prior 를 그 측정이 나올 전체 확률로 나눠 구하며, 적중률과 오경보율의 평균이 아니다.
    - question: |
        같은 감지기(적중률 90%, 오경보율 5%)를 문이 1% 뿐인 복도와 50% 인 복도에 각각 두면, 감지가 떴을 때 문일 확률은 어떻게 다른가?
      choices:
        - '문이 드문 복도에서는 감지 대부분이 오경보라 약 15% 이고, 문이 흔한 복도에서는 약 95% 다'
        - '감지기의 적중률이 같으므로, 두 복도 모두 감지가 뜨면 90% 의 확률로 문이다'
        - '문이 드문 복도에서 더 높다. 드문 것을 감지했으니 우연일 가능성이 작아서 더 확실하다'
        - '감지기의 적중률과 오경보율이 같으면 posterior 도 같아서, 두 복도에서 같은 확률이 나온다'
      answer: 0
      explanation: |
        posterior 는 prior 에 크게 좌우된다. 문이 1% 이면 1000 곳 중 문에서 9 곳, 벽 990 곳에서 약 50 곳이 감지되어 문일 확률은 약 0.15 이고, 50% 이면
        450 곳과 25 곳이라 약 0.95 다. 적중률과 오경보율이 같아도 prior 가 다르면 posterior 가 달라지며, 드문 것을 찾는 센서일수록 오경보의 비중이 커진다.

- topic: bayes-update
  title: 반복 측정과 Bayes filter
  variants:
    - question: |
        같은 자리에서 문 감지가 두 번 연달아 떴다. 두 번째 측정을 Bayes rule 로 반영할 때 prior 로 무엇을 쓰는가?
      choices:
        - '처음의 prior 를 그대로 쓴다. 복도의 문 비율은 측정해도 바뀌지 않는다'
        - '감지기의 적중률 90% 를 쓴다. 이미 한 번 감지됐으니 그 확률이 믿음이 된다'
        - '첫 번째 측정 뒤의 posterior 를 새 prior 로 쓴다'
        - '0.5 로 초기화한다. 측정마다 치우침 없이 새로 시작해야 공정하다'
      answer: 2
      explanation: |
        Bayes 갱신은 되풀이할 수 있어서, 앞 측정의 posterior 가 다음 측정의 prior 가 된다. 문 예에서는 0.10 → 0.67 → 0.97 로 확신이 커진다.
        처음 prior 나 0.5 로 다시 시작하면 첫 측정의 정보를 버리게 되고, 적중률은 likelihood 이지 prior 가 아니다.
    - question: |
        반복 측정으로 믿음이 빠르게 확실해지는 계산이 틀리는 경우는 언제인가?
      choices:
        - '측정 횟수가 세 번을 넘어, 곱한 확률이 1 을 넘을 만큼 커지기 시작할 때'
        - '감지기의 적중률이 50% 보다 높아서, 측정 한 번이 믿음을 지나치게 크게 바꿀 때'
        - 'prior 가 0.1 보다 커서, 측정 전부터 이미 문이라고 믿고 있을 때'
        - '포스터 때문에 같은 자리에서 매번 오경보가 떠서, 측정의 오류가 서로 독립이 아닐 때'
      answer: 3
      explanation: |
        반복 갱신은 측정마다 오류가 독립이라고 가정한다. 같은 원인으로 같은 오경보가 되풀이되면 측정 여러 번이 사실상 한 번의 정보인데, 독립으로
        계산하면 확신만 지나치게 커진다. 평균으로 bias 를 지울 수 없는 것과 같은 이유다. 횟수, 적중률, prior 의 크기는 이 가정과 관계없고, 갱신마다
        전체 확률로 나누므로 posterior 가 1 을 넘는 일도 없다.
    - question: |
        Kalman filter 와 particle filter 는 Bayes filter 와 어떤 관계인가?
      choices:
        - '둘 다 Bayes rule 없이 측정값을 가중 평균하는 방법이라, Bayes filter 와는 별개다'
        - '둘 다 Bayes filter 인데, Kalman filter 는 믿음을 Gaussian 하나로 나타내고 particle filter 는 sample 여럿으로 나타낸다'
        - '둘 다 Bayes filter 인데, Kalman filter 는 믿음을 sample 로 나타내고 particle filter 는 Gaussian 으로 나타낸다'
        - 'Kalman filter 만 Bayes filter 이고, particle filter 는 측정 없이 sample 을 움직여 예측만 되풀이한다'
      answer: 1
      explanation: |
        Bayes filter 는 움직임으로 믿음을 옮기고 넓히는 예측과, 측정으로 Bayes rule 을 적용하는 갱신을 되풀이한다. 믿음을 Gaussian 으로 두면
        평균과 공분산만 고치는 Kalman filter 가 되고, sample 로 두면 봉우리가 여럿인 믿음도 나타내는 particle filter(Nav2 의 AMCL)가 된다.
        Kalman filter 가 sample 을 쓰고 particle filter 가 Gaussian 을 쓴다는 보기는 둘을 뒤바꾼 것이다. particle filter 도 측정으로 sample 의
        가중치를 고치고, 두 filter 모두 갱신에 Bayes rule 을 쓰므로 Bayes filter 와 별개가 아니다.

- topic: expected-value-sampling
  title: 기댓값과 sampling
  variants:
    - question: |
        집기 방법 A 는 90% 로 성공해 보상 10, 10% 로 물건을 떨어뜨려 보상 −50 이고, B 는 70% 로 성공해 보상 10, 30% 는 보상 0 이다. 기댓값으로 고르면?
      choices:
        - 'B. A 는 9 − 5 = 4 이고 B 는 7 이다'
        - 'A. 성공률이 90% 로 더 높아서 실패할 일이 적다'
        - '둘이 같다. 성공 보상이 10 으로 같아서 기댓값도 같다'
        - 'A. 0.9 × 10 = 9 로 B 의 7 보다 크다'
      answer: 0
      explanation: |
        기댓값은 결과마다 보상 × 확률을 더한 값이다. A 는 9 − 5 = 4, B 는 7 + 0 = 7 이라 B 가 크다. 성공률만 보면 실패의 크기(−50)를 놓치고,
        A 의 9 는 실패 보상을 빼먹은 값이다.
    - question: |
        평균 μ, 표준편차 σ 인 Gaussian 에서 값을 하나 sampling 하려면, 표준 정규분포 N(0, 1) 에서 뽑은 ε 을 어떻게 바꾸는가?
      choices:
        - 'ε × μ + σ'
        - 'ε 를 그대로 쓴다'
        - 'μ + σ × ε'
        - 'μ + σ² × ε'
      answer: 2
      explanation: |
        N(0, 1) 에서 뽑은 ε 에 σ 를 곱하면 폭이 σ 가 되고, μ 를 더하면 가운데가 μ 로 옮겨 간다. 평균 2.00 m, σ 0.02 m 이면 ε = 1.5 일 때 2.03 m 다.
        σ² 는 분산이라 곱하면 폭이 틀리고, μ 와 σ 의 자리를 바꾸면 다른 분포가 된다. VAE 의 reparameterization trick 도 같은 식이다.
    - question: |
        기댓값이 같은 두 행동이 있다. 그래도 둘을 구별해야 하는 이유는 무엇인가?
      choices:
        - '기댓값이 같으면 매번 나오는 결과도 같으므로, 사실은 구별할 필요가 없다'
        - '기댓값은 한 번 해 본 결과일 뿐이라, 다시 해 보면 달라질 수 있기 때문이다'
        - '기댓값이 같으면 성공 확률도 같으므로, 성공 보상이 큰 쪽을 골라야 하기 때문이다'
        - '결과가 퍼진 정도(분산)가 달라서, 한쪽만 가끔 큰 손해를 낼 수 있기 때문이다'
      answer: 3
      explanation: |
        기댓값은 아주 여러 번 했을 때의 평균이다. 성공 10·실패 −20 (90%·10%)과 성공 10·실패 0 (70%·30%)은 기댓값이 둘 다 7 이지만 앞쪽만 가끔
        큰 손해를 낸다. 기댓값이 같아도 결과와 확률은 다를 수 있고, 기댓값은 한 번의 결과가 아니라 평균이다.
