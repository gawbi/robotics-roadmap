<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>episode 1000 개를 모으는 시간. 실물 로봇 한 대는 episode 10 초에 사람이 컵을 되돌려 놓는 reset 20 초를 더해 30,000 초, 약 8.3 시간이 걸린다. environment 64 개를 동시에 돌리는 simulation 은 16 번 × 10 초 = 160 초다</title>
  <rect x="1" y="1" width="698" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="34" fill="#94a3b8" font-size="13">episode 1000 개를 모으는 데 걸리는 시간 (episode 하나 = chunk 20 개 = 10 초로 가정)</text>

  <text x="24" y="86" fill="#e2e8f0" font-size="14">실물 로봇 1 대</text>
  <rect x="160" y="66" width="500" height="32" rx="4" fill="#f87171" fill-opacity="0.8"/>
  <rect x="160" y="66" width="167" height="32" rx="4" fill="#f59e0b"/>
  <text x="243" y="87" fill="#0b1220" font-size="12" text-anchor="middle">실행 10,000 초</text>
  <text x="493" y="87" fill="#0b1220" font-size="12" text-anchor="middle">사람이 reset 20,000 초</text>
  <text x="660" y="122" fill="#e2e8f0" font-size="13" text-anchor="end">30,000 초 ≈ 8.3 시간 · reset 1000 번</text>

  <text x="24" y="176" fill="#e2e8f0" font-size="14">simulation</text>
  <text x="24" y="194" fill="#94a3b8" font-size="12">env 64 개 동시</text>
  <rect x="160" y="160" width="3" height="32" fill="#34d399"/>
  <text x="172" y="181" fill="#34d399" font-size="13">16 번 × 10 초 = 160 초 (막대 길이로는 거의 0)</text>

  <line x1="24" y1="222" x2="676" y2="222" stroke="#1e293b"/>
  <text x="24" y="250" fill="#94a3b8" font-size="13">1000 ÷ 64 = 15.6 이라 16 번 · simulation 은 성공 판정과 reset 을 프로그램이 한다</text>
  <text x="24" y="272" fill="#94a3b8" font-size="13">대신 simulation 의 물리와 그림이 실물과 다른 만큼, 거기서 배운 행동이 실물에서 어긋난다</text>
</svg>
