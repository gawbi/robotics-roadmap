<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>VLA 를 고정하고 출발 noise 만 고르는 방법. 같은 VLA 에서 noise 가 0 보다 크면 오른쪽 길(+2, 성공률 90%), 작으면 왼쪽 길(−2, 성공률 60%)로 간다. 표준 Gaussian noise 는 반반이라 성공률 75% 이고, 평균 1 인 noise policy 는 0 보다 큰 noise 를 84.1% 의 확률로 골라 성공률이 85.2% 가 된다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <rect x="24" y="40" width="170" height="80" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="109" y="66" fill="#7cb4d8" font-size="14" text-anchor="middle">noise policy</text>
  <text x="109" y="88" fill="#e2e8f0" font-size="12" text-anchor="middle">관측을 보고 noise w 를</text>
  <text x="109" y="106" fill="#e2e8f0" font-size="12" text-anchor="middle">고른다 (학습한다)</text>

  <line x1="196" y1="80" x2="256" y2="80" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="226" y="72" fill="#94a3b8" font-size="12" text-anchor="middle">w</text>

  <rect x="260" y="40" width="170" height="80" rx="10" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="345" y="66" fill="#e2e8f0" font-size="14" text-anchor="middle">VLA (고정)</text>
  <text x="345" y="88" fill="#94a3b8" font-size="12" text-anchor="middle">Euler 10 step</text>
  <text x="345" y="106" fill="#94a3b8" font-size="12" text-anchor="middle">같은 w → 같은 chunk</text>

  <line x1="432" y1="66" x2="500" y2="48" stroke="#7fc4a2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="432" y1="96" x2="500" y2="114" stroke="#d88b8b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="508" y="46" fill="#7fc4a2" font-size="13">w &gt; 0 → 오른쪽 길 +2</text>
  <text x="508" y="64" fill="#94a3b8" font-size="12">성공률 90%</text>
  <text x="508" y="114" fill="#d88b8b" font-size="13">w &lt; 0 → 왼쪽 길 −2</text>
  <text x="508" y="132" fill="#94a3b8" font-size="12">성공률 60%</text>

  <!-- two gaussians: x = 350 + 60*w, baseline y=290 -->
  <line x1="110" y1="290" x2="590" y2="290" stroke="#475569" stroke-width="1.5"/>
  <line x1="350" y1="170" x2="350" y2="290" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="170" y="308">−3</text><text x="230" y="308">−2</text><text x="290" y="308">−1</text><text x="350" y="308">0</text><text x="410" y="308">1</text><text x="470" y="308">2</text><text x="530" y="308">3</text>
  </g>
  <text x="590" y="308" fill="#94a3b8" font-size="12" text-anchor="end">w</text>
  <!-- N(0,1): peak height 100 at x=350 ; approx with path -->
  <path d="M170,289 C230,285 270,230 300,210 C330,190 340,190 350,190 C360,190 370,190 400,210 C430,230 470,285 530,289" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M230,289 C290,285 330,230 360,210 C390,190 400,190 410,190 C420,190 430,190 460,210 C490,230 530,285 590,289" fill="none" stroke="#7cb4d8" stroke-width="2.5"/>
  <text x="250" y="200" fill="#94a3b8" font-size="12" text-anchor="end">기본: N(0, 1)</text>
  <text x="250" y="216" fill="#94a3b8" font-size="12" text-anchor="end">w &gt; 0 확률 50% → 성공 75%</text>
  <text x="470" y="182" fill="#7cb4d8" font-size="12">noise policy: N(1, 1)</text>
  <text x="470" y="198" fill="#7cb4d8" font-size="12">w &gt; 0 확률 84.1% → 성공 85.2%</text>
  <text x="350" y="330" fill="#94a3b8" font-size="12" text-anchor="middle">VLA 의 weight 는 그대로이고, 어느 봉우리로 갈지만 noise 로 고른다</text>
</svg>
