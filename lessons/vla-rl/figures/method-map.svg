<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>VLA 를 RL 로 고치는 길. action 을 token 으로 내는 VLA 는 행동의 확률이 바로 나와 PPO·GRPO 를 그대로 쓴다. flow matching VLA 는 확률을 바로 못 구해서, ① step 마다 noise 를 넣어 확률을 만들거나(DPPO·ReinFlow·πRL), ② 성공한 rollout 만 다시 배우거나(filtered BC), ③ VLA 는 두고 넣는 noise 를 고르거나(DSRL), ④ advantage 를 입력 조건으로 넣는다(π*0.6 의 RECAP)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <rect x="200" y="20" width="300" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="350" y="42" fill="#e2e8f0" font-size="14" text-anchor="middle">PPO 의 ratio 에 필요한 것:</text>
  <text x="350" y="60" fill="#e2e8f0" font-size="14" text-anchor="middle">policy 가 낸 행동의 확률</text>

  <line x1="280" y1="72" x2="150" y2="108" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="72" x2="500" y2="108" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="24" y="112" width="250" height="100" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="149" y="138" fill="#38bdf8" font-size="14" text-anchor="middle">token VLA (OpenVLA 등)</text>
  <text x="149" y="162" fill="#e2e8f0" font-size="13" text-anchor="middle">token 확률의 곱 = 행동의 확률</text>
  <text x="149" y="184" fill="#94a3b8" font-size="13" text-anchor="middle">→ PPO·GRPO 를 그대로</text>
  <text x="149" y="202" fill="#94a3b8" font-size="12" text-anchor="middle">VLA-RL · RL4VLA · SimpleVLA-RL</text>

  <rect x="330" y="112" width="346" height="50" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="503" y="134" fill="#f59e0b" font-size="14" text-anchor="middle">flow matching VLA (π0 등)</text>
  <text x="503" y="152" fill="#e2e8f0" font-size="13" text-anchor="middle">행동 하나의 확률을 바로 못 구한다</text>

  <line x1="503" y1="164" x2="503" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="101" y1="228" x2="610" y2="228" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- four routes -->
  <rect x="24" y="256" width="155" height="120" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="101" y="280" fill="#a78bfa" font-size="13" text-anchor="middle">① noise 를 넣은 경로</text>
  <text x="101" y="304" fill="#e2e8f0" font-size="12" text-anchor="middle">step 마다 noise 를 넣어</text>
  <text x="101" y="322" fill="#e2e8f0" font-size="12" text-anchor="middle">종 모양 곡선의 곱으로</text>
  <text x="101" y="346" fill="#94a3b8" font-size="12" text-anchor="middle">DPPO · ReinFlow · πRL</text>

  <rect x="196" y="256" width="155" height="120" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="273" y="280" fill="#34d399" font-size="14" text-anchor="middle">② filtered BC</text>
  <text x="273" y="304" fill="#e2e8f0" font-size="12" text-anchor="middle">성공한 rollout 만 모아</text>
  <text x="273" y="322" fill="#e2e8f0" font-size="12" text-anchor="middle">시연처럼 다시 학습</text>
  <text x="273" y="346" fill="#94a3b8" font-size="12" text-anchor="middle">확률이 필요 없다</text>

  <rect x="368" y="256" width="155" height="120" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="445" y="280" fill="#38bdf8" font-size="14" text-anchor="middle">③ noise 선택</text>
  <text x="445" y="304" fill="#e2e8f0" font-size="12" text-anchor="middle">VLA 는 그대로 두고</text>
  <text x="445" y="322" fill="#e2e8f0" font-size="12" text-anchor="middle">출발 noise 를 RL 로</text>
  <text x="445" y="346" fill="#94a3b8" font-size="12" text-anchor="middle">DSRL</text>

  <rect x="540" y="256" width="140" height="120" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="610" y="280" fill="#f87171" font-size="14" text-anchor="middle">④ advantage 조건</text>
  <text x="610" y="304" fill="#e2e8f0" font-size="12" text-anchor="middle">positive·negative 를</text>
  <text x="610" y="322" fill="#e2e8f0" font-size="12" text-anchor="middle">입력에 붙여 학습</text>
  <text x="610" y="346" fill="#94a3b8" font-size="12" text-anchor="middle">π*0.6 (RECAP)</text>

  <line x1="101" y1="228" x2="101" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="273" y1="228" x2="273" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="228" x2="445" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="228" x2="610" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
