<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>noise 를 넣은 Euler 2 step. noise −0.5 에서 출발해 step 1 의 평균은 옛 policy 0.75, 새 policy 0.8 이고 실제로 뽑힌 점은 0.85 다. σ = 0.1 인 종 모양 곡선에서 그 점의 높이는 옛 2.4197, 새 3.5207 이라 step 1 의 ratio 는 1.455 다. step 2 는 두 policy 의 평균이 모두 2.0 이고 뽑힌 점 1.95 의 높이가 같아 ratio 1 이다. 경로 전체의 ratio 는 1.455 × 1 = 1.455 다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- value axis: x = 80 + 200*(v+0.5)  so -0.5 -> 80, 0.75 -> 330, 0.8 -> 340, 0.85 -> 350, 2.0 -> 580, 1.95 -> 570 -->
  <line x1="60" y1="270" x2="640" y2="270" stroke="#475569" stroke-width="1.5"/>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="80" y="288">−0.5</text><text x="180" y="288">0</text><text x="280" y="288">0.5</text><text x="380" y="288">1</text><text x="480" y="288">1.5</text><text x="580" y="288">2</text>
  </g>
  <text x="640" y="310" fill="#94a3b8" font-size="12" text-anchor="end">값 (action 의 숫자 하나)</text>

  <!-- start -->
  <circle cx="80" cy="200" r="7" fill="#e2e8f0"/>
  <text x="80" y="226" fill="#e2e8f0" font-size="13" text-anchor="middle">x₀ = −0.5</text>
  <text x="80" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">출발 noise</text>

  <!-- step1 gaussians: sigma 0.1 -> 20px; peaks scaled -->
  <path d="M290,200 Q310,200 320,170 Q330,120 330,120 Q330,120 340,170 Q350,200 370,200" fill="none" stroke="#7cb4d8" stroke-width="2"/>
  <path d="M300,200 Q320,200 330,170 Q340,120 340,120 Q340,120 350,170 Q360,200 380,200" fill="none" stroke="#d6aa62" stroke-width="2"/>
  <line x1="330" y1="200" x2="330" y2="114" stroke="#7cb4d8" stroke-dasharray="3 3"/>
  <line x1="340" y1="200" x2="340" y2="104" stroke="#d6aa62" stroke-dasharray="3 3"/>
  <text x="322" y="108" fill="#7cb4d8" font-size="12" text-anchor="end">옛 평균 0.75</text>
  <text x="348" y="98" fill="#d6aa62" font-size="12">새 평균 0.8</text>
  <circle cx="350" cy="200" r="7" fill="#e2e8f0"/>
  <text x="350" y="226" fill="#e2e8f0" font-size="13" text-anchor="middle">x₁ = 0.85</text>
  <text x="350" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">뽑힌 점</text>
  <path d="M86,196 Q200,150 344,196" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">step 1</text>

  <!-- step2 -->
  <path d="M540,200 Q560,200 570,170 Q580,120 580,120 Q580,120 590,170 Q600,200 620,200" fill="none" stroke="#a99ad6" stroke-width="2"/>
  <line x1="580" y1="200" x2="580" y2="114" stroke="#a99ad6" stroke-dasharray="3 3"/>
  <text x="588" y="108" fill="#a99ad6" font-size="12">두 policy 평균 2.0</text>
  <circle cx="570" cy="200" r="7" fill="#e2e8f0"/>
  <text x="570" y="226" fill="#e2e8f0" font-size="13" text-anchor="middle">x₂ = 1.95</text>
  <text x="570" y="244" fill="#94a3b8" font-size="12" text-anchor="middle">최종 action</text>
  <path d="M356,196 Q460,150 564,196" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">step 2</text>

  <!-- table -->
  <g font-size="13">
    <text x="24" y="32" fill="#94a3b8">σ = 0.1 인 종 모양 곡선에서 뽑힌 점의 높이</text>
    <text x="24" y="56" fill="#e2e8f0">step 1:</text>
    <text x="90" y="56" fill="#7cb4d8">옛 2.4197 (평균에서 0.1)</text>
    <text x="290" y="56" fill="#d6aa62">새 3.5207 (평균에서 0.05)</text>
    <text x="490" y="56" fill="#e2e8f0">ratio 1.455</text>
    <text x="24" y="78" fill="#e2e8f0">step 2:</text>
    <text x="90" y="78" fill="#7cb4d8">옛 3.5207 (0.05)</text>
    <text x="290" y="78" fill="#d6aa62">새 3.5207 (0.05)</text>
    <text x="490" y="78" fill="#e2e8f0">ratio 1</text>
  </g>
  <text x="350" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle">경로 전체의 ratio = 1.455 × 1 = 1.455 → clip 하면 1.2</text>
</svg>
