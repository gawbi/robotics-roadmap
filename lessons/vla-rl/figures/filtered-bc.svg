<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>filtered BC 를 되풀이할 때의 변화. 가운데를 잡는 비율은 0.7, 0.816, 0.894, 0.941, 0.968, 0.983 으로 오르고, 성공률은 81.5%, 86.7%, 90.2%, 92.4%, 93.6%, 94.2% 로 95% 에 다가간다</title>
  <rect x="1" y="1" width="698" height="330" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <!-- plot area: x 90..630 for round 0..5 (108 per round); y: 0.65 -> 270, 1.0 -> 60 ; scale 600 per 1 -->
  <line x1="80" y1="270" x2="650" y2="270" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="270" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="650" y2="90" stroke="#34d399" stroke-dasharray="5 4"/>
  <text x="646" y="124" fill="#34d399" font-size="12" text-anchor="end">가운데만 잡을 때 95%</text>
  <g font-size="12" fill="#94a3b8" text-anchor="end">
    <text x="72" y="274">0.65</text><text x="72" y="214">0.75</text><text x="72" y="154">0.85</text><text x="72" y="94">0.95</text>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="110" y="290">0 (SFT)</text><text x="214" y="290">1</text><text x="318" y="290">2</text><text x="422" y="290">3</text><text x="526" y="290">4</text><text x="630" y="290">5</text>
  </g>
  <text x="370" y="316" fill="#94a3b8" font-size="13" text-anchor="middle">filtered BC 를 되풀이한 횟수 (round)</text>

  <!-- center fraction: 0.7,0.816,0.894,0.941,0.968,0.983 -> y=270-600*(v-0.65) -->
  <polyline points="110,240 214,170.4 318,123.6 422,95.4 526,79.2 630,70.2" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <g fill="#38bdf8">
    <circle cx="110" cy="240" r="5"/><circle cx="214" cy="170.4" r="5"/><circle cx="318" cy="123.6" r="5"/><circle cx="422" cy="95.4" r="5"/><circle cx="526" cy="79.2" r="5"/><circle cx="630" cy="70.2" r="5"/>
  </g>
  <!-- success: .815,.867,.902,.924,.936,.942 -->
  <polyline points="110,171 214,139.8 318,118.8 422,105.6 526,98.4 630,94.8" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <g fill="#f59e0b">
    <circle cx="110" cy="171" r="5"/><circle cx="214" cy="139.8" r="5"/><circle cx="318" cy="118.8" r="5"/><circle cx="422" cy="105.6" r="5"/><circle cx="526" cy="98.4" r="5"/><circle cx="630" cy="94.8" r="5"/>
  </g>
  <g font-size="12" fill="#e2e8f0">
    <text x="118" y="256">0.70</text><text x="222" y="186">0.816</text><text x="326" y="140">0.894</text>
    <text x="118" y="163">81.5%</text><text x="222" y="132">86.7%</text><text x="326" y="112">90.2%</text>
  </g>
  <rect x="380" y="180" width="250" height="60" rx="8" fill="#111a2e" stroke="#475569"/>
  <line x1="394" y1="200" x2="420" y2="200" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="428" y="204" fill="#e2e8f0" font-size="13">가운데를 잡는 비율</text>
  <line x1="394" y1="224" x2="420" y2="224" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="428" y="228" fill="#e2e8f0" font-size="13">성공률</text>
</svg>
