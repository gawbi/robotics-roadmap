<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사람이 개입한 episode 하나. chunk 20 개 가운데 policy 가 0 ~ 11 과 15 ~ 19 의 17 개를 실행하고, chunk 11 에서 컵이 미끄러지려 하자 사람이 12 ~ 14 의 3 개를 넘겨받아 다시 잡아 준다. 사람 구간은 정답 시연으로, policy 구간과 episode 의 성공 여부는 reward 로 쓴다</title>
