# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: demo-ceiling
  title: 시연의 질이 정하는 상한
  variants:
    - question: |
        시연자들의 컵 잡는 법이 둘로 갈렸다. 대부분은 잘 성공하는 가운데 잡기를 했고, 일부는 자주 놓치는 가장자리 잡기를 했다. 이
        시연으로 SFT(supervised fine-tuning)한 policy 의 성공률은 어떻게 될까?
      choices:
        - 'SFT 는 성공한 잡기만 골라 배우므로, 늘 가운데를 잡는 policy 와 성공률이 같아진다'
        - '가장자리 잡기는 시연 수가 적어 학습에서 무시되므로, 성공률이 시연보다 높아진다'
        - '시연 비율대로 두 잡기를 따라 해서, 가운데만 잡을 때보다 성공률이 낮은 값에 머문다'
        - '두 잡기의 평균인 중간 자리를 잡게 되므로, 컵을 늘 놓쳐 성공률이 0 이 된다'
      answer: 2
      explanation: |
        SFT 의 정답은 그 순간 사람이 한 action 이라서, policy 는 시연에 나온 비율대로 가운데와 가장자리를 잡고 성공률은 두 잡기의 성공률을 고를
        확률로 섞은 값이 된다. 첫째 보기가 틀린 것은 SFT 가 시도의 성공 여부를 보지 않아 자주 실패하는 잡기도 정답으로 배우기 때문이다. 둘째
        보기가 틀린 것은 적은 쪽의 시연도 그 비율만큼 그대로 따라 하기 때문이다. 넷째 보기가 틀린 것은 SFT 가 늘 중간 자리로 평균을 내는
        것은 아니고, 그렇게 되더라도 성공률이 늘 0 이 되지는 않기 때문이다.
    - question: |
        같은 사람들이 같은 습관으로 시연을 열 배 더 모아 SFT 했다. 시연을 그대로 따라 하는 policy 의 성공률은 어떻게 될까?
      choices:
        - '좋은 시연과 나쁜 시연의 비율이 그대로라 성공률도 거의 그대로다'
        - '데이터가 열 배라 policy 가 더 많은 경우를 보므로 성공률도 크게 오른다'
        - '같은 장면에 다른 시연이 많아져 policy 가 헷갈리므로 성공률이 떨어진다'
        - '시연을 많이 볼수록 동작이 익숙해져 policy 가 사람보다 빠르게 작업한다'
      answer: 0
      explanation: |
        같은 습관으로 모은 시연은 좋은 잡기와 나쁜 잡기의 비율이 그대로이므로, 그것을 따라 하는 policy 의 성공률도 그 비율이 정한 값에 머문다.
        둘째 보기가 틀린 것은 시연이 늘어도 policy 가 시연을 더 정확히 따라 할 뿐 시연 자체의 질은 바뀌지 않기 때문이다. 셋째 보기가 틀린 것은
        같은 분포의 데이터가 늘어난다고 학습이 나빠지지 않기 때문이다. 넷째 보기가 틀린 것은 policy 가 사람이 한 속도까지 그대로 따라 하기
        때문이다.
    - question: |
        SFT 의 학습 신호에 '이렇게 잡으면 자주 실패한다' 는 정보가 들어 있지 않은 이유와, 그것을 보완하는 방법은 무엇인가?
      choices:
        - '시연에 자주 실패하는 잡기가 하나도 없기 때문이고, 같은 사람들에게 시연을 더 모으면 된다'
        - 'SFT 는 카메라 이미지를 보지 않고 관절 값만 배우기 때문이고, 카메라를 더 달면 된다'
        - '시연에서는 그런 잡기도 모두 성공했기 때문이고, 실패가 없으니 보완할 필요가 없다'
        - '실패하기 쉬운 시연도 정답으로 쓰기 때문이고, 직접 시도해 배우는 RL fine-tuning 이 보완한다'
      answer: 3
      explanation: |
        SFT 는 시연의 action 을 정답으로 삼을 뿐 그 시도가 성공했는지를 보지 않아서, 자주 실패하는 잡기도 같은 무게로 배운다. RL fine-tuning 은
        policy 가 직접 시도해 성공하면 reward 를 받으므로 더 자주 성공하는 잡기의 확률을 올린다. 첫째 보기가 틀린 것은 문제의 원인이 그런 잡기가 시연에
        없어서가 아니라 있어서이고, 같은 습관으로 시연을 더 모아도 비율이 그대로이기 때문이다. 둘째 보기가 틀린 것은 VLA 가 카메라 이미지를 입력으로
        받기 때문이다. 셋째 보기가 틀린 것은 문제의 상황이 자주 실패하는 잡기를 전제하기 때문이다.

- topic: recovery
  title: 회복 동작이 없는 시연과 쌓이는 실수
  variants:
    - question: |
        chunk 를 하나 실행할 때마다 작은 확률로 컵이 미끄러지고, 한 번 미끄러지면 끝까지 실패하는 policy 가 있다. 작업이 길어져
        실행할 chunk 수가 두 배가 되면 성공률은 어떻게 되는가?
      choices:
        - '미끄러질 확률은 chunk 마다 같으므로, chunk 수가 늘어도 성공률은 그대로다'
        - '모든 chunk 를 넘겨야 해서 넘길 확률을 더 여러 번 곱하므로 성공률이 떨어진다'
        - 'chunk 수가 두 배라 실패할 기회도 두 배이므로, 성공률이 정확히 절반이 된다'
        - '긴 작업일수록 policy 가 앞의 chunk 에서 익숙해져, 뒤로 갈수록 덜 미끄러지고 성공률이 오른다'
      answer: 1
      explanation: |
        성공하려면 chunk 마다 미끄러지지 않아야 하므로, 성공률은 chunk 하나를 넘길 확률을 chunk 수만큼 곱한 값이고 1 보다 작은 수를 더 많이
        곱하면 값이 작아진다. 첫째 보기가 틀린 것은 chunk 하나의 확률이 같아도 곱하는 횟수가 늘기 때문이다. 셋째 보기가 틀린 것은 성공률이
        곱으로 줄어서 chunk 수가 두 배가 되면 성공률이 제곱이 되지 절반이 되지는 않기 때문이다. 넷째 보기가 틀린 것은 policy 가 실행하는 동안
        배우지 않기 때문이다.
    - question: |
        시연으로만 학습한 policy 가 실수한 뒤 회복하는 법을 잘 모르는 이유는 무엇인가?
      choices:
        - '회복 동작은 순식간에 끝나서 카메라 frame 사이에 묻혀 데이터에 찍히지 않기 때문이다'
        - 'policy 의 parameter 가 시연 동작을 담는 데 다 쓰여서, 회복 동작까지 담을 여유가 없기 때문이다'
        - '회복은 상황마다 정답이 달라서 supervised learning 으로는 원리상 배울 수 없는 행동이기 때문이다'
        - '실수한 시연은 지우는 경우가 많아서, 실수한 뒤의 상태와 그때의 올바른 행동이 시연에 거의 없기 때문이다'
      answer: 3
      explanation: |
        policy 는 시연에 나온 상태에서 시연의 행동을 배우므로, 실수한 뒤의 상태와 그때의 회복 행동이 시연에 거의 없으면 그 상태에서 무엇을 할지
        모른다. 첫째 보기가 틀린 것은 회복 동작의 속도가 아니라 회복 장면이 데이터에 없다는 것이 원인이기 때문이다. 둘째 보기가 틀린 것은 같은
        크기의 policy 도 회복 장면을 정답으로 받으면 배울 수 있기 때문이다. 셋째 보기가 틀린 것은 사람이 넘겨받아 바로잡은 구간처럼 회복 장면이
        정답으로 주어지면 supervised learning 으로도 배우기 때문이다.
    - question: |
        chunk 마다 컵이 미끄러질 확률은 그대로인데, policy 가 미끄러진 컵을 대부분 다시 잡게 되었다. 여러 chunk 로 된 긴 작업의
        성공률은 어떻게 될까?
      choices:
        - 'chunk 마다 실패로 끝나는 확률이 줄어, 긴 작업일수록 성공률이 크게 오른다'
        - '미끄러질 확률이 그대로라, 회복을 배워도 긴 작업의 성공률은 그대로다'
        - '회복 동작에 시간이 들어 작업이 길어지므로, 긴 작업에서는 오히려 성공률이 떨어진다'
        - '회복은 chunk 하나 안에서만 효과가 있어서, 짧은 작업에서만 오르고 긴 작업에서는 차이가 없다'
      answer: 0
      explanation: |
        실패로 끝나는 것은 미끄러지고 되돌리지 못한 경우뿐이라, 회복을 알면 chunk 하나의 실패 확률이 크게 준다. 둘째 보기가 틀린 것은 성공률을
        정하는 것이 미끄러질 확률이 아니라 미끄러진 뒤 되돌리지 못할 확률이기 때문이다. 셋째 보기가 틀린 것은 시간 제한이 없는 한 회복에 든
        시간이 실패를 만들지 않기 때문이다. 넷째 보기가 틀린 것은 chunk 수만큼 곱하는 구조라서 chunk 하나의 실패 확률이 줄어든 효과가 긴
        작업에서 오히려 더 크게 드러나기 때문이다.

- topic: sparse-reward
  title: sparse reward 와 advantage
  variants:
    - question: |
        성공하면 episode 끝에 reward 1, 아니면 0 을 주고, batch 의 평균 reward 를 baseline 으로 빼서 advantage 를 만든다. 한 batch
        의 episode 가 모두 실패했다면 어떻게 되는가?
      choices:
        - '모든 episode 의 advantage 가 0 이라 update 가 일어나지 않는다'
        - '모든 episode 의 advantage 가 음수라, 실패한 행동의 확률이 한꺼번에 내려가 policy 가 크게 바뀐다'
        - '실패한 행동의 확률을 모두 낮추다 보면 성공하는 행동을 저절로 찾는다'
        - 'baseline 이 1 이 되어 advantage 가 모두 −1 이 된다'
      answer: 0
      explanation: |
        모두 실패하면 reward 가 모두 0 이고 평균인 baseline 도 0 이라서, advantage 는 모두 0 − 0 = 0 이고 update 의 방향과 크기가 정해지지
        않는다. 둘째 보기가 틀린 것은 baseline 도 0 이라 음수 advantage 가 생기지 않기 때문이다. 셋째 보기가 틀린 것은 advantage 가 0 이라
        실패한 행동의 확률을 낮추는 update 자체가 일어나지 않기 때문이다. 넷째 보기가 틀린 것은 baseline 이 평균 reward 인 0 이기 때문이다.
    - question: |
        sparse reward 로 VLA 를 RL fine-tuning 할 때, 아무렇게나 움직이는 policy 대신 시연으로 SFT 한 VLA 에서 출발하는 이유는
        무엇인가?
      choices:
        - 'SFT 한 VLA 는 이미 성공률 100% 라서, RL 은 그 성공을 확인하고 굳히기만 하면 되기 때문이다'
        - 'RL 의 loss 는 시연의 action 과 비교해 계산하므로, 시연 데이터가 없으면 loss 를 계산할 수 없기 때문이다'
        - '아무렇게나 움직이면 성공할 확률이 거의 0 이라 배울 단서가 없어서, SFT 로 성공률부터 올려야 하기 때문이다'
        - 'SFT 를 하면 시연의 step 마다 점수가 생겨 reward 가 더 이상 sparse 하지 않게 바뀌기 때문이다'
      answer: 2
      explanation: |
        sparse reward 에서는 성공한 episode 와 실패한 episode 의 차이에서만 배우므로, 성공이 한 번도 없으면 advantage 가 모두 0 이 되어 학습이
        시작되지 않는다. 첫째 보기가 틀린 것은 SFT 한 VLA 가 완벽하다면 RL 이 필요 없기 때문이다. 둘째 보기가 틀린 것은 RL 의 loss 가 시연이
        아니라 rollout 과 reward 로 계산되기 때문이다. 넷째 보기가 틀린 것은 SFT 를 해도 reward 를 주는 방식은 그대로이기 때문이다.
    - question: |
        GRPO 로 학습할 때 같은 시작 상황에서 모은 rollout 묶음이 모두 성공했거나 모두 실패하면 그 묶음을 버리고 다시 뽑는 경우가
        있다. 그렇게 하는 이유는 무엇인가?
      choices:
        - '모두 성공한 묶음은 reward 가 한꺼번에 커서 update 가 지나치게 커지고 학습을 불안정하게 만들기 때문이다'
        - 'reward 가 모두 같으면 advantage 가 모두 0 이라 gradient 가 없으므로, 성공과 실패가 섞인 묶음만 남긴다'
        - '모두 실패한 묶음은 policy 탓이 아니라 simulator 오류일 가능성이 높아서, 학습에 넣으면 안 되기 때문이다'
        - '쓸모 적은 묶음을 버려 batch 크기를 줄이고, 그만큼 GPU 메모리를 아끼기 위해서다'
      answer: 1
      explanation: |
        GRPO 는 묶음의 평균 reward 를 baseline 으로 빼므로, 모두 1 이거나 모두 0 이면 advantage 가 모두 0 이 되어 그 묶음으로는 policy 를 고칠
        수 없다. 첫째 보기가 틀린 것은 모두 성공해도 advantage 가 0 이라 오히려 신호가 없기 때문이다. 셋째 보기가 틀린 것은 어려운 작업에서는
        정상적인 policy 도 모두 실패할 수 있기 때문이다. 넷째 보기가 틀린 것은 버린 만큼 다시 뽑아 batch 를 채우므로 메모리를 아끼는 목적이
        아니기 때문이다.

- topic: reward-source
  title: reward 의 출처와 reward hacking
  variants:
    - question: |
        컵을 상자에 넣는 작업에 '컵을 쥐고 있는 step 마다 작은 점수' 를 더하고, 놓으면 큰 점수를 주는 reward 를 설계했다. 쥐고
        있는 동안 쌓이는 점수가 놓는 점수보다 커질 수 있다면 어떤 일이 생길 수 있는가?
      choices:
        - '놓는 점수를 빨리 받으려고 컵을 더 빨리 상자에 넣는 행동이 늘어난다'
        - '중간 점수는 언제나 학습을 빠르게 하므로, 점수 크기와 관계없이 아무 문제가 없다'
        - '점수가 쌓이는 데 시간이 오래 걸려서, policy 가 컵을 아예 잡지 않는 쪽으로 배운다'
        - '컵을 놓지 않고 끝까지 쥐고만 있어 점수를 쌓는 reward hacking 이 생긴다'
      answer: 3
      explanation: |
        RL 은 설계자의 의도가 아니라 reward 숫자를 키우는 쪽으로 배우므로, 쥐고만 있어도 놓는 것보다 점수가 크면 컵을 놓지 않는 행동의 확률이 올라간다.
        첫째 보기가 틀린 것은 빨리 놓을수록 쥐고 있는 점수가 줄어 오히려 손해이기 때문이다. 둘째 보기가 틀린 것은 중간 점수가 의도와 다른
        행동을 강화할 수 있기 때문이다. 셋째 보기가 틀린 것은 쥐고 있어야 점수가 쌓이므로 잡는 행동은 오히려 늘어나기 때문이다.
    - question: |
        실물 로봇에서 성공 판정을 reward classifier 가 맡는데, 실패한 episode 일부를 성공으로 잘못 판정한다. RL 에는 어떤 일이
        생기는가?
      choices:
        - '판정 오류는 성공과 실패 양쪽에 고르게 섞여 평균에서 상쇄되므로 학습에 영향이 없다'
        - '실제로는 실패지만 성공으로 판정된 행동도 reward 를 받아, RL 이 그 행동의 확률을 올린다'
        - '잘못 판정된 episode 는 다른 episode 와 reward 가 어긋나 보여서 RL 이 스스로 알아내 버린다'
        - 'classifier 가 틀리면 RL 이 학습을 아예 멈춘다'
      answer: 1
      explanation: |
        RL 은 reward 를 정답으로 믿고 배우므로, 컵을 상자 가장자리에 걸쳐 놓은 장면을 classifier 가 성공으로 보면 그 행동의 확률이 올라간다.
        첫째 보기가 틀린 것은 오류가 특정 행동에 몰려 있으면 평균에서 상쇄되지 않기 때문이다. 셋째 보기가 틀린 것은 RL 에게는 reward 말고
        판정이 맞았는지 알 다른 정보가 없기 때문이다. 넷째 보기가 틀린 것은 틀린 reward 도 숫자로 들어와 학습은 계속되기 때문이다.
    - question: |
        성공 여부 하나만 아는 상태에서, 성공률이 이미 높은 작업을 RL 로 더 빠르게 하도록 만들고 싶다. reward 를 어떻게 설계하면
        될까?
      choices:
        - '성공하면 1 을 주고 실패하면 0 을 주기만 하면 RL 이 알아서 빨라진다'
        - '성공한 episode 의 reward 를 10 배로 키워서, 성공으로 가는 학습을 더 세게 밀어 준다'
        - 'step 마다 −1 을 주고 실패에는 큰 음수를 주어, 빨리 성공할수록 return 이 커지게 한다'
        - '실패한 episode 를 학습에서 빼고 성공한 episode 만 남겨, 성공 동작만 따라 하게 한다'
      answer: 2
      explanation: |
        step 마다 −1 을 주면 return 이 성공까지 걸린 step 수에 − 를 붙인 값이 되어, 같은 성공이라도 빨리 끝낸 쪽이 더 큰 reward 를 받는다.
        첫째 보기가 틀린 것은 성공하면 걸린 시간과 관계없이 같은 1 을 받아 속도를 구분하는 신호가 없기 때문이다. 둘째 보기가 틀린 것은 모든
        성공의 reward 를 똑같이 키워도 빠른 성공과 느린 성공의 차이는 생기지 않기 때문이다. 넷째 보기가 틀린 것은 성공만 남기는 filtered BC 도
        성공한 episode 들 사이의 속도 차이를 구분하지 않기 때문이다.

- topic: token-ratio
  title: token VLA 의 ratio
  variants:
    - question: |
        OpenVLA 처럼 action 을 token 으로 내는 VLA 에는 PPO 를 바로 쓸 수 있다. 그 이유는 무엇인가?
      choices:
        - 'token VLA 는 action 을 연속된 숫자로 내서, 낸 숫자를 그대로 ratio 에 넣으면 되기 때문이다'
        - 'token VLA 는 다음 token 을 맞히며 value 까지 이미 배워서 critic 이 필요 없기 때문이다'
        - 'softmax 가 token 마다 확률을 줘서, 낸 action 의 확률을 token 확률의 곱으로 구할 수 있기 때문이다'
        - 'token VLA 는 늘 확률이 가장 큰 token 을 골라 action 에 무작위성이 전혀 없기 때문이다'
      answer: 2
      explanation: |
        PPO 의 ratio 는 새 policy 와 옛 policy 가 같은 action 을 고를 확률의 비라서, 낸 action 의 확률을 계산할 수 있어야 한다. 첫째 보기가 틀린
        것은 token VLA 가 연속 숫자가 아니라 칸에 짝지은 token 을 내기 때문이다. 둘째 보기가 틀린 것은 PPO 가 advantage 를 구하려고 보통 critic
        을 함께 쓰기 때문이다. 넷째 보기가 틀린 것은 rollout 을 모을 때 token 을 확률대로 뽑으므로 무작위성이 있기 때문이다.
    - question: |
        action 하나가 token 여러 개로 된 VLA 에서, action 전체의 ratio 와 token 자리별 ratio 는 어떤 관계인가?
      choices:
        - 'action 전체의 ratio 는 자리별 ratio 를 모두 곱한 값이다'
        - 'action 전체의 ratio 는 자리별 ratio 의 평균이다'
        - 'action 전체의 ratio 는 첫 자리의 ratio 와 같다'
        - 'action 전체의 ratio 는 자리별 ratio 를 모두 더한 값이다'
      answer: 0
      explanation: |
        action 의 확률은 자리별 token 확률의 곱이므로, 새 확률을 옛 확률로 나눈 ratio 도 자리별 비를 곱한 값이 된다. 둘째 보기가 틀린 것은
        확률을 곱하는 구조에서 평균은 ratio 와 맞지 않기 때문이다. 셋째 보기가 틀린 것은 첫 자리만 보면 뒤 자리의 확률 변화를 놓치기 때문이다.
        넷째 보기가 틀린 것은 log-probability 를 더하는 것과 ratio 를 더하는 것은 다른 계산이기 때문이다.
    - question: |
        token VLA 를 PPO 로 fine-tuning 할 때 clip 은 어떤 역할을 하는가?
      choices:
        - 'advantage 가 음수인 실패 episode 를 학습에서 빼서, 성공한 episode 로만 VLA 를 update 하게 한다'
        - 'action token 의 확률이 0 보다 작거나 1 보다 커지지 않도록 0 과 1 사이로 자른다'
        - 'reward 를 0 과 1 사이로 잘라서, 큰 reward 하나가 update 를 휘두르지 못하게 한다'
        - 'ratio 가 범위를 넘으면 gradient 를 멈춰, 운 좋은 결과 하나로 VLA 가 한 번에 크게 바뀌지 않게 한다'
      answer: 3
      explanation: |
        clip 은 ratio 를 1 − ε 과 1 + ε 사이로 잘라서, 그 범위를 넘어 같은 방향으로 더 고치려 할 때 gradient 를 0 으로 만든다. 첫째 보기가 틀린
        것은 실패한 episode 도 음수 advantage 로 그대로 학습에 쓰기 때문이다. 둘째 보기가 틀린 것은 확률은 softmax 가 이미 0 과 1 사이로 내고
        clip 이 자르는 것은 ratio 이기 때문이다. 셋째 보기가 틀린 것은 clip 이 reward 가 아니라 ratio 를 자르기 때문이다.

- topic: flow-likelihood
  title: flow matching VLA 의 확률과 우회 방법
  variants:
    - question: |
        π0 처럼 flow matching 으로 action chunk 를 만드는 VLA 에는 PPO 의 ratio 를 바로 쓰기 어렵다. 그 이유는 무엇인가?
      choices:
        - 'flow matching VLA 는 무작위성이 전혀 없어 다양한 action 을 시도할 수 없기 때문이다'
        - 'action 의 확률 밀도를 구하려면 공간이 늘어난 배수를 denoising step 마다 모든 숫자 짝에 대해 구해야 하기 때문이다'
        - 'flow matching VLA 는 action chunk 를 한꺼번에 내서, chunk 안의 action 마다 reward 를 따로 받을 수 없기 때문이다'
        - 'action 을 token 여러 개로 내서, 그 확률을 곱하면 너무 작아져 계산이 무너지기 때문이다'
      answer: 1
      explanation: |
        action 의 확률 밀도는 그 action 을 만든 noise 의 높이를 공간이 늘어난 배수로 나눈 값인데, chunk 가 숫자 수백 개면 출력과 입력의 모든 짝에
        대한 변화 비율이 필요하고 network 가 자리마다 달라 step 마다 다시 구해야 한다. 첫째 보기가 틀린 것은 출발 noise 를 무작위로 뽑아 시도가
        다양하기 때문이다. 셋째 보기가 틀린 것은 reward 는 모델 구조와 관계없이 environment 에서 받기 때문이다. 넷째 보기가 틀린 것은 flow
        matching VLA 의 action 이 token 이 아니라 연속된 숫자이기 때문이다.
    - question: |
        flow matching VLA 를 고정해 두고, 출발 noise 를 고르는 작은 policy 만 RL 로 학습하는 방법(DSRL)의 장점과 한계는 무엇인가?
      choices:
        - 'noise 를 고르면서 VLA 의 weight 도 함께 고치므로, 시연에 없던 새 동작도 만들 수 있다'
        - 'noise 를 크게 고를수록 VLA 가 더 다양한 action 을 내므로, 시도가 넓어져 언제나 성공률이 오른다'
        - '출발 noise 가 무작위성의 원천이 아닌 token VLA 같은 모델에만 쓸 수 있다'
        - 'noise policy 의 확률이 바로 나와 계산이 쉽지만, VLA 가 원래 낼 수 있는 행동 안에서만 고른다'
      answer: 3
      explanation: |
        flow matching VLA 의 무작위성은 출발 noise 에 있으므로 어떤 noise 를 넣을지 고르면 나올 행동을 조종할 수 있고, noise policy 는 종 모양
        곡선이라 ratio 계산이 쉽다. 첫째 보기가 틀린 것은 VLA 가 고정이라 시연에 없던 동작은 어떤 noise 로도 나오지 않기 때문이다. 둘째 보기가
        틀린 것은 noise 를 너무 크게 고르면 VLA 가 학습 때 거의 본 적 없는 입력이 되기 때문이다. 셋째 보기가 틀린 것은 이 방법이 바로 출발
        noise 가 무작위성의 원천인 모델을 위한 것이기 때문이다.
    - question: |
        rollout 마다 critic 으로 advantage 를 구해 'positive' 나 'negative' 표시를 입력에 붙이고, 그 표시와 함께 학습하는 방법(π*0.6 의
        RECAP)은 어떤 특징이 있는가?
      choices:
        - '실패까지 포함한 데이터를 표시와 함께 학습하고, 실행할 때는 늘 positive 를 넣어 좋은 행동을 끌어낸다'
        - '표시를 붙인 뒤 positive 인 rollout 만 남기고, negative 인 rollout 은 학습에서 버린다'
        - 'denoising step 마다 noise 를 넣어 경로 전체의 확률을 계산하고, 그 확률로 PPO 의 ratio 를 만든다'
        - 'critic 없이 advantage 를 구해서, value 를 예측하는 network 를 따로 학습하지 않는다'
      answer: 0
      explanation: |
        모델은 positive 와 negative 가 붙었을 때의 행동을 구분해 배우므로 실패한 데이터도 나쁜 행동의 예로 쓰고, 확률 없이 SFT 와 같은 loss 로
        학습해 flow matching VLA 에 그대로 맞는다. 둘째 보기가 틀린 것은 성공만 쓰는 방법은 filtered BC 이기 때문이다. 셋째 보기가 틀린 것은
        step 마다 noise 를 넣어 확률을 만드는 방법은 DPPO·πRL 쪽이기 때문이다. 넷째 보기가 틀린 것은 advantage 를 구하려면 value 를 예측하는
        critic 이 필요하기 때문이다.

- topic: on-off-policy
  title: on-policy 와 off-policy
  variants:
    - question: |
        PPO 같은 on-policy 방법과 SAC 같은 off-policy 방법은 모은 데이터를 쓰는 방식이 어떻게 다른가?
      choices:
        - 'on-policy 는 사람이 모은 시연만 쓰고, off-policy 는 로봇이 직접 모은 rollout 만 쓴다'
        - '둘 다 모은 데이터를 영원히 쌓아 두고 되풀이해 쓰며, 다른 점은 update 주기뿐이다'
        - 'on-policy 는 지금 policy 의 rollout 을 쓰고 버리고, off-policy 는 buffer 에 쌓아 되풀이해 쓴다'
        - 'on-policy 는 ratio 만으로 학습해 reward 가 필요 없고, off-policy 만 reward 가 필요하다'
      answer: 2
      explanation: |
        PPO 의 ratio 는 데이터를 모은 policy 와 지금 policy 의 차이를 재는 장치라서 policy 가 많이 바뀐 뒤의 데이터는 쓰지 않고, off-policy 는
        buffer 의 데이터를 계속 다시 쓴다. 첫째 보기가 틀린 것은 on-policy 가 지금 policy 의 rollout 을 쓰고 off-policy 는 시연도 buffer 에 넣을
        수 있기 때문이다. 둘째 보기가 틀린 것은 on-policy 는 update 뒤 데이터를 버리기 때문이다. 넷째 보기가 틀린 것은 두 방법 모두 reward 로
        학습하기 때문이다.
    - question: |
        실물 로봇에서 VLA 를 RL 로 다듬는 연구들은 off-policy 방법을 많이 쓴다. 가장 큰 이유는 무엇인가?
      choices:
        - 'off-policy 방법은 reward 없이 시연만으로도 학습할 수 있어서, 실물에서 성공 판정을 하지 않아도 되기 때문이다'
        - '실물은 시도마다 시간과 사람의 reset 이 들어서, 모은 데이터를 되풀이해 쓰는 쪽이 더 많이 배우기 때문이다'
        - 'off-policy 방법은 critic 을 쓰지 않아 계산이 가벼워서 로봇에 달린 작은 컴퓨터로도 돌릴 수 있기 때문이다'
        - '실물 로봇은 on-policy 방법의 ratio 계산을 지원하지 않기 때문이다'
      answer: 1
      explanation: |
        simulation 은 environment 를 여러 개 동시에 실행해서 시도가 싸지만, 실물은 시도마다 실행 시간과 reset 이 들어서 데이터를 버리는 비용이 크다.
        첫째 보기가 틀린 것은 off-policy 방법도 reward 로 학습하기 때문이다. 셋째 보기가 틀린 것은 SAC·RLPD 같은 off-policy 방법이 critic 을
        쓰기 때문이다. 넷째 보기가 틀린 것은 ratio 는 로봇이 아니라 학습 코드에서 계산하기 때문이다.
    - question: |
        off-policy 학습에서는 사람이 넘겨받은 기록도 buffer 에 넣을 수 있는데, 사람이 길게 넘겨받아 성공까지 끌고 가는 개입을 자주
        하면 어떤 문제가 생길 수 있는가?
      choices:
        - '사람이 낸 action 은 policy 의 확률이 없어서 buffer 에 넣을 수 없고, 개입한 만큼 데이터가 버려진다'
        - '성공한 기록이 많을수록 좋으므로, 개입이 길고 잦을수록 policy 가 언제나 더 빨리 좋아진다'
        - '사람이 넘겨받은 episode 는 성공 판정을 할 수 없어 reward classifier 가 학습을 멈춘다'
        - 'buffer 의 데이터가 policy 혼자 할 때와 크게 달라져, critic 이 value 를 크게 잡고 학습이 흔들릴 수 있다'
      answer: 3
      explanation: |
        사람이 끌고 간 성공이 많으면 critic 은 policy 혼자서는 이르지 못하는 결과를 보고 value 를 높게 잡아, policy 가 실제로 갈 상태의 예측이
        틀어진다. 첫째 보기가 틀린 것은 개입 기록을 buffer 에 넣는 것이 off-policy 의 장점이기 때문이다. 둘째 보기가 틀린 것은 개입의 양보다
        방식이 중요해서 길고 잦은 개입이 오히려 학습을 흔들 수 있기 때문이다. 셋째 보기가 틀린 것은 classifier 는 성공 판정을 맡을 뿐 개입의
        길이와 관계없기 때문이다.

- topic: real-robot
  title: 실물 로봇의 비용·안전·사람의 개입
  variants:
    - question: |
        실물 로봇에서 RL 을 하던 중 컵이 미끄러지려 하자 사람이 로봇을 넘겨받아 다시 잡아 준 뒤 돌려주었다. 이 episode 의 데이터는
        어떻게 쓰는가?
      choices:
        - '사람 구간은 회복하는 정답 시연으로 쓰고, policy 가 실행한 구간과 성공 여부는 RL 데이터로 쓴다'
        - '사람이 끼어든 episode 는 policy 혼자의 결과가 아니라 오염되었으므로 모두 버린다'
        - '사람이 잘한 구간에만 reward 1 을 주고, policy 가 실행한 나머지 구간은 모두 reward 0 으로 둔다'
        - '개입은 안전을 위한 것이라 사람 구간은 빼고, policy 가 실행한 구간만 RL 데이터로 쓴다'
      answer: 0
      explanation: |
        사람이 넘겨받은 구간은 미끄러지려는 컵을 다시 잡는 행동을 담고 있어서, 시연에 거의 없던 회복 동작을 정답으로 배울 수 있다. 둘째 보기가
        틀린 것은 개입 episode 가 회복 동작이라는 귀한 데이터를 담고 있기 때문이다. 셋째 보기가 틀린 것은 reward 가 구간이 아니라 작업의
        성공 여부로 정해지기 때문이다. 넷째 보기가 틀린 것은 개입 구간을 학습에 쓰지 않으면 회복 동작을 배울 기회를 버리기 때문이다.
    - question: |
        VLA 를 simulation 에서 RL 로 다듬은 뒤 실물 로봇에 그대로 올렸다. 어떤 결과를 예상해야 하는가?
      choices:
        - 'simulation 은 물리 법칙을 그대로 계산하므로, 거기서 배운 행동은 실물에서도 언제나 똑같이 통한다'
        - 'simulation 에서 RL 을 하면 가짜 환경에 맞춰지므로 실물 성능은 언제나 떨어진다'
        - '마찰·조명·카메라 이미지가 실물과 달라 성공률이 낮을 수 있으므로, 실물에서 다시 재 봐야 한다'
        - '실물 로봇은 reset 과 성공 판정을 저절로 해 주므로 추가 작업이 필요 없다'
      answer: 2
      explanation: |
        simulation 은 시도가 싸지만 마찰·무게·조명·카메라 이미지가 실물과 다르므로, 거기서 배운 행동이 실물에서 그대로 통한다는 보장이 없다.
        첫째 보기가 틀린 것은 simulation 과 실물의 차이 때문에 성공률이 달라지기 때문이다. 둘째 보기가 틀린 것은 simulation 에서 한 RL 이 실물
        성공률을 올린 연구도 있기 때문이다. 넷째 보기가 틀린 것은 실물에서는 reset 과 성공 판정을 사람이나 다른 장치가 맡아야 하기 때문이다.
    - question: |
        두 policy 의 실물 성공률을 작업마다 20 번씩 재서 비교했더니 한쪽이 10%p 높았다. 이 결과는 어떻게 읽어야 하는가?
      choices:
        - '10%p 는 성공률로 보면 큰 차이라서, 횟수와 관계없이 한쪽이 확실히 낫다'
        - '성공 두 번 차이라 우연일 수 있으므로, 횟수를 늘리고 조건을 맞춰 다시 잰다'
        - '실물 평가는 날마다 조건이 달라 정확하지 않으므로, simulation 결과만 믿고 고른다'
        - '성공률 대신 reward 합을 비교하면 작은 차이도 드러나서 횟수와 관계없이 정확하다'
      answer: 1
      explanation: |
        20 번으로 재면 성공 하나가 5%p 라서 10%p 는 성공이 두 번 늘어난 것이고, 진짜 성공률이 같아도 재는 날마다 이 정도는 달라질 수 있다.
        첫째 보기가 틀린 것은 시험 횟수가 적으면 우연의 몫이 크기 때문이다. 셋째 보기가 틀린 것은 simulation 과 실물이 달라 실물 성능은 실물에서
        재야 하기 때문이다. 넷째 보기가 틀린 것은 reward 합도 같은 episode 수로 재면 똑같이 우연에 흔들리기 때문이다.
