# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: demo-ceiling
  title: 시연의 질이 정하는 상한
  variants:
    - question: |
        시연자들이 컵을 잡는 법이 둘로 갈렸다. 대부분은 잘 성공하는 가운데 잡기를, 일부는 자주 놓치는 가장자리 잡기를 했다. 이 시연으로
        SFT(supervised fine-tuning)한 policy 의 성공률에 대한 설명으로 옳은 것은?
      choices:
        - 'SFT 는 성공한 잡기만 골라 배우므로 늘 가운데를 잡는 policy 의 성공률과 같아진다'
        - '가장자리 잡기는 시연 수가 적어 무시되므로 성공률이 시연보다 높아진다'
        - '시연의 비율대로 두 잡기를 따라 하므로, 성공률은 두 잡기의 성공률을 그 비율로 섞은 값에 머물러 가운데만 잡는 policy 보다 낮다'
        - '두 잡기의 중간 자리를 잡게 되어 성공률이 언제나 0 이 된다'
      answer: 2
      explanation: |
        SFT 의 정답은 "그 순간 사람이 한 일" 이라서, policy 는 시연에 나온 비율대로 가운데와 가장자리를 잡는다. 그래서 성공률은 두 잡기의
        성공률을 고를 확률로 섞은 기댓값이 되고, 늘 가운데를 잡는 policy 보다 낮다. SFT 는 성공 여부를 보지 않으므로 성공한 잡기만 고르지
        않고, 적은 쪽의 시연도 그 비율만큼 따라 한다. 중간 자리로 평균을 내는 것은 SFT 의 필연이 아니며 성공률이 늘 0 이 되지도 않는다.
    - question: |
        같은 사람들이 같은 습관으로 시연을 10 배 더 모아 SFT 했다. 시연을 그대로 따라 하는 policy 의 성공률은 어떻게 될까?
      choices:
        - '시연 속 잡는 법의 비율이 그대로라 성공률도 거의 그대로이고, 나아지는 것은 시연을 얼마나 정확히 따라 하느냐뿐이다'
        - '데이터가 10 배라 성공률도 크게 오른다'
        - '데이터가 많아지면 policy 가 헷갈려 성공률이 떨어진다'
        - '시연이 늘면 policy 가 사람보다 빠르게 작업하게 된다'
      answer: 0
      explanation: |
        같은 습관으로 모은 시연은 좋은 잡기와 나쁜 잡기의 비율이 그대로이므로, 그것을 따라 하는 policy 의 성공률도 그 비율이 정한 값에 머문다.
        시연이 늘면 policy 가 시연을 더 정확히 따라 할 뿐, 시연 자체의 질을 넘지는 못한다. 데이터가 많다고 policy 가 헷갈리지는 않고, 속도도
        사람이 한 속도를 따라 한다.
    - question: |
        SFT 의 학습 신호에 "가장자리를 잡으면 자주 실패한다" 는 정보가 들어 있지 않은 이유와, 이를 보완하는 방법으로 옳은 것은?
      choices:
        - '시연에 가장자리 잡기가 하나도 없기 때문이고, 시연을 더 모으면 된다'
        - 'SFT 는 사진을 보지 않기 때문이고, 카메라를 더 달면 된다'
        - '가장자리 잡기도 모두 성공했기 때문이고, 보완할 필요가 없다'
        - '실패하기 쉬운 시연도 성공한 시연과 똑같이 정답으로 쓰기 때문이고, 직접 시도해 받은 성공 여부(reward)로 더 학습하는 RL fine-tuning 이 이를 보완한다'
      answer: 3
      explanation: |
        SFT 는 시연의 action 을 정답으로 삼을 뿐 그 시도가 성공했는지를 보지 않아서, 자주 실패하는 잡기도 똑같은 무게로 배운다. RL fine-tuning
        은 VLA 가 직접 시도해 성공하면 reward 를 받으므로, 더 자주 성공하는 가운데 잡기의 확률을 올릴 수 있다. 가장자리 시연은 실제로 있고
        자주 실패했으므로 나머지 보기는 상황과 맞지 않으며, 시연을 더 모아도 비율은 그대로다.

- topic: recovery
  title: 회복을 모르는 policy 와 쌓이는 실수
  variants:
    - question: |
        chunk 를 하나 실행할 때마다 작은 확률로 컵이 미끄러지고, 한 번 미끄러지면 끝까지 실패하는 policy 가 있다. 작업이 길어져 실행할
        chunk 수가 두 배가 되면 성공률은 어떻게 되나?
      choices:
        - '미끄러질 확률은 chunk 마다 같으므로 성공률도 그대로다'
        - '모든 chunk 를 무사히 넘겨야 하므로 넘길 확률을 더 여러 번 곱하게 되어 성공률이 떨어진다'
        - '성공률이 정확히 절반이 된다'
        - '긴 작업일수록 policy 가 익숙해져 성공률이 오른다'
      answer: 1
      explanation: |
        성공하려면 chunk 하나하나에서 미끄러지지 않아야 하므로, 성공률은 chunk 하나를 넘길 확률을 chunk 수만큼 곱한 값이다. chunk 가 늘면
        1 보다 작은 수를 더 많이 곱하므로 성공률이 떨어진다. 곱으로 줄어들기 때문에 정확히 절반이 되는 것은 아니고, policy 가 작업 중에
        배우지는 않는다.
    - question: |
        시연으로만 학습한 policy 가 실수한 뒤 회복하는 법을 잘 모르는 이유로 옳은 것은?
      choices:
        - '회복 동작은 너무 빨라서 카메라에 찍히지 않기 때문이다'
        - 'policy 의 parameter 가 부족해 회복 동작을 담을 수 없기 때문이다'
        - '회복은 supervised learning 으로는 원리상 배울 수 없는 행동이기 때문이다'
        - '시연자는 실수를 피하려 애쓰고 실수한 시연은 지우는 경우가 많아, 실수한 뒤의 상태와 그때의 올바른 행동이 시연에 거의 없기 때문이다'
      answer: 3
      explanation: |
        policy 는 시연에 나온 상태에서 시연의 행동을 배우므로, 시연에 없던 상태에서는 무엇을 해야 할지 모른다. 실수한 뒤의 상태와 그때의 회복
        행동은 시연에 거의 담기지 않는다. 회복 장면이 정답으로 주어지면(사람이 넘겨받아 바로잡은 구간처럼) supervised learning 으로도 배울
        수 있으므로 셋째 보기는 틀리고, 카메라나 parameter 수가 원인도 아니다.
    - question: |
        chunk 마다 컵이 미끄러질 확률은 그대로인데, policy 가 미끄러진 컵을 대부분 다시 잡을 줄 알게 되었다. 여러 chunk 로 된 긴 작업의
        성공률은 어떻게 되나?
      choices:
        - 'chunk 마다 실제로 실패로 끝나는 확률이 크게 줄어, 긴 작업에서 성공률이 크게 오른다'
        - '미끄러질 확률이 그대로라 성공률도 그대로다'
        - '회복 동작에 시간이 들어 성공률이 떨어진다'
        - '짧은 작업에서만 효과가 있고 긴 작업에서는 차이가 없다'
      answer: 0
      explanation: |
        실패로 끝나는 것은 "미끄러지고 되돌리지 못한" 경우뿐이라, 회복을 알면 chunk 마다의 실패 확률이 크게 준다. chunk 수만큼 곱해 성공률을
        구하므로, chunk 하나의 실패 확률이 작아진 효과는 작업이 길수록 더 크게 드러난다. 미끄러짐 자체가 그대로여도 결과는 달라지고, 긴
        작업에서 오히려 차이가 커진다.

- topic: sparse-reward
  title: 성공 여부로 주는 sparse reward
  variants:
    - question: |
        성공하면 episode 끝에 reward 1, 아니면 0 을 주고, batch 의 평균 성공률을 baseline 으로 빼 advantage 를 만든다. 한 batch 의 episode
        가 모두 실패했다면 어떻게 되나?
      choices:
        - '모든 episode 의 advantage 가 0 이라 update 가 일어나지 않는다'
        - '모든 episode 의 advantage 가 음수라 policy 가 크게 바뀐다'
        - '실패한 행동의 확률을 모두 낮추다 보면 성공 행동을 저절로 찾는다'
        - 'baseline 이 1 이 되어 advantage 가 모두 −1 이 된다'
      answer: 0
      explanation: |
        모두 실패하면 reward 가 모두 0 이고 평균인 baseline 도 0 이라서, advantage 는 모두 $0 - 0 = 0$ 이다. advantage 가 update 의 방향과
        크기를 정하므로 아무것도 고쳐지지 않는다. 무엇을 하면 성공하는지 한 번도 보지 못했으니 배울 단서가 없는 셈이다. baseline 은 평균
        성공률이라 0 이고, 음수 advantage 도 생기지 않는다.
    - question: |
        sparse reward 만으로 RL 을 할 때, 아무렇게나 움직이는 policy 에서 시작하지 않고 시연으로 SFT 한 VLA 에서 출발하는 이유는?
      choices:
        - 'SFT 한 VLA 는 이미 성공률 100% 라서 RL 은 확인만 하면 되기 때문이다'
        - 'RL 은 시연 데이터가 없으면 loss 를 계산할 수 없기 때문이다'
        - '아무렇게나 움직이는 policy 는 성공할 확률이 거의 0 이라 배울 단서가 없으므로, 먼저 SFT 로 성공률을 0 보다 확실히 크게 만들어야 하기 때문이다'
        - 'SFT 를 하면 reward 가 더 이상 sparse 하지 않게 바뀌기 때문이다'
      answer: 2
      explanation: |
        sparse reward 에서는 성공한 episode 와 실패한 episode 의 차이에서만 배우므로, 성공이 한 번도 없으면 advantage 가 모두 0 이 되어 학습이
        시작되지 않는다. SFT 로 성공률을 어느 정도 확보해야 RL 이 성공 쪽을 키울 수 있다. SFT 한 VLA 가 완벽하다면 RL 이 필요 없고, RL 의
        loss 는 rollout 과 reward 로 계산하며, SFT 를 해도 reward 를 주는 방식은 바뀌지 않는다.
    - question: |
        같은 크기의 batch 라도 성공이 아주 드물거나 거의 전부일 때보다, 성공과 실패가 고루 섞였을 때 RL 이 더 많이 배우는 이유로 옳은 것은?
      choices:
        - '성공률이 높을수록 reward 의 합이 커지기 때문이다'
        - '한쪽으로 치우치면 단서가 episode 몇 개에 몰려 그것이 우연인지 가리기 어렵지만, 고루 섞이면 성공과 실패의 차이를 여러 episode 에서 볼 수 있기 때문이다'
        - '성공과 실패가 섞이면 baseline 이 0 이 되기 때문이다'
        - '성공률이 중간이면 모든 advantage 가 양수가 되기 때문이다'
      answer: 1
      explanation: |
        성공이 하나뿐이면 그 하나만 큰 advantage 를 받고, 실패가 하나뿐이면 그 하나만 큰 음수를 받아서 단서가 한 episode 에 몰린다. 성공과
        실패가 고루 섞이면 어떤 행동이 성공과 함께 나오는지를 여러 사례에서 비교할 수 있다. baseline 은 평균 성공률이라 섞였을 때 0 이 아니고,
        성공은 양수·실패는 음수 advantage 를 받는다.

- topic: credit
  title: 끝에서 받은 reward 의 배분과 중간 점수
  variants:
    - question: |
        reward 를 episode 끝에 한 번만 받는 작업에서 critic(지금 상황에서 결국 성공할 확률을 예측하는 network)을 쓰면, 성공의 몫(TD error)
        이 가장 크게 가는 chunk 는?
      choices:
        - '언제나 reward 를 받은 마지막 chunk'
        - '언제나 episode 의 첫 chunk'
        - '모든 chunk 가 언제나 똑같이 나눠 가진다'
        - 'critic 이 예측한 성공 확률이 가장 크게 뛴 chunk, 예를 들어 컵을 제대로 잡은 순간'
      answer: 3
      explanation: |
        TD error 는 "받은 reward + 다음 상황의 예측 − 지금 상황의 예측" 이라서, 예측이 크게 오른 chunk 가 큰 몫을 받는다. critic 이 "컵을 제대로
        잡으면 대개 성공한다" 를 배워 두었다면, reward 는 마지막에 받아도 가장 큰 몫은 잡는 chunk 로 간다. 마지막 chunk 는 이미 성공을 거의
        예상한 상태라 몫이 작을 수 있고, 몫이 똑같이 나뉘는 것은 critic 의 판단을 쓰지 않을 때의 이야기다.
    - question: |
        VLA 를 PPO 로 fine-tuning 할 때 RL 을 시작하기 전에 critic 만 먼저 학습시키기도(critic warmup) 한다. 그 이유로 옳은 것은?
      choices:
        - 'critic 이 있어야 rollout 을 모을 수 있기 때문이다'
        - '처음의 critic 은 엉터리 예측을 내서 그것으로 나눈 몫도 엉터리가 되고, 그 몫으로 policy 를 잘못된 쪽으로 고치게 되기 때문이다'
        - 'critic 을 먼저 학습하면 reward 가 더 자주 나오기 때문이다'
        - 'critic 과 policy 가 같은 weight 를 써서 순서를 지켜야 하기 때문이다'
      answer: 1
      explanation: |
        advantage 는 critic 의 예측으로 계산하므로, 예측이 엉터리면 어느 chunk 가 좋았는지에 대한 판단도 엉터리가 된다. 그 판단으로 VLA 를 고치면
        애써 배운 policy 가 망가질 수 있어서, critic 이 어느 정도 맞는 예측을 낼 때까지 먼저 학습시킨다. rollout 은 policy 만 있으면 모을 수
        있고, critic 학습이 reward 의 빈도를 바꾸지는 않는다.
    - question: |
        컵을 상자에 넣는 작업에 "컵을 쥐고 있는 chunk 마다 작은 점수" 를 더하고, 놓으면 큰 점수를 주는 reward 를 설계했다. 쥐고 있는 동안
        쌓이는 점수가 놓는 점수보다 커질 수 있다면 생길 수 있는 일은?
      choices:
        - '컵을 더 빨리 상자에 넣는 행동이 커진다'
        - '중간 점수는 언제나 학습을 빠르게 하므로 아무 문제가 없다'
        - '컵을 놓지 않고 끝까지 쥐고만 있어 점수를 쌓는 행동이 커지는 reward hacking 이 생긴다'
        - 'policy 가 컵을 아예 잡지 않게 된다'
      answer: 2
      explanation: |
        RL 은 설계자의 의도가 아니라 reward 숫자를 키우는 쪽으로 배운다. 쥐고만 있어도 점수가 계속 쌓여 놓는 것보다 이득이면, 컵을 놓지 않는
        행동이 커진다. 이렇게 의도와 다르게 reward 만 키우는 행동을 찾는 것이 reward hacking 이다. 그래서 중간 점수는 작게 주거나 한 번만 주고,
        최종 성공의 reward 가 늘 가장 크게 남도록 설계한다.

- topic: token-ratio
  title: token VLA 의 ratio
  variants:
    - question: |
        OpenVLA 처럼 action 을 token 으로 내는 VLA 에 PPO 를 바로 쓸 수 있는 이유로 옳은 것은?
      choices:
        - 'token VLA 는 action 을 연속된 숫자로 내기 때문이다'
        - 'token VLA 는 critic 없이도 PPO 로 학습되기 때문이다'
        - 'softmax 가 token 마다 확률을 주므로, 실제로 낸 action 의 확률을 token 확률의 곱(log-probability 의 합)으로 바로 계산해 ratio 를 만들 수 있기 때문이다'
        - 'token VLA 의 action 에는 무작위성이 전혀 없기 때문이다'
      answer: 2
      explanation: |
        PPO 의 ratio 는 새 policy 와 옛 policy 가 같은 action 을 고를 확률의 비라서, 낸 action 의 확률을 계산할 수 있어야 한다. token VLA 는
        자리마다 softmax 확률이 나오고, action 의 확률은 그 곱이라 바로 계산된다. action 은 연속 숫자가 아니라 칸 token 이고, rollout 을 모을
        때 확률대로 뽑으므로 무작위성도 있다. PPO 는 보통 critic 과 함께 쓴다.
    - question: |
        action 하나가 token 여러 개로 된 VLA 에서, action 전체의 ratio 와 token 자리별 ratio 의 관계로 옳은 것은?
      choices:
        - 'action 전체의 ratio 는 자리별 ratio 를 모두 곱한 값이다'
        - 'action 전체의 ratio 는 자리별 ratio 의 평균이다'
        - 'action 전체의 ratio 는 첫 자리의 ratio 와 같다'
        - 'action 전체의 ratio 는 자리별 ratio 를 모두 더한 값이다'
      answer: 0
      explanation: |
        action 의 확률은 자리별 token 확률의 곱이므로, 새 확률을 옛 확률로 나눈 ratio 도 자리마다의 비를 곱한 값이 된다. 그래서 한 자리만
        확률이 바뀌고 나머지 자리의 ratio 가 1 이면 action 전체의 ratio 는 그 한 자리의 ratio 와 같다. 평균이나 합은 확률을 곱하는 구조와
        맞지 않고, 첫 자리만 보면 뒤 자리의 변화를 놓친다.
    - question: |
        token VLA 를 PPO 로 fine-tuning 할 때 clip 이 하는 일로 옳은 것은?
      choices:
        - '실패한 episode 를 학습에서 빼 준다'
        - 'action token 의 확률을 0 과 1 사이로 자른다'
        - 'reward 를 0 과 1 사이로 자른다'
        - '성공한 action 의 확률을 이미 충분히 올렸거나 실패한 action 의 확률을 이미 충분히 내렸으면 gradient 를 멈춰, 운 좋은 성공 하나로 VLA 가 한 번에 크게 바뀌지 않게 한다'
      answer: 3
      explanation: |
        clip 은 ratio 를 $1 - \epsilon$ 과 $1 + \epsilon$ 사이로 잘라서, 그 범위를 넘어 같은 방향으로 더 고치려 할 때 gradient 를 0 으로 만든다.
        수십억 parameter 로 어렵게 배운 VLA 가 한 batch 의 운에 휘둘려 크게 바뀌는 것을 막는 장치다. 실패한 episode 도 음수 advantage 로
        그대로 쓰고, 확률이나 reward 를 자르는 것이 아니라 ratio 를 자른다.

- topic: flow-likelihood
  title: flow matching VLA 의 확률
  variants:
    - question: |
        π0 처럼 flow matching 으로 action chunk 를 만드는 VLA 에 같은 사진·지시문·관절 각도와 같은 출발 noise 를 두 번 넣으면, 두 chunk 는?
      choices:
        - 'Euler step 마다 무작위성이 있어 매번 다르다'
        - 'Euler step 은 정해진 계산이라 똑같다. chunk 가 무작위인 이유는 전부 출발 noise 에 있다'
        - '두 번째에는 첫 chunk 를 기억해 다른 chunk 를 낸다'
        - '두 chunk 의 평균이 나온다'
      answer: 1
      explanation: |
        Euler step 은 지금 자리의 속도대로 조금 직진하는 계산이라 무작위로 정하는 부분이 없다. 그래서 출발 noise 가 같으면 결과 chunk 도 같고,
        chunk 가 매번 달라지는 이유는 출발 noise 를 무작위로 뽑기 때문이다. 모델이 이전 출력을 기억하지 않으며, 평균을 내는 단계도 없다.
    - question: |
        flow matching VLA 에 PPO 의 ratio 를 바로 쓰기 어려운 이유로 옳은 것은?
      choices:
        - 'flow matching VLA 는 무작위성이 전혀 없어 다양한 action 을 시도할 수 없기 때문이다'
        - 'flow matching VLA 는 reward 를 받을 수 없기 때문이다'
        - 'action 이 token 이라 확률이 너무 작아지기 때문이다'
        - 'action 의 확률 밀도를 알려면 noise 에서 action 으로 가며 공간이 늘어난 배수를 Euler step 마다, 숫자 수백 개의 모든 짝에 대해 구해야 해서 계산하기 어렵기 때문이다'
      answer: 3
      explanation: |
        action 의 확률 밀도는 그 action 을 만든 noise 의 높이를 공간이 늘어난 배수로 나눈 값이다. 1 차원 직선이면 배수가 기울기 하나지만, chunk
        가 숫자 수백 개면 출력 하나하나가 입력 하나하나에 따라 변하는 비율을 모두 구해야 하고, 속도를 내는 network 가 자리마다 달라 Euler step
        마다 다시 해야 한다. 출발 noise 가 무작위라 시도는 다양하고 reward 도 받을 수 있으며, action 은 token 이 아니라 연속된 숫자다.
    - question: |
        flow matching loss 와 action 의 확률 사이의 관계로 옳은 것은?
      choices:
        - 'flow matching loss 는 network 가 낸 속도와 정답 속도의 차이를 제곱한 값이라 action 의 확률 밀도 자체가 아니다. 관계는 있어서 loss 차이로 ratio 를 어림하는 방법도 있지만 어디까지나 어림값이다'
        - 'flow matching loss 가 작으면 그 action 의 확률이 정확히 그만큼 크다'
        - 'flow matching loss 는 log-probability 와 똑같은 값이다'
        - '둘은 아무 관계가 없어 loss 로는 어떤 어림도 할 수 없다'
      answer: 0
      explanation: |
        flow matching loss 는 속도를 얼마나 잘 맞혔는지를 재는 값이지, 특정 action 이 나올 확률 밀도를 재는 값이 아니다. 그래서 "loss 가 작으면
        확률이 크다" 거나 "loss 가 곧 log-probability 다" 는 오해다. 그렇다고 무관하지는 않아서, FPO 는 같은 action 에 대한 옛 모델과 새 모델의
        loss 차이로 ratio 를 어림해 PPO 의 clip 을 썼다. 그래도 그것은 확률 자체가 아니라 어림값이다.

- topic: workarounds
  title: 확률 문제를 다루는 방법들
  variants:
    - question: |
        rollout 을 모아 성공한 episode 만 골라 그 action 으로 다시 SFT 하는 filtered BC 의 특징으로 옳은 것은?
      choices:
        - '확률 계산 없이 쓸 수 있지만 실패한 episode 를 버려서 실패한 행동을 밀어내는 힘이 없고, 되풀이할수록 오르는 폭이 줄어든다'
        - '실패한 episode 의 행동 확률을 직접 낮춰서 빠르게 개선된다'
        - '성공이 하나도 없어도 학습할 수 있다'
        - 'VLA 의 weight 는 그대로 두고 출발 noise 만 고른다'
      answer: 0
      explanation: |
        filtered BC 는 성공에는 weight 1, 실패에는 weight 0 을 주는 학습이라 flow matching loss 그대로 쓸 수 있고 확률이 필요 없다. 대신 실패한
        행동을 직접 밀어내지 못하고, 좋은 행동의 비율이 오를수록 새로 걸러지는 차이가 줄어 개선이 느려진다. 성공이 없으면 학습할 데이터도 없고,
        VLA 의 weight 를 고치는 방법이다. noise 만 고르는 것은 DSRL 이다.
    - question: |
        VLA 는 그대로 두고, 출발 noise 를 골라 주는 작은 policy 만 RL 로 학습하는 방법(DSRL)에 대한 설명으로 옳은 것은?
      choices:
        - 'VLA 의 weight 를 고치므로 시연에 없던 새 동작도 만들어 낼 수 있다'
        - 'noise 를 크게 고를수록 언제나 성공률이 오른다'
        - '작은 noise policy 는 Gaussian 이라 확률이 바로 나와 VLA 의 확률이 필요 없지만, VLA 가 원래 낼 수 있는 행동 안에서만 고를 수 있다'
        - '출발 noise 가 무작위성의 원천이 아닌 모델에만 쓸 수 있다'
      answer: 2
      explanation: |
        flow matching VLA 의 무작위성은 전부 출발 noise 에 있으므로, 어떤 noise 를 넣을지 고르면 어떤 행동이 나올지를 조종할 수 있다. noise
        policy 는 종 모양 곡선이라 확률이 바로 나와서 ratio 계산이 쉽다. 그러나 VLA 는 고정이라 시연에 없던 동작은 어떤 noise 로도 나오지 않고,
        noise 를 너무 크게 고르면 VLA 가 학습 때 거의 본 적 없는 입력이 되어 오히려 위험하다.
    - question: |
        rollout 마다 critic 으로 advantage 를 구해 "좋음" 또는 "나쁨" 표시를 붙이고 그 표시와 함께 학습하는 방법(π*0.6 의 RECAP)의 특징으로
        옳은 것은?
      choices:
        - '성공한 rollout 만 쓰고 실패한 rollout 은 버린다'
        - '실패까지 포함한 모든 데이터를 표시와 함께 flow matching loss 로 학습하고, 실행할 때는 늘 "좋음" 을 넣어 좋은 쪽 행동을 끌어낸다'
        - 'Euler step 마다 noise 를 넣어 경로 전체의 확률을 계산한다'
        - 'critic 없이 advantage 를 구한다'
      answer: 1
      explanation: |
        모델은 "좋음" 이 붙었을 때와 "나쁨" 이 붙었을 때의 행동을 구분해 배우므로, 실패한 데이터도 "이렇게 하면 나쁘다" 는 정보로 쓴다.
        확률 없이 SFT 와 같은 loss 로 학습하므로 flow matching VLA 에 그대로 맞고, 실행할 때 "좋음" 을 넣으면 좋은 쪽 행동이 나온다. 성공만
        쓰는 것은 filtered BC, step 마다 noise 를 넣는 것은 다른 방법이며, advantage 를 구하려면 critic 이 필요하다.

- topic: real-world
  title: simulation 과 실물, 사람의 개입
  variants:
    - question: |
        VLA 의 RL fine-tuning 을 simulation 에서 할 때와 실물 로봇에서 할 때를 비교한 설명으로 옳은 것은?
      choices:
        - '실물 로봇은 reset 과 성공 판정을 저절로 해 주어 simulation 보다 시도가 싸다'
        - 'simulation 에서 배운 행동은 실물에서도 언제나 똑같이 통한다'
        - 'simulation 은 environment 를 여러 개 동시에 돌릴 수 없어 느리다'
        - 'simulation 은 여러 environment 를 동시에 돌리고 reset·성공 판정을 프로그램이 해서 시도가 싸지만, 마찰·조명 같은 차이 때문에 배운 행동이 실물에서 어긋날 수 있다'
      answer: 3
      explanation: |
        simulation 에서는 같은 환경을 여러 개 동시에 돌리고, 물건을 제자리에 되돌리는 reset 과 성공 판정도 프로그램이 해서 많은 시도를 싸게
        모은다. 실물에서는 사람이나 다른 장치가 reset 과 판정을 맡아야 해서 비싸다. 대신 simulation 은 마찰·무게·조명·카메라 그림이 실물과
        조금씩 달라서, 거기서 배운 행동이 실물에서 그대로 통한다는 보장이 없다.
    - question: |
        실물 로봇에서 RL 을 하던 중 컵이 미끄러지려 하자 사람이 로봇을 넘겨받아 다시 잡아 준 뒤 돌려주었다. 이 episode 가 남기는 데이터의
        쓰임으로 옳은 것은?
      choices:
        - '사람이 끼어든 episode 는 오염되었으므로 모두 버린다'
        - '사람이 넘겨받은 구간은 회복하는 정답 시연으로 SFT 처럼 쓰고, policy 가 실행한 구간과 episode 의 성공 여부는 RL 데이터로 쓴다'
        - '사람 구간에만 reward 1 을 주고 나머지는 모두 reward 0 으로 둔다'
        - '개입은 안전을 위한 것일 뿐 그 구간은 학습에 쓰지 않는다'
      answer: 1
      explanation: |
        사람이 넘겨받은 구간은 "미끄러지려는 컵을 다시 잡는" 행동을 담고 있어서, 시연에 거의 없던 회복 동작을 정답으로 배울 수 있다. policy 가
        실행한 나머지 구간과 성공 여부는 RL 의 데이터가 되고, 넘겨받았다는 사실 자체를 직전 행동이 나빴다는 신호로 쓰기도 한다. 그래서 개입은
        안전을 지키면서 가장 귀한 데이터도 남긴다.
    - question: |
        실물 로봇에서 성공 판정을 맡은 reward classifier 가 실패한 episode 일부를 성공으로 잘못 판정한다. RL 에 생기는 일로 옳은 것은?
      choices:
        - '판정 오류는 평균에서 상쇄되어 학습에 영향이 없다'
        - '잘못 판정된 episode 는 RL 이 스스로 알아내 버린다'
        - '실제로는 실패지만 classifier 가 성공으로 보는 행동도 reward 를 받아, RL 이 그 틀린 행동을 키운다'
        - 'classifier 가 틀리면 RL 이 학습을 아예 멈춘다'
      answer: 2
      explanation: |
        RL 은 reward 를 정답으로 믿고 배우므로, 판정이 틀린 만큼 틀린 쪽으로 배운다. 예를 들어 컵을 상자 가장자리에 걸쳐 놓는 행동을 classifier
        가 성공으로 보면 그 행동의 확률이 올라간다. 오류가 특정 행동에 몰려 있으면 평균에서 상쇄되지 않고, RL 에는 판정이 틀렸는지 알아낼
        다른 정보가 없으며, 학습이 멈추지도 않는다.
