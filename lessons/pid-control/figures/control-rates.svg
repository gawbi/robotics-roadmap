<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>policy 와 PID 의 두 주기. 위는 VLA policy 가 카메라 영상과 지시문을 보고 30 Hz 로 다음 joint 목표를 내고, 아래의 PID 가 1000 Hz 로 그 목표를 따라가게 motor 를 움직이는 층 구조다. 아래 timeline 에서 policy 가 한 번 낼 때 PID 는 약 33 번 계산한다</title>
