<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>기울어진 레일 위의 카트. gravity 의 일부가 레일을 따라 카트를 아래로 2 N 으로 당기고, motor 는 레일을 따라 위쪽으로 힘 F 를 낸다. 위치 x 는 레일을 따라 잰다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="598" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="50.0" y1="225.0" x2="535.1" y2="104.0" stroke="#475569" stroke-width="4"/>
  <line x1="193.9" y1="181.9" x2="197.2" y2="195.5" stroke="#e2e8f0" stroke-width="2"/>
  <text x="201.8" y="217.9" fill="#94a3b8" font-size="13" text-anchor="middle">x = 0</text>
  <line x1="436.4" y1="121.4" x2="439.8" y2="135.0" stroke="#e2e8f0" stroke-width="2"/>
  <text x="444.4" y="157.5" fill="#94a3b8" font-size="13" text-anchor="middle">x = 1 (목표)</text>
  <path d="M210.3,181.9 L295.7,160.6 L288.0,129.6 L202.6,150.9 Z" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="249.2" y="160.8" fill="#e2e8f0" font-size="12" text-anchor="middle">m = 1 kg</text>
  <line x1="299.6" y1="143.2" x2="388.9" y2="120.9" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-sky)"/>
  <text x="354.2" y="105.9" fill="#38bdf8" font-size="14" text-anchor="middle">motor 의 힘 F</text>
  <line x1="198.7" y1="168.3" x2="130.8" y2="185.3" stroke="#f87171" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="120.0" y="130.0" fill="#f87171" font-size="13" text-anchor="middle">레일을 따라 당기는</text>
  <text x="120.0" y="150.0" fill="#f87171" font-size="13" text-anchor="middle">gravity 2 N</text>
  <text x="300.0" y="36.0" fill="#e2e8f0" font-size="15" text-anchor="middle">카트에 걸리는 힘의 합 = F − 2</text>
</svg>
