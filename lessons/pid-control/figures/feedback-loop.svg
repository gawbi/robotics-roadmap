<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>feedback loop. 목표 위치 1 에서 측정한 위치 0 을 뺀 오차 1 에 Kp = 4 를 곱한 힘 4 N 으로 카트를 밀고, 움직인 위치를 다시 재서 오차를 계산한다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="598" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16.0" y="60.0" width="104.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="68.0" y="86.0" fill="#e2e8f0" font-size="15" text-anchor="middle">목표 위치</text>
  <text x="68.0" y="105.0" fill="#f59e0b" font-size="13" text-anchor="middle">x목표 = 1</text>
  <line x1="122.0" y1="90.0" x2="160.0" y2="90.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <circle cx="178.0" cy="90.0" r="16" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="178.0" y="96.0" fill="#e2e8f0" font-size="18" text-anchor="middle">−</text>
  <text x="150.0" y="80.0" fill="#94a3b8" font-size="14" text-anchor="start">+</text>
  <text x="184.0" y="124.0" fill="#94a3b8" font-size="14" text-anchor="start">−</text>
  <line x1="194.0" y1="90.0" x2="236.0" y2="90.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="215.0" y="80.0" fill="#f87171" font-size="13" text-anchor="middle">e = 1</text>
  <rect x="240.0" y="60.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300.0" y="86.0" fill="#e2e8f0" font-size="15" text-anchor="middle">controller</text>
  <text x="300.0" y="105.0" fill="#38bdf8" font-size="13" text-anchor="middle">F = 4 × e</text>
  <line x1="362.0" y1="90.0" x2="410.0" y2="90.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="386.0" y="80.0" fill="#38bdf8" font-size="13" text-anchor="middle">F = 4</text>
  <rect x="414.0" y="60.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="474.0" y="86.0" fill="#e2e8f0" font-size="15" text-anchor="middle">카트</text>
  <text x="474.0" y="105.0" fill="#94a3b8" font-size="13" text-anchor="middle">m = 1 kg</text>
  <line x1="534.0" y1="90.0" x2="572.0" y2="90.0" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M572,90 L572,180 L178,180 L178,110" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="375.0" y="172.0" fill="#94a3b8" font-size="13" text-anchor="middle">위치를 재서 되돌려 보낸다 (지금 x = 0)</text>
  <text x="300.0" y="226.0" fill="#94a3b8" font-size="13" text-anchor="middle">오차를 보고 힘을 정하고, 움직인 결과를 다시 재서 오차를 고친다</text>
</svg>
