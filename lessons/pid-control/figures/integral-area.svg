<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>오차를 Δt = 0.5 초마다 쌓은 integral. 오차 1, 0.5, 0.5, −0.5 의 넓이 0.5, 0.25, 0.25, −0.25 를 차례로 더하면 S 가 0.5, 0.75, 1, 0.75 가 된다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="50.0" width="460.0" height="180.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="162.5" x2="530.0" y2="162.5" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="50.0" x2="70.0" y2="230.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="247.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="185.0" y="247.0" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <text x="300.0" y="247.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <text x="415.0" y="247.0" fill="#64748b" font-size="12" text-anchor="middle">1.5</text>
  <text x="530.0" y="247.0" fill="#64748b" font-size="12" text-anchor="middle">2</text>
  <text x="63.0" y="211.5" fill="#64748b" font-size="12" text-anchor="end">-0.5</text>
  <text x="63.0" y="166.5" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="63.0" y="121.5" fill="#64748b" font-size="12" text-anchor="end">0.5</text>
  <text x="63.0" y="76.5" fill="#64748b" font-size="12" text-anchor="end">1</text>
  <text x="530.0" y="264.0" fill="#94a3b8" font-size="13" text-anchor="end">t (초)</text>
  <text x="70.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="start">오차 e</text>
  <rect x="72.0" y="72.5" width="111.0" height="90.0" rx="2" fill="#38bdf8" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1"/>
  <text x="127.5" y="122.5" fill="#e2e8f0" font-size="13" text-anchor="middle">+0.5</text>
  <text x="127.5" y="68.0" fill="#34d399" font-size="13" text-anchor="middle">S = 0.5</text>
  <rect x="187.0" y="117.5" width="111.0" height="45.0" rx="2" fill="#38bdf8" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1"/>
  <text x="242.5" y="145.0" fill="#e2e8f0" font-size="13" text-anchor="middle">+0.25</text>
  <text x="242.5" y="68.0" fill="#34d399" font-size="13" text-anchor="middle">S = 0.75</text>
  <rect x="302.0" y="117.5" width="111.0" height="45.0" rx="2" fill="#38bdf8" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1"/>
  <text x="357.5" y="145.0" fill="#e2e8f0" font-size="13" text-anchor="middle">+0.25</text>
  <text x="357.5" y="68.0" fill="#34d399" font-size="13" text-anchor="middle">S = 1</text>
  <rect x="417.0" y="162.5" width="111.0" height="45.0" rx="2" fill="#f87171" fill-opacity="0.55" stroke="#f87171" stroke-width="1"/>
  <text x="472.5" y="190.0" fill="#e2e8f0" font-size="13" text-anchor="middle">-0.25</text>
  <text x="472.5" y="68.0" fill="#34d399" font-size="13" text-anchor="middle">S = 0.75</text>
  <text x="300.0" y="282.0" fill="#94a3b8" font-size="13" text-anchor="middle">칸 하나의 넓이 = 오차 × Δt, S = 지금까지의 넓이를 모두 더한 값</text>
</svg>
