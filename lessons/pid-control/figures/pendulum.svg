<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>1-DOF pendulum. θ 는 아래로 늘어진 자세에서 잰 각도이고, pivot 의 motor 가 낸 torque τ 가 gravity 와 friction 을 이겨 팔을 돌린다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="100.0" y1="40.0" x2="200.0" y2="40.0" stroke="#475569" stroke-width="3"/>
  <line x1="150.0" y1="50.0" x2="150.0" y2="240.0" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="138.0" y="258.0" fill="#64748b" font-size="13" text-anchor="middle">θ = 0</text>
  <line x1="150" y1="50" x2="247.5" y2="189.3" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="247.5" cy="189.3" r="14" fill="#d6aa62"/>
  <circle cx="150.0" cy="50.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="214.0" y="116.0" fill="#94a3b8" font-size="15" text-anchor="start">l</text>
  <text x="269.5" y="186.3" fill="#d6aa62" font-size="15" text-anchor="start">m</text>
  <path d="M150,110 A60,60 0 0,0 184.4,99.1" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160.0" y="132.0" fill="#e2e8f0" font-size="15" text-anchor="start">θ</text>
  <line x1="247.5" y1="205.3" x2="247.5" y2="258.3" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="257.5" y="250.3" fill="#d88b8b" font-size="14" text-anchor="start">mg</text>
  <path d="M114,50 A36,36 0 0,0 147,86" fill="none" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <text x="108.0" y="90.0" fill="#7cb4d8" font-size="15" text-anchor="start">τ</text>
  <text x="316.0" y="66.0" fill="#e2e8f0" font-size="16" text-anchor="start">τ = I α + b ω + m g l sin θ</text>
  <text x="316.0" y="102.0" fill="#94a3b8" font-size="13" text-anchor="start">I α : 각가속도 α 를 내는 데 드는 torque</text>
  <text x="316.0" y="126.0" fill="#94a3b8" font-size="13" text-anchor="start">b ω : 각속도 ω 에 비례하는 friction</text>
  <text x="316.0" y="150.0" fill="#94a3b8" font-size="13" text-anchor="start">m g l sin θ : 팔을 아래로 돌리는 gravity</text>
  <text x="316.0" y="174.0" fill="#94a3b8" font-size="13" text-anchor="start">τ : pivot 의 motor 가 내는 torque</text>
  <text x="316.0" y="214.0" fill="#e2e8f0" font-size="13" text-anchor="start">m = 1 kg, l = 0.5 m 이면</text>
  <text x="316.0" y="236.0" fill="#e2e8f0" font-size="13" text-anchor="start">I = m l² = 0.25 kg·m², m g l = 4.905 N·m</text>
</svg>
