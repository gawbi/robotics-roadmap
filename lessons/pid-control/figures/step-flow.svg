<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>한 step 의 계산 흐름. 힘 2 N 을 질량 1 kg 으로 나눈 가속도 2 로 속도를 먼저 고치고, 고친 속도로 위치를 옮긴다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="598" height="208" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="18.0" y="40.0" width="122.0" height="92.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="79.0" y="72.0" fill="#e2e8f0" font-size="15" text-anchor="middle">힘 F</text>
  <text x="79.0" y="93.0" fill="#d6aa62" font-size="15" text-anchor="middle">2 N</text>
  <text x="79.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">motor 가 미는 힘</text>
  <rect x="166.0" y="40.0" width="122.0" height="92.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="227.0" y="72.0" fill="#e2e8f0" font-size="15" text-anchor="middle">가속도 a</text>
  <text x="227.0" y="93.0" fill="#7fc4a2" font-size="15" text-anchor="middle">2 ÷ 1 = 2</text>
  <text x="227.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">F ÷ m</text>
  <rect x="314.0" y="40.0" width="122.0" height="92.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="375.0" y="72.0" fill="#e2e8f0" font-size="15" text-anchor="middle">새 속도 v</text>
  <text x="375.0" y="93.0" fill="#7cb4d8" font-size="15" text-anchor="middle">0 + 2 × 1 = 2</text>
  <text x="375.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">v + a × Δt</text>
  <rect x="462.0" y="40.0" width="122.0" height="92.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="523.0" y="72.0" fill="#e2e8f0" font-size="15" text-anchor="middle">새 위치 x</text>
  <text x="523.0" y="93.0" fill="#a99ad6" font-size="15" text-anchor="middle">0 + 2 × 1 = 2</text>
  <text x="523.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">x + 새 v × Δt</text>
  <line x1="142.0" y1="86.0" x2="162.0" y2="86.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="290.0" y1="86.0" x2="310.0" y2="86.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="438.0" y1="86.0" x2="458.0" y2="86.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="300.0" y="166.0" fill="#e2e8f0" font-size="14" text-anchor="middle">step 0 (t = 0 초, x = 0, v = 0)  →  step 1 (t = 1 초)</text>
  <text x="300.0" y="190.0" fill="#94a3b8" font-size="13" text-anchor="middle">Δt = 1 초, 질량 m = 1 kg</text>
</svg>
