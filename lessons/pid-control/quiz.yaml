# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: p-control
  title: P 항과 진동
  variants:
    - question: |
        면접관: "마찰이 거의 없는 관절을 P 제어만으로 목표 각도에 보내면 어떻게 움직이나요? 이유도 말해 보세요."
      choices:
        - '목표에 가까워질수록 힘이 줄어 넘치지 않고 정확히 멈춘다'
        - '목표에 도착할 때 이미 속도가 있어 지나치고, 되돌아오기를 되풀이하며 진동한다. P 항은 속도를 보지 않기 때문이다'
        - '목표의 절반 지점에서 멈춘다. P 항은 오차의 절반만 고치기 때문이다'
        - '처음부터 움직이지 않는다. 오차가 작아서 힘이 생기지 않기 때문이다'
      answer: 1
      explanation: |
        P 항은 지금 오차에만 비례해서, 목표에 도착해 오차가 0 이 된 순간에도 관절이 가진 속도를 줄이지 못한다. 그래서 지나쳤다가 반대로 밀려
        돌아오기를 되풀이한다. 감쇠가 있어야 멈추며, 그 역할을 D 항이 한다. 절반에서 멈추는 것은 gravity 같은 외력이 있을 때의 steady-state
        error 이야기다.
    - question: |
        면접관: "응답이 느려서 Kp 를 크게 올렸습니다. 어떤 부작용을 예상하나요?"
      choices:
        - '응답이 빨라지는 대신 overshoot 와 진동이 커지고, 지연이 있는 실제 시스템에서는 불안정해질 수 있다'
        - '부작용 없이 응답만 빨라진다'
        - 'steady-state error 가 커진다'
        - 'D 항이 자동으로 커져서 진동이 줄어든다'
      answer: 0
      explanation: |
        Kp 를 키우면 같은 오차에 더 세게 밀어서 빨라지지만, 더 세게 지나쳐 overshoot 와 진동이 커진다. 센서·계산·actuator 의 지연이 있는 실제 시스템
        에서는 지나치게 크면 진동이 점점 커지며 발산한다. 일정한 외력에 의한 steady-state error 는 오히려 (외력 ÷ Kp) 로 줄어들고, D 항은 따로 정하는
        gain 이라 저절로 바뀌지 않는다.
    - question: |
        면접관: "PID 의 세 항 중 지금 오차의 크기에만 반응하는 항은 무엇이고, 그 항의 한계는 무엇인가요?"
      choices:
        - 'I 항이며, 오차가 0 이 되면 바로 멈추지 못한다'
        - 'D 항이며, 목표가 바뀔 때 튄다'
        - 'P 항이며, 속도를 보지 않아 진동하고 일정한 외력이 있으면 오차가 남는다'
        - '세 항 모두 지금 오차의 크기에만 반응한다'
      answer: 2
      explanation: |
        P 항은 지금 오차에 gain 을 곱할 뿐이라 속도를 보지 않아 진동하고, gravity 처럼 늘 당기는 힘이 있으면 그 힘과 균형을 이루는 지점에서 멈춰 오차가
        남는다. I 항은 쌓인 오차, D 항은 오차의 변화율에 반응한다.

- topic: steady-state-error
  title: steady-state error
  variants:
    - question: |
        면접관: "로봇 팔의 어깨 관절이 PD 제어로 목표 각도보다 늘 조금 아래에서 멈춥니다. 원인과 해결책은?"
      choices:
        - 'D 항이 너무 커서 생긴다. Kd 를 0 으로 만든다'
        - '센서가 고장 났다. 엔코더를 교체한다'
        - '목표 각도가 관절 한계를 넘었다. 목표를 바꾼다'
        - 'gravity 를 P 항이 혼자 버티느라 오차가 남는다. I 항을 더하거나 gravity 를 버티는 torque 를 feedforward 로 더한다'
      answer: 3
      explanation: |
        멈춘 상태에서는 D 항이 0 이라, gravity 를 P 항 혼자 버티려면 오차가 (gravity torque ÷ Kp) 만큼 남아야 한다. I 항은 이 오차를 쌓아 버티는 힘을
        대신 내고, gravity feedforward 는 그 힘을 모델로 미리 계산해 더한다. Kd 는 정지 상태에 영향이 없다.
    - question: |
        면접관: "일정한 외력이 있는 시스템에서 Kp 를 키우면 steady-state error 는 어떻게 되나요?"
      choices:
        - '줄어들지만 Kp 를 아무리 키워도 0 이 되지는 않는다'
        - '0 이 된다'
        - '커진다'
        - 'Kp 와는 관계가 없다'
      answer: 0
      explanation: |
        P 항이 외력과 균형을 이루려면 Kp × 오차 = 외력이라서 오차는 외력 ÷ Kp 다. Kp 를 키우면 줄지만 0 은 되지 않고, Kp 를 무작정 키우면 진동과
        불안정이 따라온다. 오차를 0 으로 만드는 것은 I 항이나 feedforward 다.
    - question: |
        면접관: "feedback 과 feedforward 의 차이를 설명해 보세요."
      choices:
        - '둘은 같은 말이다'
        - 'feedforward 는 측정값으로, feedback 은 모델로 힘을 계산한다'
        - 'feedback 은 오차가 생긴 뒤 그 오차를 보고 고치고, feedforward 는 모델로 필요한 힘을 미리 계산해 오차가 생기기 전에 넣는다'
        - 'feedforward 는 I 항의 다른 이름이다'
      answer: 2
      explanation: |
        feedback 은 측정한 결과와 목표의 차이를 보고 고치므로 모델이 없어도 동작하지만 오차가 생긴 뒤에야 반응한다. feedforward 는 gravity 같은 필요한
        힘을 모델로 미리 계산해 넣어 오차가 생기기 전에 막지만, 모델이 틀리면 그만큼 틀린다. 그래서 둘을 함께 쓴다.

- topic: d-term
  title: D 항의 역할과 함정
  variants:
    - question: |
        면접관: "PD 제어에서 D 항이 하는 일을 한 문장으로 말해 보세요."
      choices:
        - '쌓인 오차를 없앤다'
        - '오차의 변화율에 맞서는 힘을 더해, 목표로 빠르게 다가올 때 미리 브레이크를 걸어 overshoot 와 진동을 줄인다'
        - '목표 쪽으로 미는 힘을 키운다'
        - 'motor 의 힘 한계를 계산한다'
      answer: 1
      explanation: |
        D 항은 오차가 줄어드는 빠르기, 곧 다가오는 속도에 비례해 반대 방향 힘을 더하는 감쇠 역할을 한다. 쌓인 오차를 없애는 것은 I 항, 목표 쪽으로
        미는 것은 P 항이다.
    - question: |
        면접관: "목표값이 계단처럼 갑자기 바뀌는 순간 PID 출력이 크게 튀었습니다. 원인과 흔한 해결책은?"
      choices:
        - 'I 항의 windup 이다. 적분을 멈춘다'
        - 'P 항이 너무 크다. Kp 를 줄인다'
        - '센서 noise 다. 센서를 바꾼다'
        - '오차가 한순간에 뛰어 D 항이 크게 튀는 derivative kick 이다. D 항을 오차 대신 측정값의 변화율로 계산한다'
      answer: 3
      explanation: |
        목표가 계단처럼 바뀌면 오차도 한 순간에 크게 바뀌어, 오차의 변화율로 계산한 D 항이 순간적으로 매우 커진다. 목표가 일정한 동안에는 오차의
        변화율이 측정값 변화율의 부호만 바꾼 것과 같으므로, D 항을 측정값으로 계산하면 같은 감쇠를 내면서 kick 이 사라진다.
    - question: |
        면접관: "센서 noise 가 큰 시스템에서 Kd 를 키울 때 주의할 점은?"
      choices:
        - 'noise 는 짧은 시간에 크게 오르내려 변화율을 재는 D 항이 가장 크게 증폭하므로, 출력이 떨린다. D 항에 low-pass filter 를 함께 쓴다'
        - 'noise 는 D 항에 영향이 없다'
        - 'Kd 를 키우면 noise 가 줄어든다'
        - 'noise 는 I 항에서만 문제가 된다'
      answer: 0
      explanation: |
        변화율은 짧은 시간의 차이를 나누므로, 작은 noise 도 큰 기울기로 보인다. 그래서 D 항이 noise 를 가장 크게 키우고 actuator 가 떨린다. D 항에
        filter 를 거친 값을 쓰는 것이 흔한 처리다. I 항은 쌓으면서 noise 가 평균에 가까워져 상대적으로 덜 민감하다.

- topic: i-term
  title: I 항과 windup
  variants:
    - question: |
        면접관: "integral windup 이 무엇이고 어떻게 막나요?"
      choices:
        - 'D 항이 noise 를 키우는 현상이다. filter 를 단다'
        - 'actuator 가 출력 한계에 걸려 있는 동안에도 오차를 계속 적분해, 목표에 도착한 뒤에도 쌓인 값 때문에 크게 overshoot 하는 현상이다. 한계에 걸린 동안 적분을 멈추거나 적분값을 제한한다'
        - 'Kp 가 너무 커서 생기는 진동이다. Kp 를 줄인다'
        - '센서가 늦게 응답하는 현상이다. 주기를 늘린다'
      answer: 1
      explanation: |
        출력이 한계에 걸리면 더 세게 밀 수 없는데도 I 항은 오차를 계속 쌓는다. 목표에 도착해 오차가 반대 부호가 되어도 쌓인 값이 줄어들 때까지 힘을
        빼지 못해 크게 넘친다. 한계에 걸린 동안 적분을 멈추거나(conditional integration) 적분값을 범위 안으로 자르는 anti-windup 으로 막는다.
    - question: |
        면접관: "I 항을 너무 크게 잡으면 어떤 일이 생기나요?"
      choices:
        - '응답이 매우 느려지지만 넘치지는 않는다'
        - 'steady-state error 가 다시 생긴다'
        - '쌓인 값이 빠르게 커져 overshoot 와 느린 진동이 생기고, 심하면 불안정해진다'
        - '아무 변화가 없다'
      answer: 2
      explanation: |
        I 항은 오차가 0 이 될 때까지 계속 쌓이고 오차의 부호가 바뀐 뒤에야 줄기 시작하므로, 크면 지나치게 밀어 넘치고 천천히 출렁인다. 그래서 보통
        P·D 로 응답을 맞춘 뒤 남은 오차를 없앨 만큼만 작게 더한다.
    - question: |
        면접관: "실행 중에 Ki 를 바꿨더니 출력이 한순간 크게 튀었습니다. 왜 그렇고, 어떻게 구현하면 막을 수 있나요?"
      choices:
        - 'Ki 를 바꾸면 D 항이 바뀌어서다. D 항을 끈다'
        - '센서 값이 바뀌어서다. 센서를 다시 보정한다'
        - 'Ki 는 실행 중에 바꿀 수 없는 값이라 오류가 난 것이다'
        - '출력이 (쌓인 오차) × Ki 라서 Ki 를 바꾸는 순간 I 항 전체가 달라진다. 오차에 Ki 를 곱한 값을 쌓아 두면 바꾼 뒤부터만 새 Ki 가 적용된다'
      answer: 3
      explanation: |
        쌓인 오차에 마지막에 Ki 를 곱하면, Ki 를 바꾸는 순간 지금까지 쌓인 값 전체에 새 Ki 가 곱해져 출력이 계단처럼 튄다. 매 step 의 오차에 그때의
        Ki 를 곱해 쌓아 두면 지난 기여는 그대로이고 앞으로의 기여만 바뀐다.

- topic: tuning
  title: gain 을 맞추는 순서
  variants:
    - question: |
        면접관: "새 관절의 PID gain 을 손으로 맞춘다면 보통 어떤 순서로 하나요?"
      choices:
        - 'I 를 먼저 크게 올리고 P 와 D 는 0 으로 둔다'
        - '세 gain 을 같은 값으로 두고 함께 올린다'
        - 'P 를 올려 빠르게 반응하게 하고, 진동하면 D 를 더하고, 남는 오차가 있으면 I 를 조금 더한다'
        - 'D 만으로 목표에 보내고 마지막에 P 를 더한다'
      answer: 2
      explanation: |
        P 가 응답의 기본 세기를 정하고, D 가 그 응답의 진동을 잡고, I 는 남은 오차를 없애는 마무리라서 이 순서가 흔하다. I 를 먼저 크게 올리면 windup
        과 느린 진동이 생기고, D 만으로는 목표 쪽으로 미는 힘이 없다.
    - question: |
        면접관: "PID 의 계산 주기(Δt)가 매번 들쭉날쭉하면 어떤 문제가 생기나요?"
      choices:
        - 'I 항과 D 항이 Δt 에 따라 크기가 달라져, 같은 gain 이라도 매번 동작이 달라진다. 일정한 주기로 돌리거나 실제 경과 시간을 넣어야 한다'
        - 'P 항만 영향을 받는다'
        - '아무 문제가 없다. PID 는 주기와 무관하다'
        - '주기가 들쭉날쭉하면 오히려 진동이 줄어든다'
      answer: 0
      explanation: |
        I 항은 오차 × Δt 를 쌓고 D 항은 오차의 차이 ÷ Δt 로 계산하므로 Δt 가 바뀌면 두 항의 크기가 바뀐다. P 항은 지금 오차만 보므로 Δt 와 무관하다.
        그래서 일정한 주기의 timer 로 돌리거나 매번 실제 지난 시간을 재서 쓴다.
    - question: |
        면접관: "로봇 팔에 무거운 gripper 를 새로 달았더니, 기존 gain 으로는 팔이 처지고 멈출 때 떨립니다. 가장 먼저 의심할 것은?"
      choices:
        - 'policy 를 다시 학습해야 한다'
        - '부하가 바뀌어 필요한 힘과 관성이 달라졌는데 gain 과 gravity 보상이 예전 무게에 맞춰져 있다. gain 과 feedforward 를 새 무게에 맞게 다시 맞춘다'
        - '카메라 위치가 바뀌었다'
        - '통신 속도가 느려졌다'
      answer: 1
      explanation: |
        끝단 무게가 늘면 관절이 버텨야 할 gravity torque 와 움직일 관성이 커져서, 예전 gain 으로는 오차가 남고(처짐) 감쇠가 맞지 않아 떨린다. 저수준
        제어의 문제라 policy 재학습이나 카메라, 통신과는 관계가 먼저 없다.

- topic: control-layers
  title: policy 와 저수준 controller
  variants:
    - question: |
        면접관: "VLA 같은 학습한 policy 를 쓰는 로봇 팔에서, motor 에 들어가는 전류는 보통 누가 정하나요?"
      choices:
        - 'policy 가 매 step 전류를 직접 출력한다'
        - '카메라 driver 가 정한다'
        - '사람이 teleop 으로 정한다'
        - 'policy 는 관절 목표 각도를 내고, servo 나 motor driver 안의 저수준 controller(PID 등)가 훨씬 빠른 주기로 그 목표를 따라가도록 전류를 정한다'
      answer: 3
      explanation: |
        대부분의 학습 기반 로봇에서 policy 는 10 ~ 50 Hz 로 관절 목표(또는 끝단 pose)를 내고, 그 아래의 저수준 controller 가 수백 ~ 수천 Hz 로 전류·torque
        를 정한다. 그래서 policy 성능이 좋아도 저수준 gain 이 맞지 않으면 실제 움직임이 나빠진다.
    - question: |
        면접관: "policy 는 30 Hz 인데 저수준 PID 는 1 kHz 로 돌립니다. PID 를 이렇게 빠르게 돌리는 이유로 맞지 않는 것은?"
      choices:
        - '큰 gain 을 안정적으로 쓰려면 계산 간격이 짧아야 해서'
        - 'gravity·마찰·접촉 같은 힘이 ms 단위로 변해서'
        - 'PID 를 빠르게 돌리면 policy 의 출력이 더 똑똑해져서'
        - 'policy 가 motor 의 세부 물리까지 배우지 않도록 역할을 나누려고'
      answer: 2
      explanation: |
        저수준 loop 를 빠르게 돌리는 이유는 안정성, 빠르게 변하는 힘에 대한 대응, policy 와의 분업이다. PID 의 주기는 policy 가 어떤 목표를 내는지와는
        관계가 없어서 policy 를 더 똑똑하게 만들지 않는다.
    - question: |
        policy 가 20 Hz, 저수준 PID 가 500 Hz 로 돈다. policy 가 목표를 한 번 낼 때마다 PID 는 대략 몇 번 계산하나?
      choices:
        - '20 번'
        - '25 번'
        - '480 번'
        - '10,000 번'
      answer: 1
      explanation: |
        policy 는 1/20 = 0.05 초마다, PID 는 1/500 = 0.002 초마다 계산하므로 0.05 ÷ 0.002 = 25 번이다. 두 주파수의 차나 곱이 아니라 비율이다.
