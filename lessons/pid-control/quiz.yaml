# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: time-step
  title: 힘·속도·위치와 한 step 씩 계산하는 simulation
  variants:
    - question: |
        로봇 팔이 목표 각도에 처음 닿는 순간 motor 의 힘을 0 으로 끊었다. 팔은 어떻게 되는가?
      choices:
        - '힘이 0 이므로 그 자리에 바로 멈춘다'
        - '힘이 0 이 되면 속도도 즉시 0 이 된다'
        - '닿는 순간까지 붙은 속도가 남아 있어서 목표를 지나쳐 계속 움직인다'
        - '출발했던 자리로 곧바로 되돌아간다'
      answer: 2
      explanation: |
        힘은 가속도를 바꾸고, 가속도가 쌓여 속도가, 속도가 쌓여 위치가 바뀐다. 힘을 끊으면 더 빨라지지 않을 뿐 그때까지 쌓인 속도는
        그대로라서 목표를 지나친다. 멈추게 하려면 목표에 닿기 전부터 힘을 줄이거나 반대로 밀어야 한다. 힘을 끊는다고 속도가 사라지거나
        팔이 되돌아가지는 않는다.
    - question: |
        시간을 $\Delta t$ 간격으로 잘라 한 step 씩 계산하는 simulation 에서 $\Delta t$ 를 더 작게 하면 어떻게 되는가?
      choices:
        - '실제 움직임에 더 가까워지지만, 같은 시간을 계산하는 데 step 이 더 많이 든다'
        - '결과는 똑같고 계산만 느려진다'
        - '오히려 실제와 더 멀어진다'
        - '계산해야 할 step 수가 줄어든다'
      answer: 0
      explanation: |
        simulation 은 한 step 동안 힘과 속도가 변하지 않는다고 보고 계산하므로, $\Delta t$ 가 클수록 그 가정이 틀리는 구간이 길어져
        오차가 커진다. $\Delta t$ 를 줄이면 실제에 가까워지는 대신 같은 2 초를 계산하는 데 더 많은 step 이 필요하다. 결과가 그대로라는
        보기는 근사라는 점을 놓쳤고, step 수는 $\Delta t$ 에 반비례해 늘어난다.
    - question: |
        마찰이 없는 용수철 같은 장치를 simulation 했더니 출렁이는 폭이 step 마다 점점 커졌다. 실제로는 energy 가 보존되어야 하는
        장치다. 가장 먼저 의심할 것은?
      choices:
        - '실제 장치도 원래 그렇게 점점 크게 출렁인다'
        - '지금 속도로 위치를 먼저 옮기는 계산 순서가 step 마다 energy 를 조금씩 만들어 낸다'
        - '질량이 너무 커서 생기는 현상이다'
        - '$\Delta t$ 가 너무 작아서 생기는 현상이다'
      answer: 1
      explanation: |
        마찰이 없으면 운동 energy 와 용수철 energy 의 합은 변하지 않아야 하므로, 합이 저절로 커진다면 계산이 만든 오차다. 지금 속도로
        위치를 먼저 옮기는 explicit Euler 는 속도가 줄기 시작한 순간에도 줄기 전 속도로 한 칸을 더 가서 energy 를 쌓는다. 속도를 먼저
        고치고 그 새 속도로 위치를 옮기는 semi-implicit Euler 는 이렇게 늘어나지 않는다. $\Delta t$ 가 작을수록 증가는 오히려 느려진다.

- topic: p-control
  title: P 제어와 진동
  variants:
    - question: |
        마찰이 없는 레일 위의 카트를 P 제어 $F = K_p e$ 만으로 목표에 보내면 목표를 사이에 두고 계속 왔다 갔다 한다. 그 이유로 맞는
        것은?
      choices:
        - '$K_p$ 가 너무 작아서 목표에 닿을 힘이 모자라기 때문이다'
        - '오차를 계산할 때 부호가 반대로 들어갔기 때문이다'
        - 'motor 의 힘에 한계가 있기 때문이다'
        - 'P 항은 지금 위치의 오차만 보고 다가오는 속도는 보지 않아, 오차가 0 인 순간에도 남은 속도로 지나치기 때문이다'
      answer: 3
      explanation: |
        목표에 닿는 순간 오차가 0 이라 P 항은 힘을 0 으로 내지만, 그때 카트에는 이미 속도가 붙어 있어 목표를 지나친다. 지나친 뒤에는
        되돌리는 힘이 생기고 같은 일이 반대로 되풀이되며, 마찰이 없으니 이 출렁임을 줄여 줄 것이 없다. 카트는 목표에 실제로 닿으므로
        힘이 모자란 것이 아니고, 부호가 반대라면 아예 목표에서 멀어진다.
    - question: |
        마찰이 없는 카트의 P 제어에서 $K_p$ 를 크게 키우면 어떻게 되는가?
      choices:
        - '더 세게 당겨 더 빨리 출렁일 뿐, 진동은 사라지지 않는다'
        - '목표에 빨리 닿고 진동도 사라진다'
        - '진동의 폭이 점점 줄어 목표에 멈춘다'
        - '카트가 목표에 닿지 못하게 된다'
      answer: 0
      explanation: |
        $K_p$ 를 키우면 출발이 빨라지고 한 번 오가는 시간이 짧아지지만, 오차만 보고 속도를 보지 않는 성질은 그대로라 같은 폭으로
        계속 지나친다. 그래서 "빨리 가려면 $K_p$ 를 키우면 된다" 는 생각은 진동 문제를 풀지 못한다. 진동을 줄이려면 속도에 맞서는
        D 항이 필요하다.
    - question: |
        P 제어로 움직이던 카트가 목표를 지나쳐 목표보다 앞쪽에 있다. 이 순간 P 항이 내는 힘의 방향은?
      choices:
        - '카트가 가던 방향, 곧 목표에서 더 멀어지는 방향'
        - '힘을 내지 않는다'
        - '목표 쪽으로 되돌리는 방향'
        - '카트의 속도와 같은 방향'
      answer: 2
      explanation: |
        오차 $e = \text{목표} - \text{현재}$ 는 목표를 지나치면 음수가 되므로 $K_p e$ 도 음수, 곧 목표 쪽으로 되돌리는 힘이다. 오차가 0 이
        아니므로 힘은 0 이 아니다. P 항은 속도를 보지 않으므로 힘의 방향은 카트가 움직이는 방향이 아니라 오직 목표가 어느 쪽인지로
        정해진다.

- topic: steady-state-error
  title: 늘 당기는 힘과 steady-state error
  variants:
    - question: |
        gravity 가 늘 아래로 당기는 기울어진 레일에서 카트를 P 제어로 위쪽 목표에 보냈다. 움직임이 다 가라앉은 뒤 카트는 어디에
        머무는가?
      choices:
        - '정확히 목표에 머문다'
        - '목표보다 조금 아래에 머문다. P 항은 오차가 있어야만 힘을 내므로, 당기는 힘을 버틸 만큼의 오차가 남는다'
        - '목표보다 조금 위에 머문다'
        - '레일 맨 아래까지 미끄러진다'
      answer: 1
      explanation: |
        멈춰 있으려면 힘의 합이 0 이어야 하므로 P 항이 레일이 당기는 힘과 같은 크기를 내야 한다. P 항은 $K_p e$ 라서 그 힘을 내려면
        오차 $e = (\text{당기는 힘}) / K_p$ 가 남아야 하고, 카트는 목표보다 그만큼 아래에 머문다. 이렇게 움직임이 가라앉은 뒤 남는 오차가
        steady-state error 다. P 항이 당기는 힘을 일부 버티므로 맨 아래까지 미끄러지지는 않는다.
    - question: |
        P 제어의 steady-state error 를 줄이려고 $K_p$ 를 계속 키우면 어떻게 되는가?
      choices:
        - '$K_p$ 가 어느 값을 넘으면 정확히 0 이 된다'
        - '오차가 오히려 커진다'
        - '오차는 $K_p$ 와 상관없다'
        - '오차가 $K_p$ 에 반비례해 줄지만 0 이 되지는 않는다'
      answer: 3
      explanation: |
        멈춘 자리의 오차는 $(\text{당기는 힘}) / K_p$ 라서 $K_p$ 를 두 배로 하면 절반이 되지만, 분모가 아무리 커도 0 이 되지는 않는다.
        P 항은 오차가 있어야만 힘을 내기 때문이다. 오차를 0 으로 없애려면 오차를 시간에 따라 쌓아 두는 I 항이나, 당기는 힘을 미리
        더하는 feedforward 가 필요하다.
    - question: |
        기울어진 레일에서 P 제어가 남긴 steady-state error 를 없애려고 D 항을 더해 PD 제어로 바꿨다. 결과는?
      choices:
        - '흔들림은 줄지만 멈춘 뒤의 오차는 그대로 남는다. 멈추면 속도가 0 이라 D 항도 0 이기 때문이다'
        - 'D 항이 남은 오차를 쌓아 두었다가 지워 준다'
        - '흔들림도 오차도 모두 사라진다'
        - '흔들림이 더 커진다'
      answer: 0
      explanation: |
        D 항은 오차가 변하는 빠르기, 곧 속도에 맞서는 힘이라 움직이는 동안에만 힘을 낸다. 카트가 멈추면 D 항은 0 이 되고 다시 P 항
        혼자 당기는 힘을 버텨야 하므로 같은 오차가 남는다. 오차를 쌓아 두는 것은 D 항이 아니라 I 항이다. D 항은 흔들림을 줄이는 쪽으로
        작용한다.

- topic: d-term
  title: D 항과 진동 억제
  variants:
    - question: |
        PD 제어의 D 항 $K_d\,\frac{\Delta e}{\Delta t}$ 가 하는 일로 맞는 것은?
      choices:
        - '오차를 시간에 따라 쌓아 멈춘 뒤의 오차를 없앤다'
        - '목표 쪽으로 미는 힘을 키워 더 빨리 도착하게 한다'
        - '오차가 변하는 빠르기에 맞서 브레이크를 걸어, 빠르게 다가올 때 미리 힘을 빼 진동을 줄인다'
        - 'motor 의 힘 한계를 늘려 준다'
      answer: 2
      explanation: |
        목표가 고정이면 $\frac{\Delta e}{\Delta t} = -v$ 라서 D 항은 $-K_d v$, 곧 빠를수록 반대 방향으로 미는 힘이다. 목표를 향해 빠르게
        다가오면 미리 브레이크를 걸어 지나치는 양을 줄이고, 마찰처럼 energy 를 덜어 내 출렁임이 잦아든다. 오차를 쌓는 것은 I 항이고,
        D 항은 다가오는 움직임을 늦추므로 미는 힘을 키우지 않는다.
    - question: |
        멈춰 있던 카트의 목표를 한순간에 0 에서 1 로 바꿨다. D 항을 오차의 변화 $\frac{\Delta e}{\Delta t}$ 로 계산하면 그 순간 어떤 일이
        생기는가?
      choices:
        - '카트가 아직 움직이지 않았으므로 D 항은 0 이다'
        - '오차가 한 step 만에 뛰어 D 항이 순간적으로 아주 큰 힘을 내고, $\Delta t$ 가 작을수록 더 크다'
        - 'D 항이 목표와 반대 방향으로 힘을 낸다'
        - 'P 항이 0 이 된다'
      answer: 1
      explanation: |
        목표가 갑자기 바뀌면 카트는 그대로인데 오차가 한 step 만에 뛰므로, 그 변화를 $\Delta t$ 로 나눈 D 항이 순간적으로 커진다.
        $\Delta t$ 가 작을수록 나누는 수가 작아 더 크게 튀고, motor 가 걷어차이듯 충격을 받는다. 이것이 derivative kick 이고, 그래서
        실제 controller 는 D 항을 측정한 속도로 계산하는 경우가 많다. 속도로 계산하면 카트가 아직 멈춰 있으니 D 항은 0 이다.
    - question: |
        PD 제어에서 $K_d$ 를 바꿔 가며 결과를 비교할 때 맞는 것은?
      choices:
        - '$K_d$ 는 클수록 언제나 좋다'
        - '$K_d$ 는 진동과 상관없고 도착 위치만 바꾼다'
        - '$K_d$ 가 작을수록 진동이 줄어든다'
        - '$K_d$ 가 작으면 여러 번 출렁이고, 너무 크면 브레이크가 세서 목표에 다가가는 것 자체가 느려진다'
      answer: 3
      explanation: |
        $K_d$ 는 브레이크의 세기라서 약하면 목표를 지나치며 여러 번 출렁이고, 너무 세면 넘치지는 않지만 천천히 기어가듯 다가간다. 그
        사이에 넘치지 않으면서 가장 빨리 닿는 값이 있고, 이를 critical damping 이라 부르며 $K_d = 2\sqrt{K_p m}$ 이다. $K_d$ 는 가는
        동안의 움직임을 바꿀 뿐 멈추는 위치는 바꾸지 않는다.

- topic: i-term
  title: I 항과 integral windup
  variants:
    - question: |
        PID 의 I 항이 steady-state error 를 0 으로 만드는 이유로 맞는 것은?
      choices:
        - 'I 항은 오차가 클 때만 힘을 내기 때문이다'
        - '오차가 조금이라도 남아 있으면 누적값이 계속 커져 힘이 세지므로, 카트가 멈춰 있을 수 있는 곳은 오차가 0 인 자리뿐이기 때문이다'
        - 'I 항은 속도에 맞서 진동을 없애기 때문이다'
        - 'I 항이 $K_p$ 를 자동으로 키워 주기 때문이다'
      answer: 1
      explanation: |
        I 항은 오차에 $\Delta t$ 를 곱해 계속 더한 누적값에 비례한다. 오차가 남아 있는 한 누적값이 계속 변해 힘도 변하므로 아무것도 변하지
        않는 멈춘 상태는 오차가 0 일 때만 가능하다. 그래서 PID 로 멈춘 카트는 반드시 목표에 있다. 작은 오차도 오래 남으면 크게 쌓이므로
        오차가 클 때만 힘을 내는 것이 아니고, 속도에 맞서는 것은 D 항이다.
    - question: |
        기울어진 레일에서 PID 제어로 카트가 정확히 목표에 멈춰 있다. 지금 레일이 당기는 힘을 버티고 있는 항은?
      choices:
        - '오차가 0 이므로 controller 는 힘을 내지 않는다'
        - 'P 항'
        - 'D 항'
        - '지금까지 쌓아 둔 누적값으로 힘을 내는 I 항'
      answer: 3
      explanation: |
        목표에 있으니 오차가 0 이라 P 항은 0 이고, 멈춰 있으니 속도가 0 이라 D 항도 0 이다. 그런데도 카트가 미끄러지지 않는 것은 I 항이
        오차가 남아 있던 동안 쌓아 둔 값으로 당기는 힘만큼을 계속 내기 때문이다. "오차가 0 이면 힘도 0" 은 P 와 D 만 쓸 때의 이야기다.
    - question: |
        motor 의 힘이 한계에 걸려 있는 동안에도 I 항의 누적값을 계속 쌓으면 어떤 일이 생기는가?
      choices:
        - '쌓인 값이 나중에 목표를 지나친 뒤에도 앞으로 밀어 크게 넘치고 오래 흔들린다. 그래서 한계에 걸린 동안에는 쌓기를 멈춘다'
        - '쌓인 값은 힘이 한계에 걸려 있어 아무 영향도 주지 않는다'
        - '목표에 더 빨리 정확히 멈춘다'
        - 'D 항이 자동으로 커져 문제를 막는다'
      answer: 0
      explanation: |
        힘이 한계에 묶여 있는 동안에는 쌓인 값이 그 순간 아무 일도 하지 않지만, 누적값 자체는 계속 커진다. 목표에 닿을 때쯤 이 값이
        너무 커져 있어 목표를 지나친 뒤에도 앞으로 밀고, 다 빠질 때까지 크게 오간다. 이것이 integral windup 이고, 한계에 걸린 동안
        쌓기를 멈추는 anti-windup 으로 막는다. D 항은 누적값을 줄여 주지 않는다.

- topic: feedforward
  title: feedforward
  variants:
    - question: |
        feedforward 와 feedback 의 차이로 맞는 것은?
      choices:
        - 'feedforward 는 측정한 결과를 보고 고치고, feedback 은 미리 계산한다'
        - '둘은 이름만 다르고 같은 계산이다'
        - 'feedforward 는 model 로 필요한 힘을 결과를 보기 전에 미리 더하고, feedback 은 측정한 오차를 보고 뒤늦게 고친다'
        - 'feedforward 를 쓰면 feedback 은 필요 없다'
      answer: 2
      explanation: |
        feedforward 는 "레일이 2 N 으로 당긴다" 같은 model 로 필요한 힘을 계산해 오차가 생기기 전에 넣는다. feedback 은 움직인 결과를
        다시 재서 남은 오차를 고친다. feedforward 가 결과를 보고 고친다는 설명은 두 역할을 거꾸로 적은 것이다. model 은 늘 조금씩 틀리므로 feedforward 만으로는 오차가 남고,
        그 남은 만큼을 feedback 이 고친다.
    - question: |
        기울어진 레일이 실제로는 model 보다 조금 더 세게 당긴다. model 의 값으로 feedforward 를 넣고 PD 제어를 쓰면 결과는?
      choices:
        - 'feedforward 덕분에 정확히 목표에 멈춘다'
        - 'model 이 모자란 만큼을 P 항이 버텨야 해서 목표보다 조금 아래에 멈추고, I 항을 더하면 그 남은 오차도 지운다'
        - 'feedforward 가 틀렸으므로 PD 만 쓸 때보다 오차가 더 커진다'
        - '카트가 목표보다 위로 넘어가 멈춘다'
      answer: 1
      explanation: |
        feedforward 가 당기는 힘의 대부분을 지우므로 남는 것은 model 이 모자란 몫뿐이고, 그만큼을 P 항이 버티려고 작은 오차가 남는다.
        PD 만 쓸 때보다 오차는 훨씬 작다. 남은 오차는 I 항이 쌓아 지우므로, feedforward 가 큰 몫을 미리 내고 feedback 이 model 이 틀린
        만큼만 고치는 분업이 된다. 당기는 힘이 model 보다 크므로 위로 넘어가지는 않는다.
    - question: |
        천장 축에 매단 pendulum 팔을 여러 목표 각도에 붙잡아 두려고 gravity feedforward $m g l \sin\theta_{\text{목표}}$ 를 넣는다. 이 값이
        가장 큰 목표 자세는?
      choices:
        - '팔이 아래로 늘어진 자세'
        - '팔이 똑바로 위로 선 자세'
        - '목표 각도와 상관없이 늘 같다'
        - '팔을 수평으로 든 자세'
      answer: 3
      explanation: |
        gravity torque 는 추의 무게에 축과 추 사이의 수평 거리를 곱한 값이라, 수평 거리가 팔 길이 전부가 되는 수평 자세에서 가장 크다.
        아래로 늘어지거나 위로 선 자세에서는 추가 축의 바로 아래나 위에 있어 수평 거리가 0 이고 torque 도 0 이다. 그래서 기울어진 레일의
        일정한 힘과 달리 회전 joint 의 feedforward 는 목표 각도마다 다르고, 로봇 팔을 앞으로 뻗을수록 어깨 motor 가 더 큰 torque 를 낸다.

- topic: min-jerk
  title: minimum-jerk trajectory
  variants:
    - question: |
        목표를 한순간에 0 에서 멀리 떨어진 값으로 바꾸는 계단 목표의 문제로 맞는 것은?
      choices:
        - '첫 순간 오차가 갑자기 커져 P 항이 한꺼번에 큰 힘을 내므로, motor 의 힘 한계에 걸리거나 충격이 생긴다'
        - '계단 목표에서는 오차가 생기지 않는다'
        - '목표가 멀수록 P 항이 작아진다'
        - '계단 목표는 feedforward 와 함께 쓸 수 없다'
      answer: 0
      explanation: |
        목표가 한 번에 뛰면 첫 step 의 오차가 크고, P 항은 오차에 비례하므로 큰 힘을 한꺼번에 낸다. 힘이 한계에 걸리면 integral windup
        같은 문제로 이어지고, 기계에도 충격을 준다. 시간에 따라 조금씩 움직이는 목표 경로, 곧 trajectory 를 주면 오차가 처음부터 작게
        유지되어 힘이 튀지 않는다.
    - question: |
        0° 에서 90° 로 갈 때 처음부터 끝까지 일정한 속도로 가는 목표 대신 minimum-jerk trajectory 를 쓰는 이유로 맞는 것은?
      choices:
        - '일정한 속도 목표는 도착 시간이 더 오래 걸리기 때문이다'
        - '일정한 속도 목표는 출발과 도착 순간에 속도가 한 번에 바뀌어 끝없이 큰 가속도와 torque 를 요구하지만, minimum-jerk 은 출발과 도착에서 속도와 가속도가 0 이기 때문이다'
        - 'minimum-jerk trajectory 는 가장 빠른 순간의 속도도 일정한 속도보다 낮기 때문이다'
        - 'minimum-jerk trajectory 를 쓰면 feedback 이 필요 없기 때문이다'
      answer: 1
      explanation: |
        일정한 속도로 가려면 출발 순간 0 에서 그 속도로 한 번에 바뀌어야 하는데, 0 초 동안 속도를 바꾸려면 가속도가 끝없이 커야 한다.
        minimum-jerk 은 가속도가 변하는 빠르기인 jerk 를 작게 만들어 출발과 도착이 부드럽다. 대신 가운데에서는 평균 속도보다 빠르게
        움직여, 가장 빠른 순간의 속도는 오히려 일정한 속도보다 높다. 같은 시간에 도착하도록 만들 수 있고, 따라가는 데는 여전히 feedback 이
        필요하다.
    - question: |
        minimum-jerk trajectory 를 따라 움직일 때 속도가 가장 빠른 때는?
      choices:
        - '출발하는 순간'
        - '도착하는 순간'
        - '이동 시간의 한가운데'
        - '처음부터 끝까지 같다'
      answer: 2
      explanation: |
        minimum-jerk trajectory 는 출발과 도착에서 속도가 0 이고 그 사이에서 종 모양으로 올랐다가 내려온다. 그래서 천천히 출발해 이동
        시간의 한가운데에서 가장 빠르고 끝에서 다시 천천히 멈춘다. 출발이나 도착에서 가장 빠르다면 바로 그 순간에 속도가 크게 바뀌어야
        하므로 이 trajectory 가 피하려는 상황이 된다.

- topic: low-level-control
  title: policy 아래의 저수준 controller
  variants:
    - question: |
        학습한 policy 로 움직이는 로봇 팔에서 motor 에 들어가는 전류를 실제로 정하는 것은 대개 무엇인가?
      choices:
        - 'policy 가 매 순간 직접 계산한 전류'
        - 'policy 가 낸 joint 목표 각도를 따라가도록 훨씬 빠른 주기로 도는 PID 같은 저수준 controller'
        - '카메라가 측정한 영상'
        - 'URDF 파일에 적힌 값'
      answer: 1
      explanation: |
        policy 는 보통 10~50 Hz 로 joint 마다의 다음 목표 각도를 낼 뿐이고, 그 목표를 따라가게 motor torque 를 계산하는 것은 수백~수천
        Hz 로 도는 저수준 controller 다. "policy 가 motor 를 직접 움직인다" 는 흔한 오해다. 영상은 policy 의 입력이고, URDF 는 로봇의
        모양을 적은 파일이라 전류를 정하지 않는다.
    - question: |
        같은 PD gain 을 쓰면서 controller 의 계산 주기만 크게 느리게 했다. 어떤 일이 생길 수 있는가?
      choices:
        - '계산이 느려질 뿐 움직임은 똑같다'
        - '진동이 더 빨리 가라앉는다'
        - 'steady-state error 가 사라진다'
        - '한 번 정한 힘이 오래 유지되어 강한 D 항이 속도를 지나치게 빼며 값이 점점 커지는 발산이 생길 수 있다'
      answer: 3
      explanation: |
        controller 는 한 번 정한 힘을 다음 계산까지 그대로 유지하므로, 주기가 길면 D 항이 한 step 동안 속도를 너무 많이 빼서 오히려
        반대로 뒤집어 버린다. 이것이 되풀이되면 값이 점점 커져 발산한다. 그래서 무거운 팔을 단단히 붙잡는 큰 gain 을 쓰려면 저수준
        loop 를 빠르게 돌려야 한다. 주기를 늦춘다고 진동이 줄거나 steady-state error 가 사라지지는 않는다.
    - question: |
        policy 가 30 Hz 로 낸 목표 각도는 약 33 ms 마다 계단처럼 바뀐다. 그 아래의 저수준 controller 가 맡는 일로 맞는 것은?
      choices:
        - '목표 사이를 부드럽게 이어 따라가고, gravity 를 버티고 마찰을 이기고 진동을 줄이는 일을 맡아 policy 가 motor 의 세부 물리까지 배울 필요를 줄인다'
        - '어떤 물체를 집을지 판단한다'
        - '33 ms 동안 아무 일도 하지 않고 다음 목표를 기다린다'
        - 'policy 의 parameter 를 학습시킨다'
      answer: 0
      explanation: |
        policy 는 "어디로 갈지" 를 정하고, 저수준 controller 는 그 목표를 실제 움직임으로 만드는 일을 맡는다. 다음 목표까지 기다리는
        동안에도 gravity·마찰·접촉 힘은 ms 단위로 변하므로 쉬지 않고 계산해야 하며, 계단 같은 목표 사이를 trajectory 처럼 부드럽게 잇기도
        한다. 무엇을 집을지 판단하거나 policy 를 학습시키는 것은 저수준 controller 의 일이 아니다.
