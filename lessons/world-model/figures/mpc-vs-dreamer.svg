<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽 MPC 는 실제 step 마다 후보 행동열 수만 개를 world model 로 rollout 해서 고른다. 오른쪽 Dreamer 는 학습 때 world model 안에서 상상한 episode 로 actor 를 미리 학습해 두고, 실제 step 에서는 actor 를 한 번 계산한다</title>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="320.0" y1="16.0" x2="320.0" y2="304.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="160.0" y="34.0" fill="#f59e0b" font-size="15" text-anchor="middle">MPC + CEM</text>
  <text x="480.0" y="34.0" fill="#a78bfa" font-size="15" text-anchor="middle">Dreamer</text>
  <text x="160.0" y="60.0" fill="#94a3b8" font-size="12" text-anchor="middle">실제 step 마다</text>
  <rect x="40.0" y="72.0" width="240.0" height="30.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="160.0" y="92.0" fill="#e2e8f0" font-size="13" text-anchor="middle">그림 oₜ → encoder → zₜ</text>
  <line x1="160.0" y1="102.0" x2="160.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="40.0" y="124.0" width="240.0" height="90.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="160.0" y="148.0" fill="#f59e0b" font-size="13" text-anchor="middle">후보 1000 × 반복 10</text>
  <text x="160.0" y="168.0" fill="#f59e0b" font-size="13" text-anchor="middle">× H 12 step rollout</text>
  <text x="160.0" y="196.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="700">= latent 예측 120,000 번</text>
  <line x1="160.0" y1="214.0" x2="160.0" y2="232.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="90.0" y="236.0" width="140.0" height="30.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="160.0" y="256.0" fill="#34d399" font-size="13" text-anchor="middle">첫 action 실행</text>
  <text x="480.0" y="60.0" fill="#94a3b8" font-size="12" text-anchor="middle">학습 때 (한 번)</text>
  <rect x="350.0" y="72.0" width="260.0" height="58.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480.0" y="96.0" fill="#a78bfa" font-size="13" text-anchor="middle">world model 안의 상상 속 episode 로</text>
  <text x="480.0" y="116.0" fill="#a78bfa" font-size="13" text-anchor="middle">actor-critic 학습</text>
  <text x="480.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="middle">실제 step 마다</text>
  <rect x="350.0" y="170.0" width="260.0" height="30.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480.0" y="190.0" fill="#e2e8f0" font-size="13" text-anchor="middle">그림 oₜ → encoder → zₜ</text>
  <line x1="480.0" y1="200.0" x2="480.0" y2="218.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="400.0" y="222.0" width="160.0" height="30.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="480.0" y="242.0" fill="#a78bfa" font-size="13" text-anchor="middle" font-weight="700">actor 1 번 계산</text>
  <line x1="480.0" y1="252.0" x2="480.0" y2="270.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="410.0" y="274.0" width="140.0" height="28.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="480.0" y="293.0" fill="#34d399" font-size="13" text-anchor="middle">action 실행</text>
</svg>
