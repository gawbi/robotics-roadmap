<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>dynamics model 의 계산 흐름. z_t = 1 과 a_t = +1 이 들어가 w × a_t = 1 을 더해 다음 latent 예측 2 가 되고, reward model 이 그 latent 에서 reward 예측 −2 를 낸다</title>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="228" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="52.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="59.0" y="77.0" fill="#e2e8f0" font-size="14" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">t</tspan> = 1</text>
  <rect x="24.0" y="132.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="59.0" y="157.0" fill="#d6aa62" font-size="14" text-anchor="middle">a<tspan baseline-shift="sub" font-size="11">t</tspan> = +1</text>
  <line x1="94.0" y1="72.0" x2="150.0" y2="100.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="94.0" y1="152.0" x2="150.0" y2="124.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="154.0" y="76.0" width="150.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="229.0" y="100.0" fill="#7fc4a2" font-size="14" text-anchor="middle">dynamics f</text>
  <text x="229.0" y="120.0" fill="#e2e8f0" font-size="13" text-anchor="middle">z<tspan baseline-shift="sub" font-size="11">t</tspan> + w × a<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text x="229.0" y="139.0" fill="#94a3b8" font-size="13" text-anchor="middle">1 + 1 × 1</text>
  <line x1="304.0" y1="112.0" x2="344.0" y2="112.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="348.0" y="92.0" width="78.0" height="40.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="387.0" y="117.0" fill="#e2e8f0" font-size="14" text-anchor="middle">ẑ<tspan baseline-shift="sub" font-size="11">t+1</tspan> = 2</text>
  <line x1="426.0" y1="112.0" x2="458.0" y2="112.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="462.0" y="76.0" width="150.0" height="72.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="537.0" y="100.0" fill="#d6aa62" font-size="14" text-anchor="middle">reward model g</text>
  <text x="537.0" y="120.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−|ẑ<tspan baseline-shift="sub" font-size="11">t+1</tspan> − 4|</text>
  <text x="537.0" y="139.0" fill="#94a3b8" font-size="13" text-anchor="middle">−|2 − 4|</text>
  <line x1="537.0" y1="148.0" x2="537.0" y2="174.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="492.0" y="176.0" width="90.0" height="36.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="537.0" y="199.0" fill="#d6aa62" font-size="14" text-anchor="middle">r̂<tspan baseline-shift="sub" font-size="11">t+1</tspan> = −2</text>
  <text x="229.0" y="190.0" fill="#94a3b8" font-size="13" text-anchor="middle">w = 1 (데이터로 배운 weight)</text>
</svg>
