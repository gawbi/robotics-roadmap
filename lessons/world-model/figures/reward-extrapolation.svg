<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>칸 0~3 의 데이터(점)에 맞춘 reward model 직선 r = z − 4 를 칸 7 까지 이으면 계속 올라가지만, 실제 reward(초록)는 칸 4 에서 가장 크고 다시 내려간다. 칸 6 에서 예측은 +2, 실제는 −2 다</title>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="40.0" width="420.0" height="240.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="280.0" x2="490.0" y2="280.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="40.0" x2="70.0" y2="280.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">0</text>
  <text x="130.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="190.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">2</text>
  <text x="250.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">3</text>
  <text x="310.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">4</text>
  <text x="370.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">5</text>
  <text x="430.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">6</text>
  <text x="490.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">7</text>
  <text x="62.0" y="284.0" fill="#64748b" font-size="13" text-anchor="end">−4</text>
  <text x="62.0" y="249.7" fill="#64748b" font-size="13" text-anchor="end">−3</text>
  <text x="62.0" y="215.4" fill="#64748b" font-size="13" text-anchor="end">−2</text>
  <text x="62.0" y="181.1" fill="#64748b" font-size="13" text-anchor="end">−1</text>
  <text x="62.0" y="146.9" fill="#64748b" font-size="13" text-anchor="end">0</text>
  <text x="62.0" y="112.6" fill="#64748b" font-size="13" text-anchor="end">1</text>
  <text x="62.0" y="78.3" fill="#64748b" font-size="13" text-anchor="end">2</text>
  <text x="62.0" y="44.0" fill="#64748b" font-size="13" text-anchor="end">3</text>
  <rect x="70.0" y="40.0" width="180.0" height="240.0" rx="0" fill="#13233a" stroke="none" stroke-width="0"/>
  <text x="160.0" y="58.0" fill="#94a3b8" font-size="12" text-anchor="middle">데이터가 있는 칸</text>
  <line x1="70.0" y1="142.9" x2="490.0" y2="142.9" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="500.0" y="285.0" fill="#94a3b8" font-size="14" text-anchor="start">칸 z</text>
  <text x="62.0" y="26.0" fill="#94a3b8" font-size="14" text-anchor="end">reward</text>
  <polyline points="70.0,280.0 130.0,245.7 190.0,211.4 250.0,177.1 310.0,142.9 370.0,177.1 430.0,211.4 490.0,245.7" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <line x1="70.0" y1="280.0" x2="250.0" y2="177.1" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="250.0" y1="177.1" x2="490.0" y2="40.0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="70.0" cy="280.0" r="5.5" fill="#f59e0b"/>
  <circle cx="130.0" cy="245.7" r="5.5" fill="#f59e0b"/>
  <circle cx="190.0" cy="211.4" r="5.5" fill="#f59e0b"/>
  <circle cx="250.0" cy="177.1" r="5.5" fill="#f59e0b"/>
  <line x1="430.0" y1="74.3" x2="430.0" y2="211.4" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="430.0" cy="74.3" r="5" fill="#38bdf8"/>
  <circle cx="430.0" cy="211.4" r="5" fill="#34d399"/>
  <text x="420.0" y="66.3" fill="#38bdf8" font-size="13" text-anchor="end">예측 +2</text>
  <text x="420.0" y="231.4" fill="#34d399" font-size="13" text-anchor="end">실제 −2</text>
  <text x="498.0" y="44.0" fill="#38bdf8" font-size="13" text-anchor="start">r̂ = z − 4</text>
  <text x="300.0" y="330.0" fill="#94a3b8" font-size="12" text-anchor="middle">주황: 무작위 데이터 · 파랑: 맞춘 직선(점선은 데이터 밖) · 초록: 실제 reward −|z − 4|</text>
</svg>
