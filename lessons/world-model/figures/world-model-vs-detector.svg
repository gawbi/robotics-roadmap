<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 world model 로, 지금 이미지(로봇이 칸 1)과 행동 오른쪽으로 한 칸을 받아 다음 이미지(로봇이 칸 2)을 예측한다. 아래는 YOLO-World 같은 물체 인식 모델로, 이미지과 단어 컵을 받아 지금 이미지 속 컵의 위치에 상자를 친다</title>
