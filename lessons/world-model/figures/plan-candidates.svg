<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>step 0 부터 3 까지 네 후보의 예측 위치. A 는 2, 3, 4 로 충전기에 닿아 합 −3, B 는 3 에서 멈춰 −4, C 는 2 에 머물러 −6, D 는 1 에 머물러 −9 다. 가장 큰 합 −3 의 A 를 고른다</title>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="40.0" width="380.0" height="240.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="280.0" x2="450.0" y2="280.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="40.0" x2="70.0" y2="280.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">0</text>
  <text x="196.7" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="323.3" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">2</text>
  <text x="450.0" y="298.0" fill="#64748b" font-size="13" text-anchor="middle">3</text>
  <text x="62.0" y="284.0" fill="#64748b" font-size="13" text-anchor="end">0</text>
  <text x="62.0" y="236.0" fill="#64748b" font-size="13" text-anchor="end">1</text>
  <text x="62.0" y="188.0" fill="#64748b" font-size="13" text-anchor="end">2</text>
  <text x="62.0" y="140.0" fill="#64748b" font-size="13" text-anchor="end">3</text>
  <text x="62.0" y="92.0" fill="#64748b" font-size="13" text-anchor="end">4</text>
  <text x="62.0" y="44.0" fill="#64748b" font-size="13" text-anchor="end">5</text>
  <text x="460.0" y="285.0" fill="#94a3b8" font-size="14" text-anchor="start">step</text>
  <text x="62.0" y="26.0" fill="#94a3b8" font-size="14" text-anchor="end">예측 칸</text>
