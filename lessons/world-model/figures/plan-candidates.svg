  <circle cx="450.0" cy="184.0" r="4.5" fill="#a99ad6"/>
  <text x="462.0" y="189.0" fill="#a99ad6" font-size="13" text-anchor="start">C (+1,0,0) 합 −6</text>
  <polyline points="70.0,232.0 196.7,184.0 323.3,136.0 450.0,136.0" fill="none" stroke="#7cb4d8" stroke-width="2.5"/>
  <circle cx="70.0" cy="232.0" r="4.5" fill="#7cb4d8"/>
  <circle cx="196.7" cy="184.0" r="4.5" fill="#7cb4d8"/>
  <circle cx="323.3" cy="136.0" r="4.5" fill="#7cb4d8"/>
  <circle cx="450.0" cy="136.0" r="4.5" fill="#7cb4d8"/>
  <text x="462.0" y="141.0" fill="#7cb4d8" font-size="13" text-anchor="start">B (+1,+1,0) 합 −4</text>
  <polyline points="70.0,232.0 196.7,184.0 323.3,136.0 450.0,88.0" fill="none" stroke="#d6aa62" stroke-width="4"/>
  <circle cx="70.0" cy="232.0" r="4.5" fill="#d6aa62"/>
  <circle cx="196.7" cy="184.0" r="4.5" fill="#d6aa62"/>
  <circle cx="323.3" cy="136.0" r="4.5" fill="#d6aa62"/>
  <circle cx="450.0" cy="88.0" r="4.5" fill="#d6aa62"/>
  <text x="462.0" y="93.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="700">A (+1,+1,+1) 합 −3</text>
  <text x="300.0" y="326.0" fill="#94a3b8" font-size="13" text-anchor="middle">세 step 을 world model 로 예측해 reward 합을 비교한다. 합이 가장 큰 A 를 고른다</text>
</svg>
