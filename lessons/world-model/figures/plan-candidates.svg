  <text x="76.0" y="80.0" fill="#7fc4a2" font-size="12" text-anchor="start">충전기 (칸 4)</text>
  <polyline points="70.0,232.0 196.7,232.0 323.3,232.0 450.0,232.0" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="70.0" cy="232.0" r="4.5" fill="#94a3b8"/>
  <circle cx="196.7" cy="232.0" r="4.5" fill="#94a3b8"/>
  <circle cx="323.3" cy="232.0" r="4.5" fill="#94a3b8"/>
  <circle cx="450.0" cy="232.0" r="4.5" fill="#94a3b8"/>
  <text x="462.0" y="237.0" fill="#94a3b8" font-size="13" text-anchor="start">D (0,0,0) 합 −9</text>
