# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: world-model-definition
  title: world model 의 입력과 출력
  section: world-model-의-입력과-출력
  variants:
    - question: |
        로봇 학습에서 말하는 world model 은 무엇을 입력으로 받아 무엇을 예측하는 모델인가?
      choices:
        - '지금 상태와 행동을 받아, 그 행동 뒤의 다음 상태와 대개 reward 까지 예측한다'
        - '카메라 이미지와 물체 이름을 받아, 그 물체가 지금 이미지 어디에 있는지 예측한다'
        - '지금 상태를 받아, 미래를 내다보고 그 상태에서 해야 할 가장 좋은 행동을 예측한다'
        - '지금 상태를 받아, 그 상태에서 앞으로 받을 reward 합을 예측해 미래가 얼마나 좋은지 알려 준다'
      answer: 0
      explanation: |
        world model 의 입력에는 언제나 행동이 들어가고 출력은 그 행동 뒤의 미래(다음 상태와 reward)라서, 같은 장면에 다른 행동을 넣으면 다른 미래가
        나온다. 이미지와 물체 이름으로 지금 이미지 속 위치를 내는 것은 YOLO-World 같은 object detection 모델이라 행동도 미래도 없다. 상태를 받아 행동을
        내는 것은 policy 이고, world model 은 행동을 고르지 않고 행동의 결과를 예측한다. 앞으로의 reward 합만 내는 것은 value(critic)이고 다음 상태를
        예측하지 않는다.
    - question: |
        물리 simulator 도 상태와 행동을 받아 다음 상태를 계산한다. 학습한 world model 과 무엇이 다른가?
      choices:
        - 'simulator 는 로봇의 행동을 입력으로 받지 않고, 시간만 흘려 물체가 떨어지거나 구르는 다음 상태를 낸다'
        - 'world model 은 다음 상태가 아니라 지금 상태를 더 정확히 추정하는 모델이라, 센서 noise 를 걸러 내는 데 쓴다'
        - '입출력은 같지만, simulator 는 사람이 물리 식을 넣어 만들고 world model 은 데이터로 그 관계를 배운다'
        - '둘은 같은 것을 부르는 두 이름이다. 분야에 따라 simulator 라고도 하고 world model 이라고도 한다'
      answer: 2
      explanation: |
        둘 다 "상태 + 행동 → 다음 상태" 를 계산하지만, simulator 는 사람이 물리 법칙을 식으로 적어 만들고 world model 은 로봇이 겪은 transition 을
        맞히도록 학습한다. simulator 도 로봇의 행동(토크·명령)을 입력으로 받는다. 지금 상태를 정확히 추정하는 것은 Kalman filter 같은 state
        estimation 의 일이고 world model 은 다음 상태를 예측한다. 만드는 방법이 달라서 오차의 성격도 달라지므로 같은 것이 아니다.
    - question: |
        다음 중 world model 이라고 부를 수 있는 것은 무엇인가?
      choices:
        - '방 사진 한 장을 받아 사진 속 사람 수와 각자의 위치를 세어 주는 모델'
        - '카메라 영상과 글 지시를 받아 로봇 관절 목표를 내는 VLA policy'
        - '로봇과 물체의 위치를 적을 때 기준으로 삼는, 방에 고정한 좌표계인 world frame'
        - '팔 사진과 "1 cm 위로" 라는 명령을 받아 0.1 초 뒤의 사진을 그리는 모델'
      answer: 3
      explanation: |
        사진과 명령(행동)을 받아 그 결과인 미래의 사진을 예측하므로 world model 이다. 사람 수를 세는 모델은 행동을 받지 않고 지금 사진에 대해서만
        답한다. VLA policy 는 행동을 내는 쪽이지 행동의 결과를 예측하지 않는다. world frame 은 좌표계의 이름이고 무엇을 예측하는 모델이 아니다.

- topic: model-based
  title: model-free 와 model-based
  section: model-free-와-model-based
  variants:
    - question: |
        model-based RL 이 model-free RL 보다 실제 환경 데이터를 적게 쓰는 이유는 무엇인가?
      choices:
        - 'world model 이 neural network 대신 단순한 식이라, 학습할 parameter 가 적어 데이터도 적게 들기 때문이다'
        - '후보 비교를 world model 안에서 하고, 어떤 policy 로 모은 transition 이든 계속 다시 쓰기 때문이다'
        - 'reward 를 world model 이 대신 만들어 주므로, 실제 환경에서 reward 를 모을 필요가 없기 때문이다'
        - '실제 환경과 한 번도 상호작용하지 않고 처음부터 상상 속 rollout 만으로 학습하기 때문이다'
      answer: 1
      explanation: |
        model-based RL 은 후보를 실제로 해 보는 대신 world model 로 결과를 예측해 비교하고, world model 은 환경의 규칙을 배우므로 예전 policy 로
        모은 데이터도 버리지 않는다. world model 과 policy 는 대개 둘 다 neural network 이므로 parameter 수 때문에 생기는 차이가 아니다. reward model 을 배우려면
        실제 reward 기록이 필요하다. world model 자체를 실제 transition 으로 배워야 하므로 실제 상호작용이 없을 수는 없다.
    - question: |
        model-free RL 이라는 이름의 model 은 무엇을 가리키는가?
      choices:
        - '학습하는 neural network 를 가리킨다. model-free 는 network 없이 표로 값을 적어 배운다는 뜻이다'
        - '학습에 쓰는 GPU 같은 계산 장치를 가리키며, model-free 는 CPU 만으로 학습한다는 뜻이다'
        - '학습이 끝난 뒤 저장한 checkpoint 를 가리키며, model-free 는 저장 없이 매번 새로 학습한다는 뜻이다'
        - '환경의 transition 과 reward 를 예측하는 world model 을 가리킨다'
      answer: 3
      explanation: |
        model-free 는 환경이 어떻게 변하는지 예측하는 model 없이 실제로 해 보고 받은 reward 로만 배운다는 뜻이다. model-free 방법에도 policy network 나
        critic 같은 neural network 는 있으므로 neural network 를 가리키는 말이 아니다. 계산 장치는 model 이라는 이름과 관계없다. checkpoint 는 학습한
        weight 를 저장한 파일일 뿐이고, model-free 와 model-based 를 가르는 기준이 아니다.
    - question: |
        REINFORCE 는 policy 를 고치면 예전 sample 을 버리는데, world model 학습은 예전 policy 로 모은 transition 도 계속 쓴다. 이것이 가능한 이유는 무엇인가?
      choices:
        - 'world model 은 환경의 규칙을 배우므로, 누가 행동을 골랐든 transition 이 맞는 정답이다'
        - 'world model 은 최신 policy 의 행동 확률을 함께 예측하므로 예전 데이터를 보정할 수 있다'
        - '예전 transition 은 reward 가 0 으로 바뀌어 저장되므로 학습에 영향을 주지 않는다'
        - 'world model 은 dataset 의 마지막 episode 만 쓰기 때문에 예전 데이터가 쌓여도 상관없다'
      answer: 0
      explanation: |
        transition (상태, 행동, 다음 상태, reward) 은 환경이 그 행동에 어떻게 반응했는지의 기록이라, 행동을 고른 policy 가 바뀌어도 여전히 맞는 학습
        정답이다. world model 은 policy 의 행동 확률을 예측하지 않는다. 예전 transition 의 reward 를 바꿔 저장하지 않으며, 바꾸면 틀린 데이터가 된다.
        world model 은 dataset 전체에서 골고루 뽑아 배우고 마지막 episode 만 쓰지 않는다.

- topic: latent-rssm
  title: latent 와 RSSM
  section: latent-와-encoder
  variants:
    - question: |
        카메라 이미지를 쓰는 world model 이 pixel 을 직접 예측하지 않고 encoder 로 만든 latent 위에서 예측하는 이유는 무엇인가?
      choices:
        - 'pixel 은 0 ~ 255 의 정수라서, 실수를 내는 neural network 로는 예측할 수 없기 때문이다'
        - 'latent 에는 reward 정보가 이미 들어 있어서, reward 를 따로 예측할 필요가 없어지기 때문이다'
        - '이미지 숫자 대부분은 배경이고 예측을 아주 많이 하므로, 작은 latent 가 정보도 추리고 계산도 가볍다'
        - 'latent 에서 예측하면 예측을 다시 입력으로 넣어도 compounding error 가 생기지 않기 때문이다'
      answer: 2
      explanation: |
        64×64 컬러 이미지 한 장은 숫자가 만 개를 넘지만 로봇에 필요한 정보는 그보다 훨씬 적고, planner 는 실제 step 하나에 예측을 아주 많이 하므로 작은
        latent 가 유리하다. pixel 도 숫자라서 neural network 가 예측할 수 있고, 계산이 많을 뿐이다. latent world model 도 reward model 을 함께 배운다.
        latent 에서 예측해도 예측을 다시 입력으로 넣으면 오차가 쌓인다.
    - question: |
        진자를 카메라로 보는 world model 의 encoder 에 지금 이미지 한 장만 넣으면 어떤 정보가 빠지는가?
      choices:
        - '진자가 도는 빠르기와 방향(각속도)이 빠져서, 지난 이미지의 요약이나 여러 장이 필요하다'
        - 'encoder 가 색을 버리므로 진자의 색이 빠져서 흑백 이미지와 같아진다'
        - '진자의 각도가 빠진다. 한 장으로는 진자가 어디를 가리키는지 알 수 없다'
        - '빠지는 정보는 없다. 이미지 한 장에 다음 상태를 예측하는 데 필요한 모든 것이 들어 있다'
      answer: 0
      explanation: |
        정지한 이미지 한 장은 위치(각도)는 보여 주지만 움직이는 빠르기와 방향은 보여 주지 않아서, 같은 이미지라도 다음 장면이 달라질 수 있다. 그래서
        RNN 으로 지난 이미지를 요약하거나 최근 이미지 몇 장을 함께 넣는다. 컬러 이미지를 넣으면 색은 그대로 남는다. 각도는 이미지 한 장에 보이는 정보다.
        속도가 중요한 환경에서는 이미지 한 장으로 다음 상태가 하나로 정해지지 않는다.
    - question: |
        PlaNet 과 Dreamer 의 RSSM 은 latent 를 확정된 부분과 무작위 부분으로 나눈다. 각 부분은 무엇을 맡는가?
      choices:
        - '확정된 부분은 늘 같은 값이 나오는 reward 를 맡고, 무작위 부분은 다음 이미지의 pixel 을 맡는다'
        - '확정된 부분은 RNN 으로 지난 관측을 요약해 속도 같은 정보를 담고, 무작위 부분은 여러 가능한 미래를 담는다'
        - '확정된 부분은 정답이 있는 학습 때만 쓰고, 무작위 부분은 미래를 상상하는 실행 때만 쓴다'
        - '두 부분은 같은 latent 를 두 번 저장한 것으로, 둘을 비교해 예측 오류를 검사하는 용도다'
      answer: 1
      explanation: |
        RSSM 의 확정된 부분은 RNN 이 지난 관측을 차례로 요약해 기억하는 값이라 이미지 한 장에 없는 정보를 담고, 무작위 부분은 분포에서 뽑아 여러 가능한
        미래를 나타낸다. PlaNet 저자들은 둘을 함께 써야 planning 성능이 높았다고 보고했다. reward 는 RSSM 의 latent 를 받는 reward model 이 예측하고 이미지는
        decoder 가 되살린다. 두 부분은 학습 때와 실행 때 모두 쓴다. 서로 다른 정보를 담으므로 같은 값을 두 번 저장하는 것이 아니다.

- topic: cem-planning
  title: 상상 속 planning 과 CEM
  section: 상상-속-planning
  variants:
    - question: |
        world model 로 계획할 때 CEM(cross-entropy method)이 반복마다 고치는 것은 무엇인가?
      choices:
        - 'world model 의 weight 를 gradient descent 로 고쳐 예측을 더 정확하게 만든다'
        - '점수가 낮게 나온 후보도 고를 수 있도록 reward 함수의 모양을 고쳐 목표를 바꾼다'
        - 'planning horizon 을 반복마다 한 step 씩 늘려 더 먼 미래까지 내다본다'
        - '후보를 뽑는 분포의 평균과 표준편차를 점수 상위 후보(elite)의 값으로 바꾼다'
      answer: 3
      explanation: |
        CEM 은 분포에서 후보를 뽑아 world model 로 점수를 매기고, 점수 상위 elite 의 평균과 표준편차로 분포를 다시 맞추기를 되풀이한다. world model 의
        weight 는 planning 중에 그대로이고, CEM 은 gradient 를 쓰지도 않는다. reward 는 world model 이 예측하는 값이라 CEM 이 바꾸지 않는다. horizon 은
        정해 둔 값이고 반복마다 늘리지 않는다.
    - question: |
        CEM 의 어느 반복에서 점수 상위 후보(elite) 둘이 action 3 과 5 였다. 다음 반복에서 후보를 뽑을 정규분포로 알맞은 것은?
      choices:
        - '평균 3, 표준편차 2. 점수가 더 좋은 elite 를 평균으로 쓴다'
        - '평균 4, 표준편차 1. 두 값이 평균 4 에서 1 씩 떨어져 있다'
        - '평균 4, 표준편차 2. 두 elite 사이의 거리를 표준편차로 쓴다'
        - '평균 8, 표준편차 1. elite 를 더한 값을 평균으로 쓴다'
      answer: 1
      explanation: |
        새 평균은 $(3 + 5) \div 2 = 4$ 이고, 두 값이 4 에서 $\pm 1$ 떨어져 분산이 $(1 + 1) \div 2 = 1$, 표준편차가 1 이다. 한 elite 만 평균으로 쓰면
        나머지 elite 의 정보를 버린다. 두 값 사이의 거리 2 는 표준편차의 두 배다. elite 를 더한 값은 평균이 아니다.
    - question: |
        world model 이 완벽하게 정확해도, 후보 행동열을 몇 개 만들어 비교하는 planning 이 가장 좋은 행동열을 못 찾을 수 있는 이유는 무엇인가?
      choices:
        - 'argmax 가 예측 reward 합이 가장 작은 후보를 고르기 때문이다'
        - 'world model 이 정확하면 planning 이 필요 없어서, 후보 가운데 아무것이나 골라도 결과가 같기 때문이다'
        - 'planning 은 만든 후보 안에서만 고르므로, 가장 좋은 행동열이 후보에 없으면 못 고르기 때문이다'
        - 'planning 은 첫 step 의 reward 만 보고, horizon 의 나머지 step 은 무시하기 때문이다'
      answer: 2
      explanation: |
        행동이 연속된 숫자이거나 horizon 이 길면 모든 행동열을 넣어 볼 수 없어서, planning 은 만든 후보 가운데 가장 좋은 것을 고를 뿐이다. 그래서 CEM 처럼
        좋은 쪽으로 후보를 옮겨 가며 뽑는 방법이 필요하다. argmax 는 가장 큰 값을 고른다. model 이 정확해도 어떤 행동이 좋은지는 비교해 봐야 안다.
        planning 은 horizon 안의 예측 reward 를 모두 더해 비교한다.

- topic: compounding-error
  title: 예측 오차의 누적과 model exploitation
  section: 예측-오차의-누적
  variants:
    - question: |
        한 step 예측 오차가 작은 world model 도 여러 step 을 rollout 하면 크게 틀어지는 이유는 무엇인가?
      choices:
        - '예측을 다시 입력으로 넣으므로 앞 오차가 고쳐지지 않은 채 새 오차가 더해지기 때문이다'
        - 'rollout 이 길어지면 GPU 의 숫자 정밀도가 떨어져 반올림 오차가 크게 불어나기 때문이다'
        - 'rollout 중에는 실제 카메라 이미지로 매 step 다시 고치기 때문에 오히려 흔들린다'
        - 'reward model 이 step 마다 다른 weight 를 쓰기 때문이다'
      answer: 0
      explanation: |
        open-loop rollout 은 실제 관측 없이 자기 예측 위에 다시 예측을 쌓아서 오차가 step 수만큼 쌓이고, 틀린 입력이 다음 예측을 더 틀리게 만들면 더
        빨리 커진다. 이것이 compounding error 다. 숫자 정밀도는 이런 크기의 오차를 만들지 않는다. 상상 속 rollout 은 실제 이미지로 고치지 않는 것이
        문제이고, 매 step 고치는 것은 MPC 쪽이다. reward model 의 weight 는 step 마다 같다.
    - question: |
        planner 가 world model 의 오차를 이용한다(exploit)는 말은 무슨 뜻인가?
      choices:
        - 'planner 가 world model 의 weight 를 직접 고쳐 원하는 예측이 나오게 만든다는 뜻이다'
        - 'planner 가 world model 의 오차가 큰 상태를 알아보고 일부러 피해 다닌다는 뜻이다'
        - 'world model 의 오차가 클수록 planner 의 계산이 빨라져서, 오차를 이용해 계획 시간을 줄인다는 뜻이다'
        - 'planner 가 model 이 점수를 실제보다 높게 예측하는 곳으로 끌려가 실제로는 나쁜 행동을 고른다는 뜻이다'
      answer: 3
      explanation: |
        planner 는 예측이 맞는지 모른 채 예측 점수만 최대로 만들므로, model 이 틀리게 높게 본 곳이 있으면 바로 그쪽을 고른다. World Models 논문의
        controller 는 가상 환경의 괴물이 불덩이를 쏘지 않는 틈을 이용해 가상 환경에서 만점을 냈지만, 실제 게임에서는 무작위 policy 보다 못했다. planner 는
        world model 의 weight 를 고치지 않는다. 오차가 큰 곳을 피하는 것은 오히려 바라는 동작이고 저절로 일어나지 않는다. 오차의 크기는 계산 속도와
        관계없다.
    - question: |
        TD-MPC2 는 planning horizon 을 3 step 으로 짧게 두고 그 너머를 value 로 대신한다. 이렇게 하는 이유는 무엇인가?
      choices:
        - '3 step 보다 먼 미래의 reward 는 항상 0 이라서, 그 너머를 계산해도 얻을 것이 없기 때문이다'
        - 'rollout 이 길수록 오차가 쌓이고 후보도 늘어서, 짧게 계획하고 먼 미래는 value 로 어림한다'
        - 'value 가 먼 미래를 대신하면 world model 을 학습할 필요가 없어서, 계산을 크게 아끼기 때문이다'
        - 'horizon 이 짧으면 GPU 메모리를 쓰지 않고 CPU 만으로 계획할 수 있기 때문이다'
      answer: 1
      explanation: |
        상상 속 rollout 이 길어지면 compounding error 가 커지고 가능한 행동열의 수도 horizon 에 따라 지수적으로 늘어서, 실제 시스템은 짧게 rollout 하고
        그 너머를 value 로 대신한다. 먼 미래의 reward 도 0 이 아니며, 그래서 value 로 어림한다. TD-MPC2 는 world model 과 value 를 함께 학습한다.
        horizon 이 짧아도 GPU 에서 계산하며, 줄어드는 것은 계산량이다.

- topic: mpc
  title: MPC
  section: mpc
  variants:
    - question: |
        MPC 가 길이 H 의 행동열을 계획하고도 첫 action 하나만 실행하는 이유는 무엇인가?
      choices:
        - '행동열에서 첫 action 이 늘 가장 큰 reward 를 받으므로, 그것만 실행해도 충분하기 때문이다'
        - 'robot controller 가 한 번에 action 하나만 받을 수 있어서 나머지는 버려지기 때문이다'
        - '다음 step 에 실제 관측으로 다시 계획하면, 틀린 예측이 쌓이기 전에 바로잡을 수 있기 때문이다'
        - '나머지 action 은 실행하지 않고 world model 의 학습 데이터로만 쓰려고 남겨 두기 때문이다'
      answer: 2
      explanation: |
        MPC 는 매 step 실제 관측을 다시 보고 처음부터 계획하는 closed-loop 방식이라, 틀린 model 의 예측을 끝까지 믿고 실행하는 open-loop 보다 오차가
        덜 쌓인다. 첫 action 이 늘 가장 큰 reward 를 받는 것은 아니다. controller 가 action 을 하나씩 받는 것과 무관하게, 나머지를 실행하지 않는 것은
        MPC 의 선택이다. 나머지 action 은 학습 데이터가 되지 않고, 실제로 실행한 transition 만 dataset 에 들어간다.
    - question: |
        MPC 를 쓰면 world model 이 틀려도 문제가 사라지는가?
      choices:
        - '아니다. 첫 action 도 틀린 model 로 고르고, MPC 는 틀린 예측이 쌓이는 것만 막는다'
        - '그렇다. 매 step 실제 관측으로 다시 계획하므로 model 의 정확도는 결과에 영향을 주지 않는다'
        - '그렇다. MPC 는 실제 관측과 예측의 차이로 world model 의 weight 를 매 step 고친다'
        - '아니다. MPC 는 첫 step 의 예측만 믿고 나머지를 버리므로, open-loop 보다 오차가 더 커진다'
      answer: 0
      explanation: |
        MPC 는 실제 관측으로 다시 계획해 오차의 누적을 막지만, 각 step 의 선택 자체는 여전히 world model 의 예측에 기댄다. 그래서 model 이 크게 틀리면
        MPC 도 틀린 쪽으로 간다. 매 step 다시 계획해도 고르는 기준은 model 의 예측이라 정확도가 결과에 영향을 준다. MPC 는 planning 방법이고 실행 중에
        weight 를 고치지 않는다. MPC 도 horizon 전체를 예측해 비교하며, 실제 관측으로 다시 시작하므로 오차가 더 커지지 않는다.
    - question: |
        배운 world model 로 MPC 를 했더니 과제를 잘 풀지 못한다. 원인이 world model 인지 planner 인지 어떻게 가릴 수 있는가?
      choices:
        - 'world model 의 학습 loss 를 보고, 0 이 아니면 원인은 항상 world model 이므로 model 을 더 학습한다'
        - 'horizon 을 1 로 줄여 보고 성능이 오르면, 긴 예측이 틀렸다는 뜻이므로 원인은 world model 이다'
        - '무작위 action 과 비교해 보고, 더 나으면 world model 은 쓸 만하므로 원인은 planner 다'
        - '같은 planner 에 진짜 simulator 를 넣어 보고, 그래도 못 풀면 planner 를 고치고 잘 풀면 world model 을 고친다'
      answer: 3
      explanation: |
        정답 model 을 넣은 planner(oracle)는 model 이 완벽할 때 그 planner 가 낼 수 있는 성능이라서, 배운 model 과의 차이가 model 오차의 몫이다. PlaNet
        저자들도 같은 CEM 에 진짜 simulator 를 넣은 결과를 상한으로 보고했다. loss 가 0 이 아닌 것은 모든 학습한 model 이 그렇고, planner 의 한계를
        가려 주지 않는다. horizon 을 바꾸면 model 오차와 planner 탐색 범위가 함께 바뀌어 둘을 가를 수 없다. 무작위 action 보다 나은지는 아무것도
        배우지 않은 기준과의 비교일 뿐 원인을 가려 주지 않는다.

- topic: dreamer-data
  title: Dreamer 와 데이터 수집 반복
  section: 상상-속-policy-학습과-dreamer
  variants:
    - question: |
        PlaNet 은 매 step CEM 으로 계획하고 Dreamer 는 그렇지 않다. Dreamer 는 어떻게 행동을 고르는가?
      choices:
        - '실제 환경에서 모은 episode 만으로 actor-critic 을 model-free 로 학습한다'
        - '상상 속 rollout 으로 actor 와 critic 을 미리 학습해 두고, 실제 step 에서는 actor 만 계산한다'
        - '매 step 무작위 action 을 내서 탐험하고, world model 은 그 결과를 평가하는 데만 쓴다'
        - '사람의 시연을 그대로 따라 하는 behavior cloning 으로 actor 를 학습하고 매 step 그 actor 를 쓴다'
      answer: 1
      explanation: |
        Dreamer 는 dataset 의 latent 에서 출발해 actor 의 action 으로 상상 속 rollout 을 만들고, horizon 너머는 critic 의 value 로 대신해 actor 와
        critic 을 학습한다. 그래서 실제 step 마다 십만 번이 넘는 예측 대신 actor 한 번이면 된다. actor-critic 을 실제 episode 로만 배우면 model-free 이고
        Dreamer 가 아니다. Dreamer 의 actor 는 학습한 policy 라서 무작위 action 을 내지 않는다. Dreamer 는 reward 로 배우며 사람의 시연을 따라 하지
        않는다.
    - question: |
        Dreamer 는 상상 속에서 학습하니 실제 환경 데이터가 필요 없다고 봐도 되는가?
      choices:
        - '그렇다. world model 도 처음부터 상상으로 만들 수 있으므로, 실제 데이터 없이 시작해도 된다'
        - '그렇다. 실제 데이터는 학습이 끝난 뒤 actor 가 잘하는지 평가할 때만 쓴다'
        - '아니다. world model 을 실제 transition 으로 배우고, 새 transition 으로 계속 다시 배운다'
        - '아니다. Dreamer 는 상상을 쓰지 않고, 실제 환경에서 모은 데이터로만 actor 와 critic 을 학습한다'
      answer: 2
      explanation: |
        actor 는 상상 속 episode 로 배우지만 그 상상의 정확도는 실제 데이터로 배운 world model 에 달려 있어서, Dreamer 도 실제 환경에서 데이터를 계속
        모은다. DayDreamer 는 로봇이 움직이는 동안 world model 과 actor-critic 을 계속 학습했다. 아무 데이터 없이 world model 을 만들 수는 없다. 실제
        데이터는 평가가 아니라 world model 학습에 쓴다. Dreamer 는 상상 속 rollout 으로 actor 를 배우는 것이 특징이다.
    - question: |
        model-based RL 이 world model 을 한 번 학습하고 끝내지 않고, world model 과 planner 로 데이터를 다시 모아 재학습하는 이유는 무엇인가?
      choices:
        - 'world model 은 dataset 안의 상황에서만 믿을 만해서, 고른 행동의 실제 결과로 틀린 예측을 고쳐야 한다'
        - '같은 데이터로 여러 번 학습하면 overfitting 이 일어나므로, 예전 데이터를 버리고 통째로 바꾸기 위해서다'
        - '처음 모은 무작위 데이터에는 reward 가 기록되지 않아서, reward model 을 배울 데이터가 따로 필요하기 때문이다'
        - 'planner 는 매번 새로 모은 데이터를 받아야 계산을 시작할 수 있어서, 데이터를 끊이지 않게 모아야 하기 때문이다'
      answer: 0
      explanation: |
        무작위 action 데이터에는 진자가 선 자세처럼 중요한 상황이 드물고, world model 은 데이터 밖에서 틀린 예측을 하기 쉽다. planner 로 모은 데이터는
        model 이 맞았으면 좋은 행동의 기록이 되고 틀렸으면 그 잘못된 예측을 고칠 기록이 된다. 새 데이터는 예전 데이터를 대신하지 않고 dataset 에 더해진다.
        무작위 데이터에도 reward 가 기록된다. planner 는 지금의 world model 만 있으면 계산할 수 있다.

- topic: video-latent-models
  title: 영상 world model 과 representation 예측
  section: 영상-world-model
  variants:
    - question: |
        decoder 없이 다음 latent 만 맞히도록 world model 을 학습하면 어떤 문제가 생길 수 있고, 그 문제는 어떻게 막는가?
      choices:
        - 'decoder 가 없으면 latent 를 제한할 것이 없어 크기가 너무 커지고 GPU 메모리가 넘친다. latent 의 크기를 줄여 막는다'
        - '학습 중 reward 가 항상 0 이 된다. reward 에 큰 값을 곱해 신호를 키워서 막는다'
        - 'latent 를 사진으로 되살릴 수 없어 planning 이 불가능해지고, decoder 를 다시 붙이는 수밖에 없다'
        - '모든 입력이 한 점으로 가 loss 만 0 이 되는 collapse 가 생기고, reward 를 함께 예측하거나 정답 쪽 gradient 를 막아 피한다'
      answer: 3
      explanation: |
        encoder 와 dynamics 가 늘 같은 값을 내면 예측과 정답이 늘 같아 loss 는 0 이지만 latent 에는 정보가 없다. reward 예측이나 gradient 를 막은 target,
        고정한 encoder 가 이 쉬운 답을 막고, TD-MPC2 와 V-JEPA 2-AC 가 그렇게 한다. collapse 는 latent 가 커지는 문제가 아니라 정보가 사라지는 문제다.
        reward 는 환경이 주는 값이라 학습 방식 때문에 0 이 되지 않는다. TD-MPC2 와 V-JEPA 2-AC 는 decoder 없이도 planning 한다.
    - question: |
        V-JEPA 2-AC 가 action 조건 영상 생성 모델(Cosmos)보다 같은 로봇 팔 계획에서 action 하나를 훨씬 빨리 고를 수 있었던 이유는 무엇인가?
      choices:
        - 'V-JEPA 2-AC 쪽 실험만 더 빠른 GPU 에서 돌려서, 같은 계산도 빨리 끝났기 때문이다'
        - 'pixel 을 그리지 않고 representation 만 예측해서, 후보 하나를 평가하는 계산이 가볍기 때문이다'
        - 'CEM 후보를 Cosmos 보다 훨씬 적게 뽑아서, 평가할 행동열 수 자체가 줄었기 때문이다'
        - 'planning 을 하지 않고 behavior cloning 으로 배운 policy 가 action 을 바로 냈기 때문이다'
      answer: 1
      explanation: |
        영상 생성 모델은 후보마다 다음 frame 의 pixel 을 그려야 하지만, V-JEPA 2-AC 는 representation 만 예측하고 goal 이미지의 representation 과 거리를
        잰다. 논문의 비교에서는 같은 RTX 4090 한 장으로 Cosmos 는 action 하나에 4 분이 걸렸고 V-JEPA 2-AC 는 16 초가 걸렸다. 비교는 같은 GPU 에서 했다.
        V-JEPA 2-AC 는 오히려 후보를 10 배(800 개 대 80 개) 더 뽑았다. 두 방식 모두 CEM 으로 planning 했다.
    - question: |
        DreamGen 처럼 영상 world model 이 만든 로봇 영상으로 policy 를 학습하려면 영상 말고 무엇이 더 필요하고, 그것은 어떻게 얻는가?
      choices:
        - '영상의 해상도를 높이는 upsampler 가 필요하고, 그것만 있으면 영상을 그대로 policy 입력과 정답으로 쓸 수 있다'
        - 'reward model 이 필요하고, 생성한 영상마다 사람이 성공 여부를 보고 점수를 매겨 얻는다'
        - '영상에 없는 frame 별 action 이 필요해서, inverse dynamics model 로 추정해 붙인다'
        - '로봇의 URDF 가 필요하고, 영상 속 팔의 관절 길이와 위치를 재서 만들어 얻는다'
      answer: 2
      explanation: |
        policy 를 behavior cloning 으로 배우려면 관측마다 정답 action 이 있어야 하는데, 생성한 영상에는 이미지만 있다. DreamGen 은 IDM 이나 latent action
        model 로 frame 사이의 action 을 추정해 붙인 뒤 GR00T N1 을 학습했다. 해상도를 높여도 action 정답이 생기지 않는다. DreamGen 은 reward 로 배우지
        않고 추정한 action 을 따라 배운다. URDF 는 로봇의 관절 구조이고, 영상의 frame 마다 필요한 action 을 대신하지 못한다.
