<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>slam_toolbox 를 쓴 지도 작성 흐름. /scan 과 odometry 를 받아 0.5 m 또는 0.5 rad 마다 node 를 만들고 scan matching 과 loop closure 로 pose graph 를 최적화해, /map 을 5 초마다, map → odom tf 를 50 Hz 로 낸다. 다 그린 지도는 map_saver_cli 로 map.pgm 과 map.yaml 로 저장해 map_server 와 AMCL 에 넘긴다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="50" width="150" height="54" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="95.0" y="73.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">LiDAR</text>
  <text x="95.0" y="92.0" fill="#94a3b8" font-size="11" text-anchor="middle">/scan</text>
  <rect x="20" y="130" width="150" height="54" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="95.0" y="153.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">odometry · EKF</text>
  <text x="95.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">odom → base_footprint</text>
  <rect x="225" y="40" width="230" height="160" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="340.0" y="64.0" fill="#7fc4a2" font-size="14" text-anchor="middle" font-weight="600">slam_toolbox</text>
  <rect x="240" y="78" width="200" height="46" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340.0" y="98.0" fill="#e2e8f0" font-size="12" text-anchor="middle">scan matching</text>
  <text x="340.0" y="115.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.5 m 또는 0.5 rad 마다 node</text>
  <rect x="240" y="138" width="200" height="46" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340.0" y="158.0" fill="#e2e8f0" font-size="12" text-anchor="middle">pose graph + loop closure</text>
  <text x="340.0" y="175.0" fill="#94a3b8" font-size="11" text-anchor="middle">Ceres 로 최적화</text>
  <line x1="172.0" y1="77.0" x2="222.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="172.0" y1="157.0" x2="222.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="340.0" y1="125.0" x2="340.0" y2="135.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#am)"/>
  <rect x="510" y="110" width="190" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="605.0" y="131.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">/map</text>
  <text x="605.0" y="149.0" fill="#94a3b8" font-size="11" text-anchor="middle">5 초마다 (map_update_interval)</text>
  <rect x="510" y="40" width="190" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="605.0" y="61.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">map → odom tf</text>
  <text x="605.0" y="79.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.02 초마다 (50 Hz)</text>
  <line x1="457.0" y1="80.0" x2="507.0" y2="65.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="457.0" y1="140.0" x2="507.0" y2="135.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="225" y="238" width="230" height="60" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="340.0" y="262.0" fill="#a99ad6" font-size="13" text-anchor="middle" font-weight="600">map_saver_cli</text>
  <text x="340.0" y="282.0" fill="#94a3b8" font-size="11" text-anchor="middle">map.pgm + map.yaml</text>
  <rect x="510" y="238" width="190" height="60" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="605.0" y="262.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">map_server + AMCL</text>
  <text x="605.0" y="282.0" fill="#94a3b8" font-size="11" text-anchor="middle">지도를 다 그린 뒤의 주행</text>
  <path d="M605,162 L605,215 L340,215 L340,234" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#am)"/>
  <line x1="457.0" y1="268.0" x2="507.0" y2="268.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="95.0" y="240.0" fill="#94a3b8" font-size="11" text-anchor="middle">serialize_map:</text>
  <text x="95.0" y="258.0" fill="#94a3b8" font-size="11" text-anchor="middle">pose graph 와 raw scan 저장</text>
  <text x="95.0" y="276.0" fill="#94a3b8" font-size="11" text-anchor="middle">→ 이어 그리기·localization mode</text>
</svg>
