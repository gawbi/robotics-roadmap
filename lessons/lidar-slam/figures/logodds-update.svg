<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>한 칸의 occupancy 확률 변화. 맞음마다 log-odds 0.85 를, 지나감마다 0.41 을 빼면 0.5 에서 시작한 칸이 맞음 3 번에 0.93 까지 오르고, 사람이 떠난 뒤 지나감 9 번(5 Hz 면 1.8 초) 만에 free 기준 0.25 아래로 내려간다</title>
