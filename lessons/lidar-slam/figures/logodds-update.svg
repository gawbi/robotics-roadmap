  <line x1="70.0" y1="200.0" x2="640.0" y2="200.0" stroke="#7fc4a2" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="78.0" y="215.0" fill="#7fc4a2" font-size="11" text-anchor="start">free_thresh 0.25</text>
  <line x1="70.0" y1="150.0" x2="640.0" y2="150.0" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
