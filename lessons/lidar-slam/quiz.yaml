# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: slam-problem
  title: 지도와 위치를 함께 추정하는 이유
  variants:
    - question: |
        면접관: "SLAM 이 localization 이나 mapping 하나만 푸는 것보다 어려운 이유는 무엇인가요?"
      choices:
        - 'LiDAR 가 지도와 위치를 동시에 재지 못해서 센서가 두 개 필요하기 때문이다'
        - 'SLAM 은 3D 지도만 다루고 localization 과 mapping 은 2D 만 다루기 때문이다'
        - '지도를 그리려면 scan 을 찍은 위치가, 위치를 찾으려면 지도가 필요한데 둘 다 모르는 상태에서 출발하기 때문이다'
        - 'localization 은 GPS 만 쓰고 SLAM 은 GPS 를 쓰지 못하기 때문이다'
      answer: 2
      explanation: |
        위치를 알면 scan 을 그 자리에 놓아 지도를 칠할 수 있고, 지도가 있으면 AMCL 처럼 scan 을 지도에 맞춰 위치를 찾을 수 있다. SLAM 은 둘 다
        모르는 상태에서 출발해 두 문제가 서로를 필요로 하는 것이 어려움의 원인이다. 센서 개수나 지도의 차원, GPS 사용 여부가 차이를 만드는 것은 아니다.
    - question: |
        면접관: "Nav2 에서 AMCL 을 바로 쓸 수 없고 먼저 SLAM 을 실행해야 하는 상황은 언제인가요?"
      choices:
        - '로봇이 처음 들어간 공간이라 AMCL 이 scan 을 맞춰 볼 지도가 아직 없을 때'
        - '로봇의 LiDAR 가 360° 를 보지 못할 때'
        - '로봇이 1 m/s 보다 빠르게 움직일 때'
        - 'particle 수가 1,000 개보다 적을 때'
      answer: 0
      explanation: |
        AMCL 은 주어진 지도 위에서 scan 이 지도와 얼마나 잘 맞는지로 particle 의 weight 를 매기는 localization 이라 지도가 꼭 있어야 한다. 처음 가는
        공간에서는 SLAM 으로 지도를 먼저 만들고 저장한 뒤 AMCL 에 넘긴다. LiDAR 의 시야각, 속도, particle 수는 지도가 필요한지와 관계없다.
    - question: |
        면접관: "LiDAR SLAM 을 front-end 와 back-end 로 나눌 때 각 부분이 하는 일로 가장 알맞은 것은?"
      choices:
        - 'front-end 는 지도를 pgm 파일로 저장하고, back-end 는 RViz 에 지도를 그린다'
        - 'front-end 는 particle 을 resampling 하고, back-end 는 Kalman gain 을 계산한다'
        - 'front-end 는 LiDAR driver 이고, back-end 는 motor driver 다'
        - 'front-end 는 새 scan 을 최근 scan 이나 지도 조각에 맞춰 짧은 구간의 이동을 구하고, back-end 는 예전 장소에 돌아온 것을 알아차려 경로 전체를 다시 최적화한다'
      answer: 3
      explanation: |
        front-end 는 odometry 를 출발점 삼아 scan matching 으로 이웃 scan 사이의 이동을 구하고 지도를 늘린다. 이것만으로는 작은 오차가 쌓이므로
        back-end 가 loop closure 를 찾아 pose graph 전체를 최적화한다. 저장·시각화나 hardware driver, particle filter 의 단계는 이 구분과 관계없다.

- topic: odometry-drift
  title: odometry 오차의 누적
  variants:
    - question: |
        면접관: "바퀴 odometry 로 지도를 그릴 때 거리 오차보다 방향 오차가 더 위험한 이유는 무엇인가요?"
      choices:
        - '방향 오차는 IMU 로 언제든 완전히 없앨 수 있어서 거리 오차만 신경 쓰면 된다'
        - '방향을 한 번 틀리게 세면 그 뒤로 달리는 모든 거리가 틀어진 방향으로 쌓여, 옆으로 벗어나는 거리가 달린 거리에 비례해 커지기 때문이다'
        - '방향 오차는 로봇이 멈춰 있을 때만 생기기 때문이다'
        - '방향 오차는 LiDAR 의 거리 값을 두 배로 늘리기 때문이다'
      answer: 1
      explanation: |
        회전을 θ 만큼 틀리게 세면 그 뒤로 L 만큼 달릴 때 옆으로 약 L × sin θ 가 벗어나고, 이 오차는 달릴수록 계속 커진다. 같은 방향 오차는 scan 의
        먼 점일수록 크게 밀려 그리게도 만든다. IMU 를 합쳐도 오차는 줄 뿐 계속 쌓이고, 멈춰 있을 때만 생기는 것도, 거리 값을 바꾸는 것도 아니다.
    - question: |
        회전을 1° 틀리게 센 로봇이 그 뒤로 50 m 를 곧게 달렸다. odometry 위치가 옆으로 벗어난 거리에 가장 가까운 것은? (sin 1° ≈ 0.017)
      choices:
        - '0.017 m'
        - '0.5 m'
        - '50 m'
        - '0.87 m'
      answer: 3
      explanation: |
        옆으로 벗어나는 거리는 달린 거리 × sin(방향 오차)이므로 50 × 0.017 ≈ 0.87 m 다. 0.017 m 는 1 m 를 달렸을 때의 값이고, 0.5 m 는 거리를 1%
        틀렸을 때의 거리 오차에 가깝다. 50 m 는 방향이 90° 틀렸을 때에나 나오는 값이다.
    - question: |
        면접관: "로봇의 방향 추정이 1° 틀리면 LiDAR 로 그린 지도에서 어떤 일이 생기나요?"
      choices:
        - '멀리 있는 벽 점일수록 더 많이 옆으로 밀려 그려진다. 3 m 앞 점은 약 5 cm 밀려 5 cm 칸 하나만큼 어긋난다'
        - 'LiDAR 는 로봇과 함께 돌기 때문에 방향 오차는 지도에 나타나지 않는다'
        - '모든 벽 점이 거리와 관계없이 똑같이 1 cm 씩 밀린다'
        - '가까운 벽 점일수록 더 많이 밀리고 먼 점은 그대로다'
      answer: 0
      explanation: |
        scan 의 점은 로봇 방향을 기준으로 그 방향과 거리로 찍히므로, 방향이 θ 틀리면 거리 d 의 점은 약 d × sin θ 만큼 옆으로 밀린다. 3 m 에서
        1° 면 3 × 0.017 ≈ 0.05 m 다. LiDAR 가 로봇과 함께 돌기 때문에 오히려 로봇의 방향 오차가 그대로 지도에 들어가고, 밀리는 양은 거리에
        비례하므로 먼 점일수록 크다.

- topic: occupancy-logodds
  title: occupancy grid 와 log-odds 갱신
  variants:
    - question: |
        면접관: "occupancy grid 를 확률 대신 log-odds 로 갱신하는 이유는 무엇인가요?"
      choices:
        - '측정이 독립이라는 가정에서 Bayes rule 의 곱셈이 log-odds 에서는 덧셈이 되어, 새 증거를 더하기만 하면 되기 때문이다'
        - 'log-odds 는 항상 0 과 1 사이라서 저장 공간이 적게 들기 때문이다'
        - 'log-odds 를 쓰면 LiDAR 의 거리 noise 가 사라지기 때문이다'
        - 'log-odds 를 쓰면 빛이 지나간 칸을 갱신할 필요가 없기 때문이다'
      answer: 0
      explanation: |
        확률을 l = ln(p / (1 − p)) 로 바꾸면 Bayes rule 의 곱이 덧셈이 되어, 빛이 맞으면 양수를, 지나가면 음수를 더하는 가벼운 계산으로 바뀐다.
        log-odds 는 음수에서 양수까지의 값이라 0 ~ 1 범위가 아니고, 센서 noise 를 없애지도 않는다. 빛이 지나간 칸도 비어 있다는 증거로 갱신한다.
    - question: |
        빛이 맞으면 log-odds 에 +0.85, 빛이 지나가면 −0.41 을 더한다. 처음 확률 0.5 인 칸에 맞음, 맞음, 지나감이 차례로 들어왔다. 이 칸의 상태로 알맞은 것은?
      choices:
        - '지나감이 마지막이므로 비어 있을 확률이 더 크다'
        - 'log-odds 가 0 이라 아직 모른다'
        - 'log-odds 가 0.85 + 0.85 − 0.41 = 1.29 라 차 있을 확률이 약 0.78 이다'
        - '맞음이 두 번이므로 확률이 1 이다'
      answer: 2
      explanation: |
        log-odds 는 0 + 0.85 + 0.85 − 0.41 = 1.29 이고 p = 1 / (1 + e^(−1.29)) ≈ 0.78 이다. 더하기라서 순서와 관계없이 결과가 같으므로 마지막이 지나감이라는
        사실이 결과를 뒤집지 않는다. 확률은 증거가 쌓여도 1 에 다가갈 뿐 정확히 1 이 되지 않는다.
    - question: |
        면접관: "occupancy grid 에서 차 있을 확률이 0.5 인 칸은 무엇을 뜻하나요?"
      choices:
        - '칸의 절반 넓이가 장애물로 차 있다'
        - '아직 빛이 닿지 않아 차 있는지 비어 있는지 정보가 없다'
        - '빈 공간으로 확정되어 로봇이 지나가도 된다'
        - '사람처럼 움직이는 장애물이 있는 칸이다'
      answer: 1
      explanation: |
        처음 모든 칸은 0.5(log-odds 0)에서 시작하므로 0.5 는 정보가 없다는 뜻이다. ROS 의 OccupancyGrid 는 이런 칸을 −1(unknown)로 적고 저장한
        지도에서는 회색으로 칠한다. 넓이의 비율이나 빈 공간 확정을 뜻하지 않고, 움직이는 장애물 여부와도 관계없다.

- topic: scan-matching
  title: scan matching
  variants:
    - question: |
        면접관: "ICP 로 두 scan 을 맞출 때 odometry 로 구한 initial guess 가 중요한 이유는 무엇인가요?"
      choices:
        - 'ICP 는 odometry 값을 그대로 결과로 내기 때문이다'
        - 'initial guess 가 없으면 ICP 가 회전은 구하지 못하고 이동만 구하기 때문이다'
        - 'initial guess 는 scan 의 점 개수를 정하기 때문이다'
        - 'ICP 는 가장 가까운 점끼리 짝지어 국소적으로 줄여 가므로, 출발점이 멀면 짝이 엉뚱하게 지어져 틀린 local minimum 에 멈추기 때문이다'
      answer: 3
      explanation: |
        ICP 는 점마다 가장 가까운 점을 짝으로 정하고 그 짝에 맞춰 옮기기를 되풀이하는데, 출발점에서 가장 가까운 local minimum 으로 수렴한다. 출발점이
        나쁘면 처음 짝부터 틀려 엉뚱한 답에 멈춘다. ICP 는 회전과 이동을 모두 구하고, odometry 를 그대로 내지 않으며, 점 개수와도 관계없다.
    - question: |
        면접관: "correlative scan matching 이 ICP 보다 나은 점과 그 대가는 무엇인가요?"
      choices:
        - '계산이 ICP 보다 훨씬 적은 대신 회전을 구하지 못한다'
        - '정해 둔 범위의 후보 자세를 모두 점수 매기므로 initial guess 가 조금 틀려도 답을 놓치지 않지만, 범위를 넓힐수록 후보 수가 크게 늘어 계산이 많다'
        - '지도 없이 동작하는 대신 LiDAR 가 두 대 필요하다'
        - '항상 정확한 답을 주므로 loop closure 가 필요 없다'
      answer: 1
      explanation: |
        correlative 방식은 출발점 둘레의 위치·각도 후보를 모두 시험해 점수가 가장 높은 것을 고르므로 국소 탐색보다 robust 하다. 대신 위치 범위의
        제곱과 각도 수에 비례해 후보가 늘어 계산이 많고, 그래서 multi-resolution 이나 branch-and-bound 로 줄인다. 회전도 구하고, LiDAR 한 대로
        동작하며, 작은 오차는 여전히 쌓이므로 loop closure 가 필요하다.
    - question: |
        면접관: "양쪽 벽이 곧고 나란한 긴 복도에서 LiDAR scan matching 이 잘 안 되는 이유는 무엇인가요?"
      choices:
        - '복도에서는 LiDAR 빛이 반사되지 않기 때문이다'
        - '복도에서는 로봇이 회전하지 않아 scan matching 을 할 필요가 없기 때문이다'
        - 'scan 을 복도 방향으로 밀어도 벽이 똑같이 겹쳐 점수가 같으므로, 복도 방향의 이동을 scan 으로 알 수 없기 때문이다'
        - '벽이 둘이라 scan 의 점이 너무 많아 계산이 끝나지 않기 때문이다'
      answer: 2
      explanation: |
        나란한 두 벽만 보이는 곳에서는 복도 옆 방향과 회전은 정해지지만, 복도를 따라 어디로 밀어도 같은 모양이라 그 방향의 이동은 정해지지 않는다.
        그래서 그 방향은 odometry 에 기대고, slam_toolbox 같은 scan matcher 는 방향별 covariance 를 함께 계산해 그 방향을 덜 믿게 한다. 벽은 빛을 잘 반사하고, 점 개수가 원인도 아니다.

- topic: loop-closure
  title: pose graph 와 loop closure
  variants:
    - question: |
        면접관: "pose graph 에 loop closure edge 를 넣고 최적화하면 무엇이 달라지나요?"
      choices:
        - '마지막 node 만 출발점으로 옮기고 나머지 node 는 그대로 둔다'
        - '모든 odometry edge 를 지우고 loop closure edge 만 남긴다'
        - '돌아온 곳에서 드러난 어긋남을 고리 위의 모든 edge 가 각자의 불확실성에 따라 나눠 떠안도록 경로 전체를 고친다'
        - '지도 칸의 해상도를 높여 어긋남을 감춘다'
      answer: 2
      explanation: |
        최적화는 모든 edge 를 가장 덜 어기는 node 위치를 찾으므로, 어긋남이 고리 위의 edge 마다 분산에 비례해 나뉜다. 마지막 node 만 옮기면 그 앞
        구간에 어긋남이 몰려 지도가 끊어지고, odometry edge 를 지우면 node 사이의 관계를 잃는다. 해상도는 이 계산과 관계없다.
    - question: |
        odometry edge 넷이 +5.0, +5.0, −4.8, −4.8 m 이고, 마지막 node 가 첫 node 와 같은 자리라는 loop closure edge 가 있다. 다섯 edge 의 분산이 모두 같을 때, 최적화 뒤 odometry edge 하나가 떠안는 수정량은?
      choices:
        - '0.08 m. 어긋남 0.4 m 를 다섯 edge 가 똑같이 나눈다'
        - '0.4 m. 마지막 edge 가 어긋남을 모두 떠안는다'
        - '0.1 m. loop closure edge 는 고치지 않는다'
        - '0 m. 분산이 같으면 아무것도 고치지 않는다'
      answer: 0
      explanation: |
        odometry 만 이으면 5.0 + 5.0 − 4.8 − 4.8 = 0.4 m 가 어긋나고, 분산이 모두 같으면 다섯 edge 가 0.4 ÷ 5 = 0.08 m 씩 나눈다. 0.1 m 는 loop
        closure edge 의 분산이 0 에 가까워 odometry edge 넷만 나눌 때의 값이다. 한 edge 에 몰아주거나 고치지 않는 것은 최소제곱의 답이 아니다.
    - question: |
        면접관: "생김새가 똑같은 두 복도를 같은 장소로 잘못 이은 loop closure 가 들어가면 어떻게 되나요?"
      choices:
        - '최적화가 틀린 edge 를 자동으로 찾아 항상 무시하므로 영향이 없다'
        - '그 두 node 만 겹쳐 그려지고 나머지 지도는 그대로다'
        - 'loop closure 가 많을수록 지도가 좋아지므로 오히려 정확해진다'
        - '최적화가 그 edge 를 지키려고 두 장소 사이의 node 들을 끌어당겨 지도 전체가 휜다. 그래서 점수 문턱과 연속 일치 조건으로 loop closure 를 깐깐하게 고른다'
      answer: 3
      explanation: |
        pose graph 최적화는 모든 edge 를 함께 만족시키려 하므로, 틀린 edge 하나도 고리 위의 node 를 모두 움직여 지도를 휘게 한다. 기본 최소제곱은 틀린
        edge 를 스스로 가려내지 못해서, SLAM package 는 matching 점수 문턱·연속 일치 개수로 후보를 거르고 robust loss 로 영향을 줄이기도 한다.

- topic: slam-toolbox
  title: slam_toolbox 와 ROS 2 의 tf
  variants:
    - question: |
        면접관: "Nav2 와 slam_toolbox 를 함께 쓸 때 tf 는 누가 무엇을 내나요?"
      choices:
        - 'slam_toolbox 가 odom → base_footprint 를, 바퀴 odometry 가 map → odom 을 낸다'
        - '바퀴 odometry 나 EKF 가 odom → base_footprint 를 내고, slam_toolbox 가 scan matching 으로 고친 map → odom 을 낸다'
        - 'slam_toolbox 가 map → base_footprint 하나만 내고 odom frame 은 쓰지 않는다'
        - 'AMCL 과 slam_toolbox 가 함께 map → odom 을 낸다'
      answer: 1
      explanation: |
        odometry 쪽 odom → base_footprint 는 매끄럽지만 오차가 쌓이고, SLAM 이 내는 map → odom 이 그 쌓인 오차를 덜어 낸다. 그래서 Nav2 의 SLAM
        tutorial 은 AMCL 을 빼고(use_localization:=False) 실행한다. 둘이 같은 map → odom 을 내면 tf 가 충돌하고, odom frame 을 건너뛰지도 않는다.
    - question: |
        면접관: "slam_toolbox 의 synchronous mode 와 asynchronous mode 는 어떻게 다른가요?"
      choices:
        - 'synchronous 는 LiDAR 를 두 대 쓰고 asynchronous 는 한 대 쓴다'
        - 'synchronous 는 loop closure 를 하지 않고 asynchronous 만 한다'
        - 'synchronous 는 2D, asynchronous 는 3D 지도를 만든다'
        - 'synchronous 는 들어온 scan 을 버리지 않고 차례로 처리해 품질을 우선하고, asynchronous 는 앞의 처리가 끝났을 때의 새 scan 만 처리해 실시간보다 뒤처지지 않는 대신 일부 scan 을 건너뛸 수 있다'
      answer: 3
      explanation: |
        synchronous mode 는 scan 을 쌓아 두고 모두 처리해서 녹화 데이터 처리나 지도 품질이 중요할 때 알맞다. asynchronous mode 는 최신 scan 만
        처리해 loop closure 계산이 길어져도 뒤처지지 않아 움직이며 위치를 바로 써야 할 때 쓴다. 센서 수, loop closure 여부, 지도 차원의 차이가 아니다.
    - question: |
        면접관: "slam_toolbox 가 모든 scan 이 아니라 로봇이 0.5 m 를 가거나 0.5 rad 를 돌 때마다 scan 을 pose graph 의 node 로 넣는 이유는 무엇인가요?"
      choices:
        - '거의 같은 자리의 scan 을 모두 node 로 넣으면 정보는 크게 늘지 않고 node 와 edge 만 늘어 최적화와 loop closure 계산이 무거워지기 때문이다'
        - 'LiDAR 가 0.5 m 마다 한 번만 측정할 수 있기 때문이다'
        - '0.5 m 보다 가까운 scan 끼리는 scan matching 을 할 수 없기 때문이다'
        - 'node 가 많으면 지도 해상도가 자동으로 낮아지기 때문이다'
      answer: 0
      explanation: |
        LiDAR 는 1초에 여러 번 scan 을 내지만 거의 같은 자리에서 찍은 scan 은 서로 비슷해서 새 정보가 적다. 일정 거리·각도마다 node 를 만들면
        pose graph 크기가 이동량에 맞춰 늘어 계산이 가벼워진다(minimum_travel_distance, minimum_travel_heading). LiDAR 의 측정 주기나 scan matching 의
        가능 여부, 지도 해상도와는 관계없다.

- topic: map-saving
  title: 지도 해상도와 저장
  variants:
    - question: |
        면접관: "SLAM 지도의 칸 크기를 5 cm 에서 2.5 cm 로 줄이면 무엇이 달라지나요?"
      choices:
        - '칸 수가 네 배가 되어 지도 메시지·메모리와 그 지도를 쓰는 계산이 무거워지고, 센서 오차가 칸보다 크면 벽이 더 정확해지지도 않는다'
        - '칸 수가 두 배가 되고 벽의 위치 오차도 절반으로 준다'
        - '칸 수는 같고 그림 파일만 커진다'
        - 'scan matching 이 필요 없어진다'
      answer: 0
      explanation: |
        칸 한 변을 반으로 줄이면 가로·세로가 각각 두 배라 칸 수는 네 배가 된다. 지도의 정확도는 센서의 거리 오차와 자세 오차가 정하므로 칸만 줄인다고
        벽이 정확해지지 않는다. scan matching 은 칸 크기와 관계없이 필요하다.
    - question: |
        면접관: "map_saver_cli 로 저장한 pgm 지도에서 흰색·검은색·회색 칸은 각각 무엇이고, 어떤 기준으로 나뉘나요?"
      choices:
        - '세 색은 LiDAR 가 빛을 받은 세기로 나뉜다'
        - '흰색은 장애물, 검은색은 빈 공간, 회색은 경로다'
        - '칸의 차 있을 확률이 free 문턱(기본 0.25) 이하면 흰색(비어 있음), occupied 문턱(기본 0.65) 이상이면 검은색(차 있음), 그 사이이거나 모르면 회색이다'
        - '로봇이 지나간 횟수가 많을수록 흰색에 가깝다'
      answer: 2
      explanation: |
        Nav2 map saver 는 칸의 값을 free_thresh 와 occupied_thresh 두 문턱으로 나눠 흰색(254), 검은색(0), 회색(205)으로 칠한다. 색은 빛의 세기나
        로봇이 지나간 횟수가 아니라 차 있을 확률로 정하고, 흰색이 빈 공간·검은색이 장애물이다.
    - question: |
        면접관: "slam_toolbox 로 그린 지도를 나중에 이어 그리거나 고치려면 pgm·yaml 저장만으로 부족한 이유는 무엇인가요?"
      choices:
        - 'pgm 은 칸 수가 40,000 개를 넘으면 저장되지 않기 때문이다'
        - 'pgm 은 칸의 색만 남기고 pose graph 와 raw scan 을 버리므로, 이어 그리려면 serialize_map 으로 pose graph 와 scan 을 함께 저장해야 하기 때문이다'
        - 'yaml 에 해상도가 적히지 않기 때문이다'
        - 'AMCL 이 pgm 을 읽지 못하기 때문이다'
      answer: 1
      explanation: |
        pgm 은 최적화가 끝난 결과를 그림으로 남길 뿐 node·edge·scan 이 없어서 새 loop closure 를 넣거나 다시 최적화할 수 없다. 그래서 serialize_map
        으로 pose graph 와 raw scan 을 저장해 두면 이어 그리기와 localization mode 에 쓸 수 있다. yaml 에는 해상도가 적히고, AMCL 은 map server 를 거쳐
        pgm 지도를 쓰며, 칸 수 제한은 없다.
