# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: expert-structure
  title: VLM backbone 과 action expert
  variants:
    - question: |
        면접관: "π0 는 PaliGemma 의 weight 와 action expert 의 weight 를 한 transformer 안에 둡니다. 두 weight 묶음은 입력을 어떻게
        나눠 맡나요?"
      choices:
        - 'PaliGemma 가 관절 각도와 noise 가 섞인 action 을 처리하고, action expert 가 사진과 지시문을 처리한다'
        - 'PaliGemma 가 사진과 지시문 token 을 처리하고, action expert 가 로봇 상태와 noise 가 섞인 action token 을 처리한다'
        - '모든 token 이 두 묶음을 차례로 지나고, 두 묶음은 이름만 다르다'
        - 'action expert 가 지시문을 글로 다시 써서 PaliGemma 에 넘긴다'
      answer: 1
      explanation: |
        사진과 지시문은 PaliGemma 가 pretraining 에서 다뤄 본 입력이라 PaliGemma 의 weight 가 처리하고, 관절 각도와 noise 가 섞인 action 은
        VLM 이 본 적 없는 로봇 입력이라 action expert 의 weight 가 처리한다. token 마다 한 묶음으로 보내는 구조라서 mixture of experts 에
        견준다. 첫 보기는 두 묶음이 맡는 입력을 서로 뒤바꿨다. 모든 token 이 두 묶음을 차례로 지난다면 token 을 나눠 맡는 구조가 아니다.
        action expert 는 글을 쓰지 않고 action 을 고칠 속도만 낸다.
    - question: |
        면접관: "π0 의 action expert 는 Gemma 와 같은 transformer 구조입니다. 그렇다면 action expert 를 작은 LLM 이라고 불러도 되나요?"
      choices:
        - '네. 구조가 같으면 같은 일을 하므로 action expert 도 다음 단어의 확률을 낸다'
        - '네. action expert 는 Gemma 의 weight 를 복사해 시작하므로 글을 이해한다'
        - '아니요. action expert 는 사진을 token 으로 바꾸는 image encoder 다'
        - '아니요. 무작위 weight 에서 출발해 로봇 시연으로 학습했고, vocabulary 의 확률 대신 action 마다 연속된 숫자(속도)를 낸다'
      answer: 3
      explanation: |
        같은 구조라도 무엇을 하는지는 학습 데이터와 출력 모양이 정한다. action expert 는 무작위 값에서 출발해 로봇 시연으로 학습했고, action
        token 마다 마지막 출력을 행렬 하나로 바꿔 noise 가 섞인 action 을 고칠 속도를 낸다. 첫 보기는 구조와 출력을 같은 것으로 보았는데,
        action expert 에는 vocabulary 가 없다. 둘째 보기와 달리 Gemma 의 weight 로 시작하는 쪽은 PaliGemma backbone 이다. 사진을 token 으로
        바꾸는 일은 PaliGemma 안의 SigLIP image encoder 가 맡는다.
    - question: |
        면접관: "π0 에서 PaliGemma 는 약 30 억 parameter 인데 action expert 는 약 3 억 parameter 로 훨씬 작습니다. 저자들이 action expert
        를 작게 만든 이유는 무엇인가요?"
      choices:
        - 'action chunk 하나를 만드는 동안 action expert 만 여러 번 계산해야 해서, 작을수록 추론이 빨라지기 때문이다'
        - 'action expert 는 attention 을 쓰지 않아 큰 크기가 필요 없기 때문이다'
        - '로봇 시연 데이터가 적어서 3 억보다 큰 network 는 학습할 수 없기 때문이다'
        - 'action expert 가 작아야 PaliGemma 의 weight 를 고정할 수 있기 때문이다'
      answer: 0
      explanation: |
        flow matching 은 Euler step 마다 action expert 를 한 번 계산하므로, chunk 하나에 PaliGemma 쪽은 한 번이지만 action expert 는 여러 번
        계산한다. 그래서 저자들은 추론을 빠르게 하려고 action expert 의 width 와 MLP 크기를 줄였다. action expert 도 attention 으로 사진과
        지시문 token 을 보므로 둘째 보기는 틀렸다. 저자들은 데이터 양을 이유로 들지 않았고, 크기 제한이 있다는 근거도 없다. pretraining 동안
        PaliGemma 의 weight 도 함께 고치므로 고정과는 관계가 없다.

- topic: attention-mask
  title: blockwise causal attention mask
  variants:
    - question: |
        면접관: "π0 는 token 을 사진·지시문, 로봇 상태, noise 가 섞인 action 의 세 block 으로 나눈 attention mask 를 씁니다. 어느 token 이
        어느 token 을 볼 수 있나요?"
      choices:
        - '모든 token 이 모든 token 을 본다'
        - '언어 모델처럼 token 하나하나가 자기보다 앞의 token 만 보고, 같은 block 안에서도 뒤의 token 은 보지 못한다'
        - '뒤쪽 block 은 앞쪽 block 을 볼 수 있지만 앞쪽 block 은 뒤쪽 block 을 보지 못하고, 같은 block 안에서는 서로를 다 본다'
        - 'action token 은 사진을 보지 못하고 로봇 상태만 본다'
      answer: 2
      explanation: |
        blockwise causal mask 는 block 사이에는 앞쪽만 보게 하고 block 안에서는 앞뒤 없이 서로를 다 보게 한다. 그래서 action token 은 사진,
        지시문, 로봇 상태, 다른 action token 을 모두 본다. 모든 token 이 모든 token 을 본다면 사진 token 이 바뀌는 action 에 영향을 받게
        된다. token 하나하나에 앞쪽만 보게 하는 것은 글을 한 token 씩 만드는 causal mask 이고, π0 의 action token 50 개는 서로를 다 본다.
        action token 이 사진을 보지 못하면 장면에 맞는 action 을 낼 수 없다.
    - question: |
        면접관: "π0 의 attention mask 에서 사진·지시문 token 이 로봇 상태나 action token 을 보지 못하게 막은 이유는 무엇인가요?"
      choices:
        - 'PaliGemma 가 pretraining 에서 본 적 없는 로봇 입력이 섞여 그동안 배운 계산이 흐트러지는 일을 줄이려고'
        - '사진 token 이 너무 많아 attention 계산이 메모리에 들어가지 않기 때문에'
        - '사진 token 이 action 을 보면 학습 데이터의 정답이 새어 나가기 때문에'
        - 'action expert 의 width 가 PaliGemma 와 달라 두 묶음 사이에 attention 을 계산할 수 없기 때문에'
      answer: 0
      explanation: |
        논문 부록에 따르면 첫 block 은 PaliGemma 가 pretraining 에서 다룬 입력이라, 새 입력을 보지 못하게 막아 pretraining 과의 차이를
        줄인다. 덕분에 이 block 의 계산은 action 이 바뀌어도 같아서 저장해 다시 쓸 수도 있다. 메모리 문제는 저자들이 든 이유가 아니고,
        실제로 뒤 block 이 앞 block 을 보는 attention 은 그대로 계산한다. 정답이 새는 문제도 저자들이 든 이유가 아니다. 두 묶음은 width 가
        달라도 attention 에서 만나 정보를 주고받으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "π0 의 로봇 상태 token 은 action token 을 보지 못하게 되어 있습니다. 이 규칙을 없애 로봇 상태 token 이 action token 을
        보게 하면 추론에서 무엇이 달라지나요?"
      choices:
        - '아무것도 달라지지 않는다. 로봇 상태는 숫자 몇 개라 attention 과 관계없다'
        - '로봇 상태 token 이 사진을 볼 수 없게 된다'
        - 'action chunk 의 길이가 줄어든다'
        - 'action 이 Euler step 마다 바뀌므로 로봇 상태 token 의 계산도 step 마다 다시 해야 하고, 그 결과를 한 번 계산해 저장해 둘 수 없다'
      answer: 3
      explanation: |
        attention 으로 가져오는 내용이 보는 대상에 따라 정해지므로, 바뀌는 action token 을 보면 로봇 상태 token 의 결과도 step 마다 바뀐다.
        저자들은 이 결과를 저장해 다시 쓰려고 로봇 상태를 따로 block 으로 두고 action 을 보지 못하게 했다. 로봇 상태도 token 하나가 되어
        attention 에 들어가므로 첫 보기는 틀렸다. 로봇 상태 token 이 사진을 보는 규칙은 그대로라서 둘째 보기도 맞지 않다. chunk 길이는
        mask 와 상관없이 정해 둔 값이다.

- topic: flow-chunk
  title: flow matching 으로 만드는 action chunk
  variants:
    - question: |
        면접관: "π0 논문은 noise 가 섞인 action 을 $A_t^\tau = \tau A_t + (1 - \tau)\epsilon$ 으로 적습니다. 여기서 아래첨자 $t$ 와
        위첨자 $\tau$ 는 각각 무엇인가요?"
      choices:
        - '둘 다 flow matching 의 시각이고, 표기만 다르다'
        - '$t$ 는 flow matching 의 시각이고, $\tau$ 는 로봇의 제어 주기다'
        - '$t$ 는 action chunk 의 길이이고, $\tau$ 는 Euler step 의 수다'
        - '$t$ 는 로봇이 몇 번째 step 에 있는지이고, $\tau$ 는 noise($\tau = 0$)에서 시연 chunk($\tau = 1$)로 옮기는 flow matching 의 시각이다'
      answer: 3
      explanation: |
        π0 논문은 로봇의 시각을 아래첨자로 적고 flow matching 의 시각을 위첨자로 적는다. $\tau = 0$ 이면 noise 그대로이고 $\tau = 1$ 이면
        시연 chunk 그대로다. 두 시각은 서로 다른 것을 세므로 첫 보기는 틀렸다. 둘째 보기는 두 기호의 역할을 바꿔 놓았고, $\tau$ 는 주기가
        아니다. chunk 길이는 $H$ 로 적고, Euler step 수는 $1 / \delta$ 로 정해진다.
    - question: |
        면접관: "π0 는 $A^\tau = \tau A + (1 - \tau)\epsilon$ 으로 시연 chunk $A$ 와 noise $\epsilon$ 을 섞고, 추론 때 $\tau = 0$ 에서 출발해
        Euler step 으로 속도를 더해 갑니다. network 가 맞혀야 하는 target velocity 는 무엇인가요?"
      choices:
        - '$\epsilon$. 섞인 noise 를 맞힌다'
        - '$A - \epsilon$. $\tau$ 가 1 늘 때 $A^\tau$ 가 변하는 양이다'
        - '$\epsilon - A$. 시연에서 noise 쪽으로 가는 방향이다'
        - '$A$. 시연 chunk 를 바로 맞힌다'
      answer: 1
      explanation: |
        섞는 식은 $\epsilon + \tau (A - \epsilon)$ 으로 다시 쓸 수 있어서 $\tau$ 가 1 늘 때 $A - \epsilon$ 만큼 움직이고, $\tau = 0$ 에서
        이 속도를 더해 가면 시연 쪽에 닿는다. noise 를 맞히는 것은 DDPM 의 방식이다. $\epsilon - A$ 를 맞히면 속도를 더할수록 시연에서
        멀어지는데, openpi 코드처럼 시각의 방향까지 함께 뒤집을 때만 맞다. 시연 chunk 를 바로 맞히면 시연이 갈린 장면에서 평균을 낸다.
    - question: |
        면접관: "π0 는 학습할 때 flow matching 의 시각 $\tau$ 를 0 과 1 사이에서 고르게 뽑지 않고 noise 쪽($\tau$ 가 작은 쪽)을 더 자주
        뽑습니다. 저자들이 든 이유는 무엇인가요?"
      choices:
        - 'noise 가 많은 구간은 정답 속도가 0 이라서 학습하기 쉽기 때문이다'
        - '추론에서 Euler step 을 $\tau = 0$ 근처에서만 밟기 때문이다'
        - '로봇의 관측이 가능한 action 을 크게 좁혀서, noise 가 많은 구간에서 관측에 맞는 평균 action 을 맞히는 일이 이미지 생성보다 어렵기 때문이다'
        - 'beta 분포가 uniform 분포보다 계산이 빠르기 때문이다'
      answer: 2
      explanation: |
        noise 가 많은 구간에서 network 는 관측에 맞는 평균 action 쪽으로 가는 속도를 맞혀야 한다. 저자들은 로봇의 관측이 글 지시보다 정답을
        훨씬 좁혀서 이 일이 어렵다고 보고 그 구간을 더 많이 학습시켰다. noise 가 많은 구간의 정답 속도도 $A - \epsilon$ 이라 0 이 아니다.
        추론은 $\tau = 0$ 부터 1 까지 10 step 을 고르게 밟으므로 둘째 보기도 틀렸다. 이 분포는 계산 속도가 아니라 어느 구간을 더 학습할지를
        보고 골랐다.

- topic: multimodal
  title: 정답이 여럿인 시연과 flow matching
  variants:
    - question: |
        면접관: "같은 장면에서 시연자가 장애물을 왼쪽으로 비켜 가기도 하고 오른쪽으로 비켜 가기도 했습니다. 이 시연으로 action 을 차이의 제곱이
        작아지도록 바로 맞히는 모델과 flow matching 모델을 학습하면 각각 어떤 action 을 내나요?"
      choices:
        - '바로 맞히는 모델은 두 길의 평균인 정면으로 가고, flow matching 모델은 출발한 noise 에 따라 왼쪽이나 오른쪽 가운데 하나로 간다'
        - '두 모델 모두 두 길의 평균인 정면으로 간다'
        - '바로 맞히는 모델은 왼쪽이나 오른쪽 가운데 하나로 가고, flow matching 모델은 평균으로 간다'
        - '두 모델 모두 왼쪽과 오른쪽을 번갈아 낸다'
      answer: 0
      explanation: |
        차이의 제곱을 가장 작게 하는 출력은 정답들의 평균이라서 바로 맞히는 모델은 두 시연 어디에도 없는 정면 길을 낸다. flow matching 은
        noise 에서 출발해 배운 속도를 따라가므로 출발점에 따라 봉우리 하나에 도착한다. 평균으로 가는 것은 바로 맞히는 모델뿐이라 둘째 보기는
        틀렸다. 셋째 보기는 두 모델의 결과를 바꿔 놓았다. 번갈아 내는 규칙은 어느 모델에도 없다.
    - question: |
        면접관: "π0 를 'multimodal 모델' 이라고 부를 때와 '시연이 multimodal 이다' 라고 할 때, multimodal 의 뜻은 어떻게 다른가요?"
      choices:
        - '둘 다 사진·지시문·관절 각도처럼 입력의 종류가 여럿이라는 뜻이다'
        - '둘 다 같은 장면의 정답 action 이 여럿이라는 뜻이다'
        - '앞은 입력의 종류(사진·지시문·관절 각도)가 여럿이라는 뜻이고, 뒤는 같은 장면의 정답 action 이 여러 봉우리로 갈린다는 뜻이다'
        - '앞은 로봇이 여러 대라는 뜻이고, 뒤는 카메라가 여러 대라는 뜻이다'
      answer: 2
      explanation: |
        모델을 multimodal 이라고 할 때는 시각·언어·몸의 감각처럼 받는 입력의 종류가 여럿이라는 뜻이다. 시연이 multimodal 이라고 할 때는 같은
        장면에서 옳은 action 이 여럿이라 분포에 봉우리가 여럿이라는 뜻이고, 이 쓰임은 통계의 mode(가장 자주 나온 값)에서 왔다. 첫 보기는
        두 번째 쓰임을 놓쳤고, 둘째 보기는 첫 번째 쓰임을 놓쳤다. 로봇과 카메라의 대수는 multimodal 의 뜻과 관계없다.
    - question: |
        면접관: "시연이 두 봉우리로 갈린 데이터로 학습한 flow matching 모델을 Euler step 1 번으로 sampling 하면 어떤 결과가 나오나요?"
      choices:
        - '출발한 noise 에 따라 두 봉우리 가운데 하나에 정확히 닿는다'
        - '출발점과 상관없이 데이터의 평균 근처로 가서 두 봉우리 어디에도 없는 값이 나온다'
        - 'step 수와 상관없이 늘 같은 결과가 나온다'
        - '두 봉우리 사이를 오가며 끝나지 않는다'
      answer: 1
      explanation: |
        $\tau = 0$ 에서 network 가 내는 속도는 어느 봉우리로 갈지 아직 모르는 상태의 평균이라서, 그 속도로 한 번에 끝까지 가면 데이터의 평균에
        닿는다. 경로가 휘는 구간을 따라가려면 step 이 여러 번 필요하고, π0 는 10 step 을 쓴다. 봉우리 하나에 정확히 닿는 것은 step 이 충분할
        때다. step 수와 상관없이 같은 결과가 나오는 것은 정답이 하나뿐인 직선 경로일 때다. Euler step 은 정해진 횟수만큼만 밟으므로 끝나지
        않는 일은 없다.

- topic: kv-cache
  title: KV cache 와 추론 시간
  variants:
    - question: |
        면접관: "π0 는 Euler step 10 번으로 action chunk 를 만드는데, VLM 쪽 계산은 chunk 하나에 한 번만 합니다. 이것이 가능한 이유는
        무엇인가요?"
      choices:
        - 'VLM 이 10 번 가운데 첫 step 의 action 만 보고 나머지 step 에서는 사진을 보지 않기 때문이다'
        - '사진·지시문·로봇 상태 token 은 attention mask 때문에 바뀌는 action token 을 보지 않아서, 그 key·value 를 한 번 계산해 저장해 두고 다시 쓸 수 있기 때문이다'
        - '사진을 한 장만 쓰기 때문이다'
        - 'action expert 가 VLM 의 출력을 글로 요약해 기억하기 때문이다'
      answer: 1
      explanation: |
        step 마다 바뀌는 것은 action token 뿐이고, 앞의 token 들은 action 을 보지 않으므로 계산 결과가 10 번 모두 같다. 그래서 그 key 와
        value 를 저장해 두는 KV cache 를 쓰고 step 마다 action token 만 다시 계산한다. action token 은 step 마다 저장된 key·value 전체를
        attention 으로 다시 보므로 사진을 덜 보는 것이 아니다. π0 는 카메라 여러 대의 사진을 함께 넣으므로 셋째 보기는 이유가 아니다.
        action expert 는 글을 만들지 않는다.
    - question: |
        면접관: "image encoder 에 20 ms, 사진·지시문·상태 token 계산에 40 ms, action token 계산 한 번에 3 ms 가 걸리는 π0 꼴의 모델이 Euler
        10 step 으로 chunk 하나를 만듭니다. KV cache 를 쓰면 chunk 하나에 몇 ms 가 걸리나요?"
      choices:
        - '30 ms'
        - '63 ms'
        - '630 ms'
        - '90 ms'
      answer: 3
      explanation: |
        KV cache 를 쓰면 image encoder 와 사진·지시문·상태 계산은 한 번만 하고 action 계산만 10 번 해서 $20 + 40 + 10 \times 3 = 90$ ms 다.
        30 ms 는 action 계산 10 번만 더하고 앞의 두 계산을 빠뜨렸다. 63 ms 는 action 계산을 한 번만 셌다. 630 ms 는 cache 없이 step 마다
        사진부터 다시 계산할 때의 시간이다.
    - question: |
        면접관: "KV cache 를 쓰는 π0 가 action 을 만들 때 사진 정보를 덜 쓰게 된다는 주장이 있습니다. 맞나요?"
      choices:
        - '아니요. action token 은 step 마다 모든 층의 저장된 key·value 전체를 attention 으로 다시 보므로 사진 정보는 그대로이고, 줄어드는 것은 같은 계산을 되풀이하는 시간이다'
        - '네. 첫 Euler step 만 사진을 보고 나머지 step 은 사진 없이 계산한다'
        - '네. cache 에는 사진 token 가운데 일부만 저장된다'
        - '아니요. KV cache 는 학습할 때만 쓰고 추론할 때는 쓰지 않는다'
      answer: 0
      explanation: |
        cache 는 바뀌지 않는 token 의 key 와 value 를 저장해 둘 뿐이고, action token 은 step 마다 그 전체를 attention 으로 본다. 그래서 결과는
        cache 없이 매번 계산한 것과 같고 시간만 줄어든다. 모든 step 이 저장된 사진 key·value 를 보므로 둘째 보기는 틀렸다. cache 에는 바뀌지
        않는 token 의 key·value 가 모두 들어간다. KV cache 는 같은 관측으로 여러 번 계산하는 추론에서 쓰는 방법이다.

- topic: chunk-execution
  title: chunk 실행과 비동기 추론
  variants:
    - question: |
        면접관: "50 Hz 로봇에서 π0 는 action 50 개짜리 chunk 를 만들고도 25 개만 실행한 뒤 다시 추론합니다. chunk 를 끝까지 쓰지 않는 이유는
        무엇인가요?"
      choices:
        - '뒤쪽 25 개는 항상 noise 가 남아 쓸 수 없기 때문이다'
        - 'GPU 메모리에 action 이 25 개까지만 들어가기 때문이다'
        - 'chunk 를 실행하는 동안은 새 사진을 보지 않으므로, 짧게 끊어 다시 추론할수록 바뀐 상황에 빨리 반응하기 때문이다'
        - '25 개를 실행하는 동안 temporal ensembling 으로 두 chunk 를 평균해야 하기 때문이다'
      answer: 2
      explanation: |
        chunk 는 추론한 순간의 관측으로 만든 계획이라 실행하는 동안 장면이 바뀌어도 반영하지 못한다. 그래서 일부만 실행하고 새 관측으로 다시
        추론하면 반응이 빨라진다. Euler step 을 끝까지 밟으면 chunk 전체에서 noise 가 걷히므로 첫 보기는 틀렸다. action 50 개는 숫자 수백
        개라 메모리 제한과 관계없다. 저자들은 temporal ensembling 이 오히려 성능을 떨어뜨려서 평균 없이 chunk 를 그대로 실행했다.
    - question: |
        면접관: "chunk 하나를 실행하고 나서야 추론을 시작하면 로봇이 잠깐씩 멈춥니다. 비동기 추론은 이 문제를 어떻게 없애나요?"
      choices:
        - '실행 중인 chunk 가 끝나기 전, 남은 action 을 실행하는 시간이 추론 시간보다 길 때 다음 추론을 시작해 실행과 계산을 겹친다'
        - '추론을 건너뛰고 지난 chunk 를 처음부터 다시 실행한다'
        - 'GPU 를 두 장 써서 추론 시간을 0 으로 만든다'
        - '제어 주기를 낮춰 action 하나를 더 오래 실행한다'
      answer: 0
      explanation: |
        비동기 추론은 실행하는 동안 다음 chunk 를 계산한다. 예를 들어 추론이 73 ms 걸리고 action 하나가 20 ms 라면 4 개(80 ms)가 남았을 때
        시작해야 새 chunk 가 제때 온다. 지난 chunk 를 되풀이하면 장면이 바뀐 것을 반영하지 못한다. GPU 를 늘려도 추론 시간은 0 이 되지
        않는다. 제어 주기를 낮추면 움직임이 거칠어질 뿐 멈춤의 원인인 추론 대기는 그대로다.
    - question: |
        면접관: "추론이 150 ms 걸리는 모델을 50 Hz 로봇에서 비동기로 씁니다. 다음 추론은 실행할 action 이 몇 개 이상 남았을 때 시작해야
        멈추지 않나요?"
      choices:
        - '3 개'
        - '5 개'
        - '7 개'
        - '8 개'
      answer: 3
      explanation: |
        50 Hz 에서 action 하나는 20 ms 이므로, 남은 action 을 실행하는 시간이 150 ms 이상이어야 한다. $150 \div 20 = 7.5$ 라서 8 개(160 ms)가
        있어야 한다. 3 개는 60 ms 이고 5 개는 100 ms 라서 추론이 끝나기 전에 action 이 떨어진다. 7 개도 140 ms 라 10 ms 가 모자란다.

- topic: training-recipe
  title: pretraining 과 fine-tuning
  variants:
    - question: |
        면접관: "π0 는 여러 로봇의 다양한 데이터로 pretraining 한 뒤 작업 하나의 질 좋은 데이터로 fine-tuning 합니다. 질 좋은 데이터만으로
        학습하지 않고 두 단계를 거치는 이유는 무엇인가요?"
      choices:
        - '질 좋은 데이터는 action 이 연속값이 아니라서 flow matching 으로 학습할 수 없기 때문이다'
        - 'pretraining 이 끝나면 fine-tuning 없이도 모든 작업을 완벽하게 하기 때문이다'
        - '두 단계로 나누면 학습 GPU 시간이 5 분의 1 로 줄기 때문이다'
        - '질 좋은 데이터에는 실수가 거의 없어 회복하는 법을 배우지 못하고, 다양한 pretraining 데이터가 실수와 회복을 담고 있기 때문이다'
      answer: 3
      explanation: |
        저자들에 따르면 질 좋은 데이터만으로 학습한 모델은 실수에서 회복하지 못하고, 다양하지만 거친 데이터만으로는 매끄럽게 수행하지
        못한다. 둘을 함께 쓰면 평소에는 질 좋은 데이터처럼 움직이고 실수하면 pretraining 에서 본 회복 동작을 쓴다. 질 좋은 데이터도 연속된
        action 값이라 flow matching 으로 학습한다. 복잡한 작업은 pretraining 만으로 부족해서 fine-tuning 이 필요했다. 5 분의 1 의 학습
        시간은 π0-FAST 의 결과라서 단계를 나눈 것과 관계없다.
    - question: |
        면접관: "π0 논문에서 pretraining 만 한 모델, fine-tuning 데이터로만 처음부터 학습한 모델, pretraining 후 fine-tuning 한 모델을
        빨래 개기·상자 접기 같은 긴 작업에서 비교했습니다. 결과는 어땠나요?"
      choices:
        - '처음부터 학습한 모델이 가장 좋았다'
        - 'pretraining 후 fine-tuning 한 모델이 가장 좋았고, 어려운 작업일수록 pretraining 의 효과가 컸다'
        - '세 모델의 점수가 거의 같았다'
        - 'pretraining 만 한 모델이 가장 좋았다'
      answer: 1
      explanation: |
        논문에 따르면 pretraining 후 fine-tuning 한 π0 가 긴 작업 전반에서 가장 좋았고, 어려운 작업일수록 처음부터 학습한 모델과의 차이가
        컸다. 저자들은 질 좋은 데이터만으로 학습한 모델이 실수에서 잘 회복하지 못한다고 설명했으므로 첫 보기는 틀렸다. 어려운 작업에서
        점수 차이가 컸으므로 셋째 보기도 틀렸다. pretraining 만 한 모델은 fine-tuning 데이터에 담긴 매끄러운 수행 방식을 배우지 못해 가장
        좋은 결과를 내지 못했다.
    - question: |
        면접관: "π0 는 action 의 숫자 개수가 다른 여러 로봇의 데이터를 한 모델로 pretraining 합니다. 숫자 개수가 다른 문제를 어떻게
        처리하나요?"
      choices:
        - '로봇마다 action expert 를 따로 학습한다'
        - '숫자가 가장 적은 로봇에 맞춰 큰 로봇의 숫자를 잘라 낸다'
        - '모든 로봇의 action 과 로봇 상태를 가장 큰 로봇의 숫자 개수에 맞추고, 모자라는 자리를 0 으로 채운다'
        - '숫자 개수가 같은 로봇의 데이터만 골라 학습한다'
      answer: 2
      explanation: |
        π0 는 데이터에서 가장 큰 로봇의 숫자 개수(논문에서는 18)로 action 과 로봇 상태의 자리를 정하고, 작은 로봇은 남는 자리를 0 으로
        채워 한 모델에 넣는다. action expert 는 하나뿐이라 첫 보기는 틀렸다. 숫자를 잘라 내면 큰 로봇의 관절을 제어할 수 없다. 여러 로봇의
        데이터를 섞는 것이 pretraining 의 목적이라 한 종류만 고르면 그 목적이 사라진다.

- topic: pi0-fast
  title: π0-FAST 와 π0 의 차이
  variants:
    - question: |
        면접관: "π0-FAST 는 π0 와 같은 PaliGemma backbone 을 쓰지만 action expert 와 flow matching 대신 FAST token 을 하나씩 내는 방식으로
        action 을 만듭니다. 두 모델을 비교하면 어떤 차이가 나나요?"
      choices:
        - 'π0-FAST 는 학습에 든 GPU 시간이 훨씬 적지만, token 을 하나씩 내느라 추론이 π0 보다 훨씬 느리다'
        - 'π0-FAST 는 학습과 추론 모두 π0 보다 느리다'
        - 'π0-FAST 는 학습과 추론 모두 π0 보다 빠르다'
        - 'π0-FAST 는 추론이 빠르지만 학습에 든 GPU 시간이 훨씬 많다'
      answer: 0
      explanation: |
        FAST 논문에 따르면 π0-FAST 는 π0 와 비슷한 점수를 내면서 학습 GPU 시간은 약 5 분의 1 이었다. 대신 30 ~ 60 개의 token 을 하나씩 내고
        token 마다 20 억 parameter 언어 모델 전체를 거쳐서, 1 초 분량 chunk 에 약 750 ms 가 걸렸다. 학습은 π0-FAST 가 더 빨랐으므로 둘째
        보기는 틀렸다. 추론은 π0 의 flow matching 10 step 이 더 빨랐으므로 셋째 보기도 틀렸다. 넷째 보기는 두 모델의 장단점을 거꾸로
        적었다.
    - question: |
        면접관: "π0-FAST 의 추론은 1 초 분량 chunk 에 약 750 ms 가 걸리고, π0 는 100 ms 가 안 걸립니다. π0-FAST 가 느린 가장 큰 이유는
        무엇인가요?"
      choices:
        - 'FAST 의 DCT 를 되돌리는 계산이 750 ms 걸리기 때문이다'
        - 'π0-FAST 는 카메라 사진을 더 많이 받기 때문이다'
        - 'action token 30 ~ 60 개를 차례로 하나씩 내야 하고, token 마다 20 억 parameter 언어 모델 전체를 거쳐야 하기 때문이다'
        - 'π0-FAST 는 KV cache 를 쓸 수 없기 때문이다'
      answer: 2
      explanation: |
        다음 token 은 앞의 token 을 보고 골라야 해서 30 ~ 60 번의 계산을 차례로 해야 하고, 그 계산마다 큰 언어 모델을 거친다. π0 는 3 억
        parameter 의 action expert 로 10 step 만 계산한다. DCT 를 되돌리는 것은 행렬 곱 한 번 정도의 가벼운 계산이다. 두 모델이 받는 사진은
        같다. token 을 하나씩 내는 언어 모델도 보통 KV cache 로 앞 token 의 계산을 다시 하지 않으므로, cache 가 이유는 아니다.
    - question: |
        면접관: "π0.5 는 pretraining 에서 action 을 FAST token 으로 학습하고, post-training 에서 π0 와 같은 action expert 를 더해 flow matching
        으로 action 을 만듭니다. 두 방식을 이렇게 나눠 쓰는 이유는 무엇인가요?"
      choices:
        - 'FAST token 은 웹 데이터에만 쓸 수 있고 로봇 데이터에는 쓸 수 없기 때문이다'
        - 'token 으로 학습하면 학습이 빠르고, 실행할 때는 flow matching 이 token 을 하나씩 내는 것보다 빠르게 action 을 만들기 때문이다'
        - 'flow matching 은 pretraining 에서 학습이 되지 않기 때문이다'
        - 'action expert 를 더하면 웹 데이터를 쓸 필요가 없어지기 때문이다'
      answer: 1
      explanation: |
        π0.5 저자들은 FAST 처럼 압축한 token 으로 학습하면 VLA 학습이 훨씬 빠르지만 token 을 하나씩 내는 추론은 느리다고 보고, 학습은 token
        으로 하고 실행할 때는 flow matching 으로 연속된 action 을 빠르게 만들게 했다. FAST token 은 로봇 action 을 압축한 것이라 첫 보기는
        틀렸다. π0 는 pretraining 부터 flow matching 으로 학습했으므로 셋째 보기도 틀렸다. π0.5 는 post-training 에서도 웹 데이터를 섞어 사진과
        말을 이해하는 능력을 지킨다.
