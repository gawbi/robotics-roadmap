# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: token-weakness
  title: action token 방식의 약점과 action chunk
  variants:
    - question: |
        50 Hz 로 제어하는 로봇을 VLA 로 움직이려 한다. action 을 token 으로 하나씩 내는 방식(OpenVLA)은 부족하고 action chunk 가
        해결책이 되는 이유로 옳은 것은?
      choices:
        - 'token 방식은 너무 정밀해서 로봇이 그 값을 따라가지 못하기 때문이다'
        - 'action chunk 를 쓰면 추론 한 번이 언제나 20 ms 보다 짧아지기 때문이다'
        - 'token 방식은 추론 한 번에 action 하나만 나와 1 초에 필요한 action 수를 못 채우지만, chunk 는 한 번에 여러 step 의 action 을 내므로 추론이 덩어리 하나를 실행하는 시간 안에만 끝나면 되기 때문이다'
        - '50 Hz 로봇은 지시문을 읽지 않아도 되므로 VLM 이 필요 없기 때문이다'
      answer: 2
      explanation: |
        50 Hz 로 움직이려면 1 초에 action 이 50 개 필요한데, token 방식은 모델을 차원 수만큼 차례로 돌려야 action 하나가 나와서 이 수를
        채우지 못한다. action chunk 는 추론 한 번에 여러 step 분의 action 을 주므로, 추론 자체가 20 ms 보다 길어도 덩어리를 다 쓰기 전에만
        끝나면 로봇은 기다리지 않는다. token 방식은 칸으로 잘라 오히려 정밀도를 잃고, VLM 은 사진과 지시문을 읽는 데 여전히 필요하다.
    - question: |
        action 을 칸 256 개의 token 으로 내는 VLA 에게 구멍에 핀을 꽂는 작업이 컵을 집는 작업보다 특히 어려운 이유는?
      choices:
        - '각도를 칸의 가운데 값으로 되돌리며 생기는 오차가 팔 끝에서 수 mm 가 되어, 1 mm 안쪽으로 맞춰야 하는 작업에는 부족하기 때문이다'
        - '"핀" 이라는 단어가 vocabulary 에 없어 지시를 이해하지 못하기 때문이다'
        - 'token 을 하나씩 내면 관절 사이의 조합이 언제나 어긋나기 때문이다'
        - '핀 꽂기는 시연을 모을 수 없는 작업이기 때문이다'
      answer: 0
      explanation: |
        칸 token 은 칸 하나에 든 여러 값을 그 칸의 가운데 값 하나로 되돌리므로 관절마다 칸 폭의 절반까지 어긋나고, 팔 끝에서는 이 각도
        오차가 수 mm 의 위치 오차가 된다. 컵 집기는 이 정도 오차를 견디지만 1 mm 안쪽으로 맞춰야 하는 핀 꽂기는 견디지 못한다. 단어 이해나
        시연 수집 가능 여부와는 상관없고, 하나씩 내는 방식은 오히려 앞 차원을 보고 다음 차원을 골라 조합을 맞추는 쪽이다.
    - question: |
        π0 가 action 을 칸 token 대신 연속된 숫자 그대로 낸다는 것이 바꾸는 점으로 옳은 것은?
      choices:
        - 'vocabulary 의 드문 token 을 action 용으로 덮어써야 한다'
        - '관절마다 칸 폭의 절반만큼 오차가 남는다'
        - 'action 하나를 내려면 모델을 action 차원 수만큼 차례로 돌려야 한다'
        - '칸 폭 때문에 생기는 오차가 없고, action 이 token 이 아니므로 vocabulary 를 고칠 필요도 없다'
      answer: 3
      explanation: |
        숫자 그대로 내면 칸으로 자르는 단계가 없으므로 칸 폭에서 오는 오차가 사라지고, action 을 vocabulary 의 token 에 짝지을 필요도 없다.
        드문 token 덮어쓰기와 칸 폭 절반의 오차는 token 방식의 특징이다. 차원마다 모델을 차례로 돌리는 것도 token 을 하나씩 고르는 방식의
        특징이고, π0 는 덩어리 전체의 숫자를 함께 고친다.

- topic: expert-structure
  title: VLM 몸통과 action expert 의 역할
  variants:
    - question: |
        π0 의 두 부분인 VLM 몸통(PaliGemma)과 action expert 가 맡는 일을 바르게 나눈 것은?
      choices:
        - 'VLM 몸통이 관절 각도와 action 덩어리를 받고, action expert 가 사진과 지시문을 읽는다'
        - 'VLM 몸통이 사진과 지시문을 읽고, action expert 가 로봇 상태와 noise 가 섞인 action 덩어리를 받아 그 덩어리를 고칠 속도(velocity)를 낸다'
        - '두 부분은 모든 token 을 같은 weight 로 처리하고 이름만 다르다'
        - 'action expert 가 지시문을 글로 다시 써서 VLM 몸통에 넘긴다'
      answer: 1
      explanation: |
        사진과 지시문은 VLM 이 인터넷 데이터로 미리 다뤄 본 종류의 입력이라 PaliGemma 의 weight 가 맡는다. 관절 각도와 noise 가 섞인 action
        덩어리는 VLM 이 본 적 없는 로봇 입력이라 action expert 의 weight 가 맡고, action expert 는 덩어리를 어느 쪽으로 얼마나 고칠지를
        숫자로 낸다. token 마다 다른 weight 묶음으로 보내는 것이 expert 라는 이름의 뜻이고, action expert 는 글을 쓰지 않는다.
    - question: |
        π0 의 action expert 는 Gemma 와 같은 transformer 구조로 만들었다. 그런데도 action expert 를 LLM 이라고 부르지 않는 이유는?
      choices:
        - 'transformer 가 아닌 다른 구조를 쓰기 때문이다'
        - '인터넷 글로 미리 학습한 weight 를 그대로 쓰기 때문이다'
        - '출력이 vocabulary 의 token 마다 확률이기 때문이다'
        - '무작위 weight 에서 출발해 로봇 시연만으로 학습했고, vocabulary 없이 action 마다 연속된 숫자를 내기 때문이다'
      answer: 3
      explanation: |
        같은 구조라도 무엇으로 학습했고 무엇을 내는지가 모델의 성격을 정한다. LLM 은 글로 학습해 vocabulary 의 token 마다 확률을 내지만,
        action expert 는 로봇 시연으로 처음부터 학습해 action token 마다 관절 속도 같은 숫자를 낸다. 구조는 transformer 가 맞으므로 첫 보기는
        틀리고, 글로 학습한 weight 와 token 확률 출력은 LLM 쪽 특징이다.
    - question: |
        π0 의 action expert 를 VLM 몸통보다 훨씬 작게(약 10 분의 1) 만든 이유로 옳은 것은?
      choices:
        - 'action 덩어리 하나를 만드는 동안 action expert 는 Euler step 마다 여러 번 돌려야 해서, 작아야 추론이 빠르기 때문이다'
        - 'action 은 숫자가 적어서 학습할 것이 거의 없기 때문이다'
        - 'action expert 도 사진을 직접 읽어야 해서 메모리가 모자라기 때문이다'
        - '작은 모델이 언제나 큰 모델보다 정확하기 때문이다'
      answer: 0
      explanation: |
        덩어리 하나를 만들 때 VLM 쪽 계산은 한 번이면 되지만 action expert 는 Euler step 수만큼 되풀이해 돌린다. 되풀이되는 쪽을 작게 만들면
        전체 추론 시간이 크게 줄어서, 논문도 추론을 빠르게 하려고 작게 만들었다고 적었다. action 을 만드는 일도 배울 것이 많고, 사진은
        VLM 몸통이 읽는다. 작은 모델이 늘 더 정확한 것도 아니다.

- topic: attention-mask
  title: attention mask 의 세 block
  variants:
    - question: |
        π0 의 action expert 는 VLM 몸통과 weight 묶음이 따로인데도, 사진 내용을 반영한 action 을 낸다. 이것이 가능한 이유는?
      choices:
        - '두 weight 묶음이 층마다 self-attention 에서 만나, action token 이 사진·지시문 token 의 key·value 를 보고 필요한 내용을 가져오기 때문이다'
        - 'action expert 가 사진의 pixel 을 직접 입력으로 받기 때문이다'
        - 'VLM 몸통이 사진 내용을 문장으로 써서 action expert 에 지시문으로 넘기기 때문이다'
        - '두 부분이 사실은 같은 weight 를 함께 쓰기 때문이다'
      answer: 0
      explanation: |
        image token 의 key·value 는 VLM 의 weight 로, action token 의 query 는 action expert 의 weight 로 만들지만, 숫자의 길이만 맞춰 두면
        attention 계산에서 서로를 볼 수 있다. 그래서 층을 지날 때마다 action token 이 사진과 지시문에서 필요한 내용을 섞어 가져온다.
        action expert 가 pixel 을 직접 받거나 VLM 이 문장을 써 주는 것이 아니고, weight 는 실제로 두 묶음으로 나뉘어 있다.
    - question: |
        π0 는 token 을 사진·지시문, 로봇 상태, noise 가 섞인 action 의 세 block 으로 나누고 뒤쪽 block 만 앞쪽 block 을 보게 한다.
        사진·지시문 block 이 뒤의 로봇 token 을 보지 못하게 막는 이유는?
      choices:
        - 'action token 의 수가 너무 많아 계산할 수 없기 때문이다'
        - '사진·지시문은 로봇 상태보다 덜 중요하기 때문이다'
        - 'PaliGemma 가 미리 학습할 때 본 적 없는 로봇 입력이 섞이지 않게 해, 미리 배운 계산이 흐트러지지 않게 하려는 것이다'
        - 'GPT-2 의 causal mask 처럼 글을 왼쪽에서 오른쪽으로 한 token 씩 생성하려는 것이다'
      answer: 2
      explanation: |
        PaliGemma 는 사진과 글만으로 미리 학습했으므로, 그 token 들이 관절 각도나 noise 섞인 action 을 보기 시작하면 미리 배운 계산이
        흐트러질 수 있다. 막아 두면 사진·지시문 쪽은 원래 하던 대로 계산한다. 계산량이나 중요도 때문이 아니고, π0 는 글을 생성하지
        않으므로 왼쪽에서 오른쪽으로 하나씩 만드는 causal mask 와 목적이 다르다.
    - question: |
        π0 의 attention mask 에서 로봇 상태 token 이 action token 을 보지 못하게 막아 두면 얻는 이점은?
      choices:
        - 'action token 50 개가 서로를 보지 못해 각자 따로 계산된다'
        - 'Euler step 마다 바뀌는 action token 과 상관없이 로봇 상태 token 의 계산 결과가 같아서, 한 번 계산해 저장해 두고 다시 쓸 수 있다'
        - '로봇 상태 token 이 사진도 보지 못하게 되어 계산이 줄어든다'
        - 'action 덩어리가 로봇 상태와 상관없이 만들어져 어느 로봇에나 쓸 수 있다'
      answer: 1
      explanation: |
        로봇 상태 token 이 action token 을 볼 수 있다면, action 이 바뀔 때마다 로봇 상태 token 이 가져오는 내용도 바뀌어 매번 다시 계산해야
        한다. 막아 두면 그 결과가 Euler step 내내 같아서 한 번만 계산하면 된다. action token 끼리는 같은 block 이라 서로를 다 보고, 로봇 상태
        token 은 앞쪽의 사진·지시문을 본다. action token 은 로봇 상태를 보므로 덩어리는 로봇 상태를 반영한다.

- topic: multimodal
  title: multimodal 의 두 뜻과 봉우리 고르기
  variants:
    - question: |
        같은 장면에서 시연자가 상자를 오른쪽으로 비켜 가기도 하고 왼쪽으로 비켜 가기도 했다. action 을 바로 맞히도록 차이의 제곱을 줄여
        학습한 모델과, flow matching 으로 학습한 π0 는 각각 무엇을 낼 가능성이 큰가?
      choices:
        - '둘 다 오른쪽과 왼쪽 가운데 하나를 고른다'
        - '차이의 제곱을 줄인 모델은 하나를 고르고, flow matching 은 평균을 낸다'
        - '둘 다 두 시연의 평균, 곧 상자 정면으로 곧장 가는 길을 낸다'
        - '차이의 제곱을 줄인 모델은 두 정답의 평균(상자 정면으로 가는 길)을 내고, flow matching 은 noise 에서 출발해 두 봉우리 가운데 하나에 도착한다'
      answer: 3
      explanation: |
        차이의 제곱을 가장 작게 만드는 답 하나는 두 정답의 평균이라, 그 모델은 오른쪽도 왼쪽도 아닌 정면을 낸다. 이것은 두 시연 어디에도 없는
        실패다. flow matching 은 noise 에서 출발해 조금씩 옮겨 가며, noise 가 어느 쪽에 가까웠는지에 따라 봉우리 하나에 닿는다. 그래서 두
        모델의 행동은 반대로 짝지은 보기나 둘을 같게 본 보기와 다르다.
    - question: |
        (가) "π0 는 사진 여러 장·지시문·관절 각도를 함께 받는 multimodal 모델이다" (나) "시연이 multimodal 이라 차이의 제곱을 줄이도록
        학습하면 평균 action 이 나온다" 에서 multimodal 의 뜻을 바르게 짝지은 것은?
      choices:
        - '(가)(나) 모두 입력의 종류가 여럿이라는 뜻이다'
        - '(가) 는 입력의 종류가 여럿이라는 뜻이고, (나) 는 같은 장면에 정답 action 이 여럿이라 분포의 봉우리가 여럿이라는 뜻이다'
        - '(가) 는 정답 action 이 여럿이라는 뜻이고, (나) 는 입력의 종류가 여럿이라는 뜻이다'
        - '(가)(나) 모두 여러 로봇의 데이터를 섞었다는 뜻이다'
      answer: 1
      explanation: |
        (가) 의 multimodal 은 시각·언어·몸의 감각처럼 정보의 종류(modality)가 여럿이라는 뜻이다. (나) 는 통계의 mode 에서 온 말로, 같은
        장면에 정답 action 이 여러 무리로 갈려 봉우리가 여럿이라는 뜻이다. π0 는 두 뜻 모두에 해당하는 모델이라 문장마다 가려 읽어야 하고,
        여러 로봇 데이터를 섞는 것은 multimodal 과 다른 이야기다.
    - question: |
        정답이 +2 와 −2 두 무리로 갈린 시연으로 학습한 flow matching 모델에서, Euler step 을 여러 번이 아니라 단 1 번만 밟아 action 을
        만들면 어떻게 되나?
      choices:
        - 'noise 값이 그대로 나와 무작위 action 이 된다'
        - '두 봉우리 가운데 한쪽에 정확히 도착한다'
        - '출발점의 속도는 두 봉우리 쪽 속도를 섞은 값이라, 그대로 한 번에 직진하면 두 정답의 평균 근처에 머물러 시연 어디에도 없는 행동이 된다'
        - 'step 수와 상관없이 결과는 같다'
      answer: 2
      explanation: |
        noise 자리에서는 어느 봉우리로 갈지 아직 모르므로 network 는 두 정답의 속도를 가능성만큼 섞어 낸다. step 을 여러 번 밟으면 값이
        한쪽으로 조금씩 기울면서 그쪽 봉우리의 속도가 커지지만, 한 번에 직진하면 평균 쪽에 떨어진다. 한 번이라도 속도대로 움직이므로 noise
        가 그대로 나오지는 않고, step 수가 결과를 바꾸므로 마지막 보기도 틀린다.

- topic: flow-notation
  title: π0 의 flow matching 표기와 Euler 생성
  variants:
    - question: |
        π0 논문은 noise 가 섞인 action 덩어리를 $A_t^\tau = \tau A_t + (1 - \tau)\epsilon$ 으로 쓴다. 위첨자 $\tau$ 와 아래첨자 $t$ 의 뜻을
        바르게 짝지은 것은?
      choices:
        - '$\tau$ 는 로봇의 step 번호, $t$ 는 flow matching 의 시각이다'
        - '둘 다 flow matching 의 시각이다'
        - '$\tau$ 는 noise 에서 시연 덩어리 쪽으로 옮기는 flow matching 의 시각이고, $t$ 는 로봇이 몇 번째 step 에 있는지다'
        - '$\tau$ 는 learning rate, $t$ 는 Euler step 의 길이다'
      answer: 2
      explanation: |
        $\tau$ 가 0 이면 순수한 noise, 1 이면 시연 덩어리 $A_t$ 이므로 $\tau$ 가 flow matching 의 시각이다. 아래첨자 $t$ 는 "로봇 step $t$
        에서 만든 덩어리" 를 가리키는 로봇의 시각이다. 다른 자료에서 flow matching 의 시각을 $t$ 로 쓰는 경우가 많아 둘을 거꾸로 읽기 쉽다.
        learning rate 나 step 길이를 나타내는 기호는 따로 있다.
    - question: |
        π0 가 action 덩어리를 만들 때 Euler step 을 되풀이하는 과정을 바르게 설명한 것은?
      choices:
        - '무작위 noise 덩어리에서 출발해, step 마다 action expert 가 낸 속도대로 조금씩 옮겨 끝에서 action 덩어리를 얻는다'
        - '시연 덩어리에서 출발해 noise 를 조금씩 더해 간다'
        - 'action 50 개를 하나씩 차례로 만들어 이어 붙인다'
        - '한 번의 계산으로 정답 action 을 내고, Euler step 은 학습할 때만 쓴다'
      answer: 0
      explanation: |
        실행할 때는 시연이 없으므로 noise 에서 출발해야 하고, step 마다 action expert 가 지금 자리의 속도를 내면 그 방향으로 조금 직진하기를
        되풀이해 덩어리를 완성한다. noise 를 더해 가는 것은 학습 데이터를 만드는 방향이고, action 50 개는 하나씩이 아니라 덩어리 전체가 함께
        고쳐진다. Euler step 은 생성(추론) 때 쓰는 절차이며, 학습은 한 자리의 속도를 맞히는 것으로 충분하다.
    - question: |
        π0 는 학습할 때 시각 $\tau$ 를 0 ~ 1 에서 고르게 뽑지 않고 noise 쪽($\tau$ 가 작은 쪽)을 더 자주 뽑는다. 논문이 든 이유로 옳은 것은?
      choices:
        - '$\tau$ 가 큰 자리에서는 loss 를 계산할 수 없기 때문이다'
        - '추론할 때 Euler step 을 noise 쪽에서만 밟기 때문이다'
        - '$\tau$ 를 작게 뽑으면 학습 데이터가 적게 들기 때문이다'
        - '관측이 정답 행동을 상당히 좁혀 주므로, noise 가 많은 자리에서 맞는 방향을 잡는 일이 더 어렵고 중요해서 그 자리를 더 많이 연습시킨다'
      answer: 3
      explanation: |
        사진과 지시가 주어지면 맞는 행동의 범위가 꽤 좁아서, 덩어리가 거의 완성된 자리보다 noise 가 많은 출발 근처에서 방향을 잡는 일이
        더 어렵다고 논문은 보았다. 그래서 그 자리를 더 자주 뽑아 연습시킨다. loss 는 어느 $\tau$ 에서든 계산할 수 있고, 추론은 0 에서 1 까지
        모두 지난다. 뽑는 분포를 바꿔도 필요한 데이터 양은 그대로다.

- topic: inference-time
  title: KV cache 와 추론 시간
  variants:
    - question: |
        π0 가 action 덩어리 하나를 만드는 Euler step 들 동안, step 마다 다시 계산해야 하는 token 은?
      choices:
        - '카메라 사진의 image token'
        - 'noise 가 섞인 action token'
        - '지시문 token'
        - '로봇 상태 token'
      answer: 1
      explanation: |
        Euler step 마다 바뀌는 것은 고쳐 가는 action 덩어리뿐이다. attention mask 때문에 사진·지시문·로봇 상태 token 은 action token 을 보지
        않으므로, action 이 바뀌어도 그 token 들의 계산 결과는 매번 같다. 그래서 다시 계산할 것은 action token 들뿐이다.
    - question: |
        π0 에서 KV cache 를 쓰는 방식으로 옳은 것은?
      choices:
        - '모델의 weight 를 저장해 두었다가 다음 학습에 다시 쓴다'
        - '이전 덩어리의 action 을 저장해 다음 덩어리로 그대로 쓴다'
        - '바뀌는 action token 의 key·value 만 저장해 다음 Euler step 에 그대로 쓴다'
        - '바뀌지 않는 사진·지시문·로봇 상태 token 의 key·value 를 한 번만 계산해 저장하고, Euler step 마다 action token 이 그것을 꺼내 쓴다'
      answer: 3
      explanation: |
        attention 에서 action token 이 다른 token 을 보려면 층마다 그 token 의 key 와 value 가 있어야 한다. 바뀌지 않는 token 들의 key·value
        는 한 번만 계산해 두고 Euler step 마다 다시 쓰므로 같은 계산의 반복이 사라진다. action token 은 step 마다 바뀌므로 저장해 다시 쓸 수
        없고, KV cache 는 weight 나 이전 덩어리의 action 을 저장하는 것이 아니다.
    - question: |
        KV cache 덕분에 π0 는 VLM 쪽 계산을 덩어리마다 한 번만 한다. 이에 대한 설명으로 옳은 것은?
      choices:
        - 'action token 은 Euler step 마다 저장된 key·value 전체를 attention 으로 다시 보므로 사진에서 가져오는 정보는 줄지 않고, 줄어든 것은 같은 계산을 되풀이하는 시간뿐이다'
        - 'action 을 만들 때 사진을 한 번만 보게 되어 사진 정보를 덜 쓴다'
        - 'KV cache 를 쓰면 Euler step 수가 1 번으로 줄어든다'
        - 'KV cache 는 결과를 조금 바꾸므로 정확도를 희생하고 속도를 얻는 방법이다'
      answer: 0
      explanation: |
        저장한 key·value 는 다시 계산했을 때와 똑같은 값이라 결과가 바뀌지 않고, action token 은 step 마다 그 전체를 다시 본다. 그래서 사진
        정보를 덜 쓰는 것이 아니라 같은 계산을 반복하지 않을 뿐이다. Euler step 수는 그대로이고, 줄어드는 것은 시간뿐이다.

- topic: control-layers
  title: 실시간 실행의 층 구조
  variants:
    - question: |
        π0 는 50 step 짜리 action 덩어리를 만들어도 끝까지 쓰지 않고, 앞쪽 일부만 실행한 뒤 다시 추론한다. 그 이유로 옳은 것은?
      choices:
        - '덩어리를 실행하는 동안은 새 사진을 보지 않으므로, 짧게 끊어 쓸수록 바뀐 상황에 빨리 반응하기 때문이다'
        - '덩어리의 뒤쪽 절반은 늘 noise 라서 쓸 수 없기 때문이다'
        - '정해진 step 이 지나면 action expert 의 weight 가 바뀌기 때문이다'
        - '덩어리끼리 겹치는 예측을 평균(temporal ensembling)해야 하기 때문이다'
      answer: 0
      explanation: |
        덩어리 하나는 한 시점의 사진으로 만든 계획이라, 끝까지 실행하면 그동안 물체가 밀리거나 실수가 생겨도 반영하지 못한다. 앞쪽 일부만
        쓰고 새 사진으로 다시 추론하면 바뀐 상황에 더 빨리 맞춘다. 덩어리 전체가 Euler step 을 다 거쳐 완성되므로 뒤쪽이 noise 인 것은 아니고,
        실행 중에 weight 가 바뀌지도 않는다. temporal ensembling 은 π0 에서 오히려 성능을 떨어뜨려 쓰지 않았다.
    - question: |
        덩어리 단위로 action 을 실행하는 로봇에서 동기(synchronous) 추론과 비동기(asynchronous) 추론의 차이로 옳은 것은?
      choices:
        - '동기는 GPU 를, 비동기는 CPU 를 써서 추론한다'
        - '비동기는 새로 추론하지 않고 이전 덩어리를 되풀이한다'
        - '동기는 덩어리 실행을 마친 뒤 추론하느라 그동안 로봇이 멈추고, 비동기는 덩어리가 끝나기 전에 다음 추론을 시작해 실행과 계산을 겹쳐 멈춤을 없앤다'
        - '비동기는 사진을 보지 않고 action 을 만든다'
      answer: 2
      explanation: |
        동기 추론에서는 실행이 끝난 뒤에야 추론을 시작하므로, 추론하는 동안 로봇에게 보낼 새 목표가 없어 멈춘다. 비동기 추론은 남은 action
        을 실행하는 동안 다음 덩어리를 미리 계산해 그 틈을 없앤다. 두 방식의 차이는 계산을 언제 시작하느냐이지 계산하는 칩이 아니고, 비동기
        도 새 사진으로 새 덩어리를 만든다.
    - question: |
        π0 를 실물 로봇에 올리면 π0 추론, action 실행, 모터의 PID 라는 주기가 서로 다른 세 층이 생긴다. 이 구조에 대한 설명으로 옳은 것은?
      choices:
        - 'π0 가 모터에 넣을 힘을 직접 계산하므로 PID 는 필요 없다'
        - 'π0 는 드물게 덩어리를 만들고, action 은 그보다 자주 목표 각도를 하나씩 내보내며, PID 는 그보다 훨씬 빠르게 목표를 따라가도록 힘을 계산해 위층 사이를 메운다'
        - '세 층은 모두 같은 주기로 돌아야 서로 맞물린다'
        - 'PID 가 가장 느리고 π0 추론이 가장 빠르다'
      answer: 1
      explanation: |
        π0 의 action 은 관절의 목표 각도이지 모터의 힘이 아니라서, 목표와 지금 각도의 차이로 힘을 계산하는 PID 가 맨 아래에 있어야 한다.
        큰 모델은 느리게, 목표 각도는 그보다 자주, PID 는 가장 빠르게 돌아서 위층이 느려도 아래층이 그 사이를 메운다. 그래서 세 층의 주기가
        같을 필요가 없고, 빠르기의 순서도 π0 추론이 가장 느리다.

- topic: training-recipe
  title: 사전학습·fine-tuning·π0.5
  variants:
    - question: |
        π0 는 여러 로봇의 다양한 데이터로 사전학습한 뒤, 한 작업의 질 좋은 데이터로 fine-tuning 한다. 두 단계로 나누는 이유로 옳은 것은?
      choices:
        - '사전학습만으로 모든 작업을 매끄럽게 하지만, 확인하려고 fine-tuning 을 한 번 더 한다'
        - 'fine-tuning 데이터만으로 충분하지만, 계산을 아끼려고 사전학습을 먼저 한다'
        - '두 단계의 데이터는 성격이 같아서 순서만 나눈 것이다'
        - '질 좋은 데이터만으로는 실수에서 회복하는 장면이 거의 없어 작은 실수에 무너지고, 거친 사전학습 데이터만으로는 매끄럽게 하지 못해서 둘을 함께 써야 하기 때문이다'
      answer: 3
      explanation: |
        다양하지만 거친 사전학습 데이터에는 실수와 회복 장면이 많고, 질 좋은 fine-tuning 데이터에는 매끄러운 수행이 담겨 있다. 둘을 함께
        쓰면 평소에는 질 좋은 데이터처럼 움직이고 실수하면 사전학습에서 본 회복 동작을 꺼내 쓴다. 복잡한 작업은 사전학습만으로 부족했고,
        두 데이터의 성격이 다르기 때문에 단계를 나눈 것이다.
    - question: |
        π0.5 는 로봇 데이터에 웹 데이터(사진 설명, 사진에 대한 질문 답하기, 물체 위치 찾기)를 함께 섞어 학습(co-training)했다. 이 웹 데이터가
        주는 효과로 옳은 것은?
      choices:
        - '웹 데이터에서 새 손동작의 관절 각도를 배운다'
        - '물체에 대한 넓은 지식을 계속 쓰게 되어, 학습에 없던 종류의 물체를 가리키는 지시를 더 잘 따른다'
        - 'action 을 칸 token 으로 바꾸게 되어 정밀도가 떨어진다'
        - '로봇 데이터가 전혀 필요 없어진다'
      answer: 1
      explanation: |
        웹 데이터를 뺀 비교 실험에서 처음 보는 종류의 물체를 가리키는 지시를 따르는 성능이 크게 떨어졌고, 논문은 웹 데이터의 넓은 물체
        지식이 이를 돕는다고 보았다. 웹 데이터에는 관절 각도가 없으므로 손동작은 여전히 로봇 데이터에서 배운다. 웹 데이터를 섞는 것은
        action 표현 방식과 상관없고, 로봇 데이터를 대신하지도 않는다.
    - question: |
        π0 의 사전학습 단계에서 일어나는 일로 옳은 것은?
      choices:
        - 'PaliGemma 의 weight 는 고정하고 action expert 만 학습한다'
        - 'action expert 를 먼저 인터넷 글로 학습한다'
        - 'PaliGemma 의 weight 에서 출발해, 여러 로봇·여러 작업의 데이터로 action expert 와 함께 VLM 의 weight 도 고친다'
        - '한 종류 로봇의 한 작업 데이터만 쓴다'
      answer: 2
      explanation: |
        π0 의 사전학습은 인터넷 사진·글로 학습한 PaliGemma 를 출발점으로 삼아, 여러 로봇 구성과 여러 작업의 데이터로 모델 전체를 학습한다.
        이때 action expert 만이 아니라 VLM 몸통의 weight 도 함께 고친다. action expert 는 무작위 값에서 출발해 로봇 데이터로만 배우고,
        한 작업에 집중하는 것은 다음 단계인 fine-tuning 의 일이다.
