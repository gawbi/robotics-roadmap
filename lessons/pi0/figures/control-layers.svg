<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>π0 를 실물 로봇에 올렸을 때의 세 층. 맨 위 π0 가 0.5 초마다 action 덩어리를 만들고, 가운데 queue 가 20 ms 마다 목표 각도를 하나씩 내보내며, 맨 아래 PID 가 1 ms 마다 모터의 힘을 계산해 관절을 목표로 움직인다. 오른쪽 시간축에 세 층의 눈금 간격을 나란히 그렸다</title>
