  <rect x="1" y="1" width="798" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="50.0" width="300.0" height="64.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="170.0" y="74.0" fill="#a78bfa" font-size="14" text-anchor="middle" font-weight="600">π0 추론</text>
  <text x="170.0" y="94.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진·지시 → action 덩어리 50 개</text>
  <text x="170.0" y="110.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.5 초마다 (2 Hz)</text>
  <line x1="170.0" y1="116.0" x2="170.0" y2="138.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="20.0" y="140.0" width="300.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="170.0" y="164.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="600">action 실행 (queue)</text>
  <text x="170.0" y="184.0" fill="#e2e8f0" font-size="12" text-anchor="middle">덩어리에서 목표 각도를 하나씩</text>
  <text x="170.0" y="200.0" fill="#94a3b8" font-size="11" text-anchor="middle">20 ms 마다 (50 Hz)</text>
  <line x1="170.0" y1="206.0" x2="170.0" y2="228.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="20.0" y="230.0" width="300.0" height="64.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="170.0" y="254.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="600">PID (모터 안)</text>
  <text x="170.0" y="274.0" fill="#e2e8f0" font-size="12" text-anchor="middle">목표와의 차이 → 모터의 힘</text>
  <text x="170.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">1 ms 마다 (1000 Hz)</text>
  <text x="570.0" y="34.0" fill="#94a3b8" font-size="12" text-anchor="middle">처음 60 ms 를 확대한 시간축</text>
