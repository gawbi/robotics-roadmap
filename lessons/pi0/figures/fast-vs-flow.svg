<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>π0 와 π0-FAST 의 비교. π0 는 PaliGemma 옆의 action expert 가 flow matching 10 step 으로 action 50 개를 한꺼번에 만들어 RTX 4090 에서 73 ms 가 걸리고, π0-FAST 는 PaliGemma 의 언어 모델이 FAST token 30 ~ 60 개를 하나씩 내서 약 750 ms 가 걸린다. 학습에 든 GPU 시간은 π0-FAST 가 π0 의 약 5 분의 1 이다</title>
  <rect x="1.0" y="1.0" width="798.0" height="358.0" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="20.0" y="20.0" width="370.0" height="130.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="205.0" y="48.0" fill="#38bdf8" font-size="16" text-anchor="middle" font-weight="600">π0</text>
  <text x="205.0" y="78.0" fill="#94a3b8" font-size="13" text-anchor="middle">action 을 만드는 부분: action expert (약 3 억)</text>
  <text x="205.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">flow matching 10 step</text>
  <text x="205.0" y="126.0" fill="#e2e8f0" font-size="13" text-anchor="middle">action 50 개를 한꺼번에</text>
  <rect x="410.0" y="20.0" width="370.0" height="130.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595.0" y="48.0" fill="#f59e0b" font-size="16" text-anchor="middle" font-weight="600">π0-FAST</text>
  <text x="595.0" y="78.0" fill="#94a3b8" font-size="13" text-anchor="middle">action 을 만드는 부분: 언어 모델 (약 20 억)</text>
  <text x="595.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">FAST token 30 ~ 60 개</text>
  <text x="595.0" y="126.0" fill="#e2e8f0" font-size="13" text-anchor="middle">token 을 하나씩 차례로</text>
  <text x="20.0" y="186.0" fill="#94a3b8" font-size="13" text-anchor="start">1 초 분량 chunk 의 추론 (RTX 4090)</text>
  <text x="150.0" y="215.0" fill="#38bdf8" font-size="13" text-anchor="end">π0</text>
  <rect x="170.0" y="200.0" width="53.8" height="20.0" rx="3" fill="#38bdf8"/>
  <text x="231.8" y="215.0" fill="#38bdf8" font-size="12" text-anchor="start">73 ms</text>
  <text x="150.0" y="247.0" fill="#f59e0b" font-size="13" text-anchor="end">π0-FAST</text>
  <rect x="170.0" y="232.0" width="553.1" height="20.0" rx="3" fill="#f59e0b"/>
  <text x="715.1" y="247.0" fill="#0b1220" font-size="12" text-anchor="end" font-weight="600">약 750 ms</text>
  <line x1="170" y1="262" x2="760" y2="262" stroke="#94a3b8" stroke-width="1"/>
  <line x1="170.0" y1="262" x2="170.0" y2="267" stroke="#94a3b8" stroke-width="1"/>
  <text x="170.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="317.5" y1="262" x2="317.5" y2="267" stroke="#94a3b8" stroke-width="1"/>
  <text x="317.5" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">200</text>
  <line x1="465.0" y1="262" x2="465.0" y2="267" stroke="#94a3b8" stroke-width="1"/>
  <text x="465.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">400</text>
  <line x1="612.5" y1="262" x2="612.5" y2="267" stroke="#94a3b8" stroke-width="1"/>
  <text x="612.5" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">600</text>
  <line x1="760.0" y1="262" x2="760.0" y2="267" stroke="#94a3b8" stroke-width="1"/>
  <text x="760.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">800</text>
  <text x="760.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle"></text>
  <text x="762.0" y="296.0" fill="#94a3b8" font-size="11" text-anchor="end">ms</text>
  <text x="20.0" y="318.0" fill="#94a3b8" font-size="13" text-anchor="start">학습에 든 GPU 시간 (π0 = 1)</text>
  <rect x="300.0" y="306.0" width="300.0" height="14.0" rx="3" fill="#38bdf8"/>
  <text x="292.0" y="318.0" fill="#38bdf8" font-size="12" text-anchor="end">π0</text>
  <text x="608.0" y="318.0" fill="#38bdf8" font-size="12" text-anchor="start">1</text>
  <rect x="300.0" y="328.0" width="60.0" height="14.0" rx="3" fill="#f59e0b"/>
  <text x="292.0" y="340.0" fill="#f59e0b" font-size="12" text-anchor="end">π0-FAST</text>
  <text x="368.0" y="340.0" fill="#f59e0b" font-size="12" text-anchor="start">약 1/5</text>
</svg>
