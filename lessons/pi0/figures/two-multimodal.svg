  <text x="480.0" y="130.0" fill="#34d399" font-size="12" text-anchor="middle">왼쪽으로 비켜 감</text>
  <text x="700.0" y="130.0" fill="#34d399" font-size="12" text-anchor="middle">오른쪽으로 비켜 감</text>
  <rect x="572.0" y="190.0" width="36.0" height="30.0" rx="3" fill="#7c2d12" stroke="#f87171" stroke-width="1.5"/>
  <text x="590.0" y="210.0" fill="#e2e8f0" font-size="11" text-anchor="middle">상자</text>
  <line x1="590.0" y1="258.0" x2="590.0" y2="224.0" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" stroke-dasharray="4 3"/>
  <text x="590.0" y="178.0" fill="#f87171" font-size="12" text-anchor="middle">평균 0: 부딪힘</text>
  <text x="590.0" y="334.0" fill="#e2e8f0" font-size="12" text-anchor="middle">flow matching 은 noise 에서 출발해 두 봉우리 가운데 하나에 도착한다</text>
  <text x="590.0" y="356.0" fill="#94a3b8" font-size="12" text-anchor="middle">차이의 제곱만 줄이도록 바로 맞히면 평균 0 을 낸다</text>
</svg>
