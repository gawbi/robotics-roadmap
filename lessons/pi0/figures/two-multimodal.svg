<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>multimodal 의 두 뜻. 왼쪽은 사진·지시문·관절 각도처럼 종류가 다른 입력 세 가지가 모델에 들어가는 모습이다. 오른쪽은 같은 장면의 정답 action 이 +2 와 −2 두 봉우리로 갈린 분포로, 평균 0 은 상자에 부딪히는 길이고 flow matching 은 봉우리 하나에 도착한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="778" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190.0" y="36.0" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">① 입력의 종류가 여럿</text>
  <rect x="30.0" y="64.0" width="170.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115.0" y="86.0" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 사진 3 장</text>
  <text x="115.0" y="104.0" fill="#94a3b8" font-size="11" text-anchor="middle">시각</text>
  <line x1="202.0" y1="89.0" x2="278.0" y2="160.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="30.0" y="134.0" width="170.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115.0" y="156.0" fill="#e2e8f0" font-size="13" text-anchor="middle">지시문</text>
  <text x="115.0" y="174.0" fill="#94a3b8" font-size="11" text-anchor="middle">언어</text>
  <line x1="202.0" y1="159.0" x2="278.0" y2="160.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="30.0" y="204.0" width="170.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115.0" y="226.0" fill="#e2e8f0" font-size="13" text-anchor="middle">관절 각도 7 개</text>
  <text x="115.0" y="244.0" fill="#94a3b8" font-size="11" text-anchor="middle">몸의 감각</text>
  <line x1="202.0" y1="229.0" x2="278.0" y2="160.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="282.0" y="130.0" width="80.0" height="60.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="322.0" y="165.0" fill="#a78bfa" font-size="16" text-anchor="middle" font-weight="600">π0</text>
  <line x1="395.0" y1="30.0" x2="395.0" y2="360.0" stroke="#1e293b" stroke-width="1"/>
  <text x="590.0" y="36.0" fill="#e2e8f0" font-size="15" text-anchor="middle" font-weight="600">② 정답 action 이 여럿</text>
  <line x1="425.0" y1="260.0" x2="755.0" y2="260.0" stroke="#64748b" stroke-width="1"/>
  <line x1="480.0" y1="260.0" x2="480.0" y2="265.0" stroke="#64748b" stroke-width="1"/>
  <text x="480.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">-2</text>
  <line x1="535.0" y1="260.0" x2="535.0" y2="265.0" stroke="#64748b" stroke-width="1"/>
  <text x="535.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">-1</text>
  <line x1="590.0" y1="260.0" x2="590.0" y2="265.0" stroke="#64748b" stroke-width="1"/>
  <text x="590.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="645.0" y1="260.0" x2="645.0" y2="265.0" stroke="#64748b" stroke-width="1"/>
  <text x="645.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">+1</text>
  <line x1="700.0" y1="260.0" x2="700.0" y2="265.0" stroke="#64748b" stroke-width="1"/>
  <text x="700.0" y="280.0" fill="#94a3b8" font-size="11" text-anchor="middle">+2</text>
  <text x="590.0" y="300.0" fill="#94a3b8" font-size="11" text-anchor="middle">비켜 가는 거리 (cm)</text>
