  <text x="540.0" y="298.0" fill="#94a3b8" font-size="13" text-anchor="middle">−sin θ</text>
  <text x="460.0" y="320.0" fill="#94a3b8" font-size="13" text-anchor="middle">sin θ</text>
  <text x="540.0" y="320.0" fill="#94a3b8" font-size="13" text-anchor="middle">cos θ</text>
