<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>반지름 1 인 원 위의 점. 각도 θ 만큼 돌린 길이 1 막대의 끝은 (cos θ, sin θ) 다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="618" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="44.0" y="31.0" width="325.0" height="325.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="44.0" y1="31.0" x2="44.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="109.0" y1="31.0" x2="109.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="174.0" y1="31.0" x2="174.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="239.0" y1="31.0" x2="239.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="304.0" y1="31.0" x2="304.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="369.0" y1="31.0" x2="369.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="356.0" x2="369.0" y2="356.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="291.0" x2="369.0" y2="291.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="226.0" x2="369.0" y2="226.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="161.0" x2="369.0" y2="161.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="96.0" x2="369.0" y2="96.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="31.0" x2="369.0" y2="31.0" stroke="#16213a" stroke-width="1"/>
  <line x1="44.0" y1="330.0" x2="369.0" y2="330.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="31.0" x2="70.0" y2="356.0" stroke="#475569" stroke-width="1.5"/>
  <text x="200.0" y="346.0" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <text x="63.0" y="204.0" fill="#64748b" font-size="12" text-anchor="end">0.5</text>
  <text x="63.0" y="346.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <path d="M330.0,330.0 A260,260 0 0,0 70.0,70.0" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="70.0" y1="330.0" x2="330.0" y2="330.0" stroke="#334155" stroke-width="1.5"/>
  <circle cx="330.0" cy="330.0" r="5.5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="340.0" y="322.0" fill="#e2e8f0" font-size="13" text-anchor="start">0° → (1, 0)</text>
  <line x1="70.0" y1="330.0" x2="295.2" y2="200.0" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="295.2" cy="200.0" r="5.5" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="305.2" y="204.0" fill="#f59e0b" font-size="13" text-anchor="start">30° → (0.866, 0.5)</text>
  <line x1="70.0" y1="330.0" x2="253.8" y2="146.2" stroke="#334155" stroke-width="1.5"/>
  <circle cx="253.8" cy="146.2" r="5.5" fill="#34d399" stroke="#34d399" stroke-width="1"/>
  <text x="263.8" y="146.2" fill="#34d399" font-size="13" text-anchor="start">45° → (0.707, 0.707)</text>
  <line x1="70.0" y1="330.0" x2="200.0" y2="104.8" stroke="#334155" stroke-width="1.5"/>
  <circle cx="200.0" cy="104.8" r="5.5" fill="#a78bfa" stroke="#a78bfa" stroke-width="1"/>
  <text x="210.0" y="102.8" fill="#a78bfa" font-size="13" text-anchor="start">60° → (0.5, 0.866)</text>
  <line x1="70.0" y1="330.0" x2="70.0" y2="70.0" stroke="#334155" stroke-width="1.5"/>
  <circle cx="70.0" cy="70.0" r="5.5" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="1"/>
  <text x="82.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="start">90° → (0, 1)</text>
  <line x1="295.2" y1="200.0" x2="295.2" y2="330.0" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="295.2" y1="200.0" x2="70.0" y2="200.0" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="295.2" y="346.0" fill="#f87171" font-size="12" text-anchor="middle">0.866</text>
  <text x="63.0" y="204.0" fill="#34d399" font-size="12" text-anchor="end">0.5</text>
  <path d="M116.8,330.0 A46.8,46.8 0 0,0 110.5,306.6" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="125.5" y="320.2" fill="#f59e0b" font-size="12" text-anchor="start">30°</text>
  <text x="430.0" y="60.0" fill="#e2e8f0" font-size="13" text-anchor="start">길이 1 막대를 θ 만큼 돌리면</text>
  <text x="430.0" y="82.0" fill="#e2e8f0" font-size="13" text-anchor="start">끝점의</text>
  <text x="430.0" y="108.0" fill="#f87171" font-size="14" text-anchor="start">가로 위치 = cos θ</text>
  <text x="430.0" y="132.0" fill="#34d399" font-size="14" text-anchor="start">세로 위치 = sin θ</text>
  <text x="430.0" y="172.0" fill="#94a3b8" font-size="13" text-anchor="start">θ = 30° 이면</text>
  <text x="430.0" y="194.0" fill="#f87171" font-size="13" text-anchor="start">cos 30° ≈ 0.866</text>
  <text x="430.0" y="216.0" fill="#34d399" font-size="13" text-anchor="start">sin 30° = 0.5</text>
  <text x="430.0" y="256.0" fill="#94a3b8" font-size="13" text-anchor="start">모든 점이 원점에서</text>
  <text x="430.0" y="278.0" fill="#94a3b8" font-size="13" text-anchor="start">거리 1 인 원 위에 있다</text>
</svg>
