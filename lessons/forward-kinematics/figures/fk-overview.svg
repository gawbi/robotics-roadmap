<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>forward kinematics 의 입력과 출력. joint angle 30°, 60° 를 넣으면 손끝 위치 (0.866, 1.5) 가 나온다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="40.0" width="150.0" height="92.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="99.0" y="66.0" fill="#94a3b8" font-size="13" text-anchor="middle">입력: joint angle</text>
  <text x="99.0" y="94.0" fill="#e2e8f0" font-size="16" text-anchor="middle">θ₁ = 30°</text>
  <text x="99.0" y="118.0" fill="#e2e8f0" font-size="16" text-anchor="middle">θ₂ = 60°</text>
  <line x1="176.0" y1="86.0" x2="214.0" y2="86.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="218.0" y="52.0" width="132.0" height="68.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="284.0" y="82.0" fill="#e2e8f0" font-size="15" text-anchor="middle">forward</text>
  <text x="284.0" y="102.0" fill="#e2e8f0" font-size="15" text-anchor="middle">kinematics</text>
  <line x1="352.0" y1="86.0" x2="390.0" y2="86.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <rect x="394.0" y="40.0" width="150.0" height="92.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="469.0" y="66.0" fill="#94a3b8" font-size="13" text-anchor="middle">출력: 손끝 위치</text>
  <text x="469.0" y="100.0" fill="#e2e8f0" font-size="16" text-anchor="middle">(0.866, 1.5)</text>
  <text x="24.0" y="190.0" fill="#94a3b8" font-size="13" text-anchor="start">link 길이 L₁ = L₂ = 1 인 팔.</text>
  <text x="24.0" y="212.0" fill="#94a3b8" font-size="13" text-anchor="start">각도만 알면 손끝 위치가</text>
  <text x="24.0" y="234.0" fill="#94a3b8" font-size="13" text-anchor="start">하나로 정해진다.</text>
  <text x="24.0" y="270.0" fill="#94a3b8" font-size="13" text-anchor="start">반대 방향(손끝 → 각도)은</text>
  <text x="24.0" y="292.0" fill="#94a3b8" font-size="13" text-anchor="start">inverse kinematics 라고 한다.</text>
  <rect x="310.0" y="170.0" width="160.0" height="170.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="310.0" y1="170.0" x2="310.0" y2="340.0" stroke="#16213a" stroke-width="1"/>
  <line x1="360.0" y1="170.0" x2="360.0" y2="340.0" stroke="#16213a" stroke-width="1"/>
  <line x1="410.0" y1="170.0" x2="410.0" y2="340.0" stroke="#16213a" stroke-width="1"/>
  <line x1="460.0" y1="170.0" x2="460.0" y2="340.0" stroke="#16213a" stroke-width="1"/>
  <line x1="310.0" y1="340.0" x2="470.0" y2="340.0" stroke="#16213a" stroke-width="1"/>
  <line x1="310.0" y1="290.0" x2="470.0" y2="290.0" stroke="#16213a" stroke-width="1"/>
  <line x1="310.0" y1="240.0" x2="470.0" y2="240.0" stroke="#16213a" stroke-width="1"/>
  <line x1="310.0" y1="190.0" x2="470.0" y2="190.0" stroke="#16213a" stroke-width="1"/>
  <line x1="310.0" y1="330.0" x2="470.0" y2="330.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="330.0" y1="170.0" x2="330.0" y2="340.0" stroke="#475569" stroke-width="1.5"/>
  <text x="430.0" y="346.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <text x="323.0" y="234.0" fill="#64748b" font-size="12" text-anchor="end">1</text>
  <text x="323.0" y="346.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="476.0" y="335.0" fill="#94a3b8" font-size="13" text-anchor="start">x</text>
  <text x="335.0" y="164.0" fill="#94a3b8" font-size="13" text-anchor="start">y</text>
  <path d="M360.0,330.0 A30.0,30.0 0 0,0 356.0,315.0" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="366.8" y="325.2" fill="#f59e0b" font-size="13" text-anchor="start">θ₁</text>
  <line x1="416.6" y1="280.0" x2="446.9" y2="262.5" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M438.3,267.5 A25.0,25.0 0 0,0 416.6,255.0" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="433.6" y="254.0" fill="#a78bfa" font-size="13" text-anchor="start">θ₂</text>
  <line x1="330.0" y1="330.0" x2="416.6" y2="280.0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="416.6" y1="280.0" x2="416.6" y2="180.0" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="330.0" cy="330.0" r="7" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="416.6" cy="280.0" r="7" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="416.6" cy="180.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="428.6" y="185.0" fill="#f59e0b" font-size="13" text-anchor="start">손끝</text>
</svg>
