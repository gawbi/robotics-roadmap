# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: fk-problem
  title: forward kinematics 의 입력과 출력
  variants:
    - question: |
        로봇 팔은 encoder 로 관절 각도를 늘 아는데, forward kinematics 를 따로 계산해야 하는 이유는 무엇인가?
      choices:
        - 'encoder 는 각도를 정확히 재지 못해서 손끝 위치로 각도를 거꾸로 추정해야 하기 때문이다'
        - '목표는 손끝이 갈 위치로 주어지는데, 로봇이 직접 아는 것은 관절 각도뿐이기 때문이다'
        - 'forward kinematics 는 목표 위치에 손끝을 두는 관절 각도를 구하는 계산이기 때문이다'
        - 'motor 에 넣을 torque 를 정하려면 forward kinematics 만 있으면 되기 때문이다'
      answer: 1
      explanation: |
        로봇은 encoder 로 joint angle 을 알지만 손끝이 base 에서 어디 있는지는 바로 모른다. 목표는 손끝 위치로 주어지므로 joint angle 을 손끝
        pose 로 바꾸는 FK 가 있어야 둘 사이의 거리를 잴 수 있다. encoder 값은 FK 의 입력이지 추정할 대상이 아니다. 목표 위치에서 joint angle 을
        구하는 것은 inverse kinematics 이고, torque 는 힘을 다루는 dynamics 와 제어의 문제라 FK 만으로 정해지지 않는다.
    - question: |
        다음 중 forward kinematics 로 답하는 질문은 무엇인가?
      choices:
        - '컵을 집으려면 관절 각도를 각각 몇 도로 해야 하는가'
        - '손끝을 빨리 움직이려면 motor 에 torque 를 얼마나 줘야 하는가'
        - '손끝을 목표까지 장애물 없이 옮기는 경로는 무엇인가'
        - '지금 관절 각도에서 손끝은 어디에 있고 어느 쪽을 향하는가'
      answer: 3
      explanation: |
        FK 는 joint angle 을 받아 손끝의 위치와 방향을 묶은 pose 를 내는 계산이다. 손끝 목표에서 joint angle 을 구하는 질문은 반대 방향인 inverse
        kinematics 다. torque 를 묻는 질문은 힘을 다루는 dynamics 의 영역이고, 장애물을 피하는 경로를 찾는 것은 motion planning 이다.
    - question: |
        forward kinematics 와 inverse kinematics 의 답 개수는 어떻게 다른가?
      choices:
        - 'FK 는 답이 하나로 정해지고, IK 는 답이 여럿이거나 하나도 없을 수 있다'
        - '둘 다 답이 정확히 하나다. 관절 각도와 손끝 pose 는 한 쌍씩 짝지어지기 때문이다'
        - 'FK 는 팔꿈치를 위로 꺾은 답과 아래로 꺾은 답이 함께 나오고, IK 는 언제나 답이 하나다'
        - '둘 다 답이 여럿일 수 있어서 팔꿈치를 위아래로 꺾은 자세 중 하나를 따로 골라야 한다'
      answer: 0
      explanation: |
        joint angle 이 정해지면 각 link 의 방향과 위치가 차례로 정해지므로 FK 의 답은 하나뿐이다. 거꾸로 같은 손끝 위치는 팔꿈치를 위로 꺾은
        자세와 아래로 꺾은 자세처럼 여러 자세로 만들 수 있고, 팔이 닿지 않는 먼 곳이면 답이 없다. 그래서 답이 여럿이거나 없는 쪽은 IK 이고 FK
        에서는 고를 일이 없다.

- topic: relative-angle
  title: 상대 각도로 쌓이는 link 방향
  variants:
    - question: |
        평면 2 관절 팔에서 joint 2 의 각도는 바닥이 아니라 link 1 이 뻗은 방향을 기준으로 잰다. 왜 그렇게 정하는가?
      choices:
        - '바닥 기준으로 재면 각도 숫자가 360° 를 넘어 계산이 복잡해지기 때문이다'
        - '관례일 뿐이고, 바닥 기준으로 재도 손끝 위치는 같은 자리로 계산된다'
        - 'joint 2 의 motor 는 link 1 끝에 실려 함께 돌아서, 그 encoder 로는 꺾인 각도만 잴 수 있기 때문이다'
        - 'link 2 는 link 1 에 붙어 있어서 joint 2 의 각도가 언제나 joint 1 의 각도와 같기 때문이다'
      answer: 2
      explanation: |
        joint 2 의 motor 는 link 1 위에 실려 있어서, 그 encoder 로는 link 1 이 바닥에서 어떻게 놓였는지 알 수 없고 link 2 를 얼마나 꺾었는지만 잰다. 그래서
        $\theta_2$ 는 상대 각도이고 link 2 의 바닥 기준 방향은 $\theta_1 + \theta_2$ 다. 바닥 기준으로 읽으면 손끝이 다른 자리로 계산되므로 단순한
        관례가 아니다. 숫자의 크기와도 관계없고, 두 각도가 같을 이유도 없다.
    - question: |
        평면 2 관절 팔에서 $\theta_2$ 는 그대로 두고 $\theta_1$ 만 20° 더 돌리면, link 2 가 바닥에서 보아 가리키는 방향은 어떻게 되는가?
      choices:
        - '20° 더 돈다. link 2 는 link 1 끝에 붙어 함께 돌기 때문이다'
        - '변하지 않는다. link 2 의 방향은 $\theta_2$ 로만 정해진다'
        - '40° 더 돈다. link 1 이 돈 20° 에 joint 2 에서 20° 가 한 번 더 붙기 때문이다'
        - '20° 반대로 돈다. link 1 이 돌면 link 2 는 꺾인 반대쪽으로 밀리기 때문이다'
      answer: 0
      explanation: |
        link 2 의 바닥 기준 방향은 $\theta_1 + \theta_2$ 라서 $\theta_1$ 이 20° 늘면 link 2 도 20° 더 돈다. link 2 는 link 1 끝에 붙어 있으므로
        link 1 이 돌면 함께 돈다. $\theta_2$ 만으로 정해진다는 보기는 상대 각도를 바닥 기준 각도로 착각한 것이고, 40° 는 20° 를 두 번 센 것이며,
        반대로 돌 이유는 없다.
    - question: |
        평면 2 관절 팔의 손끝을 계산하면서 link 2 가 바닥 기준으로 $\theta_2$ 방향을 가리킨다고 놓았다. 이 계산은 언제 맞는가?
      choices:
        - '각도를 어느 기준으로 재든 손끝 결과는 같으므로 항상 맞다'
        - '$\theta_2 = 0$ 일 때만 맞는다. 그때는 link 2 가 link 1 과 일직선이기 때문이다'
        - '두 link 의 길이가 같을 때만 맞는다. 그때는 손끝이 대칭인 자리에 오기 때문이다'
        - '$\theta_1 = 0$ 일 때만 맞고, 그 밖에는 손끝이 틀린 자리로 계산된다'
      answer: 3
      explanation: |
        link 2 의 실제 방향은 $\theta_1 + \theta_2$ 인데 이 계산은 $\theta_2$ 를 썼으므로, 둘이 같아지는 $\theta_1 = 0$ 일 때만 맞는다.
        $\theta_2 = 0$ 이면 실제 방향은 $\theta_1$ 인데 계산은 0° 로 놓으므로 $\theta_1$ 이 0 이 아닌 한 틀린다. link 길이는 방향을 정하는 데
        관여하지 않아서 길이가 같아도 이 실수는 고쳐지지 않는다.

- topic: pose
  title: 같은 손끝을 만드는 여러 자세와 pose
  variants:
    - question: |
        평면 2 관절 팔의 두 자세가 손끝 위치는 같다. 두 자세를 같은 상태로 봐도 되는가?
      choices:
        - '관절 각도가 다르면 손끝 위치도 반드시 달라야 하므로 계산이 잘못된 것이다'
        - '팔꿈치 자리와 집게가 향하는 방향이 다를 수 있어서 같은 상태로 볼 수 없다'
        - '손끝 위치가 같으므로 물건을 잡는 데는 어느 자세를 골라도 똑같이 쓸 수 있다'
        - 'FK 가 한 입력에 답을 두 개 낸 경우라서 둘 중 하나를 골라야 한다'
      answer: 1
      explanation: |
        서로 다른 joint angle 이 같은 손끝 위치를 만들 수 있다. 이때 팔꿈치는 한 자세에서 위에 있고 다른 자세에서는 아래에 있으며, 집게 방향
        $\theta_1 + \theta_2$ 도 달라서 물건을 잡는 방향이 다르다. 위치가 같다고 잡는 방법까지 같지는 않다. 또 FK 는 입력 하나에 답 하나를
        내고, 여기서는 서로 다른 입력 두 개가 같은 위치를 낸 것이다.
    - question: |
        평면 2 관절 팔에서 마지막 link 에 붙은 집게가 바닥 기준으로 향하는 방향은 무엇인가?
      choices:
        - '$\theta_2$. 집게는 joint 2 바로 뒤에 붙어 있기 때문이다'
        - '$\theta_1$. 방향은 base 에 가장 가까운 joint 가 정하기 때문이다'
        - '$\theta_1 + \theta_2$'
        - '손끝에서 base 를 바라보는 방향'
      answer: 2
      explanation: |
        집게는 link 2 에 붙어 함께 돌므로 link 2 의 방향과 같고, link 2 의 바닥 기준 방향은 두 각도를 쌓은 $\theta_1 + \theta_2$ 다. $\theta_2$ 만
        쓰면 link 1 의 기울기를 빠뜨린 것이고, $\theta_1$ 만 쓰면 joint 2 의 꺾임을 빠뜨린 것이다. 손끝과 base 를 잇는 방향은 팔꿈치 자리에
        따라 달라지며 집게 방향과 다르다.
    - question: |
        FK 의 결과를 손끝의 '위치' 가 아니라 'pose' 라고 부르는 이유는 무엇이고, 3 차원 팔이면 숫자가 몇 개인가?
      choices:
        - 'pose 는 위치와 방향을 함께 이르는 말이고, 3 차원에서는 위치 3 개와 방향 3 개로 숫자 6 개다'
        - 'pose 는 관절 각도의 목록이고, 숫자 개수는 joint 수와 같아 7 축 팔이면 7 개다'
        - 'pose 는 위치와 속도를 함께 이르는 말이고, 3 차원에서는 위치 3 개와 속도 3 개를 합쳐 숫자 6 개다'
        - '3 차원에서는 위치만 pose 라고 부르고 방향은 따로 적으므로, pose 의 숫자는 3 개다'
      answer: 0
      explanation: |
        물건을 잡으려면 손끝이 어디 있는지와 함께 어느 쪽을 향하는지도 알아야 하고, 이 둘을 묶은 것이 pose 다. 평면에서는 위치 2 개와 방향
        1 개로 3 개이고, 3 차원에서는 위치 3 개와 방향 3 개로 6 개다. 관절 각도 목록은 FK 의 입력이지 출력이 아니다. 속도는 FK 가 다루지 않고,
        3 차원에서도 위치는 pose 의 일부일 뿐이다.

- topic: transform-chain
  title: joint transform 의 곱과 순서
  variants:
    - question: |
        joint 가 6 개인 3 차원 팔의 FK 를 계산하는 일반적인 방법은 무엇인가?
      choices:
        - '팔 모양마다 손끝 좌표의 식을 sin·cos 으로 처음부터 새로 유도해 코드에 적는다'
        - '각 joint 의 회전 행렬만 차례로 곱하고, link 길이는 마지막에 손끝에서 한 번에 더한다'
        - '관절 각도를 모두 더한 각도로 손끝 하나를 한 번에 돌린다'
        - 'joint 마다 이동과 회전을 담은 transform 을 만들어 base 부터 차례로 곱한다'
      answer: 3
      explanation: |
        joint 하나를 homogeneous transform 하나로 적으면 회전과 이동이 한 행렬에 담겨, joint 가 몇 개든 base 부터 차례로 곱하기만 하면 손끝 pose
        가 나온다. 로봇마다 식을 새로 유도할 필요가 없다. 회전만 곱하고 길이를 나중에 더하면 link 마다 돌아간 방향으로 길이가 놓이지 않아 틀린다.
        각도를 모두 더하는 방법은 모든 축이 평행한 평면 팔의 방향에만 통한다.
    - question: |
        어떤 URDF 파일에 joint 가 gripper 쪽부터 base 쪽으로 거꾸로 적혀 있다. FK 에서 joint transform 을 곱하는 순서는 어떻게 정하는가?
      choices:
        - '파일에 적힌 순서대로 곱한다. URDF 는 joint 를 base 쪽부터 연결 순서대로 적어야 하기 때문이다'
        - '각 joint 의 parent 와 child 를 읽어 base 에서 손끝 쪽으로 이어지는 순서로 곱한다'
        - 'transform 의 곱은 순서와 상관없으므로 아무 순서로 곱해도 된다'
        - '관절 각도가 큰 joint 부터 곱해야 손끝에 미치는 영향이 큰 것부터 반영된다'
      answer: 1
      explanation: |
        transform 은 base 에서 손끝 쪽으로 link 가 이어진 순서대로 곱해야 맞는 pose 가 나오고, 순서를 바꾸면 결과가 달라진다. 파일에 적힌 순서는
        이 연결 순서와 다를 수 있어서, FK 는 joint 마다 적힌 parent 와 child 로 연결을 세운 뒤 그 순서를 따른다. 행렬 곱은 순서를 바꾸면 값이
        달라지고, 각도의 크기는 곱하는 순서와 관계없다.
    - question: |
        base 에서 손끝까지 joint transform 을 왼쪽부터 곱해 나갈 때, 중간에 나오는 곱은 어디에 쓸 수 있는가?
      choices:
        - '쓸 곳이 없는 계산 중간값이라 손끝 pose 만 남기고 버린다'
        - '각 joint 의 관절 각도를 모두 더한 값이라 joint 각도 범위 검사에 쓴다'
        - 'base 에서 본 중간 link 의 pose 라서 link 마다 하는 충돌 검사에 쓴다'
        - '손끝을 중간 frame 에서 본 좌표라서 손끝 위치를 검산하는 데 쓴다'
      answer: 2
      explanation: |
        아래첨자가 맞닿게 곱하면 $T_{01}T_{12} = T_{02}$ 처럼 base 에서 본 frame 2 의 pose 가 된다. 그래서 왼쪽부터 곱하면 손끝만이 아니라 팔꿈치
        같은 중간 link 의 pose 도 차례로 얻고, 충돌 검사처럼 link 마다 위치가 필요할 때 이 값을 쓴다. 각도의 합은 방향 하나일 뿐 pose 가 아니다.
        손끝을 중간 frame 에서 본 좌표는 점에 오른쪽부터 곱해 갈 때 나오는 값이다.

- topic: urdf-joint
  title: URDF 의 joint 와 FK 의 재료
  variants:
    - question: |
        URDF 의 joint 하나는 FK 에서 어떤 transform 이 되고, 그중 로봇이 움직이는 동안 바뀌는 부분은 무엇인가?
      choices:
        - '`<origin>` 의 고정 transform 뒤에 `<axis>` 를 중심으로 q 만큼 움직이는 transform 을 곱한 것이고, 뒤쪽만 바뀐다'
        - '`<origin>` 이 joint 값에 따라 바뀌는 transform 이고, `<axis>` 는 움직이는 동안 고정이다'
        - '`<axis>` 의 방향 vector 가 joint 값에 비례해 길어지는 transform 이고, `<origin>` 은 고정이다'
        - '`<limit>` 의 lower 와 upper 가운데 값으로 만든 고정 transform 이 joint 의 transform 이 된다'
      answer: 0
      explanation: |
        URDF 의 joint 는 $T^{\text{origin}}\,T^{\text{motion}}(q)$ 로 계산한다. origin 은 parent link frame 에서 joint 자리까지의 고정된 위치와
        방향이라 로봇을 만들 때 정해지고, 움직이는 것은 axis 를 중심으로 q 만큼 돌리는(prismatic 이면 옮기는) 부분이다. origin 은 움직이는 동안
        바뀌지 않는다. axis 는 방향만 나타내며 길이가 변하지 않고, limit 은 q 가 움직일 수 있는 범위일 뿐 transform 이 아니다.
    - question: |
        URDF 의 회전 joint 에 `upper="1.57"` 이 적혀 있으면 무슨 뜻인가?
      choices:
        - '1.57° 까지만 돌 수 있어서 joint 가 거의 움직이지 못한다'
        - '157° 를 100 으로 나눠 적은 값이라 실제로는 157° 까지 돈다'
        - 'URDF 는 각도를 바퀴 수로 적으므로 joint 가 1.57 바퀴까지 돈다는 뜻이다'
        - 'URDF 의 각도 단위는 radian 이라서 약 90° 까지 돈다는 뜻이다'
      answer: 3
      explanation: |
        URDF 는 각도를 radian 으로 적는다. 반 바퀴 180° 가 $\pi \approx 3.14$ rad 이라 1.57 rad 은 약 90° 다. 이 값을 도로 읽어 1.57° 로 보는 것이
        흔한 실수이고, radian 은 100 등분 단위도 바퀴 수도 아니다. 도 단위로 joint 값을 다루는 코드는 URDF 계산에 넘기기 전에 radian 으로 바꿔야 한다.
    - question: |
        같은 로봇, 같은 URDF 인데 오전과 오후에 FK 로 계산한 손끝 위치가 달랐다. 차이는 어디서 왔다고 봐야 하는가?
      choices:
        - 'URDF 파일이 실행 중에 joint 값을 받아 스스로 바뀌었기 때문이다'
        - 'encoder 로 읽은 관절 각도가 달랐기 때문이다. URDF 에는 관절 각도가 없다'
        - 'URDF 에 적힌 관절 각도가 시간에 따라 encoder 값으로 갱신되었기 때문이다'
        - 'FK 는 같은 입력에도 행렬 곱의 소수 오차 때문에 매번 다른 답을 낼 수 있기 때문이다'
      answer: 1
      explanation: |
        FK 의 재료는 URDF 에 적힌 로봇의 모양과, 매 순간 encoder 로 읽는 joint angle 두 가지다. URDF 가 같으면 남은 차이는 joint angle 이다.
        URDF 에는 link 의 연결과 joint 의 자리·축만 있고 지금의 각도는 적혀 있지 않다. 파일은 실행 중에 스스로 바뀌지 않고, FK 는 같은 입력에
        늘 같은 답을 낸다.

- topic: tree-tf2
  title: kinematic tree 와 ROS 2 의 robot_state_publisher·tf2
  variants:
    - question: |
        손목에서 두 손가락이 갈라지는 gripper 에서 왼쪽 손가락 끝의 pose 를 구할 때, 오른쪽 손가락 joint 의 transform 도 곱해야 하는가?
      choices:
        - '곱해야 한다. 로봇의 모든 joint 를 곱해야 pose 가 나온다'
        - '곱해야 한다. 두 손가락은 대칭이라 둘을 함께 계산해야 한다'
        - '곱하지 않는다. root 에서 왼쪽 손가락 끝까지 가는 길 위의 joint 만 곱한다'
        - '곱하지 않는다. 손목에서 왼쪽 손가락 끝까지의 joint 만 곱하면 base 기준 pose 가 나온다'
      answer: 2
      explanation: |
        갈래가 있는 로봇은 kinematic tree 이고, 어떤 link 의 pose 는 root 에서 그 link 까지 가는 길 위의 joint transform 만 곱해 구한다. 오른쪽
        손가락 joint 는 그 길에 없으므로 곱하지 않는다. 손목까지는 두 손가락이 같은 길을 지나므로 손목까지의 transform 은 한 번 계산해 함께 쓴다.
        손목에서 손가락 끝까지만 곱하면 손목에서 본 pose 가 나올 뿐 base 에서 본 pose 가 아니다.
        대칭이라고 함께 곱하면 다른 가지의 움직임이 섞여 틀린 pose 가 나온다.
    - question: |
        ROS 2 의 robot_state_publisher 는 정확히 무엇을 publish 하는가?
      choices:
        - 'joint 마다 parent → child transform 을 만들어, 움직이는 joint 는 /tf 에 보내고 fixed joint 는 /tf_static 에 보낸다'
        - 'base 에서 모든 link 까지의 transform 을 직접 곱해, link 마다 base 기준 pose 를 하나씩 계산해 /tf 에 보낸다'
        - 'joint 의 각도를 encoder 에서 직접 읽어 /joint_states 로 보내고, 그 값으로 계산한 손끝 pose 도 함께 보낸다'
        - 'URDF 의 mesh 를 읽어 지금 자세로 그린 로봇 그림을 RViz 에 보낸다'
      answer: 0
      explanation: |
        robot_state_publisher 는 joint 하나하나의 $T^{\text{origin}}\,T^{\text{motion}}(q)$ 를 parent → child transform 으로 보낸다. 값이 바뀌지
        않는 fixed joint 는 시작할 때 /tf_static 에 한 번 보내고, 움직이는 joint 는 /joint_states 가 올 때마다 /tf 에 보낸다. base 에서 먼 link
        까지 곱하는 일은 tf2 가 lookup 할 때 한다. 각도를 읽어 /joint_states 를 보내는 것은 hardware driver 의 몫이고, 그림은 RViz 가 tf 와 URDF 로
        직접 그린다.
    - question: |
        RViz 에서 손목 아래 link 들만 transform 이 없다는 오류가 나고, 나머지 팔은 정상으로 보인다. 먼저 의심할 곳은 어디인가?
      choices:
        - 'URDF 의 mesh 파일 경로가 틀려 손목 아래 link 의 모양을 불러오지 못한 것'
        - 'RViz 의 표시 설정에서 손목 아래 link 들을 화면에 그리지 않도록 숨겨 둔 것'
        - 'tf2 buffer 의 보관 시간이 너무 길게 설정되어 오래된 transform 이 쌓인 것'
        - '/joint_states 에서 손목 joint 의 각도가 빠진 것'
      answer: 3
      explanation: |
        tf2 는 root 에서 각 link 까지 가는 길의 transform 을 곱해 pose 를 구하므로, 길 중간의 joint 하나가 빠지면 그 아래 link 의 lookup 이 모두
        실패한다. 움직이는 joint 의 transform 은 /joint_states 에 그 joint 의 각도가 있어야 만들어지므로 손목 joint 의 각도가 빠졌는지부터 본다.
        mesh 경로가 틀리면 모양이 안 보일 뿐 transform 오류가 아니고, 화면 설정은 transform 과 관계없다. buffer 를 길게 두면 오래된 값까지 찾을 수
        있을 뿐 transform 이 사라지지는 않는다.

- topic: dh-poe
  title: DH parameter 와 product of exponentials
  variants:
    - question: |
        DH parameter 는 joint 하나를 숫자 4 개로 적는데 URDF 는 6 개를 쓴다. 이 차이는 어디서 오는가?
      choices:
        - 'DH 는 정밀도를 조금 포기하고 숫자 2 개를 버린 근사식이기 때문이다'
        - 'DH 는 frame 을 놓는 규칙으로 축 방향과 자리를 미리 정해 숫자 2 개를 없애기 때문이다'
        - 'URDF 는 joint 마다 질량과 관성을 함께 적어 숫자 2 개가 더 붙기 때문이다'
        - 'DH 는 회전 joint 만 다루고, URDF 는 이동 joint 까지 다루느라 숫자가 더 필요하기 때문이다'
      answer: 1
      explanation: |
        URDF 의 origin 은 frame 을 아무 자리에 둘 수 있어서 xyz 셋과 rpy 셋, 6 개가 필요하다. DH 는 frame 을 놓는 규칙으로 자유도 2 개를 미리
        정해 두어서 남은 4 개($a$, $\alpha$, $d$, $\theta$)로 같은 transform 을 정확히 적으므로 근사가 아니다. 질량과 관성은 joint origin 과 따로
        적는 정보이고, DH 도 $d$ 를 변수로 두어 prismatic joint 를 적을 수 있다.
    - question: |
        제조사가 공개한 DH 표를 받아 FK 를 짰는데 손끝이 엉뚱한 곳에 나온다. 표의 숫자가 맞다면 무엇부터 확인해야 하는가?
      choices:
        - '표의 각도를 도 단위로 바꿔 넣어야 하는데 radian 그대로 넣었는지'
        - 'link 길이 단위가 모호하면 cm 와 m 로 둘 다 넣어 보고 맞는 쪽을 골랐는지'
        - '표가 원래 DH 규약인지 Craig 규약인지, 내 코드가 같은 규약의 곱하는 순서를 쓰는지'
        - 'joint 가 6 개를 넘는 7 축 팔이라서 DH 표로는 FK 를 계산할 수 없는 경우인지'
      answer: 2
      explanation: |
        DH 에는 네 동작을 곱하는 순서와 아래첨자가 다른 두 규약이 있다. UR 은 원래 규약을 쓰고 Franka 는 Craig 규약을 쓰는데, 한 규약의 표를 다른 규약의
        식에 넣으면 다른 팔이 계산된다. 각도 단위는 radian 이 맞으므로 도로 바꾸면 오히려 틀린다. 단위가 모호하면 문서로 확인해야 하고, 7 축
        팔인 FR3 도 DH 표로 FK 를 계산한다.
    - question: |
        product of exponentials 방식의 FK 는 무엇을 미리 적어 두고 어떻게 계산하는가?
      choices:
        - '모든 관절 각도가 0 인 자세의 joint 축과 손끝 pose 를 적어 두고, 손끝 쪽 joint 부터 돌린다'
        - 'link 마다 frame 을 붙이고 joint 하나를 숫자 4 개로 적어 두고, base 부터 차례로 transform 을 곱한다'
        - '관절 각도별 손끝 위치를 표로 저장해 두고, 지금 각도와 가장 가까운 값을 찾는다'
        - '각 joint 축을 매번 현재 자세에서 다시 구해 두고, base 쪽 joint 부터 차례로 돌린다'
      answer: 0
      explanation: |
        PoE 는 zero configuration 의 joint 축과 손끝 pose 만 한 번 적고, 손끝 쪽 joint 부터 각 축을 중심으로 joint angle 만큼 돌린다. 손끝 쪽부터
        돌리면 아직 움직이지 않은 앞쪽 joint 의 축이 적어 둔 자리 그대로라서 축을 다시 구할 필요가 없다. link 마다 frame 을 붙여 숫자 4 개로
        적는 것은 DH 다. 표에서 가까운 값을 찾는 방식은 근사일 뿐 FK 계산이 아니다.

- topic: real-error
  title: 계산과 실물의 차이
  variants:
    - question: |
        FK 계산이 맞는데도 실제 로봇의 손끝이 계산한 자리에서 몇 mm 어긋난다. 원인으로 무엇을 꼽을 수 있는가?
      choices:
        - '컴퓨터가 cos 과 sin 을 소수 몇 자리까지만 계산해서, 그 작은 오차가 손끝에서 커지기 때문이다'
        - 'FK 식은 link 를 곧은 막대로 본 대략적인 근사식이라 실물과 맞지 않기 때문이다'
        - '행렬을 여러 번 곱하면서 소수 오차가 joint 마다 mm 단위로 쌓이기 때문이다'
        - '실물은 encoder 0 점, link 치수, 기어 틈, 휘어짐이 FK 가 쓰는 숫자와 조금씩 다르기 때문이다'
      answer: 3
      explanation: |
        FK 는 URDF 의 숫자와 encoder 가 준 joint angle 이 정확하다고 믿고 계산한다. 실물은 encoder 0 점이 조금 어긋나 있거나, link 가 도면보다
        조금 길거나, 기어에 틈이 있거나, 하중으로 살짝 휘어서 그 숫자와 다르다. FK 식은 근사가 아니라 정확한 식이고, cos·sin 과 행렬 곱의 소수
        오차는 mm 보다 훨씬 작다.
    - question: |
        base 쪽 joint 와 손목 쪽 joint 가 똑같이 1° 씩 틀렸다. 손끝을 더 크게 어긋나게 하는 쪽은 어디인가?
      choices:
        - '손목 쪽 joint 다. 손끝에 가까워서 그 각도 오차가 손끝에 그대로 전해지기 때문이다'
        - 'base 쪽 joint 다. 손끝까지 거리가 멀수록 같은 각도 오차가 긴 호가 되기 때문이다'
        - '둘 다 1° 라서 똑같이 어긋난다. 손끝 오차는 joint 자리와 상관없이 각도 오차의 크기로만 정해진다'
        - '각도 오차는 손끝의 방향만 바꾸고 위치는 바꾸지 않으므로 둘 다 위치는 그대로다'
      answer: 1
      explanation: |
        joint 가 $\Delta\theta$ radian 틀리면 손끝은 그 joint 를 중심으로 반지름 $r$ 인 원을 따라 약 $r\,\Delta\theta$ 만큼 어긋나고, $r$ 은 joint
        에서 손끝까지의 거리다. base 쪽 joint 는 $r$ 이 커서 같은 1° 라도 손끝 오차가 크다. 손끝에 가까운 joint 는 $r$ 이 작아 오차도 작다. 손끝이
        회전축 바로 위에 있는 경우가 아니면 각도 오차는 방향과 함께 위치도 바꾼다.
    - question: |
        어떤 로봇 팔의 repeatability 가 ±0.03 mm 인데, 제조사는 kinematics calibration 을 반영하지 않으면 손끝 위치가 cm 단위로 틀릴 수 있다고 밝힌다. 두 말이 어떻게 둘 다 맞는가?
      choices:
        - '둘 중 하나는 잘못된 사양이다. 같은 자리로 0.03 mm 안에 돌아오는 팔이 cm 단위로 틀릴 수는 없기 때문이다'
        - 'repeatability 는 무거운 물건을 들었을 때 잰 값이고, cm 오차는 아무것도 들지 않은 빈 손일 때 잰 값이다'
        - 'repeatability 는 같은 자리로 돌아오는 정도이고, cm 오차는 URDF 숫자가 실물과 달라 생기는 accuracy 문제다'
        - 'cm 오차는 encoder 가 고장 나 관절 각도를 잘못 읽을 때만 생기는 값이다'
      answer: 2
      explanation: |
        repeatability 는 같은 명령을 되풀이했을 때 결과가 얼마나 모이는지이고, accuracy 는 계산한 자리와 실제 자리가 얼마나 맞는지다. 팔이 늘 같은
        자리로 정밀하게 돌아와도 FK 가 쓰는 link 치수나 0 점이 실물과 다르면 그 자리를 base 에서 몇 m 라고 계산한 값이 틀린다. 그래서 공장
        calibration 값을 URDF 에 반영한다. 하중이나 encoder 고장은 이 두 사양의 차이를 설명하지 않는다.
