<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>전역 위치와 골반 기준 위치의 keypoint 오차. 예로 든 reference 는 골반 1.0 m, 손 1.3 m 이고 로봇은 골반 0.7 m, 손 1.0 m 다. 전역 위치로는 손 오차가 1.3 − 1.0 = 0.3 m 이고, 골반 기준으로는 두 손 모두 골반 앞 0.3 m 라 오차가 0 이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#94a3b8" font-size="12.5" text-anchor="start">옆에서 본 모습. 가로축은 출발점에서 앞으로 간 거리다 (예로 든 값)</text>
  <line x1="60" y1="250" x2="660.0" y2="250" stroke="#334155" stroke-width="1.2"/>
  <line x1="60" y1="246" x2="60" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">0 m</text>
  <line x1="260.0" y1="246" x2="260.0" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="260.0" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">0.5 m</text>
  <line x1="340.0" y1="246" x2="340.0" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="340.0" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">0.7 m</text>
  <line x1="460.0" y1="246" x2="460.0" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="460.0" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">1.0 m</text>
  <line x1="580.0" y1="246" x2="580.0" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="580.0" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">1.3 m</text>
  <line x1="660.0" y1="246" x2="660.0" y2="254" stroke="#94a3b8" stroke-width="1"/>
  <text x="660.0" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">1.5 m</text>
  <line x1="460.0" y1="250" x2="460.0" y2="170" stroke="#d6aa62" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="460.0" y1="170" x2="460.0" y2="110" stroke="#d6aa62" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="460.0" cy="94" r="12" fill="none" stroke="#d6aa62" stroke-width="1.8"/>
  <line x1="460.0" y1="116" x2="580.0" y2="125" stroke="#d6aa62" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="460.0" cy="170" r="5" fill="#d6aa62" stroke="none" stroke-width="1.5"/>
  <circle cx="580.0" cy="125" r="6" fill="#d6aa62" stroke="none" stroke-width="1.5"/>
  <line x1="340.0" y1="250" x2="340.0" y2="170" stroke="#7cb4d8" stroke-width="2.2"/>
  <line x1="340.0" y1="170" x2="340.0" y2="110" stroke="#7cb4d8" stroke-width="2.2"/>
  <circle cx="340.0" cy="94" r="12" fill="none" stroke="#7cb4d8" stroke-width="1.8"/>
  <line x1="340.0" y1="116" x2="460.0" y2="125" stroke="#7cb4d8" stroke-width="2.2"/>
  <circle cx="340.0" cy="170" r="5" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <circle cx="460.0" cy="125" r="6" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <text x="474.0" y="176" fill="#d6aa62" font-size="12" text-anchor="start">reference 골반 1.0 m</text>
  <text x="328.0" y="176" fill="#7cb4d8" font-size="12" text-anchor="end">로봇 골반 0.7 m</text>
  <text x="592.0" y="121" fill="#d6aa62" font-size="12" text-anchor="start">손 목표 1.3 m</text>
  <text x="460.0" y="150" fill="#7cb4d8" font-size="12" text-anchor="start"></text>
  <text x="450.0" y="146" fill="#7cb4d8" font-size="12" text-anchor="end">로봇 손 1.0 m</text>
  <line x1="460.0" y1="72" x2="580.0" y2="72" stroke="#d88b8b" stroke-width="1.6" marker-end="url(#ar-red)"/>
  <line x1="580.0" y1="72" x2="460.0" y2="72" stroke="#d88b8b" stroke-width="1.6" marker-end="url(#ar-red)"/>
  <text x="520.0" y="62" fill="#d88b8b" font-size="12.5" text-anchor="middle">전역 위치 오차 1.3 − 1.0 = 0.3 m</text>
  <line x1="460.0" y1="72" x2="460.0" y2="116" stroke="#d88b8b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="580.0" y1="72" x2="580.0" y2="116" stroke="#d88b8b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="340.0" y1="222" x2="460.0" y2="222" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <line x1="460.0" y1="222" x2="340.0" y2="222" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="330.0" y="226" fill="#94a3b8" font-size="12" text-anchor="end">골반이 뒤처진 거리 1.0 − 0.7 = 0.3 m</text>
  <text x="20" y="300" fill="#e2e8f0" font-size="13" text-anchor="start">골반 기준 위치: 손 목표는 골반 앞 1.3 − 1.0 = 0.3 m, 로봇 손도 골반 앞 1.0 − 0.7 = 0.3 m 라서 오차는 0 m</text>
  <text x="20" y="324" fill="#94a3b8" font-size="12" text-anchor="start">점선은 reference 동작이고 실선은 로봇이다. 전역 오차 0.3 m 는 팔이 아니라 몸 전체가 뒤처져서 생겼다</text>
</svg>
