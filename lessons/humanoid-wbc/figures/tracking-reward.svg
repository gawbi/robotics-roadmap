<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>손 위치 오차에 따른 tracking reward. 예로 든 값에서 자세 0.5881, 관절 속도 0.0905, 무게중심 0.0991 은 그대로이고, 손 오차가 0, 10 cm, 20 cm 로 커지면 손발 점수가 0.15, 0.1005, 0.0303 으로 줄어 reward 가 0.9277, 0.8783, 0.8080 이 된다</title>
