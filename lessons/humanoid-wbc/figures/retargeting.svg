<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 retargeting 방법. 예로 든 박수 동작에서 사람의 손은 어깨에서 안쪽으로 0.18 m 움직인다. 관절 각도를 복사하면 팔이 0.75 배인 로봇의 손은 0.135 m 만 움직여 몸 중심에서 0.085 m 떨어지고 두 손 사이가 0.17 m 가 되며, keypoint 위치를 맞추면 두 손이 몸 중심에서 만난다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#94a3b8" font-size="12.5" text-anchor="start">정면에서 본 박수 동작. 어깨는 몸 중심에서의 거리, 손은 몸 중심에서 떨어진 거리로 적었다</text>
  <rect x="20" y="46" width="220" height="250" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="130" y="72" fill="#d6aa62" font-size="14" text-anchor="middle">사람 (reference)</text>
  <rect x="250" y="46" width="220" height="250" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360" y="72" fill="#7cb4d8" font-size="14" text-anchor="middle">관절 각도 복사</text>
  <rect x="480" y="46" width="220" height="250" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="590" y="72" fill="#7fc4a2" font-size="14" text-anchor="middle">keypoint 위치 맞추기</text>
  <circle cx="130" cy="96" r="13" fill="none" stroke="#d6aa62" stroke-width="1.6"/>
  <rect x="58.0" y="119" width="144.0" height="12" rx="5" fill="#111a2e" stroke="#d6aa62" stroke-width="1.4"/>
  <line x1="130" y1="196" x2="130" y2="228" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="58.0" y1="125" x2="125" y2="212" stroke="#d6aa62" stroke-width="3"/>
  <circle cx="125" cy="212" r="6" fill="#d6aa62" stroke="none" stroke-width="1.5"/>
  <circle cx="58.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <line x1="202.0" y1="125" x2="135" y2="212" stroke="#d6aa62" stroke-width="3"/>
  <circle cx="135" cy="212" r="6" fill="#d6aa62" stroke="none" stroke-width="1.5"/>
  <circle cx="202.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="130" y="152" fill="#94a3b8" font-size="12" text-anchor="middle">어깨 ±0.18 m</text>
  <text x="130" y="240" fill="#e2e8f0" font-size="12" text-anchor="middle">두 손이 몸 중심에서 만난다</text>
  <text x="130" y="262" fill="#94a3b8" font-size="12" text-anchor="middle">손이 안쪽으로 0.18 m</text>
  <circle cx="360" cy="96" r="13" fill="none" stroke="#7cb4d8" stroke-width="1.6"/>
  <rect x="272.0" y="119" width="176.0" height="12" rx="5" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.4"/>
  <line x1="360" y1="176" x2="360" y2="208" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="272.0" y1="125" x2="326.0" y2="192" stroke="#7cb4d8" stroke-width="3"/>
  <circle cx="326.0" cy="192" r="6" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <circle cx="272.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <line x1="448.0" y1="125" x2="394.0" y2="192" stroke="#7cb4d8" stroke-width="3"/>
  <circle cx="394.0" cy="192" r="6" fill="#7cb4d8" stroke="none" stroke-width="1.5"/>
  <circle cx="448.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="360" y="152" fill="#94a3b8" font-size="12" text-anchor="middle">어깨 ±0.22 m</text>
  <line x1="326.0" y1="206" x2="394.0" y2="206" stroke="#d88b8b" stroke-width="1.6" marker-end="url(#ar-red)"/>
  <line x1="394.0" y1="206" x2="326.0" y2="206" stroke="#d88b8b" stroke-width="1.6" marker-end="url(#ar-red)"/>
  <text x="360" y="226" fill="#d88b8b" font-size="12" text-anchor="middle">두 손 사이 0.085 × 2 = 0.17 m</text>
  <text x="360" y="248" fill="#94a3b8" font-size="12" text-anchor="middle">안쪽으로 0.18 × 0.75 = 0.135 m</text>
  <text x="360" y="268" fill="#94a3b8" font-size="12" text-anchor="middle">중심까지 0.22 − 0.135 = 0.085 m</text>
  <circle cx="590" cy="96" r="13" fill="none" stroke="#7fc4a2" stroke-width="1.6"/>
  <rect x="502.0" y="119" width="176.0" height="12" rx="5" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.4"/>
  <line x1="590" y1="156" x2="590" y2="188" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="502.0" y1="125" x2="585" y2="172" stroke="#7fc4a2" stroke-width="3"/>
  <circle cx="585" cy="172" r="6" fill="#7fc4a2" stroke="none" stroke-width="1.5"/>
  <circle cx="502.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <line x1="678.0" y1="125" x2="595" y2="172" stroke="#7fc4a2" stroke-width="3"/>
  <circle cx="595" cy="172" r="6" fill="#7fc4a2" stroke="none" stroke-width="1.5"/>
  <circle cx="678.0" cy="125" r="4" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="590" y="152" fill="#94a3b8" font-size="12" text-anchor="middle">어깨 ±0.22 m</text>
  <text x="590" y="226" fill="#7fc4a2" font-size="12" text-anchor="middle">두 손 사이 0 m (손바닥이 닿는다)</text>
  <text x="590" y="248" fill="#94a3b8" font-size="12" text-anchor="middle">안쪽으로 0.22 m</text>
  <text x="590" y="268" fill="#94a3b8" font-size="12" text-anchor="middle">손 위치에 맞춰 각도를 다시 찾는다</text>
  <text x="20" y="322" fill="#e2e8f0" font-size="13" text-anchor="start">각도 복사는 사람의 관절 각도를 그대로 쓰고, 위치 맞추기는 손 위치가 같아지는 로봇 각도를 찾는다</text>
  <text x="20" y="346" fill="#94a3b8" font-size="12" text-anchor="start">로봇 어깨 0.22 m 와 팔 길이(사람의 0.75 배), 사람 어깨 0.18 m 는 예로 든 값이다</text>
</svg>
