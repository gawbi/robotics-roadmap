<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>support polygon 과 넘어지는 힘. 예로 든 4족 로봇은 네 발의 사각형에서 가장자리까지 0.2 m 라 78.5 N 에, humanoid 는 두 발로 앞으로 밀릴 때 0.1 m 라 57.2 N 에, 한 발로 옆으로 밀릴 때 0.05 m 라 28.6 N 에 넘어간다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="408" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#94a3b8" font-size="12.5" text-anchor="start">위에서 본 support polygon(초록)과 무게중심(흰 점). 빨간 화살표 방향으로 밀면 그쪽 가장자리를 축으로 넘어간다</text>
  <rect x="20" y="46" width="200" height="274" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="120" y="72" fill="#e2e8f0" font-size="14" text-anchor="middle">4족 로봇, 네 발</text>
  <rect x="260" y="46" width="200" height="274" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="360" y="72" fill="#e2e8f0" font-size="14" text-anchor="middle">humanoid, 두 발</text>
  <rect x="500" y="46" width="200" height="274" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="600" y="72" fill="#e2e8f0" font-size="14" text-anchor="middle">humanoid, 한 발</text>
  <rect x="87.5" y="118.0" width="65.0" height="104.0" fill="#7fc4a2" fill-opacity="0.18" stroke="#7fc4a2" stroke-width="1.6"/>
  <circle cx="87.5" cy="118.0" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="87.5" cy="222.0" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="152.5" cy="118.0" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="152.5" cy="222.0" r="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="170" x2="120" y2="120.0" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#ar-amber)"/>
  <circle cx="120" cy="170" r="5" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="77.5" y="148.0" fill="#d6aa62" font-size="12" text-anchor="end">d = 0.2 m</text>
  <line x1="120" y1="262.0" x2="120" y2="234.0" stroke="#d88b8b" stroke-width="2.2" marker-end="url(#ar-red)"/>
  <text x="130" y="258.0" fill="#d88b8b" font-size="12" text-anchor="start">앞으로 밀기</text>
  <rect x="321.0" y="144.0" width="78.0" height="52.0" fill="#7fc4a2" fill-opacity="0.18" stroke="#7fc4a2" stroke-width="1.6"/>
  <rect x="321.0" y="144.0" width="26.0" height="52.0" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="373.0" y="144.0" width="26.0" height="52.0" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="360" y1="170" x2="360" y2="146.0" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#ar-amber)"/>
  <circle cx="360" cy="170" r="5" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="311.0" y="161.0" fill="#d6aa62" font-size="12" text-anchor="end">d = 0.1 m</text>
  <line x1="360" y1="236.0" x2="360" y2="208.0" stroke="#d88b8b" stroke-width="2.2" marker-end="url(#ar-red)"/>
  <text x="370" y="232.0" fill="#d88b8b" font-size="12" text-anchor="start">앞으로 밀기</text>
  <text x="360" y="132.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">발 길이 0.2 m</text>
  <rect x="587.0" y="144.0" width="26.0" height="52.0" fill="#7fc4a2" fill-opacity="0.18" stroke="#7fc4a2" stroke-width="1.6"/>
  <line x1="600" y1="170" x2="611.0" y2="170" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#ar-amber)"/>
  <circle cx="600" cy="170" r="5" fill="#e2e8f0" stroke="none" stroke-width="1.5"/>
  <text x="621.0" y="174" fill="#d6aa62" font-size="12" text-anchor="start">d = 0.05 m</text>
  <line x1="538" y1="222.0" x2="578" y2="222.0" stroke="#d88b8b" stroke-width="2.2" marker-end="url(#ar-red)"/>
  <text x="586" y="226.0" fill="#d88b8b" font-size="12" text-anchor="start">옆으로 밀기</text>
  <text x="600" y="132.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">발 폭 0.1 m</text>
  <text x="120" y="284" fill="#94a3b8" font-size="12" text-anchor="middle">12 kg, 무게중심 높이 0.3 m</text>
  <text x="120" y="306" fill="#e2e8f0" font-size="13.5" text-anchor="middle">117.7 × 0.2 ÷ 0.3 ≈ 78.5 N</text>
  <text x="360" y="284" fill="#94a3b8" font-size="12" text-anchor="middle">35 kg, 무게중심 높이 0.6 m</text>
  <text x="360" y="306" fill="#e2e8f0" font-size="13.5" text-anchor="middle">343.4 × 0.1 ÷ 0.6 ≈ 57.2 N</text>
  <text x="600" y="284" fill="#94a3b8" font-size="12" text-anchor="middle">35 kg, 무게중심 높이 0.6 m</text>
  <text x="600" y="306" fill="#e2e8f0" font-size="13.5" text-anchor="middle">343.4 × 0.05 ÷ 0.6 ≈ 28.6 N</text>
  <text x="20" y="354" fill="#e2e8f0" font-size="13.5" text-anchor="start">넘어지는 힘 = 무게 × 9.81 × d ÷ 무게중심 높이</text>
  <text x="20" y="378" fill="#94a3b8" font-size="12" text-anchor="start">d, 무게중심 높이, 발 크기, 4족 로봇의 무게 12 kg 은 예로 든 값이고, G1 의 35 kg 은 제조사 사양이다</text>
</svg>
