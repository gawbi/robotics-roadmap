<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>HumanPlus 원격 조종의 주기. 카메라는 1 초에 60 번, 몸 자세 추정과 retargeting 은 25 번, tracking policy 는 50 번, PD controller 는 1,000 번 계산한다. 0.04 초 동안 자세 목표는 하나이고 policy 는 0.02 초마다 두 번 계산하며, policy 한 번에 PD 는 20 번 계산한다</title>
