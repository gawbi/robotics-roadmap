  <text x="20" y="338" fill="#e2e8f0" font-size="13" text-anchor="start">policy 한 번에 PD 는 1000 ÷ 50 = 20 번 계산하고, 자세 목표 하나로 policy 는 50 ÷ 25 = 2 번 계산한다</text>
  <text x="20" y="362" fill="#94a3b8" font-size="12" text-anchor="start">몸 자세는 WHAM, 손 자세는 HaMeR(1 초에 10 번)로 추정한다. 주기는 HumanPlus 논문의 값이다</text>
