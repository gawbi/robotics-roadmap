<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>sim-to-data 선별. AMASS 의 약 13,000 동작이 retargeting 과 규칙 필터 뒤 약 3,000 개 줄어 약 10,000 개가 되고, privileged imitator 가 따라 하지 못한 약 1,500 개를 지워 약 8,500 개가 남는다. 거른 데이터로 학습한 policy 의 성공률은 72.5%, 거르지 않은 데이터는 67.9% 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#94a3b8" font-size="12.5" text-anchor="start">H2O 의 sim-to-data. 막대 길이는 동작 수에 비례한다</text>
  <rect x="20" y="56" width="500.0" height="34" rx="6" fill="#94a3b8" fill-opacity="0.22" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="32" y="78" fill="#e2e8f0" font-size="13.5" text-anchor="start">AMASS 원본</text>
  <text x="530.0" y="78" fill="#94a3b8" font-size="13" text-anchor="start">약 13,000 개</text>
  <rect x="20" y="136" width="384.6" height="34" rx="6" fill="#7cb4d8" fill-opacity="0.22" stroke="#7cb4d8" stroke-width="1.6"/>
  <text x="32" y="158" fill="#e2e8f0" font-size="13.5" text-anchor="start">retargeting·규칙 필터 뒤</text>
  <text x="414.61538461538464" y="158" fill="#7cb4d8" font-size="13" text-anchor="start">약 10,000 개 (처음의 77%)</text>
  <rect x="20" y="216" width="326.9" height="34" rx="6" fill="#7fc4a2" fill-opacity="0.22" stroke="#7fc4a2" stroke-width="1.6"/>
  <text x="32" y="238" fill="#e2e8f0" font-size="13.5" text-anchor="start">privileged imitator 로 거른 뒤</text>
  <text x="356.92307692307696" y="238" fill="#7fc4a2" font-size="13" text-anchor="start">약 8,500 개 (처음의 65%)</text>
  <line x1="40" y1="94" x2="40" y2="132" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar-muted)"/>
  <text x="52" y="118" fill="#94a3b8" font-size="12" text-anchor="start">13,000 − 10,000 = 약 3,000 개 제외 (바닥에 앉기 같은 위험 동작을 규칙으로 지움)</text>
  <line x1="40" y1="174" x2="40" y2="212" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar-muted)"/>
  <text x="52" y="198" fill="#94a3b8" font-size="12" text-anchor="start">10,000 − 8,500 = 약 1,500 개 제외 (privileged imitator 가 따라 하지 못한 동작)</text>
  <text x="20" y="280" fill="#e2e8f0" font-size="13" text-anchor="start">거르지 않은 10,000 개로 평가한 성공률: 거른 데이터로 학습 72.5%, 거르지 않은 데이터로 학습 67.9%</text>
  <text x="20" y="304" fill="#94a3b8" font-size="12" text-anchor="start">남은 비율은 10 ÷ 13 ≈ 77%, 8.5 ÷ 13 ≈ 65% 로 계산했다</text>
</svg>
