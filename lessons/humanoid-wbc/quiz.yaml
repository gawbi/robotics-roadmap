# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: balance
  title: humanoid 의 균형
  section: humanoid-의-균형
  variants:
    - question: |
        humanoid 가 4족 로봇보다 무거운데도 몸통을 밀 때 더 작은 힘에 넘어질 수 있는 이유로 가장 알맞은 것은?
      choices:
        - '무게중심이 높아 미는 힘이 긴 지렛대를 얻고, 발바닥이 좁아 무게가 버티는 지렛대는 짧기 때문이다'
        - '관절이 많아 PD gain 을 낮게 잡아야 해서, 관절마다 낼 수 있는 torque 가 4족 로봇보다 작기 때문이다'
        - '발이 둘뿐이라 발 하나에 실리는 무게가 커지고, 그만큼 발바닥의 마찰 계수가 함께 줄어들기 때문이다'
        - '무거울수록 밀릴 때의 관성이 커져서, 같은 힘을 받아도 무게중심이 4족 로봇보다 멀리 밀려나기 때문이다'
      answer: 0
      explanation: |
        밀린 몸은 발 가장자리를 축으로 돌아간다. 이때 미는 힘의 효과는 힘 × 무게중심 높이이고, 버티는 효과는 무게 × 가장자리까지의 거리다.
        humanoid 는 무게중심이 높고 발이 좁아서 무거워도 버티는 효과가 작다. PD gain 을 낮춘다는 것은 넘어지는 조건과 관계없는 가정이다.
        마찰 계수는 바닥과 발의 재질로 정해지며 실린 무게로 줄지 않는다. 무거울수록 같은 힘에 덜 가속되므로 더 멀리 밀려나지도 않는다.
    - question: |
        걷는 humanoid 가 걸음마다 균형을 잃기 가장 쉬운 순간과 그 이유로 알맞은 것은?
      choices:
        - '두 발로 설 때다. 두 발이 서로 다른 힘으로 바닥을 밀어서 무게중심이 두 발 사이에서 크게 흔들린다'
        - '발을 바닥에서 막 뗄 때다. 그 순간 관절 속도가 0 이 되어 PD controller 의 D 항이 사라진다'
        - '한 발로 설 때다. support polygon 이 발바닥 하나로 줄어 무게중심이 벗어날 여유가 가장 작다'
        - '발이 바닥에 닿을 때다. 닿는 순간 support polygon 이 갑자기 넓어져 무게중심이 그 밖으로 밀린다'
      answer: 2
      explanation: |
        support polygon 은 바닥에 닿은 곳을 감싼 영역이고, 무게중심을 바닥에 내린 점이 그 안에 있어야 쓰러지지 않는다. 한 발로 서면 이
        영역이 발바닥 하나로 줄어 여유가 가장 작다. 두 발로 설 때는 영역이 가장 넓다. 발을 떼는 순간에도 관절은 움직이고 있어서
        D 항이 사라지지 않는다. 영역이 넓어지면 무게중심이 그 밖으로 밀리는 것이 아니라 오히려 안에 들어오기 쉬워진다.
    - question: |
        두 발로 선 humanoid 가 팔로 무거운 상자를 몸 앞에 들어 올린다. 균형을 지키려면 하체는 무엇을 해야 하는가?
      choices:
        - '상자의 무게만큼 발목의 PD gain 을 키우면 된다. 팔이 든 무게는 무게중심의 위치를 바꾸지 않는다'
        - '로봇과 상자를 합친 무게중심이 앞으로 옮겨 가므로, 다리와 허리로 무게를 뒤로 옮겨 여유를 되찾는다'
        - '상자는 팔이 들고 있으므로 하체와 관계없다. 상체와 하체를 따로 제어하면 하체는 그대로 서 있으면 된다'
        - '무게가 늘면 넘어지는 힘도 같은 비율로 커지므로, 하체는 아무것도 하지 않아도 전보다 안정해진다'
      answer: 1
      explanation: |
        몸 앞에 든 상자는 로봇과 상자를 합친 무게중심을 앞으로 옮겨서 앞쪽 가장자리까지의 여유를 줄인다. 그래서 다리와 허리가 무게를
        뒤로 옮겨야 하고, 이것이 상체와 하체를 함께 조율해야 하는 이유다. 무게중심의 위치가 바뀌므로 gain 만 키워서는 해결되지 않는다.
        상체만 움직여도 하체가 받치는 무게와 위치가 바뀌므로 하체와 관계없다고 볼 수 없다. 무게가 늘어도 여유 거리가 줄면 넘어지는 힘은 커지지 않는다.

- topic: retargeting
  title: motion retargeting
  section: motion-capture-와-retargeting
  variants:
    - question: |
        사람 동작의 관절 각도를 humanoid 의 같은 관절에 그대로 복사하는 retargeting 의 약점은 무엇인가?
      choices:
        - '각도를 복사하면 관절의 회전 방향이 반대가 되어, 사람이 팔을 들면 로봇은 팔을 내리게 된다'
        - '사람의 관절은 로봇보다 적어서, 복사할 각도가 없는 로봇 관절은 0 으로 고정해야 한다'
        - '팔다리 길이와 어깨 폭이 달라서, 자세는 비슷해도 손발이 닿는 위치가 사람과 어긋난다'
        - '각도는 frame 마다 최적화 계산이 필요해서, 실시간 원격 조종에는 쓸 수 없을 만큼 느리다'
      answer: 2
      explanation: |
        각도를 그대로 쓰면 손이 움직이는 거리가 로봇의 팔 길이에 비례해서, 팔이 짧은 로봇은 박수를 쳐도 두 손이 만나지 않는다. 회전 방향은
        관절 축을 맞춰 복사하므로 반대가 되지 않는다. 사람 몸 모델(SMPL)의 관절 회전은 오히려 로봇 관절보다 많다. frame 마다 최적화가 필요한
        쪽은 keypoint 위치를 맞추는 방법이고, 각도 복사는 계산이 가볍다.
    - question: |
        keypoint 위치를 맞추는 retargeting 은 frame 마다 무엇을 계산하는가?
      choices:
        - '사람의 관절 각도를 로봇 관절 수에 맞게 평균 내어, 남는 사람 관절의 각도를 이웃 관절에 나눠 준다'
        - '로봇의 손·발·팔꿈치 같은 대응점이 사람의 같은 점에 가까워지도록 로봇의 관절 각도를 찾는다'
        - '사람의 체형을 로봇과 같게 바꾼 뒤, 사람의 관절 각도를 그대로 로봇의 관절 각도로 옮겨 적는다'
        - '로봇의 관절 각도를 고정한 채, 사람의 손발 위치가 로봇의 손발에 닿도록 사람의 동작을 고친다'
      answer: 1
      explanation: |
        위치 맞추기는 서로 대응하는 점들(H2O 에서는 12 개)의 거리 합이 작아지도록 로봇 관절 각도를 gradient descent 로 찾는다. 그래서 손발의 위치가
        보존된다. 각도를 평균 내어 나눠 주는 것은 위치를 맞추는 계산이 아니다. 체형을 맞추는 단계는 위치 맞추기 전에 한 번 하는 준비이고,
        그 뒤에도 각도가 아니라 위치를 맞춘다. 바꾸는 쪽은 로봇의 각도이지 사람의 동작이 아니다.
    - question: |
        H2O 는 keypoint 위치를 맞추기 전에 사람 몸 모델의 체형을 로봇에 가깝게 먼저 맞췄다. 이 단계가 필요했던 이유는 무엇인가?
      choices:
        - '로봇의 기본 자세는 두 발 사이가 넓어서, 평균 체형 사람의 발 위치에 맞추면 다리가 안쪽으로 모이기 때문이다'
        - '체형을 맞추면 사람의 동작에서 로봇이 할 수 없는 동작이 저절로 지워져 따로 거를 필요가 없기 때문이다'
        - '체형을 맞추지 않으면 사람과 로봇의 관절 수가 달라서, 대응하는 점을 하나도 고를 수 없기 때문이다'
        - '사람 몸 모델은 체형마다 관절 각도의 단위가 달라서, 같은 체형으로 바꿔야 각도를 비교할 수 있기 때문이다'
      answer: 0
      explanation: |
        H1 은 기본 자세에서 두 발 사이가 넓어서, 평균 체형 사람의 발 위치를 그대로 맞추면 다리가 안쪽으로 모이는 불안정한 자세가 나왔다.
        체형을 로봇에 맞춰 두면 맞출 위치 자체가 로봇이 할 수 있는 자세에 가까워진다. 대응점은 체형과 관계없이 고를 수 있다. 할 수 없는
        동작은 체형을 맞춘 뒤에도 남아서 sim-to-data 로 따로 거른다. 관절 각도의 단위는 체형에 따라 달라지지 않는다.

- topic: sim-to-data
  title: 따라 할 수 없는 동작 거르기
  section: sim-to-data-선별
  variants:
    - question: |
        H2O 의 sim-to-data 는 실제 로봇에 올릴 수 없는 privileged imitator 로 동작을 거른다. 이 policy 로 거르는 이유는 무엇인가?
      choices:
        - '모든 정보를 받고 randomization 없이 학습해 따라 하기 성능의 상한이라서, 이것이 실패한 동작은 로봇이 할 수 없다고 본다'
        - '실제 로봇과 같은 센서 값만 받으므로, 이것이 성공한 동작은 실제 로봇에서도 반드시 성공한다고 볼 수 있기 때문이다'
        - '학습이 빨라서 동작마다 policy 를 따로 학습한 뒤, 학습에 오래 걸린 동작을 어려운 동작으로 골라낼 수 있기 때문이다'
        - '사람이 직접 동작을 보고 고른 결과를 정답으로 배워서, 사람의 판단을 수천 개의 동작에 대신 적용할 수 있기 때문이다'
      answer: 0
      explanation: |
        privileged imitator 는 모든 link 의 위치·속도를 받고 domain randomization 도 없이 학습해서, 실제 로봇용 policy 보다 따라 하기가 쉽다.
        이 상한조차 실패한 동작은 로봇에게 무리한 동작으로 보고 지운다. 이 policy 는 실제 센서에 없는 값을 받으므로 실제 로봇과 같은 입력이
        아니다. 동작마다 따로 학습하지 않고 하나의 policy 로 모든 동작을 따라 한다. 사람이 고른 정답을 배우는 과정도 없다.
    - question: |
        H2O 에서 따라 할 수 없는 동작을 지운 데이터로 학습한 policy 가, 지우지 않은 더 많은 데이터로 학습한 policy 보다 전체 동작에서 성공률이
        높았다. 그 이유로 알맞은 것은?
      choices:
        - '평가할 때도 지운 동작을 빼고 쟀기 때문에, 남은 쉬운 동작만으로 성공률이 높게 나온 것이다'
        - '데이터가 적으면 같은 동작을 더 자주 보게 되어, policy 가 동작을 외워서 성공률이 오르기 때문이다'
        - '지운 동작이 학습 데이터의 대부분이어서, 남은 데이터만으로 학습 시간이 크게 줄었기 때문이다'
        - '할 수 없는 동작을 따라 하려고 학습을 낭비하지 않아, 할 수 있는 동작을 더 잘 익혔기 때문이다'
      answer: 3
      explanation: |
        로봇이 할 수 없는 동작이 섞여 있으면 policy 는 그 동작을 따라 하려고 학습을 낭비한다. 지우고 학습하면 할 수 있는 동작을 더 잘
        익혀서, 지운 동작까지 포함한 전체 평가에서도 성공률이 높았다. 평가는 지운 동작을 포함한 전체로 했다. 동작을 외워서 오른 성공률이라면
        학습에 없던 동작에서 오히려 떨어진다. H2O 에서 지운 동작은 전체의 일부(약 10,000 개 중 1,500 개)였다.
    - question: |
        ExBody2 는 동작마다 하체의 추적 오차를 재서 기준값 이하인 동작만 학습에 남겼다. 기준값을 정할 때 고려한 점으로 알맞은 것은?
      choices:
        - '기준값이 작을수록 할 수 없는 동작이 많이 남으므로, 가능한 한 작은 기준값이 늘 가장 좋은 policy 를 낸다'
        - '너무 작으면 쉬운 동작만 남아 일반화하지 못하고, 너무 크면 할 수 없는 동작이 섞여 학습이 흔들린다'
        - '기준값은 성공률에 영향이 없고, 학습 시간을 줄이려고 데이터 양을 원하는 크기로 맞추는 데만 쓴다'
        - '하체 오차는 동작의 난이도와 관계가 없어서, 기준값은 상체 동작의 다양성만 바꾸고 균형에는 영향이 없다'
      answer: 1
      explanation: |
        기준값이 너무 작으면 쉬운 동작만 남아 어려운 동작으로 일반화하지 못했고, 너무 크면 할 수 없는 동작이 섞여 학습이 흔들렸다. 그래서
        ExBody2 에서는 중간 기준값이 가장 좋았다. 기준값이 작을수록 할 수 없는 동작은 오히려 적게 남는다. 기준값은 성공률을 바꾸는 선택이다. 하체 오차로 거른
        것은 하체 동작이 균형을 정하기 때문이고, 그래서 상체 동작의 다양성은 남긴다.

- topic: tracking-reward
  title: motion tracking 의 reward 와 학습
  section: motion-tracking-reward
  variants:
    - question: |
        tracking reward 의 한 항목이 오차를 넣어 $e^{-k \times \text{오차}^2}$ 로 점수를 낸다. 계수 $k$ 를 키우면 무엇이 달라지는가?
      choices:
        - '점수의 최댓값이 $k$ 배로 커져서, 이 항목이 다른 항목보다 reward 에 더 큰 몫을 차지한다'
        - '오차가 0 일 때 점수가 0 이 되어서, policy 는 오차를 일부러 조금 남기는 쪽을 배우게 된다'
        - '같은 오차에서도 점수가 더 빨리 떨어져서, 작은 오차에도 점수가 눈에 띄게 줄어든다'
        - '오차의 단위가 m 에서 cm 로 바뀌어서, 점수가 오차에 반비례하는 꼴로 바뀌게 된다'
      answer: 2
      explanation: |
        지수 안에서 $k$ 를 오차의 제곱에 곱하므로, $k$ 가 크면 같은 오차에서 지수가 더 큰 음수가 되어 점수가 더 작아진다. 그래서 m 단위의
        작은 손발 오차에는 큰 $k$(DeepMimic 에서는 40)를 쓴다. 오차가 0 이면 $k$ 와 관계없이 점수는 $e^0 = 1$ 로 최댓값이 바뀌지 않는다.
        항목의 몫은 weight 로 정한다. $k$ 는 단위를 바꾸지 않고 식의 꼴도 바꾸지 않는다.
    - question: |
        DeepMimic 은 episode 를 늘 동작의 처음이 아니라 reference 동작의 무작위 시점에서, 그 시점의 자세와 속도로 시작했다(RSI). 뒤공중제비
        같은 동작에서 이 방법이 필요한 이유는 무엇인가?
      choices:
        - '무작위 시점에서 시작하면 episode 가 짧아져서, 같은 시간에 PPO 의 update 를 더 자주 할 수 있기 때문이다'
        - '시작 시점을 바꾸면 reference 동작이 매번 달라져서, 따로 데이터를 모으지 않아도 동작 수가 늘어나기 때문이다'
        - '처음 자세는 simulation 에서 만들 수 없어서, 동작 중간의 자세로만 로봇을 놓을 수 있기 때문이다'
        - '처음에서만 시작하면 착지 장면에 가 볼 일이 드물어, 착지를 배워야 받는 높은 return 을 발견하기 어렵기 때문이다'
      answer: 3
      explanation: |
        뒤공중제비를 따라 하는 policy 는 착지를 할 줄 알아야 점프에서 높은 return 을 받지만, 처음에서만 시작하면 착지 장면을 거의 겪지 못한다. RSI 로
        중간 시점에서도 시작하면 여러 단계를 나란히 배운다. DeepMimic 에서 RSI 없이 학습한 policy 는 뒤로 작게 뛰기만 했다. episode 길이를 줄이는
        것이 목적이 아니다. 처음 자세도 simulation 에 놓을 수 있다. reference 동작 자체는 그대로이고 시작 시점만 바뀐다.
    - question: |
        motion tracking 학습에서 몸통이나 머리가 바닥에 닿으면 episode 를 바로 끝내지 않고 끝까지 진행하면 어떤 policy 가 나오기 쉬운가?
      choices:
        - '쓰러진 뒤에도 남은 시간 동안 tracking reward 를 받으므로, 바닥에 누운 채 동작을 흉내 내는 policy'
        - '쓰러지면 reward 가 모두 0 이 되므로, 위험한 동작은 아예 시도하지 않고 서 있기만 하는 policy'
        - '끝까지 진행하면 데이터가 늘어나므로, 조기 종료를 쓸 때보다 더 빨리 모든 동작을 익히는 policy'
        - '쓰러진 상태에서 일어나는 법을 저절로 익혀서, 실제 로봇에서 넘어져도 혼자 일어서는 policy'
      answer: 0
      explanation: |
        조기 종료가 없으면 쓰러진 뒤에도 자세 항목 같은 tracking reward 를 조금씩 받을 수 있어서, DeepMimic 에서는 바닥에 누워 동작을 흉내 내는
        policy 가 나왔다. 조기 종료는 남은 reward 를 잃게 해 이런 행동을 막는다. 끝까지 진행해도 reward 가 0 이 되지는 않는다. 늘어나는 데이터는
        대부분 바닥에서 버둥대는 쓸모없는 데이터다. 일어나는 법은 reward 로 따로 요구하지 않는 한 저절로 생기지 않는다.

- topic: teacher-student
  title: privileged teacher 와 student
  section: privileged-teacher-와-student
  variants:
    - question: |
        OmniH2O 의 student policy 는 몸통이 땅 위를 움직이는 속도(linear velocity)를 입력으로 받지 않는데도 전신 동작을 따라 한다. 어떻게 가능한가?
      choices:
        - '실제 로봇의 mocap 시스템이 속도를 재서 teacher 에게 보내고, teacher 가 student 대신 action 을 내기 때문이다'
        - '지난 25 step 의 관절과 IMU 값 이력을 받아서, 그 변화로부터 몸통의 속도를 스스로 짐작하기 때문이다'
        - '속도는 균형과 관계없는 값이라서, 관절 각도만 맞추면 몸통의 움직임은 저절로 reference 와 같아지기 때문이다'
        - 'VR 헤드셋이 사람의 걷는 속도를 재서 넘겨주고, 그 값을 로봇의 몸통 속도로 그대로 쓰기 때문이다'
      answer: 1
      explanation: |
        student 는 지금 상태와 함께 지난 25 step 의 관절 각도·속도, 몸통 각속도, 중력 방향, 직전 action 을 받는다. 이 이력의 변화로 속도를
        짐작하므로 H2O 처럼 mocap 으로 로봇 속도를 잴 필요가 없다. 실제 로봇에는 student 만 올라가고 teacher 는 쓰이지 않는다. 몸통의 속도는
        균형과 동작 추적에 중요한 값이다. VR 헤드셋은 사람의 머리와 두 손 위치를 줄 뿐 로봇의 속도를 주지 않는다.
    - question: |
        OmniH2O 에서 25 step 이력을 받는 같은 student 입력을 PPO 로 바로 학습하면 성공률이 크게 낮았고, DAgger 로 teacher 를 따라 배우면 teacher 에
        가까웠다. 이 차이를 설명하는 것은?
      choices:
        - 'DAgger 는 실제 로봇에서 모은 데이터로 학습하므로, simulation 만 쓰는 PPO 보다 reality gap 이 작기 때문이다'
        - 'PPO 는 입력이 길수록 학습률을 자동으로 줄여서, 같은 시간 안에 update 를 거의 하지 못하기 때문이다'
        - 'teacher 가 student 보다 network 가 커서, 따라 배우면 student 의 parameter 수도 저절로 커지기 때문이다'
        - '긴 입력을 reward 만으로 학습하는 PPO 는 복잡함을 감당하지 못하고, 정답 action 을 주는 학습은 이력을 잘 쓴다'
      answer: 3
      explanation: |
        입력이 길어지면 reward 만 보고 학습하는 PPO 는 그 복잡함을 감당하지 못한다. 반면 DAgger 는 student 가 간 상태마다 teacher 의 action 을
        정답으로 주는 supervised learning 이라서 긴 이력을 잘 쓴다. DAgger 의 데이터도 simulation 에서 student 가 움직이며 모은다. PPO 가 입력 길이에 따라
        학습률을 줄이지는 않는다. 따라 배워도 student network 의 크기는 바뀌지 않는다.
    - question: |
        ASAP 과 SONIC 이 쓴 asymmetric actor-critic 은 teacher-student 학습과 어떻게 다른가?
      choices:
        - 'critic 만 privileged 정보를 받고 actor 는 실제 로봇의 입력만 받아서, 따로 증류하는 단계가 필요 없다'
        - 'actor 와 critic 이 모두 privileged 정보를 받고, 실제 로봇에 올릴 때만 privileged 입력을 0 으로 채운다'
        - 'teacher 를 먼저 학습한 뒤 그 action 을 critic 의 정답으로 쓰므로, 학습 단계가 하나 더 늘어난다'
        - 'critic 없이 actor 만 학습하고, privileged 정보는 reward 를 계산할 때만 쓰므로 학습이 더 단순하다'
      answer: 0
      explanation: |
        asymmetric actor-critic 에서는 상태의 가치를 맞히는 critic 만 privileged 정보를 보고, action 을 내는 actor 는 처음부터 배포할 때와 같은
        입력으로 학습한다. 로봇에는 actor 만 올라가므로 teacher 를 student 로 증류하는 단계가 없다. 입력을 0 으로 채워 올리면 학습 때와 입력이
        달라져 성능을 보장할 수 없다. teacher 를 따로 두지 않는 방법이고, PPO 의 critic 도 그대로 쓴다.

- topic: tracking-target
  title: 범용 motion tracking 의 목표 설계
  section: 범용-motion-tracking-controller
  variants:
    - question: |
        로봇이 미끄러져 골반이 reference 보다 0.3 m 뒤처졌지만 골반에 대한 팔 자세는 reference 와 같다. 손 keypoint 의 목표를 출발점 기준의 전역
        위치로 주면 어떤 일이 생길 수 있는가?
      choices:
        - '전역 위치로는 손 오차가 0 이 되어서, policy 가 몸 전체가 뒤처진 것을 알아차리지 못한다'
        - '골반 기준 위치보다 계산이 단순해서, 몸이 뒤처져도 오차가 작게 나와 학습이 안정해진다'
        - '팔 자세는 맞는데 손 오차가 0.3 m 로 잡혀서, policy 가 팔을 내뻗는 식으로 잘못 고칠 수 있다'
        - '손 목표가 로봇 뒤쪽으로 바뀌어서, policy 가 팔을 등 뒤로 돌리는 자세를 배우게 된다'
      answer: 2
      explanation: |
        전역 위치에서는 몸 전체가 0.3 m 뒤처진 몫이 손 오차로 그대로 잡힌다. 팔 자세가 맞아도 오차가 남으므로 policy 가 팔을 뻗어 메우려 할 수
        있다. 그래서 ExBody2 는 keypoint 를 골반 기준으로 바꾸고 몸의 위치는 속도 추적에 맡겼다. 전역 오차는 0 이 아니라 0.3 m 다. 오차가
        작게 나온다는 것도 반대다. 목표는 여전히 로봇의 앞쪽에 있어 등 뒤로 바뀌지 않는다.
    - question: |
        ExBody 는 상체만 reference 동작을 따라 하고 다리는 몸통 속도 명령만 따르게 했다. 이 설계의 이유와 대가로 알맞은 것은?
      choices:
        - '다리 관절에는 각도 센서가 없어서 따라 할 수 없었고, 그 대가로 로봇이 제자리에서만 움직일 수 있었다'
        - '상체 동작은 균형과 관계없어서 따로 둔 것이고, 그 대가로 팔 동작의 정확도가 크게 떨어졌다'
        - '다리 동작을 맞추면 학습 시간이 너무 길어서였고, 그 대가로 policy 가 평지에서만 걸을 수 있었다'
        - '사람 다리 동작까지 맞추면 제약이 지나쳐 policy 가 불안정해서였고, 그 대가로 다리 동작은 따라 하지 못한다'
      answer: 3
      explanation: |
        ExBody 의 저자들은 사람 다리 동작까지 맞추게 하면 제약이 지나쳐 불안정한 policy 가 나온다고 보고 다리는 속도 명령만 따르게 했다. 그 대가로
        ExBody2 의 비교에서 ExBody 의 하체 관절 오차는 전신을 따라 한 ExBody2 의 두 배를 넘었다. H1 의 다리 관절에도 각도 센서가 있고, ExBody 는
        걷고 방향을 바꾸며 움직였다. 상체 동작도 무게중심을 옮겨 균형에 영향을 준다. 저자들은 학습 시간을 이유로 들지 않았다.
    - question: |
        GMT 는 tracking 목표로 바로 다음 frame 하나가 아니라 앞으로 약 2 초 분량의 frame 을 함께 준다. 그 목적으로 알맞은 것은?
      choices:
        - 'policy 가 다가오는 동작을 미리 보고, 지금 자세에서 그 동작에 대비하게 하려는 것이다'
        - '2 초마다 한 번만 policy 를 계산해도 되게 해서, 로봇에 실은 컴퓨터의 계산을 줄이려는 것이다'
        - 'frame 을 여러 개 주면 reward 의 항목 수가 늘어나서, penalty 를 따로 두지 않아도 되기 때문이다'
        - '미래 frame 으로 지금 frame 의 noise 를 평균 내서, mocap 데이터의 측정 오차를 지우려는 것이다'
      answer: 0
      explanation: |
        다음 순간의 자세만 보면 곧 뛰거나 방향을 바꿀 동작에 미리 무게를 옮길 수 없다. 약 2 초 분량의 미래 목표를 주면 policy 가 다가오는 동작에
        대비할 수 있다. policy 는 여전히 매 step 계산하므로 계산이 줄지 않는다. 입력이 늘어도 reward 항목이나 penalty 는 바뀌지 않는다. 미래
        frame 은 평균 내는 데 쓰는 것이 아니라 앞으로 할 동작의 정보로 쓴다.

- topic: delta-action
  title: delta action model
  section: delta-action-model
  variants:
    - question: |
        ASAP 의 delta action model 은 무엇을 배우는가?
      choices:
        - '실제 로봇의 질량과 PD gain 같은 parameter 를 측정값에 맞게 찾아, simulator 의 설정 파일을 고친다'
        - '실제 로봇에서 다음 상태를 바로 예측해서, policy 대신 다음 action 을 정하는 model 이 된다'
        - 'policy 의 action 에 무작위 noise 를 더하는 크기를 배워서, domain randomization 의 범위를 넓힌다'
        - 'simulation 에서 실제 기록과 같은 결과가 나오도록, 상태와 action 을 보고 action 에 더할 보정값을 낸다'
      answer: 3
      explanation: |
        delta action model 은 상태와 action 을 받아 보정값을 내고, simulation 은 action 에 그 값을 더해 진행한다. 다음 상태가 실제 기록과 가까울수록
        reward 를 주어 학습하므로 simulation 이 실제 로봇처럼 움직이게 된다. parameter 를 찾는 것은 SysID 다. 다음 상태를 예측하는 것은 delta
        dynamics 쪽이고, delta action model 은 policy 를 대신하지도 않는다. ASAP 에서 delta action 이 무작위 noise 보다 나았던 것은 관절마다 다른 구조의 차이를 배우기 때문이다.
    - question: |
        ASAP 은 delta action model 을 넣은 simulation 에서 policy 를 fine-tuning 한 뒤, 실제 로봇에는 delta action model 없이 policy 만 올린다. 그 이유는
        무엇인가?
      choices:
        - 'delta action model 은 계산이 무거워서 로봇에 실은 컴퓨터로는 policy 와 함께 1 초에 50 번 계산할 수 없기 때문이다'
        - '실제 로봇은 그 차이를 이미 몸으로 만들므로, 보정값을 또 더하면 같은 차이를 두 번 반영하게 되기 때문이다'
        - 'fine-tuning 이 끝나면 policy 와 delta action model 의 weight 가 하나로 합쳐져서 따로 둘 필요가 없기 때문이다'
        - 'delta action model 은 simulator 끼리의 차이만 배워서, 실제 로봇과의 차이에는 쓸 수 없기 때문이다'
      answer: 1
      explanation: |
        delta action model 은 simulation 을 실제 로봇처럼 만들려고 넣은 것이다. 실제 로봇은 그 차이를 이미 몸으로 만들기 때문에, 고친 simulation 에서
        배운 action 을 그대로 내면 된다. 보정값을 또 더하면 같은 차이가 두 번 반영된다. 저자들은 계산량을 이유로 들지 않았다. 두 network 를
        합치지 않고, delta action model 을 고정한 채 policy 만 고친다. ASAP 의 저자들은 실제 G1 의 기록으로도 delta action model 을 학습했다.
    - question: |
        domain randomization 이나 system identification(SysID)과 비교했을 때 delta action model 이 갖는 장점으로 알맞은 것은?
      choices:
        - '실제 데이터가 전혀 필요 없어서, 로봇을 망가뜨릴 위험 없이 simulation 만으로 차이를 메울 수 있다'
        - '모든 관절의 보정값을 한 번에 배우는 것이 늘 가장 좋아서, 기록 수와 관계없이 전신을 고칠 수 있다'
        - '정해 둔 parameter 로 설명하지 않고 실제 기록에 맞춰 action 을 고치므로, 모델에 없는 차이도 잡을 수 있다'
        - 'randomization 범위를 넓힐수록 정확해져서, 범위를 최대로 잡으면 실제 로봇과 똑같은 simulation 이 된다'
      answer: 2
      explanation: |
        SysID 는 미리 정한 parameter 만 맞추고, 넓은 domain randomization 은 조심스러운 policy 를 만든다. delta action 은 실제 기록에 맞도록
        action 의 보정값을 배우므로 parameter 로 적기 어려운 차이도 담는다. 대신 실제 기록이 필요하고, ASAP 의 기록 중에 G1 두 대가 망가졌다.
        23 개 관절 전체를 고치려면 기록이 400 개 넘게 필요해서 발목 관절 4 개만 고쳤다. randomization 범위를 넓히는 것은 delta action 의 방식이 아니다.

- topic: wbc-under-vla
  title: VLA 아래의 whole-body controller
  section: vla-아래의-whole-body-controller
  variants:
    - question: |
        걷는 humanoid 에서 VLA 가 관절 목표를 직접 내지 않고, 그 아래에 1 초에 50 번 계산하는 whole-body controller 를 두는 이유는 무엇인가?
      choices:
        - 'VLA 는 손 관절만 다룰 수 있게 학습되어서, 다리 관절의 숫자를 내는 출력층을 가질 수 없기 때문이다'
        - '관절 목표는 1 초에 한 번만 바뀌면 충분해서, VLA 의 출력 사이를 whole-body controller 가 채울 필요가 없기 때문이다'
