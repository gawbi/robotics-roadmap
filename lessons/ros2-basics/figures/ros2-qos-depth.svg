<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>30 Hz 카메라와 10 Hz policy 의 queue. depth 10 이면 queue 에 최근 사진 10 장이 쌓여 policy 가 꺼내는 사진은 약 0.3 초 전 것이고, depth 1 이면 가장 최근 사진 1 장만 남아 33 ms 안의 것이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="798" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="400.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="middle">카메라 30 Hz (33 ms 마다 1 장) → queue → policy 10 Hz (100 ms 마다 1 장)</text>
  <text x="30.0" y="110.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">depth 10</text>
  <rect x="150.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#3b2a0a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175.0" y="110.0" fill="#f59e0b" font-size="12" text-anchor="middle">300</text>
  <rect x="206.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="231.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">267</text>
  <rect x="262.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="287.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">233</text>
  <rect x="318.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="343.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">200</text>
  <rect x="374.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="399.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">167</text>
  <rect x="430.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="455.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">133</text>
  <rect x="486.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="511.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">100</text>
  <rect x="542.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="567.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">67</text>
  <rect x="598.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="623.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">33</text>
  <rect x="654.0" y="85.0" width="50.0" height="40.0" rx="5" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="679.0" y="110.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0</text>
  <text x="402.0" y="143.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">사진을 찍은 뒤 지난 시간 (ms), 왼쪽이 가장 오래된 사진</text>
  <line x1="740.0" y1="105.0" x2="716.0" y2="105.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="744.0" y="109.0" fill="#38bdf8" font-size="12" text-anchor="start">새 사진</text>
  <line x1="175.0" y1="151.0" x2="175.0" y2="181.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="187.0" y="177.0" fill="#f59e0b" font-size="12.5" text-anchor="start">policy 가 꺼내는 사진: 약 300 ms 전 (9 장 × 33 ms)</text>
  <text x="30.0" y="250.0" fill="#e2e8f0" font-size="14" text-anchor="start" font-weight="600">depth 1</text>
  <rect x="150.0" y="225.0" width="50.0" height="40.0" rx="5" fill="#0b2a20" stroke="#34d399" stroke-width="1.5"/>
  <text x="175.0" y="250.0" fill="#34d399" font-size="11" text-anchor="middle">0 ~ 33</text>
  <line x1="260.0" y1="245.0" x2="206.0" y2="245.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="264.0" y="249.0" fill="#38bdf8" font-size="12" text-anchor="start">새 사진이 오면 이전 사진을 덮어쓴다</text>
  <line x1="175.0" y1="269.0" x2="175.0" y2="295.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="187.0" y="293.0" fill="#34d399" font-size="12.5" text-anchor="start">policy 가 꺼내는 사진: 언제나 33 ms 안</text>
</svg>
