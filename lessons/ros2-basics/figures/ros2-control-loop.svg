<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>policy node 와 ros2_control 의 두 주기. policy 는 20 Hz 로 목표를 topic 에 publish 하고, controller_manager 는 1000 Hz 로 read, update, write 를 되풀이하며 같은 process 안의 hardware interface 와 값을 주고받는다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="798" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="25.0" y="110.0" width="140.0" height="70.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="95.0" y="138.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="600">policy node</text>
  <text x="95.0" y="160.0" fill="#e2e8f0" font-size="12" text-anchor="middle">20 Hz (50 ms)</text>
  <line x1="167.0" y1="145.0" x2="248.0" y2="145.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="207.0" y="135.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">topic</text>
  <text x="207.0" y="166.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">목표</text>
  <rect x="250.0" y="40.0" width="400.0" height="220.0" rx="12" fill="#0d1a1a" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="450.0" y="62.0" fill="#34d399" font-size="12.5" text-anchor="middle">한 process (ros2_control_node)</text>
  <text x="450.0" y="82.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">controller_manager · 1000 Hz (1 ms 마다)</text>
  <rect x="250.0" y="100.0" width="100.0" height="40.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="300.0" y="125.0" fill="#e2e8f0" font-size="13" text-anchor="middle">read</text>
  <rect x="400.0" y="100.0" width="100.0" height="40.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="450.0" y="125.0" fill="#e2e8f0" font-size="13" text-anchor="middle">update</text>
  <rect x="550.0" y="100.0" width="100.0" height="40.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="600.0" y="125.0" fill="#e2e8f0" font-size="13" text-anchor="middle">write</text>
  <line x1="351.0" y1="120.0" x2="398.0" y2="120.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#ag)"/>
  <line x1="501.0" y1="120.0" x2="548.0" y2="120.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="450.0" y="172.0" fill="#34d399" font-size="11.5" text-anchor="middle">1 ms 마다 read → update → write 를 되풀이</text>
  <rect x="300.0" y="198.0" width="300.0" height="40.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450.0" y="223.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">hardware interface (plugin)</text>
  <line x1="300.0" y1="196.0" x2="300.0" y2="143.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#am)"/>
  <line x1="600.0" y1="142.0" x2="600.0" y2="195.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#am)"/>
  <text x="292.0" y="186.0" fill="#94a3b8" font-size="11" text-anchor="end">상태</text>
  <text x="608.0" y="186.0" fill="#94a3b8" font-size="11" text-anchor="start">명령</text>
  <line x1="602.0" y1="218.0" x2="688.0" y2="218.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="688.0" y1="230.0" x2="602.0" y2="230.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="690.0" y="195.0" width="90.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="735.0" y="217.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">motor</text>
  <text x="735.0" y="234.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">encoder</text>
  <text x="450.0" y="285.0" fill="#94a3b8" font-size="12" text-anchor="middle">policy 가 목표를 한 번 낼 때 controller 는 50 번 계산한다 (50 ms ÷ 1 ms)</text>
</svg>
