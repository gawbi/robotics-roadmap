<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>topic, service, action 의 메시지 흐름. topic 은 publisher 가 subscriber 들에게 한쪽으로 계속 보낸다. service 는 request 하나에 response 하나가 돌아온다. action 은 goal 을 보낸 뒤 feedback 이 여러 번 오고, 도중에 cancel 하거나 끝에 result 를 받는다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="838" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="145.0" y="32.0" fill="#38bdf8" font-size="15" text-anchor="middle" font-weight="600">topic</text>
  <rect x="23.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="65.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">publisher</text>
  <line x1="65.0" y1="72.0" x2="65.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="183.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="225.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">subscriber</text>
  <line x1="225.0" y1="72.0" x2="225.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="420.0" y="32.0" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">service</text>
  <rect x="298.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">client</text>
  <line x1="340.0" y1="72.0" x2="340.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="458.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">server</text>
  <line x1="500.0" y1="72.0" x2="500.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="695.0" y="32.0" fill="#34d399" font-size="15" text-anchor="middle" font-weight="600">action</text>
  <rect x="573.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="615.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">client</text>
  <line x1="615.0" y1="72.0" x2="615.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="733.0" y="46.0" width="84.0" height="26.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="775.0" y="64.0" fill="#e2e8f0" font-size="12" text-anchor="middle">server</text>
  <line x1="775.0" y1="72.0" x2="775.0" y2="300.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="65.0" y1="105.0" x2="223.0" y2="105.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="145.0" y="99.0" fill="#94a3b8" font-size="11" text-anchor="middle">message 1</text>
  <line x1="65.0" y1="145.0" x2="223.0" y2="145.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="145.0" y="139.0" fill="#94a3b8" font-size="11" text-anchor="middle">message 2</text>
  <line x1="65.0" y1="185.0" x2="223.0" y2="185.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="145.0" y="179.0" fill="#94a3b8" font-size="11" text-anchor="middle">message 3</text>
  <line x1="65.0" y1="225.0" x2="223.0" y2="225.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="145.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">message 4</text>
  <text x="145.0" y="270.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">받는 쪽이 몇이든 한쪽으로 계속</text>
  <line x1="340.0" y1="110.0" x2="498.0" y2="110.0" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="420.0" y="104.0" fill="#e2e8f0" font-size="12" text-anchor="middle">request</text>
  <rect x="494.0" y="116.0" width="12.0" height="50.0" rx="2" fill="#3b2a0a" stroke="#f59e0b" stroke-width="1"/>
  <line x1="500.0" y1="172.0" x2="342.0" y2="172.0" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aa)"/>
  <text x="420.0" y="166.0" fill="#e2e8f0" font-size="12" text-anchor="middle">response</text>
  <text x="420.0" y="225.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">요청 하나에 응답 하나,</text>
  <text x="420.0" y="243.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">빨리 끝나야 한다</text>
  <line x1="615.0" y1="100.0" x2="773.0" y2="100.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="695.0" y="94.0" fill="#e2e8f0" font-size="12" text-anchor="middle">goal (목표 위치)</text>
  <line x1="775.0" y1="135.0" x2="617.0" y2="135.0" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="695.0" y="129.0" fill="#94a3b8" font-size="11" text-anchor="middle">feedback: 남은 거리 20 m</text>
  <line x1="775.0" y1="170.0" x2="617.0" y2="170.0" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ag)"/>
  <text x="695.0" y="164.0" fill="#94a3b8" font-size="11" text-anchor="middle">feedback: 남은 거리 10 m</text>
  <line x1="615.0" y1="205.0" x2="773.0" y2="205.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#am)"/>
  <text x="695.0" y="199.0" fill="#94a3b8" font-size="11" text-anchor="middle">cancel (필요하면)</text>
  <line x1="775.0" y1="245.0" x2="617.0" y2="245.0" stroke="#34d399" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="695.0" y="239.0" fill="#e2e8f0" font-size="12" text-anchor="middle">result</text>
  <text x="695.0" y="280.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">오래 걸리는 일, 중간 보고와 취소</text>
</svg>
