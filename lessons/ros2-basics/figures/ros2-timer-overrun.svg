<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>10 ms 간격 timer 의 callback 이 25 ms 걸릴 때. 10 ms 예정분은 바로 실행되어 35 ms 까지 thread 를 쓰고, 20 ms 예정분은 15 ms 기다렸다가 35 ms 에, 40 ms 예정분은 20 ms 기다렸다가 60 ms 에 실행된다. 기다리는 동안 지난 30 ms 와 50 ms 예정 시각은 건너뛴다</title>
  <defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker></defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="86" fill="#e2e8f0" font-size="14" font-weight="600">예정 시각</text>
  <text x="24" y="104" fill="#94a3b8" font-size="12">timer, 10 ms 마다</text>
  <text x="24" y="206" fill="#e2e8f0" font-size="14" font-weight="600">실제 실행</text>
  <text x="24" y="224" fill="#94a3b8" font-size="12">executor 의 thread</text>
  <line x1="240" y1="96" x2="240" y2="186" stroke="#1e293b" stroke-width="1"/>
  <line x1="320" y1="96" x2="320" y2="186" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="96" x2="400" y2="186" stroke="#1e293b" stroke-width="1"/>
  <line x1="480" y1="96" x2="480" y2="186" stroke="#1e293b" stroke-width="1"/>
  <line x1="560" y1="96" x2="560" y2="186" stroke="#1e293b" stroke-width="1"/>
  <text x="240" y="62" fill="#7fc4a2" font-size="13" font-weight="600" text-anchor="middle">10 ms</text>
  <circle cx="240" cy="84" r="7" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="2"/>
  <text x="240" y="112" fill="#7fc4a2" font-size="11.5" text-anchor="middle">바로 실행</text>
  <text x="320" y="62" fill="#d6aa62" font-size="13" font-weight="600" text-anchor="middle">20 ms</text>
  <circle cx="320" cy="84" r="7" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <text x="320" y="112" fill="#d6aa62" font-size="11.5" text-anchor="middle">기다림</text>
  <text x="400" y="62" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">30 ms</text>
  <circle cx="400" cy="84" r="7" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
  <line x1="395" y1="79" x2="405" y2="89" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="112" fill="#94a3b8" font-size="11.5" text-anchor="middle">건너뜀</text>
  <text x="480" y="62" fill="#d6aa62" font-size="13" font-weight="600" text-anchor="middle">40 ms</text>
  <circle cx="480" cy="84" r="7" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <text x="480" y="112" fill="#d6aa62" font-size="11.5" text-anchor="middle">기다림</text>
  <text x="560" y="62" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">50 ms</text>
  <circle cx="560" cy="84" r="7" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
  <line x1="555" y1="79" x2="565" y2="89" stroke="#64748b" stroke-width="2"/>
  <text x="560" y="112" fill="#94a3b8" font-size="11.5" text-anchor="middle">건너뜀</text>
  <line x1="240" y1="120" x2="240" y2="182" stroke="#7fc4a2" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M320,120 L320,160 L440,160 L440,182" fill="none" stroke="#d6aa62" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <text x="380.0" y="152" fill="#d6aa62" font-size="12" text-anchor="middle">15 ms 늦게</text>
  <path d="M480,120 L480,160 L640,160 L640,182" fill="none" stroke="#d6aa62" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aa)"/>
  <text x="560.0" y="152" fill="#d6aa62" font-size="12" text-anchor="middle">20 ms 늦게</text>
  <rect x="241" y="186" width="198" height="40" rx="5" fill="#3b2a0a" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="340.0" y="204" fill="#e2e8f0" font-size="12.5" text-anchor="middle">10 ms 예정분 실행</text>
  <text x="340.0" y="219" fill="#94a3b8" font-size="11" text-anchor="middle">10 → 35 ms</text>
  <rect x="441" y="186" width="198" height="40" rx="5" fill="#3b2a0a" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="540.0" y="204" fill="#e2e8f0" font-size="12.5" text-anchor="middle">20 ms 예정분 실행</text>
  <text x="540.0" y="219" fill="#94a3b8" font-size="11" text-anchor="middle">35 → 60 ms</text>
  <rect x="641" y="186" width="120" height="40" rx="5" fill="#3b2a0a" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="648" y="211" fill="#e2e8f0" font-size="12.5">40 ms 예정분 …</text>
  <text x="240" y="244" fill="#d6aa62" font-size="12" font-weight="600" text-anchor="middle">10</text>
  <text x="440" y="244" fill="#d6aa62" font-size="12" font-weight="600" text-anchor="middle">35</text>
  <text x="640" y="244" fill="#d6aa62" font-size="12" font-weight="600" text-anchor="middle">60</text>
  <text x="160" y="244" fill="#94a3b8" font-size="11" text-anchor="end">시작 (ms)</text>
  <text x="390" y="280" fill="#94a3b8" font-size="12.5" text-anchor="middle">callback 이 끝나자마자 다음 예정분이 실행되어, 실제 간격은 10 ms 가 아니라 25 ms 다</text>
</svg>
