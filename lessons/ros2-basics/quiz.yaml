# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: node-topic
  title: node 와 topic 으로 나누는 이유
  section: 로봇-프로그램과-middleware
  variants:
    - question: |
        로봇 소프트웨어를 프로그램 하나로 짜지 않고 camera driver, policy, motor controller 를 각각 다른 node 로 나누는 이유는 무엇인가?
      choices:
        - 'node 를 나누면 각 node 가 필요한 데이터를 직접 읽게 되어 message 를 주고받을 일이 없고, 통신 비용이 0 이 되기 때문이다'
        - '일마다 계산 주기가 달라 따로 실행해야 하고, process 를 나누면 하나가 오류로 꺼져도 나머지는 계속 실행되기 때문이다'
        - 'ROS 2 는 node 하나에 callback 을 하나만 둘 수 있어서, camera·policy·motor 의 callback 을 한 node 에 넣을 수 없기 때문이다'
        - 'node 를 나누면 node 마다 CPU core 를 하나씩 차지해서, 모든 계산이 정해진 시간 안에 끝나는 real-time 이 보장되기 때문이다'
      answer: 1
      explanation: |
        카메라는 30 Hz, policy 는 10 ~ 50 Hz, motor 제어는 수백 ~ 1000 Hz 처럼 주기가 달라서, 한 흐름에 넣으면 느린 계산이 빠른 제어를 막는다.
        다른 process 로 나누면 메모리가 따로라서 한 process 가 강제 종료돼도 나머지는 계속 실행된다. 나누면 오히려 통신이 필요해지고, node 하나에
        callback 은 여러 개 둘 수 있으며, 나눈다고 real-time 이 보장되지는 않는다.
    - question: |
        ROS 2 topic 이 'anonymous publish/subscribe' 라는 것은 무슨 뜻이고, 로봇 개발에서 어떤 이점이 있는가?
      choices:
        - 'message 가 암호화되어 subscriber 는 누가 보냈는지 알 수 없고, 다른 컴퓨터가 끼어들어도 내용을 읽지 못해 보안이 보장된다'
        - 'topic 하나에 publisher 와 subscriber 가 하나씩만 붙어 서로 이름을 알 필요가 없으므로, 연결이 단순하고 message 가 섞이지 않는다'
        - 'subscriber 가 publisher 이름을 몰라도 topic 에 요청을 보내면 publisher 가 그때마다 응답해서, 필요한 순간에만 message 를 받는다'
        - 'publisher 와 subscriber 가 서로를 모른 채 topic 이름과 형식으로만 이어져서, driver 를 바꾸거나 녹화 도구를 붙여도 다른 node 를 고치지 않는다'
      answer: 3
      explanation: |
        publisher 는 누가 받는지 모르고 subscriber 도 누가 보냈는지 따지지 않으며, 둘은 topic 이름과 message 형식으로만 이어진다. 그래서 한 topic 에
        publisher 와 subscriber 가 몇 개든 붙을 수 있고, 부품을 바꿔도 이름과 형식만 같으면 된다. anonymous 는 암호화와 관계없고, 일대일 제한이나
        요청 기반 전달도 아니다(요청·응답은 service 다).
    - question: |
        주행 중인 로봇의 카메라 topic 을 녹화하려고 ros2 bag record 를 실행했다. 이미 그 topic 을 받고 있던 policy node 에는 어떤 영향이 있는가?
      choices:
        - '녹화 도구가 subscriber 하나로 더 붙을 뿐이라 policy 가 받는 message 의 흐름은 그대로다'
        - 'topic 하나에는 subscriber 가 하나만 붙을 수 있어서, 나중에 붙은 녹화 도구가 연결을 가져가고 policy 의 연결은 끊긴다'
        - 'publisher 가 녹화 도구에 지난 message 를 먼저 보내느라 멈추고, policy 는 녹화가 끝날 때까지 message 를 받지 못한다'
        - '새 subscriber 가 붙으면 topic 연결을 처음부터 다시 맺으므로, policy 를 다시 시작해야 message 를 계속 받을 수 있다'
      answer: 0
      explanation: |
        topic 은 many-to-many 라서 subscriber 를 하나 더 붙여도 기존 subscriber 의 흐름은 끊기지 않는다. ros2 bag record 는 녹화할 topic 을 subscribe
        하는 node 를 하나 더 띄울 뿐이다. subscriber 수 제한이나 publisher 정지, 재시작 요구는 없다.

- topic: bandwidth
  title: message 크기와 bandwidth
  section: bandwidth-계산
  variants:
    - question: |
        압축하지 않은 640 × 480 컬러 사진(픽셀마다 3 byte)을 30 Hz 로 publish 한다. 이 topic 의 bandwidth 로 가장 가까운 것은? (1 byte = 8 bit)
      choices:
        - '약 9 Mbit/s'
        - '약 74 Mbit/s'
        - '약 221 Mbit/s'
        - '약 2,200 Mbit/s'
      answer: 2
      explanation: |
        한 장은 $640 \times 480 \times 3 = 921{,}600$ byte 이고, 1초에 $921{,}600 \times 30 = 27{,}648{,}000$ byte, bit 로 바꾸면 약 221 Mbit/s 다.
        74 Mbit/s 는 픽셀당 1 byte 로 계산한 값이고, 9 Mbit/s 는 30 Hz 를 곱하지 않고 한 장만 bit 로 바꾼 값에 가깝다. 2,200 Mbit/s 는 10 배를 더
        곱한 실수다.
    - question: |
        노트북에서 policy 를 계산하려고 로봇의 원본 카메라 영상(약 221 Mbit/s)을 54 Mbit/s 정도의 Wi-Fi 로 받고 있다. 무엇이 문제이고 어떻게 고치는가?
      choices:
        - '연결이 데이터를 다 실어 나르지 못해 사진 대부분이 도착하지 못하므로, 사진을 로봇 컴퓨터 안에서 처리하거나 압축해 보낸다'
        - 'Wi-Fi 는 속도와 관계없이 ROS 2 topic 을 전달할 수 없으므로, 노트북과 로봇을 유선으로 이어야만 사진이 도착한다'
        - '사진이 빠지는 것은 best effort 때문이라서, QoS 를 reliable 로 바꾸면 빠진 사진을 다시 보내 모든 사진이 제때 도착한다'
        - 'subscriber 의 depth 가 작아서 사진이 버려지는 것이므로, depth 를 1000 으로 늘리면 빠진 사진이 queue 에 남아 모두 채워진다'
      answer: 0
      explanation: |
        54 Mbit/s 로는 1초에 $54{,}000{,}000 \div (921{,}600 \times 8) \approx 7$ 장만 보낼 수 있어서 30 장 대부분이 도착하지 못한다. 처리 위치를 로봇
        안으로 옮기거나 압축해 데이터 양을 줄여야 한다. Wi-Fi 로도 topic 은 전달되고, reliable 은 다시 보낼 뿐 연결을 넓히지 못하며, depth 를 늘려도
        보낼 수 있는 양은 늘지 않는다.
    - question: |
        같은 컴퓨터에서 카메라 driver 와 사진 처리 node 사이의 지연을 줄이려면 어떻게 배치하는 것이 좋은가?
      choices:
        - '두 node 를 서로 다른 컴퓨터로 옮겨 계산 부담을 나누면, 각 컴퓨터가 한가해져 사진이 더 빨리 전달된다'
        - '사진 topic 의 QoS 를 transient local 로 바꿔 publisher 가 사진을 보관하게 하면, subscriber 가 바로 꺼내 쓸 수 있다'
        - 'ROS_DOMAIN_ID 를 두 node 에 서로 다르게 주어, 각 node 가 다른 traffic 에 방해받지 않고 message 만 주고받게 한다'
        - '두 node 를 한 process 에 넣고 intra-process 통신을 켜서, message 를 복사하지 않고 메모리 주소만 넘기게 한다'
      answer: 3
      explanation: |
        process 사이로 보내면 큰 message 일수록 복사와 전달 비용이 커지는데, 한 process 안의 intra-process 통신은 복사 없이 주소만 넘겨 지연이 크게
        줄어든다. Macenski 등의 측정에서는 8 MB 아래의 모든 크기에서 message 의 95% 가 1 ms 안에 도착했다. 다른 컴퓨터로 옮기면 네트워크를 거쳐 더 느려지고, durability 는
        지연과 관계없으며, domain ID 를 다르게 하면 두 node 가 서로를 찾지 못한다.

- topic: service-action
  title: topic, service, action 의 선택
  section: service-와-action
  variants:
    - question: |
        이동 로봇을 30 m 떨어진 목표까지 보내는 기능을 만들려고 한다. topic, service, action 가운데 무엇을 쓰고, 왜 그런가?
      choices:
        - 'topic. 목표 위치를 한 번 publish 하면 subscriber 가 도착 결과를 같은 topic 으로 자동으로 돌려준다'
        - 'service. 요청 하나에 응답 하나라서, 목표를 보내고 도착했다는 응답만 받으면 충분하다'
        - 'parameter. 목표 위치를 node 의 설정값으로 넣어 두면 node 가 그 값을 읽어 이동을 시작한다'
        - 'action. 수십 초 걸리는 일이라 진행 상황을 feedback 으로 받고, 도중에 cancel 도 할 수 있어야 한다'
      answer: 3
      explanation: |
        0.5 m/s 로 30 m 를 가면 60 초가 걸리고, 그동안 남은 거리 같은 feedback 이 필요하며 사람이 길을 막으면 멈춰야 한다. 이것이 action 의 goal ·
        feedback · result · cancel 구조이고, Nav2 의 NavigateToPose 가 그 예다. topic 은 결과를 돌려주지 않고, service 는 빨리 끝나는 요청용이라
        진행 상황과 cancel 이 없으며, parameter 는 node 의 설정값이다.
    - question: |
        ROS 2 공식 문서가 오래 걸리는 작업에 service 를 쓰지 말라고 하는 이유는 무엇인가?
      choices:
        - 'request 와 response 를 한 번씩만 주고받아서, 기다리는 동안 진행 상황을 알 수 없고 도중에 멈추게 할 수도 없다'
        - 'service 는 같은 이름에 client 를 하나만 둘 수 있어서, 오래 걸리면 다른 client 가 그동안 요청을 보내지 못한다'
        - 'service 는 같은 컴퓨터 안에서만 전달되므로, 오래 걸리는 작업을 다른 컴퓨터에 맡길 수 없다'
        - 'service 의 response 에는 숫자 하나만 담을 수 있어서, 오래 걸린 작업의 자세한 결과를 돌려줄 수 없다'
      answer: 0
      explanation: |
        service 는 짧은 request/response 를 위한 방식이라 중간 보고(feedback)와 cancel 이 없다. 오래 걸리면 client 는 아무 정보 없이 기다리고, 상황이
        바뀌어도 멈추게 할 수 없다. 같은 이름의 service 에 client 는 여러 개 붙을 수 있고(server 가 하나여야 한다), 네트워크로도 전달되며, response
        에는 어떤 형식이든 담을 수 있다.
    - question: |
        ROS 2 action 은 내부적으로 어떻게 구현되어 있는가?
      choices:
        - 'topic 과 별개로 만든 전용 TCP 연결 하나로 goal, feedback, result 를 차례로 주고받도록 구현되어 있다'
        - 'client 가 parameter 에 goal 을 써 두면 server 가 그 값을 주기적으로 읽어 작업을 시작하도록 구현되어 있다'
        - 'goal 보내기·cancel·result 받기의 service 3 개와 feedback·상태의 topic 2 개를 묶어 구현되어 있다'
        - 'service 하나로 goal 과 result 를 주고받고, 중간 feedback 은 topic 이 아니라 log 로만 남도록 구현되어 있다'
      answer: 2
      explanation: |
        action 은 send_goal, cancel_goal, get_result 의 세 service 와 feedback, status 의 두 topic 으로 이루어진다. 그래서 goal 수락, 진행 중 feedback,
        cancel, 최종 result 를 모두 주고받을 수 있다. 전용 TCP 연결이나 parameter 를 쓰지 않고, feedback 은 log 가 아니라 topic 으로 client 에게 간다.

- topic: qos-reliability
  title: reliability 와 history
  section: qos
  variants:
    - question: |
        카메라나 LiDAR 같은 센서 데이터 topic 에 best effort QoS 를 쓰는 이유는 무엇인가?
      choices:
        - 'best effort 는 보내기 전에 데이터를 압축해 bandwidth 를 줄이므로, 큰 사진과 point cloud 를 무선으로 보내기 좋기 때문이다'
        - '새 측정이 오면 옛 측정은 쓸모가 없어서, 빠진 것을 다시 보내느라 늦어지기보다 빠지더라도 최신 값을 빨리 받는 편이 낫기 때문이다'
        - 'best effort 는 message 마다 도착 확인을 받고 다음 것을 보내서, 순서가 뒤섞이지 않고 최신 값이 정확히 전달되기 때문이다'
        - 'ROS 2 는 센서 message 형식에 reliable 을 쓸 수 없게 막아 두어서, 센서 topic 은 best effort 로만 publish 할 수 있기 때문이다'
      answer: 1
      explanation: |
        센서 데이터는 33 ms 뒤면 새 값이 오므로, 빠진 사진을 다시 보내느라 뒤 사진까지 늦어지는 reliable 보다 빠지는 것을 허용하는 best effort 가
        맞다. ROS 2 의 sensor data profile 도 best effort 에 keep last 5 다. best effort 는 압축과 관계없고 도착 확인 없이 보내 빠짐을 허용하며, 센서 형식에도 reliable 을
        쓸 수는 있다.
    - question: |
        카메라가 30 Hz 로 사진을 보내는데 policy 는 10 Hz 로만 처리한다. subscriber 의 QoS 가 keep last, depth 10 일 때 무슨 문제가 생기는가?
      choices:
        - 'queue 10 장이 가득 차면 publisher 가 더 보내지 않고 기다리므로, 카메라도 10 Hz 로 느려져 사진이 밀리지 않는다'
        - 'depth 10 은 1초에 10 장을 받는다는 뜻이라서, policy 의 처리 주기 10 Hz 와 맞아 사진이 밀리지 않는다'
        - 'queue 에 최근 사진 10 장이 쌓이고 callback 은 오래된 것부터 꺼내므로, policy 는 약 0.3 초 전 사진으로 행동을 정한다'
        - 'keep last 는 이름 그대로 가장 마지막 사진만 남기므로, depth 와 관계없이 policy 는 언제나 최신 사진을 받는다'
      answer: 2
      explanation: |
        도착(30 Hz)이 처리(10 Hz)보다 빨라 queue 는 곧 가득 차고, 가장 오래된 사진은 가장 최근 사진보다 9 장 앞, 약 $9 \times 33 \approx 300$ ms
        전의 것이다. callback 은 가장 오래된 message 부터 꺼내므로 policy 는 늘 옛 장면을 본다. depth 1 로 두면 최신 사진 하나만 남는다. queue 가
        차도 publisher 는 멈추지 않고 오래된 것이 버려지며, depth 는 처리 속도를 바꾸지 않는다.
    - question: |
        무선 연결이 느려 사진이 많이 빠진다. 동료가 QoS 를 reliable 로 바꾸면 해결된다고 한다. 맞는가?
      choices:
        - '맞다. reliable 은 연결 속도를 자동으로 높여서, 빠진 사진을 다시 보내고도 1초에 30 장을 모두 제때 보낸다'
        - '틀리다. 빠진 조각을 다시 보낼 뿐 연결이 실어 나르는 양은 그대로라서, queue 가 차면 오래된 사진은 버려지고 지연만 커진다'
        - '맞다. reliable 로 바꾸면 사진을 압축해 보내므로, 같은 연결로도 1초에 30 장을 모두 보낼 수 있다'
        - '틀리다. reliable 은 같은 컴퓨터의 node 사이에서만 동작해서, 무선으로 이어진 노트북에는 이 설정이 아예 적용되지 않는다'
      answer: 1
      explanation: |
        연결이 1초에 7 장만 보낼 수 있으면 reliable 이어도 30 장이 다 도착할 수 없다. 다시 보내는 동안 뒤 사진이 밀려 지연이 커지고, keep last
        queue 가 차면 오래된 것부터 버려진다. reliable 은 속도를 높이거나 압축하지 않고, 네트워크에서도 동작한다.

- topic: qos-compat
  title: QoS 호환과 durability
  section: qos-호환
  variants:
    - question: |
        카메라 driver 는 best effort 로 publish 하고, 새로 만든 node 는 기본 QoS(reliable)로 subscribe 했다. 어떤 일이 생기는가?
      choices:
        - 'subscriber 가 reliable 을 요구하므로 publisher 가 자동으로 reliable 로 바뀌어, 두 node 는 정상적으로 연결된다'
        - 'QoS 가 서로 맞지 않는다는 오류가 나면서, subscriber node 가 시작하자마자 종료된다'
        - '연결은 되지만 best effort 로 보낸 message 는 다시 보내지 않으므로, subscriber 에는 절반 정도만 도착한다'
        - '요청 품질이 제시 품질보다 높아 연결이 맺어지지 않고, 프로그램은 오류 없이 실행되지만 callback 이 한 번도 불리지 않는다'
      answer: 3
      explanation: |
        QoS 는 subscriber 가 요청한 품질이 publisher 가 제시한 품질보다 높으면 연결하지 않는다. best effort publisher 와 reliable subscriber 는 연결되지
        않고, log 에 incompatible QoS 경고 한 줄만 남아서 데이터가 오지 않는 것처럼 보인다. 설정이 자동으로 바뀌거나 프로그램이 종료되지 않는다.
        `ros2 topic info -v` 로 양쪽 QoS 를 확인하고 subscriber 를 best effort 로 바꾸면 된다.
    - question: |
        publisher 가 reliable 이고 subscriber 가 best effort 이면 연결되는가?
      choices:
        - '연결되지 않는다. reliability 는 양쪽 값이 정확히 같아야 연결되는 설정이기 때문이다'
        - '연결된다. subscriber 가 요구하는 품질이 publisher 가 줄 수 있는 품질보다 낮기 때문이다'
        - '연결되지만, subscriber 에 맞추려고 publisher 의 reliability 가 best effort 로 바뀐다'
        - 'durability 도 transient local 일 때만 연결된다. 두 설정을 함께 보고 판정하기 때문이다'
      answer: 1
      explanation: |
        QoS 는 subscriber 의 요청이 publisher 의 제시보다 높지 않으면 연결된다. reliable 을 제시하는 publisher 는 best effort 만 요구하는 subscriber 를
        만족시키므로 연결된다. 같은 값이어야 하는 것이 아니고, publisher 설정이 바뀌지도 않으며, durability 와는 따로 판정한다.
    - question: |
        robot_state_publisher 는 URDF 를 /robot_description 에 transient local 로 시작할 때 한 번 publish 한다. 나중에 띄운 node 가 이 topic 을 volatile 로 subscribe 하면 어떻게 되는가?
      choices:
        - '연결은 되지만 연결 뒤에 새로 publish 되는 message 만 받으므로, 이미 publish 된 URDF 는 받지 못한다'
        - 'durability 가 서로 달라 연결이 맺어지지 않고, subscriber node 는 incompatible QoS 오류로 종료된다'
        - 'publisher 가 transient local 로 보관해 둔 URDF 를 연결되는 즉시 넘겨주므로, 늦게 띄운 node 도 그대로 받는다'
        - 'volatile subscriber 가 연결되면 publisher 에게 URDF 를 다시 publish 하라고 자동으로 요청해서 결국 받게 된다'
      answer: 0
      explanation: |
        transient local publisher 와 volatile subscriber 는 호환되지만, volatile 은 지난 message 를 요청하지 않으므로 새 message 만 받는다. URDF 처럼
        시작할 때 한 번만 publish 되는 데이터는 끝내 받지 못한다. 늦게 들어온 subscriber 가 지난 message 를 받으려면 양쪽 모두 transient local 이어야
        한다. 오류로 끝나거나 다시 publish 를 요청하는 동작은 없다.

- topic: timing
  title: timer, executor 와 제어 loop
  section: executor-와-timer
  variants:
    - question: |
        single-threaded executor 에서 10 ms 간격(100 Hz) timer 의 callback 이 매번 25 ms 걸린다. 실제로 어떻게 동작하는가?
      choices:
        - '밀린 예정 시각을 건너뛰고 끝나자마자 다시 불려 25 ms 마다 한 번(40 Hz) 실행되고, 그동안 다른 callback 은 기다린다'
        - '밀린 호출이 queue 에 쌓였다가 callback 이 끝날 때마다 몰아서 실행되어, 평균으로는 1초에 100 번을 맞춘다'
        - 'executor 가 10 ms 가 지나면 callback 을 강제로 끊고 다음 예정분을 시작해서, 1초에 100 번을 지킨다'
        - 'callback 이 주기보다 오래 걸리면 timer 가 다음 예정 시각을 지킬 수 없다는 오류를 내고, executor 가 node 를 종료시킨다'
      answer: 0
      explanation: |
        ROS 2 timer 는 다음 예정 시각을 주기만큼 미루되, 이미 지난 예정 시각은 건너뛴다. 그래서 callback 은 끝나자마자 다시 불려 10, 35, 60 ms … 처럼 25 ms
        마다, 1초에 40 번 실행된다. thread 가 하나라 그동안 다른 callback 은 실행되지 못한다. 밀린 호출을 몰아서 실행하거나 callback 을 강제로 끊지
        않으며, 오류로 종료되지도 않는다.
    - question: |
        1 kHz 관절 제어 loop 를 일반 node 의 timer 와 topic 이 아니라 ros2_control 에 두는 이유는 무엇인가?
      choices:
        - 'ros2_control 은 DDS 를 거치지 않고 motor 와 직접 통신하므로, ROS 2 가 설치되지 않은 컴퓨터에서도 실행되기 때문이다'
        - 'ROS 2 timer 는 100 Hz 넘는 주기를 설정할 수 없게 막혀 있어서, 1 kHz loop 는 ros2_control 안에서만 만들 수 있기 때문이다'
        - 'controller_manager 가 우선순위 높은 thread 에서 정해진 주기로 read → update → write 를 하고, 값을 topic 없이 메모리로 주고받기 때문이다'
        - 'ros2_control 을 쓰면 policy 가 hardware interface 를 거치지 않고 motor 전류를 직접 계산해 보낼 수 있기 때문이다'
      answer: 2
      explanation: |
        기본 executor 는 callback 의 실행 순서와 시간을 엄밀히 보장하지 않아 real-time 제어에 맞지 않고, 매 주기 topic 을 거치면 전달 시간도 더해진다.
        ros2_control 은 controller 와 hardware interface 를 한 process 의 plugin 으로 불러와 메모리로 값을 주고받고, loop thread 의 우선순위를 높여 둔다.
        ros2_control 도 ROS 2 위에서 동작하고, timer 주기에 상한이 있는 것도 아니며, policy 는 여전히 목표를 topic 으로 보낸다.
    - question: |
        simulator 와 함께 실행하는데 한 node 만 use_sim_time 을 켜지 않았다. 어떤 문제가 생기는가?
      choices:
        - '그 node 는 simulator 를 기다리지 않고 자기 시계로 계산해서, 다른 node 보다 빠르고 결과도 더 정확해진다'
        - '그 node 만 sim time 이 아닌 컴퓨터 시계를 써서, 다른 node 와 timestamp 가 맞지 않고 tf2 가 변환을 찾지 못한다'
        - 'use_sim_time 은 log 에 찍히는 시각의 형식만 바꾸는 설정이라서, 하나만 꺼져 있어도 동작에는 문제가 없다'
        - '그 node 가 /clock 을 직접 publish 하기 시작해서, simulator 가 보내는 시간을 컴퓨터 시계로 덮어쓴다'
      answer: 1
      explanation: |
        use_sim_time 을 켠 node 는 /clock 의 시각(시작부터 센 수십 초)을, 켜지 않은 node 는 wall time(1970 년부터 센 약 18 억 초)을 쓴다. 두 시계가
        완전히 달라 timestamp 비교와 tf2 의 시각별 변환 조회가 어긋나고, 그 node 의 timer 도 simulation 속도와 다르게 불린다. 정확도가 오르거나 log
        형식만 바뀌는 것이 아니고, /clock 은 simulator 나 bag 재생이 publish 한다.

- topic: tf-frames
  title: tf2 와 map·odom·base_link
  section: tf2-와-frame-tree
  variants:
    - question: |
        REP-105 에서 map 과 odom frame 을 따로 두는 이유는 무엇인가?
      choices:
        - 'map 은 지도가 있는 실내에서 쓰고 odom 은 GPS 가 잡히는 실외에서 쓰는 frame 이라서, 장소에 따라 골라 쓰기 위해서다'
        - 'odom 은 GPS 로만 계산하고 map 은 바퀴 odometry 로만 계산하도록 정해져 있어서, 센서마다 frame 을 하나씩 두기 위해서다'
        - '둘은 같은 위치를 나타내는 같은 frame 의 다른 이름이고, 오래된 package 와의 호환 때문에 둘 다 남겨 두었다'
        - 'odom 은 매끄럽지만 시간이 지나면 어긋나고 map 은 어긋나지 않지만 값이 뛰어서, 짧은 제어와 지도 위 목표에 맞는 frame 이 각각 필요하다'
      answer: 3
      explanation: |
        odom frame 에서의 위치는 바퀴·IMU 같은 odometry 로 계산해 연속적이지만 drift 가 쌓이고, map frame 에서의 위치는 localization 이 지도와 맞춰
        drift 가 없지만 갑자기 뛸 수 있다. 장애물 회피처럼 짧은 시간의 제어는 odom 을, 지도 위의 목표는 map 을 쓴다. 실내·실외 구분이나 센서 고정
        규칙이 아니고, 서로 다른 성질의 frame 이다.
    - question: |
        localization node 는 map 에서 본 로봇의 위치를 계산하는데, tf 에는 왜 map → base_link 가 아니라 map → odom 을 publish 하는가?
      choices:
        - 'map → base_link 는 지도 전체와 맞춰야 해서 계산이 오래 걸리므로, 한 단계 짧은 map → odom 만 계산해 publish 한다'
        - 'frame 마다 부모는 하나뿐인데 base_link 의 부모는 이미 odom 이라서, odom → base_link 와 이어 붙일 map → odom 을 publish 한다'
        - 'map → odom 은 로봇이 움직여도 바뀌지 않는 고정값이라서, 시작할 때 한 번만 publish 하면 계산을 아낄 수 있다'
        - 'tf2 는 map 이라는 이름의 frame 을 다른 frame 의 자식으로만 둘 수 있어서, base_link 를 map 아래에 바로 붙일 수 없다'
      answer: 1
      explanation: |
        tf2 는 tree 라서 frame 하나에 부모가 하나뿐이고, odometry 가 이미 odom → base_link 를 publish 한다. localization 은 계산한 map 에서의 위치와
        odom → base_link 의 차이로 map → odom 을 구해 publish 하고, tf2 가 두 변을 이어 map → base_link 를 만들어 준다. 계산 시간 문제가 아니고,
        map → odom 은 위치 추정이 고쳐질 때마다 바뀌며, map 은 tree 의 root 로 흔히 쓰인다.
    - question: |
        카메라 사진에서 찾은 물체를 map 좌표로 바꿀 때, 사진의 header.stamp 시각의 변환을 tf2 에 물어야 하는 이유는 무엇인가?
      choices:
        - 'stamp 에는 사진의 가로·세로 픽셀 수가 함께 적혀 있어서, stamp 없이는 픽셀을 좌표로 바꿀 수 없기 때문이다'
        - 'tf2 는 지난 변환만 기록하고 현재 시각의 변환은 저장하지 않아서, 사진 시각으로 물어야만 답을 받기 때문이다'
        - '사진을 찍고 처리하는 사이에도 로봇이 움직여서, 지금 시각의 변환을 쓰면 그동안 움직인 만큼 물체 위치가 어긋나기 때문이다'
        - 'header.stamp 는 사진이 어느 frame 에서 찍혔는지를 나타내는 값이라서, frame_id 대신 tf2 에 넘겨야 하기 때문이다'
      answer: 2
      explanation: |
        예를 들어 사진이 0.1 초 전 것이고 로봇이 0.5 rad/s 로 돌고 있으면 그사이 0.05 rad 돌아서, 3 m 앞 물체가 옆으로 약 0.15 m 어긋난다. tf2 는 변환을
        시간과 함께 기록해 두므로 찍은 시각의 변환을 물을 수 있다. stamp 는 픽셀 수나 frame_id 와 관계없고, tf2 는 현재 시각의 변환도 저장한다.
