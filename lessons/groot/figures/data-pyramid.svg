<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>GR00T N1 의 data pyramid. 바닥은 인터넷 데이터와 사람 영상(Ego4D 등 7 가지)으로 양이 가장 많고, 가운데는 simulation 기록(78 만 개)과 생성한 영상(827 시간), 꼭대기는 GR-1 조종 데이터(88 시간)와 공개 로봇 데이터다. 왼쪽 화살표는 위로 갈수록 양이 줄고, 오른쪽 화살표는 위로 갈수록 몸이 humanoid 에 가까워짐을 나타낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="818" height="418" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <polygon points="410,40 500,140 320,140" fill="#2a1a0c" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="100" fill="#f59e0b" font-size="14" text-anchor="middle">실물 로봇</text>
  <text x="410" y="122" fill="#e2e8f0" font-size="12" text-anchor="middle">GR-1 88 시간</text>

  <polygon points="318,144 502,144 592,244 228,244" fill="#0f2a22" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="180" fill="#34d399" font-size="15" text-anchor="middle">만든 데이터</text>
  <text x="410" y="204" fill="#e2e8f0" font-size="13" text-anchor="middle">simulation 기록 78 만 개</text>
  <text x="410" y="226" fill="#e2e8f0" font-size="13" text-anchor="middle">생성한 로봇 영상 827 시간</text>

  <polygon points="226,248 594,248 684,348 136,348" fill="#0c1f33" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="284" fill="#38bdf8" font-size="15" text-anchor="middle">인터넷 데이터 · 사람 영상</text>
  <text x="410" y="308" fill="#e2e8f0" font-size="13" text-anchor="middle">VLM 이 배운 사진·글</text>
  <text x="410" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle">1 인칭 사람 영상 7 가지 (Ego4D 등)</text>

  <text x="530" y="92" fill="#94a3b8" font-size="12">+ Open X-Embodiment 등</text>
  <text x="530" y="110" fill="#94a3b8" font-size="12">공개 로봇 데이터</text>

  <line x1="70" y1="340" x2="70" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60" y="380" fill="#94a3b8" font-size="13" text-anchor="middle">양</text>
  <text x="96" y="70" fill="#94a3b8" font-size="12">적다</text>
  <text x="96" y="338" fill="#94a3b8" font-size="12">많다</text>

  <line x1="750" y1="340" x2="750" y2="60" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="750" y="380" fill="#94a3b8" font-size="13" text-anchor="middle">humanoid 와의 일치</text>
  <text x="724" y="70" fill="#94a3b8" font-size="12" text-anchor="end">높다</text>
  <text x="724" y="338" fill="#94a3b8" font-size="12" text-anchor="end">낮다</text>

  <text x="410" y="400" fill="#94a3b8" font-size="13" text-anchor="middle">세 층을 모델 하나가 함께 학습한다</text>
</svg>
