<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>GR00T 버전별 변화. N1 → N1.5 → N1.6 → N1.7 을 왼쪽에서 오른쪽으로 놓고, 칸마다 VLM, diffusion transformer 층 수, 덩어리 길이, 주요 변화를 적었다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="878" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <g font-size="12">
    <rect x="20" y="30" width="190" height="290" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
    <text x="115" y="58" fill="#38bdf8" font-size="16" text-anchor="middle">N1</text>
    <text x="36" y="90" fill="#94a3b8">VLM</text><text x="36" y="108" fill="#e2e8f0">Eagle-2, 12 번째 층</text>
    <text x="36" y="136" fill="#94a3b8">diffusion transformer</text><text x="36" y="154" fill="#e2e8f0">층 수 미공개</text>
    <text x="36" y="182" fill="#94a3b8">덩어리 길이</text><text x="36" y="200" fill="#e2e8f0">16</text>
    <text x="36" y="228" fill="#94a3b8">주요 내용</text>
    <text x="36" y="246" fill="#e2e8f0">data pyramid</text><text x="36" y="264" fill="#e2e8f0">latent action</text><text x="36" y="282" fill="#e2e8f0">로봇별 MLP</text>

    <rect x="234" y="30" width="190" height="290" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
    <text x="329" y="58" fill="#34d399" font-size="16" text-anchor="middle">N1.5</text>
    <text x="250" y="90" fill="#94a3b8">VLM</text><text x="250" y="108" fill="#e2e8f0">Eagle 2.5 바탕, 얼림</text>
    <text x="250" y="136" fill="#94a3b8">diffusion transformer</text><text x="250" y="154" fill="#e2e8f0">16 층</text>
    <text x="250" y="182" fill="#94a3b8">덩어리 길이</text><text x="250" y="200" fill="#e2e8f0">16</text>
    <text x="250" y="228" fill="#94a3b8">주요 내용</text>
    <text x="250" y="246" fill="#e2e8f0">FLARE loss</text><text x="250" y="264" fill="#e2e8f0">연결부 단순화</text><text x="250" y="282" fill="#e2e8f0">지시 따르기 46.6→93.3%</text>

    <rect x="448" y="30" width="190" height="290" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
    <text x="543" y="58" fill="#f59e0b" font-size="16" text-anchor="middle">N1.6</text>
    <text x="464" y="90" fill="#94a3b8">VLM</text><text x="464" y="108" fill="#e2e8f0">Cosmos-Reason-2B 변형</text>
    <text x="464" y="136" fill="#94a3b8">diffusion transformer</text><text x="464" y="154" fill="#e2e8f0">32 층</text>
    <text x="464" y="182" fill="#94a3b8">덩어리 길이</text><text x="464" y="200" fill="#e2e8f0">16</text>
    <text x="464" y="228" fill="#94a3b8">주요 내용</text>
    <text x="464" y="246" fill="#e2e8f0">state-relative action</text><text x="464" y="264" fill="#e2e8f0">VLM 맨 위 4 층 학습</text><text x="464" y="282" fill="#e2e8f0">Thor 에서 105 ms</text>

    <rect x="662" y="30" width="198" height="290" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
    <text x="761" y="58" fill="#a78bfa" font-size="16" text-anchor="middle">N1.7</text>
    <text x="678" y="90" fill="#94a3b8">VLM</text><text x="678" y="108" fill="#e2e8f0">Cosmos-Reason2-2B</text>
    <text x="678" y="136" fill="#94a3b8">diffusion transformer</text><text x="678" y="154" fill="#e2e8f0">16 층</text>
    <text x="678" y="182" fill="#94a3b8">덩어리 길이</text><text x="678" y="200" fill="#e2e8f0">40</text>
    <text x="678" y="228" fill="#94a3b8">주요 내용</text>
    <text x="678" y="246" fill="#e2e8f0">relative EEF action</text><text x="678" y="264" fill="#e2e8f0">사람 영상 2 만 시간</text><text x="678" y="282" fill="#e2e8f0">사람·로봇 같은 형식</text>
  </g>
  <line x1="212" y1="175" x2="232" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="426" y1="175" x2="446" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="175" x2="660" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
