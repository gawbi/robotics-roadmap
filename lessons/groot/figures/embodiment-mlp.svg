  <text x="235.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="250" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="265.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="280" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="295.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="310" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="325.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="340" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="355.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="370" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="385.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="400" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="415.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="430" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="445.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="460" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="475.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="490" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="505.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="520" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="535.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="550" y="292" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="565.0" y="312" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <line x1="588" y1="307" x2="626" y2="307" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="632" y="290" width="190" height="34" rx="6" fill="#0c1f33" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="727" y="312" fill="#7cb4d8" font-size="12" text-anchor="middle">weight 하나 (공통)</text>
  <text x="40" y="342" fill="#94a3b8" font-size="12" text-anchor="start">SO-101 의 숫자 6 개 + 0 이 12 칸</text>
  <text x="40" y="376" fill="#e2e8f0" font-size="14" text-anchor="start">GR00T N1 공개 구현 — 상태 64 칸에 0 을 채우고, 로봇 번호마다 다른 weight</text>
  <rect x="40" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="55.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₁</text>
  <rect x="70" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="85.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₂</text>
  <rect x="100" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="115.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₃</text>
  <rect x="130" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="145.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₄</text>
  <rect x="160" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="175.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₅</text>
  <rect x="190" y="388" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="205.0" y="408" fill="#e2e8f0" font-size="12" text-anchor="middle">x₆</text>
  <rect x="220" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="235.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="250" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="265.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="280" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="295.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="310" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="325.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="340" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="355.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <rect x="370" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="385.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="418" y="408" fill="#94a3b8" font-size="14" text-anchor="middle">…</text>
  <rect x="436" y="388" width="30" height="30" fill="#1a1f2b" stroke="#475569"/>
  <text x="451.0" y="408" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="40" y="438" fill="#94a3b8" font-size="12" text-anchor="start">SO-101 의 숫자 6 개 + 0 이 58 칸</text>
  <line x1="504" y1="403" x2="542" y2="403" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="548" y="382" width="274" height="42" rx="6" fill="#2a1a0c" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="685" y="400" fill="#d6aa62" font-size="12" text-anchor="middle">로봇 번호로 고른 weight</text>
  <text x="685" y="416" fill="#94a3b8" font-size="11" text-anchor="middle">(번호는 최대 32 개)</text>
</svg>
