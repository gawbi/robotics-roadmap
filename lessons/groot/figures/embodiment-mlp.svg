<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇마다 따로 둔 encoder 와 decoder. 예로 든 숫자 6 개와 14 개가 각자의 encoder 를 지나 길이 4 의 token 이 된다. 아래 상자는 π0 의 18 칸 방식과 GR00T N1 공개 구현의 로봇별 weight 를 비교한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="858" height="468" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="26" fill="#94a3b8" font-size="12" text-anchor="start">예: 공통 길이 4</text>
  <rect x="20" y="40" width="140" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="64" fill="#e2e8f0" font-size="13" text-anchor="middle">SO-101</text>
  <text x="90" y="84" fill="#7cb4d8" font-size="12" text-anchor="middle">숫자 6 개</text>
  <rect x="190" y="40" width="120" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="250" y="64" fill="#d6aa62" font-size="13" text-anchor="middle">encoder A</text>
  <text x="250" y="84" fill="#94a3b8" font-size="11" text-anchor="middle">6 → 4, 28 개</text>
  <line x1="162" y1="68" x2="188" y2="68" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="40" width="120" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="610" y="64" fill="#d6aa62" font-size="13" text-anchor="middle">decoder A</text>
  <text x="610" y="84" fill="#94a3b8" font-size="11" text-anchor="middle">4 → 6</text>
  <line x1="672" y1="68" x2="698" y2="68" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="73" fill="#e2e8f0" font-size="13" text-anchor="middle">속도 6 개</text>
  <rect x="20" y="170" width="140" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="194" fill="#e2e8f0" font-size="13" text-anchor="middle">팔 둘 로봇 (예)</text>
  <text x="90" y="214" fill="#7cb4d8" font-size="12" text-anchor="middle">숫자 14 개</text>
  <rect x="190" y="170" width="120" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="250" y="194" fill="#d6aa62" font-size="13" text-anchor="middle">encoder B</text>
  <text x="250" y="214" fill="#94a3b8" font-size="11" text-anchor="middle">14 → 4, 60 개</text>
  <line x1="162" y1="198" x2="188" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="550" y="170" width="120" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="610" y="194" fill="#d6aa62" font-size="13" text-anchor="middle">decoder B</text>
  <text x="610" y="214" fill="#94a3b8" font-size="11" text-anchor="middle">4 → 14</text>
  <line x1="672" y1="198" x2="698" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="203" fill="#e2e8f0" font-size="13" text-anchor="middle">속도 14 개</text>
  <line x1="312" y1="68" x2="350" y2="108" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312" y1="198" x2="350" y2="158" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">길이 4</text>
  <rect x="352" y="80" width="156" height="106" rx="10" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/>
  <text x="430" y="122" fill="#7fc4a2" font-size="14" text-anchor="middle">diffusion</text>
  <text x="430" y="142" fill="#7fc4a2" font-size="14" text-anchor="middle">transformer</text>
  <text x="430" y="166" fill="#94a3b8" font-size="11" text-anchor="middle">모든 로봇 공통</text>
  <line x1="510" y1="108" x2="548" y2="68" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="158" x2="548" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="252" width="820" height="200" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="280" fill="#e2e8f0" font-size="14" text-anchor="start">π0 — 18 칸에 0 을 채우고, 모든 로봇이 같은 weight</text>
  <rect x="40" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="55.0" y="312" fill="#e2e8f0" font-size="12" text-anchor="middle">x₁</text>
  <rect x="70" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="85.0" y="312" fill="#e2e8f0" font-size="12" text-anchor="middle">x₂</text>
  <rect x="100" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="115.0" y="312" fill="#e2e8f0" font-size="12" text-anchor="middle">x₃</text>
  <rect x="130" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="145.0" y="312" fill="#e2e8f0" font-size="12" text-anchor="middle">x₄</text>
  <rect x="160" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
  <text x="175.0" y="312" fill="#e2e8f0" font-size="12" text-anchor="middle">x₅</text>
  <rect x="190" y="292" width="30" height="30" fill="#0c1f33" stroke="#7cb4d8"/>
