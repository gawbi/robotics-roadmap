<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pixel shuffle. 왼쪽 4×4 격자의 token 16 개를 2×2 씩 네 묶음으로 나누고, 묶음마다 token 네 개의 숫자 (a, b) 를 이어 붙여 길이 8 짜리 token 하나로 만든다. 오른쪽은 2×2 격자의 token 4 개다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="150" y="36" fill="#e2e8f0" font-size="14" text-anchor="middle">합치기 전: token 16 개</text>
  <text x="150" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">token 하나 = 숫자 2 개 (a, b)</text>

  <g stroke="#475569" stroke-width="1">
    <rect x="50" y="70" width="50" height="50" fill="#0c1f33"/><rect x="100" y="70" width="50" height="50" fill="#0c1f33"/>
    <rect x="50" y="120" width="50" height="50" fill="#0c1f33"/><rect x="100" y="120" width="50" height="50" fill="#0c1f33"/>
    <rect x="150" y="70" width="50" height="50" fill="#0f2a22"/><rect x="200" y="70" width="50" height="50" fill="#0f2a22"/>
    <rect x="150" y="120" width="50" height="50" fill="#0f2a22"/><rect x="200" y="120" width="50" height="50" fill="#0f2a22"/>
    <rect x="50" y="170" width="50" height="50" fill="#2a1a0c"/><rect x="100" y="170" width="50" height="50" fill="#2a1a0c"/>
    <rect x="50" y="220" width="50" height="50" fill="#2a1a0c"/><rect x="100" y="220" width="50" height="50" fill="#2a1a0c"/>
    <rect x="150" y="170" width="50" height="50" fill="#22183a"/><rect x="200" y="170" width="50" height="50" fill="#22183a"/>
    <rect x="150" y="220" width="50" height="50" fill="#22183a"/><rect x="200" y="220" width="50" height="50" fill="#22183a"/>
  </g>
  <rect x="50" y="70" width="100" height="100" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="150" y="70" width="100" height="100" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <rect x="50" y="170" width="100" height="100" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="150" y="170" width="100" height="100" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="75" y="100" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text><text x="125" y="100" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <text x="75" y="150" fill="#e2e8f0" font-size="13" text-anchor="middle">3</text><text x="125" y="150" fill="#e2e8f0" font-size="13" text-anchor="middle">4</text>

  <line x1="270" y1="170" x2="340" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="160" fill="#94a3b8" font-size="12" text-anchor="middle">2×2 합치기</text>

  <text x="430" y="36" fill="#e2e8f0" font-size="14" text-anchor="middle">합친 뒤: token 4 개</text>
  <text x="430" y="56" fill="#94a3b8" font-size="12" text-anchor="middle">token 하나 = 숫자 4 × 2 = 8 개</text>
  <rect x="360" y="100" width="70" height="70" fill="#0c1f33" stroke="#38bdf8" stroke-width="2.5"/>
  <rect x="430" y="100" width="70" height="70" fill="#0f2a22" stroke="#34d399" stroke-width="2.5"/>
  <rect x="360" y="170" width="70" height="70" fill="#2a1a0c" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="430" y="170" width="70" height="70" fill="#22183a" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="395" y="140" fill="#e2e8f0" font-size="12" text-anchor="middle">1+2+3+4</text>

  <rect x="530" y="96" width="210" height="148" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="635" y="122" fill="#38bdf8" font-size="13" text-anchor="middle">파란 묶음의 새 token</text>
  <text x="635" y="150" fill="#e2e8f0" font-size="12" text-anchor="middle">(a₁, b₁, a₂, b₂,</text>
  <text x="635" y="170" fill="#e2e8f0" font-size="12" text-anchor="middle">a₃, b₃, a₄, b₄)</text>
  <text x="635" y="198" fill="#94a3b8" font-size="12" text-anchor="middle">숫자는 그대로 16 × 2 = 32 개</text>
  <text x="635" y="218" fill="#94a3b8" font-size="12" text-anchor="middle">token 수만 16 → 4</text>

  <text x="380" y="312" fill="#94a3b8" font-size="13" text-anchor="middle">GR00T N1 은 같은 계산으로 사진 한 장을 image token 64 개로 만든다</text>
</svg>
