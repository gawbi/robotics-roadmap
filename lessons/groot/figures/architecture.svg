<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>GR00T N1 의 구조. 왼쪽 위 카메라 사진은 사진마다 image token 64 개, 지시문은 text token 이 되어 Eagle-2 VLM 에 들어가고, VLM 의 12 번째 층 출력 φ 가 오른쪽 diffusion transformer 로 간다. 아래의 로봇 상태 q 는 로봇별 state encoder 를, noise 가 섞인 action 16 개와 τ 는 로봇별 action encoder 를 지나 diffusion transformer 에 들어간다. diffusion transformer 안에서는 cross-attention 과 self-attention 이 번갈아 있고, 끝의 로봇별 action decoder 가 속도 16 개를 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="858" height="458" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <text x="200" y="32" fill="#7cb4d8" font-size="15" text-anchor="middle">System 2 · 10 Hz</text>
  <text x="620" y="32" fill="#7fc4a2" font-size="15" text-anchor="middle">System 1 · 120 Hz</text>

  <rect x="20" y="50" width="120" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="74" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 사진</text>
  <text x="80" y="94" fill="#7cb4d8" font-size="12" text-anchor="middle">장마다 token 64</text>
  <rect x="20" y="120" width="120" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="144" fill="#e2e8f0" font-size="13" text-anchor="middle">지시문</text>
  <text x="80" y="164" fill="#7cb4d8" font-size="12" text-anchor="middle">text token</text>
  <line x1="142" y1="78" x2="178" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="142" y1="148" x2="178" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="180" y="50" width="200" height="126" rx="10" fill="#0c1f33" stroke="#7cb4d8" stroke-width="2"/>
  <text x="280" y="80" fill="#7cb4d8" font-size="15" text-anchor="middle">Eagle-2 VLM</text>
  <text x="280" y="102" fill="#94a3b8" font-size="12" text-anchor="middle">SigLIP-2 + SmolLM2</text>
  <text x="280" y="124" fill="#e2e8f0" font-size="12" text-anchor="middle">13.4 억 parameter</text>
  <text x="280" y="150" fill="#94a3b8" font-size="12" text-anchor="middle">12 번째 층에서 꺼냄</text>
  <line x1="382" y1="113" x2="470" y2="113" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="426" y="104" fill="#7cb4d8" font-size="14" text-anchor="middle">φ</text>

  <rect x="472" y="50" width="300" height="250" rx="10" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/>
  <text x="622" y="76" fill="#7fc4a2" font-size="15" text-anchor="middle">diffusion transformer</text>
  <rect x="502" y="92" width="240" height="34" rx="6" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="622" y="114" fill="#e2e8f0" font-size="13" text-anchor="middle">cross-attention (φ 읽기)</text>
  <rect x="502" y="134" width="240" height="34" rx="6" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="622" y="156" fill="#e2e8f0" font-size="13" text-anchor="middle">self-attention (action·상태끼리)</text>
  <rect x="502" y="176" width="240" height="34" rx="6" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="622" y="198" fill="#e2e8f0" font-size="13" text-anchor="middle">cross-attention (φ 읽기)</text>
  <rect x="502" y="218" width="240" height="34" rx="6" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="622" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">self-attention (action·상태끼리)</text>
  <text x="622" y="280" fill="#94a3b8" font-size="12" text-anchor="middle">… 번갈아 여러 층</text>

  <rect x="230" y="330" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="295" y="354" fill="#e2e8f0" font-size="13" text-anchor="middle">로봇 상태 q</text>
  <text x="295" y="374" fill="#94a3b8" font-size="12" text-anchor="middle">관절 각도 등</text>
  <rect x="230" y="396" width="130" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="295" y="420" fill="#e2e8f0" font-size="13" text-anchor="middle">noise action 16 개</text>
  <text x="295" y="440" fill="#94a3b8" font-size="12" text-anchor="middle">+ τ</text>

  <rect x="390" y="330" width="130" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="455" y="356" fill="#d6aa62" font-size="13" text-anchor="middle">state encoder</text>
  <text x="455" y="375" fill="#94a3b8" font-size="11" text-anchor="middle">로봇별 MLP</text>
  <rect x="390" y="396" width="130" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="455" y="422" fill="#d6aa62" font-size="13" text-anchor="middle">action encoder</text>
  <text x="455" y="441" fill="#94a3b8" font-size="11" text-anchor="middle">로봇별 MLP</text>
  <line x1="362" y1="358" x2="388" y2="358" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="362" y1="424" x2="388" y2="424" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="522,358 560,358 560,302" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="522,424 600,424 600,302" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="330" width="160" height="56" rx="10" fill="#2a1a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="760" y="356" fill="#d6aa62" font-size="13" text-anchor="middle">action decoder</text>
  <text x="760" y="375" fill="#94a3b8" font-size="11" text-anchor="middle">로봇별 MLP</text>
  <line x1="700" y1="302" x2="730" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="388" x2="760" y2="410" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="430" fill="#e2e8f0" font-size="13" text-anchor="middle">속도 16 개</text>
  <text x="760" y="448" fill="#94a3b8" font-size="11" text-anchor="middle">Euler 4 step 에 쓴다</text>

  <text x="110" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">파랑: VLM</text>
  <text x="110" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">초록: 모든 로봇 공통</text>
  <text x="110" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">주황: 로봇마다 따로</text>
</svg>
