<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 칸짜리 덩어리의 Euler 4 step. 가로축은 τ 이고, 첫째 칸은 −1.0 에서 출발해 step 마다 0.5 씩 올라 1.0 에, 둘째 칸은 0.5 에서 출발해 step 마다 0.25 씩 내려 −0.5 에 닿는다. τ = 0, 0.25, 0.5, 0.75, 1 의 값이 점으로 찍혀 있다</title>
  <rect x="1" y="1" width="758" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <!-- axes: tau 0..1 -> x 100..580 ; value -1.25..1.25 -> y 330..50  (y = 190 - v*112) -->
  <line x1="100" y1="190" x2="590" y2="190" stroke="#475569" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="330" stroke="#475569" stroke-width="1.5"/>
  <g fill="#94a3b8" font-size="12" text-anchor="middle">
    <text x="100" y="352">0</text><text x="220" y="352">0.25</text><text x="340" y="352">0.5</text><text x="460" y="352">0.75</text><text x="580" y="352">1</text>
    <text x="340" y="372">τ</text>
  </g>
  <g stroke="#1e293b" stroke-width="1"><line x1="220" y1="50" x2="220" y2="330"/><line x1="340" y1="50" x2="340" y2="330"/><line x1="460" y1="50" x2="460" y2="330"/><line x1="580" y1="50" x2="580" y2="330"/></g>
  <g fill="#94a3b8" font-size="12" text-anchor="end">
    <text x="92" y="82">1.0</text><text x="92" y="138">0.5</text><text x="92" y="194">0</text><text x="92" y="250">−0.5</text><text x="92" y="306">−1.0</text>
  </g>

  <polyline points="100,302 220,246 340,190 460,134 580,78" fill="none" stroke="#7cb4d8" stroke-width="2.5"/>
  <g fill="#7cb4d8"><circle cx="100" cy="302" r="5"/><circle cx="220" cy="246" r="5"/><circle cx="340" cy="190" r="5"/><circle cx="460" cy="134" r="5"/><circle cx="580" cy="78" r="5"/></g>
  <g fill="#7cb4d8" font-size="12" text-anchor="middle">
    <text x="110" y="322">−1.0</text><text x="230" y="266">−0.5</text><text x="460" y="120">0.5</text><text x="580" y="64">1.0</text>
  </g>

  <polyline points="100,134 220,162 340,190 460,218 580,246" fill="none" stroke="#d6aa62" stroke-width="2.5"/>
  <g fill="#d6aa62"><circle cx="100" cy="134" r="5"/><circle cx="220" cy="162" r="5"/><circle cx="340" cy="190" r="5"/><circle cx="460" cy="218" r="5"/><circle cx="580" cy="246" r="5"/></g>
  <g fill="#d6aa62" font-size="12" text-anchor="middle">
    <text x="110" y="122">0.5</text><text x="220" y="150">0.25</text><text x="460" y="238">−0.25</text><text x="580" y="266">−0.5</text>
  </g>
  <text x="340" y="176" fill="#e2e8f0" font-size="12" text-anchor="middle">(0, 0)</text>

  <rect x="606" y="70" width="140" height="150" rx="10" fill="#111a2e" stroke="#1e293b" stroke-width="2"/>
  <text x="620" y="96" fill="#7cb4d8" font-size="13">첫째 칸</text>
  <text x="620" y="116" fill="#94a3b8" font-size="12">step 마다 +0.5</text>
  <text x="620" y="150" fill="#d6aa62" font-size="13">둘째 칸</text>
  <text x="620" y="170" fill="#94a3b8" font-size="12">step 마다 −0.25</text>
  <text x="620" y="204" fill="#94a3b8" font-size="11">속도 (2.0, −1.0) × 0.25</text>
  <text x="340" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle">noise (−1.0, 0.5) → 시연 (1.0, −0.5), K = 4</text>
</svg>
