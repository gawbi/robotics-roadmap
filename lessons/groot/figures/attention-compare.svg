<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>π0 와 GR00T N1 의 연결 비교. 왼쪽 π0 는 VLM 의 층 1·2·3 과 action expert 의 층 1·2·3 이 같은 높이끼리 양쪽 화살표로 이어져 있다. 오른쪽 GR00T N1 은 VLM 의 12 번째 층 출력 φ 하나가 오른쪽 diffusion transformer 의 cross-attention block 마다 화살표로 들어가고, block 은 cross-attention 과 self-attention 이 번갈아 쌓여 있다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker>
  </defs>
  <rect x="1" y="1" width="858" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="430" y1="20" x2="430" y2="380" stroke="#1e293b" stroke-width="2"/>

  <text x="215" y="36" fill="#e2e8f0" font-size="15" text-anchor="middle">π0 — 층마다 같은 self-attention</text>
  <text x="110" y="66" fill="#7cb4d8" font-size="13" text-anchor="middle">PaliGemma</text>
  <text x="320" y="66" fill="#7fc4a2" font-size="13" text-anchor="middle">action expert</text>
  <rect x="50" y="250" width="120" height="44" rx="8" fill="#0c1f33" stroke="#7cb4d8" stroke-width="2"/><text x="110" y="277" fill="#e2e8f0" font-size="13" text-anchor="middle">층 1</text>
  <rect x="50" y="170" width="120" height="44" rx="8" fill="#0c1f33" stroke="#7cb4d8" stroke-width="2"/><text x="110" y="197" fill="#e2e8f0" font-size="13" text-anchor="middle">층 2</text>
  <rect x="50" y="90" width="120" height="44" rx="8" fill="#0c1f33" stroke="#7cb4d8" stroke-width="2"/><text x="110" y="117" fill="#e2e8f0" font-size="13" text-anchor="middle">층 3</text>
  <rect x="260" y="250" width="120" height="44" rx="8" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/><text x="320" y="277" fill="#e2e8f0" font-size="13" text-anchor="middle">층 1</text>
  <rect x="260" y="170" width="120" height="44" rx="8" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/><text x="320" y="197" fill="#e2e8f0" font-size="13" text-anchor="middle">층 2</text>
  <rect x="260" y="90" width="120" height="44" rx="8" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/><text x="320" y="117" fill="#e2e8f0" font-size="13" text-anchor="middle">층 3</text>
  <line x1="174" y1="272" x2="256" y2="272" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="174" y1="192" x2="256" y2="192" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="174" y1="112" x2="256" y2="112" stroke="#94a3b8" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="215" y="330" fill="#94a3b8" font-size="12" text-anchor="middle">같은 높이의 층끼리 attention 을 함께 계산</text>
  <text x="215" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">→ 두 부분의 층 수가 같아야 한다</text>

  <text x="645" y="36" fill="#e2e8f0" font-size="15" text-anchor="middle">GR00T N1 — cross-attention</text>
  <text x="530" y="66" fill="#7cb4d8" font-size="13" text-anchor="middle">Eagle-2 VLM</text>
  <text x="740" y="66" fill="#7fc4a2" font-size="13" text-anchor="middle">diffusion transformer</text>
  <rect x="470" y="90" width="120" height="204" rx="8" fill="#0c1f33" stroke="#7cb4d8" stroke-width="2"/>
  <text x="530" y="180" fill="#e2e8f0" font-size="13" text-anchor="middle">층 1 … 12</text>
  <text x="530" y="202" fill="#7cb4d8" font-size="13" text-anchor="middle">→ φ</text>
  <rect x="670" y="250" width="140" height="36" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/><text x="740" y="273" fill="#e2e8f0" font-size="12" text-anchor="middle">cross-attention</text>
  <rect x="670" y="206" width="140" height="36" rx="8" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/><text x="740" y="229" fill="#e2e8f0" font-size="12" text-anchor="middle">self-attention</text>
  <rect x="670" y="162" width="140" height="36" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/><text x="740" y="185" fill="#e2e8f0" font-size="12" text-anchor="middle">cross-attention</text>
  <rect x="670" y="118" width="140" height="36" rx="8" fill="#0f2a22" stroke="#7fc4a2" stroke-width="2"/><text x="740" y="141" fill="#e2e8f0" font-size="12" text-anchor="middle">self-attention</text>
  <text x="740" y="104" fill="#94a3b8" font-size="12" text-anchor="middle">⋮</text>
  <line x1="592" y1="192" x2="630" y2="192" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="630" y1="180" x2="630" y2="268" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="630" y1="268" x2="666" y2="268" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow-b)"/>
  <line x1="630" y1="180" x2="666" y2="180" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="645" y="330" fill="#94a3b8" font-size="12" text-anchor="middle">φ 하나를 cross-attention block 마다 다시 읽는다</text>
  <text x="645" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">→ 두 부분의 층 구조를 맞출 필요가 없다</text>
</svg>
