# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: next-token-data
  title: 입력을 한 칸 밀어 만드는 정답
  variants:
    - question: |
        language model 을 다음 token 맞히기로 학습시킬 때는 사람이 text 에 정답(label)을 따로 달지 않아도 된다. 그 이유는?
      choices:
        - '모델이 정답 없이도 loss 를 0 으로 만들 수 있어서'
        - 'tokenizer 가 token 을 자를 때 token 마다 정답을 자동으로 붙여 줘서'
        - '위치마다 정답이 text 안의 바로 다음 token 이라서, 입력을 한 칸 밀기만 하면 정답 줄이 되기 때문에'
        - '확률표의 모양만 맞히면 되고 어느 token 이 정답인지는 쓰이지 않아서'
      answer: 2
      explanation: |
        text 의 각 위치에서 "다음에 실제로 온 token" 이 곧 그 위치의 정답이라서, 입력 줄을 왼쪽으로 한 칸 민 것이 정답 줄이 된다.
        정답은 분명히 쓰이고(loss 는 정답 token 의 확률로 계산한다), 다만 사람이 만들 필요가 없을 뿐이다. tokenizer 는 text 를
        token 으로 자르기만 할 뿐 정답을 붙이지 않고, 정답이 없으면 loss 를 계산할 수도 없다.
    - question: |
        token 줄 `a b c d` 에서 입력을 `a b c`, 정답을 `b c d` 로 잡았다. 위치 2 가 푸는 문제는?
      choices:
        - '`a b` 를 보고 `c` 를 맞힌다'
        - '`b` 하나만 보고 `c` 를 맞힌다'
        - '`a b c` 전체를 보고 `b` 를 맞힌다'
        - '`a b c d` 전체를 보고 `c` 를 맞힌다'
      answer: 0
      explanation: |
        위치 $t$ 는 입력의 처음부터 자기 자리까지를 보고 정답 줄의 같은 자리, 곧 바로 다음 token 을 맞힌다. 위치 2 는 `a b` 를
        보고 `c` 를 맞힌다. 자기 token 하나만 보는 것이 아니라 앞부분 전체를 보고, 뒤쪽 입력을 보면 정답을 베낄 수 있으므로
        보지 않는다. `d` 까지 보는 답은 정답을 이미 아는 상태에서 맞히는 셈이다.
    - question: |
        다음 token 맞히기처럼 데이터 자신에서 정답을 만들어 학습하는 방식(self-supervised learning)에 대한 설명으로 맞는 것은?
      choices:
        - '사람이 label 을 단 데이터만 학습에 쓸 수 있다'
        - '정답이 전혀 쓰이지 않는 학습이다'
        - '번역처럼 입력 문장과 정답 문장을 쌍으로 모아야 한다'
        - '정답이 text 안에 들어 있으니 인터넷의 아무 글이나 학습 데이터로 쓸 수 있다'
      answer: 3
      explanation: |
        정답을 사람이 아니라 데이터 자신에서 만들기 때문에, label 이 없는 글도 그대로 학습 데이터가 된다. GPT-2 가 웹 문서
        수백만 개로 학습할 수 있었던 것도 이 덕분이다. "self" 는 정답을 스스로 만든다는 뜻이지 정답이 없다는 뜻이 아니고,
        사람의 label 이나 입력·정답 쌍을 모으는 일은 바로 이 방식이 없앤 준비 작업이다.

- topic: decoder-only
  title: decoder 만 남긴 구조와 position embedding
  variants:
    - question: |
        번역용 Transformer 의 decoder layer 에는 cross-attention 이 있지만, GPT 의 block 에는 없다. 빠진 이유는?
      choices:
        - 'cross-attention 은 계산이 너무 느려서'
        - 'language model 에는 encoder 가 읽을 별도의 입력이 없고, 지금까지 쓴 text 가 곧 입력이라서'
        - 'masked self-attention 과 계산이 똑같아 중복이라서'
        - 'cross-attention 이 있으면 뒤쪽 token 을 보게 되어서'
      answer: 1
      explanation: |
        cross-attention 은 encoder 가 읽은 원문(번역할 문장)을 decoder 가 들여다보는 통로다. language model 은 앞에 쓴 text 만으로
        다음 token 을 정하므로 원문도 encoder 도 없고, 그래서 그 통로도 필요 없다. 속도 때문이 아니고, cross-attention 은 다른
        문장을 보는 계산이라 자기 문장끼리 보는 masked self-attention 과 다르다. 뒤쪽 token 을 막는 일은 causal mask 가 맡는다.
    - question: |
        GPT 의 position embedding 표는 위치마다 한 행씩 두는 표다. 이 표의 행 수가 정하는 것은?
      choices:
        - 'vocabulary 에 들어 있는 token 의 개수'
        - '쌓는 block 의 개수'
        - 'token vector 하나의 차원'
        - '모델이 한 번에 볼 수 있는 token 의 최대 개수, 곧 context length'
      answer: 3
      explanation: |
        행 하나가 위치 하나이므로, 행이 없는 위치의 token 에는 더할 position vector 가 없다. 그래서 행 수가 곧 context length 다.
        vocabulary 크기는 token embedding 표의 행 수, token vector 의 차원은 두 표의 열 수이고, block 수는 embedding 표와 상관없이
        따로 정하는 값이다.
    - question: |
        같은 token "컵" 이 한 문장의 위치 2 와 위치 5 에 나왔다. GPT 의 첫 block 에 들어가는 두 vector 는 어떤가?
      choices:
        - 'token embedding 은 같지만 더하는 position embedding 이 달라서 서로 다른 vector 다'
        - 'token 이 같으니 완전히 같은 vector 다'
        - '위치 5 의 vector 는 위치 2 의 vector 에 위치 번호를 곱한 것이다'
        - '뒤에 나온 token 은 앞에 나온 같은 token 의 vector 를 그대로 복사해 쓴다'
      answer: 0
      explanation: |
        첫 block 의 입력은 token embedding 과 그 위치의 position embedding 을 더한 vector 다. token 이 같아도 위치가 다르면 더하는
        행이 달라 vector 가 달라지고, 그래서 순서를 모르는 attention 도 위치를 구분할 수 있다. 두 vector 가 같다면 모델은 순서를
        알 수 없다. position embedding 은 위치 번호를 곱하는 방식이 아니라 위치마다 따로 학습하는 행을 더하는 방식이다.

- topic: causal-mask
  title: 뒤쪽 위치를 막는 causal mask
  variants:
    - question: |
        GPT 를 학습시킬 때 self-attention 에서 causal mask 를 빼 버리면 어떤 일이 생길까?
      choices:
        - '학습 loss 가 전혀 내려가지 않는다'
        - '각 위치가 자기보다 앞의 token 을 볼 수 없게 된다'
        - '계산만 조금 빨라지고 학습 결과는 똑같다'
        - '각 위치가 바로 뒤에 들어 있는 정답을 베껴 학습 loss 는 쉽게 내려가지만, 실제로 글을 쓸 때는 베낄 다음 token 이 없어 제대로 맞히지 못한다'
      answer: 3
      explanation: |
        teacher forcing 으로 정답을 입력에 한꺼번에 넣기 때문에, 위치 $t$ 의 정답은 위치 $t + 1$ 의 입력으로 들어와 있다. mask 가
        없으면 모델은 그 칸을 보고 답을 베끼는 법을 배워 loss 가 오히려 쉽게 내려간다. 하지만 생성할 때는 다음 token 이 아직 없으니
        베낄 곳이 사라져 결과가 나빠진다. mask 를 빼면 볼 수 있는 범위가 늘어날 뿐 앞쪽을 못 보게 되지는 않는다.
    - question: |
        causal mask 는 attention 에서 뒤쪽 위치의 weight 를 0 으로 만든다. 어떤 방법으로 하는가?
      choices:
        - 'softmax 를 한 뒤 뒤쪽 위치의 weight 만 0 으로 지우고 그대로 쓴다'
        - 'softmax 전에 뒤쪽 위치의 점수를 $-\infty$ 로 바꿔 그 칸이 0 이 되게 하고, 남은 칸들이 합 1 을 다시 나눠 갖게 한다'
        - 'softmax 전에 뒤쪽 위치의 점수를 0 으로 바꾼다'
        - '뒤쪽 token 을 입력에서 지운 뒤 forward 를 한다'
      answer: 1
      explanation: |
        $e^{-\infty} = 0$ 이라서 점수를 $-\infty$ 로 바꾼 칸은 softmax 뒤 weight 가 0 이 되고, 나머지 칸끼리 합 1 을 나눈다.
        softmax 뒤에 지우기만 하면 남은 weight 의 합이 1 보다 작아진다. 점수 0 은 $e^{0} = 1$ 이라 weight 가 0 이 되지 않는다.
        입력에서 token 을 지우면 그 token 의 위치가 풀 문제까지 사라지므로, forward 한 번에 모든 위치를 학습하는 장점이 없어진다.
    - question: |
        causal mask 를 쓴 GPT 에 긴 입력을 넣었다. 위치 10 에서 나오는 확률표에 대한 설명으로 맞는 것은?
      choices:
        - '입력 전체의 모든 token 에 따라 달라진다'
        - '위치 10 의 token 하나에만 따라 달라진다'
        - '위치 1 부터 10 까지의 입력에만 따라 달라지고, 위치 11 이후의 token 을 바꿔도 그대로다'
        - 'block 을 여러 개 쌓으면 위쪽 block 으로 갈수록 뒤쪽 위치의 정보가 조금씩 섞여 들어온다'
      answer: 2
      explanation: |
        mask 때문에 위치 10 은 위치 1 ~ 10 만 보고, 그 위치들의 vector 도 각자 자기 앞만 보고 만들어졌다. 그래서 block 을 몇 개
        쌓아도 뒤쪽 정보는 끼어들 길이 없다. 자기 token 하나만 보는 것도 아니어서 앞부분 전체가 영향을 준다. 이 성질 덕분에
        forward 한 번으로 모든 위치의 다음 token 맞히기를 함께 풀 수 있다.

- topic: cross-entropy
  title: 위치마다 정답 확률로 매기는 loss
  variants:
    - question: |
        GPT 는 위치마다 모델이 정답 token 에 준 확률 $p$ 로 loss $-\log p$ 를 매긴다. 이 loss 에 대한 설명으로 맞는 것은?
      choices:
        - '정답 확률이 1 에 가까울수록 0 에 가깝고, 0 에 가까울수록 크게 커진다'
        - '정답 확률이 클수록 loss 도 커진다'
        - 'loss 는 언제나 0 과 1 사이다'
        - '확률이 가장 큰 token 이 정답이기만 하면 loss 는 0 이다'
      answer: 0
      explanation: |
        $\log 1 = 0$ 이고 $p$ 가 0 에 가까워질수록 $\log p$ 는 끝없이 작은 음수가 되므로, 마이너스를 붙인 loss 는 0 에서 시작해
        끝없이 커질 수 있다. 그래서 1 을 넘는 loss 도 흔하다. 정답 확률이 클수록 loss 는 작아진다. 정답이 1 등이라도 확률이
        0.6 이면 loss 는 0 이 아니어서, 학습은 정답 확률을 1 쪽으로 계속 끌어올린다.
    - question: |
        vocabulary 가 $V$ 개인 GPT 를 학습시키기 직전에 loss 를 재면 보통 $\log V$ 근처가 나온다. 그 이유는?
      choices:
        - '모델이 처음부터 몇몇 token 에 확률을 몰아주기 때문에'
        - '학습 전에도 대부분의 위치에서 정답을 맞히기 때문에'
        - 'parameter 가 작은 무작위 숫자라 logits 가 비슷해 모든 token 이 약 $1/V$ 의 확률을 받고, $-\log(1/V) = \log V$ 이기 때문에'
        - 'loss 가 $\log V$ 보다 훨씬 크게 시작하는 것이 정상이고, 그 값이 줄어든 것이기 때문에'
      answer: 2
      explanation: |
        학습 전의 모델은 아는 것이 없어 vocabulary 전체에 확률을 거의 고르게 나누므로 정답 확률이 약 $1/V$ 다. 그래서 첫 loss 는
        $\log V$ 근처다. 첫 loss 가 이보다 훨씬 크다면 처음 weight 가 너무 커서 엉뚱한 token 에 확률을 몰아주고 있다는 신호이고,
        학습 전 모델이 정답을 잘 맞힐 이유도 없다. 이 값은 학습을 돌리기 전에 모델이 제대로 만들어졌는지 확인하는 데 쓴다.
    - question: |
        같은 영어 text 에서 loss 를 쟀다. 글자 하나를 token 하나로 쓰는 모델 A 는 token 하나당 loss 가 1.5, 글자 여러 개를 token
        하나로 묶는 BPE 모델 B 는 token 하나당 loss 가 3.0 이다. 맞는 판단은?
      choices:
        - 'A 의 loss 가 절반이니 A 가 확실히 더 좋은 모델이다'
        - 'B 는 token 하나로 글자 여러 개를 맞혀 문제 하나가 더 어려우므로, 같은 text 의 byte 하나당 loss 로 바꿔 비교해야 한다'
        - 'loss 는 token 을 자르는 방법과 상관없으니 숫자를 그대로 비교하면 된다'
        - 'B 의 loss 를 vocabulary 크기로 나누면 공정하게 비교된다'
      answer: 1
      explanation: |
        loss 는 token 하나당 평균이라서, token 하나에 담긴 글자 수가 다르면 문제 하나의 난이도부터 다르다. 같은 text 전체에 든
        loss(token 수 × token 하나당 loss)를 byte 수로 나누면 단위가 맞아 비교할 수 있고, 이렇게 보면 B 가 더 나을 수도 있다.
        그래서 숫자를 그대로 비교하면 안 되고, vocabulary 크기로 나누는 것은 근거가 없는 보정이다.

- topic: weight-tying
  title: token embedding 표를 다시 쓰는 출력 층
  variants:
    - question: |
        GPT-2 가 쓰는 weight tying 은 무엇인가?
      choices:
        - '모든 block 이 같은 parameter 를 함께 쓰는 것'
        - 'query·key·value 를 만드는 행렬을 하나로 묶는 것'
        - '출력 층이 새 행렬 대신 입력의 token embedding 표를 다시 써서, 마지막 vector 와 token 마다의 embedding 의 dot product 를 logit 으로 삼는 것'
        - 'token embedding 과 position embedding 을 같은 표로 쓰는 것'
      answer: 2
      explanation: |
        weight tying 은 입력에서 token 을 vector 로 바꾸는 표와, 출력에서 vector 를 token 마다의 logit 으로 바꾸는 행렬을 같은
        숫자로 묶는 것이다. block 들은 각자 parameter 를 따로 가지고, query·key·value 행렬도 서로 다르다. position embedding 은
        token embedding 과 다른 표이고 그 둘을 더해 입력을 만들 뿐이다.
    - question: |
        입력의 token embedding 표를 출력 층에서 다시 써도 되는 이유로 가장 알맞은 것은?
      choices:
        - '출력 층은 학습되지 않으므로 어떤 행렬을 써도 상관없어서'
        - 'token embedding 표가 vocabulary 크기와 상관없이 아주 작아서'
        - 'dot product 는 두 vector 가 서로 다를수록 커지는 점수라서'
        - 'dot product 는 두 vector 가 닮을수록 커지므로, 마지막 vector 가 어떤 token 의 embedding 과 닮을수록 그 token 의 logit 이 커져 입력과 출력이 token 의 뜻을 같은 숫자 공간에서 다루기 때문에'
      answer: 3
      explanation: |
        입력에서는 뜻이 비슷한 token 끼리 닮은 embedding 을 갖도록 학습되고, 출력에서는 마지막 vector 와 닮은 embedding 의 token
        이 높은 logit 을 받는다. 두 일이 같은 "닮음" 기준을 쓰니 표 하나로 둘 다 할 수 있다. dot product 는 다를수록이 아니라
        닮을수록 커지고, 표는 공유될 뿐 계속 학습된다. token embedding 표는 vocabulary 크기만큼 행이 있어 오히려 큰 편이다.
    - question: |
        weight tying 을 하지 않고 출력 층에 행렬을 따로 두면 무엇이 달라지는가?
      choices:
        - '(vocabulary 크기) × (vector 차원) 만큼의 parameter 가 더 필요하다'
        - '확률표를 만들 수 없게 된다'
        - 'parameter 수는 그대로이고 계산만 느려진다'
        - '입력 쪽 token embedding 표를 없앨 수 있다'
      answer: 0
      explanation: |
        출력 행렬은 vector 하나에서 vocabulary 의 token 마다 logit 하나를 뽑아야 하므로 token embedding 표와 같은 크기다. 따로 두면
        그만큼 parameter 가 늘고, GPT-2 의 가장 작은 모델에서는 전체의 약 24% 에 해당한다. 따로 둔 행렬로도 logits 와 확률표는
        잘 만들어지며, 입력 쪽 표는 token id 를 vector 로 바꾸는 데 여전히 필요하다.

- topic: lr-schedule
  title: warmup 과 cosine decay
  variants:
    - question: |
        GPT 를 학습시킬 때 learning rate 를 처음 몇 step 동안 0 근처에서 서서히 올리는 warmup 을 쓰는 가장 큰 이유는?
      choices:
        - '처음 보는 데이터는 쉬워서 조금만 배워도 되기 때문에'
        - '학습 초반에는 parameter 가 무작위라 loss 가 parameter 에 민감하고 Adam 의 moving average 도 아직 믿을 만하지 않아, 큰 step 이 parameter 를 발산시킬 수 있기 때문에'
        - '작게 시작해야 학습이 끝날 때까지 learning rate 를 작게 유지할 수 있기 때문에'
        - 'GPU 가 계산에 익숙해질 시간이 필요하기 때문에'
      answer: 1
      explanation: |
        가파른 곳에서 큰 learning rate 로 움직이면 parameter 가 부호를 바꾸며 점점 커지는 발산이 생길 수 있다. warmup 은 그
        위험한 초반에 step 을 작게 해 두었다가, 안정된 뒤 큰 learning rate 를 쓸 수 있게 해 준다. 그래서 learning rate 를 계속
        작게 두려는 것이 아니라 오히려 큰 값까지 올리려는 장치다. 데이터의 난이도나 하드웨어와는 관계가 없다.
    - question: |
        warmup 이 끝난 뒤 cosine decay 로 learning rate 를 점점 줄인다. 학습 후반에 learning rate 를 줄이는 이유는?
      choices:
        - 'loss 가 낮은 바닥 근처에서 parameter 는 mini-batch 마다 흔들리는 gradient 때문에 learning rate 크기만큼 오가는데, learning rate 를 줄이면 그 흔들림이 줄어 바닥에 더 가까이 내려앉기 때문에'
        - '학습 후반에는 gradient 가 정확히 0 이 되어 learning rate 가 필요 없기 때문에'
        - 'learning rate 를 줄일수록 모델이 새 데이터를 더 빨리 배우기 때문에'
        - '후반에는 learning rate 가 커져야 하는데 cos 곡선이 그렇게 만들어 주기 때문에'
      answer: 0
      explanation: |
        Adam 은 한 step 에 대략 learning rate 만큼 parameter 를 움직이므로, 바닥 근처에서도 그 폭으로 오간다. learning rate 를
        줄이면 오가는 폭이 같이 줄어 더 낮은 loss 에 머문다. mini-batch 의 gradient 는 바닥 근처에서도 흔들려 정확히 0 이 되지
        않는다. learning rate 가 작으면 배우는 속도는 오히려 느려지고, cosine decay 의 곡선은 learning rate 를 키우지 않고 줄인다.
    - question: |
        warmup 과 cosine decay 를 이은 learning rate schedule 의 모양을 바르게 적은 것은?
      choices:
        - '처음부터 최대값으로 시작해 일정한 속도로 직선처럼 줄어든다'
        - '0 근처에서 출발해 학습이 끝날 때까지 계속 올라간다'
        - '최대값과 최소값 사이를 cos 곡선처럼 여러 번 오르내린다'
        - '0 근처에서 직선으로 최대값까지 올라간 뒤, 처음과 끝에서는 천천히·가운데서는 빠르게 줄어 최소값에 닿고 그 뒤로는 최소값에 머문다'
      answer: 3
      explanation: |
        warmup 구간에서는 learning rate 가 지난 step 의 비율만큼 직선으로 올라 최대값에 닿는다. 그 뒤 cosine decay 는 cos 곡선의
        반쪽(꼭대기에서 바닥까지)을 따라가므로 처음과 끝은 완만하고 가운데가 가파르며, 끝나면 최소값을 그대로 쓴다. 처음부터
        최대값이면 warmup 이 없는 것이고, 계속 오르거나 여러 번 오르내리면 후반에 바닥 근처의 흔들림을 줄이지 못한다.

- topic: sampling
  title: 한 token 씩 이어 가는 생성, greedy decoding 과 sampling
  variants:
    - question: |
        GPT 로 글을 쓸 때 매번 확률이 가장 큰 token 만 고르는 greedy decoding 의 약점은?
      choices:
        - '계산이 복잡해서 아주 느리다'
        - '같은 prompt 에서도 쓸 때마다 다른 글이 나온다'
        - '확률이 가장 낮은 token 을 자주 고른다'
        - '같은 상황이 되풀이되면 같은 token 을 골라 같은 말을 맴돌기 쉽고, 두 번째로 그럴듯한 token 은 한 번도 고르지 않는다'
      answer: 3
      explanation: |
        greedy decoding 은 같은 앞부분에서 늘 같은 token 을 고르므로, 앞부분이 한 번 되풀이되면 글이 같은 구절을 끝없이 돌 수 있다.
        확률이 꽤 높은 다른 token 도 1 등이 아니면 영영 나오지 않아 표현이 단조롭다. 계산은 가장 큰 값 하나만 찾으면 되어
        간단하고, 결과도 언제나 같다. 쓸 때마다 다른 글이 나오는 것은 sampling 의 성질이다.
    - question: |
        다음 token 의 확률표가 A 0.6, B 0.3, C 0.1 이다. 이 확률표에서 확률에 따른 sampling 으로 token 을 여러 번 뽑으면?
      choices:
        - '언제나 A 가 나온다'
        - 'A, B, C 가 같은 비율로 나온다'
        - 'A 가 가장 자주 나오지만 B 와 C 도 대략 각자의 확률만큼 가끔 나온다'
        - '확률이 절반을 넘는 A 만 후보가 되고 그 안에서 뽑는다'
      answer: 2
      explanation: |
        sampling 은 확률을 길이로 삼은 구간에 random number 를 떨어뜨려 고르므로, 많이 뽑으면 각 token 이 자기 확률만큼 나온다.
        그래서 A 가 가장 자주 나오고 B, C 도 섞인다. 언제나 A 를 고르는 것은 greedy decoding 이고, 같은 비율로 나오는 것은
        확률을 무시한 고르기다. 일부 token 만 후보로 남기는 것은 top-k 같은 별도의 방법이다.
    - question: |
        학습 때 GPT 는 forward 한 번에 모든 위치의 다음 token 을 함께 맞힌다. 그런데 글을 새로 쓸 때는 token 을 한 번에 하나씩
        차례로 만들어야 한다. 그 이유는?
      choices:
        - '생성할 때는 causal mask 가 꺼지기 때문에'
        - '다음 token 을 고르려면 앞에서 고른 token 이 입력에 들어 있어야 해서, 고른 token 을 입력 끝에 붙이고 다시 넣는 일을 되풀이해야 하기 때문에'
        - '모델이 생성할 때는 마지막 위치에서만 확률표를 낼 수 있기 때문에'
        - '학습 때도 사실은 위치마다 forward 를 따로 했기 때문에'
      answer: 1
      explanation: |
        학습 때는 정답 text 전체가 이미 있어서 모든 위치를 한꺼번에 넣을 수 있지만, 생성할 때는 다음 token 이 아직 정해지지
        않았다. 그래서 token 하나를 골라 입력 끝에 붙이고 다시 넣는 autoregressive 방식으로 하나씩 만든다. causal mask 는 생성
        때도 그대로 쓰이고, 모델은 위치마다 확률표를 내지만 생성에는 마지막 위치의 표만 쓸 뿐이다.

- topic: temperature-topk
  title: temperature 와 top-k
  variants:
    - question: |
        sampling 전에 logits 를 temperature $\tau$ 로 나눈다. $\tau$ 를 1 에서 0.5 로 낮추면 어떻게 되는가?
      choices:
        - 'logits 사이의 차이가 커져 확률이 큰 token 에 더 몰리고, 생성되는 글이 덜 다양해진다'
        - '확률이 고르게 퍼져 확률이 낮은 token 이 더 자주 뽑힌다'
        - '가장 그럴듯한 token 의 순서가 뒤바뀐다'
        - '모든 token 의 확률이 똑같이 절반이 된다'
      answer: 0
      explanation: |
        0.5 로 나누면 logits 가 두 배가 되어 서로의 차이도 두 배가 되고, softmax 는 차이에 따라 확률을 나누므로 1 등에 더 몰린다.
        확률이 고르게 퍼지는 것은 $\tau$ 를 1 보다 크게 했을 때다. 같은 양수로 나누면 크기 순서는 그대로이고, 확률의 합은 언제나
        1 이라 모두 절반이 될 수 없다.
    - question: |
        temperature $\tau$ (양수)를 어떤 값으로 바꿔도 변하지 않는 것은?
      choices:
        - '각 token 이 뽑힐 확률'
        - 'logits 의 크기 순서, 그래서 greedy decoding 이 고르는 token'
        - '확률이 가장 낮은 token 의 확률'
        - 'sampling 으로 쓴 글의 다양한 정도'
      answer: 1
      explanation: |
        모든 logit 을 같은 양수로 나누면 큰 것은 여전히 크고 작은 것은 여전히 작다. 그래서 1 등 token 은 그대로이고, 1 등만 고르는
        greedy decoding 의 결과도 같다. temperature 가 바꾸는 것은 확률이 1 등에 몰린 정도라서, 각 token 의 확률과 낮은 token 의
        확률, 글의 다양함은 모두 달라진다.
    - question: |
        top-k sampling 에 대한 설명으로 맞는 것은?
      choices:
        - '$k$ 를 vocabulary 크기만큼 키우면 greedy decoding 과 같아진다'
        - '상위 $k$ 개 밖의 token 도 확률이 조금 줄어들 뿐 여전히 뽑힐 수 있다'
        - '상위 $k$ 개 밖의 logits 를 $-\infty$ 로 막아 확률이 낮은 이상한 token 이 아예 뽑히지 않게 하고, $k = 1$ 이면 greedy decoding 과 같다'
        - '남은 $k$ 개의 확률은 원래 값 그대로라서 합이 1 보다 작아진다'
      answer: 2
      explanation: |
        top-k 는 logits 가 큰 $k$ 개만 남기고 나머지를 $-\infty$ 로 바꾼 뒤 softmax 하므로, 밖의 token 은 확률이 정확히 0 이다.
        남은 $k$ 개가 softmax 로 합 1 을 다시 나눠 가지니 합이 줄지 않는다. $k = 1$ 이면 1 등만 남아 greedy decoding 이 되고,
        $k$ 를 vocabulary 크기로 키우면 아무것도 막지 않은 원래 sampling 이 된다.
