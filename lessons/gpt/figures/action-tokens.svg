  <rect x="482.0" y="150.0" width="52.0" height="40.0" rx="6" fill="#111a2e" fill-opacity="1" stroke="#334155" stroke-width="1.5"/>
  <text x="508.0" y="174.7" fill="#e2e8f0" font-size="13" text-anchor="middle">⋯</text>
