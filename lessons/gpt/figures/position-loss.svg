<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위치마다 정답 확률과 loss</title>
  <defs>
<marker id="a38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
<marker id="af59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="a34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
<marker id="af87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
<marker id="aa78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
<marker id="a94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ae2e8f0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="343" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="32.0" fill="#38bdf8" font-size="13" text-anchor="start">정답의 확률 p</text>
  <text x="30.0" y="190.0" fill="#f59e0b" font-size="13" text-anchor="start">loss −log p</text>
  <rect x="90.0" y="100.0" width="60.0" height="50.0" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
  <text x="120.0" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.5</text>
  <rect x="90.0" y="205.0" width="60.0" height="83.2" rx="3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
  <text x="120.0" y="305.2" fill="#e2e8f0" font-size="12" text-anchor="middle">0.693</text>
  <text x="120.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">1: &lt;bos&gt; → 빨간</text>
  <rect x="220.0" y="70.0" width="60.0" height="80.0" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
  <text x="250.0" y="65.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.8</text>
  <rect x="220.0" y="205.0" width="60.0" height="26.8" rx="3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
  <text x="250.0" y="248.8" fill="#e2e8f0" font-size="12" text-anchor="middle">0.223</text>
  <text x="250.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">2: 빨간 → 컵</text>
  <rect x="350.0" y="89.1" width="60.0" height="60.9" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
  <text x="380.0" y="84.1" fill="#e2e8f0" font-size="12" text-anchor="middle">0.609</text>
  <rect x="350.0" y="205.0" width="60.0" height="59.5" rx="3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
  <text x="380.0" y="281.5" fill="#e2e8f0" font-size="12" text-anchor="middle">0.496</text>
  <text x="380.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">3: 컵 → 집어</text>
  <rect x="480.0" y="60.0" width="60.0" height="90.0" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
  <text x="510.0" y="55.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.9</text>
  <rect x="480.0" y="205.0" width="60.0" height="12.6" rx="3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1"/>
  <text x="510.0" y="234.6" fill="#e2e8f0" font-size="12" text-anchor="middle">0.105</text>
  <text x="510.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">4: 집어 → &lt;eos&gt;</text>
  <line x1="70.0" y1="150.0" x2="600.0" y2="150.0" stroke="#334155" stroke-width="1.2"/>
  <line x1="70.0" y1="205.0" x2="600.0" y2="205.0" stroke="#334155" stroke-width="1.2"/>
  <text x="320.0" y="332.0" fill="#e2e8f0" font-size="13" text-anchor="middle">평균 loss = (0.693 + 0.223 + 0.496 + 0.105) ÷ 4 ≈ 0.379</text>
</svg>
