<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Pop-Art 가 정규화 기준을 바꾸는 순간. σ = 10, μ = 0 에서 σ = 20, μ = 5 로 바뀌면 마지막 층을 W = 1, b = 0 에서 W = 0.5, b = −0.25 로 고쳐 출력 20 을 지킨다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">Pop-Art 의 출력 보존 (예로 든 값, 마지막 층 입력 h = 2)</text>
  <rect x="20.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="130.0" y="72.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">바뀌기 전</text>
  <text x="36.0" y="104.0" fill="#94a3b8" font-size="11" text-anchor="start">정규화 기준</text>
  <text x="36.0" y="124.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">σ = 10, μ = 0</text>
  <text x="36.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="start">마지막 층</text>
  <text x="36.0" y="174.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">W = 1, b = 0</text>
  <text x="36.0" y="204.0" fill="#94a3b8" font-size="11" text-anchor="start">실제 출력 σ(Wh + b) + μ</text>
  <text x="36.0" y="224.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">10 × (1 × 2 + 0) + 0</text>
  <text x="130.0" y="258.0" fill="#7cb4d8" font-size="15" text-anchor="middle" font-weight="600">출력 20</text>
  <line x1="242.0" y1="160.0" x2="250.0" y2="160.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="252.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="362.0" y="72.0" fill="#d88b8b" font-size="13" text-anchor="middle" font-weight="600">기준만 바꿈 (Art)</text>
  <text x="268.0" y="104.0" fill="#94a3b8" font-size="11" text-anchor="start">정규화 기준</text>
  <text x="268.0" y="124.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">σ = 20, μ = 5</text>
  <text x="268.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="start">마지막 층</text>
  <text x="268.0" y="174.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">W = 1, b = 0 그대로</text>
  <text x="268.0" y="204.0" fill="#94a3b8" font-size="11" text-anchor="start">실제 출력 σ(Wh + b) + μ</text>
  <text x="268.0" y="224.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">20 × (1 × 2 + 0) + 5</text>
  <text x="362.0" y="258.0" fill="#d88b8b" font-size="15" text-anchor="middle" font-weight="600">출력 45</text>
  <line x1="474.0" y1="160.0" x2="482.0" y2="160.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <rect x="484.0" y="46.0" width="220.0" height="230.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.4"/>
  <text x="594.0" y="72.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">기준과 층을 함께 (Pop-Art)</text>
  <text x="500.0" y="104.0" fill="#94a3b8" font-size="11" text-anchor="start">정규화 기준</text>
  <text x="500.0" y="124.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">σ = 20, μ = 5</text>
  <text x="500.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="start">마지막 층</text>
  <text x="500.0" y="174.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">W = 0.5, b = −0.25</text>
  <text x="500.0" y="204.0" fill="#94a3b8" font-size="11" text-anchor="start">실제 출력 σ(Wh + b) + μ</text>
  <text x="500.0" y="224.0" fill="#e2e8f0" font-size="11.5" text-anchor="start">20 × (0.5 × 2 − 0.25) + 5</text>
  <text x="594.0" y="258.0" fill="#7fc4a2" font-size="15" text-anchor="middle" font-weight="600">출력 20</text>
  <text x="20.0" y="304.0" fill="#94a3b8" font-size="12" text-anchor="start">기준만 바꾸면 같은 입력의 출력이 20 에서 45 로 바뀐다. Pop-Art 는 W 와 b 를 고쳐 20 을 지킨다</text>
</svg>
