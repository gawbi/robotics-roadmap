<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>step 마다 −1 인 미로와, 같은 reward 에 2 를 더해 step 마다 +1 이 된 미로. 5 step 과 10 step 경로의 return 이 −5, −10 에서 5, 10 으로 바뀌어 더 좋은 경로가 뒤집힌다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">목표에 닿으면 끝나는 미로에서 모든 reward 에 2 를 더할 때</text>
  <rect x="20.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185.0" y="72.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">step 마다 −1</text>
  <line x1="50.0" y1="200.0" x2="320.0" y2="200.0" stroke="#1e293b" stroke-width="1"/>
  <rect x="90.0" y="200.0" width="70.0" height="35.0" rx="3" fill="#7cb4d8" fill-opacity="0.85" stroke="#7cb4d8" stroke-width="0"/>
  <text x="125.0" y="253.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">return -5</text>
  <text x="125.0" y="192.0" fill="#94a3b8" font-size="11" text-anchor="middle">5 step 경로</text>
  <rect x="220.0" y="200.0" width="70.0" height="70.0" rx="3" fill="#7cb4d8" fill-opacity="0.85" stroke="#7cb4d8" stroke-width="0"/>
  <text x="255.0" y="288.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">return -10</text>
  <text x="255.0" y="192.0" fill="#94a3b8" font-size="11" text-anchor="middle">10 step 경로</text>
  <text x="185.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">짧은 경로가 좋다 → 빨리 끝낸다</text>
  <rect x="370.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="535.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">step 마다 +1 (−1 에 2 를 더함)</text>
  <line x1="400.0" y1="200.0" x2="670.0" y2="200.0" stroke="#1e293b" stroke-width="1"/>
  <rect x="440.0" y="165.0" width="70.0" height="35.0" rx="3" fill="#d6aa62" fill-opacity="0.85" stroke="#d6aa62" stroke-width="0"/>
  <text x="475.0" y="157.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">return 5</text>
  <text x="475.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="middle">5 step 경로</text>
  <rect x="570.0" y="130.0" width="70.0" height="70.0" rx="3" fill="#d6aa62" fill-opacity="0.85" stroke="#d6aa62" stroke-width="0"/>
  <text x="605.0" y="122.0" fill="#e2e8f0" font-size="12" text-anchor="middle" font-weight="600">return 10</text>
  <text x="605.0" y="218.0" fill="#94a3b8" font-size="11" text-anchor="middle">10 step 경로</text>
  <text x="535.0" y="100.0" fill="#e2e8f0" font-size="12" text-anchor="middle">긴 경로가 좋다 → 늦게 끝내거나 끝내지 않는다</text>
</svg>
