<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 경로의 shaping 점수. 출발점의 Φ = −3, 목표의 Φ = 0 이다. 곧장 가면 +1 세 번, 돌아가면 +1, −1, +1, +1, +1 로 합이 모두 3 이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">Φ(s) = −(목표까지 거리), γ = 1 인 예에서 두 경로의 shaping 점수</text>
  <text x="20.0" y="54.0" fill="#7cb4d8" font-size="13" text-anchor="start" font-weight="600">곧장 가기</text>
  <rect x="40.0" y="76.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.4"/>
  <text x="75.0" y="93.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 3</text>
  <text x="75.0" y="109.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -3</text>
  <line x1="112.0" y1="96.0" x2="150.0" y2="96.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="131.0" y="72.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="152.0" y="76.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="187.0" y="93.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 2</text>
  <text x="187.0" y="109.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -2</text>
  <line x1="224.0" y1="96.0" x2="262.0" y2="96.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="243.0" y="72.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="264.0" y="76.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="299.0" y="93.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 1</text>
  <text x="299.0" y="109.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -1</text>
  <line x1="336.0" y1="96.0" x2="374.0" y2="96.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="355.0" y="72.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="376.0" y="76.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.4"/>
  <text x="411.0" y="93.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 0</text>
  <text x="411.0" y="109.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = 0</text>
  <text x="500.0" y="102.0" fill="#7cb4d8" font-size="14" text-anchor="start" font-weight="600">합 = 3</text>
  <text x="20.0" y="164.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">돌아서 가기</text>
  <rect x="40.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.4"/>
  <text x="75.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 3</text>
  <text x="75.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -3</text>
  <line x1="112.0" y1="206.0" x2="150.0" y2="206.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="131.0" y="182.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="152.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="187.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 2</text>
  <text x="187.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -2</text>
  <line x1="224.0" y1="206.0" x2="262.0" y2="206.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="243.0" y="182.0" fill="#d88b8b" font-size="12.5" text-anchor="middle" font-weight="600">-1</text>
  <rect x="264.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="299.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 3</text>
  <text x="299.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -3</text>
  <line x1="336.0" y1="206.0" x2="374.0" y2="206.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="355.0" y="182.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="376.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="411.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 2</text>
  <text x="411.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -2</text>
  <line x1="448.0" y1="206.0" x2="486.0" y2="206.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="467.0" y="182.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="488.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.4"/>
  <text x="523.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 1</text>
  <text x="523.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = -1</text>
  <line x1="560.0" y1="206.0" x2="598.0" y2="206.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-muted)"/>
  <text x="579.0" y="182.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle" font-weight="600">+1</text>
  <rect x="600.0" y="186.0" width="70.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.4"/>
  <text x="635.0" y="203.0" fill="#e2e8f0" font-size="12" text-anchor="middle">거리 0</text>
  <text x="635.0" y="219.0" fill="#94a3b8" font-size="11" text-anchor="middle">Φ = 0</text>
  <text x="20.0" y="268.0" fill="#d6aa62" font-size="14" text-anchor="start" font-weight="600">합 = 1 − 1 + 1 + 1 + 1 = 3</text>
  <text x="20.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="start">멀어진 step 의 −1 이 다가가며 받은 +1 을 되돌려, 합은 늘 Φ(목표) − Φ(출발) = 0 − (−3) = 3 이다</text>
</svg>
