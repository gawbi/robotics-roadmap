# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: shaping-sum
  title: potential-based shaping 의 합
  section: potential-based-shaping-과-q-초기화
  variants:
    - question: |
        $\Phi(s) = -(\text{목표까지 거리})$ 로 potential-based shaping 을 하고 $\gamma = 1$ 이다. 거리 3 에서 출발해 한 번 멀어졌다가 목표에 닿은 경로의 shaping 점수의 합은 얼마인가?
      choices:
        - '2 로, 멀어진 step 의 −1 만큼 곧장 간 경로보다 작다'
        - '4 로, 경로가 길어진 만큼 점수를 더 받는다'
        - '3 으로, 곧장 간 경로와 같다'
        - '0 으로, 돌아간 경로는 shaping 점수를 받지 못한다'
      answer: 2
      explanation: |
        shaping 점수를 더하면 가운데 항이 지워져, 출발 state $s_0$ 과 목표의 $\Phi$ 로 계산한 $\Phi(\text{목표}) - \Phi(s_0) = 0 - (-3) = 3$ 만
        남는다. 멀어진 step 의 −1 은 그 앞에서 다가가며 받은 +1 을 되돌려 놓을 뿐이고 다시 다가갈 때 +1 을 받으므로, 합은 곧장 간 경로보다
        작아지지 않는다. 경로가 길어져도 가운데 항이 지워지므로 점수가 4 로 늘지 않는다. 돌아간 경로의 step 도 거리 변화만큼 점수를 받으므로
        합이 0 이 되지 않는다.
    - question: |
        Ng 등이 든 사례에서 자전거가 출발점 근처에서 원을 그리며 돈 원인과, potential-based shaping 이 이를 막는 이유로 옳은 것은 무엇인가?
      choices:
        - 'reward 가 너무 커서 critic 이 발산했고, shaping 으로 reward 를 줄여 크기를 맞추면 막힌다'
        - '다가갈 때만 점수를 주고 멀어질 때 빼지 않아서 돌면 점수가 쌓였고, 한 바퀴의 합이 0 이 되게 하면 막힌다'
        - 'discount 가 너무 작아 먼 목표를 무시했고, shaping 으로 γ 를 키우면 막힌다'
        - '탐색이 모자라 목표를 찾지 못했고, shaping 이 무작위 action 을 늘려 막는다'
      answer: 1
      explanation: |
        다가가는 구간마다 양의 점수를 받고 멀어질 때 penalty 가 없으면 원을 도는 것만으로 점수가 쌓인다. potential-based shaping 은 멀어지는
        step 에 같은 크기의 음수를 줘서 한 바퀴의 합이 0 이 된다. critic 의 발산은 이 사례의 원인으로 제시되지 않았고, shaping 은 reward 의
        크기를 맞추는 방법도 아니다. discount 가 작은 것도 원인으로 제시되지 않았고, shaping 은 $\gamma$ 를 바꾸지 않는다. 탐색 부족도 원인으로
        제시되지 않았고, shaping 은 무작위 action 을 늘리지 않는다.
    - question: |
        potential-based shaping 을 더한 문제의 최적 Q 가 $Q^*(s, a) - \Phi(s)$ 라는 결과에서, 최적 policy 가 바뀌지 않는 이유는 무엇인가?
      choices:
        - '$\Phi$ 가 action 에 따라 달라져 좋은 action 의 Q 만 더 커지므로'
        - 'shaping 점수가 늘 0 이어서 Q 값 자체가 바뀌지 않으므로'
        - '$\Phi$ 를 빼면 모든 Q 가 0 이 되어 어떤 action 이든 최적이 되므로'
        - '모든 action 에서 같은 $\Phi(s)$ 를 빼 순위가 그대로이므로'
      answer: 3
      explanation: |
        $\Phi(s)$ 는 state 에만 달린 값이라 같은 state 의 모든 action 에서 같은 양을 뺀다. 그래서 어느 action 의 Q 가 가장 큰지는 그대로다.
        $\Phi$ 는 state 에만 달린 값이라 action 에 따라 달라지지 않는다. shaping 점수는 state 가 바뀔 때마다 0 이 아닌 값이 될 수 있다.
        $\Phi(s)$ 를 빼도 action 사이의 Q 차이는 남으므로 Q 가 모두 0 이 되지 않는다.

- topic: shaping-init
  title: shaping 과 Q 초기화의 동등성
  section: potential-based-shaping-과-q-초기화
  variants:
    - question: |
        Wiewiora(2003)가 보인 결과로 옳은 것은 무엇인가?
      choices:
        - '점수를 받는 learner 와 Q 를 $\Phi(s)$ 만큼 올려 시작한 learner 의 update 가 같다'
        - 'shaping 점수를 받는 Q-learning 은 어떤 초기화보다도 늘 더 빨리 최적 policy 에 수렴한다'
        - 'Q 를 $\Phi(s)$ 로 초기화하면 최적 policy 가 바뀌므로 shaping 점수를 써야 한다'
        - 'shaping 과 초기화는 표로 된 Q-learning 에서만 결과가 다르고, network 를 쓰면 늘 똑같다'
      answer: 0
      explanation: |
        shaping 점수를 받는 learner 와 Q 를 $\Phi(s)$ 만큼 올려 시작한 learner 가 같은 learning rate 로 같은 순서의 경험을 받으면, Q 값 update
        가 매번 같다. greedy·ε-greedy·Boltzmann(Q 가 큰 action 일수록 확률을 크게 주는 방식) policy 라면 다음 action 의 확률도 같다. 두 learner
        가 똑같이 움직이므로 shaping 이 늘 더 빠르다는 말은 틀렸다. Q 를 $\Phi(s)$ 로 초기화하는 것은 shaping 과 같은 효과라서 최적 policy 를
        바꾸지 않는다. 저자는 Q 값을 표로 저장하는 경우에 대해 결론을 냈고, network 를 쓰는 경우에는 오히려 shaping 이 여전히 쓸모 있을 수
        있다고 적었다.
    - question: |
        potential-based shaping 이 최적 policy 를 바꾸지 않는데도 학습 속도를 바꿀 수 있는 이유는 무엇인가?
      choices:
        - 'shaping 이 learning rate 를 state 마다 다르게 바꾸기 때문이다'
        - 'shaping 이 replay buffer 에서 좋은 transition 을 더 자주 뽑기 때문이다'
        - 'shaping 이 discount factor 를 1 에 가깝게 올려 먼 목표를 보기 때문이다'
        - 'shaping 은 Q 의 시작값을 $\Phi(s)$ 만큼 옮긴 것과 같아 탐색이 향하는 곳이 바뀌기 때문이다'
      answer: 3
      explanation: |
        Wiewiora 의 동등성에 따르면 shaping 은 Q 를 $\Phi(s)$ 만큼 올려 시작하는 것과 같다. 목표에 가까운 state 의 Q 가 처음부터 높아서 탐색이
        그쪽으로 먼저 끌린다. shaping 은 reward 에 점수를 더할 뿐 learning rate 를 바꾸지 않는다. shaping 은 replay buffer 에서 transition 을
        뽑는 방식도 바꾸지 않는다. shaping 은 discount factor 를 바꾸지 않는다.
    - question: |
        Q 값을 표로 저장하는 Q-learning 에서 potential 함수 $\Phi$ 를 알고 있을 때 Wiewiora 가 권한 방법은 무엇인가?
      choices:
        - 'shaping 점수를 reward 에 더하고 Q 는 0 으로 초기화한다'
        - '학습 알고리즘을 고치지 않고 Q 를 $\Phi$ 로 초기화한다'
        - '$\Phi$ 를 reward 에 곱해 reward 의 배율을 키운다'
        - '$\Phi$ 가 큰 state 를 시작 state 로만 골라 학습한다'
      answer: 1
      explanation: |
        저자는 shaping 점수를 다루도록 알고리즘을 고치기보다 Q 값을 potential 로 초기화하면 된다고 결론지었다. 두 방법의 update 가 같기
        때문이다. shaping 점수를 더하는 것도 결과는 같지만 저자가 권한 방법은 아니다. $\Phi$ 를 reward 에 곱하는 것은 shaping 도 초기화도
        아니라서 이 결과와 상관없다. 시작 state 를 고르는 것도 Q 의 시작값과 상관없어서 이 결과와 관계가 없다.

- topic: constant-shift
  title: 상수를 더한 reward 와 종료
  section: 상수를-더한-reward
  variants:
    - question: |
        목표에 닿으면 끝나는 미로에서 step 마다 −1 을 준다. 모든 reward 에 2 를 더하면 agent 가 배울 행동은 어떻게 바뀌는가?
      choices:
        - '모든 return 이 같은 양만큼 올라가 배울 행동은 그대로다'
        - 'reward 가 커져 더 빨리 목표에 가려고 서두르게 된다'
        - 'step 마다 +1 이 되어 오래 걸리거나 끝내지 않는 쪽이 좋아진다'
        - 'reward 가 0 이 되어 모든 경로가 똑같이 좋아진다'
      answer: 2
      explanation: |
        더한 뒤에는 step 마다 +1 이라서 5 step 경로는 5 를 받고 10 step 경로는 10 을 받는다. episode 가 끝나면 더 받을 reward 가 없으니 오래
        사는 것이 점수가 된다. 경로 길이에 따라 더해지는 양이 달라서 모든 return 이 같은 양만큼 오르지 않는다. 서두르게 되는 것은 step 마다
        reward 가 음수일 때다. 더한 뒤의 reward 는 0 이 아니라 +1 이다.
    - question: |
        끝없이 이어지는 문제(continuing task)에서 모든 reward 에 상수 $c$ 를 더하면 어떻게 되는가($\gamma < 1$)?
      choices:
        - '모든 가치가 $c / (1 - \gamma)$ 만큼 올라 더 좋은 action 은 그대로다'
        - '오래 사는 쪽이 유리해져서 최적 action 이 이전과 달라지고, 그에 따라 policy 도 바뀐다'
        - '가치가 모두 $c$ 배로 커져서 policy 가 더 결정적인 쪽으로 바뀐다'
        - 'discount 가 곱해지며 상수의 영향이 사라져 가치가 원래 그대로다'
      answer: 0
      explanation: |
        끝없이 이어지는 문제에서는 어느 state 에서 출발해도 그 뒤로 step 이 끝없이 이어지므로, 상수 $c$ 는 모든 가치에 $c / (1 - \gamma)$ 를
        똑같이 더한다. 그래서 더 좋은 action 은 바뀌지 않는다. 오래 사는 이점은 episode 가 끝나는 문제에서만 생긴다. 상수를 곱한 것이 아니라
        더했으므로 가치가 $c$ 배가 되지 않는다. discount 를 곱해도 $c / (1 - \gamma)$ 가 남으므로 가치는 그대로가 아니다.
    - question: |
        Kostrikov 등은 시연을 흉내 내도록 reward 를 학습하는 imitation learning 을 다뤘다. 학습한 reward 가 늘 음수일 때 agent 에게 생긴다고 저자들이 보고한 문제는 무엇인가?
      choices:
        - 'reward 가 음수라서 critic 의 gradient 가 0 이 된다'
        - '최소 step 으로 과제를 풀지 못하고 끝없이 돌아다닌다'
        - 'reward 가 음수이면 policy 의 entropy 가 0 으로 떨어진다'
        - 'penalty 를 덜 받으려고 episode 를 일찍 끝내는 쪽을 배운다'
      answer: 3
      explanation: |
        저자들에 따르면 늘 음수인 reward 에서는 agent 가 추가 penalty 를 피하려고 episode 를 일찍 끝낸다. 끝없이 돌아다니는 것은 늘 양수인
        reward 의 문제다. reward 가 음수여도 TD 오차가 0 이 아니면 critic 의 gradient 는 0 이 되지 않는다. reward 의 부호는 policy 의 entropy
        를 0 으로 떨어뜨리는 원인이 아니다.

- topic: termination-practice
  title: 생존 보너스와 시간 제한
  section: 상수를-더한-reward
  variants:
    - question: |
        보행 로봇 RL 학습 코드인 legged_gym 의 기본 설정 `only_positive_rewards = True` 는 무엇을 하고, 왜 필요한가?
      choices:
        - '양수 reward 항만 남기고 penalty 항을 모두 지워 학습을 빠르게 한다'
        - 'step 마다 reward 합이 음수면 0 으로 잘라, 일찍 넘어지는 쪽이 유리해지는 것을 막는다'
        - 'reward 를 ±1 로 잘라 DQN 처럼 같은 learning rate 를 쓰게 한다'
        - '음수 reward 를 받는 순간 그 episode 를 즉시 끝내서 위험한 동작을 미리 막아 준다'
      answer: 1
      explanation: |
        설정 파일의 주석에 따르면 이 설정은 step 마다 더한 reward 의 합이 음수이면 0 으로 잘라 일찍 끝내는 문제를 피한다. penalty 가 많아
        합이 음수면 일찍 넘어지는 것이 유리해지기 때문이다. 이 설정은 penalty 항을 지우지 않고 더한 합만 자른다. 양수인 합은 그대로 두므로
        DQN 처럼 ±1 로 자르는 것과 다르다. 음수인 합을 0 으로 바꿀 뿐 episode 를 끝내지는 않는다.
    - question: |
        한 다리로 뛰는 시뮬레이션 로봇 Hopper 처럼 넘어지지 않은 step 마다 reward 를 주는 환경에서, 시간 제한으로 끊긴 순간을 진짜 종료처럼 다루면 생기는 문제는 무엇인가?
      choices:
        - '남은 미래의 가치를 지워 시간 제한 근처의 행동이 왜곡된다'
        - 'reward 가 두 번 더해져 return 이 실제보다 커진다'
        - '시간 제한이 없어진 것처럼 episode 가 끝나지 않는다'
        - '넘어진 경우도 시간 제한으로 끊긴 것처럼 미래를 남긴다'
      answer: 0
      explanation: |
        시간 제한으로 끊긴 순간에도 로봇은 서 있고 미래가 남아 있는데, 이를 종료로 다루면 그 미래를 0 으로 둔다. Pardo 등은 시간 제한을 종료로
        다루는 것을 흔한 실수로 꼽았다. 끊긴 순간을 종료로 다뤄도 reward 가 두 번 더해지지는 않는다. 종료로 다루면 episode 는
        그대로 끝나므로 끝나지 않는 문제는 생기지 않는다. 넘어진 경우에 미래를 남기는 것은 이 질문과 반대 방향의 실수다.
    - question: |
        Unitree 의 humanoid G1 학습 설정에 있는 `alive` 항(살아 있는 step 마다 0.15)은 어떤 효과를 노린 것인가?
      choices:
        - '빨리 목표 속도에 닿도록 episode 를 짧게 만드는 서두르기 penalty'
        - 'reward 의 평균을 빼서 가치의 공통 항을 없애는 centering'
        - '넘어지지 않고 오래 서 있는 것 자체에 점수를 주는 생존 보너스'
        - 'reward 의 크기를 맞춰 SAC 의 temperature 를 조절하는 배율'
      answer: 2
      explanation: |
        살아 있는 step 마다 양의 상수를 주면 episode 를 오래 끌수록 점수가 쌓여, 넘어지지 않게 하는 생존 보너스가 된다. 서두르게 하는 것은
        양의 상수가 아니라 음의 상수다. reward 의 평균을 빼는 것은 reward centering 이고, `alive` 항은 상수를 더한다. `alive` 항은 reward 에
        배율을 곱하는 것이 아니라 더하는 항이라서 temperature 와 상관없다.

- topic: sac-scale
  title: reward 배율과 SAC
  section: reward-배율과-sac-의-temperature
  variants:
    - question: |
        일반 RL 에서는 reward 에 양수를 곱해도 최적 policy 가 그대로인데, SAC 에서는 결과가 바뀌는 이유는 무엇인가?
      choices:
        - 'SAC 는 reward 를 ±1 로 자르므로 배율을 바꾸면 잘리는 범위가 달라진다'
        - 'SAC 는 on-policy 라서 reward 배율에 따라 버리는 data 의 양이 달라진다'
        - 'SAC 의 critic 은 reward 를 쓰지 않고 entropy 만 학습하기 때문이다'
        - 'SAC 는 reward 와 entropy 를 함께 키우므로 배율이 temperature 의 역수처럼 작동한다'
      answer: 3
      explanation: |
        SAC 는 reward 에 entropy 항을 더한 값을 키우므로, reward 를 키우면 entropy 항의 비중이 상대적으로 줄어든다. SAC 논문의 저자들은
        배율이 entropy 항의 가중치인 temperature 의 역수 역할을 한다고 적었다. SAC 는 reward 를 ±1 로 자르지 않는다. SAC 는 on-policy 가 아니라
        off-policy 라서 data 를 replay buffer 에 모아 다시 쓴다. SAC 의 critic 은 entropy 만이 아니라 reward 로 만든 target 을 학습한다.
    - question: |
        action 두 개의 Q 값이 1 과 2 이고, 확률이 $\exp(Q / \alpha)$($e$ 를 $Q / \alpha$ 번 거듭제곱한 값)에 비례하는 policy 를 temperature $\alpha = 1$ 로 쓴다. reward 를 10 배 하면 어떻게 되는가?
      choices:
        - '확률이 0.269, 0.731 그대로다. 배율은 비율을 바꾸지 않는다'
        - '확률이 0.269, 0.731 에서 거의 0 과 1 로 몰려 한쪽만 고른다'
        - '확률이 0.475, 0.525 로 넓게 퍼져서 거의 고르게 고른다'
        - '확률이 0.5, 0.5 가 되어 두 action 을 같은 확률로 고른다'
      answer: 1
      explanation: |
        Q 값이 10 과 20 이 되어 지수의 차이가 1 에서 10 으로 커지므로 좋은 action 의 확률이 0.99995 로 몰린다. 지수 안의 차이가 바뀌므로 확률이
        0.269, 0.731 로 그대로 남지 않는다. 0.475, 0.525 로 퍼지는 것은 배율을 10 이 아니라 0.1 로 했을 때다. 두 action 의 확률이 0.5 로 같아지는
        것은 Q 값이 같을 때다.
    - question: |
        SAC 논문(2018)에서 reward 배율을 너무 작게 잡았을 때와 너무 크게 잡았을 때 생긴 일로 옳은 것은 무엇인가?
      choices:
        - '작으면 거의 고르게 퍼져 reward 를 못 쓰고, 크면 거의 결정적이라 탐색이 모자랐다'
        - '작으면 거의 결정적인 policy 가 되고, 크면 거의 고르게 퍼진 policy 가 됐다'
        - '작으면 critic 이 발산했고, 크면 actor 의 gradient 가 0 이 됐다'
        - '배율은 결과에 영향이 없어 저자들은 모든 환경에 1 을 썼다'
      answer: 0
      explanation: |
        저자들에 따르면 작은 배율에서는 policy 가 거의 고르게 퍼져 reward 를 활용하지 못했다. 큰 배율에서는 거의 한 action 만 고르는
        deterministic policy 가 되어 탐색 부족으로 나쁜 local minimum 에 빠졌다. 작으면 결정적이고 크면 고르게 퍼진다는 보기는 두 방향을 뒤바꾼
        것이다. critic 의 발산이나 actor 의 gradient 0 은 저자들이 든 이유가 아니다. 저자들은 배율이 결과에 민감하다고 보고 환경마다 5, 10, 20
        을 썼다.

- topic: clipping-popart
  title: reward 자르기와 Pop-Art
  section: reward-자르기와-pop-art
  variants:
    - question: |
        DQN 처럼 reward 를 ±1 로 자르면 Ms. Pac-Man 에서 생기는 문제는 무엇인가?
      choices:
        - '음수 reward 만 남아 agent 가 episode 를 일찍 끝내려 한다'
        - 'reward 가 작아져 critic 의 학습이 느려질 뿐 행동은 같다'
        - '유령과 알약의 reward 가 모두 1 이 되어 유령을 더 노리지 않는다'
        - '알약의 reward 가 0 이 되어 알약을 먹지 않는다'
      answer: 2
      explanation: |
        자르기는 reward 사이의 비율을 없앤다. 유령(100 이상)과 알약(25)이 모두 1 이 되어, 자른 agent 는 유령을 알약보다 더 노리지 않는다.
        양수 reward 는 1 로 잘리므로 음수 reward 만 남지는 않는다. 상수를 곱해 크기만 줄이는 것과 달리 자르기는 비율을 바꿔 배우는 행동을
        바꾼다. 양수 reward 는 0 이 아니라 1 로 잘리므로 알약의 reward 도 남는다.
    - question: |
        Pop-Art 가 target 의 정규화 기준인 평균 $\mu$ 와 표준편차 $\sigma$ 를 바꿀 때 마지막 층의 $W$ 와 $b$ 도 함께 고치는 이유는 무엇인가?
      choices:
        - '기준이 바뀔 때마다 network 전체를 처음부터 다시 학습하려고'
        - 'target 을 ±1 로 잘라 gradient 의 크기를 묶으려고'
        - '마지막 층의 weight 를 0 으로 되돌려 과적합을 막으려고'
        - '기준이 바뀌어도 같은 입력의 실제 출력이 그대로 남게 하려고'
      answer: 3
      explanation: |
        실제 출력은 $\sigma(W h + b) + \mu$ 라서($h$ 는 마지막 층에 들어오는 값) 기준만 바꾸면 network 가 그대로여도 출력이 바뀐다. 예를 들어
        $h = 2$, $W = 1$, $b = 0$ 에서 기준이 $\sigma = 10$, $\mu = 0$ 에서 $\sigma = 20$, $\mu = 5$ 로 바뀌면 출력 20 이 45 가 된다. Pop-Art 는
        $W$, $b$ 를 고쳐 출력을 지키고, 앞 층이 배운 표현은 건드리지 않는다. 마지막 층만 고치므로 network 전체를 다시 학습하지 않는다. target 을
        자르지 않고 정규화하는 방법이라 ±1 자르기와 다르다. weight 를 0 으로 되돌리면 이미 배운 출력이 사라지므로 Pop-Art 가 하는 일이 아니다.
    - question: |
        Pop-Art 의 실제 출력은 $\sigma(W h + b) + \mu$ 다. 마지막 층에 들어오는 값 $h = 2$, $W = 1$, $b = 0$, $\sigma = 10$, $\mu = 0$ 에서 기준이 $\sigma = 20$, $\mu = 5$ 로 바뀌었다. 출력 20 을 지키는 새 $W$ 와 $b$ 는 무엇인가?
      choices:
        - '$W = 2$, $b = 5$'
        - '$W = 0.5$, $b = -0.25$'
        - '$W = 1$, $b = -5$'
        - '$W = 0.5$, $b = 0$'
      answer: 1
      explanation: |
        $W_{\text{new}} = 1 \times 10 / 20 = 0.5$, $b_{\text{new}} = (10 \times 0 + 0 - 5) / 20 = -0.25$ 이고, $20 \times (0.5 \times 2 - 0.25) + 5 = 20$
        이다. $W = 2$, $b = 5$ 면 출력이 $20 \times 9 + 5 = 185$ 가 되어 20 이 아니다. $W = 1$, $b = -5$ 면 출력이 $20 \times (-3) + 5 = -55$ 가
        되어 20 이 아니다. $W = 0.5$, $b = 0$ 이면 출력이 $20 \times 1 + 5 = 25$ 가 되어 20 이 아니다.

- topic: centering
  title: reward centering
  section: reward-centering
  variants:
    - question: |
        끝없이 이어지는 문제에서 reward centering 이 평균 reward 를 빼는 이유는 무엇인가?
      choices:
        - '가치에 들어 있는 큰 공통 항을 없애 state 사이의 차이를 나타내기 쉽게 하려고'
        - 'reward 의 부호를 모두 양수로 만들어 생존 보너스를 주려고'
        - 'reward 의 분산을 0 으로 만들어 critic 이 내는 TD 오차를 모두 없애려고'
        - 'discount 를 쓰지 않고 return 을 계산하려고'
      answer: 0
      explanation: |
        가치에는 평균 reward 를 $1 - \gamma$ 로 나눈 공통 항이 있고, $\gamma$ 가 1 에 가까우면 이 항이 커서 network 가 작은 차이를 나타내기
        어렵다. 평균을 빼면 이 항이 사라진다. 평균을 빼면 reward 가 모두 양수가 되는 것이 아니라 양수와 음수가 섞인다. 상수를 빼도 reward 의
        분산은 그대로라서 TD 오차가 없어지지 않는다. reward centering 은 discount 를 그대로 쓴다.
    - question: |
        평균 reward 가 1 이고 $\gamma = 0.99$ 인 끝없이 이어지는 문제에서, 모든 state 의 가치에 공통으로 들어가는 항은 대략 얼마인가?
      choices:
        - '1 로, 평균 reward 와 같다'
        - '0.99 로, discount 와 같다'
        - '100 으로, 평균 reward 를 0.01 로 나눈 값이다'
        - '0.01 로, 1 에서 discount 를 뺀 값이다'
      answer: 2
      explanation: |
        공통 항은 평균 reward $r(\pi)$ 를 $1 - \gamma$ 로 나눈 $1 / 0.01 = 100$ 이다. Naik 등의 예에서 $\gamma = 0.99$ 일 때 가치가 101.01, 98.99,
        99.99 로 100 근처에 모이는 것도 이 때문이다. 1 은 평균 reward 일 뿐 $1 - \gamma$ 로 나누기 전의 값이다. 0.99 는 discount factor 일 뿐
        공통 항이 아니다. 0.01 은 나누는 수 $1 - \gamma$ 일 뿐 공통 항이 아니다.
    - question: |
        reward centering 을 episode 가 끝나는 문제에 쓸 때 조심해야 하는 이유는 무엇인가?
      choices:
        - 'episode 문제에서는 평균 reward 를 계산할 수 없어서'
        - '평균을 빼면 생존 보너스나 penalty 가 바뀌어 문제 자체가 바뀔 수 있어서'
        - 'episode 문제에서는 가치에 공통 항이 없어서 효과가 정반대로 나타나 가치가 커지므로'
        - '평균을 빼면 discount 가 1 로 바뀌어 return 이 발산해서'
      answer: 1
      explanation: |
        episode 가 끝나면 더 받을 reward 가 없어서 상수를 빼는 것이 생존 보너스나 penalty 를 바꾼다. step 마다 −1 인 격자에서 평균을 빼면 모든
        reward 가 0 이 되어 모든 policy 가 똑같이 최적이 된다. episode 문제에서도 받은 reward 의 평균은 계산할 수 있다. episode 문제에서 효과가
        반대가 되어 가치가 커진다는 근거는 없다. 평균을 빼도 discount 는 바뀌지 않는다.
