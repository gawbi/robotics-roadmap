<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>안 의 Unicode 번호 50504 를 4096 짜리, 64 짜리, 1 짜리 묶음으로 나눠 236 · 149 · 136 세 byte 로 적는 계산</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="36" fill="#e2e8f0" font-size="16" text-anchor="start">50504 = 12 × 4096 + 21 × 64 + 8</text>
  <text x="115" y="76" fill="#94a3b8" font-size="13" text-anchor="middle">4096 짜리 묶음</text>
  <rect x="65" y="86" width="100" height="40" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="115.0" y="111.0" fill="#e2e8f0" font-size="18" text-anchor="middle">12</text>
  <line x1="115" y1="130" x2="115" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="125" y="150" fill="#f59e0b" font-size="13" text-anchor="start">+ 224</text>
  <rect x="65" y="164" width="100" height="44" rx="5" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115.0" y="191.0" fill="#f59e0b" font-size="20" text-anchor="middle">236</text>
  <text x="300" y="76" fill="#94a3b8" font-size="13" text-anchor="middle">64 짜리 묶음</text>
  <rect x="250" y="86" width="100" height="40" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300.0" y="111.0" fill="#e2e8f0" font-size="18" text-anchor="middle">21</text>
  <line x1="300" y1="130" x2="300" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="150" fill="#38bdf8" font-size="13" text-anchor="start">+ 128</text>
  <rect x="250" y="164" width="100" height="44" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="300.0" y="191.0" fill="#38bdf8" font-size="20" text-anchor="middle">149</text>
  <text x="485" y="76" fill="#94a3b8" font-size="13" text-anchor="middle">나머지</text>
  <rect x="435" y="86" width="100" height="40" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="485.0" y="111.0" fill="#e2e8f0" font-size="18" text-anchor="middle">8</text>
  <line x1="485" y1="130" x2="485" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="150" fill="#38bdf8" font-size="13" text-anchor="start">+ 128</text>
  <rect x="435" y="164" width="100" height="44" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485.0" y="191.0" fill="#38bdf8" font-size="20" text-anchor="middle">136</text>
  <text x="300" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">첫 byte 에는 224 를, 나머지 byte 에는 128 을 더한다 → 236 · 149 · 136</text>
</svg>
