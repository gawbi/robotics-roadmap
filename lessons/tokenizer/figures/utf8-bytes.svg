<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>UTF-8 은 글자 하나를 byte 1~4개로 적는다. 첫 byte 의 크기를 보면 그 글자가 byte 몇 개짜리인지 알 수 있다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="308" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="66.0" y="40" fill="#e2e8f0" font-size="22" text-anchor="middle">h</text>
  <text x="66.0" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Unicode 번호 104</text>
  <rect x="40" y="76" width="52" height="40" rx="5" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="66.0" y="101.0" fill="#f59e0b" font-size="16" text-anchor="middle">104</text>
  <text x="66.0" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">byte 1개</text>
  <text x="210.0" y="40" fill="#e2e8f0" font-size="22" text-anchor="middle">안</text>
  <text x="210.0" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Unicode 번호 50504</text>
  <rect x="126" y="76" width="52" height="40" rx="5" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="152.0" y="101.0" fill="#f59e0b" font-size="16" text-anchor="middle">236</text>
  <rect x="184" y="76" width="52" height="40" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="210.0" y="101.0" fill="#38bdf8" font-size="16" text-anchor="middle">149</text>
  <rect x="242" y="76" width="52" height="40" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="268.0" y="101.0" fill="#38bdf8" font-size="16" text-anchor="middle">136</text>
  <text x="210.0" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">byte 3개</text>
  <text x="441.0" y="40" fill="#e2e8f0" font-size="22" text-anchor="middle">🙂</text>
  <text x="441.0" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Unicode 번호 128578</text>
  <rect x="328" y="76" width="52" height="40" rx="5" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="354.0" y="101.0" fill="#f59e0b" font-size="16" text-anchor="middle">240</text>
  <rect x="386" y="76" width="52" height="40" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="412.0" y="101.0" fill="#38bdf8" font-size="16" text-anchor="middle">159</text>
  <rect x="444" y="76" width="52" height="40" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="470.0" y="101.0" fill="#38bdf8" font-size="16" text-anchor="middle">153</text>
  <rect x="502" y="76" width="52" height="40" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="528.0" y="101.0" fill="#38bdf8" font-size="16" text-anchor="middle">130</text>
  <text x="441.0" y="140" fill="#e2e8f0" font-size="13" text-anchor="middle">byte 4개</text>
  <text x="24" y="182" fill="#94a3b8" font-size="13" text-anchor="start">첫 byte 를 보고 글자의 길이를 안다</text>
  <rect x="24" y="197" width="12" height="12" rx="2" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="46" y="208" fill="#f59e0b" font-size="13" text-anchor="start">0 ~ 127</text>
  <text x="150" y="208" fill="#e2e8f0" font-size="13" text-anchor="start">혼자서 글자 하나 (영어 글자·숫자·공백)</text>
  <rect x="24" y="221" width="12" height="12" rx="2" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="46" y="232" fill="#f59e0b" font-size="13" text-anchor="start">224 ~ 239</text>
  <text x="150" y="232" fill="#e2e8f0" font-size="13" text-anchor="start">byte 3개짜리 글자의 첫 byte (한글 등)</text>
  <rect x="24" y="245" width="12" height="12" rx="2" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="46" y="256" fill="#f59e0b" font-size="13" text-anchor="start">240 ~ 247</text>
  <text x="150" y="256" fill="#e2e8f0" font-size="13" text-anchor="start">byte 4개짜리 글자의 첫 byte (emoji 등)</text>
  <rect x="24" y="269" width="12" height="12" rx="2" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="280" fill="#38bdf8" font-size="13" text-anchor="start">128 ~ 191</text>
  <text x="150" y="280" fill="#e2e8f0" font-size="13" text-anchor="start">앞 글자에 이어지는 byte</text>
</svg>
