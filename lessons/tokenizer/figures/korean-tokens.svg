<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 뜻의 영어·한국어 문장이 tokenizer 마다 쓰는 token 수. Pick up the red cup. 은 GPT-2, GPT-4, GPT-4o 의 tokenizer 모두에서 6 개이고, 빨간 컵을 집어. 는 18, 11, 9 개다. 고양이가 모자를 썼다. 는 26, 13, 9 개다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#94a3b8" font-size="13" text-anchor="start">token 수 (tiktoken 으로 직접 센 값)</text>
  <text x="330.0" y="60.0" fill="#e2e8f0" font-size="13" text-anchor="middle">GPT-2</text>
  <text x="330.0" y="77.0" fill="#94a3b8" font-size="11" text-anchor="middle">vocabulary 50,257</text>
  <text x="430.0" y="60.0" fill="#e2e8f0" font-size="13" text-anchor="middle">GPT-4</text>
  <text x="430.0" y="77.0" fill="#94a3b8" font-size="11" text-anchor="middle">vocabulary 약 10만</text>
  <text x="530.0" y="60.0" fill="#e2e8f0" font-size="13" text-anchor="middle">GPT-4o</text>
  <text x="530.0" y="77.0" fill="#94a3b8" font-size="11" text-anchor="middle">vocabulary 약 20만</text>
  <text x="24.0" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="start">Pick up the red cup.</text>
  <text x="24.0" y="134.0" fill="#94a3b8" font-size="11" text-anchor="start">UTF-8 20 byte</text>
  <rect x="300.0" y="104.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="319.4" y="119.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <rect x="400.0" y="104.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="419.4" y="119.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <rect x="500.0" y="104.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="519.4" y="119.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <text x="24.0" y="168.0" fill="#e2e8f0" font-size="13" text-anchor="start">빨간 컵을 집어.</text>
  <text x="24.0" y="186.0" fill="#94a3b8" font-size="11" text-anchor="start">UTF-8 21 byte</text>
  <rect x="300.0" y="156.0" width="40.2" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="346.2" y="171.0" fill="#f59e0b" font-size="13" text-anchor="start">18</text>
  <rect x="400.0" y="156.0" width="24.5" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430.5" y="171.0" fill="#f59e0b" font-size="13" text-anchor="start">11</text>
  <rect x="500.0" y="156.0" width="20.1" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="526.1" y="171.0" fill="#f59e0b" font-size="13" text-anchor="start">9</text>
  <text x="24.0" y="234.0" fill="#e2e8f0" font-size="13" text-anchor="start">The cat wore a hat.</text>
  <text x="24.0" y="252.0" fill="#94a3b8" font-size="11" text-anchor="start">UTF-8 19 byte</text>
  <rect x="300.0" y="222.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="319.4" y="237.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <rect x="400.0" y="222.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="419.4" y="237.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <rect x="500.0" y="222.0" width="13.4" height="20.0" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="519.4" y="237.0" fill="#38bdf8" font-size="13" text-anchor="start">6</text>
  <text x="24.0" y="286.0" fill="#e2e8f0" font-size="13" text-anchor="start">고양이가 모자를 썼다.</text>
  <text x="24.0" y="304.0" fill="#94a3b8" font-size="11" text-anchor="start">UTF-8 30 byte</text>
  <rect x="300.0" y="274.0" width="58.0" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="364.0" y="289.0" fill="#f59e0b" font-size="13" text-anchor="start">26</text>
  <rect x="400.0" y="274.0" width="29.0" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="435.0" y="289.0" fill="#f59e0b" font-size="13" text-anchor="start">13</text>
  <rect x="500.0" y="274.0" width="20.1" height="20.0" rx="4" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="526.1" y="289.0" fill="#f59e0b" font-size="13" text-anchor="start">9</text>
  <line x1="24.0" y1="202.0" x2="576.0" y2="202.0" stroke="#1e293b" stroke-width="1"/>
  <text x="24.0" y="334.0" fill="#94a3b8" font-size="12" text-anchor="start">한글은 한 글자가 3 byte 이고, 한국어 byte 쌍을 merge 로 많이 배운 tokenizer 일수록 token 이 준다</text>
</svg>
