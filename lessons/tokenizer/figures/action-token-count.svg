  <text x="166.3" y="109.0" fill="#34d399" font-size="12" text-anchor="start">20</text>
  <text x="24.0" y="144.0" fill="#e2e8f0" font-size="13" text-anchor="start">DROID</text>
  <text x="24.0" y="161.0" fill="#94a3b8" font-size="11" text-anchor="start">7 차원 · 15 Hz</text>
  <rect x="150.0" y="130.0" width="54.0" height="16.0" rx="3" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210.0" y="143.0" fill="#f59e0b" font-size="12" text-anchor="start">105</text>
