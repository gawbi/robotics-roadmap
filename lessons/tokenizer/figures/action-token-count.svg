  <text x="350.0" y="53.0" fill="#94a3b8" font-size="12" text-anchor="start">FAST</text>
  <text x="24.0" y="90.0" fill="#e2e8f0" font-size="13" text-anchor="start">BridgeV2</text>
  <text x="24.0" y="107.0" fill="#94a3b8" font-size="11" text-anchor="start">7 차원 · 5 Hz</text>
  <rect x="150.0" y="76.0" width="18.0" height="16.0" rx="3" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
