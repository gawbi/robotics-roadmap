  <rect x="150.0" y="184.0" width="72.0" height="16.0" rx="3" fill="#2a1f0b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="228.0" y="197.0" fill="#f59e0b" font-size="12" text-anchor="start">140</text>
  <rect x="150.0" y="204.0" width="14.4" height="16.0" rx="3" fill="#0f2a22" stroke="#34d399" stroke-width="1.5"/>
