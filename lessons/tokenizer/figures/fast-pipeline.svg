  <text x="560.0" y="129.0" fill="#64748b" font-size="13" text-anchor="middle">0</text>
  <text x="514.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="middle">정수 8 개 중 6 개가 0</text>
  <line x1="24.0" y1="256.0" x2="576.0" y2="256.0" stroke="#1e293b" stroke-width="1"/>
  <text x="24.0" y="282.0" fill="#a78bfa" font-size="13" text-anchor="start">④ BPE: 정수를 기호로 보고, 자주 붙어 나오는 묶음을 token 하나로 합친다</text>
