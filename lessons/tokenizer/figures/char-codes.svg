  <text x="90.0" y="79.0" fill="#e2e8f0" font-size="20" text-anchor="middle">c</text>
  <line x1="90" y1="100" x2="90" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="138" width="60" height="44" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90.0" y="165.0" fill="#38bdf8" font-size="18" text-anchor="middle">99</text>
  <rect x="150" y="52" width="60" height="44" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="180.0" y="79.0" fill="#e2e8f0" font-size="20" text-anchor="middle">a</text>
  <line x1="180" y1="100" x2="180" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="138" width="60" height="44" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="180.0" y="165.0" fill="#38bdf8" font-size="18" text-anchor="middle">97</text>
