  <text x="550" y="162" fill="#38bdf8" font-size="15" text-anchor="end">104</text>
  <line x1="380" y1="172" x2="560" y2="172" stroke="#1e293b" stroke-width="1"/>
  <text x="390" y="192" fill="#e2e8f0" font-size="15" text-anchor="start">t</text>
  <text x="550" y="192" fill="#38bdf8" font-size="15" text-anchor="end">116</text>
  <line x1="380" y1="202" x2="560" y2="202" stroke="#1e293b" stroke-width="1"/>
  <text x="390" y="222" fill="#e2e8f0" font-size="15" text-anchor="start">␣ (공백)</text>
