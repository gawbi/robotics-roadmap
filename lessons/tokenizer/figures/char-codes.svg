  <text x="270.0" y="79.0" fill="#e2e8f0" font-size="20" text-anchor="middle">t</text>
  <line x1="270" y1="100" x2="270" y2="134" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="138" width="60" height="44" rx="5" fill="#0f2a3d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="270.0" y="165.0" fill="#38bdf8" font-size="18" text-anchor="middle">116</text>
  <text x="150" y="212" fill="#e2e8f0" font-size="13" text-anchor="middle">&quot;cat&quot; 은 숫자 셋 99 · 97 · 116 으로 저장된다</text>
  <text x="370" y="36" fill="#94a3b8" font-size="14" text-anchor="start">문자 코드 표의 일부</text>
  <rect x="370" y="48" width="200" height="186" rx="8" fill="#111a2e" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="72" fill="#e2e8f0" font-size="15" text-anchor="start">A</text>
  <text x="550" y="72" fill="#38bdf8" font-size="15" text-anchor="end">65</text>
