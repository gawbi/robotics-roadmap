<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>encode 의 세 단계: special token 분리, GPT-2 정규식으로 조각내기, 조각마다 byte 에 merge 를 적용해 id 로 바꾸기</title>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="24" y="48" fill="#e2e8f0" font-size="14">입력 text</text>
  <rect x="196" y="28" width="254" height="30" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="323.0" y="48" fill="#e2e8f0" font-size="14" text-anchor="middle">Hello world&#x27;s&lt;|endoftext|&gt;</text>
  <line x1="90" y1="60" x2="90" y2="82" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24" y="114" fill="#e2e8f0" font-size="14">① special token 분리</text>
  <rect x="196" y="94" width="137" height="30" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="264.5" y="114" fill="#e2e8f0" font-size="14" text-anchor="middle">Hello world&#x27;s</text>
  <rect x="341" y="94" width="137" height="30" rx="6" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="409.5" y="114" fill="#d6aa62" font-size="14" text-anchor="middle">&lt;|endoftext|&gt;</text>
  <line x1="90" y1="126" x2="90" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24" y="180" fill="#e2e8f0" font-size="14">② GPT-2 정규식 조각</text>
  <rect x="196" y="160" width="65" height="30" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="228.5" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">Hello</text>
  <rect x="269" y="160" width="74" height="30" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="306.0" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">␣world</text>
  <rect x="351" y="160" width="44" height="30" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="373.0" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">&#x27;s</text>
  <rect x="403" y="160" width="137" height="30" rx="6" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="471.5" y="180" fill="#d6aa62" font-size="14" text-anchor="middle">&lt;|endoftext|&gt;</text>
  <line x1="90" y1="192" x2="90" y2="214" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="24" y="246" fill="#e2e8f0" font-size="14">③ 조각마다 byte → merge</text>
  <rect x="196" y="226" width="65" height="30" rx="6" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="228.5" y="246" fill="#7cb4d8" font-size="14" text-anchor="middle">15496</text>
  <rect x="269" y="226" width="47" height="30" rx="6" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="292.5" y="246" fill="#7cb4d8" font-size="14" text-anchor="middle">995</text>
  <rect x="324" y="226" width="47" height="30" rx="6" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="347.5" y="246" fill="#7cb4d8" font-size="14" text-anchor="middle">338</text>
  <rect x="379" y="226" width="65" height="30" rx="6" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="411.5" y="246" fill="#d6aa62" font-size="14" text-anchor="middle">50256</text>
  <text x="24" y="300" fill="#94a3b8" font-size="13">special token 은 정규식과 merge 를 거치지 않고 id 하나(50256)가 된다. 숫자는 tiktoken gpt2 의 id 다.</text>
</svg>
