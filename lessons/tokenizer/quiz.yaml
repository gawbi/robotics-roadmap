# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: utf8-bytes
  title: 글자를 byte 로 적는 UTF-8
  variants:
    - question: |
        byte 하나는 0 부터 255 까지의 값만 나타낼 수 있다. 한글 글자를 byte 하나에 적을 수 없는 까닭은?
      choices:
        - '한글은 소리를 적는 글자라서 숫자로 바꿀 수 없기 때문에'
        - '세상의 글자가 256 가지보다 훨씬 많아서 번호가 255 를 넘는 글자가 있기 때문에'
        - 'byte 는 영어 글자만 담도록 정해진 단위이기 때문에'
        - '한글은 받침이 있어서 글자마다 번호가 두 개씩 필요하기 때문에'
      answer: 1
      explanation: |
        한글 글자만 1만 개가 넘고 한자·emoji 까지 합치면 글자의 종류가 256 가지를 훌쩍 넘는다. 그래서 Unicode 는 255 보다 큰
        번호를 쓰고, UTF-8 이 그 번호를 byte 여러 개에 나눠 적는다. 한글도 번호로 바꿀 수 있고, byte 는 영어 전용 단위가
        아니며, 받침 때문에 번호가 두 개 붙는 것도 아니다.
    - question: |
        UTF-8 은 글자에 따라 byte 를 1 ~ 4 개씩 다르게 쓴다. 글자 사이에 따로 구분 표시가 없는데도 byte 열에서 글자의 경계를
        알 수 있는 까닭은?
      choices:
        - '글자와 글자 사이에 값이 0 인 byte 를 끼워 넣기 때문에'
        - '모든 글자를 사실은 똑같이 3 byte 로 적기 때문에'
        - '글자의 경계 위치를 파일 끝에 따로 저장해 두기 때문에'
        - '첫 byte 의 값 범위만 보면 그 글자가 byte 몇 개짜리인지 알 수 있기 때문에'
      answer: 3
      explanation: |
        UTF-8 은 첫 byte 의 값 범위로 글자의 길이를 알린다. 0 ~ 127 이면 혼자 한 글자, 224 ~ 239 면 3 byte 글자의 시작이고,
        128 ~ 191 은 이어지는 byte 에만 쓴다. 구분용 0 byte 나 따로 적은 경계 목록은 없고, 영어 글자는 1 byte, 한글은
        3 byte 처럼 글자마다 길이가 다르다.
    - question: |
        글자 수가 같은 영어 문장과 한국어 문장을 UTF-8 로 바꾸면 byte 수는 어떻게 다를까?
      choices:
        - '한국어 쪽이 더 많다. 영어 글자는 1 byte, 한글 글자는 3 byte 로 적기 때문이다'
        - '글자 수가 같으므로 byte 수도 같다'
        - '영어 쪽이 더 많다. 영어는 대문자·소문자를 따로 적기 때문이다'
        - '한국어는 UTF-8 로 적을 수 없어서 다른 문자 코드를 써야 한다'
      answer: 0
      explanation: |
        UTF-8 은 번호가 작은 영어 글자를 byte 하나에, 번호가 큰 한글을 byte 세 개에 적는다. 그래서 글자 수가 같아도 한국어
        text 의 byte 가 더 많다. 글자 수와 byte 수는 같지 않고, 대문자·소문자는 서로 다른 글자일 뿐 byte 를 더 쓰지 않으며,
        한글도 UTF-8 로 적는다.

- topic: token-vocab
  title: token, vocabulary, 자르는 단위
  variants:
    - question: |
        단어 하나를 token 하나로 쓰는 단어 단위 vocabulary 에 오타 "unbelievabel" 처럼 처음 보는 단어가 들어오면 어떤 문제가
        생길까?
      choices:
        - 'sequence 가 글자 단위보다 훨씬 길어진다'
        - 'vocabulary 가 저절로 작아진다'
        - '번호가 없어 `<unk>` 로 바뀌고, decode 해도 원래 단어를 되살릴 수 없다'
        - '그 단어의 글자를 하나씩 token 으로 바꿔 문제없이 처리한다'
      answer: 2
      explanation: |
        단어 단위 vocabulary 에 없는 단어는 token id 가 없어서 "모르는 단어" 를 뜻하는 `<unk>` 하나로 바뀐다. 서로 다른 모르는
        단어가 모두 같은 `<unk>` 가 되므로 원래 단어로 되돌릴 수 없다. sequence 가 길어지는 것은 글자 단위의 약점이고, 단어
        단위는 vocabulary 가 오히려 커지며, 글자로 쪼개 처리하는 것은 byte·subword 방식의 장점이다.
    - question: |
        text 를 자르는 단위를 글자 → subword → 단어 순서로 키우면 vocabulary 크기와 sequence 길이는 어떻게 변할까?
      choices:
        - '둘 다 커진다'
        - 'vocabulary 는 커지고 sequence 는 짧아진다'
        - '둘 다 작아진다'
        - 'vocabulary 는 작아지고 sequence 는 길어진다'
      answer: 1
      explanation: |
        조각이 클수록 한 token 에 더 많은 글자가 담겨 같은 text 가 적은 token 으로 잘리므로 sequence 가 짧아진다. 대신 큰
        조각의 종류가 훨씬 많아 vocabulary 는 커진다. 두 값은 반대로 움직이므로 함께 커지거나 함께 작아지지 않고, 마지막
        보기는 단위를 작게 할 때의 변화다.
    - question: |
        BPE tokenizer 가 byte 256 개를 처음 vocabulary 로 넣어 두고 시작하는 까닭은?
      choices:
        - '그러면 어떤 text 든 sequence 가 가장 짧아지기 때문에'
        - '그러면 한글 한 글자가 언제나 token 하나가 되기 때문에'
        - '그러면 tokenizer 에 학습할 parameter 가 하나도 필요 없기 때문에'
        - '어떤 text 든 byte 열로 바꿀 수 있어서, 처음 보는 글자도 byte token 으로 encode 되어 `<unk>` 가 생기지 않기 때문에'
      answer: 3
      explanation: |
        모든 text 는 UTF-8 로 바꾸면 0 ~ 255 사이의 byte 열이 되므로, 최악의 경우에도 byte 하나하나가 token 이 될 뿐 encode 에
        실패하지 않는다. byte 단위는 오히려 sequence 가 길어지고, 한글은 3 byte 라서 합쳐지지 않으면 token 3 개가 된다. merge
        목록은 데이터에서 배워야 하므로 학습이 필요 없는 것도 아니다.

- topic: token-meanings
  title: 문맥에 따른 token 의 뜻
  variants:
    - question: |
        이미지를 작은 조각(patch)으로 잘라 만든 image patch token 이 text token 과 다른 점은?
      choices:
        - 'vocabulary 번호가 없고, 조각 안 pixel 의 숫자들을 묶은 vector 가 그대로 모델에 들어간다'
        - 'image patch token 도 vocabulary 의 정수 번호 하나로 나타낸다'
        - 'pixel 하나가 token 하나다'
        - 'text token 은 숫자 묶음이고 image patch token 은 정수 번호다'
      answer: 0
      explanation: |
        image patch token 은 조각 안 pixel 의 밝기 숫자들을 한 줄로 묶은 vector 이고, 번호를 붙일 vocabulary 가 없다. text
        token 은 반대로 vocabulary 안의 정수 번호 하나다. token 하나는 pixel 하나가 아니라 여러 pixel 을 담은 조각이고, 마지막
        보기는 두 쪽을 거꾸로 적었다.
    - question: |
        로봇 팔의 움직임을 내는 모델에서 말하는 action token 은 무엇인가?
      choices:
        - '움직임을 "왼쪽으로" 같은 영어 단어로 적어 자른 text token'
        - '로봇 카메라 영상을 잘라 만든 조각'
        - '움직임 같은 연속된 값의 범위를 칸(bin)으로 나누고, 칸 번호를 vocabulary 의 token 번호에 짝지은 것'
        - '움직임 값을 실수 그대로 모델에 넣는 것'
      answer: 2
      explanation: |
        "집게를 3.4 cm 벌린다" 같은 연속 값은 번호가 없으므로, 범위를 칸으로 나눠 칸 번호를 정하고 그 번호를 vocabulary 의
        token 하나에 짝짓는다. 그러면 모델이 text 를 쓰듯 움직임을 token 으로 낸다. 단어로 적는 것도, 카메라 조각도, 실수를
        그대로 넣는 것도 action token 이 아니다.
    - question: |
        text token, image patch token, action token 에 대한 설명으로 옳은 것은?
      choices:
        - '셋 모두 vocabulary 의 정수 번호다'
        - '셋 모두 번호 없이 숫자 묶음으로 모델에 들어간다'
        - 'text token 만 모델이 한 번에 하나씩 받는 단위이고, 나머지 둘은 token 이라고 부르면 틀린 말이다'
        - 'text token 과 action token 은 vocabulary 의 정수 번호이고, image patch token 은 번호 없는 숫자 묶음이다'
      answer: 3
      explanation: |
        세 가지 모두 모델이 하나씩 받거나 내는 단위라서 token 이라고 부르지만, 어디서 왔는지와 번호가 있는지가 다르다. text
        token 은 text 조각의 번호, action token 은 움직임 칸 번호를 token 번호에 짝지은 것이라 둘 다 정수 번호다. image patch
        token 만 번호 없이 pixel 숫자 묶음 그대로 들어간다.

- topic: pair-count
  title: 쌍의 빈도와 merge 할 쌍의 선택
  variants:
    - question: |
        BPE 학습에서 이웃한 두 token 쌍 (a, b) 와 (b, a) 는 어떻게 세는가?
      choices:
        - '글자가 같으므로 한 쌍으로 합쳐 센다'
        - '순서가 다르면 다른 쌍이라서 따로 센다'
        - '알파벳 순서가 앞인 (a, b) 만 센다'
        - '같은 글자가 두 번 나온 쌍이 아니면 세지 않는다'
      answer: 1
      explanation: |
        (a, b) 는 a 다음에 b 가 오는 것이고 (b, a) 는 b 다음에 a 가 오는 것이라서 다른 쌍이다. merge 결과도 ab 와 ba 로 서로
        다른 token 이 된다. 그래서 순서를 무시하고 합치거나, 한쪽만 세거나, 같은 글자 쌍만 세지 않는다.
    - question: |
        BPE 학습 중 빈도가 가장 큰 쌍이 똑같은 빈도로 둘 나왔다. 어떻게 해야 할까?
      choices:
        - '두 쌍을 한 번에 모두 merge 한다'
        - '그 회차에서 학습을 멈춘다'
        - '"먼저 나온 쌍을 고른다" 처럼 미리 정해 둔 규칙으로 하나를 고른다'
        - '그때그때 무작위로 하나를 고른다'
      answer: 2
      explanation: |
        같은 corpus 로 학습하면 언제나 같은 merge 목록이 나와야 하므로, 빈도가 같을 때 고르는 규칙을 미리 하나로 정해 둔다.
        무작위로 고르면 학습할 때마다 결과가 달라진다. merge 는 한 회차에 쌍 하나씩이라 두 쌍을 함께 합치지 않고, 빈도가
        같다고 학습을 멈출 까닭도 없다.
    - question: |
        BPE 가 매 회차 빈도가 가장 큰 쌍부터 merge 하는 까닭은?
      choices:
        - '자주 붙어 나오는 묶음을 token 하나로 만들어야 sequence 가 가장 많이 짧아지고, 자주 쓰는 묶음이 먼저 token 이 되기 때문에'
        - '드물게 나오는 쌍을 남겨 두어야 `<unk>` 가 줄어들기 때문에'
        - '빈도가 큰 쌍은 뜻이 없는 조합이라 하나로 묶어 지우려고'
        - '빈도가 큰 쌍일수록 알파벳 순서가 앞서기 때문에'
      answer: 0
      explanation: |
        빈도가 큰 쌍을 합치면 바뀌는 자리가 많아서 sequence 가 가장 많이 줄고, 자주 쓰는 글자 묶음이 차례로 token 이 된다.
        byte 에서 시작하는 BPE 는 원래 `<unk>` 가 없으므로 드문 쌍과 관계없고, merge 는 쌍을 지우지 않고 새 token 으로 바꾼다.
        빈도와 알파벳 순서는 아무 관계가 없다.

- topic: merge-step
  title: merge 와 vocabulary·sequence 의 변화
  variants:
    - question: |
        BPE 에서 merge 를 한 번 하면 vocabulary 와 sequence 는 어떻게 바뀌는가?
      choices:
        - 'vocabulary 는 줄고 sequence 는 길어진다'
        - 'vocabulary 는 그대로이고 sequence 만 짧아진다'
        - 'vocabulary 는 그 쌍이 바뀐 자리 수만큼 늘어난다'
        - 'vocabulary 는 token 하나가 늘고, sequence 는 그 쌍이 바뀐 자리 수만큼 짧아진다'
      answer: 3
      explanation: |
        merge 한 번은 새 token 하나에 새 id 를 붙이므로 vocabulary 가 정확히 하나 는다. 그리고 sequence 에서 그 쌍이 나오는
        자리마다 token 두 개가 하나로 바뀌어 그 자리 수만큼 짧아진다. 새 token 은 자리 수와 관계없이 하나뿐이고, vocabulary 는
        줄거나 그대로 있지 않는다.
    - question: |
        sequence "a a a" 에서 쌍 (a, a) 의 빈도는 2 다. 그런데 (a, a) 를 왼쪽부터 merge 하면 token 이 하나만 줄어든다. 까닭은?
      choices:
        - '빈도를 잘못 센 것이고, 실제 빈도는 1 이다'
        - '가운데 a 가 두 쌍에 함께 세어졌지만 한 번만 합쳐질 수 있어서, 실제로 바뀌는 자리가 하나뿐이기 때문에'
        - 'merge 는 빈도와 관계없이 언제나 token 을 하나만 줄이기 때문에'
        - '같은 글자끼리의 쌍은 merge 할 수 없어서 다른 쌍이 대신 합쳐지기 때문에'
      answer: 1
      explanation: |
        이웃한 자리가 두 군데라서 빈도는 2 가 맞다. 하지만 앞의 a a 를 합치면 가운데 a 가 이미 쓰여서 남은 a 하나는 짝이 없다.
        그래서 줄어드는 token 수는 빈도가 아니라 실제로 바뀐 자리 수다. 같은 글자가 이어지지 않는 경우에는 빈도만큼 줄어들고,
        같은 글자 쌍도 merge 할 수 있다.
    - question: |
        BPE 학습에서 merge 를 몇 번 할지는 무엇으로 정하는가?
      choices:
        - '모든 쌍의 빈도가 1 이 될 때까지 반드시 되풀이한다'
        - 'corpus 전체가 token 하나가 될 때까지 되풀이한다'
        - '원하는 vocabulary 크기로 정한다. merge 한 번마다 token 이 하나씩 늘기 때문이다'
        - 'loss 가 0 이 될 때까지 되풀이한다'
      answer: 2
      explanation: |
        merge 한 번에 vocabulary 가 하나씩 늘므로, 원하는 vocabulary 크기에서 처음 byte 256 개(와 special token)를 뺀 만큼
        merge 한다. 정해진 기준 없이 끝까지 되풀이하면 vocabulary 가 한없이 커지거나 corpus 를 통째로 외운 token 이 생긴다.
        BPE 학습은 쌍을 세는 일이라 loss 를 줄이는 과정이 아니다.

- topic: encode-decode
  title: 배운 merge 로 하는 encode·decode
  variants:
    - question: |
        새 text 를 encode 할 때 merge 를 학습에서 배운 순서대로 적용해야 하는 까닭은?
      choices:
        - '뒤에 배운 merge 는 앞의 merge 가 만든 token 을 재료로 쓰므로, 순서를 바꾸면 재료가 없어 적용되지 않고 결과가 달라지기 때문에'
        - '순서는 결과와 관계없고 계산 속도만 달라지기 때문에'
        - 'encode 할 text 에서 쌍의 빈도를 새로 세어 그 순서로 적용해야 하기 때문에'
        - '배운 순서를 지키지 않으면 decode 할 때 글자가 뒤집혀 나오기 때문에'
      answer: 0
      explanation: |
        예를 들어 "at" 를 만든 merge 다음에 "cat" 을 만든 merge 가 있다면, "at" 가 먼저 생겨야 "cat" merge 를 적용할 수 있다.
        순서를 뒤집으면 적용되지 않는 merge 가 생겨 token 이 달라진다. encode 는 새 text 에서 빈도를 다시 세지 않고 학습 때의
        순서를 그대로 쓰며, 순서는 결과 자체를 바꾸지 글자를 뒤집지는 않는다.
    - question: |
        byte 에서 시작하는 BPE tokenizer 로, 학습 corpus 에 한 번도 없던 글자가 든 문장을 encode 하면?
      choices:
        - '그 글자는 `<unk>` token 하나로 바뀐다'
        - 'encode 가 오류를 내고 멈춘다'
        - '그 글자의 byte 는 합칠 merge 가 없어 byte token 그대로 남고, encode 는 정상으로 끝난다'
        - '그 글자는 버려지고 나머지 글자만 encode 된다'
      answer: 2
      explanation: |
        모든 글자는 UTF-8 byte 로 바뀌고 byte 256 개는 처음부터 vocabulary 에 있다. 그 byte 들을 합칠 merge 가 없으면 byte
        하나하나가 token 으로 남을 뿐이다. 그래서 `<unk>` 도, 오류도, 글자를 버리는 일도 없고 decode 하면 원래 글자가 그대로
        돌아온다.
    - question: |
        language model 이 한글 문장을 token 하나씩 만들어 내는 도중, token 을 하나만 decode 해 화면에 띄우면 잠깐 � 가 보이는
        일이 있다. 까닭은?
      choices:
        - 'tokenizer 에 버그가 있어서'
        - '모델이 틀린 token 을 냈기 때문에'
        - '한글은 decode 할 수 없어서 � 로 대신 보여 주기 때문에'
        - 'byte 단위 BPE 는 한 글자의 byte 가운데 일부만 담은 token 을 만들 수 있어서, 그 token 만으로는 UTF-8 글자가 완성되지 않기 때문에'
      answer: 3
      explanation: |
        한글 한 글자는 3 byte 인데, BPE 가 그중 앞의 두 byte 만 합친 token 을 만들 수 있다. 그 token 만 decode 하면 글자가
        끝나지 않아 � 로 보이고, 나머지 byte 를 담은 다음 token 이 나오면 글자가 제대로 완성된다. 버그나 잘못 고른 token 이
        아니고, 한글도 정상으로 decode 된다.

- topic: pretokenization
  title: pre-tokenization 과 special token
  variants:
    - question: |
        pre-tokenization 없이 BPE 를 학습하면 어떤 문제가 생길까?
      choices:
        - '한글이 든 text 를 encode 할 수 없게 된다'
        - '"dog." "dog!" "dog?" 처럼 단어와 뒤의 문장부호·공백이 묶인 token 이 따로따로 생겨 vocabulary 를 낭비한다'
        - 'merge 가 한 번도 일어나지 않는다'
        - 'decode 결과가 원래 text 와 달라진다'
      answer: 1
      explanation: |
        merge 가 단어 경계를 넘을 수 있으면 같은 dog 가 뒤에 붙는 문장부호마다 다른 token 이 되어, 뜻이 같은데도 vocabulary
        자리를 여러 칸 쓰고 모델은 매번 다른 token 을 본다. pre-tokenization 이 없어도 byte 단위 encode 는 되고, merge 도
        일어나며, decode 도 원래 text 로 정확히 돌아온다.
    - question: |
        pre-tokenization 으로 text 를 단어·숫자·기호 조각으로 먼저 나눈 뒤 BPE 를 학습하면, 쌍의 빈도는 어디서 세는가?
      choices:
        - '조각 안에서만 세고, 조각 경계에 걸친 쌍은 세지 않는다'
        - '조각과 관계없이 text 전체에서 센다'
        - '조각과 조각 사이에 걸친 쌍만 센다'
        - '조각마다 vocabulary 를 따로 만들어 따로 센다'
      answer: 0
      explanation: |
        pre-tokenization 의 목적이 merge 가 조각 경계를 넘지 못하게 하는 것이므로, 쌍은 조각 안에서만 센다. text 전체에서
        세면 경계를 넘는 merge 가 다시 생기고, 경계에 걸친 쌍만 세면 단어 안의 묶음을 배우지 못한다. vocabulary 는 조각과
        관계없이 하나다.
    - question: |
        `<|endoftext|>` 같은 special token 을 encode 할 때, pre-tokenization 보다 먼저 text 에서 떼어 내는 까닭은?
      choices:
        - 'special token 도 merge 로 배워야 해서 따로 모아 두려고'
        - '문서 끝 표시는 모델에 필요 없어서 지우려고'
        - '글자 수가 많아 계산이 오래 걸리기 때문에'
        - '보통 text 처럼 다루면 `<|`, endoftext, `|>` 같은 여러 조각으로 잘려 버리므로, 미리 떼어 정해 둔 id 하나로 바꾸려고'
      answer: 3
      explanation: |
        special token 은 text 에서 배우지 않고 미리 정해 vocabulary 에 넣어 둔 token 이다. pre-tokenization 규칙은 기호와 글자를
        다른 조각으로 나누므로, 먼저 떼어 내지 않으면 하나의 표시가 여러 token 으로 흩어진다. merge 로 배우는 token 이 아니고,
        지우는 것도 아니며, 계산 시간과도 관계없다.

- topic: vocab-compression
  title: vocabulary 크기와 압축률
  variants:
    - question: |
        vocabulary 를 키우면 sequence 가 짧아지는데도, vocabulary 크기를 무조건 크게 잡지 않는 까닭은?
      choices:
        - 'vocabulary 를 키울수록 sequence 가 오히려 길어지기 때문에'
        - 'vocabulary 가 크면 처음 보는 글자를 encode 할 수 없기 때문에'
        - '모델이 구분해야 할 token 종류가 늘고, 드물게 나오는 token 은 학습할 예가 적어지기 때문에'
        - 'vocabulary 는 256 을 넘을 수 없기 때문에'
      answer: 2
      explanation: |
        merge 를 늘리면 긴 token 이 생겨 sequence 는 짧아지지만, token 종류가 많아지고 드문 token 은 학습 데이터에서 볼 기회가
        적다. 그래서 vocabulary 크기는 sequence 길이와 맞바꿔 정하는 값이다. vocabulary 를 키워도 sequence 는 길어지지 않고,
        byte 에서 시작하므로 encode 도 언제나 되며, 256 은 시작 크기일 뿐 상한이 아니다.
    - question: |
        영어 text 로 주로 학습한 tokenizer 에서, 같은 뜻의 한국어 문장이 영어 문장보다 token 을 훨씬 많이 쓰는 까닭은?
      choices:
        - '한국어는 문법상 단어 수가 영어보다 많기 때문에'
        - '한글 한 글자가 3 byte 인 데다, 학습 text 에 한국어가 적어 한국어 byte 쌍을 합친 merge 를 별로 배우지 못했기 때문에'
        - '한국어 글자는 모두 `<unk>` 로 바뀌기 때문에'
        - 'tokenizer 가 한글 byte 를 일부러 두 번씩 적기 때문에'
      answer: 1
      explanation: |
        merge 는 학습 text 에서 자주 나온 쌍으로 만들어지므로, 학습 text 에 적게 나온 언어의 byte 쌍은 merge 가 적다. 게다가
        한글은 시작부터 글자당 3 byte 라서, 합쳐지지 못한 byte 가 그대로 token 이 된다. 단어 수 때문이 아니고, byte BPE 에는
        `<unk>` 가 없으며, byte 를 두 번 적는 일도 없다.
    - question: |
        tokenizer 의 압축률(bytes per token, token 하나에 담기는 평균 byte 수)을 학습에 쓰지 않은 text 에서 재는 까닭은?
      choices:
        - 'merge 가 학습 text 에서 자주 나온 쌍으로 만들어져서, 학습 text 로 재면 실제보다 좋게 나오기 때문에'
        - '학습 text 로 재면 압축률이 언제나 정확히 1 이 되기 때문에'
        - '학습에 쓴 text 는 encode 할 수 없기 때문에'
        - '학습에 쓰지 않은 text 가 더 길어서 계산이 정확하기 때문에'
      answer: 0
      explanation: |
        merge 목록은 학습 text 에 맞춰져 있어서 그 text 에서는 유난히 잘 압축된다. 모델이 앞으로 볼 text 는 학습에 쓰지 않은
        text 이므로, 그런 text 에서 재야 실제 성능에 가깝다. 압축률 1 은 merge 를 하나도 쓰지 못할 때의 값이고, 학습 text 도
        encode 할 수 있으며, 길이가 까닭이 아니다.
