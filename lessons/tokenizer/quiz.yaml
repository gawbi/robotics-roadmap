# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: token-unit
  title: token 단위와 vocabulary·sequence
  variants:
    - question: |
        text 를 자르는 단위를 글자 → subword → 단어 순서로 키우면 vocabulary 크기와 sequence 길이는 어떻게 변하는가?
      choices:
        - '둘 다 커진다'
        - '둘 다 작아진다'
        - 'vocabulary 는 커지고 sequence 는 짧아진다'
        - 'vocabulary 는 작아지고 sequence 는 길어진다'
      answer: 2
      explanation: |
        sequence 길이는 문장 하나가 token 몇 개로 잘리는지이고, vocabulary 크기는 서로 다른 token 이 몇 종류인지다. 단위가 클수록
        조각 하나에 글자가 많이 들어가 sequence 는 짧아진다. 반면 영어 글자는 100 종류 안팎이지만 단어는 글자를 이어 붙인 조합이라
        수만 ~ 수십만 종류가 있어서 vocabulary 는 커진다. "둘 다 커진다" 가 틀린 것은 sequence 가 짧아지기 때문이다. "둘 다
        작아진다" 가 틀린 것은 vocabulary 가 커지기 때문이다. 마지막 보기는 단위를 거꾸로 작게 할 때의 변화다.
    - question: |
        단어 하나를 token 하나로 쓰는 단어 단위 vocabulary 에 오타처럼 처음 보는 단어가 들어오면 어떤 문제가 생기는가?
      choices:
        - '처음 보는 단어를 글자로 풀어 적느라, sequence 가 글자 단위보다 훨씬 길어진다'
        - '번호가 없어 `<unk>` 로 바뀌므로, 모르는 단어가 모두 같은 token 이 되어 되돌릴 수 없다'
        - 'vocabulary 에 그 단어가 자동으로 추가되어 새 번호를 받으므로, 다음부터는 문제없이 처리된다'
        - '그 단어만 글자 하나하나를 token 으로 바꿔 처리하므로, 정보를 잃지 않고 문제없이 encode 된다'
      answer: 1
      explanation: |
        vocabulary 는 학습 전에 만들어 고정하므로, 목록에 없는 단어는 token id 가 없어 "모르는 단어" 를 뜻하는 `<unk>` 로 바뀐다.
        모르는 단어가 모두 같은 `<unk>` 가 되니 원래 단어로 되돌릴 수 없다. sequence 가 길어지는 것은 단어 단위가 아니라 글자
        단위의 약점이다. vocabulary 는 쓰는 도중에 늘리지 않으므로 그 단어가 자동으로 추가되지도 않는다. 글자나 byte 로 쪼개
        처리하는 것은 단어 단위가 아니라 subword·byte 방식에서 하는 일이다.
    - question: |
        GPT-2 같은 tokenizer 가 글자도 단어도 아닌 subword 단위를 쓰는 이유는 무엇인가?
      choices:
        - 'subword 가 모든 언어에서 문법적인 형태소와 정확히 일치해서, 단어의 뜻을 조각별로 나눠 담을 수 있기 때문이다'
        - 'subword 를 쓰면 언어와 관계없이 vocabulary 크기가 언제나 256 으로 고정되어서, 모델의 embedding 표가 작아지기 때문이다'
        - 'subword 는 언어학자가 사전으로 미리 정해 두므로, tokenizer 를 따로 학습할 필요가 없기 때문이다'
        - '흔한 단어는 token 하나로 담고 드문 단어는 조각으로 나눠서, `<unk>` 없이 vocabulary 를 적당히 두기 때문이다'
      answer: 3
      explanation: |
        subword 를 쓰면 글자 단위의 긴 sequence 와 단어 단위의 거대한 vocabulary·`<unk>` 를 함께 피할 수 있다. 자주 나오는 단어는
        통째로 token 하나가 되고, 드문 단어나 오타는 조각 몇 개로 나뉜다. subword 경계는 데이터의 빈도로 정해지므로 형태소와 꼭
        맞지는 않는다. vocabulary 크기는 256 으로 고정되지 않고 정하기 나름이다(GPT-2 는 50,257). subword 는 사람이 사전으로
        정하지 않고 BPE 처럼 데이터에서 학습해 찾는다.

- topic: byte-level
  title: byte 에서 시작하는 vocabulary
  variants:
    - question: |
        GPT-2 의 BPE 가 Unicode 글자가 아니라 byte 256 개를 처음 vocabulary 로 쓰는 이유는 무엇인가?
      choices:
        - '어떤 text 든 UTF-8 byte 열로 바뀌므로, byte 256 개만으로 `<unk>` 없이 모든 글자를 encode 하기 때문이다'
        - 'byte 는 글자보다 단위가 작아서, byte 에서 시작하면 어떤 언어의 text 든 sequence 가 가장 짧아지기 때문이다'
        - 'byte 에서 시작하면 한글처럼 글자가 많은 언어도 한 글자가 언제나 token 하나가 되기 때문이다'
        - 'byte 256 개로 모든 text 를 적을 수 있으니, 그 위에 merge 를 따로 학습해 subword 를 만들 필요가 없기 때문이다'
      answer: 0
      explanation: |
        Unicode 글자를 출발점으로 삼으면 기본 vocabulary 만 13만 개가 넘는다. 모든 text 는 UTF-8 로 바꾸면 0 ~ 255 의 byte 열이 되므로
        256 개로 충분하고, 최악의 경우에도 byte 하나하나가 token 이 될 뿐이다. byte 에서 시작하면 sequence 는 오히려 길어진다.
        한글은 한 글자가 3 byte 라서 merge 되지 않으면 token 3 개가 된다. 쓸 만한 subword 를 얻으려면 merge 는 여전히 데이터에서
        학습해야 한다.
    - question: |
        language model 이 한국어 답을 token 하나씩 만들 때, token 마다 바로 decode 해 화면에 띄우면 잠깐 � 가 보이는 경우가 있다. 왜 그런가?
      choices:
        - 'tokenizer 가 한글 byte 를 저장할 때 순서를 잘못 적는 버그가 있어서, 일부 글자가 깨져 보이기 때문이다'
        - '모델이 가끔 vocabulary 에 없는 token 을 내서, decode 할 때 그 token 의 byte 를 찾지 못하기 때문이다'
        - '한글은 token 하나씩 decode 할 수 없어서, 문장이 끝날 때까지 글자 대신 � 를 보여 주기 때문이다'
        - 'byte BPE 는 한 글자의 3 byte 중 일부만 담은 token 을 만들 수 있어서, 그것만으로는 글자가 안 되기 때문이다'
      answer: 3
      explanation: |
        byte 단위 BPE 는 쌍을 byte 단위로 세기 때문에 한글 한 글자의 앞 두 byte 만 합친 token 이 생길 수 있다. 그 token 만 decode
        하면 3 byte 글자가 끝나지 않아 � 로 보이고, 나머지 byte 를 담은 다음 token 과 이어 붙이면 글자가 완성된다. tokenizer 의
        버그가 아니라 byte BPE 가 원래 그렇게 동작한다. 모델은 vocabulary 안의 token 만 내므로 vocabulary 밖의 token 이 나올 일은
        없다. 한글도 byte 를 모두 이어 붙이면 정상으로 decode 된다.
    - question: |
        글자 수가 같은 영어 문장과 한국어 문장을 UTF-8 로 바꾸면 byte 수는 어떻게 다른가?
      choices:
        - '글자 수가 같으므로 byte 수도 같다. UTF-8 은 글자마다 byte 를 같은 수만큼 쓰기 때문이다'
        - '한국어 쪽이 약 세 배 많다. 영어 글자는 1 byte, 한글 음절은 3 byte 로 적기 때문이다'
        - '영어 쪽이 더 많다. 영어는 대문자와 소문자를 구분하려고 글자마다 byte 를 더 쓰기 때문이다'
        - '비교할 수 없다. 한국어는 UTF-8 로 적을 수 없어 다른 문자 코드를 써야 하기 때문이다'
      answer: 1
      explanation: |
        UTF-8 은 번호가 작은 영어 글자를 byte 하나에 적고, Unicode 번호가 44032 ~ 55203 인 한글 음절은 byte 세 개에 적는다. 그래서
        글자 수가 같으면 한국어 text 의 byte 가 약 세 배다. 글자 수가 같아도 글자마다 byte 수가 달라서 byte 수는 같지 않다.
        대문자와 소문자는 서로 다른 글자일 뿐 byte 를 더 쓰지 않는다. 한글도 UTF-8 로 적을 수 있다.

- topic: bpe-merge
  title: BPE 학습과 merge
  variants:
    - question: |
        BPE 학습의 한 회차에서는 무엇을 하는가?
      choices:
        - '모든 token 을 알파벳 순서로 정렬해서, 맨 앞에 오는 두 token 을 새 token 하나로 합친다'
        - '빈도가 가장 작은 쌍을 찾아 지워서, vocabulary 를 원하는 크기가 될 때까지 줄여 나간다'
        - '이웃한 token 쌍의 빈도를 세고, 가장 많은 쌍을 새 token 으로 정해 그 쌍이 나오는 자리를 모두 바꾼다'
        - 'loss 가 줄어드는 방향으로, token 사이의 경계를 gradient descent 로 조금씩 옮긴다'
      answer: 2
      explanation: |
        BPE 는 쌍 세기 → 가장 많은 쌍 merge → 자리 바꾸기를 정한 횟수만큼 되풀이한다. 자주 붙어 나오는 쌍을 합쳐야 바뀌는 자리가
        많아 sequence 가 많이 줄고, 자주 쓰는 묶음이 먼저 token 이 된다. 쌍을 고르는 기준은 빈도라서 알파벳 순서와는 관계없다.
        가장 적은 쌍을 지우는 것이 아니라 가장 많은 쌍을 합치므로 vocabulary 는 줄지 않고 는다. BPE 학습은 빈도를 세는 일이라
        gradient descent 로 loss 를 줄이는 과정이 아니다.
    - question: |
        BPE 에서 merge 를 한 번 하면 vocabulary 와 sequence 는 각각 어떻게 바뀌는가?
      choices:
        - 'vocabulary 는 token 하나가 늘고, sequence 는 그 쌍이 바뀐 자리 수만큼 짧아진다'
        - 'vocabulary 는 그 쌍이 바뀐 자리 수만큼 새 token 이 늘고, sequence 길이는 그대로다'
        - 'vocabulary 는 그대로이고, 합쳐진 자리와 관계없이 sequence 만 token 하나만큼 짧아진다'
        - '두 token 이 하나로 합쳐지므로 vocabulary 는 줄고 sequence 는 길어진다'
      answer: 0
      explanation: |
        merge 한 번은 새 token 하나에 새 id 하나를 붙이므로 vocabulary 가 정확히 하나 는다. sequence 에서는 그 쌍이 나오는 자리마다
        token 두 개가 하나가 되어 바뀐 자리 수만큼 짧아진다. vocabulary 에 더해지는 새 token 은 바뀐 자리 수와 관계없이 하나뿐이고,
        자리가 바뀌는 만큼 sequence 도 짧아진다. vocabulary 는 merge 마다 반드시 하나 늘고, sequence 는 token 하나가 아니라 바뀐 자리
        수만큼 준다. merge 는 합치기만 하므로 vocabulary 가 줄거나 sequence 가 길어지는 일은 없다.
    - question: |
        byte 256 개에서 시작하고 special token 이 1 개인 BPE tokenizer 의 vocabulary 를 50,257 개로 만들려면 merge 를 몇 번 해야 하는가?
      choices:
        - '50,257 번'
        - '50,256 번'
        - '256 번'
        - '50,000 번'
      answer: 3
      explanation: |
        vocabulary 크기는 처음 byte 256 개 + merge 횟수 + special token 개수다. merge 한 번에 token 이 하나 늘기 때문에
        $50257 - 256 - 1 = 50000$ 번이고, GPT-2 가 이 구성이다. 50,257 번은 byte 256 개와 special token 몫을 빼지 않은 값이다.
        50,256 번은 special token 하나만 빼고 byte 256 개는 빼지 않은 값이다. 256 번은 처음 vocabulary 크기일 뿐 merge 횟수가
        아니다.

- topic: encode-decode
  title: 배운 merge 로 하는 encode·decode
  variants:
    - question: |
        학습한 BPE 로 새 text 를 encode 할 때 merge 를 학습에서 배운 순서대로 적용해야 하는 이유는 무엇인가?
      choices:
        - '뒤의 merge 는 앞 merge 가 만든 token 을 재료로 쓰므로, 순서를 바꾸면 적용되지 않는 merge 가 생기기 때문이다'
        - '어느 순서로 merge 를 적용해도 결과는 같고, 배운 순서를 따르면 계산이 빨라질 뿐이기 때문이다'
        - 'encode 할 text 에서 쌍의 빈도를 새로 세어 많은 쌍부터 적용해야 하는데, 그 순서가 학습 순서와 같기 때문이다'
        - '배운 순서를 지키지 않으면 decode 할 때 byte 를 이어 붙이는 순서가 뒤집혀서, 글자의 순서가 바뀌어 나오기 때문이다'
      answer: 0
      explanation: |
        예를 들어 "at" 을 만든 merge 다음에 "cat" 을 만든 merge 가 있다면, "at" 이 먼저 생겨야 "cat" merge 를 적용할 수 있다. 순서를
        뒤집으면 token 이 달라지므로 순서는 계산 속도만이 아니라 결과를 바꾼다. encode 는 새 text 에서 빈도를 다시 세지 않고 학습
        때의 순서를 그대로 쓴다. 순서가 바뀌면 token 의 개수와 경계가 달라질 뿐 decode 한 글자 순서가 뒤집히지는 않는다.
    - question: |
        byte 에서 시작하는 BPE tokenizer 로, 학습 corpus 에 한 번도 없던 글자가 든 문장을 encode 하면 어떻게 되는가?
      choices:
        - '처음 보는 글자라서 vocabulary 에 번호가 없으므로, 그 글자는 `<unk>` token 하나로 바뀌어 저장된다'
        - '그 글자의 byte 쌍을 합칠 merge 를 찾지 못해서, encode 가 오류를 내고 그 자리에서 멈춘다'
        - '그 글자의 byte 는 합칠 merge 가 없어 byte token 으로 남고, encode 는 정상으로 끝난다'
        - '그 글자는 vocabulary 의 token 으로 바꿀 수 없어서 버려지고, 나머지 글자만 encode 된다'
      answer: 2
      explanation: |
        모든 글자는 UTF-8 byte 로 바뀌고 byte 256 개는 처음부터 vocabulary 에 있다. 그 byte 를 합칠 merge 가 없으면 byte 하나하나가
        token 으로 남을 뿐이라서 `<unk>` 로 바꿀 일이 없다. 모든 byte 에 token 이 있으므로 encode 가 오류를 내고 멈출 일도 없다.
        글자를 버리지도 않아서 decode 하면 원래 글자가 그대로 돌아온다.
    - question: |
        BPE tokenizer 의 decode 는 어떤 순서로 이루어지는가?
      choices:
        - 'token id 를 크기순으로 정렬한 뒤, 작은 id 부터 차례로 vocabulary 의 글자로 바꿔 이어 붙인다'
        - 'id 마다 vocabulary 의 byte 열을 찾아 모두 이어 붙인 뒤, 그 byte 열을 UTF-8 로 읽는다'
        - 'merge 목록을 처음부터 다시 학습해서, 각 id 가 원래 어떤 글자였는지 알아낸 뒤 글자로 바꾼다'
        - 'id 하나하나를 따로 UTF-8 글자로 읽은 뒤, 읽어 낸 글자들을 순서대로 이어 붙여 문장을 만든다'
      answer: 1
      explanation: |
        모든 token 은 결국 byte 몇 개로 풀리므로, decode 는 id 마다 byte 를 찾아 먼저 이어 붙이고 그 전체를 UTF-8 로 읽는다. id 마다
        따로 글자로 읽으면 한 글자의 byte 가 두 token 에 나뉜 경우 � 가 나온다. id 를 크기순으로 정렬하면 글자 순서가 망가진다.
        decode 는 이미 있는 vocabulary 만 쓰므로 merge 목록을 다시 학습할 필요가 없다.

- topic: pretokenization
  title: pre-tokenization 과 special token
  variants:
    - question: |
        GPT-2 가 BPE 를 하기 전에 text 를 단어·숫자·기호 조각으로 먼저 나누는 이유는 무엇인가?
      choices:
        - 'byte 단위로는 한글을 다룰 수 없어서, 한글이 든 text 를 encode 하려면 반드시 조각으로 나눠야 하기 때문이다'
        - '"dog." "dog!" 처럼 문장부호가 붙은 token 이 따로따로 생기지 않게, merge 가 조각 경계를 넘지 못하게 하려고'
        - '조각으로 나누면 merge 가 더 많이 적용되어서, bytes per token 이 언제나 커지기 때문이다'
        - '조각으로 나누지 않으면 공백 정보가 사라져서, decode 결과가 원래 text 와 달라지기 때문이다'
      answer: 1
      explanation: |
        merge 가 단어 경계를 넘을 수 있으면 같은 dog 가 뒤에 붙는 문장부호마다 다른 token 이 되어 vocabulary 자리를 여러 개 쓰고,
        모델은 매번 다른 token 을 본다. 한글이 든 text 도 조각으로 나누지 않고 byte 단위로 encode 할 수 있다. 경계를 넘는 merge 를
        막는 만큼 압축은 오히려 조금 덜 되므로 bytes per token 이 언제나 커지지는 않는다. 조각으로 나누지 않아도 decode 하면 원래
        text 가 그대로 나온다.
    - question: |
        pre-tokenization 으로 text 를 조각으로 나눈 뒤 BPE 를 학습하면, 쌍의 빈도는 어디서 세는가?
      choices:
        - '조각과 관계없이 text 전체를 이어 붙여서 이웃한 쌍을 모두 센다'
        - '단어 사이의 묶음을 배우려고, 조각과 조각 사이에 걸친 쌍만 골라 센다'
        - '조각마다 vocabulary 를 따로 만들고, 쌍도 조각마다 따로 센다'
        - '조각 안에서만 세고, 같은 조각은 나온 횟수를 곱해 한 번에 센다'
      answer: 3
      explanation: |
        pre-tokenization 의 목적이 merge 가 조각 경계를 넘지 못하게 하는 것이므로 쌍은 조각 안에서만 센다. "␣the" 처럼 같은 조각이
        수없이 되풀이되므로 조각마다 횟수를 세어 두고 쌍의 빈도에 곱하면 계산이 크게 준다. text 전체에서 세면 경계를 넘는 merge 가
        다시 생긴다. 경계에 걸친 쌍만 세면 단어 안의 묶음을 배우지 못한다. vocabulary 는 조각마다 따로 만들지 않고 하나만 만든다.
    - question: |
        `<|endoftext|>` 같은 special token 을 encode 할 때 pre-tokenization 보다 먼저 떼어 내는 이유는 무엇인가?
      choices:
        - '보통 text 처럼 다루면 `<|`, endoftext, `|>` 처럼 잘리므로 미리 떼어 id 하나로 바꾸기 위해서다'
        - 'special token 도 merge 로 배워야 하므로, 학습 전에 따로 모아 두고 그 빈도를 세기 위해서다'
        - '문서 끝 표시는 모델이 배울 필요가 없는 정보라서, 다른 text 를 encode 하기 전에 먼저 찾아 지우기 위해서다'
        - 'special token 은 글자 수가 많아서, 조각 규칙으로 하나하나 나누면 encode 계산이 오래 걸리기 때문이다'
      answer: 0
      explanation: |
        special token 은 text 에서 배우지 않고 미리 정해 vocabulary 에 넣어 둔 token 이다. 조각 규칙은 기호와 글자를 다른 조각으로
        나누므로, 먼저 떼어 내지 않으면 표시 하나가 여러 token 으로 흩어진다. special token 은 merge 로 배우는 token 이 아니다. 문서
        경계를 표시하는 정보라서 지우지 않는다. 먼저 떼어 내는 것은 계산 시간과 관계없다.

- topic: vocab-size
  title: vocabulary 크기와 한국어의 token 수
  variants:
    - question: |
        vocabulary 를 키우면 sequence 가 짧아지는데, 그렇다면 vocabulary 를 무조건 크게 잡지 않는 이유는 무엇인가?
      choices:
        - 'vocabulary 를 일정 크기보다 키우면 merge 가 서로 겹쳐서, sequence 가 오히려 길어지기 때문이다'
        - 'vocabulary 가 크면 merge 로 만든 token 에 자리가 밀려 byte token 이 빠져서, 처음 보는 글자를 encode 할 수 없기 때문이다'
        - 'embedding 이 token 마다 늘어 모델이 커지고, 드문 token 은 학습할 예가 적어 잘 배우지 못하기 때문이다'
        - 'token id 를 16 bit 로 저장하므로, vocabulary 는 65,536 개를 넘을 수 없기 때문이다'
      answer: 2
      explanation: |
        모델은 token id 마다 숫자 묶음(embedding)을 두고, 다음 token 을 고를 때 vocabulary 전체에 점수를 매긴다. 그래서 vocabulary 를
        키우면 그만큼 학습할 숫자가 는다. 또 드문 token 은 데이터에서 볼 기회가 적다. vocabulary 를 키워도 sequence 는 길어지지 않는다.
        byte 에서 시작하면 vocabulary 크기와 관계없이 처음 보는 글자도 encode 된다. GPT-4o 의 tokenizer 처럼 20만 개가 넘는
        vocabulary 도 쓰므로 65,536 이 한도는 아니다.
    - question: |
        영어 text 로 주로 학습한 BPE tokenizer 에서 같은 뜻의 한국어 문장이 영어 문장보다 token 을 훨씬 많이 쓰는 이유는 무엇인가?
      choices:
        - '한국어가 적은 학습 text 에서는 한글 byte 쌍의 merge 가 적어서, 한 글자의 3 byte 가 따로 남기 때문이다'
        - '한국어는 조사와 어미가 붙어서, 같은 뜻을 말해도 문법상 단어 수가 영어보다 훨씬 많아지기 때문이다'
        - '영어로 학습한 tokenizer 는 한글을 모르므로, 한국어 글자가 모두 `<unk>` 로 바뀌면서 token 이 늘기 때문이다'
        - 'tokenizer 가 한글을 정확히 되살리려고, 한글 byte 를 일부러 두 번씩 적기 때문이다'
      answer: 0
      explanation: |
        merge 는 학습 text 에서 자주 나온 쌍으로 만들어지므로 적게 나온 언어의 byte 쌍은 merge 가 적다. 한글은 글자마다 3 byte 라서
        합쳐지지 못한 byte 가 그대로 token 이 되고, 그래서 byte 수가 비슷한 문장도 token 은 몇 배가 된다. 한국어를 더 많이 넣어 학습한
        tokenizer 에서는 이 차이가 준다. token 이 느는 것은 문법상 단어 수 때문이 아니라 한국어 merge 가 적기 때문이다. byte BPE 에는
        `<unk>` 가 없다. tokenizer 가 한글 byte 를 두 번 적는 일도 없다.
    - question: |
        tokenizer 의 압축률(bytes per token, token 하나에 담기는 평균 byte 수)을 학습에 쓰지 않은 text 에서 재는 이유는 무엇인가?
      choices:
        - '학습 text 로 재면 모든 merge 가 그대로 적용되어서, 압축률이 언제나 정확히 1 이 되기 때문이다'
        - '학습에 쓴 text 는 이미 merge 를 만드는 데 써서, 다시 encode 할 수 없기 때문이다'
        - '학습에 쓰지 않은 text 가 보통 더 길어서, 평균을 낼 token 이 많아 계산이 정확하기 때문이다'
        - 'merge 는 학습 text 에서 자주 나온 쌍이라서, 그 text 로 재면 실제로 쓸 때보다 좋게 나오기 때문이다'
      answer: 3
      explanation: |
        merge 목록은 학습 text 에 맞춰져 있어서 그 text 에서는 유난히 잘 압축된다. 모델이 앞으로 볼 text 는 학습에 쓰지 않은 text
        이므로 그런 text 에서 재야 실제 성능에 가깝다. 압축률 1 은 merge 를 하나도 쓰지 못할 때의 값이라서, merge 가 잘 적용되는
        학습 text 에서는 1 이 나오지 않는다. 학습에 쓴 text 도 encode 할 수 있다. 어느 text 가 더 긴지는 이 선택과 관계없다.

- topic: action-token
  title: action token 과 256 bin
  variants:
    - question: |
        RT-2·OpenVLA 같은 VLA 가 로봇 행동 값을 실수로 바로 내지 않고 bin 번호에 짝지은 token 으로 내는 이유는 무엇인가?
      choices:
        - '로봇 motor 가 정수 명령만 받을 수 있어서, 실수인 행동 값을 bin 번호인 정수로 바꿔서 보내야 하기 때문이다'
        - 'VLA 는 vocabulary 의 token 을 고르는 식으로만 답하므로, 행동 값을 bin 으로 나눠 token 에 짝지어야 하기 때문이다'
        - 'bin 으로 나누면 행동 값이 정해진 칸의 가운데 값에 딱 맞춰져서, 실수로 직접 낼 때보다 정밀도가 높아지기 때문이다'
        - '실수를 바로 내는 방식은 gradient 를 계산할 수 없어서, 그런 모델은 학습이 불가능하다고 증명되어 있기 때문이다'
      answer: 1
      explanation: |
        language model 은 매 자리에서 vocabulary 의 token 하나를 고른다. 그래서 0 ~ 8 cm 를 bin 으로 나눠 3.4 cm 를 bin 3 으로 바꾸고,
        bin 3 에 token 하나를 짝지어 두면 모델이 다음 token 을 고르는 방식 그대로 행동을 낸다. 고른 bin 은 가운데 값으로 되돌려
        motor 에 보내므로 motor 는 실수 명령을 받는다. bin 으로 자르면 정밀도는 오히려 bin 폭만큼 떨어진다. 실수를 바로 내는 방식도
        ACT 처럼 action 출력을 따로 붙인 모델에서 쓰므로 학습이 불가능하지 않다.
    - question: |
        OpenVLA 는 action bin 256 개에 해당하는 token 을 vocabulary 에 새로 더하지 않고 어떻게 마련했는가?
      choices:
        - '"the" 처럼 가장 자주 쓰이는 token 256 개를 골라, 학습할 때 action token 으로 덮어썼다'
        - '0 부터 255 까지의 숫자를 글자로 적어서, 이미 있는 숫자 token 으로 action 을 냈다'
        - 'vocabulary 를 늘려서, 새 token 256 개를 action token 으로 끝에 더했다'
        - '가장 드물게 쓰이는 vocabulary 끝의 token 256 개를 action token 으로 덮어썼다'
      answer: 3
      explanation: |
        OpenVLA 논문에 따르면 Llama tokenizer 는 새로 더할 token 자리를 100 개만 마련해 두어 256 개에 모자랐고, 그래서 RT-2 를 따라
        가장 드물게 쓰이는 256 개(vocabulary 끝의 256 개)를 덮어썼다. 자주 쓰는 token 을 덮어쓰면 지시문을 읽는 데 쓰는 token 이
        사라진다. 숫자 token 을 그대로 쓴 것은 RT-2 의 PaLI-X 판이고 OpenVLA 는 그렇게 하지 않았다. OpenVLA 는 vocabulary 를 늘려
        새 token 을 더하는 방법도 쓰지 않았다.
    - question: |
        text token, image patch token, action token 의 차이는 무엇인가?
      choices:
        - '셋 모두 vocabulary 의 정수 번호이고, 모델은 번호마다 같은 방식으로 embedding 을 찾아 쓴다'
        - '셋 모두 번호 없이 숫자 묶음으로 들어가고, text 도 글자의 byte 값을 그대로 묶어 넣는다'
        - 'text·action token 은 vocabulary 의 정수 번호이고, image patch token 은 pixel 숫자를 묶은 vector 다'
        - 'text token 만 token 이라고 부르는 것이 맞고, image patch 와 action 은 token 이 아니라 그냥 입력값이다'
      answer: 2
      explanation: |
        text 는 글자라서 vocabulary 로 번호를 붙여야 숫자가 되고, action token 도 움직임 값의 bin 번호를 vocabulary 의 token 에 짝지은
        정수 번호다. 사진은 처음부터 pixel 마다 밝기 숫자가 있어서 번호로 바꿀 필요 없이 조각 안 숫자를 묶은 vector 가 그대로 들어간다.
        image patch token 은 정수 번호가 아니므로 셋 모두 vocabulary 번호인 것은 아니다. text token 과 action token 은 번호로 들어가므로
        셋 모두 번호 없는 숫자 묶음인 것도 아니다. 셋 모두 모델이 하나씩 받거나 내는 단위라서 token 이라고 부르는 것이 맞다.

- topic: fast
  title: FAST action tokenization
  variants:
    - question: |
        1 초에 50 번 행동을 내는 로봇에서 값마다 bin 하나를 쓰는 action tokenization 이 잘 안 되는 이유는 무엇인가?
      choices:
        - '값마다 token 이라 수백 개로 늘고 이웃 step 값이 거의 같아서, 모델이 앞 값을 되풀이하기 쉽기 때문이다'
        - '50 Hz 에서는 한 step 의 시간이 짧아서, bin 을 256 개보다 많이 만들 수 없어 정밀도가 모자라기 때문이다'
        - '주기가 높으면 이웃한 step 사이의 변화가 커져서, 행동 값이 bin 범위를 자주 벗어나기 때문이다'
        - '주기가 높으면 action token 이 많이 필요해서, 덮어쓸 vocabulary 끝의 token 자리가 모자라기 때문이다'
      answer: 0
      explanation: |
        값마다 token 하나라서 14 차원 두 팔 로봇의 1 초 분량은 $14 \times 50 = 700$ 개가 된다. 게다가 이웃한 step 의 값이 거의 같아
        다음 token 이 앞 token 과 같은 bin 일 때가 많다. FAST 논문의 실험에서 이런 모델은 주기를 높일수록 오차가 커지다가 첫 action 을
        그대로 되풀이했다. bin 개수는 주기와 관계없이 정한다. 행동 값이 bin 범위를 벗어나는 정도도 주기와 관계없다. 덮어쓸 token 자리
        수는 bin 개수로 정해지므로 주기가 높아도 모자라지 않는다.
    - question: |
        FAST tokenizer 는 action chunk 를 어떤 절차로 token 으로 바꾸는가?
      choices:
        - '값마다 256 개 bin 으로 나눈 뒤, 같은 bin 이 이어지는 자리만 지워 token 수를 줄인다'
        - 'action chunk 를 DCT 로 주파수 계수로 바꾸고, scale 을 곱해 반올림한 정수열을 BPE 로 압축한다'
        - 'action chunk 를 시간에 따른 그래프 그림으로 그려서, image patch token 으로 잘라 넣는다'
        - 'action 값을 소수점 숫자 글자로 적은 뒤, 그 글자열을 GPT-2 tokenizer 로 잘라 token 으로 만든다'
      answer: 1
      explanation: |
        FAST 는 DCT 로 action chunk 를 천천히 출렁이는 파형부터 빠르게 출렁이는 파형까지의 계수로 바꾼다. 부드러운 움직임은 앞의 몇
        계수만 커서, scale(논문은 10)을 곱해 반올림하면 대부분 0 이 된다. 이 정수열을 BPE 로 압축하면 이어진 0 과 자주 나오는 조합이
        token 하나로 합쳐진다. FAST 에는 값마다 256 개 bin 으로 나누는 단계가 없다. action chunk 를 그림으로 그리지도 않는다. action
        값을 글자로 적어 GPT-2 tokenizer 에 넣지도 않는다.
    - question: |
        π0-FAST 처럼 FAST token 을 하나씩 생성하는 VLA 와, π0 처럼 action chunk 를 한꺼번에 만드는 방식을 비교하면 FAST 쪽의 약점은 무엇인가?
      choices:
        - 'token 을 만드는 DCT 와 BPE 단계가 더해져서, 같은 성능까지 학습하는 데 GPU 시간이 훨씬 더 든다'
        - 'action token 이 팔 하나에 맞춰져 있어서, 두 팔 로봇처럼 차원이 많은 행동은 표현할 수 없다'
        - '1 초 분량 chunk 에도 token 수십 개를 하나씩 내야 해서, π0 보다 실행이 몇 배 느리다'
        - '반올림으로 계수를 잘라 냈기 때문에, 생성한 token 에서 행동 값으로 되돌릴 수 없다'
      answer: 2
      explanation: |
        FAST 는 1 초 분량을 팔 하나에 30 개 안팎의 token 으로 줄이지만, 생성은 여전히 한 token 씩이라 30 ~ 60 번 계산해야 한다.
        π0-FAST 의 학습에 든 GPU 시간은 오히려 π0 의 5 분의 1 이었다. FAST 는 두 팔 로봇(Shirt Fold)의 행동도 평균 53 개 token 으로
        표현했다. DCT·BPE 는 반올림을 빼면 되돌릴 수 있으므로 token 에서 행동을 다시 계산할 수 있다.
