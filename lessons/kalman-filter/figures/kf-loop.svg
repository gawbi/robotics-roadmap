<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Kalman filter 의 예측과 보정. 0 m 분산 1 에서 바퀴로 2 m 앞으로 가면 예측은 2 m 분산 2 가 되고, GPS 가 3 m(분산 2)라고 하면 보정한 추정은 2.5 m 분산 1 이다. 이 추정이 다음 예측의 출발점이 된다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="110" width="140" height="70" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="middle">이전 추정</text>
  <text x="90.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="middle">0 m, 분산 1</text>
  <line x1="162" y1="145" x2="218" y2="145" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="220" y="110" width="140" height="70" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290.0" y="136.0" fill="#f59e0b" font-size="14" text-anchor="middle" font-weight="600">① 예측</text>
  <text x="290.0" y="158.0" fill="#e2e8f0" font-size="12" text-anchor="middle">2 m, 분산 1 + 1 = 2</text>
  <text x="290.0" y="52.0" fill="#f59e0b" font-size="12" text-anchor="middle">바퀴: 2 m 앞으로 (오차 분산 1)</text>
  <line x1="290" y1="62" x2="290" y2="106" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#aa)"/>
  <line x1="362" y1="145" x2="418" y2="145" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="420" y="110" width="140" height="70" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="490.0" y="136.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="600">② 보정</text>
  <text x="490.0" y="158.0" fill="#e2e8f0" font-size="12" text-anchor="middle">2.5 m, 분산 1</text>
  <text x="490.0" y="52.0" fill="#38bdf8" font-size="12" text-anchor="middle">측정: GPS 3 m (오차 분산 2)</text>
  <line x1="490" y1="62" x2="490" y2="106" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <path d="M560,145 L640,145 L640,230 L90,230 L90,184" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="365.0" y="222.0" fill="#94a3b8" font-size="12" text-anchor="middle">보정한 추정이 다음 예측의 출발점이 된다</text>
  <text x="340.0" y="275.0" fill="#94a3b8" font-size="12" text-anchor="middle">예측에서는 불확실성이 커지고, 측정으로 보정하면 다시 줄어든다</text>
</svg>
