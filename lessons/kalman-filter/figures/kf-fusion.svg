<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>센서 퓨전. 바퀴 odometry, IMU, GPS 의 측정을 EKF 가 예측과 보정으로 합쳐 위치·자세·속도 같은 로봇의 상태 15개를 낸다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
  <rect x="1" y="1" width="658" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="40" width="160" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100.0" y="62.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="600">바퀴 odometry</text>
  <text x="100.0" y="80.0" fill="#94a3b8" font-size="11" text-anchor="middle">얼마나 굴렀나</text>
  <line x1="182" y1="65" x2="268" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="20" y="110" width="160" height="50" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="100.0" y="132.0" fill="#a78bfa" font-size="13" text-anchor="middle" font-weight="600">IMU</text>
  <text x="100.0" y="150.0" fill="#94a3b8" font-size="11" text-anchor="middle">얼마나 돌았나</text>
  <line x1="182" y1="135" x2="268" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="20" y="180" width="160" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="100.0" y="202.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">GPS</text>
  <text x="100.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">지구 위 어디인가</text>
  <line x1="182" y1="205" x2="268" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="270" y="105" width="150" height="70" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="345.0" y="133.0" fill="#34d399" font-size="15" text-anchor="middle" font-weight="600">EKF</text>
  <text x="345.0" y="155.0" fill="#e2e8f0" font-size="12" text-anchor="middle">예측 → 보정 반복</text>
  <line x1="422" y1="140" x2="478" y2="140" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="480" y="105" width="160" height="70" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="560.0" y="133.0" fill="#e2e8f0" font-size="14" text-anchor="middle">로봇의 상태</text>
  <text x="560.0" y="155.0" fill="#94a3b8" font-size="11" text-anchor="middle">위치·자세·속도 등 15개</text>
  <text x="330.0" y="255.0" fill="#94a3b8" font-size="12" text-anchor="middle">센서마다 약점이 다르다: 바퀴는 미끄러지면 쌓여서 틀리고, GPS 는 몇 m 씩 튄다</text>
</svg>
