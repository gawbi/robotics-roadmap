<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Kalman gain 비교. 예측은 2 m(분산 2), GPS 는 3 m 다. GPS 분산이 2 이면 k = 0.5 라 추정이 2.5 m 이고, GPS 분산이 6 이면 k = 0.25 라 추정이 2.25 m 로 예측 쪽에 더 가깝다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker></defs>
  <rect x="1" y="1" width="638" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="80" y1="80" x2="580" y2="80" stroke="#475569" stroke-width="1.8"/>
  <line x1="80.0" y1="76" x2="80.0" y2="84" stroke="#475569"/>
  <text x="80.0" y="102.0" fill="#64748b" font-size="11" text-anchor="middle">1.5</text>
  <line x1="205.0" y1="76" x2="205.0" y2="84" stroke="#475569"/>
  <text x="205.0" y="102.0" fill="#64748b" font-size="11" text-anchor="middle">2</text>
  <line x1="330.0" y1="76" x2="330.0" y2="84" stroke="#475569"/>
  <text x="330.0" y="102.0" fill="#64748b" font-size="11" text-anchor="middle">2.5</text>
  <line x1="455.0" y1="76" x2="455.0" y2="84" stroke="#475569"/>
  <text x="455.0" y="102.0" fill="#64748b" font-size="11" text-anchor="middle">3</text>
  <line x1="580.0" y1="76" x2="580.0" y2="84" stroke="#475569"/>
  <text x="580.0" y="102.0" fill="#64748b" font-size="11" text-anchor="middle">3.5</text>
  <circle cx="205.0" cy="80" r="7" fill="#f59e0b"/>
  <circle cx="455.0" cy="80" r="7" fill="#38bdf8"/>
  <circle cx="330.0" cy="80" r="8" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="330.0" y="64.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">2.5 m</text>
  <text x="20.0" y="50.0" fill="#e2e8f0" font-size="13" text-anchor="start">GPS 분산 2</text>
  <text x="620.0" y="50.0" fill="#94a3b8" font-size="12" text-anchor="end">k = 2 ÷ (2 + 2) = 0.5</text>
  <line x1="80" y1="180" x2="580" y2="180" stroke="#475569" stroke-width="1.8"/>
  <line x1="80.0" y1="176" x2="80.0" y2="184" stroke="#475569"/>
  <text x="80.0" y="202.0" fill="#64748b" font-size="11" text-anchor="middle">1.5</text>
  <line x1="205.0" y1="176" x2="205.0" y2="184" stroke="#475569"/>
  <text x="205.0" y="202.0" fill="#64748b" font-size="11" text-anchor="middle">2</text>
  <line x1="330.0" y1="176" x2="330.0" y2="184" stroke="#475569"/>
  <text x="330.0" y="202.0" fill="#64748b" font-size="11" text-anchor="middle">2.5</text>
  <line x1="455.0" y1="176" x2="455.0" y2="184" stroke="#475569"/>
  <text x="455.0" y="202.0" fill="#64748b" font-size="11" text-anchor="middle">3</text>
  <line x1="580.0" y1="176" x2="580.0" y2="184" stroke="#475569"/>
  <text x="580.0" y="202.0" fill="#64748b" font-size="11" text-anchor="middle">3.5</text>
  <circle cx="205.0" cy="180" r="7" fill="#f59e0b"/>
  <circle cx="455.0" cy="180" r="7" fill="#38bdf8"/>
  <circle cx="267.5" cy="180" r="8" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="267.5" y="164.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">2.25 m</text>
  <text x="20.0" y="150.0" fill="#e2e8f0" font-size="13" text-anchor="start">GPS 분산 6</text>
  <text x="620.0" y="150.0" fill="#94a3b8" font-size="12" text-anchor="end">k = 2 ÷ (2 + 6) = 0.25</text>
  <text x="205.0" y="245.0" fill="#f59e0b" font-size="12" text-anchor="middle">● 예측 2 m</text>
  <text x="455.0" y="245.0" fill="#38bdf8" font-size="12" text-anchor="middle">● GPS 3 m</text>
</svg>
