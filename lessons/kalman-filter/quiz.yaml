# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: predict-update
  title: 예측과 보정의 반복
  variants:
    - question: |
        Kalman filter 의 한 cycle 은 어떤 두 단계로 이루어지고, 각 단계에서 불확실성은 어떻게 변하는가?
      choices:
        - '예측에서는 motion model 로 상태를 옮겨 불확실성이 커지고, 보정에서는 측정을 섞어 불확실성이 줄어든다'
        - '예측에서는 모델을 믿어 불확실성이 줄고, 보정에서는 측정 noise 가 더해져 불확실성이 커진다'
        - '예측과 보정 모두 불확실성을 줄이는 단계라서, 측정이 들어오지 않으면 filter 가 예측도 멈춘다'
        - '예측과 보정은 같은 계산을 두 번 하는 것이고, 불확실성은 처음 정한 분산에서 바뀌지 않는다'
      answer: 0
      explanation: |
        예측(predict)은 motion model 로 상태를 다음 시각으로 옮기는데, 모델이 놓치는 미끄러짐 같은 오차(process noise)가 더해져 불확실성이
        커진다. 보정(update)은 측정과 예측을 섞어 불확실성을 줄인다. 측정이 없어도 예측만으로 계속 돌 수 있고, 불확실성은 매 단계 바뀐다.
    - question: |
        센서 데이터가 잠시 끊긴 동안 Kalman filter 는 어떻게 동작하는가?
      choices:
        - '보정을 할 수 없으니 마지막 측정값을 그대로 출력하고, 불확실성도 그 시점의 값으로 고정한다'
        - '측정 없이 낸 추정은 믿을 수 없어서, 측정이 다시 들어올 때까지 추정을 멈추고 출력하지 않는다'
        - '예측 단계만 되풀이해 상태를 이어 가고, 그동안 불확실성은 계속 커진다'
        - '끊긴 동안 불확실성을 0 으로 줄여 두어서, 다시 들어온 측정을 거의 반영하지 않게 된다'
      answer: 2
      explanation: |
        측정이 없으면 보정 단계를 건너뛰고 예측만 되풀이한다. 상태는 motion model 로 이어지지만 예측할 때마다 process noise 가 더해져 불확실성이
        커진다. 그래서 측정이 돌아오면 예측의 불확실성이 큰 만큼 측정을 크게 믿는다. 멈추거나 값을 고정하는 방식은 Kalman filter 의 동작이 아니다.
    - question: |
        예측과 측정의 분산이 각각 2 인 정보를 Kalman filter 로 합치면, 합친 결과의 분산은 어떻게 되는가?
      choices:
        - '두 분산을 더한 4 가 된다. 정보가 둘이면 각각의 noise 도 함께 쌓이기 때문이다'
        - '2 보다 작아진다. 독립인 두 정보를 합치면 어느 하나보다 확실해진다'
        - '두 분산의 평균인 2 그대로다. 같은 크기의 불확실성끼리 섞었기 때문이다'
        - '측정의 분산인 2 를 그대로 따른다. 보정 결과는 측정의 불확실성을 물려받는다'
      answer: 1
      explanation: |
        보정 후의 분산은 $(1 - k) \times$ 예측의 분산이고 여기서 $k = 2 \div (2 + 2) = 0.5$ 라서 1 이 된다. 서로 독립인 두 정보를 합치면 결과는
        어느 하나보다 확실해진다. 분산을 더하는 것은 예측 단계에서 process noise 를 더할 때의 일이고, 평균이나 한쪽 값을 따르는 것이 아니다.

- topic: kalman-gain
  title: Kalman gain
  variants:
    - question: |
        Kalman gain 이 1 에 가까워지는 것은 어떤 상황인가?
      choices:
        - 'motion model 이 아주 정확해서 예측의 불확실성이 측정보다 훨씬 작을 때'
        - '로봇이 멈춰 있어서 속도가 0 이고 예측이 바뀌지 않을 때'
        - '측정값이 예측과 정확히 같아서 보정할 차이가 없을 때'
        - '센서가 아주 정확해서 측정 noise 가 예측의 불확실성보다 훨씬 작을 때'
      answer: 3
      explanation: |
        gain 은 예측의 분산 ÷ (예측의 분산 + 측정의 분산)이라서, 측정의 분산이 작을수록 1 에 가까워지고 추정이 측정값 쪽으로 거의 다 옮겨 간다.
        예측이 아주 정확하면 반대로 0 에 가까워진다. gain 은 분산으로 정해지므로 속도가 0 인지, 측정과 예측이 같은지와는 관계없다.
    - question: |
        예측은 10 m(분산 3), 측정은 14 m(분산 1)다. Kalman filter 가 보정한 위치로 가장 알맞은 것은?
      choices:
        - '10 m. 분산이 큰 예측이 더 넓은 범위를 담고 있어서 예측을 따른다'
        - '12 m. 두 값을 같은 무게로 섞어 가운데를 고른다'
        - '13 m. 측정이 더 정확해서 gain 0.75 만큼 측정 쪽으로 간다'
        - '14 m. 측정이 있으면 예측 대신 측정을 그대로 따른다'
      answer: 2
      explanation: |
        gain 은 $3 \div (3 + 1) = 0.75$ 이고, 보정한 위치는 $10 + 0.75 \times (14 - 10) = 13$ m 다. 가운데 12 m 는 두 분산이 같을 때의 답이고, 측정을
        그대로 따르는 것은 측정 분산이 0 일 때뿐이다. 예측을 그대로 쓰면 측정 정보를 버리는 셈이다.
    - question: |
        GPS 가 나무 아래에서 평소보다 훨씬 많이 튄다는 것을 알고 측정 noise 값 R 을 키웠다. 추정은 어떻게 바뀌는가?
      choices:
        - 'gain 이 작아져 GPS 측정을 덜 믿고, 추정이 예측 쪽에 더 가깝게 남는다'
        - 'gain 이 커져 GPS 측정을 더 강하게 반영하고, 추정이 측정 쪽으로 더 움직인다'
        - 'gain 은 그대로이고, 예측 단계에서 더하는 불확실성만 R 만큼 커진다'
        - 'R 은 예측 단계에만 쓰이는 값이라서 보정 결과는 바뀌지 않는다'
      answer: 0
      explanation: |
        측정의 분산 R 이 커지면 gain = 예측 분산 ÷ (예측 분산 + R) 이 작아져서 측정 쪽으로 덜 움직인다. R 은 보정 단계의 gain 계산에 쓰이고, 예측
        단계에서 불확실성을 키우는 것은 process noise Q 다.

- topic: uncertainty
  title: 값과 불확실성을 함께 추정하는 이유
  variants:
    - question: |
        Kalman filter 가 상태의 추정값뿐 아니라 공분산(불확실성)까지 함께 들고 다니는 이유는 무엇인가?
      choices:
        - '출력 메시지에 공분산 항목이 있어서 채워 둘 뿐, 추정 계산에는 쓰이지 않는다'
        - '새 측정이 들어올 때 예측과 측정을 섞는 비율(gain)을 정하는 데 쓰기 때문이다'
        - '공분산이 클 때 controller 가 로봇의 속도를 줄이도록 전달하는 것이 주된 목적이다'
        - '센서의 sampling rate 를 정하는 데 써서, 불확실성이 클수록 측정을 더 자주 받는다'
      answer: 1
      explanation: |
        gain 은 예측의 불확실성과 측정의 불확실성의 비율로 정해지므로, 불확실성을 알아야 두 정보를 어떻게 섞을지 정할 수 있다. 공분산을 다른
        node 가 참고할 수도 있지만 그것이 들고 다니는 이유는 아니고, sampling rate 와는 관계없다.
    - question: |
        Kalman filter 에서 상태를 Gaussian 으로 나타낸다는 것은 무슨 뜻인가?
      choices:
        - '상태가 시간에 따라 종 모양 곡선을 그리며 오르내린다고 가정한다는 뜻이다'
        - '센서 값을 여러 번 모아 평균 낸 숫자 하나로 상태를 나타낸다는 뜻이다'
        - '상태를 정수로만 표현해서 계산할 숫자의 개수를 줄인다는 뜻이다'
        - '믿음을 가장 그럴듯한 값(평균)과 퍼진 정도(분산·공분산)로 나타낸다는 뜻이다'
      answer: 3
      explanation: |
        Gaussian 은 평균 하나와 퍼진 정도로 정해지는 종 모양 분포다. Kalman filter 는 상태에 대한 믿음을 이 모양으로 두고 평균과 공분산만 고쳐
        나간다. 시간에 따른 변화 모양이나 정수 표현과는 관계없고, 평균 하나만 두면 퍼진 정도를 잃는다.
    - question: |
        Kalman filter 가 최적의 추정을 준다고 할 때, 전제가 되는 가정은 무엇인가?
      choices:
        - '센서가 하나뿐이어야 한다. 센서가 여럿이면 서로 다른 측정을 하나로 섞을 수 없다'
        - '로봇이 정지해 있어야 한다. 움직이는 동안에는 예측의 불확실성이 계속 커진다'
        - '움직임과 측정이 선형 관계이고, noise 가 Gaussian 이어야 한다'
        - 'sampling rate 가 1 kHz 이상이어야 한다. 그보다 느리면 예측 사이에 오차가 쌓인다'
      answer: 2
      explanation: |
        Kalman filter 는 상태 변화와 측정이 선형 관계이고 noise 가 Gaussian 일 때 최적이다. 이 가정이 깨지면 EKF·UKF 같은 근사나 particle filter
        를 쓴다. 센서 개수, 정지 여부, 주기는 최적성의 조건이 아니다.

- topic: ekf
  title: 비선형 시스템과 EKF·UKF
  variants:
    - question: |
        바닥 위를 도는 mobile robot 의 위치 추정에 기본 Kalman filter 대신 EKF 를 쓰는 이유는 무엇인가?
      choices:
        - '이동이 heading 의 sin·cos 로 휘어져서, 추정값 근처에서 직선으로 근사해야 하기 때문이다'
        - 'EKF 가 기본 Kalman filter 보다 계산량이 적어서 1초에 더 많이 추정할 수 있기 때문이다'
        - 'EKF 는 측정이 없는 동안에도 오차가 쌓이지 않아서 바퀴가 미끄러져도 버티기 때문이다'
        - '기본 Kalman filter 는 센서를 하나만 받아서 바퀴와 IMU 를 함께 넣지 못하기 때문이다'
      answer: 0
      explanation: |
        heading 이 있는 로봇은 같은 전진 명령이 x·y 로 나뉘는 방식이 각도의 sin·cos 로 정해져 motion model 이 비선형이다. EKF 는 Jacobian 으로 현재
        추정 근처에서 선형화해 Kalman filter 의 식을 그대로 쓴다. 계산량은 오히려 Jacobian 만큼 늘고, 측정이 없으면 EKF 도 오차가 쌓이며, 기본
        Kalman filter 도 여러 센서를 받을 수 있다.
    - question: |
        EKF 와 UKF 의 차이는 무엇인가?
      choices:
        - 'EKF 는 위치만 추정하고 UKF 는 속도만 추정해서, 둘을 함께 써야 상태 전체를 얻는다'
        - 'EKF 는 추정 근처에서 직선으로 근사하고, UKF 는 점 몇 개를 휘어진 관계에 그대로 통과시킨다'
        - 'UKF 는 Gaussian 가정을 버리고 수천 개의 sample 로 어떤 모양의 분포든 표현한다'
        - '둘은 계산 방식이 같고, UKF 는 EKF 가 센서를 더 많이 받도록 입력만 늘린 것이다'
      answer: 1
      explanation: |
        EKF 는 현재 추정에서 Jacobian 으로 선형화하고, UKF 는 골라 뽑은 sigma point 를 비선형 함수에 통과시켜 평균과 공분산을 다시 계산한다. UKF 는
        Jacobian 이 필요 없고 비선형이 강할 때 더 정확한 대신 계산이 더 많다. 수천 개 sample 로 분포를 표현하는 것은 particle filter 다.
    - question: |
        EKF 가 잘 맞지 않거나 발산할 수 있는 상황은 어떤 경우인가?
      choices:
        - '센서 noise 가 아주 작을 때. 분산이 0 에 가까운 측정은 gain 계산에 넣을 수 없다'
        - '로봇이 직선으로만 움직일 때. 휘어지는 움직임이 없으면 근사할 기준이 사라진다'
        - '상태의 개수가 2 개 이하일 때. 행렬이 너무 작아 공분산을 제대로 담지 못한다'
        - '비선형이 강하거나 추정이 실제와 멀어서, 직선 근사가 실제 관계와 크게 어긋날 때'
      answer: 3
      explanation: |
        EKF 는 현재 추정 근처의 선형 근사를 믿으므로, 비선형이 강하거나 추정이 실제에서 멀면 근사가 틀려 오차가 커지거나 발산할 수 있다. 직선 운동은
        오히려 선형이라 잘 맞고, noise 가 작거나 상태가 적은 것은 실패 원인이 아니다.

- topic: sensor-fusion
  title: 센서 퓨전
  variants:
    - question: |
        wheel odometry 와 GPS 를 함께 fusion 하는 이유는 무엇인가?
      choices:
        - '두 센서의 값이 항상 같아서, 하나가 고장 났는지 서로 비교해 확인하려고'
        - 'GPS 는 속도를 재고 odometry 는 절대 위치를 재서, 둘을 합쳐야 상태가 모두 채워지므로'
        - 'odometry 는 매끄럽지만 오차가 쌓이고 GPS 는 쌓이지 않지만 튀어서, 서로의 약점을 메우려고'
        - 'fusion 하면 센서의 sampling rate 가 두 배가 되어 측정 사이의 빈 시간이 사라지므로'
      answer: 2
      explanation: |
        odometry 는 상대 이동을 적분해 drift 가 쌓이고, GPS 는 절대 위치를 주지만 noise 가 크다. 둘을 불확실성에 따라 섞으면 매끄러우면서도 drift
        가 없는 추정을 얻는다. 절대 위치를 주는 쪽은 GPS 이고, fusion 이 sampling rate 를 늘리지는 않는다.
    - question: |
        ROS 의 robot_localization 에서 odom frame 과 map frame 의 추정을 나눠서 두 EKF 로 돌리는 이유는 무엇인가?
      choices:
        - 'odom 추정은 매끄럽지만 drift 가 쌓이고, map 추정은 정확하지만 튈 수 있어 용도가 달라서'
        - 'EKF 하나가 추정하는 숫자는 15 개뿐이라, 두 frame 의 상태를 다 담으려면 나눠야 해서'
        - 'odom frame 은 2D 추정 전용이고 map frame 은 3D 추정 전용이라 같은 filter 로 못 돌려서'
        - '두 frame 의 추정값은 같지만 메시지 형식이 달라 filter 를 따로 두어야 해서'
      answer: 0
      explanation: |
        odom frame 추정은 바퀴·IMU 처럼 연속적인 측정만 써서 끊김 없이 매끄럽고, 짧은 시간의 제어에 적합하다. map frame 추정은 GPS 같은 절대 측정을
        더해 전체적으로 정확하지만 측정이 들어올 때 값이 튈 수 있다. 상태 개수 제한이나 차원, 메시지 형식 때문에 나누는 것이 아니다.
    - question: |
        IMU 만으로 위치를 오래 추정하면 어떤 문제가 생기는가?
      choices:
        - 'IMU 는 위치를 직접 재는 센서라서 오래 써도 오차가 쌓이지 않고 문제가 없다'
        - '가속도를 두 번 적분하므로 작은 bias 도 시간의 제곱으로 커지는 위치 오차가 된다'
        - 'IMU 는 회전을 잴 수 없어서, 로봇이 돌면 방향을 몰라 위치가 틀어진다'
        - 'IMU 의 noise 는 오래 쓰면 서로 상쇄되어 0 으로 수렴하므로 오히려 정확해진다'
      answer: 1
      explanation: |
        IMU 는 가속도와 각속도를 재므로 위치를 얻으려면 가속도를 두 번 적분해야 하고, 작은 bias 도 시간의 제곱에 비례해 위치 오차로 커진다. 그래서
        GPS·카메라·LiDAR 같은 절대 측정과 fusion 한다. IMU 는 위치를 직접 재지 않고, gyroscope 로 회전을 재며, noise 가 저절로 사라지지 않는다.

- topic: kf-limits
  title: Kalman filter 의 한계
  variants:
    - question: |
        똑같이 생긴 복도가 두 개인 건물에서 로봇이 자기 위치를 전혀 모르는 상태로 시작한다. 기본 Kalman filter 가 이 상황에 맞지 않는 이유는?
      choices:
        - 'GPS 같은 절대 측정이 있어야 Kalman filter 가 돌아가서, 실내에서는 동작하지 않기 때문이다'
        - '복도를 보는 센서가 카메라라서, 이미지는 Kalman filter 의 측정으로 넣을 수 없기 때문이다'
        - '복도가 직선이라 움직임이 선형이 되는데, 기본 Kalman filter 는 선형 모델을 못 쓰기 때문이다'
        - '믿음이 "왼쪽 아니면 오른쪽 복도" 처럼 봉우리가 둘인데, Gaussian 은 봉우리가 하나뿐이라서'
      answer: 3
      explanation: |
        Kalman filter 는 믿음을 Gaussian 하나로 두므로 봉우리가 여럿인 믿음을 표현할 수 없다. 이런 global localization 에는 sample 을 많이 뿌려
        어떤 모양의 분포든 표현하는 particle filter 를 쓴다. 실내외나 센서 종류, 직선 복도는 문제의 원인이 아니다.
    - question: |
        Kalman filter 의 Q(process noise)를 실제보다 아주 작게 잡으면 어떤 일이 생기는가?
      choices:
        - '예측을 지나치게 믿어 측정을 거의 반영하지 않고, 실제 움직임이 모델과 다르면 추정이 뒤처진다'
        - '측정을 지나치게 믿게 되어, 추정이 GPS 의 튐을 그대로 따라 크게 흔들린다'
        - 'Q 는 예측에 조금 더하는 값일 뿐이라서, 작게 잡아도 추정 결과는 거의 같다'
        - '예측 분산이 0 이 되어 gain 계산에서 0 으로 나누게 되고, filter 가 바로 발산한다'
      answer: 0
      explanation: |
        Q 가 작으면 예측의 불확실성이 작게 유지되어 gain 이 작아지고, 측정을 거의 반영하지 않는다. 바퀴가 미끄러지는 등 모델이 틀려도 고치지 못해
        추정이 실제를 따라가지 못한다. 측정을 지나치게 믿는 것은 Q 를 크게 잡거나 R 을 작게 잡았을 때의 일이다.
    - question: |
        센서 하나가 가끔 완전히 엉뚱한 값(outlier)을 낸다. Kalman filter 에 그대로 넣으면 어떻게 되고, 흔히 어떻게 막는가?
      choices:
        - 'Kalman filter 는 gain 이 작아서 outlier 를 저절로 무시하므로, 따로 막을 필요가 없다'
        - 'outlier 는 예측 단계에만 영향을 주고 보정 결과에는 반영되지 않으므로 그대로 두면 된다'
        - '추정이 그 값 쪽으로 크게 끌려가므로, 예측과의 차이가 불확실성에 비해 너무 큰 측정은 버린다'
        - 'outlier 가 들어온 순간 Q 를 0 으로 바꿔, 예측만 믿고 그 측정을 덮어쓰게 해서 막는다'
      answer: 2
      explanation: |
        Kalman filter 는 noise 가 Gaussian 이라고 가정해서, 그 가정에서 크게 벗어난 outlier 도 gain 만큼 그대로 반영해 추정이 끌려간다. 그래서
        측정과 예측의 차이(innovation)를 그 불확실성으로 나눈 거리가 문턱을 넘으면 측정을 버리는 gating(예: Mahalanobis distance 문턱)을 흔히 쓴다.
