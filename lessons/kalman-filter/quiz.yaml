# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: predict-update
  title: 예측과 보정의 반복
  variants:
    - question: |
        면접관: "Kalman filter 의 한 cycle 은 어떤 두 단계로 이루어지고, 각 단계에서 불확실성은 어떻게 변하나요?"
      choices:
        - '예측에서는 motion model 로 상태를 옮기며 불확실성이 커지고, 보정에서는 측정을 반영하며 불확실성이 줄어든다'
        - '예측에서는 불확실성이 줄고, 보정에서는 측정 noise 가 더해져 불확실성이 커진다'
        - '두 단계 모두 불확실성을 줄이며, 측정이 없으면 filter 가 멈춘다'
        - '예측과 보정은 같은 계산이고, 불확실성은 처음 정한 값에서 바뀌지 않는다'
      answer: 0
      explanation: |
        예측(predict)은 motion model 로 상태를 다음 시각으로 옮기는데, 모델이 놓치는 미끄러짐 같은 오차(process noise)가 더해져 불확실성이
        커진다. 보정(update)은 측정과 예측을 섞어 불확실성을 줄인다. 측정이 없어도 예측만으로 계속 돌 수 있고, 불확실성은 매 단계 바뀐다.
    - question: |
        면접관: "센서 데이터가 잠시 끊긴 동안 Kalman filter 는 어떻게 동작하나요?"
      choices:
        - '마지막 측정값을 그대로 출력하고 불확실성도 고정한다'
        - '추정을 멈추고 측정이 다시 들어올 때까지 아무것도 출력하지 않는다'
        - '예측 단계만 되풀이해 상태를 이어 가고, 그동안 불확실성은 계속 커진다'
        - '불확실성을 0 으로 초기화해 다음 측정을 무시하도록 만든다'
      answer: 2
      explanation: |
        측정이 없으면 보정 단계를 건너뛰고 예측만 되풀이한다. 상태는 motion model 로 이어지지만 예측할 때마다 process noise 가 더해져 불확실성이
        커진다. 그래서 측정이 돌아오면 예측의 불확실성이 큰 만큼 측정을 크게 믿는다. 멈추거나 값을 고정하는 방식은 Kalman filter 의 동작이 아니다.
    - question: |
        면접관: "예측과 측정의 분산이 각각 2 인 정보를 Kalman filter 로 합치면, 합친 결과의 분산은 어떻게 되나요?"
      choices:
        - '두 분산을 더한 4 가 된다'
        - '2 보다 작아진다. 독립인 두 정보를 합치면 어느 하나보다 확실해진다'
        - '두 분산의 평균인 2 그대로다'
        - '측정의 분산인 2 를 그대로 따른다'
      answer: 1
      explanation: |
        보정 후의 분산은 $(1 - k) \times$ 예측의 분산이고 여기서 $k = 2 \div (2 + 2) = 0.5$ 라서 1 이 된다. 서로 독립인 두 정보를 합치면 결과는
        어느 하나보다 확실해진다. 분산을 더하는 것은 예측 단계에서 process noise 를 더할 때의 일이고, 평균이나 한쪽 값을 따르는 것이 아니다.

- topic: kalman-gain
  title: Kalman gain
  variants:
    - question: |
        면접관: "Kalman gain 이 1 에 가까워지는 것은 어떤 상황인가요?"
      choices:
        - 'motion model 이 아주 정확해서 예측의 불확실성이 매우 작을 때'
        - '로봇이 멈춰 있어서 속도가 0 일 때'
        - '측정값이 예측과 정확히 같을 때'
        - '센서가 아주 정확해서 측정 noise 가 예측의 불확실성보다 훨씬 작을 때'
      answer: 3
      explanation: |
        gain 은 예측의 분산 ÷ (예측의 분산 + 측정의 분산)이라서, 측정의 분산이 작을수록 1 에 가까워지고 추정이 측정값 쪽으로 거의 다 옮겨 간다.
        예측이 아주 정확하면 반대로 0 에 가까워진다. gain 은 분산으로 정해지므로 속도가 0 인지, 측정과 예측이 같은지와는 관계없다.
    - question: |
        예측은 10 m(분산 3), 측정은 14 m(분산 1)다. Kalman filter 가 보정한 위치로 가장 알맞은 것은?
      choices:
        - '10 m. 예측이 먼저 계산되므로 예측을 따른다'
        - '12 m. 두 값의 가운데를 고른다'
        - '13 m. 측정이 더 정확해서 gain 0.75 만큼 측정 쪽으로 간다'
        - '14 m. 측정이 있으면 항상 측정을 따른다'
      answer: 2
      explanation: |
        gain 은 $3 \div (3 + 1) = 0.75$ 이고, 보정한 위치는 $10 + 0.75 \times (14 - 10) = 13$ m 다. 가운데 12 m 는 두 분산이 같을 때의 답이고, 측정을
        그대로 따르는 것은 측정 분산이 0 일 때뿐이다. 예측을 그대로 쓰면 측정 정보를 버리는 셈이다.
    - question: |
        면접관: "GPS 가 나무 아래에서 평소보다 훨씬 많이 튄다는 것을 알고 측정 noise 값 R 을 키웠습니다. 추정은 어떻게 바뀌나요?"
      choices:
        - 'gain 이 작아져 GPS 측정을 덜 믿고, 추정이 motion model 의 예측 쪽에 더 가깝게 남는다'
        - 'gain 이 커져 GPS 측정을 더 강하게 따른다'
        - 'gain 은 그대로이고 예측의 불확실성만 커진다'
        - 'R 은 예측 단계에만 쓰여서 보정 결과는 바뀌지 않는다'
      answer: 0
      explanation: |
        측정의 분산 R 이 커지면 gain = 예측 분산 ÷ (예측 분산 + R) 이 작아져서 측정 쪽으로 덜 움직인다. R 은 보정 단계의 gain 계산에 쓰이고, 예측
        단계에서 불확실성을 키우는 것은 process noise Q 다.

- topic: uncertainty
  title: 값과 불확실성을 함께 추정하는 이유
  variants:
    - question: |
        면접관: "Kalman filter 가 상태의 추정값뿐 아니라 공분산(불확실성)까지 함께 들고 다니는 이유는 무엇인가요?"
      choices:
        - '출력 메시지의 형식을 맞추기 위해서일 뿐 계산에는 쓰이지 않는다'
        - '새 정보가 들어올 때 예측과 측정을 얼마나 믿을지, 곧 gain 을 정하는 데 필요하기 때문이다'
        - '공분산이 클수록 로봇의 속도를 줄이도록 controller 에 전달하기 위해서다'
        - '센서의 sampling rate 를 계산하는 데 쓰기 위해서다'
      answer: 1
      explanation: |
        gain 은 예측의 불확실성과 측정의 불확실성의 비율로 정해지므로, 불확실성을 알아야 두 정보를 어떻게 섞을지 정할 수 있다. 공분산을 다른
        node 가 참고할 수도 있지만 그것이 들고 다니는 이유는 아니고, sampling rate 와는 관계없다.
    - question: |
        면접관: "Kalman filter 에서 상태를 Gaussian 으로 나타낸다는 것은 무슨 뜻인가요?"
      choices:
        - '상태가 시간에 따라 sin 곡선처럼 변한다고 가정한다는 뜻이다'
        - '센서 값이 항상 0 을 중심으로 나온다는 뜻이다'
        - '상태를 정수로만 표현한다는 뜻이다'
        - '가장 그럴듯한 값(평균)과 그 주변으로 퍼진 정도(분산·공분산)로 믿음을 표현한다는 뜻이다'
      answer: 3
      explanation: |
        Gaussian 은 평균 하나와 퍼진 정도로 정해지는 종 모양 분포다. Kalman filter 는 상태에 대한 믿음을 이 모양으로 두고 평균과 공분산만 고쳐
        나간다. 시간에 따른 변화 모양이나 센서 값의 중심, 정수 표현과는 관계없다.
    - question: |
        면접관: "Kalman filter 가 최적의 추정을 준다고 할 때, 전제가 되는 가정은 무엇인가요?"
      choices:
        - '센서가 하나뿐이어야 한다'
        - '로봇이 정지해 있어야 한다'
        - 'motion model 과 measurement model 이 선형이고, noise 가 Gaussian 이어야 한다'
        - 'sampling rate 가 1 kHz 이상이어야 한다'
      answer: 2
      explanation: |
        Kalman filter 는 상태 변화와 측정이 선형 관계이고 noise 가 Gaussian 일 때 최적이다. 이 가정이 깨지면 EKF·UKF 같은 근사나 particle filter
        를 쓴다. 센서 개수, 정지 여부, 주기는 최적성의 조건이 아니다.

- topic: ekf
  title: 비선형 시스템과 EKF·UKF
  variants:
    - question: |
        면접관: "바닥 위를 도는 mobile robot 의 위치 추정에 기본 Kalman filter 대신 EKF 를 쓰는 이유는 무엇인가요?"
      choices:
        - '로봇의 heading 에 따라 이동이 sin·cos 로 휘어지는 비선형 motion model 이라서, 현재 추정 근처에서 선형화해야 하기 때문이다'
        - 'EKF 가 기본 Kalman filter 보다 항상 계산량이 적기 때문이다'
        - 'EKF 는 측정 없이도 오차가 쌓이지 않기 때문이다'
        - '기본 Kalman filter 는 센서를 하나만 받을 수 있기 때문이다'
      answer: 0
      explanation: |
        heading 이 있는 로봇은 같은 전진 명령이 x·y 로 나뉘는 방식이 각도의 sin·cos 로 정해져 motion model 이 비선형이다. EKF 는 Jacobian 으로 현재
        추정 근처에서 선형화해 Kalman filter 의 식을 그대로 쓴다. 계산량은 오히려 Jacobian 만큼 늘고, 측정이 없으면 EKF 도 오차가 쌓이며, 기본
        Kalman filter 도 여러 센서를 받을 수 있다.
    - question: |
        면접관: "EKF 와 UKF 의 차이를 한 문장으로 말해 보세요."
      choices:
        - 'EKF 는 위치만, UKF 는 속도만 추정한다'
        - 'EKF 는 Jacobian 으로 비선형 함수를 한 점에서 선형화하고, UKF 는 sigma point 몇 개를 비선형 함수에 그대로 통과시켜 분포를 다시 구한다'
        - 'UKF 는 Gaussian 가정을 버리고 수천 개의 sample 로 분포를 표현한다'
        - '둘은 이름만 다르고 계산은 같다'
      answer: 1
      explanation: |
        EKF 는 현재 추정에서 Jacobian 으로 선형화하고, UKF 는 골라 뽑은 sigma point 를 비선형 함수에 통과시켜 평균과 공분산을 다시 계산한다. UKF 는
        Jacobian 이 필요 없고 비선형이 강할 때 더 정확한 대신 계산이 더 많다. 수천 개 sample 로 분포를 표현하는 것은 particle filter 다.
    - question: |
        면접관: "EKF 가 잘 맞지 않거나 발산할 수 있는 상황은 어떤 경우인가요?"
      choices:
        - '센서 noise 가 아주 작을 때'
        - '로봇이 직선으로만 움직일 때'
        - '상태의 개수가 2 개 이하일 때'
        - '비선형이 강하거나 초기 추정이 실제와 멀어서, 추정 근처에서 직선으로 근사한 것이 실제 관계와 크게 다를 때'
      answer: 3
      explanation: |
        EKF 는 현재 추정 근처의 선형 근사를 믿으므로, 비선형이 강하거나 추정이 실제에서 멀면 근사가 틀려 오차가 커지거나 발산할 수 있다. 직선 운동은
        오히려 선형이라 잘 맞고, noise 가 작거나 상태가 적은 것은 실패 원인이 아니다.

- topic: sensor-fusion
  title: 센서 퓨전
  variants:
    - question: |
        면접관: "wheel odometry 와 GPS 를 함께 fusion 하는 이유는 무엇인가요?"
      choices:
        - '두 센서의 값이 항상 같아서 하나가 고장 났는지 확인하려고'
        - 'GPS 가 속도를, odometry 가 지구 위의 절대 위치를 재기 때문에'
        - 'odometry 는 짧게는 매끄럽지만 오차가 쌓이고, GPS 는 오차가 쌓이지 않지만 순간순간 튀어서, 서로의 약점을 보완하기 때문에'
        - 'fusion 하면 센서의 sampling rate 가 두 배가 되기 때문에'
      answer: 2
      explanation: |
        odometry 는 상대 이동을 적분해 drift 가 쌓이고, GPS 는 절대 위치를 주지만 noise 가 크다. 둘을 불확실성에 따라 섞으면 매끄러우면서도 drift
        가 없는 추정을 얻는다. 절대 위치를 주는 쪽은 GPS 이고, fusion 이 sampling rate 를 늘리지는 않는다.
    - question: |
        면접관: "ROS 의 robot_localization 에서 odom frame 과 map frame 의 추정을 나눠서 두 EKF 로 돌리는 이유는 무엇인가요?"
      choices:
        - 'odom frame 은 연속적이지만 drift 가 쌓이고, map frame 은 GPS 같은 절대 측정 때문에 정확하지만 값이 튈 수 있어서, 용도에 맞게 나누려고'
        - 'EKF 하나는 상태를 15 개까지만 추정할 수 있어서'
        - 'odom frame 은 2D, map frame 은 3D 전용이라서'
        - '두 frame 은 같은 값이지만 메시지 형식이 달라서'
      answer: 0
      explanation: |
        odom frame 추정은 바퀴·IMU 처럼 연속적인 측정만 써서 끊김 없이 매끄럽고, 짧은 시간의 제어에 적합하다. map frame 추정은 GPS 같은 절대 측정을
        더해 전체적으로 정확하지만 측정이 들어올 때 값이 튈 수 있다. 상태 개수 제한이나 차원, 메시지 형식 때문에 나누는 것이 아니다.
    - question: |
        면접관: "IMU 만으로 위치를 오래 추정하면 어떤 문제가 생기나요?"
      choices:
        - 'IMU 는 위치를 직접 재므로 문제가 없다'
        - '가속도를 두 번 적분해 위치를 구하므로 작은 bias 도 시간이 지날수록 크게 쌓여 drift 가 빠르게 커진다'
        - 'IMU 는 회전을 잴 수 없어서 방향을 모른다'
        - 'IMU 의 noise 는 시간이 지나면 저절로 0 으로 수렴한다'
      answer: 1
      explanation: |
        IMU 는 가속도와 각속도를 재므로 위치를 얻으려면 가속도를 두 번 적분해야 하고, 작은 bias 도 시간의 제곱에 비례해 위치 오차로 커진다. 그래서
        GPS·카메라·LiDAR 같은 절대 측정과 fusion 한다. IMU 는 위치를 직접 재지 않고, gyroscope 로 회전을 재며, noise 가 저절로 사라지지 않는다.

- topic: kf-limits
  title: Kalman filter 의 한계
  variants:
    - question: |
        면접관: "똑같이 생긴 복도가 두 개인 건물에서 로봇이 자기 위치를 전혀 모르는 상태로 시작합니다. 기본 Kalman filter 가 이 상황에 맞지 않는 이유는?"
      choices:
        - 'Kalman filter 는 실내에서 동작하지 않기 때문이다'
        - '센서가 카메라라서 Kalman filter 에 넣을 수 없기 때문이다'
        - '복도가 직선이라 선형 모델을 쓸 수 없기 때문이다'
        - '믿음이 "왼쪽 복도 아니면 오른쪽 복도" 처럼 봉우리가 둘인데, Kalman filter 는 봉우리 하나인 Gaussian 만 표현할 수 있기 때문이다'
      answer: 3
      explanation: |
        Kalman filter 는 믿음을 Gaussian 하나로 두므로 봉우리가 여럿인 믿음을 표현할 수 없다. 이런 global localization 에는 sample 을 많이 뿌려
        어떤 모양의 분포든 표현하는 particle filter 를 쓴다. 실내외나 센서 종류, 직선 복도는 문제의 원인이 아니다.
    - question: |
        면접관: "Kalman filter 의 Q(process noise)를 실제보다 아주 작게 잡으면 어떤 일이 생기나요?"
      choices:
        - '예측을 지나치게 믿어 측정을 거의 반영하지 않게 되고, 실제 움직임이 모델과 다르면 추정이 뒤처지거나 틀린 채로 굳는다'
        - '측정을 지나치게 믿어 추정이 측정 noise 만큼 크게 흔들린다'
        - '계산이 빨라질 뿐 추정 결과는 같다'
        - 'filter 가 바로 발산해 값이 무한대가 된다'
      answer: 0
      explanation: |
        Q 가 작으면 예측의 불확실성이 작게 유지되어 gain 이 작아지고, 측정을 거의 반영하지 않는다. 바퀴가 미끄러지는 등 모델이 틀려도 고치지 못해
        추정이 실제를 따라가지 못한다. 측정을 지나치게 믿는 것은 Q 를 크게 잡거나 R 을 작게 잡았을 때의 일이다.
    - question: |
        면접관: "센서 하나가 가끔 완전히 엉뚱한 값(outlier)을 냅니다. Kalman filter 에 그대로 넣으면 어떻게 되고, 흔히 어떻게 막나요?"
      choices:
        - 'Kalman filter 는 outlier 를 자동으로 무시하므로 아무 문제 없다'
        - 'outlier 는 예측 단계에서만 영향을 주므로 보정 결과는 그대로다'
        - 'Gaussian noise 가정에서 벗어난 값이라 추정이 크게 끌려가므로, 측정과 예측의 차이가 불확실성에 비해 너무 크면 그 측정을 버리는 gating 을 쓴다'
        - 'outlier 가 들어오면 Q 를 0 으로 바꿔 해결한다'
      answer: 2
      explanation: |
        Kalman filter 는 noise 가 Gaussian 이라고 가정해서, 그 가정에서 크게 벗어난 outlier 도 gain 만큼 그대로 반영해 추정이 끌려간다. 그래서
        측정과 예측의 차이(innovation)를 그 불확실성으로 나눈 거리가 문턱을 넘으면 측정을 버리는 gating(예: Mahalanobis distance 문턱)을 흔히 쓴다.
