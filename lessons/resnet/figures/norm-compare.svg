  <title>BatchNorm, GroupNorm, FrozenBatchNorm 이 평균과 분산을 구하는 값. 가로는 channel 8 개, 세로는 batch 의 사진 4 장이고 한 칸이 feature map 한 장이다. BatchNorm 은 channel 하나를 batch 의 모든 사진에서 모으고, GroupNorm 은 사진 한 장 안에서 channel 묶음 하나(그림은 4 개씩 묶은 예)를 모으며, FrozenBatchNorm 은 모으지 않고 저장해 둔 평균 2, 분산 4, γ = 3, β = 1 로 입력 6 을 7 로 바꾼다</title>
