  <rect x="335" y="70" width="190" height="120" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="94" fill="#e2e8f0" font-size="13" text-anchor="middle">filter weight (2, −1)</text>
  <text x="430" y="120" fill="#38bdf8" font-size="13" text-anchor="middle">칸 (0, 0): 2 × 3 + (−1) × 1</text>
  <text x="430" y="142" fill="#38bdf8" font-size="13" text-anchor="middle">= 6 − 1 = 5</text>
  <text x="430" y="170" fill="#94a3b8" font-size="12" text-anchor="middle">channel 끼리만 곱해 더한다</text>
  <line x1="525" y1="130" x2="565" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="625" y="62" fill="#34d399" font-size="13" text-anchor="middle">출력 2×2</text>
