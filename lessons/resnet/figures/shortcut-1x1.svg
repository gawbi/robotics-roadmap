  <text x="360" y="262" fill="#e2e8f0" font-size="13" text-anchor="middle">출력 크기 ⌊(4 + 0 − 1) ÷ 2⌋ + 1 = 2.  filter 를 128 개 두면 출력 channel 도 128 장</text>
  <text x="360" y="292" fill="#94a3b8" font-size="13" text-anchor="middle">64 → 128 channel 의 shortcut: weight 128 × 64 = 8,192 개</text>
