<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>BasicBlock 과 bottleneck block 의 weight 수. 64 channel 의 BasicBlock 은 3×3 conv 두 개로 36,864 + 36,864 = 73,728 개, 256 channel 의 bottleneck block 은 1×1 conv 로 64 channel 로 줄이고 3×3 conv 를 지난 뒤 1×1 conv 로 256 channel 로 되돌려 16,384 + 36,864 + 16,384 = 69,632 개다. 256 channel 에 3×3 conv 두 개를 그대로 쓰면 1,179,648 개다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="468" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190" y="34" fill="#e2e8f0" font-size="15" text-anchor="middle">BasicBlock (ResNet-18·34)</text>
  <text x="530" y="34" fill="#e2e8f0" font-size="15" text-anchor="middle">bottleneck block (ResNet-50 이상)</text>
  <line x1="360" y1="22" x2="360" y2="420" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="130.0" y="52" width="120" height="36" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="190" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">입력 64 ch</text>
  <line x1="190" y1="88" x2="190" y2="112" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="95.0" y="114" width="190" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="190" y="134.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3×3 conv, 64</text>
  <text x="190" y="152.0" fill="#38bdf8" font-size="12" text-anchor="middle">64 × 64 × 9 = 36,864</text>
  <line x1="190" y1="160" x2="190" y2="186" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="95.0" y="188" width="190" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="190" y="208.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3×3 conv, 64</text>
  <text x="190" y="226.0" fill="#38bdf8" font-size="12" text-anchor="middle">64 × 64 × 9 = 36,864</text>
  <line x1="190" y1="234" x2="190" y2="318" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <circle cx="190" cy="334" r="14" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="190" y="339" fill="#e2e8f0" font-size="16" text-anchor="middle">+</text>
  <path d="M250,70 L305,70 L305,334 L206,334" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="312" y="200" fill="#f59e0b" font-size="13" text-anchor="start">x</text>
  <line x1="190" y1="348" x2="190" y2="368" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="190" y="386" fill="#e2e8f0" font-size="13" text-anchor="middle">출력 64 ch</text>
  <text x="190" y="414" fill="#34d399" font-size="14" text-anchor="middle">weight 73,728 개</text>
  <rect x="470.0" y="52" width="120" height="36" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="530" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">입력 256 ch</text>
  <line x1="530" y1="88" x2="530" y2="104" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="435.0" y="106" width="190" height="46" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="530" y="126.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1×1 conv, 64 (줄임)</text>
  <text x="530" y="144.0" fill="#a78bfa" font-size="12" text-anchor="middle">256 × 64 = 16,384</text>
  <line x1="530" y1="152" x2="530" y2="166" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="435.0" y="168" width="190" height="46" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="530" y="188.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3×3 conv, 64</text>
  <text x="530" y="206.0" fill="#38bdf8" font-size="12" text-anchor="middle">64 × 64 × 9 = 36,864</text>
  <line x1="530" y1="214" x2="530" y2="228" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="435.0" y="230" width="190" height="46" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="530" y="250.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1×1 conv, 256 (되돌림)</text>
  <text x="530" y="268.0" fill="#a78bfa" font-size="12" text-anchor="middle">64 × 256 = 16,384</text>
  <line x1="530" y1="276" x2="530" y2="318" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <circle cx="530" cy="334" r="14" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="530" y="339" fill="#e2e8f0" font-size="16" text-anchor="middle">+</text>
  <path d="M590,70 L650,70 L650,334 L546,334" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="657" y="200" fill="#f59e0b" font-size="13" text-anchor="start">x</text>
  <line x1="530" y1="348" x2="530" y2="368" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="530" y="386" fill="#e2e8f0" font-size="13" text-anchor="middle">출력 256 ch</text>
  <text x="530" y="414" fill="#34d399" font-size="14" text-anchor="middle">weight 69,632 개</text>
  <text x="360" y="450" fill="#94a3b8" font-size="13" text-anchor="middle">256 channel 에 3×3 conv 두 개를 그대로 쓰면 256 × 256 × 9 × 2 = 1,179,648 개</text>
</svg>
