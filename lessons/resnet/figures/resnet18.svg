<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ResNet-18 의 stage 별 출력 모양. stem 이 해상도를 1/4 로 줄이고, layer2·3·4 의 첫 block 이 해상도를 반으로 줄이며 channel 을 두 배로 늘린다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="388" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="15.0" y="44.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="67" fill="#e2e8f0" font-size="15" text-anchor="middle">입력 이미지</text>
  <text x="90" y="88" fill="#7cb4d8" font-size="14" text-anchor="middle">(3, 224, 224)</text>
  <line x1="165" y1="72" x2="225" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="225.0" y="44.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="67" fill="#e2e8f0" font-size="15" text-anchor="middle">stem</text>
  <text x="300" y="88" fill="#7cb4d8" font-size="14" text-anchor="middle">(64, 56, 56)</text>
  <text x="300" y="118" fill="#94a3b8" font-size="13" text-anchor="middle">conv 7×7/2 → BN → ReLU</text>
  <text x="300" y="136" fill="#94a3b8" font-size="13" text-anchor="middle">→ maxpool 3×3/2</text>
  <line x1="375" y1="72" x2="435" y2="72" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="435.0" y="44.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="67" fill="#e2e8f0" font-size="15" text-anchor="middle">layer1 · block ×2</text>
  <text x="510" y="88" fill="#7cb4d8" font-size="14" text-anchor="middle">(64, 56, 56)</text>
  <line x1="510" y1="100" x2="510" y2="172" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="435.0" y="172.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="195" fill="#e2e8f0" font-size="15" text-anchor="middle">layer2 · block ×2</text>
  <text x="510" y="216" fill="#7cb4d8" font-size="14" text-anchor="middle">(128, 28, 28)</text>
  <line x1="435" y1="200" x2="375" y2="200" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="225.0" y="172.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="195" fill="#e2e8f0" font-size="15" text-anchor="middle">layer3 · block ×2</text>
  <text x="300" y="216" fill="#7cb4d8" font-size="14" text-anchor="middle">(256, 14, 14)</text>
  <line x1="225" y1="200" x2="165" y2="200" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="15.0" y="172.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="90" y="195" fill="#e2e8f0" font-size="15" text-anchor="middle">layer4 · block ×2</text>
  <text x="90" y="216" fill="#7fc4a2" font-size="14" text-anchor="middle">(512, 7, 7)</text>
  <text x="90" y="246" fill="#7fc4a2" font-size="13" text-anchor="middle">마지막 feature map</text>
  <line x1="90" y1="260" x2="90" y2="300" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="15.0" y="300.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="90" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">global avg pool</text>
  <text x="90" y="344" fill="#7cb4d8" font-size="14" text-anchor="middle">(512,)</text>
  <line x1="165" y1="328" x2="225" y2="328" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="225.0" y="300.0" width="150" height="56" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="300" y="323" fill="#e2e8f0" font-size="15" text-anchor="middle">fc</text>
  <text x="300" y="344" fill="#d6aa62" font-size="14" text-anchor="middle">(1000,)</text>
  <text x="470" y="316" fill="#94a3b8" font-size="13" text-anchor="start">conv 1 (stem)</text>
  <text x="470" y="336" fill="#94a3b8" font-size="13" text-anchor="start">+ block 8 × conv 2</text>
  <text x="470" y="356" fill="#94a3b8" font-size="13" text-anchor="start">+ fc 1 = 18 층</text>
</svg>
