<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>batch 크기에 따른 BatchNorm 정규화 결과</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="40" fill="#94a3b8" font-size="13" text-anchor="start">batch</text>
  <text x="140" y="40" fill="#94a3b8" font-size="13" text-anchor="start">입력</text>
  <text x="260" y="40" fill="#94a3b8" font-size="13" text-anchor="start">통계</text>
  <text x="420" y="40" fill="#94a3b8" font-size="13" text-anchor="start">x̂</text>
  <text x="560" y="40" fill="#94a3b8" font-size="13" text-anchor="start">결과</text>
  <line x1="20" y1="56" x2="700" y2="56" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="80" fill="#e2e8f0" font-size="13" text-anchor="start">batch 1 장</text>
  <text x="140" y="80" fill="#e2e8f0" font-size="13" text-anchor="start">5</text>
  <text x="260" y="80" fill="#94a3b8" font-size="13" text-anchor="start">평균 5, 분산 0</text>
  <text x="420" y="80" fill="#d88b8b" font-size="13" text-anchor="start">0</text>
  <text x="560" y="80" fill="#d88b8b" font-size="13" text-anchor="start">무엇을 넣어도 0</text>
  <line x1="20" y1="108" x2="700" y2="108" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="132" fill="#e2e8f0" font-size="13" text-anchor="start">batch 2 장</text>
  <text x="140" y="132" fill="#e2e8f0" font-size="13" text-anchor="start">1, 3</text>
  <text x="260" y="132" fill="#94a3b8" font-size="13" text-anchor="start">평균 2, 분산 1</text>
  <text x="420" y="132" fill="#d6aa62" font-size="13" text-anchor="start">−1, 1</text>
  <text x="560" y="132" fill="#d6aa62" font-size="13" text-anchor="start">무엇을 넣어도 −1, 1</text>
  <line x1="20" y1="160" x2="700" y2="160" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="184" fill="#e2e8f0" font-size="13" text-anchor="start"></text>
  <text x="140" y="184" fill="#e2e8f0" font-size="13" text-anchor="start">100, 102</text>
  <text x="260" y="184" fill="#94a3b8" font-size="13" text-anchor="start">평균 101, 분산 1</text>
  <text x="420" y="184" fill="#d6aa62" font-size="13" text-anchor="start">−1, 1</text>
  <text x="560" y="184" fill="#d6aa62" font-size="13" text-anchor="start">1 과 100 이 같은 −1</text>
  <line x1="20" y1="212" x2="700" y2="212" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="236" fill="#e2e8f0" font-size="13" text-anchor="start">batch 4 장</text>
  <text x="140" y="236" fill="#e2e8f0" font-size="13" text-anchor="start">1, 2, 3, 6</text>
  <text x="260" y="236" fill="#94a3b8" font-size="13" text-anchor="start">평균 3, 분산 3.5</text>
  <text x="420" y="236" fill="#7fc4a2" font-size="13" text-anchor="start">−1.07, −0.53, 0, 1.60</text>
  <text x="560" y="236" fill="#7fc4a2" font-size="13" text-anchor="start">값 사이의 차이가 남음</text>
  <text x="360" y="280" fill="#7cb4d8" font-size="13" text-anchor="middle">평가 때는 batch 통계 대신 학습 중 쌓아 둔 평균과 분산을 쓴다</text>
</svg>
