<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇 policy 의 ResNet-18 image encoder. ACT 는 480×640 사진을 ImageNet pretrained ResNet-18(FrozenBatchNorm)에 넣어 layer4 의 512×15×20 feature map 을 얻고, 1×1 conv 를 거쳐 512 개 숫자짜리 token 300 개로 쓴다. Diffusion Policy 는 96×96 PushT 사진을 layer4 의 512×3×3 으로 줄인 뒤 spatial softmax 로 keypoint 32 개, 숫자로는 64 개를 만든다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="40" fill="#f59e0b" font-size="16" text-anchor="start" font-weight="600">ACT</text>
  <rect x="25.0" y="62" width="120" height="56" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="85" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">카메라 사진</text>
  <text x="85" y="105.0" fill="#38bdf8" font-size="12" text-anchor="middle">3 × 480 × 640</text>
  <line x1="147" y1="90" x2="175" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="177.0" y="62" width="186" height="56" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="87.0" fill="#e2e8f0" font-size="13" text-anchor="middle">ResNet-18 (stem ~ layer4)</text>
  <text x="270" y="105.0" fill="#f59e0b" font-size="12" text-anchor="middle">ImageNet weight, FrozenBN</text>
  <line x1="365" y1="90" x2="393" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="395.0" y="62" width="130" height="56" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="460" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">feature map</text>
  <text x="460" y="105.0" fill="#34d399" font-size="12" text-anchor="middle">512 × 15 × 20</text>
  <line x1="527" y1="90" x2="555" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="557.0" y="62" width="150" height="56" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="632" y="87.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1×1 conv → token</text>
  <text x="632" y="105.0" fill="#f59e0b" font-size="12" text-anchor="middle">300 개 × 512</text>
  <text x="360" y="144" fill="#94a3b8" font-size="12" text-anchor="middle">15 × 20 = 300 칸이 칸마다 위치를 가진 token 이 된다. 카메라 4 대면 token 1,200 개</text>
  <line x1="24" y1="186" x2="696" y2="186" stroke="#1e293b" stroke-width="1.5"/>
  <text x="30" y="222" fill="#a78bfa" font-size="16" text-anchor="start" font-weight="600">Diffusion Policy</text>
  <rect x="25.0" y="244" width="120" height="56" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="85" y="269.0" fill="#e2e8f0" font-size="14" text-anchor="middle">PushT 사진</text>
  <text x="85" y="287.0" fill="#38bdf8" font-size="12" text-anchor="middle">3 × 96 × 96</text>
  <line x1="147" y1="272" x2="175" y2="272" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="177.0" y="244" width="186" height="56" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="270" y="269.0" fill="#e2e8f0" font-size="13" text-anchor="middle">ResNet-18 (stem ~ layer4)</text>
  <text x="270" y="287.0" fill="#a78bfa" font-size="12" text-anchor="middle">논문: 처음부터, GroupNorm</text>
  <line x1="365" y1="272" x2="393" y2="272" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="395.0" y="244" width="130" height="56" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="460" y="269.0" fill="#e2e8f0" font-size="14" text-anchor="middle">feature map</text>
  <text x="460" y="287.0" fill="#34d399" font-size="12" text-anchor="middle">512 × 3 × 3</text>
  <line x1="527" y1="272" x2="555" y2="272" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="557.0" y="244" width="150" height="56" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="632" y="269.0" fill="#e2e8f0" font-size="13" text-anchor="middle">spatial softmax</text>
  <text x="632" y="287.0" fill="#a78bfa" font-size="12" text-anchor="middle">keypoint 32 개, 숫자 64 개</text>
  <text x="360" y="326" fill="#94a3b8" font-size="12" text-anchor="middle">global average pooling 자리에 위치 (x, y) 를 뽑는 spatial softmax 를 둔다</text>
  <text x="360" y="348" fill="#94a3b8" font-size="12" text-anchor="middle">LeRobot 기본값은 ImageNet weight 와 BatchNorm</text>
</svg>
