<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사진 2 장의 0 번 channel 8 칸으로 평균과 분산을 구한다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="120" y="40" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 1</text>
  <text x="78" y="64" fill="#38bdf8" font-size="12" text-anchor="middle">channel 0</text>
  <text x="162" y="64" fill="#94a3b8" font-size="12" text-anchor="middle">channel 1</text>
  <rect x="44" y="74" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="61.0" y="96.0" fill="#38bdf8" font-size="14" text-anchor="middle">2</text>
  <rect x="78" y="74" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="95.0" y="96.0" fill="#38bdf8" font-size="14" text-anchor="middle">6</text>
  <rect x="44" y="108" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="61.0" y="130.0" fill="#38bdf8" font-size="14" text-anchor="middle">6</text>
  <rect x="78" y="108" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="95.0" y="130.0" fill="#38bdf8" font-size="14" text-anchor="middle">2</text>
  <rect x="130" y="74" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="147.0" y="96.0" fill="#94a3b8" font-size="14" text-anchor="middle">1</text>
  <rect x="164" y="74" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="181.0" y="96.0" fill="#94a3b8" font-size="14" text-anchor="middle">0</text>
  <rect x="130" y="108" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="147.0" y="130.0" fill="#94a3b8" font-size="14" text-anchor="middle">3</text>
  <rect x="164" y="108" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="181.0" y="130.0" fill="#94a3b8" font-size="14" text-anchor="middle">4</text>
  <text x="330" y="40" fill="#e2e8f0" font-size="14" text-anchor="middle">사진 2</text>
  <text x="288" y="64" fill="#38bdf8" font-size="12" text-anchor="middle">channel 0</text>
  <text x="372" y="64" fill="#94a3b8" font-size="12" text-anchor="middle">channel 1</text>
  <rect x="254" y="74" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="271.0" y="96.0" fill="#38bdf8" font-size="14" text-anchor="middle">6</text>
  <rect x="288" y="74" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="305.0" y="96.0" fill="#38bdf8" font-size="14" text-anchor="middle">2</text>
  <rect x="254" y="108" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="271.0" y="130.0" fill="#38bdf8" font-size="14" text-anchor="middle">2</text>
  <rect x="288" y="108" width="34" height="34" fill="#0c2a3a" stroke="#38bdf8" stroke-width="1"/>
  <text x="305.0" y="130.0" fill="#38bdf8" font-size="14" text-anchor="middle">6</text>
  <rect x="340" y="74" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="357.0" y="96.0" fill="#94a3b8" font-size="14" text-anchor="middle">5</text>
  <rect x="374" y="74" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="391.0" y="96.0" fill="#94a3b8" font-size="14" text-anchor="middle">2</text>
  <rect x="340" y="108" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="357.0" y="130.0" fill="#94a3b8" font-size="14" text-anchor="middle">1</text>
  <rect x="374" y="108" width="34" height="34" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="391.0" y="130.0" fill="#94a3b8" font-size="14" text-anchor="middle">0</text>
  <text x="470" y="60" fill="#38bdf8" font-size="13" text-anchor="start">channel 0 에서 모은 값 8 개</text>
  <text x="470" y="84" fill="#38bdf8" font-size="13" text-anchor="start">2, 6, 6, 2, 6, 2, 2, 6</text>
  <text x="470" y="112" fill="#e2e8f0" font-size="13" text-anchor="start">평균 μ = 32 ÷ 8 = 4</text>
  <text x="470" y="136" fill="#e2e8f0" font-size="13" text-anchor="start">분산 σ² = (4 × 8) ÷ 8 = 4</text>
  <text x="470" y="160" fill="#34d399" font-size="13" text-anchor="start">2 → (2 − 4) ÷ 2 = −1</text>
  <text x="470" y="184" fill="#34d399" font-size="13" text-anchor="start">6 → (6 − 4) ÷ 2 = 1</text>
  <text x="40" y="190" fill="#94a3b8" font-size="13" text-anchor="start">channel 1 의 8 칸(회색)은 따로 모아 자기 평균과 분산을 구한다</text>
  <text x="40" y="226" fill="#e2e8f0" font-size="13" text-anchor="start">모으는 값의 개수 = N × H × W = 사진 2 장 × 2 × 2 = 8</text>
  <text x="40" y="252" fill="#e2e8f0" font-size="13" text-anchor="start">μ, σ², γ, β 는 channel 마다 하나씩 = channel 수 C 개</text>
  <text x="40" y="290" fill="#94a3b8" font-size="13" text-anchor="start">batch 32 장, 56×56 이면 channel 하나에 32 × 56 × 56 = 100,352 개 값</text>
</svg>
