<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ImageNet 검증 사진의 top-1 error</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="80" y="40" width="420" height="240" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="80" y1="280.0" x2="500" y2="280.0" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="284.0" fill="#64748b" font-size="12" text-anchor="end">24%</text>
  <line x1="80" y1="236.36363636363637" x2="500" y2="236.36363636363637" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="240.36363636363637" fill="#64748b" font-size="12" text-anchor="end">25%</text>
  <line x1="80" y1="192.72727272727275" x2="500" y2="192.72727272727275" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="196.72727272727275" fill="#64748b" font-size="12" text-anchor="end">26%</text>
  <line x1="80" y1="149.0909090909091" x2="500" y2="149.0909090909091" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="153.0909090909091" fill="#64748b" font-size="12" text-anchor="end">27%</text>
  <line x1="80" y1="105.45454545454547" x2="500" y2="105.45454545454547" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="109.45454545454547" fill="#64748b" font-size="12" text-anchor="end">28%</text>
  <line x1="80" y1="61.81818181818181" x2="500" y2="61.81818181818181" stroke="#1e293b" stroke-width="1"/>
  <text x="72" y="65.81818181818181" fill="#64748b" font-size="12" text-anchor="end">29%</text>
  <rect x="110" y="108.1" width="60" height="171.9" fill="#94a3b8" fill-opacity="0.85"/>
  <text x="140" y="100.0727272727272" fill="#94a3b8" font-size="13" text-anchor="middle">27.94%</text>
  <text x="140" y="300" fill="#e2e8f0" font-size="13" text-anchor="middle">plain 18</text>
  <rect x="210" y="81.9" width="60" height="198.1" fill="#f87171" fill-opacity="0.85"/>
  <text x="240" y="73.8909090909091" fill="#f87171" font-size="13" text-anchor="middle">28.54%</text>
  <text x="240" y="300" fill="#e2e8f0" font-size="13" text-anchor="middle">plain 34</text>
  <rect x="310" y="110.7" width="60" height="169.3" fill="#38bdf8" fill-opacity="0.85"/>
  <text x="340" y="102.69090909090912" fill="#38bdf8" font-size="13" text-anchor="middle">27.88%</text>
  <text x="340" y="300" fill="#e2e8f0" font-size="13" text-anchor="middle">ResNet 18</text>
  <rect x="410" y="235.1" width="60" height="44.9" fill="#34d399" fill-opacity="0.85"/>
  <text x="440" y="227.0545454545454" fill="#34d399" font-size="13" text-anchor="middle">25.03%</text>
  <text x="440" y="300" fill="#e2e8f0" font-size="13" text-anchor="middle">ResNet 34</text>
