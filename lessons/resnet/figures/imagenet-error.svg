  <text x="530" y="90" fill="#e2e8f0" font-size="13" text-anchor="start">plain: 18 → 34 층</text>
  <text x="530" y="110" fill="#f87171" font-size="13" text-anchor="start">+0.60%p 나빠짐</text>
  <text x="530" y="150" fill="#e2e8f0" font-size="13" text-anchor="start">ResNet: 18 → 34 층</text>
  <text x="530" y="170" fill="#34d399" font-size="13" text-anchor="start">−2.85%p 좋아짐</text>
  <text x="530" y="215" fill="#94a3b8" font-size="12" text-anchor="start">두 망의 층 수와</text>
  <text x="530" y="233" fill="#94a3b8" font-size="12" text-anchor="start">parameter 수는 같다</text>
