<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>global average pooling 은 channel 마다 모든 칸의 평균을 낸다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="258" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="130" y="36" fill="#e2e8f0" font-size="14" text-anchor="middle">2×2 예</text>
  <rect x="80" y="56" width="48" height="48" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="104.0" y="85.0" fill="#e2e8f0" font-size="16" text-anchor="middle">1</text>
  <rect x="128" y="56" width="48" height="48" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="152.0" y="85.0" fill="#e2e8f0" font-size="16" text-anchor="middle">3</text>
  <rect x="80" y="104" width="48" height="48" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="104.0" y="133.0" fill="#e2e8f0" font-size="16" text-anchor="middle">5</text>
  <rect x="128" y="104" width="48" height="48" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="152.0" y="133.0" fill="#e2e8f0" font-size="16" text-anchor="middle">7</text>
  <line x1="184" y1="104" x2="234" y2="104" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="240" y="80" width="140" height="48" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="310" y="100" fill="#7fc4a2" font-size="13" text-anchor="middle">(1+3+5+7) ÷ 4</text>
  <text x="310" y="120" fill="#7fc4a2" font-size="14" text-anchor="middle">= 4</text>
  <text x="80" y="200" fill="#94a3b8" font-size="13" text-anchor="start">장 하나의 모든 칸을 평균해 숫자 하나로</text>
  <rect x="410" y="30" width="90" height="90" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.2"/>
  <rect x="420" y="40" width="90" height="90" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.2"/>
  <rect x="430" y="50" width="90" height="90" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.2"/>
  <rect x="440" y="60" width="90" height="90" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.2"/>
  <rect x="450" y="70" width="90" height="90" rx="2" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.2"/>
  <text x="480" y="184" fill="#7cb4d8" font-size="13" text-anchor="middle">layer4 출력 512 × 7 × 7</text>
  <text x="480" y="204" fill="#94a3b8" font-size="12" text-anchor="middle">512 장, 장마다 49 칸</text>
  <line x1="552" y1="90" x2="592" y2="90" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="598" y="30" width="104" height="150" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="650" y="58" fill="#7fc4a2" font-size="12" text-anchor="middle">장 1 의 평균</text>
  <text x="650" y="85" fill="#7fc4a2" font-size="12" text-anchor="middle">장 2 의 평균</text>
  <text x="650" y="112" fill="#7fc4a2" font-size="12" text-anchor="middle">장 3 의 평균</text>
  <text x="650" y="139" fill="#7fc4a2" font-size="12" text-anchor="middle">⋮</text>
  <text x="650" y="166" fill="#7fc4a2" font-size="12" text-anchor="middle">장 512 의 평균</text>
  <text x="650" y="204" fill="#7fc4a2" font-size="13" text-anchor="middle">숫자 512 개</text>
</svg>
