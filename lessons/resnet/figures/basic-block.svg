<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>BasicBlock. 3×3 conv 두 개로 된 경로가 F(x) 를 만들고, shortcut 이 입력을 그대로(모양이 바뀌면 1×1 conv 로 맞춰) 더한 뒤 ReLU 를 거친다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="518" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="300" y="30" fill="#e2e8f0" font-size="14" text-anchor="middle">layer2 의 첫 block — 64 → 128 channel, stride 2</text>
  <rect x="215.0" y="47.0" width="170" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="67" fill="#e2e8f0" font-size="15" text-anchor="middle">x</text>
  <text x="300" y="88" fill="#38bdf8" font-size="14" text-anchor="middle">(64, 56, 56)</text>
  <line x1="270" y1="97" x2="214" y2="130" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="330" y1="97" x2="446" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="105.0" y="133.0" width="190" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="153" fill="#e2e8f0" font-size="15" text-anchor="middle">conv 3×3, stride 2</text>
  <text x="200" y="174" fill="#38bdf8" font-size="14" text-anchor="middle">(128, 28, 28)</text>
  <line x1="200" y1="183" x2="200" y2="210" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="105.0" y="212.0" width="190" height="40" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="237" fill="#e2e8f0" font-size="15" text-anchor="middle">BatchNorm → ReLU</text>
  <line x1="200" y1="252" x2="200" y2="279" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="105.0" y="279.0" width="190" height="50" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="299" fill="#e2e8f0" font-size="15" text-anchor="middle">conv 3×3</text>
  <text x="200" y="320" fill="#38bdf8" font-size="14" text-anchor="middle">(128, 28, 28)</text>
  <line x1="200" y1="329" x2="200" y2="356" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="105.0" y="358.0" width="190" height="40" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200" y="383" fill="#e2e8f0" font-size="15" text-anchor="middle">BatchNorm</text>
  <text x="84" y="383" fill="#38bdf8" font-size="16" text-anchor="end">F(x)</text>
  <rect x="365.0" y="198.0" width="190" height="56" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="460" y="221" fill="#e2e8f0" font-size="15" text-anchor="middle">conv 1×1, stride 2</text>
  <text x="460" y="242" fill="#f59e0b" font-size="14" text-anchor="middle">→ BatchNorm</text>
  <text x="460" y="274" fill="#f59e0b" font-size="13" text-anchor="middle">W_s x : (128, 28, 28)</text>
  <text x="452" y="128" fill="#94a3b8" font-size="13" text-anchor="start">모양이 같은 block 은</text>
  <text x="452" y="146" fill="#94a3b8" font-size="13" text-anchor="start">x 를 그대로 더한다</text>
  <circle cx="300" cy="432" r="17" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="300" y="439" fill="#e2e8f0" font-size="20" text-anchor="middle">+</text>
  <line x1="200" y1="398" x2="286" y2="424" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M460,284 L460,432 L321,432" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="300" y1="449" x2="300" y2="470" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="185.0" y="470.0" width="230" height="44" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="487" fill="#e2e8f0" font-size="15" text-anchor="middle">y = ReLU(F(x) + W_s x)</text>
  <text x="300" y="508" fill="#38bdf8" font-size="13" text-anchor="middle">(128, 28, 28)</text>
</svg>
