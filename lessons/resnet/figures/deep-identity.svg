<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>20 층 망 뒤에 identity 층 36 개를 붙이면 20 층 망과 같은 답을 내는 56 층 망이 된다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="360" y="32" fill="#e2e8f0" font-size="15" text-anchor="middle">20 층 망 + identity 층 36 개 = 56 층 망</text>
  <rect x="30" y="70" width="300" height="60" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="180" y="96" fill="#e2e8f0" font-size="14" text-anchor="middle">학습을 마친 20 층 망</text>
  <text x="180" y="117" fill="#7cb4d8" font-size="12" text-anchor="middle">training error = 20 층 망과 같음</text>
  <line x1="330" y1="100" x2="360" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="362" y="70" width="330" height="60" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="527" y="96" fill="#e2e8f0" font-size="14" text-anchor="middle">identity 층 36 개</text>
  <text x="527" y="117" fill="#d6aa62" font-size="12" text-anchor="middle">y = x : 입력을 그대로 내보냄</text>
  <text x="30" y="170" fill="#94a3b8" font-size="13" text-anchor="start">숫자로 본 identity 층 (weight 하나짜리 층 y = w·x 에서 w = 1)</text>
  <rect x="60" y="190" width="120" height="48" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="120" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">20 층 망 출력</text>
  <text x="120" y="229" fill="#7cb4d8" font-size="14" text-anchor="middle">5</text>
  <line x1="180" y1="214" x2="220" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="220" y="190" width="120" height="48" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="280" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">identity 1</text>
  <text x="280" y="229" fill="#d6aa62" font-size="14" text-anchor="middle">5</text>
  <line x1="340" y1="214" x2="380" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="380" y="190" width="120" height="48" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="440" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">identity 2</text>
  <text x="440" y="229" fill="#d6aa62" font-size="14" text-anchor="middle">5</text>
  <line x1="500" y1="214" x2="540" y2="214" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="540" y="190" width="120" height="48" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="600" y="210" fill="#e2e8f0" font-size="12" text-anchor="middle">… identity 36</text>
  <text x="600" y="229" fill="#d6aa62" font-size="14" text-anchor="middle">5</text>
  <text x="360" y="275" fill="#7fc4a2" font-size="13" text-anchor="middle">붙인 36 층이 값을 바꾸지 않으므로 56 층 망의 답 = 20 층 망의 답</text>
</svg>
