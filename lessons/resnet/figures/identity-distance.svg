<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>plain block 은 w = 1, residual block 은 w = 0 이 identity</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="46" fill="#e2e8f0" font-size="14" text-anchor="start">plain block y = w·x</text>
  <line x1="80" y1="80" x2="640" y2="80" stroke="#475569" stroke-width="1.5"/>
  <line x1="126.66666666666667" y1="74" x2="126.66666666666667" y2="86" stroke="#475569" stroke-width="1.5"/>
  <text x="126.66666666666667" y="104" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <line x1="360.0" y1="74" x2="360.0" y2="86" stroke="#475569" stroke-width="1.5"/>
  <text x="360.0" y="104" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <line x1="593.3333333333334" y1="74" x2="593.3333333333334" y2="86" stroke="#475569" stroke-width="1.5"/>
  <text x="593.3333333333334" y="104" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <circle cx="150.0" cy="80" r="6" fill="#38bdf8"/>
  <text x="150.0" y="68" fill="#38bdf8" font-size="12" text-anchor="middle">처음 w = 0.05</text>
  <circle cx="593.3333333333334" cy="80" r="7" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <text x="593.3333333333334" y="66" fill="#34d399" font-size="12" text-anchor="middle">identity: w = 1</text>
  <line x1="158.0" y1="92" x2="585.3333333333334" y2="92" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="371.6666666666667" y="120" fill="#f59e0b" font-size="13" text-anchor="middle">0.95 만큼 이동</text>
  <text x="30" y="161" fill="#e2e8f0" font-size="14" text-anchor="start">residual block y = w·x + x</text>
  <line x1="80" y1="195" x2="640" y2="195" stroke="#475569" stroke-width="1.5"/>
  <line x1="126.66666666666667" y1="189" x2="126.66666666666667" y2="201" stroke="#475569" stroke-width="1.5"/>
  <text x="126.66666666666667" y="219" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <line x1="360.0" y1="189" x2="360.0" y2="201" stroke="#475569" stroke-width="1.5"/>
  <text x="360.0" y="219" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <line x1="593.3333333333334" y1="189" x2="593.3333333333334" y2="201" stroke="#475569" stroke-width="1.5"/>
  <text x="593.3333333333334" y="219" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <circle cx="150.0" cy="195" r="6" fill="#38bdf8"/>
  <text x="150.0" y="183" fill="#38bdf8" font-size="12" text-anchor="middle">처음 w = 0.05</text>
  <circle cx="126.66666666666667" cy="195" r="7" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <text x="126.66666666666667" y="237" fill="#34d399" font-size="12" text-anchor="middle">identity: w = 0</text>
  <line x1="142.0" y1="207" x2="135.66666666666669" y2="207" stroke="#f59e0b" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="210.0" y="235" fill="#f59e0b" font-size="13" text-anchor="start">0.05 만큼 이동</text>
</svg>
