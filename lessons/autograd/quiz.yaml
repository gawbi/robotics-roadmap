# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: sigmoid-slope
  title: step function 과 sigmoid 의 기울기
  variants:
    - question: |
        activation function 으로 step function(입력이 0 을 넘으면 1, 아니면 0)을 쓴 network 를 gradient descent 로 학습시키기 어려운 이유는
        무엇인가?
      choices:
        - '거의 모든 곳에서 기울기가 0 이라, weight 를 조금 바꿔도 출력이 변하지 않기 때문이다'
        - '출력이 0 과 1 두 값뿐이라 loss 를 계산할 때마다 경우를 나눠야 해서 너무 느리기 때문이다'
        - '입력이 0 을 넘지 않으면 출력이 0 이라, 음수 입력은 network 에 아예 들어가지 못하기 때문이다'
        - '0 을 넘는 순간 출력이 한 번에 1 만큼 뛰어, 기울기가 너무 커서 weight 가 멀리 튀기 때문이다'
      answer: 0
      explanation: |
        gradient descent 는 숫자를 조금 바꿨을 때 loss 가 어느 쪽으로 변하는지를 보고 움직이는데, step function 은 0 을 넘는 순간을 빼면
        평평해서 그 비율이 0 이다. 그래서 gradient 가 0 이 되어 weight 가 움직이지 않는다. 출력이 두 값뿐이면 계산은 오히려 단순하다. 음수
        입력도 받을 수 있고, 그때 출력이 0 일 뿐이다. 기울기는 큰 것이 아니라 거의 모든 곳에서 0 이다.
    - question: |
        sigmoid neuron 의 출력이 이미 0.99 처럼 1 에 바짝 붙어 있다. 이 neuron 으로 들어오는 weight 를 학습할 때 어떤 일이 생기는가?
      choices:
        - '출력이 1 에 가까우니 기울기도 1 에 가까워 빠르게 배운다'
        - '기울기가 정확히 0 이 되어 그 뒤로는 weight 가 영원히 움직이지 않는다'
        - '기울기가 음수가 되어 weight 가 반대 방향으로 움직인다'
        - '기울기가 아주 작아서 gradient 도 작아지고 학습이 느려진다'
      answer: 3
      explanation: |
        sigmoid 의 기울기는 $\sigma(z)(1 - \sigma(z))$ 라서 출력이 0.5 일 때 가장 큰 0.25 이고, 0 이나 1 에 붙을수록 작아진다. 출력이 0.99 면
        기울기가 $0.99 \times 0.01 \approx 0.01$ 로 작아 gradient 가 거의 전해지지 않는다. 출력이 1 에 가깝다고 기울기가 1 에 가까운 것은
        아니다. 기울기가 정확히 0 은 아니라서 아주 느리게라도 움직인다. 두 곱셈 인자가 모두 양수라 기울기가 음수가 될 수도 없다.
    - question: |
        backward 에서 sigmoid 의 기울기를 구할 때 forward 의 어떤 값을 다시 쓰는가?
      choices:
        - '입력 $z$ 를 sigmoid 에 다시 넣어 계산해야 하므로 forward 에서 구한 값은 쓰지 않는다'
        - 'loss 값을 다시 써서, loss 가 클수록 sigmoid 의 기울기도 크게 계산한다'
        - '출력 $\sigma(z)$ 를 다시 써서 $\sigma(z)(1 - \sigma(z))$ 로 구한다'
        - '앞 layer 의 weight 를 다시 써서, 그 weight 를 곱한 값을 sigmoid 의 기울기로 쓴다'
      answer: 2
      explanation: |
        sigmoid 의 derivative 는 출력만으로 $\sigma(z)(1 - \sigma(z))$ 로 쓸 수 있어서, forward 에서 구한 출력을 저장해 두면 backward 에서 곱셈
        한 번으로 기울기가 나온다. PyTorch 의 `SigmoidBackward0` 도 출력을 저장한다. $z$ 를 sigmoid 에 다시 넣어 계산할 수도 있지만 이미 구한
        출력을 쓰는 편이 계산이 적다. loss 값은 sigmoid 의 기울기와 관계없다. 앞 layer 의 weight 도 sigmoid 자신의 기울기에는 들어가지 않는다.

- topic: local-derivative
  title: local derivative 와 backward
  variants:
    - question: |
        곱셈 $p = a \times b$ 의 backward 에서 $a$ 와 $b$ 가 받는 gradient 는 어떻게 구하는가? $p$ 의 gradient 를 $g$ 라고 하자.
      choices:
        - '$a$ 와 $b$ 가 출력에 똑같이 기여하므로 둘 다 $g$ 를 그대로 받는다'
        - '$a$ 는 $g \times b$ 를 받고 $b$ 는 $g \times a$ 를 받는다'
        - '두 입력이 출력을 함께 만들었으므로 $g$ 를 둘에 절반씩 나눠 준다'
        - '$a$ 는 $g \times a$ 를 받고 $b$ 는 $g \times b$ 를 받는다'
      answer: 1
      explanation: |
        곱셈에서 한 입력이 1 늘면 출력은 다른 입력만큼 변하므로, $a$ 의 local derivative 는 $b$ 이고 $b$ 의 local derivative 는 $a$ 다. 여기에
        출력 쪽 gradient $g$ 를 곱한다. $g$ 를 그대로 받는 것은 덧셈의 경우다. $g$ 를 절반씩 나누는 규칙은 없다. 자기 값을 곱하는 것은 두
        입력을 거꾸로 짝지은 실수다.
    - question: |
        곱셈 $p = a \times b$ 에서 forward 때 $a = 0$ 이었다. backward 에서 $b$ 가 받는 gradient 는 어떻게 되는가?
      choices:
        - '$a$ 와 상관없이 $p$ 의 gradient 가 $b$ 에 그대로 전해진다'
        - '곱셈의 local derivative 는 늘 1 이라 $a$ 가 0 이어도 1 이다'
        - '0 이다. $a$ 가 0 이면 $b$ 를 바꿔도 $p$ 가 변하지 않는다'
        - '$b$ 자신의 값이다. $b$ 를 바꾼 만큼 $p$ 가 따라 변하기 때문이다'
      answer: 2
      explanation: |
        곱셈에서 $b$ 의 local derivative 는 다른 입력 $a$ 라서, $b$ 의 gradient 는 $p$ 의 gradient 에 $a = 0$ 을 곱한 0 이다. 실제로
        $0 \times b$ 는 $b$ 가 무엇이든 0 이니 $b$ 를 바꿀 이유가 없다. $p$ 의 gradient 가 그대로 전해지는 것은 덧셈의 규칙이다. 항상 1 인 것도
        덧셈의 local derivative 다. $b$ 자신의 값을 곱하는 것은 두 입력을 거꾸로 짝지은 실수다.
    - question: |
        계산 $L = (a \times b + c) \times f$ 에서 $\frac{\partial L}{\partial a} = 6$, $\frac{\partial L}{\partial c} = -2$ 가 나왔고, 값은 $a =
        2$, $c = 10$ 이다. 이 결과를 어떻게 해석해야 하는가?
      choices:
        - '$a$ 를 조금 늘리면 $L$ 이 그 6 배만큼 늘고 $c$ 를 늘리면 2 배만큼 줄어, $a$ 에 더 민감하다'
        - '$c$ 가 $a$ 보다 다섯 배 큰 값이므로 $L$ 에 더 큰 영향을 주고, gradient 의 크기는 상관없다'
        - 'gradient 는 값이 클수록 커져야 하는데 $c$ 쪽이 더 작으므로 계산이 잘못됐다'
        - '$c$ 의 gradient 가 음수이므로 $c$ 는 $L$ 에 영향을 주지 않고 $a$ 만 $L$ 을 바꾼다'
      answer: 0
      explanation: |
        gradient 는 값의 크기가 아니라 그 값을 조금 바꿨을 때 $L$ 이 몇 배로 반응하는지를 나타낸다. gradient 의 크기가 6 인 $a$ 가 2 인 $c$
        보다 세 배 민감하고, 부호를 보면 늘릴 때 $L$ 이 느는지 주는지 알 수 있다. $c$ 가 더 큰 값이라고 $L$ 에 더 큰 영향을 주는 것은 아니다.
        gradient 는 값의 크기를 따라 커지지 않으므로 계산이 잘못된 것도 아니다. 음수 gradient 는 영향이 없다는 뜻이 아니라 늘리면 $L$ 이 준다는
        뜻이다.

- topic: fan-out
  title: 여러 곳에 쓰인 값의 gradient
  variants:
    - question: |
        값 $a$ 가 두 연산의 입력으로 쓰여 서로 다른 두 길로 loss 에 닿는다. backward 에서 $a$ 의 gradient 는 어떻게 구하는가?
      choices:
        - 'backward 는 길을 하나씩 처리하므로 나중에 들어온 길의 gradient 로 덮어쓴다'
        - 'chain rule 처럼 두 길의 gradient 를 곱한다'
        - '길마다 chain rule 로 구한 gradient 를 더한다'
        - '두 길 중 크기가 큰 쪽이 loss 를 주로 정하므로 그쪽만 쓴다'
      answer: 2
      explanation: |
        $a$ 를 조금 늘리면 두 길로 동시에 loss 가 변하므로, 전체 변화는 두 길의 변화를 합친 것이다. 나중 gradient 로 덮어쓰면 먼저 들어온 길의
        영향이 빠진다. 곱하는 것은 한 길 안에서 단계를 이어 갈 때(chain rule)의 규칙이다. 큰 쪽만 써도 작은 쪽 길의 영향이 빠져 gradient 가
        틀린다.
    - question: |
        PyTorch 가 backward 에서 구한 gradient 를 `.grad` 에 덮어쓰지 않고 늘 더해 쌓는 이유는 무엇인가?
      choices:
        - 'graph 의 중간 값을 지우고 gradient 만 남겨 메모리를 아끼기 위해서다'
        - '한 값이 여러 곳에 쓰이면 길별 gradient 를 모두 더해야 올바른 값이 되기 때문이다'
        - '지난 학습 step 의 gradient 를 momentum 처럼 이어 써서 학습을 안정시키기 위해서다'
        - '덮어쓰려면 이전 값을 먼저 지워야 해서 더하는 것보다 계산이 느려지기 때문이다'
      answer: 1
      explanation: |
        backward 중에는 한 값으로 gradient 가 여러 길에서 따로 들어오고, 그 합이 진짜 gradient 라서 들어오는 대로 더한다. 메모리를 아끼는 것과는
        상관이 없다. 지난 step 의 gradient 가 남아 더해지는 것은 오히려 막아야 하는 부작용이라, 학습 loop 는 매 step `.grad` 를 0 으로 지운다.
        덮어쓰기와 더하기의 속도 차이도 이유가 아니다.
    - question: |
        $L = a \times a$ 를 computational graph 로 그리면 같은 $a$ 가 곱셈의 두 입력에 다 들어간다. $a = 3$ 일 때 backward 가 내는
        $\frac{\partial L}{\partial a}$ 는 얼마이고, 그 이유는 무엇인가?
      choices:
        - '3 이다. 곱셈의 local derivative 는 다른 입력이고, 다른 입력이 3 이기 때문이다'
        - '9 다. backward 는 forward 의 곱셈을 거꾸로 따라가므로 forward 값과 같기 때문이다'
        - '1 이다. $a$ 는 하나뿐이라 자기 자신에 대한 derivative 가 1 이기 때문이다'
        - '6 이다. 두 입력에서 각각 다른 입력 3 이 들어와 $3 + 3$ 으로 더해지기 때문이다'
      answer: 3
      explanation: |
        $a$ 는 곱셈의 첫째 입력과 둘째 입력에 모두 쓰였고, 입력마다 local derivative 가 다른 입력 3 이라 두 길의 합은 $3 + 3 = 6$ 이다.
        $a^2$ 의 derivative $2a$ 에 3 을 넣은 값과 같다. 3 은 한 입력만 센 값이다. 9 는 gradient 가 아니라 forward 의 결과 $L$ 이다. $a$ 가
        하나뿐이어도 두 입력에 쓰였으니 1 이 아니다.

- topic: reverse-mode
  title: backward 의 순서와 reverse-mode
  variants:
    - question: |
        backward 를 forward 의 계산 순서(topological order)를 뒤집은 순서로 처리하는 이유는 무엇인가?
      choices:
        - 'forward 와 같은 순서로 하면 같은 값을 두 번 읽어야 해서 계산이 느려지기 때문이다'
        - '어떤 값을 처리할 차례에, 그 값이 쓰인 모든 곳의 gradient 가 이미 다 모여 있게 하려고'
        - '입력 쪽 gradient 가 더 중요해서, 출력 쪽을 먼저 끝내고 나중에 신중히 계산하려고'
        - '순서는 결과와 상관없고, 출력에서 시작하는 편이 읽기 쉬워서 정한 관례일 뿐이다'
      answer: 1
      explanation: |
        값의 gradient 를 입력 쪽으로 넘기려면 그 값을 입력으로 쓴 곳들의 gradient 가 먼저 다 들어와 있어야 한다. 그런 곳들은 forward 순서에서
        그 값보다 뒤에 있으니 순서를 뒤집으면 모두 앞에 온다. forward 와 같은 순서로 하면 느려지는 것이 아니라 결과가 틀린다. 입력 쪽 gradient
        가 더 중요해서 그런 것도 아니다. 순서를 어기면 아직 0 인 gradient 를 넘기므로 관례가 아니라 꼭 지켜야 하는 규칙이다.
    - question: |
        parameter 가 수천만 개이고 loss 는 숫자 하나인 network 의 gradient 를 구할 때 reverse-mode 가 유리한 이유는 무엇인가?
      choices:
        - 'parameter 를 하나씩 조금 바꿔 forward 를 다시 해 보므로 어떤 방법보다 정확하기 때문이다'
        - 'graph 를 기록하지 않고 바로 계산하므로 메모리를 거의 쓰지 않기 때문이다'
        - 'backward 를 parameter 수만큼 하지만 한 번 한 번이 아주 빠르기 때문이다'
        - '출력 하나에서 거꾸로 한 번 훑으면 모든 parameter 의 gradient 가 한꺼번에 나오기 때문이다'
      answer: 3
      explanation: |
        reverse-mode 는 loss 에서 출발하므로 forward 한 번과 backward 한 번이면 모든 gradient 가 나온다. 하나씩 바꿔 재는 것은 central
        difference 이고, 근사값이라 더 정확하지도 않으면서 parameter 수의 두 배만큼 forward 를 해야 한다. reverse-mode 는 오히려 graph 와 중간
        값을 기록해 두어야 backward 를 할 수 있다. backward 는 parameter 수와 상관없이 한 번뿐이다.
    - question: |
        reverse-mode automatic differentiation 의 대가로 흔히 꼽는 것은 무엇인가?
      choices:
        - 'backward 에 쓸 forward 의 중간 값을 저장해야 해서, 메모리가 많게는 연산 수에 비례해 는다'
        - 'parameter 마다 backward 를 따로 해야 해서 parameter 가 늘수록 backward 횟수가 늘어난다'
        - '규칙을 아는 덧셈과 곱셈만 미분할 수 있고 sigmoid 같은 activation function 은 다룰 수 없다'
        - 'gradient 를 작은 변화로 어림한 근사값이라 central difference 보다 부정확하다'
      answer: 0
      explanation: |
        곱셈의 local derivative 에는 다른 입력이 필요하고 sigmoid 의 local derivative 에는 출력이 필요하다. 그래서 backward 를 하려면 forward 의
        중간 값을 남겨 둬야 하고, 그 양은 많게는 연산 수에 비례해 는다. backward 횟수는 parameter 수와 상관없이 한 번이다. local derivative
        규칙을 아는 연산이면 sigmoid 도 다룬다. reverse-mode 의 gradient 는 근사가 아니라 규칙으로 계산한 값이라, 오히려 central difference 로
        이를 검사한다.

- topic: hidden-gradient
  title: hidden neuron 으로 전해지는 gradient
  variants:
    - question: |
        학습 데이터에는 출력의 정답만 있고 hidden neuron 의 정답은 없다. backpropagation 은 hidden neuron 의 weight 를 어떻게 고치는가?
      choices:
        - 'backpropagation 이 hidden neuron 마다 정답 값을 만들어 준다'
        - '출력 layer 만 학습하고 hidden layer 는 처음 값 그대로 둔다'
        - 'loss 에서 거꾸로 전해진 gradient(hidden 출력을 키울 때 loss 가 변하는 비율)로 고친다'
        - 'hidden neuron 의 출력을 입력과 비교해 perceptron 학습 규칙으로 고친다'
      answer: 2
      explanation: |
        loss 에서 출발한 gradient 가 출력 weight 를 곱하며 hidden 출력까지 전해지고, 이 값으로 고칠 방향과 크기가 정해지는데 이것이 credit
        assignment 문제의 답이다. 이때 전해지는 것은 정답이 아니라 비율이라, hidden neuron 이 무엇을 계산하게 될지는 학습 결과로 정해진다.
        hidden layer 도 학습해야 XOR 같은 문제를 풀 수 있다. perceptron 규칙은 그 unit 의 정답이 있어야 쓸 수 있다.
    - question: |
        출력 neuron 의 weighted sum 은 $z = v h + \cdots$ 처럼 hidden 출력 $h$ 에 weight $v = -1$ 을 곱해 만든다. $z$ 의 gradient 가 $-0.2$ 일
        때 $h$ 의 gradient 에 대한 설명으로 맞는 것은?
      choices:
        - '양수 0.2 다. $h$ 를 키우면 loss 가 커진다'
        - '음수 $-0.2$ 다. $h$ 를 키우면 loss 가 준다'
        - '0 이다. $h$ 에는 정답이 없기 때문이다'
        - '$-1$ 이다. weight 가 그대로 gradient 가 된다'
      answer: 0
      explanation: |
        $h$ 의 gradient 는 $z$ 의 gradient 에 곱셈의 local derivative 인 $v$ 를 곱한 $(-0.2) \times (-1) = 0.2$ 로 양수다. $v$ 가 음수라 $h$ 가
        커지면 $z$ 가 작아지는데, $z$ 의 gradient 가 음수라 $z$ 가 작아지면 loss 가 커진다. 그래서 $h$ 를 키우면 loss 가 커진다. $-0.2$ 는 $v$
        를 곱하지 않아 부호가 틀린 값이다. 정답이 없어도 gradient 는 전해지므로 0 이 아니다. weight 자체는 gradient 가 아니다.
    - question: |
        hidden neuron 두 개가 있다. 하나는 출력에 큰 weight 로, 다른 하나는 작은 weight 로 연결되어 있고 나머지 조건은 같다. backward 에서 어느
        쪽이 더 큰 gradient 를 받는가?
      choices:
        - '연결 weight 와 상관없이 두 neuron 이 같은 gradient 를 받는다'
        - '작은 weight 로 연결된 neuron 이 더 큰 gradient 를 받는다'
        - '연결 weight 는 상관없고 hidden 출력의 크기만으로 정해진다'
        - '큰 weight 로 연결된 neuron 이 더 큰 gradient 를 받는다'
      answer: 3
      explanation: |
        hidden 출력의 gradient 는 출력 쪽 gradient 에 그 neuron 의 출력 weight 를 곱한 값이라, weight 가 클수록 크다. 출력에 크게 기여하는
        neuron 일수록 출력이 틀린 책임을 더 많이 나눠 받는다. 연결 weight 가 다르면 받는 gradient 도 달라서 두 neuron 이 같은 gradient 를 받지
        않는다. 작은 weight 쪽은 오히려 작은 gradient 를 받는다. hidden 출력의 gradient 에는 그 neuron 의 출력 값이 아니라 출력 weight 가
        곱해진다.

- topic: vanishing-gradient
  title: vanishing gradient
  variants:
    - question: |
        sigmoid 를 activation function 으로 쓴 층을 여러 개 쌓으면 입력에 가까운 층이 잘 학습되지 않는 이유는 무엇인가?
      choices:
        - 'sigmoid 를 지날 때마다 0.25 이하의 기울기가 곱해져 입력 쪽 gradient 가 급격히 작아지기 때문이다'
        - '입력에 가까운 층은 출력의 정답과 멀어서, 그 층에서는 loss 를 따로 계산할 수 없기 때문이다'
        - 'sigmoid 는 음수 입력을 0 으로 만들어, 그 자리에서 gradient 를 끊어 버리기 때문이다'
        - '층이 많으면 forward 출력이 층마다 커져 overflow 가 나고 gradient 가 망가지기 때문이다'
      answer: 0
      explanation: |
        입력 쪽 gradient 는 지나온 연산의 기울기를 모두 곱한 값이고, sigmoid 를 지날 때마다 많아야 0.25 가 곱해진다. 다섯 층이면
        $0.25^5 \approx 0.001$ 배 이하라 입력에 가까운 층이 거의 움직이지 않는데, 이 현상이 vanishing gradient 다. loss 는 출력에서 한 번
        계산해 gradient 로 전하면 된다. 음수를 0 으로 만드는 것은 sigmoid 가 아니라 ReLU 다. sigmoid 출력은 0 과 1 사이라 커지지 않는다.
    - question: |
        sigmoid 층 세 개를 거친 gradient 는, sigmoid 기울기의 곱만 따지면 가장 커도 처음의 몇 배인가?
      choices:
        - '0.25 를 세 번 더한 0.75 배'
        - '한 층의 기울기인 0.25 배'
        - '약 0.016 배'
        - '층을 지나도 줄지 않아 1 배'
      answer: 2
      explanation: |
        sigmoid 의 기울기는 가장 커도 0.25 라서 세 층을 지나면 $0.25 \times 0.25 \times 0.25 = 0.015625$, 약 0.016 배다. 0.75 는 0.25 를 세 번
        더한 값이다. 0.25 는 한 층만 센 값이다. 기울기가 1 보다 작으니 1 배로 남을 수 없다.
    - question: |
        요즘 network 가 vanishing gradient 를 줄이려고 쓰는 방법으로 맞는 것은?
      choices:
        - 'learning rate 를 0 으로 두어 gradient 가 너무 작아지기 전에 weight 를 고정한다'
        - '입력이 양수일 때 기울기가 1 인 ReLU 와, 입력을 출력에 그대로 더하는 연결을 쓴다'
        - 'sigmoid 를 더 많이 쌓아 작은 기울기를 여러 번 더해 gradient 를 키운다'
        - 'backward 를 forward 와 같은 순서로 처리해 입력 쪽 gradient 를 먼저 구한다'
      answer: 1
      explanation: |
        ReLU 는 입력이 양수이면 기울기가 1 이라 층마다 곱해지는 activation 기울기가 줄지 않는다. 입력을 출력에 더하는 연결(ResNet 의 residual
        connection)은 gradient 가 층을 건너뛰어 전해질 길을 만든다. learning rate 를 0 으로 두면 학습이 멈춘다. sigmoid 를 더 쌓으면 0.25
        이하가 더 많이 곱해진다. backward 순서를 바꾸면 결과가 틀린다.

- topic: symmetry
  title: 처음 숫자를 서로 다르게 두는 이유
  variants:
    - question: |
        hidden neuron 두 개의 weight 와 bias, 그리고 두 neuron 에서 출력으로 가는 weight 까지 똑같은 값에서 출발시켜 학습하면 어떻게 되는가?
      choices:
        - '처음에는 같아도 학습하는 동안 gradient 가 쌓이며 저절로 서로 다른 값으로 갈라진다'
        - '두 neuron 이 같은 답을 내며 서로 도와, 하나일 때보다 학습이 더 안정적이다'
        - '먼저 gradient 를 받은 neuron 만 학습되고, 다른 하나는 그대로 멈춘다'
        - '늘 같은 gradient 를 받아 끝까지 같은 값으로 남아 neuron 하나와 다를 바 없다'
      answer: 3
      explanation: |
        두 neuron 이 같은 값이면 forward 출력이 같고, 출력 weight 도 같으니 backward 에서 받는 gradient 도 같다. 같은 양만큼 고쳐지니 다음
        step 에도 같고, 이 일이 끝까지 되풀이된다. 갈라지게 만드는 차이가 처음부터 없으므로 저절로 갈라지지 않는다. 같은 일을 하는 neuron 이
        둘이라 학습이 안정되는 것도 아니고, neuron 하나와 같은 일밖에 못 한다. 두 neuron 이 늘 같은 gradient 를 받으니 하나만 멈출 이유도 없다.
    - question: |
        hidden neuron 들이 같은 값에서 출발하면 끝까지 같은 neuron 으로 남는다. 이 문제를 피하려고 실제로 parameter 를 어떻게 출발시키는가?
      choices:
        - '계산이 깔끔하도록 모두 0 으로 둔다'
        - '서로 다른 작은 random 값으로 둔다'
        - 'sigmoid 가 잘 반응하도록 모두 1 로 둔다'
        - '모든 neuron 에 같은 큰 값을 둔다'
      answer: 1
      explanation: |
        random 값을 뽑으면 neuron 마다 출발점이 달라 서로 다른 gradient 를 받고 서로 다른 역할을 맡을 수 있다. PyTorch 의 `nn.Linear` 도 기본으로
        $-1/\sqrt{\text{입력 수}}$ 와 $+1/\sqrt{\text{입력 수}}$ 사이에서 고르게 뽑는다. 모두 0 으로 두면 neuron 들이 똑같이 움직인다. 모두 1 로
        두어도 마찬가지다. 모든 neuron 에 같은 큰 값을 두면 대칭 문제에 더해 sigmoid 출력이 1 에 붙어 기울기까지 작아진다.
    - question: |
        hidden neuron 4 개의 weight 와 bias 를 모두 같은 값으로 출발시켜 학습했다. 학습이 끝난 뒤 hidden layer 가 긋는 서로 다른 경계 직선은 몇
        개인가?
      choices:
        - '4 개'
        - '2 개'
        - '1 개'
        - '0 개'
      answer: 2
      explanation: |
        네 neuron 이 늘 같은 gradient 를 받아 끝까지 같은 값으로 남으므로, 모두 같은 직선 하나를 긋는다. 그래서 neuron 을 4 개 두어도 효과는
        1 개와 같고, 직선 두 개가 필요한 XOR 도 풀지 못한다. 4 개가 되려면 네 neuron 이 서로 달라져야 하는데 그럴 수 없다. 2 개도 같은 이유로
        틀린다. 직선이 아예 없어지는 것은 아니라서 0 개도 틀린다.

- topic: pytorch-autograd
  title: PyTorch autograd
  variants:
    - question: |
        PyTorch 에서 `loss.backward()` 를 부를 수 있으려면 forward 때 autograd 가 무엇을 해 두어야 하는가?
      choices:
        - 'loss 식 전체를 미분한 공식을 미리 만들어 두고, backward 때 값만 넣는다'
        - 'parameter 마다 조금씩 바꾼 forward 결과를 저장해 두고 차이로 gradient 를 구한다'
        - '아무것도 하지 않고, backward 때 forward 를 처음부터 다시 계산하며 기록한다'
        - '연산마다 grad_fn 을 이어 graph 로 기록하고, backward 에 필요한 중간 값을 저장해 둔다'
      answer: 3
      explanation: |
        autograd 는 연산을 할 때마다 결과 tensor 에 `MulBackward0` 같은 grad_fn 을 붙여 graph 를 만들고, 곱셈의 두 입력이나 sigmoid 의 출력처럼
        backward 에 필요한 값을 저장한다. backward 는 이 graph 를 거꾸로 따라간다. 연산마다 규칙이 있으니 식 전체를 미분한 공식은 필요 없다.
        parameter 마다 조금씩 바꿔 재는 것은 central difference 다. backward 는 forward 를 다시 계산하지 않고 저장한 값을 쓴다.
    - question: |
        학습 loop 에서 gradient 를 0 으로 지우지 않고 `loss.backward()` 를 매 step 부르면 어떻게 되는가?
      choices:
        - '아무 문제 없다. backward 를 부를 때마다 `.grad` 를 새 값으로 바꾼다'
        - '`.grad` 에 지난 step 의 gradient 가 계속 더해져 틀린 gradient 로 update 한다'
        - '이미 값이 들어 있는 `.grad` 는 다시 쓰지 않아 두 번째 backward 부터 0 이 된다'
        - 'PyTorch 가 쌓인 gradient 를 step 수로 나눠 자동으로 평균을 내 주므로 학습이 더 안정적이다'
      answer: 1
      explanation: |
        `.grad` 는 한 값이 여러 곳에 쓰였을 때 길별 gradient 를 더하려고 늘 더해 쌓는다. 그래서 step 사이에 지우지 않으면 지난 step 의
        gradient 가 남아 새 gradient 에 더해진다. 같은 식을 두 step 계산하면 gradient 가 두 배가 된다. backward 는 `.grad` 를 새 값으로 바꾸지
        않으므로 문제가 생긴다. 두 번째 backward 부터 0 이 되는 일은 없다. PyTorch 가 평균을 내 주지도 않는다.
    - question: |
        학습이 끝난 policy 로 로봇을 움직일 때 추론 코드를 `torch.no_grad()` 로 감싸는 이유는 무엇인가?
      choices:
        - 'graph 와 backward 용 중간 값을 기록하지 않아 메모리와 계산을 아낀다'
        - 'gradient 계산의 반올림 오차가 빠져 policy 의 출력이 더 정확해진다'
        - 'parameter 를 고정해 학습 loop 안에서도 weight 가 바뀌지 않게 한다'
        - '계산을 GPU 대신 CPU 에서 하게 해 로봇의 컴퓨터에서도 돌게 한다'
      answer: 0
      explanation: |
        no-grad mode 안의 계산은 backward graph 에 기록되지 않아서, 쓰지 않을 grad_fn 과 저장 값을 만들지 않는다. LeRobot 의 ACT 구현도 행동을
        고르는 `select_action` 을 `@torch.no_grad()` 로 감싼다. no-grad mode 에서도 출력 값 자체는 같다. 학습할 때 parameter 를 고정하는 것은
        `requires_grad_(False)` 다. 어느 장치에서 실행할지와는 관계없다.
