<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>sigmoid 층을 n 개 지날 때 gradient 에 곱해지는 sigmoid 기울기의 곱이 가질 수 있는 가장 큰 값. 1 층 0.25, 2 층 0.0625, 3 층 0.0156, 5 층 0.00098, 10 층 0.00000095 로, 층이 하나 늘 때마다 4 분의 1 이하로 준다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="360.0" y="34.0" fill="#e2e8f0" font-size="15" text-anchor="middle">sigmoid 층 n 개를 거친 gradient 에 곱해지는 값의 최댓값 0.25ⁿ</text>
  <text x="40.0" y="86.0" fill="#e2e8f0" font-size="14" text-anchor="start">1 층</text>
  <text x="100.0" y="86.0" fill="#94a3b8" font-size="14" text-anchor="start">0.25¹</text>
  <rect x="190.0" y="70.0" width="370.0" height="24.0" rx="4" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="190.0" y="70.0" width="335.7" height="24.0" rx="4" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="1"/>
  <text x="574.0" y="87.0" fill="#d6aa62" font-size="14" text-anchor="start">0.25</text>
  <text x="40.0" y="136.0" fill="#e2e8f0" font-size="14" text-anchor="start">2 층</text>
  <text x="100.0" y="136.0" fill="#94a3b8" font-size="14" text-anchor="start">0.25²</text>
  <rect x="190.0" y="120.0" width="370.0" height="24.0" rx="4" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="190.0" y="120.0" width="301.5" height="24.0" rx="4" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="1"/>
  <text x="574.0" y="137.0" fill="#d6aa62" font-size="14" text-anchor="start">0.0625</text>
  <text x="40.0" y="186.0" fill="#e2e8f0" font-size="14" text-anchor="start">3 층</text>
  <text x="100.0" y="186.0" fill="#94a3b8" font-size="14" text-anchor="start">0.25³</text>
  <rect x="190.0" y="170.0" width="370.0" height="24.0" rx="4" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="190.0" y="170.0" width="267.2" height="24.0" rx="4" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="1"/>
  <text x="574.0" y="187.0" fill="#d6aa62" font-size="14" text-anchor="start">0.0156</text>
  <text x="40.0" y="236.0" fill="#e2e8f0" font-size="14" text-anchor="start">5 층</text>
  <text x="100.0" y="236.0" fill="#94a3b8" font-size="14" text-anchor="start">0.25⁵</text>
  <rect x="190.0" y="220.0" width="370.0" height="24.0" rx="4" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="190.0" y="220.0" width="198.6" height="24.0" rx="4" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="1"/>
  <text x="574.0" y="237.0" fill="#d6aa62" font-size="14" text-anchor="start">0.00098</text>
  <text x="40.0" y="286.0" fill="#e2e8f0" font-size="14" text-anchor="start">10 층</text>
  <text x="100.0" y="286.0" fill="#94a3b8" font-size="14" text-anchor="start">0.25¹⁰</text>
  <rect x="190.0" y="270.0" width="370.0" height="24.0" rx="4" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
  <rect x="190.0" y="270.0" width="27.3" height="24.0" rx="4" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="1"/>
  <text x="574.0" y="287.0" fill="#d6aa62" font-size="14" text-anchor="start">0.00000095</text>
  <text x="190.0" y="330.0" fill="#94a3b8" font-size="12" text-anchor="start">막대 길이는 자릿수(log)로 그렸다. 값이 10 분의 1 이 될 때마다 같은 길이만큼 짧아진다</text>
  <text x="360.0" y="358.0" fill="#7fc4a2" font-size="13" text-anchor="middle">ReLU 는 입력이 양수인 구간의 기울기가 1 이라, 층마다 곱해지는 activation 기울기가 줄지 않는다</text>
</svg>
