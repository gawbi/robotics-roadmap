<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>덧셈과 곱셈의 local derivative</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="160.0" y="32.0" fill="#e2e8f0" font-size="15" text-anchor="middle">덧셈 d = p + c</text>
  <text x="480.0" y="32.0" fill="#e2e8f0" font-size="15" text-anchor="middle">곱셈 L = d × f</text>
  <line x1="320.0" y1="20.0" x2="320.0" y2="280.0" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="20.0" y="60.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="75.0" y="82.0" fill="#e2e8f0" font-size="14" text-anchor="middle">p: −6 → −5.99</text>
  <text x="75.0" y="102.0" fill="#f59e0b" font-size="13" text-anchor="middle">+0.01</text>
  <rect x="20.0" y="140.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="75.0" y="162.0" fill="#e2e8f0" font-size="14" text-anchor="middle">c = 10</text>
  <text x="75.0" y="182.0" fill="#94a3b8" font-size="13" text-anchor="middle">그대로</text>
  <circle cx="165.0" cy="126.0" r="16" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="165.0" y="132.0" fill="#38bdf8" font-size="18" text-anchor="middle">+</text>
  <line x1="130.0" y1="90.0" x2="151.0" y2="115.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="130.0" y1="162.0" x2="151.0" y2="137.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="181.0" y1="126.0" x2="196.0" y2="126.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="198.0" y="100.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="253.0" y="122.0" fill="#e2e8f0" font-size="14" text-anchor="middle">d: 4 → 4.01</text>
  <text x="253.0" y="142.0" fill="#f59e0b" font-size="13" text-anchor="middle">+0.01</text>
  <rect x="30.0" y="214.0" width="260.0" height="54.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="160.0" y="237.0" fill="#34d399" font-size="14" text-anchor="middle">비율 = 0.01 ÷ 0.01 = 1</text>
  <text x="160.0" y="257.0" fill="#94a3b8" font-size="12" text-anchor="middle">덧셈은 어느 입력이든 1</text>
  <rect x="340.0" y="60.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="395.0" y="82.0" fill="#e2e8f0" font-size="14" text-anchor="middle">d: 4 → 4.01</text>
  <text x="395.0" y="102.0" fill="#f59e0b" font-size="13" text-anchor="middle">+0.01</text>
  <rect x="340.0" y="140.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="395.0" y="162.0" fill="#e2e8f0" font-size="14" text-anchor="middle">f = −2</text>
  <text x="395.0" y="182.0" fill="#94a3b8" font-size="13" text-anchor="middle">그대로</text>
  <circle cx="485.0" cy="126.0" r="16" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="485.0" y="132.0" fill="#38bdf8" font-size="18" text-anchor="middle">×</text>
  <line x1="450.0" y1="90.0" x2="471.0" y2="115.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="450.0" y1="162.0" x2="471.0" y2="137.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="501.0" y1="126.0" x2="516.0" y2="126.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="518.0" y="100.0" width="110.0" height="52.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="573.0" y="122.0" fill="#e2e8f0" font-size="13" text-anchor="middle">L: −8 → −8.02</text>
  <text x="573.0" y="142.0" fill="#f59e0b" font-size="13" text-anchor="middle">−0.02</text>
  <rect x="350.0" y="214.0" width="270.0" height="54.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="485.0" y="237.0" fill="#34d399" font-size="14" text-anchor="middle">비율 = −0.02 ÷ 0.01 = −2</text>
  <text x="485.0" y="257.0" fill="#94a3b8" font-size="12" text-anchor="middle">곱셈은 다른 입력 f 의 값</text>
</svg>
