<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>a 를 0.01 늘렸을 때 p, d, L 로 변화가 전해지는 과정</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="135.0" height="90.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="87.5" y="64.0" fill="#38bdf8" font-size="14" text-anchor="middle">a</text>
  <text x="87.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">2 → 2.01</text>
  <text x="87.5" y="110.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+0.01</text>
  <rect x="175.0" y="40.0" width="135.0" height="90.0" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="242.5" y="64.0" fill="#f87171" font-size="14" text-anchor="middle">p = a × b</text>
  <text x="242.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−6 → −6.03</text>
  <text x="242.5" y="110.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.03</text>
  <rect x="330.0" y="40.0" width="135.0" height="90.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="397.5" y="64.0" fill="#a78bfa" font-size="14" text-anchor="middle">d = p + c</text>
  <text x="397.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">4 → 3.97</text>
  <text x="397.5" y="110.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.03</text>
  <rect x="485.0" y="40.0" width="135.0" height="90.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="552.5" y="64.0" fill="#f59e0b" font-size="14" text-anchor="middle">L = d × f</text>
  <text x="552.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−8 → −7.94</text>
  <text x="552.5" y="110.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+0.06</text>
  <line x1="157.0" y1="85.0" x2="172.0" y2="85.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="164.5" y="160.0" fill="#94a3b8" font-size="13" text-anchor="middle">× b = −3</text>
  <line x1="312.0" y1="85.0" x2="327.0" y2="85.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="319.5" y="160.0" fill="#94a3b8" font-size="13" text-anchor="middle">× 1</text>
  <line x1="467.0" y1="85.0" x2="482.0" y2="85.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="474.5" y="160.0" fill="#94a3b8" font-size="13" text-anchor="middle">× f = −2</text>
  <rect x="60.0" y="186.0" width="520.0" height="76.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="320.0" y="212.0" fill="#e2e8f0" font-size="14" text-anchor="middle">전체 비율: 0.06 ÷ 0.01 = 6</text>
  <text x="320.0" y="240.0" fill="#34d399" font-size="15" text-anchor="middle">칸별 비율의 곱: (−3) × 1 × (−2) = 6</text>
</svg>
