<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>a 를 2 에서 2.01 로 0.01 늘렸을 때 p, d, L 이 변하는 과정. 상자마다 변화 전·변화 후·변화량을 적었고, 단계별 비율 −0.03 ÷ 0.01 = −3, −0.03 ÷ −0.03 = 1, 0.06 ÷ −0.03 = −2 의 곱 6 이 전체 비율 0.06 ÷ 0.01 = 6 과 같다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="958" height="448" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="25.0" y="20.0" width="200.0" height="200.0" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="125.0" y="46.0" fill="#7cb4d8" font-size="15" text-anchor="middle">a</text>
  <line x1="37.0" y1="58.0" x2="213.0" y2="58.0" stroke="#1e293b" stroke-width="1"/>
  <text x="39.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="125.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 2</text>
  <text x="39.0" y="128.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="125.0" y="148.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 2.01</text>
  <text x="39.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="125.0" y="196.0" fill="#7cb4d8" font-size="14" text-anchor="middle">2.01 − 2 = +0.01</text>
  <line x1="230.0" y1="120.0" x2="258.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-gray)"/>
  <rect x="263.0" y="20.0" width="200.0" height="200.0" rx="10" fill="#111a2e" stroke="#d88b8b" stroke-width="2"/>
  <text x="363.0" y="46.0" fill="#d88b8b" font-size="15" text-anchor="middle">p = a × b</text>
  <line x1="275.0" y1="58.0" x2="451.0" y2="58.0" stroke="#1e293b" stroke-width="1"/>
  <text x="277.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="363.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">2 × (−3) = −6</text>
  <text x="277.0" y="128.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="363.0" y="148.0" fill="#e2e8f0" font-size="14" text-anchor="middle">2.01 × (−3) = −6.03</text>
  <text x="277.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="363.0" y="196.0" fill="#d88b8b" font-size="14" text-anchor="middle">−6.03 − (−6) = −0.03</text>
  <line x1="468.0" y1="120.0" x2="496.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-gray)"/>
  <rect x="501.0" y="20.0" width="200.0" height="200.0" rx="10" fill="#111a2e" stroke="#a99ad6" stroke-width="2"/>
  <text x="601.0" y="46.0" fill="#a99ad6" font-size="15" text-anchor="middle">d = p + c</text>
  <line x1="513.0" y1="58.0" x2="689.0" y2="58.0" stroke="#1e293b" stroke-width="1"/>
  <text x="515.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="601.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−6 + 10 = 4</text>
  <text x="515.0" y="128.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="601.0" y="148.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−6.03 + 10 = 3.97</text>
  <text x="515.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="601.0" y="196.0" fill="#a99ad6" font-size="14" text-anchor="middle">3.97 − 4 = −0.03</text>
  <line x1="706.0" y1="120.0" x2="734.0" y2="120.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-gray)"/>
  <rect x="739.0" y="20.0" width="200.0" height="200.0" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="839.0" y="46.0" fill="#d6aa62" font-size="15" text-anchor="middle">L = d × f</text>
  <line x1="751.0" y1="58.0" x2="927.0" y2="58.0" stroke="#1e293b" stroke-width="1"/>
  <text x="753.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="839.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">4 × (−2) = −8</text>
  <text x="753.0" y="128.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="839.0" y="148.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3.97 × (−2) = −7.94</text>
  <text x="753.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="839.0" y="196.0" fill="#d6aa62" font-size="14" text-anchor="middle">−7.94 − (−8) = +0.06</text>
  <rect x="137.0" y="240.0" width="214.0" height="78.0" rx="10" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="244.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">a → p 의 비율</text>
  <text x="244.0" y="284.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.03 ÷ +0.01 = −3</text>
  <text x="244.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="middle">곱셈이라 다른 입력 b = −3</text>
  <rect x="375.0" y="240.0" width="214.0" height="78.0" rx="10" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="482.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">p → d 의 비율</text>
  <text x="482.0" y="284.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.03 ÷ −0.03 = 1</text>
  <text x="482.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="middle">덧셈이라 1</text>
  <rect x="613.0" y="240.0" width="214.0" height="78.0" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">d → L 의 비율</text>
  <text x="720.0" y="284.0" fill="#e2e8f0" font-size="14" text-anchor="middle">+0.06 ÷ −0.03 = −2</text>
  <text x="720.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="middle">곱셈이라 다른 입력 f = −2</text>
  <rect x="170.0" y="346.0" width="620.0" height="76.0" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="480.0" y="374.0" fill="#e2e8f0" font-size="14" text-anchor="middle">전체 비율 (a → L):  +0.06 ÷ +0.01 = 6</text>
  <text x="480.0" y="402.0" fill="#7fc4a2" font-size="15" text-anchor="middle">단계별 비율의 곱:  (−3) × 1 × (−2) = 6</text>
</svg>
