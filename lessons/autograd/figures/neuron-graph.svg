  <line x1="462.0" y1="166.0" x2="474.0" y2="166.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <circle cx="588.0" cy="166.0" r="20" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="588.0" y="171.0" fill="#38bdf8" font-size="11" text-anchor="middle">(·−y)²</text>
  <line x1="556.0" y1="166.0" x2="567.0" y2="166.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="588.0" y="216.0" fill="#94a3b8" font-size="13" text-anchor="middle">y = 1</text>
  <line x1="588.0" y1="202.0" x2="588.0" y2="188.0" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar-gray)"/>
  <rect x="618.0" y="142.0" width="92.0" height="48.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="664.0" y="162.0" fill="#e2e8f0" font-size="14" text-anchor="middle">L = 0.25</text>
  <text x="664.0" y="181.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 1</text>
  <line x1="608.0" y1="166.0" x2="616.0" y2="166.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="360.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="middle">흰 숫자는 forward 값, 주황 숫자는 gradient ∂L/∂(그 값)</text>
  <text x="530.0" y="252.0" fill="#94a3b8" font-size="12" text-anchor="middle">σ 의 비율: 0.5 × 0.5 = 0.25</text>
  <text x="530.0" y="272.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱의 비율: 2 × (0.5 − 1) = −1</text>
  <text x="530.0" y="292.0" fill="#94a3b8" font-size="12" text-anchor="middle">곱셈의 비율: 다른 입력 x = 1</text>
