  <line x1="416.0" y1="166.0" x2="429.0" y2="166.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="476.0" y="142.0" width="80.0" height="48.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="516.0" y="162.0" fill="#e2e8f0" font-size="14" text-anchor="middle">ŷ = 0.5</text>
