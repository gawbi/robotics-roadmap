<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>L = (a·b + c)·f 를 연산 하나씩으로 쪼갠 computational graph 와 forward 값</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="12.0" y="45.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52.0" y="73.0" fill="#e2e8f0" font-size="15" text-anchor="middle">a = 2</text>
  <rect x="12.0" y="130.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52.0" y="158.0" fill="#e2e8f0" font-size="15" text-anchor="middle">b = −3</text>
  <circle cx="142.0" cy="112.0" r="17" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="142.0" y="118.0" fill="#7cb4d8" font-size="18" text-anchor="middle">×</text>
  <line x1="92.0" y1="72.0" x2="126.0" y2="103.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="92.0" y1="147.0" x2="126.0" y2="121.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="159.0" y1="112.0" x2="178.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="180.0" y="90.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220.0" y="118.0" fill="#e2e8f0" font-size="15" text-anchor="middle">p = −6</text>
  <rect x="180.0" y="185.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="220.0" y="213.0" fill="#e2e8f0" font-size="15" text-anchor="middle">c = 10</text>
  <circle cx="305.0" cy="162.0" r="17" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="305.0" y="168.0" fill="#7cb4d8" font-size="18" text-anchor="middle">+</text>
  <line x1="260.0" y1="117.0" x2="291.0" y2="152.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="260.0" y1="202.0" x2="291.0" y2="172.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="322.0" y1="162.0" x2="343.0" y2="162.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="345.0" y="140.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="385.0" y="168.0" fill="#e2e8f0" font-size="15" text-anchor="middle">d = 4</text>
  <rect x="345.0" y="230.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="385.0" y="258.0" fill="#e2e8f0" font-size="15" text-anchor="middle">f = −2</text>
  <circle cx="468.0" cy="212.0" r="17" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="468.0" y="218.0" fill="#7cb4d8" font-size="18" text-anchor="middle">×</text>
  <line x1="425.0" y1="167.0" x2="454.0" y2="202.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="425.0" y1="247.0" x2="454.0" y2="222.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="485.0" y1="212.0" x2="506.0" y2="212.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="508.0" y="190.0" width="80.0" height="44.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="548.0" y="218.0" fill="#e2e8f0" font-size="15" text-anchor="middle">L = −8</text>
  <text x="142.0" y="82.0" fill="#94a3b8" font-size="12" text-anchor="middle">① 2 × (−3)</text>
  <text x="305.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">② −6 + 10</text>
  <text x="468.0" y="182.0" fill="#94a3b8" font-size="12" text-anchor="middle">③ 4 × (−2)</text>
  <text x="380.0" y="40.0" fill="#e2e8f0" font-size="14" text-anchor="middle">상자는 값, 원은 연산</text>
  <text x="380.0" y="62.0" fill="#94a3b8" font-size="13" text-anchor="middle">forward 는 왼쪽에서 오른쪽으로 계산한다</text>
  <line x1="40.0" y1="286.0" x2="560.0" y2="286.0" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#ar-sky)" stroke-dasharray="6 5"/>
</svg>
