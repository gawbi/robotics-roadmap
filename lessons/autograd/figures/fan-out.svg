<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>a = 3 이 곱셈 q = a × b 와 덧셈 L = q + a 두 곳에 쓰인다. q 를 거친 길로 1 × b = 2, 바로 가는 길로 1 이 들어와 a 의 gradient 는 3 이다. a 를 3.01 로 늘리면 q 는 6 에서 6.02, L 은 9 에서 9.03 이 되어 비율 0.03 ÷ 0.01 = 3 이다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="538" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="60.0" width="110.0" height="64.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="79.0" y="86.0" fill="#e2e8f0" font-size="15" text-anchor="middle">a = 3</text>
  <text x="79.0" y="110.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 2 + 1 = 3</text>
  <rect x="24.0" y="170.0" width="110.0" height="64.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="79.0" y="196.0" fill="#e2e8f0" font-size="15" text-anchor="middle">b = 2</text>
  <text x="79.0" y="220.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 3</text>
  <circle cx="222.0" cy="140.0" r="20" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="222.0" y="146.0" fill="#38bdf8" font-size="17" text-anchor="middle">×</text>
  <rect x="275.0" y="108.0" width="110.0" height="64.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="330.0" y="134.0" fill="#e2e8f0" font-size="15" text-anchor="middle">q = 6</text>
  <text x="330.0" y="158.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 1</text>
  <circle cx="470.0" cy="140.0" r="20" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="470.0" y="146.0" fill="#38bdf8" font-size="17" text-anchor="middle">+</text>
  <rect x="560.0" y="108.0" width="110.0" height="64.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.8"/>
  <text x="615.0" y="134.0" fill="#e2e8f0" font-size="15" text-anchor="middle">L = 9</text>
  <text x="615.0" y="158.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 1</text>
  <line x1="134.0" y1="104.0" x2="204.0" y2="130.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="134.0" y1="196.0" x2="204.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="242.0" y1="140.0" x2="273.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="385.0" y1="140.0" x2="448.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="490.0" y1="140.0" x2="558.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <path d="M134,76 C 260,20 400,30 462,118" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <text x="330.0" y="40.0" fill="#f59e0b" font-size="14" text-anchor="middle">바로 가는 길: 비율 1</text>
  <path d="M290,176 C 230,210 170,190 136,128" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ar-amber)" stroke-dasharray="6 5"/>
  <text x="250.0" y="232.0" fill="#f59e0b" font-size="14" text-anchor="middle">q 를 거친 길: 1 × b = 2</text>
  <rect x="20.0" y="256.0" width="210.0" height="196.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="125.0" y="282.0" fill="#38bdf8" font-size="15" text-anchor="middle">a</text>
  <line x1="32.0" y1="294.0" x2="218.0" y2="294.0" stroke="#1e293b" stroke-width="1"/>
  <text x="34.0" y="316.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="125.0" y="336.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 3</text>
  <text x="34.0" y="364.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="125.0" y="384.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 3.01</text>
  <text x="34.0" y="412.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="125.0" y="432.0" fill="#38bdf8" font-size="14" text-anchor="middle">3.01 − 3 = +0.01</text>
  <rect x="255.0" y="256.0" width="210.0" height="196.0" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="360.0" y="282.0" fill="#f87171" font-size="15" text-anchor="middle">q = a × b</text>
  <line x1="267.0" y1="294.0" x2="453.0" y2="294.0" stroke="#1e293b" stroke-width="1"/>
  <text x="269.0" y="316.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="360.0" y="336.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3 × 2 = 6</text>
  <text x="269.0" y="364.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="360.0" y="384.0" fill="#e2e8f0" font-size="14" text-anchor="middle">3.01 × 2 = 6.02</text>
  <text x="269.0" y="412.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="360.0" y="432.0" fill="#f87171" font-size="14" text-anchor="middle">6.02 − 6 = +0.02</text>
  <rect x="490.0" y="256.0" width="210.0" height="196.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="595.0" y="282.0" fill="#a78bfa" font-size="15" text-anchor="middle">L = q + a</text>
  <line x1="502.0" y1="294.0" x2="688.0" y2="294.0" stroke="#1e293b" stroke-width="1"/>
  <text x="504.0" y="316.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 전</text>
  <text x="595.0" y="336.0" fill="#e2e8f0" font-size="14" text-anchor="middle">6 + 3 = 9</text>
  <text x="504.0" y="364.0" fill="#94a3b8" font-size="12" text-anchor="start">변화 후</text>
  <text x="595.0" y="384.0" fill="#e2e8f0" font-size="14" text-anchor="middle">6.02 + 3.01 = 9.03</text>
  <text x="504.0" y="412.0" fill="#94a3b8" font-size="12" text-anchor="start">변화량</text>
  <text x="595.0" y="432.0" fill="#a78bfa" font-size="14" text-anchor="middle">9.03 − 9 = +0.03</text>
  <rect x="110.0" y="466.0" width="500.0" height="56.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="360.0" y="500.0" fill="#34d399" font-size="15" text-anchor="middle">a → L 의 비율: +0.03 ÷ +0.01 = 3 = 두 길의 합 2 + 1</text>
</svg>
