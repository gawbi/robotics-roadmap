<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>a 가 두 곳에 쓰이면 두 길의 gradient 를 더한다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="60.0" width="92.0" height="54.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="66.0" y="82.0" fill="#e2e8f0" font-size="15" text-anchor="middle">a = 3</text>
  <text x="66.0" y="104.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 2 + 1 = 3</text>
  <rect x="20.0" y="170.0" width="92.0" height="54.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="66.0" y="192.0" fill="#e2e8f0" font-size="15" text-anchor="middle">b = 2</text>
  <text x="66.0" y="214.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 3</text>
  <circle cx="185.0" cy="140.0" r="17" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="185.0" y="146.0" fill="#38bdf8" font-size="18" text-anchor="middle">×</text>
  <line x1="112.0" y1="98.0" x2="169.0" y2="132.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="112.0" y1="192.0" x2="169.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="202.0" y1="140.0" x2="226.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="228.0" y="113.0" width="92.0" height="54.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="274.0" y="135.0" fill="#e2e8f0" font-size="15" text-anchor="middle">q = 6</text>
  <text x="274.0" y="157.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 1</text>
  <circle cx="390.0" cy="140.0" r="17" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="390.0" y="146.0" fill="#38bdf8" font-size="18" text-anchor="middle">+</text>
  <line x1="320.0" y1="140.0" x2="373.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <path d="M 112 72 Q 260 20 380 124" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="407.0" y1="140.0" x2="446.0" y2="140.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="448.0" y="113.0" width="92.0" height="54.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="494.0" y="135.0" fill="#e2e8f0" font-size="15" text-anchor="middle">L = 9</text>
  <text x="494.0" y="157.0" fill="#f59e0b" font-size="13" text-anchor="middle">grad 1</text>
  <text x="250.0" y="40.0" fill="#f59e0b" font-size="13" text-anchor="middle">바로 가는 길: 비율 1</text>
  <text x="250.0" y="206.0" fill="#f59e0b" font-size="13" text-anchor="middle">q 를 거친 길: 1 × b = 2</text>
  <path d="M 226 160 Q 160 200 112 110" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-amber)"/>
  <rect x="60.0" y="232.0" width="480.0" height="50.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="300.0" y="254.0" fill="#e2e8f0" font-size="14" text-anchor="middle">a = 3.01 이면 q = 6.02, L = 6.02 + 3.01 = 9.03</text>
  <text x="300.0" y="274.0" fill="#34d399" font-size="13" text-anchor="middle">비율 0.03 ÷ 0.01 = 3 = 두 길의 합</text>
</svg>
