<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위에서 내려다본 pinhole model. 렌즈 중심에서 앞으로 2 m, 오른쪽 0.4 m 인 점으로 직선을 그으면 앞으로 1 m 인 image plane 에서는 오른쪽 0.2 m 를 지난다. 두 직각삼각형은 모양이 같고 크기만 2 배 다르다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="32" fill="#94a3b8" font-size="13">위에서 내려다본 모습 (가로·세로 같은 축척)</text>
  <polygon points="60,260 560,260 560,160" fill="#f59e0b" fill-opacity="0.08"/>
  <polygon points="60,260 310,260 310,210" fill="#38bdf8" fill-opacity="0.18"/>
  <line x1="60" y1="260" x2="600" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="282" fill="#94a3b8" font-size="13" text-anchor="end">Z (앞)</text>
  <line x1="60" y1="260" x2="60" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="64" fill="#94a3b8" font-size="13">X (오른쪽)</text>
  <line x1="310" y1="80" x2="310" y2="275" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="318" y="96" fill="#38bdf8" font-size="13">image plane (앞으로 1 m)</text>
  <line x1="60" y1="260" x2="580" y2="156" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="560" y1="260" x2="560" y2="160" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="310" y1="260" x2="310" y2="210" stroke="#f87171" stroke-width="2"/>
  <circle cx="60" cy="260" r="6" fill="#e2e8f0"/>
  <text x="60" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle">렌즈 중심</text>
  <circle cx="560" cy="160" r="7" fill="#f59e0b"/>
  <text x="552" y="146" fill="#f59e0b" font-size="13" text-anchor="end">점 (X, Z) = (0.4, 2.0)</text>
  <circle cx="310" cy="210" r="6" fill="#34d399"/>
  <text x="300" y="196" fill="#34d399" font-size="13" text-anchor="end">x = 0.2</text>
  <text x="568" y="215" fill="#f87171" font-size="12">0.4 m</text>
  <text x="300" y="242" fill="#f87171" font-size="12" text-anchor="end">0.2 m</text>
  <text x="185" y="278" fill="#38bdf8" font-size="12" text-anchor="middle">앞으로 1 m</text>
  <text x="435" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">… 2 m 까지</text>
  <rect x="120" y="110" width="160" height="58" rx="10" fill="#111a2e" stroke="#1e293b"/>
  <text x="200" y="134" fill="#e2e8f0" font-size="14" text-anchor="middle">0.4 ÷ 2.0 = 0.2</text>
  <text x="200" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">x = X ÷ Z</text>
</svg>
