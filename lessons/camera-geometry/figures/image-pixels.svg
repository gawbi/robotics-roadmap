<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>640×480 사진의 pixel 좌표. 왼쪽 위가 (0, 0) 이고 u 는 오른쪽, v 는 아래쪽으로 커진다. 가운데 (320, 240) 과 점 (370, 215) 이 표시되어 있다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70" y="70" width="320" height="240" fill="#0e1628" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="110" y1="70" x2="110" y2="310"/><line x1="150" y1="70" x2="150" y2="310"/><line x1="190" y1="70" x2="190" y2="310"/>
    <line x1="230" y1="70" x2="230" y2="310"/><line x1="270" y1="70" x2="270" y2="310"/><line x1="310" y1="70" x2="310" y2="310"/><line x1="350" y1="70" x2="350" y2="310"/>
    <line x1="70" y1="110" x2="390" y2="110"/><line x1="70" y1="150" x2="390" y2="150"/><line x1="70" y1="190" x2="390" y2="190"/>
    <line x1="70" y1="230" x2="390" y2="230"/><line x1="70" y1="270" x2="390" y2="270"/>
  </g>
  <line x1="70" y1="48" x2="395" y2="48" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <text x="402" y="53" fill="#38bdf8" font-size="15">u</text>
  <text x="232" y="40" fill="#94a3b8" font-size="12" text-anchor="middle">오른쪽으로 갈수록 커진다</text>
  <line x1="48" y1="70" x2="48" y2="315" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <text x="44" y="334" fill="#38bdf8" font-size="15">v</text>
  <text x="34" y="190" fill="#94a3b8" font-size="12" text-anchor="middle" transform="rotate(-90 34 190)">아래로 갈수록 커진다</text>
  <circle cx="70" cy="70" r="5" fill="#e2e8f0"/>
  <text x="78" y="88" fill="#e2e8f0" font-size="13">(0, 0)</text>
  <circle cx="389.5" cy="309.5" r="4" fill="#94a3b8"/>
  <text x="384" y="300" fill="#94a3b8" font-size="13" text-anchor="end">(639, 479)</text>
  <line x1="230" y1="190" x2="255" y2="190" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="255" y1="190" x2="255" y2="177.5" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="230" cy="190" r="5" fill="#a78bfa"/>
  <text x="226" y="210" fill="#a78bfa" font-size="13" text-anchor="middle">(320, 240)</text>
  <circle cx="255" cy="177.5" r="6" fill="#f59e0b"/>
  <text x="264" y="170" fill="#f59e0b" font-size="13">(370, 215)</text>
  <text x="420" y="100" fill="#e2e8f0" font-size="14">640×480 사진</text>
  <text x="420" y="124" fill="#94a3b8" font-size="13">가로 640 칸, 세로 480 칸</text>
  <text x="420" y="160" fill="#a78bfa" font-size="13">보라: 가운데 (320, 240)</text>
  <text x="420" y="196" fill="#f59e0b" font-size="13">주황: (370, 215)</text>
  <text x="420" y="218" fill="#94a3b8" font-size="13">가운데에서 오른쪽 50 칸,</text>
  <text x="420" y="238" fill="#94a3b8" font-size="13">위로 25 칸</text>
  <text x="420" y="276" fill="#64748b" font-size="12">격자 한 칸은 pixel 80×80 묶음</text>
</svg>
