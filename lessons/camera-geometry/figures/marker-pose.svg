<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇 base 위의 카메라와 책상 위의 marker. 카메라는 base 에서 (0.3, 0, 0.5) 에 아래를 보고 달려 있고, camera frame 에서 (0.05, −0.025, 0.5) 인 marker 가 base frame 에서는 (0.35, 0.025, 0) 이다</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="698" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="14" y1="330" x2="317.0" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="317.0" y="350" fill="#64748b" font-size="12" text-anchor="end">책상 (z = 0)</text>
  <rect x="20" y="296" width="50" height="34" rx="4" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="45" y="352" fill="#94a3b8" font-size="13" text-anchor="middle">로봇 base</text>
  <line x1="90" y1="330" x2="150" y2="330" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="90" y1="330" x2="90" y2="270" stroke="#7cb4d8" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="152" y="322" fill="#d88b8b" font-size="13">x</text>
  <text x="98" y="274" fill="#7cb4d8" font-size="13">z</text>
  <circle cx="90" cy="330" r="6" fill="#0b1220" stroke="#7fc4a2" stroke-width="1.5"/><line x1="86" y1="326" x2="94" y2="334" stroke="#7fc4a2" stroke-width="1.5"/><line x1="86" y1="334" x2="94" y2="326" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="92" y="354" fill="#7fc4a2" font-size="13">y</text>
  <rect x="206.0" y="74.0" width="44" height="22" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="219.0" y="96.0" width="18" height="8" fill="#e2e8f0"/>
  <circle cx="228.0" cy="100.0" r="3.5" fill="#d6aa62"/>
  <text x="228.0" y="66.0" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 (0.3, 0, 0.5)</text>
  <line x1="228.0" y1="100.0" x2="283.0" y2="100.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="228.0" y1="100.0" x2="228.0" y2="155.0" stroke="#7cb4d8" stroke-width="2.5" marker-end="url(#as)"/>
  <text x="286.0" y="94.0" fill="#d88b8b" font-size="13">x</text>
  <text x="220.0" y="156.0" fill="#7cb4d8" font-size="13" text-anchor="end">z</text>
  <text x="198.0" y="96.0" fill="#7fc4a2" font-size="13" text-anchor="end">y ⊙</text>
  <line x1="90" y1="40.0" x2="228.0" y2="40.0" stroke="#64748b" stroke-width="1"/>
  <line x1="90" y1="34.0" x2="90" y2="46.0" stroke="#64748b"/><line x1="228.0" y1="34.0" x2="228.0" y2="46.0" stroke="#64748b"/>
  <text x="159.0" y="34.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.3 m</text>
  <line x1="168.0" y1="100.0" x2="168.0" y2="330" stroke="#64748b" stroke-width="1"/>
  <text x="162.0" y="245.0" fill="#94a3b8" font-size="12" text-anchor="end">0.5 m</text>
  <line x1="228.0" y1="100.0" x2="251.0" y2="326" stroke="#d6aa62" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="237.0" y="325" width="28" height="5" fill="#e2e8f0"/>
  <rect x="237.0" y="325" width="7" height="5" fill="#0b1220"/><rect x="251.0" y="325" width="7" height="5" fill="#0b1220"/>
  <circle cx="251.0" cy="327" r="4" fill="#d6aa62"/>
  <text x="267.0" y="284" fill="#d6aa62" font-size="13">marker</text>
  <text x="267.0" y="302" fill="#94a3b8" font-size="12">camera frame (0.05, −0.025, 0.5)</text>
  <text x="267.0" y="318" fill="#e2e8f0" font-size="12">base frame (0.35, 0.025, 0)</text>
  <text x="450" y="30" fill="#e2e8f0" font-size="14">T_base,marker</text>
  <text x="450" y="52" fill="#e2e8f0" font-size="14">  = T_base,cam · T_cam,marker</text>
  <text x="450" y="84" fill="#94a3b8" font-size="13">카메라 축을 base 에서 보면</text>
  <text x="450" y="106" fill="#e2e8f0" font-size="13">카메라 x = base x</text>
  <text x="450" y="126" fill="#e2e8f0" font-size="13">카메라 y = base −y</text>
  <text x="450" y="146" fill="#e2e8f0" font-size="13">카메라 z = base −z (아래)</text>
  <text x="450" y="184" fill="#94a3b8" font-size="13">camera (X, Y, Z) → base 방향 (X, −Y, −Z)</text>
  <text x="450" y="206" fill="#e2e8f0" font-size="13">(0.05, −0.025, 0.5) → (0.05, 0.025, −0.5)</text>
  <text x="450" y="240" fill="#94a3b8" font-size="13">카메라 위치 (0.3, 0, 0.5) 더하기</text>
  <text x="450" y="262" fill="#e2e8f0" font-size="13">(0.05, 0.025, −0.5) + (0.3, 0, 0.5)</text>
  <text x="450" y="288" fill="#d6aa62" font-size="15">= (0.35, 0.025, 0)</text>
  <text x="450" y="368" fill="#64748b" font-size="12">⊗ 화면 안쪽, ⊙ 화면 바깥쪽</text>
</svg>
