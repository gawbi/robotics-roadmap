<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ROS 2 카메라 데이터의 흐름. driver 가 image_raw 와 camera_info 를 내고, image_proc 의 rectify node 가 왜곡을 편 image_rect 를 만든다. detector 가 찾은 pixel (370, 215) 에 aligned depth 1.0 m 를 넣어 back-projection 하면 optical frame 의 (0.1, −0.05, 1.0) 이 되고, tf2 가 base_link 좌표로 옮긴다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="14.0" y="36.0" fill="#94a3b8" font-size="12" text-anchor="start">사진 쪽 (image topic)</text>
  <text x="14.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="start">숫자 쪽 (3D 점)</text>
  <rect x="14.0" y="60.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95.0" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">camera driver</text>
  <text x="95.0" y="106.0" fill="#94a3b8" font-size="12" text-anchor="middle">realsense2_camera</text>
  <rect x="204.0" y="60.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="285.0" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">image_raw</text>
  <text x="285.0" y="106.0" fill="#f59e0b" font-size="12" text-anchor="middle">+ camera_info (k, d)</text>
  <rect x="394.0" y="60.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475.0" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">image_proc rectify</text>
  <text x="475.0" y="106.0" fill="#38bdf8" font-size="12" text-anchor="middle">d 로 왜곡을 편다</text>
  <rect x="584.0" y="60.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="665.0" y="87.0" fill="#e2e8f0" font-size="14" text-anchor="middle">detector</text>
  <text x="665.0" y="106.0" fill="#38bdf8" font-size="12" text-anchor="middle">image_rect 에서 컵 찾기</text>
  <line x1="178.0" y1="91.0" x2="201.0" y2="91.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="368.0" y1="91.0" x2="391.0" y2="91.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="558.0" y1="91.0" x2="581.0" y2="91.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="665.0" y1="124.0" x2="665.0" y2="197.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <text x="673.0" y="165.0" fill="#f59e0b" font-size="12" text-anchor="start">pixel (370, 215)</text>
  <rect x="14.0" y="200.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="95.0" y="227.0" fill="#e2e8f0" font-size="14" text-anchor="middle">tf2</text>
  <text x="95.0" y="246.0" fill="#34d399" font-size="12" text-anchor="middle">base_link 좌표로</text>
  <rect x="204.0" y="200.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="285.0" y="227.0" fill="#e2e8f0" font-size="14" text-anchor="middle">optical frame 의 점</text>
  <text x="285.0" y="246.0" fill="#34d399" font-size="12" text-anchor="middle">(0.1, −0.05, 1.0)</text>
  <rect x="394.0" y="200.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="475.0" y="227.0" fill="#e2e8f0" font-size="14" text-anchor="middle">back-projection</text>
  <text x="475.0" y="246.0" fill="#f59e0b" font-size="12" text-anchor="middle">k: f = 500, (320, 240)</text>
  <rect x="584.0" y="200.0" width="162.0" height="62.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="665.0" y="227.0" fill="#e2e8f0" font-size="14" text-anchor="middle">aligned depth</text>
  <text x="665.0" y="246.0" fill="#a78bfa" font-size="12" text-anchor="middle">(370, 215) 의 depth 1.0 m</text>
  <line x1="582.0" y1="231.0" x2="559.0" y2="231.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="392.0" y1="231.0" x2="369.0" y2="231.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="202.0" y1="231.0" x2="179.0" y2="231.0" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="317.4" y1="124.0" x2="442.6" y2="197.0" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <text x="351.4" y="165.0" fill="#f59e0b" font-size="12" text-anchor="start">k</text>
  <text x="380.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">camera_info 의 d 는 rectify 에, k 는 back-projection 에 쓰이고,</text>
  <text x="380.0" y="317.0" fill="#94a3b8" font-size="12" text-anchor="middle">camera frame 에서 base_link 까지의 extrinsics 는 tf2 가 맡는다</text>
</svg>
