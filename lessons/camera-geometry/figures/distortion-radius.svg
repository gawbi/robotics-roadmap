<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>radial distortion. 중심에서 r = 0.5 인 점 (0.3, 0.4) 은 배율 0.95 로 중심 쪽 (0.285, 0.38) 으로 당겨지고, 중심 가까운 점 (0.1, 0) 은 거의 움직이지 않는다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- scale: 1 normalized unit = 600 px, origin (60, 50), y down -->
  <line x1="60" y1="50" x2="330" y2="50" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="60" y1="50" x2="60" y2="335" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="336" y="54" fill="#94a3b8" font-size="14">x</text>
  <text x="56" y="350" fill="#94a3b8" font-size="14" text-anchor="end">y</text>
  <circle cx="60" cy="50" r="4" fill="#e2e8f0"/>
  <text x="20" y="34" fill="#e2e8f0" font-size="13">중심 (0, 0)</text>
  <text x="120" y="30" fill="#64748b" font-size="12" text-anchor="middle">0.1</text>
  <line x1="120" y1="46" x2="120" y2="54" stroke="#475569"/>
  <text x="240" y="30" fill="#64748b" font-size="12" text-anchor="middle">0.3</text>
  <line x1="240" y1="46" x2="240" y2="54" stroke="#475569"/>

  <!-- arc r = 0.5 (300 px) -->
  <path d="M360,50 A300,300 0 0 1 60,350" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- right triangle legs -->
  <line x1="60" y1="50" x2="240" y2="50" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="240" y1="50" x2="240" y2="290" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="248" y="175" fill="#94a3b8" font-size="13">0.4</text>
  <line x1="60" y1="50" x2="240" y2="290" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="128" y="190" fill="#f59e0b" font-size="14" text-anchor="end">r = 0.5</text>

  <!-- far point and pulled point -->
  <circle cx="240" cy="290" r="7" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="231" cy="278" r="5" fill="#38bdf8"/>
  <text x="254" y="300" fill="#f59e0b" font-size="13">(0.3, 0.4)</text>
  <text x="222" y="268" fill="#38bdf8" font-size="13" text-anchor="end">(0.285, 0.38)</text>

  <!-- near point -->
  <circle cx="120" cy="50" r="6" fill="#34d399"/>
  <text x="128" y="72" fill="#34d399" font-size="13">(0.1, 0)</text>

  <!-- explanation panel -->
  <text x="380" y="110" fill="#e2e8f0" font-size="14">k₁ = −0.2, k₂ = 0</text>
  <text x="380" y="146" fill="#f59e0b" font-size="14">r² = 0.3² + 0.4² = 0.25</text>
  <text x="380" y="170" fill="#f59e0b" font-size="14">배율 = 1 − 0.2 × 0.25 = 0.95</text>
  <text x="380" y="194" fill="#38bdf8" font-size="14">(0.3, 0.4) → (0.285, 0.38)</text>
  <text x="380" y="236" fill="#34d399" font-size="14">(0.1, 0): r² = 0.01</text>
  <text x="380" y="260" fill="#34d399" font-size="14">배율 0.998, 거의 그대로</text>
  <text x="380" y="300" fill="#94a3b8" font-size="13">빈 원: 휘기 전 자리</text>
  <text x="380" y="322" fill="#94a3b8" font-size="13">파란 점: 휜 뒤 자리</text>
</svg>
