<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇이 depth 를 얻는 세 방법. depth camera 는 pixel 마다 거리를 함께 재고, stereo camera 는 두 사진에서 같은 점이 옆으로 밀린 정도로 거리를 계산하며, 학습한 policy 는 시연 데이터에서 사진과 행동의 짝을 직접 배운다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="678" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- panel 1: depth camera -->
  <rect x="14" y="14" width="210" height="242" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="119" y="40" fill="#38bdf8" font-size="15" text-anchor="middle">depth camera</text>
  <rect x="34" y="88" width="34" height="26" rx="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="68" cy="101" r="3" fill="#e2e8f0"/>
  <line x1="72" y1="101" x2="112" y2="70" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="72" y1="101" x2="112" y2="101" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="72" y1="101" x2="112" y2="132" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- depth image grid -->
  <g font-size="12" text-anchor="middle" fill="#e2e8f0">
    <rect x="120" y="60" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="135" y="80">1.0</text>
    <rect x="150" y="60" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="165" y="80">1.0</text>
    <rect x="180" y="60" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="195" y="80">2.0</text>
    <rect x="120" y="90" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="135" y="110">1.2</text>
    <rect x="150" y="90" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="165" y="110">1.0</text>
    <rect x="180" y="90" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="195" y="110">2.0</text>
    <rect x="120" y="120" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="135" y="140">1.2</text>
    <rect x="150" y="120" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="165" y="140">1.2</text>
    <rect x="180" y="120" width="30" height="30" fill="#0b1220" stroke="#475569"/><text x="195" y="140">2.0</text>
  </g>
  <text x="165" y="168" fill="#94a3b8" font-size="12" text-anchor="middle">depth image (m)</text>
  <text x="119" y="208" fill="#e2e8f0" font-size="13" text-anchor="middle">pixel 마다 거리를</text>
  <text x="119" y="228" fill="#e2e8f0" font-size="13" text-anchor="middle">함께 잰다</text>

  <!-- panel 2: stereo camera -->
  <rect x="235" y="14" width="210" height="242" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="40" fill="#f59e0b" font-size="15" text-anchor="middle">stereo camera</text>
  <circle cx="340" cy="70" r="7" fill="#f59e0b"/>
  <rect x="285" y="140" width="34" height="24" rx="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="361" y="140" width="34" height="24" rx="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="302" y1="140" x2="337" y2="76" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="378" y1="140" x2="343" y2="76" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4 4"/>
  <line x1="302" y1="178" x2="378" y2="178" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="340" y="194" fill="#94a3b8" font-size="12" text-anchor="middle">baseline</text>
  <text x="340" y="218" fill="#e2e8f0" font-size="13" text-anchor="middle">두 사진에서 밀린 정도</text>
  <text x="340" y="238" fill="#e2e8f0" font-size="13" text-anchor="middle">(disparity)로 거리 계산</text>

  <!-- panel 3: learned policy -->
  <rect x="456" y="14" width="210" height="242" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="561" y="40" fill="#34d399" font-size="15" text-anchor="middle">시연으로 학습한 policy</text>
  <rect x="470" y="88" width="50" height="38" rx="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="488" cy="110" r="6" fill="#a78bfa"/>
  <text x="495" y="144" fill="#94a3b8" font-size="12" text-anchor="middle">사진</text>
  <line x1="522" y1="107" x2="536" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="538" y="90" width="56" height="34" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="566" y="112" fill="#34d399" font-size="13" text-anchor="middle">policy</text>
  <line x1="596" y1="107" x2="610" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634" y="112" fill="#e2e8f0" font-size="13" text-anchor="middle">행동</text>
  <text x="561" y="208" fill="#e2e8f0" font-size="13" text-anchor="middle">사진과 행동의 짝을</text>
  <text x="561" y="228" fill="#e2e8f0" font-size="13" text-anchor="middle">시연 데이터에서 직접 배운다</text>
</svg>
