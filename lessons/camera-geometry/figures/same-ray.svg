<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위에서 내려다본 그림. 렌즈 중심에서 뻗은 직선 하나 위에 1 m, 2 m, 3 m 거리의 세 점이 있고, 세 점 모두 image plane 의 같은 자리 x = 0.1, 곧 pixel u = 370 에 찍힌다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70" y1="250" x2="600" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="240" fill="#94a3b8" font-size="13" text-anchor="end">Z (앞)</text>
  <line x1="70" y1="250" x2="70" y2="60" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="64" fill="#94a3b8" font-size="13">X (오른쪽)</text>
  <text x="220" y="270" fill="#64748b" font-size="12" text-anchor="middle">1 m</text>
  <text x="370" y="270" fill="#64748b" font-size="12" text-anchor="middle">2 m</text>
  <text x="520" y="270" fill="#64748b" font-size="12" text-anchor="middle">3 m</text>
  <line x1="220" y1="90" x2="220" y2="250" stroke="#7cb4d8" stroke-width="2.5"/>
  <text x="226" y="86" fill="#7cb4d8" font-size="13">image plane (1 m)</text>
  <line x1="70" y1="250" x2="580" y2="80" stroke="#d6aa62" stroke-width="1.6" stroke-dasharray="6 4"/>
  <circle cx="70" cy="250" r="6" fill="#e2e8f0"/>
  <text x="70" y="290" fill="#e2e8f0" font-size="12" text-anchor="middle">렌즈 중심</text>
  <circle cx="370" cy="150" r="7" fill="#d6aa62"/>
  <circle cx="520" cy="100" r="7" fill="#d6aa62"/>
  <circle cx="220" cy="200" r="7" fill="#d6aa62"/>
  <circle cx="220" cy="200" r="12" fill="none" stroke="#7fc4a2" stroke-width="2.5"/>
  <text x="378" y="174" fill="#d6aa62" font-size="13">(X, Z) = (0.2, 2)</text>
  <text x="528" y="124" fill="#d6aa62" font-size="13">(0.3, 3)</text>
  <text x="232" y="224" fill="#d6aa62" font-size="13">(0.1, 1)</text>
  <text x="212" y="188" fill="#7fc4a2" font-size="13" text-anchor="end">x = 0.1 → u = 370</text>
  <text x="320" y="36" fill="#e2e8f0" font-size="14">세 점 모두 X ÷ Z = 0.1</text>
  <text x="320" y="56" fill="#94a3b8" font-size="12">0.1 ÷ 1 = 0.2 ÷ 2 = 0.3 ÷ 3</text>
  <text x="620" y="306" fill="#64748b" font-size="12" text-anchor="end">X 방향은 알아보기 쉽게 늘려 그렸다</text>
</svg>
