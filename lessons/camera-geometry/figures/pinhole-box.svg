<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pinhole camera. 나무의 꼭대기에서 온 빛이 구멍을 지나 상자 뒷벽의 아래쪽에 닿아 거꾸로 된 상이 맺힌다. 계산에서는 구멍 앞 같은 거리에 뒤집히지 않은 가상의 image plane 을 둔다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <!-- box: back wall x=60, front x=200, hole y=170 -->
  <rect x="60" y="100" width="140" height="140" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="200" y1="165" x2="200" y2="175" stroke="#111a2e" stroke-width="4"/>
  <circle cx="200" cy="170" r="3.5" fill="#e2e8f0"/>
  <text x="130" y="90" fill="#94a3b8" font-size="13" text-anchor="middle">빛이 안 드는 상자</text>
  <text x="206" y="262" fill="#e2e8f0" font-size="13" text-anchor="middle">구멍 (렌즈 중심)</text>
  <line x1="200" y1="248" x2="200" y2="176" stroke="#64748b" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- tree at x=560: top y=100, base y=250 -->
  <rect x="553" y="200" width="14" height="50" fill="#a16207"/>
  <polygon points="560,100 528,205 592,205" fill="#34d399"/>
  <text x="560" y="275" fill="#94a3b8" font-size="13" text-anchor="middle">바깥의 나무</text>
  <!-- rays -->
  <line x1="560" y1="100" x2="60" y2="197.2" stroke="#f59e0b" stroke-width="1.6"/>
  <line x1="560" y1="250" x2="60" y2="138.9" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <!-- inverted image on back wall: top of tree at 197.2, bottom at 138.9 -->
  <rect x="64" y="138.9" width="5" height="10" fill="#a16207"/>
  <polygon points="66.5,197.2 60.5,148.9 72.5,148.9" fill="#34d399"/>
  <text x="80" y="226" fill="#f59e0b" font-size="12">거꾸로 선 상</text>
  <!-- virtual image plane at x=340 -->
  <line x1="340" y1="110" x2="340" y2="235" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="346.5,142.8 340.5,191.1 352.5,191.1" fill="#34d399" opacity="0.9"/>
  <rect x="344" y="191.1" width="5" height="10" fill="#a16207"/>
  <text x="346" y="100" fill="#38bdf8" font-size="13">image plane (가상의 판)</text>
  <text x="340" y="252" fill="#34d399" font-size="12" text-anchor="middle">바로 선 상</text>
  <!-- equal distance markers -->
  <line x1="60" y1="292" x2="200" y2="292" stroke="#94a3b8" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="200" y1="292" x2="340" y2="292" stroke="#94a3b8" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="130" y="310" fill="#94a3b8" font-size="12" text-anchor="middle">거리 f</text>
  <text x="270" y="310" fill="#94a3b8" font-size="12" text-anchor="middle">같은 거리 f</text>
  <text x="430" y="40" fill="#f59e0b" font-size="13">꼭대기에서 온 빛은 구멍을 지나</text>
  <text x="430" y="60" fill="#f59e0b" font-size="13">뒷벽의 아래쪽에 닿는다</text>
</svg>
