<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>팔을 편 채 어깨에만 torque 1 N·m 를 준 첫 순간. 팔꿈치 추는 앞으로 가속하지만 손끝 추는 제자리에 남으려 해서, 어깨 각가속도는 +4 이고 팔꿈치는 반대쪽으로 −8 만큼 꺾인다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="618" height="260" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="32.0" fill="#94a3b8" font-size="13" text-anchor="start">책상 위에서 본 팔 (gravity 가 joint 를 돌리지 않는다)</text>
  <line x1="80.0" y1="140.0" x2="277.5" y2="108.7" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="277.5" y1="108.7" x2="475.1" y2="140.0" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="277.5" cy="108.7" r="11" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="475.1" cy="140.0" r="11" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <line x1="80.0" y1="140.0" x2="480.0" y2="140.0" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="80.0" cy="140.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="80.0" cy="140.0" r="3" fill="#e2e8f0"/>
  <circle cx="280.0" cy="140.0" r="13" fill="#f59e0b"/>
  <text x="280.0" y="144.0" fill="#0b1220" font-size="11" text-anchor="middle" font-weight="700">1kg</text>
  <circle cx="480.0" cy="140.0" r="13" fill="#f59e0b"/>
  <text x="480.0" y="144.0" fill="#0b1220" font-size="11" text-anchor="middle" font-weight="700">1kg</text>
  <path d="M118,146 A38,38 0 0,0 100,107" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="60.0" y="94.0" fill="#f59e0b" font-size="13" text-anchor="start">τ₁ = 1 N·m</text>
  <text x="60.0" y="180.0" fill="#94a3b8" font-size="12" text-anchor="start">어깨</text>
  <line x1="280.0" y1="124.0" x2="280.0" y2="116.0" stroke="#38bdf8" stroke-width="2"/>
  <line x1="308.0" y1="132.0" x2="308.0" y2="92.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <text x="320.0" y="100.0" fill="#38bdf8" font-size="12.5" text-anchor="start">팔꿈치 추: 앞으로 밀려 나간다</text>
  <text x="480.0" y="180.0" fill="#94a3b8" font-size="12.5" text-anchor="end">손끝 추: 관성으로 제자리에 남는다</text>
  <text x="280.0" y="180.0" fill="#94a3b8" font-size="12" text-anchor="middle">τ₂ = 0</text>
  <text x="24.0" y="220.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">첫 순간의 각가속도</text>
  <text x="170.0" y="220.0" fill="#f59e0b" font-size="13.5" text-anchor="start">어깨 α₁ = +4 rad/s²</text>
  <text x="340.0" y="220.0" fill="#38bdf8" font-size="13.5" text-anchor="start">팔꿈치 α₂ = −8 rad/s²</text>
  <text x="24.0" y="246.0" fill="#94a3b8" font-size="12" text-anchor="start">점선: 잠시 뒤의 자세 (과장해서 그림)</text>
</svg>
