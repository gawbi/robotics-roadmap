<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>미는 힘에 따른 마찰 힘. 마찰 힘은 미는 힘과 같이 커지다가 한계 μ × 9.81 = 9.81 N 에서 멈추고, 그보다 세게 밀면 남는 힘만큼 상자가 가속한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="618" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="40.0" width="330.0" height="220.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="260.0" x2="400.0" y2="260.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="40.0" x2="70.0" y2="260.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="277.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="180.0" y="277.0" fill="#64748b" font-size="12" text-anchor="middle">5</text>
  <text x="285.8" y="277.0" fill="#64748b" font-size="12" text-anchor="middle">9.81</text>
  <text x="334.0" y="277.0" fill="#64748b" font-size="12" text-anchor="middle">12</text>
  <text x="400.0" y="277.0" fill="#64748b" font-size="12" text-anchor="middle">15</text>
  <text x="63.0" y="264.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="63.0" y="174.1" fill="#64748b" font-size="12" text-anchor="end">4.905</text>
  <text x="63.0" y="84.2" fill="#64748b" font-size="12" text-anchor="end">9.81</text>
  <text x="400.0" y="294.0" fill="#94a3b8" font-size="13" text-anchor="end">미는 힘 (N)</text>
  <text x="70.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="start">마찰 힘 (N)</text>
  <line x1="70.0" y1="80.2" x2="400.0" y2="80.2" stroke="#7fc4a2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="70.0" y1="170.1" x2="400.0" y2="170.1" stroke="#a99ad6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <polyline points="70.0,260.0 285.8,80.2 400.0,80.2" fill="none" stroke="#7fc4a2" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="70.0,260.0 177.9,170.1 400.0,170.1" fill="none" stroke="#a99ad6" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 4"/>
  <circle cx="180.0" cy="168.3" r="5" fill="#7cb4d8"/>
  <text x="172.0" y="158.3" fill="#7cb4d8" font-size="12" text-anchor="end">5 N → 마찰 5 N</text>
  <circle cx="334.0" cy="80.2" r="5" fill="#d6aa62"/>
  <line x1="334.0" y1="72.2" x2="334.0" y2="44.0" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="334.0" y="34.0" fill="#d6aa62" font-size="12" text-anchor="middle">12 N → 남는 힘 2.19</text>
  <text x="420.0" y="62.0" fill="#e2e8f0" font-size="13" text-anchor="start">1 kg 상자, normal force 9.81 N</text>
  <line x1="420.0" y1="84.0" x2="446.0" y2="84.0" stroke="#7fc4a2" stroke-width="2.5"/>
  <text x="454.0" y="89.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">μ = 1: 한계 9.81 N</text>
  <line x1="420.0" y1="110.0" x2="446.0" y2="110.0" stroke="#a99ad6" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="454.0" y="115.0" fill="#a99ad6" font-size="12.5" text-anchor="start">μ = 0.5: 한계 4.905 N</text>
  <text x="420.0" y="154.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한계보다 약하게 밀면</text>
  <text x="420.0" y="174.0" fill="#94a3b8" font-size="12.5" text-anchor="start">마찰 = 미는 힘, 움직이지 않음</text>
  <text x="420.0" y="206.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한계보다 세게 밀면</text>
  <text x="420.0" y="226.0" fill="#94a3b8" font-size="12.5" text-anchor="start">마찰 = 한계, 남는 힘으로 가속</text>
</svg>
