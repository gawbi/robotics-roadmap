  <text x="650.0" y="34.0" fill="#d88b8b" font-size="12" text-anchor="end">step 4 는 25.84 (그림 밖)</text>
  <text x="400.0" y="290.0" fill="#94a3b8" font-size="12.5" text-anchor="start">위치 x (m): 부호를 바꾸며 멀어진다</text>
