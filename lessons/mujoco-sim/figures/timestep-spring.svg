<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>단단함 100 N/m 용수철에 1 cm 눌린 1 kg 물체. Δt = 0.1 초면 −0.01 과 0.01 사이를 오가고, Δt = 0.3 초면 −0.08, 0.55, −3.77, 25.84 로 튀며 발산한다</title>
