<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>1 m 높이에서 놓은 상자의 높이를 Δt = 0.1 초로 계산한 결과. step 4 까지 0.019 m 로 내려오고, step 5 에서 −0.47 m 로 바닥 아래로 뚫고 들어간다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70.0" y="40.0" width="330.0" height="200.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="240.0" x2="400.0" y2="240.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="40.0" x2="70.0" y2="240.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="136.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <text x="202.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">2</text>
  <text x="268.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">3</text>
  <text x="334.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">4</text>
  <text x="400.0" y="257.0" fill="#64748b" font-size="12" text-anchor="middle">5</text>
  <text x="63.0" y="232.2" fill="#64748b" font-size="12" text-anchor="end">-0.5</text>
  <text x="63.0" y="173.4" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="63.0" y="114.6" fill="#64748b" font-size="12" text-anchor="end">0.5</text>
  <text x="63.0" y="55.8" fill="#64748b" font-size="12" text-anchor="end">1</text>
  <text x="400.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="end">step</text>
  <text x="70.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="start">높이 z (m)</text>
  <rect x="70.0" y="169.4" width="330.0" height="70.6" fill="#d6aa62" fill-opacity="0.08"/>
  <line x1="70.0" y1="169.4" x2="400.0" y2="169.4" stroke="#d6aa62" stroke-width="2"/>
  <text x="76.0" y="185.4" fill="#d6aa62" font-size="12" text-anchor="start">바닥 아래</text>
  <polyline points="70.0,51.8 136.0,63.3 202.0,86.4 268.0,121.0 334.0,167.2 400.0,224.9" fill="none" stroke="#7cb4d8" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="70.0" cy="51.8" r="4.5" fill="#7cb4d8"/>
  <circle cx="136.0" cy="63.3" r="4.5" fill="#7cb4d8"/>
  <circle cx="202.0" cy="86.4" r="4.5" fill="#7cb4d8"/>
  <circle cx="268.0" cy="121.0" r="4.5" fill="#7cb4d8"/>
  <circle cx="334.0" cy="167.2" r="4.5" fill="#7cb4d8"/>
  <circle cx="400.0" cy="224.9" r="4.5" fill="#d88b8b"/>
  <text x="144.0" y="55.3" fill="#94a3b8" font-size="11.5" text-anchor="start">0.9019</text>
  <text x="210.0" y="78.4" fill="#94a3b8" font-size="11.5" text-anchor="start">0.7057</text>
  <text x="276.0" y="113.0" fill="#94a3b8" font-size="11.5" text-anchor="start">0.4114</text>
  <text x="326.0" y="159.2" fill="#94a3b8" font-size="11.5" text-anchor="end">0.019</text>
  <text x="392.0" y="228.9" fill="#d88b8b" font-size="12" text-anchor="end">−0.4715</text>
  <text x="430.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="start">계산 조건</text>
  <text x="430.0" y="86.0" fill="#94a3b8" font-size="12.5" text-anchor="start">질량 1 kg, 처음 높이 1 m</text>
  <text x="430.0" y="106.0" fill="#94a3b8" font-size="12.5" text-anchor="start">가속도 −9.81 m/s²</text>
  <text x="430.0" y="126.0" fill="#94a3b8" font-size="12.5" text-anchor="start">Δt = 0.1 초</text>
  <text x="430.0" y="166.0" fill="#d88b8b" font-size="13" text-anchor="start">식에 바닥이 없어서</text>
  <text x="430.0" y="186.0" fill="#d88b8b" font-size="13" text-anchor="start">step 5 에 47 cm 아래로</text>
  <text x="430.0" y="206.0" fill="#d88b8b" font-size="13" text-anchor="start">뚫고 들어간다</text>
  <text x="430.0" y="240.0" fill="#7fc4a2" font-size="13" text-anchor="start">접촉 계산이 필요하다</text>
</svg>
