<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 302" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 손가락으로 0.1 kg 큐브를 0.6 N 씩 누를 때. μ = 1 이면 마찰 한계 1.2 N 이 무게 0.981 N 보다 커서 들리고, μ = 0.6 이면 0.72 N 이라 미끄러진다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="300" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="36.0" fill="#34d399" font-size="15" text-anchor="start">μ = 1</text>
  <rect x="82.0" y="90.0" width="24.0" height="110.0" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="214.0" y="90.0" width="24.0" height="110.0" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="108.0" y="100.0" width="104.0" height="60.0" rx="3" fill="#0c3a52" stroke="#38bdf8" stroke-width="2"/>
  <text x="160.0" y="135.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0.1 kg</text>
  <line x1="50.0" y1="145.0" x2="80.0" y2="145.0" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow-white)"/>
  <line x1="270.0" y1="145.0" x2="240.0" y2="145.0" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="46.0" y="133.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.6 N</text>
  <text x="274.0" y="133.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.6 N</text>
  <line x1="102.0" y1="148.0" x2="102.0" y2="112.0" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="218.0" y1="148.0" x2="218.0" y2="112.0" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="160.0" y1="162.0" x2="160.0" y2="209.1" stroke="#f87171" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="160.0" y="225.1" fill="#f87171" font-size="12" text-anchor="middle">무게 0.981 N</text>
  <text x="30.0" y="258.0" fill="#f59e0b" font-size="13.5" text-anchor="start">마찰 한계 2 × 1 × 0.6 = 1.2 N</text>
  <text x="30.0" y="282.0" fill="#34d399" font-size="13.5" text-anchor="start">1.2 ≥ 0.981 → 들린다</text>
  <line x1="330.0" y1="24.0" x2="330.0" y2="280.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="360.0" y="36.0" fill="#f87171" font-size="15" text-anchor="start">μ = 0.6</text>
  <rect x="412.0" y="90.0" width="24.0" height="110.0" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="544.0" y="90.0" width="24.0" height="110.0" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="438.0" y="112.0" width="104.0" height="60.0" rx="3" fill="#0c3a52" stroke="#38bdf8" stroke-width="2"/>
  <text x="490.0" y="147.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0.1 kg</text>
  <line x1="380.0" y1="145.0" x2="410.0" y2="145.0" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow-white)"/>
  <line x1="600.0" y1="145.0" x2="570.0" y2="145.0" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="376.0" y="133.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.6 N</text>
  <text x="604.0" y="133.0" fill="#e2e8f0" font-size="12" text-anchor="middle">0.6 N</text>
  <line x1="432.0" y1="160.0" x2="432.0" y2="138.4" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="548.0" y1="160.0" x2="548.0" y2="138.4" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <line x1="490.0" y1="174.0" x2="490.0" y2="221.1" stroke="#f87171" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="490.0" y="237.1" fill="#f87171" font-size="12" text-anchor="middle">무게 0.981 N</text>
  <text x="360.0" y="258.0" fill="#f59e0b" font-size="13.5" text-anchor="start">마찰 한계 2 × 0.6 × 0.6 = 0.72 N</text>
  <text x="360.0" y="282.0" fill="#f87171" font-size="13.5" text-anchor="start">0.72 &lt; 0.981 → 미끄러진다</text>
</svg>
