<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 1 kg, 0.5 m 팔의 두 모델. 질량이 끝에 몰린 추는 inertia 0.25 라 torque 1 에 각가속도 4, 막대 전체에 고르게 퍼진 막대는 inertia 0.083 이라 각가속도 12 다. 수평 자세의 gravity torque 도 4.905 와 2.45 로 다르다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="36.0" fill="#f59e0b" font-size="14" text-anchor="start">끝에 몰린 추</text>
  <line x1="60.0" y1="110.0" x2="280.0" y2="110.0" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="60.0" cy="110.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="60.0" cy="110.0" r="3" fill="#e2e8f0"/>
  <circle cx="280.0" cy="110.0" r="15" fill="#f59e0b"/>
  <text x="280.0" y="114.0" fill="#0b1220" font-size="11" text-anchor="middle" font-weight="700">1kg</text>
  <line x1="60.0" y1="142.0" x2="280.0" y2="142.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
  <text x="170.0" y="160.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.5 m</text>
  <text x="280.0" y="86.0" fill="#f59e0b" font-size="12" text-anchor="middle">무게중심 0.5 m</text>
  <text x="30.0" y="206.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">I = 1 × 0.5² = 0.25</text>
  <text x="30.0" y="232.0" fill="#94a3b8" font-size="13.5" text-anchor="start">torque 1 → α = 1 ÷ 0.25 = 4</text>
  <text x="30.0" y="258.0" fill="#94a3b8" font-size="13.5" text-anchor="start">gravity torque = 9.81 × 0.5 = 4.905</text>
  <line x1="330.0" y1="24.0" x2="330.0" y2="280.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="355.0" y="36.0" fill="#38bdf8" font-size="14" text-anchor="start">고르게 퍼진 막대</text>
  <rect x="385.0" y="102.0" width="220.0" height="16.0" rx="4" fill="#0c3a52" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="385.0" cy="110.0" r="9" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="385.0" cy="110.0" r="3" fill="#e2e8f0"/>
  <circle cx="495.0" cy="110.0" r="6" fill="#38bdf8"/>
  <line x1="495.0" y1="98.0" x2="495.0" y2="80.0" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="495.0" y="74.0" fill="#38bdf8" font-size="12" text-anchor="middle">무게중심 0.25 m</text>
  <line x1="385.0" y1="142.0" x2="605.0" y2="142.0" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
  <text x="495.0" y="160.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.5 m, 1 kg</text>
  <text x="355.0" y="206.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">I = 1 × 0.5² ÷ 3 ≈ 0.083</text>
  <text x="355.0" y="232.0" fill="#94a3b8" font-size="13.5" text-anchor="start">torque 1 → α = 1 ÷ 0.083 = 12</text>
  <text x="355.0" y="258.0" fill="#94a3b8" font-size="13.5" text-anchor="start">gravity torque = 9.81 × 0.25 = 2.4525</text>
</svg>
