<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>sim-to-real gap 과 줄이는 방법. 모델 숫자의 오차(질량 20% 차이로 집게 끝 4 mm 처짐, μ 1 대 0.6 으로 집기 실패)와 모델에 없는 현상(지연, 기어 틈, noise, 영상)이 gap 을 만들고, system identification 은 모델 숫자를 실물에 맞추며 domain randomization 은 숫자를 범위 안에서 무작위로 바꿔 학습한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="20.0" width="220.0" height="250.0" rx="8" fill="#0e1628" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36.0" y="46.0" fill="#f59e0b" font-size="14" text-anchor="start">모델 숫자의 오차</text>
  <text x="36.0" y="80.0" fill="#e2e8f0" font-size="13" text-anchor="start">질량 20% 무거움</text>
  <text x="36.0" y="100.0" fill="#94a3b8" font-size="12.5" text-anchor="start">집게 끝 약 4 mm 처짐</text>
  <text x="36.0" y="138.0" fill="#e2e8f0" font-size="13" text-anchor="start">μ 1 → 실제 0.6</text>
  <text x="36.0" y="158.0" fill="#94a3b8" font-size="12.5" text-anchor="start">큐브가 미끄러짐</text>
  <text x="36.0" y="196.0" fill="#e2e8f0" font-size="13" text-anchor="start">mesh → 볼록 껍질</text>
  <text x="36.0" y="216.0" fill="#94a3b8" font-size="12.5" text-anchor="start">오목한 홈이 메워짐</text>
  <rect x="250.0" y="20.0" width="220.0" height="250.0" rx="8" fill="#0e1628" stroke="#f87171" stroke-width="1.5"/>
  <text x="266.0" y="46.0" fill="#f87171" font-size="14" text-anchor="start">모델에 없는 현상</text>
  <text x="266.0" y="80.0" fill="#e2e8f0" font-size="13" text-anchor="start">명령의 지연 20 ms</text>
  <text x="266.0" y="99.0" fill="#94a3b8" font-size="12.5" text-anchor="start">1 rad/s 면 0.02 rad 더 감</text>
  <text x="266.0" y="126.0" fill="#e2e8f0" font-size="13" text-anchor="start">기어 틈</text>
  <text x="266.0" y="145.0" fill="#94a3b8" font-size="12.5" text-anchor="start">틈만큼 흔들림</text>
  <text x="266.0" y="172.0" fill="#e2e8f0" font-size="13" text-anchor="start">센서 noise</text>
  <text x="266.0" y="191.0" fill="#94a3b8" font-size="12.5" text-anchor="start">측정값이 조금씩 흔들림</text>
  <text x="266.0" y="218.0" fill="#e2e8f0" font-size="13" text-anchor="start">카메라 영상</text>
  <text x="266.0" y="237.0" fill="#94a3b8" font-size="12.5" text-anchor="start">조명 · 반사 · 그림자</text>
  <rect x="480.0" y="20.0" width="220.0" height="250.0" rx="8" fill="#0e1628" stroke="#34d399" stroke-width="1.5"/>
  <text x="496.0" y="46.0" fill="#34d399" font-size="14" text-anchor="start">줄이는 방법</text>
  <text x="496.0" y="80.0" fill="#e2e8f0" font-size="13" text-anchor="start">system identification</text>
  <text x="496.0" y="100.0" fill="#94a3b8" font-size="12.5" text-anchor="start">실물을 재서 숫자를 고친다</text>
  <text x="496.0" y="140.0" fill="#e2e8f0" font-size="13" text-anchor="start">domain randomization</text>
  <text x="496.0" y="160.0" fill="#94a3b8" font-size="12.5" text-anchor="start">시작마다 숫자를 무작위로</text>
  <line x1="500.0" y1="214.0" x2="680.0" y2="214.0" stroke="#475569" stroke-width="1.5"/>
  <rect x="525.7" y="206" width="128.6" height="16" rx="3" fill="#34d399" fill-opacity="0.25" stroke="#34d399"/>
  <text x="525.7" y="240.0" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <text x="590.0" y="240.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <text x="654.3" y="240.0" fill="#64748b" font-size="12" text-anchor="middle">1.5</text>
  <circle cx="538.6" cy="214.0" r="5" fill="#f59e0b"/>
  <text x="538.6" y="200.0" fill="#f59e0b" font-size="12" text-anchor="middle">실제 0.6</text>
  <text x="496.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="start">μ 를 0.5~1.5 에서 뽑으면 0.6 포함</text>
  <line x1="240.0" y1="300.0" x2="480.0" y2="300.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)" marker-start="url(#arrow-gray)"/>
  <text x="360.0" y="292.0" fill="#94a3b8" font-size="12" text-anchor="middle"></text>
  <text x="130.0" y="305.0" fill="#38bdf8" font-size="14" text-anchor="middle">simulation</text>
  <text x="590.0" y="305.0" fill="#f59e0b" font-size="14" text-anchor="middle">실제 로봇</text>
  <text x="360.0" y="326.0" fill="#e2e8f0" font-size="13" text-anchor="middle">sim-to-real gap: 같은 동작의 결과 차이</text>
  <text x="360.0" y="346.0" fill="#94a3b8" font-size="12.5" text-anchor="middle">예: 집기 성공률 95% → 60%</text>
</svg>
