<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 joint 팔을 적은 MJCF 의 구조. worldbody 안에 위팔 body, 그 안에 아래팔 body 가 들어 있고, body 마다 joint·geom·질량이 있다. actuator 는 따로 모아 어느 joint 를 돌리는지 적는다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="428" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16.0" y="16.0" width="470.0" height="398.0" rx="8" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <text x="26.0" y="38.0" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;mujoco&gt;</text>
  <text x="39.0" y="57.4" fill="#94a3b8" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;option timestep=&quot;0.005&quot;/&gt;</text>
  <text x="39.0" y="76.8" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;worldbody&gt;</text>
  <text x="52.0" y="96.2" fill="#7fc4a2" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;geom type=&quot;plane&quot; size=&quot;1 1 0.1&quot;/&gt;</text>
  <text x="52.0" y="115.6" fill="#7cb4d8" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;body name=&quot;upper_arm&quot;&gt;</text>
  <text x="65.0" y="135.0" fill="#a99ad6" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;joint name=&quot;shoulder&quot; type=&quot;hinge&quot; axis=&quot;0 1 0&quot;/&gt;</text>
  <text x="65.0" y="154.4" fill="#7fc4a2" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;geom type=&quot;capsule&quot; fromto=&quot;0 0 0 .5 0 0&quot; size=&quot;.02&quot; mass=&quot;0&quot;/&gt;</text>
  <text x="65.0" y="173.8" fill="#d6aa62" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;geom type=&quot;sphere&quot; pos=&quot;0.5 0 0&quot; size=&quot;0.03&quot; mass=&quot;1&quot;/&gt;</text>
  <text x="65.0" y="193.2" fill="#7cb4d8" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;body name=&quot;forearm&quot; pos=&quot;0.5 0 0&quot;&gt;</text>
  <text x="78.0" y="212.6" fill="#a99ad6" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;joint name=&quot;elbow&quot; type=&quot;hinge&quot; axis=&quot;0 1 0&quot;/&gt;</text>
  <text x="78.0" y="232.0" fill="#7fc4a2" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;geom type=&quot;capsule&quot; fromto=&quot;0 0 0 .5 0 0&quot; size=&quot;.02&quot; mass=&quot;0&quot;/&gt;</text>
  <text x="78.0" y="251.4" fill="#d6aa62" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;geom type=&quot;sphere&quot; pos=&quot;0.5 0 0&quot; size=&quot;0.03&quot; mass=&quot;1&quot;/&gt;</text>
  <text x="65.0" y="270.8" fill="#7cb4d8" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;/body&gt;</text>
  <text x="52.0" y="290.2" fill="#7cb4d8" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;/body&gt;</text>
  <text x="39.0" y="309.6" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;/worldbody&gt;</text>
  <text x="39.0" y="329.0" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;actuator&gt;</text>
  <text x="52.0" y="348.4" fill="#d88b8b" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;motor joint=&quot;shoulder&quot; ctrlrange=&quot;-2.94 2.94&quot;/&gt;</text>
  <text x="52.0" y="367.8" fill="#d88b8b" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;position joint=&quot;elbow&quot; kp=&quot;998.22&quot; forcerange=&quot;-2.94 2.94&quot;/&gt;</text>
  <text x="39.0" y="387.2" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;/actuator&gt;</text>
  <text x="26.0" y="406.6" fill="#e2e8f0" font-size="10.1" text-anchor="start" font-family="Menlo, 'SF Mono', Consolas, monospace">&lt;/mujoco&gt;</text>
  <text x="506.0" y="42.0" fill="#e2e8f0" font-size="14" text-anchor="start">tree 구조</text>
  <rect x="506.0" y="56.0" width="110.0" height="32.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="561.0" y="77.0" fill="#e2e8f0" font-size="13" text-anchor="middle">worldbody</text>
  <rect x="536.0" y="108.0" width="110.0" height="32.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="591.0" y="129.0" fill="#e2e8f0" font-size="13" text-anchor="middle">upper_arm</text>
  <rect x="566.0" y="160.0" width="110.0" height="32.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="621.0" y="181.0" fill="#e2e8f0" font-size="13" text-anchor="middle">forearm</text>
  <path d="M522,90 L522,124 L534,124" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <path d="M552,142 L552,176 L564,176" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="654.0" y="128.0" fill="#a99ad6" font-size="12" text-anchor="start">shoulder</text>
  <text x="684.0" y="180.0" fill="#a99ad6" font-size="12" text-anchor="start">elbow</text>
  <text x="506.0" y="226.0" fill="#e2e8f0" font-size="14" text-anchor="start">색 구분</text>
  <circle cx="512.0" cy="248.0" r="5" fill="#7cb4d8"/>
  <text x="524.0" y="253.0" fill="#7cb4d8" font-size="12" text-anchor="start">body: 부품 하나, 안에 넣으면 붙는다</text>
  <circle cx="512.0" cy="274.0" r="5" fill="#a99ad6"/>
  <text x="524.0" y="279.0" fill="#a99ad6" font-size="12" text-anchor="start">joint: 바깥 body 에 대해 움직이는 방식</text>
  <circle cx="512.0" cy="300.0" r="5" fill="#7fc4a2"/>
  <text x="524.0" y="305.0" fill="#7fc4a2" font-size="12" text-anchor="start">geom: 접촉에 쓰는 모양</text>
  <circle cx="512.0" cy="326.0" r="5" fill="#d6aa62"/>
  <text x="524.0" y="331.0" fill="#d6aa62" font-size="12" text-anchor="start">mass: 질량 (추 1 kg)</text>
  <circle cx="512.0" cy="352.0" r="5" fill="#d88b8b"/>
  <text x="524.0" y="357.0" fill="#d88b8b" font-size="12" text-anchor="start">actuator: joint 를 돌리는 장치</text>
  <circle cx="512.0" cy="378.0" r="5" fill="#94a3b8"/>
  <text x="524.0" y="383.0" fill="#94a3b8" font-size="12" text-anchor="start">option: timestep 같은 설정</text>
  <text x="506.0" y="414.0" fill="#94a3b8" font-size="12" text-anchor="start">joint angle 같은 상태는 파일에 없다</text>
</svg>
