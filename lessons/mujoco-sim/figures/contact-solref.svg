<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MuJoCo 3.13 으로 직접 잰 1 kg 상자의 정지 침투. solref time constant 가 0.02 초(기본값)면 0.108 mm, 0.01 초(SO-101 집게)면 0.061 mm, 0.005 초면 0.043 mm 이고, 같은 기본값에서 10 g 상자도 0.108 mm 다. time constant 는 timestep 의 2 배 이상이어야 한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">정지 침투 (mm), 1 kg 상자, MuJoCo 3.13 실측</text>
  <line x1="70.0" y1="260.0" x2="400.0" y2="260.0" stroke="#1e293b" stroke-width="1"/>
  <text x="62.0" y="264.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <line x1="70.0" y1="190.0" x2="400.0" y2="190.0" stroke="#1e293b" stroke-width="1"/>
  <text x="62.0" y="194.0" fill="#64748b" font-size="12" text-anchor="end">0.04</text>
  <line x1="70.0" y1="120.0" x2="400.0" y2="120.0" stroke="#1e293b" stroke-width="1"/>
  <text x="62.0" y="124.0" fill="#64748b" font-size="12" text-anchor="end">0.08</text>
  <line x1="70.0" y1="50.0" x2="400.0" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="62.0" y="54.0" fill="#64748b" font-size="12" text-anchor="end">0.12</text>
  <line x1="70.0" y1="50.0" x2="70.0" y2="260.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="260.0" x2="400.0" y2="260.0" stroke="#475569" stroke-width="1.5"/>
  <rect x="99.0" y="71.0" width="62" height="189.0" rx="4" fill="#7cb4d8" fill-opacity="0.3" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="130.0" y="63.0" fill="#7cb4d8" font-size="13" text-anchor="middle">0.108</text>
  <text x="130.0" y="280.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">0.02 초</text>
  <text x="130.0" y="298.0" fill="#94a3b8" font-size="12" text-anchor="middle">기본값</text>
  <rect x="204.0" y="153.2" width="62" height="106.8" rx="4" fill="#7fc4a2" fill-opacity="0.3" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="235.0" y="145.2" fill="#7fc4a2" font-size="13" text-anchor="middle">0.061</text>
  <text x="235.0" y="280.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">0.01 초</text>
  <text x="235.0" y="298.0" fill="#94a3b8" font-size="12" text-anchor="middle">SO-101 집게</text>
  <rect x="309.0" y="184.8" width="62" height="75.2" rx="4" fill="#a99ad6" fill-opacity="0.3" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="340.0" y="176.8" fill="#a99ad6" font-size="13" text-anchor="middle">0.043</text>
  <text x="340.0" y="280.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">0.005 초</text>
  <text x="235.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">solref 의 time constant</text>
  <rect x="430.0" y="50.0" width="230.0" height="108.0" rx="8" fill="#0e1628" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="444.0" y="74.0" fill="#d6aa62" font-size="13.5" text-anchor="start">질량을 바꿔도</text>
  <text x="444.0" y="100.0" fill="#e2e8f0" font-size="13" text-anchor="start">1 kg 상자: 0.108 mm</text>
  <text x="444.0" y="122.0" fill="#e2e8f0" font-size="13" text-anchor="start">10 g 상자: 0.108 mm</text>
  <text x="444.0" y="144.0" fill="#94a3b8" font-size="11.5" text-anchor="start">solref 가 질량에 맞춰 단단함을 정함</text>
  <rect x="430.0" y="172.0" width="230.0" height="108.0" rx="8" fill="#0e1628" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="444.0" y="196.0" fill="#d88b8b" font-size="13.5" text-anchor="start">time constant ≥ 2 × timestep</text>
  <text x="444.0" y="222.0" fill="#e2e8f0" font-size="13" text-anchor="start">기본값: 0.02 ÷ 0.002 = 10 배</text>
  <text x="444.0" y="244.0" fill="#e2e8f0" font-size="13" text-anchor="start">SO-101 집게: 0.01 ÷ 0.005 = 2 배</text>
  <text x="444.0" y="266.0" fill="#94a3b8" font-size="11.5" text-anchor="start">더 작으면 MuJoCo 가 내부에서 늘림</text>
</svg>
