<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>목표 위치까지 팔을 보내는 흐름. IK 로 목표 joint angle 을 구하고, minimum-jerk trajectory 로 시간마다의 목표 각도를 만든 뒤, controller 가 PD 와 gravity compensation 으로 torque 를 계산해 physics step 을 진행한다. 매 step FK 로 집게 끝의 위치를 재서 목표와의 거리를 확인한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="150.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="95.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">목표 위치</text>
  <text x="95.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">집게 끝을 상자 위 5 cm</text>
  <rect x="200.0" y="40.0" width="150.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="275.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">① IK</text>
  <text x="275.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">목표 joint angle 6 개</text>
  <rect x="380.0" y="40.0" width="150.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="455.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">② minimum-jerk</text>
  <text x="455.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">시간마다의 목표 각도</text>
  <rect x="550.0" y="40.0" width="170.0" height="64.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="635.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">③ controller</text>
  <text x="635.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">PD + gravity compensation</text>
  <line x1="172.0" y1="72.0" x2="198.0" y2="72.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <line x1="352.0" y1="72.0" x2="378.0" y2="72.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <line x1="532.0" y1="72.0" x2="548.0" y2="72.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="530.0" y="170.0" width="190.0" height="64.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="625.0" y="197.5" fill="#e2e8f0" font-size="14" text-anchor="middle">④ physics step</text>
  <text x="625.0" y="216.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">equation of motion · 접촉</text>
  <line x1="600.0" y1="106.0" x2="600.0" y2="168.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="592.0" y="142.0" fill="#94a3b8" font-size="12" text-anchor="end">torque</text>
  <rect x="300.0" y="170.0" width="180.0" height="64.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="390.0" y="197.5" fill="#e2e8f0" font-size="14" text-anchor="middle">⑤ FK</text>
  <text x="390.0" y="216.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">집게 끝의 위치</text>
  <line x1="528.0" y1="202.0" x2="482.0" y2="202.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="40.0" y="170.0" width="180.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130.0" y="197.5" fill="#e2e8f0" font-size="14" text-anchor="middle">도착 확인</text>
  <text x="130.0" y="216.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">목표와의 거리</text>
  <line x1="298.0" y1="202.0" x2="222.0" y2="202.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <path d="M590,236 L590,262 L392,262 L392,236" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <line x1="680.0" y1="168.0" x2="680.0" y2="108.0" stroke="#a78bfa" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="498.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="middle">매 step</text>
  <text x="690.0" y="134.0" fill="#a78bfa" font-size="12" text-anchor="start">측정한</text>
  <text x="690.0" y="151.0" fill="#a78bfa" font-size="12" text-anchor="start">각도·각속도</text>
</svg>
