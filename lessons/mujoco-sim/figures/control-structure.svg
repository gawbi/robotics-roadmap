<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 가지 제어 구조. 위는 torque 제어로, 바깥의 controller 가 PD 와 gravity compensation 으로 torque 를 계산해 넣는다. 아래는 position 제어로, 목표 각도를 넣으면 engine 안의 PD 가 torque 를 계산한다. 둘 다 torque 는 ±2.94 N·m 로 잘린다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#7cb4d8" font-size="14" text-anchor="start">torque 제어 — 명령값이 곧 torque</text>
  <rect x="20.0" y="52.0" width="92.0" height="54.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="66.0" y="74.5" fill="#e2e8f0" font-size="14" text-anchor="middle">목표 각도</text>
  <text x="66.0" y="93.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">q목표</text>
  <line x1="114.0" y1="79.0" x2="135.0" y2="79.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="138.0" y="52.0" width="250.0" height="54.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="263.0" y="74.5" fill="#e2e8f0" font-size="13.5" text-anchor="middle">τ = Kp(q목표 − q) − Kd·ω + c</text>
  <text x="263.0" y="93.5" fill="#94a3b8" font-size="12" text-anchor="middle">바깥에서 짠 PD + gravity compensation</text>
  <line x1="390.0" y1="79.0" x2="413.0" y2="79.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="401.0" y="70.0" fill="#94a3b8" font-size="12" text-anchor="middle">τ</text>
  <rect x="416.0" y="52.0" width="100.0" height="54.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="466.0" y="74.5" fill="#e2e8f0" font-size="14" text-anchor="middle">한계로 자름</text>
  <text x="466.0" y="93.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">±2.94 N·m</text>
  <line x1="518.0" y1="79.0" x2="541.0" y2="79.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="544.0" y="52.0" width="96.0" height="54.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="592.0" y="74.5" fill="#e2e8f0" font-size="14" text-anchor="middle">physics step</text>
  <text x="592.0" y="93.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">5 ms 진행</text>
  <path d="M592,108 L592,136 L263,136 L263,110" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="428.0" y="154.0" fill="#94a3b8" font-size="12" text-anchor="middle">측정한 각도 q · 각속도 ω, engine 이 계산한 c</text>
  <line x1="20.0" y1="176.0" x2="640.0" y2="176.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24.0" y="206.0" fill="#7fc4a2" font-size="14" text-anchor="start">position 제어 — 명령값이 목표 각도</text>
  <rect x="20.0" y="224.0" width="92.0" height="54.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="66.0" y="246.5" fill="#e2e8f0" font-size="14" text-anchor="middle">목표 각도</text>
  <text x="66.0" y="265.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">q목표</text>
  <line x1="114.0" y1="251.0" x2="165.0" y2="251.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="140.0" y="242.0" fill="#94a3b8" font-size="12" text-anchor="middle">명령값</text>
  <rect x="168.0" y="224.0" width="348.0" height="54.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="342.0" y="246.5" fill="#e2e8f0" font-size="13.5" text-anchor="middle">engine 안의 PD: kp = 998.22 · kv = 2.731</text>
  <text x="342.0" y="265.5" fill="#94a3b8" font-size="12" text-anchor="middle">τ = kp(명령값 − q) − kv·ω, ±2.94 N·m 로 자름</text>
  <line x1="518.0" y1="251.0" x2="541.0" y2="251.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="544.0" y="224.0" width="96.0" height="54.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="592.0" y="246.5" fill="#e2e8f0" font-size="14" text-anchor="middle">physics step</text>
  <text x="592.0" y="265.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">5 ms 진행</text>
  <path d="M592,280 L592,302 L342,302 L342,282" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="470.0" y="298.0" fill="#94a3b8" font-size="12" text-anchor="middle">각도 q · 각속도 ω</text>
</svg>
