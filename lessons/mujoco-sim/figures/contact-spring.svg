<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>바닥에 놓인 1 kg 상자. gravity 9.81 N 이 아래로, 접촉의 normal force 9.81 N 이 위로 작용하고, 단단함 10000 N/m 인 접촉에서 상자는 바닥에 약 1 mm 파고든 채로 멈춘다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="618" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30" y="200" width="300" height="70" fill="#1e293b"/>
  <line x1="30.0" y1="200.0" x2="330.0" y2="200.0" stroke="#d6aa62" stroke-width="2"/>
  <text x="40.0" y="260.0" fill="#d6aa62" font-size="13" text-anchor="start">바닥</text>
  <rect x="120.0" y="108.0" width="100.0" height="100.0" rx="4" fill="#0c3a52" stroke="#7cb4d8" stroke-width="2"/>
  <text x="182.0" y="138.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1 kg</text>
  <line x1="148.0" y1="144.0" x2="148.0" y2="202.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="110.0" y="178.0" fill="#d88b8b" font-size="12.5" text-anchor="end">gravity 9.81 N</text>
  <line x1="192.0" y1="258.0" x2="192.0" y2="204.0" stroke="#7fc4a2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="202.0" y="250.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">normal force 9.81 N</text>
  <circle cx="220.0" cy="200.0" r="16" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="232.0" y1="189.0" x2="392.0" y2="96.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="380.0" y="60.0" width="210.0" height="150.0" rx="6" fill="#0e1628" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="390.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="start">확대</text>
  <rect x="381" y="150" width="208" height="59" fill="#1e293b"/>
  <line x1="381.0" y1="150.0" x2="589.0" y2="150.0" stroke="#d6aa62" stroke-width="2"/>
  <rect x="420.0" y="96.0" width="90.0" height="70.0" rx="2" fill="#0c3a52" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="530.0" y1="150.0" x2="530.0" y2="166.0" stroke="#e2e8f0" stroke-width="1.2" marker-end="url(#arrow-white)" marker-start="url(#arrow-white)"/>
  <text x="538.0" y="162.0" fill="#e2e8f0" font-size="12" text-anchor="start">침투</text>
  <text x="390.0" y="194.0" fill="#94a3b8" font-size="12" text-anchor="start">≈ 1 mm (과장해서 그림)</text>
  <text x="380.0" y="240.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">침투 = 9.81 ÷ 10000</text>
  <text x="380.0" y="262.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">     ≈ 0.000981 m ≈ 1 mm</text>
  <text x="380.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="start">단단함 k = 10000 N/m 로 본 경우</text>
</svg>
