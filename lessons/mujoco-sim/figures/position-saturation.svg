<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>SO-101 position actuator 의 오차와 torque. 계산한 torque 998.22 × 오차는 오차 0.00295 rad(0.17°)에서 한계 2.94 N·m 에 닿고, 그보다 큰 오차에서는 늘 2.94 N·m 로 잘린다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="80.0" y="40.0" width="340.0" height="230.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="80.0" y1="155.0" x2="420.0" y2="155.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="80.0" y1="40.0" x2="80.0" y2="270.0" stroke="#475569" stroke-width="1.5"/>
  <text x="108.3" y="287.0" fill="#64748b" font-size="12" text-anchor="middle">-0.01</text>
  <text x="179.2" y="287.0" fill="#64748b" font-size="12" text-anchor="middle">-0.005</text>
  <text x="250.0" y="287.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="320.8" y="287.0" fill="#64748b" font-size="12" text-anchor="middle">0.005</text>
  <text x="391.7" y="287.0" fill="#64748b" font-size="12" text-anchor="middle">0.01</text>
  <text x="73.0" y="234.1" fill="#64748b" font-size="12" text-anchor="end">-2.94</text>
  <text x="73.0" y="159.0" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="73.0" y="83.9" fill="#64748b" font-size="12" text-anchor="end">2.94</text>
  <text x="420.0" y="304.0" fill="#94a3b8" font-size="13" text-anchor="end">오차 (rad)</text>
  <text x="80.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="start">torque (N·m)</text>
  <line x1="250.0" y1="40.0" x2="250.0" y2="270.0" stroke="#475569" stroke-width="1"/>
  <line x1="80.0" y1="79.9" x2="420.0" y2="79.9" stroke="#d88b8b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="80.0" y1="230.1" x2="420.0" y2="230.1" stroke="#d88b8b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="186.1" y1="270.0" x2="313.9" y2="40.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="80.0,230.1 208.3,230.1 291.7,79.9 420.0,79.9" fill="none" stroke="#7fc4a2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="291.7" cy="79.9" r="4.5" fill="#d6aa62"/>
  <line x1="291.7" y1="79.9" x2="291.7" y2="155.0" stroke="#d6aa62" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="299.7" y="171.0" fill="#d6aa62" font-size="12" text-anchor="start">0.00295</text>
  <circle cx="391.7" cy="79.9" r="4.5" fill="#7cb4d8"/>
  <text x="391.7" y="99.9" fill="#7cb4d8" font-size="12" text-anchor="middle">0.01 → 2.94</text>
  <text x="319.9" y="54.0" fill="#94a3b8" font-size="12" text-anchor="start">998.22 × 오차</text>
  <text x="440.0" y="62.0" fill="#e2e8f0" font-size="13.5" text-anchor="start">SO-101 position actuator</text>
  <text x="440.0" y="86.0" fill="#94a3b8" font-size="12.5" text-anchor="start">kp = 998.22 N·m/rad</text>
  <text x="440.0" y="106.0" fill="#d88b8b" font-size="12.5" text-anchor="start">한계 ±2.94 N·m</text>
  <text x="440.0" y="146.0" fill="#d6aa62" font-size="12.5" text-anchor="start">2.94 ÷ 998.22 ≈ 0.00295 rad</text>
  <text x="440.0" y="166.0" fill="#d6aa62" font-size="12.5" text-anchor="start">                ≈ 0.17°</text>
  <text x="440.0" y="206.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">0.17° 안: 오차에 비례</text>
  <text x="440.0" y="226.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">0.17° 밖: 늘 2.94 N·m</text>
</svg>
