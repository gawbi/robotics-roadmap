<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Cartesian 직선과 singularity. 위에서 본 팔의 손목이 0.1 m/s 로 곧은 선을 지날 때 joint 1 의 각속도는 선이 축에서 0.1 m 떨어져 있으면 최대 1 rad/s 지만, 0.02 m 떨어져 있으면 최대 5 rad/s 로 FR3 joint 1 의 한계 2.62 rad/s 를 넘는다</title>
