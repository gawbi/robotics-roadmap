# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: robot-data-scarcity
  title: 로봇 데이터가 모자란 이유
  section: 로봇-데이터가-모자란-이유
  variants:
    - question: |
        웹의 사진·글과 달리 로봇 policy 의 학습 데이터를 인터넷에서 대량으로 모으기 어려운 까닭은 무엇인가?
      choices:
        - '로봇 영상은 해상도가 높아서 저장 공간이 모자라고, 인터넷에 올리는 데 시간이 너무 오래 걸린다'
        - '관측과 그 순간 로봇에 보낸 action 이 짝으로 있어야 하는데, 그 짝은 로봇을 움직여야만 생긴다'
        - '로봇 데이터에는 연구실마다 저작권이 걸려 있어서, 공개된 dataset 이라도 policy 학습에는 쓸 수 없다'
        - 'policy 는 사진 없이 관절 값만으로 학습하므로, 인터넷의 사진과 영상은 처음부터 쓸모가 없다'
      answer: 1
      explanation: |
        policy 는 관측을 보고 action 을 내도록 배우므로 학습 데이터에는 관측과 그 순간 로봇에 보낸 action 이 짝으로 있어야 하고, 이 짝은 사람이
        로봇을 조종하거나 시연을 보여 줄 때만 생긴다. 사진과 글은 다른 목적으로 올라온 것을 모으면 되지만 action 은 인터넷에 없다. 저장 공간이나
        업로드 시간은 OXE·DROID 처럼 공개된 dataset 이 있다는 점에서 근본 이유가 아니다. 공개 dataset 은 학습에 널리 쓰이므로 저작권 때문에 못 쓴다는
        보기도 틀렸다. 로봇 policy 는 대부분 카메라 사진을 관측으로 받으므로 사진이 쓸모없다는 보기도 틀렸다.
    - question: |
        DROID 는 1 초에 15 번 기록한 350 시간 분량이라 frame 이 약 1,890 만 개다. 이 숫자만으로 dataset 의 쓸모를 판단하기 어려운 까닭은 무엇인가?
      choices:
        - 'frame 이 많을수록 학습이 느려져서, 일정한 수를 넘는 frame 은 policy 의 성능을 오히려 떨어뜨린다'
        - 'frame 은 압축된 영상에서 꺼내므로 화질이 떨어져서, 실제로 쓸 수 있는 frame 은 그 일부뿐이다'
        - '이웃한 frame 은 거의 같은 사진이라, 일반화를 좌우하는 장면·물체·작업의 가짓수는 frame 수보다 훨씬 적다'
        - 'frame 마다 action 이 붙지 않고 episode 마다 하나만 붙어서, 정답의 개수는 episode 수와 같다'
      answer: 2
      explanation: |
        1 초에 15 번 찍은 이웃 frame 은 거의 같은 장면이라, frame 수가 커도 담긴 장면·물체·작업의 가짓수는 작을 수 있다. DROID 의 1,890 만 frame 은
        장면 564 곳에서 나왔고, 일반화에는 이 가짓수가 중요하다. frame 이 많다고 성능이 떨어지지는 않으므로 frame 수가 성능을 해친다는 보기는 틀렸다. 영상 압축은 바뀐
        부분만 적는 방식이라 학습에 쓰는 사진의 품질을 크게 해치지 않는다. 시연 기록에서는 frame 마다 그 순간의 action 이 정답으로 붙는다.
    - question: |
        같은 사람이 컵 정리 시연을 모을 때 spacemouse 로 로봇을 조종하면 1 시간에 약 35 개, 손에 쥐는 UMI 집게로는 약 111 개를 모았다. 이 비교가 보여 주는 것으로 알맞은 것은?
      choices:
        - 'UMI 로 모은 시연은 품질이 낮아서, 개수가 3 배라도 같은 성능을 내려면 조종한 시연이 더 필요하다'
        - 'teleoperation 은 시연 하나가 짧아서 개수가 적을 뿐이고, 모은 시간의 총량은 두 방식이 같다'
        - 'UMI 처럼 로봇 없이 모은 시연은 로봇 학습에 쓸 수 없어서, 두 방식의 개수 비교는 뜻이 없다'
        - '로봇을 조종하는 대신 사람이 집게를 들고 직접 하면 수집이 쉬워져, 같은 시간에 시연을 약 3 배 모은다'
      answer: 3
      explanation: |
        두 값은 물체를 다시 놓는 시간까지 넣은 1 시간당 시연 수라서, $111 \div 35 \approx 3.2$ 배를 같은 시간에 모았다는 뜻이다. 사람이 집게를 들고
        직접 하면 로봇을 원격으로 다루는 어려움과 로봇 고장 처리가 줄어든다. UMI 시연으로 학습한 policy 가 컵 정리에서 20 번 모두 성공했으므로 품질이
        낮다는 보기는 틀렸다. 같은 1 시간 동안 센 개수라서 총 시간이 같다는 설명은 개수 차이를 설명하지 못한다. UMI 는 로봇에 같은 집게와 카메라를
        달아 시연을 그대로 학습에 쓰도록 만든 장치라서 쓸 수 없다는 보기도 틀렸다.

- topic: cross-embodiment
  title: 여러 로봇 데이터의 정렬과 효과
  section: open-x-embodiment-와-rt-x
  variants:
    - question: |
        Open X-Embodiment 로 RT-X 를 학습할 때 action 을 dataset 마다 따로 정규화한 이유는 무엇인가?
      choices:
        - '로봇마다 움직이는 범위가 달라서, 한 범위로 다루면 작게 움직이는 로봇의 action 이 loss 에 묻힌다'
        - '정규화하면 로봇마다 다른 좌표계가 하나로 맞춰져서, 같은 숫자가 모든 로봇에서 같은 방향의 움직임이 된다'
        - 'dataset 마다 정규화해 두면 실행할 때 로봇의 범위로 되돌릴 필요가 없어서, 출력을 그대로 보낼 수 있다'
        - '정규화하지 않으면 action 을 256 칸으로 자를 수 없어서, 연속 값을 그대로 맞히는 loss 를 써야 한다'
      answer: 0
      explanation: |
        예를 들어 한 step 에 최대 ±2 cm 를 옮기는 로봇과 ±0.5 cm 를 옮기는 로봇을 한 범위로 다루면 뒤 로봇의 움직임은 4 분의 1 크기라 loss 에 거의
        나타나지 않는다. 각자의 범위로 나누면 두 로봇이 같은 크기의 숫자를 배운다. RT-X 는 좌표계를 맞추지 않았으므로 같은 숫자가 로봇마다 다른
        방향일 수 있다. 실행할 때는 모델 출력을 그 로봇의 범위로 되돌려야 한다. 256 칸으로 자르는 것은 정규화와 별개로 할 수 있는 일이다.
    - question: |
        데이터가 많은 Google 로봇 과제에서 그 로봇의 데이터만으로 학습한 RT-1 은 92%, 여러 로봇의 데이터를 함께 학습한 같은 구조의 RT-1-X 는 73%, 550 억 parameter 의 RT-2-X 는 91% 였다. 이 결과를 가장 잘 설명하는 것은?
      choices:
        - '다른 로봇의 데이터는 언제나 해로워서, 데이터가 많은 로봇은 자기 데이터만 쓰는 편이 늘 낫다'
        - 'RT-1-X 는 좌표계가 섞인 데이터를 보다가 학습이 발산했고, RT-2-X 는 좌표계를 먼저 맞췄다'
        - '작은 모델은 여러 로봇의 데이터를 다 담지 못해 underfitting 했고, 큰 모델은 그 데이터를 담아냈다'
        - 'RT-2-X 는 Google 로봇의 데이터를 더 많이 받아서 높았을 뿐, 다른 로봇의 데이터와는 관계없다'
      answer: 2
      explanation: |
        구조가 같은 RT-1(3,500 만 parameter)은 자기 데이터만으로 92% 였지만 여러 로봇의 데이터를 함께 배우자 73% 로 떨어졌고, 저자들은 이를
        underfitting 으로 보았다. 같은 데이터를 VLM 위의 550 억 parameter 모델이 배우면 91% 로 거의 그대로였다. 데이터가 적은 dataset 에서는 RT-1-X 가
        평균 50% 높았으므로 언제나 해롭다는 보기는 틀렸다. RT-2-X 도 좌표계를 맞추지 않았다. RT-2-X 도 같은 로봇 데이터를 섞어 학습했으므로 Google 로봇의
        데이터를 더 받았다는 설명도 틀렸다.
    - question: |
        WidowX 의 Bridge dataset 에만 있는 skill 을 Google 로봇에 시키자 RT-2 는 27.3%, OXE 를 함께 학습한 RT-2-X 는 75.8% 를 냈고, RT-2-X 의 학습에서 Bridge 만 빼자 42.8% 로 떨어졌다. 이것이 보여 주는 것은 무엇인가?
      choices:
        - 'Bridge 의 사진이 Google 로봇의 사진보다 선명해서, 사진의 화질이 skill 을 배우는 데 가장 중요하다'
        - '다른 로봇의 데이터에 있던 skill 이 몸이 다른 로봇으로 넘어오고, 그 skill 이 든 dataset 이 몫을 한다'
        - 'RT-2-X 는 Bridge 의 WidowX 로 시험했으므로, 몸이 다른 로봇으로 skill 이 넘어오는지는 재지 않았다'
        - 'Bridge 를 빼도 RT-2 보다 높았으므로, 어떤 dataset 을 섞는지는 결과에 영향을 주지 않는다'
      answer: 1
      explanation: |
        Google 로봇의 데이터에 없는 skill 을 Google 로봇에서 시험했으므로, 성공률이 27.3% 에서 75.8% 로 오른 것은 다른 로봇의 데이터에서 skill 이
        넘어왔다는 뜻이다. Bridge 만 빼자 42.8% 로 떨어져 그 skill 이 든 dataset 이 큰 몫을 했다. 실험은 사진의 화질을 비교하지 않았다. 시험은
        WidowX 가 아니라 Google 로봇에서 했다. Bridge 를 뺀 값이 75.8% 에서 42.8% 로 크게 달라졌으므로 섞는 dataset 이 결과를 바꾼다.

- topic: scene-diversity
  title: DROID 와 장면 다양성
  section: droid-와-장면-다양성
  variants:
    - question: |
        DROID 연구진이 같은 장비를 여러 기관에 보내고, 장면을 20 분쯤마다 옮기고, 작업을 수집 프로그램이 무작위로 고르게 한 목적은 무엇인가?
      choices:
        - '장비를 하나로 맞춰 calibration 을 없애고, 모든 시연을 같은 카메라 시점에서 찍는다'
        - '시연 하나를 모으는 시간을 줄여, 같은 기간 안에 기록하는 frame 수를 최대한 늘린다'
        - '익숙한 장면에서 오래 모을 때 늘어나는 조작자의 실수를 줄여, 실패한 시연을 없앤다'
        - '장면·작업·카메라 시점의 가짓수를 늘리고, 사람이 쉬운 작업만 고르는 치우침을 막는다'
      answer: 3
      explanation: |
        DROID 는 장면 564 곳, 카메라 시점 1,417 가지, 작업 86 가지를 담도록 수집 절차를 짰다. 작업을 무작위로 고르게 한 것은 사람이 쉬운 작업이나
        가까운 물체만 고르지 않게 하려는 것이다. 장비는 하나로 맞췄지만 장면마다 카메라를 옮기고 체커보드로 calibration 을 다시 했으므로 시점이
        모두 같지 않다. 장면을 옮기는 일은 오히려 시간이 드는 일이라 frame 수를 늘리는 방법이 아니다. 실패로 표시된 시연도 약 16,000 개 있었으므로
        실패를 없애는 절차라는 설명도 틀렸다.
    - question: |
        DROID 에서 같은 수(7,362 개)의 시연을 장면 20 곳에서만 뽑은 묶음과 전체에서 무작위로 뽑은 묶음을 각각 섞어 학습했다. 방해 물체와 새 물체를 둔 시험의 결과와 그 뜻으로 알맞은 것은?
      choices:
        - '흩어진 묶음 쪽이 더 높았다. 양이 같아도 장면의 가짓수가 새 조건에서의 성공을 높인다'
        - '두 묶음은 시연 수가 같으므로 성공률도 같았다. 일반화는 시연의 개수로만 정해진다'
        - '장면 20 곳 묶음이 더 높았다. 한 장면에 시연이 많아야 그 장면의 물체를 정확히 배운다'
        - '두 묶음 모두 섞지 않은 policy 보다 낮았다. 다른 장면의 시연은 목표 작업을 흐린다'
      answer: 0
      explanation: |
        두 묶음은 시연 수를 같게 맞추고 장면의 퍼짐만 다르게 한 비교라서, 흩어진 묶음이 더 높았다는 것은 장면의 가짓수가 일반화를 높인다는
        뜻이다. 장면 20 곳 묶음은 한 곳에 평균 약 368 개가 몰려 있어서 새 조건에서 더 낮았다. 수가 같아도 결과가 달랐으므로 개수로만 정해진다는
        보기는 틀렸다. DROID 를 섞은 policy 는 섞지 않은 policy 보다 높았으므로 다른 장면의 시연이 해롭다는 보기도 틀렸다.
    - question: |
        목표 작업의 시연 50 개와 DROID 시연 76,000 개를 함께 학습할 때, 두 더미를 합쳐 고르게 뽑지 않고 batch 의 절반씩을 따로 뽑는 이유는 무엇인가?
      choices:
        - '절반씩 뽑으면 DROID 시연이 batch 마다 같은 것으로 되풀이되어, 큰 dataset 을 빨리 외울 수 있다'
        - '두 더미를 합치면 action 의 단위가 섞이므로, batch 를 나눠야 normalization 을 따로 할 수 있다'
        - '합쳐서 고르게 뽑으면 목표 작업의 몫이 약 0.07% 라서, 절반을 따로 배정해야 목표 작업 시연을 자주 본다'
        - '절반씩 뽑으면 두 더미의 시연 하나하나가 같은 횟수로 쓰여서, 시연마다 무게가 똑같아진다'
      answer: 2
      explanation: |
        한 더미로 고르게 뽑으면 목표 작업 시연의 몫은 $50 \div 76{,}050 \approx 0.07\%$ 라서 거의 학습되지 않는다. 절반씩 따로 뽑으면 목표 작업 시연
        하나가 DROID 시연 하나보다 약 1,520 배 자주 쓰인다. DROID 에서 뽑는 시연은 batch 마다 바뀌므로 같은 것이 되풀이된다는 보기는 틀렸다.
        normalization 은 dataset 마다 따로 계산하면 되므로 batch 를 나누는 이유가 아니다. 절반씩 뽑으면 더미의 크기가 달라 시연 하나하나의 무게가
        같아지지 않고, 작은 더미의 시연이 훨씬 자주 쓰인다.

- topic: umi
  title: UMI 의 손목 카메라·latency matching·relative action
  section: umi-와-로봇-없는-수집
  variants:
    - question: |
        UMI 가 사람 손으로 모은 시연을 로봇 policy 로 옮기려고 집게 손가락에 고정한 GoPro 손목 카메라로만 관측을 받는 이유는 무엇인가?
      choices:
        - '로봇에도 같은 집게와 GoPro 를 같은 자리에 달면, 사람이 모을 때와 로봇이 실행할 때의 사진이 거의 같아진다'
        - '손목 카메라는 화면이 좁아 배경이 보이지 않아서, 장소가 바뀌어도 policy 가 받는 사진이 늘 똑같다'
        - '바깥 카메라의 사진은 커서 추론이 느려지므로, 작은 손목 카메라 사진만 넣어야 policy 가 제때 움직인다'
        - '손목 카메라 영상에는 사람의 손이 보이지 않아서, 사람과 로봇의 손 생김새 차이를 배울 필요가 없어진다'
      answer: 0
      explanation: |
        policy 가 학습한 사진과 실행할 때 받는 사진이 같아야 시연을 그대로 따라 할 수 있는데, 같은 집게와 GoPro 를 같은 자리에 달면 두 사진이 거의
        같다. 그래서 같은 policy 를 다른 로봇 팔에 올려도 20 번 중 18 번 성공했다. UMI 는 오히려 155° fisheye 렌즈로 주변을 넓게 담으므로 배경이
        안 보인다는 보기는 틀렸다. 바깥 카메라를 뺀 것은 장소를 옮기기 쉽고 카메라와 로봇의 calibration 이 필요 없기 때문이지, 사진 크기나 추론 시간
        때문이 아니다. 사람 손이 보이지 않는 것은 결과일 뿐이고, 핵심은 손가락과 카메라의 배치가 같다는 점이다.
    - section: latency-matching
      question: |
        UMI policy 를 로봇에서 실행할 때 카메라 지연 80 ms, 추론 120 ms, 팔의 실행 지연 100 ms 가 걸리고, policy 는 사진이 찍힌 시각부터 100 ms 간격의 action 을 낸다. latency matching 은 어떻게 하는가?
      choices:
        - '지연이 없는 것처럼 첫 action 부터 보내고, 늦어진 만큼 팔을 더 빨리 움직여 따라잡게 한다'
        - '0·100·200 ms 의 action 은 이미 지난 몫이라 버리고, 300 ms 의 것부터 보낸다'
        - '관측과 action 이 어긋나지 않도록, 지연이 0 이 될 때까지 추론을 멈추고 다음 사진을 기다린다'
        - '추론 시간만 지연으로 보고 120 ms 전의 action 하나만 버린다. 나머지 지연은 데이터에도 있다'
      answer: 1
      explanation: |
        사진이 찍힌 시각을 0 으로 두면 첫 명령이 팔에서 실현되는 것은 $80 + 120 + 100 = 300$ ms 뒤라서, 그 전 시각의 몫인 action 셋은 이미 지난
        것이다. 그래서 버리고 300 ms 의 action 부터 보낸다. 첫 action 부터 보내면 손끝이 1 초에 0.5 m 로 움직일 때 15 cm 늦게 따라가고, 팔을 더
        빨리 움직이는 것은 시연의 움직임을 바꾼다. 지연은 실물 장비에서 늘 생기므로 0 이 될 때까지 기다릴 수 없다. UMI 시연은 GoPro 한 대로 모든
        값을 같은 순간에 기록해서 데이터에는 이 지연이 없다.
    - question: |
        UMI 가 action 을 로봇 받침 기준의 절대 위치(absolute)가 아니라 계산하는 순간의 손끝 자세 기준(relative trajectory)으로 적는 이유는 무엇인가?
      choices:
        - '절대 위치는 숫자가 커서 256 칸으로 자르면 정밀도가 떨어지고, 상대 위치는 숫자가 작아서 칸이 촘촘해진다'
        - 'relative trajectory 는 바로 앞 step 의 목표를 기준으로 해서, step 마다 생긴 오차가 다음 step 에서 저절로 지워진다'
        - '절대 위치로 적으면 사람 손의 떨림이 그대로 남아서, policy 가 그 떨림까지 따라 하는 버릇을 배운다'
        - '장소가 바뀌는 수집 현장에서는 SLAM 좌표를 로봇 받침 좌표로 정확히 맞추기 어려운데, 지금 자세 기준이면 그럴 필요가 없다'
      answer: 3
      explanation: |
        absolute 를 쓰려면 사람이 모은 궤적을 로봇 받침의 좌표로 옮겨야 하는데, 저자들이 marker 로 두 좌표를 맞춘 뒤 absolute 로 학습하자 컵 정리는
        20 번 중 5 번만 성공했다. relative trajectory 는 지금 손끝 자세를 기준으로 하므로 그 맞춤이 필요 없고 20 번 모두 성공했다. UMI policy 는 연속
        값을 내는 Diffusion Policy 라서 256 칸 정밀도와는 관계없다. 바로 앞 step 을 기준으로 하는 것은 delta 방식이고, delta 는 오차가 쌓인다. 떨림은
        어느 표현을 쓰든 시연에 남는다.

- topic: scaling-law
  title: 환경·물체 다양성과 data scaling law
  section: data-scaling-law
  variants:
    - question: |
        Lin 등의 실험에서 환경 수를 고정하고 환경마다 쓰는 시연을 50% 에서 100% 로 늘렸을 때와, 환경 수를 늘렸을 때 처음 보는 환경의 점수는 각각 어떻게 되었는가?
      choices:
        - '두 경우 모두 비슷하게 올랐다. 총 시연 수가 같게 늘면 일반화도 같게 오른다'
        - '시연을 늘리면 크게 올랐고, 환경을 늘리면 학습이 어려워져 점수가 떨어졌다'
        - '시연을 늘린 쪽은 점수가 거의 그대로였고, 환경 수를 늘린 쪽은 점수가 꾸준히 올랐다'
        - '두 경우 모두 그대로였다. 처음 보는 환경의 점수는 pretrained encoder 로 정해진다'
      answer: 2
      explanation: |
        환경 실험에서 시연을 50% 쓴 곡선과 100% 쓴 곡선은 거의 겹쳤고, 환경의 가짓수를 1 에서 32 로 늘리면 점수가 꾸준히 올랐다. 그래서 저자들은
        시연의 개수보다 환경·물체의 가짓수가 일반화를 좌우한다고 정리했다. 두 경우가 비슷하게 올랐다는 보기는 시연만 늘린 쪽의 정체를 놓쳤다.
        환경을 늘려 점수가 떨어진 경우는 없었다. encoder 는 같았는데 환경 수에 따라 점수가 달라졌으므로 encoder 만으로 정해진다는 보기도 틀렸다.
    - question: |
        환경·물체 쌍의 수를 두 배로 늘릴 때마다 optimality gap(1 − 점수)이 0.62 배가 된다고 하자. 이 관계에서 알 수 있는 것은 무엇인가?
      choices:
        - '쌍을 두 배로 늘릴 때마다 점수가 0.62 씩 올라서, 쌍을 두 번만 늘려도 만점에 닿는다'
        - 'gap 이 같은 비율로 줄어 오르는 폭이 점점 작아지고, 만점 가까이에는 훨씬 많은 쌍이 든다'
        - 'gap 이 일정한 양씩 줄어서, 쌍을 하나 더할 때마다 오르는 점수의 크기가 늘 같다'
        - '쌍을 늘려도 gap 은 그대로이고, 시연 수를 두 배로 늘릴 때만 gap 이 0.62 배가 된다'
      answer: 1
      explanation: |
        optimality gap 은 점수가 만점 1 에 못 미치는 정도이고, 두 배마다 0.62 배가 된다는 것은 비율로 줄어든다는 뜻이다. gap 이 0.31, 0.19, 0.12 로
        줄면 오르는 점수는 0.12, 0.07 로 작아지고, 저자들은 점수 0.99 에 쌍 1,191 개가 필요하다고 예측했다. 0.62 는 gap 에 곱하는 비율이지 점수에
        더하는 양이 아니다. 일정한 양씩 주는 것은 power law 가 아니라 직선 관계다. 실험에서 gap 을 줄인 것은 쌍의 수였고, 시연 수에는 이런 관계가
        잘 맞지 않았다.
    - question: |
        시연을 1,600 개 모을 계획이다. Lin 등의 결과를 따른다면, 처음 보는 장소에서 쓸 policy 를 위해 어떻게 나누어 모으는 것이 좋은가?
      choices:
        - '한 장소에서 물체 32 개로 50 개씩 모은다. 물체 일반화가 환경 일반화보다 쉬워서 효과가 크다'
        - '장소 4 곳에서 장소마다 400 개씩 모은다. 장소마다 시연이 많아야 그 장소를 정확히 배운다'
        - '한 장소에서 한 물체로 1,600 개를 모은다. 조건을 고정해야 시연이 일관되어 잘 배운다'
        - '장소 32 곳에서 장소마다 다른 물체 하나로 50 개씩 모은다. 쌍마다 시연은 50 개쯤에서 효과가 멈춘다'
      answer: 3
      explanation: |
        저자들은 환경 32 곳에 곳마다 물체 하나로 시연 50 개씩, 모두 1,600 개를 모으는 계획을 권했고, 이 계획으로 새 작업 두 개에서 처음 보는 환경
        8 곳에 87.5% 와 90.0% 를 냈다. 한 장소에서 물체만 늘리면 새 물체에는 강해지지만 새 장소에서는 약하다. 장소 4 곳에 400 개씩 쌓으면 쌍마다
        50 개를 넘는 시연은 효과가 거의 없다. 한 장소·한 물체로 모으면 시연은 일관되지만 처음 보는 장소와 물체로 일반화하지 못한다.

- topic: synthetic-data
  title: MimicGen·DemoGen 의 합성 시연
  section: mimicgen-과-합성-시연
  variants:
    - question: |
        MimicGen 이 사람 시연 몇 개를 새 물체 위치에 맞는 시연으로 늘리는 방식은 무엇인가?
      choices:
        - '물체별 하위 작업 구간으로 나눠 손끝과 물체의 상대 자세가 남게 옮기고, 실행해서 성공한 것만 남긴다'
        - '시연의 사진에 생성 모델로 새 물체를 그려 넣고, action 은 원래 시연의 것을 그대로 붙여 새 시연을 만든다'
        - '학습한 policy 를 simulation 에서 여러 번 실행해서, 성공한 실행을 모두 새 시연으로 모아 dataset 에 넣는다'
        - '손끝 궤적 전체를 물체가 옮겨진 거리만큼 평행 이동하고, 실행해 보지 않고 바로 dataset 에 넣는다'
      answer: 0
      explanation: |
        MimicGen 은 시연을 물체 하나씩을 다루는 구간으로 나누고, 새 장면에서 구간마다 손끝과 물체의 상대 자세가 그대로 남도록 옮긴 뒤 직선 구간으로
        잇고, simulation 에서 끝까지 실행해 성공한 것만 남긴다. 사진을 생성 모델로 고치는 방식이 아니며, action 을 그대로 두면 새 위치의 물체를 집지
        못한다. 학습한 policy 의 실행을 모으는 것이 아니라 사람 시연을 옮겨 만든다. 물체가 돌아가면 평행 이동만으로는 상대 자세가 맞지 않고, 실행해
        성공을 확인하는 단계가 빠지면 실패한 궤적이 섞인다.
    - question: |
        MimicGen 이 성공한 시도만 dataset 에 남긴다는 점에서 생기는 한계로 알맞은 것은?
      choices:
        - '실패에서 배우는 정보가 사라져서, 만든 데이터로 학습한 policy 는 처음 보는 배치에서 늘 0% 를 낸다'
        - '생성률이 낮은 작업은 데이터를 하나도 만들 수 없어서, 생성률이 10% 아래인 작업에는 MimicGen 을 쓸 수 없다'
        - '성공한 시도는 사람의 원래 시연과 완전히 같은 궤적이라서, 늘린 시연이 새로운 정보를 하나도 담지 못한다'
        - '옮기기 쉬운 물체 배치가 많이 남아 데이터가 치우칠 수 있다. 넓은 배치의 한 작업은 배치 칸의 43.5% 만 채웠다'
      answer: 3
      explanation: |
        MimicGen 은 같은 사람 시연을 새 장면에 계속 옮기며 성공한 것만 남기므로, 옮기기 쉬운 배치는 많이 남고 어려운 배치는 빠진다. 저자들이 배치
        공간을 칸으로 나눠 세자 Three Piece Assembly 의 넓은 배치는 칸의 43.5% 만 채웠다. 만든 데이터로 학습한 policy 는 넓은 배치에서도 성공했으므로
        늘 0% 라는 보기는 틀렸다. 생성률 8.2% 인 기어 조립에서도 시도를 늘려 1,000 개를 만들었고 policy 는 76.0% 를 냈다. 만든 시연은 새 물체 자세에
        맞게 옮긴 궤적이라 원래 시연과 같지 않다.
    - question: |
        MimicGen 을 실물 로봇에 쓰기 어려운 이유와, DemoGen 이 그 문제를 다룬 방식으로 알맞은 것은?
      choices:
        - '실물에서는 물체의 자세를 알 수 없어서 MimicGen 을 쓸 수 없는데, DemoGen 은 물체 자세 없이 사진을 생성 모델로 고친다'
        - '실물에서는 시도마다 로봇을 움직여야 하는데, DemoGen 은 point cloud 의 물체 점을 옮겨 로봇 없이 관측을 만든다'
        - '실물에서는 성공을 판정할 수 없어서 실패가 섞이는데, DemoGen 은 사람이 만든 시연을 하나하나 검수해서 걸러 낸다'
        - '실물 로봇은 손끝 자세의 변화량으로 제어할 수 없는데, DemoGen 은 action 을 관절 각도로 바꿔 같은 계산을 한다'
      answer: 1
      explanation: |
        MimicGen 은 옮긴 궤적을 실제로 실행해 관측을 얻고 성공을 확인하므로, 실물에서는 시도마다 로봇을 움직여야 한다(블록 쌓기에 243 번). DemoGen 은
        깊이 카메라의 point cloud 에서 물체의 점들을 옮겨 새 배치의 관측을 계산으로 만들어서, 궤적 하나에 0.01 초가 걸린다. MimicGen 도 실물 블록
        쌓기와 커피 캡슐 넣기에 쓰였으므로 실물에서 쓸 수 없다는 보기는 틀렸고, DemoGen 은 사진 생성 모델이 아니라 3 차원 점을 옮긴다. DemoGen 은
        사람 검수에 기대지 않는다. 손끝 자세 변화량으로 제어하는 실물 로봇도 많다.

- topic: data-curation
  title: 실행 결과로 시연을 고르는 curation
  section: 시연-고르기
  variants:
    - question: |
        시연을 고를 때 떼어 둔 시연의 action 을 얼마나 잘 맞히는지(validation MSE)만 기준으로 삼기 어려운 이유는 무엇인가?
      choices:
        - 'validation MSE 는 학습이 다 끝난 뒤에만 계산할 수 있어서, 시연을 고르는 데 쓰기에는 시점이 너무 늦다'
        - 'validation MSE 는 실물 성공률과 늘 정확히 반비례하므로, 따로 계산하지 않아도 성공률로 바로 알 수 있다'
        - 'policy 는 실행 중 자기 action 이 바꾼 장면을 다시 보므로, step 오차가 작아도 성공률은 낮을 수 있다'
        - 'validation MSE 는 시연 하나마다 따로 계산할 수 없고, dataset 전체의 평균 하나만 계산할 수 있다'
      answer: 2
      explanation: |
        policy 는 실행하는 동안 자기 action 이 만든 장면을 다시 보므로, 떼어 둔 시연에서 한 step 씩 맞히는 오차는 이어지는 결정의 어긋남을 다
        담지 못한다. Lin 등의 실험에서 LoRA 로 고친 policy 는 validation MSE 가 0.0049 로 전체를 고친 policy 의 0.006 보다 낮았지만 실물 점수는
        0.72 와 0.90 이었다. MSE 는 학습 중에도 계산할 수 있으므로 시점 문제는 이유가 아니다. 둘이 늘 반비례한다면 MSE 로 고르는 데 문제가 없겠지만
        실제로는 어긋났다. 오차는 시연마다 따로 평균 낼 수 있다.
    - question: |
        CUPID 가 시연 하나의 점수를 매기는 방식으로 알맞은 것은?
      choices:
        - '실행 기록마다 결과(성공 +1, 실패 −1)와 그 시연이 그 실행의 action 을 키우는 정도를 곱해 더한다'
        - '시연마다 policy 를 새로 학습하고 실물에서 다시 시험해서, 그 시연을 뺐을 때의 성공률 변화를 잰다'
        - '시연의 움직임이 얼마나 매끄럽고 예측하기 쉬운지로 품질을 매기고, 편차가 큰 시연에 낮은 점수를 준다'
        - '실패한 실행과 성공한 실행의 사진을 비교해서, 두 실행의 사진이 다른 부분을 담은 시연을 지운다'
      answer: 0
      explanation: |
        CUPID 는 policy 를 한 번 학습하고 실물에서 실행한 기록으로, 그 시연을 더 학습하면 각 실행의 action 이 얼마나 더 잘 나오는지를 influence
        function 으로 계산해 결과의 부호를 곱해 더한다. 점수가 − 이면 policy 를 실패한 실행 쪽으로 미는 시연이다. 시연마다 다시 학습하고 시험하는
        것은 CUPID 가 피하려는 비싼 방법이다. 매끄러움이나 예측 가능성으로 품질을 매기는 것은 DemInf 같은 방식이고, TuckBox 에서는 좋은 시연을
        걸러 냈다. CUPID 는 사진의 차이를 비교하지 않는다.
    - question: |
        TuckBox 에서 밀기 시연과 집어 옮기기 시연이 2 : 1 로 섞인 데이터로 학습한 policy 는, 통의 무게 배치를 바꾸자 늘 밀다가 모두 실패했다. CUPID 로 시연을 고른 결과로 알맞은 것은?
      choices:
        - '실행이 모두 실패해 성공한 실행이 하나도 없으므로, CUPID 는 어느 시연이 해로운지 가려낼 수 없었다'
        - '실패의 action 을 만든 밀기 시연이 − 점수로 걸러졌고, 다시 학습한 policy 는 84 ~ 88% 성공했다'
        - '집어 옮기기 시연이 편차가 커서 품질이 낮다고 판정되어 걸러졌고, 다시 학습한 policy 는 밀기만 했다'
        - '시연이 모두 성공한 것이라 점수도 모두 + 였고, 시연은 그대로 두고 학습을 더 오래 해서 해결했다'
      answer: 1
      explanation: |
        CUPID 는 실패한 실행만 있어도 그 실패의 action 을 키운 시연을 찾을 수 있어서, 밀기 시연의 점수가 − 로 나왔다. 그 시연을 거르자 집어 옮기는
        동작이 늘어 성공률이 0% 에서 84 ~ 88% 가 됐다. 성공한 실행이 없어도 실패한 실행의 결과 −1 로 점수를 매길 수 있으므로 가려낼 수 없다는
        보기는 틀렸다. 집어 옮기기 시연을 품질이 낮다고 거른 것은 DemInf 의 결과였다. 시연이 모두 성공한 것이어도 점수는 실행 결과로 매기므로 모두
        + 가 되지 않는다.

- topic: data-mixture
  title: VLA pretraining 의 data mixture
  section: vla-pretraining-의-data-mixture
  variants:
    - question: |
        π0.5 가 action 을 dataset 마다, 차원마다 1% 와 99% quantile 을 −1 과 1 로 옮겨 정규화하는 이유는 무엇인가?
      choices:
        - 'quantile 로 옮기면 로봇마다 다른 좌표계가 같아져서, 같은 숫자가 모든 로봇에서 같은 움직임이 된다'
        - '1% 와 99% 로 옮기면 값이 모두 −1 ~ 1 안에 들어가서, 범위를 벗어나는 값이 하나도 생기지 않는다'
        - 'quantile 로 옮기면 action 의 개수가 가장 큰 로봇과 같아져서, 0 으로 채울 자리가 필요 없어진다'
        - '최솟값·최댓값을 쓰면 한 번 튄 값이 범위를 넓혀서 정상 값이 좁은 구간에 몰리는데, 이것을 막는다'
      answer: 3
      explanation: |
        예를 들어 값이 대부분 −0.8 ~ 1.2 인데 한 번 5.0 이 튀면, 최솟값·최댓값으로 옮긴 정상 값은 −1 ~ −0.31 에 몰린다. 1% 와 99% quantile 을 쓰면
        드문 값에 범위가 끌려가지 않아 정상 값이 −1 ~ 1 을 고루 쓴다. 정규화는 숫자의 크기만 맞출 뿐 좌표계를 맞추지 않는다. 값의 1% 쯤은 −1 ~ 1
        밖으로 나가므로 하나도 벗어나지 않는다는 보기는 틀렸다. action 의 개수는 정규화와 따로, 가장 큰 로봇에 맞춰 0 으로 채운다.
    - question: |
        π0.5 저자들은 이동 로봇 데이터를 모은 장소의 수를 3 곳에서 104 곳까지 바꿔 학습하면서, 학습 step 을 같게 맞췄다. 이렇게 맞춘 이유와 결과로 알맞은 것은?
      choices:
        - '장소가 많을수록 모델이 커지므로 step 을 맞춰 계산량을 같게 했고, 장소의 수는 점수에 영향을 주지 않았다'
        - '장소가 적은 데이터는 빨리 외워지므로 일부러 과적합을 유도했고, 장소 3 곳으로 학습한 모델이 가장 높았다'
        - '모든 모델이 같은 수의 예시를 보게 해 장소 수만의 효과를 보려 했고, 장소가 늘수록 처음 보는 집의 점수가 올랐다'
        - 'step 이 같으면 장소가 많은 데이터를 다 볼 수 없어서, 104 곳 모델은 시험하는 집 데이터를 넣은 모델보다 크게 낮았다'
      answer: 2
      explanation: |
        장소가 많은 데이터일수록 시연도 많으므로 step 을 맞추지 않으면 장소 수의 효과와 데이터 양의 효과가 섞인다. 저자들은 학습 step 을 40,000 번으로
        맞춰 같은 수의 서로 다른 예시를 보게 했고, 장소가 늘수록 점수가 대체로 올랐다. 실험에서 바꾼 것은 데이터의 장소 수이지 모델이 아니었고, 장소 수는
        점수를 바꿨다. 장소 3 곳 모델이 가장 높았다는 결과는 없다. 104 곳 모델은 시험하는 집의 데이터까지 넣은 모델과 비슷한 점수를 냈다.
    - question: |
        π0.5 의 첫 학습 단계에서 예시의 97.6% 는 목표 이동 로봇의 데이터가 아니었다. 다른 로봇의 데이터(여러 집의 고정 팔, 실험실의 여러 로봇)를 빼면 어떻게 되었는가?
      choices:
        - '처음 보는 집에서의 점수가 크게 떨어졌고, 둘 다 빼면 더 떨어졌다. 다른 로봇의 데이터가 일반화를 받친다'
        - '목표 로봇 데이터의 비율이 올라 처음 보는 집의 점수도 올랐다. 다른 로봇의 데이터는 목표 작업을 흐린다'
        - '점수에 차이가 없었다. 처음 보는 집에서의 성능은 웹 데이터와 목표 로봇 자신의 데이터만으로 정해진다'
        - '학습이 불안정해져 발산했다. action 의 개수가 다른 데이터가 빠지면 0 으로 채울 기준이 사라진다'
      answer: 0
      explanation: |
        여러 집의 고정 팔(ME)이나 실험실의 여러 로봇(CE) 데이터를 빼자 처음 보는 집에서의 점수가 크게 떨어졌고 둘 다 빼면 더 떨어져서, 목표 로봇이
        아닌 데이터가 일반화를 받친다는 것을 보였다. 목표 로봇의 비율이 오른다고 점수가 오르지는 않았다. 웹 데이터는 처음 보는 종류의 물건을 고르는
        시험에서 차이를 냈지만 다른 로봇의 데이터를 대신하지 못했다. 0 으로 채우는 길이는 가장 큰 로봇에 맞춘 것이라 데이터를 뺀다고 학습이 발산하지
        않는다.
