<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>컵 정리 작업에서 1 시간에 모은 시연 수. spacemouse 조종 35 개, UMI 집게 111 개, 맨손 231 개이고, 시연 1,000 개를 모으는 데 각각 28.6 시간, 9.0 시간, 4.3 시간이 든다</title>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="14" text-anchor="start">컵 정리 작업에서 1 시간에 모은 시연 수 (UMI 논문 그림 11)</text>
  <line x1="70" y1="220" x2="570" y2="220" stroke="#64748b" stroke-width="1.5"/>
  <line x1="70" y1="155.1" x2="570" y2="155.1" stroke="#1e293b" stroke-width="1"/>
  <line x1="70" y1="90.1" x2="570" y2="90.1" stroke="#1e293b" stroke-width="1"/>
  <text x="62" y="224" fill="#94a3b8" font-size="11.5" text-anchor="end">0</text>
  <text x="62" y="159" fill="#94a3b8" font-size="11.5" text-anchor="end">100</text>
  <text x="62" y="94" fill="#94a3b8" font-size="11.5" text-anchor="end">200</text>
  <rect x="100" y="197.3" width="90" height="22.7" rx="3" fill="#d88b8b" fill-opacity="0.85"/>
  <text x="145" y="189" fill="#d88b8b" font-size="13" text-anchor="middle">35 개</text>
  <rect x="255" y="147.9" width="90" height="72.1" rx="3" fill="#7fc4a2" fill-opacity="0.85"/>
  <text x="300" y="140" fill="#7fc4a2" font-size="13" text-anchor="middle">111 개</text>
  <rect x="410" y="70" width="90" height="150" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="455" y="62" fill="#7cb4d8" font-size="13" text-anchor="middle">231 개</text>
  <text x="145" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">spacemouse 조종</text>
  <text x="300" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">UMI 집게</text>
  <text x="455" y="240" fill="#e2e8f0" font-size="13" text-anchor="middle">맨손</text>
  <text x="145" y="258" fill="#94a3b8" font-size="12" text-anchor="middle">1,000 개에 28.6 시간</text>
  <text x="300" y="258" fill="#94a3b8" font-size="12" text-anchor="middle">1,000 개에 9.0 시간</text>
  <text x="455" y="258" fill="#94a3b8" font-size="12" text-anchor="middle">1,000 개에 4.3 시간</text>
  <text x="20" y="284" fill="#94a3b8" font-size="12" text-anchor="start">물체를 다시 놓는 시간과 로봇 고장 처리까지 넣은 값이다. 맨손 시연은 로봇 학습에 바로 쓸 수 없다</text>
</svg>
