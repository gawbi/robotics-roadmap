<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>quantile 정규화와 최솟값·최댓값 정규화. 예로 든 관절 값은 대부분 −0.8 ~ 1.2 rad 이고 한 번 튄 값이 5.0 rad 이다. 최솟값·최댓값으로 옮기면 정상 값이 −1 ~ −0.31 에 몰리고, 1% 와 99% quantile 로 옮기면 −0.8 이 −1, 0.2 가 0, 1.2 가 1 이 된다</title>
  <rect x="1" y="1" width="598" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#e2e8f0" font-size="13.5" text-anchor="start">① 관절 값 (rad). 대부분 −0.8 ~ 1.2 이고 한 번 5.0 이 튀었다</text>
  <line x1="60" y1="70" x2="560" y2="70" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60" y="58" width="172.4" height="24" rx="4" fill="#7cb4d8" fill-opacity="0.35"/>
  <circle cx="560" cy="70" r="5" fill="#d88b8b"/>
  <line x1="60" y1="64" x2="60" y2="76" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="146.2" y1="64" x2="146.2" y2="76" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="232.4" y1="64" x2="232.4" y2="76" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="98" fill="#94a3b8" font-size="12" text-anchor="middle">−0.8</text>
  <text x="146.2" y="98" fill="#94a3b8" font-size="12" text-anchor="middle">0.2</text>
  <text x="232.4" y="98" fill="#94a3b8" font-size="12" text-anchor="middle">1.2</text>
  <text x="560" y="98" fill="#d88b8b" font-size="12" text-anchor="middle">5.0</text>
  <text x="20" y="130" fill="#e2e8f0" font-size="13.5" text-anchor="start">② 최솟값 −0.8, 최댓값 5.0 으로 옮김</text>
  <line x1="60" y1="164" x2="560" y2="164" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60" y="152" width="172.5" height="24" rx="4" fill="#d6aa62" fill-opacity="0.45"/>
  <circle cx="560" cy="164" r="5" fill="#d88b8b"/>
  <line x1="60" y1="158" x2="60" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="145" y1="158" x2="145" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="232.5" y1="158" x2="232.5" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="192" fill="#94a3b8" font-size="12" text-anchor="middle">−1</text>
  <text x="145" y="192" fill="#94a3b8" font-size="12" text-anchor="middle">−0.66</text>
  <text x="232.5" y="192" fill="#94a3b8" font-size="12" text-anchor="middle">−0.31</text>
  <text x="560" y="192" fill="#d88b8b" font-size="12" text-anchor="middle">1</text>
  <text x="400" y="150" fill="#d6aa62" font-size="12" text-anchor="middle">정상 값이 −1 ~ 1 의 34% 구간에 몰린다</text>
  <text x="20" y="244" fill="#e2e8f0" font-size="13.5" text-anchor="start">③ 1% quantile −0.8, 99% quantile 1.2 로 옮김</text>
  <line x1="60" y1="278" x2="440" y2="278" stroke="#64748b" stroke-width="1.5"/>
  <rect x="60" y="266" width="380" height="24" rx="4" fill="#7fc4a2" fill-opacity="0.45"/>
  <line x1="60" y1="272" x2="60" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="250" y1="272" x2="250" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="440" y1="272" x2="440" y2="284" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="306" fill="#94a3b8" font-size="12" text-anchor="middle">−1</text>
  <text x="250" y="306" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="440" y="306" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="560" y="282" fill="#d88b8b" font-size="12" text-anchor="end">5.0 → 4.8 (범위 밖)</text>
  <text x="250" y="346" fill="#7fc4a2" font-size="12" text-anchor="middle">정상 값이 −1 ~ 1 을 고루 쓴다</text>
  <text x="60" y="208" fill="#64748b" font-size="11" text-anchor="middle">(−0.8)</text>
  <text x="145" y="208" fill="#64748b" font-size="11" text-anchor="middle">(0.2)</text>
  <text x="232.5" y="208" fill="#64748b" font-size="11" text-anchor="middle">(1.2)</text>
  <text x="560" y="208" fill="#64748b" font-size="11" text-anchor="middle">(5.0)</text>
  <text x="60" y="322" fill="#64748b" font-size="11" text-anchor="middle">(−0.8)</text>
  <text x="250" y="322" fill="#64748b" font-size="11" text-anchor="middle">(0.2)</text>
  <text x="440" y="322" fill="#64748b" font-size="11" text-anchor="middle">(1.2)</text>
</svg>
