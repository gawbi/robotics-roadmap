<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MimicGen 이 구간을 옮기는 예를 위에서 본 그림. 예로 든 원래 시연에서는 (40, 0) cm 의 머그잔에 아래쪽 (40, −10) 에서 (40, −2) 로 다가갔다. 새 장면에서 잔이 (60, 20) 에 90° 돌아가 있으면 같은 상대 움직임은 (70, 20) 에서 (62, 20) 으로 다가가는 길이 되고, 지금 손끝에서 그 시작까지는 직선 구간을 끼운다. simulation 에서 실행해 성공한 것만 남긴다</title>
  <defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="160" y="30" fill="#e2e8f0" font-size="14" text-anchor="middle">원래 시연</text>
  <text x="440" y="30" fill="#e2e8f0" font-size="14" text-anchor="middle">새 장면 (잔이 옮겨지고 90° 돌아감)</text>
  <rect x="30" y="42" width="260" height="218" rx="8" fill="#111a2e" stroke="#1e293b"/>
  <rect x="310" y="42" width="260" height="218" rx="8" fill="#111a2e" stroke="#1e293b"/>
  <!-- left panel: x cm 20..80 -> px 40..280, y cm -20..30 -> px 250..50 -->
  <rect x="113" y="187" width="14" height="10" rx="2" fill="#d6aa62"/>
  <circle cx="120" cy="170" r="16" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="146" y="166" fill="#d6aa62" font-size="12" text-anchor="start">잔 (40, 0)</text>
  <circle cx="120" cy="226" r="4" fill="#7cb4d8"/>
  <line x1="120" y1="222" x2="120" y2="202" stroke="#7cb4d8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <text x="130" y="232" fill="#7cb4d8" font-size="12" text-anchor="start">(40, −10) → (40, −2)</text>
  <text x="160" y="80" fill="#94a3b8" font-size="12" text-anchor="middle">잔 기준 상대 위치</text>
  <text x="160" y="98" fill="#e2e8f0" font-size="12.5" text-anchor="middle">(0, −10), (0, −2)</text>
  <!-- right panel: x cm 40..100 -> px 320..560, y cm -20..30 -> px 250..50 -->
  <circle cx="400" cy="90" r="16" fill="#d6aa62" fill-opacity="0.85"/>
  <rect x="417" y="83" width="10" height="14" rx="2" fill="#d6aa62"/>
  <text x="400" y="128" fill="#d6aa62" font-size="12" text-anchor="middle">잔 (60, 20)</text>
  <circle cx="460" cy="90" r="4" fill="#7fc4a2"/>
  <line x1="456" y1="90" x2="432" y2="90" stroke="#7fc4a2" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="470" y="78" fill="#7fc4a2" font-size="12" text-anchor="start">(70, 20) → (62, 20)</text>
  <circle cx="340" cy="210" r="5" fill="#e2e8f0"/>
  <text x="352" y="226" fill="#e2e8f0" font-size="12" text-anchor="start">지금 손끝 (45, −10)</text>
  <line x1="344" y1="206" x2="456" y2="94" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text x="430" y="170" fill="#94a3b8" font-size="12" text-anchor="start">끼워 넣은</text>
  <text x="430" y="186" fill="#94a3b8" font-size="12" text-anchor="start">직선 구간</text>
  <text x="300" y="286" fill="#e2e8f0" font-size="12.5" text-anchor="middle">상대 위치 (0, −10)·(0, −2) 를 90° 돌린 (10, 0)·(2, 0) 을 새 잔 위치 (60, 20) 에 더한다</text>
  <text x="300" y="308" fill="#94a3b8" font-size="12" text-anchor="middle">simulation 에서 끝까지 실행해 작업에 성공한 것만 dataset 에 남긴다</text>
</svg>
