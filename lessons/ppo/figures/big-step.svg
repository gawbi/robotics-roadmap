<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>운이 나쁜 sample 하나(B 를 골라 0 개, advantage −1.5)로 한 번 update 한 결과. learning rate 0.1 이면 B 를 고를 확률이 0.4813, 1 이면 0.3208, 10 이면 0.000553 으로 떨어진다</title>
