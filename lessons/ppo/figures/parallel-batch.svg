  <rect x="425.0" y="188.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="470.0" y="209.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 15</text>
  <rect x="525.0" y="188.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="570.0" y="209.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 16</text>
  <text x="205.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="end">epoch 5</text>
  <line x1="142.0" y1="170.0" x2="160.0" y2="246.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="225.0" y="230.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="270.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 17</text>
  <rect x="325.0" y="230.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="370.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 18</text>
  <rect x="425.0" y="230.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="470.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 19</text>
  <rect x="525.0" y="230.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="570.0" y="251.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 20</text>
  <text x="215.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="start">epoch 마다 다시 섞어서 나눔</text>
  <text x="650.0" y="290.0" fill="#f59e0b" font-size="12" text-anchor="end">같은 데이터로 gradient step 5 × 4 = 20 번</text>
  <text x="20.0" y="322.0" fill="#a78bfa" font-size="12" text-anchor="start">mini-batch 마다 KL 측정 (desired_kl = 0.01)</text>
  <text x="650.0" y="314.0" fill="#f87171" font-size="12" text-anchor="end">KL &gt; 0.02 → learning rate ÷ 1.5</text>
  <text x="650.0" y="334.0" fill="#34d399" font-size="12" text-anchor="end">KL &lt; 0.005 → learning rate × 1.5</text>
</svg>
