  <text x="470.0" y="83.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 3</text>
  <rect x="525.0" y="62.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="570.0" y="83.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 4</text>
  <text x="205.0" y="125.0" fill="#e2e8f0" font-size="12" text-anchor="end">epoch 2</text>
  <line x1="142.0" y1="170.0" x2="160.0" y2="120.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="225.0" y="104.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
