  <text x="370.0" y="125.0" fill="#e2e8f0" font-size="12" text-anchor="middle">step 6</text>
  <rect x="425.0" y="104.0" width="90.0" height="32.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.2"/>
