<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>4 step 짜리 episode 의 GAE 계산. 위 줄은 state 마다 critic 의 예측 3, 3, 2, 2 와 reward 1 로 구한 δ = 1, 0, 1, −1 이고, 아래 줄은 마지막 step 부터 거꾸로 Â = −1, 0.5, 0.25, 1.125 를 얻는 과정이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="340.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">γ = 1, λ = 0.5 → γλ = 0.5</text>
  <rect x="24.0" y="48.0" width="104.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="76.0" y="72.0" fill="#38bdf8" font-size="14" text-anchor="middle">s₀</text>
  <text x="76.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">V = 3</text>
  <line x1="128.0" y1="80.0" x2="152.0" y2="80.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="140.0" y="72.0" fill="#94a3b8" font-size="10" text-anchor="middle">r = 1</text>
  <rect x="154.0" y="48.0" width="104.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="206.0" y="72.0" fill="#38bdf8" font-size="14" text-anchor="middle">s₁</text>
  <text x="206.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">V = 3</text>
  <line x1="258.0" y1="80.0" x2="282.0" y2="80.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="270.0" y="72.0" fill="#94a3b8" font-size="10" text-anchor="middle">r = 1</text>
  <rect x="284.0" y="48.0" width="104.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="336.0" y="72.0" fill="#38bdf8" font-size="14" text-anchor="middle">s₂</text>
  <text x="336.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">V = 2</text>
  <line x1="388.0" y1="80.0" x2="412.0" y2="80.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="400.0" y="72.0" fill="#94a3b8" font-size="10" text-anchor="middle">r = 1</text>
  <rect x="414.0" y="48.0" width="104.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="466.0" y="72.0" fill="#38bdf8" font-size="14" text-anchor="middle">s₃</text>
  <text x="466.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">V = 2</text>
  <line x1="518.0" y1="80.0" x2="542.0" y2="80.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="530.0" y="72.0" fill="#94a3b8" font-size="10" text-anchor="middle">r = 1</text>
  <rect x="544.0" y="48.0" width="100.0" height="64.0" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="594.0" y="72.0" fill="#f87171" font-size="14" text-anchor="middle">끝</text>
  <text x="594.0" y="96.0" fill="#94a3b8" font-size="12" text-anchor="middle">V = 0</text>
  <text x="76.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ₀ = 1 + 3 − 3</text>
  <text x="76.0" y="156.0" fill="#34d399" font-size="14" text-anchor="middle">= 1</text>
  <text x="206.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ₁ = 1 + 2 − 3</text>
  <text x="206.0" y="156.0" fill="#34d399" font-size="14" text-anchor="middle">= 0</text>
  <text x="336.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ₂ = 1 + 2 − 2</text>
  <text x="336.0" y="156.0" fill="#34d399" font-size="14" text-anchor="middle">= 1</text>
  <text x="466.0" y="136.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ₃ = 1 + 0 − 2</text>
  <text x="466.0" y="156.0" fill="#34d399" font-size="14" text-anchor="middle">= −1</text>
  <line x1="20.0" y1="172.0" x2="660.0" y2="172.0" stroke="#1e293b" stroke-width="1"/>
  <text x="340.0" y="194.0" fill="#e2e8f0" font-size="13" text-anchor="middle">뒤에서부터: Â(t) = δ(t) + 0.5 × Â(t + 1)</text>
  <rect x="24.0" y="212.0" width="104.0" height="70.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="76.0" y="236.0" fill="#a78bfa" font-size="14" text-anchor="middle">Â₀</text>
  <text x="76.0" y="256.0" fill="#94a3b8" font-size="11" text-anchor="middle">1 + 0.5 × 0.25</text>
  <text x="76.0" y="274.0" fill="#a78bfa" font-size="13" text-anchor="middle">= 1.125</text>
  <rect x="154.0" y="212.0" width="104.0" height="70.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="206.0" y="236.0" fill="#a78bfa" font-size="14" text-anchor="middle">Â₁</text>
  <text x="206.0" y="256.0" fill="#94a3b8" font-size="11" text-anchor="middle">0 + 0.5 × 0.5</text>
  <text x="206.0" y="274.0" fill="#a78bfa" font-size="13" text-anchor="middle">= 0.25</text>
  <line x1="152.0" y1="247.0" x2="130.0" y2="247.0" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-purple)"/>
  <rect x="284.0" y="212.0" width="104.0" height="70.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="336.0" y="236.0" fill="#a78bfa" font-size="14" text-anchor="middle">Â₂</text>
  <text x="336.0" y="256.0" fill="#94a3b8" font-size="11" text-anchor="middle">1 + 0.5 × (−1)</text>
  <text x="336.0" y="274.0" fill="#a78bfa" font-size="13" text-anchor="middle">= 0.5</text>
  <line x1="282.0" y1="247.0" x2="260.0" y2="247.0" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-purple)"/>
  <rect x="414.0" y="212.0" width="104.0" height="70.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="466.0" y="236.0" fill="#a78bfa" font-size="14" text-anchor="middle">Â₃</text>
  <text x="466.0" y="256.0" fill="#94a3b8" font-size="11" text-anchor="middle">−1 + 0.5 × 0</text>
  <text x="466.0" y="274.0" fill="#a78bfa" font-size="13" text-anchor="middle">= −1</text>
  <line x1="412.0" y1="247.0" x2="390.0" y2="247.0" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-purple)"/>
  <text x="594.0" y="252.0" fill="#94a3b8" font-size="12" text-anchor="middle">Â₄ = 0</text>
  <line x1="564.0" y1="247.0" x2="520.0" y2="247.0" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar-purple)"/>
  <text x="76.0" y="304.0" fill="#94a3b8" font-size="11" text-anchor="middle">계산 순서 ④</text>
  <text x="206.0" y="304.0" fill="#94a3b8" font-size="11" text-anchor="middle">계산 순서 ③</text>
  <text x="336.0" y="304.0" fill="#94a3b8" font-size="11" text-anchor="middle">계산 순서 ②</text>
  <text x="466.0" y="304.0" fill="#94a3b8" font-size="11" text-anchor="middle">계산 순서 ①</text>
  <text x="340.0" y="334.0" fill="#94a3b8" font-size="12" text-anchor="middle">critic 의 정답 Â + V = 4.125, 3.25, 2.5, 1</text>
</svg>
