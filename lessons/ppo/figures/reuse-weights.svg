<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>옛 데이터는 A 0.5, B 0.5 로 들어 있지만, A 의 sample 에 ratio 0.2384, B 의 sample 에 1.7616 을 곱하면 A 0.1192, B 0.8808 로 새 policy 의 비율이 된다. 그 비율로 평균한 gradient 는 −0.105 + 0.210 = 0.105 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="138.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="end">θ_old = 0 으로 모은 데이터</text>
  <rect x="150.0" y="48.0" width="240.0" height="34.0" rx="2" fill="#38bdf8" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1"/>
  <text x="270.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">A 0.5</text>
  <rect x="390.0" y="48.0" width="120.0" height="34.0" rx="2" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
  <text x="450.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">B 4 개 0.25</text>
  <rect x="510.0" y="48.0" width="120.0" height="34.0" rx="2" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
  <text x="570.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">B 0 개 0.25</text>
  <text x="138.0" y="78.0" fill="#94a3b8" font-size="12" text-anchor="middle"></text>
  <line x1="270.0" y1="90.0" x2="182.6" y2="142.0" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#ar-sky)"/>
  <line x1="450.0" y1="90.0" x2="312.9" y2="142.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ar-amber)"/>
  <line x1="570.0" y1="90.0" x2="524.3" y2="142.0" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#ar-amber)"/>
  <text x="208.0" y="112.0" fill="#38bdf8" font-size="12" text-anchor="end">× 0.2384</text>
  <text x="582.0" y="120.0" fill="#f59e0b" font-size="12" text-anchor="start">× 1.7616</text>
  <text x="138.0" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="end">ratio 를 곱한 몫</text>
  <rect x="150.0" y="148.0" width="57.2" height="34.0" rx="2" fill="#38bdf8" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1"/>
  <text x="178.6" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">A 0.1192</text>
  <rect x="207.2" y="148.0" width="211.4" height="34.0" rx="2" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
  <text x="312.9" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">B 4 개 0.4404</text>
  <rect x="418.6" y="148.0" width="211.4" height="34.0" rx="2" fill="#f59e0b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
  <text x="524.3" y="170.0" fill="#e2e8f0" font-size="12" text-anchor="middle">B 0 개 0.4404</text>
  <text x="138.0" y="205.0" fill="#94a3b8" font-size="12" text-anchor="middle"></text>
  <text x="390.0" y="210.0" fill="#94a3b8" font-size="12" text-anchor="middle">몫의 합: A 0.1192, B 0.8808 (θ = 2 의 새 policy 가 고르는 비율과 같음)</text>
  <text x="390.0" y="240.0" fill="#38bdf8" font-size="12" text-anchor="end">A: 0.1192 × reward 1 × ∇ (−0.8808)</text>
  <text x="410.0" y="240.0" fill="#38bdf8" font-size="12" text-anchor="start">−0.1050</text>
  <text x="390.0" y="260.0" fill="#f59e0b" font-size="12" text-anchor="end">B 4 개: 0.4404 × reward 4 × ∇ 0.1192</text>
  <text x="410.0" y="260.0" fill="#f59e0b" font-size="12" text-anchor="start">+0.2100</text>
  <text x="390.0" y="280.0" fill="#f59e0b" font-size="12" text-anchor="end">B 0 개: 0.4404 × reward 0 × ∇ 0.1192</text>
  <text x="410.0" y="280.0" fill="#f59e0b" font-size="12" text-anchor="start">0</text>
  <line x1="300.0" y1="300.0" x2="470.0" y2="300.0" stroke="#475569" stroke-width="1"/>
  <text x="390.0" y="318.0" fill="#e2e8f0" font-size="13" text-anchor="end">합</text>
  <text x="410.0" y="318.0" fill="#34d399" font-size="13" text-anchor="start">0.105 (θ = 2 의 진짜 gradient 와 같음)</text>
</svg>
