# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: big-step
  title: 한 번에 크게 바꾼 update
  variants:
    - question: |
        면접관: "reinforcement learning 에서 policy 를 한 번에 크게 바꾸는 것이 supervised learning 에서 모델을 크게 바꾸는 것보다 더 위험한 이유는 무엇인가요?"
      choices:
        - 'reinforcement learning 은 gradient 를 쓰지 않아서 한 번 틀리면 고칠 방법이 없기 때문이다'
        - 'reinforcement learning 의 데이터에는 늘 정답 action 이 붙어 있어서 크게 바꾸면 정답과 어긋나기 때문이다'
        - 'policy 가 자기 데이터를 직접 모으므로, 좋은 action 을 거의 고르지 않게 된 policy 는 그 action 이 좋다는 데이터를 모으지 못해 회복이 어렵기 때문이다'
        - 'supervised learning 에는 learning rate 가 없어서 모델이 크게 바뀌는 일이 생기지 않기 때문이다'
      answer: 2
      explanation: |
        supervised learning 은 모델이 아무리 틀려도 학습 데이터가 그대로라서 다시 배울 수 있지만, reinforcement learning 은 망가진 policy 가 다음
        데이터를 직접 모으므로 좋은 action 의 sample 이 거의 들어오지 않고 정확한 gradient 도 아주 작아진다.
        reinforcement learning 도 policy gradient 처럼 gradient 로 policy 를 고친다.
        정답 action 이 붙은 데이터로 배우는 것은 supervised learning 쪽이고, reinforcement learning 은 reward 로 배운다.
        supervised learning 에도 learning rate 가 있고, 너무 크면 학습이 발산할 수 있다.
    - question: |
        면접관: "더 좋은 action 을 골랐는데 운이 나빠 평균보다 낮은 reward 를 받은 sample 하나로, 아주 큰 learning rate 를 써서 policy 를 한 번 update 하면 어떤 일이 생길 수 있나요?"
      choices:
        - '운이 나쁜 결과도 평균에 섞이므로 더 좋은 action 의 확률이 조금 올라간다'
        - 'learning rate 가 커서 sample 의 운이 지워지고 기댓값에 맞는 policy 가 된다'
        - 'advantage 가 음수인 sample 은 update 에 쓰이지 않으므로 policy 가 바뀌지 않는다'
        - 'advantage 가 음수라 그 action 의 확률을 내리는데, step 이 아주 크면 더 좋은 action 을 거의 고르지 않는 policy 가 될 수 있다'
      answer: 3
      explanation: |
        이 sample 의 advantage 는 음수라서 update 는 그 action 의 확률을 내리는 방향이고, learning rate 가 아주 크면 sample 하나의 운이 policy 를
        통째로 바꿔 좋은 action 을 버리게 만든다.
        advantage 가 음수인 sample 은 확률을 내리는 쪽으로 작용하므로 그 action 의 확률이 올라가지 않는다.
        learning rate 는 한 sample 의 영향을 키울 뿐이고, 운을 지우는 것은 여러 sample 의 평균이다.
        advantage 가 음수인 sample 도 그 action 의 확률을 내리는 gradient 를 주므로 update 에 쓰인다.
    - question: |
        면접관: "learning rate 만 충분히 작게 잡으면 policy 가 한 번에 크게 바뀌는 일은 없다고 봐도 될까요?"
      choices:
        - '그렇다. parameter 의 변화가 작으면 모든 action 의 확률도 늘 같은 비율로 작게 바뀐다'
        - '아니다. learning rate 는 parameter 가 움직이는 크기를 정할 뿐이고, 같은 parameter 변화가 출발한 값에 따라 어떤 action 의 확률을 훨씬 큰 배수로 바꿀 수 있다'
        - '그렇다. learning rate 가 작으면 policy 는 전혀 바뀌지 않는다'
        - '아니다. learning rate 를 줄이면 오히려 한 번의 update 가 더 커진다'
      answer: 1
      explanation: |
        softmax policy 에서 parameter 를 같은 양만큼 옮겨도 이미 한쪽으로 쏠린 경우에는 작은 확률을 가진 action 의 확률이 훨씬 큰 배수로 바뀌므로,
        policy 의 변화는 action 마다 확률이 몇 배가 되었는지로 재야 한다.
        parameter 변화와 확률 변화의 비율은 출발한 값마다 달라서 늘 같은 비율로 작아지지 않는다.
        learning rate 가 작아도 0 이 아니면 policy 는 조금씩 바뀐다.
        learning rate 를 줄이면 한 번의 update 도 작아진다.

- topic: ratio
  title: probability ratio 와 importance sampling
  variants:
    - question: |
        면접관: "PPO 의 probability ratio $r_t(\theta) = \pi_\theta(a_t \mid s_t) / \pi_{\theta_\text{old}}(a_t \mid s_t)$ 는 무엇을 나타내나요?"
      choices:
        - 'action $a_t$ 를 한 뒤 받은 reward 를 옛 policy 의 reward 로 나눈 값이다'
        - '같은 state 에서 서로 다른 두 action 의 확률을 나눈 값이다'
        - '고치기 시작하는 순간에 가장 크고, 고칠수록 1 에 다가가는 값이다'
        - '지금 policy 가 그 action 을 고를 확률이 데이터를 모은 옛 policy 의 몇 배인지이고, 고치기 시작하는 순간에는 1 이다'
      answer: 3
      explanation: |
        ratio 는 같은 action 을 새 policy 가 고를 확률을 옛 policy 가 고를 확률로 나눈 값이라 1 보다 크면 그 action 을 더 자주, 작으면 덜 자주 고르게 된 것이고,
        고치기 시작할 때는 $\theta = \theta_\text{old}$ 라서 정확히 1 이다.
        글자 $r$ 이 reward 와 같을 뿐 ratio 는 reward 를 쓰지 않는다.
        ratio 는 서로 다른 action 이 아니라 같은 action 의 두 policy 확률을 나눈다.
        ratio 는 고치기 시작할 때 1 이고, 고칠수록 1 에서 멀어진다.
    - question: |
        면접관: "옛 policy 는 거의 고르지 않던 action 을 지금 policy 는 더 자주 고릅니다. 옛 데이터로 지금 policy 의 평균을 계산할 때 그 action 의 sample 은 어떻게 세나요?"
      choices:
        - 'ratio 가 1 보다 크므로 그 sample 을 1 개보다 많은 몫으로 센다'
        - '옛 policy 로 모은 sample 이라서 버린다'
        - '어떤 policy 로 모았든 늘 1 개 몫으로 센다'
        - 'ratio 가 1 보다 크므로 그 sample 을 1 개보다 적은 몫으로 센다'
      answer: 0
      explanation: |
        옛 데이터에는 그 action 이 지금 policy 에서보다 적게 들어 있으므로 sample 마다 ratio 를 곱해 모자란 만큼 크게 세는데, 이 방법이
        importance sampling 이다.
        옛 데이터를 버리면 같은 데이터를 여러 번 쓸 수 없고, ratio 를 곱하면 옛 데이터로도 계산할 수 있다.
        늘 1 개 몫으로 세면 옛 policy 의 비율로 평균하게 되어 지금 policy 의 평균과 달라진다.
        ratio 가 1 보다 큰 sample 은 곱하면 몫이 커지고, 몫이 작아지는 것은 ratio 가 1 보다 작은 sample 이다.
    - question: |
        면접관: "importance sampling 으로 옛 데이터를 다시 쓸 때, ratio 가 1 에서 아주 멀어지면 왜 문제가 되나요?"
      choices:
        - 'ratio 가 1 에서 멀면 나눗셈을 할 수 없어 계산이 멈추기 때문이다'
        - 'ratio 가 크면 environment 가 주는 reward 자체가 커지기 때문이다'
        - '옛 데이터에 드물게 들어 있던 sample 하나가 아주 큰 몫으로 세어져, 그 한 sample 의 운에 따라 평균이 크게 흔들리기 때문이다'
        - 'ratio 가 1 에서 멀수록 평균이 더 정확해지므로 문제가 되지 않는다'
      answer: 2
      explanation: |
        옛 policy 가 0.01 로 고르던 action 을 새 policy 가 0.5 로 고르면 ratio 가 50 이라 100 번에 1 번꼴로 들어 있던 sample 하나가 50 개 몫이 되고,
        그 하나가 좋았는지 나빴는지가 평균을 좌우한다.
        옛 확률이 0 이 아니면 나눗셈은 늘 할 수 있으므로 계산이 멈추지는 않는다.
        ratio 는 학습 계산에 쓰는 값이라 environment 가 주는 reward 를 바꾸지 않는다.
        ratio 가 1 에서 멀수록 몇몇 sample 에 무게가 몰려 평균이 오히려 불안정해진다.

- topic: clip-term
  title: clipped surrogate 와 TRPO
  variants:
    - question: |
        면접관: "PPO 의 clipped surrogate 는 sample 마다 자르지 않은 항 $r\hat A$ 와 자른 항 $\operatorname{clip}(r, 1-\epsilon, 1+\epsilon)\hat A$ 가운데 작은 값을 고릅니다. 작은 값을 고르는 이유는 무엇인가요?"
      choices:
        - '더 비관적인 값을 골라, 좋아지는 쪽으로는 경계까지만 믿고 나빠지는 쪽은 그대로 반영하려는 것이다'
        - '두 항 가운데 작은 값이 계산이 빨라서다'
        - '작은 값을 고르면 advantage 의 부호가 늘 양수가 되기 때문이다'
        - '큰 값을 고르면 모든 sample 의 gradient 가 0 이 되기 때문이다'
      answer: 0
      explanation: |
        advantage 가 가리키는 방향으로 이미 경계를 넘었으면 자른 항이 작아 더 밀지 않고, 반대 방향으로 잘못 갔으면 자르지 않은 항이 작아 되돌리는
        gradient 가 그대로 흐르므로 min 은 늘 덜 낙관적인 쪽을 고른다.
        두 항을 모두 계산한 뒤 고르므로 작은 값을 고른다고 계산이 빨라지지 않는다.
        min 은 값을 고를 뿐 advantage 의 부호를 바꾸지 않는다.
        큰 값을 고르면 경계를 넘은 쪽으로 계속 밀 수 있어 policy 가 멀어지며, gradient 가 모두 0 이 되지도 않는다.
    - question: |
        면접관: "TRPO 와 PPO 는 둘 다 새 policy 를 옛 policy 가까이에 두려고 합니다. 두 방법의 차이를 설명해 보세요."
      choices:
        - 'TRPO 는 ratio 를 자르고, PPO 는 KL divergence 에 조건을 건다'
        - '둘 다 learning rate 를 아주 작게 고정하는 방법이라 차이가 없다'
        - 'TRPO 는 critic 을 쓰지 않고, PPO 는 critic 만 고친다'
        - 'TRPO 는 두 policy 의 KL divergence 가 작은 값을 넘지 않게 조건을 걸어 계산이 무겁고, PPO 는 ratio 를 직접 잘라 보통의 gradient 계산만으로 비슷한 효과를 낸다'
      answer: 3
      explanation: |
        TRPO 는 KL divergence 조건(논문에서 0.01)을 지키는 방향을 찾느라 gradient 가 parameter 에 따라 어떻게 바뀌는지까지 계산해야 했고, PPO 는
        ratio 를 $[1-\epsilon, 1+\epsilon]$ 로 잘라 같은 목적을 보통의 gradient 계산만으로 이룬다.
        ratio 를 자르는 쪽이 PPO 이고 KL 에 조건을 거는 쪽이 TRPO 라서 이 설명은 둘을 뒤바꾼 것이다.
        두 방법 모두 learning rate 가 아니라 policy 의 변화 자체를 제한한다.
        두 방법 모두 actor 인 policy 를 고치는 알고리즘이고, critic 의 사용 여부로 나뉘지 않는다.
    - question: |
        면접관: "PPO 의 clip 은 ratio 를 늘 $[0.8, 1.2]$ 안에 가두나요?"
      choices:
        - '그렇다. 매 update 가 끝나면 ratio 를 경계 안으로 되돌린다'
        - '아니다. 한 번의 update 가 크면 ratio 가 경계를 넘을 수 있고, clip 은 그다음부터 그 방향으로 더 밀지 않을 뿐이다'
        - '그렇다. ratio 가 경계에 닿는 순간 그 iteration 의 학습 전체가 멈춘다'
        - '아니다. clip 은 ratio 가 아니라 advantage 를 $[0.8, 1.2]$ 로 자른다'
      answer: 1
      explanation: |
        clip 은 범위 밖에서 그 방향의 gradient 를 0 으로 만들 뿐 ratio 를 되돌리는 장치가 아니어서, gradient step 하나가 크면 ratio 가 1.2 를 넘어
        1.3 이 될 수 있다.
        ratio 를 되돌리는 계산은 PPO 에 없고, 범위 밖 sample 의 gradient 만 0 이 된다.
        경계를 넘은 sample 만 멈추고 다른 sample 들은 계속 학습에 쓰이므로 학습 전체가 멈추지 않는다.
        잘리는 값은 advantage 가 아니라 ratio 다.

- topic: clip-cases
  title: advantage 부호별 clip 의 동작
  variants:
    - question: |
        면접관: "PPO($\epsilon = 0.2$)에서 advantage 가 양수인 sample 의 ratio 가 1.3 이 되었습니다. 이 sample 은 policy 를 어떻게 움직이나요?"
      choices:
        - '좋은 action 이므로 그 action 의 확률을 계속 올린다'
        - 'ratio 가 범위 밖이므로 그 action 의 확률을 내린다'
        - 'gradient 가 0 이라 더 움직이지 않는다. 좋은 action 의 확률을 이미 1.2 배 넘게 올렸기 때문이다'
        - 'ratio 를 1 로 되돌리는 gradient 를 낸다'
      answer: 2
      explanation: |
        advantage 가 양수면 surrogate 는 ratio 를 키우려 하는데 이미 1.2 를 넘었으므로 자른 항 $1.2\hat A$ 가 작은 값으로 골라지고, 그 항은 $\theta$
        를 바꿔도 변하지 않아 gradient 가 0 이다.
        확률을 계속 올리는 것은 ratio 가 1.2 보다 작을 때까지만이다.
        자른 항은 값이 변하지 않으므로 확률을 내리는 gradient 도 만들지 않는다.
        PPO 에는 ratio 를 1 로 되돌리는 항이 없다.
    - question: |
        면접관: "PPO($\epsilon = 0.2$)에서 advantage 가 음수인 sample 의 ratio 가 오히려 1.3 으로 올라갔습니다. 이 sample 은 어떻게 처리되나요?"
      choices:
        - 'ratio 가 범위 밖이므로 gradient 가 0 이라 움직이지 않는다'
        - '나쁜 action 이지만 ratio 가 커졌으므로 그 action 의 확률을 더 올린다'
        - 'ratio 가 범위 밖인 sample 은 batch 에서 빼고 버린다'
        - '자르지 않은 항 $1.3\hat A$ 가 더 작아 골라지고, gradient 가 그대로 흘러 나쁜 action 의 확률을 다시 내린다'
      answer: 3
      explanation: |
        나쁜 action 의 확률이 1.3 배로 올라간 것은 update 가 잘못된 방향으로 간 경우이고, advantage 가 음수일 때 $1.3\hat A$ 는 $1.2\hat A$ 보다 작아
        자르지 않은 항이 골라지므로 되돌리는 gradient 가 살아 있다.
        범위 밖이라도 반대 방향으로 벗어난 경우에는 gradient 가 0 이 되지 않는다.
        advantage 가 음수인 sample 의 gradient 는 그 action 의 확률을 내리는 방향이다.
        PPO 는 ratio 가 범위 밖이라는 이유로 sample 을 버리지 않는다.
    - question: |
        면접관: "PPO 의 clipped surrogate 에서 sample 의 gradient 가 0 이 되는 경우를 정확히 말해 보세요."
      choices:
        - 'advantage 가 양수이고 ratio 가 $1 + \epsilon$ 보다 큰 경우와 advantage 가 음수이고 ratio 가 $1 - \epsilon$ 보다 작은 경우로, 둘 다 advantage 가 가리키는 방향으로 이미 경계를 넘었다'
        - 'ratio 가 $[1 - \epsilon, 1 + \epsilon]$ 밖에 있는 모든 경우다'
        - 'ratio 가 정확히 1 인 경우다'
        - 'advantage 가 음수인 모든 경우다'
      answer: 0
      explanation: |
        멈추는 경우는 이미 원하는 쪽으로 $\epsilon$ 넘게 간 두 경우뿐이다.
        ratio 가 범위 밖이어도 반대 방향으로 벗어났다면 되돌리는 gradient 가 흐르므로 범위 밖이라고 모두 멈추지는 않는다.
        ratio 가 1 이면 범위 안이라 두 항이 같고 gradient 가 그대로 흐른다.
        advantage 가 음수인 sample 도 ratio 가 $1 - \epsilon$ 아래로 내려가기 전까지는 확률을 내리는 gradient 를 준다.

- topic: gae
  title: GAE 와 λ
  variants:
    - question: |
        면접관: "GAE 의 $\lambda$ 를 0 과 1 로 두면 advantage 추정은 각각 어떻게 되나요?"
      choices:
        - '$\lambda = 0$ 이면 episode 끝까지의 return 을 쓰고, $\lambda = 1$ 이면 TD error 하나만 쓴다'
        - '$\lambda = 0$ 이면 TD error 하나만 써 critic 에 그대로 기대므로 bias 가 크고, $\lambda = 1$ 이면 끝까지 받은 reward 를 모두 더해 variance 가 크다'
        - '$\lambda$ 는 advantage 의 크기만 바꾸고 bias 나 variance 와는 관계없다'
        - '$\lambda = 0$ 과 $\lambda = 1$ 은 둘 다 bias 와 variance 가 모두 작다'
      answer: 1
      explanation: |
        $\lambda = 0$ 이면 $\hat A_t = \delta_t$ 라서 critic 의 다음 state 예측이 틀린 만큼 advantage 가 치우치고, $\lambda = 1$ 이면 TD error 를 모두
        더해 중간 예측이 지워지지만 그 사이 모든 step 의 운이 섞인다.
        끝까지의 return 을 쓰는 쪽이 $\lambda = 1$ 이라서 이 설명은 둘을 뒤바꾼 것이다.
        $\lambda$ 는 몇 step 뒤의 TD error 까지 반영할지를 정하므로 bias 와 variance 의 균형을 바꾼다.
        두 끝은 각각 bias 와 variance 가운데 하나가 커서, 둘 다 작은 설정은 없다.
    - question: |
        면접관: "GAE 를 구현할 때 마지막 step 부터 거꾸로 $\hat A_t = \delta_t + \gamma\lambda\,\hat A_{t+1}$ 로 계산하는 이유는 무엇인가요?"
      choices:
        - '앞 step 부터 계산하면 다른 값이 나오기 때문이다'
        - '마지막 step 의 advantage 가 가장 중요해서 먼저 계산해야 하기 때문이다'
        - '$\hat A_t$ 는 뒤쪽 TD error 들에 $\gamma\lambda$ 를 거듭 곱해 더한 값이라, 다음 step 의 advantage 를 다시 쓰면 한 번 훑는 것으로 모든 step 을 계산할 수 있기 때문이다'
        - 'critic 이 뒤쪽 state 부터만 예측할 수 있기 때문이다'
      answer: 2
      explanation: |
        $\hat A_t = \delta_t + \gamma\lambda\,\delta_{t+1} + (\gamma\lambda)^2\delta_{t+2} + \cdots$ 에서 첫 항을 빼고 나머지를 $\gamma\lambda$ 로
        묶으면 그것이 $\hat A_{t+1}$ 이라서, 뒤에서부터 계산하면 같은 덧셈을 되풀이하지 않는다.
        step 마다 합을 따로 계산해도 결과는 같고, 계산 순서는 효율의 문제다.
        모든 step 의 advantage 가 똑같이 학습에 쓰이며 마지막 step 이 더 중요하지는 않다.
        critic 은 어느 state 든 순서와 관계없이 예측할 수 있다.
    - question: |
        면접관: "PPO 에서 $\gamma = 0.99$, $\lambda = 0.95$ 처럼 $\lambda$ 를 1 보다 조금 작게 잡는 이유는 무엇인가요?"
      choices:
        - '수십 step 뒤까지의 실제 결과는 반영하되 아주 먼 뒤의 운은 줄여서, bias 와 variance 사이의 균형을 잡으려는 것이다'
        - '$\lambda$ 를 1 보다 작게 하면 critic 이 필요 없어지기 때문이다'
        - '$\lambda$ 가 1 이면 advantage 를 계산할 수 없기 때문이다'
        - '$\lambda$ 를 1 보다 작게 하면 advantage 가 모두 양수가 되기 때문이다'
      answer: 0
      explanation: |
        $\gamma\lambda = 0.9405$ 이면 10 step 뒤의 TD error 는 약 0.54 배의 몫을 받고 50 step 뒤의 TD error 는 약 0.047 배를 받아서,
        가까운 미래는 충분히 반영하고 먼 미래의 운은 줄인다.
        TD error 를 계산하려면 critic 의 예측이 있어야 하므로 critic 은 여전히 필요하다.
        $\lambda = 1$ 도 계산할 수 있고, 이때는 return 에서 critic 의 예측을 뺀 값이 된다.
        $\lambda$ 는 몫을 정할 뿐 advantage 의 부호를 정하지 않는다.

- topic: bootstrap
  title: rollout 의 끝과 time-out
  variants:
    - question: |
        면접관: "PPO 의 rollout 이 episode 가 끝나지 않은 채 정해진 step 수에서 멈췄습니다. 마지막 step 의 advantage 는 어떻게 계산하나요?"
      choices:
        - '마지막 state 다음의 value 를 critic 의 예측으로 채워(bootstrap) TD error 를 계산한다'
        - '다음 state 의 value 를 0 으로 두고 episode 가 끝난 것처럼 계산한다'
        - '마지막 step 은 advantage 를 계산할 수 없으므로 버린다'
        - '다음 rollout 이 끝날 때까지 기다렸다가 실제 reward 로 계산한다'
      answer: 0
      explanation: |
        rollout 이 끊긴 뒤에도 episode 는 이어지므로 아직 받지 않은 reward 를 critic 의 예측 $V(s_{t+1})$ 로 채워 $\delta_t$ 를 계산한다.
        value 를 0 으로 두는 것은 로봇이 넘어진 것처럼 실제로 episode 가 끝났을 때의 처리다.
        마지막 step 을 버리지 않아도 bootstrap 으로 계산할 수 있다.
        다음 rollout 은 고친 policy 로 모으므로, 기다렸다가 계산하면 옛 policy 의 데이터에 다른 policy 의 결과가 섞인다.
    - question: |
        면접관: "보행 학습에서 로봇이 넘어져 끝난 episode 와 20 초 제한이 다 되어 끊긴 episode(time-out)를 구분해야 하는 이유는 무엇인가요?"
      choices:
        - '넘어진 episode 는 reward 를 모두 버려야 하고, time-out 은 그대로 써야 하기 때문이다'
        - '넘어진 경우는 이후 받을 reward 가 없어 value 를 0 으로 두지만, time-out 은 로봇이 계속 걸을 수 있었으므로 critic 의 예측으로 bootstrap 해야 critic 이 틀린 것을 배우지 않기 때문이다'
        - 'time-out 이 난 env 는 다음 iteration 에서 학습에 쓰지 않기 때문이다'
        - '두 경우 모두 value 를 0 으로 두지만 기록용으로만 구분한다'
      answer: 1
      explanation: |
        time-out 은 observation 에 남은 시간이 없어 critic 이 예측할 수 없는 끊김이라, 0 으로 두면 잘 걷던 state 의 value 를 낮게 배우므로
        Rudin 등은 time-out 을 따로 감지해 bootstrap 했다.
        넘어진 episode 의 reward 도 학습에 그대로 쓰이고, 그 뒤의 value 만 0 으로 둔다.
        time-out 이 난 env 도 reset 된 뒤 계속 데이터를 모은다.
        두 경우를 모두 0 으로 두면 time-out 에서 critic 이 틀린 정답을 배우므로 기록만 하는 구분이 아니다.
    - question: |
        면접관: "수천 개의 env 를 띄우고 env 마다 rollout 길이를 아주 짧게, 예를 들어 몇 step 만 잡으면 PPO 학습에 어떤 문제가 생기나요?"
      choices:
        - 'batch 가 커져서 GPU 메모리가 부족해지는 것 말고는 문제가 없다'
        - 'rollout 이 짧으면 episode 가 끝나지 않아 reward 를 받을 수 없다'
        - 'rollout 이 짧을수록 sample 이 서로 닮아 데이터가 다양하지 않게 된다'
        - 'GAE 가 여러 step 의 reward 를 쓰지 못하고 critic 의 예측에 거의 기대게 되어 학습이 잘 되지 않는다'
      answer: 3
      explanation: |
        GAE 는 연속된 여러 step 의 reward 를 섞어야 효과가 있어서, Rudin 등은 env 마다 연속 step 이 0.5 초(약 25 step)보다 짧으면 학습이 잘 되지
        않았다고 보고했다.
        env 마다 step 을 줄이면 같은 env 수에서 batch 는 오히려 작아진다.
        reward 는 episode 가 끝나지 않아도 step 마다 받는다.
        sample 이 서로 닮는 것은 env 수가 적고 env 마다 step 이 길 때의 문제다.

- topic: ppo-iteration
  title: PPO 의 한 iteration 과 loss
  variants:
    - question: |
        면접관: "PPO 의 한 iteration 을 순서대로 설명해 보세요."
      choices:
        - '데이터를 버리기 → GAE 계산 → rollout 수집 → mini-batch 학습'
        - '지금 policy 로 rollout 수집 → GAE 로 advantage 와 critic 의 정답 계산 → 섞어서 mini-batch 로 여러 epoch 학습 → 데이터 버리기'
        - 'mini-batch 학습 → rollout 수집 → GAE 계산 → 데이터를 buffer 에 계속 쌓기'
        - 'rollout 수집 → 한 번만 학습 → GAE 계산 → 다음 rollout 수집'
      answer: 1
      explanation: |
        PPO 는 지금 policy 로 env 여러 개를 정해진 step 수만큼 움직여 데이터를 모으고, GAE 를 계산한 뒤 섞어서 mini-batch 로 여러 epoch 고치고,
        데이터를 버린 다음 고친 policy 로 다시 모은다.
        데이터를 먼저 버리면 학습할 데이터가 없다.
        데이터를 buffer 에 계속 쌓아 두고 다시 쓰는 것은 off-policy 방법의 replay buffer 다.
        GAE 는 학습 전에 계산해야 하고, PPO 는 한 번이 아니라 여러 epoch 학습한다.
    - question: |
        면접관: "PPO 는 같은 데이터로 여러 epoch 학습하는데도 on-policy 방법으로 분류합니다. 그 이유는 무엇인가요?"
      choices:
        - '데이터를 그 데이터를 모은 iteration 안에서만 다시 쓰고, 그동안 clip 으로 새 policy 를 옛 policy 가까이 두며, iteration 이 끝나면 버리기 때문이다'
        - 'PPO 는 사실 데이터를 한 번만 쓰기 때문이다'
        - 'PPO 는 replay buffer 에 모든 데이터를 쌓아 두기 때문이다'
        - 'PPO 에는 critic 이 없기 때문이다'
      answer: 0
      explanation: |
        on-policy 는 지금 policy 로 모은 데이터로 배우는 방법이고, PPO 는 같은 iteration 의 데이터만 쓰면서 clip 으로 새 policy 가 데이터를 모은
        policy 에서 멀어지지 않게 한다.
        PPO 는 같은 데이터를 여러 epoch 쓰므로 한 번만 쓰지 않는다.
        오래전 policy 의 데이터까지 replay buffer 에 쌓아 두고 쓰는 것은 off-policy 방법이다.
        PPO 에도 value 를 예측하는 critic 이 있고 value loss 로 함께 고친다.
    - question: |
        면접관: "PPO 의 loss $\mathcal L = -L^{\text{CLIP}} + c_v L^{\text{VF}} - c_e \mathcal H$ 에서 entropy 항 $\mathcal H$ 는 왜 넣나요?"
      choices:
        - 'critic 의 예측이 GAE 의 정답에 가까워지게 하려고 넣는다'
        - 'ratio 를 $[1-\epsilon, 1+\epsilon]$ 로 자르려고 넣는다'
        - 'policy 가 너무 빨리 한 action 으로 쏠리지 않게 해, 여러 action 을 계속 해 보는 exploration 이 일찍 사라지지 않게 하려고 넣는다'
        - 'environment 가 주는 reward 를 키우려고 넣는다'
      answer: 2
      explanation: |
        entropy 는 확률분포가 얼마나 고르게 퍼져 있는지 재는 값이라 loss 에서 빼면 policy 가 여러 action 을 섞는 쪽으로 약간 끌린다. legged_gym 은
        이 계수를 0.01 로 작게 둔다.
        critic 의 예측을 정답에 맞추는 것은 value loss $L^{\text{VF}}$ 의 몫이다.
        ratio 를 자르는 것은 $L^{\text{CLIP}}$ 안의 clip 이다.
        loss 의 항은 policy 를 고치는 방향을 바꿀 뿐 environment 가 주는 reward 를 바꾸지 않는다.

- topic: parallel-sim
  title: 대규모 병렬 simulation 과 PPO 설정
  variants:
    - question: |
        면접관: "PPO 는 데이터를 한 iteration 만 쓰고 버리는데도, Isaac Gym 이나 Isaac Lab 같은 GPU 병렬 simulation 에서 보행 학습에 많이 쓰입니다. 왜 잘 맞나요?"
      choices:
        - 'PPO 는 replay buffer 로 지난 데이터를 계속 다시 써서 데이터가 적게 들기 때문이다'
        - 'PPO 는 simulation 없이 실물 로봇에서 바로 학습하도록 설계되었기 때문이다'
        - '병렬 simulation 에서는 reward 가 필요 없어서 PPO 의 critic 을 쓰지 않아도 되기 때문이다'
        - '수천 개 env 가 새 데이터를 싸게 많이 만들어 데이터를 버리는 약점이 작아지고, gradient 만 쓰는 단순한 계산이라 rollout 과 update 를 모두 GPU 에서 처리하기 쉬우며, 큰 batch 로 gradient 가 안정되기 때문이다'
      answer: 3
      explanation: |
        on-policy 인 PPO 는 데이터가 많이 드는데 GPU 위의 수천 대 simulation 이 그 데이터를 싸게 만든다. Rudin 등은 env 4096 개와 batch 98,304 로
        험지 보행은 20 분 안에 학습했고 평지 보행은 4 분 안에 학습했다.
        replay buffer 로 지난 데이터를 다시 쓰는 것은 DQN·SAC 같은 off-policy 방법이다.
        PPO 는 데이터가 많이 들어서 실물 로봇에서 바로 학습하기에 오히려 불리하다.
        병렬 simulation 에서도 reward 로 배우고, PPO 는 GAE 계산에 critic 을 쓴다.
    - question: |
        면접관: "legged_gym 의 기본 PPO 설정은 env 4096 개, env 마다 24 step, mini-batch 4 개, 5 epoch 입니다. 한 iteration 에서 같은 데이터로 policy 를 몇 번 고치나요?"
      choices:
        - '1 번. PPO 는 iteration 마다 한 번만 고친다'
        - '5 번. epoch 수만큼 고친다'
        - '20 번. epoch 마다 mini-batch 4 개로 한 번씩 고쳐 5 × 4 번이다'
        - '98,304 번. sample 하나마다 한 번씩 고친다'
      answer: 2
      explanation: |
        sample $4096 \times 24 = 98{,}304$ 개를 4 개의 mini-batch(각 24,576 개)로 나누고 mini-batch 마다 gradient step 을 한 번 하므로 epoch 하나에
        4 번, 5 epoch 에 20 번이다.
        한 번만 고치고 버리는 것은 policy gradient 의 방식이고 PPO 는 여러 번 고친다.
        epoch 하나 안에서도 mini-batch 수만큼 고치므로 5 번보다 많다.
        gradient step 은 sample 이 아니라 mini-batch 마다 한 번이다.
    - question: |
        면접관: "rsl_rl 의 PPO 는 learning rate 를 adaptive 로 둡니다(`desired_kl = 0.01`). mini-batch 에서 잰 KL divergence 가 0.03 이면 learning rate 는 어떻게 되나요?"
      choices:
        - 'KL 이 목표보다 크므로 learning rate 를 1.5 배로 키운다'
        - 'KL 이 목표의 두 배인 0.02 를 넘었으므로 learning rate 를 1.5 로 나눈다'
        - 'KL 은 기록용이라 learning rate 는 바뀌지 않는다'
        - 'KL 이 목표보다 크면 그 mini-batch 의 update 를 취소한다'
      answer: 1
      explanation: |
        rsl_rl 은 KL 이 `desired_kl` 의 두 배를 넘으면 learning rate 를 1.5 로 나누고 절반보다 작으면 1.5 를 곱해, policy 가 한 번에 바뀌는 크기를
        KL 0.01 근처로 맞춘다.
        learning rate 를 키우는 것은 KL 이 0.005 보다 작아 policy 가 너무 적게 바뀔 때다.
        schedule 이 adaptive 이면 KL 로 learning rate 를 실제로 바꾼다.
        rsl_rl 은 update 를 취소하지 않고 다음 update 의 learning rate 만 바꾼다.
