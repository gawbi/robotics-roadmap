# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: big-step
  title: 한 번에 크게 바꾼 update
  variants:
    - question: |
        reinforcement learning 에서 policy 를 한 번에 크게 바꾸는 것이 supervised learning 에서 모델을 크게 바꾸는 것보다 더 위험한
        이유로 맞는 것은?
      choices:
        - 'reinforcement learning 은 gradient 를 쓰지 않기 때문이다'
        - 'reinforcement learning 의 데이터는 언제나 정답이 붙어 있기 때문이다'
        - 'policy 가 자기 데이터를 직접 모으므로, 망가진 policy 는 좋은 action 의 데이터를 거의 모으지 못해 다시 좋아질 단서를 찾기 어렵기 때문이다'
        - 'supervised learning 은 learning rate 가 없기 때문이다'
      answer: 2
      explanation: |
        supervised learning 에서는 모델이 아무리 틀려도 학습 데이터가 그대로라 다시 배울 수 있다. reinforcement learning 에서는 좋은 action 의
        확률을 거의 0 으로 만든 policy 가 그 action 을 거의 고르지 않으니, 그 action 이 좋다는 정보가 데이터에 들어오지 않는다. 그래서 정확한
        gradient 를 알아도 되돌아오는 데 오래 걸린다. 두 학습 모두 gradient 와 learning rate 를 쓴다.
    - question: |
        "learning rate 만 작게 잡으면 policy 가 크게 바뀌는 일은 없다" 는 생각에 대해 맞는 것은?
      choices:
        - '틀리다. learning rate 를 작게 하면 오히려 policy 가 더 크게 바뀐다'
        - '맞다. parameter 변화가 작으면 확률 변화도 언제나 같은 비율로 작다'
        - '맞다. learning rate 가 작으면 policy 는 전혀 바뀌지 않는다'
        - '틀리다. learning rate 는 parameter 가 움직이는 크기를 정할 뿐이고, 같은 parameter 변화도 어느 자리에서 출발하느냐에 따라 action 의 확률을 전혀 다른 배수로 바꾼다'
      answer: 3
      explanation: |
        softmax policy 에서 parameter 를 똑같이 1 만큼 옮겨도, 어떤 자리에서는 한 action 의 확률이 0.54 배가 되고 어떤 자리에서는 0.37 배가
        된다. 그래서 policy 의 변화는 parameter 의 변화가 아니라 action 마다 확률이 몇 배가 되었는지로 재야 하고, 어느 자리에서나 안전한
        learning rate 하나를 미리 정하기 어렵다. learning rate 를 줄이면 변화가 작아지기는 하지만 그 비율이 자리마다 다르다.
    - question: |
        더 좋은 action 을 골랐는데 운이 나빠 평균보다 낮은 reward 를 받은 sample 하나로, 아주 큰 learning rate 를 써서 한 번 update 했다.
        결과로 가장 그럴듯한 것은?
      choices:
        - '더 좋은 action 의 확률이 조금 올라간다'
        - 'sample 하나 때문에 더 좋은 action 을 거의 고르지 않는 policy 가 될 수 있다'
        - 'learning rate 가 크면 운이 지워져 정확한 policy 가 된다'
        - '아무것도 바뀌지 않는다'
      answer: 1
      explanation: |
        이 sample 의 advantage 는 음수라서 update 는 그 action 의 확률을 내리는 방향이다. learning rate 가 작으면 조금 내려가는 데서 그치지만,
        아주 크면 sample 하나의 운이 policy 를 통째로 바꿔 좋은 action 을 버리게 만든다. learning rate 를 키운다고 운이 지워지지는 않는다.
        같은 데이터로 여러 번 고치는 것도 비슷한 효과를 내므로 PPO 는 policy 의 변화를 따로 제한한다.

- topic: ratio
  title: probability ratio 와 옛 데이터의 재사용
  variants:
    - question: |
        PPO 의 probability ratio $r_t(\theta) = \pi_\theta(a_t \mid s_t) / \pi_{\theta_\text{old}}(a_t \mid s_t)$ 에 대한 설명으로 맞는 것은?
      choices:
        - 'action 을 한 뒤 받은 reward 다'
        - '두 action 의 확률을 서로 나눈 값이다'
        - '고치기 시작하는 순간에 가장 크고 고칠수록 1 에 다가간다'
        - '새 policy 가 그 action 을 고를 확률이 데이터를 모은 옛 policy 의 몇 배인지이고, 고치기 시작하는 순간에는 1 이다'
      answer: 3
      explanation: |
        ratio 는 같은 action 에 대해 새 확률을 옛 확률로 나눈 값이라, 1 보다 크면 그 action 을 더 자주, 작으면 덜 자주 고르게 된 것이다.
        고치기 시작하는 순간에는 $\theta = \theta_\text{old}$ 라서 모든 sample 의 ratio 가 정확히 1 이고, 고칠수록 1 에서 멀어진다. 글자 $r$ 이
        reward 와 같을 뿐 다른 값이며, 서로 다른 action 의 확률을 나누는 것도 아니다.
    - question: |
        옛 policy 는 거의 고르지 않던 action 을 새 policy 는 더 자주 고른다. 옛 데이터로 새 policy 의 평균을 구할 때 그 action 의 sample 은
        어떻게 세는가?
      choices:
        - 'ratio 가 1 보다 크므로 그 sample 을 1 개보다 많은 몫으로 센다'
        - '옛 데이터라서 버린다'
        - '언제나 1 개 몫으로 센다'
        - 'ratio 가 1 보다 크므로 1 개보다 적은 몫으로 센다'
      answer: 0
      explanation: |
        옛 데이터에는 그 action 이 새 policy 에서보다 적게 들어 있으므로, sample 마다 ratio 를 곱해 모자란 만큼 더 크게 센다. 반대로 옛
        policy 가 더 자주 고르던 action 은 ratio 가 1 보다 작아 덜 센다. 이렇게 다른 확률로 모은 sample 에 확률의 비를 곱해 원하는 확률의
        평균을 구하는 방법이 importance sampling 이다.
    - question: |
        importance sampling 으로 옛 데이터를 다시 쓸 때, ratio 가 1 에서 아주 멀어지면 위험한 이유로 맞는 것은?
      choices:
        - 'ratio 가 1 에서 멀면 계산이 불가능하기 때문이다'
        - 'ratio 가 크면 reward 가 커지기 때문이다'
        - '옛 데이터에 드물게 들어 있던 sample 하나가 아주 큰 몫으로 세어져, 그 한 sample 의 운에 따라 평균이 크게 흔들리기 때문이다'
        - 'ratio 가 1 에서 멀수록 평균이 더 정확해지므로 위험하지 않다'
      answer: 2
      explanation: |
        옛 policy 가 0.01 로 고르던 action 을 새 policy 가 0.5 로 고르면 ratio 가 50 이라 그 sample 하나가 50 개 몫이 된다. 그런데 옛 데이터에는
        그 action 이 100 번에 1 번꼴로만 들어 있어 그 하나가 운 좋게 좋았는지 나빴는지가 평균을 좌우한다. 그래서 ratio 로 고친 계산은 새
        policy 가 옛 policy 에서 많이 멀어지지 않았을 때만 믿을 만하다.

- topic: surrogate
  title: surrogate objective 와 제한의 필요
  variants:
    - question: |
        surrogate objective $L(\theta) = \frac{1}{n}\sum_t r_t(\theta)\hat A_t$ 를 고치기 시작하는 지점 $\theta = \theta_\text{old}$ 에서 본
        성질로 맞는 것은?
      choices:
        - 'gradient 가 언제나 0 이라 첫 걸음은 움직이지 않는다'
        - 'gradient 가 앞 강의의 policy gradient(advantage × log-probability gradient)와 같은 방향이다'
        - 'policy gradient 와 반대 방향이다'
        - 'advantage 와 상관없는 방향이다'
      answer: 1
      explanation: |
        ratio 의 분모 $\pi_{\theta_\text{old}}$ 는 고정된 수라서, $\theta = \theta_\text{old}$ 에서 ratio 의 gradient 는
        $\nabla_\theta \pi_\theta / \pi_\theta = \nabla_\theta \ln \pi_\theta$ 가 된다. 그래서 첫 걸음은 actor-critic 의 update 와 똑같고, 그다음
        걸음부터는 ratio 가 옛 데이터의 비율을 새 policy 에 맞게 고쳐 준다. advantage 가 곱해져 있으니 방향은 advantage 에 따라 정해진다.
    - question: |
        제한 없는 surrogate objective 를 같은 batch 로 여러 epoch 계속 키우면 어떤 일이 생기는가?
      choices:
        - 'advantage 가 양수인 action 의 ratio 는 끝없이 커지고 음수인 action 의 ratio 는 0 쪽으로 끝없이 줄어, policy 가 옛 policy 에서 멀리 밀려난다'
        - 'epoch 를 늘릴수록 ratio 가 1 로 돌아온다'
        - '몇 epoch 뒤에는 surrogate 가 더 커지지 않아 저절로 멈춘다'
        - 'policy 는 그대로이고 critic 만 바뀐다'
      answer: 0
      explanation: |
        surrogate 의 항 $r_t(\theta)\hat A_t$ 는 advantage 가 양수면 ratio 를 키울수록, 음수면 줄일수록 커지므로 저절로 멈추지 않는다. 그 사이
        ratio 가 1 에서 멀어져 importance sampling 을 믿을 수 없게 되고, 옛 policy 로 계산해 둔 advantage 도 맞지 않게 된다. 그래서 같은
        데이터로 여러 번 고치려면 policy 가 옛 policy 에서 너무 멀어지지 않게 막는 장치가 필요하다.
    - question: |
        TRPO 와 PPO 가 새 policy 를 옛 policy 가까이에 두는 방법을 비교한 것으로 맞는 것은?
      choices:
        - 'TRPO 는 ratio 를 자르고, PPO 는 KL divergence 에 조건을 건다'
        - '둘 다 learning rate 를 아주 작게 하는 방법이다'
        - '둘 다 policy 가 옛 policy 에서 멀어지는 것을 전혀 막지 않는다'
        - 'TRPO 는 옛 policy 와 새 policy 의 KL divergence 가 작은 값을 넘지 않게 조건을 걸어 계산이 무겁고, PPO 는 ratio 를 직접 잘라 보통의 gradient ascent 로 비슷한 효과를 낸다'
      answer: 3
      explanation: |
        KL divergence 는 두 확률분포가 얼마나 다른지 재는 값으로, 같으면 0 이고 다를수록 커진다. TRPO 는 이 값에 조건을 걸고 surrogate 를
        키웠지만, 조건을 지키는 방향을 찾는 계산이 무겁고 복잡했다. PPO 는 ratio 를 $[1 - \epsilon, 1 + \epsilon]$ 로 잘라 같은 목적을 간단히
        이룬다. TRPO 가 ratio 를 자른다는 설명은 둘의 방법을 뒤바꾼 것이다.

- topic: clip-term
  title: clip 과 두 항 가운데 작은 값
  variants:
    - question: |
        PPO 가 ratio 를 $[0.8, 1.2]$ 로 자른 항 $\operatorname{clip}(r, 0.8, 1.2)\,\hat A$ 에서, ratio 가 1.3 에서 1.4 로 바뀌면 이 항은 어떻게
        되는가?
      choices:
        - '잘린 ratio 가 1.2 그대로라 항의 값이 변하지 않고, 이 항 쪽으로는 gradient 가 0 이다'
        - 'ratio 를 따라 커진다'
        - '0.8 로 바뀐다'
        - 'ratio 가 다시 1 로 되돌려진다'
      answer: 0
      explanation: |
        clip 은 범위 밖의 값을 가까운 경계로 옮기므로 1.3 도 1.4 도 1.2 가 된다. 그래서 범위 밖에서는 $\theta$ 를 바꿔도 잘린 항의 값이
        변하지 않아 변화 비율, 곧 gradient 가 0 이다. clip 은 계산에 쓰는 값을 자를 뿐 policy 의 실제 ratio 를 1 로 되돌리지는 않는다.
    - question: |
        PPO 의 목표는 sample 마다 "자르지 않은 항 $r\hat A$" 와 "자른 항 $\operatorname{clip}(r)\hat A$" 가운데 작은 값을 고른다. 작은 값을
        고르는 이유로 맞는 것은?
      choices:
        - '계산을 빠르게 하려고'
        - '언제나 큰 값을 고르면 policy 가 멈추기 때문이다'
        - 'advantage 의 부호를 바꾸려고'
        - '더 비관적인 값을 골라, 좋아 보이는 쪽으로는 경계까지만 믿고 나빠지는 쪽은 그대로 반영하려는 것이다'
      answer: 3
      explanation: |
        두 항 가운데 작은 값은 목표를 덜 낙관적으로 본 값이다. advantage 가 가리키는 방향으로 이미 경계를 넘었으면 자른 항이 작아 더
        밀지 않고, 반대 방향으로 잘못 간 경우에는 자르지 않은 항이 작아 되돌리는 gradient 가 그대로 흐른다. 계산 속도나 advantage 의 부호와는
        상관없다.
    - question: |
        "PPO 의 clip 은 ratio 를 늘 0.8 과 1.2 사이에 가둔다" 는 생각에 대해 맞는 것은?
      choices:
        - '맞다. update 가 끝나면 ratio 를 경계 안으로 되돌린다'
        - '틀리다. 한 번의 update 가 크면 ratio 가 경계를 넘어갈 수 있고, clip 은 그다음부터 그 방향으로 더 밀지 않을 뿐이다'
        - '맞다. ratio 가 경계에 닿는 순간 학습 전체가 멈춘다'
        - '틀리다. clip 은 ratio 와 상관없이 advantage 를 자른다'
      answer: 1
      explanation: |
        clip 은 범위 밖에서 그 방향의 gradient 를 0 으로 만들 뿐 ratio 자체를 되돌리는 장치가 아니다. gradient step 하나가 크면 ratio 가 1.2 를
        넘어 1.3 이 될 수도 있고, 그 뒤로 그 sample 이 policy 를 더 밀지 않는다. 다른 sample 들은 계속 학습에 쓰이므로 학습 전체가 멈추지도
        않는다. 잘리는 것은 advantage 가 아니라 ratio 다.

- topic: clip-cases
  title: ratio 와 advantage 조합별 clip 의 동작
  variants:
    - question: |
        PPO ($\epsilon = 0.2$)에서 advantage 가 양수인 sample 의 ratio 가 1.3 이 되었다. 이 sample 은 policy 를 어떻게 움직이는가?
      choices:
        - '그 action 의 확률을 계속 올린다'
        - '그 action 의 확률을 내린다'
        - 'gradient 가 0 이라 더 움직이지 않는다. 좋은 action 의 확률을 이미 1.2 배 넘게 올렸기 때문이다'
        - 'ratio 를 1 로 되돌린다'
      answer: 2
      explanation: |
        advantage 가 양수면 surrogate 는 ratio 를 키우려 하는데, 이미 1.2 를 넘었으므로 자른 항 $1.2\hat A$ 가 작은 값으로 골라지고 gradient 가
        0 이 된다. 이번 데이터로는 좋은 action 의 확률을 20% 넘게 올리지 않는다는 뜻이다. 확률을 내리거나 ratio 를 되돌리는 힘은 생기지 않는다.
    - question: |
        PPO ($\epsilon = 0.2$)에서 advantage 가 음수인 sample 의 ratio 가 오히려 1.3 으로 올라갔다. 이 sample 은 policy 를 어떻게 움직이는가?
      choices:
        - 'gradient 가 0 이라 움직이지 않는다'
        - '그 action 의 확률을 더 올린다'
        - 'ratio 가 범위 밖이므로 sample 을 버린다'
        - '자르지 않은 항이 작은 값으로 골라져 gradient 가 그대로 흐르고, 나쁜 action 의 확률을 다시 내린다'
      answer: 3
      explanation: |
        나쁜 action 인데 확률이 1.3 배로 올라간 것은 update 가 잘못된 방향으로 간 경우다. advantage 가 음수일 때 $1.3\hat A$ 는 $1.2\hat A$ 보다
        작으므로 자르지 않은 항이 골라지고, 그 gradient 가 확률을 다시 내린다. clip 은 반대쪽으로 잘못 간 update 를 되돌리는 gradient 는
        막지 않는다.
    - question: |
        PPO 의 clipped surrogate 에서 sample 의 gradient 가 0 이 되는 경우만 바르게 고른 것은?
      choices:
        - 'advantage 가 가리키는 방향으로 이미 경계를 넘은 경우, 곧 advantage 가 양수이고 ratio 가 1.2 보다 크거나, advantage 가 음수이고 ratio 가 0.8 보다 작은 경우'
        - 'ratio 가 $[0.8, 1.2]$ 밖에 있는 모든 경우'
        - 'ratio 가 정확히 1 인 경우'
        - 'advantage 가 음수인 모든 경우'
      answer: 0
      explanation: |
        멈추는 칸은 "이미 원하는 쪽으로 20% 넘게 간" 두 경우뿐이다. ratio 가 범위 밖이어도 반대 방향으로 벗어났다면 되돌리는 gradient 가
        흐르므로, 범위 밖이라고 모두 멈추는 것은 아니다. ratio 가 1 이면 범위 안이라 gradient 가 그대로 흐르고, advantage 가 음수라는 것만으로
        멈추지도 않는다.

- topic: gae
  title: TD error 와 GAE 계산
  variants:
    - question: |
        TD error $\delta_t = r_{t+1} + \gamma V(s_{t+1}) - V(s_t)$ 를 두 step 이어서 $\delta_0 + \gamma\,\delta_1$ 로 더하면 무엇이 되는가?
      choices:
        - '아무 뜻이 없는 값이다'
        - '중간의 $V(s_1)$ 이 서로 지워져, reward 두 개를 쓰고 그 뒤를 $V(s_2)$ 로 채운 advantage 가 된다'
        - 'episode 전체의 return 이 된다'
        - '$V(s_0)$ 의 두 배가 된다'
      answer: 1
      explanation: |
        $\delta_0$ 에는 $+\gamma V(s_1)$ 이, $\gamma\,\delta_1$ 에는 $-\gamma V(s_1)$ 이 들어 있어 더하면 지워진다. 남는 것은
        $r_1 + \gamma r_2 + \gamma^2 V(s_2) - V(s_0)$ 로, reward 두 개를 실제로 쓰고 그 뒤는 critic 의 예측으로 채운 advantage 다. 같은 방식으로
        TD error 를 끝까지 더하면 episode 끝까지의 return 에서 $V(s_0)$ 을 뺀 값이 된다.
    - question: |
        GAE 를 마지막 step 부터 거꾸로 $\hat A_t = \delta_t + \gamma\lambda\,\hat A_{t+1}$ 로 계산하는 이유로 맞는 것은?
      choices:
        - '앞 step 부터 계산하면 다른 값이 나오기 때문이다'
        - '마지막 step 의 advantage 가 가장 중요하기 때문이다'
        - '$\hat A_t$ 는 뒤쪽 TD error 들에 $\gamma\lambda$ 를 거듭 곱해 더한 값이라, 다음 step 의 advantage 를 재사용하면 한 번 훑는 것으로 모든 step 을 계산할 수 있기 때문이다'
        - 'critic 이 뒤에서부터만 예측할 수 있기 때문이다'
      answer: 2
      explanation: |
        $\hat A_t = \delta_t + \gamma\lambda\,\delta_{t+1} + (\gamma\lambda)^2\delta_{t+2} + \cdots$ 에서 첫 항을 빼고 나머지를 $\gamma\lambda$ 로
        묶으면 그것이 $\hat A_{t+1}$ 이다. 그래서 뒤에서부터 계산하면 같은 덧셈을 되풀이하지 않는다. step 마다 합을 따로 계산해도 결과는
        같으며, 계산 순서는 효율의 문제다.
    - question: |
        정해진 step 수만큼 모은 rollout 의 한가운데에서 episode 가 끝나고 새 episode 가 시작되었다. 끝난 step 의 GAE 계산으로 맞는 것은?
      choices:
        - '그 step 에서 다음 state 의 value 를 0 으로 두고, 다음 step 의 advantage 도 더하지 않는다'
        - '새 episode 의 결과도 이어서 그대로 더한다'
        - '다음 state 의 value 를 critic 의 예측으로 채운다'
        - '그 step 은 advantage 를 계산하지 않고 버린다'
      answer: 0
      explanation: |
        episode 가 끝난 뒤에는 받을 reward 가 없으므로 다음 state 의 value 를 0 으로 둔다. 새 episode 의 결과는 앞 episode 의 action 과 상관없어
        $\hat A_{t+1}$ 도 더하지 않는다. 다음 state 를 critic 의 예측으로 채우는 bootstrap 은 episode 가 끝나지 않았는데 rollout 의 step 수가
        다 차서 끊긴 경우에 쓴다. 그래서 rollout 에 episode 가 끝났다는 표시를 함께 적어 둔다.

- topic: gae-lambda
  title: λ 와 bias·variance
  variants:
    - question: |
        GAE 의 $\lambda$ 를 0 과 1 로 두었을 때의 성질로 맞는 것은?
      choices:
        - '$\lambda = 0$ 이면 끝까지의 return 을 쓰고, $\lambda = 1$ 이면 TD error 하나만 쓴다'
        - '$\lambda$ 는 결과에 영향이 없다'
        - '$\lambda = 0$ 이면 TD error 하나만 써 critic 에 그대로 기대므로 bias 가 크고, $\lambda = 1$ 이면 끝까지 받은 reward 를 모두 더해 variance 가 크다'
        - '$\lambda = 0$ 과 $\lambda = 1$ 은 둘 다 bias 와 variance 가 모두 작다'
      answer: 2
      explanation: |
        $\lambda = 0$ 이면 $\hat A_t = \delta_t$ 로 actor-critic 과 같아, critic 의 예측이 틀린 만큼 advantage 가 치우친다. $\lambda = 1$ 이면 모든
        TD error 를 그대로 더해 $G_t - V(s_t)$ 가 되므로 critic 의 중간 예측은 지워지지만 그 사이 모든 step 의 운이 섞인다. $\lambda = 0$ 이 끝까지의
        return 을 쓴다는 설명은 둘을 거꾸로 적은 것이다.
    - question: |
        critic 이 episode 중간의 어떤 state 의 value 를 크게 틀리게 예측하고 있다. 이 틀린 값이 step 0 의 advantage 에 미치는 영향이
        사라지는 $\lambda$ 는?
      choices:
        - '$\lambda = 0$'
        - '$\lambda = 0.5$'
        - '어떤 $\lambda$ 에서도 영향은 같다'
        - '$\lambda = 1$'
      answer: 3
      explanation: |
        $\lambda = 1$ 이면 TD error 를 모두 그대로 더해 중간 state 의 value 가 앞뒤 항에서 서로 지워지고, 실제로 받은 reward 의 합만 남는다.
        $\lambda = 0$ 은 다음 state 의 예측 하나에 그대로 기대므로 그 예측이 틀리면 가장 크게 어긋나고, $\lambda = 0.5$ 는 그 중간이다. 대신
        $\lambda = 1$ 은 variance 가 큰 값을 받아들인다.
    - question: |
        실전에서 $\gamma = 0.99$, $\lambda = 0.95$ 처럼 $\lambda$ 를 1 보다 조금 작게 잡는 이유로 맞는 것은?
      choices:
        - '$\lambda$ 를 1 보다 작게 하면 critic 이 필요 없어지기 때문이다'
        - '수십 step 뒤까지의 결과는 반영하되 아주 먼 뒤의 운은 줄여서, bias 와 variance 사이의 균형을 잡으려는 것이다'
        - '$\lambda$ 가 1 이면 계산이 불가능하기 때문이다'
        - 'advantage 를 모두 양수로 만들기 위해서다'
      answer: 1
      explanation: |
        $\gamma\lambda = 0.9405$ 라서 10 step 뒤의 TD error 는 절반 정도, 50 step 뒤는 5% 정도의 몫을 받는다. 그래서 가까운 미래의 실제 결과는
        충분히 반영하면서 먼 미래의 운이 섞이는 것은 줄인다. critic 은 여전히 TD error 계산에 필요하고, $\lambda = 1$ 도 계산할 수 있으며,
        advantage 의 부호와는 상관없다.

- topic: ppo-iteration
  title: PPO 의 한 iteration
  variants:
    - question: |
        PPO 의 한 iteration 순서로 맞는 것은?
      choices:
        - '데이터를 버린다 → GAE 계산 → rollout 수집 → mini-batch 학습'
        - '지금 policy 로 rollout 수집 → GAE 로 advantage 와 critic 의 정답 계산 → 섞어서 mini-batch 로 여러 epoch 학습 → 데이터 버리기'
        - 'mini-batch 학습 → rollout 수집 → GAE 계산 → 데이터를 buffer 에 영원히 쌓기'
        - 'rollout 수집 → 한 번 학습 → 다음 rollout 수집 → GAE 계산'
      answer: 1
      explanation: |
        PPO 는 지금 policy 로 여러 environment 를 정해진 step 수만큼 움직여 데이터를 모으고, 마지막 state 의 예측까지 써서 GAE 를 계산한다.
        그 데이터를 섞어 mini-batch 로 나눠 여러 epoch 고친 뒤 버리고, 고친 policy 를 새 옛 policy 로 삼아 다시 모은다. GAE 는 학습 전에
        계산해 두어야 하고, 데이터를 영원히 쌓는 것은 off-policy 방법의 replay buffer 다.
    - question: |
        PPO 는 같은 데이터로 여러 epoch 고치는데도 on-policy 방법으로 분류된다. 그 이유로 맞는 것은?
      choices:
        - '데이터를 그 데이터를 모은 iteration 안에서만 다시 쓰고, 그동안 clip 이 새 policy 를 옛 policy 가까이에 붙잡아 두며, iteration 이 끝나면 버리기 때문이다'
        - 'PPO 는 데이터를 한 번만 쓰기 때문이다'
        - 'PPO 는 replay buffer 에 모든 데이터를 쌓아 두기 때문이다'
        - 'PPO 에는 critic 이 없기 때문이다'
      answer: 0
      explanation: |
        on-policy 는 지금 policy 로 모은 데이터로 학습하는 방법이다. PPO 는 여러 epoch 를 돌지만 같은 iteration 안의 데이터만 쓰고, clip 으로
        새 policy 가 데이터를 모은 policy 에서 멀어지지 않게 한다. 아주 오래전 policy 의 데이터까지 쌓아 두고 계속 쓰는 것이 off-policy
        방법이다. PPO 에도 critic 이 있다.
    - question: |
        PPO 의 전체 loss $\mathcal L = -L^{\text{CLIP}} + c_v L^{\text{VF}} - c_e \mathcal H$ 에서 entropy $\mathcal H$ 항을 넣는 이유로 맞는 것은?
      choices:
        - 'critic 의 예측 오차를 줄이기 위해서다'
        - 'ratio 를 $[0.8, 1.2]$ 로 자르기 위해서다'
        - 'policy 가 너무 빨리 한 action 으로 쏠리지 않게 해, 여러 action 을 계속 해 보는 exploration 이 일찍 사라지지 않게 하려는 것이다'
        - 'reward 를 키우기 위해서다'
      answer: 2
      explanation: |
        entropy 는 확률분포가 얼마나 고르게 퍼져 있는지 재는 값이라, loss 에서 빼면 entropy 가 큰 쪽, 곧 여러 action 을 섞는 쪽으로 policy 가
        약간 끌린다. critic 의 오차는 value loss $L^{\text{VF}}$ 가, ratio 를 자르는 일은 $L^{\text{CLIP}}$ 이 맡는다. 계수 $c_e$ 를 작게 잡아
        reward 를 키우는 목표를 방해하지 않을 만큼만 넣는다.
