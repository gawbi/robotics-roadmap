# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: big-step
  title: 한 번에 크게 바꾼 update
  section: 한-번에-크게-바꾼-update
  variants:
    - question: |
        reinforcement learning 에서 policy 를 한 번에 크게 바꾸는 것이 supervised learning 에서 모델을 크게 바꾸는 것보다 더 위험한 이유는 무엇인가?
      choices:
        - 'reinforcement learning 은 gradient 를 쓰지 않고 reward 만 보고 policy 를 바꿔서, 한 번 틀리면 되돌릴 방법이 없기 때문이다'
        - 'reinforcement learning 의 데이터에는 늘 정답 action 이 붙어 있어서, policy 를 크게 바꾸면 그 정답과 어긋나기 때문이다'
        - 'policy 가 자기 데이터를 직접 모으므로, 좋은 action 을 거의 고르지 않게 된 policy 는 회복할 데이터를 모으지 못하기 때문이다'
        - 'supervised learning 에는 learning rate 가 없어서, 모델이 한 번에 크게 바뀌는 일이 처음부터 생기지 않기 때문이다'
      answer: 2
      explanation: |
        supervised learning 은 모델이 아무리 틀려도 학습 데이터가 그대로라서 다시 배울 수 있지만, reinforcement learning 은 망가진 policy 가 다음
        데이터를 직접 모으므로 좋은 action 의 sample 이 거의 들어오지 않고 정확한 gradient 도 아주 작아진다.
        reinforcement learning 도 policy gradient 처럼 gradient 로 policy 를 고친다.
        정답 action 이 붙은 데이터로 배우는 것은 supervised learning 쪽이고, reinforcement learning 은 reward 로 배운다.
        supervised learning 에도 learning rate 가 있고, 너무 크면 학습이 발산할 수 있다.
    - question: |
        더 좋은 action 을 골랐는데 운이 나빠 평균보다 낮은 reward 를 받은 sample 하나로, 아주 큰 learning rate 를 써서 policy 를 한 번 update 하면 어떤 일이 생길 수 있는가?
      choices:
        - '운이 나쁜 결과라도 더 좋은 action 을 고른 sample 이라서, 그 action 의 확률이 크게 올라간다'
        - 'learning rate 가 커서 sample 하나의 운이 지워지고, policy 가 단번에 기댓값에 맞는 쪽으로 간다'
        - 'advantage 가 음수인 sample 은 update 에 쓰지 않으므로, learning rate 와 상관없이 policy 가 바뀌지 않는다'
        - 'advantage 가 음수라 그 action 의 확률을 내리는데, step 이 아주 크면 더 좋은 action 을 거의 버리게 될 수 있다'
      answer: 3
      explanation: |
        이 sample 의 advantage 는 음수라서 update 는 그 action 의 확률을 내리는 방향이고, learning rate 가 아주 크면 sample 하나의 운이 policy 를
        통째로 바꿔 좋은 action 을 버리게 만든다.
        advantage 가 음수인 sample 은 확률을 내리는 쪽으로 작용하므로 그 action 의 확률이 올라가지 않는다.
        learning rate 는 한 sample 의 영향을 키울 뿐이고, 운을 지우는 것은 여러 sample 의 평균이다.
        advantage 가 음수인 sample 도 그 action 의 확률을 내리는 gradient 를 주므로 update 에 쓰인다.
    - question: |
        learning rate 만 충분히 작게 잡으면 policy 가 한 번에 크게 바뀌는 일은 없다고 봐도 될까?
      choices:
        - '그렇다. parameter 의 변화가 작으면 모든 action 의 확률도 늘 같은 비율로 작게 바뀐다'
        - '아니다. 같은 parameter 변화라도 출발한 값에 따라 어떤 action 의 확률은 훨씬 큰 배수로 바뀔 수 있다'
        - '그렇다. learning rate 가 충분히 작으면 policy 는 한 번의 update 로 전혀 바뀌지 않는다'
        - '아니다. learning rate 를 줄이면 gradient 가 그만큼 커져서, 오히려 한 번의 update 가 더 커진다'
      answer: 1
      explanation: |
        softmax policy 에서 parameter 를 같은 양만큼 옮겨도 이미 한쪽으로 쏠린 경우에는 작은 확률을 가진 action 의 확률이 훨씬 큰 배수로 바뀌므로,
        policy 의 변화는 action 마다 확률이 몇 배가 되었는지로 재야 한다.
        parameter 변화와 확률 변화의 비율은 출발한 값마다 달라서 늘 같은 비율로 작아지지 않는다.
        learning rate 가 작아도 0 이 아니면 policy 는 조금씩 바뀐다.
        learning rate 를 줄이면 한 번의 update 도 작아진다.

- topic: ratio
  title: probability ratio 와 importance sampling
  section: probability-ratio
  variants:
    - question: |
        PPO 의 probability ratio $r_t(\theta) = \pi_\theta(a_t \mid s_t) / \pi_{\theta_\text{old}}(a_t \mid s_t)$ 는 무엇을 나타내는가?
      choices:
        - 'action $a_t$ 를 한 뒤 받은 reward 를 옛 policy 가 받은 reward 로 나눈 값이라서, 1 보다 크면 나아진 것이다'
        - '같은 state 에서 고른 action 의 확률을 다른 action 의 확률로 나눈 값이라서, 어느 action 이 더 유력한지 나타낸다'
        - '데이터를 모은 직후에 가장 크고 policy 를 고칠수록 1 에 다가가는 값이라서, 학습이 얼마나 남았는지 나타낸다'
        - '지금 policy 가 그 action 을 고를 확률이 옛 policy 의 몇 배인지이고, 고치기 시작할 때는 1 이다'
      answer: 3
      explanation: |
        ratio 는 같은 action 을 새 policy 가 고를 확률을 옛 policy 가 고를 확률로 나눈 값이라 1 보다 크면 그 action 을 더 자주, 작으면 덜 자주 고르게 된 것이고,
        고치기 시작할 때는 $\theta = \theta_\text{old}$ 라서 정확히 1 이다.
        글자 $r$ 이 reward 와 같을 뿐 ratio 는 reward 를 쓰지 않는다.
        ratio 는 서로 다른 action 이 아니라 같은 action 의 두 policy 확률을 나눈다.
        ratio 는 고치기 시작할 때 1 이고, 고칠수록 1 에서 멀어진다.
    - question: |
        옛 policy 는 거의 고르지 않던 action 을 지금 policy 는 더 자주 고른다. 옛 데이터로 지금 policy 의 평균을 계산할 때 그 action 의 sample 은 어떻게 세는가?
      choices:
        - 'ratio 가 1 보다 크므로 그 sample 을 1 개보다 많은 몫으로 센다'
        - '옛 policy 로 모은 sample 은 지금 policy 와 맞지 않으므로 평균에서 빼고 버린다'
        - '어떤 policy 로 모았든 sample 은 실제로 일어난 일이라서 늘 1 개 몫으로 센다'
        - 'ratio 로 나누어 세므로, ratio 가 1 보다 큰 그 sample 은 1 개보다 적은 몫이 된다'
      answer: 0
      explanation: |
        옛 데이터에는 그 action 이 지금 policy 에서보다 적게 들어 있으므로 sample 마다 ratio 를 곱해 모자란 만큼 크게 세는데, 이 방법이
        importance sampling 이다.
        옛 데이터를 버리면 같은 데이터를 여러 번 쓸 수 없고, ratio 를 곱하면 옛 데이터로도 계산할 수 있다.
        늘 1 개 몫으로 세면 옛 policy 의 비율로 평균하게 되어 지금 policy 의 평균과 달라진다.
        ratio 가 1 보다 큰 sample 은 곱하면 몫이 커지고, 몫이 작아지는 것은 ratio 가 1 보다 작은 sample 이다.
    - question: |
        importance sampling 으로 옛 데이터를 다시 쓸 때, ratio 가 1 에서 아주 멀어지면 왜 문제가 되는가?
      choices:
        - 'ratio 가 1 에서 멀면 분모가 0 에 가까워져 나눗셈을 할 수 없고, 계산이 멈추기 때문이다'
        - 'ratio 가 크면 그 action 의 reward 에도 ratio 가 곱해져서, environment 가 주는 reward 자체가 커지기 때문이다'
        - '드물게 들어 있던 sample 하나가 아주 큰 몫으로 세어져, 그 sample 의 운에 따라 평균이 크게 흔들리기 때문이다'
        - 'ratio 가 1 에서 멀수록 옛 데이터를 더 크게 고쳐 세므로, 평균이 오히려 정확해져 문제가 되지 않는다'
      answer: 2
      explanation: |
        옛 policy 가 0.01 로 고르던 action 을 새 policy 가 0.5 로 고르면 ratio 가 50 이라 100 번에 1 번꼴로 들어 있던 sample 하나가 50 개 몫이 되고,
        그 하나가 좋았는지 나빴는지가 평균을 좌우한다.
        옛 확률이 0 이 아니면 나눗셈은 늘 할 수 있으므로 계산이 멈추지는 않는다.
        ratio 는 학습 계산에 쓰는 값이라 environment 가 주는 reward 를 바꾸지 않는다.
        ratio 가 1 에서 멀수록 몇몇 sample 에 무게가 몰려 평균이 오히려 불안정해진다.

- topic: clip-term
  title: clipped surrogate 와 TRPO
  section: clipped-surrogate
  variants:
    - question: |
        PPO 의 clipped surrogate 는 sample 마다 자르지 않은 항 $r\hat A$ 와 자른 항 $\operatorname{clip}(r, 1-\epsilon, 1+\epsilon)\hat A$ 가운데 작은 값을 고른다. 작은 값을 고르는 이유는 무엇인가?
      choices:
        - '더 비관적인 값을 골라, 좋아지는 쪽으로는 경계까지만 믿고 나빠지는 쪽은 그대로 반영하려는 것이다'
        - '두 항 가운데 작은 값을 고르면 하나만 미분하면 되므로, 계산이 빨라지기 때문이다'
        - '작은 값을 고르면 advantage 의 부호가 늘 양수가 되어, 확률을 올리는 방향으로만 고치기 때문이다'
        - '큰 값을 고르면 모든 sample 의 gradient 가 0 이 되어, policy 가 전혀 바뀌지 않기 때문이다'
      answer: 0
      explanation: |
        advantage 가 가리키는 방향으로 이미 경계를 넘었으면 자른 항이 작아 더 밀지 않고, 반대 방향으로 잘못 갔으면 자르지 않은 항이 작아 되돌리는
        gradient 가 그대로 흐르므로 min 은 늘 덜 낙관적인 쪽을 고른다.
        두 항을 모두 계산한 뒤 고르므로 작은 값을 고른다고 계산이 빨라지지 않는다.
        min 은 값을 고를 뿐 advantage 의 부호를 바꾸지 않는다.
        큰 값을 고르면 경계를 넘은 쪽으로 계속 밀 수 있어 policy 가 멀어지며, gradient 가 모두 0 이 되지도 않는다.
    - question: |
        TRPO 와 PPO 는 둘 다 새 policy 를 옛 policy 가까이에 두려고 한다. 두 방법의 차이는 무엇인가?
      choices:
        - 'TRPO 는 ratio 를 잘라 보통의 gradient 계산만 쓰고, PPO 는 두 policy 의 KL divergence 에 조건을 걸어 계산이 무겁다'
        - '둘 다 learning rate 를 아주 작게 고정해 policy 를 천천히 바꾸는 방법이라서, 이름만 다르고 차이가 없다'
        - 'TRPO 는 critic 을 쓰지 않고, PPO 는 actor 는 그대로 두고 critic 만 고친다는 점이 다르다'
        - 'TRPO 는 KL divergence 에 조건을 걸어 계산이 무겁고, PPO 는 ratio 를 잘라 보통의 gradient 계산만으로 비슷한 효과를 낸다'
      answer: 3
      explanation: |
        TRPO 는 KL divergence 조건(논문에서 0.01)을 지키는 방향을 찾느라 gradient 가 parameter 에 따라 어떻게 바뀌는지까지 계산해야 했고, PPO 는
        ratio 를 $[1-\epsilon, 1+\epsilon]$ 로 잘라 같은 목적을 보통의 gradient 계산만으로 이룬다.
        ratio 를 자르는 쪽이 PPO 이고 KL 에 조건을 거는 쪽이 TRPO 라서 이 설명은 둘을 뒤바꾼 것이다.
        두 방법 모두 learning rate 가 아니라 policy 의 변화 자체를 제한한다.
        두 방법 모두 actor 인 policy 를 고치는 알고리즘이고, critic 의 사용 여부로 나뉘지 않는다.
    - question: |
        PPO 의 clip 은 ratio 를 늘 $[0.8, 1.2]$ 안에 가두는가?
      choices:
        - '그렇다. 매 update 가 끝나면 경계를 넘은 ratio 를 경계 안으로 되돌리는 계산을 한다'
        - '아니다. update 가 크면 ratio 가 경계를 넘을 수 있고, clip 은 그 방향으로 더 밀지 않을 뿐이다'
        - '그렇다. ratio 가 경계에 닿는 순간 그 iteration 의 학습 전체를 멈추고 새 rollout 을 모은다'
        - '아니다. clip 은 ratio 가 아니라 advantage 를 $[0.8, 1.2]$ 로 잘라 update 크기를 줄인다'
      answer: 1
      explanation: |
        clip 은 범위 밖에서 그 방향의 gradient 를 0 으로 만들 뿐 ratio 를 되돌리는 장치가 아니어서, gradient step 하나가 크면 ratio 가 1.2 를 넘어
        1.3 이 될 수 있다.
        ratio 를 되돌리는 계산은 PPO 에 없고, 범위 밖 sample 의 gradient 만 0 이 된다.
        경계를 넘은 sample 만 멈추고 다른 sample 들은 계속 학습에 쓰이므로 학습 전체가 멈추지 않는다.
        잘리는 값은 advantage 가 아니라 ratio 다.

- topic: clip-cases
  title: advantage 부호별 clip 의 동작
  section: clipped-surrogate
  variants:
    - question: |
        PPO($\epsilon = 0.2$)에서 advantage 가 양수인 sample 의 ratio 가 1.3 이 되었다. 이 sample 은 policy 를 어떻게 움직이는가?
      choices:
        - '좋은 action 이므로 ratio 와 상관없이 그 action 의 확률을 계속 올린다'
        - 'ratio 가 범위 밖으로 나갔으므로 그 action 의 확률을 내려 범위 안으로 되돌린다'
        - 'gradient 가 0 이라 더 움직이지 않는다. 이미 확률을 1.2 배 넘게 올렸기 때문이다'
        - '자른 항 $1.2\hat A$ 가 골라지는데, 이 항도 ratio 를 키우는 gradient 를 내서 확률을 더 올린다'
      answer: 2
      explanation: |
        advantage 가 양수면 surrogate 는 ratio 를 키우려 하는데 이미 1.2 를 넘었으므로 자른 항 $1.2\hat A$ 가 작은 값으로 골라지고, 그 항은 $\theta$
        를 바꿔도 변하지 않아 gradient 가 0 이다.
        확률을 계속 올리는 것은 ratio 가 1.2 보다 작을 때까지만이다.
        자른 항은 값이 변하지 않으므로 확률을 내리는 gradient 도 만들지 않는다.
        자른 항 $1.2\hat A$ 는 $\theta$ 를 바꿔도 값이 그대로라서 확률을 더 올리는 gradient 를 내지 않는다.
    - question: |
        PPO($\epsilon = 0.2$)에서 advantage 가 음수인 sample 의 ratio 가 오히려 1.3 으로 올라갔다. 이 sample 은 어떻게 처리되는가?
      choices:
        - 'ratio 가 범위 밖이므로 gradient 가 0 이라, 나쁜 action 이라도 더 움직이지 않는다'
        - '나쁜 action 이지만 ratio 가 커졌다는 것은 policy 가 그 action 을 원한다는 뜻이라 확률을 더 올린다'
        - 'ratio 가 범위 밖인 sample 은 믿을 수 없으므로, 그 iteration 의 batch 에서 빼고 버린다'
        - '자르지 않은 항 $1.3\hat A$ 가 더 작아 골라지고, gradient 가 흘러 확률을 다시 내린다'
      answer: 3
      explanation: |
        나쁜 action 의 확률이 1.3 배로 올라간 것은 update 가 잘못된 방향으로 간 경우이고, advantage 가 음수일 때 $1.3\hat A$ 는 $1.2\hat A$ 보다 작아
        자르지 않은 항이 골라지므로 되돌리는 gradient 가 살아 있다.
        범위 밖이라도 반대 방향으로 벗어난 경우에는 gradient 가 0 이 되지 않는다.
        advantage 가 음수인 sample 의 gradient 는 그 action 의 확률을 내리는 방향이다.
        PPO 는 ratio 가 범위 밖이라는 이유로 sample 을 버리지 않는다.
    - question: |
        PPO 의 clipped surrogate 에서 sample 의 gradient 가 0 이 되는 경우는 정확히 언제인가?
      choices:
        - 'advantage 가 양수일 때 ratio 가 $1 + \epsilon$ 을 넘은 경우와, 음수일 때 ratio 가 $1 - \epsilon$ 아래로 내려간 경우다'
        - 'advantage 의 부호와 상관없이 ratio 가 $[1 - \epsilon, 1 + \epsilon]$ 밖으로 나간 모든 경우로, 어느 쪽으로 벗어났는지는 상관없다'
        - 'ratio 가 정확히 1 인 경우다. 이때는 두 policy 가 같아서 고칠 것이 없기 때문이다'
        - 'advantage 가 음수인 모든 경우다. clip 은 나쁜 action 의 확률을 내리지 못하게 막기 때문이다'
      answer: 0
      explanation: |
        멈추는 경우는 이미 원하는 쪽으로 $\epsilon$ 넘게 간 두 경우뿐이다.
        ratio 가 범위 밖이어도 반대 방향으로 벗어났다면 되돌리는 gradient 가 흐르므로 범위 밖이라고 모두 멈추지는 않는다.
        ratio 가 1 이면 범위 안이라 두 항이 같고 gradient 가 그대로 흐른다.
        advantage 가 음수인 sample 도 ratio 가 $1 - \epsilon$ 아래로 내려가기 전까지는 확률을 내리는 gradient 를 준다.

- topic: gae
  title: GAE 와 λ
  section: gae
  variants:
    - question: |
        GAE 의 $\lambda$ 를 0 과 1 로 두면 advantage 추정은 각각 어떻게 되는가?
      choices:
        - '$\lambda = 0$ 이면 episode 끝까지의 return 을 써서 variance 가 크고, $\lambda = 1$ 이면 TD error 하나만 써서 bias 가 크다'
        - '$\lambda = 0$ 이면 TD error 하나만 써서 bias 가 크고, $\lambda = 1$ 이면 끝까지의 reward 를 모두 더해 variance 가 크다'
        - '$\lambda$ 는 advantage 전체에 곱하는 크기라서, 0 이든 1 이든 advantage 의 크기만 바뀌고 bias 나 variance 는 같다'
        - '$\lambda = 0$ 과 $\lambda = 1$ 은 둘 다 critic 과 실제 reward 를 고르게 섞어서, bias 와 variance 가 모두 작다'
      answer: 1
      explanation: |
        $\lambda = 0$ 이면 $\hat A_t = \delta_t$ 라서 critic 의 다음 state 예측이 틀린 만큼 advantage 가 치우치고, $\lambda = 1$ 이면 TD error 를 모두
        더해 중간 예측이 지워지지만 그 사이 모든 step 의 운이 섞인다.
        끝까지의 return 을 쓰는 쪽이 $\lambda = 1$ 이라서 이 설명은 둘을 뒤바꾼 것이다.
        $\lambda$ 는 몇 step 뒤의 TD error 까지 반영할지를 정하므로 bias 와 variance 의 균형을 바꾼다.
        두 끝은 각각 bias 와 variance 가운데 하나가 커서, 둘 다 작은 설정은 없다.
    - question: |
        GAE 를 구현할 때 마지막 step 부터 거꾸로 $\hat A_t = \delta_t + \gamma\lambda\,\hat A_{t+1}$ 로 계산하는 이유는 무엇인가?
      choices:
        - '앞 step 부터 계산하면 $\gamma\lambda$ 를 곱하는 횟수가 달라져서, 다른 advantage 가 나오기 때문이다'
        - '마지막 step 의 advantage 가 episode 의 결과를 담아 가장 중요하므로, 먼저 계산해야 하기 때문이다'
        - '$\hat A_t$ 안에 다음 step 의 advantage 가 들어 있어서, 뒤에서부터 한 번 훑으면 모든 step 을 계산할 수 있기 때문이다'
        - 'critic 은 다음 state 를 봐야 지금 state 의 value 를 예측할 수 있어서, 뒤쪽 state 부터만 예측할 수 있기 때문이다'
      answer: 2
      explanation: |
        $\hat A_t = \delta_t + \gamma\lambda\,\delta_{t+1} + (\gamma\lambda)^2\delta_{t+2} + \cdots$ 에서 첫 항을 빼고 나머지를 $\gamma\lambda$ 로
        묶으면 그것이 $\hat A_{t+1}$ 이라서, 뒤에서부터 계산하면 같은 덧셈을 되풀이하지 않는다.
        step 마다 합을 따로 계산해도 결과는 같고, 계산 순서는 효율의 문제다.
        모든 step 의 advantage 가 똑같이 학습에 쓰이며 마지막 step 이 더 중요하지는 않다.
        critic 은 어느 state 든 순서와 관계없이 예측할 수 있다.
    - question: |
        PPO 에서 $\gamma = 0.99$, $\lambda = 0.95$ 처럼 $\lambda$ 를 1 보다 조금 작게 잡는 이유는 무엇인가?
      choices:
        - '수십 step 뒤까지의 실제 결과는 반영하되 아주 먼 뒤의 운은 줄여, bias 와 variance 의 균형을 잡으려는 것이다'
        - '$\lambda$ 를 1 보다 작게 하면 실제 reward 만으로 advantage 를 계산하므로, critic 이 필요 없어지기 때문이다'
        - '$\lambda$ 가 1 이면 TD error 를 끝없이 더해야 해서, 길이가 정해진 rollout 으로는 advantage 를 계산할 수 없기 때문이다'
        - '$\lambda$ 를 1 보다 작게 하면 먼 뒤의 음수 TD error 가 줄어들어, advantage 가 모두 양수가 되기 때문이다'
      answer: 0
      explanation: |
        $\gamma\lambda = 0.9405$ 이면 10 step 뒤의 TD error 는 약 0.54 배의 몫을 받고 50 step 뒤의 TD error 는 약 0.047 배를 받아서,
        가까운 미래는 충분히 반영하고 먼 미래의 운은 줄인다.
        TD error 를 계산하려면 critic 의 예측이 있어야 하므로 critic 은 여전히 필요하다.
        $\lambda = 1$ 도 계산할 수 있고, 이때는 return 에서 critic 의 예측을 뺀 값이 된다.
        $\lambda$ 는 몫을 정할 뿐 advantage 의 부호를 정하지 않는다.

- topic: bootstrap
  title: rollout 의 끝과 time-out
  section: rollout-이-중간에-끊긴-경우
  variants:
    - question: |
        PPO 의 rollout 이 episode 가 끝나지 않은 채 정해진 step 수에서 멈췄다. 마지막 step 의 advantage 는 어떻게 계산하는가?
      choices:
        - '마지막 state 다음의 value 를 critic 의 예측으로 채워(bootstrap) TD error 를 계산한다'
        - '다음 state 의 value 를 0 으로 두고, rollout 이 멈춘 자리에서 episode 가 끝난 것처럼 계산한다'
        - '다음 reward 를 아직 모르므로 마지막 step 은 advantage 를 계산할 수 없어서, batch 에서 빼고 버린다'
        - '다음 rollout 이 끝날 때까지 기다렸다가, 그때 실제로 받은 reward 로 계산한다'
      answer: 0
      explanation: |
        rollout 이 끊긴 뒤에도 episode 는 이어지므로 아직 받지 않은 reward 를 critic 의 예측 $V(s_{t+1})$ 로 채워 $\delta_t$ 를 계산한다.
        value 를 0 으로 두는 것은 로봇이 넘어진 것처럼 실제로 episode 가 끝났을 때의 처리다.
        마지막 step 을 버리지 않아도 bootstrap 으로 계산할 수 있다.
        다음 rollout 은 고친 policy 로 모으므로, 기다렸다가 계산하면 옛 policy 의 데이터에 다른 policy 의 결과가 섞인다.
    - question: |
        보행 학습에서 로봇이 넘어져 끝난 episode 와 20 초 제한이 다 되어 끊긴 episode(time-out)를 구분해야 하는 이유는 무엇인가?
      choices:
        - '넘어진 episode 는 나쁜 데이터라 reward 를 모두 버려야 하고, time-out 은 그대로 써야 하기 때문이다'
        - '넘어지면 이후 reward 가 없어 value 를 0 으로 두지만, time-out 은 계속 걸을 수 있었으므로 bootstrap 해야 하기 때문이다'
        - 'time-out 이 난 env 는 끝까지 잘 걸어 더 배울 것이 없어서, 다음 iteration 부터 학습에 쓰지 않기 때문이다'
        - '두 경우 모두 그 뒤의 value 를 0 으로 두고, 학습 곡선을 그릴 때 기록용으로만 구분하기 때문이다'
      answer: 1
      explanation: |
        time-out 은 observation 에 남은 시간이 없어 critic 이 예측할 수 없는 끊김이라, 0 으로 두면 잘 걷던 state 의 value 를 낮게 배우므로
        Rudin 등은 time-out 을 따로 감지해 bootstrap 했다.
        넘어진 episode 의 reward 도 학습에 그대로 쓰이고, 그 뒤의 value 만 0 으로 둔다.
        time-out 이 난 env 도 reset 된 뒤 계속 데이터를 모은다.
        두 경우를 모두 0 으로 두면 time-out 에서 critic 이 틀린 정답을 배우므로 기록만 하는 구분이 아니다.
    - question: |
        수천 개의 env 를 띄우고 env 마다 rollout 길이를 아주 짧게, 예를 들어 몇 step 만 잡으면 PPO 학습에 어떤 문제가 생기는가?
      choices:
        - 'env 가 많아 batch 가 커지므로 GPU 메모리가 부족해질 수 있다는 것 말고는, 학습 자체에는 문제가 없다'
        - 'rollout 이 짧으면 episode 가 끝나지 않아서, episode 끝에서 주는 reward 를 하나도 받을 수 없게 된다'
        - 'rollout 이 짧을수록 sample 이 서로 닮아서, 수천 개 env 를 띄워도 모은 데이터가 다양하지 않게 된다'
        - 'GAE 가 여러 step 의 reward 를 쓰지 못하고 critic 의 예측에 거의 기대게 되어 학습이 잘 되지 않는다'
      answer: 3
      explanation: |
        GAE 는 연속된 여러 step 의 reward 를 섞어야 효과가 있어서, Rudin 등은 env 마다 연속 step 이 0.5 초(약 25 step)보다 짧으면 학습이 잘 되지
        않았다고 보고했다.
        env 마다 step 을 줄이면 같은 env 수에서 batch 는 오히려 작아진다.
        reward 는 episode 가 끝나지 않아도 step 마다 받는다.
        sample 이 서로 닮는 것은 env 수가 적고 env 마다 step 이 길 때의 문제다.

- topic: ppo-iteration
  title: PPO 의 한 iteration 과 loss
  section: ppo-의-한-iteration
  variants:
    - question: |
        PPO 의 한 iteration 은 어떤 순서로 진행되는가?
      choices:
        - '지난 데이터 버리기 → GAE 로 advantage 계산 → 지금 policy 로 rollout 수집 → mini-batch 로 여러 epoch 학습'
        - '지금 policy 로 rollout 수집 → GAE 로 advantage 계산 → 섞어서 mini-batch 로 여러 epoch 학습 → 데이터 버리기'
        - 'mini-batch 로 여러 epoch 학습 → 지금 policy 로 rollout 수집 → GAE 로 advantage 계산 → 데이터를 buffer 에 계속 쌓기'
        - '지금 policy 로 rollout 수집 → 모은 데이터로 한 번만 학습 → GAE 로 advantage 계산 → 데이터 버리기'
      answer: 1
      explanation: |
        PPO 는 지금 policy 로 env 여러 개를 정해진 step 수만큼 움직여 데이터를 모으고, GAE 를 계산한 뒤 섞어서 mini-batch 로 여러 epoch 고치고,
        데이터를 버린 다음 고친 policy 로 다시 모은다.
        GAE 는 데이터를 모은 뒤에야 계산할 수 있어서 rollout 수집보다 앞설 수 없다.
        데이터를 buffer 에 계속 쌓아 두고 다시 쓰는 것은 off-policy 방법의 replay buffer 다.
        GAE 는 학습 전에 계산해야 하고, PPO 는 한 번이 아니라 여러 epoch 학습한다.
    - question: |
        PPO 는 같은 데이터로 여러 epoch 학습하는데도 on-policy 방법으로 분류한다. 그 이유는 무엇인가?
      choices:
        - '데이터를 그 iteration 안에서만 다시 쓰고 끝나면 버리며, 그동안 clip 으로 새 policy 를 옛 policy 가까이 두기 때문이다'
        - 'epoch 이라는 이름과 달리 PPO 는 실제로는 데이터를 한 번만 써서 policy 를 고치기 때문이다'
        - 'PPO 는 replay buffer 에 지난 iteration 의 데이터까지 쌓아 두고, 지금 policy 와 가까운 데이터만 골라 쓰기 때문이다'
        - 'PPO 에는 critic 이 없어서, 지금 policy 가 받은 reward 만으로 policy 를 고치기 때문이다'
      answer: 0
      explanation: |
        on-policy 는 지금 policy 로 모은 데이터로 배우는 방법이고, PPO 는 같은 iteration 의 데이터만 쓰면서 clip 으로 새 policy 가 데이터를 모은
        policy 에서 멀어지지 않게 한다.
        PPO 는 같은 데이터를 여러 epoch 쓰므로 한 번만 쓰지 않는다.
        오래전 policy 의 데이터까지 replay buffer 에 쌓아 두고 쓰는 것은 off-policy 방법이다.
        PPO 에도 value 를 예측하는 critic 이 있고 value loss 로 함께 고친다.
    - question: |
        PPO 의 loss $\mathcal L = -L^{\text{CLIP}} + c_v L^{\text{VF}} - c_e \mathcal H$ 에서 entropy 항 $\mathcal H$ 는 왜 넣는가?
      choices:
        - 'critic 의 예측이 GAE 로 구한 정답에 가까워지게 해서, advantage 추정을 정확하게 만들려고 넣는다'
        - 'ratio 를 $[1-\epsilon, 1+\epsilon]$ 로 잘라서, 새 policy 가 옛 policy 에서 멀어지지 않게 하려고 넣는다'
        - 'policy 가 너무 빨리 한 action 으로 쏠리지 않게 해서, exploration 이 일찍 사라지지 않게 하려고 넣는다'
        - 'environment 가 주는 reward 에 entropy 를 더해 키워서, 학습 신호를 더 강하게 만들려고 넣는다'
      answer: 2
      explanation: |
        entropy 는 확률분포가 얼마나 고르게 퍼져 있는지 재는 값이라 loss 에서 빼면 policy 가 여러 action 을 섞는 쪽으로 약간 끌린다. legged_gym 은
        이 계수를 0.01 로 작게 둔다.
        critic 의 예측을 정답에 맞추는 것은 value loss $L^{\text{VF}}$ 의 몫이다.
        ratio 를 자르는 것은 $L^{\text{CLIP}}$ 안의 clip 이다.
        loss 의 항은 policy 를 고치는 방향을 바꿀 뿐 environment 가 주는 reward 를 바꾸지 않는다.

- topic: parallel-sim
  title: 대규모 병렬 simulation 과 PPO 설정
  section: 대규모-병렬-simulation-의-ppo-설정
  variants:
    - question: |
        PPO 는 데이터를 한 iteration 만 쓰고 버리는데도, Isaac Gym 이나 Isaac Lab 같은 GPU 병렬 simulation 에서 보행 학습에 많이 쓰인다. 왜 잘 맞는가?
      choices:
        - 'PPO 는 replay buffer 로 지난 데이터를 계속 다시 쓰므로, 적은 simulation 으로도 충분한 데이터를 얻기 때문이다'
        - 'PPO 는 데이터가 적게 들어 실물 로봇에서 바로 학습하기 좋은 방법이라서, simulation 에서도 그대로 잘 맞기 때문이다'
        - '병렬 simulation 에서는 reward 가 필요 없어서, PPO 의 critic 없이 policy 만 빠르게 학습할 수 있기 때문이다'
        - '수천 개 env 가 새 데이터를 싸게 많이 만들어 버리는 약점이 작아지고, rollout 과 update 를 모두 GPU 에서 처리하기 쉽기 때문이다'
      answer: 3
      explanation: |
        on-policy 인 PPO 는 데이터가 많이 드는데 GPU 위의 수천 대 simulation 이 그 데이터를 싸게 만든다. Rudin 등은 env 4096 개와 batch 98,304 로
        험지 보행은 20 분 안에 학습했고 평지 보행은 4 분 안에 학습했다.
        replay buffer 로 지난 데이터를 다시 쓰는 것은 DQN·SAC 같은 off-policy 방법이다.
        PPO 는 데이터가 많이 들어서 실물 로봇에서 바로 학습하기에 오히려 불리하다.
        병렬 simulation 에서도 reward 로 배우고, PPO 는 GAE 계산에 critic 을 쓴다.
    - question: |
        legged_gym 의 기본 PPO 설정은 env 4096 개, env 마다 24 step, mini-batch 4 개, 5 epoch 이다. 한 iteration 에서 같은 데이터로 policy 를 몇 번 고치는가?
      choices:
        - '1 번. PPO 는 iteration 마다 모은 데이터로 한 번만 고친다'
        - '5 번. epoch 하나마다 전체 데이터로 한 번씩 고친다'
        - '20 번. epoch 마다 mini-batch 4 개로 한 번씩 고친다'
        - '98,304 번. sample 하나마다 한 번씩 고친다'
      answer: 2
      explanation: |
        sample $4096 \times 24 = 98{,}304$ 개를 4 개의 mini-batch(각 24,576 개)로 나누고 mini-batch 마다 gradient step 을 한 번 하므로 epoch 하나에
        4 번, 5 epoch 에 20 번이다.
        한 번만 고치고 버리는 것은 policy gradient 의 방식이고 PPO 는 여러 번 고친다.
        epoch 하나 안에서도 mini-batch 수만큼 고치므로 5 번보다 많다.
        gradient step 은 sample 이 아니라 mini-batch 마다 한 번이다.
    - question: |
        rsl_rl 의 PPO 는 learning rate 를 adaptive 로 둔다(`desired_kl = 0.01`). mini-batch 에서 잰 KL divergence 가 0.03 이면 learning rate 는 어떻게 되는가?
      choices:
        - 'KL 이 목표보다 크면 policy 가 잘 배우고 있다는 뜻이라서, learning rate 를 1.5 배로 키운다'
        - 'KL 이 목표의 두 배인 0.02 를 넘었으므로 learning rate 를 1.5 로 나눈다'
        - 'KL 은 학습 상태를 보려고 기록하는 값이라서, learning rate 는 바뀌지 않는다'
        - 'KL 이 목표보다 크면 learning rate 는 그대로 두고, 그 mini-batch 의 update 를 취소한다'
      answer: 1
      explanation: |
        rsl_rl 은 KL 이 `desired_kl` 의 두 배를 넘으면 learning rate 를 1.5 로 나누고 절반보다 작으면 1.5 를 곱해, policy 가 한 번에 바뀌는 크기를
        KL 0.01 근처로 맞춘다.
        learning rate 를 키우는 것은 KL 이 0.005 보다 작아 policy 가 너무 적게 바뀔 때다.
        schedule 이 adaptive 이면 KL 로 learning rate 를 실제로 바꾼다.
        rsl_rl 은 update 를 취소하지 않고 다음 update 의 learning rate 만 바꾼다.
