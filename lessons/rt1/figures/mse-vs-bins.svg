<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>상자 앞 시연 10 개가 −20° 와 +20° 로 반반 갈라질 때, MSE 로 학습한 policy 는 평균 0° 를 내고, 칸 다섯 개에 확률을 내는 policy 는 −20° 와 +20° 칸에 0.416 씩 준다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="330.0" height="270.0" rx="8" fill="#0e1628"/>
  <text x="32.0" y="64.0" fill="#e2e8f0" font-size="13" text-anchor="start">숫자 하나를 내는 policy (MSE)</text>
  <rect x="370.0" y="40.0" width="330.0" height="270.0" rx="8" fill="#0e1628"/>
  <text x="382.0" y="64.0" fill="#e2e8f0" font-size="13" text-anchor="start">칸마다 확률을 내는 policy</text>
  <line x1="50.0" y1="220.0" x2="330.0" y2="220.0" stroke="#475569" stroke-width="1.5"/>
  <text x="50.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">−40</text>
  <text x="120.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">−20</text>
  <text x="190.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <text x="260.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">+20</text>
  <text x="330.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">+40</text>
  <rect x="106.0" y="120.0" width="28.0" height="100.0" rx="1" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="120.0" y="114.0" fill="#d6aa62" font-size="11" text-anchor="middle">시연 5 개</text>
  <rect x="246.0" y="120.0" width="28.0" height="100.0" rx="1" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="260.0" y="114.0" fill="#d6aa62" font-size="11" text-anchor="middle">시연 5 개</text>
  <path d="M190.0,244 l-7,12 h14 z" fill="#7cb4d8"/>
  <text x="190.0" y="272.0" fill="#7cb4d8" font-size="12" text-anchor="middle">MSE 의 답: 평균 0°</text>
  <text x="190.0" y="290.0" fill="#d88b8b" font-size="12" text-anchor="middle">상자로 곧장 간다</text>
  <text x="190.0" y="100.0" fill="#d88b8b" font-size="11" text-anchor="middle">0° 에는 시연이 없다</text>
  <rect x="400.0" y="205.4" width="40.0" height="14.6" rx="1" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="420.0" y="199.4" fill="#7cb4d8" font-size="11" text-anchor="middle">0.056</text>
  <text x="420.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">−40°</text>
  <text x="420.0" y="254.0" fill="#64748b" font-size="10" text-anchor="middle">칸 0</text>
  <rect x="456.0" y="111.8" width="40.0" height="108.2" rx="1" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="476.0" y="105.8" fill="#d6aa62" font-size="11" text-anchor="middle">0.416</text>
  <text x="476.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">−20°</text>
  <text x="476.0" y="254.0" fill="#64748b" font-size="10" text-anchor="middle">칸 1</text>
  <rect x="512.0" y="205.4" width="40.0" height="14.6" rx="1" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="532.0" y="199.4" fill="#7cb4d8" font-size="11" text-anchor="middle">0.056</text>
  <text x="532.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">0°</text>
  <text x="532.0" y="254.0" fill="#64748b" font-size="10" text-anchor="middle">칸 2</text>
  <rect x="568.0" y="111.8" width="40.0" height="108.2" rx="1" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="588.0" y="105.8" fill="#d6aa62" font-size="11" text-anchor="middle">0.416</text>
  <text x="588.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">+20°</text>
  <text x="588.0" y="254.0" fill="#64748b" font-size="10" text-anchor="middle">칸 3</text>
  <rect x="624.0" y="205.4" width="40.0" height="14.6" rx="1" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="644.0" y="199.4" fill="#7cb4d8" font-size="11" text-anchor="middle">0.056</text>
  <text x="644.0" y="238.0" fill="#64748b" font-size="11" text-anchor="middle">+40°</text>
  <text x="644.0" y="254.0" fill="#64748b" font-size="10" text-anchor="middle">칸 4</text>
  <line x1="394.0" y1="220.0" x2="670.0" y2="220.0" stroke="#475569" stroke-width="1.5"/>
  <text x="535.0" y="276.0" fill="#7fc4a2" font-size="12" text-anchor="middle">가장 높은 칸: −20° 또는 +20°</text>
  <text x="535.0" y="294.0" fill="#7fc4a2" font-size="12" text-anchor="middle">어느 쪽이든 상자를 피한다</text>
</svg>
