  <text x="351.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="300.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="317.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="334.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="351.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <text x="439.0" y="124.0" fill="#34d399" font-size="12" text-anchor="middle">channel 2</text>
  <rect x="405.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="422.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="439.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="456.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="405.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="422.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="439.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="456.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <text x="387.0" y="232.0" fill="#f87171" font-size="12" text-anchor="middle">ch1: 2 × x + 0</text>
  <text x="387.0" y="252.0" fill="#34d399" font-size="12" text-anchor="middle">ch2: 0 × x − 1</text>
  <text x="387.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">빨간 캔 자리만 큰 값 6</text>
  <text x="387.0" y="312.0" fill="#94a3b8" font-size="11" text-anchor="middle">−1 은 다음 ReLU 에서 0 이 된다</text>
  <rect x="525.0" y="44.0" width="235.0" height="316.0" rx="8" fill="#0e1628"/>
  <text x="642.0" y="66.0" fill="#f59e0b" font-size="13" text-anchor="middle">지시: "초록 봉지 집어"</text>
  <text x="642.0" y="88.0" fill="#94a3b8" font-size="11" text-anchor="middle">e = (0, 1)  →  γ = (0, 2),  β = (−1, 0)</text>
  <text x="589.0" y="124.0" fill="#f87171" font-size="12" text-anchor="middle">channel 1</text>
  <rect x="555.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="572.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="589.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="606.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="555.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="572.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <rect x="589.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="606.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">−1</text>
  <text x="694.0" y="124.0" fill="#34d399" font-size="12" text-anchor="middle">channel 2</text>
  <rect x="660.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="677.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="694.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="711.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2</text>
  <rect x="660.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="677.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="694.0" y="166.0" width="34.0" height="34.0" rx="0" fill="#34d399" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <text x="711.0" y="188.0" fill="#e2e8f0" font-size="13" text-anchor="middle">6</text>
  <text x="642.0" y="232.0" fill="#f87171" font-size="12" text-anchor="middle">ch1: 0 × x − 1</text>
  <text x="642.0" y="252.0" fill="#34d399" font-size="12" text-anchor="middle">ch2: 2 × x + 0</text>
  <text x="642.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">초록 봉지 자리만 큰 값 6</text>
  <text x="642.0" y="312.0" fill="#94a3b8" font-size="11" text-anchor="middle">−1 은 다음 ReLU 에서 0 이 된다</text>
  <line x1="250.0" y1="160.0" x2="268.0" y2="160.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
