<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>FiLM 의 계산. 같은 feature map 에 빨간 캔 지시를 섞으면 빨강 channel 이 두 배가 되고 초록 channel 은 −1 로 꺼지며, 초록 봉지 지시를 섞으면 반대가 된다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="778" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="44.0" width="230.0" height="316.0" rx="8" fill="#0e1628"/>
  <text x="135.0" y="66.0" fill="#e2e8f0" font-size="13" text-anchor="middle">사진의 feature map</text>
  <text x="84.0" y="102.0" fill="#f87171" font-size="12" text-anchor="middle">channel 1 (빨강)</text>
  <rect x="50.0" y="110.0" width="34.0" height="34.0" rx="0" fill="#f87171" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <text x="67.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">3</text>
  <rect x="84.0" y="110.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="101.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="50.0" y="144.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="67.0" y="166.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="84.0" y="144.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="101.0" y="166.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text>
  <text x="184.0" y="102.0" fill="#34d399" font-size="12" text-anchor="middle">channel 2 (초록)</text>
  <rect x="150.0" y="110.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="167.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="184.0" y="110.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="201.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1</text>
  <rect x="150.0" y="144.0" width="34.0" height="34.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <text x="167.0" y="166.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <rect x="184.0" y="144.0" width="34.0" height="34.0" rx="0" fill="#34d399" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <text x="201.0" y="166.0" fill="#e2e8f0" font-size="13" text-anchor="middle">3</text>
  <text x="135.0" y="210.0" fill="#94a3b8" font-size="11" text-anchor="middle">왼쪽 위: 빨간 캔</text>
  <text x="135.0" y="228.0" fill="#94a3b8" font-size="11" text-anchor="middle">오른쪽 아래: 초록 봉지</text>
  <text x="135.0" y="262.0" fill="#e2e8f0" font-size="14" text-anchor="middle">y = γ × x + β</text>
  <text x="135.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="middle">γ = 1 + W<tspan font-size='9' dy='3'>γ</tspan><tspan dy='-3'> e,  β = W</tspan><tspan font-size='9' dy='3'>β</tspan><tspan dy='-3'> e</tspan></text>
  <text x="135.0" y="306.0" fill="#64748b" font-size="11" text-anchor="middle">W<tspan font-size='8' dy='3'>γ</tspan><tspan dy='-3'> = [[1, −1], [−1, 1]]</tspan></text>
  <text x="135.0" y="324.0" fill="#64748b" font-size="11" text-anchor="middle">W<tspan font-size='8' dy='3'>β</tspan><tspan dy='-3'> = [[0, −1], [−1, 0]]</tspan></text>
  <rect x="270.0" y="44.0" width="235.0" height="316.0" rx="8" fill="#0e1628"/>
  <text x="387.0" y="66.0" fill="#f59e0b" font-size="13" text-anchor="middle">지시: "빨간 캔 집어"</text>
  <text x="387.0" y="88.0" fill="#94a3b8" font-size="11" text-anchor="middle">e = (1, 0)  →  γ = (2, 0),  β = (0, −1)</text>
  <text x="334.0" y="124.0" fill="#f87171" font-size="12" text-anchor="middle">channel 1</text>
  <rect x="300.0" y="132.0" width="34.0" height="34.0" rx="0" fill="#f87171" fill-opacity="0.35" stroke="#475569" stroke-width="1"/>
  <text x="317.0" y="154.0" fill="#e2e8f0" font-size="13" text-anchor="middle">6</text>
