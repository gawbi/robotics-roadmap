  <text x="680.0" y="60.7" fill="#d88b8b" font-size="11" text-anchor="end">칸 폭의 절반 +10</text>
  <text x="680.0" y="249.3" fill="#d88b8b" font-size="11" text-anchor="end">칸 폭의 절반 −10</text>
