<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>관절 범위 −128° ~ +128° 를 칸 256 개로 나누면 칸 폭이 1° 이고, 10.3° 는 138 번 칸이 되어 가운데 값 10.5° 로 되돌아온다. 오차 0.2° 는 최대 오차 0.5° 보다 작다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="32.0" fill="#e2e8f0" font-size="14" text-anchor="start">관절 1 의 범위 −128° ~ +128°, 칸 256 개, 칸 폭 256 ÷ 256 = 1°</text>
  <rect x="60.0" y="52.0" width="600.0" height="14.0" rx="2" fill="#111a2e" stroke="#475569" stroke-width="1"/>
  <line x1="60.0" y1="52.0" x2="60.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="135.0" y1="52.0" x2="135.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="210.0" y1="52.0" x2="210.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="285.0" y1="52.0" x2="285.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="360.0" y1="52.0" x2="360.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="435.0" y1="52.0" x2="435.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="510.0" y1="52.0" x2="510.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="585.0" y1="52.0" x2="585.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <line x1="660.0" y1="52.0" x2="660.0" y2="66.0" stroke="#475569" stroke-width="1"/>
  <text x="60.0" y="82.0" fill="#64748b" font-size="11" text-anchor="middle">−128°</text>
  <text x="660.0" y="82.0" fill="#64748b" font-size="11" text-anchor="middle">+128°</text>
  <text x="360.0" y="82.0" fill="#64748b" font-size="11" text-anchor="middle">0°</text>
  <rect x="379.4" y="48.0" width="10.0" height="22.0" rx="1" fill="none" stroke="#d6aa62" stroke-width="1.5"/>
  <path d="M379.4,70 L110,104" stroke="#d6aa62" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <path d="M389.4,70 L610,104" stroke="#d6aa62" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
  <rect x="110.0" y="110.0" width="100.0" height="60.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="160.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 136</text>
  <text x="160.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="middle">가운데 8.5°</text>
  <rect x="210.0" y="110.0" width="100.0" height="60.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="260.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 137</text>
  <text x="260.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="middle">가운데 9.5°</text>
  <rect x="310.0" y="110.0" width="100.0" height="60.0" rx="0" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="360.0" y="132.0" fill="#d6aa62" font-size="13" text-anchor="middle">칸 138</text>
  <text x="360.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="middle">가운데 10.5°</text>
  <rect x="410.0" y="110.0" width="100.0" height="60.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="460.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 139</text>
  <text x="460.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="middle">가운데 11.5°</text>
  <rect x="510.0" y="110.0" width="100.0" height="60.0" rx="0" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="560.0" y="132.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 140</text>
  <text x="560.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="middle">가운데 12.5°</text>
  <text x="110.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">8°</text>
  <text x="210.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">9°</text>
  <text x="310.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">10°</text>
  <text x="410.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">11°</text>
  <text x="510.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">12°</text>
  <text x="610.0" y="188.0" fill="#64748b" font-size="11" text-anchor="middle">13°</text>
  <line x1="340.0" y1="100.0" x2="340.0" y2="172.0" stroke="#7cb4d8" stroke-width="2"/>
  <text x="336.0" y="96.0" fill="#7cb4d8" font-size="12" text-anchor="end">a = 10.3°</text>
  <circle cx="360.0" cy="170.0" r="4" fill="#7fc4a2"/>
  <text x="40.0" y="226.0" fill="#d6aa62" font-size="13" text-anchor="start">encode:  ⌊(10.3 + 128) ÷ 1⌋ = ⌊138.3⌋ = 138 번 칸</text>
  <text x="40.0" y="250.0" fill="#7fc4a2" font-size="13" text-anchor="start">decode:  −128 + (138 + 0.5) × 1 = 10.5°</text>
  <text x="40.0" y="274.0" fill="#94a3b8" font-size="13" text-anchor="start">오차:  10.5 − 10.3 = 0.2°   (어떤 각도든 칸 폭의 절반 0.5° 를 넘지 않는다)</text>
</svg>
