# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: bins-vs-regression
  title: 숫자 하나 대신 칸별 확률
  variants:
    - question: |
        면접관: "같은 장면의 시연이 절반은 장애물을 왼쪽으로, 절반은 오른쪽으로 피했습니다. 핸들 각도의 범위를 칸 여러 개로 나눠
        칸마다 확률을 내는 policy 는 숫자 하나를 MSE 로 맞히는 policy 와 무엇이 다른가요?"
      choices:
        - '두 policy 모두 두 정답의 평균인 직진 각도를 낸다'
        - '칸 방식은 시연이 더 많았던 한쪽 칸에만 확률을 주고 다른 쪽은 버린다'
        - '칸 방식은 왼쪽 칸과 오른쪽 칸에 높은 확률을 함께 줄 수 있어서, 한 칸을 고르면 평균인 직진 각도가 나오지 않는다'
        - '칸 방식은 각도를 칸의 가운데 값으로 되돌리므로 오차가 0 이 된다'
      answer: 2
      explanation: |
        칸마다 확률을 내면 떨어진 두 칸에 확률을 함께 줄 수 있어 봉우리 두 개가 남고, 실행할 때 칸 하나를 고르면 두 정답 가운데 하나가
        나온다. 평균인 직진 각도를 내는 것은 오차 제곱의 평균이 평균에서 가장 작은 MSE policy 뿐이다. 칸 방식은 시연이 갈린 비율대로
        두 칸 모두에 확률을 주므로 한쪽을 버리지 않는다. 칸 안의 값은 모두 같은 가운데 값으로 돌아가므로 칸 폭의 절반까지 오차가 남는다.
    - question: |
        면접관: "칸마다 확률을 내는 policy 에서 실행할 칸을 argmax 로 고를 때와 sampling 으로 고를 때의 차이를 설명해 주세요."
      choices:
        - 'argmax 는 같은 장면에서 늘 확률이 가장 높은 칸을 고르고, sampling 은 확률대로 뽑아 확률이 낮은 칸도 가끔 고른다'
        - 'argmax 는 확률대로 무작위로 고르고, sampling 은 늘 확률이 가장 높은 칸을 고른다'
        - '두 방법 모두 같은 장면에서 늘 같은 칸을 고른다'
        - 'sampling 은 여러 칸의 가운데 값을 확률로 평균해 하나의 값을 낸다'
      answer: 0
      explanation: |
        argmax 는 확률이 가장 큰 칸을 고르므로 같은 장면에서 결과가 늘 같고, sampling 은 확률에 비례해 무작위로 고르므로 매번 조금씩 다르며
        확률이 낮은 칸도 가끔 나온다. 두 번째 보기는 두 방법을 거꾸로 적었다. 세 번째 보기는 sampling 의 무작위성을 빠뜨렸다. 칸의 값을
        확률로 평균하면 regression 처럼 두 정답 사이의 값이 나오므로 sampling 이 하는 일이 아니다.
    - question: |
        면접관: "RT-1 저자들은 action 출력을 차원마다 칸 256 개의 분류에서 연속된 값의 Gaussian 분포로 바꿔 봤는데, 학습한 지시와 처음
        보는 지시 모두에서 성공률이 크게 떨어졌습니다. 가장 알맞은 해석은 무엇인가요?"
      choices:
        - 'Gaussian 출력은 계산이 느려서 제어 주기를 맞추지 못했기 때문이다'
        - 'Gaussian 출력은 cross-entropy 를 쓸 수 없어서 학습이 수렴하지 않았기 때문이다'
        - '칸 분류는 binning 오차가 0 이라 더 정밀하기 때문이다'
        - 'Gaussian 은 봉우리를 하나만 나타내서, 시연이 여러 방식으로 갈릴 때 그 평균 쪽으로 끌려가기 때문이다'
      answer: 3
      explanation: |
        Gaussian 은 봉우리를 하나만 나타내므로 갈린 시연에 맞추면 평균 쪽 값을 내게 되고, 칸 분류는 봉우리가 여럿인 분포를 나타낼 수
        있다는 것이 논문의 해석이다. 저자들이 잰 계산 시간은 두 출력 방식에서 15 ms 와 16 ms 로 비슷했으므로 속도가 원인은 아니다.
        Gaussian 출력도 학습은 수렴하며, 수렴한 값이 평균 쪽이라는 것이 문제다. 칸 분류에는 칸 폭의 절반까지 오차가 남으므로 정밀도가
        이유일 수 없다.

- topic: cross-entropy
  title: cross-entropy 와 두 봉우리
  variants:
    - question: |
        면접관: "시연이 절반은 왼쪽 칸, 절반은 오른쪽 칸을 정답으로 갖습니다. 모델 A 는 두 정답 칸에 확률을 나눠 주고, 모델 B 는 두 칸
        사이에 있는, 어느 시연에서도 정답이 아닌 가운데 칸에 확률을 몰아줍니다. cross-entropy 로 비교하면 어떻게 되나요?"
      choices:
        - '모델 B 가 두 정답 모두에 가까운 칸을 골랐으므로 loss 가 더 작다'
        - '모델 A 의 loss 가 더 작다. cross-entropy 는 정답 칸이 받은 확률만 보기 때문이다'
        - '두 모델의 loss 는 같다'
        - 'cross-entropy 는 칸 번호 차이의 제곱을 재므로 모델 B 를 더 좋게 본다'
      answer: 1
      explanation: |
        cross-entropy 는 정답 칸에 준 확률 $p$ 로 $-\log p$ 를 매길 뿐이라, 정답이 한 번도 없는 칸에 확률을 몰아준 모델 B 는 정답 칸의
        확률이 작아 loss 가 크다. 가운데 칸이 가깝다는 생각은 거리를 재는 MSE 의 관점이다. 정답 칸의 확률이 두 모델에서 다르므로 loss 도
        다르다. 칸 번호 차이의 제곱은 cross-entropy 에 들어가지 않는다.
    - question: |
        면접관: "action 을 칸으로 나눠도 결국 평균 근처의 칸이 가장 좋은 답이 되지 않나요? 이 말이 틀린 이유를 설명해 주세요."
      choices:
        - '칸으로 나누면 평균 자리의 칸이 없어지기 때문이다'
        - 'softmax 가 평균 근처 칸의 점수를 자동으로 0 으로 만들기 때문이다'
        - '칸 개수가 많으면 평균 자리가 여러 칸으로 흩어지기 때문이다'
        - 'cross-entropy 는 칸 사이의 거리를 보지 않아서, 정답 바로 옆 칸이어도 정답이 아니면 틀린 칸으로 취급하기 때문이다'
      answer: 3
      explanation: |
        cross-entropy 에는 칸 사이의 거리가 들어가지 않으므로 두 정답 사이의 칸에 확률을 놓아도 얻는 것이 없고, loss 가 가장 작은 확률은
        정답이 나온 칸들에 몰린다. 평균 자리에 해당하는 칸은 칸으로 나눈 뒤에도 그대로 있다. softmax 는 점수를 확률로 바꿀 뿐 특정 칸을
        0 으로 만들지 않는다. 칸 개수는 칸 폭을 바꿀 뿐 평균 쪽으로 끌리는지와는 관계가 없다.
    - question: |
        면접관: "같은 장면의 시연 가운데 70% 는 왼쪽 칸, 30% 는 오른쪽 칸이 정답입니다. 평균 cross-entropy 를 가장 작게 만드는 확률은
        무엇인가요?"
      choices:
        - '왼쪽 칸 1, 나머지 칸 0'
        - '왼쪽 칸 0.5, 오른쪽 칸 0.5'
        - '왼쪽 칸 0.7, 오른쪽 칸 0.3'
        - '두 칸 사이의 가운데 칸 1'
      answer: 2
      explanation: |
        평균 cross-entropy 는 각 칸이 정답으로 나온 비율을 그대로 확률로 낼 때 가장 작아서, 학습한 모델은 시연이 갈린 비율대로 봉우리
        두 개를 갖는다. 왼쪽 칸에 1 을 주면 오른쪽이 정답인 시연에서 확률이 0 이라 loss 가 끝없이 커진다. 반반은 실제 비율과 달라서
        비율대로 낸 확률보다 loss 가 크다. 가운데 칸은 정답이 한 번도 없는 칸이라 두 정답 모두에서 확률이 0 이다.

- topic: binning-error
  title: binning 과 칸 개수
  variants:
    - question: |
        면접관: "action 범위는 그대로 두고 칸 개수만 두 배로 늘리면, 칸의 가운데 값으로 되돌렸을 때의 최대 오차는 어떻게 되나요?"
      choices:
        - '절반으로 줄어든다'
        - '두 배로 커진다'
        - '변하지 않는다'
        - '0 이 된다'
      answer: 0
      explanation: |
        최대 오차는 칸 폭의 절반이고, 같은 범위를 두 배 많은 칸으로 나누면 칸 폭이 절반이 되므로 최대 오차도 절반이 된다. 칸이 많아지면
        칸이 촘촘해지므로 오차가 커지지 않는다. 칸 폭이 바뀌므로 최대 오차가 그대로일 수 없다. 칸이 아무리 많아도 칸 하나에 값이 여러 개
        들어가므로 오차가 0 이 되지는 않는다.
    - question: |
        면접관: "binning 오차를 줄이려고 action 차원 하나를 칸 수천 개로 나누면 어떤 문제가 생기나요? 시연 수는 그대로입니다."
      choices:
        - '칸 폭이 넓어져 오차가 오히려 커진다'
        - 'softmax 로 만든 확률의 합이 1 을 넘는다'
        - '칸 대부분에 정답 시연이 거의 들어오지 않아서, 거의 같은 값인 이웃 칸들을 서로 다른 class 로 따로 배워야 하고 확률을 배울 근거가 모자란다'
        - '분류 문제가 다시 regression 문제로 바뀐다'
      answer: 2
      explanation: |
        시연 수는 그대로인데 칸이 아주 많아지면 칸 하나에 들어가는 정답이 거의 없어서, 정답을 한 번도 받지 못한 칸은 확률을 얼마로 줄지
        배울 수 없다. 칸이 많아지면 칸 폭은 좁아진다. softmax 의 합은 칸 개수와 상관없이 1 이다. 칸이 많아도 여전히 칸을 고르는 분류
        문제다.
    - question: |
        면접관: "칸 번호를 다시 action 값으로 되돌릴 때 칸의 왼쪽 끝이 아니라 가운데 값을 쓰는 이유는 무엇인가요?"
      choices:
        - '가운데 값을 쓰면 되돌린 값의 오차가 항상 0 이 된다'
        - '칸 안의 어떤 값과도 거리가 칸 폭의 절반 이하라서 최대 오차가 가장 작다'
        - '왼쪽 끝 값으로는 칸 번호를 다시 계산할 수 없다'
        - '가운데 값이 시연에서 가장 자주 나온 값이기 때문이다'
      answer: 1
      explanation: |
        가운데는 칸의 양쪽 끝까지 거리가 같아서 칸 안에서 가장 먼 값과도 칸 폭의 절반만 떨어지므로, 왼쪽 끝을 쓰면 칸 폭 전체에 가깝던
        최대 오차가 절반으로 준다. 칸 안의 값이 모두 한 값으로 돌아오므로 모든 값의 오차가 0 일 수는 없다. 왼쪽 끝 값도 같은 칸에 속하므로 칸 번호를
        다시 구하는 데 문제가 없다. 가운데 값은 범위와 칸 개수로 정해질 뿐 시연에서 나온 빈도와는 관계가 없다.

- topic: per-dimension
  title: 차원마다 따로 고르는 선택
  variants:
    - question: |
        면접관: "시연의 절반은 손끝을 왼쪽 위로, 절반은 오른쪽 아래로 옮겼습니다. 모델이 x 와 y 의 칸 확률을 따로 내고 차원마다 따로
        칸을 고르면 어떤 문제가 생기나요?"
      choices:
        - '각 차원 안에서 두 봉우리가 평균 하나로 합쳐진다'
        - '차원마다 확률을 따로 내면 합이 1 을 넘어 고를 수 없다'
        - '각 차원이 시연의 비율을 지키므로 아무 문제가 없다'
        - '왼쪽 아래나 오른쪽 위처럼 시연에 없던 조합이 나올 수 있다'
      answer: 3
      explanation: |
        x 만 보면 왼쪽과 오른쪽이 반반이고 y 만 보면 위와 아래가 반반이라, 따로 고르면 왼쪽·아래나 오른쪽·위도 같은 확률로 나온다. 차원
        하나 안에서는 봉우리 두 개가 그대로 남는다. 차원마다 확률은 따로 합이 1 이라 고르는 데 문제가 없다. 차원마다 비율을 지켜도 차원
        사이의 짝은 지키지 못하므로 문제가 없다는 말은 틀렸다.
    - question: |
        면접관: "앞에서 고른 차원을 보고 다음 차원을 고르는 autoregressive 출력은 차원 사이의 짝을 지킬 수 있습니다. 그런데 RT-1 은 11 개
        차원을 한 번의 계산으로 함께 냅니다. 그 이유로 알맞은 것은 무엇인가요?"
      choices:
        - 'autoregressive 출력은 분류 문제에 쓸 수 없기 때문이다'
        - '저자들이 비교해 보니 autoregressive 출력은 계산 시간이 두 배 넘게 늘었는데 성공률은 오르지 않았기 때문이다'
        - 'binning 이 차원 사이의 짝을 이미 지켜 주기 때문이다'
        - 'autoregressive 출력은 cross-entropy 로 학습할 수 없기 때문이다'
      answer: 1
      explanation: |
        RT-1 논문의 ablation 에서 autoregressive 출력은 계산 한 번이 15 ms 에서 36 ms 로 늘었고 성공률은 오히려 낮아서, 1 초에 3 번
        action 을 내야 하는 RT-1 은 한 번의 계산을 골랐다. language model 이 글을 token 하나씩 쓰듯 autoregressive 출력도 칸을 고르는 분류다.
        binning 은 차원 하나의 값을 칸으로 바꿀 뿐 차원 사이의 짝과는 관계가 없다. autoregressive 출력도 차원마다 cross-entropy 로 학습한다.
    - question: |
        면접관: "action 11 차원을 각각 256 칸으로 나눈 policy 가 11 차원의 모든 조합을 한 class 씩으로 두지 않고 차원마다 따로 분류하는
        이유는 무엇인가요?"
      choices:
        - '조합마다 class 를 두면 class 가 256 의 11 제곱 개라서 출력과 필요한 시연 수가 감당할 수 없이 커지기 때문이다'
        - '조합마다 class 를 두면 softmax 를 쓸 수 없기 때문이다'
        - '차원마다 따로 분류하면 차원 사이의 짝도 함께 지켜지기 때문이다'
        - '조합마다 class 를 두면 binning 오차가 커지기 때문이다'
      answer: 0
      explanation: |
        차원마다 따로 분류하면 점수가 $11 \times 256 = 2{,}816$ 개면 되지만, 조합마다 class 를 두면 $256^{11}$ 개의 class 에 점수를 내야 하고
        대부분의 class 는 시연에서 한 번도 정답으로 나오지 않는다. softmax 는 class 가 아무리 많아도 계산할 수 있으므로 쓸 수 없는 것은
        아니다. 차원마다 따로 분류하면 오히려 차원 사이의 짝을 지키지 못한다. binning 오차는 각 차원의 칸 폭으로 정해지므로 class 를
        묶는 방식과 관계가 없다.

- topic: film
  title: FiLM 과 identity 초기화
  variants:
    - question: |
        면접관: "FiLM 이 지시 문장을 CNN 의 사진 처리에 섞는 방법을 설명해 주세요."
      choices:
        - '지시 문장의 embedding 을 사진 pixel 뒤에 이어 붙여 입력 channel 을 늘린다'
        - '사진 처리가 모두 끝난 뒤 사진 요약과 지시 embedding 을 평균한다'
        - '지시의 embedding 에서 channel 마다 곱할 수 $\gamma$ 와 더할 수 $\beta$ 를 만들어, 그 channel 의 모든 칸에 $\gamma x + \beta$ 를 한다'
        - '학습이 끝나면 고정되는 $\gamma$, $\beta$ 를 어떤 지시에나 똑같이 쓴다'
      answer: 2
      explanation: |
        FiLM 은 지시의 embedding 에 학습한 행렬을 곱해 channel 마다 $\gamma$ 와 $\beta$ 를 만들고 그 channel 의 모든 칸에 같은 곱셈과
        덧셈을 하므로, 같은 사진이라도 지시에 따라 키우는 channel 이 달라진다. 입력 channel 에 이어 붙이는 것은 FiLM 의 계산이 아니다.
        처리가 끝난 뒤에 합치면 사진 요약이 지시에 맞춰지지 않는다. 고정된 $\gamma$, $\beta$ 를 쓰는 것은 batch normalization 이다.
    - question: |
        면접관: "pretrained CNN 의 층 사이에 FiLM 을 새로 끼워 넣을 때, $\gamma$ 와 $\beta$ 를 만드는 행렬을 0 으로 초기화하는 이유는
        무엇인가요? FiLM 은 $(1 + W_\gamma e) x + W_\beta e$ 꼴로 계산합니다."
      choices:
        - '처음에 $\gamma = 1$, $\beta = 0$ 이 되어 pretrained 층의 값을 그대로 내보내므로 미리 배운 사진 feature 가 망가지지 않는다'
        - '행렬이 0 이면 FiLM 이 학습되지 않아 계산이 빨라진다'
        - '행렬이 0 이면 모든 지시가 같은 embedding 을 갖게 되어 학습이 쉬워진다'
        - '0 으로 시작해야 $\gamma$ 가 학습 내내 음수가 되지 않는다'
      answer: 0
      explanation: |
        행렬이 0 이면 어떤 지시가 오든 $\gamma = 1$, $\beta = 0$ 이라 FiLM 은 입력을 그대로 내보내는 identity 가 되고, 학습 첫 step 에
        pretrained CNN 이 원래대로 작동한다. 행렬은 0 에서 시작할 뿐 학습으로 계속 바뀐다. embedding 은 문장을 encoder 에 넣어 얻으므로
        행렬과 상관없이 문장마다 다르다. 초기화는 시작점만 정할 뿐 학습 중 $\gamma$ 의 부호를 막지 않는다.
    - question: |
        면접관: "지시 문장을 사진 요약이 끝난 뒤에 붙이지 않고, CNN 이 사진을 처리하는 도중에 섞으면 무엇이 좋은가요?"
      choices:
        - 'CNN 의 parameter 수가 줄어든다'
        - '지시 문장이 사진보다 숫자가 많아서 먼저 넣어야 계산이 맞는다'
        - '끝난 뒤에 붙이면 지시가 action 에 전혀 영향을 줄 수 없다'
        - '지시에 맞는 물체의 feature 는 키우고 상관없는 물체는 줄인 채 다음 층으로 넘겨, 방해 물체가 있어도 필요한 feature 를 뽑기 쉽다'
      answer: 3
      explanation: |
        지시를 모르는 CNN 은 사진 속 물체를 모두 적당히 담아야 해서 지시한 물체의 정보가 흐려질 수 있지만, 도중에 지시를 섞으면 층들이
        지시한 물체 쪽 값을 키운다. FiLM 층이 더해지므로 parameter 는 오히려 조금 늘어난다. 섞는 시점은 숫자의 개수와 관계가 없다. 끝에
        붙여도 지시는 action 에 영향을 주며, 사진 요약이 지시에 맞춰지지 않을 뿐이다.

- topic: tokenlearner-latency
  title: TokenLearner 와 계산 시간
  variants:
    - question: |
        면접관: "Transformer 에 넣는 token 수를 약 10 분의 1 로 줄이면, self-attention 이 층마다 매기는 점수의 개수는 대략 어떻게 되나요?"
      choices:
        - '약 10 분의 1 로 준다'
        - '약 100 분의 1 로 준다'
        - '변하지 않는다'
        - '약 20 분의 1 로 준다'
      answer: 1
      explanation: |
        self-attention 은 모든 token 쌍에 점수를 매기므로 점수 표의 칸 수가 token 수의 제곱이고, token 수가 10 분의 1 이 되면 점수는
        $10 \times 10 = 100$ 분의 1 이 된다. 10 분의 1 은 점수가 token 수에 비례한다고 볼 때의 답이다. 점수 개수는 token 수에 따라
        바뀌므로 그대로일 수 없다. 20 분의 1 은 제곱도 비례도 아닌 값이다.
    - question: |
        면접관: "TokenLearner 는 사진 한 장의 image token 여러 개를 어떻게 적은 수로 줄이나요?"
      choices:
        - '점수가 가장 높은 token 몇 개만 남기고 나머지는 버린다'
        - '사진에서 중요한 구역을 사람이 미리 정해 그 token 만 남긴다'
        - '입력 token 전체를 똑같은 비율로 평균해 하나로 만든다'
        - '출력 token 마다 입력 token 전체에 합이 1 인 weight 를 매겨 가중 평균하고, weight 는 입력을 보고 그때그때 계산한다'
      answer: 3
      explanation: |
        TokenLearner 는 고르지 않고 섞는다. 출력 token 마다 작은 network 가 입력 token 전체에 weight 를 계산해 가중 평균하므로 버려지는
        token 이 없고, 물체 위치가 바뀌면 weight 도 따라 바뀐다. 상위 몇 개만 남기면 나머지 token 의 정보가 사라진다. 사람이 구역을
        정하면 물체 위치가 바뀔 때 따라가지 못한다. 똑같은 비율로 평균하면 어디에 무엇이 있는지가 뭉개진다.
    - question: |
        면접관: "로봇 policy 의 계산 시간이 step 마다 다르면 action 이 로봇에 닿는 시점이 매번 달라집니다. RT-1 시스템은 이 문제를
        어떻게 다뤘나요?"
      choices:
        - 'action 을 autoregressive 하게 내서 계산 시간을 늘렸다'
        - '계산이 늦어진 step 은 action 을 내지 않고 건너뛰었다'
        - '관측을 찍은 뒤 시스템에서 관측한 가장 긴 지연만큼 늘 기다렸다가 action 을 적용해, 관측에서 적용까지의 간격을 고정했다'
        - '제어 주기를 계산이 끝날 때마다 바꿔 가며 맞췄다'
      answer: 2
      explanation: |
        RT-1 은 관측을 찍은 뒤 모든 부분의 최대 지연인 280 ms 를 늘 기다렸다가 action 을 적용해서, 어느 step 이든 관측과 적용 사이의
        간격이 같다. autoregressive 출력은 계산을 늘릴 뿐 계산 시간의 차이를 없애지 않는다. step 을 건너뛰면 그동안 로봇이 새 명령을 받지 못한다.
        주기를 계속 바꾸는 것은 간격이 매번 달라지는 문제를 그대로 남긴다.

- topic: data-diversity
  title: 데이터의 양과 다양성
  variants:
    - question: |
        면접관: "지시를 따르는 로봇 policy 의 시연을 1 만 개 더 모을 수 있습니다. 처음 보는 지시에서의 일반화를 높이려면 어떻게 모으는
        것이 좋을까요?"
      choices:
        - '새 물체·새 동작 조합의 지시를 더해 지시의 종류를 늘린다'
        - '이미 시연이 많은 지시의 시연을 더 늘린다'
        - '있는 시연을 여러 번 복사해 데이터 양을 늘린다'
        - '시연이 적은 지시를 빼서 지시마다 시연 수를 고르게 맞춘다'
      answer: 0
      explanation: |
        RT-1 의 데이터 실험에서 일반화는 데이터의 양보다 지시의 종류에 더 크게 좌우됐으므로, 새 조합의 지시를 더하는 쪽이 낫다. 이미
        많은 지시를 더 모으면 양만 늘고 종류는 그대로다. 복사한 시연은 새 정보가 없어 양만 부풀린다. 시연이 적은 지시를 빼면 오히려
        종류가 줄어 일반화가 떨어진다.
    - question: |
        면접관: "시연이 적은 지시 25% 를 빼서 데이터가 97% 남은 모델과, 지시는 모두 두고 지시마다 시연 수에 상한을 두어 데이터가 51% 남은
        모델의 일반화 성능이 비슷했습니다. 이 결과가 뜻하는 것은 무엇인가요?"
      choices:
        - '데이터를 49% 줄여도 성능이 거의 그대로이므로 데이터 양은 중요하지 않다'
        - '시연이 적은 지시는 학습에 방해가 되므로 빼는 편이 낫다'
        - '데이터를 3% 만 잃어도 지시의 종류가 줄면 데이터를 절반 가까이 잃은 만큼 일반화가 떨어지므로, 다양성이 양보다 중요하다'
        - '두 모델이 비슷하므로 데이터를 줄이는 방식은 결과에 영향이 없다'
      answer: 2
      explanation: |
        지시를 뺀 모델은 데이터를 3% 만 잃었는데 데이터를 49% 잃은 모델과 비슷하게 일반화가 떨어졌으므로, 종류를 잃는 것이 양을 잃는
        것보다 훨씬 손해다. 두 모델 모두 원래 모델보다 일반화가 떨어졌으므로 양이 중요하지 않다는 해석은 틀렸다. 시연이 적은 지시를 빼서
        성능이 떨어졌으니 빼는 편이 낫다는 말은 결과와 반대다. 잃은 데이터의 양이 크게 다른데 결과가 비슷하다는 것 자체가 줄이는
        방식이 영향을 준다는 뜻이다.
    - question: |
        면접관: "실제 로봇 시연에 simulation 시연이나 다른 로봇의 데이터를 섞으면 어떤 효과를 기대할 수 있나요? RT-1 의 실험을 바탕으로
        답해 주세요."
      choices:
        - '로봇의 모양이 다르면 action 의 뜻이 달라서 섞은 데이터는 언제나 성능을 떨어뜨린다'
        - '원래 작업의 성능은 거의 그대로 두면서, 섞은 데이터에만 나온 물체나 작업 상황에서의 성공률이 오를 수 있다'
        - 'simulation 데이터를 섞으면 실제 로봇 시연이 필요 없어진다'
        - '섞은 데이터의 양만큼 모든 작업의 성공률이 똑같이 오른다'
      answer: 1
      explanation: |
        RT-1 은 simulation 데이터를 섞자 simulator 에서만 본 물체를 다루는 성공률이 크게 올랐고, 다른 로봇의 상자 집기 데이터를 섞자 비슷한
        시험의 성공률이 올랐다. 원래 작업의 성능은 2%p 정도만 줄었다. 다른 로봇의 데이터만으로 학습한 모델은 0% 였지만, 실제 시연에
        섞었을 때는 해롭지 않았다. 실험은 실제 시연을 모두 둔 채 데이터를 더한 것이라 실제 시연이 필요 없다는 근거가 없다. 성능은
        섞은 데이터와 관련된 상황에서 주로 올랐고 모든 작업에 똑같이 오르지는 않았다.

- topic: generalization-limit
  title: 처음 보는 지시와 시연에 없는 동작
  variants:
    - question: |
        면접관: "집기와 서랍 열기 동작은 시연에 있고 병뚜껑 돌려 열기는 한 번도 없습니다. 이 시연으로 behavior cloning 학습한 RT-1 같은
        지시를 따르는 policy 를 옳게 설명한 것은 무엇인가요?"
      choices:
        - '지시 문장을 이해하므로 병뚜껑 돌려 열기도 해낸다'
        - '처음 보는 물체는 집지 못하지만 처음 보는 동작은 해낸다'
        - '시연 수가 충분히 많으면 시연에 없는 동작도 스스로 만들어 낸다'
        - '본 적 있는 동작과 물체의 새 조합은 해낼 수 있지만, 시연에 없는 돌려 여는 동작은 만들어 내지 못한다'
      answer: 3
      explanation: |
        이런 policy 가 배운 것은 시연 속 사진·지시와 action 의 짝이라서, 본 적 있는 동작을 본 적 있는 물체에 새로 짝짓는 일은 해내지만
        한 번도 없던 동작은 만들 근거가 없다. 지시 문장을 숫자로 바꿀 수 있다고 그 단어에 맞는 동작을 아는 것은 아니다. 새 조합에 강하고
        새 동작에 약하다는 것이 실제 결과라서 두 번째 보기는 거꾸로다. 시연이 많아도 그 안에 없는 동작은 여전히 없다.
    - question: |
        면접관: "칸마다 확률을 내는 policy 가 시연에 없던 동작을 만들어 내지 못하는 이유를 설명해 주세요."
      choices:
        - '지시 문장 encoder 가 처음 보는 단어를 숫자로 바꾸지 못하기 때문이다'
        - '칸마다 내는 확률은 시연에서 각 칸이 정답으로 나온 비율을 배운 것이라, 시연에 없는 움직임의 순서에 높은 확률을 줄 근거가 없기 때문이다'
        - 'binning 오차 때문에 새 동작이 부정확하게 나오기 때문이다'
        - 'Transformer 에 넣는 token 수가 부족하기 때문이다'
      answer: 1
      explanation: |
        cross-entropy 로 학습한 모델은 시연에서 정답으로 나온 칸에 확률을 주도록 배우므로, 어느 칸에서도 정답으로 나온 적이 없는 움직임의
        순서를 만들 근거가 없다. 문장 encoder 는 어떤 문장이든 숫자로 바꾸지만 그 숫자에 짝지어 배운 action 이 없을 뿐이다. binning
        오차는 칸 폭 절반만큼의 작은 오차라서 동작이 아예 없는 것과는 다른 문제다. token 수는 계산량의 문제이고 배운 동작의 범위와는
        관계가 없다.
    - question: |
        면접관: "RT-1 이 처음 보는 지시를 76% 해냈다는 결과에서, 처음 보는 지시는 어떤 지시였나요?"
      choices:
        - '동작과 물체를 각각 다른 지시에서 본 적이 있고, 그 조합만 학습에서 뺀 지시'
        - '시연에 한 번도 나오지 않은 새 동작을 요구하는 지시'
        - '시연에 한 번도 나오지 않은 새 물체 이름이 들어간 지시'
        - '학습한 지시와 같은 문장을 새 부엌에서 시험한 것'
      answer: 0
      explanation: |
        저자들은 지시 21 개를 학습에서 빼되 그 동작과 물체가 다른 지시에는 나오도록 해서, 본 적 있는 개념의 새 조합을 시험했다. 시연에
        없는 새 동작은 RT-1 이 일반화하지 못한다고 논문이 한계로 밝힌 경우다. 이름을 한 번도 본 적 없는 물체는 이 시험의 조건이 아니며,
        그런 지시는 인터넷 데이터로 학습한 VLA 가 다루려는 문제다. 같은 지시를 새 부엌에서 시험한 것은 처음 보는 배경 항목이다.
