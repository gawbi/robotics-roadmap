# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: mse-vs-bins
  title: 정답이 여럿인 시연과 칸마다의 확률
  variants:
    - question: |
        같은 장면에서 시연의 절반은 장애물을 왼쪽으로, 절반은 오른쪽으로 피했다. 핸들 각도를 숫자 하나로 내고 MSE 로
        학습한 policy 는 이 장면에서 어떤 action 을 낼까?
      choices:
        - '시연이 조금이라도 더 많았던 쪽으로 피하는 각도'
        - '왼쪽과 오른쪽 가운데 무작위로 고른 각도'
        - '두 정답의 평균인 직진 각도라서 장애물로 곧장 간다'
        - '학습이 수렴하지 않아 매번 다른 각도'
      answer: 2
      explanation: |
        MSE 는 정답과의 거리의 제곱을 평균하므로, 정답이 왼쪽과 오른쪽으로 갈리면 그 가운데인 평균 값에서 가장 작아진다.
        그래서 policy 는 아무도 하지 않은 직진 action 을 내고 장애물에 부딪힌다. 숫자 하나를 내는 policy 는 어느 한쪽을
        고르거나 무작위로 뽑는 기능이 없고, 학습은 평균 쪽으로 잘 수렴한다는 점에서 나머지 보기는 틀렸다.
    - question: |
        같은 관측에 정답 action 이 여럿인 multimodal 시연에서, action 범위를 칸으로 나눠 칸마다 확률을 내는 방식이 숫자
        하나를 내는 regression 보다 나은 이유는?
      choices:
        - '서로 떨어진 두 칸에 높은 확률을 함께 줄 수 있어, 평균 자리를 답으로 만들지 않는다'
        - '칸으로 나누면 action 의 오차가 0 이 된다'
        - '칸마다 확률을 내면 학습에 필요한 시연 수가 줄어든다'
        - '분류 문제는 loss 없이 학습할 수 있어 빠르다'
      answer: 0
      explanation: |
        칸마다 확률을 내면 왼쪽 칸과 오른쪽 칸에 동시에 높은 확률을 주고 가운데 칸에는 낮은 확률을 줄 수 있어서,
        봉우리 두 개가 그대로 남는다. 칸의 가운데 값으로 되돌리면 칸 폭의 절반까지 오차가 남으므로 오차가 0 이 되지는
        않는다. 칸 방식이 시연 수를 줄여 준다는 근거는 없고, 분류도 cross-entropy 라는 loss 로 학습한다.
    - question: |
        action 을 맞히는 regression 문제를 분류(classification) 문제로 바꾼다는 말의 뜻으로 옳은 것은?
      choices:
        - '사진 속 물체를 종류별로 분류해 그 이름을 action 으로 쓴다'
        - 'action 을 맞히는 대신 작업의 성공과 실패 두 class 를 맞힌다'
        - '연속된 action 값을 그대로 내되 loss 만 cross-entropy 로 바꾼다'
        - 'action 범위를 나눈 칸 하나하나를 class 로 삼아 "몇 번 칸인가" 를 고른다'
      answer: 3
      explanation: |
        분류는 여러 class 가운데 하나를 고르는 문제이고, 여기서는 action 범위를 나눈 칸 하나하나가 class 다. 그래서 모델은
        각도 값을 바로 내지 않고 칸마다 확률을 낸다. 물체 이름이나 성공 여부를 맞히는 것은 action 을 내는 문제가 아니고,
        연속된 값을 그대로 내면 cross-entropy 를 계산할 class 가 없다.

- topic: bin-index
  title: action binning 과 칸 번호
  variants:
    - question: |
        action binning 에서 연속된 값 하나를 칸 번호로 바꾸는 방법으로 옳은 것은?
      choices:
        - '값을 반올림한 정수를 그대로 칸 번호로 쓴다'
        - '범위의 왼쪽 끝에서 떨어진 거리를 칸 폭으로 나누고 소수점 아래를 버린다'
        - '값을 칸 개수로 나눈 나머지를 칸 번호로 쓴다'
        - '값이 클수록 칸 폭을 넓혀 가며 칸 번호를 정한다'
      answer: 1
      explanation: |
        범위를 같은 폭의 칸으로 나눴으므로, 왼쪽 끝에서 얼마나 떨어졌는지를 칸 폭으로 나누면 "칸 몇 개를 지나왔는가" 가
        나오고, 소수점 아래를 버리면 지금 들어 있는 칸의 번호가 된다. 반올림한 값이나 나머지는 범위의 시작점과 칸 폭을
        쓰지 않아 칸과 맞지 않는다. 값에 따라 칸 폭을 바꾸는 것은 같은 폭으로 나누는 binning 이 아니다.
    - question: |
        칸 번호를 다시 action 값으로 되돌릴 때 칸의 왼쪽 끝이 아니라 가운데 값을 쓰는 이유는?
      choices:
        - '가운데 값을 쓰면 되돌린 값의 오차가 항상 0 이 된다'
        - '왼쪽 끝 값으로는 칸 번호를 다시 계산할 수 없다'
        - '가운데 값이 시연에서 가장 자주 나온 값이기 때문이다'
        - '칸 안의 어떤 값과도 거리가 칸 폭의 절반 이하라서 최대 오차가 가장 작다'
      answer: 3
      explanation: |
        칸 안의 값은 칸의 어디에든 있을 수 있는데, 가운데는 양쪽 끝까지 거리가 같아서 가장 먼 값과도 칸 폭의 절반만
        떨어진다. 왼쪽 끝을 쓰면 오른쪽 끝 근처 값과의 거리가 칸 폭 전체에 가까워진다. 칸 안의 값이 모두 한 값으로
        돌아오므로 오차가 0 일 수는 없고, 가운데 값은 시연의 빈도와 상관없이 정해진다.
    - question: |
        binning 할 범위를 정해 두었는데 시연에 그 범위를 벗어난 값이 섞여 들어왔다. 칸 번호는 어떻게 정할까?
      choices:
        - '가장 가까운 범위 끝값으로 잘라(clip) 맨 끝 칸에 넣는다'
        - '범위 밖의 값만을 위한 새 칸을 하나 더 만든다'
        - '계산된 대로 음수이거나 마지막 번호보다 큰 칸 번호를 그대로 쓴다'
        - '범위 밖 값이 나올 때마다 범위를 넓혀 모든 칸을 다시 나눈다'
      answer: 0
      explanation: |
        범위 밖의 값을 가장 가까운 끝값으로 바꾸는 clip 을 한 뒤 칸 번호를 구하므로, 넘친 값은 맨 끝 칸에 들어간다. 칸
        개수는 미리 정해져 있어 새 칸을 만들 수 없고, 없는 번호의 칸에는 모델이 확률을 낼 수 없다. 값이 들어올 때마다
        범위를 바꾸면 이미 정한 칸 번호의 뜻이 달라져 학습한 확률을 쓸 수 없게 된다.

- topic: bin-decode-error
  title: 칸 개수의 선택과 binning 오차
  variants:
    - question: |
        action 범위는 그대로 두고 칸 개수만 두 배로 늘리면, 칸의 가운데 값으로 되돌렸을 때의 최대 오차는 어떻게 될까?
      choices:
        - '절반으로 줄어든다'
        - '두 배로 커진다'
        - '변하지 않는다'
        - '0 이 된다'
      answer: 0
      explanation: |
        최대 오차는 칸 폭의 절반이고, 같은 범위를 두 배 많은 칸으로 나누면 칸 폭이 절반이 되므로 최대 오차도 절반이 된다.
        칸이 많아질수록 촘촘해지므로 오차가 커지지는 않는다. 칸이 아무리 많아도 칸 하나에는 여러 값이 들어가므로 오차가
        0 이 되지는 않는다.
    - question: |
        오차를 줄이려고 action 차원 하나를 칸 수천 개로 나눴다. 이때 생기는 문제로 옳은 것은?
      choices:
        - '칸 폭이 넓어져 오차가 오히려 커진다'
        - 'softmax 로 만든 확률의 합이 1 을 넘는다'
        - '칸 대부분에 정답 시연이 거의 들어오지 않아, 칸마다 확률을 배울 근거가 모자란다'
        - '분류 문제가 다시 regression 문제로 바뀐다'
      answer: 2
      explanation: |
        시연 수는 그대로인데 칸이 아주 많아지면 칸 하나에 들어가는 정답이 거의 없어서, 정답을 한 번도 받지 못한 칸은
        확률을 얼마로 줘야 할지 배울 수 없다. 바로 옆 두 칸이 거의 같은 값인데도 서로 다른 class 로 따로 배워야 하는 것도
        같은 문제다. 칸이 많으면 폭은 좁아지고, softmax 의 합은 칸 수와 상관없이 1 이며, 칸이 많아도 여전히 칸을 고르는
        분류 문제다.
    - question: |
        두 action 차원이 같은 칸 개수로 나뉘어 있다. 한 차원은 움직일 수 있는 범위가 넓고 다른 차원은 범위가 좁다.
        binning 오차에 대한 설명으로 옳은 것은?
      choices:
        - '칸 개수가 같으므로 두 차원의 최대 오차도 같다'
        - '범위가 좁은 차원은 칸이 더 촘촘해서 최대 오차가 더 작다'
        - '범위가 넓은 차원의 최대 오차가 더 작다'
        - '범위와 상관없이 최대 오차는 칸 폭 전체다'
      answer: 1
      explanation: |
        칸 폭은 범위를 칸 개수로 나눈 값이라, 칸 개수가 같으면 범위가 좁은 차원의 칸 폭이 더 좁다. 최대 오차는 칸 폭의
        절반이므로 범위가 좁은 차원의 오차가 더 작다. 칸 개수만으로 오차가 정해지지는 않고, 가운데 값으로 되돌리면 최대
        오차는 칸 폭 전체가 아니라 절반이다.

- topic: cross-entropy
  title: 정답 칸의 확률로 매기는 cross-entropy
  variants:
    - question: |
        같은 장면의 시연이 절반은 왼쪽 칸, 절반은 오른쪽 칸을 정답으로 갖는다. 모델 A 는 두 정답 칸에 확률을 나눠 주고,
        모델 B 는 두 칸 사이에 있는 가운데 칸(어느 시연에도 정답이 아닌 칸)에 확률을 몰아준다. cross-entropy 로 비교하면?
      choices:
        - '모델 B 가 두 정답 모두에 가까운 칸을 골랐으므로 loss 가 더 작다'
        - '두 모델의 loss 는 같다'
        - 'cross-entropy 는 칸 사이의 거리를 재므로 모델 B 를 더 좋게 본다'
        - '모델 A 의 loss 가 더 작다. cross-entropy 는 정답 칸이 받은 확률만 보기 때문이다'
      answer: 3
      explanation: |
        cross-entropy 는 정답 칸에 준 확률 $p$ 로 $-\log p$ 를 매길 뿐 칸 사이의 거리를 보지 않는다. 모델 B 는 정답이 한
        번도 없는 칸에 확률을 몰아줘서 정답 칸의 확률이 작고 loss 가 크다. 가운데가 "가깝다" 는 것은 MSE 의 관점이고,
        cross-entropy 에서 정답이 아닌 칸은 바로 옆이어도 틀린 칸일 뿐이다.
    - question: |
        정답 칸에 준 확률을 $p$ 라 할 때 cross-entropy loss $-\log p$ 에 대한 설명으로 옳은 것은?
      choices:
        - '$p$ 가 커질수록 loss 도 커진다'
        - '$p$ 가 1 이면 loss 가 0 이고, $p$ 가 0 에 가까울수록 loss 가 끝없이 커진다'
        - 'loss 는 정답 칸 번호와 예측 칸 번호 차이의 제곱이다'
        - 'loss 는 항상 음수라서 학습은 loss 를 키우는 방향으로 간다'
      answer: 1
      explanation: |
        $\log p$ 는 $p = 1$ 에서 0 이고 $p$ 가 작아질수록 음수로 끝없이 작아지므로, 부호를 바꾼 $-\log p$ 는 0 이상이며
        정답 칸 확률이 작을수록 커진다. 그래서 $p$ 가 커질수록 loss 는 줄어든다. 칸 번호의 차이는 loss 에 들어가지 않고,
        loss 는 음수가 아니며 학습은 loss 를 줄이는 방향으로 간다.
    - question: |
        같은 장면의 시연 가운데 70% 는 왼쪽 칸, 30% 는 오른쪽 칸이 정답이다. 평균 cross-entropy 를 가장 작게 만드는 확률은?
      choices:
        - '왼쪽 칸 1, 나머지 칸 0'
        - '왼쪽 칸 0.5, 오른쪽 칸 0.5'
        - '왼쪽 칸 0.7, 오른쪽 칸 0.3'
        - '두 칸 사이의 가운데 칸 1'
      answer: 2
      explanation: |
        cross-entropy 를 평균하면 각 칸이 정답으로 나온 비율을 그대로 확률로 낼 때 가장 작아진다. 그래서 학습한 모델은
        시연이 갈린 비율대로 봉우리 두 개를 갖는다. 왼쪽에 1 을 주면 오른쪽이 정답인 시연에서 확률 0 이라 loss 가 끝없이
        커지고, 반반은 비율과 달라 더 크며, 가운데 칸은 정답이 한 번도 없는 칸이다.

- topic: action-selection
  title: 실행 때의 칸 선택과 차원별 선택의 문제
  variants:
    - question: |
        학습한 칸마다의 확률에서 실행할 칸을 고를 때, argmax 와 sampling 의 차이로 옳은 것은?
      choices:
        - 'argmax 는 확률대로 무작위로 고르고, sampling 은 가장 높은 칸을 고른다'
        - '두 방법 모두 같은 장면에서 늘 같은 칸을 고른다'
        - 'argmax 는 같은 장면에서 늘 확률이 가장 높은 칸을 고르고, sampling 은 확률이 낮은 칸도 가끔 고른다'
        - 'sampling 은 여러 칸의 가운데 값을 확률로 평균해 낸다'
      answer: 2
      explanation: |
        argmax 는 확률이 가장 큰 칸을 고르므로 같은 장면에서는 결과가 늘 같다. sampling 은 확률대로 제비를 뽑듯 고르므로
        매번 조금씩 다르고, 확률이 낮은 칸도 가끔 뽑힌다. 첫 보기는 두 방법을 거꾸로 적었고, 확률로 평균을 내면 다시
        regression 처럼 두 정답 사이의 값이 나온다.
    - question: |
        시연의 절반은 손끝을 왼쪽 위로, 절반은 오른쪽 아래로 옮겼다. 모델이 x 차원과 y 차원의 확률을 따로 내고 차원마다
        따로 칸을 고르면 어떤 문제가 생길까?
      choices:
        - '왼쪽 아래나 오른쪽 위처럼 시연에 없던 조합이 나올 수 있다'
        - '각 차원 안에서 두 봉우리가 평균 하나로 합쳐진다'
        - '차원마다 확률을 따로 내면 합이 1 을 넘어 고를 수 없다'
        - '각 차원이 시연의 비율을 지키므로 아무 문제가 없다'
      answer: 0
      explanation: |
        x 만 보면 왼쪽과 오른쪽이 반반, y 만 보면 위와 아래가 반반이라, 따로 고르면 "왼쪽·아래" 나 "오른쪽·위" 도 같은
        확률로 나온다. 차원 하나 안에서는 봉우리 두 개를 지키지만 차원 사이의 짝은 지키지 못한다. 각 차원의 확률은 따로
        합이 1 이라 고르는 데 문제가 없다.
    - question: |
        action 차원 여러 개를 앞에서 고른 값을 보고 다음 차원을 고르는 autoregressive 방식으로 내면 차원 사이의 짝을
        지킬 수 있다. 그런데도 1 초에 여러 번 action 을 내야 하는 로봇 policy 가 모든 차원을 한 번의 계산으로 함께 내기도
        하는 이유는?
      choices:
        - 'autoregressive 방식은 분류 문제에는 쓸 수 없다'
        - 'autoregressive 방식은 cross-entropy 로 학습할 수 없다'
        - '차원 사이의 짝은 binning 이 이미 지켜 준다'
        - '차원 수만큼 계산을 되풀이해야 해서 제어 주기 안에 끝내기 어렵다'
      answer: 3
      explanation: |
        autoregressive 방식은 차원 하나를 고를 때마다 모델을 한 번씩 다시 계산하므로, 차원이 많으면 action 하나에 걸리는
        시간이 그만큼 늘어 정해진 제어 주기를 맞추기 어렵다. 글을 token 하나씩 쓰는 언어 모델처럼 autoregressive 방식도
        분류이고 cross-entropy 로 학습한다. binning 은 차원 하나의 값을 칸으로 바꿀 뿐 차원 사이의 짝과는 관계가 없다.

- topic: film
  title: FiLM 으로 섞는 지시 문장
  variants:
    - question: |
        FiLM 이 지시 문장을 사진 처리에 섞는 방법으로 옳은 것은?
      choices:
        - '지시 문장의 embedding 을 사진 pixel 뒤에 이어 붙여 입력 channel 을 늘린다'
        - '지시의 embedding 에서 channel 마다 곱할 수 $\gamma$ 와 더할 수 $\beta$ 를 만들어 feature map 에 $\gamma x + \beta$ 를 한다'
        - '사진 처리가 모두 끝난 뒤 사진 요약과 지시 embedding 을 평균한다'
        - '학습이 끝나면 고정되는 $\gamma$, $\beta$ 를 어떤 지시에나 똑같이 쓴다'
      answer: 1
      explanation: |
        FiLM 은 지시 문장의 embedding 에 학습한 행렬을 곱해 channel 마다 $\gamma$ 와 $\beta$ 를 만들고, 그 channel 의 모든
        칸에 같은 곱셈과 덧셈을 한다. 그래서 같은 사진이라도 지시에 따라 키우는 channel 이 달라진다. 입력에 이어 붙이거나
        끝에서 평균하는 것은 FiLM 이 아니다. 고정된 $\gamma$, $\beta$ 를 쓰는 것은 batch normalization 이고, FiLM 은 이 두
        값을 지시에서 그때그때 만든다.
    - question: |
        사진을 처리하는 CNN 이 사진 요약을 다 끝낸 뒤에 지시를 붙이지 않고, 처리 도중에 지시를 섞는 이유는?
      choices:
        - '도중에 섞어야 CNN 의 parameter 수가 줄어든다'
        - '지시 문장이 사진보다 숫자가 많아서 먼저 넣어야 한다'
        - '끝난 뒤에 붙이면 지시가 action 에 전혀 영향을 줄 수 없다'
        - '지시에 맞는 물체의 feature 는 키우고 상관없는 것은 줄인 채 다음 층으로 넘길 수 있다'
      answer: 3
      explanation: |
        지시를 모르는 CNN 은 사진 속 물체들을 모두 적당히 담아야 해서, 정작 지시한 물체의 정보가 흐려질 수 있다. 처리 도중에
        지시를 섞으면 층들이 지시한 물체 쪽 값을 키우고 나머지를 줄여 필요한 feature 를 일찍 뽑는다. 끝에 붙여도 지시는
        action 에 영향을 주지만 사진 요약이 지시에 맞춰지지 않을 뿐이고, parameter 수나 숫자의 양이 이유는 아니다.
    - question: |
        미리 학습한(pretrained) CNN 의 층 사이에 새로 FiLM 을 끼워 넣을 때, FiLM 의 행렬을 모두 0 으로 시작하는 이유는?
      choices:
        - '처음에 $\gamma = 1$, $\beta = 0$ 이 되어 pretrained 층의 값을 바꾸지 않으므로 미리 배운 능력이 망가지지 않는다'
        - '행렬이 0 이면 FiLM 이 학습되지 않아 계산이 빨라진다'
        - '행렬이 0 이면 모든 지시가 같은 embedding 을 갖게 되어 학습이 쉬워진다'
        - '0 으로 시작해야 $\gamma$ 가 학습 내내 음수가 되지 않는다'
      answer: 0
      explanation: |
        행렬이 0 이면 어떤 지시가 오든 $\gamma = 1$, $\beta = 0$ 이라 FiLM 은 값을 그대로 내보내는 identity 가 된다. 그래서
        학습 첫 step 에 pretrained CNN 이 원래대로 작동하고, 행렬이 조금씩 0 에서 벗어나며 지시를 섞기 시작한다. 행렬은
        0 에서 시작할 뿐 계속 학습되고, embedding 은 행렬과 상관없이 문장마다 다르며, $\gamma$ 의 부호를 막는 장치도 아니다.

- topic: tokenlearner
  title: TokenLearner 와 attention 계산량
  variants:
    - question: |
        Transformer 에 넣는 token 수를 약 10 분의 1 로 줄이면, attention 이 층마다 매기는 점수의 개수는 대략 어떻게 될까?
      choices:
        - '약 100 분의 1 로 준다'
        - '약 10 분의 1 로 준다'
        - '변하지 않는다'
        - '약 20 분의 1 로 준다'
      answer: 0
      explanation: |
        attention 은 모든 token 쌍에 점수를 매기므로 점수 표의 칸 수가 token 수의 제곱이다. token 수가 10 분의 1 이 되면
        칸 수는 $10 \times 10$, 곧 100 분의 1 이 된다. token 수에 비례한다고 보면 10 분의 1 이 나오고, 점수 개수는 token
        수와 상관없이 고정된 값이 아니다.
    - question: |
        TokenLearner 가 사진 한 장의 image token 여러 개를 적은 수로 줄이는 방법으로 옳은 것은?
      choices:
        - '점수가 가장 높은 token 몇 개만 남기고 나머지는 버린다'
        - '사진에서 중요한 구역을 사람이 미리 정해 그 token 만 남긴다'
        - '출력 token 마다 입력 token 전체에 합이 1 인 weight 를 매겨 가중 평균하고, weight 는 사진을 보고 그때그때 계산한다'
        - '입력 token 전체를 똑같은 비율로 평균해 하나로 만든다'
      answer: 2
      explanation: |
        TokenLearner 는 고르지 않고 섞는다. 출력 token 마다 입력 token 모두에 weight 를 주어 가중 평균하므로 버려지는
        token 이 없고, 중요한 token 에서 많이 가져온다. weight 는 작은 network 가 사진을 보고 계산해서 물체 위치가 바뀌면
        weight 도 따라 바뀐다. 사람이 구역을 정하지 않으며, 똑같은 비율로 평균하면 어디에 무엇이 있는지가 뭉개진다.
    - question: |
        policy 가 지금 사진 한 장만 보지 않고 최근 사진 여러 장(history)을 함께 보는 이유는?
      choices:
        - '사진이 많을수록 token 수가 줄어 계산이 빨라진다'
        - '서랍을 여는 중인지 닫는 중인지처럼 한 장으로는 알 수 없는 움직임의 방향을 알 수 있다'
        - '사진 한 장으로는 지시 문장과 섞을 수 없다'
        - 'binning 오차를 줄이려면 사진이 여러 장 있어야 한다'
      answer: 1
      explanation: |
        반쯤 열린 서랍 사진 한 장으로는 여는 중인지 닫는 중인지 알 수 없지만, 앞 사진들에서 서랍이 점점 벌어졌다면 여는
        중이다. 사진이 늘면 token 도 늘어 계산은 오히려 많아진다. 지시는 사진 한 장에도 섞을 수 있고, binning 오차는 칸
        폭으로 정해져 사진 수와 관계가 없다.

- topic: generalization
  title: 처음 보는 지시와 시연에 없는 동작의 한계
  variants:
    - question: |
        "집기" 와 "서랍 열기" 동작은 시연에 있고 "병뚜껑 돌려 열기" 는 한 번도 없다. 이 시연으로 behavior cloning 학습한
        지시 따르는 policy 에 대한 설명으로 옳은 것은?
      choices:
        - '지시 문장을 이해하므로 병뚜껑 돌려 열기도 해낸다'
        - '처음 보는 물체는 집지 못하지만 처음 보는 동작은 해낸다'
        - '시연 수가 충분히 많으면 시연에 없는 동작도 스스로 만들어 낸다'
        - '본 적 있는 동작과 물체의 새 조합은 해낼 수 있지만, 시연에 없는 돌려 여는 동작은 만들어 내지 못한다'
      answer: 3
      explanation: |
        이런 policy 가 배운 것은 시연 속 사진·지시와 action 의 짝이라서, 본 적 있는 동작을 본 적 있는 물체에 새로 짝짓는
        일은 해내지만 한 번도 없던 동작은 만들 근거가 없다. 지시 문장을 숫자로 바꿀 수 있다고 그 단어에 맞는 동작을 아는
        것은 아니다. 처음 보는 조합에 강하고 새 동작에 약하므로 두 번째 보기는 거꾸로이고, 시연이 많아도 그 안에 없는
        동작은 여전히 없다.
    - question: |
        시연을 더 모아 처음 보는 지시에 대한 일반화를 높이려 한다. 어느 쪽이 더 효과적일까?
      choices:
        - '이미 시연이 많은 지시의 시연을 더 늘린다'
        - '새 물체·새 동작 조합의 지시를 더해 지시의 종류를 늘린다'
        - '있는 시연을 여러 번 복사해 데이터 양을 늘린다'
        - '시연이 적은 지시를 빼서 지시마다 시연 수를 고르게 맞춘다'
      answer: 1
      explanation: |
        지시 따르는 policy 의 일반화는 데이터의 양보다 다양성에 더 크게 좌우된다. 시연이 적은 지시 몇 가지를 빼서 양이
        거의 줄지 않았는데도, 종류는 그대로 두고 양을 크게 줄였을 때만큼 일반화가 떨어진 실험 결과가 있다. 같은 지시를
        더 모으거나 복사하는 것은 양만 늘리고, 지시를 빼는 것은 오히려 종류를 줄인다.
    - question: |
        칸마다 확률을 내는 지시 따르는 policy 가 시연에 없던 동작을 만들어 내지 못하는 이유로 가장 알맞은 것은?
      choices:
        - '지시 문장 encoder 가 처음 보는 단어를 숫자로 바꾸지 못하기 때문이다'
        - 'binning 오차 때문에 새 동작이 부정확하게 나오기 때문이다'
        - '칸마다의 확률은 시연에서 각 칸이 정답으로 나온 비율을 배운 것이라, 시연에 없는 움직임에 높은 확률을 줄 근거가 없기 때문이다'
        - 'Transformer 에 넣는 token 수가 부족하기 때문이다'
      answer: 2
      explanation: |
        cross-entropy 로 학습한 모델은 시연에서 정답으로 나온 칸에 확률을 주도록 배운다. 시연에 없던 움직임의 순서는 어느
        칸에서도 정답으로 나온 적이 없어서 모델이 그 순서를 만들 근거가 없다. 문장 encoder 는 어떤 문장이든 숫자로 바꾸지만
        그 숫자에 짝지어 배운 action 이 없을 뿐이다. binning 오차는 칸 폭 절반만큼의 작은 오차이고, token 수는 계산량의
        문제다.
