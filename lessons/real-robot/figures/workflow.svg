<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 305" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>실물 팔에 policy 를 올리는 네 단계: 시연 수집, 학습, 추론 loop, 평가. 평가에서 찾은 약점은 시연 수집으로 돌아가 보완한다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="658" height="303" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16" y="50" width="142" height="170" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="87" y="78" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">1. 시연 수집</text>
  <text x="87" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle">teleoperation</text>
  <text x="87" y="136" fill="#e2e8f0" font-size="12" text-anchor="middle">5 자리 × 10 번 = 50 개</text>
  <text x="87" y="162" fill="#e2e8f0" font-size="12" text-anchor="middle">8 초 × 30 fps = 240</text>
  <text x="87" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">frame 12,000 개</text>
  <rect x="178" y="50" width="142" height="170" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="249" y="78" fill="#a78bfa" font-size="15" text-anchor="middle" font-weight="600">2. 학습</text>
  <text x="249" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle">(사진 + 관절 6 개)</text>
  <text x="249" y="136" fill="#e2e8f0" font-size="12" text-anchor="middle">→ 목표 각도</text>
  <text x="249" y="162" fill="#e2e8f0" font-size="12" text-anchor="middle">시연 행동을 정답으로</text>
  <text x="249" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">ACT 약 8 천만 parameter</text>
  <rect x="340" y="50" width="142" height="170" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="411" y="78" fill="#38bdf8" font-size="15" text-anchor="middle" font-weight="600">3. 추론 loop</text>
  <text x="411" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle">33.3 ms 마다</text>
  <text x="411" y="136" fill="#e2e8f0" font-size="12" text-anchor="middle">사진 → policy</text>
  <text x="411" y="162" fill="#e2e8f0" font-size="12" text-anchor="middle">→ 목표 각도 → servo</text>
  <text x="411" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">chunk 100 개 = 3.3 초</text>
  <rect x="502" y="50" width="142" height="170" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="573" y="78" fill="#34d399" font-size="15" text-anchor="middle" font-weight="600">4. 평가</text>
  <text x="573" y="110" fill="#e2e8f0" font-size="12" text-anchor="middle">배치 25 개에서 시도</text>
  <text x="573" y="136" fill="#e2e8f0" font-size="12" text-anchor="middle">성공 20 / 25 = 80%</text>
  <text x="573" y="162" fill="#e2e8f0" font-size="12" text-anchor="middle">구간 61% ~ 91%</text>
  <text x="573" y="188" fill="#94a3b8" font-size="12" text-anchor="middle">실패 종류별로 세기</text>
  <line x1="160" y1="135" x2="191" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="322" y1="135" x2="353" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="484" y1="135" x2="515" y2="135" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M573,222 L573,262 L87,262 L87,226" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="330" y="284" fill="#f87171" font-size="13" text-anchor="middle">약한 자리를 찾으면 그 자리의 시연을 더 모아 다시 학습한다</text>
  <text x="330" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">실물 팔에 policy 를 올리는 네 단계</text>
</svg>
