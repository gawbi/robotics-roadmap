<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>카메라가 옆으로 1 cm 밀리면 0.5 m 아래의 큐브가 사진에서 10 pixel 옮겨 찍히고, policy 는 관절을 2° 틀리게 돌려 집게 끝이 약 1 cm 빗나간다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="618" height="308" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="40" y="30" fill="#94a3b8" font-size="12.5" text-anchor="start">옆에서 본 모습</text>
  <line x1="30" y1="230" x2="300" y2="230" stroke="#475569" stroke-width="3"/>
  <text x="290" y="250" fill="#94a3b8" font-size="12" text-anchor="end">책상</text>
  <rect x="135" y="50" width="36" height="22" rx="4" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <rect x="155" y="50" width="36" height="22" rx="4" fill="#111a2e" stroke="#d6aa62" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="118" y="66" fill="#7cb4d8" font-size="12" text-anchor="end">시연 때</text>
  <text x="198" y="66" fill="#d6aa62" font-size="12" text-anchor="start">밀린 뒤</text>
  <line x1="153" y1="80" x2="153" y2="112" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="173" y1="80" x2="173" y2="112" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="163" y="96" fill="#94a3b8" font-size="13" text-anchor="middle"></text>
  <path d="M153,42 L173,42" fill="none" stroke="#d88b8b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="182" y="46" fill="#d88b8b" font-size="12" text-anchor="start">1 cm</text>
  <line x1="60" y1="72" x2="60" y2="228" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="68" y="156" fill="#94a3b8" font-size="12" text-anchor="start">0.5 m</text>
  <rect x="146" y="214" width="16" height="16" fill="#d88b8b"/>
  <text x="154" y="206" fill="#d88b8b" font-size="12" text-anchor="middle">큐브 (그대로)</text>
  <text x="470" y="30" fill="#94a3b8" font-size="12.5" text-anchor="middle">사진 (f = 500 pixel)</text>
  <rect x="350" y="44" width="240" height="180" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="462" y="126" width="18" height="18" fill="#d88b8b" fill-opacity="0.45" stroke="#7cb4d8" stroke-width="2"/>
  <rect x="452" y="126" width="18" height="18" fill="#d88b8b" stroke="#d6aa62" stroke-width="2" stroke-dasharray="3 2"/>
  <path d="M475,162 L455,162" fill="none" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="466" y="182" fill="#d6aa62" font-size="12.5" text-anchor="middle">10 pixel 옮겨 찍힘</text>
  <text x="470" y="248" fill="#e2e8f0" font-size="13" text-anchor="middle">500 × 0.01 ÷ 0.5 = 10 pixel</text>
  <text x="470" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">u 가 100 늘 때 관절 20° 를 배운 policy → 2° 틀림</text>
  <text x="470" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">집게 끝 30 cm 에서 약 1 cm 빗나감</text>
</svg>
