<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>동기 추론은 chunk 를 다 쓴 뒤 300 ms 동안 추론하느라 팔이 멈추고, 비동기 추론은 queue 에 10 개가 남았을 때 다음 추론을 시작해 멈춤 없이 이어진다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="65" fill="#e2e8f0" font-size="13.5" text-anchor="start">동기</text>
  <rect x="99.99998725" y="78" width="1.2750000000000002e-05" height="14" rx="3" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <rect x="100.0" y="50" width="212.5425" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <rect x="312.5425" y="50" width="38.25" height="22" rx="3" fill="#f8717133" stroke="#d88b8b" stroke-width="1"/>
  <rect x="312.5425" y="78" width="38.25" height="14" rx="3" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <rect x="350.7925" y="50" width="212.5425" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <rect x="563.335" y="50" width="38.25" height="22" rx="3" fill="#f8717133" stroke="#d88b8b" stroke-width="1"/>
  <rect x="563.335" y="78" width="38.25" height="14" rx="3" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <rect x="601.585" y="50" width="8.415000000000001" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <text x="610" y="114" fill="#94a3b8" font-size="12" text-anchor="end">chunk 50 개(1667 ms)를 다 쓴 뒤에 추론 300 ms → 그동안 팔이 멈춘다 (빨강)</text>
  <text x="20" y="165" fill="#e2e8f0" font-size="13.5" text-anchor="start">비동기</text>
  <rect x="100.0" y="150" width="212.5425" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <rect x="270.08500000000004" y="178" width="38.25" height="14" rx="3" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <rect x="312.5425" y="150" width="212.5425" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <rect x="482.6275" y="178" width="38.25" height="14" rx="3" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <rect x="525.085" y="150" width="84.915" height="22" rx="3" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <text x="610" y="214" fill="#94a3b8" font-size="12" text-anchor="end">queue 에 10 개(333 ms)가 남았을 때 추론을 시작 → 멈춤 없이 이어진다</text>
  <text x="291.25" y="140" fill="#94a3b8" font-size="13" text-anchor="middle"></text>
  <line x1="100" y1="250" x2="610" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="100.0" y1="246" x2="100.0" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="100.0" y="272" fill="#64748b" font-size="12" text-anchor="middle">0 초</text>
  <line x1="227.5" y1="246" x2="227.5" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="227.5" y="272" fill="#64748b" font-size="12" text-anchor="middle">1 초</text>
  <line x1="355.0" y1="246" x2="355.0" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="355.0" y="272" fill="#64748b" font-size="12" text-anchor="middle">2 초</text>
  <line x1="482.5" y1="246" x2="482.5" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="482.5" y="272" fill="#64748b" font-size="12" text-anchor="middle">3 초</text>
  <line x1="610.0" y1="246" x2="610.0" y2="254" stroke="#475569" stroke-width="1.5"/>
  <text x="610.0" y="272" fill="#64748b" font-size="12" text-anchor="middle">4 초</text>
  <rect x="110" y="290" width="14" height="12" rx="2" fill="#38bdf833" stroke="#7cb4d8" stroke-width="1"/>
  <text x="130" y="300" fill="#94a3b8" font-size="12" text-anchor="start">목표를 보내며 움직임</text>
  <rect x="280" y="290" width="14" height="12" rx="2" fill="#a78bfa44" stroke="#a99ad6" stroke-width="1"/>
  <text x="300" y="300" fill="#94a3b8" font-size="12" text-anchor="start">추론 300 ms</text>
  <rect x="410" y="290" width="14" height="12" rx="2" fill="#f8717133" stroke="#d88b8b" stroke-width="1"/>
  <text x="430" y="300" fill="#94a3b8" font-size="12" text-anchor="start">추론을 기다리며 멈춤</text>
</svg>
