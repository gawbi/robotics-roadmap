<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ACT 25 번 시도의 결과. 성공 20 번, 실패 5 번은 접근 빗나감 2, 쥐기 실패 1, 놓기 빗나감 1, 멈춤·떨림 1 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#94a3b8" font-size="13" text-anchor="start">ACT 25 번 시도의 결과</text>
  <rect x="40" y="48" width="446.0" height="34" rx="3" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="263.0" y="70" fill="#0b1220" font-size="12.5" text-anchor="middle" font-weight="600">성공 20</text>
  <rect x="488.0" y="48" width="42.8" height="34" rx="3" fill="#d88b8b" fill-opacity="0.8"/>
  <rect x="532.8" y="48" width="20.4" height="34" rx="3" fill="#d6aa62" fill-opacity="0.8"/>
  <rect x="555.1999999999999" y="48" width="20.4" height="34" rx="3" fill="#a99ad6" fill-opacity="0.8"/>
  <rect x="577.5999999999999" y="48" width="20.4" height="34" rx="3" fill="#7cb4d8" fill-opacity="0.8"/>
  <text x="40" y="100" fill="#94a3b8" font-size="11.5" text-anchor="middle">0</text>
  <text x="600" y="100" fill="#94a3b8" font-size="11.5" text-anchor="middle">25</text>
  <text x="544.0" y="100" fill="#d88b8b" font-size="12" text-anchor="middle">실패 5</text>
  <text x="130" y="143" fill="#e2e8f0" font-size="13" text-anchor="end">접근 빗나감</text>
  <rect x="140" y="128" width="80" height="20" rx="3" fill="#d88b8b" fill-opacity="0.85"/>
  <text x="228" y="143" fill="#d88b8b" font-size="12.5" text-anchor="start">2</text>
  <text x="240" y="143" fill="#94a3b8" font-size="12" text-anchor="start">집게가 큐브 옆 몇 cm 자리로 내려간다 · 2 번 모두 오른쪽 끝 배치</text>
  <text x="130" y="179" fill="#e2e8f0" font-size="13" text-anchor="end">쥐기 실패</text>
  <rect x="140" y="164" width="40" height="20" rx="3" fill="#d6aa62" fill-opacity="0.85"/>
  <text x="188" y="179" fill="#d6aa62" font-size="12.5" text-anchor="start">1</text>
  <text x="240" y="179" fill="#94a3b8" font-size="12" text-anchor="start">쥐었다가 들어 올리는 중에 미끄러진다</text>
  <text x="130" y="215" fill="#e2e8f0" font-size="13" text-anchor="end">놓기 빗나감</text>
  <rect x="140" y="200" width="40" height="20" rx="3" fill="#a99ad6" fill-opacity="0.85"/>
  <text x="188" y="215" fill="#a99ad6" font-size="12.5" text-anchor="start">1</text>
  <text x="240" y="215" fill="#94a3b8" font-size="12" text-anchor="start">상자 가장자리에 걸친다</text>
  <text x="130" y="251" fill="#e2e8f0" font-size="13" text-anchor="end">멈춤·떨림</text>
  <rect x="140" y="236" width="40" height="20" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="188" y="251" fill="#7cb4d8" font-size="12.5" text-anchor="start">1</text>
  <text x="240" y="251" fill="#94a3b8" font-size="12" text-anchor="start">중간에 멈추거나 같은 자리에서 떤다</text>
  <text x="320" y="284" fill="#94a3b8" font-size="12.5" text-anchor="middle">실패 5 번을 영상으로 보며 모습별로 센다 → 가장 많은 접근 빗나감부터 원인을 찾는다</text>
</svg>
