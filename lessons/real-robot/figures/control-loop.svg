  <title>추론 loop 의 시간표. tick 0 과 tick 100 에서만 사진을 보고 ACT 로 추론해 목표 100 개를 queue 에 넣고, tick 마다 하나씩 꺼내 servo 에 보내면 servo 안의 PID 가 관절을 목표로 움직인다</title>
