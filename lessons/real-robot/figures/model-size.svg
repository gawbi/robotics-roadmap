<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>네 모델의 메모리와 모델 전체를 한 번 읽는 최소 시간. 메모리는 모두 36 GB 안에 들어가지만 OpenVLA 는 한 번 읽기도 tick 33.3 ms 보다 길고 action 하나에 7 번 읽는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="638" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#94a3b8" font-size="13" text-anchor="start">메모리 (GB) — 36 GB 노트북</text>
  <text x="100" y="63" fill="#e2e8f0" font-size="13" text-anchor="end">ACT</text>
  <rect x="110" y="48" width="3.9200000000000017" height="20" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="121.92" y="63" fill="#7cb4d8" font-size="12.5" text-anchor="start">0.32 GB</text>
  <text x="100" y="93" fill="#e2e8f0" font-size="13" text-anchor="end">SmolVLA</text>
  <rect x="110" y="78" width="11.025000000000006" height="20" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="129.025" y="93" fill="#7cb4d8" font-size="12.5" text-anchor="start">0.9 GB</text>
  <text x="100" y="123" fill="#e2e8f0" font-size="13" text-anchor="end">π0</text>
  <rect x="110" y="108" width="80.85" height="20" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="198.85" y="123" fill="#7cb4d8" font-size="12.5" text-anchor="start">6.6 GB</text>
  <text x="100" y="153" fill="#e2e8f0" font-size="13" text-anchor="end">OpenVLA</text>
  <rect x="110" y="138" width="171.5" height="20" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="289.5" y="153" fill="#7cb4d8" font-size="12.5" text-anchor="start">14 GB</text>
  <line x1="551.0" y1="42" x2="551.0" y2="168" stroke="#d6aa62" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="545.0" y="182" fill="#d6aa62" font-size="12.5" text-anchor="middle">36 GB</text>
  <text x="20" y="214" fill="#94a3b8" font-size="13" text-anchor="start">모델 전체를 한 번 읽는 최소 시간 (1초에 400 GB 를 읽는다고 둘 때)</text>
  <text x="100" y="243" fill="#e2e8f0" font-size="13" text-anchor="end">ACT</text>
  <rect x="110" y="228" width="2" height="20" rx="3" fill="#a99ad6" fill-opacity="0.85"/>
  <text x="180.7576923076923" y="243" fill="#a99ad6" font-size="12.5" text-anchor="start">0.8 ms</text>
  <text x="100" y="273" fill="#e2e8f0" font-size="13" text-anchor="end">SmolVLA</text>
  <rect x="110" y="258" width="4.240384615384613" height="20" rx="3" fill="#a99ad6" fill-opacity="0.85"/>
  <text x="180.7576923076923" y="273" fill="#a99ad6" font-size="12.5" text-anchor="start">2.3 ms</text>
  <text x="100" y="303" fill="#e2e8f0" font-size="13" text-anchor="end">π0</text>
  <rect x="110" y="288" width="31.09615384615384" height="20" rx="3" fill="#a99ad6" fill-opacity="0.85"/>
  <text x="180.7576923076923" y="303" fill="#a99ad6" font-size="12.5" text-anchor="start">16.5 ms</text>
  <text x="100" y="333" fill="#e2e8f0" font-size="13" text-anchor="end">OpenVLA</text>
  <rect x="110" y="318" width="65.96153846153845" height="20" rx="3" fill="#a99ad6" fill-opacity="0.85"/>
  <rect x="175.96153846153845" y="318" width="395.76923076923083" height="20" rx="3" fill="#a99ad6" fill-opacity="0.3" stroke="#a99ad6" stroke-dasharray="4 3"/>
  <text x="565.7307692307693" y="333" fill="#e2e8f0" font-size="12" text-anchor="end">35 ms × 7 번 = 245 ms (action 하나)</text>
  <line x1="172.7576923076923" y1="222" x2="172.7576923076923" y2="348" stroke="#7fc4a2" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="178.7576923076923" y="364" fill="#7fc4a2" font-size="12.5" text-anchor="start">tick 33.3 ms</text>
</svg>
