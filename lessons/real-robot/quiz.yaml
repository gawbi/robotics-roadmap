# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: loop-timing
  title: 제어 주기와 action chunk queue
  variants:
    - question: |
        면접관: "30 fps 로 기록한 시연으로 학습한 policy 를 실물 팔에서 실행할 때, 목표 각도를 보내는 주기를 시연 기록 주기와 같게 맞춰야 하는
        이유는 무엇인가요?"
      choices:
        - '주기가 다르면 policy 가 추론을 아예 할 수 없기 때문이다'
        - 'policy 는 한 frame 뒤에 갈 각도를 배웠으므로, 주기가 다르면 같은 동작이 느리게 또는 빠르게 재생되기 때문이다'
        - 'servo 는 한 가지 주기의 명령만 받을 수 있기 때문이다'
        - '주기를 맞추지 않으면 카메라가 사진을 찍지 못하기 때문이다'
      answer: 1
      explanation: |
        시연의 한 frame 은 정해진 시간 간격이고, policy 는 그 간격마다 바뀌는 목표를 배웠다. 30 fps 시연의 목표를 50 ms 마다 보내면 같은 동작이
        1.5 배 느려지고, 더 짧게 보내면 빨라진다. 추론은 주기와 상관없이 할 수 있으므로 첫째 보기는 틀렸다. servo 는 여러 주기의 목표를 받을 수
        있으므로 셋째 보기도 틀렸다. 카메라는 policy 가 목표를 보내는 주기와 상관없이 사진을 찍으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "ACT 처럼 추론 한 번에 action 100 개를 내는 policy 를 30 Hz 로봇에서 쓸 때, 로봇이 움직이는 방식을 바르게 설명한 것은
        무엇인가요?"
      choices:
        - '로봇은 3.3 초에 한 번만 새 목표를 받고, 그사이에는 멈춰 있다'
        - '100 개를 한꺼번에 servo 에 보내 servo 가 알아서 나눠 실행한다'
        - '100 개 가운데 마지막 목표 하나만 보내고 나머지는 버린다'
        - '100 개를 queue 에 넣고 tick 마다 하나씩 꺼내 보내므로, 로봇은 33.3 ms 마다 새 목표를 받고 사진을 보고 결정하는 횟수만 줄어든다'
      answer: 3
      explanation: |
        chunk 는 queue 에 들어가고 tick 마다 맨 앞의 목표 하나가 servo 로 간다. 그래서 움직임은 30 Hz 그대로이고, 3.3 초에 한 번으로 줄어드는 것은
        새 사진을 보고 추론하는 횟수다. 로봇이 3.3 초 동안 멈춰 있지는 않으므로 첫째 보기는 틀렸다. servo 는 목표 하나를 받아 따라가는 장치라서
        100 개를 한꺼번에 받지 않으므로 둘째 보기도 틀렸다. 마지막 목표만 보내면 중간 움직임이 사라지므로 셋째 보기도 틀렸다.
    - question: |
        면접관: "action chunk 가 길수록 생기는 대가는 무엇인가요?"
      choices:
        - 'chunk 를 실행하는 동안 새 사진을 보지 않아서, 물체가 밀려도 다음 추론까지 반응하지 못한다'
        - 'servo 가 목표를 받는 주기가 chunk 길이만큼 길어진다'
        - '추론이 끝나야 하는 시한이 짧아진다'
        - 'policy 가 관절 각도를 입력으로 받지 못한다'
      answer: 0
      explanation: |
        chunk 를 다 쓰기 전에는 새 관측을 반영하지 않으므로 chunk 가 길수록 바뀐 상황에 늦게 반응한다. servo 는 chunk 길이와 상관없이 tick 마다
        목표를 받으므로 둘째 보기는 틀렸다. chunk 가 길면 다음 추론까지 시간이 늘어 시한은 오히려 길어지므로 셋째 보기도 틀렸다. 관절 각도
        입력은 chunk 길이와 관계없이 받으므로 넷째 보기도 틀렸다.

- topic: async-inference
  title: 동기 추론과 비동기 추론
  variants:
    - question: |
        면접관: "추론에 300 ms 가 걸리는 VLA 를 30 Hz 로봇에서 chunk 단위로 실행합니다. queue 가 완전히 빈 뒤에 다음 추론을 시작하면 어떤
        일이 생기고, 어떻게 피하나요?"
      choices:
        - '추론 시간이 tick 보다 길면 policy 가 오류를 내므로, 더 작은 모델로 바꾸는 방법뿐이다'
        - 'queue 가 비어도 servo 가 이전 chunk 를 처음부터 다시 실행하므로 문제가 없다'
        - '추론하는 300 ms 동안 새 목표가 없어 팔이 멈추고, queue 에 남은 목표의 실행 시간이 추론 시간 이상일 때 미리 다음 추론을 시작하면 멈춤이 없다'
        - 'chunk 의 목표를 두 배 빠르게 꺼내 추론 시간을 메운다'
      answer: 2
      explanation: |
        queue 가 빈 뒤에 추론을 시작하는 동기 방식에서는 추론 시간만큼 팔이 멈춘다. 비동기 추론은 남은 개수 × tick 이 추론 시간 이상일 때 미리
        시작해 새 chunk 가 queue 가 비기 전에 도착하게 한다. 추론이 tick 보다 길어도 오류가 나지는 않고 비동기로 해결할 수 있으므로 첫째 보기는
        틀렸다. servo 는 chunk 를 다시 실행하지 않고 마지막 목표에 머무르므로 둘째 보기도 틀렸다. 목표를 빨리 꺼내면 동작이 시연보다
        빨라지므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "비동기 추론을 쓰면 policy 가 받는 관측에는 어떤 일이 생기나요?"
      choices:
        - '새 chunk 는 추론을 시작한 시점의 사진으로 계산되므로, 도착했을 때 이미 지나간 tick 의 몫이 앞에 섞여 있다'
        - '관측이 tick 마다 policy 에 들어가 chunk 가 필요 없어진다'
        - '관측을 전혀 쓰지 않고 이전 chunk 를 되풀이한다'
        - '관측이 미래 시점의 것이 되어 지연이 0 보다 작아진다'
      answer: 0
      explanation: |
        비동기 추론은 실행과 계산을 겹치게 할 뿐 계산 시간 자체는 그대로라서, 새 chunk 는 추론 시간만큼 오래된 사진으로 만들어진다. 그래서
        도착한 chunk 의 앞쪽은 이미 지난 tick 의 몫이고, 이를 버리거나 섞어서 이어 붙인다. 비동기에서도 chunk 단위로 실행하므로 둘째 보기는
        틀렸다. 남은 queue 가 비기 전에 새 관측으로 추론하므로 셋째 보기도 틀렸다. 관측은 언제나 과거의 것이라 지연이 음수가 될 수 없으므로
        넷째 보기도 틀렸다.
    - question: |
        면접관: "SmolVLA 저자들은 실물 팔에서 동기와 비동기 추론을 비교했습니다. 비동기 추론의 효과로 가장 알맞은 설명은 무엇인가요?"
      choices:
        - '모든 과제에서 성공률이 크게 올랐다'
        - '추론 한 번에 걸리는 시간이 절반으로 줄었다'
        - 'policy 의 parameter 수가 줄어 메모리를 덜 썼다'
        - '추론 동안의 멈춤이 사라져 과제를 끝내는 시간이 짧아졌지만, 성공률이 늘 같거나 좋아지는 것은 아니었다'
      answer: 3
      explanation: |
        이 실험에서 비동기 추론은 과제 하나를 끝내는 평균 시간을 13.75 초에서 9.70 초로 줄였다. 평균 성공률은 78.3% 와 73.3% 로 비슷했지만 분류
        과제는 70% 에서 50% 로 내려갔다. 성공률이 모든 과제에서 오른 것이 아니므로 첫째 보기는 틀렸다. 비동기는 추론 시간을 실행과 겹칠 뿐 추론 자체를
        빠르게 하지 않으므로 둘째 보기도 틀렸다. 모델은 그대로라 parameter 수와 메모리도 같으므로 셋째 보기도 틀렸다.

- topic: chunk-merge
  title: 늦게 도착한 chunk 의 합치기와 blending
  variants:
    - question: |
        면접관: "비동기 추론에서 추론에 9 tick 이 걸렸습니다. 새 chunk 를 남은 queue 에 aligned 방식으로 합치면 어떻게 되나요?"
      choices:
        - '새 chunk 를 남은 queue 의 맨 뒤에 그대로 이어 붙인다'
        - '남은 queue 를 끝까지 실행한 뒤에야 새 chunk 를 쓴다'
        - '새 chunk 의 목표를 9 배 빠르게 실행해 늦은 만큼을 따라잡는다'
        - '새 chunk 의 앞 9 개는 이미 지나간 tick 의 몫이라 버리고, 지금 tick 의 몫부터 남은 queue 의 미래 부분을 새 값으로 바꾼다'
      answer: 3
      explanation: |
        새 chunk 의 첫 목표는 추론을 시작한 tick 에 보냈어야 할 값이라, 9 tick 뒤에 도착하면 앞 9 개는 이미 지난 시각의 몫이다. aligned 방식은 이를
        버리고 지금 시각의 몫부터 쓴다. 맨 뒤에 이어 붙이는 것은 append 방식이라 첫째 보기는 aligned 의 설명이 아니다. 남은 queue 를 끝까지
        기다리면 새 관측을 늦게 반영하므로 둘째 보기도 틀렸다. 목표를 빨리 실행하면 동작이 바뀌므로 셋째 보기도 틀렸다.
    - question: |
        면접관: "상자를 왼쪽(−20°)이나 오른쪽(+20°)으로 돌아가는 시연이 반반인 장면에서, 남은 queue 는 왼쪽 길을 골랐고 새 chunk 는
        오른쪽 길을 골랐습니다. 두 목표를 0.5 씩 섞는 blending 을 쓰면 어떻게 되나요?"
      choices:
        - '두 길 가운데 더 안전한 쪽을 blending 이 골라 준다'
        - '섞은 목표가 0° 가 되어 두 시연 모두 피하던 상자 쪽으로 간다'
        - '새 chunk 가 더 최근 관측이라 +20° 가 그대로 실행된다'
        - '움직임이 부드러워지므로 어느 쪽으로든 상자를 피한다'
      answer: 1
      explanation: |
        blending 은 $q + b(i - q)$ 로 두 값을 섞으므로 $-20 + 0.5 \times 40 = 0$° 가 되고, 이것은 아무 시연도 하지 않은 상자 쪽 움직임이다. MSE 로
        학습한 policy 가 두 정답의 평균을 내는 것과 같은 일이다. blending 은 값을 섞을 뿐 길을 고르지 않으므로 첫째 보기는 틀렸다. weight 0.5 로
        섞으면 새 값이 그대로 쓰이지 않으므로 셋째 보기도 틀렸다. 부드러운 것과 상자를 피하는 것은 다른 일이므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "chunk 경계에서 팔이 갑자기 크게 움직이는 문제를 줄이는 방법으로 옳지 않은 것은 무엇인가요?"
      choices:
        - '겹치는 chunk 의 같은 시각 예측을 가중 평균하는 temporal ensembling 을 쓴다'
        - '앞 chunk 의 남은 부분을 조건으로 다음 chunk 를 계산하는 Real-Time Chunking 을 쓴다'
        - 'servo 의 P gain 을 학습 때보다 크게 올려 목표를 더 빨리 따라가게 한다'
        - '같은 방식의 조금 다른 두 chunk 라면 겹치는 몇 tick 을 blending 해 계단을 줄인다'
      answer: 2
      explanation: |
        P gain 을 올리면 경계에서 튄 목표를 더 세게 따라가 튀는 움직임이 커지고, 학습 때와 다른 servo 반응이 되어 policy 가 배운 관계와도 어긋난다.
        temporal ensembling 은 같은 시각의 여러 예측을 섞어 계단을 없애는 방법이라 첫째 보기는 옳은 방법이다. Real-Time Chunking 은 다음 chunk 가
        남은 궤적에 이어지도록 만드는 방법이라 둘째 보기도 옳다. 같은 방식의 chunk 끼리는 blending 이 계단을 줄이므로 넷째 보기도 옳다.

- topic: model-size
  title: 메모리와 memory bandwidth
  variants:
    - question: |
        면접관: "parameter 70 억 개짜리 VLA 가 36 GB 노트북 메모리에 들어갑니다. 그러면 이 노트북에서 실시간으로 실행할 수 있다고 말할 수
        있나요?"
      choices:
        - '아니다. 추론마다 parameter 를 메모리에서 읽어야 해서 memory bandwidth 가 아래 한계를 정하고, 공개 코드가 그 칩을 지원하는지도 따져야 한다'
        - '그렇다. 메모리에 들어가면 추론 속도는 문제가 되지 않는다'
        - '그렇다. 노트북은 GPU 와 CPU 가 메모리를 함께 쓰므로 계산이 즉시 끝난다'
        - '아니다. 70 억 개 모델은 어떤 컴퓨터에서도 실시간으로 실행할 수 없다'
      answer: 0
      explanation: |
        bf16 으로 14 GB 인 모델을 1초에 400 GB 를 읽는 컴퓨터에서 실행하면 한 번 읽는 데만 35 ms 가 걸리고, token 을 여러 번 차례로 내는 모델은 그만큼 여러
        번 읽는다. 메모리는 필요 조건일 뿐이므로 둘째 보기는 틀렸다. 메모리를 함께 써도 읽는 속도의 한계는 그대로라 셋째 보기도 틀렸다. 큰 GPU 나
        chunk·비동기 추론으로 실시간에 맞출 수 있으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "parameter 수만 알 때 추론에 필요한 메모리를 어떻게 어림하나요?"
      choices:
        - 'parameter 수에 tick 길이를 곱한다'
        - 'parameter 수를 숫자 하나의 byte 수로 나눈다'
        - 'parameter 수에 숫자 하나의 byte 수(float32 는 4, bf16 은 2)를 곱하고, 계산 중간값을 담을 여유를 조금 더한다'
        - 'parameter 수와 상관없이 GPU 메모리의 절반으로 잡는다'
      answer: 2
      explanation: |
        parameter 하나를 bf16 으로 저장하면 2 byte 라서 33 억 개면 약 6.6 GB 이고, 실제로는 중간값 때문에 조금 더 쓴다. tick 길이는 시간 단위라
        메모리와 관계없으므로 첫째 보기는 틀렸다. byte 수로 나누면 단위가 맞지 않으므로 둘째 보기도 틀렸다. 필요한 메모리는 모델 크기로 정해지므로
        넷째 보기도 틀렸다.
    - question: |
        면접관: "OpenVLA 처럼 action 의 숫자 7 개를 token 으로 하나씩 차례로 내는 모델이 chunk 를 숫자로 한 번에 내는 모델보다 느린 이유는
        무엇인가요?"
      choices:
        - 'token 은 숫자보다 메모리를 7 배 더 쓰기 때문이다'
        - 'token 을 하나 낼 때마다 모델 전체를 다시 계산해서, action 하나에 모델을 7 번 읽어야 하기 때문이다'
        - 'token 은 GPU 에서 계산할 수 없기 때문이다'
        - 'token 을 내는 모델은 사진을 7 장씩 받기 때문이다'
      answer: 1
      explanation: |
        token 을 차례로 내면 하나를 낼 때마다 parameter 전체를 다시 읽으므로, 한 번 읽는 데 35 ms 인 모델은 action 하나의 아래 한계가 약 245 ms 가
        된다. OpenVLA 저자들도 RTX 4090 에서 1초에 약 6 번 추론했다고 밝혔다. token 자체가 메모리를 7 배 쓰지는 않으므로 첫째 보기는 틀렸다. token 을 내는
        계산도 GPU 에서 하므로 셋째 보기도 틀렸다. OpenVLA 는 사진 한 장을 받으므로 넷째 보기도 틀렸다.

- topic: setup-consistency
  title: calibration·카메라·조명의 일관성
  variants:
    - question: |
        면접관: "시연을 기록한 뒤 팔을 다시 calibration 했더니, 같은 policy 가 물체 옆을 몇 cm 씩 빗나갑니다. 가장 먼저 의심할 원인은
        무엇인가요?"
      choices:
        - '다시 calibration 하는 사이에 policy 의 weight 가 바뀌었다'
        - 'calibration 이 raw 값을 각도로 바꾸는 기준을 정하므로, 기준이 달라져 같은 자세가 다른 각도로 읽히고 같은 목표가 다른 자세로 간다'
        - 'calibration 을 하면 servo 의 최대 속도가 바뀐다'
        - 'calibration 은 카메라 위치를 함께 바꾼다'
      answer: 1
      explanation: |
        SO-101 같은 팔은 기록한 범위의 가운데를 0° 로 삼으므로, 범위를 다르게 기록하면 모든 각도가 일정한 양만큼 밀린다. policy 는 처음 기준의
        숫자로 배웠으므로 새 기준에서는 같은 숫자가 다른 자세를 가리킨다. weight 는 calibration 과 관계없이 그대로이므로 첫째 보기는 틀렸다.
        calibration 은 각도의 기준을 정할 뿐 속도 한계를 바꾸지 않으므로 셋째 보기도 틀렸다. 카메라는 calibration 과 따로 놓이므로 넷째 보기도
        틀렸다.
    - question: |
        면접관: "고정 카메라 사진으로 배운 end-to-end policy 에서, 누가 카메라를 옆으로 몇 cm 밀면 무슨 일이 생기나요?"
      choices:
        - 'policy 가 카메라의 이동을 스스로 계산해 보정한다'
        - '사진의 밝기만 바뀌어 관절 출력은 그대로다'
        - '카메라가 밀린 만큼 물체가 실제로 움직인 것이 되어 문제가 없다'
        - '물체는 그대로인데 사진 속 위치가 수 pixel ~ 수십 pixel 옮겨 보여, policy 가 그만큼 틀린 관절 각도를 낸다'
      answer: 3
      explanation: |
        이런 policy 는 사진 속 위치와 관절 각도 사이의 짝을 배웠으므로, 카메라가 밀려 같은 물체가 다른 pixel 에 찍히면 다른 각도를 낸다. 예를 들어
        focal length 가 500 pixel 이고 물체까지 0.5 m 이면 1 cm 이동이 10 pixel 이다. policy 는 카메라가 움직였다는 정보를 받지 않으므로 첫째 보기는
        틀렸다. 바뀌는 것은 밝기가 아니라 위치이므로 둘째 보기도 틀렸다. 물체는 실제로 움직이지 않았으므로 셋째 보기도 틀렸다.
    - question: |
        면접관: "늘 밝은 조명에서 시연을 모은 policy 가 저녁에 전등 하나를 끄자 실패합니다. 이유와 처방으로 알맞은 것은 무엇인가요?"
      choices:
        - '사진의 숫자가 통째로 바뀌어 normalization 뒤의 입력이 시연에 없던 값이 되므로, 조명을 같게 두거나 여러 조명에서 시연을 모으거나 밝기 augmentation 을 쓴다'
        - '어두우면 servo 의 힘이 약해지므로 servo 의 전류 한도를 올린다'
        - '어두우면 추론이 느려지므로 GPU 를 더 빠른 것으로 바꾼다'
        - '조명은 policy 와 관계없으므로 시연을 더 모을 필요가 없다'
      answer: 0
      explanation: |
        사진은 pixel 마다 적힌 밝기 숫자라서 조명이 바뀌면 같은 물체의 숫자도 바뀌고, 시연이 한 조명뿐이었다면 그 입력은 시연 범위 밖이다. 조명은
        servo 의 힘과 관계없으므로 둘째 보기는 틀렸다. 추론 시간은 사진의 밝기와 관계없으므로 셋째 보기도 틀렸다. 조명도 물체 위치처럼 시연 범위의
        일부이므로 넷째 보기도 틀렸다.

- topic: safety
  title: 비상 정지와 이동량·힘 제한
  variants:
    - question: |
        면접관: "학습한 policy 를 실물 팔에서 처음 실행할 때 servo 전원 스위치를 손 닿는 곳에 두고 팔 아래를 비워 두는 이유는 무엇인가요?"
      choices:
        - '전원 스위치는 policy 의 추론 속도를 높이고, 팔 아래를 비우면 카메라 시야가 넓어진다'
        - '프로그램을 끝내면 팔이 항상 안전하게 멈추므로 두 준비는 습관일 뿐이다'
        - '시연 범위 밖에서 policy 가 엉뚱하게 움직이면 전원을 끊는 것이 가장 확실한 정지 방법이고, 전원이 끊기면 팔이 중력에 처지기 때문이다'
        - '전원을 끊으면 servo 가 마지막 자세를 단단히 붙잡기 때문이다'
      answer: 2
      explanation: |
        policy 는 시연 범위 밖에서 무엇을 낼지 알 수 없고, 프로그램이 멈추면 연결을 끊을 때 힘을 끄는 동작도 하지 못할 수 있어 전원 스위치가
        마지막 수단이다. 전원이 끊기면 servo 가 gravity torque 를 버티지 못해 팔이 처지므로 아래를 비운다. 두 준비는 추론 속도나 카메라 시야와
        관계없으므로 첫째 보기는 틀렸다. 프로그램이 멈추면 안전하게 끝나지 않을 수 있으므로 둘째 보기도 틀렸다. 전원이 없으면 servo 는 자세를
        붙잡지 못하므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "tick 마다 보내는 목표를 지금 각도에서 일정 한도 안으로 자르는 설정은 무엇을 막고, 한도를 너무 작게 잡으면 어떤 문제가
        생기나요?"
      choices:
        - 'policy 가 엉뚱한 목표를 내도 팔이 한 번에 크게 움직이지 않게 하고, 너무 작으면 시연보다 느리게 움직여 policy 가 배운 움직임과 어긋난다'
        - '목표가 시연 범위 밖으로 나가지 않게 하고, 너무 작으면 policy 의 weight 가 바뀐다'
        - 'servo 의 과열을 막고, 너무 작으면 servo 가 목표를 받지 않는다'
        - '추론 지연을 막고, 너무 작으면 chunk 길이가 줄어든다'
      answer: 0
      explanation: |
        한도가 tick 당 5° 면 30 Hz 에서 1초에 최대 150° 라는 속도 제한이 되어 갑작스러운 큰 움직임을 막는다. 대신 시연에서 한 tick 에 움직인 양보다
        작으면 동작이 느려져 배운 움직임과 달라지므로, 시연의 최대 이동량보다 조금 크게 잡는다. 이 설정은 지금 각도 기준의 이동량만 자를 뿐
        시연 범위를 판단하지 않고 weight 도 바꾸지 않으므로 둘째 보기는 틀렸다. 과열은 힘·전류 한도가 맡고 servo 는 잘린 목표도 받으므로 셋째
        보기도 틀렸다. 추론 시간이나 chunk 길이와 관계없으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "집게 servo 에 힘과 전류의 한도를 따로 거는 이유는 무엇인가요?"
      choices:
        - '집게가 더 빨리 닫히게 하려고'
        - 'policy 가 집게 각도를 학습하지 않아도 되게 하려고'
        - '집게의 calibration 을 대신하려고'
        - '물체를 쥐면 목표까지 닫히지 못해 오차가 계속 남고, 그동안 servo 가 힘을 계속 내 motor 가 과열되는 것을 막으려고'
      answer: 3
      explanation: |
        쥔 물체에 막힌 집게는 오차가 남는 한 오차에 비례한 힘을 계속 내므로, 힘과 전류를 줄여 motor 를 보호한다. LeRobot 은 SO-101 집게에 힘
        한도 50%, 보호 전류 50%, 과부하 때 25% 를 써 넣는다. 한도는 힘을 줄일 뿐 닫히는 속도를 높이지 않으므로 첫째 보기는 틀렸다. policy 는
        여전히 집게 목표를 내야 하므로 둘째 보기도 틀렸다. 한도는 각도의 기준을 정하지 않으므로 셋째 보기도 틀렸다.

- topic: evaluation
  title: 성공률과 신뢰 구간, 두 policy 의 비교
  variants:
    - question: |
        면접관: "실물 팔에서 policy 를 10 번 시도해 9 번 성공했습니다. 이 policy 의 성공률이 90% 라고 보고해도 되나요?"
      choices:
        - '그렇다. 10 번이면 충분해서 참 성공률도 90% 다'
        - '아니다. 실물 평가는 성공률을 숫자로 적지 않는다'
        - '그렇다. 실패 1 번은 우연이므로 100% 로 보고해도 된다'
        - '어림값은 90% 지만 10 번으로는 흔들림이 커서, 95% 신뢰 구간(Wilson 으로 약 60% ~ 98%)과 시도 횟수를 함께 적어야 한다'
      answer: 3
      explanation: |
        같은 policy 도 시도마다 결과가 달라서 10 번 결과는 많이 흔들리고, 9 / 10 의 Wilson 95% 구간은 약 60% ~ 98% 다. 그래서 어림값과 함께 구간과
        시도 횟수를 적는다. 10 번으로 참값을 단정할 수 없으므로 첫째 보기는 틀렸다. 성공률은 숫자로 적되 구간을 붙이는 것이므로 둘째 보기도
        틀렸다. 실패를 빼고 보고하면 결과를 왜곡하므로 셋째 보기도 틀렸다.
    - question: |
        면접관: "policy A 는 25 번 중 20 번 성공했고 policy B 는 25 번 중 15 번 성공했으며, 두 Wilson 구간이 크게
        겹칩니다. 어떻게 결론 내야 하나요?"
      choices:
        - '20%p 차이가 크므로 A 가 확실히 낫다'
        - '구간이 겹쳐 차이가 우연일 수 있으므로 A 가 낫다고 단정하지 않고, 같은 배치에서 시도를 늘려 다시 비교한다'
        - '시도 횟수가 같으므로 구간은 볼 필요가 없다'
        - 'B 가 실패를 더 많이 겪었으니 B 가 더 많이 배운 policy 다'
      answer: 1
      explanation: |
        25 번씩이면 각 성공률의 구간이 넓어서, 두 구간이 겹치면 두 참 성공률이 같을 가능성도 남는다. 시도를 늘리면 구간이 좁아져 겹치지 않을 수
        있다. 성공률의 차이만으로는 우연과 실제 차이를 가를 수 없으므로 첫째 보기는 틀렸다. 시도 횟수가 같아도 구간은 성공률과 횟수로 정해지므로
        셋째 보기도 틀렸다. 평가 중의 실패는 학습에 쓰이지 않으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "두 policy 를 실물에서 공정하게 비교하려면 시도를 어떻게 짜야 하나요?"
      choices:
        - '각 policy 를 서로 다른 날, 서로 다른 물체 위치에서 시도한다'
        - '성공할 때까지 시도해 성공한 횟수만 센다'
        - '처음 배치를 미리 정해 기록하고, 배치마다 두 policy 를 연달아 시도하며 먼저 하는 쪽을 번갈아 바꾼다'
        - '한 policy 를 모두 시도한 뒤 다른 policy 를 시도한다'
      answer: 2
      explanation: |
        물체 위치마다 난이도가 달라서 같은 배치에서 시도해야 자리 운이 섞이지 않고, 순서를 번갈아 바꾸면 조명 변화나 servo 의 열 같은 시간에 따른
        영향도 고르게 나뉜다. 날과 위치가 다르면 policy 차이와 조건 차이가 섞이므로 첫째 보기는 틀렸다. 실패를 세지 않으면 성공률을 구할 수 없으므로
        둘째 보기도 틀렸다. 한쪽을 몰아서 시도하면 시간에 따른 변화가 한 policy 에만 실리므로 넷째 보기도 틀렸다.

- topic: failure-analysis
  title: 실패 분석과 시연 범위
  variants:
    - question: |
        면접관: "policy 를 끄고 고정 목표 하나만 보냈는데도 팔이 일정한 주기로 떱니다. 이 확인으로 무엇을 알 수 있나요?"
      choices:
        - 'policy 가 관여하지 않는데도 떨므로 원인은 팔 쪽(servo 의 PID 설정이나 기계)이다'
        - 'policy 의 weight 가 망가졌다'
        - '카메라 사진이 시연과 달라졌다'
        - 'chunk 경계에서 목표가 튀었다'
      answer: 0
      explanation: |
        policy 를 빼고 고정 목표만 보내는 확인은 policy 의 문제와 팔의 문제를 가른다. 이때도 떨면 policy 는 원인이 아니므로 servo 설정이나 기계를
        살핀다. policy 가 꺼져 있으므로 weight 가 원인일 수 없어 둘째 보기는 틀렸다. 카메라 사진은 고정 목표에 쓰이지 않으므로 셋째 보기도 틀렸다.
        고정 목표 하나에는 chunk 경계가 없으므로 넷째 보기도 틀렸다.
    - question: |
        면접관: "시연한 자리에서는 10 번 중 9 번 성공하는데, 시연한 자리들이 만든 영역 밖에서는 10 번 중 1 번만 성공합니다. 가장 알맞은
        처방은 무엇인가요?"
      choices:
        - '학습을 더 오래 해 validation loss 를 낮춘다'
        - 'servo 의 P gain 을 높인다'
        - '약한 자리의 시연을 더 모으거나, policy 를 실행하다 실패하려는 순간 사람이 넘겨받아 회복 동작을 기록해 다시 학습한다'
        - '그 자리에서 시도 횟수를 늘려 성공률을 다시 잰다'
      answer: 2
      explanation: |
        neural network 는 시연과 시연 사이는 잘 메우지만 시연 바깥에서도 잘 맞으리라는 보장은 없으므로, 영역 밖 실패는 시연 범위의 문제다. 그 자리의 시연이나
        사람 개입 기록(DAgger 방식)을 더해 범위를 넓힌다. validation loss 는 시연 범위 안에서만 재므로 영역 밖 성공률을 보여 주지 못해 첫째 보기는
        틀렸다. servo gain 은 시연 범위와 관계없으므로 둘째 보기도 틀렸다. 시도를 늘리면 구간은 좁아지지만 성공률 자체는 오르지 않으므로 넷째
        보기도 틀렸다.
    - question: |
        면접관: "실물 평가에서 실패한 trial 을 성공·실패로만 세지 않고 단계별로 나눠 기록하는 이유는 무엇인가요?"
      choices:
        - '단계별로 나누면 전체 성공률이 올라가기 때문이다'
        - '실패가 어느 단계에서 쌓이는지 보여서 고칠 곳을 정할 수 있기 때문이다'
        - 'policy 가 단계 정보를 입력으로 받기 때문이다'
        - '단계별로 나누면 시도 횟수를 줄여도 되기 때문이다'
      answer: 1
      explanation: |
        ACT 논문의 Thread Velcro 과제는 단계별 성공률이 92%, 40%, 20% 로 줄어 어느 단계에서 실패가 쌓이는지 드러났고, 저자들은 그 단계의 실패 모습과
        원인을 짚었다. 기록 방식은 성공률 자체를 바꾸지 않으므로 첫째 보기는 틀렸다. end-to-end policy 는 단계 정보를 입력으로 받지 않으므로
        셋째 보기도 틀렸다. 단계를 나눠도 성공률의 흔들림은 시도 횟수로 정해지므로 넷째 보기도 틀렸다.
