# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: loop-timing
  title: 추론 loop 와 action chunk queue
  variants:
    - question: |
        시연을 일정한 간격으로 기록해 학습한 policy 를 실물 팔에서 돌린다. 추론 loop 가 목표 각도를 보내는 간격을 시연 기록
        간격과 같게 맞추는 이유는?
      choices:
        - '간격이 다르면 policy 가 추론을 할 수 없어서'
        - 'policy 는 "한 칸 뒤에는 이 각도" 를 배웠으므로, 간격이 다르면 같은 동작이 느리게 또는 빨리 감기처럼 재생되어서'
        - 'servo 가 정해진 한 가지 간격의 명령만 받을 수 있어서'
        - '간격을 맞추지 않으면 카메라 사진이 찍히지 않아서'
      answer: 1
      explanation: |
        시연의 한 칸은 정해진 시간 간격이고, policy 는 그 간격마다 바뀌는 목표를 배웠다. 목표를 더 긴 간격으로 보내면 같은 동작이
        느려지고, 더 짧은 간격으로 보내면 빨라져서 시연과 다른 움직임이 된다. 추론 자체는 간격과 상관없이 할 수 있고, servo 와
        카메라가 특정 간격만 받는다는 것도 이유가 아니다.
    - question: |
        추론 한 번이 제어 간격(tick) 여러 개만큼 걸리는 큰 모델을 action chunk 와 queue(먼저 넣은 목표부터 꺼내는 대기 줄)로
        돌린다. queue 가 완전히 빈 뒤에야 다음 추론을 시작하면 팔이 중간중간 멈춘다. 이를 피하는 방법은?
      choices:
        - 'chunk 의 목표를 두 배 빠르게 꺼내 보낸다'
        - '추론이 끝날 때까지 마지막 목표를 반복해 보내는 것이 유일한 방법이다'
        - '추론을 아예 하지 않고 첫 chunk 를 계속 되풀이한다'
        - 'queue 에 남은 목표를 실행하는 시간이 추론 시간 이상일 때 미리 다음 추론을 시작하는 비동기 추론을 쓴다'
      answer: 3
      explanation: |
        비동기 추론은 queue 가 다 비기 전에 다음 추론을 시작해, 남은 목표를 실행하는 동안 새 chunk 가 도착하게 한다. 그러려면
        "남은 개수 × tick 길이 ≥ 추론 시간" 이 되는 때 시작하면 된다. 목표를 빨리 꺼내면 동작이 빨리 감기처럼 바뀌고, 마지막
        목표를 반복하는 것은 곧 멈춰 있는 것이며, 첫 chunk 를 되풀이하면 새 관측을 전혀 반영하지 못한다.
    - question: |
        servo 안의 PID controller 는 목표 각도를 조금 늦게 따라간다. 시연을 기록할 때와 policy 를 실행할 때 servo 의 PID 설정을
        같게 두어야 하는 이유는?
      choices:
        - 'policy 는 follower 팔이 이 늦음을 가진 채 움직인 기록에서 배웠으므로, 설정이 바뀌면 배운 관계와 실제 반응이 어긋나서'
        - 'PID 설정이 바뀌면 카메라 사진의 색이 바뀌어서'
        - 'PID 설정은 policy 의 parameter 와 같은 것이라서'
        - '설정이 다르면 servo 가 목표를 받지 않아서'
      answer: 0
      explanation: |
        기록 속 관절 각도와 목표 사이에는 servo 가 늦게 따라가는 모습까지 담겨 있고, policy 는 그 관계를 배웠다. 실행 때 PID 설정이
        달라지면 같은 목표에 팔이 다르게 반응해 시연 범위 밖의 상황이 된다. PID 설정은 사진과 무관하고, policy 의 parameter 도
        아니며, 설정이 달라도 servo 는 목표를 받는다.

- topic: safety
  title: 비상 정지와 속도·힘 제한
  variants:
    - question: |
        실물 팔에서 policy 를 실행하는 동안 손 닿는 곳에 servo 전원 스위치를 두고, 팔 아래를 비워 둔다. 두 준비의 이유로 옳은 것은?
      choices:
        - '전원 스위치는 policy 를 다시 학습할 때 쓰고, 팔 아래는 카메라 시야를 위해 비운다'
        - '프로그램을 끄는 것이 가장 확실하므로 스위치는 보조이고, 팔 아래는 상관없다'
        - '전원을 끊는 것이 가장 확실한 정지이고, 전원이 끊기면 servo 가 힘을 잃어 팔이 중력에 처지므로 부딪힐 것이 없어야 한다'
        - '전원을 끊으면 팔이 처음 자세로 돌아가므로 그 경로를 비워 둔다'
      answer: 2
      explanation: |
        policy 는 시연 범위 밖에서 엉뚱한 목표를 낼 수 있어 언제든 멈출 수단이 필요하다. 프로그램은 멈춰 버리면 정지 명령도 못
        보낼 수 있어서 전원 스위치가 마지막 수단이다. 전원이 끊긴 servo 는 힘을 내지 못하므로 팔이 처음 자세로 돌아가는 것이 아니라
        중력 때문에 아래로 처진다.
    - question: |
        tick 마다 보내는 목표를 지금 각도에서 일정 한도 안으로 자르는 제한을 둔다. 이 한도를 정하는 방법으로 옳은 것은?
      choices:
        - '시연에서 한 tick 에 움직인 최대 각도보다 조금 크게 잡는다. 너무 작으면 팔이 시연보다 느려져 policy 가 배운 움직임과 어긋난다'
        - '작을수록 안전하므로 가능한 한 작게 잡는다'
        - '제한은 policy 의 출력을 바꾸지 않으므로 아무 값이나 괜찮다'
        - '한도는 servo 가 낼 수 있는 최대 속도로 잡아야 한다'
      answer: 0
      explanation: |
        한도는 policy 가 엉뚱하게 큰 목표를 내도 팔이 천천히 움직이게 하는 속도 제한이다. 하지만 시연에서 실제로 움직인 양보다
        작으면 정상적인 동작까지 느려져 시연과 다른 상황이 생긴다. 그래서 시연의 최대 이동량을 조금 넘게 잡는다. 최대 속도로
        잡으면 제한의 의미가 사라지고, 한도는 보내는 목표를 실제로 바꾸는 장치다.
    - question: |
        집게 servo 의 힘과 전류에 한도를 두는 이유로 옳은 것은?
      choices:
        - '집게가 다른 관절보다 빨리 움직여야 해서'
        - '집게의 위치 센서가 부정확해서'
        - '힘을 줄이면 집게가 목표 각도에 더 정확히 닿아서'
        - '큐브를 쥐면 막혀서 목표까지 닫히지 못하고 오차가 남는데, 오차에 비례하는 힘을 계속 내면 모터가 뜨거워지기 때문에'
      answer: 3
      explanation: |
        집게는 큐브에 막혀 목표 각도에 닿지 못하므로 오차가 남고, PID 의 P 항은 오차가 남는 한 힘을 계속 낸다. 그 상태가 길어지면
        전류가 계속 흘러 모터가 과열된다. 힘을 줄이면 오히려 목표를 따라가는 힘이 약해지고, 속도나 센서 정확도는 이 한도의 이유가
        아니다.

- topic: model-size
  title: parameter 수로 어림하는 메모리와 추론 시간
  variants:
    - question: |
        같은 모델을 숫자 하나에 4 byte 를 쓰는 float32 대신 2 byte 를 쓰는 bf16 으로 메모리에 올리면 어떻게 될까?
      choices:
        - 'parameter 수가 절반으로 준다'
        - 'parameter 를 담는 메모리가 약 절반으로 준다'
        - '메모리는 같고 정확도만 높아진다'
        - '메모리가 두 배로 는다'
      answer: 1
      explanation: |
        모델의 메모리는 대략 parameter 수 × 숫자 하나의 byte 수다. byte 수가 4 에서 2 로 줄면 parameter 수는 그대로인 채 메모리가
        절반이 된다. 대신 bf16 은 자릿수를 덜 기억하므로 정확도가 높아지는 것이 아니라 조금 거칠어진다.
    - question: |
        "모델이 노트북 메모리에 들어가기만 하면 실시간으로 돌릴 수 있다" 는 생각이 틀린 이유로 가장 알맞은 것은?
      choices:
        - '메모리에 들어간 모델은 언제나 실시간으로 돈다'
        - '노트북에서는 학습만 할 수 있고 추론은 할 수 없어서'
        - '추론 한 번마다 parameter 를 메모리에서 읽어야 하므로 memory bandwidth 가 속도의 아래 한계를 정하고, 공개 코드가 그 칩을 지원하지 않을 수도 있어서'
        - '모델 크기와 추론 속도는 관계가 없어서'
      answer: 2
      explanation: |
        큰 모델은 메모리에 들어가도 추론 한 번에 수십억 개의 숫자를 읽어야 해서, 읽는 속도만으로도 시간이 길어진다. 또 큰 로봇
        모델의 공개 코드는 특정 GPU 를 기준으로 만들어진 경우가 많다. 그래서 크기와 속도는 깊이 관련되어 있고, 노트북에서도 작은
        모델은 추론할 수 있다.
    - question: |
        action 의 숫자를 token 으로 하나씩 차례로 만드는 모델이, 같은 크기로 action 묶음을 한 번에 내는 모델보다 추론이 훨씬 느린
        이유는?
      choices:
        - '숫자 하나를 만들 때마다 모델 전체를 다시 계산하므로 parameter 를 여러 번 읽기 때문에'
        - 'token 은 숫자보다 메모리를 적게 쓰기 때문에'
        - '한 번에 내는 모델은 parameter 를 읽지 않기 때문에'
        - 'token 하나씩 만드는 모델은 사진을 보지 않기 때문에'
      answer: 0
      explanation: |
        추론 시간의 아래 한계는 대략 모델 메모리 ÷ memory bandwidth 이고, token 을 하나씩 만들면 그 계산을 출력 숫자 개수만큼
        되풀이한다. 한 번에 내는 모델도 parameter 를 읽지만 한 번이면 된다. token 의 메모리 크기나 사진 사용 여부는 이 차이의
        원인이 아니다.

- topic: success-interval
  title: 성공률과 신뢰 구간
  variants:
    - question: |
        새 policy 를 10 번 시도해 9 번 성공했다. "이 policy 의 성공률은 90% 다" 라고 단정하기 어려운 이유는?
      choices:
        - '10 번 중 9 번은 계산하면 90% 가 아니라서'
        - '실패한 1 번이 policy 의 잘못이 아닐 수 있어서'
        - '성공률은 시도 횟수와 관계없이 언제나 정확하므로 단정해도 된다'
        - '같은 policy 도 시도 묶음마다 결과가 흔들려서, 적은 시도로 얻은 성공률은 참값에서 크게 벗어날 수 있기 때문에'
      answer: 3
      explanation: |
        큐브가 놓인 자리, 사진의 밝기, servo 의 반응이 매번 조금씩 달라서 같은 policy 도 10 번 묶음마다 성공 수가 달라진다. 그래서
        어림한 성공률에는 참값이 대략 어디에서 어디 사이인지를 나타내는 신뢰 구간을 함께 적는다. 계산은 90% 가 맞지만, 그 값이
        흔들린다는 것이 문제다. 실패 원인이 무엇이든 성공률은 정해 둔 기준대로 센다.
    - question: |
        성공률의 신뢰 구간 폭은 시도 횟수 $n$ 의 제곱근에 반비례한다. 구간의 폭을 절반으로 줄이려면 시도 횟수를 어떻게 해야 할까?
      choices:
        - '2 배로 늘린다'
        - '4 배로 늘린다'
        - '절반으로 줄인다'
        - '시도 횟수와 상관없이 성공 기준을 바꿔야 한다'
      answer: 1
      explanation: |
        폭이 $\sqrt{n}$ 에 반비례하므로 $n$ 을 4 배로 하면 $\sqrt{4} = 2$ 분의 1, 곧 절반이 된다. 2 배로 늘리면 폭은 약 0.7 배로만
        준다. 시도를 줄이면 폭이 오히려 넓어지고, 성공 기준을 바꾸면 다른 것을 재게 된다. 그래서 실물 평가에서 구간을 좁히는 일은
        금방 비싸진다.
    - question: |
        신뢰 구간을 $\hat p \pm 2\sqrt{\hat p(1 - \hat p)/n}$ 으로 어림한다. 25 번 시도에서 모두 성공한 경우에 대한 설명으로 옳은 것은?
      choices:
        - '폭이 0 이므로 참 성공률은 정확히 100% 다'
        - '모두 성공했으니 구간을 적을 필요가 없다'
        - '폭이 0 이 되는 것은 이 어림식의 한계이고, 0% 나 100% 근처에서는 늘 0 과 1 사이에 머무는 Wilson 구간을 쓴다'
        - '시도를 더 줄이면 구간이 정확해진다'
      answer: 2
      explanation: |
        $\hat p = 1$ 이면 $\hat p(1 - \hat p) = 0$ 이라 어림식의 폭이 0 이 되지만, 25 번만으로 참 성공률이 정확히 100% 라고 알 수는
        없다. Wilson 구간은 이런 경우에도 참 성공률이 그보다 낮을 수 있다는 범위를 알려 준다. 모두 성공해도 구간은 적어야 하고,
        시도를 줄이면 불확실성이 더 커진다.

- topic: compare-trials
  title: 두 policy 의 공정한 비교
  variants:
    - question: |
        policy A 와 B 를 25 번씩 시도해 성공률이 80% 와 60% 로 나왔지만, 두 신뢰 구간이 상당 부분 겹친다. 알맞은 결론은?
      choices:
        - '두 policy 의 참 성공률이 같을 가능성이 남아 있으므로, 이 시도만으로는 A 가 낫다고 단정하지 않는다'
        - '20% 나 차이 나므로 A 가 확실히 낫다'
        - '구간이 겹치면 두 policy 는 반드시 성능이 같다'
        - '구간과 상관없이 성공률이 높은 쪽을 고르면 된다'
      answer: 0
      explanation: |
        시도가 적으면 각 성공률이 크게 흔들리므로, 구간이 겹친다는 것은 두 참값이 같을 수도 있다는 뜻이다. 그래서 차이를 단정하지
        않고 시도를 늘려 구간을 좁힌다. 겹친다고 같다고 결론 내리는 것도 아니고, 겹치지 않을 때에야 차이가 있다고 말할 수 있다.
    - question: |
        두 policy 를 비교할 때 큐브 배치를 미리 정해 두고, 배치마다 두 policy 를 연달아 시도하며 먼저 하는 쪽을 번갈아 바꾼다. 그
        이유로 옳은 것은?
      choices:
        - '시도 횟수를 줄이기 위해서'
        - '두 policy 가 서로의 결과를 학습하게 하려고'
        - '배치가 같으면 신뢰 구간 계산이 필요 없어서'
        - '쉬운 자리와 어려운 자리의 운, 시간에 따라 바뀌는 조명이나 servo 의 열 같은 영향이 두 policy 에 고르게 나뉘게 하려고'
      answer: 3
      explanation: |
        큐브 자리에 따라 난이도가 달라서 두 policy 를 서로 다른 자리에서 시도하면 자리 운이 결과에 섞인다. 같은 배치에서 번갈아
        시도하면 그 운과 시간에 따른 변화가 양쪽에 고르게 들어간다. 시도 횟수는 그대로이고, policy 끼리 학습하지도 않으며, 구간은
        여전히 함께 적어야 한다.
    - question: |
        평가 전에 "큐브가 상자 바닥에 닿아 있고 팔이 처음 자세로 돌아왔다" 처럼 성공 기준을 문장으로 정해 두는 이유는?
      choices:
        - '기준이 길수록 성공률이 높게 나와서'
        - '기준이 없으면 애매한 결과를 그때그때 다르게 판정해, 성공률과 비교가 흔들리기 때문에'
        - 'policy 가 학습할 때 이 문장을 입력으로 받아서'
        - '시도 횟수를 정하는 데 필요해서'
      answer: 1
      explanation: |
        큐브가 상자 가장자리에 걸린 경우처럼 애매한 결과는 기준이 없으면 판정하는 사람과 때에 따라 달라진다. 그러면 같은 policy 의
        성공률도, 두 policy 의 비교도 판정 방식에 따라 흔들린다. 기준 문장은 평가를 위한 것이라 policy 의 입력이 아니고, 성공률을
        높이거나 시도 횟수를 정하는 것과도 관계가 없다.

- topic: failure-range
  title: 실패 분석과 시연 범위
  variants:
    - question: |
        실물 팔이 policy 실행 중에 떨린다. policy 를 끄고 고정된 목표 하나만 보냈는데도 똑같이 떤다면 원인은 어느 쪽일 가능성이
        클까?
      choices:
        - 'policy 가 학습을 덜 해서'
        - '시연 데이터의 양이 모자라서'
        - 'policy 가 관여하지 않는데도 떨므로 servo 의 PID 설정이나 기계 쪽 문제'
        - '카메라 위치가 바뀌어서'
      answer: 2
      explanation: |
        고정 목표를 보내는 확인은 policy 를 빼고 팔만 남겨, 문제가 policy 쪽인지 팔 쪽인지 가른다. policy 가 없어도 떤다면 학습이나
        시연, 카메라처럼 policy 의 입력·출력에 관한 원인은 빠지고 servo 설정이나 기계 문제가 남는다.
    - question: |
        큐브를 책상 위 몇 자리에만 놓고 시연을 모아 학습한 policy 가, 시연 자리들이 이루는 영역 밖에 놓인 큐브에서는 자주 실패한다.
        이유와 처방으로 옳은 것은?
      choices:
        - 'neural network 는 시연 사이를 메우는 것은 잘하지만 시연 바깥으로 넓혀 가는 것은 보장하지 못하므로, 약한 자리의 시연을 더 모아 다시 학습한다'
        - 'policy 가 큐브를 집는 법 자체를 배우지 못했으므로, 모델 구조를 바꿔야 한다'
        - '영역 밖은 카메라에 보이지 않으므로 카메라를 더 단다'
        - 'learning rate 가 너무 커서 생긴 일이므로 learning rate 만 줄인다'
      answer: 0
      explanation: |
        policy 가 배운 것은 시연 장면의 사진과 관절 각도 사이의 짝이라서, 시연이 덮은 영역 안은 시연 사이를 메우는 계산으로 잘
        맞지만 바깥은 무엇을 낼지 알 수 없다. 영역 안에서는 잘 집으니 집는 법을 못 배운 것은 아니며, 큐브는 카메라에 보이고,
        learning rate 는 이 현상의 원인이 아니다. 약한 자리의 시연을 더해 영역을 넓히는 것이 처방이다.
    - question: |
        시연을 모은 뒤 누가 카메라를 1 cm 옆으로 밀었거나 방의 조명이 어두워졌더니 성공률이 떨어졌다. 공통된 이유는?
      choices:
        - '카메라와 조명은 policy 의 입력과 관계없다'
        - 'servo 의 전원이 약해져서'
        - 'policy 의 parameter 가 바뀌어서'
        - '사람 눈에는 같은 장면이지만 policy 가 받는 사진의 숫자가 통째로 바뀌어, 시연에서 본 적 없는 입력이 되었기 때문에'
      answer: 3
      explanation: |
        카메라가 조금만 움직여도 사진 속 모든 물체가 여러 pixel 옮겨 찍히고, 조명이 바뀌면 pixel 의 색 숫자가 함께 바뀐다. policy 는
        시연 때의 사진 숫자에서 배웠으므로, 이런 변화도 물체 위치처럼 시연 범위 밖이 된다. parameter 나 전원은 그대로다. 그래서
        카메라는 단단히 고정하고, 조명을 같게 하거나 시연·augmentation 으로 범위를 넓힌다.

- topic: target-setup
  title: end-to-end 구성과 인식기 + 작은 policy 구성
  variants:
    - question: |
        책상에 빨간 큐브와 파란 큐브가 있고 사람이 "파란 큐브를 넣어" 라고 말한다. 사진에서 관절 목표값까지 network 하나가 배우는
        end-to-end policy 로 이 지시를 따르게 하려면 무엇이 필요할까?
      choices:
        - '아무것도 필요 없다. end-to-end policy 는 원래 말을 알아듣는다'
        - '글을 입력으로 받는 policy 와, 빨강을 집는 시연과 파랑을 집는 시연을 모두 모은 데이터'
        - '빨간 큐브의 시연만 더 많이 모으면 된다'
        - '카메라를 하나 더 단다'
      answer: 1
      explanation: |
        end-to-end policy 가 배운 것은 시연 속 장면과 행동의 짝이라서, 글을 입력으로 받지 않으면 어느 큐브를 집을지 들을 방법이
        없다. 글을 받더라도 "파랑" 에 맞는 행동을 배우려면 파랑을 집는 시연이 있어야 한다. 빨강 시연만 늘리면 계속 빨강을 집고,
        카메라를 더 달아도 지시를 들을 수는 없다.
    - question: |
        물체 이름을 받아 사진에서 그 물체를 찾는 open-vocabulary 인식기가 대상을 표시하고, 작은 policy 는 그 표시를 보고 움직이는
        구성이 있다. 이 구성의 장점으로 옳은 것은?
      choices:
        - 'policy 가 글을 직접 읽으므로 "살살 쥐어" 같은 지시도 따른다'
        - '시연이 전혀 필요 없다'
        - '인식기가 인터넷 규모 데이터로 이름을 배워 두었으므로, 시연에 없던 이름의 물체도 찾아 표시할 수 있고 쥐는 법이 비슷하면 새 시연 없이 집을 수 있다'
        - '인식기를 매 순간 돌려도 시간이 들지 않는다'
      answer: 2
      explanation: |
        이름을 알아듣는 일을 인식기가 맡으므로 policy 는 표시된 자리로 가서 쥐는 법만 배우면 된다. 그래서 새 이름의 물체도 모양이
        비슷하면 다룰 수 있다. 하지만 policy 는 글을 보지 않으므로 동작 방식에 관한 지시는 따르지 못하고, 쥐는 법을 배울 시연은
        여전히 필요하며, 인식기는 계산이 무거워 돌릴 때마다 시간이 든다.
    - question: |
        인식기 + 작은 policy 구성을 실물에서 시험한 연구 MOO 는 무거운 인식기를 시도의 첫 frame 에서만 한 번 돌린다. 이렇게 해도
        되는 이유로 옳은 것은?
      choices:
        - '첫 frame 에서 대상을 표시하면, 그 뒤 물체가 움직여도 policy 가 사진에서 따라가므로 무거운 계산을 한 번으로 끝낼 수 있어서'
        - '물체는 시도 중에 절대 움직이지 않기 때문에'
        - '인식기는 첫 frame 에서만 정확하기 때문에'
        - '첫 frame 이 지나면 카메라를 끄기 때문에'
      answer: 0
      explanation: |
        인식기를 매 frame 돌리면 계산이 무거워 실시간 제어가 어렵고, 동기로 돌리면 그때마다 팔이 멈춘다. 첫 frame 에서 대상을 한 번
        표시해 두면 이후에는 policy 가 사진을 보며 물체를 따라간다. 물체는 시도 중 움직일 수 있고, 인식기의 정확도가 첫 frame 에서만
        높은 것도 아니며, 카메라는 계속 policy 에 사진을 준다.

- topic: vla-boundary
  title: 인식기 + 작은 policy 와 VLA 의 경계
  variants:
    - question: |
        open-vocabulary 인식기 뒤에 작은 policy 를 붙인 구성은 사진과 글을 함께 다루지만 보통 VLA 라고 부르지 않는다. 그 이유로
        옳은 것은?
      choices:
        - '인식기가 인터넷 데이터로 학습하지 않았기 때문에'
        - '글은 인식기에서 멈추고 policy 에는 위치만 전해지며, 사전학습한 부분이 행동을 내는 부분과 한 모델로 함께 학습된 것이 아니기 때문에'
        - 'policy 가 사진을 보지 않기 때문에'
        - '로봇 action 을 내지 않기 때문에'
      answer: 1
      explanation: |
        보통 VLA 는 인터넷 규모로 미리 학습한 VLM 을 몸통으로 삼아 행동을 내는 부분까지 이어 학습한 한 덩어리 모델이고, 글이 행동을
        계산하는 network 안까지 들어간다. 인식기 + policy 구성에서는 인식기도 인터넷 데이터로 학습했지만 출력이 위치뿐이고, policy 는
        사진과 위치를 받아 action 을 낼 뿐 글은 받지 않는다.
    - question: |
        인식기 + 작은 policy 구성에 "유리컵이니 살살 쥐어" 라고 지시했다. 어떻게 될까?
      choices:
        - '인식기가 "살살" 을 힘 값으로 바꿔 policy 에 넘긴다'
        - 'policy 가 글을 읽고 쥐는 힘을 줄인다'
        - '인식기는 유리컵의 위치를 찾지만, policy 는 위치만 받아 "살살" 이라는 지시가 닿지 않고 시연에서 배운 대로 쥔다'
        - '인식기가 유리컵을 찾지 못해 아무 일도 하지 않는다'
      answer: 2
      explanation: |
        인식기가 인터넷에서 배운 지식 가운데 행동까지 전해지는 것은 "이름 → 위치" 하나뿐이다. 물체에 대한 상식이 동작 방식을 바꿔야
        하는 지시는 policy 에 들어갈 길이 없다. 인식기는 이름으로 위치를 찾는 일을 하지 힘 값을 만들지 않고, policy 는 글을 받지
        않으며, 유리컵 같은 흔한 물체는 인식기가 찾을 수 있다.
    - question: |
        VLA 라는 이름의 경계는 사람마다 다르게 쓴다. 어떤 모델을 VLA 라고 부를지 다툴 때 확인하면 좋은 기준으로 알맞은 것은?
      choices:
        - '모델의 parameter 가 10 억 개를 넘는가'
        - '카메라를 몇 대 쓰는가'
        - '논문 제목에 VLA 라는 말이 있는가'
        - '글이 행동을 계산하는 network 안까지 들어가는가, 사전학습한 부분이 행동을 내는 부분과 한 모델로 이어져 있는가'
      answer: 3
      explanation: |
        같은 이름을 넓게도 좁게도 쓰므로 이름보다 구조를 보는 편이 정확하다. 글이 앞 단계에서 멈추는지 행동 계산까지 닿는지, 인터넷
        규모 사전학습 부분이 행동 부분과 한 모델인지를 보면 구성의 성격이 드러난다. 크기나 카메라 수는 이 구분과 관계없고, 스스로
        VLA 라고 부르는지는 사람마다 다르다.
