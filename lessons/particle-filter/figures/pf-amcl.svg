<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Nav2 의 AMCL. LiDAR scan, map_server 의 지도, 바퀴 odometry 의 tf, RViz 의 초기 위치를 받아 particle 500 ~ 2000 개로 위치를 추정하고, map → odom tf, amcl_pose, particle_cloud 를 낸다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
  <rect x="1" y="1" width="698" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="30" width="190" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="115.0" y="51.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">/scan</text>
  <text x="115.0" y="69.0" fill="#94a3b8" font-size="11" text-anchor="middle">LiDAR scan</text>
  <line x1="212.0" y1="55.0" x2="288.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="20" y="95" width="190" height="50" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="115.0" y="116.0" fill="#a78bfa" font-size="13" text-anchor="middle" font-weight="600">/map</text>
  <text x="115.0" y="134.0" fill="#94a3b8" font-size="11" text-anchor="middle">map_server 가 낸 지도</text>
  <line x1="212.0" y1="120.0" x2="288.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="20" y="160" width="190" height="50" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115.0" y="181.0" fill="#f59e0b" font-size="13" text-anchor="middle" font-weight="600">odom → base_footprint</text>
  <text x="115.0" y="199.0" fill="#94a3b8" font-size="11" text-anchor="middle">바퀴 odometry 가 내는 tf</text>
  <line x1="212.0" y1="185.0" x2="288.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="20" y="225" width="190" height="50" rx="8" fill="#111a2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="115.0" y="246.0" fill="#f472b6" font-size="13" text-anchor="middle" font-weight="600">/initialpose</text>
  <text x="115.0" y="264.0" fill="#94a3b8" font-size="11" text-anchor="middle">RViz 2D Pose Estimate</text>
  <line x1="212.0" y1="250.0" x2="288.0" y2="150.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="290" y="95" width="170" height="110" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="375.0" y="125.0" fill="#34d399" font-size="16" text-anchor="middle" font-weight="600">AMCL</text>
  <text x="375.0" y="148.0" fill="#e2e8f0" font-size="12" text-anchor="middle">particle 500 ~ 2000 개</text>
  <text x="375.0" y="167.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.25 m 또는 0.2 rad</text>
  <text x="375.0" y="183.0" fill="#94a3b8" font-size="11" text-anchor="middle">움직일 때마다 한 cycle</text>
  <line x1="462.0" y1="150.0" x2="488.0" y2="85.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="490" y="60" width="190" height="50" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="585.0" y="81.0" fill="#34d399" font-size="13" text-anchor="middle" font-weight="600">map → odom tf</text>
  <text x="585.0" y="99.0" fill="#94a3b8" font-size="11" text-anchor="middle">odometry drift 를 고친다</text>
  <line x1="462.0" y1="150.0" x2="488.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="490" y="135" width="190" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="585.0" y="156.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">/amcl_pose</text>
  <text x="585.0" y="174.0" fill="#94a3b8" font-size="11" text-anchor="middle">가장 무거운 무리의 평균·공분산</text>
  <line x1="462.0" y1="150.0" x2="488.0" y2="235.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="490" y="210" width="190" height="50" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="585.0" y="231.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">/particle_cloud</text>
  <text x="585.0" y="249.0" fill="#94a3b8" font-size="11" text-anchor="middle">RViz 에 그릴 particle</text>
  <text x="350.0" y="310.0" fill="#94a3b8" font-size="12" text-anchor="middle">지도가 없으면 AMCL 은 particle 의 가중치를 매길 수 없다</text>
</svg>
