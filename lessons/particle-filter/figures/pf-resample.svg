<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Low-variance resampling. 가중치 0.46, 0.39, 0.12, 0.03, 0.00 을 누적해 0 ~ 1 막대에 칸으로 놓고, 0.12 에서 시작해 0.2 간격으로 바늘 5 개를 꽂으면 5.0 m 와 5.3 m particle 이 두 개씩, 4.6 m 가 하나 복사된다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
  <rect x="1" y="1" width="698" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="60.0" y="110" width="266.8" height="40" fill="#34d399" fill-opacity="0.35" stroke="#34d399"/>
  <text x="193.4" y="128.0" fill="#e2e8f0" font-size="12" text-anchor="middle">5.0 m</text>
  <text x="193.4" y="144.0" fill="#34d399" font-size="11" text-anchor="middle">w = 0.46</text>
  <rect x="326.8" y="110" width="226.2" height="40" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8"/>
  <text x="439.9" y="128.0" fill="#e2e8f0" font-size="12" text-anchor="middle">5.3 m</text>
  <text x="439.9" y="144.0" fill="#38bdf8" font-size="11" text-anchor="middle">w = 0.39</text>
  <rect x="553.0" y="110" width="69.6" height="40" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b"/>
  <text x="587.8" y="128.0" fill="#e2e8f0" font-size="12" text-anchor="middle">4.6 m</text>
  <text x="587.8" y="144.0" fill="#f59e0b" font-size="11" text-anchor="middle">w = 0.12</text>
  <rect x="622.6" y="110" width="17.4" height="40" fill="#a78bfa" fill-opacity="0.35" stroke="#a78bfa"/>
  <rect x="640.0" y="110" width="2.3" height="40" fill="#f87171" fill-opacity="0.35" stroke="#f87171"/>
  <text x="60.0" y="170.0" fill="#64748b" font-size="10" text-anchor="middle">0</text>
  <text x="326.8" y="170.0" fill="#64748b" font-size="10" text-anchor="middle">0.46</text>
  <text x="553.0" y="170.0" fill="#64748b" font-size="10" text-anchor="middle">0.85</text>
  <text x="60.0" y="190.0" fill="#64748b" font-size="10" text-anchor="start">누적 가중치</text>
  <text x="640.0" y="190.0" fill="#94a3b8" font-size="10" text-anchor="end">오른쪽 끝의 좁은 두 칸: 5.8 m (0.03), 4.1 m (0.00)</text>
  <line x1="631.3" y1="154.0" x2="631.3" y2="176.0" stroke="#94a3b8" stroke-width="1"/>
  <line x1="129.6" y1="62.0" x2="129.6" y2="106.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="129.6" y="54.0" fill="#f472b6" font-size="11" text-anchor="middle">0.12</text>
  <line x1="245.6" y1="62.0" x2="245.6" y2="106.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="245.6" y="54.0" fill="#f472b6" font-size="11" text-anchor="middle">0.32</text>
  <line x1="361.6" y1="62.0" x2="361.6" y2="106.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="361.6" y="54.0" fill="#f472b6" font-size="11" text-anchor="middle">0.52</text>
  <line x1="477.6" y1="62.0" x2="477.6" y2="106.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="477.6" y="54.0" fill="#f472b6" font-size="11" text-anchor="middle">0.72</text>
  <line x1="593.6" y1="62.0" x2="593.6" y2="106.0" stroke="#f472b6" stroke-width="1.6" marker-end="url(#ap)"/>
  <text x="593.6" y="54.0" fill="#f472b6" font-size="11" text-anchor="middle">0.92</text>
  <text x="60.0" y="30.0" fill="#f472b6" font-size="12" text-anchor="start">시작점 0.12 를 한 번만 뽑고 1/N = 0.2 간격으로 바늘 5 개를 놓는다</text>
  <text x="350.0" y="230.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">바늘이 꽂힌 칸의 particle 을 복사한다:  5.0 m × 2,  5.3 m × 2,  4.6 m × 1</text>
  <text x="350.0" y="256.0" fill="#94a3b8" font-size="11" text-anchor="middle">가중치가 1/N = 0.2 이상인 particle 은 칸 폭이 바늘 간격보다 넓어서 반드시 하나 이상 남는다</text>
</svg>
