  <title>문이 4 m 와 14 m 에 하나씩 있는 20 m 복도에서 문을 본 로봇의 믿음. 실제 믿음은 4 m 와 14 m 에 봉우리가 하나씩 있고 particle 도 두 무리로 모인다. Gaussian 하나로 맞추면 평균 9 m, σ 약 5 m 가 되는데 9 m 에는 문이 없다</title>
