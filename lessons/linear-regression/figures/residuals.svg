<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>점 세 개와 직선 ŷ = 2x + 1. 점에서 직선까지의 세로 거리가 오차 ŷ − y 이고, 그 제곱의 평균이 MSE 다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="60" y="30" width="280" height="270" fill="#0e1628" stroke="#1e293b"/>
  <line x1="60" y1="300" x2="340" y2="300" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="300" stroke="#475569" stroke-width="1.5"/>
  <text x="334" y="320" fill="#94a3b8" font-size="15" text-anchor="end">x</text>
  <text x="48" y="44" fill="#94a3b8" font-size="15" text-anchor="end">y</text>
  <text x="130" y="320" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="200" y="320" fill="#64748b" font-size="13" text-anchor="middle">2</text>
  <text x="270" y="320" fill="#64748b" font-size="13" text-anchor="middle">3</text>
  <text x="50" y="215.0" fill="#64748b" font-size="13" text-anchor="end">4</text>
  <text x="50" y="125.0" fill="#64748b" font-size="13" text-anchor="end">8</text>
  <line x1="60" y1="277.5" x2="340" y2="97.5" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="301.5" y="167.25" fill="#38bdf8" font-size="14" text-anchor="middle">ŷ = 2x + 1</text>
  <line x1="130" y1="187.5" x2="130" y2="232.5" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="130" cy="232.5" r="5" fill="#38bdf8"/>
  <circle cx="130" cy="187.5" r="7" fill="#f59e0b"/>
  <text x="120" y="215.0" fill="#f87171" font-size="14" text-anchor="end">−2</text>
  <line x1="200" y1="120.0" x2="200" y2="187.5" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="200" cy="187.5" r="5" fill="#38bdf8"/>
  <circle cx="200" cy="120.0" r="7" fill="#f59e0b"/>
  <text x="190" y="158.75" fill="#f87171" font-size="14" text-anchor="end">−3</text>
  <line x1="270" y1="52.5" x2="270" y2="142.5" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="270" cy="142.5" r="5" fill="#38bdf8"/>
  <circle cx="270" cy="52.5" r="7" fill="#f59e0b"/>
  <text x="260" y="102.5" fill="#f87171" font-size="14" text-anchor="end">−4</text>
  <circle cx="378" cy="44" r="7" fill="#f59e0b"/>
  <text x="394" y="49" fill="#e2e8f0" font-size="14">데이터 (x, y)</text>
  <circle cx="378" cy="72" r="5" fill="#38bdf8"/>
  <text x="394" y="77" fill="#e2e8f0" font-size="14">예측 ŷ</text>
  <line x1="371" y1="100" x2="385" y2="100" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="394" y="105" fill="#e2e8f0" font-size="14">오차 ŷ − y</text>
  <text x="380" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">x</text>
  <text x="416" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">y</text>
  <text x="452" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">ŷ</text>
  <text x="496" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">ŷ − y</text>
  <text x="552" y="150" fill="#94a3b8" font-size="13" text-anchor="middle">(ŷ − y)²</text>
  <line x1="364" y1="159" x2="584" y2="159" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">1</text>
  <text x="416" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">5</text>
  <text x="452" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">3</text>
  <text x="496" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">−2</text>
  <text x="552" y="180" fill="#e2e8f0" font-size="14" text-anchor="middle">4</text>
  <text x="380" y="206" fill="#e2e8f0" font-size="14" text-anchor="middle">2</text>
  <text x="416" y="206" fill="#e2e8f0" font-size="14" text-anchor="middle">8</text>
  <text x="452" y="206" fill="#e2e8f0" font-size="14" text-anchor="middle">5</text>
  <text x="496" y="206" fill="#e2e8f0" font-size="14" text-anchor="middle">−3</text>
  <text x="552" y="206" fill="#e2e8f0" font-size="14" text-anchor="middle">9</text>
  <text x="380" y="232" fill="#e2e8f0" font-size="14" text-anchor="middle">3</text>
  <text x="416" y="232" fill="#e2e8f0" font-size="14" text-anchor="middle">11</text>
  <text x="452" y="232" fill="#e2e8f0" font-size="14" text-anchor="middle">7</text>
  <text x="496" y="232" fill="#e2e8f0" font-size="14" text-anchor="middle">−4</text>
  <text x="552" y="232" fill="#e2e8f0" font-size="14" text-anchor="middle">16</text>
  <text x="372" y="282" fill="#e2e8f0" font-size="14">L = (4 + 9 + 16) / 3 ≈ 9.67</text>
</svg>
