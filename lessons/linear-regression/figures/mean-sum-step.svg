<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>learning rate 0.01 로 한 step 움직인 거리: mean 과 sum 비교</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60.0" y="56.0" fill="#34d399" font-size="13" text-anchor="start">mean (점 3개 또는 6개)</text>
  <line x1="60.0" y1="70.0" x2="120.0" y2="70.0" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="130.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="start">w = 0.36</text>
  <text x="60.0" y="108.0" fill="#f59e0b" font-size="13" text-anchor="start">sum, 점 3개</text>
  <line x1="60.0" y1="122.0" x2="240.0" y2="122.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="250.0" y="127.0" fill="#e2e8f0" font-size="13" text-anchor="start">w = 1.08</text>
  <text x="60.0" y="160.0" fill="#f87171" font-size="13" text-anchor="start">sum, 점 6개</text>
  <line x1="60.0" y1="174.0" x2="420.0" y2="174.0" stroke="#f87171" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="430.0" y="179.0" fill="#e2e8f0" font-size="13" text-anchor="start">w = 2.16</text>
  <line x1="60.0" y1="222.0" x2="560.0" y2="222.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="60.0" y1="217.0" x2="60.0" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="60.0" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <line x1="143.3" y1="217.0" x2="143.3" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="143.3" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">0.5</text>
  <line x1="226.7" y1="217.0" x2="226.7" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="226.7" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <line x1="310.0" y1="217.0" x2="310.0" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="310.0" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">1.5</text>
  <line x1="393.3" y1="217.0" x2="393.3" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="393.3" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">2</text>
  <line x1="476.7" y1="217.0" x2="476.7" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="476.7" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">2.5</text>
  <line x1="560.0" y1="217.0" x2="560.0" y2="227.0" stroke="#475569" stroke-width="1.5"/>
  <text x="560.0" y="244.0" fill="#64748b" font-size="12" text-anchor="middle">3</text>
  <text x="566.0" y="227.0" fill="#94a3b8" font-size="14" text-anchor="start">w</text>
  <text x="300.0" y="268.0" fill="#94a3b8" font-size="13" text-anchor="middle">w = b = 0 에서 출발. sum 은 점 수만큼 gradient 가 커져 더 멀리 간다</text>
</svg>
