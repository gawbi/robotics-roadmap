<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>좌표평면 위의 데이터 세 점</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="80.0" y="40.0" width="320.0" height="250.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="80.0" y1="290.0" x2="400.0" y2="290.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="80.0" y1="40.0" x2="80.0" y2="290.0" stroke="#475569" stroke-width="1.5"/>
  <text x="80.0" y="308.0" fill="#64748b" font-size="13" text-anchor="middle">0</text>
  <text x="160.0" y="308.0" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="240.0" y="308.0" fill="#64748b" font-size="13" text-anchor="middle">2</text>
  <text x="320.0" y="308.0" fill="#64748b" font-size="13" text-anchor="middle">3</text>
  <text x="400.0" y="308.0" fill="#64748b" font-size="13" text-anchor="middle">4</text>
  <text x="72.0" y="294.0" fill="#64748b" font-size="13" text-anchor="end">0</text>
  <text x="72.0" y="258.3" fill="#64748b" font-size="13" text-anchor="end">2</text>
  <text x="72.0" y="222.6" fill="#64748b" font-size="13" text-anchor="end">4</text>
  <text x="72.0" y="186.9" fill="#64748b" font-size="13" text-anchor="end">6</text>
  <text x="72.0" y="151.1" fill="#64748b" font-size="13" text-anchor="end">8</text>
  <text x="72.0" y="115.4" fill="#64748b" font-size="13" text-anchor="end">10</text>
  <text x="72.0" y="79.7" fill="#64748b" font-size="13" text-anchor="end">12</text>
  <text x="72.0" y="44.0" fill="#64748b" font-size="13" text-anchor="end">14</text>
  <text x="408.0" y="295.0" fill="#94a3b8" font-size="14" text-anchor="start">x</text>
  <text x="72.0" y="20.0" fill="#94a3b8" font-size="14" text-anchor="end">y</text>
  <line x1="240.0" y1="147.1" x2="240.0" y2="290.0" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="240.0" y1="147.1" x2="80.0" y2="147.1" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="160.0" cy="200.7" r="7" fill="#f59e0b"/>
  <text x="172.0" y="192.7" fill="#e2e8f0" font-size="14" text-anchor="start">(1, 5)</text>
  <circle cx="240.0" cy="147.1" r="7" fill="#f59e0b"/>
  <text x="252.0" y="139.1" fill="#e2e8f0" font-size="14" text-anchor="start">(2, 8)</text>
  <circle cx="320.0" cy="93.6" r="7" fill="#f59e0b"/>
  <text x="332.0" y="85.6" fill="#e2e8f0" font-size="14" text-anchor="start">(3, 11)</text>
  <text x="430.0" y="70.0" fill="#94a3b8" font-size="14" text-anchor="start">x: 모터에 넣은 전압 (V)</text>
  <text x="430.0" y="95.0" fill="#94a3b8" font-size="14" text-anchor="start">y: 1초에 움직인 거리 (cm)</text>
  <text x="430.0" y="140.0" fill="#f87171" font-size="14" text-anchor="start">점 (2, 8) 읽는 법</text>
  <text x="430.0" y="164.0" fill="#e2e8f0" font-size="14" text-anchor="start">오른쪽으로 2 칸</text>
  <text x="430.0" y="186.0" fill="#e2e8f0" font-size="14" text-anchor="start">위로 8 칸</text>
  <text x="430.0" y="230.0" fill="#94a3b8" font-size="13" text-anchor="start">점은 x 가 1 늘 때마다</text>
  <text x="430.0" y="250.0" fill="#94a3b8" font-size="13" text-anchor="start">y 가 3 씩 는다</text>
</svg>
