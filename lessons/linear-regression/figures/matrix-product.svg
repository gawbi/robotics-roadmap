<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>행렬 A 와 parameter vector 의 곱으로 예측 세 개를 한 번에 계산</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="110.0" y="40.0" fill="#94a3b8" font-size="15" text-anchor="middle">A</text>
  <text x="250.0" y="40.0" fill="#94a3b8" font-size="15" text-anchor="middle">θ = (w, b)</text>
  <text x="510.0" y="40.0" fill="#94a3b8" font-size="15" text-anchor="middle">Aθ = 예측</text>
  <rect x="60.0" y="48.0" width="100.0" height="34.0" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90.0" y="70.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="130.0" y="70.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="340.0" y="70.0" fill="#38bdf8" font-size="14" text-anchor="middle">1·2 + 1·1 = 3</text>
  <rect x="480.0" y="48.0" width="60.0" height="34.0" rx="6" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="510.0" y="70.0" fill="#e2e8f0" font-size="15" text-anchor="middle">3</text>
  <rect x="60.0" y="92.0" width="100.0" height="34.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90.0" y="114.0" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <text x="130.0" y="114.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="340.0" y="114.0" fill="#f59e0b" font-size="14" text-anchor="middle">2·2 + 1·1 = 5</text>
  <rect x="480.0" y="92.0" width="60.0" height="34.0" rx="6" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="510.0" y="114.0" fill="#e2e8f0" font-size="15" text-anchor="middle">5</text>
  <rect x="60.0" y="136.0" width="100.0" height="34.0" rx="6" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="90.0" y="158.0" fill="#e2e8f0" font-size="15" text-anchor="middle">3</text>
  <text x="130.0" y="158.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="340.0" y="158.0" fill="#a78bfa" font-size="14" text-anchor="middle">3·2 + 1·1 = 7</text>
  <rect x="480.0" y="136.0" width="60.0" height="34.0" rx="6" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="510.0" y="158.0" fill="#e2e8f0" font-size="15" text-anchor="middle">7</text>
  <rect x="225.0" y="48.0" width="50.0" height="78.0" rx="6" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="250.0" y="70.0" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <text x="250.0" y="114.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <text x="190.0" y="96.0" fill="#94a3b8" font-size="18" text-anchor="middle">×</text>
  <text x="445.0" y="114.0" fill="#94a3b8" font-size="18" text-anchor="middle">=</text>
  <text x="300.0" y="230.0" fill="#94a3b8" font-size="13" text-anchor="middle">A 의 각 행과 θ 를 짝지어 곱하고 더한다: x·w + 1·b</text>
  <text x="300.0" y="254.0" fill="#94a3b8" font-size="13" text-anchor="middle">행 3개 → 예측 3개. 점이 100만 개여도 같은 곱셈 한 번이다</text>
</svg>
