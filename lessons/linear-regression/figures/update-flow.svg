<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>update 한 번의 계산: w = 1, gradient 5, learning rate 0.1</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="120.0" height="84.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="80.0" y="64.0" fill="#38bdf8" font-size="14" text-anchor="middle">지금 w</text>
  <text x="80.0" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1</text>
  <rect x="165.0" y="40.0" width="125.0" height="84.0" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="227.5" y="64.0" fill="#f87171" font-size="14" text-anchor="middle">gradient</text>
  <text x="227.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">5</text>
  <rect x="315.0" y="40.0" width="135.0" height="84.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="382.5" y="64.0" fill="#f59e0b" font-size="14" text-anchor="middle">η × gradient</text>
  <text x="382.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0.1 × 5 = 0.5</text>
  <rect x="475.0" y="40.0" width="105.0" height="84.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="527.5" y="64.0" fill="#34d399" font-size="14" text-anchor="middle">새 w</text>
  <text x="527.5" y="88.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0.5</text>
  <line x1="142.0" y1="82.0" x2="161.0" y2="82.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="292.0" y1="82.0" x2="311.0" y2="82.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452.0" y1="82.0" x2="471.0" y2="82.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="527.0" y="144.0" fill="#94a3b8" font-size="12" text-anchor="middle">1 − 0.5 = 0.5</text>
  <rect x="20.0" y="160.0" width="120.0" height="84.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="80.0" y="184.0" fill="#38bdf8" font-size="14" text-anchor="middle">지금 w</text>
  <text x="80.0" y="208.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1</text>
  <rect x="165.0" y="160.0" width="125.0" height="84.0" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
  <text x="227.5" y="184.0" fill="#f87171" font-size="14" text-anchor="middle">gradient</text>
  <text x="227.5" y="208.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−5</text>
  <rect x="315.0" y="160.0" width="135.0" height="84.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="382.5" y="184.0" fill="#f59e0b" font-size="14" text-anchor="middle">η × gradient</text>
  <text x="382.5" y="208.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0.1 × (−5) = −0.5</text>
  <rect x="475.0" y="160.0" width="105.0" height="84.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="527.5" y="184.0" fill="#a78bfa" font-size="14" text-anchor="middle">새 w</text>
  <text x="527.5" y="208.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1.5</text>
  <line x1="142.0" y1="202.0" x2="161.0" y2="202.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="292.0" y1="202.0" x2="311.0" y2="202.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452.0" y1="202.0" x2="471.0" y2="202.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="527.0" y="264.0" fill="#94a3b8" font-size="12" text-anchor="middle">1 − (−0.5) = 1.5</text>
  <text x="300.0" y="290.0" fill="#94a3b8" font-size="13" text-anchor="middle">gradient 가 양수면 w 가 줄고, 음수면 w 가 는다</text>
</svg>
