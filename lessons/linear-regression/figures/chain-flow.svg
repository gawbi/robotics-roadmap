<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
<title>점 (2, 8) 에서 w 를 2 에서 2.01 로 바꿀 때 오차와 오차의 제곱이 변하는 과정과 칸마다의 비율</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="1" y="1" width="778" height="428" rx="12" fill="#0b1220" stroke="#1e293b"/>
<rect x="20" y="20" width="200" height="210" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
<text x="120.0" y="46" fill="#38bdf8" font-size="15" text-anchor="middle">w</text>
<line x1="32" y1="58" x2="208" y2="58" stroke="#1e293b"/>
<text x="34" y="82" fill="#94a3b8" font-size="12">변화 전</text>
<text x="120.0" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">w = 2</text>
<text x="34" y="132" fill="#94a3b8" font-size="12">변화 후</text>
<text x="120.0" y="152" fill="#e2e8f0" font-size="14" text-anchor="middle">w = 2.01</text>
<text x="34" y="182" fill="#94a3b8" font-size="12">변화량</text>
<text x="120.0" y="202" fill="#38bdf8" font-size="14" text-anchor="middle">2.01 − 2 = +0.01</text>
<rect x="290" y="20" width="200" height="210" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="2"/>
<text x="390.0" y="46" fill="#f87171" font-size="15" text-anchor="middle">오차 e = w × 2 + 1 − 8</text>
<line x1="302" y1="58" x2="478" y2="58" stroke="#1e293b"/>
<text x="304" y="82" fill="#94a3b8" font-size="12">변화 전</text>
<text x="390.0" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">2 × 2 + 1 − 8 = −3</text>
<text x="304" y="132" fill="#94a3b8" font-size="12">변화 후</text>
<text x="390.0" y="152" fill="#e2e8f0" font-size="14" text-anchor="middle">2.01 × 2 + 1 − 8 = −2.98</text>
<text x="304" y="182" fill="#94a3b8" font-size="12">변화량</text>
<text x="390.0" y="202" fill="#f87171" font-size="14" text-anchor="middle">−2.98 − (−3) = +0.02</text>
<rect x="560" y="20" width="200" height="210" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
<text x="660.0" y="46" fill="#f59e0b" font-size="15" text-anchor="middle">오차의 제곱 e²</text>
<line x1="572" y1="58" x2="748" y2="58" stroke="#1e293b"/>
<text x="574" y="82" fill="#94a3b8" font-size="12">변화 전</text>
<text x="660.0" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">(−3)² = 9</text>
<text x="574" y="132" fill="#94a3b8" font-size="12">변화 후</text>
<text x="660.0" y="152" fill="#e2e8f0" font-size="14" text-anchor="middle">(−2.98)² = 8.8804</text>
<text x="574" y="182" fill="#94a3b8" font-size="12">변화량</text>
<text x="660.0" y="202" fill="#f59e0b" font-size="14" text-anchor="middle">8.8804 − 9 = −0.1196</text>
<line x1="226" y1="125" x2="284" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="496" y1="125" x2="554" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="125" y="248" width="240" height="78" rx="10" fill="#111a2e" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="245" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">첫째 칸 비율 (w → e)</text>
<text x="245" y="292" fill="#e2e8f0" font-size="14" text-anchor="middle">+0.02 ÷ +0.01 = 2</text>
<text x="245" y="314" fill="#94a3b8" font-size="12" text-anchor="middle">공식으로는 x = 2</text>
<rect x="415" y="248" width="240" height="78" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="535" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">둘째 칸 비율 (e → e²)</text>
<text x="535" y="292" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.1196 ÷ +0.02 = −5.98</text>
<text x="535" y="314" fill="#94a3b8" font-size="12" text-anchor="middle">공식으로는 2e = 2 × (−3) = −6</text>
<rect x="90" y="344" width="600" height="68" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
<text x="390" y="370" fill="#e2e8f0" font-size="14" text-anchor="middle">전체 비율 (w → e²):  −0.1196 ÷ +0.01 = −11.96</text>
<text x="390" y="396" fill="#34d399" font-size="15" text-anchor="middle">두 비율의 곱:  2 × (−6) = −12</text>
</svg>