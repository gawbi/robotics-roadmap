  <line x1="270.0" y1="193.0" x2="270.0" y2="169.0" stroke="#d6aa62" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="260.0" y="188.4" fill="#d6aa62" font-size="12" text-anchor="end">odom 에서 (2, 0)</text>
  <path d="M270.0,145.0 L260.0,167.0 L280.0,167.0 Z" fill="#2a1d08" stroke="#d6aa62" stroke-width="2"/>
  <text x="256.0" y="149.0" fill="#d6aa62" font-size="12" text-anchor="end">base_link</text>
  <text x="284.0" y="145.0" fill="#d6aa62" font-size="12" text-anchor="start">map 에서 (5, 3)</text>
  <text x="365.0" y="52.0" fill="#94a3b8" font-size="13" text-anchor="start">odometry: T<tspan dy="4" font-size="10">odom,base</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="365.0" y="74.0" fill="#e2e8f0" font-size="14" text-anchor="start">(2, 0), yaw 0°</text>
  <text x="365.0" y="108.0" fill="#94a3b8" font-size="13" text-anchor="start">위치 추정: T<tspan dy="4" font-size="10">map,base</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="365.0" y="130.0" fill="#e2e8f0" font-size="14" text-anchor="start">(5, 3), yaw 90°</text>
  <line x1="365.0" y1="146.0" x2="640.0" y2="146.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="365.0" y="172.0" fill="#a99ad6" font-size="14" text-anchor="start">T<tspan dy="4" font-size="10">map,odom</tspan><tspan dy="-4">&#8203;</tspan> = T<tspan dy="4" font-size="10">map,base</tspan><tspan dy="-4">&#8203;</tspan> (T<tspan dy="4" font-size="10">odom,base</tspan><tspan dy="-4">&#8203;</tspan>)<tspan dy="-7" font-size="10">−1</tspan></text>
  <text x="365.0" y="198.0" fill="#94a3b8" font-size="13" text-anchor="start">(T<tspan dy="4" font-size="10">odom,base</tspan><tspan dy="-4">&#8203;</tspan>)<tspan dy="-7" font-size="10">−1</tspan><tspan dy="7">: (−2, 0), yaw 0°</tspan></text>
  <text x="365.0" y="222.0" fill="#94a3b8" font-size="13" text-anchor="start">R(90°)(−2, 0) + (5, 3) = (5, 1)</text>
  <text x="365.0" y="252.0" fill="#a99ad6" font-size="15" text-anchor="start">map → odom: (5, 1), yaw 90°</text>
  <text x="365.0" y="290.0" fill="#64748b" font-size="12" text-anchor="start">확인: R(90°)(2, 0) + (5, 1) = (5, 3)</text>
