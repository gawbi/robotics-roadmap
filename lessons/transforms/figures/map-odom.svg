<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>map 과 odom frame. odom 의 원점은 map 의 (5, 1) 에 있고 90° 돌아 있다. odometry 가 odom 에서 (2, 0) 이라고 한 로봇은 map 에서 (5, 3) 이고, T_map_odom = T_map_base × (T_odom_base)⁻¹ 로 이 관계를 구한다</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="60.0" y1="285.0" x2="60.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="60.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <line x1="102.0" y1="285.0" x2="102.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="102.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">1</text>
  <line x1="144.0" y1="285.0" x2="144.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="144.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">2</text>
  <line x1="186.0" y1="285.0" x2="186.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="186.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">3</text>
  <line x1="228.0" y1="285.0" x2="228.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="228.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">4</text>
  <line x1="270.0" y1="285.0" x2="270.0" y2="75.0" stroke="#1e293b" stroke-width="1"/>
  <text x="270.0" y="301.0" fill="#64748b" font-size="11" text-anchor="middle">5</text>
