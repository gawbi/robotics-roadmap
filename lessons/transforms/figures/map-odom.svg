  <text x="53.0" y="247.0" fill="#64748b" font-size="11" text-anchor="end">1</text>
  <line x1="60.0" y1="201.0" x2="312.0" y2="201.0" stroke="#1e293b" stroke-width="1"/>
  <text x="53.0" y="205.0" fill="#64748b" font-size="11" text-anchor="end">2</text>
  <line x1="60.0" y1="159.0" x2="312.0" y2="159.0" stroke="#1e293b" stroke-width="1"/>
