  <line x1="60.0" y1="285.0" x2="60.0" y2="235.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="116.0" y="279.0" fill="#94a3b8" font-size="13" text-anchor="start">x<tspan dy="4" font-size="10">map</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="66.0" y="231.0" fill="#94a3b8" font-size="13" text-anchor="start">y<tspan dy="4" font-size="10">map</tspan><tspan dy="-4">&#8203;</tspan></text>
  <circle cx="60.0" cy="285.0" r="4" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/>
  <text x="64.0" y="319.0" fill="#94a3b8" font-size="13" text-anchor="start">map</text>
  <line x1="270.0" y1="243.0" x2="270.0" y2="198.0" stroke="#a99ad6" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <line x1="270.0" y1="243.0" x2="225.0" y2="243.0" stroke="#a99ad6" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="276.0" y="203.0" fill="#a99ad6" font-size="13" text-anchor="start">x<tspan dy="4" font-size="10">odom</tspan><tspan dy="-4">&#8203;</tspan></text>
  <text x="220.0" y="265.0" fill="#a99ad6" font-size="13" text-anchor="start">y<tspan dy="4" font-size="10">odom</tspan><tspan dy="-4">&#8203;</tspan></text>
