<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 372" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 카메라에 붙은 두 frame. camera_link 는 x 가 앞·y 가 왼쪽·z 가 위이고, optical frame 은 z 가 앞·x 가 오른쪽·y 가 아래다. optical frame 의 축을 camera_link 에서 재면 x 는 (0, −1, 0), y 는 (0, 0, −1), z 는 (1, 0, 0) 이고, URDF 로는 rpy = (−1.5708, 0, −1.5708) 이다</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="370" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="140.0" y="42.0" fill="#e2e8f0" font-size="15" text-anchor="middle">camera_link</text>
  <path d="M120.7,155.3 L164.7,155.3 L130.9,130.7 L86.9,130.7 Z" fill="#152036" stroke="#475569" stroke-width="1.2"/>
  <path d="M120.7,199.3 L164.7,199.3 L164.7,155.3 L120.7,155.3 Z" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <path d="M164.7,199.3 L130.9,174.7 L130.9,130.7 L164.7,155.3 Z" fill="#18243d" stroke="#475569" stroke-width="1.2"/>
  <ellipse cx="147.8" cy="165.0" rx="9" ry="16" fill="#0b1220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="150.0" y1="165.0" x2="260.0" y2="165.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="266.0" y="170.0" fill="#d88b8b" font-size="14" text-anchor="start">x 앞</text>
  <line x1="150.0" y1="165.0" x2="89.5" y2="121.0" stroke="#7fc4a2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="37.5" y="117.0" fill="#7fc4a2" font-size="14" text-anchor="start">y 왼쪽</text>
  <line x1="150.0" y1="165.0" x2="150.0" y2="55.0" stroke="#7cb4d8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <text x="158.0" y="59.0" fill="#7cb4d8" font-size="14" text-anchor="start">z 위</text>
  <circle cx="150.0" cy="165.0" r="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="440.0" y="42.0" fill="#e2e8f0" font-size="15" text-anchor="middle">camera_optical_frame</text>
  <path d="M420.7,155.3 L464.7,155.3 L430.9,130.7 L386.9,130.7 Z" fill="#152036" stroke="#475569" stroke-width="1.2"/>
  <path d="M420.7,199.3 L464.7,199.3 L464.7,155.3 L420.7,155.3 Z" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <path d="M464.7,199.3 L430.9,174.7 L430.9,130.7 L464.7,155.3 Z" fill="#18243d" stroke="#475569" stroke-width="1.2"/>
  <ellipse cx="447.8" cy="165.0" rx="9" ry="16" fill="#0b1220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="450.0" y1="165.0" x2="560.0" y2="165.0" stroke="#7cb4d8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <text x="566.0" y="170.0" fill="#7cb4d8" font-size="14" text-anchor="start">z 앞</text>
  <line x1="450.0" y1="165.0" x2="510.5" y2="209.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="516.5" y="223.0" fill="#d88b8b" font-size="14" text-anchor="start">x 오른쪽</text>
  <line x1="450.0" y1="165.0" x2="450.0" y2="253.0" stroke="#7fc4a2" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="458.0" y="257.0" fill="#7fc4a2" font-size="14" text-anchor="start">y 아래</text>
  <circle cx="450.0" cy="165.0" r="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330.0" y="300.0" fill="#94a3b8" font-size="13" text-anchor="middle">optical frame 의 축을 camera_link 에서 잰 값 (R 의 열)</text>
  <text x="330.0" y="324.0" fill="#d6aa62" font-size="14" text-anchor="middle">x = (0, −1, 0), y = (0, 0, −1), z = (1, 0, 0)</text>
  <text x="330.0" y="352.0" fill="#a99ad6" font-size="13" text-anchor="middle">URDF: rpy = "−1.5708 0 −1.5708"  →  R = R<tspan dy="4" font-size="10">z</tspan><tspan dy="-4">(−90°) R</tspan><tspan dy="4" font-size="10">x</tspan><tspan dy="-4">(−90°)</tspan></text>
</svg>
