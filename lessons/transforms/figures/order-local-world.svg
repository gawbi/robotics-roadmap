  <text x="153.0" y="245.0" fill="#7fc4a2" font-size="13" text-anchor="end">y<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan></text>
  <text x="195.0" y="266.0" fill="#e2e8f0" font-size="13" text-anchor="middle">처음 (3, 1)</text>
  <line x1="195.0" y1="150.0" x2="195.0" y2="114.0" stroke="#7cb4d8" stroke-width="3" marker-end="url(#arrow-sky)"/>
  <circle cx="195.0" cy="150.0" r="5" fill="#7cb4d8"/>
  <line x1="204.0" y1="231.0" x2="204.0" y2="159.0" stroke="#7cb4d8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-sky)"/>
  <text x="195.0" y="104.0" fill="#7cb4d8" font-size="13" text-anchor="middle">T<tspan dy="4" font-size="10">wb</tspan><tspan dy="-4">​</tspan> M</text>
  <text x="205.0" y="155.0" fill="#7cb4d8" font-size="13" text-anchor="start">(3, 3)</text>
  <line x1="285.0" y1="240.0" x2="285.0" y2="204.0" stroke="#a99ad6" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <circle cx="285.0" cy="240.0" r="5" fill="#a99ad6"/>
  <line x1="204.0" y1="249.0" x2="276.0" y2="249.0" stroke="#a99ad6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="285.0" y="194.0" fill="#a99ad6" font-size="13" text-anchor="middle">M T<tspan dy="4" font-size="10">wb</tspan><tspan dy="-4">​</tspan></text>
  <text x="285.0" y="266.0" fill="#a99ad6" font-size="13" text-anchor="middle">(5, 1)</text>
  <text x="390.0" y="50.0" fill="#e2e8f0" font-size="14" text-anchor="start">M: x 방향으로 2 이동</text>
  <text x="390.0" y="92.0" fill="#7cb4d8" font-size="14" text-anchor="start">오른쪽에 곱하기 T<tspan dy="4" font-size="10">wb</tspan><tspan dy="-4">​</tspan> M</text>
  <text x="390.0" y="114.0" fill="#7cb4d8" font-size="13" text-anchor="start">로봇 자신의 x 축 = 위쪽으로 2</text>
  <text x="390.0" y="156.0" fill="#a99ad6" font-size="14" text-anchor="start">왼쪽에 곱하기 M T<tspan dy="4" font-size="10">wb</tspan><tspan dy="-4">​</tspan></text>
  <text x="390.0" y="178.0" fill="#a99ad6" font-size="13" text-anchor="start">world 의 x 축 = 오른쪽으로 2</text>
  <text x="390.0" y="230.0" fill="#94a3b8" font-size="13" text-anchor="start">오른쪽 곱: 움직이는 물체 기준</text>
  <text x="390.0" y="252.0" fill="#94a3b8" font-size="13" text-anchor="start">왼쪽 곱: 고정된 world 기준</text>
  <text x="390.0" y="284.0" fill="#64748b" font-size="12" text-anchor="start">화살표 하나 = 그 자세의 x 축</text>
