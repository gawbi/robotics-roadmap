  <text x="68.0" y="247.0" fill="#94a3b8" font-size="13" text-anchor="start">y<tspan dy="4" font-size="10">w</tspan><tspan dy="-4">​</tspan></text>
  <line x1="195.0" y1="240.0" x2="195.0" y2="204.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#arrow-red)"/>
