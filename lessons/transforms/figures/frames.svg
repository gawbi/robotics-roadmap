  <text x="400.0" y="78.0" fill="#94a3b8" font-size="13" text-anchor="start">R<tspan dy="4" font-size="10">z</tspan><tspan dy="-4">​</tspan>(90°), p = (1, 2, 0)</text>
  <text x="400.0" y="112.0" fill="#e2e8f0" font-size="14" text-anchor="start">T<tspan dy="4" font-size="10">bc</tspan><tspan dy="-4">​</tspan></text>
  <text x="400.0" y="134.0" fill="#94a3b8" font-size="13" text-anchor="start">R = I, p = (0.5, 0, 0.4)</text>
  <text x="400.0" y="168.0" fill="#d6aa62" font-size="14" text-anchor="start">T<tspan dy="4" font-size="10">wc</tspan><tspan dy="-4">​</tspan></text>
  <text x="400.0" y="190.0" fill="#94a3b8" font-size="13" text-anchor="start">R<tspan dy="4" font-size="10">z</tspan><tspan dy="-4">​</tspan>(90°), p = (1, 2.5, 0.4)</text>
