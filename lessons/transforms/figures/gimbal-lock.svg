<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>gimbal lock. pitch 가 0° 이면 roll 의 축(x)과 yaw 의 축(z)이 직각이지만, pitch 가 90° 이면 roll 의 축이 눕혀져 yaw 의 축과 같은 직선 위에 놓인다. 그래서 rpy (30°, 90°, 0°) 와 (0°, 90°, −30°) 는 같은 자세다</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="658" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="165.0" y="38.0" fill="#e2e8f0" font-size="15" text-anchor="middle">pitch = 0°</text>
  <line x1="165.0" y1="150.0" x2="165.0" y2="55.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <text x="173.0" y="59.0" fill="#38bdf8" font-size="13" text-anchor="start">yaw 의 축 z</text>
  <path d="M141.5,132.9 L134.4,133.2 L128.3,133.9 L123.3,135.2 L119.5,136.9 L117.1,139.0 L116.2,141.4 L116.8,144.2 L118.8,147.0 L122.2,150.0 L127.0,153.0 L132.9,155.8 L139.7,158.6 L147.4,161.0 L155.5,163.1 L164.0,164.8 L172.5,166.1 L180.7,166.8 L188.5,167.1 L195.6,166.8 L201.7,166.1 L206.7,164.8 L210.5,163.1 L212.9,161.0 L213.8,158.6 L213.2,155.8 L211.2,153.0 L207.8,150.0 L203.0,147.0 L197.1,144.2 L190.3,141.4" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
  <line x1="165.0" y1="150.0" x2="260.0" y2="150.0" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="266.0" y="155.0" fill="#f87171" font-size="13" text-anchor="start">roll 의 축 x</text>
  <path d="M248.2,162.2 L248.0,167.3 L247.2,171.8 L246.0,175.7 L244.3,178.9 L242.2,181.1 L239.9,182.4 L237.2,182.7 L234.4,182.0 L231.5,180.4 L228.6,177.8 L225.8,174.4 L223.1,170.2 L220.8,165.5 L218.7,160.2 L217.0,154.7 L215.8,149.0 L215.0,143.3 L214.8,137.8 L215.0,132.7 L215.8,128.2 L217.0,124.3 L218.7,121.1 L220.8,118.9 L223.1,117.6 L225.8,117.3 L228.6,118.0 L231.5,119.6 L234.4,122.2 L237.2,125.6 L239.9,129.8" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>
  <circle cx="165.0" cy="150.0" r="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <text x="495.0" y="38.0" fill="#e2e8f0" font-size="15" text-anchor="middle">pitch = 90°</text>
  <line x1="495.0" y1="150.0" x2="495.0" y2="55.0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <text x="503.0" y="59.0" fill="#38bdf8" font-size="13" text-anchor="start">yaw 의 축 z</text>
