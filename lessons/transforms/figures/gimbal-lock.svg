  <line x1="495.0" y1="150.0" x2="495.0" y2="245.0" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="503.0" y="249.0" fill="#f87171" font-size="13" text-anchor="start">roll 의 축 x (눕혀짐)</text>
  <path d="M478.3,204.3 L473.3,204.5 L468.9,205.1 L465.3,206.0 L462.7,207.2 L461.0,208.7 L460.3,210.4 L460.7,212.3 L462.2,214.4 L464.6,216.5 L468.0,218.6 L472.2,220.7 L477.0,222.6 L482.5,224.3 L488.3,225.8 L494.3,227.0 L500.3,227.9 L506.2,228.5 L511.7,228.7 L516.7,228.5 L521.1,227.9 L524.7,227.0 L527.3,225.8 L529.0,224.3 L529.7,222.6 L529.3,220.7 L527.8,218.6 L525.4,216.5 L522.0,214.4 L517.8,212.3 L513.0,210.4" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <circle cx="495.0" cy="150.0" r="4" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="330.0" y1="30.0" x2="330.0" y2="250.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="165.0" y="280.0" fill="#94a3b8" font-size="13" text-anchor="middle">두 축이 직각이라 roll 과 yaw 가 다른 방향으로 돌린다</text>
  <text x="495.0" y="280.0" fill="#94a3b8" font-size="13" text-anchor="middle">두 축이 겹쳐 roll 과 yaw 가 같은 방향으로 돌린다</text>
  <text x="330.0" y="312.0" fill="#f59e0b" font-size="14" text-anchor="middle">rpy (30°, 90°, 0°) 와 (0°, 90°, −30°) 의 rotation matrix 가 같다</text>
</svg>
