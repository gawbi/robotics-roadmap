  <text x="106.0" y="140.0" fill="#e2e8f0" font-size="12" text-anchor="start">30°</text>
  <text x="106.0" y="178.0" fill="#94a3b8" font-size="12" text-anchor="start">30°</text>
  <path d="M223.20508075688775,150 L223.20508075688775,140 L233.20508075688775,140" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300.0" y="50.0" fill="#94a3b8" font-size="14" text-anchor="start">세 변이 모두 1 인 정삼각형</text>
  <text x="300.0" y="74.0" fill="#94a3b8" font-size="13" text-anchor="start">가로축이 꼭짓점 각 60° 를 30° 둘로 나눈다</text>
  <text x="300.0" y="112.0" fill="#34d399" font-size="15" text-anchor="start">세로 변 = 1 ÷ 2 = 0.5</text>
  <text x="300.0" y="136.0" fill="#34d399" font-size="14" text-anchor="start">→ sin 30° = 0.5</text>
  <text x="300.0" y="180.0" fill="#e2e8f0" font-size="15" text-anchor="start">가로² + 0.5² = 1²</text>
  <text x="300.0" y="204.0" fill="#e2e8f0" font-size="14" text-anchor="start">가로² = 1 − 0.25 = 0.75</text>
  <text x="300.0" y="228.0" fill="#f87171" font-size="15" text-anchor="start">가로 = √0.75 ≈ 0.866</text>
  <text x="300.0" y="252.0" fill="#f87171" font-size="14" text-anchor="start">→ cos 30° ≈ 0.866</text>
</svg>
