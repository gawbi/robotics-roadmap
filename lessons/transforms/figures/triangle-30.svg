<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 변이 1 인 정삼각형을 가로축이 반으로 나눈다. 30° 꼭짓점의 높이는 0.5 이고, 가로 길이는 √0.75 ≈ 0.866 이다</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="60.0" y1="150.0" x2="233.2" y2="50.0" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="60.0" y1="150.0" x2="233.2" y2="250.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="233.2" y1="50.0" x2="233.2" y2="250.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="44.0" y1="150.0" x2="270.0" y2="150.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="60.0" y1="150.0" x2="233.2" y2="150.0" stroke="#f87171" stroke-width="3"/>
  <line x1="233.2" y1="150.0" x2="233.2" y2="50.0" stroke="#34d399" stroke-width="3"/>
  <circle cx="60.0" cy="150.0" r="4" fill="#e2e8f0"/>
  <circle cx="233.2" cy="50.0" r="6" fill="#f59e0b"/>
  <circle cx="233.2" cy="250.0" r="4" fill="#94a3b8"/>
  <text x="140.6" y="90.0" fill="#f59e0b" font-size="14" text-anchor="start">1</text>
  <text x="140.6" y="220.0" fill="#94a3b8" font-size="14" text-anchor="start">1</text>
  <text x="243.2" y="104.0" fill="#34d399" font-size="14" text-anchor="start">0.5</text>
  <text x="243.2" y="204.0" fill="#94a3b8" font-size="14" text-anchor="start">0.5</text>
  <text x="176.0" y="170.0" fill="#f87171" font-size="14" text-anchor="middle">0.866</text>
  <path d="M100.0,150.0 L100.0,149.5 L100.0,149.0 L100.0,148.4 L99.9,147.9 L99.9,147.4 L99.9,146.9 L99.8,146.3 L99.8,145.8 L99.7,145.3 L99.7,144.8 L99.6,144.3 L99.5,143.7 L99.4,143.2 L99.3,142.7 L99.2,142.2 L99.1,141.7 L99.0,141.2 L98.9,140.7 L98.8,140.2 L98.6,139.6 L98.5,139.1 L98.4,138.6 L98.2,138.1 L98.0,137.6 L97.9,137.1 L97.7,136.6 L97.5,136.2 L97.3,135.7 L97.2,135.2 L97.0,134.7 L96.8,134.2 L96.5,133.7 L96.3,133.3 L96.1,132.8 L95.9,132.3 L95.6,131.8 L95.4,131.4 L95.2,130.9 L94.9,130.5 L94.6,130.0" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
