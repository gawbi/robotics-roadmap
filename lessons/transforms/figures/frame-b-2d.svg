  <text x="150.0" y="115.0" fill="#f59e0b" font-size="14" text-anchor="end">(2, 3)</text>
  <text x="218.0" y="179.0" fill="#f87171" font-size="13" text-anchor="start">2 칸</text>
  <text x="185.0" y="115.0" fill="#34d399" font-size="13" text-anchor="middle">1 칸</text>
  <text x="135.0" y="270.0" fill="#a78bfa" font-size="13" text-anchor="start">(3, 1)</text>
  <text x="220.0" y="245.0" fill="#e2e8f0" font-size="15" text-anchor="start">b</text>
  <text x="360.0" y="56.0" fill="#94a3b8" font-size="13" text-anchor="start">frame b: 90° 회전, 원점 (3, 1)</text>
  <text x="360.0" y="96.0" fill="#e2e8f0" font-size="15" text-anchor="start">R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> p<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> = (−1, 2)</text>
  <text x="360.0" y="120.0" fill="#a78bfa" font-size="15" text-anchor="start">+ p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> = (3, 1)</text>
  <line x1="360.0" y1="132.0" x2="560.0" y2="132.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="360.0" y="156.0" fill="#f59e0b" font-size="16" text-anchor="start">p<tspan dy="4" font-size="11">a</tspan><tspan dy="-4">​</tspan> = (2, 3)</text>
  <text x="360.0" y="210.0" fill="#f87171" font-size="12" text-anchor="start">빨강 점선: x<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> 방향 2 칸 = 위로 2</text>
  <text x="360.0" y="232.0" fill="#34d399" font-size="12" text-anchor="start">초록 점선: y<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> 방향 1 칸 = 왼쪽 1</text>
