<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>3D 회전은 순서를 바꾸면 결과가 다르다. R_z(90°)R_x(90°) 와 R_x(90°)R_z(90°) 를 적용한 뒤의 새 축 x′, y′, z′</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="678" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="180.0" y="34.0" fill="#d6aa62" font-size="15" text-anchor="middle">R<tspan dy="4" font-size="10">z</tspan><tspan dy="-4">​</tspan>(90°) R<tspan dy="4" font-size="10">x</tspan><tspan dy="-4">​</tspan>(90°)</text>
  <line x1="100.0" y1="170.0" x2="44.8" y2="211.4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="32.7" y="225.5" fill="#94a3b8" font-size="12" text-anchor="middle">x</text>
  <line x1="100.0" y1="170.0" x2="187.4" y2="190.2" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="206.6" y="199.7" fill="#94a3b8" font-size="12" text-anchor="middle">y</text>
  <line x1="100.0" y1="170.0" x2="100.0" y2="78.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="100.0" y="62.8" fill="#94a3b8" font-size="12" text-anchor="middle">z</text>
  <line x1="100.0" y1="170.0" x2="160.8" y2="184.1" stroke="#d88b8b" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="174.2" y="192.2" fill="#d88b8b" font-size="14" text-anchor="middle">x′</text>
  <line x1="100.0" y1="170.0" x2="100.0" y2="106.0" stroke="#7fc4a2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="100.0" y="96.9" fill="#7fc4a2" font-size="14" text-anchor="middle">y′</text>
  <line x1="100.0" y1="170.0" x2="61.6" y2="198.8" stroke="#7cb4d8" stroke-width="3" marker-end="url(#arrow-sky)"/>
  <text x="53.2" y="210.1" fill="#7cb4d8" font-size="14" text-anchor="middle">z′</text>
  <text x="235.0" y="120.0" fill="#d88b8b" font-size="13" text-anchor="start">x′ = (0, 1, 0)</text>
  <text x="235.0" y="146.0" fill="#7fc4a2" font-size="13" text-anchor="start">y′ = (0, 0, 1)</text>
  <text x="235.0" y="172.0" fill="#7cb4d8" font-size="13" text-anchor="start">z′ = (1, 0, 0)</text>
  <text x="510.0" y="34.0" fill="#d6aa62" font-size="15" text-anchor="middle">R<tspan dy="4" font-size="10">x</tspan><tspan dy="-4">​</tspan>(90°) R<tspan dy="4" font-size="10">z</tspan><tspan dy="-4">​</tspan>(90°)</text>
  <line x1="430.0" y1="170.0" x2="374.8" y2="211.4" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="362.7" y="225.5" fill="#94a3b8" font-size="12" text-anchor="middle">x</text>
  <line x1="430.0" y1="170.0" x2="517.4" y2="190.2" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="536.6" y="199.7" fill="#94a3b8" font-size="12" text-anchor="middle">y</text>
  <line x1="430.0" y1="170.0" x2="430.0" y2="78.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" opacity="0.5"/>
  <text x="430.0" y="62.8" fill="#94a3b8" font-size="12" text-anchor="middle">z</text>
  <line x1="430.0" y1="170.0" x2="430.0" y2="106.0" stroke="#d88b8b" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="430.0" y="96.9" fill="#d88b8b" font-size="14" text-anchor="middle">x′</text>
  <line x1="430.0" y1="170.0" x2="468.4" y2="141.2" stroke="#7fc4a2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="476.8" y="139.9" fill="#7fc4a2" font-size="14" text-anchor="middle">y′</text>
  <line x1="430.0" y1="170.0" x2="369.2" y2="155.9" stroke="#7cb4d8" stroke-width="3" marker-end="url(#arrow-sky)"/>
  <text x="355.8" y="157.8" fill="#7cb4d8" font-size="14" text-anchor="middle">z′</text>
  <text x="565.0" y="120.0" fill="#d88b8b" font-size="13" text-anchor="start">x′ = (0, 0, 1)</text>
  <text x="565.0" y="146.0" fill="#7fc4a2" font-size="13" text-anchor="start">y′ = (−1, 0, 0)</text>
  <text x="565.0" y="172.0" fill="#7cb4d8" font-size="13" text-anchor="start">z′ = (0, −1, 0)</text>
  <text x="340.0" y="300.0" fill="#94a3b8" font-size="13" text-anchor="middle">회색 점선: 처음 축.  색 화살표: 두 회전을 마친 뒤의 축</text>
</svg>
