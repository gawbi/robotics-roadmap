<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇 손을 z 축으로 0° 에서 90° 까지 돌릴 때의 중간 자세. 원하는 움직임은 t = 0, 0.25, 0.5, 0.75, 1 에서 0°, 22.5°, 45°, 67.5°, 90° 로 각도가 고르게 늘고 크기는 그대로다. rotation matrix 를 칸마다 평균하면 0°, 18.4°, 45°, 71.6°, 90° 로 칸 사이에 18.4°, 26.6°, 26.6°, 18.4° 씩 더 돌아 간격이 고르지 않고 손이 1, 0.79, 0.71, 0.79, 1 배로 쪼그라든다</title>
