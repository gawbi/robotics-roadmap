  <text x="340" y="386" fill="#94a3b8" font-size="12" text-anchor="middle">점선 원은 손 끝이 닿는 반지름 1 배이고, 주황 호는 처음 방향(회색 선)에서 돈 각도, 칸 사이 숫자는 앞 칸보다 더 돈 각도다</text>
