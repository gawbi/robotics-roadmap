  <text x="630" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">t = 1</text>
  <text x="30" y="126" fill="#38bdf8" font-size="13" font-weight="600">원하는 움직임</text>
  <text x="30" y="144" fill="#94a3b8" font-size="11">각도가 고르게 는다</text>
  <text x="30" y="276" fill="#f87171" font-size="13" font-weight="600">행렬 칸 평균</text>
  <text x="30" y="294" fill="#94a3b8" font-size="11">덜 돌거나 더 돌고 줄어든다</text>
