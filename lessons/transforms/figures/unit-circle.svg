  <text x="360.0" y="192.0" fill="#e2e8f0" font-size="14" text-anchor="middle">120°</text>
  <text x="440.0" y="192.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−0.5</text>
  <text x="530.0" y="192.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0.866</text>
  <text x="360.0" y="220.0" fill="#e2e8f0" font-size="14" text-anchor="middle">180°</text>
  <text x="440.0" y="220.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−1</text>
  <text x="530.0" y="220.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="360.0" y="248.0" fill="#e2e8f0" font-size="14" text-anchor="middle">270°</text>
  <text x="440.0" y="248.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="530.0" y="248.0" fill="#e2e8f0" font-size="14" text-anchor="middle">−1</text>
  <text x="330.0" y="300.0" fill="#94a3b8" font-size="13" text-anchor="start">원 위의 점 = (cos θ, sin θ)</text>
  <text x="330.0" y="322.0" fill="#64748b" font-size="12" text-anchor="start">각도는 x 축에서 시계 반대 방향으로 잰다</text>
