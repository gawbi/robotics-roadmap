  <circle cx="50.0" cy="270.0" r="4" fill="#0b1220" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
  <text x="58.0" y="234.0" fill="#94a3b8" font-size="13" text-anchor="start">y<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan></text>
  <line x1="185.0" y1="225.0" x2="221.0" y2="225.0" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-red)" opacity="0.6"/>
