  <circle cx="275.0" cy="180.0" r="7" fill="#f59e0b"/>
  <text x="146.0" y="265.9" fill="#a78bfa" font-size="14" text-anchor="start">p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> = (3, 1)</text>
  <text x="260.0" y="215.5" fill="#38bdf8" font-size="14" text-anchor="start">p<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> = (2, 1)</text>
  <text x="137.0" y="218.4" fill="#f59e0b" font-size="14" text-anchor="end">p<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan> = (5, 2)</text>
  <text x="395.0" y="70.0" fill="#e2e8f0" font-size="17" text-anchor="start">p<tspan dy="4" font-size="12">a</tspan><tspan dy="-4">​</tspan> = p<tspan dy="4" font-size="12">ab</tspan><tspan dy="-4">​</tspan> + p<tspan dy="4" font-size="12">b</tspan><tspan dy="-4">​</tspan></text>
  <text x="395.0" y="110.0" fill="#f59e0b" font-size="15" text-anchor="start">(5, 2) = (3, 1) + (2, 1)</text>
  <text x="395.0" y="150.0" fill="#94a3b8" font-size="14" text-anchor="start">x 칸: 3 + 2 = 5</text>
  <text x="395.0" y="174.0" fill="#94a3b8" font-size="14" text-anchor="start">y 칸: 1 + 1 = 2</text>
  <text x="395.0" y="230.0" fill="#a78bfa" font-size="13" text-anchor="start">보라: a 원점 → b 원점</text>
  <text x="395.0" y="252.0" fill="#38bdf8" font-size="13" text-anchor="start">하늘: b 원점 → 컵</text>
  <text x="395.0" y="274.0" fill="#f59e0b" font-size="13" text-anchor="start">주황: a 원점 → 컵</text>
