<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>역변환의 계산 순서. frame a 의 (2, 3) 에서 원점 위치 (3, 1) 을 빼고 −90° 돌리면 frame b 의 (2, 1) 이 된다. 이동 (−3, −1) 만 쓰면 틀린다</title>
  <defs><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="638" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="120.0" height="56.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80.0" y="63.0" fill="#94a3b8" font-size="12" text-anchor="middle">frame a 에서</text>
  <text x="80.0" y="84.0" fill="#e2e8f0" font-size="15" text-anchor="middle">p<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan> = (2, 3)</text>
  <line x1="142.0" y1="68.0" x2="212.0" y2="68.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="177.0" y="58.0" fill="#a78bfa" font-size="13" text-anchor="middle">− p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan></text>
  <text x="177.0" y="92.0" fill="#a78bfa" font-size="12" text-anchor="middle">− (3, 1)</text>
  <rect x="214.0" y="40.0" width="120.0" height="56.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="274.0" y="63.0" fill="#94a3b8" font-size="12" text-anchor="middle">원점을 맞춘 뒤</text>
  <text x="274.0" y="84.0" fill="#e2e8f0" font-size="15" text-anchor="middle">(−1, 2)</text>
  <line x1="336.0" y1="68.0" x2="446.0" y2="68.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="391.0" y="58.0" fill="#34d399" font-size="13" text-anchor="middle">R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan>ᵀ 곱하기</text>
  <text x="391.0" y="92.0" fill="#34d399" font-size="12" text-anchor="middle">−90° 회전</text>
  <rect x="448.0" y="40.0" width="160.0" height="56.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="528.0" y="63.0" fill="#94a3b8" font-size="12" text-anchor="middle">frame b 에서</text>
  <text x="528.0" y="84.0" fill="#e2e8f0" font-size="15" text-anchor="middle">p<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> = (2, 1)</text>
  <text x="20.0" y="150.0" fill="#e2e8f0" font-size="14" text-anchor="start">한 식으로: p<tspan dy="4" font-size="10">b</tspan><tspan dy="-4">​</tspan> = R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan>ᵀ p<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan> − R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan>ᵀ p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> = (3, −2) + (−1, 3) = (2, 1)</text>
  <text x="20.0" y="176.0" fill="#34d399" font-size="14" text-anchor="start">T<tspan dy="4" font-size="10">ba</tspan><tspan dy="-4">​</tspan> 의 이동 칸은 −R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan>ᵀ p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> = (−1, 3)</text>
  <text x="20.0" y="222.0" fill="#f87171" font-size="14" text-anchor="start">흔한 실수: 이동 칸에 −p<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan> = (−3, −1) 을 넣기</text>
  <text x="20.0" y="246.0" fill="#f87171" font-size="14" text-anchor="start">R<tspan dy="4" font-size="10">ab</tspan><tspan dy="-4">​</tspan>ᵀ p<tspan dy="4" font-size="10">a</tspan><tspan dy="-4">​</tspan> + (−3, −1) = (3, −2) + (−3, −1) = (0, −3)  ✗</text>
</svg>
