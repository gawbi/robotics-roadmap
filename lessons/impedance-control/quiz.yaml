# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: contact-stiffness
  title: 접촉과 position 제어
  section: 접촉과-position-제어
  variants:
    - question: |
        PD position 제어로 움직이는 팔의 목표 위치가 실수로 단단한 책상 표면보다 조금 아래에 찍혔다. 손끝이 책상에 닿은 뒤 어떤 일이 생기는가?
      choices:
        - '손끝이 목표에 닿을 수 없으니 controller 가 오차를 무시하고 힘을 0 으로 낸다'
        - '책상이 단단하므로 손끝은 책상을 밀지 않고 표면에서 그대로 멈춘다'
        - '막혀서 남은 오차에 손끝 stiffness 를 곱한 만큼의 힘으로 책상을 계속 누른다'
        - '오차가 줄지 않으면 D 항이 커져서, 손끝을 책상에서 위로 떼어 낸다'
      answer: 2
      explanation: |
        PD 의 P 항은 오차에 비례하는 힘을 내므로 손끝에서 보면 목표에 묶인 용수철이다. 손끝이 책상에 막혀 멈추면 오차가 그대로 남고,
        그 오차에 stiffness 를 곱한 힘으로 책상을 누른다. controller 는 오차를 무시하지 않고, 멈춘 상태에서 D 항은 속도가 0 이라 0 이다.
    - question: |
        joint 하나의 P gain 이 4000 N·m/rad 이고 그 joint 에서 손끝까지 0.5 m 다. 손끝이 목표보다 1 mm 덜 간 채 벽에 막혀 있으면 손끝은 대략 몇 N 으로 벽을 누를까?
      choices:
        - '16 N'
        - '2 N'
        - '8 N'
        - '4000 N'
      answer: 0
      explanation: |
        joint stiffness $K_p$ 는 손끝에서 $K_p / l^2$ 의 stiffness 가 된다. $4000 \div 0.5^2 = 16000$ N/m 이고, 1 mm 를 곱하면 16 N 이다.
        8 N 은 $l$ 로 한 번만 나눈 값이고, 2 N 은 $l^2$ 로 나누지 않고 $l$ 을 곱한 값이며, 4000 N 은 단위를 바꾸지 않은 값이다.
    - question: |
        position controller 에 I 항이 있는 팔이 목표를 벽 안쪽에 둔 채 벽에 막혀 있다. 시간이 지나면 누르는 힘은 어떻게 되는가?
      choices:
        - 'I 항이 오차를 0 으로 만들었으므로, 누르는 힘도 시간이 지나며 점점 줄어든다'
        - 'P 항이 내는 힘에서 더 늘지 않고, 처음 막혔을 때의 힘으로 일정하게 유지된다'
        - 'D 항이 I 항을 상쇄하면서, 누르는 힘이 커졌다 작아졌다 하며 진동한다'
        - '남은 오차가 I 항에 계속 쌓여, torque 한계나 충돌 정지까지 힘이 커진다'
      answer: 3
      explanation: |
        벽에 막히면 오차가 줄지 않으므로 I 항은 오차를 계속 쌓고 힘이 끝없이 커진다. motor 의 torque 한계에 걸리거나 충돌 감지로 팔이 서야 멈춘다.
        I 항이 오차를 0 으로 만드는 것은 손끝이 움직일 수 있을 때의 일이고, P 항만 남는 것은 I 항이 없을 때다. 멈춘 상태에서 D 항은 0 이다.

- topic: jacobian-transpose
  title: 손끝 힘과 joint torque
  section: 손끝-힘과-joint-torque
  variants:
    - question: |
        손끝으로 원하는 힘 F 를 내려면 joint torque 를 어떻게 계산하는가?
      choices:
        - 'Jacobian 의 역행렬을 F 에 곱해, 손끝 힘을 joint torque 로 되돌린다'
        - 'Jacobian 의 transpose 를 F 에 곱해 τ = JᵀF 로 구한다'
        - 'F 에 팔 길이를 곱해 모든 joint 에 같은 torque 를 준다'
        - 'IK 로 손끝 위치를 joint angle 로 바꾼 뒤 그 각도에 비례하는 torque 를 준다'
      answer: 1
      explanation: |
        joint 가 넣는 일률 $\tau^\top \dot q$ 와 손끝이 하는 일률 $F^\top v$ 가 같고 $v = J\dot q$ 이므로 $\tau = J^\top F$ 다. Jacobian 의 역행렬은
        손끝 속도에서 joint 속도를 구할 때 쓰는 것이고, joint 마다 손끝까지의 거리와 방향이 달라 같은 torque 를 주면 안 된다. IK 는 위치를 바꾸는
        계산이지 힘을 바꾸는 계산이 아니다.
    - question: |
        두 joint 팔의 어느 자세에서 Jacobian 이 J = [[−0.5, −0.5], [0.5, 0]] 이다(첫째 행이 손끝 x, 둘째 행이 손끝 y). 손끝으로 F = (0, −10) N 을 내려면 τ = JᵀF 는?
      choices:
        - '(−5, −5) N·m'
        - '(5, 5) N·m'
        - '(5, 0) N·m'
        - '(−5, 0) N·m'
      answer: 3
      explanation: |
        $\tau_1$ 은 $J$ 의 첫째 열 $(-0.5, 0.5)$ 과 $F$ 를 곱해 더한 $0 + 0.5 \times (-10) = -5$, $\tau_2$ 는 둘째 열 $(-0.5, 0)$ 과 곱한 $0 + 0 = 0$ 이다.
        $(5, 0)$ 은 transpose 없이 $JF$ 를 계산한 값이고, $(-5, -5)$ 는 옆으로 미는 힘 $(10, 0)$ 일 때의 답, $(5, 5)$ 는 그 부호를 뒤집은 값이다.
    - question: |
        팔을 쭉 편 singularity 자세에서 joint torque 센서로 손끝 외력을 추정하려고 한다. 무엇이 문제인가?
      choices:
        - '팔을 따라 미는 힘은 joint torque 를 만들지 않아서, 그 방향의 힘을 추정할 수 없다'
        - 'singularity 에서는 joint torque 가 무한대로 커져서, torque 센서가 포화된다'
        - '팔을 쭉 펴면 gravity torque 가 사라져서, 외력 추정에 쓰는 model 이 틀린다'
        - 'singularity 에서는 τ = JᵀF 가 성립하지 않아서, τ = JF 로 바꿔 계산해야 한다'
      answer: 0
      explanation: |
        팔을 쭉 펴면 팔을 따라 미는 힘은 구조가 받아 내고 joint torque 를 만들지 않는다. 그래서 $J^\top$ 의 역행렬이 없고 그 방향의 힘은 torque 로
        추정할 수 없다. Franka 의 외력 추정값도 singularity 근처에서 0 이 된다. singularity 에서 무한대로 커지는 것은 torque 가 아니라 손끝 속도를 joint 속도로 바꿀 때의 joint 속도이고,
        gravity 는 자세와 관계없이 있으며, singularity 에서도 $\tau = J^\top F$ 는 그대로 성립한다.

- topic: computed-torque
  title: computed-torque control
  section: computed-torque-control
  variants:
    - question: |
        computed-torque control 의 τ = M(q)(q̈_d + K_d ė + K_p e) + c(q, q̇) 는 무엇을 하는 식인가?
      choices:
        - 'model 로 관성·gravity·Coriolis 를 지워, joint 마다 질량 1 인 PD 처럼 만든다'
        - 'joint 마다 gravity 만 model 로 지우고, 관성은 PD 가 알아서 처리하게 둔다'
        - '손끝에서 원하는 힘을 joint torque 로 바꾸는 식으로, M 은 손끝 질량이다'
        - 'model 이 조금 틀려도 PD 항이 그 몫을 모두 지워서, 오차를 늘 0 으로 만든다'
      answer: 0
      explanation: |
        괄호 안의 원하는 가속도에 $M(q)$ 를 곱해 torque 로 바꾸고 $c$ 를 더해 gravity 와 속도에 따른 torque 를 미리 지우므로, joint 마다
        $\ddot e + K_d \dot e + K_p e = 0$ 이 된다. gravity 만 지우는 것은 PD + gravity compensation 이고, 손끝 힘을 바꾸는 식은 $\tau = J^\top F$ 다.
        model 이 틀리면 지우지 못한 몫이 오차로 남는다.
    - question: |
        computed torque 에 쓴 model 의 질량이 실제보다 20% 가볍다. 결과는 어떻게 되는가?
      choices:
        - 'PD 항이 질량 오차를 바로 메우므로, 오차는 정확히 0 으로 유지된다'
        - 'model 이 틀리면 지운 값이 실제와 어긋나서, controller 가 바로 발산한다'
        - '지우지 못한 gravity 와 관성이 남아 오차가 생기고, 그 오차를 PD 항이 줄인다'
        - '질량 오차는 Coriolis 항에만 영향을 줘서, 멈춰 있을 때는 오차가 없다'
      answer: 2
      explanation: |
        $M$ 과 $c$ 는 model 이 맞는 만큼만 지우므로 질량이 틀리면 gravity 와 관성의 일부가 남아 오차가 된다. PD 항이 그 오차를 줄이지만 0 으로 만들지는
        못한다. 바로 발산하는 것은 아니며, gravity 도 질량에 비례하므로 멈춰 있을 때도 오차가 남는다.
    - question: |
        computed-torque control 에서 K_p = 100 으로 두었다. 넘치지 않으면서 가장 빠른 K_d 는 얼마이고, 그 값을 바로 쓸 수 있는 이유는 무엇인가?
      choices:
        - 'K_d = 100. K_p 와 같게 두어야 위치 항과 속도 항이 균형을 이뤄 critical damping 이 된다'
        - 'K_d = 20. dynamics 를 지운 뒤에는 질량 1 인 계라서 2√K_p 가 critical damping 이다'
        - 'K_d = 2√(K_p × M). 자세마다 M 이 바뀌므로 그때마다 M 을 곱해 다시 계산해야 한다'
        - 'K_d = 0. computed torque 가 dynamics 를 모두 지우므로 damping 이 따로 필요 없다'
      answer: 1
      explanation: |
        computed torque 의 gain 은 torque 가 아니라 가속도에 곱하는 값이고, $M$ 을 곱해 torque 로 바꾸므로 오차는 질량 1 인 계처럼 움직인다. 그래서
        critical damping 은 $2\sqrt{K_p} = 2\sqrt{100} = 20$ 이다. 질량을 곱해 다시 계산하는 것은 PD 를 바로 걸 때의 일이고, damping 이 없으면 오차가
        진동한다.

- topic: impedance
  title: impedance control
  section: impedance-control
  variants:
    - question: |
        impedance control 에서 손끝 stiffness 를 K = 400 N/m 로 두고 목표를 책상 윗면보다 2 cm 아래에 두었다. 손끝이 윗면에서 멈췄을 때 누르는 힘은?
      choices:
        - '0.8 N'
        - '800 N'
        - '20 N'
        - '8 N'
      answer: 3
      explanation: |
        용수철이 2 cm 늘어난 채 멈추므로 $F = K \times 0.02 = 400 \times 0.02 = 8$ N 이다. 0.8 N 은 2 mm, 800 N 은 2 m 로 계산한 값이고, 20 N 은 cm 를 그대로 곱한 값이다.
    - question: |
        impedance control 로 책상을 누르게 했는데 책상 높이를 1 mm 쯤 틀리게 알고 있다. 단단한 position 제어와 비교하면 무엇이 좋은가?
      choices:
        - 'impedance control 은 책상 높이를 스스로 재서 오차를 0 으로 고친 뒤 누른다'
        - 'stiffness 를 작게 두고 목표를 깊게 두면, 1 mm 오차가 바꾸는 힘이 K × 1 mm 로 작다'
        - 'impedance control 은 F/T sensor 로 힘을 직접 재서, 높이 오차와 관계없이 맞춘다'
        - '목표를 책상 아래에 두면, 높이 오차와 관계없이 누르는 힘이 늘 0 이 된다'
      answer: 1
      explanation: |
        누르는 힘은 K × (목표 깊이 + 높이 오차) 다. K = 500 N/m 이면 1 mm 차이가 0.5 N 만 바꾸지만, 손끝 stiffness 12,000 N/m 인 position 제어에서는 12 N 을 바꾼다.
        impedance control 은 높이를 재지 않고, 기본 형태는 F/T sensor 없이 위치와 속도만 쓴다. 목표를 표면 아래에 두므로 힘은 0 이 아니다.
    - question: |
        impedance control 은 힘을 제어하는 방법이라고 봐도 되는가?
      choices:
        - '그렇다. 원하는 힘을 정하면 책상이 어디 있든 환경과 관계없이 그 힘이 나온다'
        - '그렇다. F/T sensor 로 잰 힘의 오차를 PI 로 줄여서 원하는 힘을 맞추는 방법이다'
        - '아니다. 위치 오차와 힘의 비율을 정할 뿐이고, 실제 힘은 목표 깊이와 환경으로 정해진다'
        - '아니다. 위치만 제어하는 방법이라서 접촉한 뒤 누르는 힘에는 영향을 주지 않는다'
      answer: 2
      explanation: |
        impedance control 은 손끝이 목표에 용수철 K 와 damper D 로 매달린 것처럼 만든다. 책상이 있으면 늘어난 만큼 누르고, 책상이 없으면 손끝이 목표까지
        내려가 힘이 0 이 된다. 힘 오차를 PI 로 줄이는 것은 force control(hybrid 의 force 축)이다. 접촉 힘에 영향을 주지 않는다는 것도 틀린데, K 가 힘의 크기를 정한다.

- topic: damping-mass
  title: damping ratio 와 effective mass
  section: damping-ratio-와-effective-mass
  variants:
    - question: |
        손끝 effective mass 가 2 kg 인 방향에 K = 800 N/m 를 걸었다. damping ratio ζ = 1 이 되는 D 는? (D = 2ζ√(K m))
      choices:
        - '80 N·s/m'
        - '40 N·s/m'
        - '56.6 N·s/m'
        - '1600 N·s/m'
      answer: 0
      explanation: |
        $D = 2 \times 1 \times \sqrt{800 \times 2} = 2 \times 40 = 80$ N·s/m 다. 40 은 2 를 빠뜨린 값, 56.6 은 $2\sqrt{800}$ 으로 질량 1 kg 을 가정한 값이고,
        1600 은 제곱근을 씌우지 않은 값이다.
    - question: |
        impedance controller 에서 D = 2√K 로 damping 을 정했다. 이 값이 늘 critical damping 이 되는가?
      choices:
        - '그렇다. D = 2√K 는 effective mass 와 관계없이 어떤 자세와 방향에서도 ζ = 1 이다'
        - '아니다. D = 2√K 는 어느 방향에서나 ζ 를 1 보다 크게 만들어서 응답이 느려진다'
        - '아니다. effective mass 가 1 kg 일 때만 ζ = 1 이고, 무거운 방향에서는 ζ < 1 이다'
        - '그렇다. damping ratio 는 K 와 D 로만 정해지고 손끝 질량과는 관계없다'
      answer: 2
      explanation: |
        $\zeta = D / (2\sqrt{K m})$ 라서 $D = 2\sqrt{K}$ 는 $m = 1$ kg 에서만 $\zeta = 1$ 이다. effective mass 가 2 kg 인 방향이면 $\zeta = 1/\sqrt{2} \approx 0.71$ 이 된다.
        effective mass 는 자세와 방향에 따라 바뀌므로 같은 D 라도 방향마다 damping ratio 가 다르다.
    - question: |
        두 joint 팔의 손끝을 가로로 밀 때와 세로로 밀 때 손끝이 느끼는 질량이 다른 이유는 무엇인가?
      choices:
        - '손끝에 달린 추의 질량 자체가, 미는 방향에 따라 다르게 측정되기 때문이다'
        - 'gravity 가 세로 방향에만 작용해서, 세로로 밀 때는 질량이 늘 두 배로 느껴지기 때문이다'
        - 'Jacobian 의 transpose 가 방향마다 다른 힘을 내서, 같은 힘으로 밀어도 덜 움직이기 때문이다'
        - '밀린 방향에 따라 함께 움직이는 joint 와 질량이 달라서 effective mass 가 바뀌기 때문이다'
      answer: 3
      explanation: |
        한 방향으로 손끝을 밀 때 팔꿈치만 돌면 아래팔의 질량만 움직이고, 어깨가 돌면 위팔까지 함께 움직인다. 그래서 손끝 공간의 질량
        $\Lambda = (J M^{-1} J^\top)^{-1}$ 은 자세와 방향에 따라 다르다. 질량은 가속에 대한 저항이라 gravity 의 방향과는 관계없고, 추의 질량 자체는
        방향에 따라 바뀌지 않는다.

- topic: admittance
  title: impedance 와 admittance
  section: admittance-control
  variants:
    - question: |
        impedance control 과 admittance control 의 차이는 무엇인가?
      choices:
        - '둘은 같은 계산이고, joint 를 쓰는지 손끝을 쓰는지에 따라 이름만 다르게 부른다'
        - 'impedance 는 잰 움직임으로 낼 힘을 계산하고, admittance 는 잰 힘으로 움직일 위치를 계산한다'
        - 'impedance 는 F/T sensor 가 꼭 필요하고, admittance 는 joint torque 를 직접 명령한다'
        - 'admittance 는 접촉 없는 자유 공간에서만 쓰고, impedance 는 접촉 작업에서만 쓴다'
      answer: 1
      explanation: |
        impedance control 은 움직임 → 힘 방향이라 joint torque 를 직접 명령할 수 있는 팔(Franka 등)에 맞고, admittance control 은 힘 → 움직임 방향이라
        position 이나 velocity 명령만 받는 산업용 팔에 F/T sensor 를 달아 쓴다. 보기 3 은 두 방법을 뒤바꾼 설명이고, 두 방법 모두 접촉 작업에 쓴다.
    - question: |
        admittance control 로 움직이는 팔이 아주 단단한 벽에 닿자 손끝이 벽에서 튕겼다 박히기를 반복하며 떨린다. 가장 알맞은 원인과 대책은?
      choices:
        - 'F/T sensor 가 벽의 충격으로 고장 나 값이 튀므로, sensor 를 새것으로 바꾼다'
        - 'virtual stiffness 가 너무 작아 벽을 못 버티므로, K 를 키워 손끝을 단단하게 한다'
        - 'position controller 의 gain 이 작아 명령을 늦게 따라가므로, gain 을 키운다'
        - '벽이 단단해 한 주기의 움직임이 너무 커지므로, damping 을 키우거나 제어 주기를 줄인다'
      answer: 3
      explanation: |
        admittance control 은 잰 힘으로 속도를 정한다. 벽이 단단하면 조금만 눌러도 큰 힘이 나오는데, 한 주기 동안 누른 깊이를 되돌리는 비율 $\Delta t\,K_e / D_a$ 가 2 를 넘으면
        손끝이 벽을 지나쳐 튕겨 나가며 진동이 커진다. 그래서 damping $D_a$ 를 키우거나 주기 $\Delta t$ 를 줄여야 한다. stiffness 나 position gain 을 키우면 같은 힘에 더
        크게 반응해 오히려 나빠진다.
    - question: |
        admittance control 로 hand guiding 을 하는 중에 아무도 손대지 않았는데 팔이 천천히 흘러간다. 가장 먼저 의심할 것은?
      choices:
        - 'F/T sensor 의 offset 이 힘으로 읽혀 움직임 명령이 된 것이다'
        - 'virtual damping 이 너무 커서, 작은 힘에도 팔이 천천히 계속 밀려가는 것이다'
        - 'joint torque 한계에 걸려서, 팔이 제 무게를 못 버티고 미끄러지는 것이다'
        - 'gravity compensation 이 너무 강해서, 팔이 위로 떠오르며 흘러가는 것이다'
      answer: 0
      explanation: |
        admittance control 은 잰 힘을 그대로 움직임으로 바꾸므로, sensor 가 0 이 아닌 값을 읽으면 손대지 않아도 움직인다. 예로 정확도가 ±4 N 인 sensor 에
        damping 50 N·s/m 이면 0.08 m/s 까지 흐를 수 있다. damping 이 크면 흐름은 오히려 느려지고, position 명령으로 움직이는 팔에서 torque 한계나
        gravity compensation 은 이 현상의 원인이 아니다.

- topic: hybrid
  title: hybrid force/position control
  section: hybrid-forceposition-control
  variants:
    - question: |
        로봇으로 책상을 일정한 힘으로 닦게 하려면 hybrid force/position control 의 축을 어떻게 나누는가?
      choices:
        - 'x·y 는 position 으로 제어하고, 책상을 누르는 z 는 force 로 제어한다'
        - '세 축 모두 force 로 제어해서, 어느 방향에서든 정한 힘으로 책상을 문지르게 한다'
        - '세 축 모두 position 으로 제어하고, z 목표만 책상보다 조금 낮게 둔다'
        - 'x·y 는 force 로 제어하고, 책상을 누르는 z 는 position 으로 제어한다'
      answer: 0
      explanation: |
        닦는 경로는 정해진 위치를 따라가야 하고 누르는 방향은 정한 힘을 내야 하므로, selection matrix 로 x·y 를 position, z 를 force 로 고른다.
        모든 축을 force 로 두면 경로를 따라가지 못하고, 모든 축을 position 으로 두면 책상 높이 오차가 그대로 힘 오차가 된다. 보기 4 는 축을 뒤바꾼 것이다.
    - question: |
        force 제어 축에서 손끝이 밀 대상을 잃으면(예: 책상 끝을 벗어나면) 어떤 일이 생기고, 무엇으로 막는가?
      choices:
        - '밀 대상이 없으면 잰 힘과 원하는 힘의 오차가 0 이 되어, 손끝이 그 자리에 멈춘다'
        - 'position 축이 자동으로 그 축을 넘겨받아서, 손끝이 마지막 위치를 지킨다'
        - '힘을 만들려고 팔이 그 방향으로 계속 가속하므로, damping 이나 속도 한계를 둔다'
        - 'I 항이 음수로 쌓여서, 손끝이 누르던 방향의 반대인 위로 튀어 오른다'
      answer: 2
      explanation: |
        밀 대상이 없으면 잰 힘이 0 이라 힘 오차가 사라지지 않고, controller 는 힘을 만들려고 계속 가속한다. 그래서 velocity damping 을 더하거나 URScript
        `force_mode` 의 limits 처럼 force 축의 최대 속도를 둔다. 힘 오차는 0 이 되지 않고, 축은 자동으로 바뀌지 않으며, I 항은 힘이 모자란 쪽으로 쌓여
        누르는 방향으로 더 밀어낸다.
    - question: |
        force 제어 축에 D 항을 잘 쓰지 않는 이유는 무엇인가?
      choices:
        - 'force 는 적분해야 의미가 있는 값이라, 힘의 변화율인 D 항은 계산할 수 없다'
        - '힘 측정값은 noise 가 커서 미분하면 거의 noise 만 남기 때문이다'
        - 'D 항은 위치를 미분한 속도에만 쓰는 항이라, position 축에서만 정의된다'
        - 'D 항을 쓰면 힘이 원하는 값에 닿지 못해 steady-state error 가 생긴다'
      answer: 1
      explanation: |
        F/T sensor 나 torque 로 잰 힘은 noise 가 커서 그 시간 변화율은 의미 있는 값이 되지 못한다. 그래서 force 축은 보통 feedforward 와 PI 로 제어하고,
        움직임을 억제할 damping 은 힘의 미분 대신 속도에 비례하는 항으로 따로 넣는다. D 항은 어떤 신호에도 정의할 수 있고, steady-state error 를 없애는
        것은 I 항의 일이다.

- topic: collision-residual
  title: torque residual 과 충돌 감지
  section: torque-residual-과-충돌-감지
  variants:
    - question: |
        joint torque 센서가 있는 협동 로봇은 별도 외부 센서 없이 어떻게 충돌을 감지하는가?
      choices:
        - 'joint 각도가 목표에서 조금이라도 벗어나는 순간을, 무언가에 막힌 충돌로 본다'
        - 'motor 온도가 갑자기 오르면, 막힌 joint 에 전류가 몰린 충돌로 본다'
        - '손끝 속도가 0 이 되면, 무언가에 부딪혀 멈춘 것으로 보고 충돌로 판단한다'
        - 'model 로 예측한 torque 와 잰 torque 의 차이가 문턱을 넘으면 충돌로 본다'
      answer: 3
      explanation: |
        허공에서 움직일 때 residual 은 0 근처에 있고, 무언가에 닿으면 그 힘이 $J^\top F$ 만큼 joint torque 에 더해져 커진다. Franka 의 tau_ext_hat_filtered
        가 이 값이다. 각도 오차나 속도 0 은 정상 동작에서도 생기고, motor 온도는 충돌을 바로 보여 주지 않는다.
    - question: |
        gripper 로 2.5 kg 짐을 들었더니 아무것도 부딪히지 않았는데 팔이 충돌로 멈췄다. 짐은 어깨 joint 에서 수평으로 0.5 m 앞에 있고 충돌 문턱은 10 N·m 이다. 원인은?
      choices:
        - 'gripper 가 짐을 너무 세게 쥐어서, 손목의 torque 센서가 고장 나 값이 튄다'
        - 'model 에 없는 짐의 무게가 약 12.3 N·m 의 residual 을 만들어 문턱을 넘었다'
        - '짐 때문에 Jacobian 이 바뀌어서, 팔이 singularity 에 빠져 멈췄다'
        - 'residual 은 짐의 무게와 관계없으므로, 보이지 않는 곳에서 무언가에 부딪힌 것이다'
      answer: 1
      explanation: |
        model 은 짐을 모르므로 짐의 gravity torque $2.5 \times 9.81 \times 0.5 \approx 12.3$ N·m 가 그대로 residual 에 더해져 문턱 10 N·m 를 넘는다.
        gripper 와 짐의 질량을 model 에 넣거나 문턱을 조정해야 한다. 짐은 Jacobian 을 바꾸지 않고, residual 은 model 에 없는 모든 힘을 담는다.
    - question: |
        residual 을 계산할 때 joint 가속도를 직접 쓰지 않고 generalized momentum 기반 observer 를 쓰는 이유는?
      choices:
        - 'momentum observer 는 gravity 를 계산하지 않아도 되어, model 이 더 간단해지기 때문이다'
        - '가속도를 쓰면 model 이 필요 없어져서, 질량을 몰라도 residual 을 구할 수 있기 때문이다'
        - '가속도는 각도를 두 번 미분해 noise 가 커서, 가속도 없이 residual 을 구하는 편이 안정적이라서'
        - '가속도로 계산하면 예측 torque 와 잰 torque 가 늘 같아져 residual 이 0 이 되기 때문이다'
      answer: 2
      explanation: |
        model torque 를 계산하려면 $M(q)\ddot q$ 가 필요한데, $\ddot q$ 는 encoder 각도를 두 번 미분해 noise 가 크다. generalized momentum $M(q)\dot q$ 를
        쓰는 observer 는 가속도 없이 residual 을 구한다. 이 observer 도 gravity 와 model 이 필요하고, 가속도로 계산해도 residual 이
        0 이 되지는 않는다.
