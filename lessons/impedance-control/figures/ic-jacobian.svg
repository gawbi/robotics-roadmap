<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>손끝 힘과 joint torque. 위팔과 아래팔이 0.5 m 인 팔이 θ₁ = 0°, θ₂ = 90° 일 때, 손끝으로 아래로 10 N 누르려면 어깨 −5 N·m, 팔꿈치 0 이 필요하고, 옆으로 10 N 밀려면 두 joint 모두 −5 N·m 가 필요하다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="150.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">아래로 10 N 누르기</text>
  <line x1="70.0" y1="230.0" x2="200.0" y2="230.0" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="200.0" y1="230.0" x2="200.0" y2="100.0" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="70" cy="230" r="7" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="200.0" cy="230" r="7" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="200.0" cy="100.0" r="5" fill="#e2e8f0"/>
  <text x="66.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">어깨 θ₁ = 0°</text>
  <text x="212.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">팔꿈치 θ₂ = 90°</text>
  <line x1="200.0" y1="100.0" x2="200.0" y2="170.0" stroke="#d6aa62" stroke-width="3" marker-end="url(#aa)"/>
  <text x="210.0" y="174.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">F = (0, −10) N</text>
  <text x="150.0" y="282.0" fill="#7cb4d8" font-size="13" text-anchor="middle">τ₁ = 0.5 × (−10) = −5 N·m</text>
  <text x="150.0" y="304.0" fill="#7cb4d8" font-size="13" text-anchor="middle">τ₂ = 0 (힘이 팔꿈치를 지난다)</text>
  <text x="500.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">옆으로 10 N 밀기</text>
  <line x1="420.0" y1="230.0" x2="550.0" y2="230.0" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="550.0" y1="230.0" x2="550.0" y2="100.0" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="420" cy="230" r="7" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="550.0" cy="230" r="7" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="550.0" cy="100.0" r="5" fill="#e2e8f0"/>
  <text x="416.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">어깨 θ₁ = 0°</text>
  <text x="562.0" y="254.0" fill="#94a3b8" font-size="11" text-anchor="middle">팔꿈치 θ₂ = 90°</text>
  <line x1="550.0" y1="100.0" x2="620.0" y2="100.0" stroke="#d6aa62" stroke-width="3" marker-end="url(#aa)"/>
  <text x="628.0" y="104.0" fill="#d6aa62" font-size="13" text-anchor="start" font-weight="600">F = (10, 0) N</text>
  <text x="500.0" y="282.0" fill="#7cb4d8" font-size="13" text-anchor="middle">τ₁ = −0.5 × 10 = −5 N·m</text>
  <text x="500.0" y="304.0" fill="#7cb4d8" font-size="13" text-anchor="middle">τ₂ = −0.5 × 10 = −5 N·m</text>
  <line x1="360.0" y1="60.0" x2="360.0" y2="310.0" stroke="#1e293b" stroke-width="1.5"/>
</svg>
