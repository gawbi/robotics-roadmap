<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>torque residual 로 충돌 감지. 평소 residual 은 0 근처에서 흔들리고, 1.5 초에 model 에 없는 1 kg 을 0.5 m 앞에서 집으면 4.9 N·m 올라가지만 문턱 10 N·m 아래에 머물고, 3 초에 사람과 부딪히면 문턱을 넘어 팔을 세운다</title>
