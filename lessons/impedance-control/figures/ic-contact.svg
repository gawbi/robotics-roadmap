<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>단단한 position 제어와 접촉. 목표가 책상 1 mm 아래면 손끝이 막혀 오차 1 mm 가 남고, controller 가 만든 용수철 K 가 K × 0.001 m 의 힘으로 누른다. K 가 500, 3000, 12000, 57000 N/m 이면 힘은 0.5, 3, 12, 57 N 이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="170.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">목표가 책상 1 mm 아래일 때</text>
  <line x1="70" y1="250" x2="250" y2="250" stroke="#94a3b8" stroke-width="2"/><line x1="70" y1="260" x2="80" y2="250" stroke="#64748b" stroke-width="1"/><line x1="82" y1="260" x2="92" y2="250" stroke="#64748b" stroke-width="1"/><line x1="94" y1="260" x2="104" y2="250" stroke="#64748b" stroke-width="1"/><line x1="106" y1="260" x2="116" y2="250" stroke="#64748b" stroke-width="1"/><line x1="118" y1="260" x2="128" y2="250" stroke="#64748b" stroke-width="1"/><line x1="130" y1="260" x2="140" y2="250" stroke="#64748b" stroke-width="1"/><line x1="142" y1="260" x2="152" y2="250" stroke="#64748b" stroke-width="1"/><line x1="154" y1="260" x2="164" y2="250" stroke="#64748b" stroke-width="1"/><line x1="166" y1="260" x2="176" y2="250" stroke="#64748b" stroke-width="1"/><line x1="178" y1="260" x2="188" y2="250" stroke="#64748b" stroke-width="1"/><line x1="190" y1="260" x2="200" y2="250" stroke="#64748b" stroke-width="1"/><line x1="202" y1="260" x2="212" y2="250" stroke="#64748b" stroke-width="1"/><line x1="214" y1="260" x2="224" y2="250" stroke="#64748b" stroke-width="1"/><line x1="226" y1="260" x2="236" y2="250" stroke="#64748b" stroke-width="1"/><line x1="238" y1="260" x2="248" y2="250" stroke="#64748b" stroke-width="1"/>
  <text x="160.0" y="272.0" fill="#94a3b8" font-size="12" text-anchor="middle">책상 (훨씬 단단하다)</text>
  <rect x="140" y="205" width="60" height="40" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170.0" y="230.0" fill="#e2e8f0" font-size="12" text-anchor="middle">손끝</text>
  <polyline points="170.0,80.0 170.0,98.8 180.0,106.0 160.0,113.3 180.0,120.6 160.0,127.9 180.0,135.2 160.0,142.5 180.0,149.8 160.0,157.1 180.0,164.4 160.0,171.7 180.0,179.0 160.0,186.2 170.0,186.2 170.0,205.0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
  <rect x="120" y="66" width="100" height="14" rx="3" fill="#f59e0b" opacity="0.35"/>
  <text x="170.0" y="60.0" fill="#f59e0b" font-size="12" text-anchor="middle">controller 가 만든 용수철 K</text>
  <line x1="256.0" y1="252.0" x2="300.0" y2="252.0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="304.0" y="248.0" fill="#38bdf8" font-size="11" text-anchor="start">목표 위치</text>
  <text x="304.0" y="263.0" fill="#38bdf8" font-size="11" text-anchor="start">(1 mm 아래)</text>
  <text x="170.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">손끝이 책상에 막혀 오차 1 mm 가 남고,</text>
  <text x="170.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">용수철이 K × 0.001 m 의 힘으로 누른다</text>
  <text x="555.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">1 mm 오차에서 손끝이 누르는 힘</text>
  <rect x="420" y="70" width="2.2" height="30" rx="4" fill="#34d399" opacity="0.85"/>
  <text x="412.0" y="90.0" fill="#34d399" font-size="12" text-anchor="end">impedance 500 N/m</text>
  <text x="430.2" y="90.0" fill="#e2e8f0" font-size="12" text-anchor="start">0.5 N</text>
  <rect x="420" y="114" width="13.5" height="30" rx="4" fill="#38bdf8" opacity="0.85"/>
  <text x="412.0" y="134.0" fill="#38bdf8" font-size="12" text-anchor="end">3,000 N/m</text>
  <text x="441.5" y="134.0" fill="#e2e8f0" font-size="12" text-anchor="start">3 N</text>
  <rect x="420" y="158" width="54.0" height="30" rx="4" fill="#f59e0b" opacity="0.85"/>
  <text x="412.0" y="178.0" fill="#f59e0b" font-size="12" text-anchor="end">12,000 N/m</text>
  <text x="482.0" y="178.0" fill="#e2e8f0" font-size="12" text-anchor="start">12 N</text>
  <rect x="420" y="202" width="256.5" height="30" rx="4" fill="#f87171" opacity="0.85"/>
  <text x="412.0" y="222.0" fill="#f87171" font-size="12" text-anchor="end">57,000 N/m</text>
  <text x="684.5" y="222.0" fill="#e2e8f0" font-size="12" text-anchor="start">57 N</text>
  <line x1="420.0" y1="250.0" x2="690.0" y2="250.0" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="420.0" y="268.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <text x="555.0" y="268.0" fill="#64748b" font-size="11" text-anchor="middle">30</text>
  <text x="690.0" y="268.0" fill="#64748b" font-size="11" text-anchor="middle">60 N</text>
  <text x="555.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">I 항이 있으면 오차가 남는 동안 힘이 계속 커져</text>
  <text x="555.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">motor 의 torque 한계나 충돌 정지에 닿는다</text>
</svg>
