<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>impedance control. 손끝과 목표 x_d 사이에 가상 용수철 K 와 damper D 를 둔다. 목표를 책상 윗면보다 1 cm 아래에 두고 K = 500 N/m 이면 손끝은 윗면에서 멈춘 채 5 N 으로 누르고, 책상 높이가 1 mm 틀려도 4.5 ~ 5.5 N 이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="200.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">손끝과 목표 사이의 가상 용수철과 damper</text>
  <line x1="60" y1="170" x2="340" y2="170" stroke="#94a3b8" stroke-width="2"/><line x1="60" y1="180" x2="70" y2="170" stroke="#64748b" stroke-width="1"/><line x1="72" y1="180" x2="82" y2="170" stroke="#64748b" stroke-width="1"/><line x1="84" y1="180" x2="94" y2="170" stroke="#64748b" stroke-width="1"/><line x1="96" y1="180" x2="106" y2="170" stroke="#64748b" stroke-width="1"/><line x1="108" y1="180" x2="118" y2="170" stroke="#64748b" stroke-width="1"/><line x1="120" y1="180" x2="130" y2="170" stroke="#64748b" stroke-width="1"/><line x1="132" y1="180" x2="142" y2="170" stroke="#64748b" stroke-width="1"/><line x1="144" y1="180" x2="154" y2="170" stroke="#64748b" stroke-width="1"/><line x1="156" y1="180" x2="166" y2="170" stroke="#64748b" stroke-width="1"/><line x1="168" y1="180" x2="178" y2="170" stroke="#64748b" stroke-width="1"/><line x1="180" y1="180" x2="190" y2="170" stroke="#64748b" stroke-width="1"/><line x1="192" y1="180" x2="202" y2="170" stroke="#64748b" stroke-width="1"/><line x1="204" y1="180" x2="214" y2="170" stroke="#64748b" stroke-width="1"/><line x1="216" y1="180" x2="226" y2="170" stroke="#64748b" stroke-width="1"/><line x1="228" y1="180" x2="238" y2="170" stroke="#64748b" stroke-width="1"/><line x1="240" y1="180" x2="250" y2="170" stroke="#64748b" stroke-width="1"/><line x1="252" y1="180" x2="262" y2="170" stroke="#64748b" stroke-width="1"/><line x1="264" y1="180" x2="274" y2="170" stroke="#64748b" stroke-width="1"/><line x1="276" y1="180" x2="286" y2="170" stroke="#64748b" stroke-width="1"/><line x1="288" y1="180" x2="298" y2="170" stroke="#64748b" stroke-width="1"/><line x1="300" y1="180" x2="310" y2="170" stroke="#64748b" stroke-width="1"/><line x1="312" y1="180" x2="322" y2="170" stroke="#64748b" stroke-width="1"/><line x1="324" y1="180" x2="334" y2="170" stroke="#64748b" stroke-width="1"/><line x1="336" y1="180" x2="346" y2="170" stroke="#64748b" stroke-width="1"/>
  <text x="64.0" y="160.0" fill="#94a3b8" font-size="12" text-anchor="start">책상 윗면</text>
  <rect x="160" y="128" width="80" height="40" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="200.0" y="153.0" fill="#e2e8f0" font-size="12" text-anchor="middle">손끝</text>
  <rect x="150" y="270" width="100" height="10" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="200.0" y="302.0" fill="#38bdf8" font-size="12" text-anchor="middle">목표 x_d : 윗면보다 1 cm 아래</text>
  <polyline points="180.0,168.0 180.0,183.3 188.0,190.4 172.0,197.6 188.0,204.7 172.0,211.9 188.0,219.0 172.0,226.1 188.0,233.3 172.0,240.4 188.0,247.6 172.0,254.7 180.0,254.7 180.0,270.0" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
  <line x1="222" y1="168" x2="222" y2="215.0" stroke="#a78bfa" stroke-width="2"/><path d="M212,205.0 L212,229.0 L232,229.0 L232,205.0" fill="none" stroke="#a78bfa" stroke-width="2"/><line x1="215" y1="215.0" x2="229" y2="215.0" stroke="#a78bfa" stroke-width="2.4"/><line x1="222" y1="229.0" x2="222" y2="270" stroke="#a78bfa" stroke-width="2"/>
  <text x="166.0" y="226.0" fill="#f59e0b" font-size="13" text-anchor="end" font-weight="600">K</text>
  <text x="240.0" y="226.0" fill="#a78bfa" font-size="13" text-anchor="start" font-weight="600">D</text>
  <line x1="290.0" y1="124.0" x2="290.0" y2="164.0" stroke="#f87171" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="300.0" y="148.0" fill="#f87171" font-size="12" text-anchor="start" font-weight="600">5 N 으로 누름</text>
  <text x="400.0" y="80.0" fill="#e2e8f0" font-size="15" text-anchor="start" font-weight="600">F = K (x_d − x) + D (ẋ_d − ẋ)</text>
  <text x="400.0" y="112.0" fill="#94a3b8" font-size="12" text-anchor="start">K = 500 N/m, 손끝이 윗면에서 멈추면</text>
  <text x="400.0" y="134.0" fill="#f59e0b" font-size="13" text-anchor="start">F = 500 × 0.01 = 5 N 으로 누른다</text>
  <text x="400.0" y="170.0" fill="#94a3b8" font-size="12" text-anchor="start">책상이 1 mm 높거나 낮으면</text>
  <text x="400.0" y="192.0" fill="#f59e0b" font-size="13" text-anchor="start">500 × 0.011 = 5.5 N, 500 × 0.009 = 4.5 N</text>
  <text x="400.0" y="228.0" fill="#38bdf8" font-size="13" text-anchor="start">joint torque 는 τ = Jᵀ F + gravity 몫</text>
  <text x="400.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="start">손끝이 움직이는 동안 D 가 속도에 맞서</text>
  <text x="400.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="start">흔들림을 줄인다</text>
</svg>
