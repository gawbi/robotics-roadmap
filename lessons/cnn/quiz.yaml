# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: image-numbers
  title: 숫자 격자로 된 사진과 channel
  variants:
    - question: |
        같은 가로세로 크기의 흑백 사진과 컬러 사진을 숫자로 저장할 때 달라지는 점으로 옳은 것은?
      choices:
        - 컬러 사진은 pixel 수가 세 배로 늘어난다
        - 컬러 사진은 pixel 마다 0 ~ 255 대신 소수 하나를 적는다
        - 컬러 사진은 사진과 크기가 같은 숫자 판이 R·G·B 세 장이라 숫자가 세 배다
        - 색은 따로 적어 두는 정보라 숫자 격자 자체는 똑같다
      answer: 2
      explanation: |
        컬러 사진은 pixel 마다 빨강·초록·파랑 빛의 세기를 숫자 세 개로 적는다. 같은 색끼리 모으면 사진과 크기가 같은
        판이 세 장 나오므로, 가로세로는 그대로이고 숫자만 세 배가 된다. pixel 수(가로 × 세로)는 늘지 않으며, 세기는 흑백과
        마찬가지로 0 ~ 255 범위의 숫자다. 색은 별도 정보가 아니라 바로 이 세 장의 숫자 판으로 저장된다.
    - question: |
        컬러 사진에서 channel 은 무엇인가?
      choices:
        - 사진의 가로 한 줄
        - pixel 하나
        - 사진 한 장의 밝기 평균
        - 같은 색의 세기만 모은, 사진과 크기가 같은 숫자 판 한 장
      answer: 3
      explanation: |
        컬러 사진은 pixel 마다 빨강·초록·파랑 세기를 숫자 세 개로 적는데, 같은 색의 숫자만 모으면 사진과 크기가 같은 판이
        한 장 나오고 이 판이 channel 이다. 그래서 컬러 사진은 channel 3 장, 흑백 사진은 1 장이다. 가로 한 줄은 MLP 에 넣으려고
        펼칠 때 이어 붙이는 단위이고, pixel 은 숫자 판의 칸 하나다. 밝기 평균은 숫자 하나일 뿐 판이 아니다.
    - question: |
        흑백 사진은 보통 0 이 검정, 255 가 흰색이다. 어떤 pixel 의 값이 30 에서 220 으로 바뀌었다면 사진에서 무슨 일이
        일어난 것인가?
      choices:
        - 그 칸이 훨씬 밝아졌다
        - 그 칸이 훨씬 어두워졌다
        - 사진의 가로세로 크기가 커졌다
        - 그 칸의 색이 빨강으로 바뀌었다
      answer: 0
      explanation: |
        흑백 사진의 pixel 값은 밝기 하나이고 클수록 흰색에 가깝다. 30 은 검정에 가까운 어두운 회색, 220 은 흰색에 가까운
        밝은 회색이라 그 칸이 밝아졌다. 값이 커지면 어두워진다고 보는 것은 방향을 거꾸로 읽은 것이다. pixel 값 하나가 바뀌어도
        격자의 크기는 그대로이고, 흑백 사진에는 색을 적는 channel 이 따로 없다.

- topic: mlp-limits
  title: 사진을 MLP 에 넣을 때의 문제
  variants:
    - question: |
        사진을 MLP 에 넣으려고 격자를 한 줄로 펼친다(flatten). 이때 모델 입장에서 사라지는 정보는?
      choices:
        - 어느 칸이 어느 칸의 위아래·옆에 붙어 있었는지
        - 각 pixel 의 밝기 값
        - 사진에 든 숫자의 총개수
        - 사진이 흑백인지 컬러인지에 따른 숫자 차이
      answer: 0
      explanation: |
        펼치면 위아래로 붙어 있던 두 칸이 한 줄에서 한 줄 길이만큼 멀리 떨어진다. MLP 는 모든 입력을 똑같이 "서로 다른 입력"
        으로 다루므로 어떤 칸들이 이웃이었는지는 모델에 남지 않는다. 밝기 값과 숫자의 개수는 펼쳐도 그대로이고, 컬러 사진의
        channel 숫자도 그대로 이어 붙는다.
    - question: |
        숫자 "1" 사진을 잘 알아보도록 weight 가 맞춰진 MLP neuron 이 있다. 같은 "1" 을 오른쪽으로 한 칸만 옮긴 사진을 넣었더니
        반응이 크게 떨어졌다. 그 이유로 옳은 것은?
      choices:
        - 옮긴 사진은 흰 칸의 개수가 줄어들기 때문
        - MLP 는 입력 자리마다 따로 weight 를 써서, 모양이 옮겨 가면 다른 weight 와 곱해지기 때문
        - 사진을 옮기면 bias 가 바뀌기 때문
        - MLP 는 흑백 사진을 다룰 수 없기 때문
      answer: 1
      explanation: |
        옮긴 사진에도 흰 칸 수는 그대로다. 하지만 MLP 의 weight 는 "몇 번째 입력" 마다 따로 있어서, 흰 칸이 옆으로 가면 큰
        weight 가 걸린 자리와 겹치는 흰 칸이 줄어든다. 그래서 사람 눈에 같은 사진이 MLP 에게는 입력의 상당 부분이 바뀐 다른
        사진이다. bias 는 사진과 상관없이 고정된 숫자이고, MLP 는 흑백 사진도 숫자 한 줄로 받으면 다룰 수 있다.
    - question: |
        224×224 컬러 사진을 펼쳐 MLP 에 넣으면 첫 layer 의 parameter 가 매우 많아진다. 이것이 문제가 되는 이유로 가장 알맞은 것은?
      choices:
        - MLP 는 입력이 수만 개를 넘으면 계산 자체를 할 수 없어서
        - parameter 가 많으면 backpropagation 이 작동하지 않아서
        - parameter 가 많을수록 사진의 색 정보가 사라져서
        - 계산과 메모리가 크게 들고, 그 많은 숫자를 맞추려면 학습 데이터도 훨씬 많이 필요해서
      answer: 3
      explanation: |
        MLP 의 neuron 하나는 입력마다 weight 를 하나씩 가지므로 사진의 숫자가 15 만 개면 neuron 하나에 weight 가 15 만 개다.
        neuron 을 여러 개 두면 첫 layer 에만 수억 개가 되어 계산·메모리가 크게 들고, 그 숫자들을 제대로 맞추려면 데이터도 훨씬
        많이 필요하다. 입력이 많아도 계산과 backpropagation 은 원리상 똑같이 되고, parameter 수와 색 정보 손실은 관계가 없다.

- topic: conv-calc
  title: filter 와 feature map
  variants:
    - question: |
        convolution 이 사진에 하는 계산을 바르게 설명한 것은?
      choices:
        - 사진 전체의 pixel 마다 weight 를 하나씩 곱해 모두 더한 숫자 하나를 낸다
        - 이웃한 칸 몇 개 중 가장 큰 값만 골라 남긴다
        - 작은 filter 를 사진 위에서 옮기며, 겹친 window 와 칸끼리 곱해 더한 값(+ bias)을 자리마다 출력 칸에 적는다
        - 사진을 한 줄로 편 뒤 큰 값부터 순서대로 정렬한다
      answer: 2
      explanation: |
        convolution 은 3×3 같은 작은 filter 를 한 자리에 겹쳐 칸끼리 곱해 더하고, 한 칸 옮겨 같은 계산을 되풀이해 출력 판을
        채운다. 사진 전체에 weight 를 하나씩 곱해 숫자 하나를 내는 것은 MLP neuron 의 계산이고, 묶음에서 가장 큰 값을 고르는
        것은 max pooling 이다. 정렬은 칸의 위치 정보를 버리는 계산이라 convolution 과 무관하다.
    - question: |
        세로선 모양에 맞춘 filter 를 사진에 대어 feature map 을 얻었다. feature map 의 어떤 칸에 큰 양수가 나왔다면 그것은 무엇을 뜻하나?
      choices:
        - 그 칸에 대응하는 사진 자리에 세로선 모양이 있다
        - 그 자리의 pixel 하나가 사진에서 가장 밝다
        - 그 자리에서만 filter 숫자가 학습으로 커졌다
        - 사진 전체에 세로선이 몇 개인지를 센 값이다
      answer: 0
      explanation: |
        filter 와 겹친 window 가 filter 모양을 닮을수록 칸끼리 곱해 더한 값이 커진다. 그래서 세로선 filter 의 출력이 큰 칸은
        사진의 그 자리에 세로선이 있다는 뜻이다. 값은 pixel 하나가 아니라 window 전체의 모양으로 정해지고, filter 는 모든 자리에
        똑같은 숫자를 쓰므로 자리마다 따로 커지지 않는다. 출력 칸 하나는 자기 window 만 반영하므로 사진 전체의 개수가 아니다.
    - question: |
        실제 CNN 에서 filter 의 숫자는 어떻게 정해지나?
      choices:
        - 사람이 세로선·가로선 같은 filter 를 직접 설계해 넣는다
        - 아무 숫자로 시작해, loss 를 줄이도록 gradient descent 로 다른 weight 와 함께 학습한다
        - 학습 사진들의 pixel 평균으로 한 번 계산해 둔다
        - 처음 정한 random 값을 학습 내내 바꾸지 않는다
      answer: 1
      explanation: |
        CNN 은 filter 숫자를 MLP 의 weight 처럼 parameter 로 두고, loss 를 줄이는 방향으로 조금씩 고친다. 학습을 마친 첫 층
        filter 를 그려 보면 선이나 경계에 반응하는 모양이 많은데, 사람이 넣은 것이 아니라 학습이 스스로 찾은 것이다. 손으로
        고른 filter 는 원리를 설명하기 위한 예일 뿐이고, pixel 평균이나 고정된 random 값으로는 과제에 맞는 모양을 배울 수 없다.

- topic: filter-learning
  title: label 에서 filter 까지의 학습 신호
  variants:
    - question: |
        손글씨 숫자 사진마다 "이 사진은 7" 같은 정답 숫자(label)가 붙은 데이터로 CNN 을 학습한다. 첫 층 filter 의 숫자를 고칠
        때 쓰는 정답에 대한 설명으로 옳은 것은?
      choices:
        - filter 마다 사람이 "세로선 모양" 같은 목표 숫자를 정해 두고, filter 를 그 숫자에 맞춘다
        - feature map 마다 목표 판이 따로 있어서 출력 판과 목표 판의 차이를 줄인다
        - filter 에 대한 정답은 따로 없고, 사진의 label 로 계산한 loss 를 backpropagation 이 거꾸로 전해 filter 숫자마다 gradient 를 준다
        - 정답이 없으므로 filter 는 처음 정한 random 값 그대로 둔다
      answer: 2
      explanation: |
        데이터에 있는 정답은 사진 한 장마다 붙은 숫자 하나뿐이다. CNN 이 낸 점수 10 개를 softmax 로 확률로 바꾸고, label
        자리의 확률로 loss 를 계산한 뒤 backpropagation 이 이 loss 를 입력 쪽으로 거꾸로 전해 filter 숫자까지 gradient 를 구한다.
        filter 나 feature map 에 대한 목표값은 어디에도 없고, filter 가 선·경계 모양이 되는 것은 학습의 결과다. 정답이 filter 에
        직접 없다고 해서 학습을 안 하는 것도 아니다.
    - question: |
        숫자 분류 CNN 의 첫 층 filter 하나는 모든 사진에 똑같이 쓰인다. label 이 7, 3, 1 인 사진 3 장짜리 mini-batch 로 SGD
        한 step 을 할 때, 이 filter 의 한 칸 숫자는 어떻게 고쳐지나?
      choices:
        - 세 사진에서 각각 구한 gradient 의 평균 반대 방향으로 고쳐진다
        - label 이 가장 큰 숫자인 7 사진의 gradient 만 따른다
        - 사진마다 filter 를 하나씩 따로 복사해 고친 뒤 셋 다 남겨 둔다
        - 세 사진의 gradient 부호가 서로 다르면 학습이 멈추고 다시 시작한다
      answer: 0
      explanation: |
        filter 는 숫자마다 따로 있지 않아서 사진마다 그 칸 숫자에 바라는 방향이 다를 수 있다. mini-batch 는 sample 마다 구한
        gradient 를 평균해 하나로 만들고, SGD 는 그 평균에 learning rate 를 곱해 뺀다. 예를 들어 gradient 가 −0.6, +0.3, −0.9 면
        평균 −0.4 라 숫자가 늘어난다. label 의 크기는 가중치와 무관하고, filter 를 사진마다 복사하지도 않으며, 부호가 섞여도
        평균이 정해지므로 학습은 그대로 이어진다.
    - question: |
        손글씨 숫자 0 ~ 9 를 분류하도록 학습을 마친 CNN 에서 "숫자 7 에만 해당하는" parameter 를 찾으려 한다. 어디에 있나?
      choices:
        - 첫 층 filter 중 하나가 숫자 7 전용 filter 다
        - 첫 층 filter 의 bias 만 숫자마다 따로 있다
        - max pooling 층에 숫자마다 다른 parameter 가 있다
        - 마지막 layer 에서 7 자리 점수를 계산하는 weight 다
      answer: 3
      explanation: |
        첫 층 filter 는 모든 사진의 gradient 평균으로 고쳐지므로 한 숫자 전용이 되지 않고, 여러 숫자를 가르는 데 두루 쓰이는
        선·경계 무늬에 반응하게 된다. 숫자 하나에만 쓰이는 것은 마지막 layer 에서 그 숫자 자리의 점수를 계산하는 weight 다.
        filter 의 bias 도 filter 처럼 모든 사진이 함께 쓰고, max pooling 은 가장 큰 값을 고르는 계산이라 parameter 가 없다.

- topic: output-size
  title: stride 와 padding
  variants:
    - question: |
        convolution 에서 사진 테두리에 0 을 한 줄씩 덧대는 padding 에 대한 설명으로 옳은 것은?
      choices:
        - 사진에 없던 새 정보를 더해 모델이 더 많이 보게 한다
        - 출력 크기를 반으로 줄여 계산을 빠르게 한다
        - 테두리 칸의 값을 0 으로 지워 잡음을 없앤다
        - 테두리 칸도 filter 가운데에 올 수 있게 자리를 만들어, 출력 크기가 줄어드는 것을 막는다
      answer: 3
      explanation: |
        padding 없이 3×3 filter 를 대면 맨 가장자리 칸은 filter 가운데에 오지 못해 출력이 입력보다 작아진다. 테두리 바깥에
        0 을 덧대면 가장자리 칸도 가운데에 올 수 있어 크기가 유지된다. 덧댄 값은 0 이라 곱해도 0 이므로 새 정보는 생기지 않고,
        원래 테두리 칸의 값도 그대로 남는다. 크기를 줄이는 것은 stride 나 pooling 의 일이다.
    - question: |
        다른 설정은 그대로 두고 convolution 의 stride 를 1 에서 2 로 바꾸면 어떻게 되나?
      choices:
        - filter 크기가 두 배가 된다
        - 출력의 가로세로가 두 배로 커진다
        - 출력의 가로세로가 대략 반으로 줄어 계산이 줄지만, 건너뛴 자리의 값은 계산되지 않는다
        - parameter 수가 반으로 줄어든다
      answer: 2
      explanation: |
        stride 는 filter 를 한 번에 옮기는 칸 수다. 2 칸씩 건너뛰면 filter 가 놓이는 자리가 가로세로로 대략 반이 되어 출력이
        작아지고 계산도 줄지만, 건너뛴 자리에 있던 특징을 놓칠 수 있다. filter 의 크기와 숫자 수는 stride 와 무관해서
        parameter 수도 그대로다.
    - question: |
        padding 없이 3×3 convolution 층을 여러 번 쌓으면 어떤 일이 생기나?
      choices:
        - 층을 지날 때마다 출력이 조금씩 커진다
        - 층을 지날 때마다 가로세로가 줄어, 몇 층만 쌓아도 feature map 이 아주 작아진다
        - 크기는 그대로이고 테두리 칸의 영향만 점점 커진다
        - 층을 쌓아도 출력 크기와 상관없이 언제나 입력과 같다
      answer: 1
      explanation: |
        padding 이 없으면 3×3 filter 는 가장자리 한 줄을 가운데에 두지 못해 층마다 가로세로가 양쪽 한 칸씩 줄어든다. 이것이
        쌓이면 깊이 쌓기 전에 feature map 이 사라지므로 보통 padding 을 준다. 출력이 커지는 일은 없고, 테두리 칸은 오히려 가운데
        칸보다 적은 window 에만 들어가 영향이 작다.

- topic: conv-params
  title: weight sharing 과 channel
  variants:
    - question: |
        224×224 흑백 사진이든 28×28 흑백 사진이든, 3×3 filter 하나로 된 convolution 의 parameter 수는 똑같다. 그 이유는?
      choices:
        - 같은 filter 한 벌을 사진의 모든 자리에 돌려 써서, parameter 수가 filter 크기로만 정해지기 때문
        - pooling 이 사진을 먼저 작게 줄이기 때문
        - 큰 사진은 가운데 일부만 잘라서 쓰기 때문
        - convolution 은 학습하는 숫자가 없기 때문
      answer: 0
      explanation: |
        convolution 은 자리마다 weight 를 따로 두지 않고 filter 숫자 9 개와 bias 하나를 모든 자리에 돌려 쓴다. 이것을 weight
        sharing 이라 하고, 그래서 사진이 커져도 parameter 는 늘지 않고 filter 를 옮기는 횟수만 는다. pooling 이나 잘라 쓰기와는
        상관이 없고, filter 숫자는 학습하는 parameter 다.
    - question: |
        컬러 사진(channel 3 장)에 3×3 filter 하나를 쓰는 convolution 에 대한 설명으로 옳은 것은?
      choices:
        - filter 는 숫자 9 개짜리 판 하나이고, 이것을 channel 마다 따로 대어 출력 3 장을 낸다
        - 출력 channel 수는 언제나 입력 channel 수와 같다
        - 세 channel 중 빨강 channel 만 계산에 쓴다
        - filter 도 3×3 판 3 장이고, 장마다 곱해 더한 값을 모두 합쳐 feature map 한 장을 낸다
      answer: 3
      explanation: |
        입력이 여러 장이면 filter 도 입력과 같은 장 수로 만들고, 장마다 곱해 더한 값을 하나로 더한 뒤 bias 를 더한다. 그래서
        filter 하나는 입력이 몇 장이든 출력 판 한 장을 만든다. 출력 channel 수는 입력 channel 수가 아니라 filter 개수로 정해지고,
        세 channel 을 모두 써야 특정 색의 경계 같은 것에 반응할 수 있다.
    - question: |
        어떤 conv layer 의 filter 를 16 개에서 32 개로 늘렸다. 무엇이 바뀌나?
      choices:
        - 출력 feature map 의 가로세로가 두 배가 된다
        - filter 하나의 크기가 커진다
        - 출력 channel(feature map 장 수)이 32 장이 되고, parameter 도 두 배가 된다
        - 이 층이 받는 입력 channel 수가 32 장이 된다
      answer: 2
      explanation: |
        filter 하나가 feature map 한 장을 만들므로 출력 channel 수는 filter 개수와 같다. filter 마다 숫자가 같은 개수씩 있으니
        filter 가 두 배면 parameter 도 두 배다. 가로세로는 filter 크기·stride·padding 으로 정해지고, filter 하나의 크기와 입력
        channel 수는 filter 개수와 상관없다. 이 층의 출력 32 장은 다음 층의 입력 channel 이 된다.

- topic: pooling
  title: max pooling 과 위치 이동
  variants:
    - question: |
        2×2 max pooling 에 대한 설명으로 옳은 것은?
      choices:
        - 묶음마다 weight 를 곱해 더하고, 그 weight 를 학습한다
        - 겹치지 않는 2×2 묶음마다 가장 큰 값만 남겨 가로세로를 반으로 줄이고, 학습하는 숫자가 없다
        - 묶음에서 가장 큰 값이 있던 자리의 좌표를 남긴다
        - 크기는 그대로 두고 작은 값을 0 으로 바꾼다
      answer: 1
      explanation: |
        max pooling 은 "이 구역 어딘가에 그 특징이 강하게 있었는가" 만 남기고 정확한 자리는 버린다. 가장 큰 값을 고르는 규칙만
        있어서 학습할 parameter 가 없다. weight 를 곱해 더하는 것은 convolution 이고, 좌표는 오히려 버리는 정보다. 크기를
        유지하며 음수를 0 으로 바꾸는 것은 ReLU 다.
    - question: |
        입력 사진을 조금 옮겼을 때, convolution 출력과 max pooling 출력의 변화를 바르게 짝지은 것은?
      choices:
        - convolution 출력은 같은 만큼 함께 옮겨 가고(equivariance), pooling 출력은 같은 묶음 안의 이동이면 그대로다(invariance)
        - convolution 출력은 그대로이고(invariance), pooling 출력은 함께 옮겨 간다(equivariance)
        - 둘 다 MLP 처럼 값이 크게 바뀐다
        - 둘 다 어떤 이동에도 완전히 그대로다
      answer: 0
      explanation: |
        convolution 은 모든 자리에 같은 filter 를 쓰므로 모양이 옮겨 가면 그 모양에 대한 반응도 같은 값으로 자리만 옮겨 간다.
        max pooling 은 묶음 안의 가장 큰 값만 남기므로, 큰 값이 같은 묶음 안에서 움직이면 결과가 아예 같다. 둘의 짝을 바꾼
        보기는 순서가 뒤집혔고, 어느 쪽도 MLP 처럼 값이 무너지지는 않는다. 다만 묶음 경계를 넘는 이동은 pooling 결과도 바꾼다.
    - question: |
        "max pooling 을 넣으면 CNN 은 물체의 위치에 완전히 무관해진다" 는 주장에 대한 평가로 옳은 것은?
      choices:
        - 맞다. pooling 은 어떤 이동이든 결과를 바꾸지 않는다
        - 맞다. pooling 은 위치 정보를 모두 채널 수로 옮겨 적는다
        - 틀렸다. pooling 은 오히려 작은 이동에도 결과를 크게 바꾼다
        - 틀렸다. 같은 묶음 안의 이동만 지우고, 묶음 경계를 넘는 이동은 결과를 바꾼다
      answer: 3
      explanation: |
        2×2 max pooling 은 큰 값이 같은 묶음 안에서 움직일 때만 결과가 같다. 묶음 경계를 넘으면 큰 값이 다른 칸으로 가서 결과도
        바뀐다. pooling 을 여러 번 거치면 묶음 한 칸이 사진의 넓은 구역을 대표해 한두 pixel 이동에는 거의 흔들리지 않지만, 위치에
        완전히 무관해지지는 않는다. pooling 은 위치를 channel 로 옮겨 적지 않고 그냥 버린다.

- topic: receptive-field
  title: receptive field
  variants:
    - question: |
        CNN 에서 어떤 출력 칸의 receptive field 란?
      choices:
        - 그 칸을 계산하는 filter 의 숫자 개수
        - 그 층의 출력 feature map 전체 크기
        - 그 칸의 값을 계산하는 데 쓰인 입력 사진의 영역
        - 그 칸의 값이 0 보다 큰지 여부
      answer: 2
      explanation: |
        receptive field 는 출력 한 칸이 반영하는 입력 영역이다. 3×3 convolution 의 출력 한 칸은 입력 3×3 만 보고, 그 바깥 pixel
        이 바뀌어도 이 칸은 바뀌지 않는다. filter 숫자 개수는 parameter 수이고, feature map 크기는 층 전체의 출력 모양이라
        칸 하나가 보는 범위와 다르다.
    - question: |
        3×3 filter 만 쓰는 CNN 이 사진 전체를 덮는 큰 물체도 알아볼 수 있는 이유는?
      choices:
        - 마지막 층에서 filter 가 사진 크기로 자동으로 커지기 때문
        - 층을 쌓을수록 한 칸의 receptive field 가 넓어져, 깊은 층이 아래층의 작은 feature 를 조합해 큰 패턴을 보기 때문
        - 3×3 filter 도 사실은 사진 전체를 한 번에 보기 때문
        - 큰 물체는 pixel 값이 커서 작은 filter 에도 크게 반응하기 때문
      answer: 1
      explanation: |
        한 층의 출력 칸은 3×3 만 보지만, 그 위 층의 칸은 아래층 칸 3×3 을 보고 그 칸들이 각자 입력 3×3 을 보므로 더 넓은 영역을
        반영한다. 층이 쌓이면 작은 선 → 모서리 → 부분 → 물체 순서로 큰 패턴이 만들어진다. filter 크기는 층마다 고정이고, 3×3 은
        한 번에 9 칸만 본다. pixel 값의 크기는 물체의 크기와 상관이 없다.
    - question: |
        conv 층 사이에 2×2 pooling 을 넣으면 뒤쪽 층의 receptive field 는 어떻게 되나?
      choices:
        - pooling 은 학습하는 숫자가 없으므로 receptive field 에 영향이 없다
        - 크기를 줄이므로 receptive field 도 좁아진다
        - receptive field 는 filter 크기로만 정해지므로 그대로다
        - pooling 뒤에는 이웃한 칸이 원래 사진에서 더 멀리 떨어진 자리를 대표해, receptive field 가 더 빨리 넓어진다
      answer: 3
      explanation: |
        pooling 을 지나면 feature map 의 이웃한 두 칸은 원래 사진에서 2 pixel 떨어진 자리를 대표한다. 그래서 그 위의 filter 가 한
        칸 넓게 볼 때마다 사진에서는 2 pixel 씩 넓어진다. 학습 숫자가 없어도 칸의 간격을 바꾸므로 영향이 있고, feature map 이 작아
        지는 것과 한 칸이 보는 범위가 넓어지는 것은 서로 반대 방향이 아니라 같은 일의 두 면이다.

- topic: feature-policy
  title: CNN feature 와 로봇 policy
  variants:
    - question: |
        사진을 받는 모델에서 CNN 이 맡는 역할을 가장 잘 설명한 것은?
      choices:
        - 사진을 판단에 필요한 내용만 담은 적은 수의 숫자(feature)로 요약한다
        - 사진의 해상도를 높여 더 선명하게 만든다
        - 사진을 사람이 읽을 수 있는 문장으로 바꾼다
        - 사진의 pixel 값을 손실 없이 그대로 압축 저장한다
      answer: 0
      explanation: |
        CNN 은 수만 ~ 수십만 개의 pixel 숫자를 "이 구역에 이런 모양이 얼마나 있는가" 를 담은 적은 수의 feature 로 줄인다. 잘
        학습된 feature 는 조명이나 작은 위치 변화에 pixel 값보다 덜 흔들린다. 해상도를 높이는 것은 반대 방향의 일이고, 문장으로
        바꾸는 일은 하지 않는다. 판단에 필요 없는 내용은 버리므로 원래 pixel 을 되살릴 수 있는 무손실 압축도 아니다.
    - question: |
        로봇 policy 에 카메라 사진을 그대로 MLP 입력으로 넣지 않고 CNN 으로 feature 를 먼저 뽑아 넣는 이유로 알맞은 것은?
      choices:
        - policy 는 사진 대신 관절 각도만 있어도 충분하기 때문
        - 사진을 그대로 넣으면 첫 layer 의 parameter 가 지나치게 많고, 물체가 조금만 옮겨 가도 policy 가 처음 보는 입력으로 받아들이기 때문
        - MLP 는 0 ~ 255 범위의 숫자를 입력으로 받을 수 없기 때문
        - CNN 을 거치면 사진의 숫자가 오히려 늘어나 정보가 많아지기 때문
      answer: 1
      explanation: |
        사진을 펼쳐 MLP 에 넣으면 사진을 MLP 에 넣을 때의 두 문제, 곧 parameter 폭증과 위치 이동에 대한 약함이 그대로 생긴다.
        CNN 이 사진을 적은 수의 feature 로 줄여 주면 policy 는 그 feature 와 관절 각도를 함께 받아 행동을 정한다. 사진 없이는
        물체의 위치를 알 수 없고, MLP 는 어떤 범위의 숫자든 입력으로 받을 수 있다. CNN 은 숫자를 줄이는 쪽이다.
    - question: |
        로봇 팔 policy 가 카메라 사진을 CNN 으로 feature 로 바꾸고, 그 feature 를 관절 각도와 이어 붙여 받아 다음 관절 목표 각도를
        낸다. 각 요소를 바르게 짝지은 것은?
      choices:
        - 카메라 사진이 action, 관절 목표 각도가 observation, CNN 은 policy 다
        - 관절 각도만 observation 이고, 사진은 학습에만 쓰는 정답이다
        - 사진과 관절 각도가 observation, 다음 관절 목표 각도가 action, 사진을 feature 로 바꾸는 CNN 이 image encoder 다
        - CNN 이 action 을 내고, policy 는 사진을 저장하는 역할만 한다
      answer: 2
      explanation: |
        policy 는 지금 보고 있는 것(observation)을 받아 다음에 할 행동(action)을 내는 모델이다. 로봇 팔에서는 사진과 관절 각도가
        observation, 관절마다 다음에 갈 목표 각도가 action 이다. CNN 은 그중 사진을 숫자로 바꿔 적는 부분이라 image encoder 라고
        부른다. 첫 보기는 입력과 출력을 뒤집었고, 사진은 실행 중에도 policy 가 받는 입력이다.
