# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: convolution
  title: convolution 계산과 feature map
  variants:
    - question: |
        CNN 의 convolution layer 가 출력 한 칸을 계산하는 방법으로 맞는 것은?
      choices:
        - '입력 사진 전체의 pixel 마다 서로 다른 weight 를 곱해 모두 더한다'
        - 'filter 를 겹쳐 밑에 깔린 조각과 같은 자리 숫자끼리 곱해 더하고 bias 를 더한다'
        - 'filter 밑에 깔린 조각에서 가장 큰 값 하나를 골라 출력 칸에 그대로 적는다'
        - '입력 조각의 평균을 구한 뒤 filter 의 평균과 비교해 같으면 1, 다르면 0 을 적는다'
      answer: 1
      explanation: |
        convolution 은 작은 filter 를 입력 위에 겹치고, 겹친 조각(window)과 filter 에서 같은 자리의 숫자끼리 곱해 모두 더한 뒤 bias 를 더해
        출력 한 칸을 만든다. filter 를 한 칸씩 옮기며 이 계산을 되풀이하면 출력 판이 채워진다.
        사진 전체의 pixel 마다 다른 weight 를 곱하는 것은 MLP layer 의 계산이다.
        조각에서 가장 큰 값을 고르는 것은 max pooling 이다.
        평균을 비교해 0·1 을 적는 계산은 convolution 에 없다.
    - question: |
        세로선 모양으로 숫자를 넣은 filter 를 사진에 대어 얻은 feature map 에서 값이 큰 칸은 무엇을 뜻하는가?
      choices:
        - '그 칸의 원래 pixel 이 사진 전체에서 가장 밝다는 뜻이다'
        - '사진 전체에 세로선이 몇 개 있는지 세어 칸마다 적은 값이다'
        - '그 칸을 계산할 때 filter 의 숫자가 학습 중에 가장 많이 바뀌었다는 뜻이다'
        - '그 자리의 window 가 filter 모양인 세로선과 많이 닮았다는 뜻이다'
      answer: 3
      explanation: |
        feature map 의 칸 하나는 그 자리에서 filter 와 window 를 곱해 더한 값이라서, window 가 filter 모양을 닮을수록 커진다. 그래서 세로선
        filter 의 feature map 은 "세로선이 어디에 얼마나 있는가" 를 자리별로 적은 지도다.
        pixel 하나의 밝기만으로 정해지는 값이 아니라 주변 window 전체와 filter 의 곱의 합이다.
        사진 전체의 개수를 세는 값이 아니라 자리마다 따로 계산한 값이다.
        filter 의 숫자는 모든 칸에 같이 쓰이므로 칸마다 바뀐 정도가 다를 수 없다.
    - question: |
        딥러닝 framework 의 convolution 은 수학 교과서의 convolution 과 달리 filter 를 뒤집지 않는다. 이 차이가 학습 결과에 문제가 되는가?
      choices:
        - '문제가 되지 않는다. filter 숫자를 학습하므로 뒤집힌 모양이 필요하면 그 모양을 배운다'
        - '문제가 된다. 뒤집지 않으면 같은 filter 를 모든 자리에 써도 translation equivariance 가 깨진다'
        - '문제가 된다. 뒤집지 않으면 filter 가 테두리를 넘어가 출력 크기가 입력보다 커진다'
        - '문제가 되지 않는다. 사진은 상하좌우가 대칭이라 뒤집어도 같은 사진이기 때문이다'
      answer: 0
      explanation: |
        뒤집지 않는 계산은 수학에서 cross-correlation 이라고 부른다. filter 의 숫자는 사람이 정하지 않고 학습으로 정하므로, 뒤집힌 filter 가
        필요하면 network 가 그 숫자를 배우면 되어 결과가 같다.
        뒤집든 안 뒤집든 같은 filter 를 모든 자리에 쓰므로 equivariance 는 그대로 성립한다.
        출력 크기는 filter 크기·padding·stride 로 정해지고 뒤집기와 관계없다.
        사진은 일반적으로 대칭이 아니므로 대칭이라는 이유는 틀렸다.

- topic: filter-learning
  title: label 에서 filter 까지의 학습 신호
  variants:
    - question: |
        손글씨 숫자 분류 CNN 을 학습할 때 첫 층 filter 의 숫자는 무엇을 정답 삼아 고쳐지는가?
      choices:
        - '사람이 filter 마다 "세로선 모양" 같은 목표 숫자를 정해 두고, 그 숫자에 가까워지도록 맞춘다'
        - 'feature map 마다 목표 판이 따로 있어서, 출력 판과 목표 판의 차이를 줄이도록 filter 를 고친다'
        - 'label 로 구한 loss 를 backpropagation 이 filter 까지 전해 gradient 를 준다'
        - 'filter 에 대한 정답이 없으므로 filter 는 random 값 그대로 두고 마지막 layer 만 학습한다'
      answer: 2
      explanation: |
        데이터에 있는 정답은 사진마다 붙은 label 하나뿐이다. CNN 이 낸 점수를 softmax 로 확률로 바꾸고 label 자리의 확률로 cross-entropy
        loss 를 계산하면, backpropagation 이 이 loss 를 입력 쪽으로 거꾸로 전해 filter 숫자까지 gradient 를 구한다.
        filter 마다 정해 둔 목표 숫자는 없고, filter 가 선 모양이 되는 것은 학습의 결과다.
        feature map 에 대한 목표 판도 어디에도 없다.
        filter 도 parameter 라서 gradient 를 받아 함께 학습하며, random 값 그대로 두지 않는다.
    - question: |
        첫 층 filter 하나는 mini-batch 의 모든 사진에 똑같이 쓰인다. label 이 서로 다른 사진들이 그 filter 의 한 숫자에 서로 반대 방향의
        gradient 를 주면, SGD 한 step 에서 그 숫자는 어떻게 고쳐지는가?
      choices:
        - 'sample 마다 구한 gradient 를 평균하고, 그 평균에 learning rate 를 곱한 만큼 고친다'
        - 'label 숫자가 가장 큰 사진의 gradient 가 가장 중요하므로 그 사진의 gradient 만 따라 고친다'
        - '사진마다 filter 를 하나씩 복사해 따로 고친 뒤, 다음 step 에서 모두 같이 쓴다'
        - 'gradient 부호가 서로 다르면 그 step 의 학습을 멈추고 다음 batch 로 넘어간다'
      answer: 0
      explanation: |
        filter 는 사진마다 따로 있지 않아서, 그 숫자를 어느 쪽으로 고쳐야 loss 가 줄어드는지가 사진마다 다를 수 있다. mini-batch SGD 는 sample
        마다 구한 gradient 를 평균해 하나로 만들고, 그 평균에 learning rate 를 곱해 뺀다. 부호가 반대인 gradient 는 평균에서 서로 일부 지워지고,
        숫자는 크기의 합이 더 큰 쪽이 가리키는 방향으로 움직인다.
        label 은 class 번호일 뿐이라 숫자의 크기가 gradient 의 비중을 정하지 않는다.
        filter 를 사진마다 복사하지 않고 한 벌을 모든 사진이 같이 쓴다.
        부호가 섞여도 평균은 정해지므로 학습은 그대로 이어진다.
    - question: |
        숫자 0 ~ 9 를 분류하도록 학습을 마친 CNN 에서 '숫자 7 에만 쓰이는' parameter 는 어디에 있는가?
      choices:
        - '첫 층 filter 가운데 하나가 숫자 7 전용 filter 다'
        - '첫 층 filter 의 bias 만 숫자마다 따로 있다'
        - 'max pooling 층에 숫자마다 다른 parameter 가 있다'
        - '마지막 layer 에서 7 자리 점수를 계산하는 weight 다'
      answer: 3
      explanation: |
        첫 층 filter 는 모든 사진의 gradient 평균으로 고쳐지므로 한 숫자 전용이 되지 않고, 선이나 밝기 경계처럼 여러 숫자를 가르는 데 두루
        쓰이는 무늬에 반응하게 된다. 숫자 하나에만 쓰이는 것은 마지막 layer 에서 그 숫자 자리의 점수를 계산하는 weight 다.
        숫자 7 전용 filter 가 따로 생기지는 않는다.
        filter 의 bias 도 filter 처럼 모든 사진이 같이 쓴다.
        max pooling 은 가장 큰 값을 고르는 계산이라 parameter 가 없다.

- topic: weight-sharing
  title: weight sharing 과 translation equivariance
  variants:
    - question: |
        사진을 펼쳐 MLP 에 넣는 대신 convolution 을 쓰면 parameter 가 크게 줄어드는 이유는 무엇인가?
      choices:
        - 'convolution 은 사진을 미리 작게 줄여서 받으므로 볼 pixel 자체가 적기 때문이다'
        - 'convolution 은 weight 를 0 과 1 로만 저장해 숫자 하나가 차지하는 양이 작기 때문이다'
        - 'convolution 은 bias 를 쓰지 않아 neuron 마다 붙던 숫자가 빠지기 때문이다'
        - '작은 filter 한 벌을 모든 자리에 돌려 써서, parameter 수가 사진 크기와 무관하기 때문이다'
      answer: 3
      explanation: |
        MLP 의 neuron 은 입력 pixel 마다 weight 를 따로 두어서 사진이 커지면 parameter 도 비례해 는다. convolution 은 가까운 pixel 몇 개만
        보는 작은 filter 를 모든 자리에 같이 쓰므로(weight sharing) parameter 수가 사진 크기와 무관하다.
        사진을 미리 줄이지 않아도 parameter 는 적다.
        weight 는 0·1 이 아닌 실수다.
        convolution layer 도 filter 마다 bias 를 하나씩 둘 수 있고, bias 를 빼도 줄어드는 양은 filter 수만큼뿐이다.
    - question: |
        convolution layer 에 넣는 사진을 오른쪽으로 2 pixel 옮기면 출력 feature map 은 어떻게 되는가? padding 이 있고 stride 는 1 이며, 사진
        가장자리 효과는 무시한다.
      choices:
        - '출력 값이 모두 0 이 된다'
        - '같은 값들이 오른쪽으로 2 칸 옮겨 간다'
        - '출력이 완전히 그대로이고 자리도 바뀌지 않는다'
        - '값의 크기가 2 배가 된다'
      answer: 1
      explanation: |
        같은 filter 가 모든 자리를 똑같이 계산하므로, 사진 속 모양이 옮겨 가면 그 모양에 대한 답도 같은 만큼 옮겨 간다. 이 성질을
        translation equivariance 라고 한다.
        같은 filter 가 옮겨 간 모양도 똑같이 계산하므로 값이 모두 0 이 될 이유가 없다.
        출력이 자리까지 그대로인 것은 invariance 이고, convolution 이 아니라 pooling 이 묶음 안의 작은 이동에 대해 주는 성질이다.
        이동은 값의 크기를 바꾸지 않는다.
    - question: |
        ImageNet 의 224×224 사진으로 미리 학습한 ResNet-18 의 convolution 부분을 480×640 로봇 카메라 사진에 그대로 쓸 수 있는 이유는 무엇인가?
      choices:
        - '480×640 사진을 넣기 전에 반드시 224×224 로 잘라야 하므로 실제로는 같은 크기를 넣는다'
        - 'ResNet-18 은 입력 크기마다 다른 weight 묶음을 미리 저장해 두고, 사진 크기에 맞는 것을 골라 쓰기 때문이다'
        - 'filter 크기와 channel 수로만 parameter 가 정해져, 더 많은 자리에 대면 되기 때문이다'
        - '사진이 커지면 filter 도 자동으로 같은 비율로 커져서 사진의 같은 비율 영역을 보기 때문이다'
      answer: 2
      explanation: |
        conv layer 의 weight 는 사진 크기와 무관한 filter 몇 벌뿐이라서, 큰 사진에는 같은 filter 를 더 많은 자리에 대면 되고 출력 feature map 만
        커진다. ACT 는 480×640 사진에서 15×20 feature map 을 얻는다. 입력 크기에 묶이는 것은 마지막 분류용 fully connected 층뿐이다.
        사진을 224×224 로 꼭 자를 필요는 없다.
        입력 크기마다 다른 weight 를 저장하지 않는다.
        filter 크기는 고정이고 사진에 따라 바뀌지 않는다.

- topic: output-size
  title: stride 와 padding
  variants:
    - question: |
        3×3 convolution 에서 padding 1, stride 1 을 쓰는 이유는 무엇인가?
      choices:
        - '테두리에 0 을 한 줄 덧대, 출력 가로세로를 입력과 같게 지키려고'
        - '테두리에 사진에 없던 정보를 더해, 가장자리 물체의 정확도를 높이려고'
        - '출력 가로세로를 입력의 절반으로 줄여 다음 층의 계산량을 줄이려고'
        - '테두리 칸을 0 으로 두어 학습할 filter 의 parameter 수를 줄이려고'
      answer: 0
      explanation: |
        padding 없이 3×3 filter 를 대면 출력이 가로세로 2 칸씩 작아진다. 0 을 한 줄 덧대면 출력 길이가 $\lfloor (H + 2 - 3)/1 \rfloor + 1 = H$ 라서
        층을 많이 쌓아도 크기가 유지된다.
        덧댄 값은 0 이라 새 정보를 만들지 않는다.
        가로세로를 반으로 줄이는 것은 stride 2 의 효과다.
        padding 은 parameter 수와 관계없다.
    - question: |
        높이 H 인 feature map 에 3×3 convolution 을 padding 1, stride 2 로 하면 출력 높이는 대략 어떻게 되는가?
      choices:
        - '입력과 같은 H 다'
        - 'H 보다 2 작다'
        - '대략 H 의 절반이다'
        - '대략 H 의 2 배다'
      answer: 2
      explanation: |
        출력 길이는 $\lfloor (H + 2p - k)/s \rfloor + 1$ 이고, $p = 1$, $k = 3$, $s = 2$ 를 넣으면 $\lfloor (H - 1)/2 \rfloor + 1$ 로 대략 $H/2$ 다.
        예를 들어 32 는 16 이 된다. filter 를 두 칸씩 건너뛰며 놓기 때문이다.
        입력과 같은 크기는 stride 1 일 때다.
        2 작아지는 것은 padding 0, stride 1 일 때다.
        convolution 의 stride 는 출력을 키우지 않는다.
    - question: |
        stride 를 1 에서 2 로 키우면 무엇을 얻고 무엇을 잃는가?
      choices:
        - '얻는 것도 잃는 것도 없다. filter 가 같으므로 결과도 같다'
        - '출력이 대략 반으로 줄어 계산이 줄지만, 건너뛴 자리의 세밀한 위치 정보를 잃는다'
        - 'filter 를 놓는 횟수가 줄어 parameter 가 반으로 줄지만, 출력 가로세로는 그대로다'
        - '출력 가로세로가 2 배로 커져 위치를 더 정확히 담지만, 계산이 그만큼 늘어난다'
      answer: 1
      explanation: |
        stride 2 는 filter 를 두 칸씩 옮겨서 출력 가로세로가 대략 반으로 줄고 칸 수는 대략 4 분의 1 이 된다. 다음 층의 계산도 그만큼 줄지만, 건너뛴
        자리에 있던 강한 반응을 놓칠 수 있다.
        출력 크기가 바뀌므로 결과가 같지 않다.
        filter 의 parameter 수는 stride 와 관계없다.
        stride 를 키우면 출력은 작아진다.

- topic: channels
  title: 여러 channel 의 convolution 과 parameter 수
  variants:
    - question: |
        RGB 사진을 받는 첫 conv layer 의 3×3 filter 하나에는 학습할 weight 가 몇 개 있는가? bias 는 빼고 센다.
      choices:
        - '9 개'
        - '27 개'
        - '3 개'
        - '81 개'
      answer: 1
      explanation: |
        filter 는 입력 channel 마다 3×3 판을 한 장씩 가져서 $3 \times 3 \times 3 = 27$ 개다. channel 마다 곱해 더한 값을 마지막에 모두 더해 숫자
        하나를 낸다.
        9 개는 입력 channel 수를 곱하는 것을 빠뜨린 값이다.
        3 개는 channel 수만 센 값이다.
        81 개는 9 를 한 번 더 곱한 값으로 근거가 없다.
    - question: |
        conv layer 의 출력 channel 수는 무엇으로 정해지는가?
      choices:
        - '입력 channel 수와 항상 같다'
        - 'filter 크기 k 와 같다. 3×3 filter 면 3 장이다'
        - '입력 사진의 가로 길이로 정해진다'
        - '그 층이 가진 filter 의 개수와 같다'
      answer: 3
      explanation: |
        입력이 몇 장이든 filter 하나는 channel 마다 곱해 더한 값을 합쳐 출력 판 한 장을 만든다. 그래서 filter 를 64 개 두면 출력도 64 장이다.
        입력과 출력의 channel 수는 설계자가 따로 정하며 같을 필요가 없다.
        filter 크기는 한 칸이 보는 범위를 정할 뿐이다.
        사진 크기는 출력의 가로세로를 정하고 channel 수와는 관계없다.
    - question: |
        입력 channel 64 장에 3×3 filter 128 개를 쓰는 conv layer 의 parameter 수를 구하는 식으로 맞는 것은? 각 filter 에 bias 가 하나씩 있다.
      choices:
        - '$128 \times (64 \times 3 \times 3 + 1)$'
        - '$128 \times 3 \times 3 + 128$'
        - '$64 \times 128 + 3 \times 3$'
        - '$(64 + 128) \times (3 \times 3 + 1)$'
      answer: 0
      explanation: |
        filter 하나는 입력 channel 마다 3×3 판이 있어 $64 \times 9$ 개이고 bias 가 하나 붙는다. 그런 filter 가 128 개라서
        $C_{\text{out}} \times (C_{\text{in}} k^2 + 1) = 128 \times 577 = 73{,}856$ 개다.
        둘째 식은 입력 channel 수를 곱하는 것을 빠뜨렸다.
        셋째 식은 MLP 처럼 channel 끼리만 곱하고 filter 크기를 더해 버렸다.
        넷째 식은 channel 수를 곱하지 않고 더했다.

- topic: pooling
  title: pooling 과 translation invariance
  variants:
    - question: |
        2×2 max pooling 이 하는 일과 학습할 parameter 의 개수로 맞는 것은?
      choices:
        - '2×2 filter 의 weight 4 개를 학습해 묶음과 곱해 더하므로 parameter 가 4 개다'
        - '묶음의 평균을 내고, 그 평균에 곱할 계수 하나를 학습하므로 parameter 가 1 개다'
        - '2×2 묶음마다 가장 큰 값만 남겨 가로세로를 반으로 줄이고, parameter 는 없다'
        - '묶음마다 가장 작은 값을 남겨 noise 를 지우고, 묶음마다 문턱값을 하나씩 학습한다'
      answer: 2
      explanation: |
        max pooling 은 묶음마다 가장 큰 값을 고르는 고정된 계산이라 학습할 숫자가 없다. "이 구역 어딘가에 그 특징이 강하게 있었는가" 만 남기고
        구역 안의 정확한 자리는 버린다.
        곱해 더하는 weight 를 학습하는 것은 convolution 이다.
        평균을 내는 것은 average pooling 이고, 보통 학습하는 계수가 없다.
        가장 작은 값을 남기거나 문턱값을 학습하지 않는다.
    - question: |
        convolution 의 translation equivariance 와 max pooling 이 주는 translation invariance 는 어떻게 다른가?
      choices:
        - 'equivariance 는 출력이 함께 옮겨 가는 것이고, invariance 는 조금 옮겨도 출력이 그대로인 것이다'
        - '둘은 같은 말이다. 둘 다 위치가 바뀌어도 물체를 알아본다는 뜻이다'
        - 'equivariance 는 회전에 대한 성질이고, invariance 는 크기 변화에 대한 성질이다'
        - 'equivariance 는 출력이 그대로인 것이고, invariance 는 출력이 함께 옮겨 가는 것이다'
      answer: 0
      explanation: |
        convolution 은 같은 filter 를 모든 자리에 써서 모양이 옮겨 가면 답도 같은 자리만큼 옮겨 간다(equivariance). max pooling 은 묶음 안의
        가장 큰 값만 남기므로 그 값이 묶음 안에서 움직여도 결과가 같다(invariance). 묶음 경계를 넘는 이동은 결과를 바꾼다.
        두 성질은 결과가 다르므로 같은 말이 아니다.
        둘 다 평행 이동에 대한 성질이고, 보통의 CNN 은 회전에 대해 equivariance 를 갖지 않는다.
        넷째 보기는 두 정의를 서로 바꿔 적었다.
    - question: |
        max pooling 을 여러 번 거친 CNN 은 물체가 사진 어디에 있든 결과가 완전히 같아지는가?
      choices:
        - '같아진다. pooling 을 거칠 때마다 위치 정보가 지워져 결국 모두 사라진다'
        - '완전히 같아지지는 않는다. 묶음 경계를 넘는 이동은 결과를 바꾼다'
        - '같아진다. convolution 이 이미 위치에 무관한 값을 내고 pooling 이 이를 굳히기 때문이다'
        - '오히려 위치에 더 민감해진다. pooling 은 작은 이동을 크게 키우기 때문이다'
      answer: 1
      explanation: |
        max pooling 은 묶음 안의 이동만 지운다. 큰 값이 옆 묶음으로 넘어가면 결과 칸도 바뀌므로 위치에 완전히 무관해지지는 않고, pooling 을
        여러 번 거칠수록 한두 pixel 정도의 이동에 덜 흔들릴 뿐이다.
        pooling 이 위치 정보를 모두 지우지는 않는다.
        convolution 은 위치를 함께 옮기는 equivariance 라서 위치에 무관한 값을 내지 않는다.
        pooling 이 이동을 키우지는 않는다.

- topic: receptive-field
  title: receptive field 와 층의 깊이
  variants:
    - question: |
        3×3 convolution 을 stride 1 로 세 번 쌓으면, 마지막 출력 한 칸의 receptive field 는 입력에서 얼마인가?
      choices:
        - '3×3 이다. filter 크기가 3 이기 때문이다'
        - '9×9 다. 층마다 3 칸씩 넓어져 3 + 3 + 3 이다'
        - '27×27 이다. 3 을 세 번 곱한 값이다'
        - '7×7 이다. 층마다 2 칸씩 넓어진다'
      answer: 3
      explanation: |
        3×3 conv 한 층은 receptive field 가 3 이고, 한 층을 더 쌓을 때마다 $k - 1 = 2$ 씩 넓어진다. 그래서 $1 + 3 \times 2 = 7$ 이다.
        3×3 은 한 층만 쌓았을 때의 값이다.
        층마다 3 칸이 아니라 $k - 1 = 2$ 칸씩 넓어지므로 9 가 아니다.
        27 은 $3^3$ 으로 근거가 없다.
    - question: |
        CNN 이 3×3 같은 작은 filter 만 쓰는데도 사진 전체를 덮는 큰 물체를 알아볼 수 있는 이유는 무엇인가?
      choices:
        - '마지막 층에서는 filter 크기를 사진 크기로 키워 사진 전체를 한 번에 보기 때문이다'
        - '층을 쌓을수록 receptive field 가 넓어져, 작은 feature 를 조합해 큰 패턴을 보기 때문이다'
        - 'filter 가 학습 중에 점점 커져서 큰 물체를 덮을 만큼 넓은 영역을 보게 되기 때문이다'
        - '사진을 작은 조각으로 잘라 조각마다 따로 분류한 뒤 투표로 정하기 때문이다'
      answer: 1
      explanation: |
        한 층이 새로 배우는 것은 바로 아래층 feature 의 조합뿐이지만, 층이 쌓이면 receptive field 가 넓어져 짧은 선에서 모서리, 부분, 물체 순서로
        큰 패턴이 만들어진다. stride 와 pooling 은 이웃 칸 사이의 간격을 넓혀 receptive field 를 더 빨리 키운다.
        filter 크기는 층마다 정해 두고 사진 크기로 키우지 않는다.
        학습은 filter 의 숫자만 바꾸고 크기는 바꾸지 않는다.
        조각마다 따로 분류해 투표하는 방식은 CNN 의 기본 구조가 아니다.
    - question: |
        receptive field 가 넓어지는 속도에 stride 2 층이나 2×2 pooling 이 주는 영향은 무엇인가?
      choices:
        - '영향이 없다. receptive field 는 filter 크기로만 정해지고 stride 나 pooling 과는 상관없다'
        - 'receptive field 를 줄인다. 출력이 작아지면 한 칸이 보는 영역도 작아지기 때문이다'
        - '이웃 칸이 입력에서 더 멀리 떨어진 곳을 대표해, 같은 3×3 filter 가 더 넓은 영역을 보게 한다'
        - 'receptive field 를 그 층에서 곧바로 사진 전체로 넓혀 더 쌓을 필요가 없게 한다'
      answer: 2
      explanation: |
        stride 2 나 2×2 pooling 뒤에는 출력의 이웃한 두 칸이 입력에서 2 배 멀리 떨어진 자리를 대표한다. 그래서 그 위의 3×3 filter 가 한 칸 넓게
        볼 때마다 입력에서는 더 많이 넓어진다. 층마다 넓어지는 양은 $(k - 1) \times$ 지금까지의 간격이다.
        filter 크기만으로 정해지지 않고 앞 층들의 stride 가 함께 정한다.
        출력이 작아져도 한 칸이 보는 입력 영역은 오히려 넓어진다.
        한 번에 사진 전체로 넓어지지는 않고 층을 지날 때마다 조금씩 넓어진다.

- topic: robot-encoder
  title: 로봇 image encoder 와 위치 정보
  variants:
    - question: |
        로봇 팔 policy 의 image encoder 로 ImageNet 분류용 CNN 을 가져올 때, 마지막의 global average pooling 을 그대로 쓰면 어떤 문제가 생길 수
        있는가?
      choices:
        - '자리별 값을 평균 내 버려 물체가 어디 있는지 사라지고, 손을 뻗을 위치를 알기 어렵다'
        - 'pooling 층의 parameter 가 너무 많아져 policy 학습이 느려진다'
        - '출력이 1000 class 점수로 고정되어 관절 각도와 이어 붙일 수 없다'
        - '아무 문제가 없다. 평균은 feature map 의 모든 정보를 그대로 보존한다'
      answer: 0
      explanation: |
        분류는 물체가 어디 있든 같은 답을 내야 해서 자리를 지우는 pooling 이 쓸모 있지만, 로봇 제어는 물체의 위치에 따라 행동이 정해진다. Levine
        등(2016)은 이 이유로 pooling 을 쓰지 않았고, Diffusion Policy 는 global average pooling 을 spatial softmax 로 바꿨으며, ACT 는 15×20
        feature map 을 그대로 쓴다.
        global average pooling 은 parameter 가 없어서 parameter 를 늘리지 않는다.
        1000 class 점수는 그 뒤의 분류 층이 내는 것이고, 분류 층은 떼어 내면 된다.
        평균은 자리 정보를 버리므로 모든 정보를 보존하지 않는다.
    - question: |
        spatial softmax 는 CNN 의 feature map 을 어떤 숫자로 바꾸는가?
      choices:
        - 'channel 마다 feature map 의 평균값 하나로 바꿔, 그 특징이 전체에 얼마나 있는지 남긴다'
        - 'channel 마다 가장 큰 값 하나로 바꿔, 특징이 가장 강하게 나온 정도만 남긴다'
        - 'channel 마다 자리별 softmax 확률로 좌표를 평균해 특징의 위치 (x, y) 로 바꾼다'
        - '모든 channel 을 하나로 더한 뒤 softmax 로 class 확률로 바꾼다'
      answer: 2
      explanation: |
        spatial softmax 는 channel 마다 feature map 전체에 softmax 를 걸어 자리별 확률을 만들고, 그 확률로 좌표의 평균을 낸다. 그래서 channel
        하나가 그 특징이 사진 어디쯤 있는지 나타내는 숫자 두 개 $(x, y)$ 가 되고, 위치 정보가 policy 까지 남는다. 계산이 미분 가능해서 policy
        loss 로 conv 층까지 함께 학습한다. 평균값 하나는 global average pooling 이라 자리를 잃는다. 가장 큰 값 하나는 global max pooling 이라
        역시 자리를 잃는다. class 확률을 내는 계산이 아니다.
    - question: |
        Dex-Net 2.0 의 GQ-CNN 은 grasp 후보마다 depth image 를 후보 중심에 맞춰 옮기고 gripper 축 방향에 맞춰 돌린 뒤 넣는다. 돌려서 넣는 이유는
        무엇인가?
      choices:
        - 'depth image 는 gripper 방향으로 돌리지 않으면 일부 값이 음수가 되어 계산이 깨지기 때문이다'
        - '돌리면 사진의 빈 부분을 잘라 크기를 줄일 수 있어 network 의 parameter 가 줄기 때문이다'
        - '돌리면 translation invariance 가 생겨 pooling 이 필요 없어지기 때문이다'
        - 'convolution 은 회전에 equivariance 가 없어, 방향을 맞추면 회전마다 배울 필요가 없기 때문이다'
      answer: 3
      explanation: |
        같은 filter 를 모든 자리에 쓰는 convolution 은 평행 이동에는 맞춰 반응하지만, 회전한 모양은 다른 모양으로 본다. 그래서 grasp 축을 늘
        같은 방향(가로)에 오도록 돌려 넣으면 network 는 한 방향의 grasp 만 판단하면 된다. 논문에 따르면 이 정렬 덕분에 회전 invariance 를 따로
        배울 필요가 없다. 회전은 depth 값의 부호를 바꾸지 않는다. 돌리기는 사진 크기나 parameter 수와 관계없고, 크기는 32×32 로 자르는 단계에서
        정해진다. 회전 정렬은 평행 이동에 대한 invariance 를 만들지 않는다.
