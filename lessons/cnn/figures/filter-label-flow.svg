<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사진이 filter, 뒤쪽 층을 거쳐 점수 10 개가 되고 softmax 로 7 자리 확률 0.1 이 나온다. label 7 은 마지막 loss 계산에만 들어가 −log 0.1 = 2.303 을 만들고, backpropagation 이 이 loss 를 거꾸로 전해 filter 숫자마다 gradient 를 준다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker>
  </defs>
  <rect x="1" y="1" width="858" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <rect x="700" y="16" width="140" height="46" rx="10" fill="#111a2e" stroke="#cf96b8" stroke-width="2"/>
  <text x="770" y="37" fill="#cf96b8" font-size="15" text-anchor="middle">label 7</text>
  <text x="770" y="54" fill="#94a3b8" font-size="12" text-anchor="middle">사람이 붙인 정답</text>
  <line x1="770" y1="64" x2="770" y2="92" stroke="#cf96b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="95" width="100" height="70" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="125" fill="#e2e8f0" font-size="14" text-anchor="middle">사진</text>
  <text x="70" y="147" fill="#7cb4d8" font-size="13" text-anchor="middle">28×28</text>
  <line x1="122" y1="130" x2="148" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="95" width="110" height="70" rx="10" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <text x="205" y="125" fill="#d6aa62" font-size="15" text-anchor="middle">filter</text>
  <text x="205" y="147" fill="#94a3b8" font-size="12" text-anchor="middle">숫자 9 개 + bias</text>
  <line x1="262" y1="130" x2="288" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="95" width="100" height="70" rx="10" fill="#111a2e" stroke="#a99ad6" stroke-width="2"/>
  <text x="340" y="125" fill="#a99ad6" font-size="14" text-anchor="middle">뒤쪽 층</text>
  <text x="340" y="147" fill="#94a3b8" font-size="12" text-anchor="middle">conv·Linear</text>
  <line x1="392" y1="130" x2="418" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="95" width="110" height="70" rx="10" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="475" y="125" fill="#e2e8f0" font-size="14" text-anchor="middle">점수 10 개</text>
  <text x="475" y="147" fill="#7cb4d8" font-size="12" text-anchor="middle">숫자 0~9 자리</text>
  <line x1="532" y1="130" x2="558" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="560" y="95" width="110" height="70" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="615" y="125" fill="#7fc4a2" font-size="14" text-anchor="middle">softmax</text>
  <text x="615" y="147" fill="#e2e8f0" font-size="13" text-anchor="middle">p₇ = 0.1</text>
  <line x1="672" y1="130" x2="698" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="95" width="140" height="70" rx="10" fill="#111a2e" stroke="#d88b8b" stroke-width="2"/>
  <text x="770" y="125" fill="#d88b8b" font-size="15" text-anchor="middle">loss</text>
  <text x="770" y="147" fill="#e2e8f0" font-size="13" text-anchor="middle">−log 0.1 = 2.303</text>

  <polyline points="770,167 770,215 205,215 205,169" fill="none" stroke="#d88b8b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-back)"/>
  <text x="487" y="240" fill="#d88b8b" font-size="14" text-anchor="middle">backpropagation: loss 를 거꾸로 전해 filter 숫자마다 gradient 를 하나씩 구한다</text>

  <text x="430" y="290" fill="#94a3b8" font-size="13" text-anchor="middle">label 은 loss 계산에만 들어가고, filter 는 거꾸로 전해진 gradient 만 받는다</text>
</svg>
