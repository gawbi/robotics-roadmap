  <text x="282.0" y="115.0" fill="#94a3b8" font-size="13" text-anchor="middle">conv·stride</text>
  <text x="282.0" y="135.0" fill="#94a3b8" font-size="13" text-anchor="middle">전체 stride 32</text>
