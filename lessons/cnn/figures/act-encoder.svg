  <rect x="1" y="1" width="858" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="70" width="150" height="80" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95.0" y="95.0" fill="#e2e8f0" font-size="15" text-anchor="middle">카메라 사진</text>
  <text x="95.0" y="115.0" fill="#38bdf8" font-size="13" text-anchor="middle">480×640×3</text>
  <text x="95.0" y="135.0" fill="#38bdf8" font-size="13" text-anchor="middle">= 921,600 개</text>
  <line x1="172" y1="110" x2="208" y2="110" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="212" y="70" width="140" height="80" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
