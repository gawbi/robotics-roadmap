  <text x="733.0" y="115.0" fill="#94a3b8" font-size="13" text-anchor="middle">위치 300 곳 × 카메라 4 대</text>
  <text x="733.0" y="135.0" fill="#94a3b8" font-size="13" text-anchor="middle">= 1,200 곳, 곳마다 512 개</text>
