  <text x="795.0" y="245.0" fill="#f59e0b" font-size="13" text-anchor="middle">k × 14</text>
  <line x1="795" y1="152" x2="795" y2="196" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="489" y="200" fill="#94a3b8" font-size="13" text-anchor="middle">초록 칸 하나 = 사진에서 32 pixel 간격의 한 자리</text>
  <text x="489" y="220" fill="#94a3b8" font-size="13" text-anchor="middle">그 자리에 무엇이 있는지를 숫자 512 개로 적는다</text>
  <text x="430.0" y="305" fill="#94a3b8" font-size="13" text-anchor="middle">사진 크기와 상관없이 같은 ResNet-18 weight 를 쓰고, 출력은 가로세로 위치를 그대로 남긴다</text>
