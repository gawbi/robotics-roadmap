<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ACT 의 image encoder. 카메라 한 대의 480×640×3 사진(숫자 921,600 개)을 ResNet-18 이 전체 stride 32 로 줄여 15×20×512 feature map(153,600 개)을 만들고, 위치 300 곳의 feature 512 개씩을 카메라 4 대 모아 1,200 곳으로 transformer 에 넣는다. 관절 각도 14 개도 함께 들어가 action chunk 를 낸다</title>
