<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇 policy 의 예. 카메라 사진 150,528 개 숫자를 CNN 이 512 개 feature 로 줄이고, 관절 각도 6 개와 함께 policy 에 넣으면 policy 가 다음 관절 목표 6 개를 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="778" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="60" width="140" height="80" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="88" fill="#e2e8f0" font-size="14" text-anchor="middle">카메라 사진</text>
  <text x="90" y="110" fill="#38bdf8" font-size="13" text-anchor="middle">224×224×3</text>
  <text x="90" y="128" fill="#38bdf8" font-size="13" text-anchor="middle">= 150,528 개</text>
  <line x1="162" y1="100" x2="200" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="202" y="70" width="100" height="60" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="252" y="98" fill="#f59e0b" font-size="16" text-anchor="middle">CNN</text>
  <text x="252" y="118" fill="#94a3b8" font-size="12" text-anchor="middle">conv·pooling</text>
  <line x1="304" y1="100" x2="342" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="344" y="60" width="120" height="80" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="404" y="88" fill="#e2e8f0" font-size="14" text-anchor="middle">feature</text>
  <text x="404" y="112" fill="#34d399" font-size="15" text-anchor="middle">512 개</text>
  <rect x="344" y="180" width="120" height="70" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="404" y="208" fill="#e2e8f0" font-size="14" text-anchor="middle">관절 각도</text>
  <text x="404" y="230" fill="#38bdf8" font-size="14" text-anchor="middle">6 개</text>
  <line x1="466" y1="100" x2="520" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466" y1="215" x2="520" y2="170" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="522" y="120" width="100" height="70" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="572" y="150" fill="#a78bfa" font-size="15" text-anchor="middle">policy</text>
  <text x="572" y="172" fill="#94a3b8" font-size="12" text-anchor="middle">MLP 등</text>
  <line x1="624" y1="155" x2="662" y2="155" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="664" y="120" width="100" height="70" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="714" y="148" fill="#e2e8f0" font-size="14" text-anchor="middle">action</text>
  <text x="714" y="170" fill="#f59e0b" font-size="12" text-anchor="middle">관절 목표 6 개</text>
  <text x="390" y="285" fill="#94a3b8" font-size="13" text-anchor="middle">사진 숫자 150,528 개를 512 개로 줄인 뒤 다른 센서 값과 함께 행동을 고른다</text>
</svg>
