<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 방법이 step t 의 weight 로 쓰는 값. REINFORCE 는 episode 끝까지의 reward 를 모두 더한 Gₜ, baseline 판은 거기서 V(sₜ) 를 빼고, actor-critic 은 reward 하나와 critic 의 추정 V(sₜ₊₁) 를 쓴다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="308" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="60.0" y1="60.0" x2="400.0" y2="60.0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="70.0" cy="60.0" r="17" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70.0" y="65.0" fill="#e2e8f0" font-size="13" text-anchor="middle">sₜ</text>
  <circle cx="160.0" cy="60.0" r="17" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160.0" y="65.0" fill="#e2e8f0" font-size="13" text-anchor="middle">sₜ₊₁</text>
  <circle cx="250.0" cy="60.0" r="17" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="250.0" y="65.0" fill="#e2e8f0" font-size="13" text-anchor="middle">sₜ₊₂</text>
  <circle cx="390.0" cy="60.0" r="17" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="390.0" y="65.0" fill="#e2e8f0" font-size="13" text-anchor="middle">끝</text>
  <text x="320.0" y="65.0" fill="#94a3b8" font-size="15" text-anchor="middle">⋯</text>
  <text x="115.0" y="96.0" fill="#34d399" font-size="13" text-anchor="middle">rₜ₊₁</text>
  <text x="205.0" y="96.0" fill="#34d399" font-size="13" text-anchor="middle">rₜ₊₂</text>
  <text x="290.0" y="96.0" fill="#34d399" font-size="13" text-anchor="middle">rₜ₊₃ ⋯</text>
  <path d="M70 128 V120 H390 V128" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="230.0" y="148.0" fill="#e2e8f0" font-size="13" text-anchor="middle">Gₜ = rₜ₊₁ + γrₜ₊₂ + γ²rₜ₊₃ + ⋯</text>
  <text x="420.0" y="126.0" fill="#f59e0b" font-size="14" text-anchor="start">REINFORCE</text>
  <text x="420.0" y="146.0" fill="#94a3b8" font-size="12" text-anchor="start">bias 없음 · variance 큼</text>
  <path d="M70 188 V180 H390 V188" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="230.0" y="208.0" fill="#e2e8f0" font-size="13" text-anchor="middle">Gₜ − V<tspan baseline-shift="sub" font-size="10">φ</tspan>(sₜ)</text>
  <text x="420.0" y="186.0" fill="#38bdf8" font-size="14" text-anchor="start">value baseline</text>
  <text x="420.0" y="206.0" fill="#94a3b8" font-size="12" text-anchor="start">bias 없음 · variance 줄어듦</text>
  <path d="M70 248 V240 H160 V248" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M160 244 H390" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="275.0" y="229.0" fill="#94a3b8" font-size="12" text-anchor="middle">나머지는 V<tspan baseline-shift="sub" font-size="10">φ</tspan>(sₜ₊₁) 로 추정</text>
  <text x="70.0" y="272.0" fill="#e2e8f0" font-size="13" text-anchor="start">rₜ₊₁ + γV<tspan baseline-shift="sub" font-size="10">φ</tspan>(sₜ₊₁) − V<tspan baseline-shift="sub" font-size="10">φ</tspan>(sₜ)</text>
  <text x="420.0" y="246.0" fill="#34d399" font-size="14" text-anchor="start">actor-critic</text>
  <text x="420.0" y="266.0" fill="#94a3b8" font-size="12" text-anchor="start">V<tspan baseline-shift="sub" font-size="10">φ</tspan> 가 틀린 만큼 bias</text>
  <text x="420.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="start">variance 가장 작음</text>
</svg>
