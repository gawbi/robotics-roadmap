<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>점수 [0, 1] 이 e^z 로 [1, 2.7183] 이 되고, 합 3.7183 으로 나눠 확률 [0.2689, 0.7311] 이 되는 softmax 계산 흐름</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="95.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">점수 z</text>
  <text x="270.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">e^z</text>
  <text x="450.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">합으로 나눔</text>
  <text x="595.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">확률 π</text>
  <rect x="40.0" y="73.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95.0" y="100.0" fill="#e2e8f0" font-size="16" text-anchor="middle">0</text>
  <line x1="150.0" y1="95.0" x2="210.0" y2="95.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="180.0" y="87.0" fill="#94a3b8" font-size="11" text-anchor="middle">e^z</text>
  <rect x="215.0" y="73.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="270.0" y="100.0" fill="#e2e8f0" font-size="16" text-anchor="middle">1</text>
  <line x1="325.0" y1="95.0" x2="385.0" y2="95.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="390.0" y="73.0" width="120.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="450.0" y="100.0" fill="#e2e8f0" font-size="13" text-anchor="middle">1 ÷ 3.7183</text>
  <line x1="510.0" y1="95.0" x2="535.0" y2="95.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="540.0" y="73.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="595.0" y="100.0" fill="#34d399" font-size="16" text-anchor="middle" font-weight="600">0.2689</text>
  <rect x="40.0" y="153.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="95.0" y="180.0" fill="#e2e8f0" font-size="16" text-anchor="middle">1</text>
  <line x1="150.0" y1="175.0" x2="210.0" y2="175.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <text x="180.0" y="167.0" fill="#94a3b8" font-size="11" text-anchor="middle">e^z</text>
  <rect x="215.0" y="153.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="270.0" y="180.0" fill="#e2e8f0" font-size="16" text-anchor="middle">2.7183</text>
  <line x1="325.0" y1="175.0" x2="385.0" y2="175.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="390.0" y="153.0" width="120.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="450.0" y="180.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2.7183 ÷ 3.7183</text>
  <line x1="510.0" y1="175.0" x2="535.0" y2="175.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="540.0" y="153.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="595.0" y="180.0" fill="#34d399" font-size="16" text-anchor="middle" font-weight="600">0.7311</text>
  <rect x="255.0" y="122.0" width="150.0" height="26.0" rx="6" fill="#0e1628" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="330.0" y="140.0" fill="#a78bfa" font-size="12" text-anchor="middle">합 1 + 2.7183 = 3.7183</text>
  <text x="340.0" y="228.0" fill="#94a3b8" font-size="12" text-anchor="middle">두 확률은 0 과 1 사이이고 더하면 0.2689 + 0.7311 = 1</text>
</svg>
