<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 215" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>θ = 0 에서 REINFORCE 추정이 가질 수 있는 세 값을 수직선에 놓은 그림. −0.5 (확률 0.5), 0 (0.25), 2 (0.25) 이고 기댓값 0.25 가 점선이다. 0 보다 작은 쪽, 곧 틀린 방향이 확률 0.5 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="213" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="40.0" y="64.0" fill="#7cb4d8" font-size="13" text-anchor="start">baseline 없음: variance 1.0625</text>
  <line x1="90.0" y1="110.0" x2="610.0" y2="110.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="155.0" y1="106.0" x2="155.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
  <text x="155.0" y="130.0" fill="#94a3b8" font-size="11" text-anchor="middle">-1</text>
  <line x1="285.0" y1="106.0" x2="285.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
  <text x="285.0" y="130.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="415.0" y1="106.0" x2="415.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
  <text x="415.0" y="130.0" fill="#94a3b8" font-size="11" text-anchor="middle">1</text>
  <line x1="545.0" y1="106.0" x2="545.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
  <text x="545.0" y="130.0" fill="#94a3b8" font-size="11" text-anchor="middle">2</text>
  <rect x="90.0" y="96.0" width="195.0" height="28.0" rx="4" fill="#d88b8b" fill-opacity="0.12" stroke="#d88b8b" stroke-width="0"/>
  <circle cx="220.0" cy="110.0" r="14.0" fill="#7cb4d8"/>
  <text x="220.0" y="90.0" fill="#e2e8f0" font-size="11" text-anchor="middle">-0.5 (A, 확률 0.5)</text>
  <circle cx="285.0" cy="110.0" r="10.0" fill="#7cb4d8"/>
  <text x="285.0" y="154.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0 (B, 0 개, 확률 0.25)</text>
  <circle cx="545.0" cy="110.0" r="10.0" fill="#7cb4d8"/>
  <text x="545.0" y="94.0" fill="#e2e8f0" font-size="11" text-anchor="middle">2 (B, 4 개, 확률 0.25)</text>
  <line x1="317.5" y1="80.0" x2="317.5" y2="138.0" stroke="#d6aa62" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="493.0" y="196.0" fill="#d6aa62" font-size="12" text-anchor="middle">점선: 기댓값 0.25</text>
  <text x="187.5" y="196.0" fill="#d88b8b" font-size="11" text-anchor="middle">0 보다 작음: 틀린 방향</text>
</svg>
