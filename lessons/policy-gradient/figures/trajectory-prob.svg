<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>칸 1 → 칸 2 → 칸 3 의 trajectory. policy 가 정하는 확률 0.6 과 0.7, environment 가 정하는 이동 확률 0.8 과 0.8 을 곱해 0.2688 이 되고, ln 을 씌우면 −0.5108, −0.2231, −0.3567, −0.2231 의 합이 된다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="303" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="25.0" y="60.0" width="90.0" height="50.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="70.0" y="91.0" fill="#e2e8f0" font-size="15" text-anchor="middle">칸 1</text>
  <rect x="285.0" y="60.0" width="90.0" height="50.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="330.0" y="91.0" fill="#e2e8f0" font-size="15" text-anchor="middle">칸 2</text>
  <rect x="545.0" y="60.0" width="90.0" height="50.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="590.0" y="91.0" fill="#e2e8f0" font-size="15" text-anchor="middle">칸 3</text>
  <text x="590.0" y="130.0" fill="#7fc4a2" font-size="11" text-anchor="middle">충전기, r = +1</text>
  <line x1="115.0" y1="85.0" x2="285.0" y2="85.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="138.0" y="20.0" width="124.0" height="28.0" rx="6" fill="#0e1628" stroke="#7cb4d8" stroke-width="1.2"/>
  <text x="200.0" y="39.0" fill="#7cb4d8" font-size="12" text-anchor="middle">오른쪽 고름 0.6</text>
  <rect x="138.0" y="118.0" width="124.0" height="28.0" rx="6" fill="#0e1628" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="200.0" y="137.0" fill="#d6aa62" font-size="12" text-anchor="middle">미끄러지지 않음 0.8</text>
  <line x1="375.0" y1="85.0" x2="545.0" y2="85.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="398.0" y="20.0" width="124.0" height="28.0" rx="6" fill="#0e1628" stroke="#7cb4d8" stroke-width="1.2"/>
  <text x="460.0" y="39.0" fill="#7cb4d8" font-size="12" text-anchor="middle">오른쪽 고름 0.7</text>
  <rect x="398.0" y="118.0" width="124.0" height="28.0" rx="6" fill="#0e1628" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="460.0" y="137.0" fill="#d6aa62" font-size="12" text-anchor="middle">미끄러지지 않음 0.8</text>
  <text x="340.0" y="185.0" fill="#e2e8f0" font-size="15" text-anchor="middle">P(τ) = 0.6 × 0.8 × 0.7 × 0.8 = 0.2688</text>
  <text x="340.0" y="218.0" fill="#e2e8f0" font-size="14" text-anchor="middle">ln P(τ) = ln 0.6 + ln 0.8 + ln 0.7 + ln 0.8</text>
  <text x="340.0" y="244.0" fill="#e2e8f0" font-size="14" text-anchor="middle">= −0.5108 − 0.2231 − 0.3567 − 0.2231 = −1.3137</text>
  <text x="340.0" y="284.0" fill="#94a3b8" font-size="12" text-anchor="middle">파랑: policy 가 정함 (θ 에 따라 변함) · 주황: environment 가 정함 (θ 와 상관없음)</text>
</svg>
