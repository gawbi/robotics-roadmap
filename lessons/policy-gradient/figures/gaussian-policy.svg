  <line x1="245.0" y1="250.0" x2="485.0" y2="250.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="259.4" y1="250.0" x2="259.4" y2="254.0" stroke="#475569" stroke-width="1"/>
  <text x="259.4" y="268.0" fill="#64748b" font-size="12" text-anchor="middle">−2</text>
  <line x1="307.4" y1="250.0" x2="307.4" y2="254.0" stroke="#475569" stroke-width="1"/>
  <text x="307.4" y="268.0" fill="#64748b" font-size="12" text-anchor="middle">−1</text>
  <line x1="355.4" y1="250.0" x2="355.4" y2="254.0" stroke="#475569" stroke-width="1"/>
  <text x="355.4" y="268.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <line x1="403.4" y1="250.0" x2="403.4" y2="254.0" stroke="#475569" stroke-width="1"/>
  <text x="403.4" y="268.0" fill="#64748b" font-size="12" text-anchor="middle">1</text>
  <line x1="451.4" y1="250.0" x2="451.4" y2="254.0" stroke="#475569" stroke-width="1"/>
  <text x="451.4" y="268.0" fill="#64748b" font-size="12" text-anchor="middle">2</text>
  <text x="485.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="end">action a</text>
  <line x1="365.0" y1="250.0" x2="365.0" y2="117.0" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="359.0" y="109.0" fill="#38bdf8" font-size="13" text-anchor="end">μ = 0.2</text>
  <line x1="389.0" y1="250.0" x2="389.0" y2="132.6" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="389.0" cy="132.6" r="4.5" fill="#f59e0b"/>
  <text x="397.0" y="126.6" fill="#f59e0b" font-size="13" text-anchor="start">뽑은 a = 0.7</text>
  <line x1="365.0" y1="220.0" x2="413.0" y2="220.0" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="419.0" y="224.0" fill="#a78bfa" font-size="12" text-anchor="start">σ = 1</text>
  <line x1="365.0" y1="302.0" x2="387.0" y2="302.0" stroke="#34d399" stroke-width="2" marker-end="url(#ar-green)"/>
  <text x="366.0" y="324.0" fill="#34d399" font-size="12" text-anchor="middle">advantage > 0 이면 μ 가 a 쪽으로</text>
  <text x="366.0" y="342.0" fill="#94a3b8" font-size="12" text-anchor="middle">(a − μ) ÷ σ² = 0.5</text>
  <line x1="496.0" y1="160.0" x2="518.0" y2="160.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="520.0" y="98.0" width="140.0" height="124.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590.0" y="122.0" fill="#e2e8f0" font-size="14" text-anchor="middle">목표 각도</text>
  <text x="590.0" y="146.0" fill="#94a3b8" font-size="12" text-anchor="middle">기본 −0.8 rad</text>
  <text x="590.0" y="168.0" fill="#94a3b8" font-size="12" text-anchor="middle">+ 0.5 × 0.7</text>
  <text x="590.0" y="196.0" fill="#f59e0b" font-size="15" text-anchor="middle">= −0.45 rad</text>
  <line x1="590.0" y1="222.0" x2="590.0" y2="248.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="520.0" y="250.0" width="140.0" height="54.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="590.0" y="272.0" fill="#e2e8f0" font-size="13" text-anchor="middle">PD controller</text>
  <text x="590.0" y="292.0" fill="#94a3b8" font-size="12" text-anchor="middle">→ torque</text>
  <text x="340.0" y="384.0" fill="#94a3b8" font-size="12" text-anchor="middle">실행할 때는 뽑지 않고 평균 μ 를 그대로 쓴다</text>
</svg>
