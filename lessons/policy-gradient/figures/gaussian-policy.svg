<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ANYmal C 보행 policy 의 Gaussian policy. MLP 가 48 개 입력에서 관절 12 개의 평균 μ 를 내고, 관절마다 standard deviation σ parameter(처음 1.0)를 둔다. 왼쪽 앞다리 무릎의 예에서 μ = 0.2, σ = 1 인 종 모양 곡선에서 a = 0.7 을 뽑았고, advantage 가 양수면 μ 가 a 쪽으로 움직인다. a 는 0.5 를 곱해 기본 각도 −0.8 rad 에 더해져 목표 각도 −0.45 rad 가 된다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="678" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="170.0" height="132.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="105.0" y="64.0" fill="#e2e8f0" font-size="15" text-anchor="middle">actor MLP</text>
  <text x="105.0" y="88.0" fill="#94a3b8" font-size="13" text-anchor="middle">입력 48 개</text>
  <text x="105.0" y="110.0" fill="#94a3b8" font-size="13" text-anchor="middle">128 · 64 · 32 (ELU)</text>
  <text x="105.0" y="138.0" fill="#e2e8f0" font-size="13" text-anchor="middle">출력 12 개</text>
  <text x="105.0" y="158.0" fill="#38bdf8" font-size="13" text-anchor="middle">= 관절마다 평균 μ</text>
  <rect x="20.0" y="196.0" width="170.0" height="62.0" rx="8" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="105.0" y="220.0" fill="#e2e8f0" font-size="13" text-anchor="middle">σ parameter 12 개</text>
  <text x="105.0" y="242.0" fill="#94a3b8" font-size="12" text-anchor="middle">state 와 상관없음, 처음 1.0</text>
  <line x1="190.0" y1="106.0" x2="232.0" y2="106.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <line x1="190.0" y1="227.0" x2="232.0" y2="200.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="236.0" y="40.0" width="260.0" height="312.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="366.0" y="62.0" fill="#e2e8f0" font-size="14" text-anchor="middle">왼쪽 앞다리 무릎 (예)</text>
