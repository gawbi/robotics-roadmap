<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>θ = 0 에서 A 와 B 각각 확률 0.5, 기댓값 1 과 2, log-probability gradient −0.5 와 +0.5 를 곱해 −0.25 와 +0.5 가 되고, 더하면 0.25 로 J 의 gradient 와 같다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="60.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">action</text>
  <text x="170.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">π(a)</text>
  <text x="280.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">q*(a)</text>
  <text x="410.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">∇ ln π(a)</text>
  <text x="560.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="middle">세 값의 곱</text>
  <rect x="30.0" y="68.0" width="60.0" height="44.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="60.0" y="95.0" fill="#e2e8f0" font-size="16" text-anchor="middle">A</text>
  <rect x="125.0" y="68.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="170.0" y="95.0" fill="#e2e8f0" font-size="15" text-anchor="middle">0.5</text>
  <rect x="235.0" y="68.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="280.0" y="95.0" fill="#e2e8f0" font-size="15" text-anchor="middle">1</text>
  <rect x="365.0" y="68.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="410.0" y="95.0" fill="#e2e8f0" font-size="15" text-anchor="middle">−0.5</text>
  <text x="225.0" y="95.0" fill="#94a3b8" font-size="16" text-anchor="middle">×</text>
  <text x="345.0" y="95.0" fill="#94a3b8" font-size="16" text-anchor="middle">×</text>
  <line x1="455.0" y1="90.0" x2="512.0" y2="90.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="515.0" y="68.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.5"/>
  <text x="560.0" y="95.0" fill="#d88b8b" font-size="16" text-anchor="middle" font-weight="600">−0.25</text>
  <rect x="30.0" y="138.0" width="60.0" height="44.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="60.0" y="165.0" fill="#e2e8f0" font-size="16" text-anchor="middle">B</text>
  <rect x="125.0" y="138.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="170.0" y="165.0" fill="#e2e8f0" font-size="15" text-anchor="middle">0.5</text>
  <rect x="235.0" y="138.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="280.0" y="165.0" fill="#e2e8f0" font-size="15" text-anchor="middle">2</text>
  <rect x="365.0" y="138.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.5"/>
  <text x="410.0" y="165.0" fill="#e2e8f0" font-size="15" text-anchor="middle">+0.5</text>
  <text x="225.0" y="165.0" fill="#94a3b8" font-size="16" text-anchor="middle">×</text>
  <text x="345.0" y="165.0" fill="#94a3b8" font-size="16" text-anchor="middle">×</text>
  <line x1="455.0" y1="160.0" x2="512.0" y2="160.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="515.0" y="138.0" width="90.0" height="44.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="560.0" y="165.0" fill="#7fc4a2" font-size="16" text-anchor="middle" font-weight="600">+0.5</text>
  <line x1="560.0" y1="182.0" x2="560.0" y2="212.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar-muted)"/>
  <rect x="480.0" y="214.0" width="160.0" height="38.0" rx="6" fill="#0e1628" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="560.0" y="238.0" fill="#a99ad6" font-size="13" text-anchor="middle">합 0.25 = J 의 gradient</text>
  <text x="250.0" y="238.0" fill="#94a3b8" font-size="12" text-anchor="middle">J 의 gradient 공식 π(A)π(B)(q*(B) − q*(A)) = 0.25</text>
</svg>
