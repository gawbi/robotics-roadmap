<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>reward 1, 1, 1 이 들어오는 episode. step 0 의 weight 는 세 reward 를 모두 더한 2.9701, step 1 은 뒤의 두 reward 로 1.99, step 2 는 마지막 reward 하나로 1 이다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="80.0" y1="70.0" x2="560.0" y2="70.0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="80.0" cy="70.0" r="18" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">s₀</text>
  <circle cx="240.0" cy="70.0" r="18" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="240.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">s₁</text>
  <circle cx="400.0" cy="70.0" r="18" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="400.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">s₂</text>
  <circle cx="560.0" cy="70.0" r="18" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="560.0" y="75.0" fill="#e2e8f0" font-size="13" text-anchor="middle">끝</text>
  <text x="160.0" y="58.0" fill="#94a3b8" font-size="12" text-anchor="middle">a₀</text>
  <text x="160.0" y="100.0" fill="#34d399" font-size="13" text-anchor="middle">r₁ = 1</text>
  <text x="320.0" y="58.0" fill="#94a3b8" font-size="12" text-anchor="middle">a₁</text>
  <text x="320.0" y="100.0" fill="#34d399" font-size="13" text-anchor="middle">r₂ = 1</text>
  <text x="480.0" y="58.0" fill="#94a3b8" font-size="12" text-anchor="middle">a₂</text>
  <text x="480.0" y="100.0" fill="#34d399" font-size="13" text-anchor="middle">r₃ = 1</text>
  <path d="M120.0,148 V140 H550 V148" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="110.0" y="145.0" fill="#f59e0b" font-size="12" text-anchor="end">step 0</text>
  <text x="340.0" y="166.0" fill="#e2e8f0" font-size="13" text-anchor="middle">G₀ = 1 + 0.99 × 1 + 0.99² × 1 = 2.9701</text>
  <path d="M280.0,198 V190 H550 V198" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="270.0" y="195.0" fill="#38bdf8" font-size="12" text-anchor="end">step 1</text>
  <text x="420.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">G₁ = 1 + 0.99 × 1 = 1.99</text>
  <path d="M440.0,248 V240 H550 V248" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="430.0" y="245.0" fill="#a78bfa" font-size="12" text-anchor="end">step 2</text>
  <text x="500.0" y="266.0" fill="#e2e8f0" font-size="13" text-anchor="middle">G₂ = 1</text>
</svg>
