<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>marker 의 이동 모양. 수직으로 누르면 접촉 중심에서 바깥으로 퍼지고, 옆으로 끌면 모두 같은 방향으로 움직이며, 비틀면 중심을 돌아 움직인다. 오른쪽 예에서 접촉 영역 marker 5 개의 평균 이동이 0.20 mm 이고 calibration 값이 1 N 당 0.08 mm 면 shear 는 2.5 N 이다</title>
  <defs><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker></defs>
  <rect x="1" y="1" width="738" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="100" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">수직으로 누름</text>
  <rect x="28" y="50" width="144" height="144" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="100" cy="122" r="47" fill="#1e293b" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#e2e8f0"><circle cx="46" cy="68" r="2.6"/><circle cx="46" cy="95" r="2.6"/><circle cx="46" cy="122" r="2.6"/><circle cx="46" cy="149" r="2.6"/><circle cx="46" cy="176" r="2.6"/><circle cx="73" cy="68" r="2.6"/><circle cx="73" cy="95" r="2.6"/><circle cx="73" cy="122" r="2.6"/><circle cx="73" cy="149" r="2.6"/><circle cx="73" cy="176" r="2.6"/><circle cx="100" cy="68" r="2.6"/><circle cx="100" cy="95" r="2.6"/><circle cx="100" cy="122" r="2.6"/><circle cx="100" cy="149" r="2.6"/><circle cx="100" cy="176" r="2.6"/><circle cx="127" cy="68" r="2.6"/><circle cx="127" cy="95" r="2.6"/><circle cx="127" cy="122" r="2.6"/><circle cx="127" cy="149" r="2.6"/><circle cx="127" cy="176" r="2.6"/><circle cx="154" cy="68" r="2.6"/><circle cx="154" cy="95" r="2.6"/><circle cx="154" cy="122" r="2.6"/><circle cx="154" cy="149" r="2.6"/><circle cx="154" cy="176" r="2.6"/></g>
  <g stroke="#d6aa62" stroke-width="2" marker-end="url(#aa)"><line x1="73" y1="95" x2="63.3" y2="85.3"/><line x1="73" y1="122" x2="63.3" y2="122.0"/><line x1="73" y1="149" x2="63.3" y2="158.7"/><line x1="100" y1="95" x2="100.0" y2="85.3"/><line x1="100" y1="149" x2="100.0" y2="158.7"/><line x1="127" y1="95" x2="136.7" y2="85.3"/><line x1="127" y1="122" x2="136.7" y2="122.0"/><line x1="127" y1="149" x2="136.7" y2="158.7"/></g>
  <text x="100" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">중심에서 바깥으로 퍼짐</text>
  <text x="280" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">옆으로 끎</text>
  <rect x="208" y="50" width="144" height="144" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="280" cy="122" r="47" fill="#1e293b" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#e2e8f0"><circle cx="226" cy="68" r="2.6"/><circle cx="226" cy="95" r="2.6"/><circle cx="226" cy="122" r="2.6"/><circle cx="226" cy="149" r="2.6"/><circle cx="226" cy="176" r="2.6"/><circle cx="253" cy="68" r="2.6"/><circle cx="253" cy="95" r="2.6"/><circle cx="253" cy="122" r="2.6"/><circle cx="253" cy="149" r="2.6"/><circle cx="253" cy="176" r="2.6"/><circle cx="280" cy="68" r="2.6"/><circle cx="280" cy="95" r="2.6"/><circle cx="280" cy="122" r="2.6"/><circle cx="280" cy="149" r="2.6"/><circle cx="280" cy="176" r="2.6"/><circle cx="307" cy="68" r="2.6"/><circle cx="307" cy="95" r="2.6"/><circle cx="307" cy="122" r="2.6"/><circle cx="307" cy="149" r="2.6"/><circle cx="307" cy="176" r="2.6"/><circle cx="334" cy="68" r="2.6"/><circle cx="334" cy="95" r="2.6"/><circle cx="334" cy="122" r="2.6"/><circle cx="334" cy="149" r="2.6"/><circle cx="334" cy="176" r="2.6"/></g>
  <g stroke="#d6aa62" stroke-width="2" marker-end="url(#aa)"><line x1="253" y1="95" x2="266.0" y2="95.0"/><line x1="253" y1="122" x2="266.0" y2="122.0"/><line x1="253" y1="149" x2="266.0" y2="149.0"/><line x1="280" y1="95" x2="293.0" y2="95.0"/><line x1="280" y1="122" x2="293.0" y2="122.0"/><line x1="280" y1="149" x2="293.0" y2="149.0"/><line x1="307" y1="95" x2="320.0" y2="95.0"/><line x1="307" y1="122" x2="320.0" y2="122.0"/><line x1="307" y1="149" x2="320.0" y2="149.0"/></g>
  <text x="280" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">모두 끈 방향으로</text>
  <text x="460" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">비틂</text>
  <rect x="388" y="50" width="144" height="144" rx="6" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="460" cy="122" r="47" fill="#1e293b" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <g fill="#e2e8f0"><circle cx="406" cy="68" r="2.6"/><circle cx="406" cy="95" r="2.6"/><circle cx="406" cy="122" r="2.6"/><circle cx="406" cy="149" r="2.6"/><circle cx="406" cy="176" r="2.6"/><circle cx="433" cy="68" r="2.6"/><circle cx="433" cy="95" r="2.6"/><circle cx="433" cy="122" r="2.6"/><circle cx="433" cy="149" r="2.6"/><circle cx="433" cy="176" r="2.6"/><circle cx="460" cy="68" r="2.6"/><circle cx="460" cy="95" r="2.6"/><circle cx="460" cy="122" r="2.6"/><circle cx="460" cy="149" r="2.6"/><circle cx="460" cy="176" r="2.6"/><circle cx="487" cy="68" r="2.6"/><circle cx="487" cy="95" r="2.6"/><circle cx="487" cy="122" r="2.6"/><circle cx="487" cy="149" r="2.6"/><circle cx="487" cy="176" r="2.6"/><circle cx="514" cy="68" r="2.6"/><circle cx="514" cy="95" r="2.6"/><circle cx="514" cy="122" r="2.6"/><circle cx="514" cy="149" r="2.6"/><circle cx="514" cy="176" r="2.6"/></g>
  <g stroke="#d6aa62" stroke-width="2" marker-end="url(#aa)"><line x1="433" y1="95" x2="442.7" y2="85.3"/><line x1="433" y1="122" x2="433.0" y2="112.3"/><line x1="433" y1="149" x2="423.3" y2="139.3"/><line x1="460" y1="95" x2="469.7" y2="95.0"/><line x1="460" y1="149" x2="450.3" y2="149.0"/><line x1="487" y1="95" x2="496.7" y2="104.7"/><line x1="487" y1="122" x2="487.0" y2="131.7"/><line x1="487" y1="149" x2="477.3" y2="158.7"/></g>
  <text x="460" y="216" fill="#94a3b8" font-size="12" text-anchor="middle">중심을 돌아 움직임</text>
  <line x1="548" y1="46" x2="548" y2="236" stroke="#1e293b" stroke-width="1.5"/>
  <text x="640" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">예: shear 추정</text>
  <text x="562" y="60" fill="#94a3b8" font-size="11">calibration(예): 1 N 마다 0.08 mm</text>
  <text x="572" y="86" fill="#e2e8f0" font-size="12">marker 1</text>
  <text x="712" y="86" fill="#d6aa62" font-size="12" text-anchor="end">0.20 mm</text>
  <text x="572" y="108" fill="#e2e8f0" font-size="12">marker 2</text>
  <text x="712" y="108" fill="#d6aa62" font-size="12" text-anchor="end">0.22 mm</text>
  <text x="572" y="130" fill="#e2e8f0" font-size="12">marker 3</text>
  <text x="712" y="130" fill="#d6aa62" font-size="12" text-anchor="end">0.18 mm</text>
  <text x="572" y="152" fill="#e2e8f0" font-size="12">marker 4</text>
  <text x="712" y="152" fill="#d6aa62" font-size="12" text-anchor="end">0.21 mm</text>
  <text x="572" y="174" fill="#e2e8f0" font-size="12">marker 5</text>
  <text x="712" y="174" fill="#d6aa62" font-size="12" text-anchor="end">0.19 mm</text>
  <line x1="566" y1="188" x2="716" y2="188" stroke="#94a3b8" stroke-width="1"/>
  <text x="572" y="206" fill="#e2e8f0" font-size="12">평균</text>
  <text x="712" y="206" fill="#d6aa62" font-size="12" text-anchor="end">0.20 mm</text>
  <text x="640" y="230" fill="#d6aa62" font-size="12" text-anchor="middle" font-weight="600">shear = 0.20 ÷ 0.08 = 2.5 N</text>
  <text x="24" y="262" fill="#e2e8f0" font-size="12">파란 점선 원: 접촉 영역. 힘이 섞이면 marker 이동도 각 모양의 합에 가깝다(GelSight 논문)</text>
  <text x="24" y="284" fill="#94a3b8" font-size="12">비례 상수는 접촉 모양이 바뀌면 달라져서, GelSight 저자들은 사진에서 힘을 바로 내는 CNN 을 학습했다</text>
  <text x="24" y="306" fill="#7cb4d8" font-size="12">GelSight Mini 의 marker 63 개 × 가로·세로 = 숫자 126 개 → PCA 로 15 개 (Reactive Diffusion Policy)</text>
</svg>
