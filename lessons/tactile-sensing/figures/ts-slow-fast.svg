<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>action chunk 와 촉각의 주기. 위는 Diffusion Policy 로, 0 초의 관측으로 0.67 초 chunk 를 내고 그동안 GelSight Mini 사진 약 17 장을 쓰지 않는다. 아래는 RDP 로, 느린 층이 1 ~ 2 Hz 로 latent chunk 를 내고 빠른 층이 1초에 24 번 촉각 값을 받아 1 ms 안에 action 을 고친다</title>
  <rect x="1" y="1" width="738" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="370" y="26" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">action chunk 와 촉각의 주기</text>
  <line x1="185.0" y1="40" x2="185.0" y2="118" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="185.0" y1="152" x2="185.0" y2="202" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="189.0" y="46" fill="#d88b8b" font-size="11">미끄러짐 시작 (예: 0.05 s)</text>
  <text x="18" y="76" fill="#e2e8f0" font-size="13" font-weight="600">Diffusion Policy</text>
  <text x="18" y="93" fill="#94a3b8" font-size="11">관측에 촉각을 더해도</text>
  <rect x="150" y="60" width="469.0" height="22" rx="3" fill="#7cb4d8" fill-opacity="0.25" stroke="#7cb4d8" stroke-width="1.2"/>
  <text x="404.5" y="75" fill="#e2e8f0" font-size="11" text-anchor="middle">chunk 0.67 s (1초에 12 개 action), 실행 중에는 관측을 보지 않음</text>
  <rect x="619.0" y="60" width="84.0" height="22" rx="3" fill="#d6aa62" fill-opacity="0.45"/>
  <text x="661.0" y="75" fill="#e2e8f0" font-size="10" text-anchor="middle">추론</text>
  <circle cx="703.0" cy="71" r="5" fill="#d88b8b"/>
  <text x="703.0" y="100" fill="#d88b8b" font-size="11" text-anchor="end">0.67 + 0.12 = 0.79 s 에 반응</text>
  <g stroke="#94a3b8" stroke-width="1.4" stroke-opacity="0.6"><line x1="150.0" y1="106" x2="150.0" y2="116"/><line x1="178.0" y1="106" x2="178.0" y2="116"/><line x1="206.0" y1="106" x2="206.0" y2="116"/><line x1="234.0" y1="106" x2="234.0" y2="116"/><line x1="262.0" y1="106" x2="262.0" y2="116"/><line x1="290.0" y1="106" x2="290.0" y2="116"/><line x1="318.0" y1="106" x2="318.0" y2="116"/><line x1="346.0" y1="106" x2="346.0" y2="116"/><line x1="374.0" y1="106" x2="374.0" y2="116"/><line x1="402.0" y1="106" x2="402.0" y2="116"/><line x1="430.0" y1="106" x2="430.0" y2="116"/><line x1="458.0" y1="106" x2="458.0" y2="116"/><line x1="486.0" y1="106" x2="486.0" y2="116"/><line x1="514.0" y1="106" x2="514.0" y2="116"/><line x1="542.0" y1="106" x2="542.0" y2="116"/><line x1="570.0" y1="106" x2="570.0" y2="116"/><line x1="598.0" y1="106" x2="598.0" y2="116"/></g>
  <text x="150" y="132" fill="#94a3b8" font-size="11">GelSight Mini 사진(1초에 25 장): 0.67 × 25 ≈ 17 장을 쓰지 않음</text>
  <line x1="18" y1="146" x2="722" y2="146" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="176" fill="#e2e8f0" font-size="13" font-weight="600">RDP</text>
  <text x="18" y="193" fill="#94a3b8" font-size="11">slow-fast 두 층</text>
  <rect x="150" y="160" width="469.0" height="22" rx="3" fill="#a99ad6" fill-opacity="0.25" stroke="#a99ad6" stroke-width="1.2"/>
  <text x="404.5" y="175" fill="#e2e8f0" font-size="11" text-anchor="middle">느린 층: 카메라·촉각으로 latent chunk, 1초에 1 ~ 2 번</text>
  <g stroke="#7fc4a2" stroke-width="2"><line x1="150.0" y1="188" x2="150.0" y2="200"/><line x1="179.2" y1="188" x2="179.2" y2="200"/><line x1="208.3" y1="188" x2="208.3" y2="200"/><line x1="237.5" y1="188" x2="237.5" y2="200"/><line x1="266.7" y1="188" x2="266.7" y2="200"/><line x1="295.8" y1="188" x2="295.8" y2="200"/><line x1="325.0" y1="188" x2="325.0" y2="200"/><line x1="354.2" y1="188" x2="354.2" y2="200"/><line x1="383.3" y1="188" x2="383.3" y2="200"/><line x1="412.5" y1="188" x2="412.5" y2="200"/><line x1="441.7" y1="188" x2="441.7" y2="200"/><line x1="470.8" y1="188" x2="470.8" y2="200"/><line x1="500.0" y1="188" x2="500.0" y2="200"/><line x1="529.2" y1="188" x2="529.2" y2="200"/><line x1="558.3" y1="188" x2="558.3" y2="200"/><line x1="587.5" y1="188" x2="587.5" y2="200"/><line x1="616.7" y1="188" x2="616.7" y2="200"/></g>
  <circle cx="208.3" cy="194" r="5" fill="none" stroke="#d88b8b" stroke-width="1.8"/>
  <text x="150" y="216" fill="#7fc4a2" font-size="11">빠른 층: 1초에 24 번 촉각 PCA 값을 받아 action 을 고침 (계산 1 ms 미만)</text>
  <text x="150" y="234" fill="#d88b8b" font-size="11">빨간 원: 미끄러짐 뒤 첫 촉각 사진에서 고침 (사진 간격 1000 ÷ 24 ≈ 42 ms)</text>
  <line x1="150" y1="252" x2="710.0" y2="252" stroke="#94a3b8" stroke-width="1"/>
  <line x1="150" y1="248" x2="150" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <text x="150" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">0 s</text>
  <line x1="290.0" y1="248" x2="290.0" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <text x="290.0" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">0.2 s</text>
  <line x1="430.0" y1="248" x2="430.0" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <text x="430.0" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">0.4 s</text>
  <line x1="570.0" y1="248" x2="570.0" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <text x="570.0" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">0.6 s</text>
  <line x1="710.0" y1="248" x2="710.0" y2="256" stroke="#94a3b8" stroke-width="1"/>
  <text x="710.0" y="270" fill="#94a3b8" font-size="11" text-anchor="middle">0.8 s</text>
  <text x="18" y="300" fill="#94a3b8" font-size="12">한 번 계산하는 시간(RTX 4090): Diffusion Policy 120 ms, 느린 층 100 ms, 빠른 층 1 ms 미만</text>
  <text x="18" y="322" fill="#94a3b8" font-size="12">센서 자체의 지연: vision-based 촉각 센서 10 ~ 60 ms, 힘 센서 1 ms 미만 (RDP 부록)</text>
</svg>
