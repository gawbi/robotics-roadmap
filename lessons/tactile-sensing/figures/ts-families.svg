<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 가지 촉각 센서의 단면. resistive array 는 가로세로 전극 사이의 막이 칸마다 누르는 힘을 재고, 3D-ViTac 에서는 손가락 하나의 256 칸을 1초에 약 32 번 읽는다. magnetic skin 은 자석 가루를 섞은 막 아래 magnetometer 5 개가 자기장 15 개를 1초에 약 400 번 읽는다. vision-based 센서는 gel 아래 LED 와 카메라가 640 × 480 사진을 1초에 60 장 찍는다(DIGIT)</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="738" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="128" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">resistive array</text>
  <text x="370" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">magnetic skin</text>
  <text x="612" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">vision-based</text>
  <line x1="250" y1="46" x2="250" y2="314" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="492" y1="46" x2="492" y2="314" stroke="#1e293b" stroke-width="1.5"/>

  <text x="128" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">위에서 본 패드(일부)</text>
  <g stroke="#94a3b8" stroke-width="1">
    <rect x="58" y="68" width="140" height="140" fill="#111a2e"/>
    <line x1="81.3" y1="68" x2="81.3" y2="208"/><line x1="104.7" y1="68" x2="104.7" y2="208"/><line x1="128" y1="68" x2="128" y2="208"/><line x1="151.3" y1="68" x2="151.3" y2="208"/><line x1="174.7" y1="68" x2="174.7" y2="208"/>
    <line x1="58" y1="91.3" x2="198" y2="91.3"/><line x1="58" y1="114.7" x2="198" y2="114.7"/><line x1="58" y1="138" x2="198" y2="138"/><line x1="58" y1="161.3" x2="198" y2="161.3"/><line x1="58" y1="184.7" x2="198" y2="184.7"/>
  </g>
  <rect x="104.7" y="114.7" width="23.3" height="23.3" fill="#d6aa62" fill-opacity="0.9"/>
  <rect x="128" y="114.7" width="23.3" height="23.3" fill="#d6aa62" fill-opacity="0.6"/>
  <rect x="104.7" y="138" width="23.3" height="23.3" fill="#d6aa62" fill-opacity="0.6"/>
  <rect x="128" y="138" width="23.3" height="23.3" fill="#d6aa62" fill-opacity="0.35"/>
  <rect x="81.3" y="114.7" width="23.3" height="23.3" fill="#d6aa62" fill-opacity="0.25"/>
  <text x="128" y="226" fill="#d6aa62" font-size="11" text-anchor="middle">진한 칸일수록 세게 눌림</text>
  <text x="16" y="252" fill="#e2e8f0" font-size="12">칸마다 누르는 힘 하나</text>
  <text x="16" y="274" fill="#7cb4d8" font-size="12">3D-ViTac: 16 × 16 = 256 칸</text>
  <text x="16" y="296" fill="#7cb4d8" font-size="12">1초에 약 32 번, 1 mm 미만 두께</text>
  <text x="16" y="318" fill="#d88b8b" font-size="12">shear 는 직접 읽지 못함</text>

  <text x="370" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">옆에서 본 단면</text>
  <path d="M290,84 L450,84 L450,116 L290,116 Z" fill="#1e293b" stroke="#a99ad6" stroke-width="1.4"/>
  <g fill="#a99ad6">
    <circle cx="302" cy="94" r="2"/><circle cx="318" cy="106" r="2"/><circle cx="334" cy="92" r="2"/><circle cx="350" cy="104" r="2"/><circle cx="366" cy="96" r="2"/><circle cx="382" cy="108" r="2"/><circle cx="398" cy="93" r="2"/><circle cx="414" cy="105" r="2"/><circle cx="430" cy="95" r="2"/><circle cx="442" cy="107" r="2"/>
    <circle cx="310" cy="100" r="2"/><circle cx="342" cy="98" r="2"/><circle cx="374" cy="101" r="2"/><circle cx="406" cy="99" r="2"/><circle cx="436" cy="101" r="2"/>
  </g>
  <text x="370" y="78" fill="#a99ad6" font-size="11" text-anchor="middle">자석 가루를 섞은 고무 막 (2 ~ 3 mm)</text>
  <rect x="290" y="158" width="160" height="16" rx="2" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="312" y="146" width="16" height="12" fill="#7cb4d8"/>
  <rect x="362" y="146" width="16" height="12" fill="#7cb4d8"/>
  <rect x="412" y="146" width="16" height="12" fill="#7cb4d8"/>
  <g fill="none" stroke="#a99ad6" stroke-width="1.2" stroke-dasharray="3 3">
    <path d="M320,116 Q320,132 320,144"/><path d="M370,116 Q370,132 370,144"/><path d="M420,116 Q420,132 420,144"/>
    <path d="M345,116 Q350,134 366,144"/><path d="M395,116 Q390,134 374,144"/>
  </g>
  <text x="370" y="192" fill="#7cb4d8" font-size="11" text-anchor="middle">magnetometer (가운데 1 + 둘레 4)</text>
  <text x="370" y="226" fill="#94a3b8" font-size="11" text-anchor="middle">막과 회로는 선으로 이어져 있지 않음</text>
  <text x="258" y="252" fill="#e2e8f0" font-size="12">자기장 x·y·z × 5 개 = 15 개</text>
  <text x="258" y="274" fill="#7cb4d8" font-size="12">ReSkin: 1초에 약 400 번</text>
  <text x="258" y="296" fill="#7cb4d8" font-size="12">위치와 normal·shear 를 신경망으로</text>
  <text x="258" y="318" fill="#d88b8b" font-size="12">주변 쇠붙이·자석에 흔들림</text>

  <text x="612" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">옆에서 본 단면</text>
  <path d="M532,84 L692,84 L692,112 L532,112 Z" fill="#7cb4d8" fill-opacity="0.15" stroke="#7cb4d8" stroke-width="1.2"/>
  <path d="M532,84 L592,84 Q612,100 632,84 L692,84" fill="none" stroke="#e2e8f0" stroke-width="2.4"/>
  <path d="M590,74 Q612,98 634,74 Z" fill="#94a3b8"/>
  <text x="640" y="78" fill="#94a3b8" font-size="11" text-anchor="start">물체</text>
  <text x="700" y="100" fill="#7cb4d8" font-size="10" text-anchor="start">gel</text>
  <circle cx="546" cy="132" r="6" fill="#d88b8b"/>
  <circle cx="678" cy="132" r="6" fill="#7fc4a2"/>
  <line x1="552" y1="128" x2="596" y2="102" stroke="#d88b8b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="672" y1="128" x2="628" y2="102" stroke="#7fc4a2" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="546" y="152" fill="#d88b8b" font-size="10" text-anchor="middle">LED</text>
  <text x="678" y="152" fill="#7fc4a2" font-size="10" text-anchor="middle">LED</text>
  <rect x="596" y="172" width="32" height="22" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.4"/>
  <circle cx="612" cy="172" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="606" y1="166" x2="560" y2="114" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="618" y1="166" x2="664" y2="114" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="612" y="210" fill="#e2e8f0" font-size="11" text-anchor="middle">카메라</text>
  <text x="612" y="226" fill="#94a3b8" font-size="11" text-anchor="middle">초점 거리 때문에 두꺼움</text>
  <text x="500" y="252" fill="#e2e8f0" font-size="12">gel 사진에서 모양·marker</text>
  <text x="500" y="274" fill="#7cb4d8" font-size="12">DIGIT: 640 × 480, 1초에 60 장</text>
  <text x="500" y="296" fill="#7cb4d8" font-size="12">GelSight Mini: 1초에 25 장</text>
  <text x="500" y="318" fill="#d88b8b" font-size="12">사진 지연 10 ~ 60 ms (RDP 부록)</text>
</svg>
