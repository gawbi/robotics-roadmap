<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>카메라와 촉각 센서가 보는 것. 왼쪽은 손목 카메라의 시야로, 손가락 사이의 접촉면이 손가락에 가려 보이지 않고 0.5 m 앞에서 pixel 하나가 1.2 mm 를 덮는다. 오른쪽은 손끝 촉각 센서가 보는 접촉면으로, pixel 하나가 0.03 mm 를 덮고 누르는 힘 N 과 접촉면을 따라가는 힘 T, 가장자리의 partial slip 이 보인다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker></defs>
  <rect x="1" y="1" width="738" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">카메라가 보는 것</text>
  <rect x="34" y="58" width="52" height="30" rx="5" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <circle cx="74" cy="73" r="8" fill="#0b1220" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="60" y="108" fill="#94a3b8" font-size="11" text-anchor="middle">손목 카메라</text>
  <rect x="160" y="62" width="150" height="16" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="160" y="78" width="22" height="122" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="288" y="78" width="22" height="122" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="182" y="112" width="106" height="64" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="235" y="149" fill="#e2e8f0" font-size="12" text-anchor="middle">물체</text>
  <line x1="182" y1="114" x2="182" y2="174" stroke="#d88b8b" stroke-width="4"/>
  <line x1="288" y1="114" x2="288" y2="174" stroke="#d88b8b" stroke-width="4"/>
  <line x1="84" y1="80" x2="158" y2="132" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="84" y1="76" x2="158" y2="100" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="150" y="146" fill="#d88b8b" font-size="15" text-anchor="middle" font-weight="700">×</text>
  <text x="235" y="218" fill="#d88b8b" font-size="12" text-anchor="middle">빨간 선: 손가락과 물체가 닿은 면</text>
  <text x="24" y="250" fill="#e2e8f0" font-size="12">접촉면: 손가락에 가려 보이지 않는다</text>
  <text x="24" y="272" fill="#e2e8f0" font-size="12">누르는 힘: 사진에 찍히지 않는다</text>
  <text x="24" y="294" fill="#e2e8f0" font-size="12">미끄러짐: 물체가 움직인 뒤에야 보인다</text>
  <text x="24" y="316" fill="#7cb4d8" font-size="12">0.5 m 앞 pixel 하나 = 0.5 ÷ 424 ≈ 1.2 mm</text>
  <line x1="372" y1="46" x2="372" y2="314" stroke="#1e293b" stroke-width="1.5"/>
  <text x="555" y="32" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">손끝 촉각 센서가 보는 것</text>
  <rect x="420" y="50" width="270" height="176" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="430" y="66" fill="#94a3b8" font-size="11">gel 사진</text>
  <ellipse cx="555" cy="146" rx="82" ry="52" fill="#1e293b" stroke="#7cb4d8" stroke-width="1.5"/>
  <g fill="#e2e8f0">
    <circle cx="447" cy="86" r="3"/><circle cx="483" cy="86" r="3"/><circle cx="519" cy="86" r="3"/><circle cx="555" cy="86" r="3"/><circle cx="591" cy="86" r="3"/><circle cx="627" cy="86" r="3"/><circle cx="663" cy="86" r="3"/>
    <circle cx="447" cy="116" r="3"/><circle cx="483" cy="116" r="3"/><circle cx="519" cy="116" r="3"/><circle cx="555" cy="116" r="3"/><circle cx="591" cy="116" r="3"/><circle cx="627" cy="116" r="3"/><circle cx="663" cy="116" r="3"/>
    <circle cx="447" cy="146" r="3"/><circle cx="483" cy="146" r="3"/><circle cx="519" cy="146" r="3"/><circle cx="555" cy="146" r="3"/><circle cx="591" cy="146" r="3"/><circle cx="627" cy="146" r="3"/><circle cx="663" cy="146" r="3"/>
    <circle cx="447" cy="176" r="3"/><circle cx="483" cy="176" r="3"/><circle cx="519" cy="176" r="3"/><circle cx="555" cy="176" r="3"/><circle cx="591" cy="176" r="3"/><circle cx="627" cy="176" r="3"/><circle cx="663" cy="176" r="3"/>
    <circle cx="447" cy="206" r="3"/><circle cx="483" cy="206" r="3"/><circle cx="519" cy="206" r="3"/><circle cx="555" cy="206" r="3"/><circle cx="591" cy="206" r="3"/><circle cx="627" cy="206" r="3"/><circle cx="663" cy="206" r="3"/>
  </g>
  <g stroke="#d6aa62" stroke-width="2" marker-end="url(#aa)">
    <line x1="555" y1="146" x2="579" y2="146"/>
    <line x1="519" y1="146" x2="538" y2="146"/>
    <line x1="591" y1="146" x2="610" y2="146"/>
    <line x1="555" y1="116" x2="574" y2="116"/>
    <line x1="555" y1="176" x2="574" y2="176"/>
    <line x1="519" y1="116" x2="531" y2="116"/>
    <line x1="591" y1="116" x2="603" y2="116"/>
    <line x1="519" y1="176" x2="531" y2="176"/>
    <line x1="591" y1="176" x2="603" y2="176"/>
  </g>
  <g stroke="#d88b8b" stroke-width="2" marker-end="url(#aa)">
    <line x1="483" y1="146" x2="492" y2="146"/>
    <line x1="627" y1="146" x2="636" y2="146"/>
  </g>
  <circle cx="483" cy="146" r="9" fill="none" stroke="#d88b8b" stroke-width="1.4"/>
  <circle cx="627" cy="146" r="9" fill="none" stroke="#d88b8b" stroke-width="1.4"/>
  <text x="400" y="250" fill="#7cb4d8" font-size="12">파란 타원: 접촉면, pixel 하나 = 19 mm ÷ 640 ≈ 0.03 mm (DIGIT)</text>
  <text x="400" y="272" fill="#e2e8f0" font-size="12">눌린 깊이 → 누르는 힘 N</text>
  <text x="400" y="294" fill="#d6aa62" font-size="12">노란 화살표: marker 이동 → 접촉면을 따라가는 힘 T</text>
  <text x="400" y="316" fill="#d88b8b" font-size="12">가장자리 marker 가 덜 움직임 → partial slip</text>
</svg>
