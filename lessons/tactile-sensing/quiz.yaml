# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: what-vision-misses
  title: 카메라가 보지 못하는 접촉
  section: 카메라가-보지-못하는-접촉
  variants:
    - question: |
        물체를 쥔 gripper 에서 손목 카메라로는 알기 어렵고 손끝 촉각 센서로는 알 수 있는 정보로 가장 알맞은 것은?
      choices:
        - '손가락과 물체가 맞닿은 면의 모양, 누르는 힘, 가장자리부터 시작하는 미끄러짐'
        - '물체가 작업대 위 어디에 있는지와 gripper 가 다가가야 할 방향과 거리'
        - '물체의 색과 이름처럼 닿기 전에 물체를 찾고 고르는 데 필요한 정보'
        - '관절 각도와 손끝 위치처럼 로봇 안의 encoder 로 바로 잴 수 있는 값'
      answer: 0
      explanation: |
        접촉면은 손가락과 물체 사이에 끼어 있어 카메라에서 가려지고, 누르는 힘은 사진에 찍히지 않으며, partial slip 은 가려진 면 안에서
        가장자리부터 시작한다. 손끝 촉각 센서는 그 면에서 직접 잰다. 물체의 위치와 다가갈 방향은 카메라로 잘 얻는 정보다. 색과 이름도
        닿기 전에 카메라로 얻는다. 관절 각도와 손끝 위치는 encoder 와 forward kinematics 로 얻으므로 촉각 센서가 필요한 이유가 아니다.
    - question: |
        손목에 F/T sensor 가 달린 팔에도 손끝 촉각 센서를 따로 붙이는 이유로 가장 알맞은 것은?
      choices:
        - 'F/T sensor 는 수직 힘만 재고, 접촉면을 따라 끄는 힘은 전혀 재지 못하기 때문이다'
        - 'F/T sensor 는 모든 접촉을 합친 힘·torque 6 개만 내서 어디가 닿았는지 모르기 때문이다'
        - 'F/T sensor 는 1초에 몇 번밖에 못 읽어서 grip force 를 고칠 만큼 빠르지 않기 때문이다'
        - 'F/T sensor 의 값은 controller 만 받을 수 있어서 학습한 policy 에 넣을 수 없기 때문이다'
      answer: 1
      explanation: |
        손목 F/T sensor 는 손가락과 물체 사이의 모든 접촉을 합친 힘 3 개와 torque 3 개를 낸다. 그래서 어느 손가락의 어느 자리가 닿았는지
        알 수 없고, 접촉면의 모양이나 가장자리의 partial slip 도 알 수 없다. F/T sensor 는 세 방향 힘을 모두 재므로 접선 힘도 잰다. 힘 센서는
        지연이 1 ms 보다 짧을 만큼 빠르다. Reactive Diffusion Policy 처럼 힘 값을 policy 입력으로 넣은 연구도 있다.
    - question: |
        μ 를 모르는 물체를 쥘 때 partial slip 을 감지할 수 있으면 grip force 를 정하는 방식이 어떻게 달라지는가?
      choices:
        - 'partial slip 이 보이면 μ 를 정확히 계산할 수 있어서 안전율 없이 딱 맞는 힘으로 쥔다'
        - '미끄러짐을 감지하는 즉시 손을 펴서 물체를 놓고, grasp 를 처음부터 다시 계획한다'
        - 'partial slip 은 물체가 떨어진 뒤에 생기므로 grip force 를 정하는 데는 쓸 수 없다'
        - '늘 안전율만큼 세게 쥐는 대신, 약하게 쥐다가 미끄러지기 시작할 때만 힘을 올린다'
      answer: 3
      explanation: |
        μ 를 모르면 미끄러지지 않도록 안전율을 곱해 늘 세게 쥐어야 한다. partial slip 은 물체가 통째로 미끄러지기 전에 접촉면 가장자리에서
        먼저 나타나므로, 이를 보면 약하게 쥐고 있다가 필요할 때만 힘을 올릴 수 있다. partial slip 을 봐도 μ 를 정확히 알게 되는 것은 아니다.
        감지하자마자 물체를 놓으면 grip force 를 고치는 목적과 반대다. partial slip 은 물체가 떨어진 뒤가 아니라 떨어지기 전에 나타나는 신호다.

- topic: sensor-families
  title: 촉각 센서의 종류
  section: 촉각-센서의-종류
  variants:
    - question: |
        ReSkin·AnySkin 같은 magnetic skin 이 vision-based 촉각 센서보다 유리한 점으로 가장 알맞은 것은?
      choices:
        - '접촉면의 모양을 0.03 mm 간격으로 찍어 물체 표면의 결과 무늬까지 구분할 수 있다'
        - '얇고 1초에 수백 번 읽으며, 회로와 선으로 이어지지 않은 막만 갈아 끼울 수 있다'
        - '주변의 쇠붙이나 자석에 영향을 받지 않아서 어떤 작업장에서도 신호가 안정하다'
        - '신경망 없이도 자기장 값 15 개가 그대로 접촉 위치와 힘의 숫자로 읽힌다'
      answer: 1
      explanation: |
        magnetic skin 에서는 2 ~ 3 mm 두께의 자석 가루 막 아래 magnetometer 가 1초에 약 400 번 자기장을 읽고, 막이 회로와 선으로 이어져
        있지 않아 닳은 막만 바꿀 수 있다. 0.03 mm 간격의 사진은 vision-based 센서의 장점이다. magnetic skin 은 주변 쇠붙이와 자석에 신호가
        흔들리는 약점이 있다. 자기장 15 개에서 위치와 힘을 얻으려면 학습한 신경망도 필요하다.
    - question: |
        3D-ViTac 이 쓴 resistive array 패드의 특징과 한계로 알맞은 것은?
      choices:
        - '칸마다 누르는 힘을 재서 얇고 싸지만, 접촉면을 따라 끄는 힘(shear)은 직접 읽지 못한다'
        - 'gel 뒤 카메라로 눌린 모양을 찍어 해상도가 높지만, 카메라 때문에 손가락이 두꺼워진다'
        - '자석 가루 막의 자기장을 읽어 shear 도 재지만, 주변의 쇠붙이 때문에 신호가 흔들린다'
        - '전극이 무른 면과 떨어져 있어 오래 버티지만, 칸이 네 개뿐이라 접촉 위치를 모른다'
      answer: 0
      explanation: |
        resistive array 는 누르면 저항이 바뀌는 막을 가로세로 전극 사이에 끼워 칸마다 누르는 힘을 잰다. 3D-ViTac 패드는 두께가 1 mm 가
        안 되고 칸이 16 × 16 개이지만, 칸마다 수직으로 누르는 힘 하나만 재서 shear 는 직접 읽지 못한다. gel 과 카메라는 vision-based 센서의
        설명이다. 자기장을 읽는 것은 magnetic skin 이다. resistive array 는 칸이 수백 개라 접촉 위치를 알 수 있다.
    - question: |
        vision-based 촉각 센서가 다른 촉각 센서보다 불리할 수 있는 경우로 알맞은 것은?
      choices:
        - '물체 표면의 무늬나 접촉면의 정확한 모양을 봐야 하는 재질 구분 과제를 할 때'
        - '손끝이 넓고 평평해서 카메라와 gel 을 넣을 공간이 충분한 parallel gripper 일 때'
        - '빠르게 바뀌는 접촉에 몇 ms 안에 반응해야 하거나 손가락이 얇아야 하는 과제일 때'
        - '시연을 모으는 사람에게 접촉면의 모양을 화면으로 그대로 보여 줘야 할 때'
      answer: 2
      explanation: |
        vision-based 센서는 1초에 25 ~ 60 장 정도 찍고 사진이 10 ~ 60 ms 늦게 도착하며, 카메라가 초점을 맞출 거리 때문에 두껍다. 그래서
        빠른 반응이나 얇은 손가락이 필요한 과제에서는 1초에 수백 번 읽는 얇은 magnetic skin 같은 센서가 나을 수 있다. 무늬와 모양을 보는
        과제는 사진을 찍는 vision-based 센서가 잘하는 일이다. 접촉면을 화면에 그대로 보여 주는 일도 마찬가지다. 공간이 넉넉한 gripper 에서는
        두께가 문제 되지 않는다.

- topic: photometric-stereo
  title: gel 과 카메라로 재는 모양
  section: gel-과-카메라로-재는-모양
  variants:
    - question: |
        GelSight 가 gel 뒤의 카메라 사진 한 장에서 접촉면의 깊이를 얻는 방법으로 알맞은 것은?
      choices:
        - '카메라 두 대로 같은 점을 찍어 disparity 를 구하고, focal length 와 baseline 으로 깊이를 얻는다'
        - '막이 깊게 패일수록 pixel 이 어두워지므로, 밝기를 그대로 깊이 값으로 바꿔서 쓴다'
        - '방향이 다른 색 빛의 밝기로 pixel 마다 막의 기울기를 구하고, 기울기를 더해 깊이를 얻는다'
        - 'marker 사이의 거리가 좁아진 정도를 재서, 좁아진 만큼 그 자리가 깊게 패였다고 본다'
      answer: 2
      explanation: |
        GelSight 는 반사 성질이 일정한 막을 서로 다른 방향의 빨강·초록·파랑 빛으로 비추고, 각 색의 밝기에서 pixel 마다 막의 기울기를 구한
        뒤 기울기를 더해(적분해) 깊이 지도를 만든다. 이를 photometric stereo 라고 한다. 카메라 두 대로 disparity 를 구하는 것은
        stereo camera 의 방법이다. 밝기는 깊이가 아니라 기울기에 달려 있어서 평평하게 깊이 눌린 곳과 눌리지 않은 곳이 같은 밝기일 수 있다. marker 의
        이동은 막이 옆으로 끌린 양을 재는 데 쓴다.
    - question: |
        GelSight 류 센서를 쓰기 전에 지름을 아는 작은 공을 여러 자리에 눌러 calibration 하는 이유로 알맞은 것은?
      choices:
        - '공의 무게를 기준으로 삼아, 사진의 밝기를 N 단위의 힘으로 바로 바꾸는 표를 만들기 위해서다'
        - '공의 모양으로 색과 기울기의 대응표를 만드는데, 빛이 고르지 않고 센서마다 조립이 달라서다'
        - 'gel 은 처음 몇 번 눌릴 때 굳어지므로, 공으로 미리 눌러 고무를 길들여 두기 위해서다'
        - '공의 지름을 pixel 수로 재서 카메라의 focal length 와 lens distortion 을 구하기 위해서다'
      answer: 1
      explanation: |
        모양을 아는 공을 누르면 pixel 마다 진짜 기울기를 알 수 있어서, 색의 변화와 기울기를 잇는 lookup table 을 만들 수 있다. LED 가 gel
        가까이 있어 빛이 나란하지 않고, 센서마다 조립이 조금씩 달라서 이 표는 센서마다 만들어야 한다. 이 calibration 은 밝기를 힘이 아니라
        기울기로 바꾸는 표를 만든다. gel 을 길들이는 절차도 아니다. focal length 와 distortion 은 checkerboard 같은 카메라 calibration 으로 구한다.
    - question: |
        두 방향의 빛으로 막의 기울기를 구할 때 두 밝기의 차이를 그대로 쓰지 않고 두 밝기의 합으로 나눈 값을 쓰는 이유로 알맞은 것은?
      choices:
        - '합으로 나누면 값이 늘 0 과 1 사이가 되어서 신경망의 입력으로 넣기 편하기 때문이다'
        - '합으로 나누면 깊이를 따로 더할 필요 없이 그 pixel 의 깊이가 바로 나오기 때문이다'
        - '합으로 나누면 marker 같은 어두운 점의 영향이 커져 marker 를 찾기 쉬워지기 때문이다'
        - '합으로 나누면 반사율처럼 두 밝기에 똑같이 곱해진 값이 지워져 기울기만 남기 때문이다'
      answer: 3
      explanation: |
        막이 빛을 고르게 흩뜨리면 각 밝기는 반사율에 각도의 cosine 을 곱한 값이라, 차이를 합으로 나누면 반사율이 분자와 분모에서 지워지고
        기울기만 남는다. 그래서 막이 조금 더 밝거나 어두워도 같은 기울기가 나온다. 이 값은 기울기의 방향에 따라 음수도 되므로 늘 0 과 1
        사이에 있지는 않다. 이 값은 기울기일 뿐이고, 깊이는 기울기를 더해야 얻는다. marker 를 찾는 일과도 관계없다.

- topic: markers-shear
  title: marker 로 재는 shear 와 힘
  section: marker-로-재는-shear-와-힘
  variants:
    - question: |
        GelSight 의 marker 가 접촉 중심에서 바깥쪽으로 퍼지듯 움직였다. 어떤 힘이 주로 걸린 것인가?
      choices:
        - '접촉면을 따라 한 방향으로 끄는 shear force 가 걸려 막이 그쪽으로 끌렸다'
        - '접촉면에 수직인 축으로 비트는 torque 가 걸려 막이 중심을 돌며 움직였다'
        - '접촉이 끊기는 중이라 눌렸던 gel 이 원래 모양으로 되돌아가며 움직였다'
        - '접촉면에 수직으로 누르는 normal force 가 걸려 막이 바깥으로 밀려났다'
      answer: 3
      explanation: |
        수직으로 누르면 막이 눌린 자리에서 바깥으로 밀려나 marker 가 접촉 중심에서 퍼진다. shear 가 걸리면 접촉 영역의 marker 가 모두 끄는
        방향으로 움직인다. 비틀면 marker 가 중심을 돌아 움직인다. 이동은 아무것도 닿지 않은 처음 사진의 위치를 기준으로 재므로, 접촉이 끊겨 gel 이
        돌아가면 이동이 0 쪽으로 줄어들 뿐 바깥으로 퍼지는 모양이 새로 생기지는 않는다.
    - question: |
        GelSight 논문에서 접촉 영역 marker 의 평균 이동이 shear force 에 비례했는데도, 저자들이 비례 상수를 쓰지 않고 사진에서 힘을 내는 CNN 을 학습한 이유는?
      choices:
        - '비례 상수가 접촉 모양마다 달라서, 처음 보는 모양의 물체에는 상수 하나를 쓸 수 없기 때문이다'
        - 'marker 이동은 shear 와 관계없이 수직 힘에만 비례해서, shear 는 따로 학습해야 했기 때문이다'
        - 'marker 를 사진에서 찾는 계산이 느려서 1초에 30 장을 처리하려면 CNN 이 필요했기 때문이다'
        - '비례 관계가 미끄러지기 시작하면 바로 깨져서, 그 구간의 힘은 상수로 구할 수 없기 때문이다'
      answer: 0
      explanation: |
        논문의 실험에서 비례 관계는 접촉 모양이 같을 때만 상수가 일정했고, 다른 모양의 물체를 대면 상수가 바뀌었다. 그래서 모양에 관계없이
        힘을 내도록 여러 모양의 데이터로 CNN 을 학습했다. marker 의 평균 이동은 shear 에 비례했다. 미끄러짐이 일어난 구간에서도 비례 관계는
        유지됐다. marker 는 검은 점의 중심을 찾는 가벼운 계산으로 추적하므로 계산 시간은 CNN 을 쓴 이유가 아니다.
    - question: |
        policy 의 촉각 입력으로 gel 사진 전체 대신 marker 이동을 PCA 로 줄인 값을 쓸 때 얻는 이점으로 알맞은 것은?
      choices:
        - 'PCA 가 marker 이동을 N 단위의 정확한 힘으로 바꿔 주므로 F/T sensor 로 맞출 필요가 없다'
        - 'gel 을 바꾸거나 조금 상해 무늬와 조명이 달라져도 덜 흔들리고, 몇 개 성분이 힘 방향과 대응한다'
        - 'PCA 로 숫자를 줄이면 센서가 1초에 찍는 사진 수가 늘어서 접촉 변화를 더 자주 볼 수 있다'
        - 'marker 가 없는 센서에서도 PCA 가 marker 위치를 만들어 내서 어떤 gel 이든 같은 값을 낸다'
      answer: 1
      explanation: |
        Reactive Diffusion Policy 는 GelSight Mini 의 marker 63 개 이동(숫자 126 개)을 PCA 로 15 개로 줄였다. marker 의 위치 변화만 쓰므로 gel 을
        바꾸거나 상해서 사진의 무늬와 조명이 바뀌어도 덜 흔들렸고, 첫 성분들이 접선 힘·비트는 torque·수직 힘에 해당하는 모양으로 나왔다. PCA 는
        데이터가 퍼진 방향을 뽑을 뿐 N 단위로 calibration 해 주지 않는다. PCA 로 숫자를 줄여도 센서의 frame rate 는 바뀌지 않는다. marker 가
        없는 gel 에는 이 방법을 쓸 수 없다.

- topic: slip-detection
  title: 미끄러짐 감지
  section: 미끄러짐-감지
  variants:
    - question: |
        무른 손끝으로 쥔 물체가 미끄러지기 시작할 때 gel 의 marker 이동에 나타나는 신호로 알맞은 것은?
      choices:
        - '모든 marker 가 같은 거리만큼 끄는 방향으로 움직이고, 그 이동이 계속 커진다'
        - '접촉면 가장자리의 marker 가 가운데 marker 보다 눈에 띄게 덜 움직이게 된다'
        - '가운데 marker 부터 멈추고, 가장자리 marker 는 물체와 함께 계속 끌려간다'
        - 'marker 가 접촉 중심에서 바깥으로 퍼지며 접촉면이 점점 넓어지게 된다'
      answer: 1
      explanation: |
        무른 접촉에서는 미끄러짐이 접촉면 가장자리에서 먼저 시작하고, 가운데는 전체가 미끄러질 때까지 물체에 붙어 있다. 붙은 가운데 marker 는
        물체와 함께 끌려가고 미끄러진 가장자리 marker 는 덜 끌려가므로, 이동이 고르지 않게 된다. 모든 marker 가 같이 움직이면 아직 다
        붙어 있는 상태다. 가운데부터 멈춘다는 것은 순서가 반대다. 바깥으로 퍼지는 모양은 수직으로 누를 때의 신호다.
    - question: |
        촉각 센서로 미끄러짐을 감지할 때 friction cone 조건 T > μN 을 그대로 쓰기보다 partial slip 의 흔적을 찾는 이유로 알맞은 것은?
      choices:
        - 'T 와 N 은 촉각 센서로 잴 수 없어서, friction cone 에 넣을 값을 얻을 방법이 없기 때문이다'
        - 'friction cone 은 두 손가락 grasp 에만 맞고, 촉각 센서가 달린 손끝에는 맞지 않기 때문이다'
        - '로봇은 잡은 물체의 μ 를 모르는데, partial slip 은 μ 없이도 미끄러짐이 가까움을 보이기 때문이다'
        - 'partial slip 의 흔적은 물체가 떨어진 뒤에 남아서, 실패를 기록하고 분석하기 좋기 때문이다'
      answer: 2
      explanation: |
        friction cone 조건에는 물체의 μ 가 필요한데, 처음 잡는 물체의 μ 는 알 수 없다. partial slip 은 μ 를 몰라도 접촉면 가장자리가 먼저
        미끄러지는 모습으로 한계가 가까움을 보여 준다. GelSight 처럼 marker 로 shear 와 수직 힘을 추정할 수 있으므로 T 와 N 을 못 재는 것은
        아니다. friction cone 은 손끝 하나의 접촉에도 성립한다. partial slip 은 물체가 떨어지기 전에 나타나는 신호다.
    - question: |
        사람은 partial slip 을 느끼고 grip force 를 고치는 데 약 80 ms 가 걸린다. 1초에 25 장 찍는 vision-based 촉각 센서를 쓸 때의 한계로 알맞은 것은?
      choices:
        - '25 장이면 80 ms 동안 사진이 수백 장 쌓여서, 계산이 밀려 오히려 반응이 늦어진다'
        - '사진 한 장의 해상도가 높으면 사진 간격과 관계없이 반응 시간은 문제가 되지 않는다'
        - '1초에 25 장 찍는 센서는 미끄러짐을 볼 수 없고, 수직으로 누르는 힘만 잴 수 있다'
        - '80 ms 동안 사진이 약 2 장뿐이고 전달 지연도 있어서, 빠른 미끄러짐에 늦을 수 있다'
      answer: 3
      explanation: |
        1초에 25 장이면 80 ms 동안 $0.08 \times 25 = 2$ 장만 찍히고, vision-based 센서는 사진이 10 ~ 60 ms 늦게 전달되기도 해서 빠르게 진행되는
        미끄러짐에는 늦을 수 있다. 사진은 80 ms 동안 2 장 정도라 쌓일 만큼 많지 않다. 해상도가 높아도 사진 간격이 반응 시간의 하한을 정한다.
        1초에 25 장이어도 marker 이동으로 미끄러짐을 볼 수 있으며, 문제는 보느냐가 아니라 얼마나 빨리 보느냐다.

- topic: tactile-sim
  title: 촉각 simulation 과 실물의 차이
  section: 촉각-simulation-과-실물의-차이
  variants:
    - question: |
        TACTO 로 만든 촉각 사진으로만 학습한 모델을 실물 DIGIT 에서 시험하자 오차가 크게 늘었다. 논문에서 실물 데이터 없이 이 차이를 크게 줄인 방법은?
      choices:
        - 'simulation 사진의 해상도를 실물과 같은 640 × 480 으로 올려 렌더링하고 다시 학습했다'
        - 'RGB 채널마다 밝기와 대비를 무작위로 바꾸는 augmentation 으로 조명 차이에 강하게 했다'
        - 'physics engine 의 timestep 을 줄여 접촉 힘을 더 정확히 계산한 데이터로 다시 학습했다'
        - 'simulation 데이터를 10 배로 늘려, 실물에 가까운 사진이 우연히 섞이기를 기대했다'
      answer: 1
      explanation: |
        TACTO 의 펜 위치 추정 실험에서 simulation 으로만 학습한 모델의 실물 오차는 4.56 mm 였고, RGB 채널마다 밝기와 대비를 흔드는 color
        jittering 을 넣자 1.66 mm 로 줄었다. 저자들은 이 augmentation 이 실물 센서의 조명 차이에 강하게 만든다고 보았다. 해상도를 올리는
        방법은 이 실험에서 시험한 대응이 아니고, 조명 차이를 직접 다루지도 않는다. timestep 을 줄이는 방법도 시험하지 않았고, 접촉 힘을 더
        정확히 계산해도 조명 차이는 그대로다. 데이터 양만 늘리는 방법도 시험하지 않았고, 조명 차이라는 원인을 직접 다루지 않는다.
    - question: |
        TACTO 같은 촉각 simulator 의 사진이 실물과 어긋나는 원인으로 TACTO 논문이 밝힌 것은?
      choices:
        - '접촉 경계에서 gel 이 늘어나는 모양과 실물 센서의 고르지 않은 조명을 그대로 흉내 내지 못한다'
        - 'OpenGL 렌더링이 1초에 몇 장밖에 그리지 못해서, 접촉이 빠르게 바뀌면 중간 사진이 빠진다'
        - 'physics engine 이 수직 힘을 계산하지 못해서, gel 이 눌린 깊이를 늘 0 으로 두고 그린다'
        - 'simulation 사진에는 접촉 모양이 없어서 깊이 지도를 쓰는 모델은 학습할 수 없다'
      answer: 0
      explanation: |
        TACTO 는 깊이와 사진을 한 번에 그려서 접촉 경계에서 gel 이 늘어나는 모양을 잘 흉내 내지 못하고, 실물 센서는 빛이 멀리 갈수록
        어두워져 밝기가 고르지 않다. 그래서 TACTO 는 실물 센서의 접촉 전 사진을 받아 simulation 의 접촉 전후 차이에 더하는 보정을 둔다. TACTO 는
        GPU 에서 DIGIT 하나를 1초에 약 200 장 그린다. physics engine 이 준 수직 힘은 gel 쪽으로 밀어 넣는 깊이로 바뀐다. TACTO 는 깊이와 RGB
        사진을 함께 낸다.
    - question: |
        촉각 simulation 데이터와 실물 데이터를 함께 쓴 TACTO 의 실험 결과로 알맞은 것은?
      choices:
        - 'simulation 데이터는 실물과 달라서 실물 데이터에 섞으면 같은 양의 실물만 쓸 때보다 늘 나빴다'
        - 'simulation 에서 학습한 모델은 실물에서 시험해도 simulation 안에서와 거의 같은 오차를 냈다'
        - 'simulation 데이터에 실물 데이터를 조금 섞으면 같은 양의 실물만 쓴 것보다 늘 좋았다'
        - '실물 데이터가 128 장이 넘으면 simulation 데이터를 더해도 성능이 전혀 달라지지 않았다'
      answer: 2
      explanation: |
        펜 위치 추정에서 실물 16 ~ 128 장 어느 경우에도 simulation 데이터에 그 실물 데이터를 섞은 모델이 실물만으로 학습한 모델보다 오차가
        작았다(128 장에서 0.52 mm 대 0.76 mm). 섞으면 늘 나빴다는 보기는 이 결과와 반대다. simulation 으로만 학습하면 simulation 안에서 0.41 mm
        이던 오차가 실물에서는 4.56 mm 로 커져서 둘이 같지 않다. 128 장에서도 simulation 을 섞은 쪽이 더 좋았으므로 효과가 사라졌다고 할 수 없다.

- topic: visuo-tactile-policy
  title: 촉각을 넣은 학습한 policy
  section: 촉각을-넣은-학습한-policy
  variants:
    - question: |
        3D-ViTac 실험에서 촉각만 쓴 policy, 카메라만 쓴 policy, 둘을 함께 쓴 policy 를 비교한 결과가 보여 주는 것으로 알맞은 것은?
      choices:
        - '촉각만으로도 카메라를 쓴 것만큼 성공해서, 접촉이 많은 과제에서는 카메라가 필요 없다'
        - '카메라와 촉각을 함께 넣으면 입력이 많아 학습이 어려워져 성공률이 오히려 떨어진다'
        - '촉각은 달걀처럼 깨지는 물체에만 도움이 되고, 렌치를 꽂는 과제에는 효과가 없었다'
        - '촉각은 카메라를 보완해 함께 쓸 때 성공률이 오르고, 카메라가 가려질수록 효과가 크다'
      answer: 3
      explanation: |
        촉각 점만 쓴 policy 는 달걀 0.10, 육각 렌치 0.15 로 거의 실패했고, 카메라 point cloud 에 촉각 점을 더하면 0.55 → 0.85, 0.65 → 0.90 으로
        올랐다. 카메라를 한 대로 줄인 경우 육각 렌치가 0.30 → 0.70 으로 올라 가려질수록 효과가 컸다. 촉각만으로는 카메라를 대신하지 못한다.
        카메라와 촉각을 함께 넣어도 성공률은 떨어지지 않았다. 렌치 과제에서도 손 안의 위치를 고치는 단계에서 촉각이 도움이 됐다.
    - question: |
        Sparsh 처럼 label 없는 촉각 사진 수십만 장으로 encoder 를 미리 학습해 두는 이유로 알맞은 것은?
      choices:
        - '촉각 사진은 ImageNet 사진과 같은 종류라서, ImageNet encoder 를 그대로 쓰는 것과 같기 때문이다'
        - '미리 학습한 encoder 는 실물 로봇에서 어떤 과제든 끝까지 성공하도록 보장해 주기 때문이다'
        - '힘·미끄러짐 label 은 장비로 모아야 해서 적은데, 미리 학습하면 적은 label 로도 정확하기 때문이다'
        - 'label 없이 학습하면 센서가 1초에 찍는 사진 수가 늘어 미끄러짐을 더 빨리 보기 때문이다'
      answer: 2
      explanation: |
        힘이나 미끄러짐 label 은 F/T sensor 같은 장비로 잰 값이 있어야 해서 많이 모으기 어렵다. Sparsh 는 label 없는 촉각 사진으로 encoder 를
        미리 학습해, label 을 1/100 만 써도 DIGIT 힘 오차가 97.95 mN 으로 처음부터 학습한 187.51 mN 의 절반쯤이었다. 촉각 사진은 ImageNet 사진과
        달라서 따로 학습했다. 미리 학습한 encoder 를 쓴 policy 도 구슬 미로를 끝까지 가지 못했다. label 없이 학습해도 센서의 frame rate 는 바뀌지 않는다.
    - section: 촉각의-주기와-slow-fast-policy
      question: |
        action chunk 를 내는 Diffusion Policy 에 촉각을 관측으로 더하기만 했을 때 접촉 뒤의 방해에 잘 반응하지 못한 이유와, Reactive Diffusion Policy 의 대응으로 알맞은 것은?
      choices:
        - 'chunk 를 실행하는 동안 새 촉각을 보지 않아서, 빠른 층이 1초에 24 번 촉각으로 action 을 고친다'
        - '촉각 사진의 해상도가 낮아서, 더 높은 해상도의 촉각 센서로 바꿔 같은 policy 를 다시 학습한다'
        - 'chunk 가 너무 길어서, chunk 를 2 step 으로 줄여 1초에 더 여러 번 새 관측을 보게 한다'
        - 'diffusion 의 sampling 단계가 많아서, DDIM 으로 단계를 줄여 chunk 를 더 자주 계산한다'
      answer: 0
      explanation: |
        chunk 를 내는 policy 는 chunk 하나를 실행하는 동안 새 관측을 보지 않으므로, 관측에 촉각을 넣어도 chunk 중간의 촉각 변화에 반응하지
        못한다. RDP 는 느린 층이 latent chunk 를 내고 빠른 층이 1초에 24 번 촉각 값으로 action 을 고치게 나눴다. 해상도는 원인이 아니었다.
        chunk 를 action 8 개에서 2 개로 줄이자 쥐는 단계 성공률이 100% 에서 20% 로 떨어졌다. sampling 단계를 줄여도 chunk 실행 중에는 여전히
        촉각을 보지 않는다.

- topic: sensor-variation
  title: gel 마모와 센서마다 다른 신호
  section: gel-마모와-센서마다-다른-신호
  variants:
    - question: |
        ReSkin 한 센서로 학습한 접촉 위치 모델을 다른 ReSkin 센서에 쓰자 정확도가 크게 떨어졌다. 논문이 보인 대응으로 알맞은 것은?
      choices:
        - '여러 센서의 데이터로 학습하고, 새 센서는 label 없이 몇백 번 눌러 모델을 적응시킨다'
        - '새 센서의 값에 첫 센서와의 평균 차이 하나를 더해 주면 모델을 그대로 쓸 수 있다'
        - '센서마다 F/T sensor 로 수만 개의 label 을 처음부터 다시 모으는 것 말고는 방법이 없다'
        - '자기장 값 대신 온도 값만 입력으로 쓰면 센서 사이의 차이가 사라져 정확도가 돌아온다'
      answer: 0
      explanation: |
        한 센서로 학습한 모델은 다른 센서에서 위치를 ±1 mm 안으로 맞힌 비율이 25.24% 였다. 여러 센서의 데이터로 학습하자 84.43% 가 되었고,
        새 센서를 label 없이 390 번 누른 데이터로 적응시키자 87.00% 가 되었다. 센서마다 자기장 값이 다른 양상은 평균 차이 하나로 맞출 수
        없다. label 을 처음부터 다시 모으지 않고도 정확도를 회복했다. 온도만으로는 접촉 위치를 알 수 없다.
    - question: |
        촉각 센서를 오래 쓰면 생기는 drift 에 대한 설명으로 알맞은 것은?
      choices:
        - 'drift 는 전원에서 오는 무작위 noise 라서 여러 번 평균 내면 사라지고 모델과는 관계없다'
        - 'drift 는 vision-based 센서에서만 생기고, magnetic skin 은 오래 써도 신호가 그대로다'
        - 'drift 가 생기면 모델은 힘을 실제보다 작게 추정하므로 grip force 를 낮춰서 대응한다'
        - '고무가 닳거나 물러져 같은 힘에도 신호가 달라지므로, 영점을 자주 다시 재서 상쇄한다'
      answer: 3
      explanation: |
        ReSkin 을 50,000 번 누르자 처음 5,000 번으로 학습한 모델의 오차가 커졌고, 저자들은 고무가 물러졌기 때문으로 보았다. 아무것도 닿지 않은
        영점 값을 자주 다시 재면 drift 를 어느 정도 상쇄할 수 있었다. drift 는 한쪽으로 흘러가는 변화라 평균으로 사라지지 않는다. magnetic skin
        인 ReSkin 에서도 drift 가 관찰됐다. 이때 모델은 힘을 실제보다 작게 추정하지 않고 크게 추정했다.
    - question: |
        AnySkin 실험에서 skin 을 새것으로 바꾸자 ReSkin policy 는 카메라만 쓴 policy 수준으로 떨어졌지만 AnySkin policy 는 성공의 대부분을 지켰다. 그 차이를 만든 것은?
      choices:
        - 'AnySkin 은 skin 을 바꿀 때마다 policy 를 다시 학습했고, ReSkin 은 처음 policy 를 그대로 썼다'
        - 'AnySkin 은 자기장 대신 카메라로 접촉을 찍어서 skin 이 바뀌어도 사진이 그대로였다'
        - 'AnySkin 은 막의 제작과 정렬을 바꿔 센서 간 신호 차이를 줄였고, 막이 제자리에 끼워진다'
        - 'ReSkin 은 1초에 읽는 횟수가 적어서 새 skin 에서 빠르게 바뀌는 접촉을 놓쳤다'
      answer: 2
      explanation: |
        AnySkin 은 굳힌 막을 강한 자기장으로 자화하고 더 고운 자석 가루를 썼으며, 막이 회로에 제자리로 끼워지게 바꿨다. 이렇게 해서 수직
        자기장의 센서 간 표준편차(평균으로 나눈 값)를 0.87 에서 0.10 으로 줄였고, 바꾼 skin 에서도 신호가 비슷했다. 두 policy 모두 다시 학습하지
        않고 바꾼 skin 에서 시험했다. AnySkin 도 카메라가 아니라 자기장을 읽는 magnetic skin 이다. ReSkin 과 같은 magnetometer 회로를 쓰므로
        읽는 횟수도 원인이 아니다.
