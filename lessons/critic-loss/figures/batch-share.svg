<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>batch 네 sample 의 gradient 크기. squared error 에서는 오차 20 인 sample 이 전체 23.5 의 85% 를 차지하고, Huber loss(δ = 1)에서는 1 로 잘려 전체 3.5 의 29% 를 차지한다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">예로 든 batch 네 sample 의 gradient 크기 (TD 오차 0.5, −1, 2, 20)</text>
  <rect x="20.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="185.0" y="70.0" fill="#7cb4d8" font-size="13" text-anchor="middle" font-weight="600">squared error</text>
  <line x1="40.0" y1="246.0" x2="330.0" y2="246.0" stroke="#1e293b" stroke-width="1"/>
  <rect x="48.0" y="242.2" width="56.5" height="3.8" rx="3" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="0"/>
  <text x="76.2" y="236.2" fill="#e2e8f0" font-size="11.5" text-anchor="middle">0.5</text>
  <text x="76.2" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 0.5</text>
  <rect x="120.5" y="238.5" width="56.5" height="7.5" rx="3" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="0"/>
  <text x="148.8" y="232.5" fill="#e2e8f0" font-size="11.5" text-anchor="middle">1</text>
  <text x="148.8" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = −1</text>
  <rect x="193.0" y="231.0" width="56.5" height="15.0" rx="3" fill="#7cb4d8" stroke="#7cb4d8" stroke-width="0"/>
  <text x="221.2" y="225.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">2</text>
  <text x="221.2" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 2</text>
  <rect x="265.5" y="96.0" width="56.5" height="150.0" rx="3" fill="#d88b8b" stroke="#d88b8b" stroke-width="0"/>
  <text x="293.8" y="90.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">20</text>
  <text x="293.8" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 20</text>
  <text x="185.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">합 23.5 · 오차 20 의 몫 85%</text>
  <rect x="370.0" y="46.0" width="330.0" height="260.0" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1.2"/>
  <text x="535.0" y="70.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">Huber loss (δ_H = 1)</text>
  <line x1="390.0" y1="246.0" x2="680.0" y2="246.0" stroke="#1e293b" stroke-width="1"/>
  <rect x="398.0" y="242.2" width="56.5" height="3.8" rx="3" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="0"/>
  <text x="426.2" y="236.2" fill="#e2e8f0" font-size="11.5" text-anchor="middle">0.5</text>
  <text x="426.2" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 0.5</text>
  <rect x="470.5" y="238.5" width="56.5" height="7.5" rx="3" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="0"/>
  <text x="498.8" y="232.5" fill="#e2e8f0" font-size="11.5" text-anchor="middle">1</text>
  <text x="498.8" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = −1</text>
  <rect x="543.0" y="238.5" width="56.5" height="7.5" rx="3" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="0"/>
  <text x="571.2" y="232.5" fill="#e2e8f0" font-size="11.5" text-anchor="middle">1</text>
  <text x="571.2" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 2</text>
  <rect x="615.5" y="238.5" width="56.5" height="7.5" rx="3" fill="#d88b8b" stroke="#d88b8b" stroke-width="0"/>
  <text x="643.8" y="232.5" fill="#e2e8f0" font-size="11.5" text-anchor="middle">1</text>
  <text x="643.8" y="262.0" fill="#94a3b8" font-size="11" text-anchor="middle">δ = 20</text>
  <text x="535.0" y="290.0" fill="#e2e8f0" font-size="12" text-anchor="middle">합 3.5 · 오차 20 의 몫 29%</text>
</svg>
