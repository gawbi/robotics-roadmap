<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>gradient 가 1 이다가 한 step 만 100 이 됐을 때 Adam 의 update 크기. 그대로 두면 평소의 3.29 배, norm clipping 으로 10 까지 자르면 1.81 배다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한 step 만 튄 gradient 와 Adam 의 update 크기 (β₁ 0.9, β₂ 0.999, 그 전 m = v = 1)</text>
  <text x="200.0" y="70.0" fill="#94a3b8" font-size="12" text-anchor="middle">m</text>
  <text x="280.0" y="70.0" fill="#94a3b8" font-size="12" text-anchor="middle">v</text>
  <text x="470.0" y="70.0" fill="#94a3b8" font-size="12" text-anchor="middle">update 크기 m / √v</text>
  <text x="20.0" y="118.0" fill="#94a3b8" font-size="12.5" text-anchor="start" font-weight="600">평소 (gradient 1)</text>
  <text x="200.0" y="118.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">1</text>
  <text x="280.0" y="118.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">1</text>
  <rect x="340.0" y="100.0" width="100.0" height="28.0" rx="3" fill="#94a3b8" fill-opacity="0.85" stroke="#94a3b8" stroke-width="0"/>
  <text x="445.0" y="119.0" fill="#e2e8f0" font-size="12.5" text-anchor="start" font-weight="600">1.00</text>
  <text x="20.0" y="174.0" fill="#d88b8b" font-size="12.5" text-anchor="start" font-weight="600">gradient 100 그대로</text>
  <text x="200.0" y="174.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">10.9</text>
  <text x="280.0" y="174.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">11</text>
  <rect x="340.0" y="156.0" width="329.0" height="28.0" rx="3" fill="#d88b8b" fill-opacity="0.85" stroke="#d88b8b" stroke-width="0"/>
  <text x="674.0" y="175.0" fill="#e2e8f0" font-size="12.5" text-anchor="start" font-weight="600">3.29</text>
  <text x="20.0" y="230.0" fill="#7fc4a2" font-size="12.5" text-anchor="start" font-weight="600">10 까지 자른 뒤</text>
  <text x="200.0" y="230.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">1.9</text>
  <text x="280.0" y="230.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">1.1</text>
  <rect x="340.0" y="212.0" width="181.0" height="28.0" rx="3" fill="#7fc4a2" fill-opacity="0.85" stroke="#7fc4a2" stroke-width="0"/>
  <text x="526.0" y="231.0" fill="#e2e8f0" font-size="12.5" text-anchor="start" font-weight="600">1.81</text>
  <text x="20.0" y="280.0" fill="#94a3b8" font-size="11.5" text-anchor="start">Adam 은 모든 step 에 같은 배율이 곱해질 때만 그 배율을 지운다. 한 번 튄 값은 m 이 v 보다 빨리 반응해 그 step 을 키운다</text>
</svg>
