<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Ferrari-Canny 의 ε. 왼쪽은 손가락 힘을 1 로 제한했을 때 낼 수 있는 primitive wrench(파랑 점)의 convex hull 을 2 차원으로 줄여 그린 모식도로, 원점에서 가장 가까운 면까지의 거리가 ε 이다. 오른쪽은 폭 5 cm 상자를 쥐는 grasp 다섯 개의 ε 으로, 가운데를 마주 쥐면 μ = 1.0, 0.5, 0.2 에서 0.58, 0.33, 0.14 이고, 1 cm 씩 엇갈려 쥐면 μ = 0.5 에서 0.07, μ = 0.3 에서 0 이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="738" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <polygon points="60.0,145.0 120.0,70.0 240.0,80.0 290.0,165.0 230.0,270.0 90.0,255.0" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="60.0" cy="145.0" r="4" fill="#38bdf8"/>
  <circle cx="120.0" cy="70.0" r="4" fill="#38bdf8"/>
  <circle cx="240.0" cy="80.0" r="4" fill="#38bdf8"/>
  <circle cx="290.0" cy="165.0" r="4" fill="#38bdf8"/>
  <circle cx="230.0" cy="270.0" r="4" fill="#38bdf8"/>
  <circle cx="90.0" cy="255.0" r="4" fill="#38bdf8"/>
  <circle cx="170" cy="175" r="88.1" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.8"/>
  <circle cx="170" cy="175" r="3.5" fill="#e2e8f0"/>
  <text x="176.0" y="191.0" fill="#e2e8f0" font-size="11" text-anchor="start">원점</text>
  <line x1="170.0" y1="175.0" x2="160.6" y2="262.6" stroke="#f59e0b" stroke-width="2.0" marker-end="url(#aa)"/>
  <text x="151.3" y="214.8" fill="#f59e0b" font-size="15" text-anchor="end" font-weight="600">ε</text>
  <text x="170.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">wrench 공간의 모식도</text>
  <text x="170.0" y="300.0" fill="#38bdf8" font-size="11" text-anchor="middle">점: 손가락 힘 1 로 낼 수 있는 primitive wrench</text>
  <line x1="350.0" y1="50.0" x2="350.0" y2="300.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="545.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">폭 5 cm 상자를 쥐는 다섯 grasp 의 ε</text>
  <text x="530.0" y="86.0" fill="#e2e8f0" font-size="12" text-anchor="end">가운데, μ = 1.0</text>
  <rect x="540" y="72" width="134.6" height="20" rx="3" fill="#34d399" fill-opacity="0.8"/>
  <text x="680.6" y="86.0" fill="#34d399" font-size="12" text-anchor="start">0.58</text>
  <text x="530.0" y="126.0" fill="#e2e8f0" font-size="12" text-anchor="end">가운데, μ = 0.5</text>
  <rect x="540" y="112" width="77.7" height="20" rx="3" fill="#34d399" fill-opacity="0.8"/>
  <text x="623.7" y="126.0" fill="#34d399" font-size="12" text-anchor="start">0.33</text>
  <text x="530.0" y="166.0" fill="#e2e8f0" font-size="12" text-anchor="end">가운데, μ = 0.2</text>
  <rect x="540" y="152" width="32.7" height="20" rx="3" fill="#f59e0b" fill-opacity="0.8"/>
  <text x="578.7" y="166.0" fill="#f59e0b" font-size="12" text-anchor="start">0.14</text>
  <text x="530.0" y="206.0" fill="#e2e8f0" font-size="12" text-anchor="end">엇갈림 21.8°, μ = 0.5</text>
  <rect x="540" y="192" width="15.6" height="20" rx="3" fill="#f59e0b" fill-opacity="0.8"/>
  <text x="561.6" y="206.0" fill="#f59e0b" font-size="12" text-anchor="start">0.07</text>
  <text x="530.0" y="246.0" fill="#e2e8f0" font-size="12" text-anchor="end">엇갈림 21.8°, μ = 0.3</text>
  <text x="546.0" y="246.0" fill="#f87171" font-size="12" text-anchor="start">0 (force closure 아님)</text>
  <text x="545.0" y="300.0" fill="#64748b" font-size="11" text-anchor="middle">손가락 normal force 합 1, torque 는 2.5 cm 로 나눈 값</text>
</svg>
