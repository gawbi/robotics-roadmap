  <circle cx="620.0" cy="170.0" r="4" fill="#f59e0b"/>
  <circle cx="620.0" cy="150.0" r="4" fill="#f59e0b"/>
  <circle cx="620.0" cy="128.0" r="4" fill="#f59e0b"/>
  <circle cx="620.0" cy="100.0" r="4" fill="#f59e0b"/>
  <polyline points="654.0,196.0 670.0,180.0 678.0,160.0 674.0,140.0" fill="none" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="654.0" cy="196.0" r="4" fill="#f59e0b"/>
  <circle cx="670.0" cy="180.0" r="4" fill="#f59e0b"/>
  <circle cx="678.0" cy="160.0" r="4" fill="#f59e0b"/>
  <circle cx="674.0" cy="140.0" r="4" fill="#f59e0b"/>
  <text x="610.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="middle">손가락 넷에 관절이 넷씩, 16 관절</text>
  <text x="610.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="middle">물체를 감싸거나 손 안에서 돌린다</text>
  <text x="610.0" y="284.0" fill="#38bdf8" font-size="12" text-anchor="middle">자세의 수가 많아 계획이 어렵다</text>
</svg>
