  <line x1="370.0" y1="160.0" x2="370.0" y2="96.0" stroke="#a78bfa" stroke-width="2.0" marker-end="url(#av)"/>
  <text x="386.0" y="110.0" fill="#a78bfa" font-size="12" text-anchor="start">공기를 뺌</text>
  <line x1="344.0" y1="170" x2="396.0" y2="170" stroke="#34d399" stroke-width="3"/>
  <text x="404.0" y="176.0" fill="#34d399" font-size="12" text-anchor="start">seal</text>
  <text x="370.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="middle">한 면을 밀폐하고</text>
  <text x="370.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="middle">압력 차이로 당긴다</text>
  <text x="370.0" y="284.0" fill="#38bdf8" font-size="12" text-anchor="middle">지름 30 mm, 60 kPa → 42.4 N</text>
  <rect x="566.0" y="170" width="88" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <polyline points="580.0,170.0 580.0,150.0 580.0,128.0 580.0,100.0" fill="none" fill-opacity="1.0" stroke="#e2e8f0" stroke-width="7" stroke-linejoin="round"/>
