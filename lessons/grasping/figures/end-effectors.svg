<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 가지 end-effector. parallel-jaw gripper 는 접촉 두 곳을 양쪽에서 눌러 마찰로 버티고(Robotiq 2F-85 는 폭 85 mm, 20 ~ 235 N), suction gripper 는 한 면을 밀폐해 압력 차이로 당기며(지름 30 mm 컵에 60 kPa 이면 42.4 N), multi-finger hand 는 손가락 넷에 관절이 넷씩 달려 물체를 감싸 쥔다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="738" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="16.0" y="20.0" width="228.0" height="284.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="130.0" y="46.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">parallel-jaw gripper</text>
  <rect x="256.0" y="20.0" width="228.0" height="284.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="370.0" y="46.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">suction gripper</text>
  <rect x="496.0" y="20.0" width="228.0" height="284.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="610.0" y="46.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">multi-finger hand</text>
  <rect x="100.0" y="150" width="60" height="60" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="66.0" y="88.0" width="128.0" height="22" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="116.0" y="58.0" width="28" height="30" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="86.0" y="110.0" width="14" height="80" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
