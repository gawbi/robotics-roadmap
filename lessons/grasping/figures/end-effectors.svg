  <line x1="200.0" y1="175.0" x2="178.0" y2="175.0" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#aa)"/>
  <text x="130.0" y="240.0" fill="#94a3b8" font-size="12" text-anchor="middle">접촉 두 곳을 양쪽에서 누르고</text>
  <text x="130.0" y="258.0" fill="#94a3b8" font-size="12" text-anchor="middle">마찰로 무게를 버틴다</text>
  <text x="130.0" y="284.0" fill="#38bdf8" font-size="12" text-anchor="middle">2F-85: 폭 85 mm, 20 ~ 235 N</text>
  <rect x="320.0" y="170" width="100" height="44" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4"/>
