<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>grasp 표현. 왼쪽은 parallel-jaw gripper 의 grasp 로, 두 손가락 끝 사이의 중심 t, 손이 다가가는 방향 a, 손가락이 닫히는 방향 b, 손가락 사이 폭 w 로 정한다. 위치 3 개, 방향 3 개, 폭 1 개로 숫자 7 개다. 오른쪽 아래는 위에서 찍은 depth image 위의 pixel (u, v), 각도 φ, gripper depth z 숫자 4 개로 정하는 Dex-Net 2.0 의 planar grasp 다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="190.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">6-DoF grasp 와 폭</text>
  <rect x="148" y="180" width="84" height="90" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="190.0" y="260.0" fill="#94a3b8" font-size="12" text-anchor="middle">물체</text>
  <rect x="96.0" y="88.0" width="188.0" height="22" rx="5" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="176.0" y="58.0" width="28" height="30" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="116.0" y="110.0" width="14" height="110" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <rect x="250.0" y="110.0" width="14" height="110" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.6"/>
  <circle cx="190" cy="202" r="5" fill="#d6aa62"/>
  <text x="198.0" y="194.0" fill="#d6aa62" font-size="14" text-anchor="start" font-weight="600">t</text>
  <line x1="190.0" y1="106.0" x2="190.0" y2="170.0" stroke="#7cb4d8" stroke-width="2.4" marker-end="url(#as)"/>
  <text x="200.0" y="140.0" fill="#7cb4d8" font-size="12" text-anchor="start">a (approach)</text>
  <line x1="190.0" y1="202.0" x2="242.0" y2="202.0" stroke="#a99ad6" stroke-width="2.4" marker-end="url(#av)"/>
  <text x="194.0" y="226.0" fill="#a99ad6" font-size="12" text-anchor="start">b (closing)</text>
  <line x1="130.0" y1="280.0" x2="250.0" y2="280.0" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="250.0" y1="280.0" x2="130.0" y2="280.0" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#ag)"/>
  <line x1="130" y1="222" x2="130" y2="286" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="250" y1="222" x2="250" y2="286" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="190.0" y="300.0" fill="#7fc4a2" font-size="12" text-anchor="middle">w (손가락 사이 폭)</text>
  <line x1="350.0" y1="60.0" x2="350.0" y2="310.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="540.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">숫자 개수</text>
  <text x="390.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="start">위치 t = (x, y, z)</text>
  <text x="680.0" y="72.0" fill="#d6aa62" font-size="13" text-anchor="end">3</text>
  <text x="390.0" y="100.0" fill="#7cb4d8" font-size="13" text-anchor="start">방향 R (a 와 b 로 정함)</text>
  <text x="680.0" y="100.0" fill="#7cb4d8" font-size="13" text-anchor="end">3</text>
  <text x="390.0" y="128.0" fill="#7fc4a2" font-size="13" text-anchor="start">폭 w</text>
  <text x="680.0" y="128.0" fill="#7fc4a2" font-size="13" text-anchor="end">1</text>
  <line x1="390" y1="142" x2="680" y2="142" stroke="#334155"/>
  <text x="390.0" y="162.0" fill="#e2e8f0" font-size="13" text-anchor="start">6-DoF grasp + 폭 (7-DoF 라고도 부름)</text>
  <text x="680.0" y="162.0" fill="#e2e8f0" font-size="13" text-anchor="end" font-weight="600">7</text>
  <text x="390.0" y="215.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">planar grasp (Dex-Net 2.0)</text>
  <rect x="390" y="229" width="120" height="80" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450.0" y="325.0" fill="#64748b" font-size="11" text-anchor="middle">위에서 찍은 depth image</text>
  <line x1="426.0" y1="286.0" x2="478.0" y2="256.0" stroke="#d6aa62" stroke-width="2.4"/>
  <circle cx="426.0" cy="286.0" r="3.5" fill="#d6aa62"/>
  <circle cx="478.0" cy="256.0" r="3.5" fill="#d6aa62"/>
  <circle cx="452" cy="271" r="3" fill="#e2e8f0"/>
  <text x="530.0" y="249.0" fill="#e2e8f0" font-size="12" text-anchor="start">pixel (u, v)</text>
  <text x="530.0" y="271.0" fill="#e2e8f0" font-size="12" text-anchor="start">각도 φ</text>
  <text x="530.0" y="293.0" fill="#e2e8f0" font-size="12" text-anchor="start">gripper depth z</text>
  <text x="680.0" y="271.0" fill="#e2e8f0" font-size="13" text-anchor="end" font-weight="600">4</text>
</svg>
