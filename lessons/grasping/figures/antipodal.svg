<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>antipodal grasp. 두 접촉점을 잇는 선이 양쪽 friction cone 안에 들어야 두 손가락의 힘이 서로를 받친다. 폭 5 cm 상자의 가운데를 마주 쥐면 0° 라 집히고, 1 cm 씩 엇갈리면 21.8° 라 μ = 0.5 에서는 집히지만 μ = 0.3 에서는 미끄러진다. 반지름 3 cm 원기둥을 가운데서 1.5 cm 벗어나 쥐면 30° 라 μ = 0.5 에서도 밀려 나간다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="20.0" width="220.0" height="300.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="130.0" y="46.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">가운데를 마주 쥔 상자</text>
  <rect x="270.0" y="20.0" width="220.0" height="300.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="380.0" y="46.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">1 cm 씩 엇갈려 쥔 상자</text>
  <rect x="520.0" y="20.0" width="220.0" height="300.0" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="630.0" y="46.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">가운데서 1.5 cm 벗어난 원기둥</text>
  <rect x="80.0" y="110" width="100.0" height="100" fill="#1e293b" stroke="#94a3b8"/>
  <polygon points="80.0,160.0 142.6,191.3 142.6,128.7" fill="#7fc4a2" fill-opacity="0.16" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="180.0,160.0 117.4,128.7 117.4,191.3" fill="#7fc4a2" fill-opacity="0.16" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="80.0" y1="160.0" x2="180.0" y2="160.0" stroke="#d6aa62" stroke-width="2.4"/>
  <circle cx="80" cy="160" r="4.5" fill="#d6aa62"/>
  <circle cx="180" cy="160" r="4.5" fill="#d6aa62"/>
  <text x="130.0" y="250.0" fill="#d6aa62" font-size="12" text-anchor="middle">두 접촉을 잇는 선과 normal: 0°</text>
  <text x="130.0" y="270.0" fill="#7fc4a2" font-size="12" text-anchor="middle">μ = 0.5 의 반각 26.6° 안</text>
  <text x="130.0" y="296.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">집힌다</text>
  <rect x="330" y="100" width="100" height="120" fill="#1e293b" stroke="#94a3b8"/>
  <polygon points="330.0,180.0 392.6,211.3 392.6,148.7" fill="#7fc4a2" fill-opacity="0.14" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="430.0,140.0 367.4,108.7 367.4,171.3" fill="#7fc4a2" fill-opacity="0.14" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="330.0,180.0 397.0,200.1 397.0,159.9" fill="#d88b8b" fill-opacity="0.0" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <polygon points="430.0,140.0 363.0,119.9 363.0,160.1" fill="#d88b8b" fill-opacity="0.0" stroke="#d88b8b" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <line x1="330.0" y1="180.0" x2="430.0" y2="140.0" stroke="#d6aa62" stroke-width="2.4"/>
  <circle cx="330" cy="180" r="4.5" fill="#d6aa62"/>
  <circle cx="430" cy="140" r="4.5" fill="#d6aa62"/>
  <text x="380.0" y="250.0" fill="#d6aa62" font-size="12" text-anchor="middle">기울기 arctan(2 ÷ 5) = 21.8°</text>
  <text x="380.0" y="270.0" fill="#7fc4a2" font-size="12" text-anchor="middle">μ = 0.5 (26.6°) 면 집힌다</text>
  <text x="380.0" y="290.0" fill="#d88b8b" font-size="12" text-anchor="middle">μ = 0.3 (16.7°) 면 미끄러진다</text>
  <circle cx="630" cy="160" r="60" fill="#1e293b" stroke="#94a3b8"/>
  <circle cx="630" cy="160" r="2.5" fill="#94a3b8"/>
  <polygon points="578.0,130.0 614.4,185.1 643.9,134.0" fill="#7fc4a2" fill-opacity="0.16" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon points="682.0,130.0 616.1,134.0 645.6,185.1" fill="#7fc4a2" fill-opacity="0.16" stroke="#7fc4a2" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="578.0" y1="130.0" x2="682.0" y2="130.0" stroke="#d6aa62" stroke-width="2.4"/>
  <line x1="578.0" y1="130.0" x2="630.0" y2="160.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="682.0" y1="130.0" x2="630.0" y2="160.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="578.0" cy="130.0" r="4.5" fill="#d6aa62"/>
  <circle cx="682.0" cy="130.0" r="4.5" fill="#d6aa62"/>
  <line x1="630.0" y1="168.0" x2="630.0" y2="204.0" stroke="#d88b8b" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="630.0" y="250.0" fill="#d6aa62" font-size="12" text-anchor="middle">선과 normal: arcsin(1.5 ÷ 3) = 30°</text>
  <text x="630.0" y="270.0" fill="#d88b8b" font-size="12" text-anchor="middle">μ = 0.5 의 반각 26.6° 밖</text>
  <text x="630.0" y="290.0" fill="#d88b8b" font-size="13" text-anchor="middle" font-weight="600">닫으면 아래로 밀려 나간다</text>
</svg>
