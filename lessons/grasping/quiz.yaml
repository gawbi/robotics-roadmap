# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: grasp-representation
  title: grasp 표현
  section: grasp-표현
  variants:
    - question: |
        parallel-jaw gripper 의 grasp 하나를 숫자로 적으려면 무엇을 정해야 하는가?
      choices:
        - '손가락 사이 중심의 위치 3 개, gripper 방향 3 개, 폭 1 개로 모두 7 개다'
        - '물체 중심의 위치 3 개만 정하면 되고, 방향과 폭은 gripper 가 닫히면서 알아서 맞춘다'
        - '각 관절의 각도만 정하면 손의 위치와 방향이 따라 나오므로, 관절 각도가 곧 grasp 다'
        - '두 손가락 끝의 위치 6 개만 정하면 되고, 손이 다가가는 방향도 그 두 점에서 정해진다'
      answer: 0
      explanation: |
        grasp 는 두 손가락 끝 사이의 중심 t(3 개), 다가가는 방향 a 와 닫히는 방향 b 로 정해지는 rotation(3 개), 손가락 사이 폭 w(1 개)로 숫자
        7 개다. 위치와 방향을 합쳐 6-DoF grasp 라고 부르고 폭까지 세어 7-DoF 라고도 한다. 물체 중심만으로는 어느 방향에서 쥘지 정해지지 않고,
        관절 각도는 grasp 를 고른 뒤 IK 로 구하는 값이다. 손가락 끝 두 점은 위치만 정할 뿐 손이 다가가는 방향을 정하지 못한다.
    - question: |
        Dex-Net 2.0 처럼 grasp 를 depth image 위의 pixel, 각도, depth 숫자 4 개로 적는 planar grasp 의 한계는 무엇인가?
      choices:
        - '숫자가 4 개뿐이라 network 가 배울 정보가 모자라서, 학습이 더 어렵고 오래 걸린다'
        - 'pixel 만으로는 물체의 위치를 정할 수 없어서, grasp 마다 사람이 위치를 알려 줘야 한다'
        - '다가가는 방향이 수직 아래로 고정되어, 옆에서 쥐어야 하는 물체를 표현하지 못한다'
        - 'depth image 에는 색이 없어서 비슷한 모양의 물체를 구분하지 못해 grasp 를 만들 수 없다'
      answer: 2
      explanation: |
        planar grasp 는 pixel 과 depth 로 위치 3 개를 정하고, 각도로 수직축을 도는 rotation 1 개를 정하며, 다가가는 방향은 수직 아래로
        고정한다. 그래서 숫자가 적어 학습은 쉬워지지만 옆이나 비스듬히 쥐어야 하는 물체는 표현하지 못한다. 숫자가 적으면 학습은 오히려
        쉬워지고, 위치는 pixel 과 depth 로 정해진다. 색 구분은 grasp 표현과 관계없다.
    - question: |
        grasp network 의 출력이 approach vector a 와 closing vector b 라고 할 때, 이 둘로 무엇이 정해지는가?
      choices:
        - 'gripper 가 물체를 누르는 힘의 크기로, 두 vector 의 길이가 그 힘을 나타낸다'
        - '물체의 무게중심 위치와, 그 점에서 gripper 까지의 거리'
        - '손가락 사이의 폭과 그 grasp 의 성공 확률'
        - 'a 와 b 에 모두 직각인 셋째 축까지 정해져 gripper 의 rotation 전체'
      answer: 3
      explanation: |
        a 는 손이 다가가는 방향이고 b 는 두 손가락이 닫히는 방향인데, 둘은 서로 직각이다. 둘을 정하면 둘에 직각인 셋째 축도 따라 나오므로
        gripper 의 rotation 이 하나로 정해진다. 힘의 크기와 무게중심은 방향 vector 로 정해지지 않고, 폭과 성공 확률은 network 가 따로 내는 값이다.

- topic: friction-cone
  title: friction cone
  section: friction-cone
  variants:
    - question: |
        마찰 계수 μ 인 접촉에서 friction cone 은 무엇을 뜻하는가?
      choices:
        - '손가락이 낼 수 있는 힘의 최대 크기를 μ 배로 제한하는 구로, 힘이 그 안에 있어야 한다'
        - '미끄러지지 않는 힘의 방향이 normal 에서 반각 arctan μ 안에 드는 원뿔'
        - '접촉점 주변에서 마찰이 생기는 넓이를 나타내는 원으로, μ 가 클수록 넓어진다'
        - '물체가 미끄러지기 시작할 때 움직이는 방향의 범위를 접촉점에 그린 원뿔'
      answer: 1
      explanation: |
        미끄러지지 않는 조건 T ≤ μN 을 힘이 normal 에서 기운 각도 θ 로 바꾸면 tan θ ≤ μ, θ ≤ arctan μ 가 된다. 그래서 허용되는 힘의 방향이
        normal 을 축으로 반각 arctan μ 인 원뿔을 이룬다. 원뿔은 크기가 아니라 방향을 제한하고, 접촉 넓이나 미끄러지는 방향과는 다른 개념이다.
    - question: |
        μ = 0.5 인 접촉에서 손가락 힘이 표면의 normal 에서 35° 기울어 있다. 어떻게 될까? (tan 35° ≈ 0.70)
      choices:
        - '35° 는 45° 보다 작으므로 버틴다. 마찰로 버티는 한계 각도는 늘 45° 다'
        - '힘을 두 배로 키우면 마찰도 두 배가 되어, 기운 각도와 관계없이 버틴다'
        - 'normal 성분이 0 보다 크기만 하면 손가락이 표면을 누르고 있으므로 버틴다'
        - 'tan 35° ≈ 0.70 이 μ = 0.5 보다 커서 원뿔 밖이라 미끄러진다'
      answer: 3
      explanation: |
        friction cone 의 반각은 arctan 0.5 = 26.6° 이고, 35° 기운 힘은 tan 35° ≈ 0.70 > 0.5 라서 원뿔 밖이다. 45° 는 μ = 1 일 때의 반각이다. 힘을
        키워도 방향이 그대로면 normal 성분과 접선 성분이 같은 비율로 커져 각도가 바뀌지 않으므로 여전히 미끄러진다.
    - question: |
        μ 가 0.5 에서 0.2 로 줄면 friction cone 은 어떻게 바뀌는가?
      choices:
        - '반각이 26.6° 에서 11.3° 로 좁아져, 힘이 normal 에 더 가까워야 버틴다'
        - '반각이 넓어져서, 같은 힘이라도 더 비스듬히 눌러도 미끄러지지 않는다'
        - '원뿔 모양은 그대로이고, 손가락이 낼 수 있는 힘의 크기만 줄어든다'
        - '원뿔이 normal 반대쪽으로 뒤집혀서, 손가락이 당기는 힘으로 버텨야 한다'
      answer: 0
      explanation: |
        반각은 arctan μ 라서 μ = 0.5 면 26.6°, μ = 0.2 면 11.3° 다. 원뿔이 좁아지므로 손가락 힘 방향이 normal 에서 조금만 기울어도 미끄러진다.
        μ 가 줄면 원뿔은 넓어지지 않고 좁아지며, 원뿔이 정하는 것은 힘의 크기가 아니라 방향이다.

- topic: antipodal
  title: antipodal grasp
  section: antipodal-grasp
  variants:
    - question: |
        antipodal grasp 의 조건은 무엇인가?
      choices:
        - '두 손가락을 잇는 선이 물체의 무게중심을 정확히 지나야 torque 없이 버틴다'
        - '두 손가락이 물체의 가장 넓은 폭을 쥐어야 접촉이 넓어져 버틴다'
        - '두 접촉점을 잇는 선이 양쪽 접촉점의 friction cone 안에 들어야 한다'
        - '두 손가락이 같은 크기의 힘으로 누르기만 하면, 접촉 위치와 관계없이 성립한다'
      answer: 2
      explanation: |
        두 손가락의 힘만으로 물체가 가만히 있으려면 두 힘이 크기가 같고 반대 방향이며 두 접촉점을 잇는 선 위에 있어야 한다. 그래서 그 선의
        방향이 양쪽 friction cone 안에 들어야 하고, 이를 antipodal grasp 라고 한다. 무게중심을 지나는 것은 torque 를 줄이는 데 좋지만 antipodal 의
        조건은 아니며, 폭이 가장 넓은 곳이나 힘의 크기만으로는 미끄러짐 여부가 정해지지 않는다.
    - question: |
        반지름 3 cm 원기둥을 중심에서 1.5 cm 벗어난 선을 따라 μ = 0.5 인 손가락으로 쥔다. 무슨 일이 생길까? (arcsin 0.5 = 30°, arctan 0.5 ≈ 26.6°)
      choices:
        - '선과 normal 의 각도가 30° 로 반각 26.6° 를 넘어, 닫으면 물체가 밀려 나간다'
        - '원기둥은 어디를 쥐어도 normal 이 선과 나란해서, 중심에서 벗어나도 집힌다'
        - '각도는 30° 지만 손가락을 더 세게 누르면 마찰이 커져서 결국 집힌다'
        - '중심에서 벗어날수록 손가락이 표면에 닿는 넓이가 커져서 더 잘 집힌다'
      answer: 0
      explanation: |
        둥근 물체의 normal 은 중심을 향하므로, 중심에서 1.5 cm 벗어난 선과 normal 의 각도는 arcsin(1.5 ÷ 3) = 30° 다. 이 각도가 friction cone 의
        반각 26.6° 를 넘어 손가락이 닫히면 물체가 선에서 먼 쪽으로 밀려 나간다. 원기둥은 중심을 지나는 선에서만 normal 과 나란하고, 세게 눌러도
        각도는 그대로라 결과가 같다.
    - question: |
        GraspNet-1Billion 은 grasp 마다 μ 를 1.0 에서 0.1 까지 낮추며 antipodal 이 깨지는 값을 찾아 점수를 매겼다. 낮은 μ 에서도 버티는 grasp 에 높은 점수를 주는 이유는 무엇인가?
      choices:
        - '낮은 μ 에서 버티는 grasp 일수록 gripper 를 더 약하게 닫아도 되어 물체가 덜 상하기 때문이다'
        - '선이 normal 과 거의 나란하다는 뜻이라, μ 나 위치가 예상과 달라도 버티기 때문이다'
        - '낮은 μ 에서 버티는 grasp 는 가벼운 물체를 쥔 경우뿐이라, 들어 올리기 쉽기 때문이다'
        - 'μ 를 낮출수록 friction cone 계산이 단순해져, 점수를 매기는 시간이 짧아지기 때문이다'
      answer: 1
      explanation: |
        friction cone 의 반각은 arctan μ 라서 μ 가 낮을수록 원뿔이 좁다. 좁은 원뿔 안에도 선이 들어간다는 것은 선과 normal 의 각도가 작다는
        뜻이고, 그런 grasp 는 실제 μ 가 예상보다 낮거나 위치가 조금 틀려도 미끄러지지 않는다. 실제 로봇 검증에서도 점수 1 인 grasp 는 평균
        96% 성공했다. grip force, 물체 무게, 계산 시간과는 관계없다.

- topic: force-closure
  title: force closure
  section: force-closure
  variants:
    - question: |
        force closure grasp 의 정의는 무엇인가?
      choices:
        - '손가락이 물체를 완전히 감싸서 마찰 없이 모양만으로도 물체가 움직일 수 없는 grasp'
        - '두 손가락이 같은 크기의 힘으로 서로 반대쪽에서 눌러, 두 힘이 상쇄되는 grasp'
        - '접촉력이 물체의 무게보다 커서, 들어 올려도 아래로 미끄러지지 않는 grasp'
        - '손가락 위치는 그대로 두고 접촉력만 조절해 어떤 외부 wrench 든 버티는 grasp'
      answer: 3
      explanation: |
        force closure 는 어떤 외부 wrench(force 3 개와 torque 3 개)가 오더라도 손가락 위치를 그대로 두고 접촉력만 조절해 버틸 수 있는 grasp 다.
        마찰 없이 모양만으로 가두는 것은 form closure 로 다른 개념이다. 같은 힘으로 누르는 것이나 gravity 한 방향만 버티는 것은 force closure 의
        일부 조건일 뿐이다.
    - question: |
        3차원 물체를 point contact 두 개로 antipodal 하게 쥐었다. 이 grasp 를 force closure 라고 할 수 있는가?
      choices:
        - '그렇다. antipodal 이면 두 힘이 서로 받쳐 주므로 3차원에서도 항상 force closure 다'
        - '아니다. 두 힘이 모두 접촉점을 잇는 축을 지나서, 그 축을 도는 torque 를 버티지 못한다'
        - '그렇다. 손가락을 충분히 세게 누르면 마찰이 커져서 어떤 방향의 torque 든 버틴다'
        - '아니다. 3차원에서는 friction cone 이 원뿔이 아니라서 antipodal 을 정의할 수 없다'
      answer: 1
      explanation: |
        point contact 의 힘은 접촉점을 지나므로 두 힘 모두 두 접촉점을 잇는 축을 지나고, 그 축을 도는 torque 를 만들지 못한다. 그래서 이 축을
        도는 외부 torque 를 버티지 못해 force closure 가 아니다. 실제 gripper 는 고무 패드의 torsional friction(soft finger contact)이나 셋 이상의
        손가락으로 보완한다. 세게 눌러도 축을 도는 torque 는 생기지 않고, friction cone 은 3차원에서도 정의된다.
    - question: |
        wrench 공간에서 force closure 를 판단하는 방법은 무엇인가?
      choices:
        - '모든 primitive wrench 의 크기가 같은지 확인해, 어느 방향으로도 고르게 버티는지 본다'
        - 'primitive wrench 가 모두 같은 방향을 가리켜, 힘이 한쪽으로 모이는지 확인한다'
        - 'primitive wrench 들의 convex hull 이 원점을 안쪽에 품는지 확인한다'
        - '접촉점이 셋 이상인지만 확인한다. 셋이면 어떤 방향의 torque 도 막을 수 있다'
      answer: 2
      explanation: |
        손가락이 낼 수 있는 wrench 는 primitive wrench 를 양수 비율로 섞은 것이다. 이들의 convex hull 이 원점을 안쪽에 품으면 모든 방향의
        wrench 를 낼 수 있어 force closure 다. 모두 같은 방향을 가리키면 오히려 반대 방향을 못 내고, 크기가 같은지나 접촉 개수만으로는 판단할 수 없다.

- topic: grip-force
  title: grip force
  section: grip-force
  variants:
    - question: |
        parallel-jaw gripper 로 물체를 들 때 grip force 는 어떻게 정하는가?
      choices:
        - '두 손가락의 마찰 2μF 가 m(g + a) 에 안전율 S 를 곱한 값 이상이 되게 정한다'
        - '물체 무게 mg 와 같은 크기로 누르면, 누르는 힘이 무게를 받쳐 들 수 있다'
        - 'gripper 가 낼 수 있는 최대 힘으로 늘 눌러야 어떤 가속에도 떨어뜨리지 않는다'
        - 'μ 가 클수록 더 세게 눌러야 하므로, F = μmg 로 정하고 가속은 무시한다'
      answer: 0
      explanation: |
        미끄러지지 않으려면 두 손가락의 마찰 한계 2μF 가 물체를 아래로 끄는 m(g + a) 보다 커야 하고, μ 의 불확실성과 비상 정지 같은 큰 감속에
        대비해 안전율을 곱한다. 무게와 같은 힘으로 누르는 것은 마찰 계수를 빼먹은 것이고, 최대 힘은 물렁한 물체를 망가뜨릴 수 있다. μ 가 크면
        필요한 힘은 오히려 줄어든다.
    - question: |
        0.5 kg 물체를 5 m/s² 로 들어 올린다. μ = 0.5, 안전율 2 이면 손가락 하나가 눌러야 하는 최소 힘은? (g = 9.81 m/s²)
      choices:
        - '약 4.9 N'
        - '약 7.4 N'
        - '약 29.6 N'
        - '약 14.8 N'
      answer: 3
      explanation: |
        F = m(g + a) × S ÷ (2μ) = 0.5 × 14.81 × 2 ÷ 1 ≈ 14.8 N 이다. 4.9 N 은 가속과 안전율을 모두 뺀 값이고, 7.4 N 은 안전율을 뺀 값(또는
        μ = 1 인 경우)이며, 29.6 N 은 손가락이 둘이라는 2 를 빼먹고 계산한 값이다.
    - question: |
        물체를 무게중심에서 멀리 떨어진 곳에서 쥐었더니, 미끄러져 떨어지지는 않는데 손가락 사이에서 돌아간다. 그 이유는 무엇인가?
      choices:
        - 'grip force 가 무게보다 작아서, 물체가 손가락 사이에서 아래로 미끄러졌기 때문이다'
        - 'gravity 가 grasp 축을 도는 torque 를 만드는데, 이를 버티는 패드 마찰의 한계가 작아서다'
        - 'antipodal 조건이 깨져서, 손가락 힘이 friction cone 밖으로 나가 물체가 밀렸기 때문이다'
        - '무게중심에서 멀어질수록 접촉면의 μ 가 작아져서, 같은 힘으로도 덜 버티기 때문이다'
      answer: 1
      explanation: |
        무게중심이 grasp 축에서 d 만큼 떨어지면 gravity 가 m g d 의 torque 를 만든다. point contact 는 이 축을 도는 torque 를 막지 못하고, 패드
        접촉면 안의 torsional friction 만 버틴다. 둥근 패드 전체에 압력이 고르게 퍼진다고 가정하면 그 한계는 패드 하나에 (2/3)μFR 로 작아서
        물체가 돈다. 아래로 떨어지지
        않았으니 마찰 2μF 는 충분하고, antipodal 이나 μ 의 변화와는 관계없다. 그래서 무게중심 가까이를 쥔다.

- topic: epsilon-quality
  title: Ferrari-Canny ε
  section: grasp-quality-metric
  variants:
    - question: |
        Ferrari-Canny metric 의 ε 은 무엇을 재는가?
      choices:
        - 'grasp 를 실행했을 때 물체가 손가락 사이에서 미끄러지지 않고 들리는 높이'
        - '두 접촉점 사이의 거리로, 넓게 쥘수록 torque 를 잘 버텨 값이 커진다'
        - '손가락 힘 1 당 가장 약한 방향에서 버틸 수 있는 외부 wrench 의 크기'
        - '물체의 무게를 grip force 로 나눈 값으로, 작을수록 여유 있게 쥔 grasp 다'
      answer: 2
      explanation: |
        ε 은 primitive wrench 의 convex hull 에서 원점에 가장 가까운 면까지의 거리다. 손가락 힘 1 당 가장 약한 방향에서 버틸 수 있는 외부 wrench
        의 크기라서 클수록 좋은 grasp 다. 접촉점 거리나 무게 대비 힘은 ε 의 정의가 아니고, 들리는 높이와는 관계없다.
    - question: |
        어떤 grasp 의 ε 이 0 으로 계산되었다. 이것은 무엇을 뜻하는가?
      choices:
        - '오차가 0 인 grasp 라서, 어떤 외부 wrench 가 와도 흔들리지 않는 가장 좋은 grasp 다'
        - '원점이 wrench convex hull 의 안쪽에 있지 않아 force closure 가 아니다'
        - '손가락 힘이 0 이어도 버틴다는 뜻이라, 힘을 주지 않고도 물체를 들 수 있다'
        - '두 접촉점의 마찰 계수가 0 이라서, 미끄러운 표면을 쥐었다는 뜻이다'
      answer: 1
      explanation: |
        ε 은 원점에서 convex hull 의 가장 가까운 면까지의 거리라서, 0 이면 원점이 hull 의 안쪽에 있지 않다. 어떤 방향의 외부 wrench 는 낼 수 없으므로
        force closure 가 아니다. ε 은 클수록 좋은 값이고, μ 가 0 이 아니어도 접촉 배치가 나쁘면 0 이 된다.
    - question: |
        Dex-Net 이 ε 대신 robust epsilon quality 를 label 로 쓴 이유는 무엇인가?
      choices:
        - 'ε 은 계산할 수 없는 값이라, 사람이 grasp 마다 매긴 점수로 대신해야 했기 때문이다'
        - 'robust 버전은 gripper 가 낼 수 있는 최대 힘까지 함께 재서 더 정확하기 때문이다'
        - 'ε 은 suction gripper 에만 쓸 수 있어서, parallel-jaw 에는 다른 값이 필요했기 때문이다'
        - 'pose 와 μ 의 오차를 무작위로 넣어 구한 ε 의 기댓값이 실제 성공에 더 가깝기 때문이다'
      answer: 3
      explanation: |
        ε 은 물체 모양, 접촉점, μ 를 정확히 안다고 가정한다. 실제 카메라와 로봇에는 몇 mm 의 오차가 있고 μ 도 모르므로, Dex-Net 은 이 값들을
        흔들며 ε 의 기댓값을 구해 오차에도 버티는 grasp 를 골랐다. ε 은 계산할 수 있고 parallel-jaw 에도 쓰며, robust 버전이 최대 힘을 재는 것은 아니다.

- topic: data-driven
  title: 학습 기반 grasp 계획
  section: analytic-과-data-driven
  variants:
    - question: |
        Dex-Net 2.0 의 GQ-CNN 은 무엇을 입력받아 무엇을 내는가?
      choices:
        - 'RGB 사진 한 장을 받아 IK 를 거치지 않고 팔의 관절 각도를 바로 낸다'
        - '후보 grasp 에 맞춰 자르고 돌린 depth image 조각을 받아 그 grasp 의 성공 확률을 낸다'
        - '물체 이름을 받아, database 에서 그 물체에 미리 계산해 둔 grasp 를 꺼낸다'
        - 'point cloud 를 받아 물체의 3D mesh 를 복원하고, 그 mesh 위에서 grasp 를 계산한다'
      answer: 1
      explanation: |
        GQ-CNN 은 후보마다 depth image 를 grasp 중심에 맞춰 자르고 grasp 축 방향으로 돌린 조각과 gripper depth 를 받아 성공 확률을 낸다. 후보에
        모두 점수를 매긴 뒤 도달·충돌 조건을 통과한 최고 점수 후보를 실행한다. 관절 각도는 IK 로 구하고, database 에서 grasp 를 꺼내는 것은
        registration 기반 방법이며, GQ-CNN 은 mesh 를 복원하지 않는다.
    - question: |
        Dex-Net 2.0 은 학습 데이터 670 만 개를 어떻게 만들었는가?
      choices:
        - 'mesh 1,500 개로 장면을 만들고, 오차를 넣은 analytic 품질을 계산해 label 로 붙였다'
        - '로봇 여러 대를 몇 달 동안 움직여 실제로 집어 보고, 성공 여부를 하나씩 기록했다'
        - '사람이 depth image 마다 좋은 grasp 위치를 직접 그려 넣어 label 을 만들었다'
        - '인터넷에서 물체 사진을 모아, 물체 종류별로 미리 정한 grasp 를 붙였다'
      answer: 0
      explanation: |
        Dex-Net 2.0 은 mesh 1,500 개를 책상 위에 무작위로 놓고 antipodal grasp 마다 robust epsilon quality 를 계산해 0.002 를 넘으면 성공으로
        표시했다. 장면의 depth image 를 렌더링하고 noise 를 넣어 grasp 와 짝지었다. 실제 로봇으로 몇 달 모으는 방식이나 사람의 label 은 비용이 커서
        피한 방법이고, 인터넷 사진에는 depth 와 grasp label 이 없다.
    - question: |
        Contact-GraspNet 은 6-DoF grasp 를 어떻게 표현해서 학습을 쉽게 했는가?
      choices:
        - 'grasp 를 위에서 내려가는 planar grasp 로 바꿔, 숫자 4 개만 내도록 줄였다'
        - '물체마다 class 를 먼저 인식하고, class 별로 미리 저장한 grasp 를 꺼내 썼다'
        - '점 하나를 접촉점으로 삼아, 점마다 점수·approach·baseline 방향·폭만 낸다'
        - 'grasp 의 rotation 행렬 숫자 9 개와 위치 3 개를 그대로 regression 했다'
      answer: 2
      explanation: |
        Contact-GraspNet 은 point cloud 의 점을 손가락이 닿을 접촉점 c 로 삼고, 점마다 점수와 방향 a·b, 폭 w 를 낸다. gripper 위치는 t = c +
        (w ÷ 2) b + d a 로 계산하므로 점 위에서 4 자유도만 맞히면 된다. planar grasp 로 줄이지 않고 6-DoF 를 유지했고 class 를 인식하지도
        않으며, rotation 행렬을 그대로 regression 하는 방식도 아니다.

- topic: pipeline-failures
  title: 실행 pipeline 과 실패 원인
  section: 실행까지의-pipeline
  variants:
    - question: |
        grasp network 가 낸 최고 점수 grasp 를 바로 실행하지 않고 거치는 단계는 무엇인가?
      choices:
        - '점수가 가장 낮은 grasp 부터 실행해 보고, 실패한 후보를 지워 가며 위로 올라간다'
        - '모든 후보를 동시에 실행 계획으로 보내고, 하나라도 성공하는 계획을 기다린다'
        - '추가 검사 없이 실행하고, 실패하면 그 장면을 데이터에 넣어 network 를 다시 학습한다'
        - 'base frame 으로 옮겨 IK 와 충돌을 검사하고, 통과한 후보를 pre-grasp 를 거쳐 실행한다'
      answer: 3
      explanation: |
        점수가 높아도 팔이 그 pose 에 닿지 않거나 다가가는 길에 부딪히면 쓸 수 없다. 그래서 base frame 으로 옮긴 뒤 점수 순서대로 IK 와 충돌을
        검사하고, 통과한 후보를 approach 반대 방향으로 물러난 pre-grasp 에서 다가가 실행한다. 나머지 보기는 실제 pipeline 의 동작이 아니다.
    - question: |
        투명한 컵을 grasp network 로 집으려는데 자주 실패한다. 가장 먼저 의심할 원인은 무엇인가?
      choices:
        - 'grip force 가 너무 커서, 매끈한 유리가 손가락 사이에서 튀어 나가기 때문'
        - '컵이 너무 가벼워서 IK 가 풀리지 않아, 팔이 grasp pose 에 가지 못하기 때문'
        - 'depth 카메라가 컵 표면 대신 뒤의 배경을 재거나 값이 비어 모양이 틀리기 때문'
        - '투명한 물체는 friction cone 이 정의되지 않아 antipodal 을 검사할 수 없기 때문'
      answer: 2
      explanation: |
        투명한 물체는 일반 depth 센서에서 뒤에 있는 면의 noise 섞인 모양으로 보이거나 값이 빈다. grasp network 는 depth 를 보고 grasp 를 고르므로
        모양이 틀리면 grasp 도 틀린다. ClearGrasp 같은 depth 보정이나 여러 각도 촬영으로 대응한다. 무게와 IK 는 관계없고, friction cone 은 재질과
        관계없이 정의된다.
    - question: |
        논문에서 성공률 90% 인 grasp network 를 우리 로봇에 붙이면 성공률이 어떻게 될까?
      choices:
        - '그 논문의 물체·카메라·gripper·패드에서 잰 값이라, 우리 로봇에서는 크게 달라질 수 있다'
        - '같은 network 와 같은 weight 를 쓰므로, 하드웨어가 달라도 반드시 90% 가 나온다'
        - 'network 가 클수록 일반화가 잘 되므로, 하드웨어와 관계없이 성공률이 오른다'
        - '실제 로봇은 simulation 보다 늘 정확하게 움직이므로, 90% 보다 높아진다'
      answer: 0
      explanation: |
        성공률은 실험 조건에 묶인 값이다. AnyGrasp 의 실험에서도 물체 종류에 따라 81.5% 에서 100% 까지 달랐다. 카메라와 로봇 사이의 calibration 이
        몇 mm 틀리거나 손가락 패드의 μ 가 다르면 같은 network 로도 결과가 달라진다. 하드웨어와 무관하게 같은 값이 나오거나 오르는 것은 아니다.
