<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>같은 backbone 에 두 head 를 붙인 그림</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="120.0" width="150.0" height="80.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="95.0" y="152.0" fill="#a78bfa" font-size="15" text-anchor="middle" font-weight="600">backbone</text>
  <text x="95.0" y="176.0" fill="#94a3b8" font-size="12" text-anchor="middle">(그대로 둔다)</text>
  <line x1="170.0" y1="160.0" x2="206.0" y2="160.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="210.0" y="128.0" width="100.0" height="64.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260.0" y="154.0" fill="#f59e0b" font-size="13" text-anchor="middle">feature</text>
  <text x="260.0" y="176.0" fill="#e2e8f0" font-size="14" text-anchor="middle">(0, 3)</text>
  <line x1="310.0" y1="150.0" x2="366.0" y2="86.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="310.0" y1="170.0" x2="366.0" y2="234.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="370.0" y="40.0" width="150.0" height="92.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="445.0" y="66.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="600">분류 head</text>
  <text x="445.0" y="90.0" fill="#e2e8f0" font-size="12" text-anchor="middle">Linear 2 → 3</text>
  <text x="445.0" y="112.0" fill="#e2e8f0" font-size="12" text-anchor="middle">점수 (2.0, 1.0, 0.1)</text>
  <line x1="520.0" y1="86.0" x2="556.0" y2="86.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="560.0" y="40.0" width="140.0" height="92.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="630.0" y="66.0" fill="#e2e8f0" font-size="13" text-anchor="middle">softmax</text>
  <text x="630.0" y="88.0" fill="#e2e8f0" font-size="13" text-anchor="middle">cross-entropy</text>
  <text x="630.0" y="112.0" fill="#f59e0b" font-size="13" text-anchor="middle">loss 0.417</text>
  <rect x="370.0" y="188.0" width="150.0" height="92.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="214.0" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="600">관절 head</text>
  <text x="445.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="middle">Linear 2 → 2</text>
  <text x="445.0" y="260.0" fill="#e2e8f0" font-size="12" text-anchor="middle">각도 (30°, −15°)</text>
  <line x1="520.0" y1="234.0" x2="556.0" y2="234.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="560.0" y="188.0" width="140.0" height="92.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="630.0" y="214.0" fill="#e2e8f0" font-size="13" text-anchor="middle">MSE</text>
  <text x="630.0" y="236.0" fill="#e2e8f0" font-size="12" text-anchor="middle">정답 (28°, −12°)</text>
  <text x="630.0" y="260.0" fill="#f59e0b" font-size="13" text-anchor="middle">loss 6.5</text>
  <text x="360.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="middle">head 와 loss 만 바꿔 다른 일을 시킨다</text>
