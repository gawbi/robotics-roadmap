<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Adam 의 첫 step 에서 움직이는 거리</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40.0" y="40.0" width="200.0" height="190.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140.0" y="66.0" fill="#38bdf8" font-size="14" text-anchor="middle">gradient g = 0.02</text>
  <text x="126.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="end">m</text>
  <text x="121.0" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="132.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 0.02</text>
  <text x="126.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="end">√v</text>
  <text x="124.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="132.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 0.02</text>
  <text x="140.0" y="150.0" fill="#f59e0b" font-size="14" text-anchor="middle">나눈 값 = 1</text>
  <text x="140.0" y="176.0" fill="#34d399" font-size="14" text-anchor="middle">움직이는 거리 η</text>
  <text x="140.0" y="208.0" fill="#f87171" font-size="12" text-anchor="middle">correction 없이: 3.16η</text>
  <rect x="260.0" y="40.0" width="200.0" height="190.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="360.0" y="66.0" fill="#34d399" font-size="14" text-anchor="middle">gradient g = 2</text>
  <text x="346.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="end">m</text>
  <text x="341.0" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="352.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 2</text>
  <text x="346.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="end">√v</text>
  <text x="344.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="352.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 2</text>
  <text x="360.0" y="150.0" fill="#f59e0b" font-size="14" text-anchor="middle">나눈 값 = 1</text>
  <text x="360.0" y="176.0" fill="#34d399" font-size="14" text-anchor="middle">움직이는 거리 η</text>
  <text x="360.0" y="208.0" fill="#f87171" font-size="12" text-anchor="middle">correction 없이: 3.16η</text>
  <rect x="480.0" y="40.0" width="200.0" height="190.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="580.0" y="66.0" fill="#a78bfa" font-size="14" text-anchor="middle">gradient g = 200</text>
  <text x="566.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="end">m</text>
  <text x="561.0" y="95.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="572.0" y="98.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 200</text>
  <text x="566.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="end">√v</text>
  <text x="564.0" y="120.0" fill="#e2e8f0" font-size="12" text-anchor="middle">^</text>
  <text x="572.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="start">= 200</text>
  <text x="580.0" y="150.0" fill="#f59e0b" font-size="14" text-anchor="middle">나눈 값 = 1</text>
  <text x="580.0" y="176.0" fill="#34d399" font-size="14" text-anchor="middle">움직이는 거리 η</text>
  <text x="580.0" y="208.0" fill="#f87171" font-size="12" text-anchor="middle">correction 없이: 3.16η</text>
  <text x="360.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">gradient 크기와 상관없이 첫 step 은 η.  bias correction 을 빼면 0.1 ÷ √0.001 ≈ 3.16 배가 된다</text>
</svg>
