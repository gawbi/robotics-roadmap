<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MNIST 70,000 장을 train, validation, test 로 나눈 모습</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40.0" y="70.0" width="453.1" height="60.0" rx="6" fill="#7cb4d8" fill-opacity="0.25" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="266.6" y="96.0" fill="#e2e8f0" font-size="13" text-anchor="middle">train set</text>
  <text x="266.6" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="middle">50,000</text>
  <text x="60.0" y="166.0" fill="#7cb4d8" font-size="13" text-anchor="start">train set — gradient 를 계산해 parameter 를 고친다</text>
  <rect x="497.1" y="70.0" width="87.4" height="60.0" rx="6" fill="#d6aa62" fill-opacity="0.25" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="540.9" y="96.0" fill="#e2e8f0" font-size="13" text-anchor="middle">validation</text>
  <text x="540.9" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="middle">10,000</text>
  <text x="60.0" y="190.0" fill="#d6aa62" font-size="13" text-anchor="start">validation set — 설정과 학습을 멈출 epoch 를 고른다</text>
  <rect x="588.6" y="70.0" width="87.4" height="60.0" rx="6" fill="#7fc4a2" fill-opacity="0.25" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="632.3" y="96.0" fill="#e2e8f0" font-size="13" text-anchor="middle">test</text>
  <text x="632.3" y="116.0" fill="#e2e8f0" font-size="13" text-anchor="middle">10,000</text>
  <text x="60.0" y="214.0" fill="#7fc4a2" font-size="13" text-anchor="start">test set — 모든 선택이 끝난 뒤 마지막에 한 번 잰다</text>
  <polyline points="40.0,58.0 40.0,52.0 584.6,52.0 584.6,58.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="314.3" y="44.0" fill="#94a3b8" font-size="12" text-anchor="middle">MNIST 학습용 60,000</text>
  <polyline points="588.6,58.0 588.6,52.0 676.0,52.0 676.0,58.0" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="634.3" y="44.0" fill="#94a3b8" font-size="12" text-anchor="middle">시험용 10,000</text>
  <text x="360.0" y="250.0" fill="#94a3b8" font-size="12" text-anchor="middle">학습용 60,000 장에서 10,000 장을 떼어 validation set 으로 쓴다</text>
</svg>
