  <text x="360.0" y="252.0" fill="#94a3b8" font-size="13" text-anchor="middle">b 는 모든 행에 똑같이 더한다.  batch 축의 2 는 그대로, 3 칸이 2 칸으로 바뀐다</text>
</svg>
