  <line x1="420.0" y1="250.0" x2="670.0" y2="250.0" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="420.0" y1="60.0" x2="420.0" y2="250.0" stroke="#94a3b8" stroke-width="1.4"/>
