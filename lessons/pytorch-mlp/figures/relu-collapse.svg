  <text x="445.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">−2</text>
  <text x="495.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">−1</text>
  <text x="545.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="595.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="645.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="412.0" y="222.3" fill="#94a3b8" font-size="12" text-anchor="end">0</text>
  <text x="412.0" y="159.0" fill="#94a3b8" font-size="12" text-anchor="end">1</text>
  <text x="412.0" y="95.7" fill="#94a3b8" font-size="12" text-anchor="end">2</text>
  <text x="545.0" y="288.0" fill="#94a3b8" font-size="13" text-anchor="middle">x</text>
  <text x="420.0" y="50.0" fill="#94a3b8" font-size="13" text-anchor="start">y</text>
  <text x="545.0" y="34.0" fill="#7fc4a2" font-size="14" text-anchor="middle">ReLU 를 넣으면: y = relu(x) + relu(−x)</text>
  <polyline points="420.0,60.0 545.0,218.3 670.0,60.0" fill="none" stroke="#7fc4a2" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="445.0" cy="91.7" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="495.0" cy="155.0" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="545.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="595.0" cy="155.0" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="645.0" cy="91.7" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <text x="185.0" y="322.0" fill="#94a3b8" font-size="13" text-anchor="middle">무엇을 넣어도 0: 직선 하나와 같다</text>
  <text x="545.0" y="322.0" fill="#94a3b8" font-size="13" text-anchor="middle">x = 0 에서 꺾인다</text>
