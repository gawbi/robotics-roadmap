  <line x1="135.0" y1="60.0" x2="135.0" y2="250.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="185.0" y1="60.0" x2="185.0" y2="250.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="235.0" y1="60.0" x2="235.0" y2="250.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="285.0" y1="60.0" x2="285.0" y2="250.0" stroke="#1e293b" stroke-width="1"/>
  <line x1="60.0" y1="250.0" x2="310.0" y2="250.0" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="60.0" y1="60.0" x2="60.0" y2="250.0" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="60.0" y1="218.3" x2="310.0" y2="218.3" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="185.0" y1="60.0" x2="185.0" y2="250.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="85.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">−2</text>
  <text x="135.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">−1</text>
  <text x="185.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <text x="235.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <text x="285.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="52.0" y="222.3" fill="#94a3b8" font-size="12" text-anchor="end">0</text>
  <text x="52.0" y="159.0" fill="#94a3b8" font-size="12" text-anchor="end">1</text>
  <text x="52.0" y="95.7" fill="#94a3b8" font-size="12" text-anchor="end">2</text>
  <text x="185.0" y="288.0" fill="#94a3b8" font-size="13" text-anchor="middle">x</text>
  <text x="60.0" y="50.0" fill="#94a3b8" font-size="13" text-anchor="start">y</text>
  <text x="185.0" y="34.0" fill="#d88b8b" font-size="14" text-anchor="middle">ReLU 없이: y = x + (−x)</text>
  <polyline points="60.0,218.3 310.0,218.3" fill="none" stroke="#d88b8b" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="85.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="135.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="185.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="235.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <circle cx="285.0" cy="218.3" r="4.5" fill="#d6aa62" stroke="#d6aa62" stroke-width="2"/>
  <line x1="420.0" y1="218.3" x2="670.0" y2="218.3" stroke="#1e293b" stroke-width="1"/>
  <line x1="420.0" y1="155.0" x2="670.0" y2="155.0" stroke="#1e293b" stroke-width="1"/>
