<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>backbone 이 입력을 feature 로 요약하고 head 가 출력을 낸다</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="70.0" width="110.0" height="80.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">입력</text>
  <text x="75.0" y="124.0" fill="#38bdf8" font-size="14" text-anchor="middle">(1, 0, 2)</text>
  <line x1="130.0" y1="110.0" x2="176.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="180.0" y="50.0" width="190.0" height="120.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="275.0" y="78.0" fill="#a78bfa" font-size="16" text-anchor="middle" font-weight="600">backbone</text>
  <text x="275.0" y="108.0" fill="#e2e8f0" font-size="13" text-anchor="middle">Linear 3 → 2</text>
  <text x="275.0" y="130.0" fill="#e2e8f0" font-size="13" text-anchor="middle">ReLU</text>
  <text x="275.0" y="154.0" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 8 개</text>
  <line x1="370.0" y1="110.0" x2="416.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="420.0" y="70.0" width="110.0" height="80.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="475.0" y="100.0" fill="#f59e0b" font-size="14" text-anchor="middle">feature</text>
  <text x="475.0" y="124.0" fill="#e2e8f0" font-size="14" text-anchor="middle">(0, 3)</text>
  <line x1="530.0" y1="110.0" x2="566.0" y2="110.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="570.0" y="50.0" width="130.0" height="120.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="635.0" y="78.0" fill="#34d399" font-size="16" text-anchor="middle" font-weight="600">head</text>
  <text x="635.0" y="108.0" fill="#e2e8f0" font-size="13" text-anchor="middle">Linear 2 → 3</text>
  <text x="635.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="middle">점수 (2.0, 1.0, 0.1)</text>
  <text x="635.0" y="154.0" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 9 개</text>
  <text x="360.0" y="208.0" fill="#94a3b8" font-size="13" text-anchor="middle">MNIST MLP 에서는</text>
  <rect x="20.0" y="224.0" width="110.0" height="56.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="75.0" y="258.0" fill="#e2e8f0" font-size="13" text-anchor="middle">사진 784</text>
  <line x1="130.0" y1="252.0" x2="176.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="180.0" y="224.0" width="190.0" height="56.0" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="275.0" y="247.0" fill="#e2e8f0" font-size="12" text-anchor="middle">Linear 784 → 256, ReLU</text>
  <text x="275.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 200,960 개</text>
  <line x1="370.0" y1="252.0" x2="416.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="420.0" y="224.0" width="110.0" height="56.0" rx="10" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="475.0" y="258.0" fill="#f59e0b" font-size="13" text-anchor="middle">feature 256</text>
  <line x1="530.0" y1="252.0" x2="566.0" y2="252.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <rect x="570.0" y="224.0" width="130.0" height="56.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="635.0" y="247.0" fill="#e2e8f0" font-size="12" text-anchor="middle">Linear 256 → 10</text>
  <text x="635.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">parameter 2,570 개</text>
  <text x="360.0" y="312.0" fill="#94a3b8" font-size="12" text-anchor="middle">head 는 입력을 직접 보지 못하고 feature 만 받는다</text>
</svg>
