<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>입력 (1, 0, 2) 가 Linear layer 를 지나 (−1, 3) 이 되는 계산</title>
  <defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ar-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="698" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <circle cx="70.0" cy="80.0" r="30" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="70.0" y="85.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x₁ = 1</text>
  <circle cx="70.0" cy="150.0" r="30" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="70.0" y="155.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x₂ = 0</text>
  <circle cx="70.0" cy="220.0" r="30" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="70.0" y="225.0" fill="#e2e8f0" font-size="13" text-anchor="middle">x₃ = 2</text>
  <line x1="100.0" y1="80.0" x2="328.0" y2="102.0" stroke="#38bdf8" stroke-width="1.3" marker-end="url(#ar-#38bdf8)"/>
  <line x1="100.0" y1="80.0" x2="328.0" y2="212.0" stroke="#34d399" stroke-width="1.3" marker-end="url(#ar-#34d399)"/>
  <line x1="100.0" y1="150.0" x2="328.0" y2="102.0" stroke="#38bdf8" stroke-width="1.3" marker-end="url(#ar-#38bdf8)"/>
  <line x1="100.0" y1="150.0" x2="328.0" y2="212.0" stroke="#34d399" stroke-width="1.3" marker-end="url(#ar-#34d399)"/>
  <line x1="100.0" y1="220.0" x2="328.0" y2="102.0" stroke="#38bdf8" stroke-width="1.3" marker-end="url(#ar-#38bdf8)"/>
  <line x1="100.0" y1="220.0" x2="328.0" y2="212.0" stroke="#34d399" stroke-width="1.3" marker-end="url(#ar-#34d399)"/>
  <rect x="330.0" y="70.0" width="250.0" height="64.0" rx="10" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="455.0" y="96.0" fill="#38bdf8" font-size="13" text-anchor="middle">neuron 1: weight (1, 2, −1), bias 0</text>
  <text x="455.0" y="120.0" fill="#e2e8f0" font-size="14" text-anchor="middle">1·1 + 2·0 + (−1)·2 + 0 = −1</text>
  <rect x="330.0" y="180.0" width="250.0" height="64.0" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="455.0" y="206.0" fill="#34d399" font-size="13" text-anchor="middle">neuron 2: weight (0, 1, 1), bias 1</text>
  <text x="455.0" y="230.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0·1 + 1·0 + 1·2 + 1 = 3</text>
  <line x1="580.0" y1="102.0" x2="614.0" y2="102.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <line x1="580.0" y1="212.0" x2="614.0" y2="212.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-gray)"/>
  <circle cx="645.0" cy="102.0" r="28" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="645.0" y="107.0" fill="#e2e8f0" font-size="15" text-anchor="middle">−1</text>
  <circle cx="645.0" cy="212.0" r="28" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="645.0" y="217.0" fill="#e2e8f0" font-size="15" text-anchor="middle">3</text>
  <text x="350.0" y="284.0" fill="#94a3b8" font-size="13" text-anchor="middle">선 하나가 weight 하나: weight 6 개 + bias 2 개 = parameter 8 개</text>
</svg>
