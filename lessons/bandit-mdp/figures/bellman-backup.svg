<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>sweep 2 에서 칸 2 의 계산. 위는 벽에 막혀 0 + 0.9 × V₁(2) = 0.9, 아래는 계단이라 −1, 왼쪽은 0 + 0.9 × V₁(1) = 0, 오른쪽은 충전기라 1 이고, 가장 큰 1 이 새 V₂(2) 다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="250.0" y="26.0" width="140.0" height="48.0" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="320.0" y="56.0" fill="#e2e8f0" font-size="14" text-anchor="middle">칸 2 의 새 V₂(2)</text>
  <line x1="320.0" y1="74.0" x2="90.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="90.0" cy="126.0" r="7" fill="#38bdf8"/>
  <text x="90.0" y="152.0" fill="#38bdf8" font-size="13" text-anchor="middle">위</text>
  <line x1="90.0" y1="160.0" x2="90.0" y2="186.0" stroke="#475569" stroke-width="1.8"/>
  <rect x="20.0" y="188.0" width="140.0" height="46.0" rx="8" fill="#0e1628" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 2 (벽)</text>
  <text x="90.0" y="258.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0 + 0.9 × 1 = 0.9</text>
  <line x1="320.0" y1="74.0" x2="245.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="245.0" cy="126.0" r="7" fill="#38bdf8"/>
  <text x="245.0" y="152.0" fill="#38bdf8" font-size="13" text-anchor="middle">아래</text>
  <line x1="245.0" y1="160.0" x2="245.0" y2="186.0" stroke="#475569" stroke-width="1.8"/>
  <rect x="175.0" y="188.0" width="140.0" height="46.0" rx="8" fill="#0e1628" stroke="#f87171" stroke-width="1.5"/>
  <text x="245.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 5 (계단)</text>
  <text x="245.0" y="258.0" fill="#f87171" font-size="13" text-anchor="middle">−1 + 0 = −1</text>
  <line x1="320.0" y1="74.0" x2="400.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="400.0" cy="126.0" r="7" fill="#38bdf8"/>
  <text x="400.0" y="152.0" fill="#38bdf8" font-size="13" text-anchor="middle">왼쪽</text>
  <line x1="400.0" y1="160.0" x2="400.0" y2="186.0" stroke="#475569" stroke-width="1.8"/>
  <rect x="330.0" y="188.0" width="140.0" height="46.0" rx="8" fill="#0e1628" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 1</text>
  <text x="400.0" y="258.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0 + 0.9 × 0 = 0</text>
  <line x1="320.0" y1="74.0" x2="555.0" y2="120.0" stroke="#94a3b8" stroke-width="1.8"/>
  <circle cx="555.0" cy="126.0" r="7" fill="#38bdf8"/>
  <text x="555.0" y="152.0" fill="#38bdf8" font-size="13" text-anchor="middle">오른쪽</text>
  <line x1="555.0" y1="160.0" x2="555.0" y2="186.0" stroke="#475569" stroke-width="1.8"/>
  <rect x="485.0" y="188.0" width="140.0" height="46.0" rx="8" fill="#0e1628" stroke="#34d399" stroke-width="2"/>
  <text x="555.0" y="216.0" fill="#e2e8f0" font-size="13" text-anchor="middle">칸 3 (충전기)</text>
  <text x="555.0" y="258.0" fill="#34d399" font-size="13" text-anchor="middle">1 + 0 = 1</text>
  <text x="320.0" y="104.0" fill="#e2e8f0" font-size="1" text-anchor="middle"></text>
  <text x="320.0" y="296.0" fill="#f59e0b" font-size="14" text-anchor="middle">max(0.9, −1, 0, 1) = 1 → V₂(2) = 1</text>
  <text x="320.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">V₁(2) = 1, V₁(1) = 0 을 쓴다 (γ = 0.9)</text>
</svg>
