<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>3×3 gridworld. 칸 번호는 왼쪽 위 1 부터 오른쪽 아래 9 까지이고, 칸 3 은 충전기(+1, 끝), 칸 5 는 계단(−1, 끝), 칸 7 은 출발 칸이다. 격자 밖으로 나가려는 이동은 제자리에 머문다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="398" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="65.0" y="30.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="71.0" y="45.0" fill="#64748b" font-size="11" text-anchor="start">1</text>
  <rect x="155.0" y="30.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="161.0" y="45.0" fill="#64748b" font-size="11" text-anchor="start">2</text>
  <rect x="245.0" y="30.0" width="90.0" height="90.0" rx="0" fill="#7fc4a2" fill-opacity="0.22" stroke="#334155" stroke-width="1.5"/>
  <text x="251.0" y="45.0" fill="#64748b" font-size="11" text-anchor="start">3</text>
  <rect x="65.0" y="120.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="71.0" y="135.0" fill="#64748b" font-size="11" text-anchor="start">4</text>
  <rect x="155.0" y="120.0" width="90.0" height="90.0" rx="0" fill="#d88b8b" fill-opacity="0.22" stroke="#334155" stroke-width="1.5"/>
  <text x="161.0" y="135.0" fill="#64748b" font-size="11" text-anchor="start">5</text>
  <rect x="245.0" y="120.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="251.0" y="135.0" fill="#64748b" font-size="11" text-anchor="start">6</text>
  <rect x="65.0" y="210.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="71.0" y="225.0" fill="#64748b" font-size="11" text-anchor="start">7</text>
  <rect x="155.0" y="210.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="161.0" y="225.0" fill="#64748b" font-size="11" text-anchor="start">8</text>
  <rect x="245.0" y="210.0" width="90.0" height="90.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="251.0" y="225.0" fill="#64748b" font-size="11" text-anchor="start">9</text>
  <text x="290.0" y="73.0" fill="#7fc4a2" font-size="15" text-anchor="middle">충전기</text>
  <text x="290.0" y="95.0" fill="#7fc4a2" font-size="13" text-anchor="middle">+1, 끝</text>
  <text x="200.0" y="163.0" fill="#d88b8b" font-size="15" text-anchor="middle">계단</text>
  <text x="200.0" y="185.0" fill="#d88b8b" font-size="13" text-anchor="middle">−1, 끝</text>
  <circle cx="110.0" cy="249.0" r="12" fill="#7cb4d8"/>
  <text x="110.0" y="281.0" fill="#7cb4d8" font-size="13" text-anchor="middle">출발</text>
  <text x="200.0" y="335.0" fill="#e2e8f0" font-size="13" text-anchor="middle">위·아래·왼쪽·오른쪽으로 한 칸씩 움직인다</text>
  <text x="200.0" y="358.0" fill="#94a3b8" font-size="13" text-anchor="middle">그 밖의 이동은 reward 0</text>
  <text x="200.0" y="380.0" fill="#94a3b8" font-size="13" text-anchor="middle">격자 밖으로 가려 하면 벽에 막혀 제자리</text>
</svg>
