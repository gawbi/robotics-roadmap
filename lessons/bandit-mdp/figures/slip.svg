  <path d="M182.0,96.0 C176.0,58 204.0,58 199.0,94.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-muted)"/>
  <text x="224.0" y="82.0" fill="#94a3b8" font-size="14" text-anchor="middle">0.1</text>
  <text x="166.0" y="78.0" fill="#64748b" font-size="11" text-anchor="middle">벽</text>
  <line x1="190.0" y1="124.0" x2="190.0" y2="184.0" stroke="#d88b8b" stroke-width="2.5" marker-end="url(#ar-red)"/>
  <text x="212.0" y="156.0" fill="#d88b8b" font-size="14" text-anchor="middle">0.1</text>
  <text x="230.0" y="382.0" fill="#94a3b8" font-size="13" text-anchor="middle">0.8 + 0.1 + 0.1 = 1</text>
