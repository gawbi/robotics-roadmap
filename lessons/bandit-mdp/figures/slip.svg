<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>미끄러운 바닥에서 칸 2 에서 오른쪽을 고르면 0.8 의 확률로 칸 3, 0.1 의 확률로 위쪽 벽에 막혀 칸 2, 0.1 의 확률로 칸 5 에 도착한다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="458" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40.0" y="60.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="46.0" y="75.0" fill="#64748b" font-size="11" text-anchor="start">1</text>
  <rect x="140.0" y="60.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="146.0" y="75.0" fill="#64748b" font-size="11" text-anchor="start">2</text>
  <rect x="240.0" y="60.0" width="100.0" height="100.0" rx="0" fill="#7fc4a2" fill-opacity="0.22" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="75.0" fill="#64748b" font-size="11" text-anchor="start">3</text>
  <text x="290.0" y="151.0" fill="#7fc4a2" font-size="11" text-anchor="middle">충전기</text>
  <rect x="40.0" y="160.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="46.0" y="175.0" fill="#64748b" font-size="11" text-anchor="start">4</text>
  <rect x="140.0" y="160.0" width="100.0" height="100.0" rx="0" fill="#d88b8b" fill-opacity="0.22" stroke="#334155" stroke-width="1.5"/>
  <text x="146.0" y="175.0" fill="#64748b" font-size="11" text-anchor="start">5</text>
  <text x="190.0" y="251.0" fill="#d88b8b" font-size="11" text-anchor="middle">계단</text>
  <rect x="240.0" y="160.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="175.0" fill="#64748b" font-size="11" text-anchor="start">6</text>
  <rect x="40.0" y="260.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="46.0" y="275.0" fill="#64748b" font-size="11" text-anchor="start">7</text>
  <rect x="140.0" y="260.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="146.0" y="275.0" fill="#64748b" font-size="11" text-anchor="start">8</text>
  <rect x="240.0" y="260.0" width="100.0" height="100.0" rx="0" fill="#0e1628" stroke="#334155" stroke-width="1.5"/>
  <text x="246.0" y="275.0" fill="#64748b" font-size="11" text-anchor="start">9</text>
  <circle cx="190.0" cy="110.0" r="11" fill="#7cb4d8"/>
  <text x="190.0" y="32.0" fill="#e2e8f0" font-size="14" text-anchor="middle">칸 2 에서 오른쪽을 고름</text>
  <line x1="204.0" y1="110.0" x2="264.0" y2="110.0" stroke="#d6aa62" stroke-width="3" marker-end="url(#ar-amber)"/>
