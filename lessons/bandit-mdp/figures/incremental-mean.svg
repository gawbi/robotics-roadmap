  <text x="590.0" y="178.0" fill="#94a3b8" font-size="12" text-anchor="end">Q 4 → 4  (차이 0 의 1/3 = 0)</text>
  <text x="30.0" y="275.0" fill="#e2e8f0" font-size="14" text-anchor="start">n = 4</text>
  <line x1="120.0" y1="270.0" x2="590.0" y2="270.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="120.0" y1="266.0" x2="120.0" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="120.0" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <line x1="198.3" y1="266.0" x2="198.3" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="198.3" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">1</text>
  <line x1="276.7" y1="266.0" x2="276.7" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="276.7" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">2</text>
  <line x1="355.0" y1="266.0" x2="355.0" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="355.0" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">3</text>
  <line x1="433.3" y1="266.0" x2="433.3" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="433.3" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">4</text>
  <line x1="511.7" y1="266.0" x2="511.7" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="511.7" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">5</text>
  <line x1="590.0" y1="266.0" x2="590.0" y2="274.0" stroke="#475569" stroke-width="1.5"/>
  <text x="590.0" y="290.0" fill="#64748b" font-size="11" text-anchor="middle">6</text>
  <line x1="433.3" y1="256.0" x2="361.0" y2="256.0" stroke="#34d399" stroke-width="2.5" marker-end="url(#ar-green)"/>
  <circle cx="120.0" cy="270.0" r="7" fill="#f59e0b"/>
  <circle cx="433.3" cy="270.0" r="6" fill="#94a3b8"/>
  <circle cx="355.0" cy="270.0" r="6" fill="#34d399"/>
  <text x="120.0" y="244.0" fill="#e2e8f0" font-size="1" text-anchor="middle"></text>
  <text x="590.0" y="248.0" fill="#34d399" font-size="12" text-anchor="end">Q 4 → 3  (차이 −4 의 1/4 = −1)</text>
  <circle cx="130.0" cy="318.0" r="6" fill="#94a3b8"/>
  <text x="142.0" y="322.0" fill="#94a3b8" font-size="12" text-anchor="start">고치기 전 Q</text>
  <circle cx="260.0" cy="318.0" r="7" fill="#f59e0b"/>
  <text x="272.0" y="322.0" fill="#f59e0b" font-size="12" text-anchor="start">받은 reward</text>
  <circle cx="380.0" cy="318.0" r="6" fill="#34d399"/>
  <text x="392.0" y="322.0" fill="#34d399" font-size="12" text-anchor="start">고친 Q</text>
</svg>
