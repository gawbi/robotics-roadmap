  <line x1="590.0" y1="196.0" x2="590.0" y2="204.0" stroke="#475569" stroke-width="1.5"/>
  <text x="590.0" y="220.0" fill="#64748b" font-size="11" text-anchor="middle">6</text>
  <circle cx="433.3" cy="200.0" r="7" fill="#f59e0b"/>
  <circle cx="433.3" cy="200.0" r="6" fill="#94a3b8"/>
