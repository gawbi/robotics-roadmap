<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>손끝과 목표 사이 거리에 따른 FetchReach 의 두 reward. sparse reward 는 거리가 0.05 m 보다 작으면 0, 그 밖에서는 어디서나 −1 이고, dense reward 는 거리에 마이너스를 붙인 값이라 0.2 m 에서 −0.2, 0.1 m 에서 −0.1 이다</title>
  <rect x="1" y="1" width="618" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="70" y="44" width="450" height="200" fill="#0e1628" stroke="#1e293b" stroke-width="1"/>
  <line x1="70.0" y1="244.0" x2="520.0" y2="244.0" stroke="#475569" stroke-width="1.5"/>
  <line x1="70.0" y1="44.0" x2="70.0" y2="244.0" stroke="#475569" stroke-width="1.5"/>
  <text x="70.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0</text>
  <text x="145.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.05</text>
  <text x="220.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.1</text>
  <text x="295.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.15</text>
  <text x="370.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.2</text>
  <text x="445.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.25</text>
  <text x="520.0" y="261.0" fill="#64748b" font-size="12" text-anchor="middle">0.3</text>
  <text x="63.0" y="231.3" fill="#64748b" font-size="12" text-anchor="end">−1</text>
  <text x="63.0" y="148.0" fill="#64748b" font-size="12" text-anchor="end">−0.5</text>
  <text x="63.0" y="64.7" fill="#64748b" font-size="12" text-anchor="end">0</text>
  <text x="520.0" y="278.0" fill="#94a3b8" font-size="13" text-anchor="end">손끝과 목표 사이 거리 (m)</text>
  <text x="70.0" y="34.0" fill="#94a3b8" font-size="13" text-anchor="start">한 step 의 reward</text>
  <line x1="70.0" y1="60.7" x2="520.0" y2="60.7" stroke="#475569" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="145.0" y1="44.0" x2="145.0" y2="244.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="151.0" y="60.0" fill="#94a3b8" font-size="12" text-anchor="start">성공 반경 0.05 m</text>
  <polyline points="70.0,60.7 145.0,60.7" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="145.0,227.3 520.0,227.3" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
  <line x1="145.0" y1="60.7" x2="145.0" y2="227.3" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 3"/>
  <polyline points="70.0,60.7 520.0,110.7" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="220.0" cy="77.3" r="4" fill="#38bdf8"/>
  <text x="224.0" y="97.3" fill="#38bdf8" font-size="12" text-anchor="start">0.1 m → −0.1</text>
  <circle cx="370.0" cy="94.0" r="4" fill="#38bdf8"/>
  <text x="374.0" y="114.0" fill="#38bdf8" font-size="12" text-anchor="start">0.2 m → −0.2</text>
  <text x="370.0" y="217.3" fill="#f59e0b" font-size="12" text-anchor="middle">0.05 m 밖은 어디든 −1</text>
  <line x1="110.0" y1="298.0" x2="132.0" y2="298.0" stroke="#f59e0b" stroke-width="3"/>
  <text x="138.0" y="302.0" fill="#e2e8f0" font-size="12" text-anchor="start">sparse (FetchReach 기본값)</text>
  <line x1="340.0" y1="298.0" x2="362.0" y2="298.0" stroke="#38bdf8" stroke-width="3"/>
  <text x="368.0" y="302.0" fill="#e2e8f0" font-size="12" text-anchor="start">dense (FetchReachDense)</text>
</svg>
