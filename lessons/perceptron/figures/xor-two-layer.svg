<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>perceptron 세 개를 두 층으로 쌓은 XOR. 첫 층의 h₁ 은 OR, h₂ 는 NAND 이고, 둘째 층이 두 결과의 AND 를 낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="278" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- layer captions -->
  <text x="70" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">입력</text>
  <text x="300" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">첫 층 (hidden)</text>
  <text x="510" y="30" fill="#94a3b8" font-size="13" text-anchor="middle">둘째 층 (출력)</text>

  <!-- inputs -->
  <circle cx="70" cy="90" r="24" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="70" y="96" fill="#e2e8f0" font-size="17" text-anchor="middle">x₁</text>
  <circle cx="70" cy="200" r="24" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="70" y="206" fill="#e2e8f0" font-size="17" text-anchor="middle">x₂</text>

  <!-- edges input -> hidden -->
  <line x1="94" y1="90" x2="268" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="92" y1="100" x2="270" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="92" y1="190" x2="270" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="94" y1="200" x2="268" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="82" fill="#38bdf8" font-size="14" text-anchor="middle">1</text>
  <text x="150" y="218" fill="#38bdf8" font-size="14" text-anchor="middle">−1</text>
  <text x="146" y="114" fill="#38bdf8" font-size="14" text-anchor="middle">−1</text>
  <text x="146" y="188" fill="#38bdf8" font-size="14" text-anchor="middle">1</text>

  <!-- hidden units -->
  <rect x="270" y="62" width="64" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="302" y="96" fill="#e2e8f0" font-size="17" text-anchor="middle">h₁</text>
  <text x="302" y="140" fill="#94a3b8" font-size="12" text-anchor="middle">OR · b = −0.5</text>
  <rect x="270" y="172" width="64" height="56" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="302" y="206" fill="#e2e8f0" font-size="17" text-anchor="middle">h₂</text>
  <text x="302" y="250" fill="#94a3b8" font-size="12" text-anchor="middle">NAND · b = 1.5</text>

  <!-- edges hidden -> output -->
  <line x1="334" y1="90" x2="476" y2="138" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="334" y1="200" x2="476" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="104" fill="#38bdf8" font-size="14" text-anchor="middle">1</text>
  <text x="408" y="196" fill="#38bdf8" font-size="14" text-anchor="middle">1</text>

  <!-- output unit -->
  <rect x="478" y="117" width="64" height="56" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="510" y="151" fill="#e2e8f0" font-size="17" text-anchor="middle">ŷ</text>
  <text x="510" y="195" fill="#94a3b8" font-size="12" text-anchor="middle">AND · b = −1.5</text>

  <text x="300" y="270" fill="#64748b" font-size="12" text-anchor="middle">상자마다 z = (들어오는 값 × weight 의 합) + b 를 계산해 z &gt; 0 이면 1 을 낸다</text>
</svg>
