<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>학습 규칙 한 번의 계산. [1, 1] 을 0 으로 틀려 오차가 +1 이고, w₁, w₂, b 에 각각 0.1 을 더하자 같은 입력의 z 가 0 에서 0.3 으로 커졌다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="638" height="283" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#d6aa62" font-size="15" text-anchor="start">AND 의 [1, 1], w = [0, 0], b = 0, η = 0.1</text>
  <rect x="20" y="60" width="150" height="70" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="95" y="88" fill="#e2e8f0" font-size="14" text-anchor="middle">z = 0 → ŷ = 0</text>
  <text x="95" y="112" fill="#94a3b8" font-size="14" text-anchor="middle">정답 y = 1</text>
  <line x1="172" y1="95" x2="208" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="60" width="120" height="70" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="270" y="88" fill="#e2e8f0" font-size="14" text-anchor="middle">오차 y − ŷ</text>
  <text x="270" y="112" fill="#7cb4d8" font-size="14" text-anchor="middle">1 − 0 = +1</text>
  <line x1="332" y1="95" x2="368" y2="95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="370" y="50" width="210" height="28" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="382" y="69" fill="#d6aa62" font-size="14" text-anchor="start">w₁</text>
  <text x="570" y="69" fill="#e2e8f0" font-size="13" text-anchor="end">0 + 0.1×1×1 = 0.1</text>
  <rect x="370" y="84" width="210" height="28" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="382" y="103" fill="#d6aa62" font-size="14" text-anchor="start">w₂</text>
  <text x="570" y="103" fill="#e2e8f0" font-size="13" text-anchor="end">0 + 0.1×1×1 = 0.1</text>
  <rect x="370" y="118" width="210" height="28" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="382" y="137" fill="#d6aa62" font-size="14" text-anchor="start">b</text>
  <text x="570" y="137" fill="#e2e8f0" font-size="13" text-anchor="end">0 + 0.1×1 = 0.1</text>
  <text x="475" y="165" fill="#94a3b8" font-size="12" text-anchor="middle">η × 오차 × 입력 을 더한다</text>
  <line x1="475" y1="172" x2="475" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="200" width="290" height="60" rx="10" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="475" y="225" fill="#94a3b8" font-size="13" text-anchor="middle">같은 입력의 새 z</text>
  <text x="475" y="248" fill="#e2e8f0" font-size="14" text-anchor="middle">0.1 + 0.1 + 0.1 = 0.3 → ŷ = 1</text>
  <text x="20" y="230" fill="#94a3b8" font-size="13" text-anchor="start">1 이어야 할 입력에서 0 으로 틀렸으니</text>
  <text x="20" y="250" fill="#94a3b8" font-size="13" text-anchor="start">z 를 키우는 쪽으로 고친다</text>

</svg>
