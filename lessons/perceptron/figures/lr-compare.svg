  <text x="310" y="330" fill="#e2e8f0" font-size="13" text-anchor="middle">틀린 step 4·5·6·8·10·11·12·15·16·18, 6 epoch 에 수렴 — 두 경우가 같다</text>
  <text x="310" y="352" fill="#94a3b8" font-size="13" text-anchor="middle">z 는 모든 점에서 정확히 10배, 부호가 같아 예측과 직선 2x₁ + x₂ = 2 가 같다</text>

</svg>
