<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 층 perceptron 이 만드는 영역. 직선 x₁ + x₂ = 0.5 와 x₁ + x₂ = 1.5 사이의 띠에 XOR 가 1 인 두 점이 들어 있다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="60" y="30" width="300" height="300" fill="#0e1628" stroke="#1e293b"/>
  <polygon points="60.0,105.0 60.0,30.0 135.0,30.0 360.0,255.0 360.0,330.0 285.0,330.0" fill="#34d399" fill-opacity="0.14"/>
  <line x1="60" y1="255" x2="360" y2="255" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="30" x2="135" y2="330" stroke="#475569" stroke-width="1.5"/>
  <text x="354" y="273" fill="#94a3b8" font-size="14" text-anchor="end">x₁</text>
  <text x="127" y="48" fill="#94a3b8" font-size="14" text-anchor="end">x₂</text>
  <text x="285" y="285" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="119" y="110" fill="#64748b" font-size="13" text-anchor="end">1</text>
  <line x1="60" y1="105" x2="285" y2="330" stroke="#34d399" stroke-width="2.5"/>
  <line x1="360" y1="255" x2="135" y2="30" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="135" cy="255" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="135" cy="105" r="9" fill="#f59e0b" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="285" cy="255" r="9" fill="#f59e0b" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="285" cy="105" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="149" y="243" fill="#94a3b8" font-size="13" text-anchor="start">(0, 0)</text>
  <text x="149" y="93" fill="#94a3b8" font-size="13" text-anchor="start">(0, 1)</text>
  <text x="299" y="243" fill="#94a3b8" font-size="13" text-anchor="start">(1, 0)</text>
  <text x="299" y="93" fill="#94a3b8" font-size="13" text-anchor="start">(1, 1)</text>
  <circle cx="396" cy="50" r="8" fill="#f59e0b"/>
  <text x="414" y="55" fill="#e2e8f0" font-size="14" text-anchor="start">정답 y = 1</text>
  <circle cx="396" cy="80" r="8" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="414" y="85" fill="#e2e8f0" font-size="14" text-anchor="start">정답 y = 0</text>
  <line x1="386" y1="120" x2="406" y2="120" stroke="#34d399" stroke-width="2.5"/>
  <text x="414" y="125" fill="#e2e8f0" font-size="13" text-anchor="start">h₁ (OR): x₁ + x₂ = 0.5</text>
  <line x1="386" y1="150" x2="406" y2="150" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="414" y="155" fill="#e2e8f0" font-size="13" text-anchor="start">h₂ (NAND): x₁ + x₂ = 1.5</text>
  <text x="386" y="200" fill="#94a3b8" font-size="13" text-anchor="start">초록 직선 위쪽이면 h₁ = 1,</text>
  <text x="386" y="220" fill="#94a3b8" font-size="13" text-anchor="start">파란 직선 아래쪽이면 h₂ = 1</text>
  <text x="386" y="250" fill="#94a3b8" font-size="13" text-anchor="start">둘 다 1 인 띠(초록 영역)만</text>
  <text x="386" y="270" fill="#94a3b8" font-size="13" text-anchor="start">출력이 1 이다</text>

</svg>
