<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>w = [1, 1], b = −1.5 인 perceptron 이 입력 [1, 0] 과 [1, 1] 을 예측하는 계산. 곱해 더하고 bias 를 더한 z 가 0 보다 크면 1 을 낸다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="678" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="30" fill="#f59e0b" font-size="15" text-anchor="start">w₁ = 1, w₂ = 1, b = −1.5</text>
  <text x="20" y="66" fill="#94a3b8" font-size="13" text-anchor="start">입력 [1, 0]</text>
  <rect x="20" y="78" width="100" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">x₁ = 1</text>
  <text x="70" y="124" fill="#e2e8f0" font-size="14" text-anchor="middle">x₂ = 0</text>
  <text x="70" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">입력</text>
  <line x1="122" y1="107" x2="144" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="146" y="78" width="130" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="211" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">1×1 + 1×0</text>
  <text x="211" y="124" fill="#38bdf8" font-size="14" text-anchor="middle">= 1</text>
  <text x="211" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">곱해 더하기</text>
  <line x1="278" y1="107" x2="300" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="78" width="120" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="362" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">1 + (−1.5)</text>
  <text x="362" y="124" fill="#38bdf8" font-size="14" text-anchor="middle">z = −0.5</text>
  <text x="362" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">bias 더하기</text>
  <line x1="424" y1="107" x2="446" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="448" y="78" width="110" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="503" y="102" fill="#e2e8f0" font-size="14" text-anchor="middle">z &gt; 0 ?</text>
  <text x="503" y="124" fill="#e2e8f0" font-size="14" text-anchor="middle">아니오</text>
  <text x="503" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">판정</text>
  <line x1="560" y1="107" x2="582" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="584" y="78" width="70" height="58" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="619" y="113" fill="#e2e8f0" font-size="16" text-anchor="middle">ŷ = 0</text>
  <text x="619" y="154" fill="#94a3b8" font-size="12" text-anchor="middle">예측</text>
  <text x="20" y="176" fill="#94a3b8" font-size="13" text-anchor="start">입력 [1, 1]</text>
  <rect x="20" y="188" width="100" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="212" fill="#e2e8f0" font-size="14" text-anchor="middle">x₁ = 1</text>
  <text x="70" y="234" fill="#e2e8f0" font-size="14" text-anchor="middle">x₂ = 1</text>
  <text x="70" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">입력</text>
  <line x1="122" y1="217" x2="144" y2="217" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="146" y="188" width="130" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="211" y="212" fill="#e2e8f0" font-size="14" text-anchor="middle">1×1 + 1×1</text>
  <text x="211" y="234" fill="#38bdf8" font-size="14" text-anchor="middle">= 2</text>
  <text x="211" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">곱해 더하기</text>
  <line x1="278" y1="217" x2="300" y2="217" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="188" width="120" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="362" y="212" fill="#e2e8f0" font-size="14" text-anchor="middle">2 + (−1.5)</text>
  <text x="362" y="234" fill="#38bdf8" font-size="14" text-anchor="middle">z = 0.5</text>
  <text x="362" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">bias 더하기</text>
  <line x1="424" y1="217" x2="446" y2="217" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="448" y="188" width="110" height="58" rx="10" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="503" y="212" fill="#e2e8f0" font-size="14" text-anchor="middle">z &gt; 0 ?</text>
  <text x="503" y="234" fill="#e2e8f0" font-size="14" text-anchor="middle">예</text>
  <text x="503" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">판정</text>
  <line x1="560" y1="217" x2="582" y2="217" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="584" y="188" width="70" height="58" rx="10" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="619" y="223" fill="#e2e8f0" font-size="16" text-anchor="middle">ŷ = 1</text>
  <text x="619" y="264" fill="#94a3b8" font-size="12" text-anchor="middle">예측</text>

</svg>
