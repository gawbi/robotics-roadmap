<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>w = [1, 1] 로 두고 b 만 바꾼 세 decision boundary. b = −0.5 는 OR, b = −1.5 는 AND, b = −2.5 는 네 점을 모두 0 으로 예측한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>

  <!-- plot area: x1, x2 in [-0.5, 1.5], 150 px per unit, origin (0, 0) at (135, 255) -->
  <rect x="60" y="30" width="300" height="300" fill="#0e1628" stroke="#1e293b"/>

  <!-- axes -->
  <line x1="60" y1="255" x2="360" y2="255" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="30" x2="135" y2="330" stroke="#475569" stroke-width="1.5"/>
  <text x="352" y="276" fill="#94a3b8" font-size="15" text-anchor="end">x₁</text>
  <text x="124" y="48" fill="#94a3b8" font-size="15" text-anchor="end">x₂</text>
  <text x="285" y="276" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="114" y="110" fill="#64748b" font-size="13" text-anchor="end">1</text>
  <text x="114" y="276" fill="#64748b" font-size="13" text-anchor="end">0</text>

  <!-- x1 + x2 = 0.5  (b = -0.5) -->
  <line x1="60" y1="105" x2="285" y2="330" stroke="#34d399" stroke-width="2.5"/>
  <!-- x1 + x2 = 1.5  (b = -1.5) -->
  <line x1="135" y1="30" x2="360" y2="255" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- x1 + x2 = 2.5  (b = -2.5) -->
  <line x1="285" y1="30" x2="360" y2="105" stroke="#f87171" stroke-width="2.5"/>

  <!-- direction in which the line moves as b decreases -->
  <line x1="200" y1="310" x2="330" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="352" y="320" fill="#94a3b8" font-size="12" text-anchor="end">b 를 줄일수록</text>

  <!-- points (no label colour: the same four inputs for every line) -->
  <circle cx="135" cy="255" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="135" cy="105" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="285" cy="255" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="285" cy="105" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="150" y="240" fill="#94a3b8" font-size="13">(0, 0)</text>
  <text x="150" y="98" fill="#94a3b8" font-size="13">(0, 1)</text>
  <text x="270" y="240" fill="#94a3b8" font-size="13" text-anchor="end">(1, 0)</text>
  <text x="270" y="98" fill="#94a3b8" font-size="13" text-anchor="end">(1, 1)</text>

  <!-- legend -->
  <text x="386" y="56" fill="#e2e8f0" font-size="14">w = [1, 1] 고정</text>
  <text x="386" y="78" fill="#94a3b8" font-size="13">z = x₁ + x₂ + b</text>

  <line x1="386" y1="114" x2="406" y2="114" stroke="#34d399" stroke-width="2.5"/>
  <text x="414" y="119" fill="#e2e8f0" font-size="14">b = −0.5 → OR</text>
  <text x="414" y="138" fill="#94a3b8" font-size="12">threshold 0.5, 세 점이 1</text>

  <line x1="386" y1="170" x2="406" y2="170" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="414" y="175" fill="#e2e8f0" font-size="14">b = −1.5 → AND</text>
  <text x="414" y="194" fill="#94a3b8" font-size="12">threshold 1.5, (1, 1) 만 1</text>

  <line x1="386" y1="226" x2="406" y2="226" stroke="#f87171" stroke-width="2.5"/>
  <text x="414" y="231" fill="#e2e8f0" font-size="14">b = −2.5 → 항상 0</text>
  <text x="414" y="250" fill="#94a3b8" font-size="12">threshold 2.5, 1 인 점 없음</text>

  <text x="386" y="290" fill="#94a3b8" font-size="13">각 직선의 오른쪽 위가</text>
  <text x="386" y="310" fill="#94a3b8" font-size="13">z &gt; 0 인 영역이다</text>
</svg>
