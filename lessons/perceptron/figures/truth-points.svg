<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>AND 의 네 sample 을 좌표평면 위 네 점으로 나타낸 그림. 정답이 1 인 (1, 1) 만 색이 칠해져 있다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="598" height="348" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="60" y="30" width="300" height="300" fill="#0e1628" stroke="#1e293b"/>
  <line x1="60" y1="255" x2="360" y2="255" stroke="#475569" stroke-width="1.5"/>
  <line x1="135" y1="30" x2="135" y2="330" stroke="#475569" stroke-width="1.5"/>
  <text x="354" y="273" fill="#94a3b8" font-size="14" text-anchor="end">x₁</text>
  <text x="127" y="48" fill="#94a3b8" font-size="14" text-anchor="end">x₂</text>
  <text x="285" y="285" fill="#64748b" font-size="13" text-anchor="middle">1</text>
  <text x="119" y="110" fill="#64748b" font-size="13" text-anchor="end">1</text>
  <circle cx="135" cy="255" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="135" cy="105" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="285" cy="255" r="9" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="285" cy="105" r="9" fill="#d6aa62" stroke="#d6aa62" stroke-width="2.5"/>
  <text x="149" y="243" fill="#94a3b8" font-size="13" text-anchor="start">(0, 0)</text>
  <text x="149" y="93" fill="#94a3b8" font-size="13" text-anchor="start">(0, 1)</text>
  <text x="299" y="243" fill="#94a3b8" font-size="13" text-anchor="start">(1, 0)</text>
  <text x="299" y="93" fill="#94a3b8" font-size="13" text-anchor="start">(1, 1)</text>
  <text x="386" y="56" fill="#e2e8f0" font-size="15" text-anchor="start">AND 의 truth table</text>
  <text x="400" y="88" fill="#94a3b8" font-size="14" text-anchor="middle">x₁</text>
  <text x="450" y="88" fill="#94a3b8" font-size="14" text-anchor="middle">x₂</text>
  <text x="500" y="88" fill="#94a3b8" font-size="14" text-anchor="middle">y</text>
  <text x="400" y="112" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="450" y="112" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="500" y="112" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="400" y="136" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="450" y="136" fill="#e2e8f0" font-size="14" text-anchor="middle">1</text>
  <text x="500" y="136" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="400" y="160" fill="#e2e8f0" font-size="14" text-anchor="middle">1</text>
  <text x="450" y="160" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="500" y="160" fill="#e2e8f0" font-size="14" text-anchor="middle">0</text>
  <text x="400" y="184" fill="#d6aa62" font-size="14" text-anchor="middle">1</text>
  <text x="450" y="184" fill="#d6aa62" font-size="14" text-anchor="middle">1</text>
  <text x="500" y="184" fill="#d6aa62" font-size="14" text-anchor="middle">1</text>
  <circle cx="396" cy="222" r="8" fill="#d6aa62"/>
  <text x="414" y="227" fill="#e2e8f0" font-size="14" text-anchor="start">정답 y = 1</text>
  <circle cx="396" cy="252" r="8" fill="#0b1220" stroke="#e2e8f0" stroke-width="2.5"/>
  <text x="414" y="257" fill="#e2e8f0" font-size="14" text-anchor="start">정답 y = 0</text>
  <text x="386" y="300" fill="#94a3b8" font-size="12" text-anchor="start">점 (x₁, x₂) 는 원점에서 오른쪽으로</text>
  <text x="386" y="318" fill="#94a3b8" font-size="12" text-anchor="start">x₁ 칸, 위로 x₂ 칸 간 자리다</text>

</svg>
