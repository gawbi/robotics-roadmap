# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: predict
  title: weighted sum 과 step function
  variants:
    - question: |
        면접관: "perceptron 은 weighted sum $z = w_1 x_1 + w_2 x_2 + b$ 가 0 보다 크면 1 을 내고, 0 보다 크지 않으면 0 을 냅니다. 어떤 입력에서
        $z$ 가 정확히 0 이면 예측은 무엇인가요?"
      choices:
        - '1 이다. 0 은 음수가 아니기 때문이다'
        - '0 이다. 규칙이 0 보다 클 때만 1 이기 때문이다'
        - '예측할 수 없다. decision boundary 위의 점이기 때문이다'
        - '0.5 다. 두 class 의 가운데이기 때문이다'
      answer: 1
      explanation: |
        규칙은 "$z > 0$ 이면 1" 이고 $z = 0$ 은 0 보다 크지 않으므로 0 이다. decision boundary 바로 위의 점도 이 규칙에 따라 0 쪽으로 치므로
        예측할 수 없는 점은 없다. "0 이상이면 1" 로 약속하는 구현도 있지만 문항의 규칙과는 다르다. step function 은 0 과 1 만 내므로
        0.5 는 나올 수 없다.
    - question: |
        면접관: "perceptron 의 weight $w_1$ 이 음수입니다. 다른 입력과 숫자는 그대로 두고 첫째 입력 $x_1$ 만 0 에서 1 로 바뀌면 예측에 어떤
        영향을 주나요?"
      choices:
        - '아무 영향이 없다. weight 가 음수인 입력은 무시된다'
        - '$z$ 가 커져 예측을 1 쪽으로 민다'
        - 'weight 는 음수가 될 수 없으므로 이런 상황은 없다'
        - '$z$ 가 줄어 예측을 0 쪽으로 민다'
      answer: 3
      explanation: |
        $x_1$ 이 1 이 되면 $z$ 에 $w_1 \times 1$ 이 더해지는데, $w_1$ 이 음수라 $z$ 가 줄어 예측을 0 쪽으로 민다. weight 는 입력을 얼마나,
        어느 쪽으로 반영할지 정하는 숫자라 음수도 될 수 있다. 영향이 없는 것은 $w_1 = 0$ 일 때다. 1 쪽으로 미는 것은 $w_1$ 이 양수일 때다.
    - question: |
        면접관: "step function 을 쓰는 perceptron 에서 입력 A 의 weighted sum 은 0.01, 입력 B 의 weighted sum 은 100 입니다. 두 입력의
        출력을 비교해 보세요."
      choices:
        - '둘 다 1 이다. step function 은 $z$ 가 0 보다 큰지만 보고 크기는 출력에 남기지 않는다'
        - 'B 만 1 이다. $z$ 가 충분히 커야 1 이 된다'
        - 'weighted sum 을 그대로 내보내서 A 의 출력은 0.01 이고 B 의 출력은 100 이다'
        - 'B 의 출력이 A 의 출력보다 크다. $z$ 가 클수록 더 강한 1 을 낸다'
      answer: 0
      explanation: |
        step function 의 출력은 0 아니면 1 이고 기준은 $z$ 가 0 보다 큰지뿐이라서, 0.01 과 100 모두 1 이다. 얼마나 크게 넘었는지는 출력에
        남지 않는다. $z$ 를 그대로 내보내는 것은 activation function 이 없는 linear regression 같은 모델이다. 출력이 $z$ 에 따라 강해지거나
        약해지는 것은 sigmoid 같은 매끄러운 activation function 이고, step function 이 내는 1 에는 강약이 없다.

- topic: threshold-bias
  title: threshold 와 bias 의 관계
  variants:
    - question: |
        면접관: "'입력에 weight 를 곱해 더한 값이 문턱 $\theta$ 를 넘으면 1' 로 적은 perceptron 을 '$z = w_1 x_1 + w_2 x_2 + b$ 가 0 을 넘으면
        1' 로 바꿔 쓰려고 합니다. bias $b$ 는 무엇이 되나요?"
      choices:
        - '$b = \theta$'
        - '$b = 1 / \theta$'
        - '$b = -\theta$'
        - '문턱은 bias 로 바꿔 쓸 수 없다'
      answer: 2
      explanation: |
        "합 $> \theta$" 의 양쪽에서 $\theta$ 를 빼면 "합 $- \theta > 0$" 이고, 이것은 합에 $-\theta$ 를 더한 값이 0 을 넘는지 묻는 것과 같아서
        $b = -\theta$ 다. 부호를 그대로 두어 $b = \theta$ 로 옮기면 1 을 내기가 오히려 쉬워져 전혀 다른 perceptron 이 된다. 역수는 이 식 변형과
        관계가 없다. 문턱과 bias 는 같은 판정을 두 방식으로 적은 것이라 언제나 바꿔 쓸 수 있다.
    - question: |
        면접관: "weight 는 그대로 두고 bias $b$ 만 더 작게(더 큰 음수로) 바꿨습니다. 예측은 어떻게 달라지나요?"
      choices:
        - '문턱이 높아진 것과 같아서 1 로 예측하는 입력이 줄어든다'
        - '문턱이 낮아진 것과 같아서 1 로 예측하는 입력이 늘어난다'
        - 'decision boundary 의 기울기가 바뀐다'
        - 'bias 는 입력과 곱해지지 않으므로 예측에 영향이 없다'
      answer: 0
      explanation: |
        bias 는 문턱에 마이너스를 붙인 수라서 $b$ 를 줄이는 것은 문턱을 높이는 것과 같다. 모든 입력의 $z$ 가 같은 양만큼 줄어 0 을 넘기
        어려워지므로 1 로 예측하는 입력이 줄어든다. 문턱이 낮아지는 것은 $b$ 를 키웠을 때다. 기울기는 weight 가 정하므로 bias 만 바꾸면 직선은 평행하게 옮겨질 뿐이다. bias 는 입력과
        상관없이 모든 $z$ 에 더해지므로 예측에 직접 영향을 준다.
    - question: |
        면접관: "bias 를 '늘 1 인 가짜 입력에 붙은 weight' 로 보면 무엇이 편해지나요?"
      choices:
        - '입력의 개수가 하나 줄어 계산이 간단해진다'
        - 'bias 가 1 로 고정되어 학습할 숫자가 줄어든다'
        - 'decision boundary 가 늘 원점을 지나게 된다'
        - 'weight 를 "오차 × 입력" 만큼 고치는 학습 규칙을 입력 자리에 1 을 넣어 bias 에도 그대로 쓸 수 있다'
      answer: 3
      explanation: |
        $z = w_1 x_1 + w_2 x_2 + b \times 1$ 로 보면 bias 는 입력이 늘 1 인 weight 와 같아서, 학습 규칙을 입력 자리에 1 을 넣어 그대로 쓴다.
        문턱을 따로 고치는 규칙이 필요 없다. 입력은 하나 줄어드는 것이 아니라 가짜 입력 하나만큼 늘어난다. 1 로 고정되는 것은 가짜
        입력이지 bias 값이 아니다. bias 가 있어야 직선이 원점을 벗어날 수 있으므로 원점을 지나게 된다는 보기는 반대로 말했다.

- topic: boundary
  title: decision boundary
  variants:
    - question: |
        면접관: "입력이 두 개인 perceptron 의 decision boundary $w_1 x_1 + w_2 x_2 + b = 0$ 은 평면 위의 직선입니다. weight 와 bias 는 이
        직선에서 각각 무엇을 정하나요?"
      choices:
        - 'weight 는 직선의 방향을 정하고, bias 는 직선의 위치를 정한다'
        - 'weight 는 직선의 위치를 정하고, bias 는 직선의 방향을 정한다'
        - 'weight 와 bias 가 함께 직선의 길이를 정한다'
        - 'bias 는 직선과 상관없고 예측의 확신도만 정한다'
      answer: 0
      explanation: |
        weight 를 고정하고 bias 만 바꾸면 직선은 기울기가 같은 평행선으로 옮겨질 뿐이므로 bias 는 위치를 정한다. 기울어진 정도는 $w_1$ 과
        $w_2$ 의 비율로 정해지므로 방향은 weight 가 정하고, 둘의 역할을 바꿔 말한 보기는 틀렸다. 직선은 끝없이 이어지므로 길이라는 것이
        없다. perceptron 의 출력은 0 또는 1 뿐이라 확신도 같은 값도 없다.
    - question: |
        면접관: "bias 를 0 으로 고정하고 weight 만 학습하는 perceptron 이 AND(두 입력이 모두 1 일 때만 1)를 풀지 못하는 이유는 무엇인가요?"
      choices:
        - 'weight 가 두 개뿐이라 숫자가 모자라기 때문이다'
        - 'AND 는 linearly separable 하지 않기 때문이다'
        - 'bias 가 0 이면 decision boundary 가 늘 원점을 지나는데, AND 를 가르는 직선은 원점을 지날 수 없기 때문이다'
        - 'bias 가 0 이면 학습 규칙이 weight 를 고치지 못하기 때문이다'
      answer: 2
      explanation: |
        $b = 0$ 이면 원점 $(0, 0)$ 의 $z$ 가 늘 0 이라 decision boundary 가 원점을 지난다. AND 는 $(1, 1)$ 하나만 1 쪽에 두어야 해서 원점에서
        떨어진 직선이 필요하고, 직선을 원점에서 떼어 옮기는 것이 bias 다. AND 는 linearly separable 하다. 숫자도 weight 두 개와 bias 하나면 충분하다.
        bias 가 0 이어도 학습 규칙은 weight 를 문제없이 고친다.
    - question: |
        면접관: "perceptron 의 $w_1, w_2, b$ 에 모두 같은 양수 10 을 곱했습니다. decision boundary 와 예측은 어떻게 되나요?"
      choices:
        - '직선이 원점에서 10 배 멀어진다'
        - '직선과 모든 예측이 그대로다. $z$ 는 10 배가 되지만 부호가 바뀌지 않는다'
        - '직선의 기울기가 10 배 가팔라진다'
        - '직선은 그대로지만 1 과 0 의 예측이 서로 뒤바뀐다'
      answer: 1
      explanation: |
        모든 숫자에 같은 양수를 곱하면 $z$ 도 그만큼 커질 뿐 부호는 하나도 바뀌지 않는다. 예측은 $z$ 의 부호만 보므로
        그대로이고, $10(w_1 x_1 + w_2 x_2 + b) = 0$ 의 양쪽을 10 으로 나누면 원래 직선과 같다. 그래서 원점에서 멀어지지도 기울기가 바뀌지도
        않는다. 1 과 0 이 뒤바뀌는 것은 음수를 곱했을 때다.

- topic: update-rule
  title: perceptron 학습 규칙
  variants:
    - question: |
        면접관: "perceptron 학습 규칙은 $w_i \leftarrow w_i + \eta(y - \hat y)x_i$, $b \leftarrow b + \eta(y - \hat y)$ 입니다. 예측이 정답과
        같은 sample 을 보면 무엇이 바뀌나요?"
      choices:
        - 'weight 만 조금 커진다'
        - 'bias 만 조금 작아진다'
        - '맞힌 쪽으로 더 확실해지도록 모든 숫자가 조금씩 커진다'
        - '아무것도 바뀌지 않는다. 오차 $y - \hat y$ 가 0 이라 더하는 양이 모두 0 이다'
      answer: 3
      explanation: |
        맞혔으면 $y - \hat y = 0$ 이라 모든 식에서 더하는 양이 0 이다. "틀린 sample 에서만 고친다" 는 따로 붙인 조건이 아니라 식에서 저절로
        나오는 성질이다. 맞혔을 때 weight 나 bias 중 하나만 바뀌는 경우는 없다. perceptron 의 출력은 0 또는 1 뿐이라 "더 확실해진다" 는 개념도 없다.
    - question: |
        면접관: "입력 $[x_1, x_2] = [0, 1]$ 에서 perceptron 이 틀렸습니다. 학습 규칙 $w_i \leftarrow w_i + \eta(y - \hat y)x_i$ 로 고칠 때
        $w_1$ 은 어떻게 되나요?"
      choices:
        - '오차 방향으로 $\eta$ 만큼 바뀐다'
        - '바뀌지 않는다. $x_1 = 0$ 이라 더하는 양이 0 이고, 이 예측에 $w_1$ 은 영향을 주지 않았다'
        - '$w_2$ 와 같은 양만큼 바뀐다'
        - '0 으로 초기화된다'
      answer: 1
      explanation: |
        $w_1$ 에 더하는 양은 $\eta(y - \hat y) \times x_1$ 인데 $x_1 = 0$ 이라 0 이다. 이 입력에서 $z$ 에 들어간 $w_1$ 몫은 $w_1 \times 0 = 0$
        이었으니 예측이 틀린 책임을 $w_1$ 에 물을 이유가 없다. 바뀌는 것은 입력이 1 인 $w_2$ 와 bias 뿐이다. weight 를 0 으로 되돌리는
        규칙은 없다.
    - question: |
        면접관: "정답이 1 인 입력을 0 으로 예측해 틀렸고, perceptron 학습 규칙으로 한 번 고쳤습니다. 고친 뒤 같은 입력을 바르게 설명한 것은
        무엇인가요?"
      choices:
        - '한 번 고쳤으니 이 입력은 반드시 맞힌다'
        - '$z$ 가 줄어든다'
        - '$z$ 는 정답 쪽으로 커지지만, 원래 $z$ 가 0 보다 한참 작았다면 아직 틀릴 수 있다'
        - 'weight 만 바뀌고 bias 는 그대로라서 $z$ 는 그대로다'
      answer: 2
      explanation: |
        오차가 $+1$ 이면 입력이 1 인 weight 와 bias 가 모두 커지므로 같은 입력의 $z$ 는 반드시 커진다. 하지만 커지는 양은 learning rate 에
        비례해서, 원래 $z$ 가 0 보다 한참 작았다면 0 을 넘지 못해 여러 번 더 틀려야 맞힐 수 있다. $z$ 가 줄어드는 것은 정답이 0 인데 1 로
        틀렸을 때다. bias 도 오차만큼 함께 고치므로 $z$ 가 그대로라는 보기도 틀렸다.

- topic: online-update
  title: epoch 와 online update
  variants:
    - question: |
        면접관: "perceptron 학습이 쓰는 online update 는 batch update 와 무엇이 다른가요?"
      choices:
        - 'epoch 가 끝날 때 모아 둔 수정량을 한꺼번에 더한다'
        - 'sample 하나를 틀리면 그 자리에서 바로 고쳐서, 같은 epoch 안에서도 뒤의 sample 은 고친 숫자로 예측한다'
        - '데이터를 처음 한 번만 보고 학습을 끝낸다'
        - '틀린 sample 이 있어도 epoch 가 끝날 때까지 예측에 쓰는 숫자는 그대로다'
      answer: 1
      explanation: |
        online update 는 sample 을 볼 때마다 틀렸으면 즉시 고치고, 다음 sample 은 그 고친 숫자로 예측한다. 수정량을 모았다가 epoch 끝에
        한꺼번에 더하는 것은 batch update 다. epoch 가 끝날 때까지 같은 숫자로 예측하는 것도 batch update 의 방식이다. online update 도 epoch 를 여러 번 되풀이하므로 한 번만 보고
        끝나는 것이 아니다.
    - question: |
        면접관: "perceptron 학습에서 epoch 마다 몇 번 틀렸는지 세어 수렴을 판단합니다. 각 sample 이 틀렸는지는 언제의 예측으로 세야 하나요?"
      choices:
        - '그 step 에서 숫자를 고치기 전의 예측으로 센다'
        - '숫자를 고친 직후 같은 입력으로 다시 예측한 결과로 센다'
        - 'epoch 중간의 숫자로 네 입력을 다시 예측해 센다'
        - '언제 세든 결과가 같으므로 상관없다'
      answer: 0
      explanation: |
        "이 숫자로 다 맞혔다" 를 확인하려면 예측에 실제로 쓴 숫자로 맞았는지를 세야 하므로 고치기 전의 예측으로 센다. 고친 직후 다시
        예측하면 방금 고친 그 입력은 맞기 쉬워서, 다른 입력을 모두 틀리는 숫자에서도 틀린 수가 0 이 되어 학습이 잘못 멈출 수 있다. epoch
        중간의 숫자로 다시 세면 실제 예측에 쓰지 않은 숫자를 보게 된다. 세는 시점에 따라 틀린 수가 달라지므로 상관없다는 보기도 틀렸다.
    - question: |
        면접관: "같은 데이터와 같은 learning rate, 같은 시작 숫자로 perceptron 을 online update 와 batch update 로 각각 학습했습니다. 두
        결과를 바르게 말한 것은 무엇인가요?"
      choices:
        - '고치는 시점만 다르므로 거치는 숫자와 최종 decision boundary 는 늘 같다'
        - 'batch update 는 perceptron 에서 수렴할 수 없다'
        - 'online update 가 언제나 더 적은 epoch 에 수렴한다'
        - '고치는 시점이 달라 틀리는 sample, 수렴 epoch, 찾는 decision boundary 가 서로 다를 수 있다'
      answer: 3
      explanation: |
        online 은 앞에서 고친 숫자로 다음 sample 을 예측하고 batch 는 epoch 동안 같은 숫자를 쓰므로, 같은 epoch 에서도 틀리는 sample 이
        달라지고 이후 경로가 갈린다. 그래서 둘 다 데이터를 가르는 직선을 찾더라도 서로 다른 직선일 수 있다. 데이터가 linearly separable
        하면 batch update 로도 수렴할 수 있다. 어느 쪽이 더 빠른지는 데이터에 따라 다르다.

- topic: lr-scale
  title: learning rate 의 크기와 학습 결과
  variants:
    - question: |
        면접관: "$w = [0, 0]$, $b = 0$ 에서 시작하는 perceptron 학습에서 learning rate 를 0.1 에서 1.0 으로 10 배 키웠습니다. sample
        순서와 다른 조건은 그대로입니다. 결과는 어떻게 되나요?"
      choices:
        - '한 번에 10 배 크게 고치므로 훨씬 적은 epoch 에 수렴한다'
        - '너무 크게 고쳐서 발산한다'
        - '모든 $z$, $w$, $b$ 가 정확히 10 배가 될 뿐, 틀리는 step·수렴 epoch·decision boundary 는 같다'
        - '수렴하는 epoch 는 같지만 decision boundary 가 다른 자리로 간다'
      answer: 2
      explanation: |
        시작 숫자가 모두 0 이면 처음부터 "10 배 관계" 가 성립하고, 숫자가 10 배이면 $z$ 도 10 배라 부호와 예측이 같다. 예측이 같으니 오차도
        같고 고치는 양만 10 배라서 이 관계가 학습 내내 이어진다. 그래서 틀리는 step 과 수렴 epoch 가 그대로다. 모든 숫자에 같은 양수를
        곱한 직선은 원래 직선과 같으므로 decision boundary 도 같은 자리에 있다. 예측은 부호만 보므로 숫자가 커진다고 학습이 발산하지도 않는다.
    - question: |
        면접관: "'learning rate 를 키우면 한 번에 많이 고치니 빨리 배운다' 는 생각이 $w$, $b$ 를 0 에서 시작한 perceptron 에서 틀린 이유는
        무엇인가요?"
      choices:
        - 'perceptron 학습 규칙에는 learning rate 가 없기 때문이다'
        - 'learning rate 가 크면 학습 규칙이 오차를 무시하기 때문이다'
        - 'perceptron 은 learning rate 가 클수록 오히려 느려지기 때문이다'
        - 'learning rate 가 모든 숫자에 곱해지는 공통 배율일 뿐이고, 예측은 $z$ 의 부호만 보므로 배율이 바뀌어도 판정이 같기 때문이다'
      answer: 3
      explanation: |
        0 에서 시작하면 learning rate 를 바꿔도 모든 숫자가 같은 비율로 커질 뿐이고, step function 은 $z$ 가 0 보다 큰지만 보므로 이 배율은
        어떤 판정도 바꾸지 못한다. perceptron 학습 규칙에는 learning rate $\eta$ 가 분명히 들어 있다. learning rate 가 커도 학습 규칙은 오차가
        0 이 아닐 때 고치므로 오차를 무시하지 않는다. 경로가 그대로이니 느려지지도 않는다.
    - question: |
        면접관: "perceptron 학습에서 learning rate 의 크기가 틀리는 step 이나 수렴 epoch 를 실제로 바꾸는 경우는 언제인가요?"
      choices:
        - '$w$, $b$ 를 0 이 아닌 숫자에서 시작할 때다. 시작 숫자에 비해 한 번에 고치는 크기가 learning rate 에 따라 달라진다'
        - '데이터가 linearly separable 할 때다'
        - '입력이 0 과 1 뿐일 때다'
        - '어떤 경우에도 바꾸지 않는다'
      answer: 0
      explanation: |
        시작 숫자가 0 이면 learning rate 는 크기만 바꾸지만, 0 이 아니면 두 학습의 시작 숫자가 같아 배율 관계가 처음부터 깨진다. learning
        rate 가 작으면 시작 숫자를 끌어당기는 데 여러 번 고쳐야 하고, 크면 시작 숫자의 영향이 금방 묻혀 경로가 달라진다. 데이터가 linearly
        separable 한지는 이 차이를 만드는 조건이 아니다. 입력이 0 과 1 뿐인지도 상관없다. 시작 숫자가 0 이 아니면 경로가 바뀌므로 "어떤
        경우에도 바꾸지 않는다" 도 틀렸다.

- topic: xor
  title: linearly separable 과 XOR
  variants:
    - question: |
        면접관: "데이터가 linearly separable 하다는 것은 무슨 뜻이고, perceptron 학습과는 어떤 관계가 있나요?"
      choices:
        - 'class 가 두 개뿐인 데이터를 말하며, class 가 두 개면 perceptron 은 늘 수렴한다'
        - '0 인 점과 1 인 점을 직선 하나로 완전히 가를 수 있다는 뜻이고, 이런 데이터에서 perceptron 학습은 유한 번 고친 뒤 반드시 수렴한다'
        - '점들이 한 직선 위에 놓여 있다는 뜻이다'
        - '입력이 서로 독립이라는 뜻이고, perceptron 의 수렴과는 관계없다'
      answer: 1
      explanation: |
        linearly separable 은 직선 하나를 그어 한쪽에는 1 인 점만, 반대쪽에는 0 인 점만 둘 수 있다는 뜻이다. 이런 직선이 하나라도 있으면
        perceptron 학습 규칙은 유한한 횟수만 틀린 뒤 수렴한다(Novikoff, 1962). XOR 처럼 class 가 두 개여도 직선으로 가를 수 없는 데이터가
        있다. 점들이 한 직선 위에 놓였다는 뜻도 아니다. 입력이 서로 독립인지는 이 개념과 관계가 없다.
    - question: |
        면접관: "XOR 는 $(0, 1)$ 과 $(1, 0)$ 이 1 이고 $(0, 0)$ 과 $(1, 1)$ 이 0 입니다. 어떤 직선으로도 이 네 점을 가를 수 없는 이유를
        설명해 보세요."
      choices:
        - '점이 네 개라 직선 하나로 나누기에는 너무 많기 때문이다'
        - '1 인 점과 0 인 점의 개수가 같기 때문이다'
        - '좌표가 0 과 1 뿐이라 직선의 기울기를 정할 수 없기 때문이다'
        - '1 인 두 점을 잇는 선분과 0 인 두 점을 잇는 선분이 가운데에서 만나, 그 점이 양쪽에 동시에 속해야 하기 때문이다'
      answer: 3
      explanation: |
        직선의 한쪽에 두 점이 있으면 둘을 잇는 선분 전체도 같은 쪽에 있다. XOR 에서는 1 인 두 점의 선분과 0 인 두 점의 선분이 $(0.5, 0.5)$
        에서 엇갈리므로, 이 점이 1 쪽이면서 0 쪽이어야 하는 모순이 생긴다. 같은 네 점이라도 AND 와 OR 는 직선으로 가를 수 있으니 점이 네
        개라는 것은 원인이 아니다. $(1, 0)$ 과 $(1, 1)$ 만 1 인 데이터도 1 인 점과 0 인 점이 둘씩이지만 세로선 $x_1 = 0.5$ 로 갈린다. 좌표가
        0 과 1 뿐인 AND 도 weight 로 기울기를 정한 직선 $x_1 + x_2 = 1.5$ 로 갈렸다.
    - question: |
        면접관: "XOR 데이터에 perceptron 학습 규칙을 계속 적용하면 어떻게 되나요?"
      choices:
        - '오래 학습하면 결국 수렴한다'
        - 'learning rate 를 충분히 줄이면 수렴한다'
        - '수렴하지 못하고, 매 epoch 틀리면서 같은 숫자들을 오가는 순환에 빠진다'
        - '숫자가 끝없이 커져 inf 로 발산한다'
      answer: 2
      explanation: |
        XOR 를 가르는 직선이 없으니 한 epoch 동안 한 번도 틀리지 않는 일이 생길 수 없고, 그래서 아무리 오래 학습해도 수렴하지 않는다.
        실제로 학습해 보면 몇 epoch 뒤부터 숫자가 몇 가지 상태를 거쳐 처음 상태로 돌아오는 순환을 되풀이하므로, 학습 코드는 epoch 수에
        상한을 둔다. learning rate 를 줄여도 모든 숫자가 같은 비율로 작아질 뿐 순환은 그대로다. 숫자는 같은 상태들을 오갈 뿐 끝없이
        커지지 않으므로 inf 로 발산하지도 않는다.

- topic: multilayer
  title: hidden layer, activation function, MLP
  variants:
    - question: |
        면접관: "perceptron 하나로는 풀 수 없는 XOR 를 perceptron 을 두 층으로 쌓으면 표현할 수 있습니다. 왜 그런가요?"
      choices:
        - '첫 층의 unit 들이 직선을 여러 개 긋고, 둘째 층이 그 결과를 조합해 직선 하나로는 못 만드는 영역을 만들기 때문이다'
        - '층을 쌓으면 각 unit 의 decision boundary 가 저절로 곡선이 되기 때문이다'
        - '두 층이면 perceptron 학습 규칙이 XOR 에서도 수렴하도록 바뀌기 때문이다'
        - 'unit 이 많아지면 step function 이 0 과 1 사이의 값도 내기 때문이다'
      answer: 0
      explanation: |
        예를 들어 첫 층에서 OR 와 NAND 를 맡은 두 unit 이 직선 두 개를 긋고, 둘째 층이 두 결과의 AND 를 내면 두 직선 사이의 띠 영역만 1 이
        되어 XOR 와 맞는다. 층을 쌓아도 각 unit 의 경계는 여전히 직선이고, 직선들의 조합이 띠 같은 영역을 만든다. 이 숫자는 사람이 손으로 정한
        것이고, 두 층이 되었다고 학습 규칙이 바뀌지는 않는다. step function 을 쓰는 unit 의 출력은 unit 이 많아져도 0 또는 1 이다.
    - question: |
        면접관: "두 층 perceptron network 의 숫자를 데이터로 학습시키려 할 때, perceptron 학습 규칙도 gradient descent 도 그대로는 쓸 수
        없었습니다. 두 가지 이유를 고르면 무엇인가요?"
      choices:
        - 'hidden layer 의 unit 에는 weight 가 없고, step function 은 계산이 느리기 때문이다'
        - 'hidden layer 의 입력이 0 과 1 이 아니고, gradient descent 는 출력이 하나인 모델에만 쓰이기 때문이다'
        - 'hidden unit 의 정답이 데이터에 없어 학습 규칙을 쓸 수 없고, step function 은 거의 모든 곳에서 derivative 가 0 이라 gradient descent 가 고칠 방향을 알 수 없기 때문이다'
        - 'hidden layer 의 숫자는 학습하면 안 되고, step function 의 출력이 음수가 될 수 있기 때문이다'
      answer: 2
      explanation: |
        perceptron 학습 규칙은 그 unit 의 정답과 예측의 차이로 고치는데, 데이터에 있는 정답은 최종 출력뿐이라 hidden unit 의 정답이
        없다(credit assignment 문제). gradient descent 는 숫자를 조금 바꿨을 때 출력이 변하는 비율로 방향을 정하는데, step function 은 $z$
        의 부호가 바뀌지 않는 한 출력이 그대로라 이 비율이 거의 어디서나 0 이다. 그래서 sigmoid 같은 매끄러운 activation function 과
        backpropagation 이 필요했다. hidden unit 에도 weight 가 있고 step function 의 계산은 느리지 않으므로, weight 가 없다거나 느리다는 보기는 틀렸다.
        gradient descent 는 출력이 여럿인 모델에도 쓸 수 있고, 입력이 0 과 1 인지는 학습할 수 있는지와 관계가 없다. hidden layer 의
        숫자도 학습해야 하고, step function 의 출력은 0 또는 1 이라 음수가 나오지 않는다.
    - question: |
        면접관: "보행 로봇의 policy 로 쓰는 MLP 의 hidden unit 하나는 perceptron 과 무엇이 같고 무엇이 다른가요?"
      choices:
        - '같은 점은 없다. MLP 의 unit 은 입력을 곱하지 않고 그대로 이어 붙인다'
        - '입력마다 weight 를 곱해 더하고 bias 를 더하는 계산은 같고, 그 값을 step function 대신 ELU 같은 매끄러운 activation function 에 넣어 실수를 내며 backpropagation 으로 학습한다는 점이 다르다'
        - '계산과 학습 방법이 모두 같고, 층의 개수만 다르다'
        - 'activation function 을 쓰지 않는다는 점만 다르다. 층이 많으면 activation function 없이도 직선 아닌 경계가 생긴다'
      answer: 1
      explanation: |
        MLP 의 unit 도 perceptron 처럼 입력마다 weight 를 곱해 더하고 bias 를 더한 weighted sum $z$ 를 계산하므로, 같은 점이 없다는 보기는
        틀렸다. 다만 $z$ 를 step function 대신 sigmoid·ReLU·ELU 같은 매끄러운 activation function 에 넣어 0 과 1 이 아닌 실수를 낸다. 그
        덕분에 derivative 를 구할 수 있어서 backpropagation 으로 hidden layer 까지 학습한다. perceptron 학습 규칙으로는 hidden unit 을 고칠 수 없으니 학습 방법이 같다는 보기는 틀렸다. activation function 이
        없으면 weighted sum 을 여러 번 거듭해도 weighted sum 하나라서 경계가 여전히 직선이다.
