<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pipeline 지연 동안 차가 가는 거리. 거리는 속도 × 지연이라 30, 50, 100 km/h 마다 직선이 된다. 50 km/h 에서 0.1 초면 1.39 m, 0.33 초면 4.6 m, UniAD 한 frame 인 0.56 초면 7.7 m 를 간다</title>
