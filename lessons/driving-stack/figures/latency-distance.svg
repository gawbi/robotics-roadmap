  <text x="690.0" y="168.0" fill="#94a3b8" font-size="11.5" text-anchor="start">Lin 등이 제시한 처리 지연 상한</text>
  <text x="690.0" y="196.0" fill="#f59e0b" font-size="12.5" text-anchor="start" font-weight="600">0.33 초</text>
