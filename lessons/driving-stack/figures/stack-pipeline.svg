<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>자율주행 stack 의 module. Sensing, Localization, Perception, Prediction, Planning, Control 이 차례로 이어져 Vehicle 에 명령을 내고, Map 의 point cloud map 은 localization 이, Lanelet2 는 perception·prediction·planning 이 쓴다. Autoware 기본값으로 EKF 는 50 Hz, planning 은 10 Hz, control 은 0.03 초마다 계산한다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker></defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="87.5" y="178.0" fill="#7cb4d8" font-size="14" text-anchor="middle" font-weight="600">Sensing</text>
  <text x="87.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">LiDAR·camera·IMU</text>
  <text x="87.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">LiDAR 10 Hz</text>
  <rect x="165" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#cf96b8" stroke-width="1.5"/>
  <text x="232.5" y="178.0" fill="#cf96b8" font-size="14" text-anchor="middle" font-weight="600">Localization</text>
  <text x="232.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">NDT + EKF</text>
  <text x="232.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">50 Hz</text>
  <rect x="310" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="377.5" y="178.0" fill="#d6aa62" font-size="14" text-anchor="middle" font-weight="600">Perception</text>
  <text x="377.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">detection·tracking</text>
  <text x="377.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">물체 목록</text>
  <rect x="455" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="522.5" y="178.0" fill="#d6aa62" font-size="14" text-anchor="middle" font-weight="600">Prediction</text>
  <text x="522.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">물체의 미래 경로</text>
  <text x="522.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">15 초 앞까지</text>
  <rect x="600" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="667.5" y="178.0" fill="#7fc4a2" font-size="14" text-anchor="middle" font-weight="600">Planning</text>
  <text x="667.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">behavior + motion</text>
  <text x="667.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">10 Hz, 10 초 trajectory</text>
  <rect x="745" y="150" width="135" height="78" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="812.5" y="178.0" fill="#a99ad6" font-size="14" text-anchor="middle" font-weight="600">Control</text>
  <text x="812.5" y="198.0" fill="#e2e8f0" font-size="11.5" text-anchor="middle">steering·속도 명령</text>
  <text x="812.5" y="216.0" fill="#94a3b8" font-size="11" text-anchor="middle">33 Hz (0.03 초)</text>
  <line x1="156.0" y1="189.0" x2="163.0" y2="189.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="301.0" y1="189.0" x2="308.0" y2="189.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="446.0" y1="189.0" x2="453.0" y2="189.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="591.0" y1="189.0" x2="598.0" y2="189.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="736.0" y1="189.0" x2="743.0" y2="189.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="745" y="300" width="135" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="812.0" y="330.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">Vehicle</text>
  <line x1="812.0" y1="230.0" x2="812.0" y2="297.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="250" y="30" width="420" height="56" rx="8" fill="#111a2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="460.0" y="54.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">Map</text>
  <text x="460.0" y="74.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">point cloud map (PCD) · vector map (Lanelet2)</text>
  <line x1="260.0" y1="88.0" x2="232.0" y2="147.0" stroke="#cf96b8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ap)"/>
  <text x="205.0" y="118.0" fill="#cf96b8" font-size="11" text-anchor="middle">PCD</text>
  <line x1="378.0" y1="88.0" x2="378.0" y2="147.0" stroke="#7fc4a2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <line x1="522.0" y1="88.0" x2="522.0" y2="147.0" stroke="#7fc4a2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <line x1="650.0" y1="88.0" x2="667.0" y2="147.0" stroke="#7fc4a2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="560.0" y="118.0" fill="#7fc4a2" font-size="11" text-anchor="middle">Lanelet2</text>
  <path d="M232,230 L232,268 L812,268" fill="none" stroke="#cf96b8" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="378.0" y1="268.0" x2="378.0" y2="232.0" stroke="#cf96b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ap)"/>
  <line x1="667.0" y1="268.0" x2="667.0" y2="232.0" stroke="#cf96b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ap)"/>
  <line x1="790.0" y1="268.0" x2="790.0" y2="232.0" stroke="#cf96b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ap)"/>
  <text x="470.0" y="285.0" fill="#cf96b8" font-size="11.5" text-anchor="middle">자기 위치(pose)는 인지·계획·제어가 모두 받아 쓴다</text>
  <text x="380.0" y="335.0" fill="#94a3b8" font-size="12" text-anchor="middle">LiDAR 가 한 바퀴 돌 때마다 왼쪽 module 부터 차례로 한 번씩 계산한다</text>
  <text x="380.0" y="358.0" fill="#94a3b8" font-size="12" text-anchor="middle">각 module 은 ROS 2 node 묶음이고, 화살표는 topic 이다</text>
</svg>
