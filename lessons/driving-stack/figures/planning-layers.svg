<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>planning 의 세 층과 motion planning 이 만든 속도. mission planning 이 lanelet route 를, behavior planning 이 path 와 멈출 곳을, motion planning 이 시간에 따른 속도를 정한다. 30 m 앞 장애물에 5 m 여유를 두고 25 m 에 서려면, 4.17 m/s 에서 1.0 m/s² 로 감속하는 데 8.7 m 가 필요해 16.3 m 에서 감속을 시작한다</title>
