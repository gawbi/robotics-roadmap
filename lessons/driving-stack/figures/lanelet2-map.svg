<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Lanelet2 지도. lanelet A 는 왼쪽 경계와 오른쪽 경계 linestring 두 개로 정해지고, 끝에 신호등과 stop line 이 regulatory element 로 붙어 있다. A 다음에는 직진 lanelet B 와 우회전 lanelet C 가 이어지고, route 는 A 에서 B 로 가는 lanelet 의 줄이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f472b6"/></marker></defs>
  <rect x="1" y="1" width="898" height="438" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="60" y="180" width="360" height="70" fill="#34d399" fill-opacity="0.13"/>
  <rect x="420" y="180" width="420" height="70" fill="#38bdf8" fill-opacity="0.09"/>
  <path d="M420,250 A70,70 0 0 1 490,320 L490,430 L560,430 L560,320 A140,140 0 0 0 420,180 Z" fill="#f59e0b" fill-opacity="0.10"/>
  <line x1="60.0" y1="120.0" x2="840.0" y2="120.0" stroke="#64748b" stroke-width="2"/>
  <line x1="60.0" y1="180.0" x2="840.0" y2="180.0" stroke="#e2e8f0" stroke-width="2.2"/>
  <line x1="60.0" y1="250.0" x2="420.0" y2="250.0" stroke="#e2e8f0" stroke-width="2.2"/>
  <line x1="560.0" y1="250.0" x2="840.0" y2="250.0" stroke="#e2e8f0" stroke-width="2.2"/>
  <path d="M420,250 A70,70 0 0 1 490,320 L490,430" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
  <path d="M560,430 L560,320 A140,140 0 0 0 420,180" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4 4"/>
  <circle cx="60" cy="180" r="4" fill="#e2e8f0"/>
  <circle cx="60" cy="250" r="4" fill="#e2e8f0"/>
  <circle cx="180" cy="180" r="4" fill="#e2e8f0"/>
  <circle cx="180" cy="250" r="4" fill="#e2e8f0"/>
  <circle cx="300" cy="180" r="4" fill="#e2e8f0"/>
  <circle cx="300" cy="250" r="4" fill="#e2e8f0"/>
  <circle cx="420" cy="180" r="4" fill="#e2e8f0"/>
  <circle cx="420" cy="250" r="4" fill="#e2e8f0"/>
  <text x="240.0" y="170.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">left bound (linestring)</text>
  <text x="240.0" y="270.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">right bound (linestring)</text>
  <text x="240.0" y="213.0" fill="#34d399" font-size="14" text-anchor="middle" font-weight="600">lanelet A</text>
  <text x="700.0" y="213.0" fill="#38bdf8" font-size="14" text-anchor="middle" font-weight="600">lanelet B (직진)</text>
  <text x="575.0" y="405.0" fill="#f59e0b" font-size="13" text-anchor="start" font-weight="600">lanelet C (우회전)</text>
  <line x1="80.0" y1="235.0" x2="830.0" y2="235.0" stroke="#34d399" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="760.0" y="229.0" fill="#34d399" font-size="11.5" text-anchor="middle">route</text>
  <line x1="410.0" y1="184.0" x2="410.0" y2="246.0" stroke="#f87171" stroke-width="4"/>
  <text x="404.0" y="270.0" fill="#f87171" font-size="11.5" text-anchor="end">stop line</text>
  <rect x="436" y="72" width="16" height="34" rx="3" fill="#111a2e" stroke="#f87171"/>
  <circle cx="444" cy="82" r="4" fill="#f87171"/>
  <circle cx="444" cy="96" r="4" fill="#64748b"/>
  <text x="460.0" y="94.0" fill="#f87171" font-size="12" text-anchor="start">traffic light</text>
  <path d="M250,350 C 330,350 395,320 407,256" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <path d="M300,335 C 360,200 420,140 436,96" fill="none" stroke="#f87171" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text x="80.0" y="360.0" fill="#f87171" font-size="12.5" text-anchor="start" font-weight="600">regulatory element</text>
  <text x="80.0" y="380.0" fill="#f87171" font-size="12" text-anchor="start">신호등 + stop line, lanelet A 에 붙는다</text>
  <text x="450.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle">lanelet = 왼쪽 경계 linestring 하나 + 오른쪽 경계 linestring 하나</text>
  <text x="450.0" y="52.0" fill="#94a3b8" font-size="12" text-anchor="middle">A 다음에는 B 와 C 가 이어지고, route 는 A → B 를 고른 것</text>
</svg>
