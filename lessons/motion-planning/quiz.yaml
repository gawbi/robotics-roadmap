# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: configuration-space
  title: configuration space 와 C-obstacle
  variants:
    - question: |
        로봇팔 motion planning 에서 configuration space 의 점 하나는 무엇을 뜻하는가?
      choices:
        - '손끝(end-effector)이 놓일 수 있는 3D 위치 하나'
        - '모든 관절 각도를 정한 팔의 자세 하나'
        - '장애물 하나의 위치와 크기'
        - '경로 위의 한 시각과 그때의 속도'
      answer: 1
      explanation: |
        configuration 은 관절 각도를 모은 묶음이라서, C-space 의 점 하나는 팔 전체의 모양이 정해진 자세 하나다. 손끝 위치는 작업 공간의 점이고,
        같은 손끝 위치에도 여러 자세가 있을 수 있다. 장애물은 C-space 에서 C-obstacle 영역으로 나타나고, 시각과 속도는 trajectory 의 정보다.
    - question: |
        작업 공간에서는 둥근 기둥 하나인데, 2 관절 팔의 C-space 에 그리면 C-obstacle 이 비스듬한 긴 띠 모양이 된다. 왜 그런가?
      choices:
        - 'C-space 그림의 축 눈금이 작업 공간과 다르게 늘어나 있어서 원이 타원으로 보이는 것이다'
        - '팔이 기둥에 닿을 때마다 기둥이 조금씩 밀려나, 닿는 자리가 옮겨 가기 때문이다'
        - '첫 관절 각도가 바뀌면 둘째 link 가 기둥에 닿는 둘째 관절 각도도 함께 바뀌기 때문이다'
        - 'C-obstacle 은 손끝이 기둥 안에 들어가는 자세만 모은 것이라 모양이 기둥과 무관하다'
      answer: 2
      explanation: |
        C-obstacle 은 팔의 어느 부분이든 기둥에 닿는 자세의 모임이다. θ₁ 을 돌리면 link 2 가 기둥을 가리키게 되는 θ₂ 범위도 따라 옮겨 가므로
        모양이 비스듬한 띠가 된다. 축 눈금이 늘어나서 생기는 모양이 아니고, 기둥은 움직이지 않는다. C-obstacle 에는 손끝뿐 아니라 link 몸통이
        닿는 자세도 모두 들어간다.
    - question: |
        시작 자세와 목표 자세를 관절마다 일정한 비율로 보간했더니 손끝은 장애물을 피해 갔는데 팔꿈치가 장애물에 닿았다. 무엇을
        잘못 생각한 걸까?
      choices:
        - '손끝이 장애물을 피하면 팔 전체도 안전하다고 본 것이다. 충돌은 모든 link 로 따져야 한다'
        - '관절을 보간한 것이 잘못이다. 손끝을 직선으로 움직이면 팔꿈치 충돌이 항상 사라진다'
        - '보간 속도를 너무 빠르게 잡은 것이다. 속도를 줄이면 팔꿈치가 장애물을 비켜 간다'
        - 'IK 로 구한 목표 자세를 믿은 것이다. 목표 자세를 다시 구하면 해결된다'
      answer: 0
      explanation: |
        손끝의 길만 보면 link 몸통의 충돌을 놓친다. C-space 에서 경로가 C-obstacle 을 지나는지 검사해야 팔 전체가 안전하다. 손끝 직선 이동도
        중간 자세의 팔꿈치 위치를 보장하지 않고, 속도는 기하학적 충돌 여부와 관계없다. 시작과 목표 자세가 맞아도 그 사이의 경로가 충돌할 수 있다.

- topic: dimensionality
  title: 관절 수와 grid 의 크기
  variants:
    - question: |
        2 관절 팔은 C-space 를 grid 로 나눠 A* 로 풀 수 있는데, 7 관절 팔에서는 왜 그렇게 하지 않는가?
      choices:
        - '7 관절 팔은 관절 공간의 거리를 정할 수 없어 A* 의 heuristic 을 정의할 수 없어서'
        - '7 관절 팔의 C-space 는 연속이 아니라 끊긴 조각이라서 칸으로 나눌 수 없어서'
        - 'grid 는 장애물이 움직일 때만 쓸 수 없고, 정지 장면이면 7 관절도 문제없다'
        - '칸 수가 관절 수에 대해 지수적으로 늘어, 7 관절이면 칸이 수백억 개가 되기 때문이다'
      answer: 3
      explanation: |
        관절마다 칸이 36 개면 전체 칸 수는 36ⁿ 이라 관절이 하나 늘 때마다 36 배가 된다. 7 관절이면 약 784억 칸이고, 칸마다 충돌 검사가 필요하다.
        heuristic 은 관절 공간 거리로 정의할 수 있고, C-space 는 연속 공간이라 칸으로 나눌 수는 있지만 칸이 너무 많다. 정지 장면이어도 칸 수 문제는 같다.
    - question: |
        관절마다 360° 를 10° 칸으로 나누던 grid 를 20° 칸으로 바꿨다. 6 관절 팔의 전체 칸 수는 몇 분의 1 이 될까?
      choices:
        - '2 분의 1'
        - '12 분의 1'
        - '64 분의 1'
        - '36 분의 1'
      answer: 2
      explanation: |
        관절 하나에서 칸 수가 36 에서 18 로 절반이 되고, 전체 칸 수는 관절마다의 칸 수를 곱한 값이라 6 관절이면 2⁶ = 64 분의 1 이다. 2 분의 1 은
        관절 하나만 볼 때의 비율이고, 12 는 2 를 여섯 번 곱해야 할 것을 여섯 번 더한 값(2 × 6)이다. 칸이 성겨지면 장애물을 놓치기도 쉬워진다.
    - question: |
        sampling-based planner 는 C-space 를 어떻게 다루기에 7 관절 팔에서도 쓸 수 있는가?
      choices:
        - 'C-space 전체를 미리 표로 만들되, 압축해서 7 관절이어도 메모리에 들어가게 한다'
        - '무작위로 고른 자세와 그 사이 선분에 대해서만 그때그때 충돌 여부를 묻는다'
        - '관절 7 개 가운데 많이 움직이는 2 개만 골라 2 차원 C-space 로 줄여서 푼다'
        - '작업 공간에서 손끝 경로만 찾고, 관절 각도는 나중에 IK 로 구한다'
      answer: 1
      explanation: |
        PRM 과 RRT 는 필요한 자세만 골라 그때그때 충돌을 묻기 때문에 차원이 높아도 메모리가 칸 수에 묶이지 않는다. 표를 압축해도 칸마다 검사하는
        계산은 그대로다. 관절을 줄이면 원래 문제를 풀지 못하고, 손끝 경로만 보면 link 몸통의 충돌을 놓친다.

- topic: collision-checking
  title: collision checking 의 모양과 padding
  variants:
    - question: |
        URDF 에서 visual mesh 와 별도로 단순한 collision mesh 나 primitive 를 쓰는 이유는 무엇인가?
      choices:
        - 'RViz 가 화면에 그릴 때 collision mesh 를 쓰므로 그리는 속도를 높이려고'
        - 'collision mesh 가 visual mesh 보다 실제 모양에 더 정확하기 때문이다'
        - 'planner 가 충돌 검사를 아주 많이 부르므로 한 번의 검사 비용을 줄이려고'
        - 'primitive 에는 padding 을 줄 수 없어서 실제 모양 그대로 검사할 수 있으므로'
      answer: 2
      explanation: |
        sampling-based planner 는 경로 하나에 충돌 검사를 수백 ~ 수천 번 부르므로 검사 비용이 전체 속도를 정한다. 예를 들어 Panda 의 link0 는
        visual mesh 가 삼각형 20,483 개, collision mesh 가 200 개다. collision 모양은 그리기용이 아니고, 보통 실제보다 단순하고 약간 크다.
        primitive 에도 padding 을 줄 수 있다.
    - question: |
        충돌 여유를 넉넉히 두려고 robot padding 을 크게 키웠더니, 전에 되던 planning 이 실패한다. 가능한 원인은?
      choices:
        - 'padding 을 바꾸면 OMPL 의 무작위 seed 도 바뀌어서, 이번에 표본이 틈을 놓쳐 운이 나빴던 것이다'
        - 'padding 이 틈보다 커져 C-free 가 끊겼거나, 시작 자세가 이미 충돌로 판정된 것이다'
        - 'padding 은 visual mesh 에만 적용되므로, 실패는 padding 과 무관한 다른 원인이다'
        - 'padding 을 키우면 planning 시간 기본값이 자동으로 줄어 시간 안에 못 찾는다'
      answer: 1
      explanation: |
        padding 은 모양을 사방으로 키워 C-obstacle 을 넓힌다. 틈보다 크면 갈 수 있는 길 자체가 사라지고, 시작 자세가 padding 안에 들어가면 planner 를
        부르기 전에 시작 상태 충돌로 거절된다. seed 운이나 planning 시간 기본값과는 관계없고, padding 은 collision 모양에 적용된다.
    - question: |
        MoveIt 2 에서 longest_valid_segment_fraction 을 크게 키우면 어떤 일이 생길 수 있는가?
      choices:
        - '선분을 더 성기게 검사해 빨라지지만, 얇은 물체와의 충돌을 놓칠 수 있다'
        - '두 자세 사이 선분을 더 촘촘하게 검사하게 되어 planning 이 느려진다'
        - 'RRT 의 goal bias 가 함께 커져서 tree 가 목표 쪽으로만 자란다'
        - 'link 끼리 맞닿는 것을 허용하는 값이라 self-collision 검사가 꺼진다'
      answer: 0
      explanation: |
        이 값은 C-space 크기 대비 몇 분의 1 마다 선분 위 자세를 검사할지 정한다. 크게 하면 검사 간격이 넓어져 빨라지지만 간격 사이에 낀 얇은
        물체를 놓친다. 촘촘해지는 것은 값을 줄일 때의 일이다. goal bias 와 self-collision 설정은 별개의 parameter 다.

- topic: allowed-collision-matrix
  title: self-collision 과 allowed collision matrix
  variants:
    - question: |
        SRDF 의 disable_collisions(allowed collision matrix)는 무엇을 위해 쓰는가?
      choices:
        - '로봇이 작업 중에 주변 물체와 부딪혀도 되는 영역을 정해서 그 영역을 충돌 검사에서 뺀다'
        - '관절 한계를 넘어도 되는 관절을 정해 planner 가 더 넓은 범위를 쓰게 한다'
        - 'controller 가 따라가며 무시해도 되는 관절 오차의 크기를 정한다'
        - '늘 맞닿거나 절대 닿을 수 없는 link 쌍의 self-collision 검사를 끈다'
      answer: 3
      explanation: |
        link 가 n 개면 쌍이 n(n−1)/2 개인데, 관절로 이어진 이웃 쌍은 늘 맞닿아 있고 어떤 쌍은 관절 범위 안에서 닿을 수 없다. 이런 쌍을 끄면
        자세마다의 검사가 줄고, 늘 닿아 있는 쌍 때문에 모든 자세가 충돌로 판정되는 일도 막는다. 주변 물체, 관절 한계, controller 오차와는 관계없다.
    - question: |
        collision 모양이 있는 link 가 11 개인 팔이 있다. self-collision 을 검사할 수 있는 link 쌍은 모두 몇 개일까?
      choices:
        - '110 개'
        - '11 개'
        - '55 개'
        - '121 개'
      answer: 2
      explanation: |
        서로 다른 두 link 를 고르는 경우의 수는 11 × 10 ÷ 2 = 55 다. 110 은 순서를 구분해 같은 쌍을 두 번 센 값이고, 121 은 자기 자신과의 쌍까지
        넣은 11² 이고, 11 은 link 수다. 이 가운데 ACM 으로 끈 쌍을 빼면 실제로 검사하는 쌍이 된다.
    - question: |
        MoveIt Setup Assistant 가 'Never' 로 표시한 link 쌍을 그대로 끄면 위험할 수 있는 경우는?
      choices:
        - 'Never 쌍은 관절로 이어진 이웃 link 라서 끄면 항상 안전하고 위험한 경우가 없다'
        - 'Never 쌍을 끄면 그 link 들과 주변 물체 사이의 충돌 검사도 함께 꺼진다'
        - 'Never 쌍은 기본 자세에서 이미 닿아 있는 쌍이라 끄면 시작 자세 충돌이 생긴다'
        - '자세 표본이 적으면 드물게 닿는 쌍이 한 번도 안 닿아 Never 로 꺼질 수 있다'
      answer: 3
      explanation: |
        Never 는 무작위 자세에서 한 번도 닿지 않았다는 통계 결과일 뿐 증명이 아니다. 표본이 적으면 드문 충돌을 놓치므로 문서는 sampling density 를
        높이라고 권하고, gripper 를 바꾸면 표를 다시 만든다. 이웃 쌍은 Adjacent 로 표시하고 기본 자세에서 닿은 쌍은 Default 로 표시하며, ACM 은
        link 사이의 검사만 끈다.

- topic: prm-and-rrt
  title: PRM 과 RRT
  variants:
    - question: |
        같은 작업 셀에서 장애물은 거의 그대로이고 출발·목표만 바꿔 가며 수백 번 planning 해야 한다. PRM 과 RRT 중 어느 쪽이 유리하고, 그 이유는 무엇인가?
      choices:
        - 'PRM. 한 번 만든 roadmap 에 출발·목표만 이어 붙이고 graph search 하면 된다'
        - 'RRT. 지난 질문에서 키운 tree 를 그대로 이어 키우므로 이전 계산을 다시 쓸 수 있다'
        - 'RRT. PRM 은 roadmap 에 없는 길을 찾지 못해 probabilistically complete 하지 않다'
        - '둘 다 같다. sampling-based planner 는 이전 계산을 다시 쓸 수 없다'
      answer: 0
      explanation: |
        PRM 은 learning phase 에서 만든 roadmap 을 query phase 마다 다시 쓰는 multi-query 방법이라 장면이 그대로면 유리하다. RRT 는 질문 하나를
        빨리 푸는 single-query 방법으로 매번 새로 시작하므로 이전 계산을 다시 쓰지 않는다. 두 방법 모두 probabilistically complete 하다.
    - question: |
        RRT 에서 tree 의 가장 가까운 점이 q_near = (0°, 0°), 무작위 점이 q_rand = (60°, 80°), step 길이 ε = 20° 다. 새로 만드는 점 q_new 는?
      choices:
        - '(60°, 80°)'
        - '(20°, 20°)'
        - '(10°, 10°)'
        - '(12°, 16°)'
      answer: 3
      explanation: |
        방향 (60, 80) 의 길이는 √(60² + 80²) = 100 이고, 20° 만큼만 가므로 (60, 80) × 20 ÷ 100 = (12, 16) 이다. q_rand 까지 바로 가는 것은 거리가
        ε 이하일 때뿐이고, (20, 20) 은 축마다 20 씩 더해 길이가 28.3° 가 되므로 ε 을 넘는다. (10, 10) 은 방향도 길이도 맞지 않는다.
    - question: |
        RRT-Connect 가 기본 RRT 보다 빨리 경로를 찾는 경우가 많은 이유는?
      choices:
        - '무작위 표본 대신 grid 위의 점만 써서 같은 자리를 두 번 뽑지 않기 때문이다'
        - '출발과 목표에서 tree 를 키우고, 한쪽이 점을 붙이면 다른 쪽이 막힐 때까지 그 점으로 뻗어서'
        - '새 점을 붙일 때마다 rewire 로 둘레 점의 부모를 바꿔, 더 짧은 경로로 다듬어 가기 때문이다'
        - '충돌 검사를 하지 않고 경로를 먼저 찾은 뒤 마지막에 한 번만 검사하기 때문이다'
      answer: 1
      explanation: |
        RRT-Connect 는 양쪽에서 tree 를 키우고 connect 단계에서 막힐 때까지 계속 뻗어 트인 공간에서 두 tree 를 몇 번 만에 잇는다. 여전히 무작위
        표본을 쓰고, rewire 는 RRT* 의 특징이다. 새 점과 선분마다 충돌을 검사한다.

- topic: completeness-and-quality
  title: probabilistic completeness 와 경로 품질
  variants:
    - question: |
        RRT 가 probabilistically complete 하다는 것은 무슨 뜻이고, 실무에서 어떤 한계가 있는가?
      choices:
        - '항상 가장 짧은 경로를 찾는다는 뜻이고, 그 대가로 시간이 오래 걸린다는 한계가 있다'
        - '길이 없으면 정해진 시간 안에 반드시 없다고 증명해 주므로 실패 원인을 바로 알 수 있다'
        - '길이 있으면 표본이 늘수록 찾을 확률이 1 로 가지만, 길이 없다는 것은 증명하지 못한다'
        - '한 번 찾은 경로는 장애물이 움직여도 계속 안전하다는 뜻이고, 한계는 계산 시간뿐이다'
      answer: 2
      explanation: |
        probabilistic completeness 는 해가 있을 때 찾을 확률이 시간에 따라 1 로 간다는 성질이다. 길이 없으면 planner 는 시간 한도를 다 쓰고
        실패를 돌려줄 뿐이고, 좁은 틈은 표본이 그 안에 떨어질 확률이 작아 오래 걸린다. 최적성과는 별개이고, 장면이 바뀌면 경로를 다시 검사해야 한다.
    - question: |
        RRT-Connect 가 장애물을 크게 돌아가는 경로를 냈다. shortcutting 을 아무리 많이 해도 반대쪽의 훨씬 짧은 길에 닿지 못하는
        이유는?
      choices:
        - 'shortcut 은 경로 모양은 그대로 두고 시간 축만 늘려 속도를 줄이는 처리이기 때문이다'
        - 'shortcut 은 두 점을 직선으로 잇기만 해서 장애물 반대쪽으로 넘어가지 못하기 때문이다'
        - 'shortcut 은 꼭짓점을 늘리는 처리라 경로가 오히려 길어지기 때문이다'
        - 'shortcut 은 self-collision 을 검사하지 않아 결과가 버려지기 때문이다'
      answer: 1
      explanation: |
        shortcut 은 기존 경로 근처에서 꺾인 부분을 곧게 펼 뿐, 직선이 장애물을 가로지를 수 없으므로 반대쪽 길로 옮겨 가지 못한다. 다른 쪽 길을 찾으려면
        RRT* 처럼 C-space 를 다시 탐색해야 한다. shortcut 은 시간 정보를 다루지 않고, 꼭짓점을 줄이며, 직선마다 충돌을 검사한다.
    - question: |
        RRT* 는 RRT 와 무엇이 달라서 경로가 최적에 가까워지는가?
      choices:
        - '부모를 비용이 가장 작은 둘레 점으로 고르고, 더 싸지면 둘레 점의 부모를 바꾸는 rewire 를 더한다'
        - 'step 길이 ε 을 0 으로 줄여 grid search 처럼 촘촘하게 모든 자세를 훑는다'
        - '표본을 목표 쪽으로만 뽑아 tree 가 돌아가지 않고 곧게 목표를 향해 자라게 한다'
        - '출발과 목표에서 두 tree 를 마주 키워, 만나는 순간 가장 짧은 경로로 멈춘다'
      answer: 0
      explanation: |
        RRT* 는 부모 선택과 rewire 로 tree 안의 비용을 계속 줄여, 표본이 늘면 경로 길이가 최적값으로 수렴한다. 대신 첫 경로를 찾은 뒤에도 시간을 써야
        한다. ε 을 0 으로 하면 tree 가 자라지 않고, 목표 쪽으로만 뽑으면 탐색이 막히며, 두 tree 를 만나면 멈추는 것은 RRT-Connect 의 방식이다.

- topic: moveit-pipeline
  title: MoveIt 2 의 planning pipeline
  variants:
    - question: |
        MoveIt 2 의 move_group 이 돌려주는 결과는 path 인가, trajectory 인가? 시간 정보는 어디서 붙는가?
      choices:
        - 'path 다. 시간 정보는 controller 가 받은 path 를 실행하면서 관절 한계에 맞춰 스스로 정한다'
        - 'trajectory 다. OMPL 이 표본을 뽑을 때 시각도 함께 뽑아 path 와 시간을 한 번에 얻는다'
        - 'path 다. 시간 정보는 사용자가 속도 한계를 보고 따로 계산해 붙여야 한다'
        - 'trajectory 다. OMPL 이 찾은 path 에 time parameterization 단계가 시각을 붙인다'
      answer: 3
      explanation: |
        OMPL 은 시간 없는 관절 각도의 줄(path)을 찾고, 그 뒤 response adapter 의 time parameterization(MoveIt 2 main·Jazzy 의 AddTimeOptimalParameterization)이 관절 속도·가속도 한계를 지키는
        시각과 속도를 붙여 trajectory 를 만든다. OMPL 의 표본에는 시간이 없고, controller 는 받은 trajectory 를 따라갈 뿐이며, 사용자가 따로 계산할
        필요도 없다.
    - question: |
        planning 이 START_STATE_IN_COLLISION 오류로 실패한다. planning 시간을 늘리면 해결될까?
      choices:
        - '해결되지 않는다. planner 를 부르기 전에 시작 자세가 이미 충돌이라 거절된 것이다'
        - '해결된다. 시간을 늘리면 planner 가 시작 자세 주변을 더 많이 탐색해 충돌 없는 길을 찾는다'
        - '해결된다. planning 시간과 시도 횟수를 늘리면 시작 자세 검사를 건너뛰게 된다'
        - '해결되지 않는다. 이 오류는 controller 연결이 끊겼다는 뜻이라 연결부터 고쳐야 한다'
      answer: 0
      explanation: |
        request adapter(MoveIt 2 main·Jazzy 의 CheckStartStateCollision)는 planner 를 부르기 전에 시작 자세를 검사하고 충돌이면 바로 오류를 돌려준다. 그래서 planning
        시간이나 시도 횟수와 무관하고, padding 이 너무 크거나 ACM 에서 이웃 link 쌍이 켜져 있거나 planning scene 에 잘못 넣은 물체가 있는지 본다.
        controller 연결 문제는 실행 단계의 오류다.
    - question: |
        부품을 구멍에 끼우는 마지막 10 cm 는 손끝이 정확히 직선으로 움직여야 한다. MoveIt 2 에서 어떤 planner 가 맞고, 주의할 점은?
      choices:
        - 'OMPL RRTConnect. 두 tree 를 직선으로 이어 붙이므로 손끝도 항상 직선으로 움직인다'
        - 'CHOMP. gradient 로 경로를 다듬으면서 손끝을 정확한 직선에 맞춰 준다'
        - 'Pilz LIN. 손끝을 직선으로 움직이지만 장애물을 돌아가지 않아 충돌하면 실패한다'
        - 'STOMP. noise 를 더한 후보 경로 가운데 손끝이 직선인 것을 골라 준다'
      answer: 2
      explanation: |
        Pilz 의 LIN 은 손끝 위치를 직선으로, 방향을 slerp 로 보간하고 사다리꼴 속도 profile 을 붙인다. 정해진 모양만 만들고 장애물을 피하지 않아서
        충돌하면 경로 재검사 단계(main·Jazzy 의 ValidateSolution)에서 실패로 돌아온다. RRTConnect 는 관절 공간에서 tree 를 이으므로 손끝이 직선이 되지 않고, CHOMP·STOMP 는 비용을
        줄이는 최적화라 손끝 직선을 보장하지 않는다.
