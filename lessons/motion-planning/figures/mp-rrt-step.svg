<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>RRT 의 한 step. 무작위로 뽑은 q_rand(80°, 80°)에 가장 가까운 tree 의 점 q_near(0°, 20°)에서 q_rand 쪽으로 ε = 15° 만큼 간 q_new(12°, 29°)를 충돌 검사 뒤 tree 에 붙인다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="360.0" y="28.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">RRT 의 한 step (ε = 15°)</text>
  <ellipse cx="275.0" cy="198.5" rx="30" ry="22" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b"/>
  <text x="275.0" y="202.5" fill="#f59e0b" font-size="10" text-anchor="middle">C-obstacle</text>
  <line x1="57.5" y1="285.5" x2="101.0" y2="265.2" stroke="#34d399" stroke-width="1.8"/>
  <line x1="101.0" y1="265.2" x2="130.0" y2="242.0" stroke="#34d399" stroke-width="1.8"/>
  <line x1="101.0" y1="265.2" x2="72.0" y2="213.0" stroke="#34d399" stroke-width="1.8"/>
  <line x1="72.0" y1="213.0" x2="43.0" y2="169.5" stroke="#34d399" stroke-width="1.8"/>
  <line x1="101.0" y1="265.2" x2="144.5" y2="285.5" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="57.5" cy="285.5" r="4" fill="#34d399"/>
  <circle cx="101.0" cy="265.2" r="4" fill="#34d399"/>
  <circle cx="130.0" cy="242.0" r="4" fill="#34d399"/>
  <circle cx="72.0" cy="213.0" r="4" fill="#34d399"/>
  <circle cx="43.0" cy="169.5" r="4" fill="#34d399"/>
  <circle cx="144.5" cy="285.5" r="4" fill="#34d399"/>
  <line x1="130.0" y1="242.0" x2="362.0" y2="68.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="130.0" cy="242.0" r="43.5" fill="none" stroke="#38bdf8" stroke-dasharray="3 3"/>
  <line x1="130.0" y1="242.0" x2="164.8" y2="215.9" stroke="#38bdf8" stroke-width="2.6" marker-end="url(#as)"/>
  <circle cx="362.0" cy="68.0" r="5" fill="#f87171"/>
  <text x="352.0" y="72.0" fill="#f87171" font-size="11" text-anchor="end">q_rand (80°, 80°)</text>
  <circle cx="164.8" cy="215.9" r="5" fill="#38bdf8" stroke="#0b1220" stroke-width="1.5"/>
  <text x="168.8" y="201.9" fill="#38bdf8" font-size="11" text-anchor="start">q_new (12°, 29°)</text>
  <text x="144.0" y="266.0" fill="#34d399" font-size="11" text-anchor="start">q_near (0°, 20°)</text>
  <text x="430.0" y="80.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">① sample</text>
  <text x="430.0" y="100.0" fill="#94a3b8" font-size="11" text-anchor="start">C-space 에서 자세 하나를 무작위로 뽑는다</text>
  <text x="430.0" y="116.0" fill="#94a3b8" font-size="11" text-anchor="start">→ q_rand</text>
  <text x="430.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">② nearest</text>
  <text x="430.0" y="156.0" fill="#94a3b8" font-size="11" text-anchor="start">tree 에서 q_rand 와 가장 가까운 점을 찾는다</text>
  <text x="430.0" y="172.0" fill="#94a3b8" font-size="11" text-anchor="start">→ q_near</text>
  <text x="430.0" y="192.0" fill="#38bdf8" font-size="13" text-anchor="start" font-weight="600">③ steer</text>
  <text x="430.0" y="212.0" fill="#94a3b8" font-size="11" text-anchor="start">q_near 에서 q_rand 쪽으로 ε 만큼만 간다</text>
  <text x="430.0" y="228.0" fill="#94a3b8" font-size="11" text-anchor="start">→ q_new</text>
  <text x="430.0" y="248.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">④ check</text>
  <text x="430.0" y="268.0" fill="#94a3b8" font-size="11" text-anchor="start">q_new 와 그 사이 선분이 충돌 없으면 tree 에 붙인다</text>
  <text x="430.0" y="320.0" fill="#64748b" font-size="11" text-anchor="start">방향 (80, 60) 의 길이 100 → 15/100 만큼: (12, 9)</text>
</svg>
