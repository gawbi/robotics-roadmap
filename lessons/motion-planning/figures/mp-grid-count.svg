<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>관절 수에 따른 grid 칸 수. 관절마다 10° 칸 36 개로 나누면 2 관절은 1,296 칸, 3 관절은 46,656 칸, 6 관절은 약 21.8억 칸, 7 관절은 약 784억 칸이다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="340.0" y="30.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">관절마다 10° 칸으로 나눈 grid 의 칸 수 (36ⁿ)</text>
  <line x1="84" y1="260.0" x2="636" y2="260.0" stroke="#1e293b"/>
  <text x="80.0" y="264.0" fill="#64748b" font-size="10" text-anchor="end">1</text>
  <line x1="84" y1="223.6" x2="636" y2="223.6" stroke="#1e293b"/>
  <text x="80.0" y="227.6" fill="#64748b" font-size="10" text-anchor="end">10^2</text>
  <line x1="84" y1="187.3" x2="636" y2="187.3" stroke="#1e293b"/>
  <text x="80.0" y="191.3" fill="#64748b" font-size="10" text-anchor="end">10^4</text>
  <line x1="84" y1="150.9" x2="636" y2="150.9" stroke="#1e293b"/>
  <text x="80.0" y="154.9" fill="#64748b" font-size="10" text-anchor="end">10^6</text>
  <line x1="84" y1="114.5" x2="636" y2="114.5" stroke="#1e293b"/>
  <text x="80.0" y="118.5" fill="#64748b" font-size="10" text-anchor="end">10^8</text>
  <line x1="84" y1="78.2" x2="636" y2="78.2" stroke="#1e293b"/>
  <text x="80.0" y="82.2" fill="#64748b" font-size="10" text-anchor="end">10^10</text>
  <rect x="100.0" y="231.7" width="58" height="28.3" rx="4" fill="#38bdf8" opacity="0.8"/>
  <text x="129.0" y="225.7" fill="#e2e8f0" font-size="11" text-anchor="middle">36</text>
  <text x="129.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">1 관절</text>
  <rect x="178.0" y="203.4" width="58" height="56.6" rx="4" fill="#38bdf8" opacity="0.8"/>
  <text x="207.0" y="197.4" fill="#e2e8f0" font-size="11" text-anchor="middle">1,296</text>
  <text x="207.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">2 관절</text>
  <rect x="256.0" y="175.1" width="58" height="84.9" rx="4" fill="#38bdf8" opacity="0.8"/>
  <text x="285.0" y="169.1" fill="#e2e8f0" font-size="11" text-anchor="middle">46,656</text>
  <text x="285.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">3 관절</text>
  <rect x="334.0" y="146.8" width="58" height="113.2" rx="4" fill="#f59e0b" opacity="0.8"/>
  <text x="363.0" y="140.8" fill="#e2e8f0" font-size="11" text-anchor="middle">168만</text>
  <text x="363.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">4 관절</text>
  <rect x="412.0" y="118.5" width="58" height="141.5" rx="4" fill="#f59e0b" opacity="0.8"/>
  <text x="441.0" y="112.5" fill="#e2e8f0" font-size="11" text-anchor="middle">6,047만</text>
  <text x="441.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">5 관절</text>
  <rect x="490.0" y="90.2" width="58" height="169.8" rx="4" fill="#f87171" opacity="0.8"/>
  <text x="519.0" y="84.2" fill="#e2e8f0" font-size="11" text-anchor="middle">21.8억</text>
  <text x="519.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">6 관절</text>
  <rect x="568.0" y="61.9" width="58" height="198.1" rx="4" fill="#f87171" opacity="0.8"/>
  <text x="597.0" y="55.9" fill="#e2e8f0" font-size="11" text-anchor="middle">784억</text>
  <text x="597.0" y="278.0" fill="#94a3b8" font-size="11" text-anchor="middle">7 관절</text>
  <text x="340.0" y="300.0" fill="#94a3b8" font-size="11" text-anchor="middle">7 관절이면 칸마다 1 bit 만 적어도 784억 bit = 9.8 GB, 1° 칸이면 Panda 하나에 1.16 × 10¹⁷ 칸</text>
</svg>
