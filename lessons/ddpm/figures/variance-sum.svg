<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽은 0.8 을 곱한 값 −0.8, +0.8 과 noise −0.6, +0.6 을 모두 짝지어 더한 네 값 −1.4, −0.2, 0.2, 1.4 로 제곱의 평균이 1 이다. 오른쪽은 줄이지 않은 −1, +1 에 같은 noise 를 더해 제곱의 평균이 1.36 이다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="678" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="start">줄이고 더하기: 0.8x + 0.6ε</text>
  <text x="220.0" y="64.0" fill="#d6aa62" font-size="12" text-anchor="middle">noise 부분</text>
  <text x="170.0" y="86.0" fill="#d6aa62" font-size="13" text-anchor="middle">−0.6</text>
  <text x="270.0" y="86.0" fill="#d6aa62" font-size="13" text-anchor="middle">+0.6</text>
  <text x="76.0" y="64.0" fill="#7cb4d8" font-size="12" text-anchor="middle">데이터 부분</text>
  <text x="76.0" y="138.0" fill="#7cb4d8" font-size="13" text-anchor="middle">−0.8</text>
  <rect x="122.0" y="100.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="170.0" y="127.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 −1.4</text>
  <text x="170.0" y="148.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 1.96</text>
  <rect x="222.0" y="100.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="270.0" y="127.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 −0.2</text>
  <text x="270.0" y="148.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 0.04</text>
  <text x="76.0" y="208.0" fill="#7cb4d8" font-size="13" text-anchor="middle">0.8</text>
  <rect x="122.0" y="170.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="170.0" y="197.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 0.2</text>
  <text x="170.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 0.04</text>
  <rect x="222.0" y="170.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="270.0" y="197.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 1.4</text>
  <text x="270.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 1.96</text>
  <text x="40.0" y="266.0" fill="#94a3b8" font-size="12" text-anchor="start">제곱의 평균(분산)</text>
  <text x="40.0" y="286.0" fill="#7fc4a2" font-size="13" text-anchor="start">(1.96 + 0.04 + 0.04 + 1.96) ÷ 4 = 1</text>
  <text x="360.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="start">더하기만: x + 0.6ε</text>
  <text x="550.0" y="64.0" fill="#d6aa62" font-size="12" text-anchor="middle">noise 부분</text>
  <text x="500.0" y="86.0" fill="#d6aa62" font-size="13" text-anchor="middle">−0.6</text>
  <text x="600.0" y="86.0" fill="#d6aa62" font-size="13" text-anchor="middle">+0.6</text>
  <text x="406.0" y="64.0" fill="#7cb4d8" font-size="12" text-anchor="middle">데이터 부분</text>
  <text x="406.0" y="138.0" fill="#7cb4d8" font-size="13" text-anchor="middle">−1</text>
  <rect x="452.0" y="100.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="500.0" y="127.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 −1.6</text>
  <text x="500.0" y="148.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 2.56</text>
  <rect x="552.0" y="100.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="600.0" y="127.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 −0.4</text>
  <text x="600.0" y="148.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 0.16</text>
  <text x="406.0" y="208.0" fill="#7cb4d8" font-size="13" text-anchor="middle">1</text>
  <rect x="452.0" y="170.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="500.0" y="197.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 0.4</text>
  <text x="500.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 0.16</text>
  <rect x="552.0" y="170.0" width="96.0" height="64.0" rx="8" fill="#111a2e" stroke="#475569" stroke-width="1.2"/>
  <text x="600.0" y="197.0" fill="#e2e8f0" font-size="13" text-anchor="middle">합 1.6</text>
  <text x="600.0" y="218.0" fill="#94a3b8" font-size="12" text-anchor="middle">제곱 2.56</text>
  <text x="370.0" y="266.0" fill="#94a3b8" font-size="12" text-anchor="start">제곱의 평균(분산)</text>
  <text x="370.0" y="286.0" fill="#d88b8b" font-size="13" text-anchor="start">(2.56 + 0.16 + 0.16 + 2.56) ÷ 4 = 1.36</text>
</svg>
