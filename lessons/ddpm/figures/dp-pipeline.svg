  <rect x="260.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="275.0" y="290.0" fill="#0b1220" font-size="11" text-anchor="middle">6</text>
  <rect x="298.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="313.0" y="290.0" fill="#0b1220" font-size="11" text-anchor="middle">7</text>
  <rect x="336.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#f59e0b" stroke="#f59e0b" stroke-width="1"/>
  <text x="351.0" y="290.0" fill="#0b1220" font-size="11" text-anchor="middle">8</text>
  <rect x="374.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="389.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">9</text>
  <rect x="412.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="427.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">10</text>
  <rect x="450.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="465.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">11</text>
  <rect x="488.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="503.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">12</text>
  <rect x="526.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="541.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">13</text>
  <rect x="564.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="579.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">14</text>
  <rect x="602.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="617.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">15</text>
  <rect x="640.0" y="276.0" width="30.0" height="20.0" rx="3" fill="#3b2a12" stroke="#f59e0b" stroke-width="1"/>
  <text x="655.0" y="290.0" fill="#94a3b8" font-size="11" text-anchor="middle">16</text>
  <text x="218.0" y="316.0" fill="#f59e0b" font-size="12" text-anchor="middle">앞 8 개 실행 (Ta = 8)</text>
  <text x="522.0" y="316.0" fill="#94a3b8" font-size="12" text-anchor="middle">버리고 새 관측으로 다시 생성</text>
