<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>로봇 앞의 상자를 비켜 가는 시연이 왼쪽 반, 오른쪽 반일 때. MSE 로 학습한 policy 는 평균인 가운데 길을 내서 상자에 부딪히고, Diffusion Policy 는 실행할 때마다 왼쪽이나 오른쪽 길 하나를 sample 로 뽑는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="658" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="40.0" y="40.0" width="580.0" height="220.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="90.0" cy="150.0" r="20" fill="#111a2e" stroke="#7cb4d8" stroke-width="2.5"/>
  <line x1="90.0" y1="150.0" x2="108.0" y2="150.0" stroke="#7cb4d8" stroke-width="2.5"/>
  <text x="90.0" y="192.0" fill="#7cb4d8" font-size="13" text-anchor="middle">로봇</text>
  <rect x="300.0" y="118.0" width="64.0" height="64.0" rx="4" fill="#3b2a12" stroke="#d6aa62" stroke-width="2"/>
  <text x="332.0" y="155.0" fill="#d6aa62" font-size="14" text-anchor="middle">상자</text>
  <path d="M112,150 C194,150 214,85 300,85 L380,85 C444,85 464,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M112,150 C194,150 214,218 300,218 L380,218 C444,218 464,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M112,150 C198,150 218,89 300,89 L380,89 C448,89 468,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M112,150 C205,150 225,228 300,228 L380,228 C455,228 475,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M112,150 C196,150 216,75 300,75 L380,75 C446,75 466,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M112,150 C196,150 216,221 300,221 L380,221 C446,221 466,150 560,150" fill="none" stroke="#7fc4a2" stroke-width="2" stroke-opacity="0.85"/>
  <line x1="112.0" y1="150.0" x2="268.0" y2="150.0" stroke="#d88b8b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  <line x1="278.0" y1="141.0" x2="292.0" y2="159.0" stroke="#d88b8b" stroke-width="3"/>
  <line x1="278.0" y1="159.0" x2="292.0" y2="141.0" stroke="#d88b8b" stroke-width="3"/>
  <text x="56.0" y="64.0" fill="#d88b8b" font-size="13" text-anchor="start">빨간 점선: MSE policy 의 출력 (평균 = 가운데)</text>
  <text x="450.0" y="64.0" fill="#7fc4a2" font-size="13" text-anchor="middle">Diffusion Policy 의 sample</text>
  <text x="450.0" y="246.0" fill="#7fc4a2" font-size="12" text-anchor="middle">실행마다 왼쪽 또는 오른쪽</text>
  <text x="330.0" y="288.0" fill="#94a3b8" font-size="12" text-anchor="middle">위에서 내려다본 모습. 초록 선 하나가 sampling 한 번으로 얻은 경로 하나다</text>
</svg>
