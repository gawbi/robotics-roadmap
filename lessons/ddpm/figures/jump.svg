<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 x₀ = 2 에서 step 을 두 번 밟아 x₁ = 1.9, x₂ = 0.92 를 얻는 계산, 아래는 같은 ε 로 0.64 × 2 와 noise 합 −0.36 을 더해 x₂ = 0.92 를 한 번에 얻는 계산</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="698" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="32.0" fill="#38bdf8" font-size="14" text-anchor="start">한 step 씩</text>
  <rect x="24.0" y="48.0" width="96.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="72.0" y="79.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x₀ = 2</text>
  <line x1="122.0" y1="74.0" x2="250.0" y2="74.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="186.0" y="64.0" fill="#94a3b8" font-size="12" text-anchor="middle">× 0.8 + 0.6 × 0.5</text>
  <rect x="254.0" y="48.0" width="110.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="309.0" y="79.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x₁ = 1.9</text>
  <line x1="366.0" y1="74.0" x2="520.0" y2="74.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="443.0" y="64.0" fill="#94a3b8" font-size="12" text-anchor="middle">× 0.8 + 0.6 × (−1)</text>
  <rect x="524.0" y="48.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="589.0" y="79.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x₂ = 0.92</text>
  <text x="24.0" y="140.0" fill="#f59e0b" font-size="14" text-anchor="start">한 번에</text>
  <rect x="24.0" y="156.0" width="80.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="64.0" y="187.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x₀ = 2</text>
  <line x1="106.0" y1="182.0" x2="146.0" y2="182.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="150.0" y="156.0" width="120.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210.0" y="178.0" fill="#e2e8f0" font-size="14" text-anchor="middle">0.64 × 2</text>
  <text x="210.0" y="196.0" fill="#94a3b8" font-size="12" text-anchor="middle">= 1.28</text>
  <text x="290.0" y="188.0" fill="#e2e8f0" font-size="20" text-anchor="middle">+</text>
  <rect x="310.0" y="150.0" width="190.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="405.0" y="178.0" fill="#e2e8f0" font-size="12" text-anchor="middle">noise 합: 0.48 × 0.5 + 0.6 × (−1)</text>
  <text x="405.0" y="196.0" fill="#94a3b8" font-size="12" text-anchor="middle">= 0.24 − 0.6 = −0.36</text>
  <line x1="502.0" y1="182.0" x2="520.0" y2="182.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="524.0" y="156.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="589.0" y="187.0" fill="#e2e8f0" font-size="14" text-anchor="middle">x₂ = 0.92</text>
  <text x="350.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="middle">noise 두 개의 합은 분산 0.48² + 0.6² = 0.2304 + 0.36 = 0.5904 인 정규분포라서</text>
  <text x="350.0" y="268.0" fill="#94a3b8" font-size="12" text-anchor="middle">√0.5904 = 0.768 을 곱한 noise 하나로 바꿔 쓸 수 있다: x₂ = 0.64 × x₀ + 0.768 × ε</text>
</svg>
