# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: why-measure
  title: 카메라와 로봇 사이 transform 의 오차
  variants:
    - question: |
        손목 카메라와 gripper 사이 transform 의 rotation 이 1° 틀렸다. 카메라에서 0.5 m 떨어진 물체의 위치는 어떻게 틀어지는가?
      choices:
        - '1° 는 작은 각도라 위치에는 거의 영향이 없고, 오차는 1 mm 미만으로 남는다'
        - '거리를 곱한 만큼 틀려서 0.5 × tan 1° ≈ 8.7 mm 옆으로 계산된다'
        - 'rotation 오차는 물체가 보이는 방향만 바꾸고, 계산한 위치는 바꾸지 않는다'
        - '거리와 상관없이 늘 같은 양만큼 틀려서, 0.5 m 든 1 m 든 약 1 cm 다'
      answer: 1
      explanation: |
        rotation 이 틀리면 카메라에서 물체로 향하는 방향이 그 각도만큼 돌아가므로, 위치 오차는 거리 × tan(각도)다. 0.5 m 에서 1° 는 약 8.7 mm 이고
        1 m 이면 약 17.5 mm 로 커진다. 거리와 무관하게 일정한 것은 translation 오차이고, 위치가 바뀌지 않는다는 보기와 1 mm 미만이라는 보기는
        거리를 곱하는 lever arm 효과를 놓친 답이다.
    - question: |
        카메라 받침대의 CAD 도면에서 카메라 위치를 읽어 쓰지 않고 굳이 calibration 을 하는 이유는 무엇인가?
      choices:
        - '도면 값이 정확하면 calibration 은 intrinsics 만 하면 된다'
        - 'CAD 값은 translation 만 틀리고 rotation 은 늘 정확해서, translation 만 calibration 하면 된다'
        - '받침대의 아주 작은 기울기도 먼 물체에서는 큰 위치 오차가 되고, 계산에 쓰는 camera frame 원점(렌즈 투영 중심)은 몸체 겉에 표시되어 있지 않다'
        - 'CAD 값은 eye-to-hand 에서만 쓸 수 없고 eye-in-hand 에서는 그대로 써도 된다'
      answer: 2
      explanation: |
        받침대가 1° 기울면 50 mm 받침대 끝은 0.87 mm 만 움직이지만 0.5 m 앞 물체는 8.7 mm 틀린다. 게다가 camera frame 의 원점은 렌즈 안쪽의 투영
        중심이라 도면이나 자로 정확히 잡기 어렵다. 그래서 도면 값은 첫 추측일 뿐이다. rotation 이 늘 정확하다는 보기는 거꾸로인데, 먼 물체에서는
        작은 rotation 오차가 translation 오차보다 더 큰 위치 오차가 된다. 이 문제는 eye-in-hand 든 eye-to-hand 든 같고, intrinsics 만 구해서는
        카메라가 로봇의 어디에 있는지 알 수 없다.
    - question: |
        transform 의 rotation 이 0.5° 틀린 카메라로 1 m 떨어진 물체를 본다. 위치 오차로 가장 가까운 것은?
      choices:
        - '약 0.9 mm'
        - '약 4.4 mm'
        - '약 17.5 mm'
        - '약 8.7 mm'
      answer: 3
      explanation: |
        위치 오차는 거리 × tan(각도) 라서 1 × tan 0.5° ≈ 0.0087 m, 약 8.7 mm 다. 4.4 mm 는 0.5 m 거리일 때의 값이고 17.5 mm 는 1° 일 때의
        값이다. 0.9 mm 는 거리를 0.1 m 로 잘못 넣은 값이다.

- topic: setups
  title: eye-in-hand 와 eye-to-hand
  variants:
    - question: |
        eye-in-hand 와 eye-to-hand 에서 calibration 으로 구하는 transform 은 각각 무엇인가?
      choices:
        - 'eye-in-hand 는 gripper 와 camera 사이를 구하고, eye-to-hand 는 base 와 camera 사이를 구한다'
        - '둘 다 camera 와 target 사이의 transform 을 구하고, 그 값으로 물체 위치를 바로 계산한다'
        - 'eye-in-hand 는 base 와 target 사이를 구하고, eye-to-hand 는 gripper 와 target 사이를 구한다'
        - '둘 다 camera 의 intrinsics 를 구하고, 카메라의 위치는 로봇의 FK 로 바로 안다'
      answer: 0
      explanation: |
        eye-in-hand 는 카메라가 손목에 붙어 있으므로 gripper 에서 본 카메라의 pose 가 고정된 미지수이고, eye-to-hand 는 카메라가 로봇 밖에 고정되어
        base 에서 본 카메라의 pose 가 미지수다. base-target 이나 gripper-target transform 은 고정이지만 몰라도 되는 값이라 AX = XB 에서 지워지고,
        camera-target transform 은 사진마다 PnP 로 재는 값이다. intrinsics 는 그 전에 따로 구한다.
    - question: |
        eye-to-hand 설치에서 OpenCV calibrateHandEye 를 쓰려면 로봇 pose 를 어떻게 넣어야 하는가?
      choices:
        - 'eye-in-hand 와 똑같이 gripper→base transform 을 넣으면 함수가 설치를 알아서 판단한다'
        - 'gripper→base 대신 그 역행렬인 base→gripper 를 넣으면 결과가 camera→base 가 된다'
        - '로봇 pose 자리에 target pose 를 한 번 더 넣어, camera 와 target 의 관계만으로 푼다'
        - 'eye-to-hand 는 AX = XB 꼴이 아니라서, calibrateHandEye 대신 다른 함수로 풀어야 한다'
      answer: 1
      explanation: |
        eye-to-hand 에서는 gripper 에 단 target 이 gripper 에 고정되어 있으므로, 로봇 pose 자리에 역행렬(base→gripper)을 넣으면 같은 AX = XB 꼴이 되고
        X 는 base 와 camera 사이 transform 이 된다. OpenCV 문서가 이렇게 넣으라고 적고, MoveIt Calibration 도 eye-to-hand 에서 FK 결과를 뒤집어 넣는다.
        함수는 설치 방식을 스스로 알 수 없다.
    - question: |
        eye-in-hand 에서 책상에 놓은 calibration target 의 정확한 위치를 미리 재야 하는가?
      choices:
        - '예. target 위치를 mm 단위로 알아야, 카메라가 본 target 으로 X 를 계산할 수 있다'
        - '예. target 을 로봇 base 원점에 정확히 맞춰 놓아야 base 와 camera 를 이을 수 있다'
        - '아니다. 다만 자세마다 target 을 다른 곳으로 옮겨야 회전 정보가 충분히 모인다'
        - '아니다. AX = XB 에서 target 위치가 지워지므로 움직이지 않게만 두면 된다'
      answer: 3
      explanation: |
        target 이 base 에 고정되어 있으면 두 자세에서 계산한 base→target 이 같다는 조건으로 AX = XB 를 세우고, 그 과정에서 target 위치가 지워진다.
        그래서 위치를 잴 필요는 없지만 calibration 내내 움직이면 안 된다. target 을 옮기면 오히려 이 조건이 깨진다.

- topic: axxb
  title: AX = XB 의 A 와 B
  variants:
    - question: |
        hand-eye calibration 의 AX = XB 에서 A 와 B 는 각각 어디서 얻는가?
      choices:
        - 'A 와 B 모두 camera 로 찍은 target pose 에서 얻고, 로봇의 FK 값은 쓰지 않는다'
        - 'A 는 target 의 CAD 값에서 얻고, B 는 camera intrinsics 로 구한 투영 행렬이다'
        - 'A 는 FK 로 구한 gripper 의 움직임이고, B 는 target pose 로 구한 camera 의 움직임이다'
        - 'A 는 X 의 첫 추측이고, B 는 그 추측을 사진과 맞춰 한 번 고친 값이다'
      answer: 2
      explanation: |
        A = (자세 2 의 base→gripper)⁻¹ · (자세 1 의 base→gripper) 로 gripper 가 움직인 양이고 FK 로 계산한다. B = (자세 2 의 camera→target) ·
        (자세 1 의 camera→target)⁻¹ 로 camera 가 움직인 양이고 PnP 로 잰 target pose 로 계산한다. 카메라가 gripper 에 단단히 붙어 있어 두 움직임이
        X 로 이어진다.
    - question: |
        AX = XB 식이 뜻하는 물리적 사실은 무엇인가?
      choices:
        - 'gripper 가 움직인 뒤 X 를 거치는 길과 X 를 거친 뒤 camera 가 움직이는 길이 같은 곳에 닿는다'
        - 'gripper 와 camera 가 같은 거리만큼 translation 했다는 뜻이라, 두 움직임의 크기가 같다'
        - 'target 이 camera 와 함께 움직였다는 뜻이라, 사진 속 target 은 늘 같은 자리에 있다'
        - 'A 와 B 가 같은 행렬이라는 뜻이라, gripper 의 움직임을 그대로 camera 의 움직임으로 쓴다'
      answer: 0
      explanation: |
        두 길 모두 자세 1 의 gripper 에서 자세 2 의 camera 로 가므로 같다. A 와 B 는 서로 다른 frame 에서 적은 움직임이라 같은 행렬이 아니고,
        rotation 각도만 같다. translation 크기는 X 의 위치에 따라 다르며, target 은 움직이지 않아야 식이 성립한다.
    - question: |
        자세 10 개를 모았다. OpenCV calibrateHandEye 구현이 AX = XB 로 쓰는 자세 짝(움직임)은 모두 몇 개인가?
      choices:
        - '9 개'
        - '45 개'
        - '10 개'
        - '90 개'
      answer: 1
      explanation: |
        OpenCV 는 연속한 자세만이 아니라 두 자세씩 고른 모든 짝을 쓰므로 10 × 9 ÷ 2 = 45 개다. 9 개는 연속한 짝만 쓸 때, 90 개는 순서를 바꾼 짝을
        따로 셀 때의 수다. 다만 OpenCV 4.10 이상의 Tsai 구현은 이 가운데 회전이 너무 작거나 큰 짝을 버린다.

- topic: rotation-axes
  title: 회전 축의 짝과 최소 자세 수
  variants:
    - question: |
        gripper 가 30° 돌았을 때, 거기 단단히 붙은 카메라의 회전은 어떻게 계산되는가?
      choices:
        - '카메라는 gripper 원점에서 떨어져 있으므로, 떨어진 거리만큼 30° 보다 크게 돈다'
        - '카메라의 회전 각도와 회전 축 모두, gripper 와 같은 숫자로 적힌다'
        - '카메라는 회전 중심에서 벗어나 있어서 translation 만 하고 회전하지 않는다'
        - '각도는 똑같이 30° 이고, 축만 camera frame 의 좌표로 다르게 적힌다'
      answer: 3
      explanation: |
        rigid 하게 붙은 물체는 같은 각도만큼 돈다. rotation 식 R_A R_X = R_X R_B 에서 R_B = R_Xᵀ R_A R_X 라서 각도는 같고, gripper frame 에서 잰 축
        a 와 camera frame 에서 잰 축 b 사이에 a = R_X b 가 성립한다. 축의 숫자까지 같으려면 R_X 가 그 축을 바꾸지 않아야 한다. 카메라가 원점에서
        떨어져 있는 거리는 회전 각도가 아니라 translation 에 영향을 준다.
    - question: |
        hand-eye calibration 에 필요한 최소 자세 수와 그 조건은?
      choices:
        - '자세 2 개. 두 자세 사이의 움직임 하나가 A 와 B 를 함께 주므로 X 가 정해진다'
        - '자세 6 개. X 의 숫자가 6 개라서 숫자 하나에 자세가 하나씩 필요하다'
        - '자세 3 개. 회전 축이 평행하지 않은 움직임 두 개가 있어야 R_X 가 정해진다'
        - '자세 수는 상관없고, 자세 사이 translation 거리가 1 m 이상이면 된다'
      answer: 2
      explanation: |
        회전 축의 짝 하나로는 그 축을 중심으로 더 돌린 rotation 도 모두 답이 되어 R_X 가 하나로 정해지지 않는다. 축이 평행하지 않은 움직임 두 개가
        필요하고, 움직임 두 개는 자세 세 개에서 나온다. OpenCV 도 최소 3 개를 요구하면서 훨씬 많이 쓰라고 권한다. X 의 미지수가 6 개라도 움직임
        하나가 식을 여러 개 주므로 자세가 6 개 필요한 것은 아니고, translation 거리는 X 를 정하는 조건이 아니다.
    - question: |
        자세를 20 개 모았는데 모두 손목 마지막 관절만 돌려서 만들었다. 결과는 어떻게 될까?
      choices:
        - '자세가 20 개로 충분히 많으므로, 어느 관절을 돌렸는지와 관계없이 정확한 결과가 나온다'
        - '마지막 관절로도 회전은 충분히 했으니 rotation 은 정확하고, translation 만 조금 틀린다'
        - '회전 축이 모두 같아서, 그 축 둘레의 rotation 과 축 방향 translation 이 정해지지 않는다'
        - '자세 수가 모자라다고 판단되어 계산이 거부되고, 자세를 더 모으라는 오류가 난다'
      answer: 2
      explanation: |
        움직임이 많아도 회전 축이 하나뿐이면 R_X 에 그 축을 중심으로 한 각도 하나가 남고, translation 도 그 축 방향 성분이 남는다. 강의의 simulation
        에서 한 축으로만 돌린 자세 10 개를 넣으면 rotation 이 약 90° 틀리고 translation 이 1 m 안팎 틀렸다. rotation 만 정확하다는 보기와 자세
        수가 문제라는 보기는 회전 축이 서로 달라야 한다는 조건을 놓쳤다.

- topic: pure-translation
  title: translation 만 하는 움직임
  variants:
    - question: |
        자세를 회전 없이 translation 만으로 바꿔 가며 모으면 왜 X 의 translation 을 구할 수 없는가?
      choices:
        - 'translation 만 하면 움직임이 작아서 noise 에 묻히기 때문이다. 크게 옮기면 해결된다'
        - 'translation 만 하면 target 이 사진 가장자리로 밀려나 PnP 가 실패하기 때문이다'
        - 'OpenCV 가 회전 없는 자세 짝의 translation 입력을 무시하도록 만들어졌기 때문이다'
        - 'R_A = I 이면 (R_A − I) t_X 항이 0 이 되어 t_X 가 식에서 사라지기 때문이다'
      answer: 3
      explanation: |
        회전이 없으면 R_A − I = 0 이라 t_X 가 식에서 빠지고, 남는 식은 t_A = R_X t_B 뿐이다. 카메라가 gripper 의 어디에 달려 있든 같은 화살표만큼
        움직이므로 위치를 알 수 없다. 크게 옮겨도 t_X 앞의 행렬은 여전히 0 이고, OpenCV 가 translation 을 무시하는 것이 아니라 식 자체에 정보가 없다.
    - question: |
        gripper 가 자기 z 축으로만 돌 때, X 의 translation 가운데 정해지지 않는 성분은 무엇이고 왜 그런가?
      choices:
        - 'x 성분. 회전이 x 와 y 를 섞어서, 둘 중 하나는 따로 정할 수 없기 때문이다'
        - '세 성분 모두 정해진다. 회전이 있기만 하면 t_X 앞의 행렬이 0 이 아니기 때문이다'
        - 'z 성분. 축 방향으로 카메라를 옮겨 달아도 카메라의 움직임이 똑같기 때문이다'
        - 'z 성분. 다만 같은 축으로 도는 자세를 10 개 넘게 모으면 정해진다'
      answer: 2
      explanation: |
        z 축 회전에서 R_A − I 의 셋째 열이 0 이라 t_X 의 z 성분이 곱해지는 곳이 없다. 물리적으로도 축 방향으로 카메라 위치를 바꿔도 같은 움직임이
        나온다. x·y 성분은 회전이 섞어 주므로 정해지고, 같은 축으로 도는 자세를 더 모아도 z 성분은 여전히 정해지지 않는다.
    - question: |
        translation 정확도를 높이려고 자세 사이에 로봇을 최대한 멀리 옮기는 것이 좋을까?
      choices:
        - '아니다. t_X 는 회전이 있어야 정해지고, 멀리 옮기면 로봇의 위치 오차가 더 들어온다'
        - '그렇다. 옮긴 거리가 길수록 noise 에 비해 움직임이 커져서 t_X 가 정확해진다'
        - '그렇다. 다만 회전은 하지 말고 translation 만 해야 t_X 를 깨끗하게 구한다'
        - '상관없다. translation 은 식에 들어가지 않아서, 옮긴 거리는 결과에 아무 영향이 없다'
      answer: 0
      explanation: |
        t_X 는 (R_A − I) t_X 항으로만 식에 들어오므로 회전이 정보를 준다. 로봇을 멀리 옮기면 로봇의 위치 오차가 그만큼 translation 오차로 들어오므로
        Tsai 와 Lenz 는 이동 거리를 줄이라고 권했다. translation 이 결과에 영향이 없다는 것도 틀렸는데, 이동 거리에 비례해 오차가 섞인다.

- topic: data-collection
  title: 자세 수집 조건
  variants:
    - question: |
        hand-eye calibration 의 정확도를 높이려면 자세를 어떻게 모아야 하는가?
      choices:
        - '카메라를 target 에서 최대한 멀리 두고, 회전은 작게 해 target 이 늘 정면에 보이게 한다'
        - '같은 자세를 여러 번 반복해 찍어 평균을 내서, 사진마다 섞인 noise 를 줄인다'
        - '각 축으로 크게 돌린 자세를 target 가까이에서 10 ~ 15 개 모으고, 팔이 멈춘 뒤 찍는다'
        - '자세 3 개면 식이 풀리므로, 팔이 오래 움직이지 않게 빨리 끝낸다'
      answer: 2
      explanation: |
        Tsai 와 Lenz 의 분석대로 회전 각도와 회전 축 사이 각도가 클수록, camera-target 거리가 짧을수록, 자세가 많을수록 오차가 준다. MoveIt Calibration
        tutorial 도 보통 12 ~ 15 개에서 결과가 더 나아지지 않는다고 적는다. 같은 자세 반복은 회전 축 정보를 늘리지 못하고, 작은 회전과 먼 거리는
        오차를 키운다.
    - question: |
        자세 10 개를 ±5° 범위에서만 기울여 모았더니 OpenCV 4.10 이상의 Tsai 방법이 단위 rotation 과 0 translation 을 돌려줬다. 그 이유는 무엇인가?
      choices:
        - 'X 가 실제로 단위 행렬이라서, 카메라가 gripper 원점에 같은 방향으로 붙어 있는 것이다'
        - 'Tsai 구현이 회전 약 17° 미만인 짝을 버려서, 남은 짝이 모자라 기본값을 돌려준 것이다'
        - '자세가 10 개를 넘지 않으면 Tsai 구현이 계산을 거부해서, 기본값이 나온 것이다'
        - 'target 의 크기를 잘못 넣으면 translation 이 0 이 되고 rotation 도 단위 행렬로 나온다'
      answer: 1
      explanation: |
        OpenCV 4.10 부터 Tsai 구현은 정보가 적은 작은 회전(약 17° 미만)과 너무 큰 회전(약 116° 초과)의 짝을 버린다. 남은 짝이 2 개 미만이면 오류를
        log 로만 남기고 단위 rotation 과 0 translation 을 낸다. ±5° 로 기울인 자세는 짝의 회전이 대부분 17° 보다 작다. 실제 X 가 단위 행렬일
        가능성은 거의 없고, 자세 수는 3 개 이상이면 된다. target 크기를 잘못 넣으면 translation 의 크기가 틀어질 뿐 단위 행렬이 나오지는 않는다.
    - question: |
        calibration 할 때 팔이 아직 움직이는 중에 사진을 찍으면 무엇이 문제인가?
      choices:
        - '사진을 찍은 순간과 FK 를 읽은 순간이 달라 A 와 B 의 짝이 어긋난다'
        - '사진이 조금 흐려지는 것 말고는 문제가 없고, 그 흐림도 PnP 가 걸러 낸다'
        - '움직이는 중에 찍으면 한 장에 여러 자세가 담겨 회전 정보가 많아지므로 더 정확하다'
        - '팔이 움직이면 렌즈가 흔들려 intrinsics 가 바뀌므로, intrinsics 부터 다시 calibration 해야 한다'
      answer: 0
      explanation: |
        같은 순간의 gripper pose 와 camera pose 가 짝을 이뤄야 AX = XB 가 성립한다. 팔이 움직이는 동안에는 두 값을 읽은 시각이 조금만 달라도 다른
        자세끼리 짝지어진다. 흐림도 target pose 를 틀리게 하지만 문제는 그것만이 아니고, intrinsics 는 움직임과 관계없다.

- topic: solvers
  title: Tsai-Lenz·Park-Martin·Daniilidis
  variants:
    - question: |
        Tsai-Lenz 와 Daniilidis 방법의 가장 큰 차이는 무엇인가?
      choices:
        - 'Tsai-Lenz 는 eye-in-hand 전용이고, Daniilidis 는 eye-to-hand 전용이라 설치에 따라 고른다'
        - 'Tsai-Lenz 는 자세 2 개가 최소이고, Daniilidis 는 자세 10 개가 최소라서 더 정확하다'
        - 'Tsai-Lenz 는 반복 최적화로 풀고, Daniilidis 는 한 번에 푸는 closed form 이다'
        - 'Tsai-Lenz 는 rotation 을 먼저 구한 뒤 translation 을 구하고, Daniilidis 는 둘을 함께 구한다'
      answer: 3
      explanation: |
        OpenCV 문서도 Tsai, Park, Horaud 를 separable 방법으로 나누고 Andreff 와 Daniilidis 를 simultaneous 방법으로 나눈다. Daniilidis 는
        rotation 과 translation 을 screw 로 묶어 SVD 로 함께 푼다. 두 방법 모두 설치 방식과 관계없이 AX = XB 를 풀고 최소 자세 수도 같다. 또 둘 다
        반복 최적화가 아니라 선형 식을 한 번 푸는 계산이다.
    - question: |
        calibration 결과가 나쁠 때 solver 를 Tsai 에서 Daniilidis 로 바꾸는 것이 첫 대응으로 적절할까?
      choices:
        - '적절하다. 최신 solver 일수록 noise 에 강하게 설계되어 있어서 항상 더 정확하다'
        - '적절하지 않다. 자세를 잘 모으면 solver 차이는 작고, 회전 범위와 자세 수의 효과가 훨씬 크다'
        - '적절하다. Tsai 는 rotation 만 구하고 translation 은 구하지 못해서 바꿔야 한다'
        - '적절하지 않다. Daniilidis 는 OpenCV 에 없어서 다른 library 를 따로 붙여야 한다'
      answer: 1
      explanation: |
        강의의 simulation 에서 같은 조건의 세 solver 차이는 0.1 mm 단위였지만, 회전 범위를 ±5° 에서 ±30° 로 넓히면 translation 오차가 약 6 mm
        달라졌다. 최신 solver 가 늘 더 정확하지도 않다. Tsai 도 translation 을 구하고, Daniilidis 는 OpenCV 에 CALIB_HAND_EYE_DANIILIDIS 로 들어 있다.
    - question: |
        OpenCV calibrateHandEye 의 기본 method 와, MoveIt Calibration·easy_handeye2 의 기본 solver 는 각각 무엇인가?
      choices:
        - 'OpenCV 는 Tsai 이고, MoveIt Calibration 은 Daniilidis 이며, easy_handeye2 는 Tsai-Lenz 다'
        - '셋 다 Park 다. MoveIt Calibration 과 easy_handeye2 도 OpenCV 함수의 기본값을 그대로 쓴다'
        - 'OpenCV 는 Daniilidis 이고, MoveIt Calibration 과 easy_handeye2 는 둘 다 Tsai 를 기본으로 쓴다'
        - 'OpenCV 는 기본값이 없어 method 를 꼭 넣어야 하고, 나머지 둘은 Daniilidis 다'
      answer: 0
      explanation: |
        calibrateHandEye 의 선언은 method=CALIB_HAND_EYE_TSAI 를 기본값으로 둔다. MoveIt Calibration tutorial 은 Daniilidis 가 기본이라고 적고,
        easy_handeye2 의 OpenCV backend 는 algorithm 을 지정하지 않으면 'Tsai-Lenz' 를 쓴다.

- topic: validation
  title: calibration 검증
  variants:
    - question: |
        hand-eye calibration 결과를 별도 장비 없이 검증하는 방법으로 알맞은 것은?
      choices:
        - 'solver 가 낸 rotation 행렬의 determinant 가 1 인지 보고, 1 이면 맞는 X 로 판단한다'
        - 'calibration 에 쓴 자세가 10 개를 넘는지 세어 보고, 넘으면 결과를 믿는다'
        - 'camera intrinsics 의 reprojection error 를 다시 보고, 작으면 X 도 맞다고 판단한다'
        - '자세마다 X 로 target 위치를 계산해, 고정된 target 이 모두 같은 자리로 나오는지 본다'
      answer: 3
      explanation: |
        target 이 움직이지 않았으므로 맞는 X 라면 자세마다 계산한 target 위치가 noise 만큼만 퍼진다. easy_handeye2 의 evaluator 도 이 방법을 쓴다.
        determinant 는 rotation 이면 늘 1 이라 맞고 틀림을 가리지 못하고, 자세 수나 intrinsics 의 reprojection error 는 X 자체의 정확도를 말해 주지 않는다.
    - question: |
        자세마다 계산한 target 위치의 퍼짐이 작으면 calibration 이 정확하다고 확신해도 되는가?
      choices:
        - '그렇다. 퍼짐이 작으면 X 의 오차도 그만큼 작아서, 퍼짐이 곧 위치 오차의 크기다'
        - '아니다. 자세와 관계없이 같은 방향으로 남는 오차는 퍼짐에 나타나지 않는다'
        - '아니다. 퍼짐은 intrinsics 의 오차만 보여 주고, X 의 정확도와는 아무 관계가 없다'
        - '그렇다. 다만 자세가 3 개뿐이면 퍼짐을 잴 점이 모자라 확신할 수 없다'
      answer: 1
      explanation: |
        강의의 simulation 에서 rotation 을 1° 틀리게 넣으면 0.4 m 거리에서 실제 오차는 약 7 mm 인데 퍼짐은 rms 0.79 mm 에서 2.59 mm 로만 늘었다.
        일정하게 남는 오차 성분은 평균을 옮길 뿐 퍼짐을 만들지 않기 때문이다. 그래서 calibration 에 쓰지 않은 자세로 검사하고, 뾰족한 tool 로 실제
        점을 짚어 보는 touch test 를 함께 한다.
    - question: |
        f = 500 pixel 인 카메라로 0.5 m 앞 gripper 끝을 X 와 FK 로 사진에 투영했더니 실제로 찍힌 자리와 3 pixel 떨어졌다. 좌우 위치 오차로 가장 가까운 것은?
      choices:
        - '약 3 mm'
        - '약 0.3 mm'
        - '약 1.5 mm'
        - '약 15 mm'
      answer: 0
      explanation: |
        pixel 하나는 Z ÷ f = 0.5 ÷ 500 = 0.001 m 의 좌우 거리라서 3 pixel 은 약 3 mm 다. 1.5 mm 는 거리를 0.25 m 로 잘못 넣은 값이고, 0.3 mm 와
        15 mm 는 자릿수를 잘못 계산한 값이다.
