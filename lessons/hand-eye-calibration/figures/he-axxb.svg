<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>자세 두 개로 만드는 AX = XB. gripper 가 자세 1 에서 2 로 움직인 양 A 는 FK 로, camera 가 움직인 양 B 는 두 장의 target pose 로 계산한다. gripper 1 에서 camera 2 로 가는 두 길이 같으므로 A X = X B 다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="360.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">자세 두 개로 만든 고리</text>
  <rect x="30.0" y="165.0" width="110.0" height="50.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="85.0" y="187.0" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600">base</text>
  <rect x="200.0" y="70.0" width="130.0" height="50.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="265.0" y="92.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">gripper</text>
  <text x="265.0" y="110.0" fill="#64748b" font-size="11" text-anchor="middle">자세 1</text>
  <rect x="420.0" y="70.0" width="130.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485.0" y="92.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">camera</text>
  <text x="485.0" y="110.0" fill="#64748b" font-size="11" text-anchor="middle">자세 1</text>
  <rect x="200.0" y="260.0" width="130.0" height="50.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="265.0" y="282.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">gripper</text>
  <text x="265.0" y="300.0" fill="#64748b" font-size="11" text-anchor="middle">자세 2</text>
  <rect x="420.0" y="260.0" width="130.0" height="50.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="485.0" y="282.0" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">camera</text>
  <text x="485.0" y="300.0" fill="#64748b" font-size="11" text-anchor="middle">자세 2</text>
  <rect x="580.0" y="165.0" width="110.0" height="50.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="635.0" y="187.0" fill="#94a3b8" font-size="13" text-anchor="middle" font-weight="600">target</text>
  <text x="635.0" y="205.0" fill="#64748b" font-size="11" text-anchor="middle">고정</text>
  <line x1="140.0" y1="182.0" x2="198.0" y2="102.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <line x1="140.0" y1="198.0" x2="198.0" y2="278.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="150.0" y="128.0" fill="#64748b" font-size="11" text-anchor="end">FK</text>
  <text x="150.0" y="262.0" fill="#64748b" font-size="11" text-anchor="end">FK</text>
  <line x1="330.0" y1="95.0" x2="418.0" y2="95.0" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#aa)"/>
  <text x="374.0" y="86.0" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">X</text>
  <line x1="330.0" y1="285.0" x2="418.0" y2="285.0" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#aa)"/>
  <text x="374.0" y="276.0" fill="#f59e0b" font-size="15" text-anchor="middle" font-weight="600">X</text>
  <line x1="550.0" y1="102.0" x2="600.0" y2="163.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <line x1="550.0" y1="278.0" x2="600.0" y2="217.0" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#as)"/>
  <text x="588.0" y="120.0" fill="#64748b" font-size="11" text-anchor="start">target pose 1</text>
  <text x="588.0" y="264.0" fill="#64748b" font-size="11" text-anchor="start">target pose 2</text>
  <line x1="265.0" y1="122.0" x2="265.0" y2="256.0" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#aa)"/>
  <text x="255.0" y="194.0" fill="#f59e0b" font-size="16" text-anchor="end" font-weight="600">A</text>
  <text x="255.0" y="212.0" fill="#f59e0b" font-size="11" text-anchor="end">gripper 의 움직임</text>
  <line x1="485.0" y1="122.0" x2="485.0" y2="256.0" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="4 4" marker-end="url(#as)"/>
  <text x="495.0" y="194.0" fill="#38bdf8" font-size="16" text-anchor="start" font-weight="600">B</text>
  <text x="495.0" y="212.0" fill="#38bdf8" font-size="11" text-anchor="start">camera 의 움직임</text>
  <text x="360.0" y="350.0" fill="#94a3b8" font-size="12" text-anchor="middle">gripper 1 에서 camera 2 까지 가는 두 길: A 다음 X, 또는 X 다음 B</text>
  <text x="360.0" y="374.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">두 길이 같으므로 A X = X B. target 이 어디에 있는지는 식에 남지 않는다</text>
</svg>
