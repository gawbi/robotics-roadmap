<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>translation 이 보이지 않는 두 경우. 한 축으로만 돌면 camera 를 축 방향으로 옮겨 달아도 camera 의 움직임이 같아서 그 방향의 translation 을 모른다. translation 만 하면 camera 가 어디에 달렸든 같은 화살표만큼 옮겨져 translation 이 식에서 사라진다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="360.0" y1="50.0" x2="360.0" y2="320.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="180.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">한 축으로만 돌 때</text>
  <circle cx="180" cy="170" r="7" fill="none" stroke="#d6aa62" stroke-width="2.4"/>
  <circle cx="180" cy="170" r="2" fill="#d6aa62"/>
  <text x="180.0" y="196.0" fill="#d6aa62" font-size="11" text-anchor="middle">회전 축 (화면에서 나오는 방향)</text>
  <g transform="translate(260.0,170.0) rotate(0.0)"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0f2a3d" stroke="#7cb4d8" stroke-width="1.8"/><rect x="12" y="-4" width="5" height="8" fill="#7cb4d8"/></g>
  <g transform="translate(220.0,100.7) rotate(-60.0)"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0f2a3d" stroke="#a99ad6" stroke-width="1.8"/><rect x="12" y="-4" width="5" height="8" fill="#a99ad6"/></g>
  <path d="M284,170 A104,104 0 0,0 239.7,84.8" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <text x="180.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="middle">camera 를 축 방향(화면 앞뒤)으로 옮겨 달아도</text>
  <text x="180.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">camera 가 움직인 양은 똑같다</text>
  <text x="180.0" y="322.0" fill="#d88b8b" font-size="12" text-anchor="middle" font-weight="600">→ X 의 축 방향 translation 을 알 수 없다</text>
  <text x="540.0" y="34.0" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">translation 만 할 때</text>
  <g transform="translate(450,130)"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0f2a3d" stroke="#7cb4d8" stroke-width="1.8"/><rect x="12" y="-4" width="5" height="8" fill="#7cb4d8"/></g>
  <line x1="470.0" y1="130.0" x2="560.0" y2="100.0" stroke="#7cb4d8" stroke-width="2"/>
  <circle cx="560" cy="100" r="3" fill="#7cb4d8"/>
  <g transform="translate(520,200)"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0f2a3d" stroke="#a99ad6" stroke-width="1.8"/><rect x="12" y="-4" width="5" height="8" fill="#a99ad6"/></g>
  <line x1="540.0" y1="200.0" x2="630.0" y2="170.0" stroke="#a99ad6" stroke-width="2"/>
  <circle cx="630" cy="170" r="3" fill="#a99ad6"/>
  <g transform="translate(470,230)"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#0f2a3d" stroke="#7fc4a2" stroke-width="1.8"/><rect x="12" y="-4" width="5" height="8" fill="#7fc4a2"/></g>
  <line x1="490.0" y1="230.0" x2="580.0" y2="200.0" stroke="#7fc4a2" stroke-width="2"/>
  <circle cx="580" cy="200" r="3" fill="#7fc4a2"/>
  <text x="540.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="middle">camera 가 gripper 의 어디에 달려 있든</text>
  <text x="540.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">모두 같은 화살표만큼 옮겨진다</text>
  <text x="540.0" y="322.0" fill="#d88b8b" font-size="12" text-anchor="middle" font-weight="600">→ X 의 translation 이 식에서 사라진다</text>
</svg>
