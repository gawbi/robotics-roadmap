<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>두 pipeline. 위는 RRTConnect 가 찾은 경로 하나를 shortcut 이나 TrajOpt 로 다듬고 TOTG 로 시각을 붙이는 CPU pipeline 이고, 논문의 Tesseract(RRTConnect 와 TrajOpt)는 평균 2.95 초가 걸렸다. 아래는 IK seed 30 개와 trajectory seed 12 개를 GPU 에서 함께 최적화하고 dt 를 다시 정하는 cuRobo 로, 평균 50 ms 다</title>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker></defs>
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="34.0" fill="#d6aa62" font-size="14" text-anchor="start" font-weight="600">CPU 의 2 단계 pipeline</text>
  <text x="736.0" y="34.0" fill="#d6aa62" font-size="13" text-anchor="end">Tesseract(RRTConnect → TrajOpt) 평균 2.95 s</text>
  <rect x="24.0" y="52.0" width="190.0" height="64.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="119.0" y="80.0" fill="#e2e8f0" font-size="14" text-anchor="middle">RRTConnect</text>
  <text x="119.0" y="98.0" fill="#94a3b8" font-size="12" text-anchor="middle">충돌만 보고 경로 1 개</text>
  <rect x="268.0" y="52.0" width="190.0" height="64.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="363.0" y="80.0" fill="#e2e8f0" font-size="14" text-anchor="middle">shortcut · TrajOpt</text>
  <text x="363.0" y="98.0" fill="#94a3b8" font-size="12" text-anchor="middle">그 경로 근처만 다듬기</text>
  <rect x="512.0" y="52.0" width="220.0" height="64.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="622.0" y="80.0" fill="#e2e8f0" font-size="14" text-anchor="middle">TOTG</text>
  <text x="622.0" y="98.0" fill="#94a3b8" font-size="12" text-anchor="middle">시각 붙이기 · jerk 제한 없음</text>
  <line x1="216.0" y1="84.0" x2="264.0" y2="84.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="460.0" y1="84.0" x2="508.0" y2="84.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="24.0" y="140.0" fill="#94a3b8" font-size="12" text-anchor="start">앞 단계가 고른 길을 뒤 단계가 바꾸지 못한다</text>
  <line x1="24.0" y1="160.0" x2="736.0" y2="160.0" stroke="#1e293b" stroke-width="1"/>
  <text x="24.0" y="188.0" fill="#7fc4a2" font-size="14" text-anchor="start" font-weight="600">cuRobo 의 GPU motion generation</text>
  <text x="736.0" y="188.0" fill="#7fc4a2" font-size="13" text-anchor="end">RTX 4090 평균 50 ms</text>
  <rect x="36.0" y="194.0" width="150.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="30.0" y="200.0" width="150.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="24.0" y="206.0" width="150.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="99.0" y="238.0" fill="#e2e8f0" font-size="14" text-anchor="middle">충돌 없는 IK</text>
  <text x="99.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">seed 30 개를 함께</text>
  <rect x="218.0" y="194.0" width="160.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="212.0" y="200.0" width="160.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="206.0" y="206.0" width="160.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="286.0" y="238.0" fill="#e2e8f0" font-size="14" text-anchor="middle">trajectory seed</text>
  <text x="286.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">12 개 (직선·경유)</text>
  <rect x="410.0" y="194.0" width="170.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="404.0" y="200.0" width="170.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5" opacity="0.45"/>
  <rect x="398.0" y="206.0" width="170.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="483.0" y="238.0" fill="#e2e8f0" font-size="14" text-anchor="middle">particle 2 회</text>
  <text x="483.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">→ L-BFGS 로 마무리</text>
  <rect x="600.0" y="206.0" width="136.0" height="72.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="668.0" y="230.0" fill="#e2e8f0" font-size="14" text-anchor="middle">dt 재조정</text>
  <text x="668.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="middle">jerk 비용을 켜고</text>
  <text x="668.0" y="264.0" fill="#94a3b8" font-size="12" text-anchor="middle">다시 최적화</text>
  <line x1="188.0" y1="242.0" x2="202.0" y2="242.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="380.0" y1="242.0" x2="394.0" y2="242.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <line x1="582.0" y1="242.0" x2="596.0" y2="242.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a-muted)"/>
  <text x="24.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="start">seed 마다·자세마다·구마다 거리 계산을 동시에 하고, 결과 가운데 가장 좋은 trajectory 하나를 고른다</text>
</svg>
