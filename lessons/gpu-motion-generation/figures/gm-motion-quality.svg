  <text x="24.0" y="324.0" fill="#94a3b8" font-size="12" text-anchor="start">Tesseract-TG 는 cuRobo 보다 0.34 s 빨리 끝나지만 최대 jerk 는 602 ÷ 49 ≈ 12 배</text>
