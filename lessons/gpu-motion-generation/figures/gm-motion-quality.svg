  <rect x="429.0" y="212.9" width="52.0" height="57.1" rx="2" fill="#a99ad6" stroke="#a99ad6" stroke-width="1" opacity="0.85"/>
  <text x="455.0" y="204.9" fill="#a99ad6" font-size="13" text-anchor="middle">200</text>
