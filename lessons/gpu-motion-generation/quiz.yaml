# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: trajopt-cost
  title: 비용 최소화로 쓴 motion generation
  section: trajectory-optimization
  variants:
    - question: |
        trajectory optimization 으로 motion generation 을 할 때 충돌 회피와 관절 한계는 어떻게 다루는가?
      choices:
        - '충돌 없는 경로를 먼저 찾고, 그 경로에 관절 한계를 지키는 시각만 따로 붙이는 두 단계로 나눠 푼다'
        - '충돌과 한계를 큰 weight 를 곱한 비용 항으로 바꿔, 매끄러움·목표 비용과 함께 하나의 합으로 줄인다'
        - '충돌은 빼고 매끄러움만 최적화한 뒤, 실행하면서 controller 가 장애물에서 팔을 밀어내도록 맡긴다'
        - '관절 한계를 넘는 자세가 나오면 그 seed 를 버리고, 한계 안의 무작위 seed 로 처음부터 다시 푼다'
      answer: 1
      explanation: |
        trajectory optimization 은 trajectory 를 숫자의 목록(cuRobo 는 자세 32 개)으로 두고, 충돌과 관절 한계를 큰 weight 를 곱한 비용 항으로
        바꿔 목표·매끄러움 비용과 함께 하나의 합을 줄인다. 경로를 찾은 뒤 시각을 붙이는 두 단계 방식은 sampling planner 와 후처리 pipeline 의
        방식이다. 충돌을 controller 에 맡기면 계획 단계에서 충돌 없는 trajectory 를 보장할 수 없다. 한계를 넘는 seed 를 버리는 것이 아니라,
        한계 비용의 gradient 로 한계 안쪽으로 밀어 넣는다.
    - question: |
        trajectory 의 가운데 waypoint 높이 y 에 대한 비용의 gradient 가 +10 이다. 비용을 줄이려면 y 를 어떻게 옮겨야 하는가?
      choices:
        - 'y 를 늘린다. gradient 가 가리키는 + 방향이 비용이 줄어드는 방향이기 때문이다'
        - 'y 를 그대로 둔다. gradient 가 0 이 아니면 이미 비용이 가장 작은 자리이기 때문이다'
        - 'y 를 줄인다. + 는 y 를 늘릴 때 비용이 는다는 뜻이라 반대쪽으로 옮겨야 한다'
        - 'y 를 정확히 10 만큼 줄인다. gradient 의 크기가 옮겨야 할 거리이기 때문이다'
      answer: 2
      explanation: |
        gradient 가 + 면 그 변수를 늘릴 때 비용이 늘고, − 면 줄고, 0 이면 변화가 없다. +10 이므로 y 를 줄이는 쪽으로 옮겨야 비용이 준다.
        + 방향은 비용이 느는 방향이라 y 를 늘리면 비용이 커진다. 비용이 가장 작은 자리에서는 gradient 가 0 이므로 +10 인 자리는 최솟값이 아니다.
        gradient 의 크기는 비용이 바뀌는 비율이지 옮길 거리가 아니어서, 실제로 옮기는 양은 step 크기를 곱해 정한다.
    - question: |
        trajectory optimization 에서 가속도·jerk 의 제곱으로 만든 매끄러움 비용이 하는 일로 옳은 것은?
      choices:
        - '충돌한 자세에만 벌점을 주어, 장애물에 닿은 waypoint 를 장애물 밖으로 밀어내는 힘을 만든다'
        - '목표 pose 와 마지막 자세의 차이에 벌점을 주어, 손끝이 목표에 정확히 닿도록 만든다'
        - '관절 각도의 크기 자체에 벌점을 주어, 팔이 늘 0 rad 근처의 자세에 머물도록 만든다'
        - '이웃 자세와의 차이에 벌점을 주어, 장애물에 밀린 점 하나의 움직임을 이웃 자세로 퍼뜨린다'
      answer: 3
      explanation: |
        매끄러움 비용은 이웃 자세끼리 뺀 속도·가속도·jerk 에 벌점을 준다. 그래서 장애물에 밀린 waypoint 하나가 움직이면 이웃 waypoint 도 따라
        움직여 경로 전체가 매끄럽게 휜다. 충돌한 자세를 밀어내는 것은 충돌 비용이 하는 일이다. 손끝을 목표에 맞추는 것은 목표 비용이 하는 일이다.
        관절 각도의 크기에 벌점을 주는 항은 매끄러움 비용이 아니고, 그런 항이 있으면 목표에 닿는 것을 방해한다.

- topic: local-minimum
  title: seed 와 local minimum
  section: seed-여러-개의-병렬-최적화
  variants:
    - question: |
        trajectory optimization 에서 시작 trajectory(seed)를 여러 개 두고 각각 최적화하는 가장 큰 이유는 무엇인가?
      choices:
        - '최적화가 seed 근처의 골짜기로만 내려가서, 출발점이 다르면 더 좋은 해에 닿을 수 있기 때문이다'
        - 'seed 들의 결과를 평균 내면 noise 가 줄어서, 한 seed 의 결과보다 매끄러운 경로가 되기 때문이다'
        - 'seed 가 많을수록 seed 하나의 반복 횟수가 줄어서, 전체 계산 시간이 짧아지기 때문이다'
        - 'seed 를 여러 개 쓰면 길이 없는 문제에서 길이 없다는 것을 증명할 수 있기 때문이다'
      answer: 0
      explanation: |
        gradient 기반 최적화는 seed 근처의 골짜기(local minimum)로 내려갈 뿐이라, seed 가 다르면 다른 해에 닿는다. 여러 seed 를 풀고 가장 좋은
        결과를 고르면 더 좋은 해를 찾을 가능성이 커진다. 결과를 평균 내지 않고 하나를 고른다. seed 수가 늘어도 seed 마다의 반복 수는 그대로라
        계산량은 늘어난다. seed 를 늘려도 길이 없다는 증명은 되지 않는다.
    - question: |
        장애물 중심보다 위를 지나는 seed 를 gradient 로 최적화했더니, 아래로 도는 더 싼 경로가 있는데도 위로 크게 도는 비싼 경로에 멈췄다. 왜 그런가?
      choices:
        - 'step 크기가 너무 커서 아래쪽 경로를 건너뛰었고, step 만 줄이면 반드시 아래쪽 경로로 간다'
        - 'gradient 는 지금 자리에서 비용이 주는 방향만 보아서, seed 가 위쪽 골짜기에 있으면 위쪽 해에 멈춘다'
        - '매끄러움 비용의 weight 가 0 이라서, 경로가 장애물의 어느 쪽으로 돌지 정할 수 없었기 때문이다'
        - '충돌 비용이 구를 장애물 중심 쪽으로 끌어당겨서, 위쪽 seed 는 장애물에 붙어 버리기 때문이다'
      answer: 1
      explanation: |
        gradient 로는 지금 자리 근처에서 비용이 줄어드는 방향만 알 수 있으므로, 장애물 위를 지나는 seed 는 위로 밀려 위쪽 골짜기의 해에 멈춘다.
        이런 해를 local minimum 이라고 한다. step 을 줄여도 위쪽 골짜기 안에서 더 천천히 내려갈 뿐 아래쪽 해로 넘어가지 않는다. 매끄러움 weight
        가 0 이 아니어도 seed 의 위치가 어느 골짜기로 갈지 정한다. 충돌 비용은 구를 장애물 밖으로 밀어내지 중심 쪽으로 끌어당기지 않는다.
    - section: trajectory-optimization
      question: |
        trajectory optimization 과 RRT 같은 sampling planner 의 성질을 비교한 설명으로 옳은 것은?
      choices:
        - 'trajectory optimization 은 시간을 늘리면 길을 반드시 찾지만, sampling planner 는 local minimum 에 빠질 수 있다'
        - '둘 다 길이 없을 때 없다는 것을 증명할 수 있고, 차이는 결과 경로가 매끄러운지 아닌지뿐이다'
        - 'sampling planner 는 표본이 늘면 길을 찾을 확률이 1 에 가까워지지만, 최적화는 seed 근처 해만 찾는다'
        - '둘 다 seed 하나에서 시작해 gradient 로 경로를 고치므로, 길을 찾는다는 보장의 정도가 같다'
      answer: 2
      explanation: |
        RRT 같은 sampling planner 는 길이 있다면 표본이 늘수록 찾을 확률이 1 에 가까워지는 probabilistic completeness 를 가진다. trajectory
        optimization 은 seed 근처의 해만 찾으므로 그런 보장이 없다. 시간을 늘려도 찾는다는 보장이 없는 쪽은 trajectory optimization 이다. 둘 다
        길이 없다는 것을 증명하지 못한다. sampling planner 는 gradient 를 쓰지 않고 무작위 표본으로 tree 나 graph 를 키운다.

- topic: sdf-spheres
  title: 구 근사와 signed distance field
  section: 구-근사와-signed-distance-field
  variants:
    - question: |
        로봇을 구 여러 개로 근사하고 signed distance field(SDF)를 쓰면 충돌 거리 계산이 단순해지는 이유는 무엇인가?
      choices:
        - 'SDF 는 장애물 mesh 의 삼각형을 모두 저장하므로, 구와 삼각형 사이 거리를 하나씩 다시 계산하면 된다'
        - '구는 관절이 움직여도 위치가 바뀌지 않아서, 계획을 시작할 때 한 번만 거리를 계산하면 된다'
        - 'SDF 는 충돌 여부만 0 과 1 로 적어 두므로, 거리 대신 충돌한 칸의 수만 세면 된다'
        - '구 중심이 든 칸의 SDF 값에서 반지름만 빼면 거리가 나오고, 이웃 칸과 비교하면 밀어낼 방향도 나온다'
      answer: 3
      explanation: |
        SDF 는 칸마다 가장 가까운 장애물 표면까지의 거리를 밖이면 +, 안이면 − 로 적어 둔 표다. 구 중심이 든 칸의 값에서 반지름을 빼면 구 표면까지
        거리가 나오고, 이웃 칸과 비교하면 거리가 늘어나는 방향(gradient)도 나온다. SDF 는 삼각형이 아니라 거리를 저장한다. 구는 link 에 붙어 있어
        관절이 움직이면 위치가 바뀌므로 자세마다 다시 조회한다. 0 과 1 만 적는 것은 occupancy grid 이고 SDF 는 거리를 적는다.
    - question: |
        반지름 0.05 m 인 구의 중심에서 읽은 ESDF 값이 0.03 m 다. 이 구와 장애물의 관계로 옳은 것은?
      choices:
        - '구 표면까지 거리가 0.03 − 0.05 = −0.02 m 라서, 구가 장애물에 0.02 m 파고들었다'
        - '구 중심이 장애물 밖에 있으므로, 구 전체가 장애물 밖에 있고 0.03 m 의 여유가 있다'
        - 'ESDF 값이 반지름보다 작아도 0 보다 크면 충돌이 아니므로, 충돌 비용은 0 이다'
        - '구 표면까지 거리가 0.03 + 0.05 = 0.08 m 라서, 장애물에서 넉넉히 떨어져 있다'
      answer: 0
      explanation: |
        ESDF 값은 구 중심에서 가장 가까운 장애물 표면까지의 거리라서, 구 표면까지의 거리는 여기서 반지름을 빼 $0.03 - 0.05 = -0.02$ m 다. 음수이므로
        구가 0.02 m 파고들었다. 중심이 밖에 있어도 반지름이 그 거리보다 크면 구의 일부가 장애물 안에 들어간다. 그래서 ESDF 값이 0 보다 커도 반지름보다
        작으면 충돌이다. 반지름은 거리에서 빼야 하고 더하면 안 된다.
    - section: moveit-2-와-isaac-ros-cumotion
      question: |
        depth camera 로 ESDF 를 만들어 팔의 충돌을 피하게 했더니, 팔이 거의 움직이지 못하고 계획이 자주 실패한다. 가장 먼저 의심할 원인은 무엇인가?
      choices:
        - 'ESDF 는 표면 근처 칸에만 거리를 적어서, 팔에서 먼 장애물까지의 거리를 읽을 수 없게 된다'
        - 'depth image 에 찍힌 팔 자신이 장애물로 들어가서, 팔의 구가 처음부터 장애물과 겹친 것으로 계산된다'
        - 'depth camera 는 1 초에 30 번만 찍으므로, 계획하는 동안 ESDF 가 한 번도 갱신되지 않는다'
        - '구 근사는 depth camera 와 함께 쓸 수 없어서, mesh 근사로 바꾸기 전에는 계획이 실패한다'
      answer: 1
      explanation: |
        camera 에는 팔 자신도 찍히므로 그대로 ESDF 를 만들면 팔이 차지한 자리가 장애물이 되고, 팔의 구가 처음부터 장애물과 겹친 것으로 계산된다.
        그래서 지금 관절 각도로 팔이 차지하는 pixel 을 지우는 robot segmenter 를 앞에 둔다. 표면 근처에만 거리를 적는 것은 TSDF 이고, ESDF 는 모든
        칸에 거리를 적는다. 갱신 주기는 실패의 원인이 아니라 장면을 얼마나 늦게 반영하느냐의 문제다. 구 근사는 ESDF 와 함께 쓰는 방식이다.

- topic: activation-distance
  title: activation distance
  section: 구-근사와-signed-distance-field
  variants:
    - question: |
        충돌 비용에 activation distance η 를 두어, 구 표면이 장애물 표면에서 η 안쪽으로 들어오면 비용이 제곱으로 오르기 시작하게 하는 이유는 무엇인가?
      choices:
        - 'η 를 두면 장애물 안에서 비용이 무한대가 되어, 최적화가 장애물로 들어가는 것을 완전히 막기 때문이다'
        - 'η 안쪽의 장애물은 계산에서 빼므로, 작은 장애물을 무시해 최적화가 빨라지기 때문이다'
        - '파고든 깊이에만 비용을 주면 표면을 스치는 경로가 나와서, 보간한 사이 자세가 충돌할 수 있기 때문이다'
        - 'η 가 로봇 구의 반지름을 대신하므로, 구 근사 없이도 장애물까지의 거리를 구할 수 있기 때문이다'
      answer: 2
      explanation: |
        파고든 깊이에만 비용을 주면 표면 바로 밖에서 비용과 gradient 가 0 이라 최적화가 표면을 스치는 경로를 고르고, 촘촘히 보간한 사이 자세가
        장애물 안으로 들어갈 수 있다. η 는 표면에 다가오는 것부터 부드럽게 벌점을 주어 여유를 만든다. η 를 두어도 장애물 안의 비용은 깊이에 대한
        일차식이라 무한대가 아니다. η 안쪽은 무시하는 영역이 아니라 비용이 생기기 시작하는 영역이다. η 는 반지름을 대신하지 않고 반지름을 뺀 거리에 쓴다.
    - question: |
        activation distance η = 0.025 m 인 충돌 비용에서, 구 표면이 장애물에서 0.01 m 떨어져 있고 거리 d 에 대한 비용의 기울기가 −0.6 이다. 이 값이 뜻하는 것은?
      choices:
        - '기울기가 − 라서 구를 장애물 쪽으로 옮길수록 비용이 줄고, 표면에 붙은 자리가 가장 좋다'
        - '아직 장애물에 닿지 않았으므로 이 기울기는 쓰이지 않고, 충돌한 뒤에만 구를 밀어낸다'
        - '기울기 −0.6 은 구를 정확히 0.6 m 옮겨야 비용이 0 이 된다는 뜻이다'
        - '기울기가 − 라서 d 를 늘리는 쪽, 장애물에서 멀어지는 쪽으로 구를 옮기면 비용이 준다'
      answer: 3
      explanation: |
        기울기가 − 면 d 를 늘릴 때 비용이 줄어든다. d 는 장애물 표면까지의 거리이므로 장애물에서 멀어지는 쪽으로 구를 옮기면 비용이 준다. 장애물
        쪽으로 옮기는 것은 d 를 줄이는 것이라 비용이 늘어난다. η 안쪽에서는 닿기 전부터 기울기가 생겨 구를 미리 밀어내는 것이 η 를 두는 이유다.
        기울기는 비용이 바뀌는 비율이지 옮겨야 할 거리가 아니다.
    - question: |
        cuRobo 의 충돌 비용은 구가 장애물 안으로 파고든 뒤에는 깊이에 대한 일차식이다. 구가 0.05 m 파고들었을 때와 0.01 m 파고들었을 때의 기울기를 비교하면?
      choices:
        - '두 경우 모두 기울기의 크기가 같아서, 깊이 들어가도 밀어내는 힘이 폭발하지 않는다'
        - '깊이의 제곱에 비례해 기울기가 커져서, 0.05 m 일 때 밀어내는 힘이 25 배 크다'
        - '깊이 들어갈수록 기울기가 0 에 가까워져서, 깊이 파고든 구는 밀려 나오지 않는다'
        - '파고든 뒤에는 비용이 무한대로 고정되어 기울기가 없고, 그 seed 는 버려진다'
      answer: 0
      explanation: |
        파고든 깊이를 s 라고 하면 비용은 s + η/2 꼴의 일차식이라 기울기가 늘 같은 크기(1)다. 그래서 깊이 파고든 구에도 같은 크기의 힘으로 밖을 향해
        밀어내고, 힘이 폭발해 최적화가 불안정해지지 않는다. 제곱으로 오르는 구간은 표면 밖 η 안쪽뿐이다. 기울기가 0 에 가까워지지 않으므로 깊은 구도
        밀려 나온다. 비용은 무한대가 아니며 seed 를 버리지도 않는다.

- topic: particle-lbfgs
  title: particle 최적화와 L-BFGS
  section: seed-여러-개의-병렬-최적화
  variants:
    - question: |
        cuRobo 가 L-BFGS 전에 particle 최적화(후보를 무작위로 흔들어 비용으로 가중 평균)를 몇 번 하는 이유는 무엇인가?
      choices:
        - 'particle 최적화가 L-BFGS 보다 정밀해서, 목표 pose 오차를 mm 아래로 줄이는 마무리를 맡기 때문이다'
        - 'gradient 없이 넓은 범위의 후보를 비교해 seed 를 좋은 쪽으로 옮겨, L-BFGS 가 출발할 자리를 만든다'
        - 'L-BFGS 는 GPU 에서 계산할 수 없어서, 병렬 계산이 되는 particle 최적화가 계산 대부분을 대신한다'
        - '후보를 흔들어 충돌한 seed 를 찾아 버리는 단계라서, 최적화가 아니라 seed 를 거르는 검사다'
      answer: 1
      explanation: |
        particle 최적화는 gradient 없이 seed 주변의 후보를 비용으로 비교해 평균을 좋은 쪽으로 옮긴다. 끊기는 비용에서도 쓸 수 있고, L-BFGS 가 출발하기
        좋은 자리를 만든다. cuRobo 논문에서 두 번만 해도 성공률이 올랐다. 마무리 정밀도는 L-BFGS 가 맡는다. L-BFGS 도 seed 마다 GPU 에서 병렬로
        계산한다. 후보를 버리는 검사가 아니라 weight 로 섞어 seed 를 옮기는 최적화다.
    - question: |
        MPPI 식 가중 평균에서 후보의 weight 를 exp(−(비용 − 가장 작은 비용) ÷ β) 에 비례하게 준다. temperature β 를 크게 하면 어떻게 되는가?
      choices:
        - '비용이 가장 작은 후보 하나에 weight 가 몰리고, β 를 작게 하면 후보를 고르게 섞는다'
        - 'weight 의 합이 β 배로 커져서, 새 평균이 후보들 바깥으로 β 배만큼 멀리 나간다'
        - '비용 차이를 작게 보아 후보를 고르게 섞고, β 를 작게 하면 가장 싼 후보 쪽으로 몰린다'
        - 'β 는 후보의 개수를 정하는 값이라서, 크게 하면 후보가 늘고 weight 는 바뀌지 않는다'
      answer: 2
      explanation: |
        비용 차이를 β 로 나눈 뒤 지수를 취하므로, β 가 크면 차이가 작게 보여 weight 가 고르게 퍼지고, β 가 작으면 가장 싼 후보의 weight 가 1 에
        가까워진다. 첫째 보기는 β 의 효과를 거꾸로 말한다. weight 는 합이 1 이 되도록 나누므로 평균이 후보들 바깥으로 나가지 않는다. 후보의
        개수는 β 와 따로 정한다.
    - question: |
        L-BFGS 가 같은 배율의 gradient descent 보다 적은 반복으로 수렴하는 이유는 무엇인가?
      choices:
        - 'gradient 를 계산하지 않고 무작위 후보의 비용만 비교해서, 한 번의 반복이 훨씬 가볍기 때문이다'
        - '변수 수 × 변수 수 크기의 Hessian 을 매 반복 정확히 계산하고 그 inverse 를 구하기 때문이다'
        - '매 반복 걸음 크기를 1 로 고정해서, 비용이 늘어나는 경우에도 멈추지 않고 계속 나아가기 때문이다'
        - '최근 변수 변화와 gradient 변화의 비율로 곡선이 휜 정도를 추정해, 걸음 크기를 맞추기 때문이다'
      answer: 3
      explanation: |
        L-BFGS 는 최근 몇 번의 변수 변화와 gradient 변화를 기억해 비용 곡선이 휜 정도를 추정하고, 그에 맞춰 걸음을 정한다. 비용이 (x − 3)² 인 예에서
        gradient descent 는 남은 거리를 매번 20% 씩 줄였지만, 휜 정도를 추정한 걸음은 한 번에 바닥에 닿았다. 무작위 후보만 비교하는 것은 particle
        최적화다. L-BFGS 는 큰 Hessian 을 만들지 않고 최근 몇 쌍의 기억으로 그 효과를 낸다. 걸음 크기는 line search 로 고른다.

- topic: time-step-jerk
  title: time step 재조정과 jerk
  section: time-step-최적화와-jerk
  variants:
    - question: |
        trajectory 의 자세 위치는 그대로 두고 자세 사이의 시간 간격 dt 만 절반으로 줄이면 속도·가속도·jerk 는 어떻게 되는가?
      choices:
        - '속도·가속도·jerk 가 모두 2 배가 된다'
        - '속도는 2 배가 되고, 가속도는 4 배가 되고, jerk 는 8 배가 된다'
        - '속도는 2 배가 되고, 가속도와 jerk 는 그대로다'
        - '속도는 절반이 되고, 가속도는 4 분의 1 이 되고, jerk 는 8 분의 1 이 된다'
      answer: 1
      explanation: |
        속도는 위치 차이를 dt 로 한 번 나누고, 가속도는 두 번, jerk 는 세 번 나눈다. dt 를 절반으로 줄이면 속도는 2 배가 되고, 가속도는 $2^2 = 4$ 배가
        되고, jerk 는 $2^3 = 8$ 배가 된다. 모두 2 배라고 하면 가속도와 jerk 가 dt 로 여러 번 나눠진다는 점을 놓친다. 가속도와 jerk 도 dt 에 따라 바뀐다.
        절반·4 분의 1·8 분의 1 은 dt 를 2 배로 늘렸을 때의 결과다.
    - question: |
        TOTG 로 시각을 다시 붙인 trajectory 와, jerk 까지 비용에 넣어 최적화한 trajectory 를 비교했다. 일반적으로 옳은 설명은?
      choices:
        - 'TOTG 는 jerk 한계까지 지키는 방법이라서, 두 trajectory 의 최대 jerk 는 거의 같다'
        - 'jerk 를 줄이면 가속도를 한계까지 쓸 수 없어서, 이동 시간이 TOTG 의 몇 배로 늘어난다'
        - 'TOTG 는 경로 모양까지 다시 최적화하므로, 충돌 여유와 이동 시간이 모두 더 좋아진다'
        - 'TOTG 는 가속도를 한계까지 한순간에 올려 조금 빨리 끝나지만, 최대 jerk 가 훨씬 크다'
      answer: 3
      explanation: |
        TOTG 는 속도·가속도 한계 안에서 가장 빠른 시각을 붙이므로 가속도를 한순간에 한계까지 올리고, jerk 는 제한하지 않는다. cuRobo 논문에서
        TOTG 를 쓴 결과는 평균 0.34 초 빨랐지만 최대 jerk 는 약 12 배였다. TOTG 는 jerk 한계를 지키지 않는다. jerk 를 줄여도 이동 시간은 몇 배가
        아니라 조금 늘었다. TOTG 는 주어진 경로에 시각만 붙이고 경로 모양은 바꾸지 않는다.
    - question: |
        dt 재조정에서 첫 결과의 dt 를 s 배로 줄일 때, 속도·가속도·jerk 한계를 지킬 조건이 각각 s ≥ 0.15, s ≥ 0.2, s ≥ 0.13 이다. 어떤 s 를 고르고 무엇이 시간을 정하는가?
      choices:
        - 's = 0.2 를 고른다. 가속도 한계가 가장 먼저 닿아 전체 시간을 정한다'
        - 's = 0.13 을 고른다. jerk 한계가 가장 느슨해서 전체 시간을 정한다'
        - 's = 0.15 를 고른다. 속도 한계가 늘 이동 시간을 정하기 때문이다'
        - '세 값의 평균 0.16 을 골라 세 한계를 고르게 나눠 쓴다'
      answer: 0
      explanation: |
        세 조건을 모두 만족하는 가장 작은 s 는 가장 큰 하한인 0.2 다. 이때 가속도가 한계에 닿고 속도와 jerk 는 한계 안에 남으므로 가속도 한계가
        전체 시간을 정한다. 0.13 이나 0.15 를 고르면 가속도가 한계를 넘는다. 평균 0.16 도 가속도 조건을 어긴다. 어느 한계가 시간을 정하는지는
        trajectory 마다 달라서 속도 한계가 늘 정하는 것도 아니다.

- topic: benchmark
  title: 벤치마크 숫자 읽기
  section: 벤치마크-조건
  variants:
    - question: |
        어떤 GPU planner 의 계획 시간이 평균 50 ms, 75번째 백분위 30 ms, 98번째 백분위 260 ms 였다. 장면이 바뀔 때마다 다시 계획하는 주기를 정할 때 옳은 해석은?
      choices:
        - '평균이 50 ms 이므로 주기를 50 ms 로 두면, 거의 모든 문제가 그 주기 안에 끝난다'
        - '대부분은 빨리 풀리지만 소수의 느린 문제가 평균을 끌어올리므로, 주기는 꼬리 쪽 시간을 보고 정한다'
        - '75번째 백분위가 평균보다 짧은 것은 측정 오류라서, 백분위는 버리고 평균만 기준으로 쓴다'
        - '98번째 백분위는 실패한 문제의 시간이라서, 성공한 문제의 주기를 정할 때는 고려하지 않는다'
      answer: 1
      explanation: |
        75번째 백분위가 평균보다 짧다는 것은 대부분의 문제가 빨리 풀리고 소수의 느린 문제(98번째 백분위 260 ms)가 평균을 끌어올린다는 뜻이다. 주기를
        평균으로 정하면 느린 문제에서 주기를 놓치므로 꼬리 쪽 시간을 본다. 평균 50 ms 를 주기로 두면 98번째 백분위의 260 ms 같은 꼬리 쪽
        문제는 주기를 다섯 배 넘긴다. 백분위가 평균보다 짧은 것은 오류가 아니라 분포가 한쪽으로 긴 결과다. 백분위는 성공·실패와 관계없이 시간의 분포를 나타낸다.
    - question: |
        GPU IK solver 가 pose 1,000 개를 묶어 풀면 CPU IK 보다 20 배 넘게 빨랐지만, pose 하나만 풀면 더 느렸다. 알맞은 설명은?
      choices:
        - 'GPU 의 IK 는 정확도가 낮아서, pose 하나를 풀 때는 같은 문제를 여러 번 다시 풀어야 하기 때문이다'
        - 'CPU IK 는 pose 가 많으면 정확도를 낮춰 빨라지고, pose 가 하나면 정확도를 높이기 때문이다'
        - 'GPU 는 많은 문제를 동시에 계산할 때 이득이 크고, 문제 하나에서는 준비에 드는 고정 시간이 크게 보인다'
        - 'GPU 는 pose 를 1,000 개 단위로만 풀 수 있어서, 하나를 풀 때도 1,000 개 분량을 계산하기 때문이다'
      answer: 2
      explanation: |
        GPU 는 수천 개의 core 로 많은 문제를 동시에 풀 때 이득이 크다. 문제가 하나뿐이면 core 가 거의 놀고, 계산을 준비하고 결과를 가져오는 고정
        시간이 크게 보인다. cuRobo 논문에서 pose 하나는 2.7 ms 로 TRAC-IK(0.9 ms)보다 느렸고, pose 1,000 개는 27 ms 대 629 ms 였다. 정확도가 낮아
        다시 푼다는 설명은 묶어 풀 때 오히려 빨라지는 이유를 설명하지 못한다. CPU IK 가 문제 수에 따라 정확도를 바꾸지도 않는다. GPU IK 는 묶음 크기를
        바꿔 풀 수 있다.
    - question: |
        GPU planner 가 CPU planner 보다 평균 60 배 빠르다는 논문 결과를 읽을 때 함께 확인해야 할 것으로 가장 알맞은 것은?
      choices:
        - 'GPU 의 core 수만 확인하면 되고, 비교한 planner 와 문제 집합은 배율에 영향을 주지 않는다'
        - '평균 배율이 60 배면 어떤 문제와 장치에서도 60 배이므로, 다른 조건은 확인할 필요가 없다'
        - 'CPU planner 는 언제나 GPU 보다 수십 배 느리므로, 구현이 달라도 배율은 거의 바뀌지 않는다'
        - '비교한 CPU planner 의 구현과 설정, 그리고 계획 시간 말고 이동 시간·jerk 같은 결과의 질도 본다'
      answer: 3
      explanation: |
        배율은 무엇과 어떤 조건에서 비교했는지에 달려 있다. 같은 RRTConnect 도 CPU 의 SIMD 명령으로 다시 짠 구현은 중앙값 40 µs 에 경로를 찾았고,
        cuRobo 논문에서 비교한 Tesseract 의 RRTConnect 단계는 평균 1.5 초였다. 계획이 빨라도 이동 시간이 길거나 jerk 가 크면 좋은 결과가 아니다.
        core 수만으로는 배율이 정해지지 않는다. 문제 집합과 장치가 바뀌면 배율도 바뀌어서, 같은 cuRobo 도 15 W Jetson 에서는 배율이 21 배였다.
        CPU 가 언제나 느리다는 생각은 SIMD 구현의 결과와 맞지 않는다.

- topic: replan-mpc
  title: 다시 계획하기와 MPC
  section: mpc-모드
  variants:
    - question: |
        한 번 계획한 trajectory 를 1.6 초 동안 실행하는 도중에 사람이 손을 뻗었다. 실행 중에도 장애물에 반응하려면 어떤 방식이 알맞은가?
      choices:
        - '짧은 앞날의 명령을 매 주기 새 장면으로 다시 최적화하고, 그 가운데 첫 명령만 보내는 MPC 를 쓴다'
        - '계획할 때 seed 를 더 늘려 둔다. seed 가 많으면 실행 중에 나타난 장애물도 미리 피해 간다'
        - 'activation distance 를 크게 잡는다. 여유가 크면 나중에 나타난 장애물도 계획에 들어간다'
        - 'dt 를 줄여 더 빨리 움직인다. 실행이 짧아지면 장애물이 나타나도 영향을 받지 않는다'
      answer: 0
      explanation: |
        한 번 계획한 trajectory 는 계획을 시작할 때의 장면만 보므로 실행 중에 나타난 장애물에 반응하지 못한다. MPC 는 짧은 horizon 의 명령을 매 주기
        새 장면으로 다시 최적화해 첫 명령만 보내므로 바뀐 장면을 다음 주기에 반영한다. seed 를 늘려도 계획할 때 없던 장애물은 보이지 않는다.
        activation distance 는 이미 아는 장애물과의 여유일 뿐이다. 빨리 움직여도 실행 중에 장애물이 나타날 수 있다.
    - question: |
        MPPI 기반 MPC 를 1 초에 수백 번 계산할 수 있는데도, 선반 안쪽처럼 크게 돌아가는 이동은 trajectory optimization 으로 계획하는 이유는?
      choices:
        - 'MPC 는 장애물을 전혀 고려하지 않고 목표 쪽으로만 움직여서, 큰 이동에서는 반드시 충돌한다'
        - 'MPC 는 짧은 horizon 과 무작위 후보만 보아서, 크게 도는 경로에서 local minimum 에 갇히기 쉽다'
        - 'MPC 는 GPU 에서만 계산되고 trajectory optimization 은 CPU 에서 계산되므로 큰 이동은 CPU 가 맡는다'
        - 'MPC 는 관절을 하나씩 따로 최적화해서, 여러 관절이 함께 움직이는 큰 이동을 나타내지 못한다'
      answer: 1
      explanation: |
        MPC 는 짧은 앞날만 보고 무작위 후보를 가중 평균하므로, 크게 돌아가야 하는 목표에서는 지금 자리 근처의 local minimum 에 갇힐 수 있고 움직임의
        질도 trajectory optimization 보다 낮다. 그래서 큰 이동은 계획하고 장면이 계속 바뀌는 짧은 구간에 MPC 를 쓴다. MPC 도 비용에 충돌 항을 넣어
        장애물을 피한다. cuRobo 에서는 둘 다 GPU 에서 계산한다. MPC 의 후보는 모든 관절의 명령 순서를 함께 다룬다.
    - question: |
        MPC 가 0.03 초마다 명령을 다시 계산한다. 0.3 m/s 로 다가오는 상자는 명령과 명령 사이에 얼마나 움직이고, 이것은 무엇을 뜻하는가?
      choices:
        - '9 cm 움직인다. 한 주기 동안의 변화가 커서, 주기를 늘려야 계산이 장면을 따라잡는다'
        - '0.9 m 움직인다. MPC 도 한 번 계획한 trajectory 처럼 실행 중의 장면 변화를 반영하지 못한다'
        - '9 mm 움직인다. 한 주기 안의 장면 변화가 작아서, 다음 명령에 바뀐 장면을 반영할 수 있다'
        - '움직이지 않는다. MPC 는 계산하는 동안 장면이 멈췄다고 보고 상자의 속도를 무시한다'
      answer: 2
      explanation: |
        한 주기 동안의 이동은 $0.3 \times 0.03 = 0.009$ m(9 mm)다. 한 주기 안의 변화가 작아서 MPC 는 다음 명령에서 바뀐 장면을 반영할 수 있다.
        9 cm 와 0.9 m 는 자릿수를 잘못 계산한 값이고, 주기를 늘리면 오히려 한 주기 동안의 변화가 커진다. MPC 는 매 주기 새 장면을 읽으므로 실행 중의
        변화를 반영한다. 계산하는 동안에도 상자는 움직이며, 그 변화는 다음 주기에 들어간다.
