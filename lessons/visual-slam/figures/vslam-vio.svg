  <line x1="276.0" y1="170" x2="276.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="304.0" y1="170" x2="304.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="332.0" y1="170" x2="332.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="360.0" y1="170" x2="360.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="388.0" y1="170" x2="388.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="416.0" y1="170" x2="416.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="444.0" y1="170" x2="444.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="472.0" y1="170" x2="472.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="500.0" y1="170" x2="500.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="528.0" y1="170" x2="528.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="556.0" y1="170" x2="556.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="584.0" y1="170" x2="584.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="612.0" y1="170" x2="612.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="640.0" y1="170" x2="640.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <path d="M108.0,202 L108.0,210 L360.0,210 L360.0,202" fill="none" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="234.0" y="230.0" fill="#7fc4a2" font-size="12" text-anchor="middle" font-weight="600">IMU 측정 10 개 → 상대 움직임 하나로 미리 적분 (preintegration)</text>
  <text x="350.0" y="272.0" fill="#94a3b8" font-size="11" text-anchor="middle">카메라: 방향과 모양은 알지만 scale 을 모른다 · IMU: m/s² 실제 크기, 오래 쌓으면 bias 로 어긋난다</text>
</svg>
