  <line x1="108.0" y1="170" x2="108.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="136.0" y1="170" x2="136.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="164.0" y1="170" x2="164.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="192.0" y1="170" x2="192.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
  <line x1="220.0" y1="170" x2="220.0" y2="190" stroke="#7cb4d8" stroke-width="2"/>
