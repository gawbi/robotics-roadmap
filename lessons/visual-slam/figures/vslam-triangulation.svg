  <line x1="490" y1="302" x2="550" y2="302" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="520.0" y="318.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.1 m</text>
  <text x="536.0" y="129.0" fill="#34d399" font-size="12" text-anchor="start" font-weight="600">10 m 앞의 점</text>
  <text x="504.0" y="123.6" fill="#f59e0b" font-size="12" text-anchor="end" font-weight="600">8.33 ~ 12.5 m</text>
  <text x="180.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">가까운 점: 오차 범위가 좁다</text>
  <text x="520.0" y="34.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">먼 점: 오차 범위가 길게 늘어진다</text>
  <text x="350.0" y="346.0" fill="#94a3b8" font-size="11" text-anchor="middle">파란 선의 폭 = feature 위치 ±1 pixel. 주황 영역 = 점이 있을 수 있는 범위 (축척은 실제와 다르다)</text>
</svg>
