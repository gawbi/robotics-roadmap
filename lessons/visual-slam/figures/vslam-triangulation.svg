<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>triangulation. 0.1 m 떨어진 두 keyframe 에서 본 직선이 만나는 곳이 점의 위치다. 2 m 앞의 점은 1 pixel 오차가 1.92 ~ 2.08 m 의 좁은 범위를 만들지만, 10 m 앞의 점은 8.33 ~ 12.5 m 로 길게 늘어진다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="698" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="12" y="12" width="676" height="336" rx="10" fill="none" stroke="none"/>
  <line x1="150" y1="280" x2="185.3" y2="160.3" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="150" y1="280" x2="194.6" y2="160.3" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="150.0" y1="280.0" x2="180.0" y2="190.0" stroke="#38bdf8" stroke-width="1.6"/>
  <line x1="210" y1="280" x2="165.4" y2="160.3" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="210" y1="280" x2="174.7" y2="160.3" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="210.0" y1="280.0" x2="180.0" y2="190.0" stroke="#38bdf8" stroke-width="1.6"/>
  <polygon points="183.5,190.1 180.0,199.5 176.5,190.1 180.0,178.3" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="180" cy="190" r="4" fill="#34d399"/>
  <path d="M150,268 L138,287.2 L162,287.2 z" fill="#111a2e" stroke="#f59e0b" stroke-width="1.8"/>
  <path d="M210,268 L198,287.2 L222,287.2 z" fill="#111a2e" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="150" y1="302" x2="210" y2="302" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="180.0" y="318.0" fill="#94a3b8" font-size="11" text-anchor="middle">0.1 m</text>
  <text x="196.0" y="194.0" fill="#34d399" font-size="12" text-anchor="start" font-weight="600">2 m 앞의 점</text>
  <text x="164.0" y="192.9" fill="#f59e0b" font-size="12" text-anchor="end" font-weight="600">1.92 ~ 2.08 m</text>
  <line x1="490" y1="280" x2="522.8" y2="71.6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="490" y1="280" x2="537.9" y2="71.6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="490.0" y1="280.0" x2="520.0" y2="125.0" stroke="#38bdf8" stroke-width="1.6"/>
  <line x1="550" y1="280" x2="502.1" y2="71.6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="550" y1="280" x2="517.2" y2="71.6" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
  <line x1="550.0" y1="280.0" x2="520.0" y2="125.0" stroke="#38bdf8" stroke-width="1.6"/>
