<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Visual SLAM 의 구성. 카메라 사진이 들어올 때마다 tracking 이 ORB 를 찾아 지도와 짝짓고 pose 를 낸다(약 30 ms). keyframe 으로 뽑힌 사진은 local mapping 이 triangulation 과 local BA 로 지도에 더하고(약 300 ms), loop closing 이 전에 온 곳을 찾아 쌓인 오차를 고친다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="718" height="338" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20" y="34" width="130" height="60" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="85.0" y="60.0" fill="#e2e8f0" font-size="13" text-anchor="middle">카메라 사진</text>
  <text x="85.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">20 fps</text>
  <line x1="152.0" y1="64.0" x2="196.0" y2="64.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="198" y="26" width="200" height="76" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="298.0" y="50.0" fill="#d6aa62" font-size="14" text-anchor="middle" font-weight="600">tracking</text>
  <text x="298.0" y="70.0" fill="#e2e8f0" font-size="12" text-anchor="middle">사진마다 · 약 30 ms</text>
  <text x="298.0" y="89.0" fill="#94a3b8" font-size="11" text-anchor="middle">ORB 추출 → 짝짓기 → pose</text>
  <line x1="400.0" y1="64.0" x2="456.0" y2="64.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="458" y="34" width="150" height="60" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="533.0" y="60.0" fill="#7fc4a2" font-size="13" text-anchor="middle" font-weight="600">카메라 pose</text>
  <text x="533.0" y="80.0" fill="#94a3b8" font-size="12" text-anchor="middle">사진마다 출력</text>
  <line x1="298.0" y1="104.0" x2="298.0" y2="156.0" stroke="#d6aa62" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="306.0" y="134.0" fill="#d6aa62" font-size="11" text-anchor="start">keyframe 으로 뽑힌 사진</text>
  <rect x="198" y="158" width="200" height="76" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="298.0" y="182.0" fill="#7cb4d8" font-size="14" text-anchor="middle" font-weight="600">local mapping</text>
  <text x="298.0" y="202.0" fill="#e2e8f0" font-size="12" text-anchor="middle">keyframe 마다 · 약 300 ms</text>
  <text x="298.0" y="221.0" fill="#94a3b8" font-size="11" text-anchor="middle">triangulation · local BA</text>
  <line x1="400.0" y1="196.0" x2="456.0" y2="196.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#am)"/>
  <rect x="458" y="158" width="240" height="76" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="578.0" y="182.0" fill="#a99ad6" font-size="14" text-anchor="middle" font-weight="600">loop closing</text>
  <text x="578.0" y="202.0" fill="#e2e8f0" font-size="12" text-anchor="middle">전에 온 곳인지 확인</text>
  <text x="578.0" y="221.0" fill="#94a3b8" font-size="11" text-anchor="middle">DBoW2 → 쌓인 오차 보정</text>
  <rect x="198" y="268" width="500" height="50" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="448.0" y="290.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">지도</text>
  <text x="448.0" y="308.0" fill="#94a3b8" font-size="11" text-anchor="middle">keyframe 의 pose + map point 수천 개</text>
  <line x1="298.0" y1="236.0" x2="298.0" y2="266.0" stroke="#7cb4d8" stroke-width="1.8" marker-end="url(#as)"/>
  <line x1="578" y1="236" x2="578" y2="266" stroke="#a99ad6" stroke-width="1.8" marker-end="url(#am)"/>
  <path d="M196,293 L170,293 L170,90 L196,90" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#am)"/>
  <text x="160.0" y="196.0" fill="#94a3b8" font-size="11" text-anchor="end">지도를</text>
  <text x="160.0" y="212.0" fill="#94a3b8" font-size="11" text-anchor="end">읽어 짝짓기</text>
</svg>
