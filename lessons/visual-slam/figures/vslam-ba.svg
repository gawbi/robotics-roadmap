<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>bundle adjustment. 왼쪽은 keyframe 세 장이 map point 네 개를 보는 모습이고, 오른쪽은 그중 한 관측을 확대한 것이다. 실제로 찍힌 pixel (370, 215) 와 지금 추정으로 투영한 pixel (372, 214) 사이의 2.24 pixel 이 reprojection error 이고, BA 는 모든 관측의 이 오차를 함께 줄인다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="165.0" y="32.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">keyframe 3 장과 map point 4 개</text>
  <line x1="70" y1="270" x2="60" y2="80" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="70" y1="270" x2="130" y2="60" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="70" y1="270" x2="200" y2="95" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="160" y1="285" x2="60" y2="80" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="160" y1="285" x2="130" y2="60" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="160" y1="285" x2="200" y2="95" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="160" y1="285" x2="270" y2="70" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="250" y1="270" x2="130" y2="60" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="250" y1="270" x2="200" y2="95" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="250" y1="270" x2="270" y2="70" stroke="#7cb4d8" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="60" cy="80" r="5" fill="#7fc4a2"/>
  <circle cx="130" cy="60" r="5" fill="#7fc4a2"/>
  <circle cx="200" cy="95" r="5" fill="#7fc4a2"/>
  <circle cx="270" cy="70" r="5" fill="#7fc4a2"/>
  <path d="M70,258 L58,277.2 L82,277.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <path d="M160,273 L148,292.2 L172,292.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <path d="M250,258 L238,277.2 L262,277.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="165.0" y="318.0" fill="#94a3b8" font-size="11" text-anchor="middle">BA 는 pose(삼각형)와 map point(초록 점)를 함께 움직인다</text>
  <line x1="160" y1="285" x2="200" y2="95" stroke="#d6aa62" stroke-width="2"/>
  <line x1="250.0" y1="190.0" x2="372.0" y2="170.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#am)"/>
  <rect x="380" y="50" width="310" height="240" rx="6" fill="#0f172a" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="535.0" y="32.0" fill="#e2e8f0" font-size="13" text-anchor="middle" font-weight="600">사진 속 한 관측을 확대 (한 칸 = 1 pixel)</text>
  <line x1="410" y1="50" x2="410" y2="290" stroke="#1e293b"/>
  <line x1="450" y1="50" x2="450" y2="290" stroke="#1e293b"/>
  <line x1="490" y1="50" x2="490" y2="290" stroke="#1e293b"/>
  <line x1="530" y1="50" x2="530" y2="290" stroke="#1e293b"/>
  <line x1="570" y1="50" x2="570" y2="290" stroke="#1e293b"/>
  <line x1="610" y1="50" x2="610" y2="290" stroke="#1e293b"/>
  <line x1="650" y1="50" x2="650" y2="290" stroke="#1e293b"/>
  <line x1="380" y1="90" x2="690" y2="90" stroke="#1e293b"/>
  <line x1="380" y1="130" x2="690" y2="130" stroke="#1e293b"/>
  <line x1="380" y1="170" x2="690" y2="170" stroke="#1e293b"/>
  <line x1="380" y1="210" x2="690" y2="210" stroke="#1e293b"/>
  <line x1="380" y1="250" x2="690" y2="250" stroke="#1e293b"/>
  <line x1="450.0" y1="210.0" x2="524.0" y2="173.0" stroke="#d88b8b" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="450" cy="210" r="7" fill="#7fc4a2"/>
  <text x="450.0" y="236.0" fill="#7fc4a2" font-size="12" text-anchor="middle" font-weight="600">찍힌 pixel (370, 215)</text>
  <circle cx="530" cy="170" r="8" fill="none" stroke="#d6aa62" stroke-width="3"/>
  <text x="530.0" y="154.0" fill="#d6aa62" font-size="12" text-anchor="middle" font-weight="600">투영한 pixel (372, 214)</text>
  <text x="520.0" y="212.0" fill="#d88b8b" font-size="12" text-anchor="start">오차 √(2² + 1²) ≈ 2.24</text>
</svg>
