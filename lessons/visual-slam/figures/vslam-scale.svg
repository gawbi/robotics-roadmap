<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 332" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>monocular scale ambiguity. 카메라가 0.5 m 움직이며 2 m 앞의 점을 본 경우와, 1 m 움직이며 4 m 앞의 점을 본 경우가 두 사진에서 똑같이 pixel 370 과 245 에 찍힌다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="698" height="330" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="90.0" y="34.0" fill="#d6aa62" font-size="13" text-anchor="middle" font-weight="600">작은 세계</text>
  <line x1="60.0" y1="250.0" x2="84.0" y2="70.0" stroke="#7cb4d8" stroke-width="1.6"/>
  <line x1="120.0" y1="250.0" x2="84.0" y2="70.0" stroke="#7cb4d8" stroke-width="1.6"/>
  <circle cx="84" cy="70" r="5" fill="#7fc4a2"/>
  <text x="96.0" y="64.0" fill="#7fc4a2" font-size="12" text-anchor="start">(0.2, 0, 2) m</text>
  <path d="M60,238 L48,257.2 L72,257.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <path d="M120,238 L108,257.2 L132,257.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <line x1="60" y1="270" x2="120" y2="270" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="90.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="middle">카메라 이동 0.5 m</text>
  <rect x="180" y="90" width="120" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
  <line x1="249.4" y1="90" x2="249.4" y2="140" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="249.4" cy="115" r="4" fill="#7fc4a2"/>
  <text x="240.0" y="84.0" fill="#e2e8f0" font-size="11" text-anchor="middle">사진 1: u = 370</text>
  <rect x="180" y="170" width="120" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
  <line x1="225.9" y1="170" x2="225.9" y2="220" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="225.9" cy="195" r="4" fill="#7fc4a2"/>
  <text x="240.0" y="164.0" fill="#e2e8f0" font-size="11" text-anchor="middle">사진 2: u = 245</text>
  <text x="430.0" y="34.0" fill="#a99ad6" font-size="13" text-anchor="middle" font-weight="600">2 배 큰 세계</text>
  <line x1="400.0" y1="250.0" x2="424.0" y2="70.0" stroke="#7cb4d8" stroke-width="1.6"/>
  <line x1="460.0" y1="250.0" x2="424.0" y2="70.0" stroke="#7cb4d8" stroke-width="1.6"/>
  <circle cx="424" cy="70" r="5" fill="#7fc4a2"/>
  <text x="436.0" y="64.0" fill="#7fc4a2" font-size="12" text-anchor="start">(0.4, 0, 4) m</text>
  <path d="M400,238 L388,257.2 L412,257.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <path d="M460,238 L448,257.2 L472,257.2 z" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <line x1="400" y1="270" x2="460" y2="270" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="430.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="middle">카메라 이동 1.0 m</text>
  <rect x="520" y="90" width="120" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
  <line x1="589.4" y1="90" x2="589.4" y2="140" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="589.4" cy="115" r="4" fill="#7fc4a2"/>
  <text x="580.0" y="84.0" fill="#e2e8f0" font-size="11" text-anchor="middle">사진 1: u = 370</text>
  <rect x="520" y="170" width="120" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
  <line x1="565.9" y1="170" x2="565.9" y2="220" stroke="#7fc4a2" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="565.9" cy="195" r="4" fill="#7fc4a2"/>
  <text x="580.0" y="164.0" fill="#e2e8f0" font-size="11" text-anchor="middle">사진 2: u = 245</text>
  <line x1="350" y1="20" x2="350" y2="270" stroke="#1e293b" stroke-width="1.5"/>
  <text x="350.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">모든 길이를 2 배로 키워도 두 사진의 pixel 은 똑같다. 사진만으로는 둘을 가릴 수 없다</text>
</svg>
