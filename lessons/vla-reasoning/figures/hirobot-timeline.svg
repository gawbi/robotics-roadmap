<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사용자가 that's not trash 라고 말한 순간부터 새 action chunk 가 나오기까지의 시간 막대. 위는 말을 듣자마자 high-level 을 다시 계산하는 경우로 prefill 47 ms, 예로 든 명령 6 token 의 decode 79.2 ms, low-level 73 ms 를 더해 199.2 ms 다. 아래는 1 초마다만 계산하는 경우의 가장 늦은 때로, 1000 ms 를 기다린 뒤 같은 계산을 해 1199.2 ms 다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start">말을 듣자마자</text>
  <text x="20.0" y="88.0" fill="#e2e8f0" font-size="13" text-anchor="start">다시 계산</text>
  <rect x="180.0" y="55.0" width="20.4" height="30.0" rx="2" fill="#d6aa62" fill-opacity="0.9"/>
  <rect x="200.4" y="55.0" width="34.3" height="30.0" rx="2" fill="#a99ad6" fill-opacity="0.9"/>
  <rect x="234.7" y="55.0" width="31.6" height="30.0" rx="2" fill="#7fc4a2" fill-opacity="0.9"/>
  <text x="274.3" y="75.0" fill="#d6aa62" font-size="12" text-anchor="start">199.2 ms (action 약 10 개)</text>
  <text x="20.0" y="140.0" fill="#e2e8f0" font-size="13" text-anchor="start">1 초마다만 계산</text>
  <text x="20.0" y="158.0" fill="#94a3b8" font-size="12" text-anchor="start">(가장 늦은 경우)</text>
  <rect x="180.0" y="125.0" width="433.3" height="30.0" rx="3" fill="#334155" fill-opacity="0.9"/>
  <text x="396.7" y="145.0" fill="#e2e8f0" font-size="12" text-anchor="middle">다음 high-level 계산까지 기다림 1000 ms</text>
  <rect x="613.3" y="125.0" width="20.4" height="30.0" rx="2" fill="#d6aa62" fill-opacity="0.9"/>
  <rect x="633.7" y="125.0" width="34.3" height="30.0" rx="2" fill="#a99ad6" fill-opacity="0.9"/>
  <rect x="668.0" y="125.0" width="31.6" height="30.0" rx="2" fill="#7fc4a2" fill-opacity="0.9"/>
  <text x="699.7" y="117.0" fill="#d6aa62" font-size="12" text-anchor="end">1199.2 ms (action 약 60 개)</text>
  <line x1="180.0" y1="35.0" x2="180.0" y2="165.0" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="180.0" y="28.0" fill="#d88b8b" font-size="12" text-anchor="start">사용자: "that's not trash"</text>
  <line x1="180.0" y1="190.0" x2="700.0" y2="190.0" stroke="#64748b" stroke-width="1"/>
  <line x1="180.0" y1="186.0" x2="180.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="180.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="266.7" y1="186.0" x2="266.7" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="266.7" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">200</text>
  <line x1="353.3" y1="186.0" x2="353.3" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="353.3" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">400</text>
  <line x1="440.0" y1="186.0" x2="440.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="440.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">600</text>
  <line x1="526.7" y1="186.0" x2="526.7" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="526.7" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">800</text>
  <line x1="613.3" y1="186.0" x2="613.3" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="613.3" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">1000</text>
  <line x1="700.0" y1="186.0" x2="700.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="700.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">1200 ms</text>
  <rect x="180.0" y="228.0" width="12.0" height="12.0" rx="2" fill="#d6aa62"/>
  <text x="198.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="start">prefill 47 ms</text>
  <rect x="320.0" y="228.0" width="12.0" height="12.0" rx="2" fill="#a99ad6"/>
  <text x="338.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="start">명령 6 token decode 79.2 ms</text>
  <rect x="540.0" y="228.0" width="12.0" height="12.0" rx="2" fill="#7fc4a2"/>
  <text x="558.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="start">low-level chunk 73 ms</text>
</svg>
