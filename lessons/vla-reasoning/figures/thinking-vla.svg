<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Gemini Robotics 1.5 의 두 층과 thinking 의 효과. 왼쪽은 orchestrator 가 낸 pack the rain jacket into the luggage 를 thinking VLA 가 pick up the rain jacket from the wardrobe 와 move the gripper to the left 로 쪼갠 뒤 action 을 내는 흐름이다. 오른쪽 막대는 여러 단계 작업의 진행 점수로, thinking 을 끄면 ALOHA 0.26, Bi-arm Franka 0.55, humanoid 0.51 이고 켜면 각각 0.55, 0.60, 0.67 이다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="24.0" width="330.0" height="70.0" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.5"/>
  <text x="185.0" y="55.0" fill="#e2e8f0" font-size="13" text-anchor="middle">orchestrator · Gemini Robotics-ER 1.5</text>
  <text x="185.0" y="74.0" fill="#94a3b8" font-size="12" text-anchor="middle">계획, 단계 완료 판정, 웹 검색 같은 도구</text>
  <line x1="185.0" y1="96.0" x2="185.0" y2="122.0" stroke="#a99ad6" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="195.0" y="114.0" fill="#e2e8f0" font-size="11" text-anchor="start">"pack the rain jacket into the luggage"</text>
  <rect x="20.0" y="126.0" width="330.0" height="110.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="185.0" y="148.0" fill="#e2e8f0" font-size="13" text-anchor="middle">thinking VLA · Gemini Robotics 1.5</text>
  <text x="36.0" y="176.0" fill="#7fc4a2" font-size="11" text-anchor="start">생각: "pick up the rain jacket from the wardrobe"</text>
  <text x="36.0" y="198.0" fill="#7fc4a2" font-size="11" text-anchor="start">생각: "move the gripper to the left"</text>
  <text x="36.0" y="222.0" fill="#94a3b8" font-size="11" text-anchor="start">→ 생각을 문맥에 붙인 뒤 action 을 낸다</text>
  <line x1="185.0" y1="238.0" x2="185.0" y2="262.0" stroke="#d6aa62" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="20.0" y="266.0" width="330.0" height="40.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="185.0" y="291.0" fill="#e2e8f0" font-size="14" text-anchor="middle">action</text>
