  <text x="404.0" y="174.0" fill="#94a3b8" font-size="10" text-anchor="end">0.4</text>
  <line x1="410.0" y1="130.0" x2="740.0" y2="130.0" stroke="#1e293b" stroke-width="1"/>
  <text x="404.0" y="134.0" fill="#94a3b8" font-size="10" text-anchor="end">0.6</text>
  <line x1="410.0" y1="90.0" x2="740.0" y2="90.0" stroke="#1e293b" stroke-width="1"/>
  <text x="404.0" y="94.0" fill="#94a3b8" font-size="10" text-anchor="end">0.8</text>
  <line x1="410.0" y1="50.0" x2="740.0" y2="50.0" stroke="#1e293b" stroke-width="1"/>
  <text x="404.0" y="54.0" fill="#94a3b8" font-size="10" text-anchor="end">1.0</text>
  <rect x="429.0" y="198.0" width="34.0" height="52.0" rx="2" fill="#94a3b8" fill-opacity="0.85"/>
  <text x="446.0" y="192.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.26</text>
  <rect x="467.0" y="140.0" width="34.0" height="110.0" rx="2" fill="#7fc4a2" fill-opacity="0.85"/>
  <text x="484.0" y="134.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.55</text>
  <text x="465.0" y="267.0" fill="#e2e8f0" font-size="11" text-anchor="middle">ALOHA</text>
  <text x="465.0" y="283.0" fill="#d6aa62" font-size="11" text-anchor="middle">+0.29</text>
  <rect x="539.0" y="140.0" width="34.0" height="110.0" rx="2" fill="#94a3b8" fill-opacity="0.85"/>
  <text x="556.0" y="134.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.55</text>
  <rect x="577.0" y="130.0" width="34.0" height="120.0" rx="2" fill="#7fc4a2" fill-opacity="0.85"/>
  <text x="594.0" y="124.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.60</text>
  <text x="575.0" y="267.0" fill="#e2e8f0" font-size="11" text-anchor="middle">Bi-arm Franka</text>
  <text x="575.0" y="283.0" fill="#d6aa62" font-size="11" text-anchor="middle">+0.05</text>
  <rect x="649.0" y="148.0" width="34.0" height="102.0" rx="2" fill="#94a3b8" fill-opacity="0.85"/>
  <text x="666.0" y="142.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.51</text>
  <rect x="687.0" y="116.0" width="34.0" height="134.0" rx="2" fill="#7fc4a2" fill-opacity="0.85"/>
  <text x="704.0" y="110.0" fill="#e2e8f0" font-size="11" text-anchor="middle">0.67</text>
  <text x="685.0" y="267.0" fill="#e2e8f0" font-size="11" text-anchor="middle">humanoid</text>
  <text x="685.0" y="283.0" fill="#d6aa62" font-size="11" text-anchor="middle">+0.16</text>
  <text x="410.0" y="30.0" fill="#94a3b8" font-size="12" text-anchor="start">여러 단계 작업의 진행 점수</text>
  <rect x="410.0" y="296.0" width="10.0" height="10.0" rx="2" fill="#94a3b8"/>
  <text x="425.0" y="305.0" fill="#e2e8f0" font-size="11" text-anchor="start">thinking 끔</text>
  <rect x="505.0" y="296.0" width="10.0" height="10.0" rx="2" fill="#7fc4a2"/>
  <text x="520.0" y="305.0" fill="#e2e8f0" font-size="11" text-anchor="start">thinking 켬</text>
  <text x="600.0" y="305.0" fill="#d6aa62" font-size="11" text-anchor="start">아래 숫자는 변화량</text>
</svg>
