<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>추론 한 번에 걸리는 시간 막대. 예로 든 prefill 47 ms 와 decode 한 step 13.2 ms 로 어림하면 token 7 개는 139.4 ms 이고 token 350 개는 4667 ms 다. 1 초 눈금과, 50 Hz 로봇이 action 50 개를 실행하는 1 초를 함께 그렸다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="arrow-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="758" height="248" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="66.0" fill="#e2e8f0" font-size="13" text-anchor="start">token 7 개</text>
  <text x="20.0" y="84.0" fill="#94a3b8" font-size="11" text-anchor="start">(action 만)</text>
  <rect x="170.0" y="52.0" width="5.3" height="28.0" rx="2" fill="#d6aa62"/>
  <rect x="175.3" y="52.0" width="10.3" height="28.0" rx="2" fill="#a99ad6" fill-opacity="0.8"/>
  <text x="193.6" y="71.0" fill="#e2e8f0" font-size="12" text-anchor="start">47 + 7 × 13.2 = 139.4 ms  →  1 초에 약 7.2 번</text>
  <text x="20.0" y="136.0" fill="#e2e8f0" font-size="13" text-anchor="start">token 350 개</text>
  <text x="20.0" y="154.0" fill="#94a3b8" font-size="11" text-anchor="start">(ECoT)</text>
  <rect x="170.0" y="124.0" width="5.3" height="28.0" rx="2" fill="#d6aa62"/>
  <rect x="175.3" y="124.0" width="517.4" height="28.0" rx="2" fill="#a99ad6" fill-opacity="0.8"/>
  <text x="471.4" y="143.0" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="600">47 + 350 × 13.2 = 4667 ms  →  1 초에 약 0.21 번</text>
  <line x1="282.0" y1="100.0" x2="282.0" y2="170.0" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="288.0" y="110.0" fill="#d88b8b" font-size="11" text-anchor="start">1 초: 50 Hz 로봇이 action 50 개를 실행하는 시간</text>
  <line x1="170.0" y1="190.0" x2="730.0" y2="190.0" stroke="#64748b" stroke-width="1"/>
  <line x1="170.0" y1="186.0" x2="170.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="170.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">0</text>
  <line x1="282.0" y1="186.0" x2="282.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="282.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">1000</text>
  <line x1="394.0" y1="186.0" x2="394.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="394.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">2000</text>
  <line x1="506.0" y1="186.0" x2="506.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="506.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">3000</text>
  <line x1="618.0" y1="186.0" x2="618.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="618.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="middle">4000</text>
  <line x1="730.0" y1="186.0" x2="730.0" y2="194.0" stroke="#64748b" stroke-width="1"/>
  <text x="730.0" y="207.0" fill="#94a3b8" font-size="11" text-anchor="end">5000 ms</text>
  <rect x="170.0" y="224.0" width="12.0" height="12.0" rx="2" fill="#d6aa62"/>
  <text x="188.0" y="234.0" fill="#e2e8f0" font-size="12" text-anchor="start">prefill 47 ms</text>
  <rect x="310.0" y="224.0" width="12.0" height="12.0" rx="2" fill="#a99ad6"/>
  <text x="328.0" y="234.0" fill="#e2e8f0" font-size="12" text-anchor="start">decode: token 하나에 13.2 ms (Hi Robot 의 RTX 4090 측정값을 빌린 어림)</text>
</svg>
