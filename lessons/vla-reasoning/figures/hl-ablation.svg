<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>π0.5 논문 그림 13 의 high-level 비교를 다시 그린 막대그래프. 모의 집 네 가지 작업의 평균 진행률을 그림에서 읽은 어림값으로, π0.5 약 79%, implicit HL 약 71%, human HL 약 63%, no HL 약 62%, no VI 약 60%, no WD 약 60%, GPT-4 약 58% 다</title>
