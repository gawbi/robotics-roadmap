<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>사전 학습과 RL fine-tuning. 평지 궤적으로 사전 학습한 HT-2 를 약 1억 step 의 RL 로 fine-tuning 하면 simulation 성공률이 내리막 84.4% 에서 97.0%, 오르막 45.3% 에서 95.8%, 밀기 5.8% 에서 87.6%, 장애물 24.9% 에서 93.2%, 거친 바닥 74.9% 에서 95.1%, 미끄러운 바닥 25.0% 에서 78.8% 로 오른다</title>
