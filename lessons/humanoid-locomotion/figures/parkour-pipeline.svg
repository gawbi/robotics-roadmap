  <text x="124.0" y="100.0" fill="#94a3b8" font-size="12" text-anchor="middle">fractal 지형에서 학습</text>
  <text x="124.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">앞뒤 −0.8 ~ 2.0 m/s</text>
