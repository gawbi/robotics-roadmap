  <text x="360.0" y="74.0" fill="#7cb4d8" font-size="13.5" text-anchor="middle" font-weight="600">② oracle parkour policy</text>
  <text x="360.0" y="100.0" fill="#94a3b8" font-size="12" text-anchor="middle">scandot 11 × 19 = 209 점</text>
  <text x="360.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">→ 32 개로 요약, GRU + MLP</text>
  <text x="360.0" y="140.0" fill="#94a3b8" font-size="12" text-anchor="middle">지형 10 종류 × 10 단계</text>
