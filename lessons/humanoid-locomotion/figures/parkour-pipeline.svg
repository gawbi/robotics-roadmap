  <text x="596.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">→ CNN 으로 32 개</text>
  <text x="596.0" y="140.0" fill="#94a3b8" font-size="12" text-anchor="middle">GRU·MLP 는 oracle 에서 시작</text>
