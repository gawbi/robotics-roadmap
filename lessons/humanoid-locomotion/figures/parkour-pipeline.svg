  <text x="20.0" y="32.0" fill="#94a3b8" font-size="13" text-anchor="start">Unitree H1 (다리 0.8 m), Zhuang 등 2024</text>
  <rect x="20.0" y="48.0" width="208.0" height="118.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
