<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>humanoid parkour 의 학습 단계. fractal 지형의 평지 걷기 policy 에서 scandot 11 × 19 를 받는 oracle 을 이어 학습하고, 48 × 64 depth 를 받는 student 로 DAgger distillation 한다. 실물에서는 depth encoder 가 1초에 10 번, policy 가 50 번, motor PD 가 1,000 번 계산한다</title>
