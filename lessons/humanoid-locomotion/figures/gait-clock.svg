  <title>Humanoid-Gym 의 걸음 clock. 한 주기 0.64 초(64 step)에서 sin 값이 0 이상이면 왼발이 딛고 0 보다 작으면 오른발이 딛으며, 0 근처 6 step 은 두 발이 다 딛는다. 예로 든 세 걸음의 한 주기 점수는 약속대로 걷기 64, 두 발을 늘 바닥에 두기 26.3, 순서를 거꾸로 하기 −11.4 다</title>
