<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 352" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>발 공중 시간 항목과 fractal 지형의 비교. H1 으로 simulation 에서 잰 성공률은 jump up 80% 와 90%, leap 50% 와 80%, 계단 오르기 90% 와 100%, hurdle 20% 와 100% 로, fractal 지형 쪽이 10, 30, 10, 80 %p 높다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="698" height="350" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="30.0" fill="#94a3b8" font-size="13" text-anchor="start">Unitree H1, simulation, 과제마다 로봇 10 대 (Zhuang 등 2024, Table 2)</text>
  <rect x="430.0" y="46.0" width="14.0" height="14.0" rx="0" fill="#d6aa62" fill-opacity="0.8"/>
  <text x="450.0" y="58.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">발 공중 시간 항목</text>
  <rect x="560.0" y="46.0" width="14.0" height="14.0" rx="0" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="580.0" y="58.0" fill="#e2e8f0" font-size="12.5" text-anchor="start">fractal 지형</text>
  <line x1="90.0" y1="270.0" x2="680.0" y2="270.0" stroke="#334155" stroke-width="1"/>
  <text x="82.0" y="274.0" fill="#94a3b8" font-size="12" text-anchor="end">0%</text>
  <line x1="90.0" y1="175.0" x2="680.0" y2="175.0" stroke="#334155" stroke-width="1"/>
  <text x="82.0" y="179.0" fill="#94a3b8" font-size="12" text-anchor="end">50%</text>
  <line x1="90.0" y1="80.0" x2="680.0" y2="80.0" stroke="#334155" stroke-width="1"/>
  <text x="82.0" y="84.0" fill="#94a3b8" font-size="12" text-anchor="end">100%</text>
  <rect x="110.0" y="118.0" width="44.0" height="152.0" rx="0" fill="#d6aa62" fill-opacity="0.8"/>
  <rect x="160.0" y="99.0" width="44.0" height="171.0" rx="0" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="132.0" y="112.0" fill="#d6aa62" font-size="12.5" text-anchor="middle">80%</text>
  <text x="182.0" y="93.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">90%</text>
  <text x="157.0" y="290.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">상자 뛰어오르기</text>
  <text x="157.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">+10 %p</text>
  <rect x="257.0" y="175.0" width="44.0" height="95.0" rx="0" fill="#d6aa62" fill-opacity="0.8"/>
  <rect x="307.0" y="118.0" width="44.0" height="152.0" rx="0" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="279.0" y="169.0" fill="#d6aa62" font-size="12.5" text-anchor="middle">50%</text>
  <text x="329.0" y="112.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">80%</text>
  <text x="304.0" y="290.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">틈 건너뛰기</text>
  <text x="304.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">+30 %p</text>
  <rect x="404.0" y="99.0" width="44.0" height="171.0" rx="0" fill="#d6aa62" fill-opacity="0.8"/>
  <rect x="454.0" y="80.0" width="44.0" height="190.0" rx="0" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="426.0" y="93.0" fill="#d6aa62" font-size="12.5" text-anchor="middle">90%</text>
  <text x="476.0" y="74.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">100%</text>
  <text x="451.0" y="290.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">계단 오르기</text>
  <text x="451.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">+10 %p</text>
  <rect x="551.0" y="232.0" width="44.0" height="38.0" rx="0" fill="#d6aa62" fill-opacity="0.8"/>
  <rect x="601.0" y="80.0" width="44.0" height="190.0" rx="0" fill="#7fc4a2" fill-opacity="0.8"/>
  <text x="573.0" y="226.0" fill="#d6aa62" font-size="12.5" text-anchor="middle">20%</text>
  <text x="623.0" y="74.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">100%</text>
  <text x="598.0" y="290.0" fill="#e2e8f0" font-size="12.5" text-anchor="middle">허들 넘기</text>
  <text x="598.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="middle">+80 %p</text>
  <text x="20.0" y="338.0" fill="#94a3b8" font-size="12" text-anchor="start">성공: 난이도가 오르는 4.8 m 구간 셋(14.4 m)을 가장 어려운 구간까지 넘음</text>
</svg>
