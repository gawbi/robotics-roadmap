<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Humanoid-Gym 의 sim-to-sim 검증. Isaac Gym 에서 env 8192 개로 학습한 policy 를 실물에 맞게 보정한 MuJoCo 에서 다시 시험한 뒤 XBot 에 올린다. policy 는 1초에 100 번, PD 는 1,000 번 계산하고 actor 입력은 47 개 × 15 step = 705 개다</title>
  <defs><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="ar-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf96b8"/></marker><marker id="ar-text" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="718" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="24.0" y="52.0" width="196.0" height="96.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="122.0" y="80.0" fill="#d6aa62" font-size="13.5" text-anchor="middle" font-weight="600">① Isaac Gym 에서 학습</text>
  <text x="122.0" y="104.0" fill="#94a3b8" font-size="12" text-anchor="middle">GPU 로 env 8192 개를 함께 계산</text>
  <text x="122.0" y="124.0" fill="#94a3b8" font-size="12" text-anchor="middle">빠르지만 덜 정확</text>
  <rect x="262.0" y="52.0" width="196.0" height="96.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="360.0" y="80.0" fill="#7cb4d8" font-size="13.5" text-anchor="middle" font-weight="600">② MuJoCo 에서 다시 걷기</text>
  <text x="360.0" y="104.0" fill="#94a3b8" font-size="12" text-anchor="middle">CPU 로 계산, 더 정확</text>
  <text x="360.0" y="124.0" fill="#94a3b8" font-size="12" text-anchor="middle">실물 관절 궤적에 맞춰 보정</text>
  <rect x="500.0" y="52.0" width="196.0" height="96.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="598.0" y="80.0" fill="#7fc4a2" font-size="13.5" text-anchor="middle" font-weight="600">③ 실물 XBot</text>
  <text x="598.0" y="104.0" fill="#94a3b8" font-size="12" text-anchor="middle">XBot-S 키 1.2 m</text>
  <text x="598.0" y="124.0" fill="#94a3b8" font-size="12" text-anchor="middle">XBot-L 키 1.65 m</text>
  <line x1="222.0" y1="100.0" x2="258.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-muted)"/>
  <line x1="460.0" y1="100.0" x2="496.0" y2="100.0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ar-muted)"/>
  <text x="240.0" y="90.0" fill="#94a3b8" font-size="11" text-anchor="middle">같은</text>
  <text x="240.0" y="120.0" fill="#94a3b8" font-size="11" text-anchor="middle">policy</text>
  <text x="478.0" y="90.0" fill="#94a3b8" font-size="11" text-anchor="middle">통과한</text>
  <text x="478.0" y="120.0" fill="#94a3b8" font-size="11" text-anchor="middle">policy</text>
  <text x="20.0" y="32.0" fill="#94a3b8" font-size="13" text-anchor="start">학습한 simulator 와 다른 simulator 에서 같은 policy 를 다시 시험한다 (Gu 등 2024)</text>
  <rect x="24.0" y="176.0" width="672.0" height="128.0" rx="8" fill="#111a2e" stroke="#334155" stroke-width="1"/>
  <text x="44.0" y="204.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">계산 주기</text>
  <text x="170.0" y="204.0" fill="#94a3b8" font-size="12.5" text-anchor="start">policy 1초에 100 번 (0.01 초마다), PD controller 1초에 1,000 번</text>
  <text x="44.0" y="234.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">actor 입력</text>
  <text x="170.0" y="234.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한 step 47 개 × 15 step = 705 개 (0.15 초의 이력)</text>
  <text x="44.0" y="264.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">critic 입력</text>
  <text x="170.0" y="264.0" fill="#94a3b8" font-size="12.5" text-anchor="start">privileged 값까지 73 개 × 3 step, 학습할 때만 쓴다</text>
  <text x="44.0" y="292.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">걸음 clock</text>
  <text x="170.0" y="292.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한 주기 0.64 초 = 64 step, observation 에 sin·cos 2 개</text>
</svg>
