# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: biped-difficulty
  title: 2족 보행이 RL 로 어려운 이유
  section: 2족-보행이-어려운-이유
  variants:
    - question: |
        humanoid 의 floating base(몸통의 위치 3 개와 자세 3 개)에 대한 설명으로 옳은 것은?
      choices:
        - '어떤 관절 motor 로도 직접 정할 수 없고, 발과 바닥 사이의 힘으로만 바뀐다'
        - '몸통 안의 IMU 가 재는 값이라서, policy 가 action 으로 목표값을 직접 정한다'
        - '엉덩이 motor 셋이 몸통의 회전을 직접 정해서, 한 발로 서도 그대로 유지된다'
        - 'spring 이 붙은 수동 관절이 정하고, policy 는 이 6 개를 관측에서도 받지 않는다'
      answer: 0
      explanation: |
        몸통의 위치와 자세를 직접 미는 motor 는 없어서, 이 6 개는 발이 바닥을 미는 힘으로만 바뀐다. 움직일 수 있는 자유도보다 motor 가 적은
        underactuation 이다. IMU 는 몸통의 회전 속도와 기울기를 잴 뿐 정하지는 못하고, 엉덩이 motor 는 다리와 몸통 사이의 각도를 바꿀 뿐 바닥에
        대한 몸통의 자세를 직접 정하지 못한다. 수동 관절은 Digit 다리의 일부 관절일 뿐 몸통의 6 개와는 다르고, 몸통의 회전 속도와 중력 방향은
        보통 관측에 들어간다.
    - question: |
        학습 초기의 humanoid 가 서자마자 넘어져 episode 가 곧바로 끝나면 학습에 어떤 문제가 생기는가?
      choices:
        - '넘어진 episode 는 PPO 가 버리므로 sample 수만 줄고, 배우는 내용은 그대로다'
        - 'episode 가 끝나면 domain randomization 이 멈춰서, 같은 물리값으로만 학습한다'
        - '걸음 한 주기도 다 겪기 전에 끝나서, 다음 발을 내딛는 상태가 데이터에 드물다'
        - '넘어질 때 penalty 가 커서 gradient 가 0 이 되므로, policy 가 더 바뀌지 않는다'
      answer: 2
      explanation: |
        예를 들어 1초에 100 번 계산하고 걸음 한 주기가 0.64 초인데 0.3 초 만에 넘어지면, 30 step 의 episode 는 한 주기의 절반도 담지 못한다. 그래서
        버틴 step 마다 점수를 주는 항목을 넣거나, 헛디뎌도 episode 를 끝내지 않는 단계를 먼저 둔다. PPO 는 끝난 episode 의 sample 도 쓰고,
        domain randomization 은 episode 마다 다시 뽑으며, penalty 가 커도 gradient 가 0 이 되지는 않는다.
    - question: |
        4족 보행 policy 는 걸음 모양을 정해 주지 않아도 trot 으로 수렴했다. 같은 방식으로 humanoid 를 학습하면 흔히 어떤 일이 생기는가?
      choices:
        - '두 다리라 가능한 걸음이 하나뿐이어서, 4족보다 오히려 빨리 같은 걸음으로 모인다'
        - '관절이 많은 humanoid 도 trot 같은 대각선 걸음을 스스로 찾아 그대로 쓰게 된다'
        - 'reward 가 같으면 걸음도 같아지므로, 4족의 weight 를 그대로 쓰면 바로 걷는다'
        - '발을 끌거나 좌우가 다른 걸음이 나와서, 발을 들게 하는 장치가 따로 필요하다'
      answer: 3
      explanation: |
        humanoid 에는 자연스럽게 모이는 기본 걸음이 없어서, 걸음 모양을 정하지 않은 reward 로는 발을 끌거나 좌우가 다른 걸음이 나오기 쉽다. 그래서
        clock 에 맞춘 reward, 발 공중 시간 항목, 굴곡 있는 지형 같은 장치를 더한다. 두 다리로도 걷기·달리기·깡충뛰기처럼 걸음은 여럿이고, trot 은
        네 다리의 걸음이며, 몸의 구조가 다르면 같은 weight 로 같은 걸음이 나오지 않는다.

- topic: periodic-reward
  title: clock 기반 periodic reward
  section: clock-과-periodic-reward
  variants:
    - question: |
        Siekmann 등의 periodic reward 가 swing 구간과 stance 구간에서 각각 penalty 를 주는 대상은 무엇인가?
      choices:
        - 'swing 에서는 발의 속도에 주고, stance 에서는 발이 바닥을 누르는 힘에 준다'
        - 'swing 에서는 발이 바닥을 누르는 힘에 주고, stance 에서는 발의 속도에 준다'
        - '두 구간 모두 관절 torque 에 주고, 구간마다 weight 의 크기만 다르게 둔다'
        - 'swing 에서는 몸통의 높이에 주고, stance 에서는 몸통의 기울기에 준다'
      answer: 1
      explanation: |
        swing 은 발이 공중에 있어야 하는 구간이라 바닥을 누르는 힘에 penalty 를 주고, stance 는 발이 바닥을 딛고 있어야 하는 구간이라 발이 움직이는
        속도에 penalty 를 준다. 첫 보기는 두 구간을 거꾸로 적었다. torque 나 몸통 높이·기울기 penalty 는 걸음 구간과 관계없이 따로 넣는 항목이다.
    - question: |
        periodic reward 로 학습하는 policy 의 observation 에 clock 신호(phase 의 sin·cos)를 넣는 이유는 무엇인가?
      choices:
        - 'clock 이 있어야 PD controller 가 1초에 몇 번 torque 를 계산할지 정할 수 있어서다'
        - 'phase 는 reward 에만 쓰이고, observation 에 넣으면 학습이 조금 빨라질 뿐이어서다'
        - '실제 로봇의 IMU 가 phase 를 재지 못해서, simulator 의 시계로 측정을 대신해서다'
        - '같은 자세라도 phase 에 따라 들어야 할 발이 달라, phase 없이는 정답이 둘이어서다'
      answer: 3
      explanation: |
        periodic reward 는 phase 에 따라 같은 상태에도 다른 점수를 준다. phase 0.2 에서는 왼발을 들어야 하고 0.7 에서는 오른발을 들어야 하는 식이라서 policy 가
        phase 를 모르면 같은 입력에 정답이 둘인 문제가 된다. PD controller 의 계산 주기와는 관계없고, phase 는 IMU 가 재는 물리량이 아니라 reward
        를 위해 정한 박자다.
    - question: |
        두 발이 반 주기 어긋난 periodic reward 에서 swing 비율(한 주기 가운데 발이 공중에 있는 비율)을 0.4 에서 0.6 으로 바꾸면 걸음은 어떻게
        달라지는가?
      choices:
        - '두 발이 함께 딛는 구간 대신 두 발이 함께 뜨는 구간이 생겨서 달리기가 된다'
        - '두 발이 같은 phase 로 움직여서, 번갈아 딛던 걸음이 깡충뛰기로 바뀐다'
        - 'swing 비율은 보폭만 정하므로, 같은 걷기에서 한 걸음의 길이만 더 늘어난다'
        - '두 발이 바닥을 딛는 시간이 늘어서, 공중에 뜨는 순간이 아예 없어진다'
      answer: 0
      explanation: |
        반 주기 어긋난 두 발에서 swing 비율이 0.5 보다 작으면 한 주기에 두 발이 함께 바닥을 딛는 구간이 생기고(0.4 이면 20%), 0.5 보다 크면 두 발이
        함께 공중에 뜨는 구간이 생긴다(0.6 이면 20%). 두 발이 함께 뜨는 구간이 있는 걸음이 달리기다. 깡충뛰기는 어긋남이 0 일 때이고, swing 비율은
        보폭이 아니라 시간의 비율이며, 비율이 커지면 딛는 시간은 오히려 준다.

- topic: gait-emergence
  title: 발 공중 시간 reward 와 fractal 지형
  section: 발-공중-시간-reward-와-fractal-지형
  variants:
    - question: |
        Zhuang 등이 humanoid parkour 를 학습할 때 발 공중 시간 reward 대신 지형에 fractal noise 를 넣은 이유는 무엇인가?
      choices:
        - 'fractal 지형에서는 policy 가 reward 없이도 clock 같은 고정 박자를 스스로 만들어서'
        - 'depth 카메라가 평평한 바닥을 잘 못 보므로, 굴곡이 있어야 지형을 알아볼 수 있어서'
        - '발 공중 시간 항목이 일부 과제와 부딪쳐서, 굴곡으로만 발을 들게 하고 걸음은 풀어 두려고'
        - '발 공중 시간 항목은 계산이 무거워, GPU 로 수천 개 env 를 함께 돌릴 수 없어서'
      answer: 2
      explanation: |
        저자들은 발 공중 시간 항목이 일부 locomotion 과제와 충돌한다고 보고, 발을 끌면 걸려 넘어지는 굴곡 지형으로 발을 들게 했다. H1 의
        simulation 비교에서 허들 성공률은 그 항목을 쓴 policy 가 20%, fractal 지형의 policy 가 100% 였다. 굴곡은 박자를 정해 주지 않고, 1 단계
        걷기 policy 는 카메라 없이 학습하며, 이 항목은 계산이 무겁지 않다.
    - question: |
        발이 바닥에 닿는 순간 (공중에 있던 시간 − 0.5 초)를 주는 발 공중 시간 항목이 policy 에 주는 영향으로 옳은 것은?
      choices:
        - '0.5 초보다 짧은 걸음에 penalty 를 줘 발을 오래 들게 하지만, 짧은 걸음이 필요한 과제와 부딪친다'
        - '발이 공중에 있는 동안 계속 penalty 를 줘서 발을 빨리 내리게 하고, 끄는 걸음을 늘린다'
        - '발이 닿을 때마다 같은 점수를 줘서 걸음 수가 많을수록 reward 가 커지고, 잰걸음을 배운다'
        - '두 발의 박자를 0.5 초로 고정하는 clock 과 같아서, 그 박자를 벗어난 걸음은 할 수 없다'
      answer: 0
      explanation: |
        0.2 초 공중에 있던 발은 0.2 − 0.5 = −0.3 을 받고 0.7 초면 +0.2 를 받으므로 policy 는 발을 오래 드는 쪽으로 간다. 그 대신 짧고 정확한 걸음이
        필요한 과제에서는 penalty 가 된다. 점수는 닿는 순간에만 주고, 공중 시간에 따라 달라지며, 박자를 정하지는 않아서 clock 과 다르다.
    - question: |
        Digit 의 Transformer policy 에는 팔에 대한 reward 나 reference 를 전혀 주지 않았는데, 사람처럼 반대쪽 팔을 흔들며 걸었다. 이 결과가 보여
        주는 것은 무엇인가?
      choices:
        - '팔 흔들기는 Transformer 구조에서만 생기는 성질이라 MLP policy 에서는 나올 수 없다는 것'
        - '걸음 모양을 reward 로 덜 정할수록 policy 가 스스로 찾아내는 동작이 생길 수 있다는 것'
        - 'simulator 에 사람 동작이 미리 들어 있어서 어떤 로봇이든 팔을 흔들게 된다는 것'
        - 'reward 항목이 없으면 policy 는 늘 사람 같은 걸음을 찾으므로 reward 를 비워도 된다는 것'
      answer: 1
      explanation: |
        팔 흔들기는 reward 가 정해 주지 않은 동작인데 학습에서 저절로 나왔다. 저자들은 에너지를 줄이는 항목 때문에 나왔을 수 있다고 보았다.
        network 구조만으로 정해지는 성질이라는 근거는 없고, simulator 는 사람 동작을 담고 있지 않다. 후속 연구는 simulation 이 배터리 소모나 하드웨어
        손상을 흉내 내지 못해서 에너지·대칭 같은 항목을 여전히 넣었으므로, reward 를 비워도 된다는 뜻도 아니다.

- topic: history-transformer
  title: 관측·action 이력을 읽는 causal Transformer
  section: 이력을-읽는-causal-transformer
  variants:
    - question: |
        Radosavovic 등의 humanoid Transformer policy 가 token 하나로 묶는 것은 무엇인가?
      choices:
        - '관절 하나의 각도와 속도이고, 관절 수만큼의 token 사이 attention 으로 action 을 낸다'
        - 'depth 이미지의 patch 하나이고, 지형 token 사이의 attention 으로 발 디딜 자리를 고른다'
        - '한 episode 의 관측 전체를 요약한 vector 이고, episode 가 끝날 때마다 action 을 바꾼다'
        - '한 step 의 관측과 action 을 이어 붙인 숫자이고, 최근 16 step 의 token 으로 action 을 낸다'
      answer: 3
      explanation: |
        HT 는 step 마다 관측과 action 을 이어 붙인 숫자 묶음을 token 하나로 보고, 최근 16 step(1초에 50 번 계산하므로 0.32 초)의 token 을 받아
        다음 action 을 낸다. token 은 관절 단위나 이미지 patch 가 아니라 시점 단위다. 이 policy 는 카메라를 쓰지 않고, 매 step action 을 낸다.
    - question: |
        humanoid Transformer policy 의 입력에 관측뿐 아니라 policy 가 직접 낸 action 까지 넣는 이유는 무엇인가?
      choices:
        - 'action 을 빼면 token 의 길이가 맞지 않아 Transformer 가 계산할 수 없기 때문이다'
        - 'policy 가 낸 목표 각도와 실제로 도달한 각도의 차이에 지형의 반응이 담기기 때문이다'
        - '직전 action 을 그대로 다시 내면 걸음이 매끄러워지므로, 그 값을 복사하게 하려는 것이다'
        - 'action 은 teacher 가 낸 정답이라서 student 가 그것을 보고 따라 하게 하려는 것이다'
      answer: 1
      explanation: |
        같은 목표 각도를 내도 모래나 경사에서는 관절이 다르게 따라오므로, 낸 action 과 그 뒤의 관측을 함께 보면 지금 지형과 몸이 어떻게 반응하는지
        짐작할 수 있다. token 길이는 넣는 숫자에 맞춰 정하면 되고, 직전 action 을 복사하라는 뜻도 아니다. 입력의 action 은 policy 자신이 낸 값이지
        teacher 의 정답이 아니다.
    - question: |
        humanoid Transformer policy 의 self-attention 에 causal mask 를 쓰는 이유로 알맞은 것은 무엇인가?
      choices:
        - 'token 수를 절반으로 줄여 계산량만 낮추려는 것이고, 정확도와는 관계가 없다'
        - '가장 오래된 token 만 보게 해서, 최근의 noise 섞인 관측에 흔들리지 않게 한다'
        - '각 token 이 자기와 앞의 시점만 보게 해서, 실행할 때 없는 미래 정보에 기대지 않게 한다'
        - '관측 token 과 action token 이 서로를 못 보게 갈라서, 두 종류를 따로 학습하게 한다'
      answer: 2
      explanation: |
        로봇 위에서 action 을 낼 때는 미래의 관측이 없으므로, 학습할 때도 각 시점이 자기와 앞의 시점만 보게 막아 둔다. causal mask 는 token 수를
        줄이지 않고 뒤쪽 token 의 attention weight 만 0 으로 만든다. 오래된 token 만 보게 하는 것이 아니고, 한 token 안에 관측과 action 이 함께 들어
        있어서 둘을 가르지도 않는다.

- topic: in-context-adaptation
  title: in-context adaptation
  section: in-context-adaptation
  variants:
    - question: |
        humanoid Transformer policy 의 in-context adaptation 을 바르게 설명한 것은 무엇인가?
      choices:
        - 'weight 는 그대로 두고, 최근 이력이 바뀌면서 같은 network 가 다른 걸음을 낸다'
        - '로봇이 걷는 동안 RL 로 weight 를 조금씩 고쳐서, 새 지형에 맞는 policy 로 바꿔 간다'
        - '지형마다 따로 학습한 policy 여러 개 가운데, 지금 지형에 맞는 것을 골라서 쓴다'
        - '마찰과 무게를 추정하는 module 을 따로 두고, 그 추정값으로 걸음 parameter 를 바꾼다'
      answer: 0
      explanation: |
        in-context adaptation 은 language model 이 prompt 의 예시만 보고 답을 바꾸는 것처럼, weight 를 고치지 않고 입력된 이력만으로 행동이 바뀌는
        것이다. 실물에 올린 policy 의 weight 는 바뀌지 않는다. policy 는 하나뿐이고, 환경 숫자를 따로 추정하는 module 을 두는 것은 RMA 의 방식이다.
    - question: |
        4족의 RMA 와 비교할 때, humanoid Transformer policy 가 지형에 적응하는 방식은 어떻게 다른가?
      choices:
        - 'RMA 처럼 환경 숫자 8 개를 추정하지만, 그 추정을 Transformer 대신 MLP 가 맡는다'
        - '실물에 올린 뒤 몇 분 동안 RL 로 다시 학습해서, 지형마다 다른 weight 를 저장해 둔다'
        - '환경 숫자를 추정하는 module 없이, 지형을 알아채고 걸음을 바꾸는 일을 한 network 가 한다'
        - '적응하지 않고 모든 지형에서 같은 걸음을 내도록 domain randomization 으로만 버틴다'
      answer: 2
      explanation: |
        RMA 는 마찰·짐 무게 같은 숫자를 요약한 8 개 값을 추정하는 module 을 따로 학습했다. HT 에는 그런 추정 대상이 없고, 이력을 읽어 지형을
        알아채는 일과 걸음을 바꾸는 일이 한 network 안에서 함께 일어난다. HT 는 실물에서 다시 학습하지 않으며, 지형에 따라 실제로 걸음을 바꾼다.
    - question: |
        humanoid Transformer policy 를 단단한 흙길과 모래에서 걷게 했더니 엉덩이 관절의 궤적은 같았고 모래에서 torque 가 더 컸다. 이것이 보여 주는
        것은 무엇인가?
      choices:
        - '모래에서는 policy 가 이력을 버리고 기본 자세로 돌아가서 버텼다는 것이다'
        - '모래에서 gain 이 자동으로 커지도록 사람이 규칙을 미리 넣어 두었다는 것이다'
        - '엉덩이 관절은 policy 가 아니라 수동 spring 이 움직여서 궤적이 같았다는 것이다'
        - '이력에서 바닥의 반응을 짐작해, 같은 움직임을 내려고 힘을 바꿔 썼다는 것이다'
      answer: 3
      explanation: |
        카메라 없는 policy 가 같은 관절 궤적을 만들려고 모래에서 더 큰 torque 를 냈다는 것은, 이력에 담긴 목표와 실제 움직임의 차이로 바닥이
        다르다는 것을 알아채고 행동을 바꿨다는 뜻이다. 사람이 넣은 규칙은 없고, 걸음을 그대로 유지했으므로 기본 자세로 돌아간 것도 아니다.
        엉덩이 관절은 motor 로 움직이는 관절이다.

- topic: transformer-training
  title: Transformer policy 를 RL 과 섞어 학습하는 방법
  section: teacher-와-rl-을-섞는-학습
  variants:
    - question: |
        HT 의 student 를 'RL loss + λ × KL(student, teacher)' 로 학습하면서 λ 를 학습 중간쯤까지 0 으로 줄이는 이유는 무엇인가?
      choices:
        - 'λ 가 크면 KL 이 음수가 되어 loss 가 발산하므로, 안정을 위해 일찍 꺼 두려고'
        - '초반에는 teacher 를 따라 빨리 배우고, 뒤에는 RL 만으로 teacher 를 넘어서게 하려고'
        - 'teacher 는 학습 후반에 성능이 떨어지므로, 그때부터는 teacher 를 버리려고'
        - 'λ 를 줄이면 student network 가 작아져서, 실물에서 계산이 빨라지게 하려고'
      answer: 1
      explanation: |
        teacher 를 따라 하는 항은 초반에 빠르게 길을 알려 주지만, 끝까지 남으면 student 가 teacher 를 넘을 수 없다. 그래서 λ 를 줄여 후반에는 RL 만으로
        고친다. KL divergence 는 0 이상이라 음수가 되지 않고, teacher 는 이미 학습을 마친 고정된 policy 이며, λ 는 network 크기와 관계없다.
    - question: |
        관측만 받는 student 를 상태 전체를 받는 teacher 를 따라 하는 항만으로 학습하면 생길 수 있는 한계는 무엇인가?
      choices:
        - '따라 하기 loss 에는 gradient 가 없어서 student 의 weight 를 고칠 수가 없다'
        - 'student 의 network 가 teacher 보다 커서, 따라 하기만으로는 parameter 가 남는다'
        - 'teacher 의 action 은 실물에서 기록한 값이라, simulation 의 student 와 맞지 않는다'
        - 'teacher 에게 최선인 action 이 관측만 받는 student 에게는 최선이 아닐 수 있다'
      answer: 3
      explanation: |
        teacher 는 마찰 계수 같은 상태 전체를 보고 action 을 고르는데 student 는 그 정보를 받지 못하므로, 같은 action 이 student 에게는 최선이 아닐 수
        있다. 그래서 HT 는 RL 항을 함께 두었고, 경사 비교에서 둘을 섞은 쪽이 어느 하나만 쓴 쪽보다 명령 속도에 가까웠다. 따라 하기 loss 도 gradient
        가 있고, network 크기는 이 한계와 관계없으며, teacher 는 simulation 에서 학습한 policy 다.
    - question: |
        HT-2 처럼 걷기 궤적으로 사전 학습한 Transformer 를 RL 로 fine-tuning 할 때 탐색 noise 를 처음부터 작게 두는 이유는 무엇인가?
      choices:
        - '처음부터 큰 noise 로 탐색하면 사전 학습으로 얻은 걸음이 곧바로 망가질 수 있어서다'
        - '사전 학습한 모델에는 action 이 없어서 noise 로 action 자리를 채워야 해서다'
        - 'noise 가 작을수록 PPO 의 clip 범위가 넓어져 한 번에 크게 고칠 수 있어서다'
        - '실물의 센서 noise 가 작아서 simulation 의 탐색 noise 도 그에 맞춰야 해서다'
      answer: 0
      explanation: |
        사전 학습한 모델은 이미 평지를 걸을 줄 알아서, 처음부터 크게 흔들어 탐색하면 그 걸음을 잃는다. 그래서 HT-2 는 탐색 noise 의 standard
        deviation 을 0.135 로 작게 시작해 사전 학습한 걸음 주변부터 탐색했다. 사전 학습한 모델도 action 을 내고, PPO 의 clip 범위는 noise 와 따로
        정하며, 탐색 noise 는 센서 noise 를 흉내 내는 값이 아니다.
      section: 사전-학습과-rl-fine-tuning

- topic: sim-to-sim
  title: sim-to-sim 검증과 asymmetric actor-critic
  section: sim-to-sim-검증
  variants:
    - question: |
        Humanoid-Gym 이 Isaac Gym 에서 학습한 policy 를 실물에 올리기 전에 MuJoCo 에서 다시 걷게 하는 이유는 무엇인가?
      choices:
        - 'MuJoCo 에서 RL 로 한 번 더 학습해서 실물에 맞는 weight 로 고치려고'
        - 'Isaac Gym 은 action 을 내보낼 수 없어서 MuJoCo 로 형식을 바꾸려고'
        - '한 simulator 의 계산 방식에만 기댄 걸음을 다른 simulator 에서 걸러 내려고'
        - 'MuJoCo 가 GPU 로 더 많은 env 를 돌려서 데이터를 더 빨리 모으려고'
      answer: 2
      explanation: |
        simulator 마다 계산 방식이 달라서, 학습한 simulator 의 버릇에만 맞춘 걸음은 다른 simulator 에서 무너진다. 그래서 같은 policy 를 weight 를
        고치지 않고 MuJoCo 에서 다시 걷게 해 본다. 이 단계는 학습이 아니라 검증이고, 형식 변환 때문도 아니며, Humanoid-Gym 에서 MuJoCo 는 CPU 로
        계산하는 쪽이다.
    - question: |
        sim-to-sim 검증이 의미를 가지려면 검증에 쓰는 simulator 에 무엇이 필요한가?
      choices:
        - '실물의 관절 궤적 같은 측정에 맞춰 보정해서, 학습용보다 실물에 가깝게 만드는 것'
        - '학습용 simulator 와 같은 계산 방식과 parameter 를 써서 결과가 똑같이 나오는 것'
        - 'env 를 학습용보다 많이 돌려서 같은 policy 의 평균 reward 를 정확히 재는 것'
        - 'domain randomization 을 끄고 parameter 를 고정해 학습한 조건만 시험하는 것'
      answer: 0
      explanation: |
        검증용 simulator 가 실물을 잘 흉내 내야 거기서 걷는 policy 가 실물에서도 걸을 가능성이 높다. Humanoid-Gym 은 실물과 MuJoCo 에서 다리 관절이
        사인파를 따라가게 해 궤적을 맞췄고, MuJoCo 의 관절 위상 그림이 Isaac Gym 보다 실물에 가까웠다. 학습용과 똑같은 simulator 로는 아무것도 걸러
        내지 못하고, env 수나 randomization 을 끄는 것은 실물과의 차이를 줄이지 않는다.
    - question: |
        actor 에는 실제 센서로 얻는 값만 주고 critic 에만 마찰·질량 같은 privileged 값을 주는 구성에 대한 설명으로 옳은 것은?
      choices:
        - 'critic 도 실물에 올라가 privileged 값을 추정하므로, 실물에서도 마찰을 잴 수 있다'
        - '실물에는 actor 만 올라가므로, teacher 를 student 로 옮기는 단계 없이 privileged 값을 쓴다'
        - 'critic 만 privileged 값을 받아 actor 의 gradient 가 0 이 되고, actor 는 따로 모방 학습한다'
        - 'PPO 는 actor 와 critic 의 입력이 같아야 하므로, 실물에서도 privileged 값을 재야 한다'
      answer: 1
      explanation: |
        asymmetric actor-critic 에서 critic 은 학습 중 가치를 맞히는 데만 쓰이고 실물에는 actor 만 올라간다. 그래서 privileged 값을 critic 의 입력으로
        학습에 쓰면서도 teacher-student 단계가 필요 없다. critic 은 실물에서 쓰지 않고, actor 는 critic 이 계산한 advantage 로 gradient 를 받으며,
        PPO 는 두 network 의 입력이 달라도 계산된다.

- topic: depth-parkour
  title: depth 카메라 parkour policy
  section: depth-카메라-parkour
  variants:
    - question: |
        Zhuang 등의 humanoid parkour 학습에서 oracle policy 와 depth student 의 관계로 옳은 것은?
      choices:
        - '둘 다 depth 이미지를 받고, student 는 oracle 보다 작은 network 로 RL 만 다시 한다'
        - 'student 가 먼저 depth 로 학습하고, oracle 이 student 의 action 을 정답으로 삼는다'
        - 'oracle 은 실물에서 사람이 조종한 기록이고, student 가 그 기록을 그대로 따라 한다'
        - 'oracle 은 지형 높이(scandot)를 받고 student 는 depth 를 받아, DAgger 로 oracle 을 따라 배운다'
      answer: 3
      explanation: |
        oracle 은 simulation 에만 있는 주변 지형 높이 209 점을 받아 RL 로 학습하고, student 는 실물에서도 얻을 수 있는 depth 이미지를 받는다. student 가
        움직이며 지나간 상태마다 oracle 이 낸 action 을 정답으로 따라 배우는 DAgger 를 쓰고, GRU 와 MLP 는 oracle 의 weight 에서 시작한다. oracle 은
        사람의 기록이 아니라 학습한 policy 이고, 순서도 oracle 이 먼저다.
    - question: |
        humanoid 가 0.8 m 틈을 건너뛰거나 0.42 m 상자에 뛰어오를 때 depth 카메라가 꼭 필요한 이유는 무엇인가?
      choices:
        - '관절 encoder 와 IMU 가 도약 중에는 값을 내지 않아서, 카메라로만 자세를 알 수 있어서'
        - '공중에서는 몸통의 궤적을 바꿀 수 없어서, 도약 전에 장애물을 보고 도약을 정해야 해서'
        - 'depth 카메라는 1초에 1,000 번 재므로, PD controller 보다 빨리 torque 를 고칠 수 있어서'
        - '카메라 없는 policy 는 발 공중 시간 항목이 없으면 높은 장애물 앞에서 발을 들지 못해서'
      answer: 1
      explanation: |
        두 발이 모두 공중에 뜨면 발이 바닥을 밀 수 없어 몸통이 날아가는 궤적을 바꿀 수 없다. 그래서 틈의 너비나 상자의 높이를 도약하기 전에 보고
        박차는 힘을 정해야 하며, 카메라 없는 policy 는 장애물에 부딪혀야 알아챈다. encoder 와 IMU 는 공중에서도 값을 내고, depth 요약은 1초에 10 번
        들어오며, 발 공중 시간 항목은 이 문제와 관계없다.
    - question: |
        depth encoder 는 1초에 10 번, policy 는 50 번 계산하는 humanoid parkour 의 실물 배포에서 일어나는 일로 옳은 것은?
      choices:
        - 'policy 는 새 depth 요약이 올 때만 action 을 내고, 그사이 4 번은 직전 action 을 되풀이한다'
        - 'depth 요약이 없는 step 에는 policy 가 멈추고, PD controller 가 기본 자세를 지킨다'
        - 'depth 요약 하나를 policy 가 5 번 쓰고, 그사이 변화는 더 자주 오는 관절·IMU 값으로 따라간다'
        - 'policy 가 depth 요약을 기다려야 해서 실제로는 1초에 10 번만 action 을 낸다'
      answer: 2
      explanation: |
        새 depth 요약은 0.1 초마다 오고 policy 는 0.02 초마다 계산하므로, 같은 depth 요약으로 $50 \div 10 = 5$ 번 action 을 낸다. 그사이에도 관절
        각도와 IMU 값은 매 step 새로 들어와 policy 가 균형을 잡는다. policy 는 depth 를 기다리거나 멈추지 않고, 직전 action 을 반복하지도 않는다.
