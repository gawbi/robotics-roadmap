<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>60 초(600 step) episode 하나에서 정답을 받는 step. DAgger 는 600 step 모두 사람에게 묻고, HG-DAgger 는 사람이 세 번 20 step 씩 운전대를 넘겨받은 60 step 만 기록한다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="598" height="308" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="40.0" y="48.0" fill="#e2e8f0" font-size="13" text-anchor="start">DAgger: policy 가 운전하는 동안 매 step 사람에게 정답을 묻는다</text>
  <rect x="40.0" y="60.0" width="520.0" height="34.0" rx="4" fill="#f59e0b" fill-opacity="0.85"/>
  <text x="300.0" y="82.0" fill="#0b1220" font-size="13" text-anchor="middle" font-weight="bold">600 step 모두 정답 필요</text>
  <text x="40.0" y="140.0" fill="#e2e8f0" font-size="13" text-anchor="start">HG-DAgger: 사람이 위험하다고 볼 때만 운전대를 잡는다</text>
  <rect x="40.0" y="152.0" width="520.0" height="34.0" rx="4" fill="#38bdf8" fill-opacity="0.35"/>
  <rect x="144.0" y="152.0" width="17.3" height="34.0" rx="0" fill="#f59e0b" fill-opacity="0.95"/>
  <line x1="152.7" y1="190.0" x2="152.7" y2="208.0" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="152.7" y="222.0" fill="#f59e0b" font-size="12" text-anchor="middle">120~140</text>
  <rect x="300.0" y="152.0" width="17.3" height="34.0" rx="0" fill="#f59e0b" fill-opacity="0.95"/>
  <line x1="308.7" y1="190.0" x2="308.7" y2="208.0" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="308.7" y="222.0" fill="#f59e0b" font-size="12" text-anchor="middle">300~320</text>
  <rect x="447.3" y="152.0" width="17.3" height="34.0" rx="0" fill="#f59e0b" fill-opacity="0.95"/>
  <line x1="456.0" y1="190.0" x2="456.0" y2="208.0" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="456.0" y="222.0" fill="#f59e0b" font-size="12" text-anchor="middle">470~490</text>
  <text x="40.0" y="248.0" fill="#38bdf8" font-size="12" text-anchor="start">파랑: policy 가 운전하는 구간 (기록하지 않음)</text>
  <text x="40.0" y="266.0" fill="#f59e0b" font-size="12" text-anchor="start">주황: 사람이 운전하는 구간 (사람의 조작을 그대로 정답으로 기록)</text>
  <text x="40.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="start">정답 수: 20 × 3 = 60 개, DAgger 의 600 개의 10 분의 1</text>
  <text x="40.0" y="118.0" fill="#64748b" font-size="11" text-anchor="middle">0</text>
  <text x="560.0" y="118.0" fill="#64748b" font-size="11" text-anchor="middle">600</text>
</svg>
