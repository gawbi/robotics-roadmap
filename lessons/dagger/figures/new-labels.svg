<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>policy 가 간 위치 0.4, 0.6, 1.0 m 에서 expert 에게 물은 정답. 위치마다 센서 값 차이 x 와 정답 조향 a = 4x 가 붙는다</title>
  <defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="50.0" y="70.0" width="510.0" height="80.0" rx="0" fill="#0e1628"/>
  <rect x="74.3" y="70.0" width="145.7" height="80.0" rx="0" fill="#d6aa62" fill-opacity="0.16"/>
  <text x="147.1" y="62.0" fill="#d6aa62" font-size="12" text-anchor="middle">시연 범위 ±0.3 m</text>
  <line x1="147.1" y1="70.0" x2="147.1" y2="150.0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="147.1" y="166.0" fill="#64748b" font-size="12" text-anchor="middle">가운데 0</text>
  <line x1="572.1" y1="70.0" x2="572.1" y2="150.0" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="572.1" y="166.0" fill="#d88b8b" font-size="12" text-anchor="middle">경계 1.75</text>
  <text x="50.0" y="40.0" fill="#94a3b8" font-size="13" text-anchor="start">왼쪽으로 벗어난 거리 y (m) →</text>
  <circle cx="244.3" cy="110.0" r="7" fill="#d88b8b"/>
  <text x="244.3" y="96.0" fill="#d88b8b" font-size="13" text-anchor="middle">0.4</text>
  <rect x="60.0" y="190.0" width="160.0" height="100.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <line x1="244.3" y1="118.0" x2="140.0" y2="188.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="140.0" y="214.0" fill="#e2e8f0" font-size="14" text-anchor="middle">y = 0.4 m</text>
  <text x="140.0" y="236.0" fill="#94a3b8" font-size="12" text-anchor="middle">d_L = 1.35, d_R = 2.15</text>
  <text x="140.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">x = d_R − d_L = 0.8</text>
  <text x="140.0" y="278.0" fill="#d6aa62" font-size="13" text-anchor="middle">정답 a = 4x = 3.2°</text>
  <circle cx="292.9" cy="110.0" r="7" fill="#d88b8b"/>
  <text x="292.9" y="96.0" fill="#d88b8b" font-size="13" text-anchor="middle">0.6</text>
  <rect x="235.0" y="190.0" width="160.0" height="100.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <line x1="292.9" y1="118.0" x2="315.0" y2="188.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="315.0" y="214.0" fill="#e2e8f0" font-size="14" text-anchor="middle">y = 0.6 m</text>
  <text x="315.0" y="236.0" fill="#94a3b8" font-size="12" text-anchor="middle">d_L = 1.15, d_R = 2.35</text>
  <text x="315.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">x = d_R − d_L = 1.2</text>
  <text x="315.0" y="278.0" fill="#d6aa62" font-size="13" text-anchor="middle">정답 a = 4x = 4.8°</text>
  <circle cx="390.0" cy="110.0" r="7" fill="#d88b8b"/>
  <text x="390.0" y="96.0" fill="#d88b8b" font-size="13" text-anchor="middle">1.0</text>
  <rect x="410.0" y="190.0" width="160.0" height="100.0" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="2"/>
  <line x1="390.0" y1="118.0" x2="490.0" y2="188.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="490.0" y="214.0" fill="#e2e8f0" font-size="14" text-anchor="middle">y = 1.0 m</text>
  <text x="490.0" y="236.0" fill="#94a3b8" font-size="12" text-anchor="middle">d_L = 0.75, d_R = 2.75</text>
  <text x="490.0" y="256.0" fill="#94a3b8" font-size="12" text-anchor="middle">x = d_R − d_L = 2.0</text>
  <text x="490.0" y="278.0" fill="#d6aa62" font-size="13" text-anchor="middle">정답 a = 4x = 8.0°</text>
  <text x="300.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">정답은 정확한 위치를 아는 expert 가 그 자리에서 냈을 조향이다</text>
</svg>
