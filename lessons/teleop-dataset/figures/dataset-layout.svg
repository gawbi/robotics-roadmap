<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>LeRobotDataset v3.0 의 폴더 구조: meta 에 이름·fps·통계·task·episode 정보, data 의 Parquet 표에 frame 마다 한 행, videos 의 MP4 에 카메라 영상</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30" y="40" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">my_dataset/</text>
  <text x="52" y="66" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">meta/</text>
  <text x="330.0" y="66.0" fill="#94a3b8" font-size="12.5" text-anchor="start">설명 정보</text>
  <text x="74" y="90" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">info.json</text>
  <text x="330.0" y="90.0" fill="#94a3b8" font-size="12.5" text-anchor="start">형식 버전 · fps · 값마다의 이름과 개수</text>
  <text x="74" y="114" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">stats.json</text>
  <text x="330.0" y="114.0" fill="#94a3b8" font-size="12.5" text-anchor="start">값마다의 최솟값 · 최댓값 · 평균 · 흩어진 정도</text>
  <text x="74" y="138" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">tasks.parquet</text>
  <text x="330.0" y="138.0" fill="#94a3b8" font-size="12.5" text-anchor="start">task 문장 ↔ task 번호</text>
  <text x="74" y="162" fill="#38bdf8" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">episodes/</text>
  <text x="330.0" y="162.0" fill="#94a3b8" font-size="12.5" text-anchor="start">episode 마다 길이와 파일 안의 시작 위치</text>
  <text x="52" y="192" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">data/chunk-000/</text>
  <text x="74" y="216" fill="#f59e0b" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">file-000.parquet</text>
  <text x="330.0" y="216.0" fill="#94a3b8" font-size="12.5" text-anchor="start">숫자 표: frame 마다 한 행, 여러 episode</text>
  <text x="52" y="246" fill="#e2e8f0" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">videos/</text>
  <text x="74" y="270" fill="#34d399" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">observation.images.up/…/file-000.mp4</text>
  <text x="74" y="294" fill="#34d399" font-size="13" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">observation.images.side/…/file-000.mp4</text>
  <text x="400.0" y="282.0" fill="#94a3b8" font-size="12.5" text-anchor="start">카메라마다 압축 영상 하나</text>
  <text x="30.0" y="336.0" fill="#64748b" font-size="11.5" text-anchor="start">이름은 lerobot/svla_so101_pickplace 의 실제 폴더 구조와 같다 (카메라 up · side 두 대)</text>
</svg>
