  <text x="20.0" y="272.0" fill="#94a3b8" font-size="12" text-anchor="start">1초에 관절 값 100 개 중 사진과 짝지어진 30 개만 frame 에 들어간다 (회색 점은 쓰지 않음)</text>
  <text x="20.0" y="294.0" fill="#64748b" font-size="11" text-anchor="start">시각 단위: ms</text>
