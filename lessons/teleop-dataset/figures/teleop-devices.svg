<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>입력 장치 네 가지가 내는 값과 그 값이 관절 6 개의 목표 각도로 바뀌는 길. leader 팔은 관절 각도를 calibration 만 거쳐 옮기고, VR 조종기·스마트폰, spacemouse, 키보드는 손끝 목표를 IK 로 관절 각도로 바꾼다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker></defs>
  <rect x="1" y="1" width="638" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="34.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="95.0" y="65.0" fill="#e2e8f0" font-size="14" text-anchor="middle">leader 팔</text>
  <line x1="172.0" y1="60.0" x2="196.0" y2="60.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="200.0" y="34.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="275.0" y="65.0" fill="#e2e8f0" font-size="13" text-anchor="middle">관절 각도 6 개</text>
  <line x1="352.0" y1="60.0" x2="376.0" y2="60.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="380.0" y="34.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="445.0" y="57.0" fill="#e2e8f0" font-size="14" text-anchor="middle">calibration</text>
  <text x="445.0" y="76.0" fill="#94a3b8" font-size="11" text-anchor="middle">같은 자세 → 같은 값</text>
  <line x1="512.0" y1="60.0" x2="540.0" y2="168.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="20.0" y="106.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="95.0" y="137.0" fill="#e2e8f0" font-size="14" text-anchor="middle">VR 조종기 · 스마트폰</text>
  <line x1="172.0" y1="132.0" x2="196.0" y2="132.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="200.0" y="106.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="275.0" y="137.0" fill="#e2e8f0" font-size="13" text-anchor="middle">손의 위치 · 자세</text>
  <line x1="352.0" y1="132.0" x2="376.0" y2="132.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="380.0" y="106.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="129.0" fill="#e2e8f0" font-size="14" text-anchor="middle">IK 계산</text>
  <text x="445.0" y="148.0" fill="#94a3b8" font-size="11" text-anchor="middle">손끝 목표 → 관절</text>
  <line x1="512.0" y1="132.0" x2="540.0" y2="168.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="20.0" y="178.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="95.0" y="209.0" fill="#e2e8f0" font-size="14" text-anchor="middle">spacemouse</text>
  <line x1="172.0" y1="204.0" x2="196.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="200.0" y="178.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="275.0" y="209.0" fill="#e2e8f0" font-size="13" text-anchor="middle">6 축 이동 · 회전량</text>
  <line x1="352.0" y1="204.0" x2="376.0" y2="204.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="380.0" y="178.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="201.0" fill="#e2e8f0" font-size="14" text-anchor="middle">IK 계산</text>
  <text x="445.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">손끝 목표 → 관절</text>
  <line x1="512.0" y1="204.0" x2="540.0" y2="168.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="20.0" y="250.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="95.0" y="281.0" fill="#e2e8f0" font-size="14" text-anchor="middle">키보드</text>
  <line x1="172.0" y1="276.0" x2="196.0" y2="276.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="200.0" y="250.0" width="150.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="275.0" y="281.0" fill="#e2e8f0" font-size="13" text-anchor="middle">키마다 한 축 이동</text>
  <line x1="352.0" y1="276.0" x2="376.0" y2="276.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="380.0" y="250.0" width="130.0" height="52.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="273.0" fill="#e2e8f0" font-size="14" text-anchor="middle">IK 계산</text>
  <text x="445.0" y="292.0" fill="#94a3b8" font-size="11" text-anchor="middle">손끝 목표 → 관절</text>
  <line x1="512.0" y1="276.0" x2="540.0" y2="168.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="544.0" y="132.0" width="80.0" height="72.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="584.0" y="156.0" fill="#e2e8f0" font-size="13" text-anchor="middle">목표 각도</text>
  <text x="584.0" y="176.0" fill="#94a3b8" font-size="13" text-anchor="middle">6 개</text>
  <text x="20.0" y="334.0" fill="#f59e0b" font-size="13" text-anchor="start">위 한 줄은 관절 각도를 그대로 옮긴다 (joint-space mapping)</text>
  <text x="20.0" y="356.0" fill="#38bdf8" font-size="13" text-anchor="start">아래 세 줄은 손끝 목표를 IK 로 관절 각도로 바꾼다 (task-space mapping)</text>
</svg>
