<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>세 입력 장치가 내는 값과 그 값이 관절 6 개의 목표 각도로 바뀌는 길</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="110.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="75.0" y="75.0" fill="#e2e8f0" font-size="14" text-anchor="middle">leader 팔</text>
  <line x1="132.0" y1="70.0" x2="158.0" y2="70.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="162.0" y="40.0" width="170.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="247.0" y="75.0" fill="#e2e8f0" font-size="14" text-anchor="middle">관절 각도 6 개</text>
  <line x1="334.0" y1="70.0" x2="360.0" y2="70.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364.0" y="40.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="424.0" y="65.5" fill="#e2e8f0" font-size="14" text-anchor="middle">offset 더하기</text>
  <text x="424.0" y="84.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">20° + 5° = 25°</text>
  <line x1="486.0" y1="70.0" x2="512.0" y2="160.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="20.0" y="130.0" width="110.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="75.0" y="165.0" fill="#e2e8f0" font-size="14" text-anchor="middle">게임패드</text>
  <line x1="132.0" y1="160.0" x2="158.0" y2="160.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="162.0" y="130.0" width="170.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="247.0" y="155.5" fill="#e2e8f0" font-size="14" text-anchor="middle">막대 기울기</text>
  <text x="247.0" y="174.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">집게 끝 이동량</text>
  <line x1="334.0" y1="160.0" x2="360.0" y2="160.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364.0" y="130.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="424.0" y="155.5" fill="#e2e8f0" font-size="14" text-anchor="middle">IK 계산</text>
  <text x="424.0" y="174.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">이동량 → 관절 변화</text>
  <line x1="486.0" y1="160.0" x2="512.0" y2="160.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="20.0" y="220.0" width="110.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="75.0" y="255.0" fill="#e2e8f0" font-size="14" text-anchor="middle">키보드</text>
  <line x1="132.0" y1="250.0" x2="158.0" y2="250.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="162.0" y="220.0" width="170.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="247.0" y="245.5" fill="#e2e8f0" font-size="14" text-anchor="middle">키 누름</text>
  <text x="247.0" y="264.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">5 mm 씩 이동</text>
  <line x1="334.0" y1="250.0" x2="360.0" y2="250.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="364.0" y="220.0" width="120.0" height="60.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="424.0" y="245.5" fill="#e2e8f0" font-size="14" text-anchor="middle">IK 계산</text>
  <text x="424.0" y="264.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">이동량 → 관절 변화</text>
  <line x1="486.0" y1="250.0" x2="512.0" y2="160.0" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="514.0" y="120.0" width="70.0" height="80.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="549.0" y="146.0" fill="#e2e8f0" font-size="14" text-anchor="middle">목표</text>
  <text x="549.0" y="165.0" fill="#94a3b8" font-size="12.5" text-anchor="middle">각도</text>
  <text x="549.0" y="184.0" fill="#94a3b8" font-size="12.5" text-anchor="middle">6 개</text>
  <text x="20.0" y="312.0" fill="#94a3b8" font-size="12" text-anchor="start">위 길은 관절 각도를 직접 옮기고, 아래 두 길은 집게 끝(end-effector)을 옮길 거리를 IK 로 관절 각도로 바꾼다</text>
</svg>
