<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>1초에 60° 로 올라가는 어깨. 사진의 실제 시각과 도착 시각이 100 ms 다르면 각도가 6° 벌어진다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="80.0" y1="270.0" x2="530.0" y2="270.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="80.0" y1="270.0" x2="80.0" y2="40.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80.0" y="288.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">0</text>
  <text x="226.7" y="288.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">100</text>
  <text x="373.3" y="288.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">200</text>
  <text x="520.0" y="288.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">300</text>
  <text x="72.0" y="274.0" fill="#94a3b8" font-size="11.5" text-anchor="end">0°</text>
  <text x="72.0" y="208.0" fill="#94a3b8" font-size="11.5" text-anchor="end">6°</text>
  <text x="72.0" y="142.0" fill="#94a3b8" font-size="11.5" text-anchor="end">12°</text>
  <text x="72.0" y="76.0" fill="#94a3b8" font-size="11.5" text-anchor="end">18°</text>
  <text x="520.0" y="306.0" fill="#94a3b8" font-size="12" text-anchor="end">시간 (ms)</text>
  <text x="72.0" y="32.0" fill="#94a3b8" font-size="12" text-anchor="start">어깨 각도</text>
  <path d="M80.0,270.0 L520.0,72.0" fill="none" stroke="#7cb4d8" stroke-width="2.5"/>
  <line x1="226.7" y1="270.0" x2="226.7" y2="204.0" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="373.3" y1="270.0" x2="373.3" y2="138.0" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="226.7" cy="204.0" r="6" fill="#d6aa62"/>
  <circle cx="373.3" cy="138.0" r="6" fill="#7fc4a2"/>
  <text x="216.7" y="192.0" fill="#d6aa62" font-size="12.5" text-anchor="end">사진이 실제로 찍힌 순간: 6°</text>
  <text x="387.3" y="170.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">도착해 적힌 시각의 관절 상태: 12°</text>
  <line x1="234.7" y1="202.0" x2="365.3" y2="140.0" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="300.0" y="150.0" fill="#d88b8b" font-size="12.5" text-anchor="end">100 ms 늦게 적으면 6° 차이</text>
  <text x="20.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="start">1 ms 에 0.06°, 100 ms 에 6°. 집게 끝(반지름 30 cm)으로는 약 3.1 cm</text>
</svg>
