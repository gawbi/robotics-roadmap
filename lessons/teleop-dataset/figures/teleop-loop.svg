<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>한 frame 동안의 기록 순서: 관측 읽기, action 만들기, 보내기, 저장, 1/30 초까지 기다리기</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30.0" y="40.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="110.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">1. 관측 읽기</text>
  <text x="110.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">최근 사진 · 관절 각도</text>
  <rect x="220.0" y="40.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="300.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">2. action 만들기</text>
  <text x="300.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">입력 장치 → 목표 각도</text>
  <rect x="410.0" y="40.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="490.0" y="67.5" fill="#e2e8f0" font-size="14" text-anchor="middle">3. follower 에 보내기</text>
  <text x="490.0" y="86.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">목표 각도 6 개</text>
  <rect x="410.0" y="160.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="2"/>
  <text x="490.0" y="187.5" fill="#e2e8f0" font-size="14" text-anchor="middle">4. frame 저장</text>
  <text x="490.0" y="206.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">관측 · action · task</text>
  <rect x="220.0" y="160.0" width="160.0" height="64.0" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="2"/>
  <text x="300.0" y="187.5" fill="#e2e8f0" font-size="14" text-anchor="middle">5. 기다리기</text>
  <text x="300.0" y="206.5" fill="#94a3b8" font-size="12.5" text-anchor="middle">1/30 초 = 33.3 ms 까지</text>
  <line x1="192.0" y1="72.0" x2="216.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="382.0" y1="72.0" x2="406.0" y2="72.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490.0" y1="106.0" x2="490.0" y2="156.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="408.0" y1="192.0" x2="384.0" y2="192.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M218,192 L110,192 L110,108" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="118.0" y="180.0" fill="#94a3b8" font-size="12" text-anchor="start">다음 frame</text>
  <text x="30.0" y="262.0" fill="#e2e8f0" font-size="13" text-anchor="start">한 바퀴(loop)가 33.3 ms 안에 끝나야 30 fps 가 지켜진다</text>
  <text x="30.0" y="286.0" fill="#94a3b8" font-size="12.5" text-anchor="start">관측은 action 을 보내기 전에 읽는다. frame k 의 시각은 k ÷ 30 초</text>
  <text x="30.0" y="308.0" fill="#94a3b8" font-size="12.5" text-anchor="start">한 바퀴가 50 ms 걸리면 그 뒤 frame 들은 적힌 시각보다 16.7 ms 늦어진다</text>
</svg>
