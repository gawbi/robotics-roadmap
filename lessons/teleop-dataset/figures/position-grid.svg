<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>시연 50 개를 한 자리에서만 모으면 덮는 영역이 점 하나이고, 다섯 자리에 10 개씩 모으면 넓은 영역을 덮는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="155.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="middle">한 자리 × 50 개</text>
  <rect x="20.0" y="48.0" width="270.0" height="190.0" rx="6" fill="#0e1628" stroke="#475569" stroke-width="2"/>
  <rect x="130.0" y="220.0" width="50.0" height="26.0" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="155.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="middle">로봇</text>
  <circle cx="155.0" cy="130.0" r="10" fill="#f59e0b"/>
  <text x="155.0" y="110.0" fill="#f59e0b" font-size="12" text-anchor="middle">50</text>
  <circle cx="235.0" cy="120.0" r="8" fill="#f87171"/>
  <text x="235.0" y="102.0" fill="#f87171" font-size="12" text-anchor="middle">실패</text>
  <text x="235.0" y="150.0" fill="#f87171" font-size="11.5" text-anchor="middle">10 cm 옆</text>
  <text x="445.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="middle">다섯 자리 × 10 개</text>
  <rect x="310.0" y="48.0" width="270.0" height="190.0" rx="6" fill="#0e1628" stroke="#475569" stroke-width="2"/>
  <rect x="420.0" y="220.0" width="50.0" height="26.0" rx="6" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="445.0" y="238.0" fill="#e2e8f0" font-size="12" text-anchor="middle">로봇</text>
  <polygon points="360,80 530,80 530,190 360,190" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="360.0" cy="80.0" r="8" fill="#f59e0b"/>
  <circle cx="530.0" cy="80.0" r="8" fill="#f59e0b"/>
  <circle cx="445.0" cy="135.0" r="8" fill="#f59e0b"/>
  <circle cx="360.0" cy="190.0" r="8" fill="#f59e0b"/>
  <circle cx="530.0" cy="190.0" r="8" fill="#f59e0b"/>
  <circle cx="400.0" cy="120.0" r="8" fill="#34d399"/>
  <text x="400.0" y="104.0" fill="#34d399" font-size="12" text-anchor="middle">성공</text>
  <text x="20.0" y="278.0" fill="#94a3b8" font-size="11.5" text-anchor="start">주황: 시연 자리. 오른쪽은 다섯 자리가 만든 점선 영역 안의 처음 보는 자리(초록)도 시연 사이를 메워 집는다</text>
</svg>
