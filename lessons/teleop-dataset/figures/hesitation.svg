<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>컵 위 장면의 frame 104 개 가운데 90 개가 멈춘 시연에서 나와 평균 action 이 0.13 cm 로 0 쪽에 붙는다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="start">컵 위 장면의 frame 수</text>
  <line x1="60.0" y1="230.0" x2="340.0" y2="230.0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="90.0" y="205.1" width="70.0" height="24.9" rx="3" fill="#7cb4d8" fill-opacity="0.85"/>
  <text x="125.0" y="197.1" fill="#7cb4d8" font-size="12.5" text-anchor="middle">14 frame</text>
  <text x="125.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="middle">바로 내림 7 개</text>
  <text x="125.0" y="264.0" fill="#94a3b8" font-size="12" text-anchor="middle">action 1 cm</text>
  <rect x="220.0" y="70.0" width="70.0" height="160.0" rx="3" fill="#d88b8b" fill-opacity="0.85"/>
  <text x="255.0" y="62.0" fill="#d88b8b" font-size="12.5" text-anchor="middle">90 frame</text>
  <text x="255.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="middle">1초 멈춤 3 개</text>
  <text x="255.0" y="264.0" fill="#94a3b8" font-size="12" text-anchor="middle">action 0 cm</text>
  <text x="360.0" y="36.0" fill="#e2e8f0" font-size="13" text-anchor="start">policy 가 배우는 평균 (cm)</text>
  <line x1="380.0" y1="150.0" x2="560.0" y2="150.0" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380.0" y1="145.0" x2="380.0" y2="155.0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380.0" y="172.0" fill="#94a3b8" font-size="12" text-anchor="middle">0</text>
  <line x1="470.0" y1="145.0" x2="470.0" y2="155.0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="470.0" y="172.0" fill="#94a3b8" font-size="12" text-anchor="middle">0.5</text>
  <line x1="560.0" y1="145.0" x2="560.0" y2="155.0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="560.0" y="172.0" fill="#94a3b8" font-size="12" text-anchor="middle">1</text>
  <circle cx="560.0" cy="150.0" r="7" fill="#7cb4d8"/>
  <text x="560.0" y="136.0" fill="#7cb4d8" font-size="11.5" text-anchor="middle">바로 내림</text>
  <circle cx="380.0" cy="150.0" r="7" fill="#d88b8b"/>
  <text x="380.0" y="136.0" fill="#d88b8b" font-size="11.5" text-anchor="middle">멈춤</text>
  <path d="M404.3,180 l-7,12 h14 z" fill="#7fc4a2" stroke="#7fc4a2" stroke-width="0"/>
  <text x="408.3" y="210.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">평균 14 ÷ 104 ≈ 0.13</text>
  <text x="20.0" y="300.0" fill="#94a3b8" font-size="12.5" text-anchor="start">시연은 10 개 중 3 개만 멈췄지만, frame 으로는 104 개 중 90 개를 차지한다</text>
</svg>
