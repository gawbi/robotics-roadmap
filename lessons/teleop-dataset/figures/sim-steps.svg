<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>30 fps 의 33.3 ms 를 5 ms step 6 번으로 채우면 30 ms 에서 멈추고, 25 fps 의 40 ms 는 8 step 으로 정확히 채워진다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="268" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20.0" y="70.0" fill="#e2e8f0" font-size="13" text-anchor="start">30 fps, 6 step</text>
  <rect x="140.0" y="48.0" width="349.6" height="34.0" rx="4" fill="#0e1628" stroke="#64748b" stroke-width="1.5"/>
  <rect x="141.5" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="166.2" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">1</text>
  <rect x="194.0" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="218.8" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">2</text>
  <rect x="246.5" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="271.2" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">3</text>
  <rect x="299.0" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="323.8" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">4</text>
  <rect x="351.5" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="376.2" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">5</text>
  <rect x="404.0" y="52.0" width="49.5" height="26.0" rx="3" fill="#d6aa62" fill-opacity="0.75"/>
  <text x="428.8" y="70.0" fill="#0b1220" font-size="12" text-anchor="middle">6</text>
  <text x="489.6" y="36.0" fill="#94a3b8" font-size="11.5" text-anchor="end">33.3 ms</text>
  <text x="140.0" y="104.0" fill="#d88b8b" font-size="12.5" text-anchor="start">6 × 5 = 30 ms, 3.3 ms 모자람 → 300 frame 이 10 초로 적히지만 sim 은 9 초</text>
  <line x1="455.0" y1="46.0" x2="455.0" y2="90.0" stroke="#d88b8b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="20.0" y="172.0" fill="#e2e8f0" font-size="13" text-anchor="start">25 fps, 8 step</text>
  <rect x="140.0" y="150.0" width="420.0" height="34.0" rx="4" fill="#0e1628" stroke="#64748b" stroke-width="1.5"/>
  <rect x="141.5" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="166.2" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">1</text>
  <rect x="194.0" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="218.8" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">2</text>
  <rect x="246.5" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="271.2" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">3</text>
  <rect x="299.0" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="323.8" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">4</text>
  <rect x="351.5" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="376.2" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">5</text>
  <rect x="404.0" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="428.8" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">6</text>
  <rect x="456.5" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="481.2" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">7</text>
  <rect x="509.0" y="154.0" width="49.5" height="26.0" rx="3" fill="#7fc4a2" fill-opacity="0.75"/>
  <text x="533.8" y="172.0" fill="#0b1220" font-size="12" text-anchor="middle">8</text>
  <text x="560.0" y="138.0" fill="#94a3b8" font-size="11.5" text-anchor="end">40 ms</text>
  <text x="140.0" y="206.0" fill="#7fc4a2" font-size="12.5" text-anchor="start">8 × 5 = 40 ms 로 frame 간격과 딱 맞는다</text>
  <text x="20.0" y="252.0" fill="#64748b" font-size="11.5" text-anchor="start">physics timestep 5 ms. 칸 하나가 physics step 하나</text>
</svg>
