<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>여러 episode 를 이어 붙인 lerobot/svla_so101_pickplace 의 파일. 표 파일에서 episode 0 은 행 0 ~ 302, episode 1 은 행 303 ~ 568 이고, 영상 파일에서 episode 1 은 10.1 초부터 18.97 초까지다. episode 1 의 frame 57 은 표의 행 360, 영상의 12.0 초에 있다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker></defs>
  <rect x="1" y="1" width="638" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="32.0" fill="#e2e8f0" font-size="14" text-anchor="start">표 파일 data/…/file-000.parquet (frame 마다 한 행)</text>
  <rect x="31.0" y="46.0" width="253.1" height="36.0" rx="8" fill="#3a2a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="157.5" y="69.0" fill="#e2e8f0" font-size="13" text-anchor="middle">episode 0: 행 0 ~ 302</text>
  <rect x="31.0" y="178.0" width="253.1" height="36.0" rx="8" fill="#3a2a0c" stroke="#d6aa62" stroke-width="2"/>
  <text x="157.5" y="201.0" fill="#e2e8f0" font-size="13" text-anchor="middle">0 ~ 10.1 초</text>
  <rect x="286.1" y="46.0" width="221.9" height="36.0" rx="8" fill="#0f2f45" stroke="#7cb4d8" stroke-width="2"/>
  <text x="397.0" y="69.0" fill="#e2e8f0" font-size="13" text-anchor="middle">episode 1: 행 303 ~ 568</text>
  <rect x="286.1" y="178.0" width="221.9" height="36.0" rx="8" fill="#0f2f45" stroke="#7cb4d8" stroke-width="2"/>
  <text x="397.0" y="201.0" fill="#e2e8f0" font-size="13" text-anchor="middle">10.1 ~ 18.97 초</text>
  <rect x="510.0" y="46.0" width="99.0" height="36.0" rx="8" fill="#0f3a2c" stroke="#7fc4a2" stroke-width="2"/>
  <text x="559.5" y="69.0" fill="#e2e8f0" font-size="13" text-anchor="middle">ep 2: 569 ~</text>
  <rect x="510.0" y="178.0" width="99.0" height="36.0" rx="8" fill="#0f3a2c" stroke="#7fc4a2" stroke-width="2"/>
  <text x="559.5" y="201.0" fill="#e2e8f0" font-size="13" text-anchor="middle">18.97 초 ~</text>
  <line x1="333.0" y1="84" x2="333.0" y2="98" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="333.0" cy="102" r="4" fill="#e2e8f0"/>
  <text x="333.0" y="124.0" fill="#e2e8f0" font-size="13" text-anchor="middle">행 303 + 57 = 360 (episode 1 의 frame 57)</text>
  <text x="30.0" y="164.0" fill="#e2e8f0" font-size="14" text-anchor="start">영상 파일 videos/observation.images.up/…/file-000.mp4 (30 fps)</text>
  <line x1="333.0" y1="216" x2="333.0" y2="230" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="333.0" cy="234" r="4" fill="#e2e8f0"/>
  <text x="333.0" y="256.0" fill="#e2e8f0" font-size="13" text-anchor="middle">10.1 + 57 ÷ 30 = 10.1 + 1.9 = 12.0 초</text>
  <text x="30.0" y="298.0" fill="#7fc4a2" font-size="13" text-anchor="start">meta/episodes 의 episode 1: dataset_from_index 303, dataset_to_index 569,</text>
  <text x="30.0" y="318.0" fill="#7fc4a2" font-size="13" text-anchor="start">영상 from_timestamp 10.1 초, to_timestamp 18.97 초</text>
  <text x="30.0" y="342.0" fill="#64748b" font-size="12" text-anchor="start">lerobot/svla_so101_pickplace 의 실제 값 (episode 0 은 303 frame, episode 1 은 266 frame)</text>
</svg>
