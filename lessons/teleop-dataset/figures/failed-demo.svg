<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>집게를 닫은 높이. 성공 시연 45 개는 2 cm, 실패 시연 5 개는 6 cm 이고 섞어 배우면 2.4 cm</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="90.0" y1="270.0" x2="90.0" y2="40.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="90.0" y1="270.0" x2="560.0" y2="270.0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="82.0" y="274.0" fill="#94a3b8" font-size="11.5" text-anchor="end">0 cm</text>
  <text x="82.0" y="219.0" fill="#94a3b8" font-size="11.5" text-anchor="end">2 cm</text>
  <text x="82.0" y="164.0" fill="#94a3b8" font-size="11.5" text-anchor="end">4 cm</text>
  <text x="82.0" y="109.0" fill="#94a3b8" font-size="11.5" text-anchor="end">6 cm</text>
  <text x="82.0" y="54.0" fill="#94a3b8" font-size="11.5" text-anchor="end">8 cm</text>
  <text x="94.0" y="36.0" fill="#94a3b8" font-size="12" text-anchor="start">집게를 닫은 높이</text>
  <rect x="150.0" y="146.2" width="70.0" height="123.8" rx="4" fill="#0e1628" stroke="#cbd5e1" stroke-width="2"/>
  <text x="185.0" y="260.0" fill="#cbd5e1" font-size="12" text-anchor="middle">컵</text>
  <line x1="130.0" y1="215.0" x2="240.0" y2="215.0" stroke="#34d399" stroke-width="2.5"/>
  <text x="254.0" y="235.0" fill="#34d399" font-size="13" text-anchor="start">성공 45 개: 2 cm</text>
  <line x1="130.0" y1="105.0" x2="240.0" y2="105.0" stroke="#f87171" stroke-width="2.5"/>
  <text x="254.0" y="109.0" fill="#f87171" font-size="13" text-anchor="start">실패 5 개: 6 cm</text>
  <line x1="130.0" y1="204.0" x2="240.0" y2="204.0" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="254.0" y="196.0" fill="#f59e0b" font-size="13" text-anchor="start">섞어 배운 policy: 2.4 cm</text>
  <text x="254.0" y="83.0" fill="#f87171" font-size="11.5" text-anchor="start">컵 위에서 닫아 놓쳤다</text>
  <text x="380.0" y="218.0" fill="#f59e0b" font-size="12" text-anchor="start"></text>
  <text x="254.0" y="260.2" fill="#94a3b8" font-size="12.5" text-anchor="start">(45 × 2 + 5 × 6) ÷ 50 = 120 ÷ 50 = 2.4</text>
</svg>
