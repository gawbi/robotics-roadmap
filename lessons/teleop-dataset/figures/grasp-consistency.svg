<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위에서 집는 손목 0° 와 옆에서 집는 손목 90° 를 반씩 섞으면 평균 45° 로 비스듬히 다가간다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="175.0" height="200.0" rx="8" fill="#0e1628"/>
  <text x="107.0" y="62.0" fill="#7fc4a2" font-size="13" text-anchor="middle">위에서 (0°) 25 개</text>
  <rect x="87.0" y="180.0" width="40.0" height="50.0" rx="4" fill="#111a2e" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="107.0" y1="110.0" x2="107.0" y2="152.0" stroke="#7fc4a2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="107.0" y="262.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">잡는다</text>
  <rect x="212.0" y="40.0" width="175.0" height="200.0" rx="8" fill="#0e1628"/>
  <text x="299.0" y="62.0" fill="#7fc4a2" font-size="13" text-anchor="middle">옆에서 (90°) 25 개</text>
  <rect x="279.0" y="180.0" width="40.0" height="50.0" rx="4" fill="#111a2e" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="219.0" y1="190.0" x2="261.0" y2="190.0" stroke="#7fc4a2" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="299.0" y="262.0" fill="#7fc4a2" font-size="12.5" text-anchor="middle">잡는다</text>
  <rect x="404.0" y="40.0" width="175.0" height="200.0" rx="8" fill="#0e1628"/>
  <text x="491.0" y="62.0" fill="#d88b8b" font-size="13" text-anchor="middle">평균 45°</text>
  <rect x="471.0" y="180.0" width="40.0" height="50.0" rx="4" fill="#111a2e" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="434.4" y1="133.4" x2="464.1" y2="163.1" stroke="#d88b8b" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="491.0" y="262.0" fill="#d88b8b" font-size="12.5" text-anchor="middle">어느 쪽으로도 못 잡는다</text>
  <text x="20.0" y="288.0" fill="#94a3b8" font-size="12.5" text-anchor="start">(25 × 0 + 25 × 90) ÷ 50 = 45°</text>
</svg>
