<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>오른쪽 키를 누르고 있으면 짧은 순간마다 집게 끝을 5 mm 씩 옮겨 1초에 15 cm 를 간다</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="arrow-txt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker></defs>
  <rect x="1" y="1" width="598" height="318" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="40.0" fill="#e2e8f0" font-size="14" text-anchor="start">오른쪽 키를 누르고 있는 동안 (1초에 30 번)</text>
  <circle cx="40.0" cy="90.0" r="7" fill="#111a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="40.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">0 mm</text>
  <line x1="49.0" y1="90.0" x2="89.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="100.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="100.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">5 mm</text>
  <line x1="109.0" y1="90.0" x2="149.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="160.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="160.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">10 mm</text>
  <line x1="169.0" y1="90.0" x2="209.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="220.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="220.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">15 mm</text>
  <line x1="229.0" y1="90.0" x2="269.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="280.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="280.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">20 mm</text>
  <line x1="289.0" y1="90.0" x2="329.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="340.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="340.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">25 mm</text>
  <line x1="349.0" y1="90.0" x2="389.0" y2="90.0" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <circle cx="400.0" cy="90.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400.0" y="120.0" fill="#94a3b8" font-size="12" text-anchor="middle">30 mm</text>
  <text x="430.0" y="95.0" fill="#94a3b8" font-size="16" text-anchor="start">…</text>
  <text x="30.0" y="155.0" fill="#e2e8f0" font-size="13" text-anchor="start">한 번에 5 mm  →  1초(30 번)에 5 × 30 = 150 mm = 15 cm</text>
  <text x="30.0" y="178.0" fill="#94a3b8" font-size="12.5" text-anchor="start">막대를 절반 기울이면 5 × 0.5 = 2.5 mm 씩, 1초에 7.5 cm</text>
  <rect x="20.0" y="196.0" width="560.0" height="108.0" rx="8" fill="#0e1628"/>
  <text x="36.0" y="220.0" fill="#e2e8f0" font-size="13" text-anchor="start">IK: 집게 끝 5 mm 를 관절 각도로 바꾸기</text>
  <circle cx="140.0" cy="288.0" r="6" fill="#111a2e" stroke="#38bdf8" stroke-width="2"/>
  <path d="M140,288 L230,238" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="230.0" cy="238.0" r="5" fill="#f59e0b"/>
  <text x="238.0" y="236.0" fill="#f59e0b" font-size="12" text-anchor="start">집게 끝</text>
  <text x="170.0" y="254.0" fill="#94a3b8" font-size="11.5" text-anchor="end">30 cm</text>
  <text x="300.0" y="246.0" fill="#94a3b8" font-size="12.5" text-anchor="start">둘레 = 2 × 3.14 × 300 ≈ 1885 mm</text>
  <text x="300.0" y="268.0" fill="#94a3b8" font-size="12.5" text-anchor="start">1° 에 1885 ÷ 360 ≈ 5.2 mm</text>
  <text x="300.0" y="290.0" fill="#34d399" font-size="13" text-anchor="start">→ 5 mm 는 첫째 관절 약 1°</text>
</svg>
