# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: teleop-input
  title: 입력 장치별 목표 각도 변환
  variants:
    - question: |
        로봇 팔과 똑같이 생긴 leader 팔을 사람이 손으로 움직이고, follower 로봇 팔이 그 움직임을 따라 한다. leader 의 관절
        각도를 follower 의 목표 각도로 바꿀 때 필요한 처리는?
      choices:
        - 'IK 로 end-effector 위치를 계산한 뒤 다시 관절 각도로 바꾼다'
        - 'leader 각도를 end-effector 이동량으로 바꿔 키보드 입력처럼 보낸다'
        - '관절마다 두 팔의 센서 기준 차이(offset)를 더하고, 필요하면 부호를 뒤집는다'
        - '아무 처리 없이 그대로 보내면 언제나 두 팔이 정확히 같은 자세가 된다'
      answer: 2
      explanation: |
        leader 팔은 관절 각도를 직접 내므로 follower 의 목표 각도로 거의 그대로 쓸 수 있다. 다만 두 팔의 센서가 0° 로 읽는
        자세가 조금 다를 수 있어서 관절마다 offset 을 한 번 재어 더하고, 반대 방향으로 달린 관절은 부호를 뒤집는다. 그래서
        "그대로 보내면 언제나 같다" 는 틀렸다. IK 나 end-effector 이동량은 관절 각도를 내지 않는 게임패드·키보드에 필요한
        단계라서 leader 팔에는 쓸 이유가 없다.
    - question: |
        게임패드나 키보드로 로봇 팔을 조종할 때 IK(inverse kinematics) 계산이 필요한 이유는?
      choices:
        - '장치가 "end-effector 를 어느 쪽으로 얼마나 옮길지" 를 내는데, 로봇 팔이 받는 명령은 관절 목표 각도이기 때문이다'
        - '키 입력이 너무 빨라서 IK 로 속도를 줄여야 하기 때문이다'
        - 'IK 가 카메라 사진에서 집을 물체의 위치를 찾아 주기 때문이다'
        - '게임패드 값은 radian 이라 degree 로 바꿔야 하기 때문이다'
      answer: 0
      explanation: |
        게임패드와 키보드는 관절 각도가 아니라 집게 끝(end-effector)의 이동량을 낸다. 로봇 팔은 관절마다 목표 각도를 받으므로
        "집게 끝을 이만큼 옮겨라" 를 "어느 관절을 몇 도 돌려라" 로 바꾸는 계산이 필요하고, 이것이 IK 다. IK 는 속도를 조절하거나
        사진에서 물체를 찾는 계산이 아니다. 각도 단위 변환은 곱하기 한 번이지 IK 가 아니다.
    - question: |
        컵을 대각선 방향으로 옮기는 시연을 키보드(화살표 키를 누르는 동안 일정한 거리씩 이동)로 모아 policy 를 학습했다.
        학습한 policy 의 움직임은 어떨까?
      choices:
        - '학습 중에 지그재그가 걸러져서 부드러운 직선으로 움직인다'
        - '입력 장치는 action 값에 영향을 주지 않으므로 leader 팔로 모은 시연과 같은 움직임이 나온다'
        - '키보드 시연에는 관절 각도가 없어서 학습에 쓸 수 없다'
        - '키를 번갈아 눌러 생긴 지그재그 길과 늘 같은 속도를 그대로 따라 한다'
      answer: 3
      explanation: |
        대각선으로 가려면 오른쪽 키와 위쪽 키를 번갈아 누르기 쉬워서 시연의 길이 지그재그가 되고, 속도도 늘 같다. policy 는
        시연의 action 을 정답으로 삼아 그대로 따라 배우므로 그 버릇까지 배운다. 학습이 지그재그를 알아서 걸러 주지는 않고,
        입력 장치가 다르면 시연 action 의 모양이 달라진다. 키보드 입력도 IK 를 거쳐 관절 목표 각도로 바뀌어 저장되므로 학습에
        쓸 수 있다.

- topic: frame-timestamp
  title: episode 와 frame 의 구성
  variants:
    - question: |
        시연 한 번(episode)을 기록하면 일정한 간격마다 frame 이 쌓인다. frame 하나에 함께 저장하는 값으로 옳은 묶음은?
      choices:
        - 'episode 의 마지막 사진과 성공 여부'
        - '그 순간의 카메라 사진, 관절 상태, 보낸 action, timestamp, task 문장'
        - '그 순간의 action 만 (사진과 관절 상태는 학습에 쓰지 않아서)'
        - 'episode 전체에서 평균 낸 관절 각도'
      answer: 1
      explanation: |
        frame 은 "그 순간" 의 값을 한 묶음으로 남긴 것이다. 로봇이 본 것(카메라 사진, 관절 상태)과 사람이 낸 명령(action),
        그 순간의 시각(timestamp), 이 episode 의 작업 문장(task)이 함께 들어간다. 사진과 관절 상태는 policy 의 입력인 관측이라
        빠지면 안 되고, 마지막 사진이나 평균값만 남기면 순간마다의 관측-action 짝이 사라져 학습할 수 없다.
    - question: |
        같은 책상에서 "빨간 컵을 상자에 넣어라" 와 "파란 컵을 상자에 넣어라" 두 작업의 시연을 한 dataset 에 섞어 모았다.
        frame 마다 task 문장을 함께 저장해야 하는 이유는?
      choices:
        - 'task 문장이 있어야 timestamp 를 계산할 수 있기 때문이다'
        - 'task 문장이 사진의 압축률을 높여 주기 때문이다'
        - 'task 문장은 사람이 읽는 메모일 뿐 policy 와는 관계가 없다'
        - '사진과 관절 상태가 같아도 집을 컵이 다르므로, 문장을 받아야 policy 가 두 작업을 구별할 수 있기 때문이다'
      answer: 3
      explanation: |
        두 컵이 모두 책상 위에 있으면 사진과 관절 상태만으로는 지금 어느 컵을 집어야 하는지 알 수 없다. task 문장을 함께
        받는 policy 라야 같은 장면에서 두 작업을 구별해 배우고, 사진과 글을 함께 받는 VLA 모델이 이 문장을 입력으로 쓴다.
        timestamp 는 frame 번호와 fps 로 정해지고, 압축은 영상 저장 방식의 일이라 task 문장과 관계가 없다.
    - question: |
        frame 에 저장하는 관절 상태(state)와 action 은 둘 다 관절 각도 목록이다. 두 값의 차이를 옳게 말한 것은?
      choices:
        - '상태는 팔이 지금 실제로 있는 각도이고 action 은 이제 가라고 보낸 목표 각도라서, 모터가 따라가는 동안 두 값은 대개 조금 다르다'
        - '두 값은 같은 숫자를 두 번 저장한 것이라 하나는 지워도 된다'
        - '상태는 사람이 낸 명령이고 action 은 센서가 잰 값이다'
        - 'action 은 episode 가 끝난 뒤 상태를 평균해 만든 값이다'
      answer: 0
      explanation: |
        상태는 로봇이 자기 몸을 잰 값, 곧 "지금 팔이 실제로 있는 곳" 이라서 관측에 들어간다. action 은 그 순간 follower 에게
        "이제 가라" 고 보낸 목표 각도다. 모터는 목표에 닿는 데 시간이 걸리므로 움직이는 동안 두 값은 다르고, 하나를 지우면
        입력이나 정답 하나가 사라진다. 둘의 역할을 바꿔 말한 보기는 거꾸로이고, action 은 기록 중 순간마다 보낸 값이지 나중에
        만든 평균이 아니다.

- topic: obs-action-order
  title: 관측과 action 의 짝
  variants:
    - question: |
        기록 프로그램의 실수로, frame 마다 action 을 먼저 보내고 그 결과로 바뀐 자세를 그 frame 의 관측으로 저장했다. 이
        데이터로 학습한 policy 는 어떻게 될까?
      choices:
        - 'loss 가 높게 나와서 학습 중에 바로 알아챌 수 있다'
        - '관측이 더 최신이라 policy 가 더 빠르고 정확하게 움직인다'
        - '관측과 action 의 순서는 학습 결과에 영향을 주지 않는다'
        - '"지금 각도를 그대로 내라" 를 배워 실행 때 팔이 거의 움직이지 않는데, 학습 loss 는 낮게 나온다'
      answer: 3
      explanation: |
        결과 자세를 관측으로 적으면 frame 마다 관측의 각도와 action 의 각도가 같아진다. policy 는 "보이는 각도를 그대로 내라"
        를 배우고, 실행하면 지금 자리를 목표로 보내니 팔이 제자리에 머문다. 기록 안에서는 이미 일어난 움직임을 보고 그
        움직임을 맞히면 되니 loss 가 낮게 나와서 학습만 봐서는 알아채기 어렵다. 그래서 순서는 결과에 큰 영향을 준다.
    - question: |
        학습 데이터에서 frame $k$ 의 관측 $o_k$ 는 action $a_k$ 를 보내기 **전에** 잰 값이어야 한다. 그 이유는?
      choices:
        - '사진을 action 보다 먼저 저장해야 파일 용량이 줄기 때문이다'
        - '실행 때 policy 는 지금 보이는 것만 받아 다음 명령을 정하므로, 학습 데이터도 "명령 전에 본 것 → 그때 보낸 명령" 이어야 같은 상황을 배운다'
        - 'action 을 먼저 보내면 모터가 고장 나기 때문이다'
        - '관측을 먼저 재야 timestamp 가 0 부터 시작하기 때문이다'
      answer: 1
      explanation: |
        policy 는 실행 중에 아직 일어나지 않은 결과를 볼 수 없고, 지금의 사진과 관절 상태만 받아 다음 명령을 정한다. 학습
        데이터의 짝이 이 상황과 같아야 배운 것을 실행 때 그대로 쓸 수 있다. 그러면 $a_k$ 는 그다음 순간들의 상태를 만드는
        원인이 된다. 파일 용량, 모터 고장, timestamp 의 시작값은 이 순서와 관계가 없다.
    - question: |
        실물 로봇 팔에서 시연 때보다 컵을 몇 cm 옆에 놓고, 저장된 action 을 frame 순서대로 그대로 다시 보내는 replay 를 했다.
        결과와 그 이유로 옳은 것은?
      choices:
        - 'replay 도 사진을 보므로 옮겨진 컵을 따라가 집는다'
        - '실물에서는 replay 가 언제나 기록과 정확히 겹치므로 컵을 집는다'
        - 'replay 는 관측을 보지 않고 적힌 action 만 보내서, 집게가 시연 때 컵이 있던 자리로 가 컵을 놓친다'
        - 'replay 는 첫 frame 의 action 만 되풀이해서 팔이 멈춰 있다'
      answer: 2
      explanation: |
        replay 는 policy 와 달리 관측을 보고 action 을 고르지 않고, 기록에 적힌 action 을 그대로 보낸다. 그래서 컵이 옮겨진 것을
        알 길이 없고 집게는 시연 때의 자리로 간다. 실물에서는 컵 위치, 모터 반응, 접촉이 조금씩 달라서 replay 가 기록과 정확히
        겹치지도 않는다. 이 때문에 시연을 그대로 다시 보내는 대신, 지금 보이는 것을 보고 그때그때 action 을 정하는 policy 를
        학습한다.

- topic: clock-sync
  title: 주기가 다른 기록의 시간 맞추기
  variants:
    - question: |
        카메라는 1초에 30 번, 관절 센서는 1초에 100 번 값을 낸다. 두 기록을 frame 하나로 묶는 방법으로 알맞은 것은?
      choices:
        - 'frame 은 느린 카메라에 맞추고, 사진이 찍힌 시각에 가장 가까운 관절 값을 골라 짝짓는다'
        - '관절 값마다 사진을 복사해 붙여 1초에 100 개의 frame 을 만든다'
        - '두 센서가 값을 낸 순서대로 번호를 붙이고 같은 번호끼리 짝짓는다'
        - '관절 값을 1초 동안 평균해 그 1초의 사진 모두에 같은 값을 넣는다'
      answer: 0
      explanation: |
        frame 의 빠르기는 가장 느린 센서인 카메라에 맞추고, 사진마다 그 시각에 가장 가까운 관절 값을 고른다. 그러면 짝의
        시각 차이가 관절 값 간격의 절반을 넘지 않는다. 사진을 복사하면 같은 사진이 다른 관절 값과 짝지어지고, 번호끼리
        짝지으면 두 센서의 주기가 달라 시간이 갈수록 다른 순간의 값끼리 묶인다. 1초 평균은 움직이는 팔의 순간 각도를 지워 버린다.
    - question: |
        기록 loop 는 frame 마다 "관측 읽기 → action 만들기 → 보내기 → 저장 → 다음 frame 시각까지 기다리기" 를 한다. 어느
        frame 에서 저장이 밀려 loop 한 번이 목표 주기보다 오래 걸렸다면?
      choices:
        - '그 frame 하나만 timestamp 가 틀리고 다음 frame 부터는 저절로 맞는다'
        - 'fps 가 자동으로 높아져 밀린 시간을 되찾는다'
        - '그 뒤 frame 들의 실제 시각이 "frame 번호 ÷ fps" 로 적은 timestamp 보다 밀린 채 남으므로, 기록 뒤 실제 loop 주기를 확인해야 한다'
        - '관측과 action 을 같은 loop 에서 읽으므로 시간이 밀려도 아무 문제가 없다'
      answer: 2
      explanation: |
        timestamp 를 frame 번호와 fps 로 적으면, 한 번 밀린 시간은 그 뒤 모든 frame 에 그대로 남는다. 다음 frame 이 저절로
        제자리를 찾거나 fps 가 알아서 바뀌지는 않는다. 그래서 기록을 마친 뒤 loop 의 실제 주기를 재어 목표에서 크게 벗어나지
        않았는지 확인한다. 같은 loop 에서 읽는 것은 관측과 action 을 한 시계로 묶어 주지만, 적힌 시각과 실제 시각의 차이를
        없애 주지는 않는다.
    - question: |
        simulation 에서 시연을 모은다. physics engine 은 정해진 timestep 마다 한 step 씩 계산하는데, frame 간격이 timestep 의
        정수배가 아니어서 frame 마다 step 수를 내림한 만큼만 계산했다. 어떤 문제가 생길까?
      choices:
        - 'simulation 은 실제 시간과 무관하므로 문제가 없다'
        - 'sim 이 실제로 진행한 시간이 적힌 timestamp 보다 짧아져서, 이 기록을 실물에서 따라 하면 시연보다 느리게 움직이고 중력·관성이 작용하는 시간도 달라진다'
        - 'sim 이 적힌 시간보다 더 많이 진행해서 실물에서 따라 하면 시연보다 빠르게 움직인다'
        - 'physics engine 이 timestep 을 frame 간격에 맞춰 자동으로 바꿔 준다'
      answer: 1
      explanation: |
        step 수를 내림하면 frame 마다 sim 이 진행한 시간이 frame 간격보다 조금 모자라고, 이것이 쌓여 기록된 길이보다 짧은
        움직임이 된다. 실물 팔은 frame 간격대로 따라 하므로 같은 움직임에 더 오래 걸려 느리게 움직이고, 중력과 관성이 작용하는
        시간도 시연과 달라진다. 더 빨라지는 것은 방향이 반대이고, timestep 은 자동으로 바뀌지 않는다. 그래서 frame 하나가 정수
        개의 step 이 되도록 fps 와 timestep 을 고른다.

- topic: sync-error
  title: 시각 어긋남이 만드는 오차
  variants:
    - question: |
        카메라 사진은 찍힌 뒤 컴퓨터에 도착하기까지 시간(latency)이 걸린다. 도착한 시각을 찍힌 시각으로 적었고 팔은 움직이는
        중이었다. 어떤 일이 생길까?
      choices:
        - '사진이 실제보다 미래의 자세로 기록된다'
        - 'latency 는 사진 화질만 떨어뜨리고 자세와는 관계가 없다'
        - '사진 속 팔은 같은 frame 의 관절 상태보다 latency 만큼 이전 자세라서, policy 가 사진과 각도가 어긋난 짝을 배운다'
        - '관절 상태가 사진에 맞춰 자동으로 늦춰져 짝이 맞는다'
      answer: 2
      explanation: |
        사진은 실제로는 더 일찍 찍혔는데 늦은 시각으로 적혔으므로, 그 frame 의 관절 상태보다 이전 순간의 팔이 담긴다. policy 는
        "사진에서 팔이 이만큼 와 있을 때 이 명령을 낸다" 를 배우는데, 짝이 어긋나 있으면 실행 때 물체를 빗나가 집기 쉽다.
        사진은 과거의 것이지 미래의 것이 아니고, latency 는 화질이 아니라 시각의 문제다. 관절 상태가 알아서 늦춰지는 장치는 없다.
    - question: |
        사진과 관절 값의 시각이 같은 시간만큼 어긋나 있다. 이 어긋남으로 생기는 관절 각도의 오차가 가장 커지는 경우는?
      choices:
        - '팔이 멈춰 있을 때'
        - '카메라 해상도가 높을 때'
        - '시연의 수가 많을 때'
        - '그 관절이 빠르게 돌고 있을 때'
      answer: 3
      explanation: |
        각도 오차는 대략 "관절이 도는 빠르기 × 어긋난 시간" 이다. 같은 시간이 어긋나도 빨리 도는 관절일수록 그사이 각도가 많이
        바뀌어 오차가 커진다. 팔이 멈춰 있으면 어긋난 두 순간의 각도가 같아 오차가 없다. 해상도나 시연 수는 시각 어긋남이 만드는
        각도 차이와 관계가 없다.
    - question: |
        관절 값은 10 ms 마다 나오고, 사진마다 그 시각에 가장 가까운 관절 값을 고른다. 이렇게 짝지은 시각 차이에 대한 설명으로
        옳은 것은?
      choices:
        - '아무리 커도 관절 값 간격의 절반이라 각도 오차가 작고, 큰 어긋남은 사진 시각 자체를 잘못 적을 때 생긴다'
        - '가장 가까운 값을 고르므로 시각 차이는 언제나 정확히 0 이다'
        - '사진 한 장의 간격만큼 언제나 어긋난다'
        - '시간이 지날수록 차이가 쌓여 점점 커진다'
      answer: 0
      explanation: |
        가장 가까운 관절 값을 고르면 차이는 간격 10 ms 의 절반인 5 ms 를 넘지 않고, 이 정도는 빨리 도는 관절에서도 각도
        오차가 작다. 사진과 관절 값이 나오는 시각이 서로 맞아떨어지지 않으면 차이가 0 이 아닐 수 있다. 사진마다 새로 가장
        가까운 값을 고르므로 차이가 쌓이지도 않는다. 문제가 되는 큰 어긋남은 latency 처럼 사진의 시각을 잘못 적을 때 생긴다.

- topic: demo-quality
  title: 머뭇거림·실패·방식 차이의 영향
  variants:
    - question: |
        시연 10 개 가운데 3 개에서 사람이 컵 위에서 한참 멈췄다가 집게를 내렸다. 이 머뭇거림이 MSE 로 학습한 policy 에 주는
        영향으로 옳은 것은?
      choices:
        - '시연 수로 30% 이므로 영향도 30% 정도다'
        - 'policy 는 frame 하나하나를 정답으로 쓰므로 오래 멈춘 시연이 frame 을 많이 차지해, 그 장면의 평균 action 이 "멈춤" 쪽으로 끌리고 실행 때 컵 위에서 오래 머문다'
        - '멈춘 frame 은 action 이 0 이라 loss 계산에서 저절로 빠진다'
        - '멈춘 동안에는 frame 이 기록되지 않아 영향이 없다'
      answer: 1
      explanation: |
        멈춘 동안에도 기록은 fps 대로 frame 을 쌓고, 그 frame 들의 정답은 "그대로 있어라" 다. MSE 를 가장 작게 만드는 출력은
        같은 장면의 action 들을 frame 수로 무게를 매긴 평균이라서, 오래 멈춘 시연이 시연 수보다 훨씬 큰 몫을 차지한다. 거의
        움직이지 않으면 다음 관측도 거의 같아 또 멈추라는 action 이 나오니 집게가 한참 머문다. action 이 0 인 frame 도 loss 에
        그대로 들어간다.
    - question: |
        컵을 놓친 실패 시연 몇 개를 지우지 않고 성공 시연과 함께 학습에 썼다. 이에 대한 설명으로 옳은 것은?
      choices:
        - 'policy 는 같은 장면 action 들의 평균을 배우므로 집게를 닫는 높이 같은 값이 실패 쪽으로 끌려간다. 그래서 실패 episode 는 지우고 다시 찍는다'
        - 'neural network 가 실패를 스스로 알아보고 무시한다'
        - '실패 시연은 "하지 말아야 할 것" 을 알려 주므로 많을수록 좋다'
        - '성공 시연이 더 많기만 하면 실패 시연은 평균에 전혀 영향을 주지 않는다'
      answer: 0
      explanation: |
        behavior cloning 은 시연 action 을 모두 정답으로 쓰므로 실수도 정답으로 배운다. 평균에 실패 쪽 값이 섞이면 성공 시연이
        다수여도 결과가 그쪽으로 조금 끌려가고, 잡기 좋은 범위가 좁으면 그 차이로 성공과 실패가 갈린다. 모델에는 실패를 따로
        알아보는 장치가 없고, 정답으로 들어간 실패는 "하지 말 것" 이 아니라 "할 것" 으로 배워진다. 다만 놓쳤다가 다시 잡아 끝내
        성공한 시연은 다시 잡는 법을 보여 주므로 남기기도 한다.
    - question: |
        성공한 시연 가운데 절반은 컵을 위에서 내려와 집고, 절반은 옆에서 다가가 집었다. 같은 장면에서 두 방식이 섞인 데이터로
        MSE 를 써서 학습한 policy 는?
      choices:
        - '둘 중 더 쉬운 방식을 스스로 골라 따라 한다'
        - '시연을 더 많이 모으면 평균이 한쪽 방식으로 옮겨 간다'
        - '실행할 때마다 두 방식 가운데 하나를 무작위로 고른다'
        - '두 방식 사이의 비스듬한 손목 각도로 다가가 어느 쪽으로도 제대로 잡지 못한다'
      answer: 3
      explanation: |
        같은 관측에 정답이 여럿인 multimodal 상황에서 MSE 로 학습하면 policy 는 그 action 들의 평균을 낸다. 위에서와 옆에서의
        평균은 두 방식 어디에도 없는 비스듬한 자세라서 잡기에 실패한다. MSE policy 는 방식을 고르거나 무작위로 뽑지 않고, 같은
        비율로 시연을 늘리면 평균도 그대로다. 그래서 처음에는 한 사람이 한 방식으로 일관되게 시연하는 편이 쉽다.

- topic: coverage-and-count
  title: 물체 위치의 다양성과 시연 수
  variants:
    - question: |
        시연을 모두 책상 한가운데 같은 자리에 컵을 놓고 모아 policy 를 학습했다. 실행 때 컵을 책상의 다른 자리에 놓으면?
      choices:
        - 'neural network 는 시연 바깥으로도 잘 늘려 가므로 잘 집는다'
        - '같은 자리의 시연이 많을수록 다른 자리도 더 잘 집는다'
        - '컵 위치는 사진에 담기지 않으므로 결과가 같다'
        - '처음 보는 자리의 사진이라서 policy 가 무엇을 낼지 보장되지 않는다'
      answer: 3
      explanation: |
        neural network 는 시연 사이를 메우는 것은 잘하지만 시연 바깥으로 늘려 가는 것은 보장하지 못한다. 한 자리에서만 모은
        시연은 그 자리의 사진만 담고 있어서, 다른 자리의 사진은 policy 가 한 번도 본 적 없는 입력이다. 같은 자리 시연을 더 모아도
        덮는 영역은 점 하나 그대로다. 컵 위치는 사진에 그대로 찍히므로 policy 의 입력을 바꾼다.
    - question: |
        물체 위치에 더해 컵 색과 조명까지 한꺼번에 바꿔 가며 시연을 모으려 한다. 이에 대한 설명으로 옳은 것은?
      choices:
        - '바꾸는 항목이 많을수록 같은 시연 수로도 더 잘 배운다'
        - '바꾸는 항목의 수는 필요한 시연 수와 관계가 없다'
        - '조합의 수가 곱으로 늘어 조합마다 시연이 모자라기 쉬우므로, 위치만 바꿔 시작하고 잘 되면 항목을 하나씩 늘린다'
        - '조명은 policy 의 입력과 관계가 없으므로 신경 쓸 필요가 없다'
      answer: 2
      explanation: |
        위치, 색, 조명을 모두 바꾸면 조합의 수는 각 항목 가짓수의 곱이 된다. 같은 시연 수를 그 많은 조합에 나누면 조합마다
        시연이 모자라 어느 조합도 잘 배우지 못한다. 그래서 위치만 바꿔 시작하고 policy 가 잘 집는 것을 확인한 뒤 항목을
        늘린다. 조명은 사진의 밝기와 색을 바꾸므로 policy 의 입력에 직접 영향을 준다.
    - question: |
        학습한 policy 를 컵 자리별로 여러 번 실행해 보니 대부분 잘 집는데 한 자리만 성공률이 유난히 낮았다. 다음에 할 일로
        가장 알맞은 것은?
      choices:
        - '전체 성공률만 보면 충분하므로 자리별 결과는 무시한다'
        - '성공률이 낮은 그 자리에 시연을 더 모아 다시 학습한다'
        - '시연은 많을수록 좋으니 머뭇거리거나 방식이 다른 시연이라도 모든 자리에 아주 많이 더 모은다'
        - '그 자리는 처음부터 불가능한 자리이므로 시연을 모두 지운다'
      answer: 1
      explanation: |
        자리별로 나눠 보면 어디가 약한지 드러나고, 그 자리에 시연을 더 모으는 편이 모든 자리에 고르게 더하는 것보다 효율적이다.
        전체 성공률 하나만 보면 이 약점이 가려진다. 시연 수를 늘려도 머뭇거림이나 방식 차이가 같은 비율로 섞여 있으면 평균이
        나아지지 않아서, 일관된 시연 몇십 개가 들쭉날쭉한 시연 수백 개보다 나을 수 있다. 팔에서 먼 자리처럼 어려운 자리는
        시연이 더 필요할 뿐 지울 이유가 없다.

- topic: dataset-format
  title: LeRobot dataset 의 표·영상·meta
  variants:
    - question: |
        LeRobotDataset 은 관절 상태와 action 은 표(Parquet)에 담고, 카메라 사진은 MP4 영상으로 따로 저장한다. 사진을 영상으로
        저장하는 이유는?
      choices:
        - '사진은 그대로 두면 용량이 막대한데, 이웃 frame 의 사진이 거의 같아서 영상으로 압축하면 크게 줄기 때문이다. 학습 때는 timestamp 로 그 시각의 사진을 꺼낸다'
        - 'Parquet 표는 숫자를 저장할 수 없기 때문이다'
        - '영상으로 저장하면 timestamp 가 필요 없기 때문이다'
        - '사진은 학습에 쓰지 않고 사람이 확인하는 용도라서다'
      answer: 0
      explanation: |
        사진 한 장은 pixel 마다 색 숫자 세 개라서 숫자가 수십만 개이고, 그대로 쌓으면 dataset 이 매우 커진다. 영상은 몇 장마다
        한 번만 사진 전체를 적고 그 사이에는 바뀐 부분만 적어 용량을 크게 줄인다. 표는 숫자를 잘 저장하지만 사진을 넣기에는
        너무 크다. 학습 때는 표의 timestamp 로 영상에서 사진을 찾으므로 timestamp 는 오히려 꼭 필요하고, 사진은 policy 의
        관측으로 쓰인다.
    - question: |
        meta 폴더의 stats(값마다의 최솟값·최댓값·평균 등)를 학습 전에 쓰는 이유는?
      choices:
        - '실패한 episode 를 골라 지우기 위해서'
        - '범위가 크게 다른 값들(넓게 도는 관절과 좁게 움직이는 집게 등)을 같은 범위로 옮기는 normalization 에 써서, 큰 값 쪽의 gradient 가 지나치게 커지는 것을 막기 위해서'
        - '영상의 압축률을 정하기 위해서'
        - 'frame 의 fps 를 계산하기 위해서'
      answer: 1
      explanation: |
        값의 범위가 다른 입력을 그대로 넣으면 숫자가 큰 쪽의 gradient 가 커져서, 같은 learning rate 로도 학습이 튀기 쉽다.
        그래서 stats 의 최솟값·최댓값(또는 평균과 흩어진 정도)으로 모든 값을 비슷한 범위로 옮기는데, 이것이 normalization 이다.
        stats 는 성공·실패를 알려 주지 않고, 압축률이나 fps 와도 관계가 없다. fps 는 info 에 따로 적힌다.
    - question: |
        simulation 에서 모은 시연을 실물 로봇의 dataset 과 섞어 학습하려 한다. sim 은 관절 각도를 radian 으로 계산하고 실물
        기록은 degree 로 적혀 있다. 저장할 때 해야 할 일로 옳은 것은?
      choices:
        - '단위는 meta 에 따로 적혀 있으니 숫자는 그대로 섞어도 된다'
        - '카메라 이름만 맞추면 나머지는 학습 도구가 알아서 맞춘다'
        - '값의 이름·개수·단위를 실물 dataset 과 같게 맞춰 저장한다. 단위를 빼먹으면 sim 의 각도가 실물 데이터 속에서 전혀 다른 각도로 읽힌다'
        - 'sim 데이터와 실물 데이터는 원래 함께 학습할 수 없다'
      answer: 2
      explanation: |
        같은 이름, 같은 개수, 같은 단위로 저장해야 실물 데이터와 같은 학습 도구로 함께 읽힌다. radian 값을 degree 로 바꾸지
        않고 저장하면 수십 도짜리 자세가 1° 도 안 되는 숫자로 적혀, 섞었을 때 policy 는 전혀 다른 자세를 같은 숫자로 배운다.
        학습 도구는 숫자 하나하나의 단위를 알아서 고쳐 주지 않고, 카메라 이름만 맞춘다고 해결되지 않는다. 형식만 맞추면 sim
        데이터도 실물 데이터와 섞어 쓸 수 있다.
