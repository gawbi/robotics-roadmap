# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: teleop-mapping
  title: joint-space 와 task-space 입력 장치
  variants:
    - question: |
        면접관: "leader-follower 팔과 VR 조종기는 사람의 움직임을 로봇 명령으로 바꾸는 방식이 어떻게 다른가요?"
      choices:
        - '둘 다 손의 위치를 재서 IK 로 관절 각도를 구하고, 차이는 장치의 가격뿐이다'
        - 'leader 팔은 손끝 목표를 내고, VR 조종기는 관절 각도를 직접 낸다'
        - 'leader 팔은 관절 각도를 그대로 옮기고, VR 조종기는 손의 위치·자세를 손끝 목표로 삼아 IK 로 관절 각도를 구한다'
        - 'VR 조종기는 관절 각도를 offset 만 더해 옮기므로 IK 가 필요 없다'
      answer: 2
      explanation: |
        leader 팔은 로봇과 같은 모양이라 관절 각도를 calibration 만 거쳐 그대로 보내는 joint-space mapping 이고, VR 조종기는 손의 자세를 손끝(end-effector)
        목표로 쓰는 task-space mapping 이라 IK 를 거친다. 둘 다 IK 를 쓴다는 첫 보기는 leader 팔의 방식을 잘못 말했다. 둘째 보기는 두 장치의 역할을
        거꾸로 적었다. offset 만 더하는 것은 leader 팔의 방식이고, VR 조종기는 관절 각도를 알지 못한다.
    - question: |
        면접관: "관절 6 개짜리 팔로 정밀한 작업의 시연을 모을 때 VR 조종기 대신 leader 팔을 쓰는 이유로 알맞은 것은 무엇인가요?"
      choices:
        - '정밀한 작업은 특이 자세 근처에서 할 때가 많은데 그 근처에서 IK 가 자주 실패하고, leader 팔은 IK 없이 관절 각도를 그대로 옮기기 때문이다'
        - 'leader 팔은 카메라 없이도 시연을 기록할 수 있기 때문이다'
        - 'VR 조종기는 1초에 한 번만 값을 내기 때문이다'
        - 'leader 팔을 쓰면 calibration 이 필요 없기 때문이다'
      answer: 0
      explanation: |
        관절 수에 여유가 없는 팔은 특이 자세(singularity) 근처에서 IK 의 해가 불안정해 자주 실패하는데, leader 팔은 관절 각도를 직접 옮겨 이 계산을
        피한다. 시연에는 어느 장치를 쓰든 카메라 사진을 기록한다. VR 조종기도 손의 자세를 빠르게 연속으로 낸다. leader 팔도 같은 자세에서 두 팔이 같은
        값을 읽도록 calibration 을 해야 한다.
    - question: |
        면접관: "키보드로 로봇 팔을 조종해 모은 시연으로 policy 를 학습하면, 실행할 때 움직임에 어떤 특징이 남기 쉬운가요?"
      choices:
        - '키보드는 정밀하므로 사람 팔처럼 부드럽게 빨라졌다 느려지는 움직임이 나온다'
        - 'policy 는 시연의 모양을 배우지 않으므로 입력 장치와 관계없이 같은 움직임이 나온다'
        - '키보드 시연은 저장할 수 없어서 policy 가 학습되지 않는다'
        - '키 하나가 한 축의 정해진 이동이라 축에 나란하게 꺾이는 길과 일정한 속도가 시연에 남고, policy 도 그 움직임을 따라 한다'
      answer: 3
      explanation: |
        키보드는 키마다 한 축으로 정해진 거리만큼 옮기므로 시연이 축에 나란한 움직임을 이어 붙인 모양이 되고, behavior cloning 은 시연을 그대로 따라 배워
        그 버릇까지 재현한다. 부드럽게 빨라졌다 느려지는 움직임은 leader 팔처럼 손 움직임을 그대로 옮기는 장치의 특징이다. policy 는 시연의 action 을
        정답으로 배우므로 입력 장치의 버릇이 남는다. 키보드로 만든 action 도 다른 장치와 똑같이 관절 목표로 저장된다.

- topic: leader-action
  title: leader 각도를 action 으로 적는 이유와 calibration
  variants:
    - question: |
        면접관: "leader-follower 로 시연을 모을 때 action 에 follower 의 관절 각도가 아니라 leader 의 관절 각도를 적는 이유는 무엇인가요?"
      choices:
        - 'follower 의 각도는 센서가 없어서 읽을 수 없기 때문이다'
        - '물체를 쥐면 follower 는 막혀 덜 닫히고 leader 는 더 닫혀 있는데, 모터는 목표와 지금 각도의 차이로 힘을 내므로 leader 각도를 목표로 적어야 쥐는 힘까지 재현된다'
        - 'leader 의 각도가 항상 follower 보다 정확하기 때문이다'
        - 'follower 의 각도를 적으면 dataset 크기가 두 배가 되기 때문이다'
      answer: 1
      explanation: |
        position 제어 모터는 목표와 지금 각도의 차이에 비례한 힘을 내므로, 막힌 follower 의 각도를 목표로 적으면 차이가 0 이 되어 쥐는 힘이 사라진다.
        follower 의 각도는 state 로 따로 기록되므로 읽을 수 없다는 보기는 틀렸다. 두 팔의 센서 정확도는 이유가 아니다. 무엇을 적든 action 칸의 숫자
        개수는 같아서 dataset 크기와는 관계없다.
    - question: |
        면접관: "leader 팔과 follower 팔을 쓰기 전에 calibration 을 하는 목적은 무엇인가요?"
      choices:
        - '모터의 최대 속도를 높이기 위해서다'
        - '카메라의 초점을 맞추기 위해서다'
        - 'policy 의 learning rate 를 정하기 위해서다'
        - '두 팔의 관절마다 기준점·방향·범위를 재서, 같은 자세에서 두 팔이 같은 값을 읽게 하기 위해서다'
      answer: 3
      explanation: |
        두 팔의 센서는 0 으로 읽는 자세나 도는 방향이 다를 수 있어서, 관절마다 기준점(offset), 방향(부호), 움직이는 범위를 재 두어야 leader 의 값을
        follower 의 목표로 바로 쓸 수 있다. calibration 은 모터 속도를 바꾸지 않는다. 카메라 초점은 관절 calibration 과 관계없다. learning rate 는
        학습 설정이라 팔의 calibration 과 상관없다.
    - question: |
        면접관: "leader 팔의 어깨 센서가 follower 와 반대 방향으로 달려 있는데 calibration 에서 방향을 맞추지 않았습니다. 사람이 leader 어깨를 들면 어떻게 되나요?"
      choices:
        - 'follower 의 어깨가 반대 방향으로 내려간다'
        - '방향은 모터가 알아서 맞추므로 follower 도 똑같이 든다'
        - 'follower 는 움직이지 않고 멈춰 있다'
        - 'follower 가 두 배 빠르게 든다'
      answer: 0
      explanation: |
        leader 가 값을 늘리는 방향이 follower 에서는 값을 줄이는 방향이라, 부호를 뒤집지 않으면 같은 명령이 반대쪽 움직임이 된다. 모터는 받은 목표를
        따라갈 뿐 설치 방향을 스스로 고치지 않는다. 목표 값은 계속 바뀌므로 follower 가 멈춰 있지는 않다. 방향이 반대라고 속도가 바뀌지는 않는다.

- topic: obs-action-order
  title: 관측과 action 의 기록 순서
  variants:
    - question: |
        면접관: "teleop 기록 loop 에서 frame 하나의 관측은 왜 그 frame 의 action 을 보내기 전에 읽어야 하나요?"
      choices:
        - '관측을 나중에 읽으면 카메라가 꺼지기 때문이다'
        - '관측을 먼저 읽어야 파일 크기가 작아지기 때문이다'
        - 'action 을 먼저 보내면 follower 가 움직이지 않기 때문이다'
        - '실행 때 policy 는 지금 보이는 것만 보고 다음 명령을 정하므로, 학습 데이터도 명령 전에 본 것과 그때 보낸 명령의 짝이어야 하기 때문이다'
      answer: 3
      explanation: |
        policy 는 실행할 때 명령을 내기 전의 사진과 관절 값만 받으므로, 학습 데이터의 짝도 같은 순서여야 실행 조건과 맞는다. 읽는 순서는 카메라의 동작과
        관계없다. 파일 크기는 무엇을 저장하느냐로 정해지고 순서로 바뀌지 않는다. action 을 먼저 보내도 follower 는 움직이며, 문제는 그 결과가 관측으로
        잘못 저장되는 것이다.
    - question: |
        면접관: "기록 프로그램의 실수로 action 을 보낸 뒤 그 결과로 바뀐 자세를 같은 frame 의 관측으로 저장했습니다. 이 데이터로 학습한 policy 는 어떻게 되나요?"
      choices:
        - '데이터가 더 정확해져 policy 가 더 빨리 움직인다'
        - '관측과 action 이 거의 같아져 policy 가 지금 자세를 그대로 내는 법을 배우고, loss 는 낮지만 실행하면 팔이 거의 움직이지 않는다'
        - 'loss 가 매우 커져 학습이 전혀 되지 않는다'
        - '관측과 action 의 순서는 학습 결과에 영향을 주지 않는다'
      answer: 1
      explanation: |
        결과를 관측으로 적으면 관측 속 자세와 action 이 같은 값이 되어, 정답이 지금 자세를 그대로 내는 것으로 바뀐다. 기록 안에서는 맞히기 쉬워 loss 가 낮게
        나오지만 실행하면 팔이 처음 자세에 머문다. 정확해지는 것이 아니라 정답의 뜻이 바뀐 것이다. loss 는 오히려 낮게 나온다. 순서가 짝의 뜻을 정하므로
        결과에 영향을 준다.
    - question: |
        면접관: "frame 에 저장한 관절 state 와 action 은 둘 다 관절 값 목록입니다. 둘의 차이를 바르게 말한 것은 무엇인가요?"
      choices:
        - 'state 와 action 은 같은 값을 두 번 저장한 것이다'
        - 'state 는 사람이 낸 명령이고 action 은 센서가 잰 값이다'
        - 'state 는 그 순간 팔이 실제로 있는 곳을 잰 값이고, action 은 그 순간 가라고 보낸 목표라서, 모터가 따라가는 데 걸리는 시간만큼 둘이 다르다'
        - 'state 는 학습에 쓰지 않고 action 만 쓴다'
      answer: 2
      explanation: |
        state 는 follower 의 센서가 잰 지금 자세로 관측에 들어가고, action 은 보낸 목표로 정답이 된다. 모터는 목표에 늦게 닿으므로 같은 frame 의 둘은 보통
        다르다. 같은 값을 두 번 저장한 것이라는 보기는 이 차이를 놓쳤다. 둘째 보기는 두 값의 출처를 거꾸로 말했다. state 는 사진과 함께 policy 의 입력이
        된다.

- topic: recording-timing
  title: timestamp 와 기록 주기
  variants:
    - question: |
        면접관: "LeRobot 처럼 frame 번호를 fps 로 나눠 timestamp 를 적는 기록에서, loop 한 번이 목표 주기보다 오래 걸리면 어떤 문제가 생기나요?"
      choices:
        - '적힌 timestamp 는 일정한 간격인데 실제 시각은 밀려서, 그 뒤 frame 들이 기록 속 시각보다 늦은 순간의 값이 된다'
        - 'timestamp 가 자동으로 실제 시각에 맞춰 고쳐지므로 문제가 없다'
        - '그 frame 만 저장되지 않고 나머지는 영향이 없다'
        - 'loop 가 늦으면 fps 가 자동으로 올라간다'
      answer: 0
      explanation: |
        timestamp 를 k ÷ fps 로 적으면 loop 가 늦어진 만큼 실제 시각이 적힌 시각보다 뒤로 밀리고, 그 차이는 뒤의 frame 에도 그대로 남는다. 그래서 기록 뒤에
        실제 주기를 확인한다. 이 방식은 시계를 읽지 않으므로 timestamp 가 저절로 고쳐지지 않는다. 늦은 frame 도 저장되며, 밀린 시각은 그 뒤로 이어진다.
        loop 가 늦으면 실제 주기는 오히려 낮아진다.
    - question: |
        30 fps 로 기록한 episode 에서 frame 번호가 45 인 frame 의 timestamp 는?
      choices:
        - '0.45 초'
        - '45 초'
        - '1.5 초'
        - '0.67 초'
      answer: 2
      explanation: |
        timestamp 는 frame 번호 ÷ fps 라서 45 ÷ 30 = 1.5 초다. 0.45 초는 frame 번호를 100 으로 나눈 값이다. 45 초는 frame 번호를 그대로 초로 읽은 값이다.
        0.67 초는 30 ÷ 45 처럼 나누는 순서를 바꾼 값이다.
    - question: |
        면접관: "SO-101 시연 dataset 에서 action 과 관절 state 를 비교하면, 같은 frame 보다 몇 frame 뒤의 state 와 더 잘 맞습니다. 이것은 무엇을 뜻하나요?"
      choices:
        - '기록 프로그램이 frame 을 빠뜨렸다는 뜻이다'
        - '모터가 목표를 받고 그 자리에 닿기까지 시간이 걸려 state 가 action 을 늦게 따라간다는 뜻으로, 정상적인 현상이다'
        - 'leader 와 follower 의 calibration 이 틀렸다는 뜻이다'
        - 'state 와 action 의 열 이름이 바뀌어 저장됐다는 뜻이다'
      answer: 1
      explanation: |
        관측은 action 을 보내기 전에 읽고 모터는 목표를 늦게 따라가므로, action 의 결과는 몇 frame 뒤의 state 에 나타난다. frame 이 빠졌다면 모든 episode
        에서 일정한 지연으로 나타나지 않는다. calibration 이 틀리면 시간 차이가 아니라 값 자체가 어긋난다. 이름이 바뀌었다면 state 가 action 을 앞서는
        모양이 된다.

- topic: sensor-sync
  title: 주기가 다른 센서의 시각 맞추기
  variants:
    - question: |
        면접관: "카메라는 30 Hz, 관절 센서는 100 Hz 로 값을 냅니다. 두 기록을 frame 하나로 묶는 방법으로 알맞은 것은 무엇인가요?"
      choices:
        - '두 센서의 값을 번호 순서대로 하나씩 짝짓는다'
        - '관절 값 100 개를 모두 사진 하나에 붙인다'
        - '사진마다 찍힌 시각에서 가장 가까운 관절 값을 골라 짝짓는다'
        - '관절 센서를 30 Hz 로 바꿀 수 없으면 기록할 수 없다'
      answer: 2
      explanation: |
        주기가 다르면 같은 순간의 값끼리 짝지어야 하므로, 사진의 시각에 가장 가까운 관절 값을 고른다. 이때 시각 차이는 관절 주기의 절반을 넘지 않는다. 번호
        순서대로 짝지으면 시간이 지날수록 사진과 관절 값의 시각이 점점 벌어진다. frame 하나에는 그 순간의 관절 값 하나면 되고 나머지는 버린다. 주기가 달라도
        시각으로 짝지으면 기록할 수 있다.
    - question: |
        면접관: "사진과 관절 값의 시각이 같은 시간만큼 어긋나 있을 때, 그 어긋남이 만드는 관절 각도의 오차가 가장 커지는 경우는 언제인가요?"
      choices:
        - '팔이 멈춰 있을 때'
        - '카메라 해상도가 높을 때'
        - '조명이 밝을 때'
        - '팔이 빠르게 움직일 때'
      answer: 3
      explanation: |
        각도 오차는 (관절이 도는 속도) × (시각 어긋남)이라서, 같은 어긋남이라도 빠르게 움직일 때 오차가 크다. 팔이 멈춰 있으면 어긋나도 각도가 같아 오차가
        0 이다. 해상도는 사진의 선명도일 뿐 시각 차이로 생기는 오차를 바꾸지 않는다. 조명도 시각 어긋남과 관계없다.
    - question: |
        면접관: "카메라 사진은 찍힌 뒤 컴퓨터에 도착하기까지 지연(latency)이 있습니다. 도착한 시각을 찍힌 시각으로 기록하면 학습 데이터에 어떤 문제가 생기나요?"
      choices:
        - '사진은 실제보다 이른 순간의 팔을 담고 관절 값은 늦은 순간의 것이라, 팔이 움직이는 동안 사진과 관절 값이 서로 다른 자세를 가리키는 짝이 된다'
        - '사진이 흐려진다'
        - '지연은 모든 frame 에 같으므로 학습에 아무 영향이 없다'
        - '관절 값이 사라진다'
      answer: 0
      explanation: |
        도착 시각으로 적은 사진은 그보다 이른 순간을 찍은 것이라, 같은 frame 의 관절 값과 다른 순간을 담는다. policy 는 사진과 관절 값이 어긋난 짝으로 배워 실행 때
        위치를 빗나가기 쉽다. 지연은 사진의 선명도와 관계없다. 지연이 일정해도 사진과 관절 값 사이의 어긋남은 남는다. 관절 값은 그대로 기록된다.

- topic: dataset-format
  title: LeRobotDataset 의 표·영상·meta
  variants:
    - question: |
        면접관: "LeRobotDataset 은 관절 값과 action 은 Parquet 표에, 카메라 사진은 MP4 영상에 따로 저장합니다. 이렇게 나누는 이유는 무엇인가요?"
      choices:
        - 'Parquet 는 숫자를 저장할 수 없기 때문이다'
        - '관절 값은 작아서 열 단위 표로 빠르게 읽고, 사진은 이웃 frame 이 거의 같아 영상으로 압축하면 크기가 수백 분의 1 로 줄기 때문이다'
        - '영상 파일은 사진을 압축하지 않고 그대로 저장하기 때문이다'
        - '사진과 관절 값은 학습에 함께 쓰지 않기 때문이다'
      answer: 1
      explanation: |
        frame 마다 숫자 몇 개인 관절 값은 표로 두면 작고 필요한 열만 빨리 읽을 수 있다. 사진은 그대로 두면 매우 크지만 이웃 frame 이 거의 같아서, 몇 frame
        마다 전체를 적고 사이에는 바뀐 부분만 적는 영상 압축이 잘 통한다. Parquet 는 숫자를 저장하는 표 형식이다. 영상은 사진을 압축해 저장한다. 학습할 때는
        timestamp 로 같은 frame 의 사진과 관절 값을 함께 꺼낸다.
    - question: |
        면접관: "LeRobotDataset v3.0 은 여러 episode 를 한 파일에 이어 붙여 저장합니다. 그렇다면 episode 하나를 꺼낼 때 무엇이 필요한가요?"
      choices:
        - 'meta 에 episode 마다 적은 표의 시작·끝 행과 영상의 시작·끝 시각 같은 경계 정보'
        - '파일 이름에 적힌 episode 번호'
        - '영상을 처음부터 끝까지 모두 decode 하는 것'
        - 'episode 마다 다른 fps'
      answer: 0
      explanation: |
        v3.0 은 파일 수를 줄이려고 여러 episode 를 이어 붙이므로, 각 episode 가 표의 몇 번 행부터, 영상의 몇 초부터인지를 meta 의 episodes 파일에 적고 그 경계로
        꺼낸다. 파일 하나에 여러 episode 가 있어서 파일 이름으로는 episode 를 가를 수 없다. 경계를 알면 필요한 구간만 읽으면 된다. dataset 전체가 같은 fps
        를 쓴다.
    - question: |
        면접관: "simulation 은 관절 각도를 radian 으로 계산하고, 섞으려는 실물 dataset 은 degree 로 적었습니다. 변환 없이 그대로 저장해 섞으면 어떻게 되나요?"
      choices:
        - '학습 중에 단위가 자동으로 맞춰진다'
        - 'normalization 을 하면 단위 차이가 사라진다'
        - '숫자가 작아질 뿐 같은 자세를 뜻하므로 문제없다'
        - '같은 숫자가 두 데이터에서 전혀 다른 자세를 뜻하게 되어, policy 가 엉뚱한 짝을 배운다'
      answer: 3
      explanation: |
        1 radian 은 약 57.3° 라서 radian 값을 degree 로 읽으면 자세가 크게 달라진다. 섞기 전에 이름·개수·단위를 실물 dataset 과 맞춰야 한다. 학습 도구는 단위를
        알지 못해 자동으로 맞추지 않는다. normalization 은 dataset 전체의 통계로 범위를 옮길 뿐 두 단위가 섞인 값을 같은 자세로 되돌리지 못한다. 숫자가 다르면
        같은 자세를 뜻하지 않는다.

- topic: stats-boundaries
  title: stats 와 episode 경계의 쓰임
  variants:
    - question: |
        면접관: "LeRobotDataset 의 meta 에 있는 stats(최솟값·최댓값·평균·표준편차)는 학습에서 어디에 쓰이나요?"
      choices:
        - '영상을 압축하는 데 쓰인다'
        - 'episode 의 순서를 정하는 데 쓰인다'
        - '실패한 episode 를 자동으로 지우는 데 쓰인다'
        - '관절마다 범위가 다른 값을 −1 ~ 1 이나 평균 0 근처로 옮기는 normalization 에 쓰인다'
      answer: 3
      explanation: |
        관절마다 값의 범위가 달라서 그대로 넣으면 범위가 큰 관절의 오차가 loss 를 거의 다 차지하므로, stats 로 값을 비슷한 크기로 옮긴다. 영상 압축은 영상
        인코더가 하고 stats 를 쓰지 않는다. episode 순서는 episode 번호로 정해진다. stats 는 실패 여부를 알지 못해 episode 를 고르지 않는다.
    - question: |
        면접관: "이미 만든 dataset 에서 실패한 episode 몇 개를 지웠습니다. meta 쪽에서 함께 해야 할 일로 알맞은 것은 무엇인가요?"
      choices:
        - '아무것도 하지 않아도 된다'
        - 'fps 를 지운 episode 수만큼 줄인다'
        - 'stats 와 episode 경계 정보를 남은 데이터 기준으로 다시 계산한다'
        - 'task 문장을 모두 지운다'
      answer: 2
      explanation: |
        stats 는 dataset 전체에서 계산한 값이고 episode 경계는 이어 붙인 파일 안의 위치라서, episode 를 지우면 둘 다 남은 데이터에 맞게 다시 계산해야 한다.
        그대로 두면 normalization 이 지운 데이터의 통계로 이루어지고 경계가 틀린다. fps 는 1초에 남기는 frame 수라서 episode 수와 관계없다. task 문장은 남은 episode 가
        계속 쓴다.
    - question: |
        면접관: "action 100 개를 한 번에 정답으로 쓰는 policy 를 학습할 때, episode 끝 근처의 frame 에서는 뒤따르는 action 이 모자랍니다. LeRobot 은 이것을 어떻게 다루나요?"
      choices:
        - '다음 episode 의 action 을 이어 붙여 채운다'
        - '마지막 action 을 되풀이해 채우고, 채운 칸이라는 표시를 붙여 loss 에서 뺀다'
        - '그 frame 들을 dataset 에서 지운다'
        - '모자란 칸을 무작위 값으로 채워 그대로 학습한다'
      answer: 1
      explanation: |
        episode 경계 밖의 칸은 마지막 행을 되풀이해 채우고 `action_is_pad` 표시를 붙여, 그 칸의 오차를 loss 에서 뺀다. 다음 episode 의 action 은 다른 시연의 움직임이라
        정답으로 섞으면 안 된다. frame 을 지우면 episode 끝의 동작을 배우지 못한다. 무작위 값을 정답으로 쓰면 policy 가 엉뚱한 움직임을 배운다.

- topic: demo-quality
  title: 시연의 품질과 수
  variants:
    - question: |
        면접관: "시연 10 개 가운데 3 개에서 사람이 물체 위에서 한참 멈췄다 내려갔습니다. MSE 로 학습한 policy 에 이 머뭇거림이 크게 영향을 주는 이유는 무엇인가요?"
      choices:
        - 'policy 는 frame 하나하나를 정답으로 쓰므로, 오래 멈춘 시연이 멈춘 frame 을 많이 남겨 평균을 멈춤 쪽으로 끌어당기기 때문이다'
        - '머뭇거린 시연은 3 개뿐이라 영향이 30% 정도에 그친다'
        - 'policy 는 episode 단위로 하나의 정답만 배우기 때문이다'
        - 'MSE 는 멈춘 frame 을 자동으로 건너뛰기 때문이다'
      answer: 0
      explanation: |
        같은 장면의 정답들이 여럿이면 MSE 는 그 평균을 배우는데, 평균의 무게는 시연 수가 아니라 frame 수로 매겨진다. 오래 멈춘 시연은 같은 장면에 멈춰 있는
        frame 을 많이 남겨 평균을 멈춤 쪽으로 당긴다. 시연 수의 비율로 영향을 어림하면 이 frame 무게를 놓친다. policy 는 episode 가 아니라 frame 마다 이룬
        짝으로 배운다. MSE 는 frame 을 가리지 않고 모두 평균에 넣는다.
    - question: |
        면접관: "숙련자 한 명이 모은 시연 200 개와, 숙련도가 다른 여러 명이 모은 시연 300 개 중 어느 쪽이 behavior cloning 결과가 좋기 쉬운가요?"
      choices:
        - '시연이 많은 300 개 쪽이 항상 좋다'
        - '서툴거나 방식이 다른 시연이 섞이면 평균이 흐려지므로, 수가 적어도 일관된 200 개 쪽이 좋기 쉽다'
        - '시연자 수는 결과와 관계없고 시연 수만 중요하다'
        - '여러 명의 시연은 policy 가 자동으로 가장 잘한 사람의 것만 고르므로 300 개 쪽이 좋다'
      answer: 1
      explanation: |
        여러 명의 시연에는 숙련도와 방식 차이가 섞여, 같은 장면의 정답이 흩어지고 서툰 움직임까지 평균에 들어간다. robomimic 논문에서도 숙련자 한 명의 시연 200 개가
        여러 명의 시연 300 개보다 높은 성공률을 냈다. 수가 많다고 늘 좋지는 않다. 시연자가 다르면 정답의 분포가 달라지므로 결과와 관계있다. behavior cloning 은 시연의
        질을 가리지 않고 모두 따라 배운다.
    - question: |
        면접관: "학습한 policy 를 물체 자리마다 여러 번 실행해 보니 대부분 잘 집는데 한 자리에서만 성공률이 유난히 낮습니다. 다음에 할 일로 알맞은 것은 무엇인가요?"
      choices:
        - '모든 자리에 같은 수의 시연을 고르게 더 모은다'
        - '성공률이 낮은 자리는 쓰지 않기로 하고 그대로 둔다'
        - '그 자리에 시연을 더 모아 다시 학습한다'
        - 'policy 를 더 오래 학습시키기만 하면 된다'
      answer: 2
      explanation: |
        약한 자리는 그 자리 근처의 시연이 모자라거나 그 자리가 특히 어렵다는 신호라서, 그 자리의 시연을 더해 다시 학습하는 편이 효율적이다. 모든 자리에 고르게
        더하면 이미 잘 되는 자리에도 수고를 쓴다. 그 자리를 버리면 작업 범위가 좁아진다. 데이터에 없는 장면은 학습을 오래 해도 채워지지 않는다.
