<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 445" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>link 길이 0.5 m 인 2 관절 팔이 (0°, 90°) 자세에 있다. 관절 속도가 (0.2, 0.1) rad/s 이면 Jacobian 의 첫째 열 × 0.2 = (−0.1, 0.1) 과 둘째 열 × 0.1 = (−0.05, 0) 을 더한 (−0.15, 0.1) m/s 가 손끝 속도다</title>
  <defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect x="1" y="1" width="658" height="443" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70.0" y1="370.0" x2="394.0" y2="370.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="90.0" y1="390.0" x2="90.0" y2="47.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="90" y1="370" x2="280.0" y2="370.0" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <line x1="280.0" y1="370.0" x2="280.0" y2="180.0" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="90" cy="370" r="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="280.0" cy="370.0" r="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="280.0" cy="180.0" r="6" fill="#e2e8f0"/>
  <text x="92.0" y="398.0" fill="#94a3b8" font-size="12" text-anchor="middle">joint 1 (0, 0)</text>
  <text x="282.0" y="398.0" fill="#94a3b8" font-size="12" text-anchor="middle">joint 2 (0.5, 0)</text>
  <text x="294.0" y="184.0" fill="#e2e8f0" font-size="12" text-anchor="start">손끝 (0.5, 0.5)</text>
  <line x1="280.0" y1="180.0" x2="185.0" y2="85.0" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#aa)"/>
  <line x1="280.0" y1="180.0" x2="232.5" y2="180.0" stroke="#a78bfa" stroke-width="2.6" marker-end="url(#av)"/>
  <line x1="280.0" y1="180.0" x2="137.5" y2="85.0" stroke="#34d399" stroke-width="2.8" marker-end="url(#ag)"/>
  <text x="191.0" y="73.0" fill="#f59e0b" font-size="12" text-anchor="start">joint 1 몫 (−0.1, 0.1)</text>
  <text x="222.5" y="185.0" fill="#a78bfa" font-size="12" text-anchor="end">joint 2 몫 (−0.05, 0)</text>
  <text x="131.5" y="73.0" fill="#34d399" font-size="12" text-anchor="middle">합 (−0.15, 0.1) m/s</text>
  <text x="430.0" y="120.0" fill="#e2e8f0" font-size="13" text-anchor="start">J(0°, 90°) =</text>
  <text x="436.0" y="150.0" fill="#e2e8f0" font-size="15" text-anchor="start">[</text>
  <text x="482.0" y="150.0" fill="#f59e0b" font-size="13" text-anchor="end">−0.5</text>
  <text x="534.0" y="150.0" fill="#a78bfa" font-size="13" text-anchor="end">−0.5</text>
  <text x="546.0" y="150.0" fill="#e2e8f0" font-size="15" text-anchor="start">]</text>
  <text x="436.0" y="174.0" fill="#e2e8f0" font-size="15" text-anchor="start">[</text>
  <text x="482.0" y="174.0" fill="#f59e0b" font-size="13" text-anchor="end">0.5</text>
  <text x="534.0" y="174.0" fill="#a78bfa" font-size="13" text-anchor="end">0</text>
  <text x="546.0" y="174.0" fill="#e2e8f0" font-size="15" text-anchor="start">]</text>
  <text x="430.0" y="230.0" fill="#94a3b8" font-size="12" text-anchor="start">관절 속도 (0.2, 0.1) rad/s</text>
  <text x="430.0" y="252.0" fill="#f59e0b" font-size="12" text-anchor="start">첫째 열 × 0.2 = (−0.1, 0.1)</text>
  <text x="430.0" y="274.0" fill="#a78bfa" font-size="12" text-anchor="start">둘째 열 × 0.1 = (−0.05, 0)</text>
  <text x="430.0" y="296.0" fill="#34d399" font-size="12" text-anchor="start">손끝 속도 (−0.15, 0.1) m/s</text>
  <text x="330.0" y="430.0" fill="#94a3b8" font-size="11" text-anchor="middle">link 길이 0.5 m. 화살표는 보기 좋게 2.5 배로 늘려 그렸다</text>
</svg>
