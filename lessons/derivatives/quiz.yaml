# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: finite-difference
  title: finite difference 와 derivative
  variants:
    - question: |
        면접관: "encoder 가 0.01 초마다 관절 각도를 줍니다. 이 값으로 관절 속도를 어떻게 구하고, 그 값은 정확히 무엇을 뜻하나요?"
      choices:
        - '지금 각도를 0.01 로 나누면 되고, 그 값이 지금 순간의 속도다'
        - '각도를 모두 더한 뒤 0.01 을 곱하면 되고, 그 값이 평균 속도다'
        - '연이은 두 각도의 차이를 0.01 초로 나누고, 그 값은 두 측정 사이 구간의 평균 속도다'
        - '연이은 두 각도의 차이를 그대로 쓰면 되고, 단위는 °/s 다'
      answer: 2
      explanation: |
        속도는 각도가 변한 양을 걸린 시간으로 나눈 finite difference $\Delta\theta / \Delta t$ 로 구한다. 이 값은 두 측정 사이 구간의 평균
        속도라서, 간격을 0 에 가깝게 줄였을 때 다가가는 값(derivative)의 근사다. 각도 하나를 시간으로 나누면 변화가 아니라 위치를 나눈 것이고,
        더하고 곱하는 것은 적분 쪽 계산이다. 차이를 시간으로 나누지 않으면 °/s 가 아니라 ° 단위의 변화량일 뿐이다.
    - question: |
        0.01 초 간격으로 읽은 관절 각도가 10.0°, 10.5°, 11.2° 다. 두 구간의 속도로 구한 가속도로 알맞은 것은?
      choices:
        - '2000 °/s². 속도가 50 °/s 에서 70 °/s 로 바뀌었고, 그 차이 20 °/s 를 0.01 초로 나눈다'
        - '20 °/s². 두 속도의 차이 20 °/s 가 곧 가속도다'
        - '1.2 °/s². 처음과 끝 각도의 차이다'
        - '0 °/s². 각도가 계속 커지므로 가속도는 없다'
      answer: 0
      explanation: |
        두 구간의 속도는 $(10.5 - 10.0) \div 0.01 = 50$ °/s 와 $(11.2 - 10.5) \div 0.01 = 70$ °/s 이고, 가속도는 속도의 차이를 같은 시간 간격으로
        나눈 $(70 - 50) \div 0.01 = 2000$ °/s² 다. 속도 차이를 시간으로 나누지 않으면 °/s² 가 아니라 °/s 단위의 변화량일 뿐이고, 각도 차이는
        가속도가 아니다. 각도가 커진다는 것은 속도가 양수라는 뜻이고, 가속도는 그 속도가 얼마나 빨리 변하는지를 나타낸다.
    - question: |
        면접관: "로봇 논문에서 $\dot\theta$, $\ddot\theta$ 라는 기호를 봤습니다. 관절 각도 $\theta$ 와 어떤 관계인가요?"
      choices:
        - '$\dot\theta$ 는 각도의 평균, $\ddot\theta$ 는 각도의 분산이다'
        - '$\dot\theta$ 는 목표 각도, $\ddot\theta$ 는 목표와의 오차다'
        - '$\dot\theta$ 는 각도를 적분한 값, $\ddot\theta$ 는 두 번 적분한 값이다'
        - '$\dot\theta$ 는 각도를 시간으로 한 번 미분한 각속도, $\ddot\theta$ 는 두 번 미분한 각가속도다'
      answer: 3
      explanation: |
        기호 위의 점은 시간에 대한 derivative 를 뜻한다. 점 하나는 한 번 미분한 각속도, 점 두 개는 두 번 미분한 각가속도이고, 한 번 더 미분하면
        jerk 다. 평균·분산이나 목표·오차와는 관계없고, 적분은 미분의 반대 계산이다.

- topic: differentiation-noise
  title: 수치 미분이 noise 를 키우는 이유
  variants:
    - question: |
        면접관: "한 칸이 0.088° 인 encoder 로 천천히 도는 관절의 속도를 계산합니다. 계산 주기를 100 Hz 에서 1 kHz 로 올렸더니 속도 값이 훨씬 심하게 튑니다. 왜 그럴까요?"
      choices:
        - '1 kHz 에서는 encoder 의 칸 크기가 커져서 각도 오차가 커지기 때문이다'
        - '각도의 오차는 한 칸으로 같은데, 속도는 그 오차를 더 작은 $\Delta t$ 로 나누므로 오차가 10 배 커지기 때문이다'
        - '계산 주기가 빨라지면 관절이 실제로 더 빠르게 떨기 때문이다'
        - 'CPU 가 바빠져 계산이 틀리기 때문이고, 계산 자체는 더 정확해진다'
      answer: 1
      explanation: |
        encoder 는 각도를 칸 단위로만 재므로 각도의 오차는 계산 주기와 상관없이 많아야 한 칸이다. finite difference 는 그 오차를 $\Delta t$ 로
        나누므로 $\Delta t$ 가 10 분의 1 이 되면 속도의 오차는 10 배가 된다(0.088 ÷ 0.01 = 8.8 °/s, 0.088 ÷ 0.001 = 88 °/s). 칸 크기는 encoder 가
        정하므로 바뀌지 않고, 관절이 실제로 더 떠는 것도 아니다. 값이 튀는 것은 계산 실수가 아니라 미분이라는 계산의 성질이다.
    - question: |
        면접관: "encoder 값을 미분해 속도를 구하고, 그 속도를 다시 미분해 가속도를 구했더니 가속도가 쓸 수 없을 만큼 튑니다. 이유로 가장 알맞은 것은?"
      choices:
        - '가속도는 원래 측정할 수 없는 양이라 계산하면 항상 틀린다'
        - '두 번째 미분은 첫 번째 미분과 반대로 noise 를 줄여야 하는데, 구현 실수로 키웠다'
        - '속도를 미분하면 bias 가 시간에 비례해 쌓이기 때문이다'
        - '미분할 때마다 측정 오차를 $\Delta t$ 로 한 번 더 나누므로, 두 번 미분하면 noise 가 한 번 더 크게 불어난다'
      answer: 3
      explanation: |
        미분할 때마다 오차가 $\Delta t$ 로 나뉜다. 1 kHz 에서 한 칸 0.088° 의 오차는 속도에서 88 °/s, 가속도에서 88,000 °/s² 가 된다. 그래서
        가속도가 필요하면 IMU 같은 센서로 직접 재거나 강한 filter 를 쓴다. 가속도는 측정할 수 있는 양이고, 미분은 몇 번을 하든 noise 를 키운다.
        bias 가 시간에 비례해 쌓이는 것은 적분의 성질이다.
    - question: |
        면접관: "encoder 의 영점이 3° 어긋나게 설치되어 모든 각도 값이 3° 크게 나옵니다. 이 값으로 finite difference 를 해서 구한 관절 속도는 어떻게 되나요?"
      choices:
        - '모든 값이 똑같이 3° 크므로 두 값의 차이에서 상쇄되어, 속도는 어긋나지 않는다'
        - '속도도 3 °/s 크게 나온다'
        - '속도가 3 ÷ $\Delta t$ 만큼 크게 나온다'
        - '시간이 갈수록 속도 오차가 3° 씩 쌓인다'
      answer: 0
      explanation: |
        일정한 값(상수)의 derivative 는 0 이다. 두 각도에 같은 3° 가 더해져 있으면 차이를 낼 때 지워지므로 속도에는 나타나지 않는다. 미분이 키우는
        것은 측정마다 다르게 오르내리는 noise 이고, 일정한 bias 는 미분하면 사라진다. 오차가 시간에 따라 쌓이는 것은 속도를 적분할 때의 일이다.

- topic: filtering-delay
  title: 평균과 low-pass filter 의 대가
  variants:
    - question: |
        면접관: "1 kHz 로 계산한 관절 속도가 튀어서, 최근 속도 50 개의 평균을 쓰기로 했습니다. 무엇을 얻고 무엇을 잃나요?"
      choices:
        - 'noise 도 줄고 반응도 빨라져서 잃는 것이 없다'
        - 'noise 는 그대로이고 계산량만 50 배 늘어난다'
        - '평균은 noise 를 키우지만 속도의 bias 를 없애 준다'
        - 'noise 는 크게 줄지만, 지난 0.05 초 동안의 평균이라 실제 속도 변화를 늦게 따라간다'
      answer: 3
      explanation: |
        속도 50 개의 평균은 50 step 전 각도와 지금 각도의 차이를 0.05 초로 나눈 것과 같아서, 한 칸의 오차가 0.05 초로 나뉘어 noise 가 크게 준다.
        대신 지난 0.05 초의 평균이므로 실제 속도를 대략 그 절반인 0.025 초 늦게 따라간다. 관절이 갑자기 멈춰도 0 이 되기까지 0.05 초가 걸린다.
        평균은 noise 를 줄이는 계산이고, 일정한 bias 를 없애지는 않는다.
    - question: |
        면접관: "PID 의 D 항에 low-pass filter 를 거친 값을 쓰는 경우가 많습니다. 이유가 무엇인가요?"
      choices:
        - 'D 항은 오차를 적분하므로 bias 가 쌓이는 것을 막으려고'
        - 'D 항은 오차의 변화율(미분값)이라 측정 noise 가 $\Delta t$ 로 나뉘어 크게 튀기 때문에'
        - 'low-pass filter 를 거치면 D 항의 반응이 더 빨라지기 때문에'
        - 'D 항은 목표 각도에만 쓰이므로 측정 noise 와 관계없어서, 계산을 줄이려고'
      answer: 1
      explanation: |
        D 항은 오차가 변하는 빠르기를 계산하므로 수치 미분과 같은 문제를 겪는다. 측정값의 작은 noise 가 $\Delta t$ 로 나뉘어 크게 튀고, 그대로
        motor 에 들어가면 torque 가 떨린다. low-pass filter 는 이 빠른 오르내림을 줄이는 대신 반응을 늦춘다. 오차를 쌓는 것은 I 항이고, D 항은
        측정한 값의 변화로 계산하므로 측정 noise 와 직접 관계있다.
    - question: |
        면접관: "속도 추정에 쓰는 low-pass filter 를 더 강하게(더 많이 평활하게) 설정했습니다. controller 입장에서 생길 수 있는 문제는 무엇인가요?"
      choices:
        - '속도 값이 더 심하게 튄다'
        - 'encoder 의 해상도가 낮아진다'
        - '추정한 속도가 실제보다 늦게 변해서, 이 값으로 계산한 제어가 늦게 반응하고 흔들릴 수 있다'
        - '속도에 일정한 bias 가 생겨 시간이 갈수록 커진다'
      answer: 2
      explanation: |
        low-pass filter 는 빠르게 오르내리는 값을 줄이는 만큼 실제 변화도 늦게 보여 준다. filter 가 강할수록 noise 는 줄지만 지연이 커지고,
        늦은 속도 값으로 힘을 정하면 controller 가 이미 지나간 상황에 반응해 흔들릴 수 있다. 그래서 noise 와 지연 사이에서 알맞은 정도를 고른다.
        filter 는 값을 더 매끄럽게 만들 뿐 더 튀게 하지 않고, encoder 해상도는 하드웨어가 정하며, 쌓이는 bias 는 적분의 문제다.

- topic: integration-drift
  title: 적분과 drift
  variants:
    - question: |
        면접관: "IMU 의 gyro 값을 적분해 로봇의 방향을 구하면, 로봇이 멈춰 있어도 방향 값이 계속 한쪽으로 흘러갑니다. 이유가 무엇인가요?"
      choices:
        - 'gyro 의 bias(늘 한쪽으로 치우친 작은 오차)가 적분하면서 시간에 비례해 쌓이기 때문이다'
        - '적분은 noise 를 $\Delta t$ 로 나눠 키우기 때문이다'
        - 'gyro 는 각도를 직접 재므로 적분할 필요가 없는데 적분했기 때문이다'
        - '로봇이 멈춰 있으면 gyro 가 꺼지기 때문이다'
      answer: 0
      explanation: |
        gyro 는 회전 속도를 재므로 방향을 알려면 적분해야 한다. 멈춰 있어도 0.1 °/s 같은 bias 가 있으면 매번 같은 쪽으로 더해져 1 분에 6° 처럼
        시간에 비례해 쌓이는데, 이것을 drift 라고 한다. noise 를 $\Delta t$ 로 나눠 키우는 것은 미분이고, 적분에서는 오르내리는 noise 가 서로 상쇄된다.
    - question: |
        면접관: "멈춰 있는 로봇의 gyro 에 0.1 °/s 의 bias 와 0.5 °/s 크기의 무작위 noise 가 함께 있습니다. 1초에 100 번 읽어 60 초 동안 적분하면, 방향 오차에 더 크게 기여하는 쪽은?"
      choices:
        - 'noise. 크기가 bias 의 다섯 배라서 쌓인 오차도 다섯 배다'
        - '둘이 같다. 적분하면 모든 오차가 시간에 비례해 쌓인다'
        - 'bias. 매번 같은 쪽으로 더해져 6° 가 쌓이지만, noise 는 서로 상쇄되어 0.4° 정도로만 커진다'
        - '둘 다 기여하지 않는다. 적분은 오차를 평균 내서 지운다'
      answer: 2
      explanation: |
        bias 는 $0.1 \times 60 = 6°$ 로 시간에 비례해 쌓인다. noise 는 더해질 때마다 방향이 달라 서로 상쇄되어, 6000 번 더한 합이 6000 배가 아니라
        $\sqrt{6000}$ 배 정도로만 커진다($0.5 \times 0.01 \times \sqrt{6000} \approx 0.39°$). 그래서 noise 가 다섯 배 커도 적분한 결과에서는 bias
        가 훨씬 크다. 적분은 noise 를 줄이지만 bias 를 지우지는 못한다.
    - question: |
        면접관: "가속도계 값을 두 번 적분해 위치를 구하면, 가속도의 작은 bias 가 위치 오차로 어떻게 커지나요?"
      choices:
        - '시간과 상관없이 일정하게 남는다'
        - '시간의 제곱에 비례해 커져서, 짧은 시간에도 위치가 크게 어긋난다'
        - '시간에 비례해 커지지만 두 번 적분하면 다시 상쇄된다'
        - '시간이 갈수록 줄어든다'
      answer: 1
      explanation: |
        가속도의 bias 를 한 번 적분하면 속도 오차가 시간에 비례해 커지고, 그 속도 오차를 다시 적분하면 위치 오차는 시간의 제곱에 비례한다.
        그래서 IMU 혼자서는 오래 위치를 낼 수 없고, GPS 나 바퀴 odometry 같은 다른 센서와 합쳐 drift 를 바로잡는다. bias 는 같은 쪽으로 쌓이므로
        상쇄되거나 줄지 않는다.

- topic: chain-rule
  title: chain rule
  variants:
    - question: |
        감속비 100:1 인 gear 로 motor 가 관절을 돌린다. 관절을 1 rad 돌릴 때 손끝 높이는 0.3 m 변한다. motor 를 1 rad 돌리면 손끝 높이는 대략 얼마나 변할까?
      choices:
        - '30 m. 관절의 변화율 0.3 에 감속비 100 을 곱한다'
        - '0.3 m. gear 는 돌리는 축만 바꾸므로 비율이 그대로다'
        - '0.003 m. motor 1 rad 에 관절이 0.01 rad 돌므로 0.3 × 0.01 이다'
        - '0.103 m. 두 단계의 변화율 0.3 과 0.01 을 더하고 나눈다'
      answer: 2
      explanation: |
        변화가 motor → 관절 → 손끝으로 단계를 거쳐 전해지므로 chain rule 로 단계마다의 변화율을 곱한다. motor 1 rad 에 관절은 $1 \div 100 = 0.01$
        rad 돌고, 관절 1 rad 당 손끝이 0.3 m 변하므로 $0.3 \times 0.01 = 0.003$ m 다. 100 을 곱하면 감속비를 거꾸로 쓴 것이고, gear 를 무시하면
        0.3 m 가 되며, 단계마다의 변화율은 더하지 않고 곱한다.
    - question: |
        면접관: "neural network 의 backpropagation 이 chain rule 이라고 하는데, chain rule 이 말하는 것은 무엇인가요?"
      choices:
        - '여러 함수의 derivative 를 모두 더하면 전체의 derivative 가 된다'
        - '맨 마지막 층의 derivative 만 구하면 앞 층은 같은 값을 쓴다'
        - '함수를 여러 번 미분하면 0 이 된다'
        - '변화가 여러 단계를 거쳐 전해질 때, 처음과 끝 사이의 변화율은 단계마다의 변화율을 곱한 값이다'
      answer: 3
      explanation: |
        $y$ 가 $u$ 에, $u$ 가 $x$ 에 달려 있으면 $\frac{dy}{dx} = \frac{dy}{du} \times \frac{du}{dx}$ 다. backpropagation 은 loss 에서 출발해 층마다의
        변화율을 곱해 가며 앞 층 weight 의 gradient 를 구한다. 변화율은 더하지 않고 곱하며, 층마다 값이 달라서 마지막 층의 값을 그대로 쓸 수 없다.
    - question: |
        면접관: "길이 0.5 m 인 link 가 관절에 달려 있고 손끝 높이는 $0.5\sin\theta$ 입니다. 관절 속도가 같을 때, 손끝 높이가 가장 빨리 변하는 자세와 전혀 변하지 않는 자세는?"
      choices:
        - '수평($\theta = 0°$)에서 가장 빨리 변하고, 똑바로 선 자세($\theta = 90°$)에서는 높이가 변하지 않는다'
        - '똑바로 선 자세에서 가장 빨리 변하고, 수평에서는 변하지 않는다'
        - '모든 자세에서 같은 빠르기로 변한다'
        - '45° 에서만 변하고 나머지 자세에서는 변하지 않는다'
      answer: 0
      explanation: |
        손끝 높이의 변화율은 $\frac{dy}{d\theta} = 0.5\cos\theta$ 다. 수평에서는 $\cos 0° = 1$ 이라 0.5 m/rad 로 가장 크고, 똑바로 선 자세에서는
        $\cos 90° = 0$ 이라 손끝이 옆으로만 움직이고 높이는 변하지 않는다. 그래서 같은 관절 속도라도 자세에 따라 손끝 높이가 변하는 빠르기가 다르다.

- topic: gradient
  title: partial derivative 와 gradient
  variants:
    - question: |
        면접관: "어떤 함수의 gradient 가 지금 점에서 $(-0.2, -0.1)$ 입니다. 이 함수를 가장 빨리 줄이려면 두 변수를 어떻게 바꿔야 하나요?"
      choices:
        - '두 변수를 모두 줄인다. gradient 방향으로 가면 값이 준다'
        - '두 변수를 모두 키운다. gradient 의 반대 방향 $(0.2, 0.1)$ 쪽이 가장 빨리 줄어드는 방향이다'
        - '첫째 변수만 키운다. 둘째 칸은 크기가 작아서 무시한다'
        - '두 변수를 그대로 둔다. gradient 가 음수면 이미 가장 낮은 점이다'
      answer: 1
      explanation: |
        gradient 는 함수가 가장 빨리 커지는 방향을 가리키므로, 줄이려면 그 반대 $(0.2, 0.1)$ 쪽으로 간다. 두 칸이 모두 음수라 두 변수를 키우면 값이
        준다. 크기가 작은 칸도 같은 방향으로 기여하므로 무시하지 않으며, 가장 낮은 점에서는 gradient 가 음수가 아니라 0 이다.
    - question: |
        면접관: "partial derivative $\frac{\partial D}{\partial \theta_1}$ 을 숫자로 잴 때 어떻게 하나요?"
      choices:
        - '$\theta_2$ 는 그대로 두고 $\theta_1$ 만 조금 바꿔, $D$ 가 변한 양을 바꾼 양으로 나눈다'
        - '$\theta_1$ 과 $\theta_2$ 를 똑같이 조금 바꿔, $D$ 가 변한 양을 나눈다'
        - '$\theta_1$ 을 0 으로 두고 $D$ 를 계산한다'
        - '$\theta_1$ 을 크게 바꿔 $D$ 가 가장 작아지는 값을 찾는다'
      answer: 0
      explanation: |
        partial derivative 는 다른 변수를 고정하고 하나만 바꿨을 때의 변화율이다. 둘을 함께 바꾸면 어느 쪽 때문에 $D$ 가 변했는지 알 수 없다.
        변수를 0 으로 두거나 크게 바꿔 최솟값을 찾는 것은 변화율을 재는 방법이 아니다. $\partial$ 기호가 "다른 값은 고정했다" 는 표시다.
    - question: |
        면접관: "gradient descent 에서 step 크기 $\alpha$ 를 너무 크게 잡으면 어떻게 되나요?"
      choices:
        - '한 번에 정확히 가장 낮은 점에 도착하므로 클수록 좋다'
        - '방향이 반대로 바뀌어 항상 오르막으로 간다'
        - 'gradient 의 크기가 0 이 되어 더 움직이지 않는다'
        - 'gradient 는 지금 점에서의 기울기일 뿐이라, 너무 멀리 가면 가장 낮은 점을 지나쳐 오히려 값이 커질 수 있다'
      answer: 3
      explanation: |
        gradient 는 지금 자리에서 어느 쪽이 내리막인지만 알려 준다. 함수가 휘어 있어서 그 방향으로 너무 멀리 가면 가장 낮은 점을 지나쳐 처음보다
        나빠질 수 있다. 2 관절 팔 예에서 $\alpha = 0.5$ 는 거리를 0.141 m 에서 0.060 m 로 줄였지만 $\alpha = 2$ 는 0.222 m 로 오히려 늘렸다.
        방향 자체는 그대로 내리막이고, gradient 는 $\alpha$ 와 상관없이 그 점의 값이다.

- topic: jacobian
  title: Jacobian 과 선형 근사
  variants:
    - question: |
        면접관: "2 관절 팔의 Jacobian 이 무엇인지 설명해 보세요."
      choices:
        - '손끝 위치에서 관절 각도를 바로 구하는 공식이다'
        - '관절마다 motor 가 낼 수 있는 최대 torque 를 모은 표다'
        - '손끝과 목표 사이 거리를 관절 각도로 미분한 vector 다'
        - '손끝 좌표 $x$, $y$ 를 각 관절 각도로 편미분한 값을 모은 행렬로, 관절의 작은 움직임이 손끝을 얼마나 옮기는지 알려 준다'
      answer: 3
      explanation: |
        Jacobian 은 결과(손끝 $x$, $y$)를 행으로, 변수(관절 각도)를 열로 해서 partial derivative 를 늘어놓은 행렬이다. 열 하나는 그 관절만 돌 때
        손끝이 움직이는 속도이고, $\dot{\mathbf p} = J\dot{\mathbf q}$ 로 관절 속도를 손끝 속도로 바꾼다. 손끝에서 관절 각도를 구하는 것은 IK 이고,
        값 하나(거리)를 미분한 vector 는 gradient 다.
    - question: |
        어떤 자세에서 $J = \begin{bmatrix} -0.5 & -0.5 \\ 0.5 & 0 \end{bmatrix}$ 이다. 관절 속도가 $(0.2, 0.1)$ rad/s 일 때 손끝 속도는?
      choices:
        - '$(-0.1, 0.1)$ m/s. 첫째 관절만 손끝을 움직인다'
        - '$(-0.15, 0.1)$ m/s. 첫째 열에 0.2, 둘째 열에 0.1 을 곱해 더한다'
        - '$(-0.1, 0.05)$ m/s. 행렬의 칸을 관절 속도와 차례로 곱한다'
        - '$(0.3, 0)$ m/s. 관절 속도를 더한 값이 손끝 속도다'
      answer: 1
      explanation: |
        손끝 속도는 각 열에 그 관절의 속도를 곱해 더한 $0.2 \times (-0.5, 0.5) + 0.1 \times (-0.5, 0) = (-0.1, 0.1) + (-0.05, 0) = (-0.15, 0.1)$
        m/s 다. 첫째 관절만 보면 둘째 관절의 몫 $(-0.05, 0)$ 이 빠지고, 칸을 관절 속도와 차례로만 곱하면 행렬 곱이 아니며, 관절 속도의 합은 손끝
        속도가 아니다.
    - question: |
        면접관: "$\Delta\mathbf p \approx J\,\Delta\mathbf q$ 는 왜 근사이고, 언제 잘 맞나요?"
      choices:
        - '센서 noise 때문에 근사이고, noise 가 없으면 관절을 얼마나 돌리든 정확하다'
        - 'Jacobian 을 숫자로 재서 근사일 뿐이고, 식으로 구하면 언제나 정확하다'
        - '손끝은 실제로 휘어 가는데 Jacobian 은 지금 방향으로 곧게 간다고 보는 선형 근사라서, 관절을 조금만 돌릴 때 잘 맞는다'
        - '관절을 크게 돌릴수록 오차가 상쇄되어 더 잘 맞는다'
      answer: 2
      explanation: |
        Jacobian 은 지금 자세에서의 변화율이라 휘어진 움직임을 한 점 근처에서 직선으로 바꿔 본 선형 근사(first-order Taylor)다. 움직임이 작을 때만
        잘 맞고, 움직임을 10 배 키우면 오차는 약 100 배가 된다. 그래서 IK 는 작은 step 을 되풀이하고, EKF 는 매 step 지금 추정값에서 Jacobian 을
        다시 구한다. noise 나 계산 방법과 관계없이 생기는 오차이고, 크게 돌릴수록 커진다.
