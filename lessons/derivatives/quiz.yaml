# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: finite-difference
  title: finite difference 와 derivative
  variants:
    - question: |
        encoder 가 0.01 초마다 관절 각도를 준다. 이 값으로 관절 속도를 어떻게 구하고, 그 값은 정확히 무엇을 뜻하는가?
      choices:
        - '지금 각도 하나를 0.01 초로 나누면 되고, 그 값이 지금 이 순간의 속도다'
        - '각도를 차례로 더한 뒤 0.01 초를 곱하면 되고, 그 값이 구간의 평균 속도다'
        - '연이은 두 각도의 차이를 0.01 초로 나누고, 그 값은 두 측정 사이 구간의 평균 속도다'
        - '연이은 두 각도의 차이가 곧 속도라서, 0.01 초로 나누지 않아도 단위가 °/s 다'
      answer: 2
      explanation: |
        속도는 각도가 변한 양을 걸린 시간으로 나눈 finite difference $\Delta\theta / \Delta t$ 로 구한다. 이 값은 두 측정 사이 구간의 평균
        속도라서, 간격을 0 에 가깝게 줄였을 때 다가가는 값(derivative)의 근사다. 각도 하나를 시간으로 나누면 변화가 아니라 위치를 나눈 것이고,
        더하고 곱하는 것은 적분 쪽 계산이다. 차이를 시간으로 나누지 않으면 °/s 가 아니라 ° 단위의 변화량일 뿐이다.
    - question: |
        0.01 초 간격으로 읽은 관절 각도가 10.0°, 10.5°, 11.2° 다. 두 구간의 속도로 구한 가속도로 알맞은 것은?
      choices:
        - '2000 °/s². 두 구간 속도 50 °/s 와 70 °/s 의 차이를 0.01 초로 나눈다'
        - '20 °/s². 두 구간 속도 50 °/s 와 70 °/s 의 차이 20 °/s 가 곧 가속도다'
        - '1.2 °/s². 가속도는 처음 각도와 끝 각도의 차이 11.2 − 10.0 이다'
        - '0 °/s². 각도가 매번 늘고 있으니 속도만 있고 가속도는 없다'
      answer: 0
      explanation: |
        두 구간의 속도는 $(10.5 - 10.0) \div 0.01 = 50$ °/s 와 $(11.2 - 10.5) \div 0.01 = 70$ °/s 이고, 가속도는 속도의 차이를 같은 시간 간격으로
        나눈 $(70 - 50) \div 0.01 = 2000$ °/s² 다. 속도 차이를 시간으로 나누지 않으면 °/s² 가 아니라 °/s 단위의 변화량일 뿐이고, 각도 차이는
        가속도가 아니다. 각도가 커진다는 것은 속도가 양수라는 뜻이고, 가속도는 그 속도가 얼마나 빨리 변하는지를 나타낸다.
    - question: |
        로봇 논문에서 $\dot\theta$, $\ddot\theta$ 라는 기호가 나왔다. 관절 각도 $\theta$ 와 어떤 관계인가?
      choices:
        - '$\dot\theta$ 는 여러 번 잰 각도의 평균이고, $\ddot\theta$ 는 그 각도들이 흩어진 정도인 분산이다'
        - '$\dot\theta$ 는 controller 가 따라갈 목표 각도이고, $\ddot\theta$ 는 지금 각도와 목표 사이 오차다'
        - '$\dot\theta$ 는 각도를 시간으로 한 번 적분한 값이고, $\ddot\theta$ 는 두 번 적분한 값이다'
        - '$\dot\theta$ 는 각도를 시간으로 한 번 미분한 각속도이고, $\ddot\theta$ 는 두 번 미분한 각가속도다'
      answer: 3
      explanation: |
        기호 위의 점은 시간에 대한 derivative 를 뜻한다. 점 하나는 한 번 미분한 각속도, 점 두 개는 두 번 미분한 각가속도이고, 한 번 더 미분하면
        jerk 다. 평균·분산이나 목표·오차와는 관계없고, 적분은 미분의 반대 계산이다.

- topic: differentiation-noise
  title: 수치 미분이 noise 를 키우는 이유
  variants:
    - question: |
        한 칸이 0.088° 인 encoder 로 천천히 도는 관절의 속도를 계산한다. 계산 주기를 100 Hz 에서 1 kHz 로 올렸더니 속도 값이 훨씬 심하게 튄다. 그 이유는 무엇인가?
      choices:
        - '계산 주기를 올리면 encoder 가 각도를 더 큰 칸으로 끊어 재서 각도 오차 자체가 커지기 때문이다'
        - '각도 오차는 한 칸 그대로인데 속도는 그 오차를 10 분의 1 로 줄어든 $\Delta t$ 로 나누기 때문이다'
        - '계산 주기가 빨라지면 motor 에 명령이 자주 들어가 관절이 실제로 더 떨기 때문이다'
        - 'CPU 가 1초에 1000 번 계산하느라 바빠져 반올림 실수가 쌓이기 때문이다'
      answer: 1
      explanation: |
        encoder 는 각도를 칸 단위로만 재므로 각도의 오차는 계산 주기와 상관없이 많아야 한 칸이다. finite difference 는 그 오차를 $\Delta t$ 로
        나누므로 $\Delta t$ 가 10 분의 1 이 되면 속도의 오차는 10 배가 된다(0.088 ÷ 0.01 = 8.8 °/s, 0.088 ÷ 0.001 = 88 °/s). 칸 크기는 encoder 가
        정하므로 바뀌지 않고, 관절이 실제로 더 떠는 것도 아니다. 값이 튀는 것은 계산 실수가 아니라 미분이라는 계산의 성질이다.
    - question: |
        encoder 값을 미분해 속도를 구하고, 그 속도를 다시 미분해 가속도를 구했더니 가속도가 쓸 수 없을 만큼 튄다. 이유로 가장 알맞은 것은?
      choices:
        - '가속도는 원래 측정할 수 없는 양이라, 어떤 방법으로 계산해도 값이 항상 틀린다'
        - '두 번째 미분은 첫 번째 미분에서 커진 noise 를 되돌려 줄여야 하는데, 구현 실수로 키웠다'
        - '속도를 미분하면 속도에 섞인 bias 가 시간에 비례해 쌓여서 가속도가 점점 커진다'
        - '미분할 때마다 측정 오차를 $\Delta t$ 로 한 번 더 나누어, noise 가 다시 크게 불어나기 때문이다'
      answer: 3
      explanation: |
        미분할 때마다 오차가 $\Delta t$ 로 나뉜다. 1 kHz 에서 한 칸 0.088° 의 오차는 속도에서 88 °/s, 가속도에서 88,000 °/s² 가 된다. 그래서
        가속도가 필요하면 IMU 같은 센서로 직접 재거나 강한 filter 를 쓴다. 가속도는 측정할 수 있는 양이고, 미분은 몇 번을 하든 noise 를 키운다.
        bias 가 시간에 비례해 쌓이는 것은 적분의 성질이다.
    - question: |
        encoder 의 영점이 3° 어긋나게 설치되어 모든 각도 값이 3° 크게 나온다. 이 값으로 finite difference 를 해서 구한 관절 속도는 어떻게 되는가?
      choices:
        - '모든 값이 똑같이 3° 크므로 두 값의 차이에서 상쇄되어, 속도는 어긋나지 않는다'
        - '각도가 3° 크니 속도도 그만큼 커져서, 모든 속도가 3 °/s 크게 나온다'
        - '3° 오차를 $\Delta t$ 로 나누므로, 속도가 3 ÷ $\Delta t$ 만큼 크게 나온다'
        - '차이를 낼 때마다 3° 가 남아서 시간이 갈수록 속도 오차가 3° 씩 쌓인다'
      answer: 0
      explanation: |
        일정한 값(상수)의 derivative 는 0 이다. 두 각도에 같은 3° 가 더해져 있으면 차이를 낼 때 지워지므로 속도에는 나타나지 않는다. 미분이 키우는
        것은 측정마다 다르게 오르내리는 noise 이고, 일정한 bias 는 미분하면 사라진다. 오차가 시간에 따라 쌓이는 것은 속도를 적분할 때의 일이다.

- topic: filtering-delay
  title: 평균과 low-pass filter 의 대가
  variants:
    - question: |
        1 kHz 로 계산한 관절 속도가 튀어서, 최근 속도 50 개의 평균을 쓰기로 했다. 이때 얻는 것과 잃는 것은 무엇인가?
      choices:
        - '50 개를 평균하면 noise 가 줄고, 가장 최근 값도 평균에 함께 들어가므로 반응은 늦어지지 않는다'
        - '평균을 내도 한 칸 오차는 그대로라서 noise 는 같고, 계산량만 50 배로 늘어난다'
        - '평균은 noise 를 줄이는 대신 속도에 섞인 일정한 bias 까지 함께 없애 준다'
        - 'noise 는 크게 줄지만, 지난 0.05 초 동안의 평균이라 실제 속도 변화를 늦게 따라간다'
      answer: 3
      explanation: |
        속도 50 개의 평균은 50 step 전 각도와 지금 각도의 차이를 0.05 초로 나눈 것과 같아서, 한 칸의 오차가 0.05 초로 나뉘어 noise 가 크게 준다.
        대신 지난 0.05 초의 평균이므로 실제 속도를 대략 그 절반인 0.025 초 늦게 따라간다. 관절이 갑자기 멈춰도 0 이 되기까지 0.05 초가 걸린다.
        평균은 noise 를 줄이는 계산이고, 일정한 bias 를 없애지는 않는다.
    - question: |
        PID 의 D 항에 low-pass filter 를 거친 값을 쓰는 경우가 많다. 그 이유는 무엇인가?
      choices:
        - 'D 항은 오차를 계속 더해 가므로, 측정 bias 가 시간에 비례해 쌓이는 것을 막으려고'
        - 'D 항은 오차의 변화율이라 측정 noise 가 $\Delta t$ 로 나뉘어 크게 튀기 때문에'
        - 'low-pass filter 를 거치면 오차 변화가 미리 보여서 D 항이 더 빨리 반응하기 때문에'
        - 'D 항은 목표 각도로만 계산해 측정 noise 와 관계없지만, 계산량을 줄이려고'
      answer: 1
      explanation: |
        D 항은 오차가 변하는 빠르기를 계산하므로 수치 미분과 같은 문제를 겪는다. 측정값의 작은 noise 가 $\Delta t$ 로 나뉘어 크게 튀고, 그대로
        motor 에 들어가면 torque 가 떨린다. low-pass filter 는 이 빠른 오르내림을 줄이는 대신 반응을 늦춘다. 오차를 쌓는 것은 I 항이고, D 항은
        측정한 값의 변화로 계산하므로 측정 noise 와 직접 관계있다.
    - question: |
        속도 추정에 쓰는 low-pass filter 를 더 강하게(더 많이 평활하게) 설정했다. controller 입장에서 생길 수 있는 문제는 무엇인가?
      choices:
        - 'filter 를 강하게 걸수록 남은 noise 가 한데 모여서 속도 값이 오히려 더 심하게 튄다'
        - 'filter 가 encoder 의 칸 크기를 키워서 각도를 재는 해상도가 낮아진다'
        - '추정한 속도가 실제보다 늦게 변해서, 이 값으로 계산한 제어가 늦게 반응하고 흔들릴 수 있다'
        - 'filter 가 값을 계속 평균하는 동안 속도에 일정한 bias 가 생겨 시간이 갈수록 커진다'
      answer: 2
      explanation: |
        low-pass filter 는 빠르게 오르내리는 값을 줄이는 만큼 실제 변화도 늦게 보여 준다. filter 가 강할수록 noise 는 줄지만 지연이 커지고,
        늦은 속도 값으로 힘을 정하면 controller 가 이미 지나간 상황에 반응해 흔들릴 수 있다. 그래서 noise 와 지연 사이에서 알맞은 정도를 고른다.
        filter 는 값을 더 매끄럽게 만들 뿐 더 튀게 하지 않고, encoder 해상도는 하드웨어가 정하며, 쌓이는 bias 는 적분의 문제다.

- topic: integration-drift
  title: 적분과 drift
  variants:
    - question: |
        IMU 의 gyro 값을 적분해 로봇의 방향을 구하면, 로봇이 멈춰 있어도 방향 값이 계속 한쪽으로 흘러간다. 그 이유는 무엇인가?
      choices:
        - 'gyro 의 bias(늘 한쪽으로 치우친 작은 오차)가 적분하면서 시간에 비례해 쌓이기 때문이다'
        - '적분은 매번 noise 를 $\Delta t$ 로 나눠 키우므로, 멈춰 있어도 값이 크게 흔들리기 때문이다'
        - 'gyro 는 각도를 직접 재는 센서라서 적분할 필요가 없는데, 한 번 더 적분했기 때문이다'
        - '로봇이 멈춰 있으면 gyro 가 꺼져서 마지막으로 잰 속도가 계속 더해지기 때문이다'
      answer: 0
      explanation: |
        gyro 는 회전 속도를 재므로 방향을 알려면 적분해야 한다. 멈춰 있어도 0.1 °/s 같은 bias 가 있으면 매번 같은 쪽으로 더해져 1 분에 6° 처럼
        시간에 비례해 쌓이는데, 이것을 drift 라고 한다. noise 를 $\Delta t$ 로 나눠 키우는 것은 미분이고, 적분에서는 오르내리는 noise 가 서로 상쇄된다. 멈춰 있어도 gyro 는 꺼지지 않고 계속 값을 낸다.
    - question: |
        멈춰 있는 로봇의 gyro 에 0.1 °/s 의 bias 와 0.5 °/s 크기의 무작위 noise 가 함께 있다. 1초에 100 번 읽어 60 초 동안 적분하면, 방향 오차에 더 크게 기여하는 쪽은?
      choices:
        - 'noise. 크기가 bias 의 다섯 배라서, 60 초 동안 적분해 쌓인 방향 오차도 다섯 배가 된다'
        - '둘이 같다. 적분하면 bias 든 noise 든 모든 오차가 시간에 비례해 쌓인다'
        - 'bias. 매번 같은 쪽으로 더해져 6° 가 쌓이고, noise 는 서로 상쇄되어 0.4° 정도다'
        - '둘 다 작다. 적분은 오차를 평균 내므로 bias 와 noise 가 모두 지워진다'
      answer: 2
      explanation: |
        bias 는 $0.1 \times 60 = 6°$ 로 시간에 비례해 쌓인다. noise 는 더해질 때마다 방향이 달라 서로 상쇄되어, 6000 번 더한 합이 6000 배가 아니라
        $\sqrt{6000}$ 배 정도로만 커진다($0.5 \times 0.01 \times \sqrt{6000} \approx 0.39°$). 그래서 noise 가 다섯 배 커도 적분한 결과에서는 bias
        가 훨씬 크다. 적분은 noise 를 줄이지만 bias 를 지우지는 못한다.
    - question: |
        가속도계 값을 두 번 적분해 위치를 구하면, 가속도의 작은 bias 가 위치 오차로 어떻게 커지는가?
      choices:
        - '적분해도 bias 크기는 그대로라, 위치 오차도 시간과 상관없이 일정하다'
        - '시간의 제곱에 비례해 커져서, 짧은 시간에도 위치가 크게 어긋난다'
        - '한 번 적분하면 시간에 비례해 커지지만, 두 번째 적분에서 다시 상쇄된다'
        - '적분은 오차를 평균 내므로, 시간이 갈수록 위치 오차가 점점 줄어든다'
      answer: 1
      explanation: |
        가속도의 bias 를 한 번 적분하면 속도 오차가 시간에 비례해 커지고, 그 속도 오차를 다시 적분하면 위치 오차는 시간의 제곱에 비례한다.
        그래서 IMU 혼자서는 오래 위치를 낼 수 없고, GPS 나 바퀴 odometry 같은 다른 센서와 합쳐 drift 를 바로잡는다. bias 는 같은 쪽으로 쌓이므로
        상쇄되거나 줄지 않는다.

- topic: chain-rule
  title: chain rule
  variants:
    - question: |
        감속비 100:1 인 gear 로 motor 가 관절을 돌린다. 관절을 1 rad 돌릴 때 손끝 높이는 0.3 m 변한다. motor 를 1 rad 돌리면 손끝 높이는 대략 얼마나 변할까?
      choices:
        - '30 m. 관절 1 rad 당 0.3 m 에 감속비 100 을 곱해 motor 쪽 변화율을 구한다'
        - '0.3 m. gear 는 힘만 바꾸고 돌아가는 각도는 바꾸지 않아서 비율이 그대로다'
        - '0.003 m. motor 1 rad 에 관절이 0.01 rad 돌므로 0.3 × 0.01 이다'
        - '0.31 m. 두 단계의 변화율 0.3 과 0.01 을 더해 처음과 끝 사이의 변화율로 쓴다'
      answer: 2
      explanation: |
        변화가 motor → 관절 → 손끝으로 단계를 거쳐 전해지므로 chain rule 로 단계마다의 변화율을 곱한다. motor 1 rad 에 관절은 $1 \div 100 = 0.01$
        rad 돌고, 관절 1 rad 당 손끝이 0.3 m 변하므로 $0.3 \times 0.01 = 0.003$ m 다. 100 을 곱하면 감속비를 거꾸로 쓴 것이고, gear 를 무시하면
        0.3 m 가 되며, 단계마다의 변화율은 더하지 않고 곱한다.
    - question: |
        neural network 의 backpropagation 이 chain rule 이라고 하는데, chain rule 이 말하는 것은 무엇인가?
      choices:
        - '여러 함수가 이어져 있으면 각 함수의 derivative 를 모두 더한 값이 전체의 derivative 다'
        - '맨 마지막 층의 derivative 만 구하면, 앞의 층들은 그 값을 그대로 물려받아 쓴다'
        - '함수를 여러 번 이어 미분하면 결국 0 이 되므로, 단계가 많으면 변화율도 0 이다'
        - '변화가 여러 단계를 거쳐 전해질 때, 처음과 끝 사이의 변화율은 단계마다의 변화율을 곱한 값이다'
      answer: 3
      explanation: |
        $y$ 가 $u$ 에, $u$ 가 $x$ 에 달려 있으면 $\frac{dy}{dx} = \frac{dy}{du} \times \frac{du}{dx}$ 다. backpropagation 은 loss 에서 출발해 층마다의
        변화율을 곱해 가며 앞 층 weight 의 gradient 를 구한다. 변화율은 더하지 않고 곱하며, 층마다 값이 달라서 마지막 층의 값을 그대로 쓸 수 없다. 같은 함수를 거듭
        미분하는 것이 아니라 단계마다 한 번씩 미분해 곱하므로, 단계가 많다고 변화율이 0 이 되지도 않는다.
    - question: |
        길이 0.5 m 인 link 가 관절에 달려 있고 손끝 높이는 $0.5\sin\theta$ 다. 관절 속도가 같을 때, 손끝 높이가 가장 빨리 변하는 자세와 전혀 변하지 않는 자세는?
      choices:
        - '수평($\theta = 0°$)에서 가장 빨리 변하고, 똑바로 선 자세($\theta = 90°$)에서는 높이가 변하지 않는다'
        - '똑바로 선 자세($\theta = 90°$)에서 가장 빨리 변하고, 수평($\theta = 0°$)에서는 높이가 변하지 않는다'
        - 'link 길이 0.5 m 가 일정하므로, 관절 속도가 같으면 모든 자세에서 같은 빠르기로 변한다'
        - '45° 에서 가장 빨리 변하고, 수평과 똑바로 선 자세에서는 높이가 변하지 않는다'
      answer: 0
      explanation: |
        손끝 높이의 변화율은 $\frac{dy}{d\theta} = 0.5\cos\theta$ 다. 수평에서는 $\cos 0° = 1$ 이라 0.5 m/rad 로 가장 크고, 똑바로 선 자세에서는
        $\cos 90° = 0$ 이라 손끝이 옆으로만 움직이고 높이는 변하지 않는다. 그래서 같은 관절 속도라도 자세에 따라 손끝 높이가 변하는 빠르기가 다르다.

- topic: gradient
  title: partial derivative 와 gradient
  variants:
    - question: |
        어떤 함수의 gradient 가 지금 점에서 $(-0.2, -0.1)$ 이다. 이 함수를 가장 빨리 줄이려면 두 변수를 어떻게 바꿔야 하는가?
      choices:
        - '두 변수를 모두 줄인다. gradient 의 두 칸이 음수라서 그 방향으로 가면 값이 준다'
        - '두 변수를 모두 키운다. gradient 의 반대 방향이 가장 빨리 줄어드는 방향이다'
        - '첫째 변수만 키운다. 둘째 칸은 첫째의 절반이라 무시해도 결과가 거의 같다'
        - '두 변수를 그대로 둔다. gradient 가 음수면 이미 가장 낮은 점에 와 있다'
      answer: 1
      explanation: |
        gradient 는 함수가 가장 빨리 커지는 방향을 가리키므로, 줄이려면 그 반대 $(0.2, 0.1)$ 쪽으로 간다. 두 칸이 모두 음수라 두 변수를 키우면 값이
        준다. 크기가 작은 칸도 같은 방향으로 기여하므로 무시하지 않으며, 가장 낮은 점에서는 gradient 가 음수가 아니라 0 이다.
    - question: |
        partial derivative $\frac{\partial D}{\partial \theta_1}$ 을 숫자로 재는 방법은 무엇인가?
      choices:
        - '$\theta_2$ 는 그대로 두고 $\theta_1$ 만 조금 바꿔, $D$ 가 변한 양을 바꾼 양으로 나눈다'
        - '$\theta_1$ 과 $\theta_2$ 를 똑같이 조금 바꿔, $D$ 가 변한 양을 바꾼 양으로 나눈다'
        - '$\theta_1$ 을 0 으로 두고 계산한 $D$ 와 지금 $D$ 의 차이를 구한다'
        - '$\theta_1$ 을 크게 바꿔 가며 $D$ 가 가장 작아지는 $\theta_1$ 값을 찾는다'
      answer: 0
      explanation: |
        partial derivative 는 다른 변수를 고정하고 하나만 바꿨을 때의 변화율이다. 둘을 함께 바꾸면 어느 쪽 때문에 $D$ 가 변했는지 알 수 없다.
        변수를 0 으로 두거나 크게 바꿔 최솟값을 찾는 것은 변화율을 재는 방법이 아니다. $\partial$ 기호가 "다른 값은 고정했다" 는 표시다.
    - question: |
        gradient descent 에서 step 크기 $\alpha$ 를 너무 크게 잡으면 어떻게 되는가?
      choices:
        - '한 번에 크게 움직여 가장 낮은 점에 바로 도착하므로, step 은 클수록 좋다'
        - 'step 이 크면 gradient 의 부호가 뒤집혀서 계속 오르막 쪽으로만 간다'
        - 'gradient 에 큰 $\alpha$ 를 곱하면 gradient 가 0 이 되어 더 움직이지 않는다'
        - 'gradient 는 지금 점의 기울기라서, 너무 멀리 가면 가장 낮은 점을 지나쳐 값이 커질 수 있다'
      answer: 3
      explanation: |
        gradient 는 지금 자리에서 어느 쪽이 내리막인지만 알려 준다. 함수가 휘어 있어서 그 방향으로 너무 멀리 가면 가장 낮은 점을 지나쳐 처음보다
        나빠질 수 있다. 2 관절 팔 예에서 $\alpha = 0.5$ 는 거리를 0.141 m 에서 0.060 m 로 줄였지만 $\alpha = 2$ 는 0.222 m 로 오히려 늘렸다.
        방향 자체는 그대로 내리막이고, gradient 는 $\alpha$ 와 상관없이 그 점의 값이다.

- topic: jacobian
  title: Jacobian 과 선형 근사
  variants:
    - question: |
        2 관절 팔의 Jacobian 은 무엇인가?
      choices:
        - '손끝이 가야 할 위치를 넣으면 필요한 관절 각도를 바로 구해 주는 공식이다'
        - '관절마다 motor 가 낼 수 있는 최대 torque 를 모아, 손끝 힘의 한계를 보는 표다'
        - '손끝과 목표 사이 거리를 관절 각도로 미분한 vector 로, 줄이는 방향을 가리킨다'
        - '손끝 $x$, $y$ 를 관절 각도마다 편미분해 모은 행렬로, 관절 속도를 손끝 속도로 바꾼다'
      answer: 3
      explanation: |
        Jacobian 은 결과(손끝 $x$, $y$)를 행으로, 변수(관절 각도)를 열로 해서 partial derivative 를 늘어놓은 행렬이다. 열 하나는 그 관절만 돌 때
        손끝이 움직이는 속도이고, $\dot{\mathbf p} = J\dot{\mathbf q}$ 로 관절 속도를 손끝 속도로 바꾼다. 손끝에서 관절 각도를 구하는 것은 IK 이고,
        값 하나(거리)를 미분한 vector 는 gradient 다. motor 의 torque 한계와는 관계없다.
    - question: |
        어떤 자세에서 $J = \begin{bmatrix} -0.5 & -0.5 \\ 0.5 & 0 \end{bmatrix}$ 이다. 관절 속도가 $(0.2, 0.1)$ rad/s 일 때 손끝 속도는?
      choices:
        - '$(-0.1, 0.1)$ m/s. 첫째 관절이 팔 전체를 돌리므로 첫째 열만 곱하면 된다'
        - '$(-0.15, 0.1)$ m/s. 첫째 열에 0.2, 둘째 열에 0.1 을 곱해 더한다'
        - '$(-0.1, 0)$ m/s. 대각선 칸 −0.5 와 0 에 관절 속도 0.2 와 0.1 을 각각 곱한다'
        - '$(0.3, 0)$ m/s. 두 관절 속도를 더한 0.3 이 그대로 손끝 속도가 된다'
      answer: 1
      explanation: |
        손끝 속도는 각 열에 그 관절의 속도를 곱해 더한 $0.2 \times (-0.5, 0.5) + 0.1 \times (-0.5, 0) = (-0.1, 0.1) + (-0.05, 0) = (-0.15, 0.1)$
        m/s 다. 첫째 관절만 보면 둘째 관절의 몫 $(-0.05, 0)$ 이 빠지고, 대각선 칸에만 관절 속도를 곱하면 다른 칸의 몫이 빠져 행렬 곱이 아니며, 관절 속도의 합은 손끝
        속도가 아니다.
    - question: |
        $\Delta\mathbf p \approx J\,\Delta\mathbf q$ 는 왜 근사이고, 언제 잘 맞는가?
      choices:
        - '센서 noise 때문에 근사일 뿐이고, noise 가 없는 이상적인 센서라면 관절을 얼마나 돌리든 정확하다'
        - 'Jacobian 을 숫자로 재서 근사일 뿐이고, 식으로 미분해 구하면 언제나 정확하다'
        - '손끝은 휘어 가는데 Jacobian 은 지금 방향으로 곧게 간다고 보는 선형 근사라, 작게 돌릴 때 잘 맞는다'
        - '관절을 크게 돌릴수록 앞뒤 구간의 오차가 서로 상쇄되어, 큰 움직임에서 더 잘 맞는다'
      answer: 2
      explanation: |
        Jacobian 은 지금 자세에서의 변화율이라 휘어진 움직임을 한 점 근처에서 직선으로 바꿔 본 선형 근사(first-order Taylor)다. 움직임이 작을 때만
        잘 맞고, 움직임을 10 배 키우면 오차는 약 100 배가 된다. 그래서 IK 는 작은 step 을 되풀이하고, EKF 는 매 step 지금 추정값에서 Jacobian 을
        다시 구한다. noise 나 계산 방법과 관계없이 생기는 오차이고, 크게 돌릴수록 커진다.
