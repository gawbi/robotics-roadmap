# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: pipeline
  title: module 여섯 개의 입력과 출력
  variants:
    - question: |
        물체를 집어 옮기는 classical pick-and-place pipeline 에서 IK module 이 받는 것과 내는 것은?
      choices:
        - '카메라 사진을 받아 물체 가운데의 pixel 을 낸다'
        - 'waypoint 마다의 손끝 pose 를 받아 그 자세의 joint angle 을 낸다'
        - 'joint angle 을 받아 시간마다의 목표 각도 목록을 낸다'
        - 'pixel 과 depth 를 받아 base frame 의 3D 좌표를 낸다'
      answer: 1
      explanation: |
        IK(inverse kinematics)는 손끝의 pose 에서 거꾸로 관절 각도를 구하는 계산이라서, 잡기 자세 module 이 정한 waypoint 를 받아
        waypoint 마다 joint angle 을 낸다. 사진에서 pixel 을 내는 것은 인식 module, 시간마다의 목표 각도를 만드는 것은 경로
        module, pixel 과 depth 로 3D 좌표를 구하는 것은 3D 위치 module 이다.
    - question: |
        일을 여러 module 로 나누고 module 마다 입력과 출력을 분명히 정해 두면 얻는 가장 큰 이점은?
      choices:
        - 'module 을 나누면 전체 계산이 더 빨라진다'
        - 'module 을 나누면 사람이 정해야 할 숫자와 규칙이 없어진다'
        - '앞 module 의 오차를 뒤 module 이 알아서 바로잡아 준다'
        - '각 module 의 출력을 따로 확인할 수 있어서, 실패했을 때 어느 단계가 틀렸는지 찾을 수 있다'
      answer: 3
      explanation: |
        module 마다 중간 값이 있으니 pixel 이 맞는지, 계산한 높이가 맞는지, IK 답이 joint limit 안인지를 하나씩 따로 확인할 수
        있고, 이것이 고장 진단을 쉽게 한다. 나눈다고 계산이 빨라지는 것은 아니고, 오히려 모든 module 에 사람이 정한 숫자가
        들어간다. 뒤 module 은 앞 module 의 오차를 알 방법이 없어서 오차는 바로잡히지 않고 그대로 넘어간다.
    - question: |
        앞 module 의 출력이 바로 다음 module 의 입력이 되도록 pick-and-place 의 module 을 순서대로 놓은 것은?
      choices:
        - '인식 → 3D 위치 → 잡기 자세 → IK → 경로 → 실행'
        - '인식 → IK → 3D 위치 → 경로 → 잡기 자세 → 실행'
        - '3D 위치 → 인식 → 경로 → IK → 잡기 자세 → 실행'
        - '인식 → 경로 → 3D 위치 → 잡기 자세 → IK → 실행'
      answer: 0
      explanation: |
        사진에서 물체의 pixel 을 찾아야(인식) 그것을 실제 좌표로 바꿀 수 있고(3D 위치), 좌표가 있어야 쥘 자세와 거쳐 갈
        waypoint 를 정한다(잡기 자세). waypoint 의 손끝 pose 를 joint angle 로 바꾸고(IK), 그 사이를 시간에 따라 잇고(경로),
        마지막에 모터로 보낸다(실행). 다른 순서들은 IK 가 좌표보다 먼저 오거나 인식 전에 3D 위치를 구하는 식이라 앞 단계의
        출력이 아직 없는 값을 입력으로 요구한다.

- topic: color-mask
  title: 색 mask 와 이름으로 찾는 인식기
  variants:
    - question: |
        빨간 물체를 "R 값이 일정 문턱 이상인 pixel" 로 고르면 그늘진 부분을 놓친다. 대신 빨강의 몫 R ÷ (R + G + B) 이나 HSV 의
        hue 로 고르면 나아지는 이유는?
      choices:
        - '비율은 계산이 빨라서 더 많은 pixel 을 검사할 수 있기 때문이다'
        - '그늘에서는 R 만 줄고 G, B 는 그대로이기 때문이다'
        - '조명이 어두워지면 R·G·B 가 거의 같은 비율로 함께 줄어서, 숫자는 작아져도 색의 몫(hue)은 거의 그대로이기 때문이다'
        - '비율로 고르면 문턱을 사람이 정할 필요가 없어지기 때문이다'
      answer: 2
      explanation: |
        밝기가 반이 되면 R, G, B 가 모두 거의 반이 되므로 R 하나의 크기는 크게 바뀌지만 세 숫자 가운데 빨강이 차지하는 몫은
        그대로다. 그래서 색의 종류(hue)로 고르면 조명에 덜 흔들린다. 그늘에서 R 만 준다는 것은 사실과 다르고, 계산 속도는 이
        문제와 관계가 없다. 비율 규칙에도 "몫이 얼마 이상" 이라는 문턱이 있고 그것도 사람이 정한다.
    - question: |
        색 규칙으로 물체에 해당하는 pixel 을 1 로 적은 mask 를 만들고, 1 인 칸들의 평균 위치(centroid)를 물체 가운데로 쓴다.
        그늘 때문에 물체의 한쪽 귀퉁이 칸들이 mask 에서 빠졌다면 centroid 는?
      choices:
        - '빠진 귀퉁이의 반대쪽으로 밀린다'
        - '빠진 귀퉁이 쪽으로 밀린다'
        - '칸 수만 줄고 centroid 는 그대로다'
        - 'centroid 는 가장 밝은 칸의 위치라서 영향을 받지 않는다'
      answer: 0
      explanation: |
        centroid 는 남은 칸들의 $u$ 끼리, $v$ 끼리 평균이다. 한쪽 귀퉁이가 빠지면 그쪽 칸이 평균에 들어가지 않으니 평균이
        남은 칸들 쪽, 곧 빠진 귀퉁이의 반대쪽으로 밀린다. 대칭으로 빠지지 않는 한 위치는 바뀌고, 많이 빠질수록 크게 밀린다.
        centroid 는 밝기가 아니라 고른 칸들의 위치로 정해진다.
    - question: |
        색 규칙 대신, 사진과 물체 이름("red cube" 같은)을 넣으면 bounding box 와 점수를 내는 open-vocabulary 인식기로 첫 module 을
        바꿨다. 옳은 설명은?
      choices:
        - 'bounding box 로 물체까지의 거리도 함께 알 수 있다'
        - 'bounding box 가 물체가 돌아간 각도(yaw)를 알려 준다'
        - '사람이 정해야 하는 문턱이 하나도 남지 않는다'
        - '물체를 바꿀 때 색 문턱 대신 이름만 바꾸면 되지만, 여전히 사진 속 칸 번호만 주므로 거리는 따로 구해야 한다'
      answer: 3
      explanation: |
        이 인식기는 아무 이름이나 받을 수 있어서 물체가 바뀌면 이름만 바꾸면 되고, box 가운데를 물체의 pixel 로 쓰면 뒤 module 은
        그대로 쓸 수 있다. 그러나 출력은 사진 속 칸 번호라서 depth 는 여전히 모른다. bounding box 는 언제나 사진의 가로세로에
        맞춘 직사각형이라 yaw 도 알려 주지 않고, "점수가 얼마를 넘는 box 만 믿는다" 같은 문턱은 여전히 사람이 정한다.

- topic: depth
  title: depth 가 필요한 이유와 back-projection
  variants:
    - question: |
        팔의 움직임을 계획하는 module 이 물체의 pixel 좌표가 아니라 로봇 기준의 m 단위 3D 좌표를 받아야 하는 이유는?
      choices:
        - '"사진 가운데에서 몇 칸" 이 실제로 몇 cm 인지는 카메라에서 물체까지의 거리에 따라 달라서, 손을 보낼 실제 위치와 높이를 알려면 m 단위 좌표가 필요하기 때문이다'
        - 'pixel 좌표는 정수라서 계산에 넣을 수 없기 때문이다'
        - 'm 단위 좌표가 pixel 좌표보다 계산이 빠르기 때문이다'
        - 'pixel 좌표는 사진을 찍을 때마다 원점이 바뀌기 때문이다'
      answer: 0
      explanation: |
        gripper 를 물체 위 몇 cm 에 세우고 관절 각도를 구하려면 손끝이 로봇에서 실제로 몇 m 떨어져야 하는지 알아야 한다. 같은
        "100 칸" 도 가까운 물체에서는 짧고 먼 물체에서는 긴 거리라서 pixel 만으로는 실제 위치가 정해지지 않는다. pixel 이 정수인
        것이나 계산 속도는 문제가 아니고, pixel 좌표의 원점은 언제나 사진의 왼쪽 위로 정해져 있다.
    - question: |
        카메라 한 대로 찍은 사진의 pixel 하나만으로는 그 물체의 3D 위치가 하나로 정해지지 않는다. 그 이유는?
      choices:
        - '사진의 해상도가 낮아서 pixel 하나가 너무 넓은 영역을 덮기 때문이다'
        - 'pixel 에는 색만 있고 방향 정보가 전혀 없기 때문이다'
        - '렌즈 중심에서 뻗은 한 ray 위의 점은 거리와 상관없이 모두 같은 pixel 에 찍혀서, pixel 은 방향만 정하고 depth 는 알려 주지 않기 때문이다'
        - '렌즈 왜곡 때문에 pixel 위치가 매번 달라지기 때문이다'
      answer: 2
      explanation: |
        카메라 앞 1 m 의 점과 그 두 배 거리에서 같은 방향에 있는 점은 같은 ray 위에 있어서 같은 pixel 에 찍힌다. 그래서 pixel
        은 "이 방향에 무언가 있다" 는 것만 알려 주고, 거리(depth)를 depth camera 로 재거나 물체가 놓인 높이를 가정해 채워야
        한다. pixel 은 방향을 정해 주므로 방향 정보가 없다는 말은 틀렸다. 해상도나 렌즈 왜곡은 정밀도의 문제일 뿐, depth 가
        빠진 문제를 만드는 원인이 아니다.
    - question: |
        back-projection $X = (u - c_x)\,Z / f_x$ 로 pixel 과 depth $Z$ 에서 camera frame 의 점을 구한다. 물체가 사진 가운데에서
        옆으로 떨어진 pixel 에 찍혔는데 depth 를 실제보다 조금 크게 잘못 쟀다면?
      choices:
        - '앞쪽 거리 $Z$ 만 틀리고 가로 위치 $X$ 는 그대로다'
        - '$X$ 도 같은 비율로 커진다. pixel 이 정한 방향에 depth 를 곱해 점을 구하므로 depth 오차가 가로 위치에도 섞인다'
        - 'depth 가 클수록 $X$ 는 작아진다'
        - 'depth 는 $X$ 계산에 쓰이지 않는다'
      answer: 1
      explanation: |
        식에서 $X$ 는 $Z$ 에 비례한다. pixel 은 방향 $(u - c_x)/f_x$ 를 정하고 그 방향을 depth 만큼 늘린 것이 점이라서, depth 가
        틀리면 가로 위치도 같은 비율로 틀린다. 그래서 depth 오차가 높이에만 머문다는 생각은 오해다. $X$ 가 $Z$ 에 반비례한다는
        보기는 식을 거꾸로 읽은 것이다. 다만 물체가 사진 정가운데($u = c_x$)에 찍히면 $X$ 가 0 이라 depth 와 상관없이 그대로다.

- topic: base-frame
  title: base frame 변환과 높이 가정
  variants:
    - question: |
        camera frame 에서 구한 물체 좌표를 로봇이 쓰려면 로봇 몸통 기준의 base frame 좌표로 바꿔야 한다. 이 변환에 꼭 필요한
        정보는?
      choices:
        - '카메라의 focal length 와 principal point'
        - '물체의 색과 크기'
        - '로봇 관절의 현재 각도'
        - '카메라가 base 의 어디에 어느 방향으로 달렸는지(extrinsics). 카메라를 단 뒤 calibration 으로 잰다'
      answer: 3
      explanation: |
        camera frame 좌표는 카메라에서 본 위치라서, 카메라가 로봇 기준으로 어디에 어느 방향으로 있는지 알아야 축을 맞추고
        위치를 더해 base frame 좌표로 옮길 수 있다. 이 정보가 extrinsics 이고 calibration 으로 잰다. focal length 와 principal
        point 는 pixel 과 camera frame 을 잇는 intrinsics 라서 이미 앞 단계에서 썼다. 물체의 색이나 관절 각도는 고정된 카메라의
        좌표 변환과 관계가 없다.
    - question: |
        depth camera 없이 일반 카메라 한 대로 물체의 3D 위치를 구하려 한다. 물체가 언제나 책상 위에 놓인다는 사실을 쓰는 방법은?
      choices:
        - '사진 속 물체의 크기로 depth 를 정확히 알아낸다'
        - '물체 pixel 의 ray 가 이미 아는 물체 윗면 높이의 평면과 만나는 점을 물체 위치로 삼는다'
        - 'pixel 좌표에 일정한 수를 곱해 그대로 m 로 바꾼다'
        - '같은 사진을 두 번 찍어 평균한다'
      answer: 1
      explanation: |
        ray 위의 점은 모두 같은 pixel 에 찍히지만 그 가운데 높이가 물체 윗면 높이인 점은 하나뿐이다. 그래서 높이를 미리 알면
        ray 와 그 높이의 평면이 만나는 점으로 빠진 depth 를 채울 수 있다. pixel 에 일정한 수를 곱하는 것은 거리에 따라 칸의
        실제 크기가 달라진다는 사실을 무시한다. 같은 자리에서 두 번 찍어도 같은 ray 라서 depth 정보가 생기지 않는다.
    - question: |
        "물체 윗면은 언제나 책상에서 일정한 높이" 라고 가정해 ray 와 평면의 교점으로 위치를 구하는 pipeline 이 있다. 누군가
        물체를 두꺼운 책 위에 올려 두었다면?
      choices:
        - '수평 위치는 정확하고 높이만 틀린다'
        - 'pipeline 이 높이가 달라진 것을 알아채고 멈춘다'
        - 'ray 를 따라 가정한 높이까지 더 내려간 점을 물체로 착각해서, 높이뿐 아니라 수평 위치도 틀리고 gripper 가 물체를 위에서 누르게 된다'
        - 'ray 위의 점은 모두 같은 pixel 에 찍히므로 아무 영향이 없다'
      answer: 2
      explanation: |
        실제 윗면은 더 높은데 pipeline 은 같은 ray 를 가정한 낮은 높이까지 따라가 그 점을 물체라고 낸다. ray 가 비스듬하면 더
        내려간 만큼 수평으로도 옮겨 가므로 수평 위치까지 틀린다. pipeline 에는 가정이 틀렸음을 알아챌 정보가 없어서 그대로
        진행하고, gripper 는 실제 윗면보다 아래로 내려가려다 물체를 누른다. 같은 pixel 에 찍힌다는 사실이 바로 이 착각의
        원인이다. depth camera 는 depth 를 직접 재므로 이런 일이 없다.

- topic: grasp-yaw
  title: top-down grasp 와 waypoint
  variants:
    - question: |
        위에서 내려다본 정육면체의 회전 각도(yaw)를 90° 주기로 다루는 이유는?
      choices:
        - '카메라가 90° 단위로만 각도를 잴 수 있기 때문이다'
        - 'gripper 의 손목이 90° 단위로만 돌 수 있기 때문이다'
        - '정사각형 윗면은 90° 돌려도 모양이 같아 사진으로 그 차이를 가릴 수 없고, 어느 후보로 쥐어도 마주 보는 두 옆면을 쥘 수 있기 때문이다'
        - 'yaw 오차를 크게 보이게 해서 인식을 엄격하게 평가하기 위해서다'
      answer: 2
      explanation: |
        정사각형은 90° 돌려도 같은 모양이라 yaw 가 어떤 각도인 물체와 거기서 90° 더 돈 물체는 위에서 보면 똑같다. 그래서 오차를
        잴 때도 90° 를 더하거나 빼 가장 가까운 값으로 비교해야 하고, 그러지 않으면 정확한 인식이 크게 틀린 것처럼 보인다.
        카메라나 손목이 90° 단위로만 움직이는 것은 아니다.
    - question: |
        정육면체를 쥘 수 있는 손가락 방향의 후보가 90° 간격으로 여러 개 있다. 그 가운데 하나를 고르는 규칙으로 알맞은 것은?
      choices:
        - '언제나 0° 에 가장 가까운 후보를 고른다'
        - '후보 가운데 가장 큰 각도를 고른다'
        - '아무 후보나 무작위로 고른다'
        - 'joint limit 안에 있고 지금 손목 회전 각도에 가장 가까운 후보를 골라 손목을 가장 조금 돌린다'
      answer: 3
      explanation: |
        네 후보 모두 물체를 쥘 수 있으므로, 관절이 돌 수 있는 범위(joint limit) 안에서 지금 손목 각도와 가장 가까운 것을 고르면
        손목을 가장 적게 돌린다. 0° 기준은 지금 손목이 0° 일 때만 같은 결과를 내고, 손목이 다른 각도에 있으면 쓸데없이 많이
        돌린다. 가장 큰 각도나 무작위 선택은 joint limit 을 넘거나 크게 돌 수 있다.
    - question: |
        grasp pose 로 팔을 바로 보내지 않고, 물체 바로 위의 pre-grasp 자세에서 먼저 멈춘 뒤 수직으로 내려가게 하는 이유는?
      choices:
        - '비스듬히 다가가면 손가락이 물체를 옆에서 밀어낼 수 있어서, 위에서 멈춘 뒤 수직으로 내려가게 한다'
        - 'pre-grasp 에서 카메라가 사진을 다시 찍어야 하기 때문이다'
        - 'IK 가 높은 자리에서만 풀리기 때문이다'
        - '모터를 식히려고 잠시 멈추는 것이다'
      answer: 0
      explanation: |
        팔을 grasp pose 로 곧장 보내면 손이 옆에서 비스듬히 다가가다 손가락으로 물체를 칠 수 있다. 그래서 물체 위에 먼저 멈추고
        수직으로 내려가 쥐며, 쥔 뒤에도 lift 로 수직으로 올라온다. 이 waypoint 들은 경로 모양을 정하려고 사람이 둔 자세이지
        사진을 다시 찍거나 모터를 식히려는 것이 아니다. IK 는 팔이 닿는 자리라면 높이와 상관없이 풀린다.

- topic: ik
  title: waypoint 의 joint angle
  variants:
    - question: |
        위팔과 아래팔 두 마디로 손목을 목표 자리에 보내는 팔이 있다. IK 를 풀기 전에 먼저 확인할 것은?
      choices:
        - '어깨에서 손목 목표까지의 거리가 두 마디 길이의 합을 넘지 않는지. 넘으면 팔을 다 펴도 닿지 않아 답이 없다'
        - '목표가 카메라 사진의 가운데에 찍히는지'
        - '두 마디의 길이가 같은지'
        - '목표가 어깨보다 높은 곳에 있는지'
      answer: 0
      explanation: |
        두 마디를 일직선으로 펴도 어깨에서 손목까지는 두 길이의 합만큼만 닿으므로, 목표가 그보다 멀면 어떤 각도로도 갈 수 없다.
        이때 IK module 은 실패를 알리고 사람이 놓을 자리나 waypoint 높이를 바꿔야 한다. 사진 속 위치는 IK 와 관계가 없고, 두
        마디의 길이가 달라도 IK 는 풀린다. 어깨보다 낮은 목표도 닿기만 하면 답이 있다.
    - question: |
        같은 손목 위치에 대해 팔꿈치를 위로 꺾는 답과 아래로 꺾는 답처럼 IK 의 답이 여럿 나왔다. 어떻게 고르는 것이 알맞을까?
      choices:
        - 'IK 의 답은 언제나 하나뿐이라 고를 필요가 없다'
        - 'joint limit 안의 답 가운데 앞 waypoint 의 joint angle 에 가까운 답을 고른다. 그러지 않으면 waypoint 사이에서 팔이 크게 뒤집힌다'
        - '손목 위치는 어느 답이든 같으니 waypoint 마다 무작위로 골라도 된다'
        - '식에서 먼저 계산된 답을 늘 고른다'
      answer: 1
      explanation: |
        두 마디 팔은 같은 손목 위치에 팔꿈치를 위로 꺾은 자세와 아래로 꺾은 자세 두 답이 생기는 일이 흔하다. 손목 위치는 같아도
        waypoint 마다 다른 답을 고르면 그 사이를 잇는 동안 팔이 크게 뒤집혀 주변을 칠 수 있다. 그래서 움직일 수 있는 범위 안에서
        바로 앞 자세와 가까운 답을 고른다. "먼저 나온 답" 은 앞 자세를 고려하지 않으므로 같은 문제가 생길 수 있다.
    - question: |
        gripper 를 언제나 수직 아래로 향하게 하는 top-down grasp 에서는 IK 문제가 어떻게 단순해질까?
      choices:
        - 'IK 를 풀 필요가 없어진다'
        - '모든 관절이 0° 가 된다'
        - '좌우로 도는 관절 하나만 풀면 된다'
        - '손목이 손끝 바로 위에 정해지므로 위팔과 아래팔로 그 손목 위치를 맞추는 2 관절 문제가 되고, 손목 관절은 gripper 가 수직이 되도록 남은 각도를 채운다'
      answer: 3
      explanation: |
        gripper 방향이 수직 아래로 정해지면 손목은 손끝에서 손목-손끝 길이만큼 바로 위에 있어야 한다. 그러면 위팔·아래팔로 손목을
        그 자리에 보내는 두 관절 문제만 풀면 되고, 손목 관절 각도는 "수직 방향 − 위팔과 아래팔 방향의 합" 으로 정해진다. 그래도
        IK 는 풀어야 하고, 관절 각도가 모두 0° 가 되지는 않는다. 좌우 회전 관절은 물체 방향만 맞출 뿐 높이와 거리는 정하지 못한다.

- topic: trajectory
  title: minimum-jerk 경로와 휘는 손끝
  variants:
    - question: |
        두 waypoint 의 joint angle 사이를 minimum-jerk trajectory 로 잇는 이유는?
      choices:
        - '가능한 가장 짧은 시간에 도착하기 위해서다'
        - '손끝이 언제나 곧은 선으로 움직이게 하기 위해서다'
        - 'IK 를 풀지 않아도 되게 하기 위해서다'
        - '각도를 한순간에 바꾸면 모터가 갑자기 큰 힘을 내 팔이 튀므로, 출발과 도착에서 속도와 가속도가 0 인 부드러운 목표 목록을 만들기 위해서다'
      answer: 3
      explanation: |
        minimum-jerk trajectory 는 걸리는 시간 $T$ 를 정해 두고 시간마다의 목표 각도를 만드는데, 처음과 끝에서 천천히 움직이고
        가운데에서 빠르게 움직여 출발·도착의 속도와 가속도가 0 이 된다. 도착 시간은 $T$ 로 사람이 정하므로 "가장 짧은 시간" 이
        목적이 아니다. 관절을 부드럽게 이어도 손끝이 곧게 움직이는 것은 아니고, waypoint 의 joint angle 은 여전히 IK 로 구한다.
    - question: |
        pre-grasp 와 grasp 의 손끝은 같은 수직선 위에 있다. 두 자세의 joint angle 을 각각 minimum-jerk 로 이었을 때 손끝은?
      choices:
        - '두 끝이 같은 수직선 위에 있으니 손끝도 수직으로 내려간다'
        - '관절들이 부드럽게 움직이니 손끝도 일정한 속도로 곧게 움직인다'
        - '손끝 위치는 joint angle 의 cos·sin 을 거쳐 정해져서, 가운데에서 수직선을 벗어나 휘어진 길을 그릴 수 있다'
        - '손끝은 움직이지 않고 관절만 움직인다'
      answer: 2
      explanation: |
        관절 각도 하나하나는 부드럽게 바뀌어도 손끝 위치는 각도의 cos·sin 을 거친 비선형 계산이라서, 두 끝 사이의 손끝 경로가
        직선이 되리라는 보장이 없다. 그래서 두 끝이 같은 수직선 위에 있어도 가운데에서 옆으로 휘어 나가고, 물체 근처에서는 그
        차이로 손가락이 모서리에 걸릴 수 있다. 관절이 움직이면 손끝도 당연히 움직인다.
    - question: |
        물체 근처처럼 좁은 곳에서는 손끝이 휘지 않고 곧게 내려가야 한다. 알맞은 방법은?
      choices:
        - 'minimum-jerk 의 시간을 길게 잡는다'
        - '손끝 위치 자체를 minimum-jerk 로 나누고, 나눈 점마다 IK 를 다시 풀어 joint angle 을 구한다'
        - 'joint angle 을 일정한 속도의 직선으로 잇는다'
        - 'pre-grasp 를 없애고 grasp 로 바로 보낸다'
      answer: 1
      explanation: |
        손끝이 지나갈 위치를 먼저 직선 위에서 나누고 그 점마다 IK 를 풀면, 관절 각도는 휘어 보여도 손끝은 정한 직선을 따른다.
        계산은 더 들지만 좁은 곳에서는 이 방법을 쓴다. 시간을 늘리거나 관절을 일정한 속도로 이어도 관절 공간에서 이은 것이라
        손끝 경로의 모양은 여전히 휜다. pre-grasp 를 없애면 비스듬히 다가가 물체를 밀어낼 위험이 커진다.

- topic: error-and-tradeoff
  title: 오차의 누적과 두 방식의 비교
  variants:
    - question: |
        인식, calibration, 실행 module 이 각각 내는 위치 오차가 모두 gripper 손가락의 여유보다 작다. 이에 대한 판단으로 옳은 것은?
      choices:
        - '하나하나가 여유보다 작으니 반드시 쥘 수 있다'
        - '뒤 module 은 앞 module 의 오차를 모른 채 그대로 넘겨받아 오차가 더해지므로, 모두 같은 방향으로 겹치는 가장 나쁜 경우의 합이 여유 안인지 봐야 한다'
        - '뒤 module 이 앞의 오차를 바로잡으므로 가장 큰 오차 하나만 보면 된다'
        - '오차는 언제나 서로 지워져서 합이 0 에 가깝다'
      answer: 1
      explanation: |
        인식이 틀린 pixel 을 내면 3D 위치가 틀리고, IK 는 그 틀린 자리의 joint angle 을 정확히 풀어 버린다. 이렇게 오차는 고쳐지지
        않고 쌓이므로 하나하나는 작아도 합이 여유를 넘을 수 있다. 방향이 달라 일부가 지워지기도 하지만 언제나 그런 것은 아니라서,
        실패를 막으려면 가장 나쁜 경우를 기준으로 module 마다 여유를 나눠 준다. 이것이 error budget 이다.
    - question: |
        pipeline 을 물체의 위치와 방향을 무작위로 바꿔 가며 여러 번 시도하고, 실패를 원인 module 별로 나눠 셌다. 이 표의 쓸모로
        옳은 것은?
      choices:
        - '가장 많이 실패한 module 을 찾아 그것부터 고칠 수 있고, 다른 module 은 그대로 둘 수 있다'
        - '성공률은 실패 원인을 나눠 세야만 구할 수 있다'
        - '실패가 가장 적은 module 부터 고쳐야 효과가 크다'
        - '실패를 module 별로 나눌 수 있는 것은 end-to-end policy 의 장점이다'
      answer: 0
      explanation: |
        module 마다 중간 값을 확인할 수 있어서 실패를 원인별로 나눌 수 있고, 가장 많이 실패한 module 을 고치면 성공률이 가장 많이
        오른다. 성공률 자체는 성공 횟수를 시도 횟수로 나누면 되므로 원인을 나눌 필요가 없다. 실패가 적은 module 을 고치면 얻는
        것이 적다. 중간 값이 없는 end-to-end policy 는 오히려 어디가 틀렸는지 알기 어렵다.
    - question: |
        (가) 컨베이어 위를 지나가는 같은 모양의 상자를 하루 종일 옮기기, (나) 매번 모양이 다른 옷을 개기. 각 작업에 더 맞는
        방식은?
      choices:
        - '둘 다 모듈 파이프라인이 맞다. 규칙만 더 짜면 된다'
        - '(가) 는 end-to-end policy, (나) 는 모듈 파이프라인이 맞다'
        - '(가) 는 물체와 환경이 정해져 있어 모듈 파이프라인, (나) 는 옷 모양을 3D 좌표 몇 개로 적을 수 없고 접촉이 복잡해 시연에서 배우는 end-to-end policy 가 맞다'
        - '둘 다 end-to-end policy 가 맞다. 모듈 파이프라인은 학습 데이터가 많이 필요하기 때문이다'
      answer: 2
      explanation: |
        모듈 파이프라인은 물체와 환경이 정해져 있고 위치 정확도와 실패 원인 설명이 중요한 반복 작업에 강하다. 옷 개기처럼 모양이
        매번 다르고 손과 천이 계속 닿는 작업은 규칙을 손으로 짜다 보면 끝없이 늘어나므로, 시연을 모아 배우는 편이 낫다. 규칙만
        더 짜면 된다는 생각은 바로 그 한계를 무시한다. 모듈 파이프라인은 calibration 과 규칙으로 동작하고 학습 데이터가 필요 없다.
