<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>이름으로 찾는 인식기. 사진과 이름 "red cube" 를 넣으면 bounding box (200, 220)–(240, 260) 과 점수 0.91 이 나오고, 두 꼭짓점의 평균인 가운데는 (220, 240) 이다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <!-- inputs -->
  <text x="100" y="40" fill="#e2e8f0" font-size="14" text-anchor="middle">입력</text>
  <rect x="20" y="60" width="160" height="50" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="2"/>
  <text x="100" y="82" fill="#94a3b8" font-size="12" text-anchor="middle">찾을 이름</text>
  <text x="100" y="101" fill="#a99ad6" font-size="15" text-anchor="middle">"red cube"</text>
  <rect x="20" y="130" width="160" height="50" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="100" y="152" fill="#94a3b8" font-size="12" text-anchor="middle">카메라 사진</text>
  <text x="100" y="171" fill="#7cb4d8" font-size="14" text-anchor="middle">640 × 480</text>
  <line x1="182" y1="120" x2="206" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="85" width="80" height="70" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="250" y="116" fill="#e2e8f0" font-size="13" text-anchor="middle">인식기</text>
  <text x="250" y="136" fill="#94a3b8" font-size="11" text-anchor="middle">neural network</text>
  <line x1="292" y1="120" x2="316" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- photo, scale 0.5, origin (322, 40) -->
  <rect x="322" y="40" width="320" height="240" fill="#1c2333" stroke="#475569" stroke-width="1.5"/>
  <text x="326" y="54" fill="#64748b" font-size="10">(0, 0)</text>
  <text x="638" y="294" fill="#64748b" font-size="10" text-anchor="end">(640, 480)</text>
  <rect x="425" y="153" width="14" height="14" fill="#c0392b" transform="rotate(10 432 160)"/>
  <rect x="560" y="200" width="20" height="26" rx="3" fill="#3b82f6"/>
  <rect x="422" y="150" width="20" height="20" fill="none" stroke="#a99ad6" stroke-width="2"/>
  <circle cx="432" cy="160" r="2.5" fill="#d6aa62"/>
  <text x="446" y="146" fill="#a99ad6" font-size="12">red cube 0.91</text>
  <line x1="422" y1="150" x2="392" y2="124" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="390" y="120" fill="#e2e8f0" font-size="11" text-anchor="end">(200, 220)</text>
  <line x1="442" y1="170" x2="470" y2="200" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="472" y="212" fill="#e2e8f0" font-size="11">(240, 260)</text>
  <text x="570" y="244" fill="#64748b" font-size="11" text-anchor="middle">다른 물체</text>
  <!-- output -->
  <text x="40" y="226" fill="#e2e8f0" font-size="14">출력</text>
  <text x="40" y="252" fill="#94a3b8" font-size="13">bounding box 왼쪽 위 (200, 220)</text>
  <text x="40" y="274" fill="#94a3b8" font-size="13">bounding box 오른쪽 아래 (240, 260)</text>
  <text x="40" y="296" fill="#94a3b8" font-size="13">점수 0.91</text>
  <text x="40" y="330" fill="#d6aa62" font-size="14">가운데 = ((200 + 240) ÷ 2, (220 + 260) ÷ 2) = (220, 240)</text>
  <text x="482" y="310" fill="#64748b" font-size="11" text-anchor="middle">사진은 절반 크기로 그렸다</text>
</svg>
