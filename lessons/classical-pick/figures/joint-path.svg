<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>pre-grasp 에서 grasp 로 갈 때의 손끝 경로. joint angle 을 minimum-jerk 로 이으면 손끝이 앞으로 휘어 1 초에 2.5 cm, cube 윗면 높이에서 1.2 cm 벗어난다. 손끝 높이를 minimum-jerk 로 나눠 매 점 IK 를 풀면 수직으로 내려간다</title>
  <rect x="1" y="1" width="718" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="70" y1="340" x2="350" y2="340" stroke="#475569" stroke-width="2"/>
  <rect x="99.99999999999991" y="280.0" width="200.00000000000009" height="60.0" fill="#c0392b" opacity="0.7" stroke="#d88b8b"/>
  <text x="140" y="324" fill="#fecaca" font-size="12" text-anchor="middle">cube</text>
  <line x1="200.0" y1="342" x2="200.0" y2="350" stroke="#64748b"/><text x="200.0" y="364" fill="#94a3b8" font-size="11" text-anchor="middle">x 0.20</text>
  <line x1="300.0" y1="342" x2="300.0" y2="350" stroke="#64748b"/><text x="300.0" y="364" fill="#94a3b8" font-size="11" text-anchor="middle">x 0.225</text>
  <line x1="66" y1="70.0" x2="350" y2="70.0" stroke="#334155" stroke-dasharray="3 4"/><text x="62" y="74.0" fill="#94a3b8" font-size="11" text-anchor="end">0.225</text>
  <line x1="66" y1="198.4" x2="350" y2="198.4" stroke="#334155" stroke-dasharray="3 4"/><text x="62" y="202.4" fill="#94a3b8" font-size="11" text-anchor="end">0.118</text>
  <line x1="66" y1="280.0" x2="350" y2="280.0" stroke="#334155" stroke-dasharray="3 4"/><text x="62" y="284.0" fill="#94a3b8" font-size="11" text-anchor="end">0.05</text>
  <text x="30" y="40" fill="#64748b" font-size="11">손끝 높이 (m)</text>
  <line x1="200.0" y1="70.0" x2="200.0" y2="310.0" stroke="#7fc4a2" stroke-width="3"/>
  <polyline points="200.0,70.0 200.0,70.0 200.0,70.0 200.1,70.1 200.3,70.2 200.5,70.3 200.8,70.5 201.3,70.8 201.9,71.1 202.6,71.6 203.6,72.2 204.6,72.8 205.9,73.6 207.4,74.5 209.0,75.5 210.8,76.7 212.9,78.0 215.1,79.5 217.5,81.0 220.0,82.8 222.8,84.7 225.7,86.7 228.7,88.9 231.9,91.2 235.2,93.7 238.6,96.3 242.1,99.1 245.7,102.0 249.3,105.1 252.9,108.3 256.6,111.7 260.2,115.1 263.8,118.8 267.3,122.5 270.8,126.4 274.1,130.3 277.3,134.4 280.4,138.6 283.3,142.8 286.0,147.2 288.6,151.6 290.9,156.1 292.9,160.7 294.8,165.3 296.3,169.9 297.6,174.6 298.6,179.3 299.4,184.0 299.8,188.8 300.0,193.5 299.9,198.2 299.5,202.9 298.8,207.5 297.8,212.1 296.6,216.7 295.1,221.1 293.3,225.6 291.3,229.9 289.1,234.2 286.7,238.4 284.1,242.5 281.3,246.5 278.3,250.3 275.2,254.1 272.0,257.8 268.7,261.3 265.3,264.7 261.9,268.0 258.4,271.2 254.9,274.2 251.4,277.1 247.9,279.9 244.4,282.5 241.0,285.0 237.7,287.4 234.5,289.6 231.4,291.7 228.3,293.7 225.4,295.5 222.7,297.2 220.1,298.8 217.6,300.3 215.3,301.6 213.2,302.8 211.2,303.9 209.5,304.9 207.8,305.8 206.4,306.6 205.1,307.3 204.0,307.9 203.1,308.4 202.3,308.8 201.6,309.1 201.1,309.4 200.7,309.6 200.4,309.8 200.2,309.9 200.1,310.0 200.0,310.0 200.0,310.0 200.0,310.0" fill="none" stroke="#d88b8b" stroke-width="3"/>
  <circle cx="200.0" cy="70.0" r="5" fill="#e2e8f0"/><text x="192.0" y="62.0" fill="#e2e8f0" font-size="12" text-anchor="end">pre-grasp</text>
  <circle cx="200.0" cy="310.0" r="5" fill="#e2e8f0"/><text x="192.0" y="302.0" fill="#e2e8f0" font-size="12" text-anchor="end">grasp</text>
  <circle cx="300.0" cy="198.16" r="5" fill="#d88b8b"/><text x="310" y="202" fill="#d88b8b" font-size="12">1 초: 2.5 cm</text>
  <circle cx="247.99999999999991" cy="280.0" r="5" fill="#d6aa62"/><text x="306" y="274" fill="#d6aa62" font-size="12">윗면: 1.2 cm</text>
  <text x="200" y="378" fill="#64748b" font-size="11" text-anchor="middle"></text>
  <line x1="400" y1="30" x2="400" y2="350" stroke="#1e293b"/>
  <text x="420" y="56" fill="#d88b8b" font-size="13">빨강: joint angle 을 minimum-jerk 로 이음</text>
  <text x="420" y="78" fill="#94a3b8" font-size="13">1 초 자세 (75°, −105°, −60°)</text>
  <text x="420" y="100" fill="#94a3b8" font-size="13">→ 손끝 (0.225, 0.118)</text>
  <text x="420" y="140" fill="#7fc4a2" font-size="13">초록: 손끝 높이를 minimum-jerk 로 나눔</text>
  <text x="420" y="162" fill="#94a3b8" font-size="13">1 초 높이 0.225 − 0.2 × 0.5 = 0.125</text>
  <text x="420" y="184" fill="#94a3b8" font-size="13">→ (0.20, 0, 0.125) 에서 IK 를 다시 품</text>
  <text x="420" y="226" fill="#e2e8f0" font-size="13">관절은 일정한 비율로 움직여도</text>
  <text x="420" y="248" fill="#e2e8f0" font-size="13">손끝은 cos·sin 을 거쳐 휘어진 길을 간다</text>
  <text x="420" y="290" fill="#64748b" font-size="13">가로 방향을 세로보다 3.3 배 늘려 그렸다</text>
</svg>
