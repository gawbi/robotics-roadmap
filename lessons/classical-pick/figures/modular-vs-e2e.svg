<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>위는 모듈 파이프라인. 인식, 3D 위치, 잡기 자세, IK, 경로, 실행 사이마다 확인할 수 있는 중간 값이 있고, 필요한 것은 calibration 과 사람이 정한 규칙이다. 아래는 end-to-end. 사진과 관절 각도를 network 하나에 넣어 관절 각도를 바로 내고, 필요한 것은 시연 데이터다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="34" fill="#38bdf8" font-size="14">모듈 파이프라인</text>
  <text x="700" y="34" fill="#94a3b8" font-size="12" text-anchor="end">필요한 것: calibration, 사람이 정한 규칙</text>
  <rect x="20" y="52" width="60" height="44" rx="6" fill="#111a2e" stroke="#94a3b8"/><text x="50" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">사진</text>
  <line x1="82" y1="74" x2="94" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="98" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#38bdf8"/><text x="138" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">① 인식</text>
  <line x1="180" y1="74" x2="192" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="196" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#38bdf8"/><text x="236" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">② 3D 위치</text>
  <line x1="278" y1="74" x2="290" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="294" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#f59e0b"/><text x="334" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">③ 잡기 자세</text>
  <line x1="376" y1="74" x2="388" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="392" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#f59e0b"/><text x="432" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">④ IK</text>
  <line x1="474" y1="74" x2="486" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="490" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#f59e0b"/><text x="530" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">⑤ 경로</text>
  <line x1="572" y1="74" x2="584" y2="74" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="588" y="52" width="80" height="44" rx="6" fill="#111a2e" stroke="#34d399"/><text x="628" y="79" fill="#e2e8f0" font-size="12" text-anchor="middle">⑥ 실행</text>
  <text x="186" y="120" fill="#34d399" font-size="11" text-anchor="middle">pixel 확인</text>
  <text x="284" y="120" fill="#34d399" font-size="11" text-anchor="middle">높이 0.05 확인</text>
  <text x="382" y="140" fill="#34d399" font-size="11" text-anchor="middle">닿는지 확인</text>
  <text x="480" y="120" fill="#34d399" font-size="11" text-anchor="middle">FK 로 검산</text>
  <text x="578" y="140" fill="#34d399" font-size="11" text-anchor="middle">손끝 경로 확인</text>
  <text x="360" y="170" fill="#94a3b8" font-size="12" text-anchor="middle">module 사이마다 중간 값을 확인할 수 있어 고장 난 곳을 찾기 쉽다</text>

  <line x1="20" y1="190" x2="700" y2="190" stroke="#1e293b"/>
  <text x="20" y="218" fill="#a78bfa" font-size="14">end-to-end policy</text>
  <text x="700" y="218" fill="#94a3b8" font-size="12" text-anchor="end">필요한 것: 시연 데이터</text>
  <rect x="20" y="240" width="110" height="34" rx="6" fill="#111a2e" stroke="#94a3b8"/><text x="75" y="262" fill="#e2e8f0" font-size="12" text-anchor="middle">사진</text>
  <rect x="20" y="282" width="110" height="34" rx="6" fill="#111a2e" stroke="#94a3b8"/><text x="75" y="304" fill="#e2e8f0" font-size="12" text-anchor="middle">지금 관절 각도</text>
  <line x1="132" y1="257" x2="236" y2="272" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="132" y1="299" x2="236" y2="284" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="240" y="246" width="280" height="64" rx="10" fill="#111a2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="380" y="274" fill="#e2e8f0" font-size="13" text-anchor="middle">neural network 하나</text>
  <text x="380" y="296" fill="#94a3b8" font-size="11" text-anchor="middle">중간 값(pixel, 3D 좌표)이 없다</text>
  <line x1="522" y1="278" x2="584" y2="278" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="588" y="258" width="112" height="40" rx="6" fill="#111a2e" stroke="#34d399"/><text x="644" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">다음 관절 각도</text>
  <text x="360" y="340" fill="#94a3b8" font-size="12" text-anchor="middle">시연만으로 배우지만, 틀렸을 때 어디가 틀렸는지 알기 어렵고 시연 범위 밖에서 실패한다</text>
</svg>
