<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>단순화한 팔을 옆에서 본 두 자세. pre-grasp 는 위팔이 수직(90°), 아래팔이 수평, 손목 −90° 로 손끝이 (0.20, 0.225) 에 있다. grasp 는 위팔 60°, 팔꿈치 −120°, 손목 −30° 로 손끝이 (0.20, 0.025) 에 있다. 두 자세 모두 gripper 가 수직 아래를 향한다</title>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="200" y="36" fill="#e2e8f0" font-size="14" text-anchor="middle">pre-grasp</text>
  <line x1="44.0" y1="340" x2="332.0" y2="340" stroke="#475569" stroke-width="2"/>
  <rect x="185.0" y="310.0" width="30.0" height="30.0" fill="#c0392b" stroke="#d88b8b" stroke-width="1.5" opacity="0.8"/>
  <rect x="62.0" y="280.0" width="36.0" height="60.0" rx="4" fill="#111a2e" stroke="#94a3b8"/>
  <line x1="80" y1="280.0" x2="80.0" y2="160.0" stroke="#7cb4d8" stroke-width="7" stroke-linecap="round"/>
  <line x1="80.0" y1="160.0" x2="200.0" y2="160.0" stroke="#a99ad6" stroke-width="7" stroke-linecap="round"/>
  <line x1="200.0" y1="160.0" x2="200.0" y2="205.0" stroke="#d6aa62" stroke-width="5"/>
  <line x1="188.0" y1="197.0" x2="212.0" y2="197.0" stroke="#d6aa62" stroke-width="3"/>
  <line x1="188.0" y1="197.0" x2="188.0" y2="211.0" stroke="#d6aa62" stroke-width="3"/>
  <line x1="212.0" y1="197.0" x2="212.0" y2="211.0" stroke="#d6aa62" stroke-width="3"/>
  <circle cx="80.0" cy="280.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="80.0" cy="160.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="200.0" cy="160.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="200.0" cy="205.0" r="3.5" fill="#7fc4a2"/>
  <text x="72" y="276.0" fill="#94a3b8" font-size="12" text-anchor="end">어깨 (0, 0.1)</text>
  <text x="72" y="154.0" fill="#94a3b8" font-size="12" text-anchor="end">팔꿈치 (0, 0.3)</text>
  <text x="210.0" y="150.0" fill="#94a3b8" font-size="12" text-anchor="start">손목 (0.2, 0.3)</text>
  <text x="216.0" y="221.0" fill="#7fc4a2" font-size="12" text-anchor="start">손끝 (0.20, 0.225)</text>
  <text x="88" y="220.0" fill="#7cb4d8" font-size="12" text-anchor="start">θ₁ = 90°</text>
  <text x="140.0" y="146.0" fill="#a99ad6" font-size="12" text-anchor="middle">θ₂ = −90°</text>
  <text x="192.0" y="184.0" fill="#d6aa62" font-size="12" text-anchor="end">θ₃ = −90°</text>
  <text x="560" y="36" fill="#e2e8f0" font-size="14" text-anchor="middle">grasp</text>
  <line x1="404.0" y1="340" x2="692.0" y2="340" stroke="#475569" stroke-width="2"/>
  <rect x="545.0" y="310.0" width="30.0" height="30.0" fill="#c0392b" stroke="#d88b8b" stroke-width="1.5" opacity="0.8"/>
  <rect x="422.0" y="280.0" width="36.0" height="60.0" rx="4" fill="#111a2e" stroke="#94a3b8"/>
  <line x1="440" y1="280.0" x2="500.0" y2="176.1" stroke="#7cb4d8" stroke-width="7" stroke-linecap="round"/>
  <line x1="500.0" y1="176.1" x2="560.0" y2="280.0" stroke="#a99ad6" stroke-width="7" stroke-linecap="round"/>
  <line x1="560.0" y1="280.0" x2="560.0" y2="325.0" stroke="#d6aa62" stroke-width="5"/>
  <line x1="548.0" y1="317.0" x2="572.0" y2="317.0" stroke="#d6aa62" stroke-width="3"/>
  <line x1="548.0" y1="317.0" x2="548.0" y2="331.0" stroke="#d6aa62" stroke-width="3"/>
  <line x1="572.0" y1="317.0" x2="572.0" y2="331.0" stroke="#d6aa62" stroke-width="3"/>
  <circle cx="440.0" cy="280.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="500.0" cy="176.1" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="560.0" cy="280.0" r="6" fill="#0b1220" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="560.0" cy="325.0" r="3.5" fill="#7fc4a2"/>
  <text x="432" y="276.0" fill="#94a3b8" font-size="12" text-anchor="end">어깨 (0, 0.1)</text>
  <text x="500.0" y="162.08" fill="#94a3b8" font-size="12" text-anchor="middle">팔꿈치 (0.1, 0.273)</text>
  <text x="572.0" y="274.0" fill="#94a3b8" font-size="12" text-anchor="start">손목 (0.2, 0.1)</text>
  <text x="576.0" y="329.0" fill="#7fc4a2" font-size="12" text-anchor="start">손끝 (0.20, 0.025)</text>
  <text x="462" y="232" fill="#7cb4d8" font-size="12" text-anchor="end">θ₁ = 60°</text>
  <text x="539.0" y="220.0" fill="#a99ad6" font-size="12" text-anchor="start">θ₂ = −120°</text>
  <text x="550.0" y="298.0" fill="#d6aa62" font-size="12" text-anchor="end">θ₃ = −30°</text>
  <text x="360" y="372" fill="#94a3b8" font-size="12" text-anchor="middle">위치는 옆에서 본 (앞뒤 위치, 높이), 단위 m. 위팔·아래팔 0.2 m, 손목→손끝 0.075 m</text>
  <text x="360" y="390" fill="#94a3b8" font-size="12" text-anchor="middle">gripper 방향 θ₁ + θ₂ + θ₃ = −90° (수직 아래)</text>
</svg>
