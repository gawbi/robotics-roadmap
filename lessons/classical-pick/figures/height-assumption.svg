<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>책 위에 올린 cube. 실제 윗면은 높이 0.10 m 인데 높이 0.05 m 를 가정하면 같은 ray 를 따라 더 내려간 (0.189, 0, 0.05) 를 cube 로 착각해, 앞뒤로 1.1 cm, 높이로 5 cm 틀린다</title>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <line x1="30" y1="370" x2="330" y2="370" stroke="#475569" stroke-width="2"/>
  <text x="320" y="390" fill="#64748b" font-size="12" text-anchor="end">책상 (높이 0)</text>
  <rect x="122.5" y="342.5" width="55" height="27.5" fill="#3f3a2f" stroke="#a8a29e" stroke-width="1.5"/>
  <text x="185" y="364" fill="#a8a29e" font-size="12">책 5 cm</text>
  <rect x="136.25" y="315" width="27.5" height="27.5" fill="#c0392b" stroke="#f87171" stroke-width="1.5"/>
  <line x1="30" y1="342.5" x2="120" y2="342.5" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="34" y="336" fill="#f59e0b" font-size="11">가정한 높이 0.05</text>
  <rect x="191" y="50" width="28" height="16" rx="3" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="205" cy="67.5" r="3.5" fill="#e2e8f0"/>
  <text x="226" y="50" fill="#e2e8f0" font-size="12">카메라 (x 0.3, 높이 0.55)</text>
  <line x1="205" y1="67.5" x2="143.9" y2="340" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="182" y="170" fill="#38bdf8" font-size="12">pixel 209 의 ray</text>
  <circle cx="150" cy="315" r="5" fill="#34d399"/>
  <line x1="155" y1="315" x2="240" y2="290" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="244" y="286" fill="#34d399" font-size="12">실제 윗면 (0.20, 0, 0.10)</text>
  <text x="244" y="302" fill="#34d399" font-size="12">depth 0.45</text>
  <circle cx="143.9" cy="342.5" r="5" fill="#f87171"/>
  <line x1="139" y1="345" x2="80" y2="300" stroke="#f87171" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="76" y="282" fill="#f87171" font-size="12" text-anchor="end">pipeline 의 답</text>
  <text x="76" y="298" fill="#f87171" font-size="12" text-anchor="end">(0.189, 0, 0.05)</text>
  <line x1="360" y1="30" x2="360" y2="370" stroke="#1e293b"/>
  <text x="380" y="52" fill="#e2e8f0" font-size="14">높이 가정이 틀리면 위치도 틀린다</text>
  <text x="380" y="86" fill="#94a3b8" font-size="13">실제: depth 0.55 − 0.10 = 0.45</text>
  <text x="380" y="108" fill="#94a3b8" font-size="13">u = 500 × (−0.1) ÷ 0.45 + 320 ≈ 209</text>
  <text x="380" y="146" fill="#e2e8f0" font-size="13">pipeline 은 depth 0.5 를 가정</text>
  <text x="380" y="168" fill="#94a3b8" font-size="13">② (209 − 320) ÷ 500 = −0.222</text>
  <text x="380" y="190" fill="#94a3b8" font-size="13">③ −0.222 × 0.5 = −0.111</text>
  <text x="380" y="212" fill="#94a3b8" font-size="13">x = 0.3 − 0.111 = 0.189</text>
  <text x="380" y="252" fill="#f87171" font-size="14">앞뒤 오차 0.200 − 0.189 = 1.1 cm</text>
  <text x="380" y="276" fill="#f87171" font-size="14">높이 오차 0.10 − 0.05 = 5 cm</text>
  <text x="380" y="316" fill="#94a3b8" font-size="12">depth camera 는 depth 0.45 를 직접 재므로</text>
  <text x="380" y="336" fill="#94a3b8" font-size="12">이 가정이 필요 없다</text>
</svg>
