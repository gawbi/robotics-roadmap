<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>MNIST autoencoder 의 구조. 784 개의 pixel 이 encoder MLP 를 지나 400 개, 2 개로 줄었다가 decoder MLP 를 지나 400 개, 784 개로 늘어난다. 가운데 2 개가 latent z 다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="658" height="298" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="54.0" y="50.0" width="32.0" height="180.0" rx="4" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="70.0" y="250.0" fill="#e2e8f0" font-size="13" text-anchor="middle">784 개</text>
  <text x="70.0" y="36.0" fill="#7cb4d8" font-size="13" text-anchor="middle">그림 x</text>
  <polygon points="86.0,50.0 184.0,92.1 184.0,187.9 86.0,230.0" fill="#1e293b" fill-opacity="0.6" stroke="none"/>
  <rect x="184.0" y="92.1" width="32.0" height="95.8" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="200.0" y="207.9" fill="#e2e8f0" font-size="13" text-anchor="middle">400 개</text>
  <polygon points="216.0,92.1 314.0,135.8 314.0,144.2 216.0,187.9" fill="#1e293b" fill-opacity="0.6" stroke="none"/>
  <rect x="314.0" y="135.8" width="32.0" height="8.4" rx="4" fill="#111a2e" stroke="#7fc4a2" stroke-width="2"/>
  <text x="330.0" y="174.0" fill="#e2e8f0" font-size="13" text-anchor="middle">2 개</text>
  <text x="330.0" y="96.0" fill="#7fc4a2" font-size="13" text-anchor="middle">latent z</text>
  <polygon points="346.0,135.8 444.0,92.1 444.0,187.9 346.0,144.2" fill="#1e293b" fill-opacity="0.6" stroke="none"/>
  <rect x="444.0" y="92.1" width="32.0" height="95.8" rx="4" fill="#111a2e" stroke="#e2e8f0" stroke-width="2"/>
  <text x="460.0" y="207.9" fill="#e2e8f0" font-size="13" text-anchor="middle">400 개</text>
  <polygon points="476.0,92.1 574.0,50.0 574.0,230.0 476.0,187.9" fill="#1e293b" fill-opacity="0.6" stroke="none"/>
  <rect x="574.0" y="50.0" width="32.0" height="180.0" rx="4" fill="#111a2e" stroke="#7cb4d8" stroke-width="2"/>
  <text x="590.0" y="250.0" fill="#e2e8f0" font-size="13" text-anchor="middle">784 개</text>
  <text x="590.0" y="36.0" fill="#7cb4d8" font-size="13" text-anchor="middle">되살린 x̂</text>
  <line x1="54.0" y1="266.0" x2="322.0" y2="266.0" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="188.0" y="286.0" fill="#7cb4d8" font-size="13" text-anchor="middle">encoder (MLP)</text>
  <line x1="338.0" y1="266.0" x2="606.0" y2="266.0" stroke="#d6aa62" stroke-width="1.5"/>
  <text x="472.0" y="286.0" fill="#d6aa62" font-size="13" text-anchor="middle">decoder (MLP)</text>
</svg>
