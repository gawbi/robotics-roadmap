<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>왼쪽은 반반인 동전 p 와 앞면 0.8 인 동전 q 의 막대 그래프와 KL 0.193, 오른쪽은 q 의 앞면 확률이 0.5, 0.6, 0.8, 0.9 로 p 에서 멀어질수록 KL 이 0, 0.020, 0.193, 0.368 로 커지는 모습</title>
  <defs>
