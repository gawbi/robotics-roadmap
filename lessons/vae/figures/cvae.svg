<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>CVAE 의 구조. encoder 는 그림 x 와 one-hot 조건 c 를 받아 μ, σ 를 내고, decoder 는 z 와 c 를 받아 그림을 낸다. 아래는 같은 z 에 c 만 1, 4, 7 로 바꾸면 기울기가 같은 1, 4, 7 이 나오는 모습</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="20.0" y="40.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.5"/>
  <text x="75.0" y="59.0" fill="#e2e8f0" font-size="14" text-anchor="middle">그림 x</text>
  <text x="75.0" y="76.0" fill="#94a3b8" font-size="12" text-anchor="middle">784 개</text>
  <rect x="20.0" y="110.0" width="110.0" height="44.0" rx="8" fill="#111a2e" stroke="#e879f9" stroke-width="1.5"/>
  <text x="75.0" y="130.0" fill="#e879f9" font-size="14" text-anchor="middle">조건 c</text>
  <text x="75.0" y="147.0" fill="#94a3b8" font-size="12" text-anchor="middle">one-hot 10 개</text>
  <line x1="130.0" y1="62.0" x2="176.0" y2="88.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130.0" y1="132.0" x2="176.0" y2="106.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="180.0" y="74.0" width="100.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="230.0" y="102.0" fill="#e2e8f0" font-size="14" text-anchor="middle">encoder</text>
  <line x1="280.0" y1="97.0" x2="308.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="312.0" y="74.0" width="80.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="352.0" y="102.0" fill="#e2e8f0" font-size="14" text-anchor="middle">μ, σ</text>
  <line x1="392.0" y1="97.0" x2="420.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="424.0" y="74.0" width="90.0" height="46.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="469.0" y="94.0" fill="#e2e8f0" font-size="14" text-anchor="middle">z</text>
  <text x="469.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">μ + σ ⊙ ε</text>
  <line x1="514.0" y1="97.0" x2="540.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="544.0" y="74.0" width="110.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="599.0" y="102.0" fill="#e2e8f0" font-size="14" text-anchor="middle">decoder</text>
  <path d="M130,140 L130,176 L599,176 L599,122" fill="none" stroke="#e879f9" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360.0" y="194.0" fill="#e879f9" font-size="12" text-anchor="middle">c 를 decoder 에도 넣는다</text>
  <text x="599.0" y="62.0" fill="#94a3b8" font-size="12" text-anchor="middle">그림 x̂ 를 낸다</text>
  <line x1="20.0" y1="214.0" x2="660.0" y2="214.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24.0" y="242.0" fill="#e2e8f0" font-size="14" text-anchor="start">같은 z 에 c 만 바꾸면</text>
  <rect x="24.0" y="262.0" width="130.0" height="44.0" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.5"/>
  <text x="89.0" y="289.0" fill="#e2e8f0" font-size="13" text-anchor="middle">z = (0.5, −1)</text>
  <rect x="230.0" y="250.0" width="70.0" height="70.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <text x="265" y="302" fill="#e5e7eb" font-size="50" text-anchor="middle" font-weight="300" transform="skewX(-14)" transform-origin="265 285">1</text>
  <text x="265.0" y="340.0" fill="#e879f9" font-size="12" text-anchor="middle">c = 1 의 one-hot</text>
  <rect x="370.0" y="250.0" width="70.0" height="70.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <text x="405" y="302" fill="#e5e7eb" font-size="50" text-anchor="middle" font-weight="300" transform="skewX(-14)" transform-origin="405 285">4</text>
  <text x="405.0" y="340.0" fill="#e879f9" font-size="12" text-anchor="middle">c = 4 의 one-hot</text>
  <rect x="510.0" y="250.0" width="70.0" height="70.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <text x="545" y="302" fill="#e5e7eb" font-size="50" text-anchor="middle" font-weight="300" transform="skewX(-14)" transform-origin="545 285">7</text>
  <text x="545.0" y="340.0" fill="#e879f9" font-size="12" text-anchor="middle">c = 7 의 one-hot</text>
  <line x1="154.0" y1="284.0" x2="226.0" y2="284.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="440.0" y="242.0" fill="#94a3b8" font-size="12" text-anchor="middle">기울기·굵기는 같고 숫자만 바뀐다</text>
</svg>
