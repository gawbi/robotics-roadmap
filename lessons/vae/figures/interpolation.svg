<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>latent 평면에서 z_a = (−2, 1) 과 z_b = (2, −1) 을 잇는 직선 위의 다섯 점과, 그 점들을 decoder 에 넣어 숫자 1 이 7 로 조금씩 바뀌는 그림</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="678" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="42.0" y="52.0" width="216.0" height="216.0" rx="0" fill="#0e1628" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="42.0" y1="160.0" x2="258.0" y2="160.0" stroke="#475569" stroke-width="1"/>
  <line x1="150.0" y1="52.0" x2="150.0" y2="268.0" stroke="#475569" stroke-width="1"/>
  <text x="78.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="middle">−2</text>
  <text x="36.0" y="236.0" fill="#94a3b8" font-size="12" text-anchor="end">−2</text>
  <text x="222.0" y="286.0" fill="#94a3b8" font-size="12" text-anchor="middle">2</text>
  <text x="36.0" y="92.0" fill="#94a3b8" font-size="12" text-anchor="end">2</text>
  <line x1="78.0" y1="124.0" x2="222.0" y2="196.0" stroke="#34d399" stroke-width="2"/>
  <circle cx="78.0" cy="124.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="114.0" cy="142.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="150.0" cy="160.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="186.0" cy="178.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="222.0" cy="196.0" r="5" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="78.0" y="112.0" fill="#e2e8f0" font-size="12" text-anchor="middle">z_a (1 그림)</text>
  <text x="222.0" y="218.0" fill="#e2e8f0" font-size="12" text-anchor="middle">z_b (7 그림)</text>
  <text x="150.0" y="38.0" fill="#e2e8f0" font-size="14" text-anchor="middle">latent 평면</text>
  <rect x="330.0" y="120.0" width="62.0" height="62.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <line x1="356.0" y1="135.5" x2="364.7" y2="129.9" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="364.7" y1="129.9" x2="364.7" y2="173.3" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <text x="361.0" y="202.0" fill="#f59e0b" font-size="12" text-anchor="middle">t = 0</text>
  <text x="361.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">(−2, 1)</text>
  <rect x="400.0" y="120.0" width="62.0" height="62.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <line x1="422.9" y1="134.1" x2="438.1" y2="129.9" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="438.1" y1="129.9" x2="432.6" y2="173.3" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <text x="431.0" y="202.0" fill="#f59e0b" font-size="12" text-anchor="middle">t = 0.25</text>
  <text x="431.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">(−1, 0.5)</text>
  <rect x="470.0" y="120.0" width="62.0" height="62.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <line x1="489.8" y1="132.7" x2="511.5" y2="129.9" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="511.5" y1="129.9" x2="500.4" y2="173.3" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <text x="501.0" y="202.0" fill="#f59e0b" font-size="12" text-anchor="middle">t = 0.5</text>
  <text x="501.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">(0, 0)</text>
  <rect x="540.0" y="120.0" width="62.0" height="62.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <line x1="556.7" y1="131.3" x2="585.0" y2="129.9" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="585.0" y1="129.9" x2="568.2" y2="173.3" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <text x="571.0" y="202.0" fill="#f59e0b" font-size="12" text-anchor="middle">t = 0.75</text>
  <text x="571.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">(1, −0.5)</text>
  <rect x="610.0" y="120.0" width="62.0" height="62.0" rx="4" fill="#05080f" stroke="#334155" stroke-width="1.2"/>
  <line x1="623.6" y1="129.9" x2="658.4" y2="129.9" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="658.4" y1="129.9" x2="636.0" y2="173.3" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round"/>
  <text x="641.0" y="202.0" fill="#f59e0b" font-size="12" text-anchor="middle">t = 1</text>
  <text x="641.0" y="220.0" fill="#94a3b8" font-size="11" text-anchor="middle">(2, −1)</text>
  <text x="501.0" y="100.0" fill="#e2e8f0" font-size="14" text-anchor="middle">점마다 decoder 가 낸 그림</text>
  <text x="501.0" y="300.0" fill="#34d399" font-size="13" text-anchor="middle">z(t) = (1 − t) z_a + t z_b</text>
</svg>
