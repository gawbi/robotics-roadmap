  <circle cx="360.0" cy="98.0" r="7" fill="#38bdf8" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="360.0" cy="82.0" r="7" fill="#38bdf8" stroke="#38bdf8" stroke-width="2"/>
