  <text x="80.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">5</text>
  <line x1="150.0" y1="106.0" x2="150.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
  <text x="150.0" y="132.0" fill="#94a3b8" font-size="12" text-anchor="middle">6</text>
  <line x1="220.0" y1="106.0" x2="220.0" y2="114.0" stroke="#475569" stroke-width="1.5"/>
