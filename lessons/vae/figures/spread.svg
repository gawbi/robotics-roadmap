  <text x="500.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">11</text>
  <line x1="290.0" y1="182.0" x2="290.0" y2="246.0" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="290.0" y="176.0" fill="#34d399" font-size="12" text-anchor="middle">μ = 8</text>
  <circle cx="150.0" cy="228.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="150.0" cy="212.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="430.0" cy="228.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="430.0" cy="212.0" r="7" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="290.0" y1="200.0" x2="152.0" y2="200.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290.0" y1="200.0" x2="428.0" y2="200.0" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220.0" y="194.0" fill="#94a3b8" font-size="12" text-anchor="middle">−2</text>
  <text x="360.0" y="194.0" fill="#94a3b8" font-size="12" text-anchor="middle">+2</text>
  <text x="320.0" y="280.0" fill="#94a3b8" font-size="12" text-anchor="middle">각 점은 측정 두 번. 벗어난 양을 제곱해 평균하면 분산이다</text>
</svg>
