  <line x1="220.0" y1="236.0" x2="220.0" y2="244.0" stroke="#475569" stroke-width="1.5"/>
  <text x="220.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">7</text>
  <line x1="290.0" y1="236.0" x2="290.0" y2="244.0" stroke="#475569" stroke-width="1.5"/>
  <text x="290.0" y="262.0" fill="#94a3b8" font-size="12" text-anchor="middle">8</text>
  <line x1="360.0" y1="236.0" x2="360.0" y2="244.0" stroke="#475569" stroke-width="1.5"/>
