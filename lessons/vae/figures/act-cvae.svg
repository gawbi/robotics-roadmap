<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>ACT 의 CVAE. 학습 때는 encoder 가 시연 action chunk 와 관절 위치로 μ, σ 를 내고 z = μ + σ ⊙ ε 를 policy 에 넣는다. 로봇을 움직일 때는 encoder 없이 z = 0 을 넣고 카메라 이미지와 관절 위치로 action chunk 를 낸다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="698" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24.0" y="32.0" fill="#38bdf8" font-size="15" text-anchor="start">학습할 때</text>
  <rect x="20.0" y="50.0" width="130.0" height="44.0" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="85.0" y="77.0" fill="#e2e8f0" font-size="13" text-anchor="middle">시연 action chunk</text>
  <rect x="20.0" y="104.0" width="130.0" height="40.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="85.0" y="129.0" fill="#e2e8f0" font-size="13" text-anchor="middle">관절 위치</text>
  <line x1="150.0" y1="72.0" x2="178.0" y2="90.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150.0" y1="124.0" x2="178.0" y2="106.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="182.0" y="74.0" width="110.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="237.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">CVAE encoder</text>
  <line x1="292.0" y1="97.0" x2="316.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320.0" y="74.0" width="120.0" height="46.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="380.0" y="94.0" fill="#e2e8f0" font-size="13" text-anchor="middle">z = μ + σ ⊙ ε</text>
  <text x="380.0" y="111.0" fill="#94a3b8" font-size="12" text-anchor="middle">32 차원</text>
  <line x1="440.0" y1="97.0" x2="466.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470.0" y="74.0" width="90.0" height="46.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="515.0" y="102.0" fill="#e2e8f0" font-size="14" text-anchor="middle">policy</text>
  <rect x="470.0" y="136.0" width="90.0" height="40.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="515.0" y="161.0" fill="#e2e8f0" font-size="12" text-anchor="middle">카메라·관절</text>
  <line x1="515.0" y1="136.0" x2="515.0" y2="122.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560.0" y1="97.0" x2="584.0" y2="97.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="588.0" y="74.0" width="96.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="636.0" y="102.0" fill="#e2e8f0" font-size="13" text-anchor="middle">예측 chunk</text>
  <text x="470.0" y="200.0" fill="#94a3b8" font-size="12" text-anchor="middle">loss = L1(예측, 시연) + 10 × KL</text>
  <line x1="20.0" y1="222.0" x2="680.0" y2="222.0" stroke="#1e293b" stroke-width="1.5"/>
  <text x="24.0" y="252.0" fill="#f59e0b" font-size="15" text-anchor="start">로봇을 움직일 때</text>
  <rect x="320.0" y="280.0" width="120.0" height="46.0" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="380.0" y="300.0" fill="#e2e8f0" font-size="14" text-anchor="middle">z = 0</text>
  <text x="380.0" y="317.0" fill="#94a3b8" font-size="12" text-anchor="middle">prior 의 평균</text>
  <line x1="440.0" y1="303.0" x2="466.0" y2="303.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="470.0" y="280.0" width="90.0" height="46.0" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="515.0" y="308.0" fill="#e2e8f0" font-size="14" text-anchor="middle">policy</text>
  <rect x="470.0" y="334.0" width="90.0" height="30.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="515.0" y="354.0" fill="#e2e8f0" font-size="12" text-anchor="middle">카메라·관절</text>
  <line x1="515.0" y1="334.0" x2="515.0" y2="328.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560.0" y1="303.0" x2="584.0" y2="303.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="588.0" y="280.0" width="96.0" height="46.0" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="636.0" y="300.0" fill="#e2e8f0" font-size="13" text-anchor="middle">action chunk</text>
  <text x="636.0" y="317.0" fill="#94a3b8" font-size="12" text-anchor="middle">로봇이 실행</text>
  <text x="160.0" y="300.0" fill="#94a3b8" font-size="12" text-anchor="middle">시연이 없으므로</text>
  <text x="160.0" y="318.0" fill="#94a3b8" font-size="12" text-anchor="middle">encoder 를 쓰지 않는다</text>
</svg>
