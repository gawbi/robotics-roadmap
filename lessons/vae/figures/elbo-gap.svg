<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>log p(x) 와 ELBO 의 관계. reconstruction loss 90 과 KL 25 로 구한 ELBO −115 는 log p(x) 보다 아래에 있고, 둘의 차이는 encoder 의 분포와 진짜 posterior 의 KL 로 언제나 0 이상이다</title>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="24" y="34" fill="#e2e8f0" font-size="15">한 그림 x 의 값 (위로 갈수록 큼)</text>
  <line x1="90" y1="290" x2="90" y2="64" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-muted)"/>
  <line x1="82" y1="110" x2="390" y2="110" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="402" y="115" fill="#38bdf8" font-size="14">log p(x) · 직접 계산할 수 없다</text>
  <line x1="82" y1="200" x2="390" y2="200" stroke="#34d399" stroke-width="2.5"/>
  <text x="402" y="196" fill="#34d399" font-size="14">ELBO = −(90 + 25) = −115</text>
  <text x="402" y="216" fill="#94a3b8" font-size="12">reconstruction loss 90, KL 25</text>
  <rect x="200" y="113" width="80" height="84" rx="6" fill="#2a1f3d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="240" y="151" fill="#a78bfa" font-size="13" text-anchor="middle">차이</text>
  <text x="240" y="169" fill="#a78bfa" font-size="12" text-anchor="middle">≥ 0</text>
  <text x="150" y="240" fill="#a78bfa" font-size="13">차이 = KL(q(z|x) ‖ 진짜 posterior p(z|x))</text>
  <line x1="120" y1="270" x2="120" y2="208" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="150" y="272" fill="#34d399" font-size="13">학습은 ELBO 를 밀어 올린다 = reconstruction loss + KL 을 줄인다</text>
</svg>
