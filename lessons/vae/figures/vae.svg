<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>VAE 의 계산과 loss. encoder 가 낸 μ, logσ² 와 바깥에서 뽑은 ε 로 z 를 만들고, decoder 가 낸 pixel 확률의 BCE 와 KL 을 더한다</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="598" height="438" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <rect x="170" y="20" width="120" height="44" rx="8" fill="#111a2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="230.0" y="39.0" fill="#38bdf8" font-size="14" text-anchor="middle">x</text>
  <text x="230.0" y="56.0" fill="#94a3b8" font-size="13" text-anchor="middle">784 개, pixel 0~1</text>
  <line x1="230" y1="64" x2="230" y2="82" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="84" width="160" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="230.0" y="104.0" fill="#e2e8f0" font-size="14" text-anchor="middle">encoder</text>
  <text x="230.0" y="121.0" fill="#94a3b8" font-size="13" text-anchor="middle">MLP 784 → 400</text>
  <line x1="210" y1="130" x2="182" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="130" x2="280" y2="150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="152" width="96" height="42" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="178.0" y="170.0" fill="#e2e8f0" font-size="14" text-anchor="middle">μ</text>
  <text x="178.0" y="187.0" fill="#94a3b8" font-size="13" text-anchor="middle">z_dim 개</text>
  <rect x="236" y="152" width="96" height="42" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="284.0" y="170.0" fill="#e2e8f0" font-size="14" text-anchor="middle">logσ²</text>
  <text x="284.0" y="187.0" fill="#94a3b8" font-size="13" text-anchor="middle">z_dim 개</text>
  <line x1="178" y1="194" x2="178" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="284" y1="194" x2="284" y2="224" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="130" y="226" width="202" height="46" rx="8" fill="#111a2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="231.0" y="246.0" fill="#e2e8f0" font-size="14" text-anchor="middle">z = μ + σ ⊙ ε</text>
  <text x="231.0" y="263.0" fill="#94a3b8" font-size="13" text-anchor="middle">σ = exp(½ · logσ²)</text>
  <rect x="20" y="230" width="90" height="38" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="65.0" y="253.9" fill="#f59e0b" font-size="14" text-anchor="middle">ε ~ N(0, I)</text>
  <line x1="110" y1="249" x2="127" y2="249" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="20" y="292" fill="#94a3b8" font-size="13">ε 는 바깥에서 뽑아</text>
  <text x="20" y="310" fill="#94a3b8" font-size="13">넣는 입력이다</text>
  <line x1="230" y1="272" x2="230" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="300" width="160" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="230.0" y="320.0" fill="#e2e8f0" font-size="14" text-anchor="middle">decoder</text>
  <text x="230.0" y="337.0" fill="#94a3b8" font-size="13" text-anchor="middle">MLP z → 400 → 784</text>
  <line x1="230" y1="346" x2="230" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="372" width="160" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="230.0" y="392.0" fill="#e2e8f0" font-size="14" text-anchor="middle">pixel 확률 p</text>
  <text x="230.0" y="409.0" fill="#94a3b8" font-size="13" text-anchor="middle">784 개, sigmoid 출력</text>
  <line x1="332" y1="173" x2="388" y2="173" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="338" y="165" fill="#94a3b8" font-size="13">μ, logσ²</text>
  <rect x="390" y="152" width="150" height="42" rx="8" fill="#111a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="465.0" y="177.9" fill="#e2e8f0" font-size="14" text-anchor="middle">KL(q ‖ N(0, I))</text>
  <line x1="310" y1="395" x2="388" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="372" width="190" height="46" rx="8" fill="#111a2e" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="485.0" y="392.0" fill="#e2e8f0" font-size="14" text-anchor="middle">reconstruction</text>
  <text x="485.0" y="409.0" fill="#94a3b8" font-size="13" text-anchor="middle">BCE(p, x) 의 pixel 합</text>
  <path d="M290,42 L560,42 L560,370" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="372" y="34" fill="#38bdf8" font-size="13">x (정답)</text>
  <rect x="390" y="262" width="150" height="46" rx="8" fill="#111a2e" stroke="#f87171" stroke-width="1.5"/>
  <text x="465.0" y="282.0" fill="#e2e8f0" font-size="14" text-anchor="middle">loss</text>
  <text x="465.0" y="299.0" fill="#94a3b8" font-size="13" text-anchor="middle">BCE 합 + β · KL</text>
  <line x1="465" y1="194" x2="465" y2="260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="372" x2="465" y2="310" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
