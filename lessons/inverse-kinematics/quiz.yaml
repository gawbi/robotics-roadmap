# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: ik-problem
  title: inverse kinematics 와 답의 개수
  variants:
    - question: |
        면접관: "forward kinematics 는 답이 늘 하나인데, inverse kinematics 는 왜 답이 하나로 정해지지 않나요?"
      choices:
        - '서로 다른 joint angle 조합이 같은 손끝 위치를 만들 수 있고, 손이 닿지 않는 위치에는 어떤 조합도 없기 때문이다'
        - 'IK 는 반복 계산이라서 계산할 때마다 반올림 오차로 답이 조금씩 달라지기 때문이다'
        - '손끝 위치에는 noise 가 섞여 있어서 정확한 답을 구할 수 없기 때문이다'
        - 'joint angle 은 radian 이고 손끝 위치는 m 라서 단위가 맞지 않기 때문이다'
      answer: 0
      explanation: |
        FK 는 joint angle 을 식에 넣으면 손끝이 하나로 정해지지만, 거꾸로 같은 손끝에 닿는 joint angle 조합은 여럿일 수 있다. 2 관절 팔은 팔꿈치를
        어느 쪽으로 꺾어도 같은 자리에 닿아 답이 둘이고, 팔이 닿지 않는 자리에는 답이 없으며, joint 가 맞출 숫자보다 많으면 끝없이 많다. 반올림 오차나
        noise 는 답의 개수와 관계없고, 단위가 다른 것은 IK 의 답이 여럿인 이유가 아니다.
    - question: |
        면접관: "joint 3 개짜리 평면 팔로 손끝의 위치 (x, y) 만 맞춘다면, 손이 닿는 목표에 대해 IK 의 답은 보통 몇 개인가요?"
      choices:
        - '정확히 하나다. joint 가 많을수록 답이 하나로 좁혀진다'
        - '항상 둘이다. 팔꿈치를 위로 든 자세와 아래로 내린 자세뿐이다'
        - '끝없이 많다. 맞출 숫자는 2 개인데 정할 수 있는 joint 가 3 개라 하나가 남는다'
        - '없다. joint 가 맞출 숫자보다 많으면 식을 풀 수 없다'
      answer: 2
      explanation: |
        맞출 숫자(x, y)가 2 개이고 joint 가 3 개면 joint 하나를 자유롭게 정해도 나머지 두 joint 로 손끝을 맞출 수 있어서 답이 끝없이 많다. 이런 팔을
        redundant 하다고 한다. joint 가 늘면 답은 좁혀지지 않고 오히려 늘어난다. 답이 둘인 것은 joint 와 맞출 숫자가 같은 2 관절 팔의 경우이고, 식이
        모르는 값보다 적으면 해가 없는 것이 아니라 여럿이다.
    - question: |
        면접관: "카메라로 컵의 위치를 알아냈는데 왜 로봇 팔에 IK 계산이 따로 필요한가요?"
      choices:
        - '카메라 좌표를 로봇 base 좌표로 바꾸는 계산이 IK 이기 때문이다'
        - 'motor 가 받는 명령은 joint angle 이라서, 손끝을 컵에 두는 joint angle 을 손끝 위치에서 거꾸로 구해야 하기 때문이다'
        - '컵의 위치에 섞인 noise 를 IK 가 걸러 주기 때문이다'
        - 'IK 가 컵까지 가는 동안 장애물을 피하는 경로를 만들어 주기 때문이다'
      answer: 1
      explanation: |
        motor 는 손끝 위치가 아니라 각 joint 의 각도를 명령으로 받으므로, 원하는 손끝 위치에서 joint angle 을 거꾸로 구하는 IK 가 필요하다. 카메라
        좌표를 base 좌표로 바꾸는 것은 좌표 변환(transform)이고, noise 를 거르는 것은 filter 의 일이며, 장애물을 피하는 경로는 motion planning 이
        찾는다.

- topic: analytic-solution
  title: 해석적 풀이와 workspace
  variants:
    - question: |
        면접관: "2 관절 평면 팔을 코사인 법칙으로 풀었더니 cos θ₂ 가 1.5 로 나왔습니다. 무슨 뜻인가요?"
      choices:
        - 'θ₂ 가 약 1.5 rad 이라는 뜻이다'
        - '계산 실수다. cos θ₂ 는 항상 0 과 1 사이로 나온다'
        - '답이 하나뿐이라 elbow-up 과 elbow-down 이 겹친다는 뜻이다'
        - 'cos 은 −1 과 1 사이의 값만 가지므로 그런 θ₂ 가 없고, 목표가 팔이 닿는 범위(workspace) 밖이라는 뜻이다'
      answer: 3
      explanation: |
        cos 은 −1 과 1 사이의 값만 가지므로 1.5 가 나오면 그런 각도가 없다. 목표까지의 거리가 두 link 길이의 합보다 멀어서 닿지 않는다는 뜻이다.
        1.5 는 각도가 아니라 cos 값이고, cos θ₂ 는 음수도 될 수 있으며, 답이 하나로 겹치는 것은 cos θ₂ 가 정확히 1 이나 −1 일 때다.
    - question: |
        면접관: "2 관절 팔이 같은 목표에 elbow-up 과 elbow-down 두 자세로 닿을 수 있습니다. 둘 중 무엇을 쓸지는 어떻게 정하나요?"
      choices:
        - 'elbow-down 은 근사해라서 항상 elbow-up 을 쓴다'
        - '두 답 모두 정확하므로 joint 범위, 장애물, 지금 자세에서의 거리처럼 계산 밖의 조건으로 고른다'
        - 'θ₂ 가 양수인 답만 물리적으로 가능하므로 그쪽을 쓴다'
        - '두 답의 평균 자세를 쓰면 가장 안전하다'
      answer: 1
      explanation: |
        두 답 모두 FK 에 넣으면 손끝이 정확히 목표에 온다. 어느 쪽을 쓸지는 joint 가 그쪽으로 꺾일 수 있는지, 팔꿈치가 장애물에 부딪히는지, 지금 자세에서
        얼마나 먼지로 정한다. 어느 쪽도 근사해가 아니고, θ₂ 의 부호는 꺾는 방향일 뿐이며, 두 자세의 평균은 손끝이 목표에서 벗어난 다른 자세가 된다.
    - question: |
        면접관: "해석적 IK 와 반복 계산 IK 를 비교해 보세요."
      choices:
        - '해석적 풀이는 반복 없이 모든 답을 정확히 내지만 로봇 구조마다 식을 따로 유도해야 하고, 반복 계산은 어떤 팔에도 쓸 수 있지만 시작 자세에 따라 답이 달라지고 실패할 수 있다'
        - '해석적 풀이는 근사라서 부정확하고, 반복 계산만 정확한 답을 낸다'
        - '해석적 풀이는 2 관절 평면 팔에만 있고, 6 관절 산업용 팔에는 해석적 풀이가 알려진 적이 없다'
        - '두 방법은 같은 계산을 다른 이름으로 부르는 것이다'
      answer: 0
      explanation: |
        해석적 풀이는 식을 정리해 공식 한 번으로 모든 답을 내므로 빠르고 정확하지만, 로봇 구조가 바뀌면 다시 유도해야 한다. 반복 계산은 Jacobian 으로
        조금씩 다가가므로 구조와 상관없이 쓸 수 있는 대신 시작 자세가 도착할 답을 정하고 joint limit 에 막혀 실패하기도 한다. 손목 세 축이 한 점에서
        만나는 6 관절 팔처럼 해석적 풀이가 알려진 구조도 많은데, MoveIt 에서 쓰는 IKFast 가 이런 풀이를 코드로 만든다. 해석적 풀이가 근사라는 말도
        틀렸다.

- topic: jacobian
  title: Jacobian 의 열과 선형 근사
  variants:
    - question: |
        면접관: "로봇 팔 Jacobian 의 한 열은 무엇을 나타내나요?"
      choices:
        - '그 joint 의 현재 각도'
        - '그 joint 에서 손끝까지의 거리 하나'
        - '그 joint 하나만 조금 돌렸을 때 손끝이 움직이는 방향과 비율'
        - '그 joint 가 낼 수 있는 최대 torque'
      answer: 2
      explanation: |
        Jacobian 은 joint 마다 열이 하나이고, 그 열은 다른 joint 를 고정하고 그 joint 만 조금 돌렸을 때 손끝 위치가 변하는 비율을 방향과 함께 담는다.
        평면 팔이면 joint 에서 손끝까지의 vector 를 90° 돌린 것이다. joint 의 각도나 최대 torque 는 Jacobian 에 들어가지 않고, 거리는 열의 길이에만
        반영될 뿐 방향 정보가 빠져 있다.
    - question: |
        면접관: "평면 팔에서 어떤 joint 에서 손끝까지의 vector 가 오른쪽(+x)을 향합니다. 그 joint 만 시계 반대 방향으로 아주 조금 돌리면 손끝은 처음에 어느 쪽으로 움직이나요?"
      choices:
        - '위(+y)'
        - '오른쪽(+x)'
        - '왼쪽(−x)'
        - '움직이지 않는다'
      answer: 0
      explanation: |
        손끝은 joint 를 중심으로 원을 그리고, 원 위의 점은 중심에서 그 점으로 그은 선에 직각으로 움직인다. 오른쪽을 향한 vector (a, 0) 을 시계 반대
        방향으로 90° 돌리면 (0, a) 라서 위로 움직인다. vector 방향인 오른쪽이나 그 반대인 왼쪽으로 움직이려면 원의 반지름이 바뀌어야 하는데, joint 를
        돌리는 동안 반지름은 그대로다. joint 와 손끝이 같은 자리가 아니면 손끝은 움직인다.
    - question: |
        면접관: "Δp ≈ J Δq 에서 왜 등호가 아니라 근사(≈)인가요?"
      choices:
        - 'Jacobian 은 측정한 값이라 noise 가 있기 때문이다'
        - 'joint angle 을 degree 로 넣어야 정확해지기 때문이다'
        - 'Jacobian 은 한 번 구하면 모든 자세에서 같지만 손끝 위치는 매번 다르기 때문이다'
        - '손끝은 실제로 원을 따라 휘어 가는데 Jacobian 은 지금 방향으로 곧게 간다고 보는 선형 근사라서, joint 를 조금 움직일 때만 맞기 때문이다'
      answer: 3
      explanation: |
        Jacobian 은 지금 자세에서의 변화 비율이라 손끝이 접선 방향으로 곧게 간다고 본다. 실제 손끝은 원을 따라 휘므로 움직임이 커질수록 예측과 실제가
        벌어지고, 움직임을 10 배 키우면 차이는 약 100 배가 된다. Jacobian 은 FK 식에서 계산하는 값이고, 미분에는 degree 가 아니라 radian 을 쓰며,
        Jacobian 은 자세마다 다시 구해야 한다.

- topic: iterative-ik
  title: 반복 계산과 시작 자세
  variants:
    - question: |
        면접관: "반복 IK 에서 J Δq = e 를 풀어 joint 를 한 번 돌렸는데 손끝이 목표에 정확히 닿지 않았습니다. 왜 그렇고, 어떻게 하나요?"
      choices:
        - 'Jacobian 의 부호가 틀린 것이므로 Δq 의 부호를 뒤집는다'
        - 'J Δq = e 는 선형 근사라서 큰 움직임에서는 빗나간다. 새 자세에서 오차와 Jacobian 을 다시 구해 같은 계산을 되풀이한다'
        - '목표가 workspace 밖이라는 뜻이므로 바로 실패를 돌려준다'
        - 'Δq 를 두 배로 키워 다시 한 번 돌리면 정확히 닿는다'
      answer: 1
      explanation: |
        Jacobian 은 지금 자세 근처에서만 맞는 선형 근사라서 한 번에 크게 움직이면 손끝이 예측과 다른 곳에 간다. 그래도 오차는 줄어 있으므로 그 자리에서
        오차와 Jacobian 을 다시 구하기를 되풀이하고, 목표에 가까울수록 근사가 정확해져 빠르게 수렴한다(Newton 법). 한 번에 닿지 않았다고 Jacobian 이
        틀렸거나 workspace 밖인 것은 아니고, Δq 를 키우면 근사가 더 빗나간다.
    - question: |
        면접관: "joint 가 맞출 숫자보다 많아 J Δq = e 를 만족하는 Δq 가 여럿일 때, pseudo-inverse 는 어떤 Δq 를 고르나요?"
      choices:
        - '가장 큰 Δq'
        - 'joint 1 만 움직이는 Δq'
        - '무작위로 하나'
        - '조건을 만족하는 것 가운데 길이가 가장 짧아 joint 를 가장 적게 돌리는 Δq'
      answer: 3
      explanation: |
        pseudo-inverse 는 먼저 J Δq 와 e 의 차이의 제곱을 가장 작게 하고, 그런 Δq 가 여럿이면 길이가 가장 짧은 것을 고른다. 그래서 같은 손끝 이동을
        joint 를 가장 적게 돌려 얻는다. 가장 큰 값이나 특정 joint 만 쓰는 값을 고르지 않고, 계산 결과는 정해져 있어 무작위가 아니다.
    - question: |
        면접관: "답이 둘인 목표를 반복 IK 로 풀 때 어느 답에 도착할지는 무엇이 정하나요? 실제 로봇에서는 그것을 어떻게 쓰나요?"
      choices:
        - '항상 elbow-down 답에 도착하므로 따로 정할 것이 없다'
        - 'step 크기가 정한다. step 이 크면 elbow-up 답에 가고 작으면 elbow-down 답에 간다'
        - '시작 자세(seed)가 정한다. 그래서 움직이는 로봇은 지금 자세를 seed 로 넘겨 가까운 답을 얻고 팔이 갑자기 뒤집히는 것을 막는다'
        - 'Jacobian 의 첫째 열이 정한다'
      answer: 2
      explanation: |
        반복 계산은 시작 자세 근처에서 오차를 줄이는 쪽으로만 움직이므로 시작 자세에 가까운 답에 도착한다. 같은 목표도 elbow-up 쪽에서 시작하면 elbow-up
        답에 간다. 그래서 MoveIt 의 IK 호출도 seed 를 받고, 보통 지금 자세를 넘긴다. 도착하는 답이 늘 같지도 않고, step 크기나 Jacobian 의 한 열이 답을
        고르는 것도 아니다.

- topic: transpose
  title: Jacobian transpose 와 step 크기
  variants:
    - question: |
        면접관: "Jacobian transpose 법 Δq = α Jᵀ e 는 어떤 최적화 방법과 같나요?"
      choices:
        - '남은 거리의 제곱의 절반을 loss 로 둔 gradient descent'
        - 'Newton 법과 완전히 같은 계산'
        - 'random restart 를 쓰는 전역 탐색'
        - 'joint limit 을 제약으로 넣은 SQP'
      answer: 0
      explanation: |
        loss 를 ½‖e‖² 로 두면 joint angle 에 대한 gradient 가 −Jᵀe 이므로, Δq = α Jᵀ e 는 gradient 의 반대 방향으로 α 만큼 가는 gradient descent 다.
        Newton 법(pseudo-inverse)은 선형 근사로 오차가 0 이 되는 자리로 한 번에 가서 방향과 크기가 다르다. random restart 와 SQP 는 TRAC-IK 같은
        solver 가 joint limit 문제를 다루려고 더하는 방법이다.
    - question: |
        면접관: "Jacobian transpose 법에서 step 크기 α 를 크게 잡으면 어떻게 되나요?"
      choices:
        - '항상 더 빨리 수렴한다'
        - '결과는 같고 계산 시간만 줄어든다'
        - '선형 근사가 맞지 않는 거리까지 한 번에 움직여 목표를 지나치고 되돌아오기를 되풀이하거나 발산할 수 있다'
        - 'singularity 에 들어가지 않게 된다'
      answer: 2
      explanation: |
        learning rate 가 큰 gradient descent 처럼, α 가 크면 한 step 이 선형 근사가 맞는 범위를 넘어 손끝이 목표를 지나치고, 남은 거리가 줄었다 늘었다
        하거나 오히려 커진다. 그래서 α 를 키운다고 빨라지지 않고 결과도 달라진다. α 는 singularity 를 피하는 것과 관계없다.
    - question: |
        면접관: "Jacobian transpose 법은 처음에는 오차가 잘 줄다가 목표 근처에서 점점 느려집니다. 왜 그런가요?"
      choices:
        - '목표 근처에서는 Jacobian 이 0 이 되기 때문이다'
        - '목표 근처에서 singularity 에 들어가기 때문이다'
        - 'α 가 step 마다 자동으로 줄어들기 때문이다'
        - '한 step 의 움직임이 Jᵀ e 에 비례해서, 오차 e 가 작아지면 걸음도 함께 작아지기 때문이다'
      answer: 3
      explanation: |
        Δq = α Jᵀ e 는 오차에 비례하므로 목표에 가까워질수록 걸음이 줄어 수렴이 느려진다. gradient descent 가 최솟점 근처에서 gradient 가 작아져
        느려지는 것과 같다. Jacobian 은 목표 근처에서 0 이 되지 않고, singularity 는 자세의 성질이지 목표와의 거리와 관계없으며, 기본 식에서 α 는 고정이다.

- topic: singularity
  title: singularity 와 pseudo-inverse
  variants:
    - question: |
        면접관: "2 관절 평면 팔은 어떤 자세에서 singularity 가 되나요?"
      choices:
        - 'θ₂ = 90° 처럼 팔꿈치를 직각으로 굽힌 자세'
        - 'θ₁ = 0° 인 모든 자세'
        - '손끝이 원점에서 가장 먼 거리의 절반에 있을 때'
        - '팔을 쭉 편 θ₂ = 0° 와 완전히 접은 θ₂ = 180°'
      answer: 3
      explanation: |
        2 관절 팔의 det J 는 L₁L₂ sin θ₂ 라서 sin θ₂ = 0 인 θ₂ = 0° 와 180° 에서 0 이 된다. 이때 두 joint 가 만드는 손끝 움직임이 같은 직선 위에 놓여
        한 방향으로는 손끝을 움직일 수 없다. θ₂ = 90° 는 det J 가 가장 큰 자세이고, θ₁ 은 det J 에 들어가지 않으며, 거리의 절반은 특별한 자세가 아니다.
    - question: |
        면접관: "거의 쭉 펴진 팔에서 손끝을 조금만 옮기라고 pseudo-inverse 로 계산하면 어떤 일이 생기나요? 이유도 말해 보세요."
      choices:
        - '손끝을 그 방향으로 옮길 수 없다는 오류가 바로 난다'
        - '손끝을 움직이는 배율(singular value)이 0 에 가까운 방향에서 오차를 그 배율로 나누므로, joint 를 터무니없이 크게 돌리라는 답이 나온다'
        - 'joint 를 전혀 움직이지 않는 답이 나온다'
        - '해석적 풀이와 똑같은 답이 나온다'
      answer: 1
      explanation: |
        pseudo-inverse 는 방향마다 오차를 singular value 로 나눈 만큼 joint 를 돌린다. singularity 근처에서는 singular value 가 0 에 가까워 작은 오차도
        아주 큰 joint 움직임이 된다. 팔꿈치가 0.001 rad 만 굽은 팔에서는 손끝을 0.01 당기는 데 joint 를 20 rad 넘게 돌리라는 답이 나온다. 정확히 singularity
        가 아니면 오류 없이 계산되고, 움직이지 않는 답은 작은 singular value 를 버리는 처리를 했을 때의 결과이며, 해석적 풀이는 이런 큰 값을 내지 않는다.
    - question: |
        면접관: "singularity 에 대한 설명으로 맞는 것은 무엇인가요?"
      choices:
        - 'Jacobian 의 rank 가 줄어 손끝을 처음 순간 움직일 수 없는 방향이 생기는 자세이고, 문제는 그 근처에서 Jacobian 으로 하는 계산에서 생긴다'
        - '로봇이 그 자세에서는 어느 방향으로도 전혀 움직일 수 없는 고장 상태다'
        - 'joint limit 에 닿은 자세를 부르는 다른 이름이다'
        - '팔이 닿지 않는 목표를 주었을 때만 생기는 계산 오류다'
      answer: 0
      explanation: |
        singularity 에서는 Jacobian 의 열이 독립이 아니게 되어 rank 가 줄고, 어떤 방향으로는 처음 움직이는 비율이 0 이다. 쭉 편 팔도 팔꿈치를 굽히면
        손끝이 당겨지듯 로봇이 못 움직이는 것은 아니고, 근처에서 pseudo-inverse 가 큰 값을 내는 계산이 문제다. joint limit 과는 다른 개념이고, 닿지 않는
        목표를 쫓다 팔이 쭉 펴지면 singularity 가 되기는 하지만 그때만 생기는 것은 아니다.

- topic: dls
  title: damped least squares 와 λ
  variants:
    - question: |
        면접관: "damped least squares(DLS)는 pseudo-inverse 와 무엇이 다른가요?"
      choices:
        - 'Jacobian 대신 해석적 풀이를 쓴다'
        - '오차의 제곱에 joint 움직임의 제곱 × λ² 을 벌점으로 더해 줄이므로, singular value 가 0 에 가까워도 joint 움직임이 커지지 않는다'
        - '오차를 줄이지 않고 joint 움직임만 최소로 한다'
        - 'Jacobian 의 행과 열을 맞바꿔 쓴다'
      answer: 1
      explanation: |
        DLS 는 ‖J Δq − e‖² + λ²‖Δq‖² 을 줄여서, 한 방향의 움직임이 e / σ 대신 σe / (σ² + λ²) 가 된다. σ 가 0 에 가까워도 분모가 λ² 아래로 내려가지
        않아 움직임이 e / (2λ) 를 넘지 않는다. 여전히 Jacobian 으로 하는 반복 계산이고, 오차도 함께 줄이며, 행과 열을 맞바꾸는 것은 Jacobian transpose 법이다.
    - question: |
        면접관: "DLS 의 λ 를 0 에서부터 점점 키우면 어떻게 되나요?"
      choices:
        - 'λ = 0 이면 pseudo-inverse 와 같고, 키울수록 singularity 근처에서 안전해지지만 수렴이 느려지며, 아주 크면 작은 step 의 Jacobian transpose 를 닮는다'
        - 'λ 를 키울수록 수렴이 빨라진다'
        - 'λ 는 joint limit 의 범위를 정하는 값이라 수렴과 관계없다'
        - 'λ 를 키우면 목표가 workspace 밖이어도 정확히 닿는다'
      answer: 0
      explanation: |
        λ = 0 이면 σe / σ² = e / σ 로 pseudo-inverse 와 같다. λ 가 커지면 벌점이 세져 걸음이 줄어서 안전하지만 느려지고, λ² 이 σ² 보다 훨씬 크면
        움직임이 σe / λ² 에 가까워져 α = 1/λ² 인 Jacobian transpose 와 같아진다. λ 는 joint limit 과 관계없고, 닿지 않는 목표는 어떤 λ 로도 닿지 않는다.
    - question: |
        면접관: "팔이 닿지 않는 먼 목표를 주고 반복 IK 를 돌렸습니다. pseudo-inverse 와 DLS 의 반응을 비교해 보세요."
      choices:
        - '둘 다 목표에 정확히 닿는다'
        - '둘 다 처음 자세에서 움직이지 않는다'
        - 'pseudo-inverse 는 팔을 펴다 singularity 근처에서 joint 를 크게 돌리라는 값을 내며 흔들리고, DLS 는 팔을 목표 쪽으로 쭉 편 가장 가까운 자세에서 멈춘다'
        - 'DLS 가 더 크게 흔들리고 pseudo-inverse 는 가장 가까운 자세에서 멈춘다'
      answer: 2
      explanation: |
        닿지 않는 목표를 쫓으면 팔은 그 방향으로 쭉 펴지는데, 쭉 편 팔은 singularity 다. pseudo-inverse 는 그 근처에서 작은 singular value 로 나눠
        joint 를 몇 바퀴씩 돌리라는 값을 내고, 남은 거리가 줄었다 늘었다를 되풀이한다. DLS 는 움직임을 줄여 팔을 쭉 편 자세에서 멈추고, 이때 남은 거리가
        그 팔이 목표에 가장 가까이 갈 수 있는 거리다. 닿지 않는 목표이므로 어느 방법도 정확히 닿지 못하고, 반복 계산에는 답이 있는지 판단하는 단계가
        없어서 처음 자세에 그대로 멈춰 있지도 않는다.

- topic: ik-solver
  title: joint limit 과 IK solver
  variants:
    - question: |
        면접관: "반복 IK 가 joint limit 에 막혀 목표 근처에서 멈췄습니다. 실제 IK solver 는 보통 어떻게 대처하나요?"
      choices:
        - 'joint limit 을 무시하고 계산한 답을 그대로 보낸다'
        - 'joint limit 안에서 무작위로 고른 다른 시작 자세에서 다시 푸는 random restart 를 timeout 까지 한다'
        - 'step 크기 α 를 키워 limit 을 뛰어넘게 한다'
        - '목표가 workspace 밖이라고 판단하고 바로 포기한다'
      answer: 1
      explanation: |
        clip 한 joint 가 limit 에 걸리면 같은 자리로 돌아오기를 되풀이하며 멈출 수 있지만, 다른 시작 자세에서는 limit 안의 답에 닿기도 한다. 그래서
        MoveIt 의 KDL plugin 은 첫 시도가 실패하면 무작위 시작 자세로 timeout 까지 다시 풀고, TRAC-IK 는 막히면 무작위로 건너뛴다. limit 밖의 답은
        로봇이 갈 수 없고, α 를 키워도 clip 은 그대로이며, limit 에 막힌 것과 workspace 밖인 것은 다르다.
    - question: |
        면접관: "MoveIt 에서 KDL plugin 대신 TRAC-IK 를 쓰는 이유는 무엇인가요?"
      choices:
        - 'TRAC-IK 는 mesh 를 보고 충돌하지 않는 답만 내기 때문이다'
        - 'TRAC-IK 는 해석적 풀이라서 언제나 모든 답을 내기 때문이다'
        - 'TRAC-IK 는 joint limit 이 없는 로봇에서만 동작하기 때문이다'
        - 'Newton 식 반복이 joint limit 근처에서 자주 막히는 문제를 줄이려고, 막히면 무작위로 건너뛰는 반복과 joint limit 을 제약으로 다루는 SQP 최적화를 함께 실행하기 때문이다'
      answer: 3
      explanation: |
        TRAC-IK 는 KDL 식 Newton 반복에 무작위 건너뛰기를 더한 KDL-RR 과 SQP 최적화를 동시에 실행해, joint limit 이 있는 팔에서 같은 시간 안에 더 많은
        목표를 푼다. README 의 비교에서 UR5 의 목표 가운데 KDL 은 16.52% 를 풀었고 TRAC-IK 는 99.17% 를 풀었다. TRAC-IK 도 mesh 를 보지 않아 충돌 검사는 따로 해야 하고, 해석적
        풀이가 아닌 수치 solver 이며, joint limit 이 있는 로봇을 위해 만들었다.
    - question: |
        면접관: "IK 오차 vector 에 위치 오차와 방향 오차를 함께 넣을 때 주의할 점은 무엇인가요?"
      choices:
        - '방향 오차는 항상 위치 오차보다 작으므로 무시해도 된다'
        - '방향은 quaternion 네 숫자를 그대로 빼서 넣으면 된다'
        - '위치 오차의 단위는 m 이고 방향 오차의 단위는 rad 이라서, 둘이 같은 크기로 계산되지 않게 두 부분에 무게를 정해야 한다'
        - '위치와 방향을 함께 맞추려면 joint 가 반드시 7 개 이상이어야 한다'
      answer: 2
      explanation: |
        위치 오차의 단위는 m 이고 방향 오차의 단위는 rad 이라서, 그대로 넣으면 1 cm 와 0.01 rad 이 같은 크기로 취급된다. 그래서 MoveIt 의 KDL plugin
        은 orientation_vs_position 으로 무게를 정하고, 위치만 맞추는 position_only_ik 옵션도 둔다. 방향 오차는 무시할 만큼 작다는 보장이 없고, 보통
        회전 차이를 rotation vector 세 숫자로 바꿔 넣으며, pose 의 숫자 6 개는 joint 6 개로도 맞출 수 있다.
