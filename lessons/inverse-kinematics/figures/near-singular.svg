<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>거의 펴진 팔에서 손끝을 0.01 당길 때 joint 움직임의 크기. θ₂ 가 0.5, 0.1, 0.01, 0.001 로 작아지면 pseudo-inverse 는 0.043, 0.223, 2.236, 22.36 으로 커지고 DLS 는 0.1 아래에 머문다</title>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="638" height="328" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="30.0" y="36.0" fill="#94a3b8" font-size="13" text-anchor="start">θ₂ (rad)</text>
  <text x="150.0" y="36.0" fill="#94a3b8" font-size="13" text-anchor="start">‖Δq‖ (rad), 손끝을 0.01 당길 때</text>
  <text x="30.0" y="82.0" fill="#e2e8f0" font-size="15" text-anchor="start">0.5</text>
  <rect x="150.0" y="64.0" width="2.0" height="18.0" rx="3" fill="#f87171" stroke="#f87171" stroke-width="1"/>
  <text x="160.0" y="78.0" fill="#f87171" font-size="12" text-anchor="start">pseudo-inverse 0.043</text>
  <rect x="150.0" y="88.0" width="2.0" height="14.0" rx="3" fill="#34d399" stroke="#34d399" stroke-width="1"/>
  <text x="160.0" y="100.0" fill="#34d399" font-size="12" text-anchor="start">DLS (λ = 0.05) 0.041</text>
  <text x="30.0" y="144.0" fill="#e2e8f0" font-size="15" text-anchor="start">0.1</text>
  <rect x="150.0" y="126.0" width="3.2" height="18.0" rx="3" fill="#f87171" stroke="#f87171" stroke-width="1"/>
  <text x="161.2" y="140.0" fill="#f87171" font-size="12" text-anchor="start">pseudo-inverse 0.223</text>
  <rect x="150.0" y="150.0" width="2.0" height="14.0" rx="3" fill="#34d399" stroke="#34d399" stroke-width="1"/>
  <text x="160.0" y="162.0" fill="#34d399" font-size="12" text-anchor="start">DLS (λ = 0.05) 0.099</text>
  <text x="30.0" y="206.0" fill="#e2e8f0" font-size="15" text-anchor="start">0.01</text>
  <rect x="150.0" y="188.0" width="32.0" height="18.0" rx="3" fill="#f87171" stroke="#f87171" stroke-width="1"/>
  <text x="190.0" y="202.0" fill="#f87171" font-size="12" text-anchor="start">pseudo-inverse 2.236</text>
  <rect x="150.0" y="212.0" width="2.0" height="14.0" rx="3" fill="#34d399" stroke="#34d399" stroke-width="1"/>
  <text x="160.0" y="224.0" fill="#34d399" font-size="12" text-anchor="start">DLS (λ = 0.05) 0.018</text>
  <text x="30.0" y="268.0" fill="#e2e8f0" font-size="15" text-anchor="start">0.001</text>
  <rect x="150.0" y="250.0" width="320.0" height="18.0" rx="3" fill="#f87171" stroke="#f87171" stroke-width="1"/>
  <text x="478.0" y="264.0" fill="#f87171" font-size="12" text-anchor="start">pseudo-inverse 22.36</text>
  <rect x="150.0" y="274.0" width="2.0" height="14.0" rx="3" fill="#34d399" stroke="#34d399" stroke-width="1"/>
  <text x="160.0" y="286.0" fill="#34d399" font-size="12" text-anchor="start">DLS (λ = 0.05) 0.002</text>
  <line x1="150.0" y1="52.0" x2="150.0" y2="300.0" stroke="#475569" stroke-width="1.5"/>
  <text x="320.0" y="316.0" fill="#94a3b8" font-size="13" text-anchor="middle">θ₂ 가 10 분의 1 이 될 때마다 pseudo-inverse 의 움직임은 10 배가 된다</text>
</svg>
