<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>joint i 하나만 돌 때 손끝의 속도. 축 방향 ω̂ᵢ 와 축에서 손끝까지의 vector 의 cross product 다</title>
  <defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="598" height="288" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <polyline points="386.0,195.9 386.5,190.9 386.9,185.8 387.2,180.8 387.3,175.7 387.4,170.6 387.3,165.5 387.2,160.5 387.0,155.4 386.6,150.3 386.1,145.3 385.6,140.2 384.9,135.2 384.2,130.2 383.3,125.2 382.3,120.2 381.3,115.2 380.1,110.3 378.8,105.4 377.4,100.5 376.0,95.7 374.4,90.8 372.7,86.0 370.9,81.3 369.1,76.6 367.1,71.9 365.0,67.3 362.9,62.7 360.6,58.1 358.3,53.6 355.9,49.2 353.3,44.8 350.7,40.4 348.0,36.1 345.2,31.9 342.4,27.7 339.4,23.6 336.3,19.5 333.2,15.5 330.0,11.6" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5" stroke-linejoin="round"/>
  <text x="400.0" y="196.0" fill="#64748b" font-size="13" text-anchor="start">joint i 만 돌 때 손끝이 그리는 원</text>
  <line x1="140.0" y1="170.0" x2="380.0" y2="110.0" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
  <line x1="140.0" y1="170.0" x2="372.0" y2="112.0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-gray)"/>
  <text x="236.0" y="172.0" fill="#94a3b8" font-size="14" text-anchor="start">p<tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> − p</tspan><tspan dy="4" font-size="10">i</tspan></text>
  <circle cx="140.0" cy="170.0" r="11.0" fill="#0b1220" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="140.0" cy="170.0" r="3.5" fill="#38bdf8" stroke="#38bdf8" stroke-width="1"/>
  <text x="140.0" y="204.0" fill="#38bdf8" font-size="14" text-anchor="middle">joint i 의 축 ω̂<tspan dy="4" font-size="10">i</tspan></text>
  <text x="140.0" y="224.0" fill="#94a3b8" font-size="12" text-anchor="middle">(화면을 뚫고 나오는 방향, 축 위의 점 p<tspan dy="4" font-size="10">i</tspan><tspan dy="-4">)</tspan></text>
  <line x1="380.0" y1="110.0" x2="360.6" y2="32.4" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#a-amber)"/>
  <circle cx="380.0" cy="110.0" r="7.0" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <text x="368.0" y="84.0" fill="#e2e8f0" font-size="14" text-anchor="end">손끝 p<tspan dy="4" font-size="10">e</tspan></text>
  <text x="370.6" y="36.4" fill="#f59e0b" font-size="14" text-anchor="start">v = ω̂<tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> × (p</tspan><tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> − p</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">)</tspan></text>
  <line x1="20.0" y1="244.0" x2="580.0" y2="244.0" stroke="#1e293b" stroke-width="1"/>
  <text x="24.0" y="272.0" fill="#e2e8f0" font-size="13" text-anchor="start">Jacobian 의 i 번째 열: 윗칸 ω̂<tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> × (p</tspan><tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> − p</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">) (위치가 변하는 속도), 아랫칸 ω̂</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> (방향이 도는 속도)</tspan></text>
</svg>
