<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>height sample noise 의 세 상태. 실제 지형은 높이 0.2 m 계단(점선)이다. nominal(60%)은 작은 noise 로 점이 조금씩 흔들리고, large offset(30%)은 예로 든 +0.1 m offset 으로 모든 점이 함께 올라가 계단 모양은 남으며, large noise(10%)는 점마다 큰 noise 로 계단을 알아볼 수 없다</title>
