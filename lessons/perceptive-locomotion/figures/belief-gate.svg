<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>belief encoder 의 gate. GRU 가 proprioception, 앞 step 의 내부 상태, 지도 feature lᵉ 로 중간 belief b′ 을 내고, g_a 와 sigmoid 가 지도 feature 마다 0 과 1 사이의 α 를 정한다. 최종 belief 는 g_b(b′) + α ⊙ lᵉ 이고 MLP 가 action 을 낸다. 예로 lᵉ 0.5, g_b(b′) 0.1 일 때 지도와 감각이 맞아 gate 입력이 2.2 이면 α 0.90 이라 0.45 가 지나가 belief 가 0.55 이고, 어긋나 −2.2 이면 α 0.10 이라 0.05 만 지나가 belief 가 0.15 다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="422" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#7cb4d8" font-size="14" text-anchor="start">student 의 belief encoder</text>
  <rect x="20" y="50" width="150" height="40" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="95" y="75" fill="#e2e8f0" font-size="13" text-anchor="middle">proprioception</text>
  <rect x="20" y="104" width="150" height="40" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="95" y="129" fill="#e2e8f0" font-size="13" text-anchor="middle">앞 step 내부 상태</text>
  <rect x="20" y="158" width="150" height="46" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="95" y="178" fill="#e2e8f0" font-size="13" text-anchor="middle">지도 feature lᵉ</text>
  <text x="95" y="196" fill="#94a3b8" font-size="11" text-anchor="middle">noise 섞인 height sample</text>
  <rect x="220" y="96" width="110" height="60" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.8"/>
  <text x="275" y="123" fill="#e2e8f0" font-size="13" text-anchor="middle">GRU</text>
  <text x="275" y="141" fill="#94a3b8" font-size="11" text-anchor="middle">2 층 × 50</text>
  <line x1="170" y1="70" x2="216" y2="126" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="170" y1="124" x2="216" y2="126" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="170" y1="181" x2="216" y2="126" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="345" y="120" fill="#a99ad6" font-size="14" text-anchor="start">b′</text>
  <rect x="380" y="52" width="120" height="44" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="440.0" y="79.0" fill="#e2e8f0" font-size="13" text-anchor="middle">g<tspan baseline-shift="sub" font-size="10">a</tspan> → sigmoid</text>
  <rect x="380" y="160" width="120" height="44" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.8"/>
  <text x="440.0" y="187.0" fill="#e2e8f0" font-size="13" text-anchor="middle">g<tspan baseline-shift="sub" font-size="10">b</tspan></text>
  <line x1="330" y1="120" x2="376" y2="76" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="330" y1="132" x2="376" y2="180" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <text x="540" y="64" fill="#7fc4a2" font-size="13" text-anchor="middle">α (0 ~ 1)</text>
  <circle cx="600" cy="74" r="14" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="600" y="79" fill="#7fc4a2" font-size="16" text-anchor="middle">×</text>
  <line x1="500" y1="74" x2="584" y2="74" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M95,204 L95,236 L600,236 L600,90" fill="none" stroke="#d6aa62" stroke-width="1.6" marker-end="url(#arrow-amber)" stroke-dasharray="5 4"/>
  <text x="110" y="254" fill="#d6aa62" font-size="12" text-anchor="start">lᵉ 를 α 배 해서 통과</text>
  <circle cx="660" cy="182" r="14" fill="#111a2e" stroke="#a99ad6" stroke-width="1.8"/>
  <text x="660" y="187" fill="#a99ad6" font-size="16" text-anchor="middle">+</text>
  <line x1="500" y1="182" x2="644" y2="182" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M614,74 L660,74 L660,166" fill="none" stroke="#7fc4a2" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <line x1="660" y1="196" x2="660" y2="242" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow-muted)"/>
  <text x="705" y="262" fill="#e2e8f0" font-size="12" text-anchor="end">belief b → MLP → action</text>
  <text x="20" y="290" fill="#94a3b8" font-size="12" text-anchor="start">예로 든 값: lᵉ = 0.5, g<tspan baseline-shift="sub" font-size="10">b</tspan>(b′) = 0.1</text>
  <rect x="20" y="298" width="680" height="56" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="34" y="320" fill="#7fc4a2" font-size="13" text-anchor="start">지도와 다리의 감각이 맞는다</text>
  <text x="34" y="342" fill="#e2e8f0" font-size="12" text-anchor="start">gate 입력 2.2 → α = σ(2.2) ≈ 0.90 → 지나가는 값 0.90 × 0.5 = 0.45 → b = 0.1 + 0.45 = 0.55</text>
  <rect x="20" y="360" width="680" height="56" rx="8" fill="#111a2e" stroke="#d88b8b" stroke-width="1.8"/>
  <text x="34" y="382" fill="#d88b8b" font-size="13" text-anchor="start">지도와 다리의 감각이 어긋난다</text>
  <text x="34" y="404" fill="#e2e8f0" font-size="12" text-anchor="start">gate 입력 −2.2 → α = σ(−2.2) ≈ 0.10 → 지나가는 값 0.10 × 0.5 = 0.05 → b = 0.1 + 0.05 = 0.15</text>
</svg>
