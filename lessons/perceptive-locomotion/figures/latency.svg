<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>지연의 시간표. 예로 1 m/s 로 달리는 로봇에서 policy 는 0.02 초마다 action 을 내고, depth 는 0.1 초마다 찍히며 0.08 초 지연 뒤 도착한다. 0 초에 찍은 사진은 0.08 초부터 다음 사진이 도착하는 0.18 초 전까지 action 5 번(0.08, 0.10, 0.12, 0.14, 0.16 초)에 쓰이고, 찍은 뒤 처음 쓰기까지 로봇은 1 × 0.08 = 0.08 m 를 간다</title>
