  <line x1="238.5" y1="220" x2="399" y2="220" stroke="#d6aa62" stroke-width="1.2"/>
  <text x="318.75" y="238" fill="#d6aa62" font-size="12" text-anchor="middle">사진 하나로 action 5 번</text>
  <rect x="20" y="280" width="680" height="38" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="34" y="304" fill="#e2e8f0" font-size="13" text-anchor="start">0 초에 찍은 사진을 처음 쓰는 0.08 초까지 로봇은 1 m/s × 0.08 초 = 0.08 m 를 간다</text>
