<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>depth policy 의 2 단계 학습. phase 1 에서는 scandots(정해 둔 자리의 지형 높이)와 proprioception 을 받는 policy 를 PPO 로 학습하고, 높이만 읽는 simulation 은 1초에 약 20만 step 을 만든다. phase 2 에서는 phase 1 의 weight 를 복사한 student 가 58 × 87 depth image 를 CNN 과 GRU 로 받아 simulation 에서 움직이고, 지나간 상태마다 phase 1 policy 가 낸 action 과의 차이 제곱을 줄인다. depth 를 그리는 simulation 은 1초에 500 step 이라 400 배 느리다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="398" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#d6aa62" font-size="14" text-anchor="start">phase 1: reinforcement learning (PPO)</text>
  <text x="700" y="32" fill="#d6aa62" font-size="13" text-anchor="end">1초에 약 20만 step</text>
  <rect x="20" y="48" width="150" height="46" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="95" y="68" fill="#e2e8f0" font-size="13" text-anchor="middle">scandots</text>
  <text x="95" y="86" fill="#94a3b8" font-size="11" text-anchor="middle">정해 둔 자리의 지형 높이</text>
  <rect x="20" y="104" width="150" height="40" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="95" y="129" fill="#e2e8f0" font-size="13" text-anchor="middle">proprioception</text>
  <line x1="170" y1="71" x2="228" y2="96" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="170" y1="124" x2="228" y2="104" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="232" y="74" width="150" height="52" rx="8" fill="#111a2e" stroke="#d6aa62" stroke-width="1.8"/>
  <text x="307" y="97" fill="#e2e8f0" font-size="13" text-anchor="middle">phase 1 policy</text>
  <text x="307" y="115" fill="#94a3b8" font-size="11" text-anchor="middle">MLP, GRU</text>
  <line x1="382" y1="100" x2="430" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="434" y="78" width="110" height="44" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="489" y="105" fill="#e2e8f0" font-size="13" text-anchor="middle">action a</text>
  <line x1="544" y1="100" x2="590" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="594" y="78" width="106" height="44" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="647" y="105" fill="#e2e8f0" font-size="13" text-anchor="middle">reward 로 고침</text>
  <path d="M307,126 L307,196" fill="none" stroke="#a99ad6" stroke-width="1.8" marker-end="url(#arrow-violet)" stroke-dasharray="6 4"/>
  <text x="318" y="170" fill="#a99ad6" font-size="12" text-anchor="start">weight 복사</text>
  <line x1="20" y1="160" x2="700" y2="160" stroke="#1e293b" stroke-width="1.5"/>
  <text x="20" y="186" fill="#7fc4a2" font-size="14" text-anchor="start">phase 2: supervised learning (DAgger)</text>
  <text x="700" y="186" fill="#7fc4a2" font-size="13" text-anchor="end">1초에 500 step (400 배 느림)</text>
  <rect x="20" y="202" width="150" height="46" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="95" y="222" fill="#e2e8f0" font-size="13" text-anchor="middle">depth image</text>
  <text x="95" y="240" fill="#94a3b8" font-size="11" text-anchor="middle">58 × 87 = 5,046 개</text>
  <line x1="170" y1="225" x2="196" y2="225" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="200" y="206" width="70" height="38" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="235" y="230" fill="#e2e8f0" font-size="13" text-anchor="middle">CNN</text>
  <line x1="270" y1="225" x2="290" y2="225" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="294" y="200" width="130" height="52" rx="8" fill="#111a2e" stroke="#7fc4a2" stroke-width="1.8"/>
  <text x="359" y="223" fill="#e2e8f0" font-size="13" text-anchor="middle">student policy</text>
  <text x="359" y="241" fill="#94a3b8" font-size="11" text-anchor="middle">GRU</text>
  <rect x="20" y="262" width="150" height="38" rx="8" fill="#111a2e" stroke="#7cb4d8" stroke-width="1.8"/>
  <text x="95" y="286" fill="#e2e8f0" font-size="13" text-anchor="middle">proprioception</text>
  <line x1="170" y1="281" x2="290" y2="236" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <line x1="424" y1="226" x2="470" y2="226" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-muted)"/>
  <rect x="474" y="204" width="110" height="44" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="529" y="231" fill="#e2e8f0" font-size="13" text-anchor="middle">action â</text>
  <text x="529" y="268" fill="#94a3b8" font-size="11" text-anchor="middle">simulation 에서 움직인다</text>
  <rect x="20" y="316" width="680" height="70" rx="8" fill="#111a2e" stroke="#a99ad6" stroke-width="1.8"/>
  <text x="34" y="340" fill="#e2e8f0" font-size="13" text-anchor="start">student 가 지나간 상태마다 phase 1 policy 가 정답 action a 를 낸다</text>
  <text x="34" y="364" fill="#94a3b8" font-size="12" text-anchor="start">loss = (a − â)², reward 없이 600만 sample 로 학습. 같은 150억 sample 을 depth 로 모으면 15×10⁹ ÷ 500 = 3×10⁷ 초 ≈ 347 일</text>
</svg>
