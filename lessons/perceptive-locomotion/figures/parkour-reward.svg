<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>Cheng 등의 inner product reward. 예로 다음 경유점 방향이 (1, 0)이고 명령 속도가 1.0 m/s 일 때, 속도 (1.2, 0)은 inner product 1.2 가 1.0 에서 잘려 1.0, (0.6, 0.8)은 0.6, (0, 1.0)은 0, (−0.5, 0)은 −0.5 를 받는다. reward 는 속도를 경유점 방향에 내린 길이를 명령 속도에서 자른 값이다</title>
  <defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker></defs>
  <rect x="1" y="1" width="718" height="358" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="20" y="32" fill="#7cb4d8" font-size="14" text-anchor="start">속도 vector 와 경유점 방향 (예: 명령 속도 1.0 m/s)</text>
  <line x1="96" y1="250" x2="388.5" y2="250" stroke="#334155" stroke-width="1.2"/>
  <line x1="200" y1="295.5" x2="200" y2="68" stroke="#334155" stroke-width="1.2"/>
  <line x1="330" y1="280" x2="330" y2="74.5" stroke="#d6aa62" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="334" y="83.6" fill="#d6aa62" font-size="11" text-anchor="start">명령 1.0 에서 자름</text>
  <line x1="200" y1="272" x2="317" y2="272" stroke="#d6aa62" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <text x="206" y="290" fill="#d6aa62" font-size="12" text-anchor="start">경유점 방향 d = (1, 0)</text>
  <line x1="200" y1="244" x2="356" y2="244" stroke="#7fc4a2" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="370" y="236" fill="#7fc4a2" font-size="12" text-anchor="start">(1.2, 0)</text>
  <line x1="200" y1="250" x2="278" y2="146" stroke="#7cb4d8" stroke-width="2.2" marker-end="url(#arrow-sky)"/>
  <line x1="278" y1="146" x2="278" y2="250" stroke="#7cb4d8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="292" y="140" fill="#7cb4d8" font-size="12" text-anchor="start">(0.6, 0.8)</text>
  <line x1="200" y1="250" x2="200" y2="120" stroke="#a99ad6" stroke-width="2.2" marker-end="url(#arrow-violet)"/>
  <text x="214" y="114" fill="#a99ad6" font-size="12" text-anchor="start">(0, 1.0)</text>
  <line x1="200" y1="256" x2="135" y2="256" stroke="#d88b8b" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="127" y="248" fill="#d88b8b" font-size="12" text-anchor="end">(−0.5, 0)</text>
  <rect x="430" y="56" width="270" height="200" rx="8" fill="#111a2e" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="444" y="82" fill="#e2e8f0" font-size="13" text-anchor="start">속도</text>
  <text x="560" y="82" fill="#e2e8f0" font-size="13" text-anchor="middle">v · d</text>
  <text x="650" y="82" fill="#e2e8f0" font-size="13" text-anchor="middle">reward</text>
  <text x="444" y="114" fill="#7fc4a2" font-size="13" text-anchor="start">(1.2, 0)</text>
  <text x="560" y="114" fill="#94a3b8" font-size="13" text-anchor="middle">1.2</text>
  <text x="650" y="114" fill="#e2e8f0" font-size="13" text-anchor="middle">1.0</text>
  <text x="444" y="146" fill="#7cb4d8" font-size="13" text-anchor="start">(0.6, 0.8)</text>
  <text x="560" y="146" fill="#94a3b8" font-size="13" text-anchor="middle">0.6</text>
  <text x="650" y="146" fill="#e2e8f0" font-size="13" text-anchor="middle">0.6</text>
  <text x="444" y="178" fill="#a99ad6" font-size="13" text-anchor="start">(0, 1.0)</text>
  <text x="560" y="178" fill="#94a3b8" font-size="13" text-anchor="middle">0</text>
  <text x="650" y="178" fill="#e2e8f0" font-size="13" text-anchor="middle">0</text>
  <text x="444" y="210" fill="#d88b8b" font-size="13" text-anchor="start">(−0.5, 0)</text>
  <text x="560" y="210" fill="#94a3b8" font-size="13" text-anchor="middle">−0.5</text>
  <text x="650" y="210" fill="#e2e8f0" font-size="13" text-anchor="middle">−0.5</text>
  <text x="444" y="244" fill="#94a3b8" font-size="12" text-anchor="start">reward = min(v · d, 1.0)</text>
  <text x="430" y="290" fill="#e2e8f0" font-size="12" text-anchor="start">명령보다 빨라도 1.0 을 넘지 않고,</text>
  <text x="430" y="312" fill="#e2e8f0" font-size="12" text-anchor="start">방향이 어긋난 만큼 덜 받는다</text>
  <text x="430" y="340" fill="#94a3b8" font-size="12" text-anchor="start">v 는 world 좌표계의 속도</text>
</svg>
