  <circle cx="250.0" cy="175.7" r="6" fill="#a78bfa"/>
  <circle cx="327.1" cy="72.9" r="6" fill="#38bdf8"/>
  <text x="206.6" y="266.3" fill="#f59e0b" font-size="12" text-anchor="start">지금 (0.3, 0.2)</text>
  <text x="260.0" y="191.7" fill="#a78bfa" font-size="12" text-anchor="start">2 초 뒤 (0.42, 0.36)</text>
  <text x="327.1" y="60.9" fill="#38bdf8" font-size="12" text-anchor="middle">목표 (0.6, 0.6)</text>
  <text x="238.6" y="222.6" fill="#34d399" font-size="12" text-anchor="start" font-weight="600">2 × 속도</text>
  <text x="280.6" y="120.3" fill="#94a3b8" font-size="12" text-anchor="end">0.3 m</text>
  <text x="370.0" y="362.0" fill="#64748b" font-size="11" text-anchor="end">x (m)</text>
  <text x="420.0" y="80.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">속도 = 0.1 m/s × unit vector</text>
  <text x="420.0" y="104.0" fill="#94a3b8" font-size="12" text-anchor="start">0.1 × (0.6, 0.8) = (0.06, 0.08)</text>
  <text x="420.0" y="152.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">2 초 동안의 변위 (scalar 곱)</text>
  <text x="420.0" y="176.0" fill="#34d399" font-size="12" text-anchor="start">2 × (0.06, 0.08) = (0.12, 0.16)</text>
  <text x="420.0" y="224.0" fill="#e2e8f0" font-size="13" text-anchor="start" font-weight="600">새 위치 (덧셈)</text>
  <text x="420.0" y="248.0" fill="#94a3b8" font-size="12" text-anchor="start">(0.3, 0.2) + (0.12, 0.16)</text>
  <text x="420.0" y="268.0" fill="#a78bfa" font-size="12" text-anchor="start">= (0.42, 0.36)</text>
  <text x="420.0" y="308.0" fill="#94a3b8" font-size="12" text-anchor="start">남은 거리 √(0.18² + 0.24²) = 0.3 m</text>
