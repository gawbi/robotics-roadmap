<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>관절 두 개짜리 팔에서 관절 하나만 1 rad/s 로 돌릴 때 손끝이 움직이는 속도. 팔꿈치를 90° 굽힌 자세에서는 관절 1 이 손끝을 (−1, 1), 관절 2 가 (−1, 0) 으로 움직여 두 방향이 다르고, 팔을 쭉 편 자세에서는 관절 1 이 (0, 2), 관절 2 가 (0, 1) 로 둘 다 세로 방향이라 손끝을 가로로 움직일 수 없다</title>
  <defs><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
  <rect x="1" y="1" width="678" height="368" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="340" y="28" fill="#94a3b8" font-size="13" text-anchor="middle">관절 하나만 1 rad/s 로 돌릴 때 손끝이 움직이는 속도 (m/s)</text>
  <line x1="340" y1="44" x2="340" y2="350" stroke="#1e293b" stroke-width="1"/>
  <text x="170" y="56" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">팔꿈치를 90° 굽힘 (0°, 90°)</text>
  <line x1="70" y1="262" x2="160" y2="262" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="160" y1="262" x2="160" y2="172" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <rect x="56" y="270" width="28" height="8" fill="#334155"/>
  <circle cx="70" cy="262" r="8" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="160" cy="262" r="8" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="160" cy="172" r="4.5" fill="#e2e8f0"/>
  <text x="70" y="296" fill="#38bdf8" font-size="12" text-anchor="middle">관절 1</text>
  <text x="160" y="296" fill="#f59e0b" font-size="12" text-anchor="middle">관절 2</text>
  <line x1="160" y1="172" x2="110.0" y2="122.0" stroke="#38bdf8" stroke-width="3" marker-end="url(#a-sky)"/>
  <line x1="160" y1="172" x2="110.0" y2="172.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#a-amber)"/>
  <text x="104" y="118" fill="#38bdf8" font-size="12" text-anchor="end">관절 1: (−1, 1)</text>
  <text x="102" y="176" fill="#f59e0b" font-size="12" text-anchor="end">관절 2: (−1, 0)</text>
  <text x="170" y="164" fill="#94a3b8" font-size="11">손끝</text>
  <line x1="236" y1="150" x2="280" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <line x1="236" y1="150" x2="236" y2="106" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a-gray)"/>
  <text x="284" y="154" fill="#94a3b8" font-size="12">x 가로</text>
  <text x="236" y="98" fill="#94a3b8" font-size="12" text-anchor="middle">y 세로</text>
  <text x="170" y="326" fill="#e2e8f0" font-size="12" text-anchor="middle">두 화살표의 방향이 달라서, 섞으면</text>
  <text x="170" y="344" fill="#e2e8f0" font-size="12" text-anchor="middle">손끝을 가로로도 세로로도 움직일 수 있다</text>
  <text x="510" y="56" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">팔을 쭉 폄 (0°, 0°)</text>
  <line x1="392" y1="262" x2="482" y2="262" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="482" y1="262" x2="572" y2="262" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <rect x="378" y="270" width="28" height="8" fill="#334155"/>
  <circle cx="392" cy="262" r="8" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="482" cy="262" r="8" fill="#0b1220" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="572" cy="262" r="4.5" fill="#e2e8f0"/>
  <text x="392" y="296" fill="#38bdf8" font-size="12" text-anchor="middle">관절 1</text>
  <text x="482" y="296" fill="#f59e0b" font-size="12" text-anchor="middle">관절 2</text>
  <line x1="565" y1="262" x2="565.0" y2="162.0" stroke="#38bdf8" stroke-width="3" marker-end="url(#a-sky)"/>
  <line x1="579" y1="262" x2="579.0" y2="212.0" stroke="#f59e0b" stroke-width="3" marker-end="url(#a-amber)"/>
  <text x="558" y="172" fill="#38bdf8" font-size="12" text-anchor="end">관절 1: (0, 2)</text>
  <text x="588" y="222" fill="#f59e0b" font-size="12" text-anchor="start">관절 2:</text>
  <text x="588" y="238" fill="#f59e0b" font-size="12" text-anchor="start">(0, 1)</text>
  <text x="576" y="286" fill="#94a3b8" font-size="11">손끝</text>
  <text x="510" y="326" fill="#e2e8f0" font-size="12" text-anchor="middle">두 화살표가 모두 세로라서, 어떻게 섞어도</text>
  <text x="510" y="344" fill="#f87171" font-size="12" text-anchor="middle">손끝 속도의 가로 component 는 0 이다</text>
</svg>
