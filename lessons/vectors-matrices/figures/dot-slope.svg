<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif">
  <title>30° 경사로 위의 10 kg 로봇. 아래로 98.1 N 인 gravity 를 경사 방향 unit vector (0.866, 0.5) 와 dot product 하면 경사를 따라 내려가는 49.05 N 이, 수직 방향 (−0.5, 0.866) 과 하면 면을 누르는 84.96 N 이 나온다</title>
  <defs><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6aa62"/></marker><marker id="a-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7cb4d8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fc4a2"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d88b8b"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a99ad6"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e2e8f0"/></marker><marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="678" height="378" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <path d="M50,340 L396.4,340 L396.4,140.0 z" fill="#111a2e" stroke="#475569" stroke-width="1.5"/>
  <text x="120.0" y="330.0" fill="#94a3b8" font-size="12" text-anchor="middle">30°</text>
  <polygon points="244.9,227.5 305.5,192.5 285.5,157.9 224.9,192.9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="255.2" cy="221.5" r="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="295.1" cy="198.5" r="8" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/>
  <line x1="265.2" y1="192.7" x2="265.2" y2="320.2" stroke="#d88b8b" stroke-width="2.6" marker-end="url(#a-red)"/>
  <text x="273.2" y="328.2" fill="#d88b8b" font-size="12" text-anchor="start">gravity (0, −98.1) N</text>
  <line x1="265.2" y1="192.7" x2="209.9" y2="224.6" stroke="#d6aa62" stroke-width="2.6" marker-end="url(#a-amber)"/>
  <text x="201.9" y="214.6" fill="#d6aa62" font-size="12" text-anchor="end">경사 방향 몫 49.05 N</text>
  <line x1="265.2" y1="192.7" x2="320.4" y2="288.3" stroke="#7cb4d8" stroke-width="2.6" marker-end="url(#a-sky)"/>
  <text x="328.4" y="302.3" fill="#7cb4d8" font-size="12" text-anchor="start">수직 방향 몫 84.96 N</text>
  <line x1="209.9" y1="224.6" x2="265.2" y2="320.2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="320.4" y1="288.3" x2="265.2" y2="320.2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="265.2" cy="192.7" r="4" fill="#e2e8f0"/>
  <text x="470.0" y="50.0" fill="#d6aa62" font-size="12" text-anchor="start">u = (0.866, 0.5)  경사 방향</text>
  <text x="470.0" y="72.0" fill="#e2e8f0" font-size="12" text-anchor="start">g · u = −98.1 × 0.5 = −49.05</text>
  <text x="470.0" y="108.0" fill="#7cb4d8" font-size="12" text-anchor="start">n = (−0.5, 0.866)  수직 방향</text>
  <text x="470.0" y="130.0" fill="#e2e8f0" font-size="12" text-anchor="start">g · n = −98.1 × 0.866 = −84.96</text>
  <text x="470.0" y="166.0" fill="#94a3b8" font-size="12" text-anchor="start">바퀴가 위로 밀어야 하는 힘 49.05 N</text>
</svg>
