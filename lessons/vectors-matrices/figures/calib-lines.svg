  <text x="650.0" y="312.0" fill="#64748b" font-size="11" text-anchor="end">s (pixel/m)</text>
  <text x="402.0" y="42.0" fill="#64748b" font-size="11" text-anchor="end">c</text>
  <line x1="70.0" y1="111.7" x2="310.0" y2="207.1" stroke="#d6aa62" stroke-width="2.2"/>
  <line x1="70.0" y1="55.6" x2="258.2" y2="280.0" stroke="#7cb4d8" stroke-width="2.2"/>
  <line x1="70.0" y1="55.0" x2="258.7" y2="280.0" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="140.6" cy="139.8" r="5" fill="#7fc4a2"/>
  <text x="150.6" y="129.8" fill="#7fc4a2" font-size="11" text-anchor="start">(500, 100) → (505, 99.5)</text>
  <text x="197.1" y="146.2" fill="#d6aa62" font-size="11" text-anchor="start">0.1s + c = 150</text>
  <text x="81.3" y="271.2" fill="#7cb4d8" font-size="11" text-anchor="start">0.3s + c = 250</text>
  <line x1="410.0" y1="111.7" x2="650.0" y2="207.1" stroke="#d6aa62" stroke-width="3.2"/>
  <line x1="410.0" y1="111.4" x2="650.0" y2="207.7" stroke="#7cb4d8" stroke-width="1.4"/>
  <line x1="410.0" y1="110.9" x2="650.0" y2="207.2" stroke="#7cb4d8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="480.6" cy="139.8" r="5" fill="#7fc4a2"/>
  <circle cx="621.8" cy="195.9" r="5" fill="#d88b8b"/>
  <text x="488.6" y="127.8" fill="#7fc4a2" font-size="11" text-anchor="start">정확히 잼 (500, 100)</text>
  <text x="617.8" y="217.9" fill="#d88b8b" font-size="11" text-anchor="end">1 칸 틀림 (1500, 0)</text>
  <text x="418.5" y="257.6" fill="#94a3b8" font-size="11" text-anchor="start">두 직선이 거의 겹친다</text>
  <text x="340.0" y="346.0" fill="#94a3b8" font-size="11" text-anchor="middle">주황: 첫째 표식의 식 · 파랑: 둘째 표식의 식(점선은 pixel 이 1 칸 틀린 경우) · 교점이 답 (s, c)</text>
