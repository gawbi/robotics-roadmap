# 강의 퀴즈. topic 하나가 한 문항이고, 다시 풀면 지난 회차의 다음 variant 를 낸다.
# answer 는 choices 의 0부터 센 번호다.

- topic: vector-ops
  title: vector 의 덧셈·scalar 곱·norm
  section: vector-덧셈과-scalar-곱
  variants:
    - question: |
        gripper 가 $(0.3, 0.2)$ m 에, 목표가 $(0.6, 0.6)$ m 에 있다. gripper 에서 목표까지의 거리는?
      choices:
        - '0.5 m. 차이 vector $(0.3, 0.4)$ 의 norm 이다'
        - '0.7 m. 차이 vector 의 두 component 를 더한 $0.3 + 0.4$ 다'
        - '0.25 m. 차이 vector 의 component 를 제곱해 더한 값이다'
        - '0.85 m. 원점에서 목표까지 잰 목표 위치 vector 의 norm 이다'
      answer: 0
      explanation: |
        두 위치 사이의 거리는 목표에서 gripper 를 뺀 차이 vector $(0.3, 0.4)$ 의 norm 인 $\sqrt{0.3^2 + 0.4^2} = \sqrt{0.25} = 0.5$ m 다.
        component 를 그냥 더한 0.7 은 가로로 간 뒤 세로로 가는 길이라 직선 거리보다 길다. 0.25 는 제곱근을 빼먹은 값이고, 목표 위치 vector
        의 norm 은 원점에서 목표까지의 거리라 gripper 위치와 관계가 없다.
    - question: |
        vector 에 scalar 2 를 곱하면 vector 는 어떻게 바뀌는가? 또 −1 을 곱하면 어떻게 바뀌는가?
      choices:
        - '2 를 곱하면 방향이 2 배 돌아가고, −1 을 곱하면 길이가 0 이 된다'
        - '2 를 곱하면 첫째 component 만 2 배가 되고, −1 을 곱하면 첫째 component 의 부호만 바뀐다'
        - '2 를 곱하면 방향은 그대로이고 길이가 2 배가 되며, −1 을 곱하면 길이는 그대로이고 방향이 반대가 된다'
        - '2 를 곱하면 norm 이 4 배가 되고, −1 을 곱하면 vector 가 바뀌지 않는다'
      answer: 2
      explanation: |
        scalar 곱은 모든 component 에 같은 수를 곱하므로 component 사이의 비율이 그대로라서, 방향은 바뀌지 않고 길이만 그 배수가 된다. 음수를 곱하면
        모든 component 의 부호가 바뀌어 정반대 방향을 가리킨다. 한 component 만 바뀌거나 방향이 돌아가는 일은 없고, 길이는 제곱이 아니라
        곱한 수의 절댓값 배로 바뀐다.
    - question: |
        로봇이 $(1, 1)$ 에 있고 목표 쪽 unit vector 가 $(0.6, 0.8)$ 이다. 목표 쪽으로 0.5 m/s 로 1 초 움직이면 어디에 있는가?
      choices:
        - '$(1.6, 1.8)$. unit vector 가 이미 방향을 담고 있으니 위치에 그대로 더한다'
        - '$(1.3, 1.4)$. unit vector 에 0.5 를 곱한 $(0.3, 0.4)$ 를 위치에 더한다'
        - '$(1.5, 1.5)$. 두 component 에 0.5 를 똑같이 더한다'
        - '$(0.8, 1.3)$. unit vector 에 0.5 를 곱하고 위치와 곱한다'
      answer: 1
      explanation: |
        속도 명령은 unit vector 에 속력을 곱한 $0.5 \times (0.6, 0.8) = (0.3, 0.4)$ m/s 이고, 새 위치는 지금 위치 + 시간 × 속도라서
        $(1, 1) + 1 \times (0.3, 0.4) = (1.3, 1.4)$ 다. unit vector 를 그대로 더하면 0.5 m 가 아니라 1 m 를 움직이게 되고, 0.5 를 두 component 에 똑같이
        더하면 방향이 45° 로 바뀐다. 위치와 vector 를 component 끼리 곱하는 계산은 이동이 아니다.

- topic: dot-product
  title: dot product 와 projection
  section: dot-product
  variants:
    - question: |
        unit vector $\mathbf{u}$ 와 힘 $\mathbf{F}$ 의 dot product $\mathbf{F} \cdot \mathbf{u}$ 는 물리적으로 무엇을 뜻하는가?
      choices:
        - '힘과 방향을 곱한 새 vector 로, 방향은 $\mathbf{u}$ 와 $\mathbf{F}$ 의 중간이다'
        - '$\mathbf{u}$ 의 길이가 1 이라 곱해도 그대로인 $\mathbf{F}$ 의 크기로, 방향과는 관계가 없다'
        - '$\mathbf{F}$ 와 $\mathbf{u}$ 사이의 각도를 도(°) 단위로 준다'
        - '$\mathbf{F}$ 가운데 $\mathbf{u}$ 방향으로 작용하는 몫인 projection 길이다'
      answer: 3
      explanation: |
        dot product 는 $\|\mathbf{F}\|\,\|\mathbf{u}\|\cos\theta$ 이고 $\|\mathbf{u}\| = 1$ 이라 $\|\mathbf{F}\|\cos\theta$ 가 남는데, 이 값은 힘을
        그 방향의 직선에 떨어뜨린 그림자의 길이다. 결과는 vector 가 아니라 숫자 하나이고, 방향에 따라 값이 달라진다. 결과에는 각도 자체가
        아니라 각도의 cos 가 곱해져 있다.
    - question: |
        질량 10 kg 인 로봇이 30° 경사로에 서 있다. gravity 98.1 N 중 경사로를 따라 작용하는 몫을 구하려면 무엇을 계산하는가?
      choices:
        - 'gravity 의 크기 98.1 N 을 그대로 쓴다. 경사로 위에서도 gravity 는 변하지 않는다'
        - 'gravity vector 와 경사 방향 unit vector 의 dot product 로 −49.05 N 을 구한다'
        - '경사가 가파를수록 몫이 작아지므로 98.1 N 을 경사 각도 30 으로 나눈다'
        - 'gravity vector 와 경사 방향 vector 를 component 끼리 더한다'
      answer: 1
      explanation: |
        경사 방향 unit vector $(0.866, 0.5)$ 와 gravity $(0, -98.1)$ 의 dot product 는 $-98.1 \times 0.5 = -49.05$ N 이고, 음수라서 내려가는
        쪽이다. 바퀴는 이만큼 위로 밀어야 미끄러지지 않는다. 98.1 N 전체는 경사 방향과 수직 방향의 몫을 합친 크기라 경사 방향 몫이 아니고,
        각도로 나누거나 vector 를 더하는 계산은 projection 이 아니다.
    - question: |
        로봇이 $(1, 0)$ 방향을 보고 있고, 로봇에서 목표로 가는 방향이 $(-0.6, 0.8)$ 이다. 두 vector 의 dot product 로 무엇을 알 수 있는가?
      choices:
        - '$-0.6$ 으로 음수라서, 둘 사이 각도가 90° 보다 커 목표가 뒤쪽에 있다'
        - '$0.2$ 로 양수라서 둘 사이 각도가 90° 보다 작고, 목표가 로봇 앞쪽에 있다'
        - '$-0.6$ 이고, 부호를 뗀 0.6 이 로봇에서 목표까지의 거리(m)다'
        - '0 이라서 두 vector 가 직각이고 목표가 로봇의 정확히 옆에 있다'
      answer: 0
      explanation: |
        dot product 는 $1 \times (-0.6) + 0 \times 0.8 = -0.6$ 이다. $\cos\theta$ 와 부호가 같으므로 음수면 사이 각도가 90° 보다 커서 목표가
        뒤쪽에 있다. 0.2 는 component 를 모두 더한 잘못된 계산이고, dot product 는 거리가 아니라 방향 관계를 알려 준다. 0 은 정확히
        직각일 때다.

- topic: matrix-vector
  title: 행렬과 vector 의 곱
  section: 행렬과-vector-의-곱
  variants:
    - question: |
        2×2 행렬 $A$ 의 첫째 열과 둘째 열은 기하학적으로 무엇을 뜻하는가?
      choices:
        - '첫째 열은 $A$ 가 vector 를 늘이는 배수이고, 둘째 열은 $A$ 가 vector 를 돌리는 각도다'
        - '두 열은 $A$ 를 곱해도 방향과 길이가 바뀌지 않는 vector 두 개다'
        - '첫째 열은 $(1, 0)$ 이 도착하는 곳이고, 둘째 열은 $(0, 1)$ 이 도착하는 곳이다'
        - '첫째 열은 원점이 옮겨 가는 곳이고, 둘째 열은 $(1, 1)$ 이 옮겨 가는 곳이다'
      answer: 2
      explanation: |
        $A(1, 0)$ 을 계산하면 $A$ 의 첫째 열이, $A(0, 1)$ 을 계산하면 둘째 열이 그대로 나온다. 행렬 곱은 덧셈과 scalar 곱을 지키므로
        $A(x, y) = xA(1, 0) + yA(0, 1)$ 이라서, 이 두 도착점만 알면 모든 vector 가 어디로 가는지 정해진다. 원점은 행렬을 곱해도 늘 원점이고,
        열은 $A$ 를 곱해도 바뀌지 않는 vector 가 아니다.
    - question: |
        LiDAR 가 로봇 정면에서 시계 반대 방향으로 90° 돌아간 채 달려 있다. 90° 회전 행렬은 $\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$ 이다.
        LiDAR 기준 장애물 위치 $(3, 1)$ 은 로봇 기준으로 어디인가?
      choices:
        - '$(-1, 3)$. 행마다 $(3, 1)$ 과 dot product 를 구해 쌓는다'
        - '$(3, 1)$. 회전은 길이를 바꾸지 않으므로 좌표도 그대로다'
        - '$(1, -3)$. LiDAR 를 돌린 만큼 거꾸로 되돌려야 하므로 시계 방향으로 돌린다'
        - '$(0, -1)$. 행렬의 첫째 행이 곧 회전한 결과라서 그대로 쓴다'
      answer: 0
      explanation: |
        행렬과 vector 의 곱은 행마다 dot product 를 구해 쌓은 것이라 $(0 \times 3 - 1 \times 1,\ 1 \times 3 + 0 \times 1) = (-1, 3)$ 이다.
        LiDAR 의 앞쪽이 로봇의 왼쪽이어서 LiDAR 앞 3 m 가 로봇 왼쪽 3 m 가 된다. 회전은 길이만 지키고 좌표는 바꾸며, $(1, -3)$ 은 반대
        방향으로 돌린 결과다.
    - question: |
        입력이 3 개이고 출력이 2 개인 neural network 층은 행렬로 어떻게 적고, 회전 행렬과 무엇이 다른가?
      choices:
        - '입력이 3 개라 3×2 행렬이고, 회전 행렬과 달리 곱셈 없이 입력을 더하기만 한다'
        - '2×2 행렬 두 개를 이어 붙이고, 출력은 언제나 입력과 길이가 같다'
        - '행렬은 정사각이어야 하므로 3×3 행렬로 계산한 뒤, 출력 3 개 가운데 2 개만 골라 쓴다'
        - '2×3 행렬을 곱하는 같은 계산이고, 숫자를 사람이 정하지 않고 데이터로 학습한다'
      answer: 3
      explanation: |
        행이 출력 수, 열이 입력 수라서 2×3 행렬이고, 계산은 회전 행렬과 똑같이 행마다 dot product 를 구한다. 다만 weight 라고 부르는 $W$
        의 숫자는 사람이 정하지 않고 학습으로 정한다. 3×2 는 입력 2 개를 출력 3 개로 바꾸는 모양이고, 출력 길이가 입력과 같을 이유는 없다.

- topic: matrix-order
  title: 행렬 곱의 순서
  section: 행렬과-행렬의-곱
  variants:
    - question: |
        점 $p$ 에 $ABp$ 를 계산하면 어떤 변환이 먼저 적용되는가? 순서를 바꿔 $BAp$ 로 하면 결과가 같은가?
      choices:
        - '왼쪽부터 읽으므로 $A$ 가 먼저 적용되고, 행렬 곱은 순서를 바꿔도 결과가 같다'
        - '$p$ 에 가까운 $B$ 가 먼저 적용되고, 순서를 바꾸면 결과가 달라질 수 있다'
        - '두 행렬을 먼저 곱해 하나로 만들므로 두 변환이 동시에 적용되고, 결과는 늘 같다'
        - '$B$ 가 먼저 적용되지만, 행렬 곱은 숫자 곱처럼 순서를 바꿔도 같다'
      answer: 1
      explanation: |
        $ABp = A(Bp)$ 이므로 오른쪽의 $B$ 가 먼저 $p$ 를 바꾸고 그 결과에 $A$ 가 적용된다. 90° 회전과 가로 2 배 늘이기처럼 많은 경우 두 순서의
        결과가 다르다. 예를 들어 $(2, 1)$ 은 회전 먼저면 $(-2, 2)$, 늘이기 먼저면 $(-1, 4)$ 가 된다. 숫자의 곱셈과 달리 행렬 곱은 순서를 바꿀 수 없다.
    - question: |
        원점 중심으로 도는 턴테이블과 x 방향으로 3 m 옮기는 컨베이어가 있다. $(2, 1)$ 의 부품을 90° 돌린 뒤 옮기면 $(2, 2)$ 에 간다. 먼저 옮긴 뒤
        90° 돌리면 어디로 가는가?
      choices:
        - '$(2, 2)$. 같은 두 동작을 했으니 순서를 바꿔도 같은 자리에 간다'
        - '$(5, 1)$. 턴테이블은 원점에서만 돌리므로 옮긴 뒤에는 회전 효과가 없다'
        - '$(-1, 2)$. 먼저 한 이동은 나중에 한 회전에 묻혀 사라진다'
        - '$(-1, 5)$. 옮긴 점 $(5, 1)$ 을 90° 돌린 자리다'
      answer: 3
      explanation: |
        옮기면 $(2, 1) \to (5, 1)$ 이고, 90° 회전 $(x, y) \to (-y, x)$ 로 $(5, 1) \to (-1, 5)$ 다. 원점에서 멀어진 뒤에 돌아서 더 큰 원을
        그리므로 $(2, 2)$ 와 다른 곳에 도착한다. 회전과 이동이 섞이면 순서가 결과를 바꾼다.
    - question: |
        평면에서 점을 $(3, 0)$ 만큼 옮기는 이동을 2×2 행렬 하나로 적을 수 없는 이유는 무엇인가?
      choices:
        - '2×2 행렬의 칸 4 개는 이미 회전에 쓰이고 있어서, 이동량 3 을 담을 빈 칸이 없기 때문이다'
        - '이동은 두 점 사이의 거리를 바꾸므로, 길이를 지키는 행렬로는 적을 수 없기 때문이다'
        - '어떤 2×2 행렬도 원점을 원점으로 보내는데, 이동은 원점을 $(3, 0)$ 으로 보내야 하기 때문이다'
        - '이동은 되돌리는 inverse 가 없어서, inverse 가 있어야 하는 행렬이 될 수 없기 때문이다'
      answer: 2
      explanation: |
        행렬과 vector 의 곱은 component 에 숫자를 곱해 더하기만 해서 $(0, 0)$ 은 늘 $(0, 0)$ 으로 간다. 이동은 원점까지 옮겨야 하므로 2×2 행렬로는
        안 되고, vector 끝에 1 을 붙여 3×3 행렬로 적는 homogeneous transform 을 쓴다. 이동은 두 점 사이의 거리를 바꾸지 않고, 반대로
        $-(3, 0)$ 옮기면 되돌릴 수 있다.

- topic: shape
  title: 행렬의 모양과 transpose
  section: 행렬의-모양과-transpose
  variants:
    - question: |
        2×3 행렬과 3×64 행렬을 곱하면 결과의 모양은 무엇이고, 곱할 수 있는 조건은 무엇인가?
      choices:
        - '2×64. 앞 행렬의 열 수(3)와 뒤 행렬의 행 수(3)가 같아야 곱할 수 있다'
        - '3×3. 가운데 맞춘 숫자 3 이 결과의 행 수와 열 수가 된다'
        - '2×3. 행렬을 곱해도 결과는 앞 행렬의 모양을 그대로 따른다'
        - '64×2. 뒤 행렬의 열 수가 결과의 행 수가 되고, 앞 행렬의 행 수가 열 수가 된다'
      answer: 0
      explanation: |
        결과의 칸 하나는 앞 행렬의 행 하나와 뒤 행렬의 열 하나의 dot product 라서, 두 길이(앞의 열 수 3 과 뒤의 행 수 3)가 같아야 한다.
        결과는 앞의 행 수 × 뒤의 열 수인 2×64 다. 가운데 맞춘 숫자 3 은 dot product 안에서 사라지고, neural network에서는 입력 64 개 각각에
        출력 2 개씩이 열로 나온다.
    - question: |
        neural network 코드에서 (2×3) 행렬에 dimension 2 인 vector 를 곱하다가 shape 오류가 났다. 원인은 무엇인가?
      choices:
        - '행렬의 행 수 2 와 vector 의 dimension 2 가 같아서 결과가 숫자 하나인 1×1 이 되어 버리기 때문이다'
        - 'vector 를 가로로 적었기 때문이다. 2×3 행렬에는 세로 vector 만 곱할 수 있으니 세로로 바꾸면 계산된다'
        - '행렬의 열 수 3 과 vector 의 dimension 2 가 달라 dot product 를 계산할 수 없기 때문이다'
        - '행렬과 vector 는 원래 곱할 수 없고 행렬끼리만 곱할 수 있기 때문이다'
      answer: 2
      explanation: |
        $(2 \times 3) \times (2 \times 1)$ 은 행렬의 각 행에 숫자가 3 개, vector 에 숫자가 2 개라 짝을 맞춰 곱할 수 없다. 앞의 열 수와 뒤의 행 수가
        같아야 한다. 세로로 적는 것은 모양을 맞추는 표기일 뿐 길이 불일치를 해결하지 않고, 행렬과 vector 의 곱은 vector 를 n×1 행렬로 본
        행렬 곱이다.
    - question: |
        transpose 는 무엇이고, dot product 와 어떤 관계가 있는가?
      choices:
        - '모든 칸의 부호를 바꾼 행렬이고, 두 vector 가 반대쪽을 볼 때 dot product 의 부호를 뒤집는 데 쓴다'
        - '행과 열을 맞바꾼 행렬이고, dot product 를 $\mathbf{a}^\top\mathbf{b}$ 라는 행렬 곱으로 적을 수 있다'
        - '행렬의 inverse 를 부르는 다른 이름이고, 모든 행렬에서 $A^\top A = I$ 다'
        - '대각선의 숫자만 남긴 행렬이고, 대각선끼리 곱해 더하는 계산이 dot product 다'
      answer: 1
      explanation: |
        transpose 는 $i$ 행 $j$ 열의 숫자를 $j$ 행 $i$ 열로 옮긴 것이라 2×3 이 3×2 가 된다. $n \times 1$ 세로 vector 의 transpose 는 $1 \times n$
        이라 $(1 \times n) \times (n \times 1)$ 의 결과는 숫자 하나이고, 이 숫자가 dot product 다. transpose 가 inverse 와 같은 것은 회전 행렬 같은 특별한
        경우뿐이다.

- topic: inverse
  title: inverse 와 $A\mathbf{x} = \mathbf{b}$
  section: 연립방정식과-inverse
  variants:
    - question: |
        회전 행렬 $R$ 의 inverse 는 어떻게 구하는가?
      choices:
        - '모든 칸의 역수를 취해 각 칸의 곱이 1 이 되게 한다'
        - '모든 칸에 −1 을 곱해 반대 방향으로 돌게 한다'
        - '회전은 한쪽으로만 도는 변환이라 회전 행렬에는 inverse 가 따로 없다'
        - '$R^\top$. 행과 열을 맞바꾸면 반대 각도로 도는 회전이 된다'
      answer: 3
      explanation: |
        $\theta$ 회전을 되돌리는 것은 $-\theta$ 회전이고, $R(-\theta)$ 를 적어 보면 $R(\theta)$ 의 행과 열을 바꾼 모양이라 $R^{-1} = R^\top$ 이다.
        30° 회전에서 $(2, 1) \to (1.232, 1.866)$ 이 된 점에 $R^\top$ 을 곱하면 $(2, 1)$ 로 돌아온다. 칸마다 역수를 취하는 것은 대각선 밖이
        0 인 늘이기 행렬에서만 맞고, 모든 칸에 −1 을 곱하면 180° 를 더 돈다. 회전은 길이를 지키는 변환이라 언제나 되돌릴 수 있다.
    - question: |
        카메라 calibration 에서 책상 위 위치 $X$(m)가 pixel 좌표 $u = sX + c$ 로 찍힌다. 표식 두 개를 재서 $0.1s + c = 150$, $0.3s + c = 250$ 을
        얻었다. $s$ 와 $c$ 는?
      choices:
        - '$s = 500$, $c = 100$. 두 식을 빼면 $0.2s = 100$ 이다'
        - '$s = 1000$, $c = 50$. 두 pixel 의 차이 100 을 0.1 로 나눈다'
        - '$s = 1500$, $c = 0$. 첫째 식만으로 $c = 0$ 으로 둔다'
        - '모르는 값 둘을 확실히 정하려면 식이 셋 이상 있어야 하므로, 두 식으로는 정할 수 없다'
      answer: 0
      explanation: |
        둘째 식에서 첫째 식을 빼면 $c$ 가 없어져 $0.2s = 100$, $s = 500$ 이고, 첫째 식에 넣으면 $c = 150 - 50 = 100$ 이다. 위치의 차이는
        $0.3 - 0.1 = 0.2$ m 라서 0.1 로 나누면 안 된다. 모르는 값이 둘이고 서로 다른 식이 둘이면 답이 하나로 정해진다. 식이 더 많을 때는
        오차가 가장 작은 답을 고르는 문제가 된다.
    - question: |
        $A\mathbf{x} = \mathbf{b}$ 를 코드로 풀 때 $A^{-1}$ 을 먼저 구해 곱하기보다 solve 함수를 쓰라고 하는 이유는 무엇인가?
      choices:
        - 'solve 함수는 $A$ 가 singular 여도 언제나 정확한 답을 내기 때문이다'
        - 'inverse 는 정사각 행렬이 아니면 정의되지 않지만 solve 는 모든 행렬에서 같은 답을 내기 때문이다'
        - 'elimination 으로 바로 푸는 쪽이 inverse 를 구하는 것보다 계산이 적고 오차도 덜 쌓이기 때문이다'
        - 'inverse 를 곱하면 $\mathbf{x}$ 가 세로 vector 가 아니라 행렬 모양으로 나오기 때문이다'
      answer: 2
      explanation: |
        식을 빼서 모르는 값을 하나씩 없애는 elimination 은 곱셈이 약 $n^3/3$ 번으로 inverse 를 구하는 것보다 적고, 거쳐 가는 계산이 적어
        반올림 오차도 덜 쌓인다. `numpy.linalg.solve` 도 singular 행렬에서는 답을 내지 않고 오류를 낸다. 결과의 모양은 두 방법 모두 같다.

- topic: singular
  title: inverse 가 없는 행렬과 singularity
  section: inverse-가-없는-행렬
  variants:
    - question: |
        행렬 $\begin{bmatrix} 1 & 2 \\ 2 & 4 \end{bmatrix}$ 에 inverse 가 없는 이유는 무엇인가?
      choices:
        - '대각선 밖의 두 숫자가 2 로 같은 대칭 행렬이라, 대칭 행렬은 inverse 가 없기 때문이다'
        - '두 열이 같은 방향이라 평면이 직선 하나로 눌려서, 서로 다른 입력이 같은 결과가 되기 때문이다'
        - '0 이 하나도 없는 행렬은 elimination 으로 모르는 값을 없앨 수 없어 inverse 가 없기 때문이다'
        - 'determinant 가 1 보다 커서 넓이가 늘어나므로, 줄여서 되돌릴 방법이 없기 때문이다'
      answer: 1
      explanation: |
        두 열이 같은 직선 위에 있어서 어떤 vector 를 곱해도 결과가 그 직선 위에 놓이고, 예를 들어 $(2, 0)$ 과 $(0, 1)$ 이 모두 $(2, 4)$ 가 된다.
        결과만으로 입력을 알 수 없으니 되돌리는 행렬이 없고, determinant 가 $1 \times 4 - 2 \times 2 = 0$ 인 것도 같은 사실을 보여 준다. 0 이 있는지나
        대칭인지는 기준이 아니고(0 이 하나도 없는 행렬이나 대칭 행렬도 inverse 가 있을 수 있다), determinant 가 1 보다 큰 행렬도 0 만 아니면 inverse 가 있다.
    - question: |
        관절 두 개짜리 팔을 쭉 펴면 관절 속도를 손끝 속도로 바꾸는 행렬의 determinant 가 0 이 된다. 로봇에게 어떤 일이 생기는가?
      choices:
        - '팔이 펴져 손끝까지 거리가 가장 길어지므로, 손끝이 더 빨리 움직일 수 있게 된다'
        - 'determinant 가 0 이면 motor 의 torque 도 0 이 되어 팔이 아래로 떨어진다'
        - '행렬이 identity matrix 가 되어 관절 속도와 손끝 속도가 같아진다'
        - '손끝을 팔이 펴진 방향으로는 움직일 수 없고, 그 근처에서는 아주 큰 관절 속도가 필요해진다'
      answer: 3
      explanation: |
        쭉 편 팔에서는 두 관절 모두 손끝을 팔과 수직인 방향으로만 움직여, 손끝 속도의 팔 방향 component 가 늘 0 이다. 평면이 직선으로 눌린
        것과 같아서 inverse 가 없고, 이런 자세를 singularity 라고 한다. 그 근처에서는 거의 singular 인 행렬의 inverse 를 써야 해서 관절
        속도가 아주 커진다. motor torque 나 속도가 0 이 되는 것은 아니다.
    - question: |
        calibration 표식 두 개를 0.1 m 와 0.101 m 처럼 거의 같은 자리에 두었다. 계산은 되는데 무엇이 문제인가?
      choices:
        - '두 직선이 거의 겹쳐서, pixel 이 1 칸만 틀려도 구한 $s$ 와 $c$ 가 크게 바뀐다'
        - '표식이 가까우면 두 표식을 같은 조건에서 재게 되어 오차가 줄고 오히려 더 정확하다'
        - '두 표식이 겹쳐 보여 사진에서 찾을 수 없다는 것만 문제이고 계산 결과는 안정하다'
        - '두 식이 비슷하면 determinant 가 커져서 inverse 의 숫자가 작아지고 계산이 둔해진다'
      answer: 0
      explanation: |
        행렬 $\begin{bmatrix} 0.1 & 1 \\ 0.101 & 1 \end{bmatrix}$ 의 determinant 는 $-0.001$ 로 0 에 가깝다. 식 두 개가 거의 같은 정보라 두 직선이
        거의 겹치고, 직선이 조금만 움직여도 교점이 멀리 옮겨 간다. 정확히 재면 $s = 500$ 인데 둘째 pixel 이 1 칸 틀리면 $s = 1500$ 이 된다.
        표식을 멀리 떨어뜨려 놓아야 determinant 가 커지고 오차에 둔감해진다.
